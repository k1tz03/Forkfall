name: fusible_app
description: FUSIBLE — application Flutter (identité « album de vignettes »).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  fusible_core:
    path: ../packages/core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content.json
  fonts:
    # Fiche de design §2 : Barlow Condensed (manchettes, tampons, bandes),
    # Manrope (texte de carte, contexte), Fraunces (masthead, lede, réponses).
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-600.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-700.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-800.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-900.ttf
          weight: 900
        - asset: assets/fonts/Fraunces-500Italic.ttf
          weight: 500
          style: italic
