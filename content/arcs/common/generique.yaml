# L'arc de script générique : deux ancres par saison pour tout postulat qui
# n'a pas encore sa propre bible (la rentrée au slot 1, la veille du dernier
# bloc au slot 17). Rejouables chaque saison ("0+").
arcs:
  - id: co.script.generique
    title: "La saison"
    kind: postulat
    roles: [entraineur, joueur]
    fallback: drop
    steps:
      - id: rentree
        card: co.script.rentree
        at: [1, 1]
        season: "0+"
      - id: veille
        card: co.script.veille
        at: [17, 17]
        season: "0+"
