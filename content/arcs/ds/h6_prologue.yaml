# Histoire 6 — « 23 h 58 » (docs/histoires/00_les_dix_histoires.md, la fiche
# du livre) : le prologue de la directrice sportive, août 2003. Six scènes
# avant la carte Objectif, sans drame : le contrat et sa page trois, le bureau
# et son fax, le stagiaire qui tape les rapports des autres (le coupable, posé
# comme un meuble), le latéral gauche de Vogler, la montre de Dembo, et la
# première page de 23 h 58. Les cartes : content/cards/ds/h6_prologue.yaml.
arcs:
  - id: ds.h6.prologue
    title: "Le bureau du recrutement"
    kind: prologue
    roles: [ds]
    postulats: [vendre_trente]
    foreground: false
    theme: direction
    carrier: josiane
    cast: [josiane, arnaud_vaubourg, barbier, ferlac, klopf, dembo]
    issues: []
    hint: "Un contrat ouvert à la page deux, et un fax qui ne dort pas."
    steps:
      - id: page_deux
        card:
          - { id: ds.h6.pro.page_deux_haut_parleur, if: "fil_rouge == 'president'" }
          - { id: ds.h6.pro.page_deux }
      - id: bureau
        card: ds.h6.pro.bureau
      - id: stagiaire
        card:
          - { id: ds.h6.pro.stagiaire_scouts, if: "fil_rouge == 'scouts'" }
          - { id: ds.h6.pro.stagiaire }
      - id: gauche
        card:
          - { id: ds.h6.pro.gauche_feuille, if: "fil_rouge == 'coach'" }
          - { id: ds.h6.pro.gauche }
      - id: montre
        card: ds.h6.pro.montre
      - id: fax
        card: ds.h6.pro.fax
