# F · « Le mentor » — Dan Corven, l'ancien qui a tenu cinquante-neuf jours dans
# un grand club, en 1971, et qui en a fait une carrière. Trois conseils = un tutoriel
# déguisé (la jauge pleine, le président, les promesses) ; l'hôpital n'arrive
# qu'en S2+ et seulement si le joueur a écouté (vars.clow_conseils >= 2).
# Arc de fond (foreground: false), tiré par le réservoir du promu dès la
# saison 1 (postulats.yaml, bucket "1") ; ailleurs, ouverture spontanée dès la
# saison 1. Corven suit l'entraîneur, pas le club (same_club: false).
# Issues : ecoute | ingrat ; la trace clow_ingrat est lue par la routine
# en.clow.top_un (un mentor lâché ne revient pas donner de conseils au bar).
#
# Chemins : cinquante_neuf_jours (variante `_stage` si le mentor t'a eu au stage du
# diplôme) → verre → hopital (S2+, écouté) → testament | verre → silence
# (clow_ingrat) → testament : les deux branches finissent chez Josiane, avec
# l'enveloppe (issue ecoute) ou les mains vides (issue ingrat).
# La carte de routine `en.clow.top_un` (S0, tribune >= 75) n'appartient pas à
# l'arc : elle sort du sac en priorité 1 et compte le premier conseil.
#
# G · « La conférence de presse » — Massenet, chaque saison dès la S1, une seule
# étape ré-armée au début de saison (`every_season`, `start [3,9]`). La carte
# `en.presse.trois_questions` n'est PAS `once` (sinon `deja_vue` en S2).
# La routine `en.presse.meme` (count('no_comment') >= 3, priorité 2) ramasse
# les « je ne commente pas » semés par A3, B5a et G1.
arcs:
  - id: en.mentor_clow
    title: "Le mentor"
    kind: serie
    roles: [entraineur]
    postulats: []
    foreground: false
    weight: 0.8
    once: true
    every_season: false
    min_season: 1
    theme: presse
    carrier: clow
    issues: [ecoute, ingrat]
    traces:
      clow_ingrat: "{annee} : Dan Corven a laissé un message. {prenom} {nom} n'a pas rappelé."
      franc_parler:  "{annee} : le testament de l'ancien tenait en deux mots. {prenom} {nom} a pris le franc-parler."
      nez_a_joueurs: "{annee} : le testament de l'ancien tenait en deux mots. {prenom} {nom} a pris le nez à joueurs."
    hint: "Cinquante-neuf jours dans un grand club, et une carrière de conseils."
    when: "season >= 1"
    cast: [clow, josiane]
    start: [4, 10]
    same_club: false
    fallback: drop
    steps:
      - id: "cinquante_neuf_jours"
        # La première variante lit le chapitre 01 : il t'a eu au stage du
        # diplôme (clow_stage), et il se souvient de ce que tu écrivais.
        card:
          - { id: en.clow.cinquante_neuf_jours_stage, if: "flag('clow_stage')" }
          - { id: en.clow.cinquante_neuf_jours }
        next: [ { step: verre, in: [8, 14] } ]
      - id: verre
        card: en.clow.verre
        # L'hôpital n'arrive que si le joueur a noté au moins deux conseils ;
        # sinon Corven se tait et l'arc se ferme. Pas de garde `season` : le `if`
        # est évalué au swipe de `verre` (S1) ; la fenêtre [12,30] et
        # l'interdiction du drame en S0 suffisent à le repousser en S2+.
        next:
          - { step: hopital, if: "vars.clow_conseils >= 2", in: [12, 30] }
          - { step: silence, in: [2, 4] }
      - id: silence
        # Le séquencier de la fiche (ch. 11 § 2.3.1) enchaîne les deux branches
        # sur le testament : après le silence, c'est Josiane les mains vides.
        card: en.clow.silence
        outcome: ingrat
        next: [ { step: testament, in: [2, 4] } ]
      - id: hopital
        # Drame, une seule sortie, aucun effet : la carte est le coup.
        card: en.clow.hopital
        next: [ { step: testament, in: [2, 4] } ]
      - id: testament
        # L'issue vient de la carte servie (ecoute / ingrat) : l'enveloppe n'est
        # pour toi que si tu as répondu à l'ancien.
        card:
          - { id: en.clow.testament, if: "relation.clow >= 0 && !flag('clow_ingrat')" }
          - { id: en.clow.testament_ingrat }
        next: []

  - id: en.conf_presse
    title: "La conférence de presse"
    kind: serie
    roles: [entraineur]
    postulats: []
    foreground: false
    # 1,0 → 0,5. `forceStory` ouvre l'intrigue la plus lourde parmi les
    # éligibles (`weight`, pas le poids du réservoir), et une intrigue de fond
    # ne compte pas dans `max_active` : la conférence était donc candidate à
    # chaque trou de cadence et devait 21-32 % de ses ouvertures au forçage,
    # pour un plafond de 15 %. Son poids de réservoir, lui, a été relevé.
    weight: 0.5
    # Ré-armé chaque saison par le metteur en scène (every_season) : `once`
    # est sans objet, on le pose à false pour la lisibilité.
    once: false
    every_season: true
    min_season: 1
    theme: presse
    carrier: meneche
    issues: [no_comment, franc]
    traces:
      presse_franc: "{annee} : « Franchement », a dit {nom} à Massenet. Le mot est sorti en titre, avec un point d'interrogation."
    hint: "Trois questions par saison, un journaliste gentil. Hors micro, bien sûr."
    when: "season >= 1"
    # Léa (L'Écho) rappelle le lendemain pour faire confirmer le mot.
    cast: [meneche, lea]
    # [3,15] → [3,11] : la série compte maintenant trois étapes (§ 1.1) et
    # doit se fermer dans la saison — ouverture au plus tard au slot 11, puis
    # [1,3] et [1,3], soit le slot 17 au pire. L'échéance reste dans la
    # seconde moitié, où les slots 13, 15 et 16 sont libres.
    start: [3, 11]
    same_club: false
    fallback: drop
    steps:
      - id: trois_questions
        # Escalier du rituel : `every_season` rejoue la série toute la carrière,
        # et la première étape n'avait aucune variante — la même question mot
        # pour mot chaque année (mesuré : 10 traces de 3 saisons sur 40).
        card:
          - { id: en.presse.trois_questions_encore, if: "plays('en.conf_presse') >= 1" }
          - { id: en.presse.trois_questions }
        next: [ { step: bureau, in: [1, 3] } ]
      - id: bureau
        # Le président a lu le journal : la variante lit ce que tu as répondu
        # la veille (`presse_franc` posé par la sortie droite de l'étape 1),
        # et, la deuxième année, le fait qu'il l'a déjà lu une fois.
        card:
          - { id: en.presse.president_a_lu_encore, if: "flag('presse_franc') && plays('en.conf_presse') >= 1" }
          - { id: en.presse.president_a_lu, if: "flag('presse_franc')" }
          - { id: en.presse.president_silence_encore, if: "plays('en.conf_presse') >= 1" }
          - { id: en.presse.president_silence }
        next: [ { step: hors_micro, in: [1, 3] } ]
      - id: hors_micro
        # Escalier du rituel : la deuxième année, Massenet a le chiffre de la
        # première.
        card:
          - { id: en.presse.hors_micro_encore, if: "plays('en.conf_presse') >= 1" }
          - { id: en.presse.hors_micro }
        next: []
