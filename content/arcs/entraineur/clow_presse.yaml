# F · « Le mentor » — Brian Clow, l'ancien qui a tenu quarante-quatre jours dans
# un grand club et qui en a fait une carrière. Trois conseils = un tutoriel
# déguisé (la jauge pleine, le président, les promesses) ; l'hôpital n'arrive
# qu'en S2+ et seulement si le joueur a écouté (vars.clow_conseils >= 2).
# Arc de fond (foreground: false), semé en S1 `at [4,10]` par le postulat
# « Le promu sans un sou » (postulats.yaml) ; ailleurs, ouverture spontanée
# dès la saison 1. Clow suit l'entraîneur, pas le club (same_club: false).
#
# Chemins : 44_jours → verre → hopital (S2+, écouté) → testament (variante lue
# sur relation.clow : enveloppe / rien) | verre → silence (fin, clow_ingrat).
# La carte de routine `en.clow.top_un` (S0, tribune >= 75) n'appartient pas à
# l'arc : elle sort du sac en priorité 1 et compte le premier conseil.
#
# G · « La conférence de presse » — Ménèche, chaque saison dès la S1, une seule
# étape ré-armée au début de saison (`every_season`, `start [3,9]`). La carte
# `en.presse.trois_questions` n'est PAS `once` (sinon `deja_vue` en S2).
# La routine `en.presse.meme` (count('no_comment') >= 3, priorité 2) ramasse
# les « je ne commente pas » semés par A3, B5a et G1.
arcs:
  - id: en.mentor_clow
    title: "Le mentor"
    kind: serie
    roles: [entraineur]
    postulats: []
    foreground: false
    weight: 0.8
    once: true
    every_season: false
    min_season: 1
    when: "season >= 1"
    cast: [clow, josiane]
    start: [4, 10]
    same_club: false
    fallback: drop
    steps:
      - id: "44_jours"
        card: en.clow.44_jours
        next: [ { step: verre, in: [8, 14] } ]
      - id: verre
        card: en.clow.verre
        # L'hôpital n'arrive que si le joueur a noté au moins deux conseils ;
        # sinon Clow se tait et l'arc se ferme. Pas de garde `season` : le `if`
        # est évalué au swipe de `verre` (S1) ; la fenêtre [12,30] et
        # l'interdiction du drame en S0 suffisent à le repousser en S2+.
        next:
          - { step: hopital, if: "vars.clow_conseils >= 2", in: [12, 30] }
          - { step: silence, in: [2, 4] }
      - id: silence
        card: en.clow.silence
        next: []
      - id: hopital
        # Drame, une seule sortie, aucun effet : la carte est le coup.
        card: en.clow.hopital
        next: [ { step: testament, in: [2, 4] } ]
      - id: testament
        card:
          - { id: en.clow.testament, if: "relation.clow >= 0" }
          - { id: en.clow.testament_ingrat }
        next: []

  - id: en.conf_presse
    title: "La conférence de presse"
    kind: serie
    roles: [entraineur]
    postulats: []
    foreground: false
    weight: 1.0
    # Ré-armé chaque saison par le metteur en scène (every_season) : `once`
    # est sans objet, on le pose à false pour la lisibilité.
    once: false
    every_season: true
    min_season: 1
    when: "season >= 1"
    cast: [meneche]
    # [3,15] : éligible tôt (en S2+ c'est souvent le seul temps d'histoire de
    # la première moitié), mais l'échéance attend la seconde moitié, où les
    # slots 13, 15 et 16 sont libres : en S1, la première moitié est déjà
    # pleine (A7, les échéances des arcs de S0, l'alarme direction du Bilan).
    start: [3, 15]
    same_club: false
    fallback: drop
    steps:
      - id: trois_questions
        card: en.presse.trois_questions
        next: []
