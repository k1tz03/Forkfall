# « Gigi au staff » — Vecchio, entraîneur des gardiens, te dit ce que le
# vestiaire pense, à sa façon : en trois mots, dont deux qu'il a déjà dits
# (bible ch. 11 § 2.4, tardive 3). Rituel de seconde vague : une carte par
# saison où il est au staff, et la variante « encore » monte en escalier sur
# plays() — la première fois il te teste, la deuxième il te fait confiance, la
# troisième il te demande une chose pour lui.
#
# Chemins : douche (trois variantes, première vraie) → suite (Vukić, vexé de
# ne pas avoir parlé le premier). Issues : parle | banc.
arcs:
  - id: en.gigi_staff
    title: "Gigi au staff"
    kind: serie
    roles: [entraineur]
    postulats: []
    foreground: true
    weight: 0.9
    once: true
    min_season: 1                   # 2 → 1 : Gigi range ses gants en S0, il parle dès la S1 (couverture § 5.1)
    theme: vestiaire
    carrier: vecchio
    cast: [vecchio, vukic, brehaut]
    replay: ritual
    # Seconde porte (§ 5.1, plancher de couverture 10 % ; mesuré 4-8 %). Monter
    # le poids ne pouvait plus rien : le plafond n'est pas le tirage, c'est le
    # prérequis. `flag('gigi_staff')` demande que `en.vieux_gardien` s'ouvre
    # (52 %) ET tombe sur l'issue `staff` (30 %) ET assez tôt pour qu'il reste
    # une saison — soit 4 % de carrières. La seconde porte est l'issue `finale`
    # du même arc : `vecchio_promis` (issue `finale`, « une dernière saison dans
    # les buts ») et `gardien_jeune` (issue `jeune`, « le jeune prend les gants
    # de Gigi Vecchio »). Dans les deux cas il n'a plus les gants du dimanche et
    # il est encore là ; la première étape a une variante qui le dit et le fait
    # passer au staff (en.gigi.douche_derniere).
    when: "(flag('gigi_staff') && chars.vecchio.statut == 'staff') || ((flag('vecchio_promis') || flag('gardien_jeune')) && season >= 1 && chars.vecchio.statut == 'present')"
    issues: [parle, banc]
    traces:
      gigi_a_parle:      "{annee} : Gigi Vecchio, entraîneur des gardiens, a dit trois mots à {nom} sous la douche. Ça a suffi."
      banc_gigi_promis:  "{annee} : {nom} a promis à Gigi un banc à son nom derrière le but. À la craie, pour l'instant."
    hint: "Sous la douche, ils parlent. Lui, il essuie les gants et il entend."
    start: [2, 12]
    same_club: true
    fallback: nouvelles
    epilogue:
      relation: { vecchio: -1 }
      journal: "{annee} : Gigi Vecchio a dit sous la douche ce qu'il avait à dire. Le banc derrière le but attend son nom."
    steps:
      - id: douche
        card:
          # `plays >= 2` rendait la carte — et l'issue `banc` — inatteignables :
          # l'arc s'ouvre dans 11 % des carrières, deux reprises n'arrivent pas.
          # Le partage entre les deux relances se fait sur `gigi_a_parle` : il
          # ne réclame son banc qu'à quelqu'un à qui il a déjà parlé.
          # `plays >= 1 && gigi_a_parle` demandait une relance d'une intrigue
          # ouverte dans une carrière sur dix : l'issue `banc` tombait à 0-6 %
          # des ouvertures (plancher 10 %). Il réclame aussi son banc du premier
          # coup à quelqu'un à qui il doit déjà quelque chose.
          # Seconde porte : Gigi a eu sa dernière saison dans les buts et
          # n'est pas encore au staff — c'est cette carte qui l'y met.
          - { id: en.gigi.douche_derniere, if: "!flag('gigi_staff')" }
          - { id: en.gigi.douche_banc, if: "(plays('en.gigi_staff') >= 1 && flag('gigi_a_parle')) || relation.vecchio >= 3" }
          - { id: en.gigi.douche_discours, if: "plays('en.gigi_staff') >= 1" }
          - { id: en.gigi.douche }
        next: [ { step: suite, if: "flag('gigi_a_parle')", in: [1, 3] } ]
      - id: suite
        card: en.gigi.suite
        # Le banc n'arrive que si la promesse a été faite ET que la carrière a
        # duré : c'est la seule porte de la fin ∃ `en_retraite` (cause : l'âge).
        # `age >= 55` fermait l'issue `banc` : le rôle démarre entre 38 et 55 ans
        # et l'intrigue est déjà `min_season: 2` (issue à 0-6 % des ouvertures,
        # plancher 10 %). 46 ans : la promesse tenue reste une affaire de fin de
        # carrière sans exiger le haut de la fourchette de départ.
        next: [ { step: banc, if: "flag('banc_gigi_promis') && age >= 46", in: [6, 14] } ]
      - id: banc
        card: en.gigi.banc_inaugure
        next: []
