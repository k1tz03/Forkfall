# HISTOIRE 2 — LE SAPIN EN CARTON (docs/histoires/00_les_dix_histoires.md)
# Le prologue et le script du postulat `interimaire` (index 1).
#
# Roland Mercadier a été « remercié » après huit journées. Personne ne l'a vu
# partir : sa berline grise reste sur la place peinte ENTRAÎNEUR, un sapin en
# carton au rétroviseur, et chaque lundi le répondeur du bureau a un message de
# lui. Le livre ne cherche pas un corps : il cherche pourquoi tout le monde a
# besoin qu'il n'y en ait pas, ou qu'il y en ait un.
#
# L'épine de l'histoire est ici, à créneaux fixes (bande 5, servie quoi qu'il
# arrive) : le metteur en scène n'arme ses événements qu'entre les créneaux 4 et
# 14, loin des échéances et des Nouvelles, ce qui ne garantit ni la nuit de
# décembre ni la nuit de la Rive. Les grandes nuits sont donc des ancres, avec
# leur `lieu:` et le tag `sombre` : la ville les fait tomber le soir, à leur
# place. Les fils qui vont de l'une à l'autre sont les intrigues de
# content/arcs/entraineur/h2_intrigues.yaml, ouvertes par ces ancres
# (`schedule:` d'une carte d'étape = l'intrigue s'ouvre à cette étape).
#
#   S0 (1990-1991) — L'absent. Les cartons (1) ouvrent le répondeur et la
#      berline : la diode et le premier message (2-3) → samedi (6-7) ; dix
#      heures (5-6) → la berline qui a bougé de trois mètres (7-8, sombre) → le
#      sapin neuf ; le verdict et l'appartement du quai (10) ; « Ne me cherche
#      pas » (11) ; la place vide (12, sombre) → l'arrière-salle (14-15) ; le
#      rêve du répondeur (15, intermède) ; la porte et la police homme-clé (17).
#   S1 (1991-1992) — Le wagon. L'assureur (1) ; « parti en train » (2) → la
#      cabine (4) → le cabas → le wagon → la roue de secours → le garage ; le
#      car neuf ; la panne, seul avec Norbert (11, sombre) ; le car de nuit
#      (14, intermède) ; la Rive (16, sombre) ; les deux sacs (17, la saisie).
#   S2 (1992-1993) — Un an et un jour. La convocation (1) → la toux, Monique,
#      le chemin, le dernier message ; le banc dans la brume (10, intermède) ;
#      le wagon brûle (13, sombre) → la poursuite ou la banquette (14) → le
#      lendemain (15) ; l'audience (16) ; la feuille de match (17) : les fins.
#   S3 — l'épilogue, si la carrière continue : la rentrée et la veille, une
#      fois (ensuite, le réservoir seul).
#
# Aucune carte n'est en `tone: drame` : le moteur n'en sert qu'une par carrière,
# et l'épine ne doit jamais attendre son tour.
arcs:
  - id: en.h2.prologue
    title: "Jusqu'à nouvel ordre"
    kind: prologue
    roles: [entraineur]
    postulats: [interimaire]
    foreground: false
    theme: direction
    carrier: josiane
    cast: [josiane, vukic, brehaut, meneche, vecchio]
    issues: []
    hint: "Une berline grise sur une place peinte au nom d'un autre, et un sapin en carton au rétroviseur."
    steps:
      - id: place
        card: en.h2.pro.place
      - id: sifflet
        card: en.h2.pro.sifflet
      - id: compo
        card: en.h2.pro.compo
      - id: phrase
        card: en.h2.pro.phrase
      - id: communique
        card: en.h2.pro.communique
      - id: escalier
        card: en.h2.pro.escalier

  - id: en.h2.script
    title: "Le Sapin en carton"
    kind: postulat
    roles: [entraineur]
    postulats: [interimaire]
    foreground: true
    weight: 1.0
    theme: direction
    carrier: josiane
    cast: [josiane, aulard, vukic, norbert, achard, monique]
    same_club: true
    fallback: drop
    traces:
      h2_cartons_jetes:  "{annee} : {nom} a fait descendre les cartons de Mercadier dès le premier jour. La cafetière est restée."
      h2_quai:           "{annee} : {nom} a pris l'appartement du quai, celui où Mercadier dormait. Le rasoir était sur le lavabo."
      cdi_signe:         "{annee} : {prenom} {nom} a signé jusqu'en juin. Le titre d'entraîneur restait à un absent."
      h2_cassette:       "{annee} : {nom} a gardé la cassette du répondeur. Une voix de janvier, dans une poche intérieure."
      h2_place_vide:     "{annee} : la berline de Mercadier a disparu du parking du stade, une nuit de décembre."
      h2_place_repeinte: "{annee} : la place ENTRAÎNEUR a été repeinte au rouleau. Personne n'a su quoi écrire dessus."
      montee_promise:    "{annee} : {nom} a promis la montée. Au Terminus, la phrase a fait le tour de la table du fond."
      h2_dit_pas_parti:  "{annee} : {nom} a dit à l'assureur que Mercadier n'était pas parti. L'assureur l'a souligné."
      h2_rive:           "{annee} : une berline grise est entrée dans la Rive, une nuit, sur le quai. Il n'en est resté qu'un sapin."
      h2_rive_vu:        "{annee} : {nom} a vu un homme regarder la Rive, cette nuit-là, à la flamme d'un briquet."
      h2_mort_pour_moi:  "{annee} : {nom} a dit au président que Mercadier était mort, pour lui. Le tribunal était en avril."
      h2_vivant:         "{annee} : {nom} a dit au président que Mercadier était vivant. Le président n'a pas demandé comment."
      h2_mort_papier:    "{annee} : Roland Mercadier a été déclaré mort par le tribunal de Portclair, un mardi d'avril."
      h2_norbert_pris:   "{annee} : Norbert, le chauffeur du car, a été plaqué contre le grillage de la friche, la nuit où le wagon a brûlé."
      h2_hopital:        "{annee} : Roland Mercadier est entré à l'hôpital d'Aubérive sous son nom, la nuit où son wagon a brûlé."
      h2_doc:            "{annee} : le Doc a soigné quelqu'un toute une semaine sur sa table de massage, la porte fermée à clé."
    steps:
      # ============================================================ saison 1 (S0)
      - id: a1_cartons
        card:
          - { id: en.h2.s0.cartons_vestiaire, if: "fil_rouge == 'vestiaire'" }
          - { id: en.h2.s0.cartons_diplome,   if: "fil_rouge == 'diplome'" }
          - { id: en.h2.s0.cartons_grand_nom, if: "fil_rouge == 'grand_nom'" }
          - { id: en.h2.s0.cartons }
        at: [1, 1]
        season: 0
      # L'ancre d'hiver, en trois temps : le verdict et l'appartement du quai,
      # la voix qui dit « Garde le banc », puis la place vide.
      - id: a2_verdict
        card:
          - { id: en.h2.s0.verdict_regle,    if: "gauges.direction < 30" }
          - { id: en.h2.s0.verdict_confirme, if: "world.serie_victoires >= 1 || world.rang <= 8" }
          - { id: en.h2.s0.verdict }
        at: [10, 10]
        season: 0
      - id: a3_message
        card:
          - { id: en.h2.s0.message_efface, if: "flag('h2_premier_efface')" }
          - { id: en.h2.s0.message }
        at: [11, 11]
        season: 0
      - id: a4_place_vide
        card:
          - { id: en.h2.s0.place_vide_guet, if: "flag('h2_gare_loin')" }
          - { id: en.h2.s0.place_vide }
        at: [12, 12]
        season: 0
      - id: a5_intermede
        card: en.h2.s0.intermede
        at: [15, 15]
        season: 0
      - id: a6_porte
        card:
          - { id: en.h2.s0.porte_diplome, if: "!flag('diplome') && !flag('derogation') && !flag('diplome_arrange')" }
          - { id: en.h2.s0.porte }
        at: [17, 17]
        season: 0
      # ============================================================ saison 2 (S1)
      - id: b1_assureur
        card:
          - { id: en.h2.s1.assureur_plainte, if: "flag('h2_plainte')" }
          - { id: en.h2.s1.assureur }
        at: [1, 1]
        season: 1
      # La panne à l'ancre d'hiver, la Rive cinq créneaux plus loin (jamais
      # deux nuits à moins de cinq cartes) ; avant la panne, la semaine du
      # wagon (de la cabine au garage du Pont) ; avant la Rive, le car de nuit,
      # qui l'annonce en rêve.
      - id: b2_panne
        card:
          - { id: en.h2.s1.panne_averti, if: "flag('h2_vukic_sait') || flag('h2_wagon_vu')" }
          - { id: en.h2.s1.panne_questions, if: "flag('h2_questions_norbert')" }
          - { id: en.h2.s1.panne }
        at: [11, 11]
        season: 1
      - id: b3_intermede
        card: en.h2.s1.intermede
        at: [14, 14]
        season: 1
      - id: b4_rive
        card: en.h2.s1.rive
        at: [16, 16]
        season: 1
      - id: b5_saisie
        card:
          - { id: en.h2.s1.saisie_rive, if: "flag('h2_rive_couru')" }
          - { id: en.h2.s1.saisie }
        at: [17, 17]
        season: 1
      # ============================================================ saison 3 (S2)
      - id: c1_un_an
        card:
          - { id: en.h2.s2.un_an_pas_parti, if: "flag('h2_dit_pas_parti')" }
          - { id: en.h2.s2.un_an }
        at: [1, 1]
        season: 2
      - id: c2_intermede
        card:
          - { id: en.h2.s2.intermede_sifflet, if: "flag('h2_sifflet_pris')" }
          - { id: en.h2.s2.intermede }
        at: [10, 10]
        season: 2
      # La nuit du wagon, en trois ancres de suite (13, 14, 15) : rien ne
      # s'intercale entre le feu, la poursuite ou la banquette, et le lendemain.
      # Le feu pose h2_course si tu cours vers la veste (sinon, tu emmènes
      # Roland) ; la nuit choisit sa variante au moment d'être servie :
      # l'argent sale (la garde à vue), Vukić derrière toi, Josiane, ou personne ;
      # sinon la banquette, et le Doc s'il connaît déjà le chemin.
      - id: c3_wagon_brule
        card:
          - { id: en.h2.s2.wagon_brule_inconnu, if: "!flag('h2_wagon_vu')" }
          - { id: en.h2.s2.wagon_brule_obei,    if: "flag('h2_ordre_obei')" }
          - { id: en.h2.s2.wagon_brule }
        at: [13, 13]
        season: 2
      - id: c4_nuit
        card:
          - { id: en.h2.fin.pompiers,          if: "flag('h2_course') && (flag('h2_enveloppe_cars') || flag('vl_dette_dembo'))" }
          - { id: en.h2.fin.poursuite_vukic,   if: "flag('h2_course') && relation.vukic >= 1" }
          - { id: en.h2.fin.poursuite_josiane, if: "flag('h2_course') && relation.josiane >= 2" }
          - { id: en.h2.fin.poursuite_seul,    if: "flag('h2_course')" }
          - { id: en.h2.fin.banquette_doc,     if: "flag('h2_doc_wagon')" }
          - { id: en.h2.fin.banquette }
        at: [14, 14]
        season: 2
      - id: c5_lendemain
        card:
          - { id: en.h2.fin.lendemain_pris_carnet, if: "flag('h2_norbert_pris') && flag('h2_carnet')" }
          - { id: en.h2.fin.lendemain_pris,        if: "flag('h2_norbert_pris')" }
          - { id: en.h2.fin.lendemain_hopital,     if: "flag('h2_hopital')" }
          - { id: en.h2.fin.lendemain }
        at: [15, 15]
        season: 2
      - id: c6_audience
        card:
          - { id: en.h2.s2.audience_hopital_carnet, if: "flag('h2_hopital') && flag('h2_carnet')" }
          - { id: en.h2.s2.audience_hopital,        if: "flag('h2_hopital')" }
          - { id: en.h2.s2.audience_preuves,        if: "flag('h2_cassette') && flag('h2_carnet')" }
          - { id: en.h2.s2.audience_cassette,       if: "flag('h2_cassette')" }
          - { id: en.h2.s2.audience_carnet,         if: "flag('h2_carnet') && !flag('h2_carnet_police')" }
          - { id: en.h2.s2.audience_monique,        if: "flag('h2_monique_aveu')" }
          - { id: en.h2.s2.audience }
        at: [16, 16]
        season: 2
      # Les fins de l'histoire tombent ici (ou plus tôt, la nuit du wagon et à
      # l'audience). « Le sien » : les deux bancs si le carnet est retrouvé et
      # que Vukić et Josiane tiennent à toi, sinon le message de 23 h 47 ;
      # « Le mien » : la place de l'autre s'il est mort sur le papier, sinon la
      # carrière continue, et la saison suivante est un épilogue.
      - id: c7_feuille
        card:
          - { id: en.h2.s2.feuille_deux_bancs_mort, if: "flag('h2_carnet') && relation.vukic >= 2 && relation.josiane >= 2 && flag('h2_mort_papier')" }
          - { id: en.h2.s2.feuille_deux_bancs,      if: "flag('h2_carnet') && relation.vukic >= 2 && relation.josiane >= 2" }
          - { id: en.h2.s2.feuille_mort,            if: "flag('h2_mort_papier')" }
          - { id: en.h2.s2.feuille }
        at: [17, 17]
        season: 2
      # ============================================ la quatrième saison (S3) : l'épilogue
      - id: d1_rentree
        card:
          - { id: en.h2.s3.rentree_vivant, if: "flag('h2_parti_mi_temps')" }
          - { id: en.h2.s3.rentree }
        at: [1, 1]
        season: 3
      - id: d2_veille
        card:
          - { id: en.h2.s3.veille_dauphin, if: "flag('h2_parti_mi_temps') && relation.vukic >= 2" }
          - { id: en.h2.s3.veille }
        at: [17, 17]
        season: 3
