# D · « Le kop qui t'aime trop » — le créancier. La tribune est à 80, la ville
# est en fête, et Gégé (capo Tribune Nord) vient réclamer sa part : un verre au
# local, la compo du virage, un pacte gravé à la craie ou deux banderoles.
# Semé au slot [3,4] de la saison 1 du postulat « Le promu sans un sou »
# (postulats.yaml) ; ailleurs, ouverture spontanée en début de carrière.
#
# Chemins : local → onze (variante froide si le verre au local a été refusé :
# relation.gege < 0) → pacte (rel gege >= 1) → pacte_suite → anniversaire |
# banderoles → anniversaire (variante lue sur relation.gege au tirage :
# sourire / bâche / neutre). Refuser le pacte bascule vers banderoles.
# Les fenêtres onze → pacte/banderoles [9,14] font tomber la 3e étape en
# saison 2 : la S0 du promu est déjà pleine (script + 3 semis + Nouvelles).
arcs:
  - id: en.kop_qui_aime_trop
    title: "Le kop qui t'aime trop"
    kind: serie
    roles: [entraineur]
    postulats: []
    foreground: true
    weight: 1.3
    once: true
    every_season: false
    min_season: 0
    when: "season <= 2"
    cast: [gege]
    start: [1, 4]
    same_club: true
    fallback: nouvelles
    epilogue: { tribunes: "--" }
    steps:
      - id: local
        card: en.kop.local
        next: [ { step: onze, in: [3, 6] } ]
      - id: onze
        # Variantes : la première dont `if` est vrai au tirage.
        card:
          - { id: en.kop.onze, if: "relation.gege >= 0" }
          - { id: en.kop.onze_froid }
        next:
          - { step: pacte, if: "relation.gege >= 1", in: [9, 14] }
          - { step: banderoles, in: [9, 14] }
      - id: pacte
        # La sortie droite de la carte (« Pas de promesse en l'air ») pose son
        # propre `next` vers banderoles ; le défaut ci-dessous sert la poignée
        # de main.
        card: en.kop.pacte
        next: [ { step: pacte_suite, in: [5, 9] } ]
      - id: pacte_suite
        card: en.kop.pacte_suite
        next: [ { step: anniversaire, in: [6, 14] } ]
      - id: banderoles
        card: en.kop.banderoles
        next: [ { step: anniversaire, in: [6, 14] } ]
      - id: anniversaire
        # La variante lit relation.gege au tirage (après « Signez », A6…).
        card:
          - { id: en.kop.anniversaire_sourire, if: "relation.gege >= 2" }
          - { id: en.kop.anniversaire_bache, if: "relation.gege <= -1" }
          - { id: en.kop.anniversaire_neutre }
        next: []
