# D · « Le kop qui t'aime trop » — le créancier. La tribune est à 80, la ville
# est en fête, et Gégé (capo Tribune Nord) vient réclamer sa part : un verre au
# local, la compo du virage, un pacte gravé à la craie ou deux banderoles.
# Intrigue `signature` du réservoir du promu (postulats.yaml, bucket "0") ;
# rejouable deux saisons après sa clôture (replay, bucket "2+") avec la
# variante « encore » de l'étape 1, lue sur plays() et sur la trace onze_du_virage.
#
# Chemins : local → onze (variante froide si le verre au local a été refusé :
# relation.gege < 0) → pacte (rel gege >= 1) → pacte_suite → anniversaire |
# banderoles → anniversaire (variante lue sur relation.gege au tirage :
# sourire / bâche / neutre). Refuser le pacte bascule vers banderoles.
# Les fenêtres onze → pacte/banderoles [9,14] font tomber la 3e étape en
# saison 2 : la S0 du promu est déjà pleine (script + 3 semis + Nouvelles).
arcs:
  - id: en.kop_qui_aime_trop
    title: "Le kop qui t'aime trop"
    kind: serie
    roles: [entraineur]
    postulats: []
    foreground: true
    weight: 1.3
    once: true
    every_season: false
    min_season: 0
    theme: tribune
    carrier: gege
    replay: { after: 2, max: 2 }
    issues: [pacte, banderoles, bache]
    # Clause du § 5.1 : `pacte` est bornée par un état — il faut que le capo
    # ne t'en veuille pas (`relation.gege >= 0`) au tirage de l'étape 2, puis
    # signer la craie. Elle reste sous 10 %, et c'est ce qu'elle raconte.
    issues_rares: [pacte]
    traces:
      onze_du_virage: "{annee} : à {club}, la compo se vote en tribune Nord. {prenom} {nom} a signé."
      pacte_gege:     "{annee} : {prenom} {nom} a promis le local rénové au virage. Gégé a gravé la date à la craie."
      ami_ultras:     "{annee} : trois bières au local du virage. {prenom} {nom}, adopté{pg, select, f{e} other{}} par la tribune Nord."
    hint: "La tribune est à quatre-vingts et vient réclamer sa part."
    # Cast de la fiche (ch. 11 § 2.3.1) : Gégé porte, Bréhaut commente le onze
    # (en.re.brehaut_onze), Camille commente le verre (en.re.camille_le_verre).
    cast: [gege, brehaut, camille]
    start: [1, 4]
    same_club: true
    fallback: nouvelles
    epilogue: { tribunes: "--" }
    steps:
      - id: local
        # « Encore » : la relance lit plays() et, si le virage a déjà voté, la trace.
        # La première variante lit une autre intrigue : l'espion de la haie a
        # laissé sa plaque au-dessus du bar du local (en.espion_haie).
        card:
          # Les deux variantes « encore » passent devant le croisement de
          # l'espion : sur une relance, c'est la relance que le capo commente,
          # et `local_jumelles` reste servie à la première ouverture. Dans
          # l'autre ordre, un `espion_cafe` posé en S0 les recouvrait toutes
          # les deux et `local_encore_onze` n'était jamais servie.
          - { id: en.kop.local_encore_onze, if: "plays('en.kop_qui_aime_trop') >= 1 && flag('onze_du_virage')" }
          - { id: en.kop.local_encore, if: "plays('en.kop_qui_aime_trop') >= 1" }
          - { id: en.kop.local_jumelles, if: "flag('espion_cafe')" }
          - { id: en.kop.local }
        next: [ { step: onze, in: [3, 6] } ]
      - id: onze
        # Variantes : la première dont `if` est vrai au tirage.
        card:
          - { id: en.kop.onze, if: "relation.gege >= 0" }
          - { id: en.kop.onze_froid }
        next:
          # `>= 1` demandait d'avoir déjà gagné deux crans avec Gégé : l'étape du
          # pacte n'était atteinte que dans 4 % des arcs (budget d'issue ≥ 10 %).
          # Le capo propose la craie tant qu'il ne t'en veut pas.
          - { step: pacte, if: "relation.gege >= 0", in: [9, 14] }
          - { step: banderoles, in: [9, 14] }
      - id: pacte
        # La sortie droite de la carte (« Pas de promesse en l'air ») pose son
        # propre `next` vers banderoles ; le défaut ci-dessous sert la poignée
        # de main.
        card: en.kop.pacte
        next: [ { step: pacte_suite, in: [5, 9] } ]
      - id: pacte_suite
        card: en.kop.pacte_suite
        outcome: pacte
        # Mesuré : l'issue `pacte` reste à 2 % des ouvertures parce que la
        # sortie droite de `en.kop.pacte` (« Pas de promesse en l'air ») bascule
        # vers les banderoles avant `pacte_suite` — ce n'est pas l'anniversaire
        # qui la recouvre. Fermer l'anniversaire après le pacte ne changeait
        # rien à l'issue et coûtait deux variantes ; le `next` reste ouvert.
        # [6,14] → [4,10] : 46 % des ouvertures restaient ouvertes à la fin de
        # la carrière, et l'anniversaire — dernier temps de l'intrigue — n'était
        # jamais atteint derrière le pacte. Quatre à dix créneaux suffisent : la
        # date est gravée, l'anniversaire tombe la saison suivante au plus tard.
        next: [ { step: anniversaire, in: [4, 10] } ]
      - id: banderoles
        card: en.kop.banderoles
        outcome: banderoles
        next: [ { step: anniversaire, in: [4, 10] } ]
      - id: anniversaire
        # La variante lit relation.gege au tirage (après « Signez », A6…).
        # La branche du pacte se partage d'abord, et de façon exhaustive : la
        # date est gravée à la craie, l'anniversaire dit si elle a été tenue.
        # Le capo tranche : à +2 il a fait refaire le local avec ses gens
        # (inauguration) ; sinon la bâche est passée par-dessus la craie. Les gardes précédentes
        # (`gauges.tribunes >= 65` d'un côté, `relation.gege <= -1` de l'autre)
        # laissaient les deux cartes inatteignables : signer le pacte donne
        # +1 à Gégé, et l'épilogue de l'intrigue fait retomber la tribune.
        card:
          - { id: en.kop.anniversaire_inauguration, if: "flag('pacte_gege') && relation.gege >= 2" }
          - { id: en.kop.anniversaire_pacte_trahi, if: "flag('pacte_gege')" }
          - { id: en.kop.anniversaire_sourire, if: "relation.gege >= 2" }
          - { id: en.kop.anniversaire_bache, if: "relation.gege <= -1" }
          - { id: en.kop.anniversaire_neutre }
        next: []
