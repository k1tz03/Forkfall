# C · « Le sponsor qui devient propriétaire » — le tentateur. Cheikh Ilyas
# (fonds Almadis) entre par le maillot, monte par le nom du stade, s'installe
# par le prêt et finit propriétaire ; à chaque palier, la caisse se remplit et
# le club se vide. Semé au slot [9,11] de la saison 1 du postulat « Le promu
# sans un sou » si la caisse est sous 40 (postulats.yaml) ; ailleurs, ouverture
# spontanée dès que la caisse passe sous 45. Un refus total (palier 0 après
# le maillot et le naming) pose `club_a_lancienne` : l'arc ne rouvre plus.
#
# Chemins : maillot → naming (express si la Commission a choisi le sponsor et
# que l'arc n'a pas commencé — cible du saut d'arc depuis A4) → pret (palier ≥ 1)
# | retrait (palier 0) → rachat (palier 3) | fin → notification.
#
# Variables : nassir_palier (=1 maillot, =2 naming, =3 prêt), nassir_refus (+1
# par refus). Les `next` conditionnels lisent ces variables après le swipe.
arcs:
  - id: en.nassir_proprietaire
    title: "Le sponsor qui devient propriétaire"
    kind: serie
    roles: [entraineur]
    postulats: []
    foreground: true
    weight: 1.2
    once: true
    every_season: false
    min_season: 0
    theme: argent
    carrier: nassir
    replay: { after: 2, max: 2 }
    # Ch. 11 § 2.3.1 (spec § 4.1) : l'argent du fonds et la paie qui ne tombe
    # pas racontent la même saison ; jamais les deux dans le même réservoir.
    exclusive_with: [en.salaires_retard]
    issues: [ancienne, naming, rachat]
    traces:
      naming_signe:     "{annee} : le stade de {club} s'appelle Arena Almadis. Le nom en orange, le nôtre en dessous, en petit."
      club_a_lancienne: "{annee} : {prenom} {nom} a renvoyé le fonds et sa canette. Un club à l'ancienne."
      nassir_sponsor:   "{annee} : le maillot de {club} est orange fluo. {nom} a dit oui à la canette."
      nassir_pret:      "{annee} : un prêt sans intérêt, une option sur Mbako, cinquante et un pour cent. {nom} a signé la page trois."
      club_actif:       "{annee} : le fonds a racheté le club par fax. Le logo est orange ; « {nom} » en petit, sous « ambassadeur »."
      nassir_retire:    "{annee} : les panneaux orange sont descendus dans la nuit. Le fonds a retiré ses panneaux, pas son numéro."
    hint: "Un sponsor entre par le maillot. Il ne ressort pas."
    when: "gauges.caisse < 45 && !flag('club_a_lancienne') && !flag('club_actif')"
    # Cast de la fiche (ch. 11 § 2.3.1) : la mère de Mbako commente l'orange
    # (co.re.mere_orange) et lit l'option du prêt.
    cast: [nassir, josiane, gege, aulard, mere_mbako]
    start: [3, 6]
    same_club: true
    fallback: nouvelles
    epilogue: { caisse: "-" }
    steps:
      - id: maillot
        # « Encore » : la relance (deux saisons après un prêt refusé) lit plays().
        # La première variante lit une autre intrigue : le fonds a retiré ses
        # panneaux (nassir_retire, ch. 02) et revient sans eux.
        card:
          - { id: en.nassir.maillot_sans_panneaux, if: "flag('nassir_retire') && plays('en.nassir_proprietaire') >= 1" }
          - { id: en.nassir.maillot_encore, if: "plays('en.nassir_proprietaire') >= 1" }
          - { id: en.nassir.maillot }
        # Refus : Ilyas revient plus tard ; accord : il revient vite, mais
        # pas au point de chasser la 3e Nouvelle de la S0 (slot 14) : depuis
        # le maillot (slots 8-10), [6,10] est dû au slot 15 (le seul libre) ou
        # aux slots 1-3 de la S1, dans sa fenêtre, sans échoir sur les slots
        # 16-17 verrouillés par le script.
        next:
          - { step: naming, if: "vars.nassir_refus >= 1", in: [8, 14] }
          - { step: naming, in: [6, 10] }
      - id: naming
        # Variantes : la première dont `if` est vrai au tirage.
        # `naming_express` est aussi la cible du saut d'arc depuis A4
        # (en.promu.a4_commission, schedule in [2,4]) : que le maillot ait été
        # joué ou non, c'est la Commission qui fait venir Ilyas au fax.
        card:
          - { id: en.nassir.naming_express, if: "flag('commission_sponsor')" }
          - { id: en.nassir.naming }
        # Palier ≥ 1 (maillot ou naming accepté) : le prêt ; palier 0 : le retrait.
        next:
          - { step: pret, if: "vars.nassir_palier >= 1", in: [8, 14] }
          - { step: retrait, in: [2, 4] }
      - id: retrait
        card: en.nassir.retrait
        outcome: ancienne
        next: []
      - id: pret
        card: en.nassir.pret
        # Signé (palier 3) : le rachat. Refusé : la carte pose `next: end`
        # (le retrait est réservé au palier 0, sinon `club_a_lancienne`
        # contredirait le maillot orange ou le naming déjà signés).
        next:
          - { step: rachat, if: "vars.nassir_palier >= 3", in: [6, 12] }
      - id: rachat
        card: en.nassir.rachat
        outcome: rachat
        next: [ { step: notification, in: [6, 14] } ]
      - id: notification
        card: en.nassir.notification
        next: []
