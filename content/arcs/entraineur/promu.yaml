# Arc de postulat « Sans un sou » (postulat 0, « Le promu sans un sou »).
# Le script maigre de la saison 1 (4 ancres : l'inventaire au slot 1, la
# Commission en 10-11, le dernier match au 16, le dernier virage au 17 — A2
# « L'empire » et A3 « La cote » sont devenus l'intrigue en.cote_du_promu,
# tirée par le réservoir), la facture en saison 2, puis deux ancres rejouables
# (rentrée / veille du dernier bloc) à partir de la saison 3. L'inventaire lit
# le fil rouge tiré (`fil_rouge`).
# Semé par `opening_arc: en.promu.sans_un_sou` dans postulats.yaml ; il remplace
# l'arc générique co.script.generique pour ce postulat.
arcs:
  - id: en.promu.sans_un_sou
    title: "Sans un sou"
    kind: postulat
    roles: [entraineur]
    foreground: true
    weight: 1.0
    cast: [josiane, aulard, meneche, vecchio]
    same_club: true
    fallback: drop
    # Traces du script (spec variété §1.3) : la ligne d'Almanach est écrite par
    # le moteur quand le drapeau est posé ; chacune est lue par une manchette,
    # un epitaph_plus ou une variante (lint : chaque trace lue ≥ 1 fois).
    traces:
      choix_maillots:    "{annee} : {nom} a choisi les maillots neufs plutôt que le chauffage. Le vestiaire a soufflé dans ses mains."
      finale_gigi:       "{annee} : dernier match, Gigi Vecchio dans les buts. {prenom} {nom} a tenu parole ; le jeune a regardé."
      finale_attaque:    "{annee} : {prenom} {nom} a attaqué le dernier bloc. Le vestiaire a entendu, le président aussi."
      parti_tete_haute:  "{annee} : {nom} a claqué la porte du bureau. Le virage a applaudi jusqu'au parking ; lundi, tout le monde y est."
      fidele:            "{annee} : {prenom} {nom} est resté{pg, select, f{e} other{}} malgré les offres. Josiane a ressorti le classeur."
      special:           "{annee} : « C'est moi », a répondu {nom} à Massenet. Titre du lendemain : « Le Spécial »."
      projet_jeunes:     "{annee} : {prenom} {nom} a tranché : les jeunes. Trois gamins des U19 sur la feuille de match."
      tribune_a_renover: "{annee} : {nom} a refusé le stade de la ville. La tribune Nord garde ses fissures, et son nom."
      vukic_dauphin:     "{annee} : Zoran Vukić a relu le discours du président. Son nom est dedans ; celui de {nom}, non."
    steps:
      # ---------------------------------------------------------- saison 1 (S0)
      - id: inventaire
        card:
          - { id: en.promu.a1_inventaire_tribune, if: "fil_rouge == 'tribune'" }
          - { id: en.promu.a1_inventaire_argent,  if: "fil_rouge == 'argent'" }
          - { id: en.promu.a1_inventaire }
        at: [1, 1]
        season: 0
      - id: commission
        # Troisième plan (fil rouge « tribune ») : la ville. Les deux sorties de
        # la carte de base sautent dans `en.prodige` et `en.nassir_proprietaire`
        # (schedule), ce qui tenait `en.prodige` à 82 % de couverture quel que
        # soit son poids de réservoir ; la variante mairie n'ouvre ni l'une ni
        # l'autre et fait entrer Madame Aubert dans le postulat.
        card:
          - { id: en.promu.a4_commission_mairie, if: "fil_rouge == 'tribune'" }
          - { id: en.promu.a4_commission }
        at: [10, 11]
        season: 0
      - id: dernier_match
        card:
          - { id: en.promu.a5_dernier_match_promis, if: "flag('vecchio_promis')" }
          - { id: en.promu.a5_dernier_match }
        at: [16, 16]
        season: 0
      - id: dernier_virage
        card: en.promu.a6_dernier_virage
        at: [17, 17]
        season: 0
      # ---------------------------------------------------------- saison 2 (S1)
      - id: epilogue
        card:
          - { id: en.promu.a7_ingratitude, if: "flag('bilan_tenu') && relation.aulard <= 0" }
          # Un promu sans un sou dans la première moitié (13e = 58 pts) est
          # déjà un miracle ; rang ≤ 8 exigerait ~78 pts, jamais atteints.
          - { id: en.promu.a7_miracle, if: "flag('bilan_tenu') && between(world.rang_final, 1, 13)" }
          - { id: en.promu.a7_projet, if: "flag('bilan_tenu')" }
          - { id: en.promu.a7_chauffage }
        at: [1, 2]
        season: 1
      - id: twist
        card:
          # Variantes relues au tirage (Director.refreshVariants) : world.rang
          # est le classement projeté de mi-saison, pas celui du Bilan.
          - { id: en.promu.a8_montoya, if: "flag('bilan_tenu') && world.division == 1 && (world.rang <= 10 || world.serie_victoires >= 2)" }
          # `commission_mairie` : quand le plan de janvier est passé par la
          # ville, c'est la maire qui revient au twist, même en D1.
          - { id: en.promu.a8_aubert, if: "world.division == 2 || flag('commission_mairie')" }
          - { id: en.promu.a8_projet_aulard }
        at: [10, 11]
        season: 1
      - id: finale
        card: en.promu.a9_finale
        at: [17, 17]
        season: 1
      # ---------------------------------------------------- saisons 3+ (S2+)
      - id: rentree
        # Les deux ancres rejouables se lisaient à vie sur la même carte : à
        # partir de la S2 chaque saison s'ouvrait et se fermait sur exactement
        # les deux mêmes répliques, réactions comprises (spec § 1.2 : chaque
        # ancre reçoit ≥ 2 variantes lues sur `fil_rouge` et sur les traces).
        # Les variantes lisent les traces posées en S0/S1 et changent de
        # visage : la rentrée n'est plus fatalement un monologue de Josiane.
        card:
          - { id: en.promu.rentree_gigi,    if: "flag('gigi_staff')" }
          - { id: en.promu.rentree_ardoise, if: "flag('pacte_gege') || flag('salaires_retard')" }
          - { id: en.promu.rentree_naming,  if: "flag('naming_signe')" }
          - { id: en.promu.rentree_vieille, if: "stats.saisons >= 4" }
          - { id: en.promu.rentree }
        at: [1, 1]
        season: "2+"
      - id: veille
        # Variante « dauphin » (spec §1.13) : l'adjoint a relu le second
        # discours ; lui laisser le banc conclut la carrière (fin en_dauphin).
        card:
          - { id: en.promu.veille_dauphin, if: "relation.vukic <= -1 && gauges.direction < 40 && !flag('vukic_dauphin')" }
          - { id: en.promu.veille_mbako,   if: "flag('mbako_vendu')" }
          - { id: en.promu.veille_virage,  if: "fil_rouge == 'tribune' || flag('pacte_gege') || flag('subvention_avancee')" }
          - { id: en.promu.veille_encore,  if: "stats.saisons >= 4" }
          - { id: en.promu.veille }
        at: [17, 17]
        season: "2+"
