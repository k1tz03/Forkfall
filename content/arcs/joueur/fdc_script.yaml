# Arc de postulat « La dernière année » (postulat 3, « Fin de contrat à 31 ans »).
# Bible ch. 10 § 4 : le script d'ouverture du joueur en fin de contrat. Neuf
# ancres — S0 : le restaurant de l'agent (slot 1), l'offre d'hiver (10-11), la
# quinzième (16), juin (17) ; S1 : le premier jour selon la destination (1-2),
# les jambes (10-11), la veille (17) ; S2+ : une saison de plus (1-2), la
# veille à la maison (17).
# Le président narratif est Vaubourg (`aulard`) ; le fonds est Ilyas (`nassir`).
# Deux alarmes d'override (jp.fin.alarme_*) sont déclarées dans postulats.yaml.
# Semé par `opening_arc: jp.fin.dernier_contrat`.
#
# HISTOIRE 4 — « La Route de la Rive » (docs/histoires/00_les_dix_histoires.md).
# Le postulat porte `histoire_h4` dès le départ : chaque étape lit d'abord ses
# variantes `jp.h4.*` (content/cards/joueur/h4_script.yaml), et les variantes
# historiques `jp.fin.*` ne restent que comme secours, jamais servis. Les
# ancres ouvrent les intrigues du livre par `schedule:` (content/arcs/joueur/
# h4_intrigues.yaml) :
#   S0 · 1 le restaurant (Fardelli) · 10-11 le rabais (Vaubourg) · 16 la
#        quinzième (le Doc) · 17 le 14 mai (le cimetière, Camille)
#   S1 · 1-2 le registre (le gardien) · 10-11 la fiche de l'hôpital (la kiné) ·
#        17 le capot (Bréhaut)
#   S2 · 1-2 l'affiche du jubilé (Vaubourg) · 10-11 la déclaration (le coffre) ·
#        16 la route, pour de vrai · 17 le rond central (les fins du livre)
#   S3+ · l'épilogue de qui s'est tu : les deux ancres rejouables d'avant,
#        décalées d'une saison, avec leurs variantes de silence.
# Les étapes historiques gardent leurs ids (les manchettes de
# content/unes/fin_de_contrat.yaml citent leurs cartes en photo).
arcs:
  - id: jp.fin.dernier_contrat
    title: "La dernière année"
    kind: postulat
    roles: [joueur]
    foreground: true
    weight: 1.0
    theme: contrat
    carrier: fardelli
    cast: [fardelli, sabatier, aulard, brehaut, vukic, camille, josiane, nassir, vecchio]
    same_club: false          # l'offre d'hiver et juin peuvent changer de club
    fallback: drop
    issues: [prolonge, parti, banc, sans_club]
    traces:
      agent_fardelli:     "{annee} : dix pour cent et un dessert pour deux. Rocco Fardelli représente {nom}."
      sans_agent:         "{annee} : {prenom} {nom} cherche seul{pg, select, f{e} other{}}. Le contrat est resté sous le cendrier."
      radio_demandee:     "{annee} : l'agent de {nom} a demandé la radio du genou. Le tiroir était fermé."
      prolonge_rabais:    "{annee} : un an au rabais pour {prenom} {nom}. Le chiffre est petit, la clause est grande."
      attend_juin:        "{annee} : {prenom} {nom} n'a rien signé en janvier. Juin est loin, en janvier."
      quinzieme_jouee:    "{annee} : quatorze croix, et la quinzième. Le genou de {nom} a tenu, ou a parlé."
      prolonge:           "{annee} : un an de plus pour {prenom} {nom}. Le genou n'a pas signé, il a laissé faire."
      prolonge_vestiaire: "{annee} : {prenom} {nom} prolongé{pg, select, f{e} other{}} par vingt-deux noms. Le capitaine avait signé en premier."
      sans_club:          "{annee} : {prenom} {nom}, trente-deux ans, sans club. Le téléphone était débranché."
      recule_poste:       "{annee} : {prenom} {nom} a reculé d'un cran. De là, on voit tout."
      banc_regarde:       "{annee} : {prenom} {nom} a regardé le banc avant de regarder le terrain."
      suit_vukic:         "{annee} : {prenom} {nom} a pris le train le lundi. Le cahier était dans le sac."
      dernier_annonce:    "{annee} : {prenom} {nom} l'a dit à la maison d'abord. C'était la dernière."
      vers_entraineur:    "{annee} : le survêtement de la réserve était à la taille de {nom}. Il l'avait pris exprès."
      genou_grave:        "{annee} : le genou de {prenom} {nom} a eu le dernier mot. Il l'avait dit avant."
      # HISTOIRE 4 — les ancres du livre laissent leur ligne à l'Almanach (et les
      # manchettes de content/unes/h4.yaml les lisent par `journal_has`).
      h4_quatorze_mai:    "{annee} : le 14 mai, au carré ancien, {nom} a lu la pierre pour la première fois. Jules Bertin, 1902-1983."
      h4_registre:        "{annee} : le registre du gardien. Fardelli, une seule visite : le 13 mai 1985, la veille."
      h4_fiche_hopital:   "{annee} : une fiche d'admission du 14 mai 1984, deux heures quarante. Lavergne Sandrine, quinze ans, vivante."
      h4_capot:           "{annee} : parking du stade, la nuit. Titi Bréhaut, assis sur son capot : « J'ai conduit. Tu dormais. »"
      h4_jubile_annonce:  "{annee} : l'affiche du jubilé de {nom}, samedi 15 mai. La veille est un 14."
      h4_accelere:        "{annee} : la nuit du 14 au 15 mai, sur la route de la Rive, {nom} n'a pas freiné."
      h4_rond_central:    "{annee} : le jubilé de {nom}. Un micro au rond central, un fauteuil au premier rang de l'Est."
      h4_silence:         "{annee} : au rond central, {nom} a rendu le micro sans un mot."
    traces_retract:
      # L'été sans club se referme au premier jour de la saison suivante
      # (s1_premier_jour_sans_club*, `clear: [sans_club]`) : sans cette ligne,
      # l'Almanach et la gazette gardaient « trente-deux ans, sans club » au
      # présent pendant que le joueur disputait son derby deux divisions plus bas.
      sans_club:          "{annee} : {nom} a signé le trente et un août, deux divisions plus bas. Le téléphone était rebranché."
    steps:
      # ------------------------------------------------------------- saison 0
      - id: derniere_annee
        card:
          - { id: jp.h4.a1_derniere_annee_genou,     if: "flag('histoire_h4') && fil_rouge == 'genou'" }
          - { id: jp.h4.a1_derniere_annee_vestiaire, if: "flag('histoire_h4') && fil_rouge == 'vestiaire'" }
          - { id: jp.h4.a1_derniere_annee,           if: "flag('histoire_h4')" }
          - { id: jp.fin.f1_derniere_annee_genou,     if: "fil_rouge == 'genou'" }
          - { id: jp.fin.f1_derniere_annee_vestiaire, if: "fil_rouge == 'vestiaire'" }
          - { id: jp.fin.f1_derniere_annee }
        at: [1, 1]
        season: "0"
      # L'ancre d'hiver ne repose jamais la question de « La maison du pays » :
      # si l'intrigue l'a déjà tranchée (retour signé ou pays refusé), le
      # script la commente (variante _refus) ou passe la main à l'offre du
      # président. Réciproque dans fdc_reservoir_a.yaml, étape offre_d2.
      - id: offre
        card:
          - { id: jp.h4.a2_rabais_agent, if: "flag('histoire_h4') && fil_rouge == 'agent'" }
          - { id: jp.h4.a2_rabais,       if: "flag('histoire_h4')" }
          - { id: jp.fin.f2_offre_or,           if: "relation.nassir >= 1 || gauges.caisse >= 62 || year >= 1999" }
          - { id: jp.fin.f2_offre_maison_refus, if: "flag('pays_refuse')" }
          - { id: jp.fin.f2_offre_maison,       if: "(flag('maison_pays') || flag('promis_camille')) && !flag('maison_pays_signee') && !flag('pays_refuse') && !flag('divorce')" }
          - { id: jp.fin.f2_offre_fax,          if: "flag('petition_portee')" }
          - { id: jp.fin.f2_offre }
        at: [10, 11]
        season: "0"
      - id: quinzieme
        card:
          - { id: jp.h4.a3_quinzieme_chiffre, if: "flag('histoire_h4') && flag('h4_chiffre_demande')" }
          - { id: jp.h4.a3_quinzieme,         if: "flag('histoire_h4')" }
          - { id: jp.fin.f2b_quinzieme_clause, if: "flag('prolonge_rabais')" }
          - { id: jp.fin.f2b_quinzieme }
        at: [16, 16]
        season: "0"
      - id: juin
        card:
          # Le 14 mai 1991 : la saison du livre finit au carré ancien.
          - { id: jp.h4.a4_quatorze_mai,      if: "flag('histoire_h4') && !flag('divorce')" }
          - { id: jp.h4.a4_quatorze_mai_seul, if: "flag('histoire_h4')" }
          - { id: jp.fin.f3_juin_rabais,    if: "flag('prolonge_rabais')" }
          # L'issue `sans_club` arme toute une branche (s1_premier_jour_sans_club,
          # une.fin.sans_club, la fin jp_sansclub) : elle était vue par 1 % des
          # joueurs. On l'ouvre à ceux qui ont replié le contrat sous le
          # cendrier — c'est la même histoire, un an plus tard.
          - { id: jp.fin.f3_juin_aucune,    if: "!flag('exil_dore') && !flag('maison_pays_signee') && (gauges.direction < 42 || flag('genou_grave') || (flag('quinzieme_tribune') && (flag('sans_agent') || flag('attend_juin'))) || (flag('sans_agent') && flag('attend_juin')))" }
          - { id: jp.fin.f3_juin_petition,  if: "flag('petition_portee') && gauges.vestiaire >= 60" }
          - { id: jp.fin.f3_juin }
        at: [17, 17]
        season: "0"
      # ------------------------------------------------------------- saison 1
      - id: premier_jour
        card:
          - { id: jp.h4.a5_registre_mission, if: "flag('histoire_h4') && flag('h4_vl_registre')" }
          - { id: jp.h4.a5_registre,         if: "flag('histoire_h4')" }
          # `flag('divorce')` seul ne se rencontrait presque jamais avec
          # `sans_club` : la variante était toujours battue par sa sœur
          # (« variante perdante » du rapport d'exposition). La maison vide se
          # lit aussi dans deux paliers négatifs avec Camille.
          - { id: jp.fin.s1_premier_jour_sans_club_seul, if: "flag('sans_club') && (flag('divorce') || relation.camille <= -2)" }
          - { id: jp.fin.s1_premier_jour_sans_club, if: "flag('sans_club')" }
          - { id: jp.fin.s1_premier_jour_parti,     if: "flag('parti_juin') || flag('maison_pays_signee') || flag('exil_dore')" }
          - { id: jp.fin.s1_premier_jour_prolonge,  if: "flag('prolonge')" }
          - { id: jp.fin.s1_premier_jour }
        at: [1, 2]
        season: "1"
      - id: jambes
        card:
          - { id: jp.h4.a6_fiche_mission, if: "flag('histoire_h4') && flag('h4_vl_dossier')" }
          # La table de massage : tu avais demandé à Rouvier ce que tu disais en dormant.
          - { id: jp.h4.a6_fiche_freine,  if: "flag('histoire_h4') && flag('h4_rouvier_freine')" }
          - { id: jp.h4.a6_fiche,         if: "flag('histoire_h4')" }
          - { id: jp.fin.s1_jambes_gigi, if: "flag('gigi_genou_ecoute') || relation.vecchio >= 2" }
          - { id: jp.fin.s1_jambes_quinzieme, if: "flag('quinzieme_jouee')" }
          - { id: jp.fin.s1_jambes }
        at: [10, 11]
        season: "1"
      - id: veille
        card:
          - { id: jp.h4.a7_capot_cahier, if: "flag('histoire_h4') && flag('h4_cahier_lu')" }
          - { id: jp.h4.a7_capot_appel,  if: "flag('histoire_h4') && flag('h4_appel_brehaut')" }
          - { id: jp.h4.a7_capot,        if: "flag('histoire_h4')" }
          - { id: jp.fin.s1_veille_ailleurs, if: "flag('vukic_dauphin') || flag('banc_regarde') || relation.vukic >= 2" }
          - { id: jp.fin.s1_veille_petition, if: "flag('petition_portee') || flag('petition_presse') || flag('prolonge_vestiaire')" }
          - { id: jp.fin.s1_veille }
        at: [17, 17]
        season: "1"
      # ------------------------------------------------------------- saison 2
      # Le dernier acte de « La Route de la Rive » : l'affiche du jubilé, le
      # coffre du président, la dernière nuit sur la route, le rond central.
      - id: h4_jubile
        card:
          - { id: jp.h4.a8_jubile_exige, if: "flag('histoire_h4') && flag('h4_capot_exige')" }
          - { id: jp.h4.a8_jubile }
        at: [1, 2]
        season: "2"
      - id: h4_declaration
        card:
          - { id: jp.h4.a9_declaration_cahier, if: "flag('h4_cahier_lu')" }
          - { id: jp.h4.a9_declaration }
        at: [9, 10]
        season: "2"
      - id: h4_route
        card:
          - { id: jp.h4.a10_route_bouteille, if: "flag('h4_bouteille')" }
          - { id: jp.h4.a10_route }
        at: [16, 16]
        season: "2"
      # Le rond central : la fin rare (Bréhaut prend le micro) demande Sandrine
      # écoutée en privé, le buraliste à +1 et Bréhaut convaincu ; la nuit
      # passée à accélérer ferme le micro ; les chèques changent le prix du
      # silence.
      - id: h4_rond_central
        card:
          - { id: jp.h4.a11_tour_honneur, if: "flag('h4_brehaut_convaincu') && flag('h4_sandrine_entendue') && relation.lavergne >= 1 && !flag('h4_accelere')" }
          - { id: jp.h4.a11_silence, if: "flag('h4_accelere')" }
          - { id: jp.h4.a11_cheques, if: "flag('h4_cheques') && !flag('h4_promesse_micro')" }
          - { id: jp.h4.a11_rond_central }
        at: [17, 17]
        season: "2"
      # ------------------------------------------------------------ saisons 3+
      # (HISTOIRE 4) Les deux ancres rejouables commencent en saison 3 :
      # l'épilogue. Leur première variante est celle de qui s'est tu au rond
      # central (`h4_silence`), une fois chacune.
      # Les deux ancres de S2+ sont les seules du script à être rejouées saison
      # après saison : leurs variantes doivent monter un escalier, pas s'agripper
      # à un drapeau. `recule_poste`, `banc_regarde`, `divorce`, `jubile_fait` et
      # `jubile_reporte` sont des traces DÉFINITIVES : en tête de liste et sans
      # garde propre, elles servaient la même carte deux à trois saisons de
      # suite et la scène de la bible (Vecchio, la quatrième retraite, la
      # chaussette trouée) n'était plus jamais jouée. Chaque variante d'état
      # pose donc son `_vu` et ne tient qu'une saison, et l'escalier lu sur
      # `season` / la marche précédente passe devant.
      - id: saison_de_plus
        card:
          - { id: jp.h4.e1_tabac, if: "flag('h4_silence') && !flag('h4_tabac_ferme')" }
          - { id: jp.fin.s2_saison_de_plus_recule, if: "(flag('recule_poste') || flag('banc_regarde')) && !flag('s2_recule_vu')" }
          - { id: jp.fin.s2_saison_de_plus_vrai,   if: "flag('s2_saison_encore')" }
          - { id: jp.fin.s2_saison_de_plus_encore, if: "season >= 3 || flag('une_de_plus') || flag('s2_saison_marche')" }
          - { id: jp.fin.s2_saison_de_plus }
        at: [1, 2]
        season: "3+"
      - id: veille_maison
        card:
          - { id: jp.h4.e2_cheque, if: "flag('h4_silence') && !flag('h4_cheque_revenu')" }
          - { id: jp.fin.s2_veille_josiane, if: "(flag('divorce') || relation.camille <= -2) && !flag('s2_josiane_vu')" }
          - { id: jp.fin.s2_veille_jubile,  if: "(flag('jubile_fait') || flag('jubile_reporte')) && !flag('s2_jubile_vu')" }
          - { id: jp.fin.s2_veille_encore,  if: "flag('s2_veille_marche')" }
          - { id: jp.fin.s2_veille }
        at: [17, 17]
        season: "3+"
