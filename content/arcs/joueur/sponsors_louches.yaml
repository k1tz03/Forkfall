# Les sponsors du joueur — propres et louches. Trois intrigues `kind: serie`,
# tirées par le réservoir des postulats du joueur à partir de la saison 1
# (content/postulats.yaml) ; le Rideau Rouge, commun aux deux rôles, est dans
# content/arcs/common/sponsors_louches.yaml. Cartes :
# content/cards/joueur/sponsors_louches.yaml.
#
#  1. La voiture du garage du Pont (PROPRE) — Monsieur Ravenel prête une
#     voiture à un joueur du club depuis 1979 : ton nom sur la portière, un
#     samedi par mois au garage. L'argent est vrai ; la difficulté vient
#     d'ailleurs : Vaubourg veut la moitié (sinon il retire le panneau du
#     garage en tribune Est), puis le petit Mbako, seize ans, sans permis,
#     plante la voiture dans le parapet du Pont et te demande de signer le
#     constat à sa place. Au bout : la carte grise à ton nom, ou le garage qui
#     ferme parce que le panneau est tombé.
#  2. Les crampons Bourrel (PROPRE) — Gigi Vecchio apporte une paire emballée
#     dans L'Écho : le vieux Bourrel, de Montelvane, qui fait ses gants depuis
#     1971, veut te chausser trois saisons. Le cuir est trop dur (le Doc perce
#     les ampoules), une grande marque de la Capitale paie cinq fois plus.
#     Tenir parole ou rompre. Au bout : l'enterrement du vieux un samedi à onze
#     heures, ou les vieux crampons ressemelés qu'il n'a pas voulu facturer.
#  3. La table du jeudi (LOUCHE, l'homme du casino) — Vaubourg écarte le
#     rideau de l'arrière-salle du Terminus : l'homme du casino de Fontenaire
#     paie les panneaux du club et aime perdre contre les joueurs. On gagne le
#     premier jeudi ; le quatrième, quarante mille de reconnaissances de dette
#     dans une boîte à cigares. Payer, ou attendre « un petit service » : un
#     carton jaune à la demi-heure. Au bout : le jaune pris (et un coupé garé
#     en bas), ou le carnet à spirale ouvert à ta page, le chiffre doublé ; ou,
#     pour qui a payé, le relevé de banque sur la table de la cuisine.
#
# Le pont avec la ville : `ville_francs` (le garage, Bourrel, la grande marque),
# `ville_francs_sales` (les gains du tripot, l'affiche du casino), `ville_amende`
# (la moitié pour Vaubourg, la dette payée, l'amende de la grande marque),
# `cadeau_berline` (la carte grise), `cadeau_coupe_sport` (le coupé du casino),
# `cadeau_portable` (le téléphone « pour la suite », à partir de 1995).
# Le risque : sp_tripot_service, sp_tripot_coupe, sp_tripot_affiche et
# sp_tripot_double sont lus par les événements de police et par la commission
# (content/arcs/common/sponsors_louches.yaml).
arcs:
  # ======================================================= 1 · La voiture du garage du Pont
  - id: jp.sp.garage
    title: "La voiture du garage du Pont"
    kind: serie
    roles: [joueur]
    postulats: [pepite]
    foreground: true
    weight: 0.4
    once: true
    min_season: 1
    theme: argent
    carrier: josiane
    cast: [josiane, aulard, mbako]
    issues: [refus, carte_grise, rendue]
    traces:
      sp_garage:         "{annee} : le nom de {nom} sur la portière d'une voiture du garage du Pont."
      sp_garage_couvert: "{annee} : {nom} a signé un constat à la place d'un gamin du club. Le garagiste a su lire."
    hint: "Une clé au porte-clés du garage du Pont, et ton nom sur une portière."
    start: [2, 9]
    same_club: true
    fallback: nouvelles
    epilogue:
      journal: "{annee} : le garage du Pont prête toujours une voiture à un joueur du club. Le nom change sur la portière."
    steps:
      - id: cles
        card: jp.sp.garage.cles
        next: [ { step: part, if: "flag('sp_garage')", in: [2, 3] } ]
      - id: part
        card: jp.sp.garage.part
        next: [ { step: pont, in: [2, 3] } ]
      - id: pont
        # Mbako vendu ou parti : c'est un gamin de la réserve.
        card:
          - { id: jp.sp.garage.pont_mbako }
          - { id: jp.sp.garage.pont }
        next: [ { step: carte_grise, in: [2, 4] } ]
      - id: carte_grise
        card:
          - { id: jp.sp.garage.carte_grise_constat, if: "flag('sp_garage_couvert')" }
          - { id: jp.sp.garage.carte_grise_panneau, if: "!flag('sp_garage_part')" }
          - { id: jp.sp.garage.carte_grise }
        next: []

  # ======================================================= 2 · Les crampons Bourrel
  - id: jp.sp.bourrel
    title: "Les crampons Bourrel"
    kind: serie
    roles: [joueur]
    postulats: [pepite]
    foreground: true
    weight: 0.4
    once: true
    min_season: 1
    theme: contrat
    carrier: vecchio
    cast: [vecchio, sabatier, fardelli]
    issues: [refus, tenu, rompu]
    traces:
      sp_bourrel:       "{annee} : {nom} chaussé{pg, select, f{e} other{}} par Bourrel, de Montelvane, pour trois saisons."
      sp_bourrel_tenu:  "{annee} : {nom} a gardé les crampons Bourrel contre une grande marque. Gigi a souri."
      sp_bourrel_rompu: "{annee} : une grande marque a racheté le contrat de {nom}. Les Bourrel sont chez Gigi."
    hint: "Une paire de crampons emballée dans L'Écho, et un vieux cordonnier de Montelvane."
    start: [2, 9]
    same_club: true
    fallback: nouvelles
    epilogue:
      journal: "{annee} : l'atelier Bourrel de Montelvane a fermé. Gigi Vecchio a gardé la dernière paire de gants."
    steps:
      - id: paire
        card: jp.sp.bourrel.paire
        next: [ { step: ampoule, if: "flag('sp_bourrel')", in: [2, 3] } ]
      - id: ampoule
        card: jp.sp.bourrel.ampoule
        next: [ { step: marque, in: [2, 3] } ]
      - id: marque
        card:
          - { id: jp.sp.bourrel.marque_photo, if: "flag('sp_bourrel_cache')" }
          - { id: jp.sp.bourrel.marque }
        next:
          - { step: deuil, if: "flag('sp_bourrel_tenu')", in: [2, 4] }
          - { step: semelles, if: "flag('sp_bourrel_rompu')", in: [2, 4] }
      - id: deuil
        card: jp.sp.bourrel.deuil
        next: []
      - id: semelles
        card: jp.sp.bourrel.semelles
        next: []

  # ======================================================= 3 · La table du jeudi
  - id: jp.sp.tripot
    title: "La table du jeudi"
    kind: serie
    roles: [joueur]
    postulats: [pepite, fin_de_contrat]
    foreground: true
    weight: 0.4
    once: true
    min_season: 1
    # « L'argent » (une dette de jeu) plutôt que « les instances » : le pari
    # sur ses propres corners (jp.pari) porte déjà ce thème, et il est au
    # plancher de couverture dans « Fin de contrat ».
    theme: argent
    carrier: aulard
    cast: [aulard, camille]
    issues: [refus, paye, service]
    traces:
      sp_tripot:         "{annee} : Vaubourg a fait asseoir {nom} à la table du jeudi, au fond du Terminus."
      sp_tripot_dette:   "{annee} : des reconnaissances de dette de {nom} dans une boîte à cigares, au Terminus."
      sp_tripot_service: "{annee} : {nom} a promis un carton jaune à la demi-heure à l'homme du casino."
      sp_tripot_coupe:   "{annee} : un coupé au nom d'une société du casino de Fontenaire, garé devant chez {nom}."
      sp_tripot_double:  "{annee} : {nom} a joué propre. Le carnet du casino a doublé le chiffre de sa page."
      sp_tripot_affiche: "{annee} : le visage de {nom} sur l'affiche du casino de Fontenaire, payé en liquide."
    hint: "Un rideau au fond du Terminus, une table d'amis, et une boîte à cigares."
    start: [2, 9]
    same_club: true
    fallback: nouvelles
    epilogue:
      journal: "{annee} : l'arrière-salle du Terminus a fermé « pour travaux ». La boîte à cigares n'a jamais été retrouvée."
    steps:
      - id: table
        card: jp.sp.tripot.table
        next: [ { step: dette, if: "flag('sp_tripot')", in: [1, 3] } ]
      - id: dette
        card: jp.sp.tripot.dette
        next: [ { step: service, in: [2, 3] } ]
      - id: service
        # La dette laissée : le service (et, à partir de 1995, le téléphone
        # « pour la suite »). La dette payée : l'affiche du casino.
        card:
          - { id: jp.sp.tripot.service_portable, if: "flag('sp_tripot_dette') && year >= 1995" }
          - { id: jp.sp.tripot.service, if: "flag('sp_tripot_dette')" }
          - { id: jp.sp.tripot.affiche }
        next:
          - { step: jaune, if: "flag('sp_tripot_service')", in: [1, 3] }
          - { step: releve, in: [2, 4] }
      - id: jaune
        card: jp.sp.tripot.jaune
        next: []
      - id: releve
        # Camille partie, le relevé arrive ouvert.
        card:
          - { id: jp.sp.tripot.releve }
          - { id: jp.sp.tripot.releve_seul }
        next: []
