# « Les Deux Téléphones » — le réservoir du postulat `escalier_ferme` (index 9) :
# quatorze intrigues tirées à l'ouverture des saisons (content/postulats.yaml,
# `programme`). Cartes : content/cards/president/h10_intrigues.yaml.
#
#   Saison 0           · socios (signature) · maquette · centre · lundi ·
#                        rouvier · photo
#   Saison 1           · brac (après la première commande) · mbako (la loi) ·
#                        lea (la lettre du dimanche) · siege · entrepot ·
#                        photo et lundi, si la saison 0 ne les a pas ouvertes
#   Saison 2 (tardives) · truelle · villebranle · nino
#
# Chaque intrigue s'ouvre dans sa saison seulement (le programme garde ses
# entrées par `season == n && slot <= …`), et `start: [1, 3]` : quand le
# metteur en scène en rouvre une de lui-même, sa première carte tombe dans les
# trois créneaux, jamais sur la saison suivante. Avec des fenêtres de dix
# créneaux, les intrigues ouvertes tard débordaient d'une saison sur l'autre,
# et le tirage de la saison suivante, qui retranche ce qui continue, ne tirait
# plus les tardives.
#
# Ce que le réservoir fournit à l'acte final, en plus du script :
#   · la photo de 1974 raccrochée (pr.h10.photo) — la fin rare ;
#   · la bande du dictaphone (pr.h10.lea) — la preuve ;
#   · la truelle payée, propre ou sale (pr.h10.truelle) — la dernière marche et
#     la brigade ;
#   · la dette de Nino (pr.h10.nino) — un neveu retourné au zinc peut se
#     retourner encore, si on le laisse seul au Terminus ;
#   · Gégé à +2 (pr.h10.rouvier, pr.h10.photo, pr.h10.villebranle).
# Les secrets (le contrat de siège, la bande) n'ont pas de ligne d'Almanach.
arcs:
  # ============================================================== SAISON 0
  - id: pr.h10.socios
    title: "La carte 212"
    kind: serie
    roles: [president]
    postulats: [escalier_ferme]
    foreground: true
    weight: 1.0
    once: true
    min_season: 0
    theme: tribune
    carrier: nino
    cast: [nino, gege, josiane]
    issues: [recompte, compte]
    traces:
      h10_socios_recompte: "{annee} : le vote de la buvette recompté carte par carte. Il manquait trois cartes au compte de Nino."
      h10_socios_compte: "{annee} : la motion du virage adoptée à trois cartes près. Nino a compté ; personne n'a recompté."
    hint: "Trois cent douze signatures pour payer la Nord au prix de 1990."
    start: [1, 3]
    same_club: true
    fallback: drop
    steps:
      - id: motion
        card:
          - { id: pr.h10.so.motion_essai, if: "flag('h10_promesse_essai')" }
          - { id: pr.h10.so.motion }
        next: [ { step: vote, in: [1, 3] } ]
      - id: vote
        card:
          - { id: pr.h10.so.vote_josiane, if: "fil_rouge == 'socios'" }
          - { id: pr.h10.so.vote }
        next: [ { step: guichet, in: [2, 4] } ]
      - id: guichet
        card:
          # la motion du virage (pr.h10.so.motion*) : votée le soir même, ou renvoyée au conseil
          - { id: pr.h10.so.guichet_recompte_soir, if: "flag('h10_socios_recompte') && flag('h10_motion_soir')" }
          - { id: pr.h10.so.guichet_recompte_conseil, if: "flag('h10_socios_recompte') && flag('h10_motion_conseil')" }
          - { id: pr.h10.so.guichet_recompte, if: "flag('h10_socios_recompte')" }
          - { id: pr.h10.so.guichet_soir, if: "flag('h10_motion_soir')" }
          - { id: pr.h10.so.guichet_conseil, if: "flag('h10_motion_conseil')" }
          - { id: pr.h10.so.guichet }
        next: []

