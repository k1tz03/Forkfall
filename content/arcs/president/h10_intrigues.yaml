        next: [ { step: tambour, in: [2, 3] } ]
      - id: tambour
        # Gégé et les dettes du petit (pr.h10.ni.oncle) : « je m'en occupe », ou « ses affaires »
        card:
          - { id: pr.h10.ni.tambour_occupe, if: "flag('h10_oncle_occupe')" }
          - { id: pr.h10.ni.tambour_affaires, if: "flag('h10_oncle_affaires')" }
          - { id: pr.h10.ni.tambour }
        next: []
