# Le réservoir de « La Maquette » (postulat `geant_dechu`) : quinze intrigues,
# tirées par le `programme` du postulat (content/postulats.yaml) ou ouvertes par
# une ancre du script (`schedule`). Les cartes sont dans
# content/cards/president/h5_intrigues_s0.yaml, _s1.yaml et _s2.yaml.
#
# Saison 1 (S0) — six intrigues, dont deux que le script ouvre lui-même :
#   · La 14B (Paulette) : ouverte par le café (A1) ; la place 14B avant le feu,
#     la grille après, et le buffet la saison suivante (l'acte de 1931).
#   · Le Conseil (les ordres du mardi) : ouvert par le premier mardi (A2) ; le
#     gardien vendu ou gardé, la plaque de fonte, puis les cendres.
#   · Le mot de janvier (Gégé, signature) ; Les Terrasses sur le maillot
#     (Tessandier) ; Le bureau d'après (Bréhaut et le cahier de Vukić) ; Le
#     délai de la Ligue (Vaubourg et ses comptes de 1998).
# Saison 2 (S1) — La SCI (le fax de La Plume, Léa ; ouverte par la vase),
#   Le témoin du feu (Didier Vallin ; ouvert par la grille), La valise de
#   Halvenne (Malbec), Le fonds (Ilyas), La coupure de 1992 (Vialat).
# Saison 3 (S2) — les quatre tardives : Lambert (la voix du quartier ; ouverte
#   par Camille, C1), Le dossier (la procureure), La vue (l'aveu de Madame
#   Tessandier), Le cadastre (la sœur de Josiane, et l'écriture de 1976).
#
# Les preuves que la fin lit (au conseil, au second solde, au dernier match) :
# l'acte (h5_acte_rendu, h5_acte_paulette, h5_copie_cadastre, vl_cadastre), la
# voix (h5_cassette + h5_josie), le fax (h5_fax_plume), le témoin (h5_temoin,
# vl_temoin_feu) ; et ce qui les salit : la valise (h5_valise_prise, vl_valise).
arcs:
  # ================================================================ S0
  - id: pr.h5.quatorze_b
    title: "La 14B"
    kind: serie
    roles: [president]
    postulats: [geant_dechu]
    foreground: true
    weight: 1.0
    once: true
    min_season: 0
    theme: tribune
    carrier: paulette
    cast: [paulette, gege, josiane, vallin]
    issues: [ecoutee, pressee, acte, vu]
    # `ecoutee` et `pressee` sont les issues de la tribune, que le feu dépasse
    # presque toujours (la grille puis le buffet suivent) : elles ne closent
    # l'intrigue que si la carrière s'arrête avant l'hiver. Déclarées rares.
    issues_rares: [ecoutee, pressee]
    traces:
      h5_14b_ecoutee:  "{annee} : place 14B, tribune Est, Paulette a raconté 1931 jusqu'à la mi-temps, café dans le bouchon."
      h5_fonte:        "{annee} : dans les cendres de l'Est, un bout de fonte : ENFANTS DU. Le reste de la plaque a fondu."
      h5_acte_rendu:   "{annee} : Paulette a sorti l'acte de 1931 de son buffet. Maître Guénot en a fait trois copies."
      h5_acte_paulette: "{annee} : l'acte de 1931 est resté chez Paulette, sous la nappe des dimanches. « Je l'apporterai. »"
      h5_acte_vu:      "{annee} : Paulette a montré un papier plié en huit, puis l'a remis dans son buffet, et tourné la clé."
    hint: "Une couverture écossaise, un thermos, et un terrain donné en 1931."
    start: [2, 5]
    same_club: true
    fallback: drop
    steps:
      - id: tribune
        card: pr.h5.14b.tribune
        next: [ { step: grille, in: [3, 12] } ]
      - id: grille
        card:
          - { id: pr.h5.14b.grille_plaque, if: "flag('h5_plaque_deposee')" }
          - { id: pr.h5.14b.grille }
        next: [ { step: buffet, at_season: 1, at: [2, 14] } ]
      - id: buffet
        card:
          - { id: pr.h5.14b.buffet, if: "relation.paulette >= 1 || flag('h5_14b_ecoutee')" }
          - { id: pr.h5.14b.buffet_ferme }
        next: []

  - id: pr.h5.ordres
    title: "Le Conseil"
    kind: serie
    roles: [president]
    postulats: [geant_dechu]
    foreground: true
    weight: 1.0
    once: true
    min_season: 0
    theme: president
    carrier: dorian
    cast: [dorian, brehaut, vukic, josiane, gege]
    issues: [obei, refuse]
    traces:
      h5_oudart_vendu:     "{annee} : Oudart, le seul gardien sous contrat, vendu un jeudi à Halvenne. Le Conseil l'avait demandé mardi."
      h5_oudart_garde:     "{annee} : {nom} a gardé Oudart. Bréhaut a déchiré le fax de Halvenne en quatre, lentement."
      h5_plaque_deposee:   "{annee} : la plaque de la grille Est a été dévissée un matin d'octobre, sur ordre. Josiane l'a montée au grenier."
      h5_plaque_restee:    "{annee} : la plaque de fonte est restée à la grille Est. Le samedi, elle était couverte d'écharpes nouées."
      h5_plainte_retiree:  "{annee} : la plainte pour l'incendie de l'Est a été retirée. Le compte du club a été débloqué le lendemain."
      h5_cle_laissee:      "{annee} : des piquets orange alignés au cordeau dans les cendres de l'Est. Gégé les a arrachés le mardi."
      h5_serrure_changee:  "{annee} : serrure neuve à la grille de l'Est, deux clés. Le lendemain, une troisième était sur le bureau."
    hint: "Mardi, dix-huit heures : une voix d'homme qui ne dit pas son nom."
    start: [2, 5]
    same_club: true
    fallback: drop
    steps:
      - id: jeudi
        # Tu avais raccroché mardi : Bréhaut te le rappelle.
        card:
          - { id: pr.h5.ordres.jeudi_raccroche, if: "flag('h5_raccroche')" }
          - { id: pr.h5.ordres.jeudi }
        next: [ { step: plaque, in: [2, 4] } ]
      - id: plaque
        card:
          - { id: pr.h5.ordres.plaque_conseil, if: "flag('h5_oudart_vendu') && flag('h5_conseil_ecrit')" }
          - { id: pr.h5.ordres.plaque_obei, if: "flag('h5_oudart_vendu')" }
          - { id: pr.h5.ordres.plaque }
        next: [ { step: cendres, in: [3, 8] } ]
      - id: cendres
        card:
          - { id: pr.h5.ordres.cendres_plainte, if: "flag('h5_plainte')" }
          - { id: pr.h5.ordres.cendres }
        next: []

  - id: pr.h5.mot_janvier
    title: "Le mot de janvier"
    kind: serie
    roles: [president]
    postulats: [geant_dechu]
    foreground: true
    weight: 1.0
    once: true
    min_season: 0
    theme: mercato
    carrier: gege
    cast: [gege, malbec, vukic, dembo]
    # La bâche n'est pas une issue : c'est l'épilogue commun des trois (le kop
    # peint, qu'on ait tenu, rompu ou rien promis). L'issue reste celle du mot.
    issues: [tenu, rompu, refuse]
    traces:
      h5_mot_donne:  "{annee} : PERSONNE NE PART, à la craie sur la porte du local du kop, quarante centimètres, date en dessous."
      h5_mot_refuse: "{annee} : « Je ne promets rien », a dit {nom} au local. La Nord a chanté un quart d'heure de moins."
      h5_mot_tenu:   "{annee} : Malbec voulait le petit Tavernier en janvier. {nom} a dit non ; la craie du local est restée."
      h5_mot_rompu:  "{annee} : le petit Tavernier vendu en janvier. Gégé a effacé PERSONNE à l'éponge et laissé la date."
      h5_bache:      "{annee} : vingt mètres de drap, peinture bordeaux : LA RIVE AUX ENFANTS DU QUARTIER. Le kop a signé dessous."
    hint: "Une boîte à chaussures pleine d'abonnements payés, et une promesse à faire à la craie."
    start: [2, 6]
    same_club: true
    fallback: drop
    steps:
      - id: local
        card: pr.h5.kop.local
        next:
          - { step: janvier, if: "flag('h5_mot_donne')", in: [3, 6] }
          - { step: bache, at_season: 1, at: [3, 11] }
      - id: janvier
        card: pr.h5.kop.janvier
        next: [ { step: bache, at_season: 1, at: [3, 11] } ]
      - id: bache
        card: pr.h5.kop.bache
        next: []

