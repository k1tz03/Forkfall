        # Gégé t'a conduit chez Lambert, ou son ticket t'a dit de parler à droite.
        card:
          - { id: pr.h5.lambert.cuisine_gege, if: "flag('h5_gege_emmene')" }
          - { id: pr.h5.lambert.cuisine_droite, if: "flag('h5_ticket_droite')" }
          - { id: pr.h5.lambert.cuisine }
        next: [ { step: permanence, in: [2, 7] } ]
      - id: permanence
        card: pr.h5.lambert.permanence
        next: []

