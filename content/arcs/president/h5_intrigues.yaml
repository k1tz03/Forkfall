        next: [ { step: vitrine, in: [2, 7] } ]
      - id: vitrine
        card:
          - { id: pr.h5.vue.vitrine_noire, if: "flag('h5_tessandier_silence')" }
          - { id: pr.h5.vue.vitrine }
        next: []

