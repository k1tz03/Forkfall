      h5_maillot_blanc:     "{annee} : le Racing a joué en blanc, sans rien sur la poitrine. Josiane a dit au téléphone que tu n'étais pas joignable."
      h5_clause_rompue:     "{annee} : {nom} a rompu le contrat des Terrasses à l'article 4. La pénalité a coûté une saison de maillots."
      h5_clause_acceptee:   "{annee} : article 4, l'accompagnement du projet urbain. {nom} a signé l'accompagnement."
