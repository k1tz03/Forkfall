        card: pr.h5.vue.pinceau
        next: [ { step: gardien, in: [3, 8] } ]
      - id: gardien
        card:
          - { id: pr.h5.vue.gardien_temoin, if: "flag('h5_temoin') || flag('vl_temoin_feu')" }
