    traces:
      h5_tessandier_aveu:    "{annee} : « J'ai dit un soir, devant le gardien, que la vue serait plus belle sans. » Madame Tessandier."
      h5_tessandier_silence: "{annee} : Madame Tessandier a éteint sa vitrine. Il est resté le reflet de {nom}, et derrière, le stade."
