# Histoire 7 · Chambre 12 — le réservoir (postulat `apres_fiasco`, programme
# dans content/postulats.yaml). Les cartes sont dans
# content/cards/selectionneur/h7_intrigues.yaml.
#
# Le huis clos se raconte en trois réservoirs, un par année civile ; le tirage
# d'une saison ne prend jamais deux intrigues du même porteur ni du même thème
# (director `_poolWeight`), d'où un porteur et un thème par intrigue.
#
#   2011 (bucket "0", avant la nuit du 14) — deux intrigues sur sept :
#     · Le vingt-sixième (signature, Rouvier, le corps) : le footing du petit,
#       ses plafonds sur le Flux, un rendez-vous « personnel » à Valdorne. Après
#       la mort, la même étape devient l'appel du cabinet de cardiologie.
#     · Le brassard (Ferrol, le vestiaire) : la prime gelée des mutins, le
#       sachet sans étiquette, la rangée vide du car.
#     · Le tableau des clés (Sandrine, la sélection) : le rituel de minuit, une
#       saison sur l'autre (variantes lues sur `season`), et un intermède par
#       an : le vingt-septième double, puis le standard qui sonne partout.
#     · L'hymne (Madame Aubert, la tribune) : vingt-six bouches en novembre ;
#       après la mort, il manque celui qui chantait faux, très fort.
#     · L'agent du petit (Fardelli, l'agent) : des minutes pour Portclair, le
#       standard de onze heures, un contrat de deux ans « pas plus ».
#     · La page des sports (Léa, la formation) : le gamin du centre dans
#       L'Écho, « un tournoi, un seul », la photo du terrain annexe.
#     · Le pull bleu (Madame Rancé, la maison) : le linge du dimanche, les
#       appels de trois heures, la chambre promise « au calme ».
#   2012 (bucket "1", les portes) — trois sur six, plus le tableau :
#     · La main (Léa, la presse) : la photo de 1 h 47 et le sachet de Ferrol.
#     · Le plateau (Rossard, la tribune) : deux heures vingt-cinq à l'antenne.
#     · La nuit du 14 (Benali, les instances) : les heures exactes, l'intermède
#       du couloir où toutes les portes portent le 12, la procureure Amsel.
#     · Fulgor (Desforges, l'argent) : le sponsor louche, la canette, les
#       vingt-sept montres d'acier (saisies en 2013 : sl.h7.ev.montres).
#     · Le tarif de la chambre (Escande, le contrat) : le sponsor gris, trois
#       ans gratuits contre le nom de l'hôtel, le pilon des cahiers de nuit.
#     · Le trombone rouge (Josiane, la direction) : la page trois, le brouillon
#       du procès-verbal tapé à huit heures.
#   2013 (bucket "2+", les signatures) — deux sur quatre, plus le tableau ;
#   les quatre sont tardives (min_season 2) :
#     · La docteure (Arzel, le corps) : le trombone vert, la mallette, la
#       démission « pour raisons personnelles ».
#     · Le procès-verbal (Dauzat, les instances) : le registre, Vaubourg déposé
#       dans sa berline, l'heure donnée à Rossard.
#     · La mère (Madame Rancé, la maison) : le standard de trois heures, le
#       téléphone sous scellés, le double de la 12.
#     · Dans cet ordre (Fauvel, le vestiaire) : la lettre anonyme, le vote à main
#       levée dans la salle du petit-déjeuner.
#
# Les étapes qui montrent le petit vivant portent une variante « après » ou un
# `when` qui les retient avant la nuit du 14 ; aucune intrigue d'une année ne
# déborde sur la suivante par une fusée longue (elle priverait le tirage de
# l'année d'après de ses ouvertures) : ce qui revient l'année suivante revient
# par un événement, une ancre ou une variante.
arcs:
  # ═════════════════════════════════════════════════════════ 2011 · bucket "0"
  - id: sl.h7.vingt_sixieme
    title: "Le vingt-sixième"
    kind: serie
    roles: [selectionneur]
    postulats: [apres_fiasco]
    foreground: true
    weight: 1.0
    once: true
    min_season: 0
    theme: corps
    carrier: rouvier
    cast: [rouvier, mbako, arzel]
    issues: [accorde, repousse, appel]
    # « appel » n'existe que si la troisième étape tombe après la nuit du 14
    # (le cabinet de cardiologie réclame la consultation manquée) : rare par
    # construction, une carrière sur dix environ.
    issues_rares: [appel]
    traces:
      h7_footing_coupe:       "{annee} : Rancé sorti du footing au troisième tour, sur ordre de {nom}. Il a ri, une main sur la poitrine."
      h7_footing_force:        "{annee} : Rancé a fini les dix tours avec les autres. Rouvier a écrit un chiffre dans la marge et l'a entouré."
      h7_rendez_vous_accorde:  "{annee} : Tibo Rancé avait demandé le 16 novembre pour un rendez-vous à Valdorne. {nom} avait dit oui."
      h7_rendez_vous_repousse: "{annee} : Tibo Rancé voulait le 16 novembre pour un rendez-vous à Valdorne. « Après le barrage », a dit {nom}."
      h7_cardiologue:          "{annee} : un cabinet de cardiologie de Valdorne a réclamé la consultation manquée de Tibo Rancé."
    hint: "Un garçon qui rit au troisième tour, une main sur la poitrine."
    start: [1, 3]
    same_club: true
    fallback: drop
    steps:
      - id: tours
        card: sl.h7.v1_tours
        next: [ { step: plafond, in: [1, 4] } ]
      - id: plafond
        card:
          - { id: sl.h7.v2_plafond_apres, if: "flag('h7_rance_mort')" }
          - { id: sl.h7.v2_plafond }
        next: [ { step: rendez_vous, in: [1, 4] } ]
      - id: rendez_vous
        card:
          - { id: sl.h7.v3_cabinet, if: "flag('h7_rance_mort')" }
          - { id: sl.h7.v3_rendez_vous }
        next: []

  - id: sl.h7.capitaine
    title: "Le brassard"
    kind: serie
    roles: [selectionneur]
    postulats: [apres_fiasco]
    foreground: true
    weight: 1.0
    once: true
    min_season: 0
    theme: vestiaire
    carrier: ferrol
    cast: [ferrol, fauvel, mbako, aubert]
    issues: [milieu, devant]
    traces:
      h7_prime_debloquee: "{annee} : la prime des mutins de 2010 débloquée par {nom}. Fauvel a répondu par une lettre d'une ligne."
      h7_prime_gelee:     "{annee} : la prime de 2010 est restée gelée. Fauvel a écrit « noté » au bas de la lettre."
      h7_rangee_milieu:   "{annee} : dans le car du retour, {nom} a pris la rangée vide, entre les mutins et les nouveaux."
      h7_rangee_vide:     "{annee} : dans le car du retour, une rangée vide entre les mutins et les nouveaux, jusqu'à Aubérive."
    hint: "Un brassard plié depuis 2010, un bracelet tressé rouge et noir, et une rangée vide au milieu du car."
    start: [1, 3]
    same_club: true
    fallback: drop
    steps:
      - id: prime
        # Le brassard à un mutin : c'est la ministre qui appelle, pas le syndicat.
        card:
          - { id: sl.h7.c1_prime_ministre, if: "flag('h7_capitaine_mbako') && year <= 2012" }
          - { id: sl.h7.c1_prime }
        next: [ { step: sachet, in: [1, 4] } ]
      - id: sachet
        card: sl.h7.c2_sachet
        next: [ { step: car, in: [1, 4] } ]
      - id: car
        card:
          - { id: sl.h7.c3_car_deuil, if: "flag('h7_rance_mort')" }
          - { id: sl.h7.c3_car }
        next: []

  # Le rituel : réarmé chaque saison (every_season), de fond (il ne compte pas
  # dans les intrigues de premier plan). Les variantes de chaque étape lisent la
  # saison ; l'étape 2 est l'intermède de l'année en 2011 et en 2013 (en 2012,
  # l'intermède est celui du couloir, dans « La nuit du 14 »).
  - id: sl.h7.tableau
    title: "Le tableau des clés"
    kind: serie
    roles: [selectionneur]
    postulats: [apres_fiasco]
    foreground: false
    weight: 0.6
    once: false
    every_season: true
    min_season: 0
    theme: selection
    carrier: sandrine
    cast: [sandrine, mbako, escande]
    issues: [ronde, confiance]
    traces:
      h7_ronde:     "{annee} : chaque nuit de fenêtre, {nom} a fait la ronde du tableau des clés à minuit."
      h7_confiance: "{annee} : {nom} ne descend plus voir le tableau des clés. Sandrine Lavergne compte seule."
      h7_reveil_six: "{annee} : le petit Rancé avait demandé qu'on l'appelle à six heures. Pas le réveil : Sandrine."
    hint: "Vingt-six crochets derrière un comptoir, et une femme qui ne dort pas."
    start: [2, 5]
    same_club: true
    fallback: drop
    steps:
      - id: minuit
        card:
          - { id: sl.h7.t1_minuit_2013, if: "season >= 2" }
          - { id: sl.h7.t1_minuit_2012, if: "season == 1" }
          - { id: sl.h7.t1_minuit }
        next: [ { step: songe, in: [2, 4] } ]
      - id: songe
        card:
          - { id: sl.h7.t2_double_2013, if: "season >= 2" }
          - { id: sl.h7.t2_heures_2012, if: "season == 1" }
          - { id: sl.h7.t2_reveil }
        next: [ { step: ronde, in: [2, 4] } ]
      - id: ronde
        card:
          - { id: sl.h7.t3_portes_2013, if: "season >= 2" }
          - { id: sl.h7.t3_ronde_2012, if: "season == 1" }
          - { id: sl.h7.t3_ronde }
        next: []

