      h7_hymne_muet:   "{annee} : à la répétition de l'hymne, à la Rive, {nom} a laissé les Cobalts se taire."
    hint: "Une ministre qui veut voir des bouches s'ouvrir, et des fiches bristol tapées à la machine."
