      h9_page_tardive: "{annee} : la page de décembre 2010 paraît enfin dans Le Quotidien, avec trois ans de retard."
      h9_page_dormante: "{annee} : la page de décembre 2010 dort dans le buffet de {nom}, sous les factures."
    hint: "Une vieille secrétaire meurt, et laisse un carton. Dedans, une heure."
    same_club: true
    fallback: drop
    steps:
      - id: legs
        card: sl.h9.carton.legs
        next: [ { step: lea, in: [1, 3] } ]
      - id: lea
        card: sl.h9.carton.lea
        next: [ { step: fenetre, in: [1, 2] } ]
      - id: fenetre
        card:
          - { id: sl.h9.carton.fenetre_publiee, if: "flag('h9_page_tardive')" }
          - { id: sl.h9.carton.fenetre }
        next: []
