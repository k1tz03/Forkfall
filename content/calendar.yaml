# Le calendrier d'une saison, beat par beat, par rôle.
#
# `prologue` — SAISON 0 UNIQUEMENT, avant tout le reste. Six beats sont
#   réservés en tête de présaison ; le postulat en remplit quatre à six via
#   `prologue:` (un arc `kind: prologue`, servi dans l'ordre du fichier). Les
#   beats en trop — et TOUS les beats de prologue dès la saison 1 — sont sautés
#   par le tirage, sans consommer ni tour ni tirage. Une carte de prologue est
#   hors créneau narratif : elle ne bouge ni `slot`, ni `ncards`, ni la file
#   des échéances, et ne compte pour aucune Nouvelle. Sans elle, la toute
#   première carte d'une carrière était le président qui réclame un objectif —
#   « on est jeté dans la fosse aux lions sans savoir ce qu'est vraiment le jeu ».
#
# `classement` — deux fois par saison : à la fin du bloc aller, et au Bilan
#   AVANT la Une. Une carte, un bouton, un tableau : les six lignes autour de
#   ta position, avec rang, club, points et différence de buts. Le tableau est
#   dérivé du championnat déjà simulé (`world.dart`), il n'en invente pas un
#   second. Hors créneau lui aussi.
#
# Les dix-sept créneaux narratifs (`card`) sont inchangés : présaison 1-3,
# aller 4-9, hiver 10-12, retour 13-17.
roles:
  entraineur:
    - {phase: presaison, beats: [prologue, prologue, prologue, prologue, prologue, prologue, objective, card, card, card]}
    - {phase: aller, beats: [card, card, match, card, card, match, card, card, match, classement]}
    - {phase: hiver, beats: [card, card, card]}
    - {phase: retour, beats: [card, card, match, cup, card, card, match, card, match]}
    - {phase: sprint, beats: [gm_annonce, gm_te, gm_te, gm_te, aftermatch]}
    - {phase: bilan, beats: [classement, bilan_une, bilan_verdict, bilan_contrat, bilan_carrefour]}
  joueur:
    - {phase: presaison, beats: [prologue, prologue, prologue, prologue, prologue, prologue, objective, card, card, card]}
    - {phase: aller, beats: [card, card, match, card, card, match, card, card, match, classement]}
    - {phase: hiver, beats: [card, card, card]}
    - {phase: retour, beats: [card, card, match, cup, card, card, match, card, match]}
    - {phase: sprint, beats: [gm_annonce, gm_te, gm_te, gm_te, aftermatch]}
    - {phase: bilan, beats: [classement, bilan_une, bilan_verdict, bilan_contrat, bilan_carrefour]}

# Le metteur en scène (voir la spec narrative §1-2). Les 17 emplacements de
# cartes par saison sont numérotés 1..17 : présaison 1-3, aller 4-9, hiver
# 10-12, retour 13-17.
director:
  # Les trois créneaux réservés portent une **dette** : une Nouvelle cédée à
  # une étape urgente est reportée au créneau suivant. Avec [7, 12, 14] la
  # troisième dette naissait au créneau 14 et n'avait plus que 15-17 pour se
  # solder — or deux Nouvelles ne se suivent jamais : trois créneaux ne
  # rendent que deux Nouvelles. D'où 2,2-2,6 par saison pour une bande de
  # 3-4. [4, 9, 13] laisse quatre créneaux après la dernière réservation.
  # Le rôle joueur gardait [7, 12, 14] et payait exactement le même prix :
  # 2,7 Nouvelles en S0 et la bande 3-4 tenue dans 71 % des saisons pour un
  # seuil de 95 % (postulat 3). Ses ancres de script sont aux slots 1, 10-11,
  # 16 et 17 : [4, 9, 13] ne les croise pas non plus.
  # Quatrième créneau pour l'entraîneur ([4, 9, 13] → [3, 6, 9, 13]). Avec
  # trois créneaux, la bande 3-4 exigeait que les TROIS tombent : une seule
  # cession à une étape échue (bande 6, qui passe avant la dette) sortait la
  # saison de la bande. La S0 — la plus chargée en ancres et en étapes — y
  # tombait à 2,2 Nouvelles de moyenne et ne tenait la bande que dans 30 % des
  # saisons, pour un plancher de 95 % : la première saison, celle que tout
  # joueur voit, était la plus pauvre en respiration d'époque alors que 87
  # Nouvelles datées sont écrites. Le plafond `nouvelles_max: 4` empêche le
  # quatrième créneau de faire une cinquième Nouvelle ; les ancres du script de
  # l'entraîneur (slots 1, 10-11, 16, 17) ne croisent aucun des quatre, et 14-15
  # restent libres pour solder la dette du créneau 13.
  # Lot « anecdotes d'époque » — quotas VÉRIFIÉS, inchangés. Le retour joueur
  # (« les anecdotes liées au foot dans son histoire générale, je ne les ai
  # jamais retrouvées ») venait de la banque, pas du calendrier : à une
  # Nouvelle datée par an, les quatre créneaux tiraient surtout de
  # l'intemporel. Avec `content/cards/common/epoque_*.yaml` (deux à trois
  # cartes d'époque par année vécue), les MÊMES quatre créneaux servent, mesuré
  # sur 300 carrières et les quatre postulats : 3,3 à 3,8 cartes d'époque par
  # saison, une dans 100 % des premières saisons, et la première au créneau 3
  # en médiane — donc toujours dans les douze premiers créneaux (94-100 %).
  # Le premier créneau réservé reste 3 et non 1 ou 2 : les slots 1 et 2 portent
  # les ancres de script des quatre postulats (bible ch. 10-15), et une
  # respiration posée devant l'ancre d'ouverture décalerait toute la file.
  nouvelle_slots: { entraineur: [3, 6, 9, 13], joueur: [3, 7, 12, 15] }
  nouvelles_max: 4           # plafond de la bande 3-4 (§ 5.2) : la dette d'un quatrième créneau ne fait pas une cinquième Nouvelle
  gap_max: 2                 # cartes sans temps d'histoire tolérées d'affilée : 2 ⇒ écart max 3 entre temps d'histoire (spec variété §5.2) ; 3 → 2 avec le tirage de saison
  # 10 → 12 : une étape servie DANS sa fenêtre ne devient jamais échue. Le
  # quota bloquait la bande 2 en milieu de saison et la file finissait par
  # sortir en bande 6, trois entrées empilées (backlog P99 3 pour un plafond
  # de 2, § 5.2). Le taux d'étapes échues était bon : c'est l'empilement qu'on
  # dénoue, pas le retard.
  soft_steps_max: 12         # étapes servies en bande 2 par saison (les échues ne comptent pas) ; 8 → 10 → 12 (spec variété §2.9)
  min_active: 2              # maintainArcs ouvre tant qu'il y a moins d'arcs de premier plan
  max_active: 4              # forceStory n'ouvre pas au-delà ; 3 → 4 (la réserve peut s'ouvrir sur un trou de cadence)
  events_max: 1
  alarms_max: 3
  reactions_max: 4           # réactions (cartes hors créneau) par saison — étape 2
  unes_breves: 3             # brèves de la Une — étape 2
  journal_par_saison: 12     # compaction de l'Almanach — étape 2
  ouverture_ecart: 3         # jamais deux ouvertures d'intrigue à moins de 3 slots (spec variété §1.2)
  # Créneaux laissés à la première étape d'une intrigue tirée au réservoir
  # avant qu'elle ne soit échue. C'était la constante 2 de `_drawProgramme` :
  # trois intrigues ouvertes dans une fenêtre [1,13] arrivaient à échéance
  # presque ensemble et empilaient la file (backlog P99 3 en S0 et en S1 pour
  # un plafond de 2 ; le taux d'étapes échues, lui, était bon). Ce n'est pas du
  # retard en plus : c'est le même retard, étalé.
  # 5 → 7 (étape 8) : avec les réservoirs pleins des quatre postulats, cinq
  # créneaux ne suffisaient plus. Le promu gardait un backlog P99 de 3 (max 4)
  # en S0 et en S1 pour un plafond de 2, avec des empilements etape+etape+etape.
  # À 7, le P99 retombe à 2 sur les quatre postulats et le taux d'étapes échues
  # ne bouge pas (S0 13 %, S1 38 %, plafonds 60 % et 40 %).
  ouverture_echeance: 7
  phase_mult:
    mercato: { presaison: 4, hiver: 4, aller: 0.2, retour: 0.2 }
    moment:  { retour: 2 }
    famille: { hiver: 2 }
