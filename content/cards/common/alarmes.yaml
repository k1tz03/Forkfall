# Cartes d'alarme (référencées par alarms.yaml → kind alarme, stratégiques,
# cooldown 10). Chaque carte porte son propre seuil : si le joueur a redressé
# la barre avant l'échéance, elle expire en silence.
cards:
  # ---------------------------------------------------------------- entraîneur
  - id: en.alarme.vestiaire_bas_vukic
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: vukic
    when: "gauges.vestiaire < 25"
    # `{toi}` et non `{prenom}` : Vukić s'adresse à toi, il ne prononce pas
    # ton nom comme un tiers (spec § 1.8, budget « nom » § 5.3). Une alarme
    # peut revenir plusieurs fois dans une carrière, donc tomber contre une
    # autre carte nommée.
    text: "Vukić, devant le bus aux rideaux tirés : « Coup d'envoi dans cinquante minutes, {toi}. Ils ne descendent pas. Le capitaine dit qu'ils ne parleront qu'à toi. »"
    left: {label: "Je monte leur parler", effects: {vestiaire: "+++", direction: "-", journal: {text: "{annee} : vingt minutes dans le bus. Le chauffeur a pleuré, les autres sont descendus.", poids: 2, tags: [vestiaire]}}, answer: "Vingt minutes debout dans l'allée. Norbert pleure au volant ; ils descendent un par un, le capitaine en dernier."}
    right: {label: "Je les laisse dedans", effects: {vestiaire: "-", tribunes: "+", set: [bus_menace], react: en.re.vecchio_bus, journal: {text: "{annee} : le bus est reparti sans jouer. Le stade a sifflé le vide.", poids: 2, tags: [vestiaire]}}, answer: "Tu rentres au vestiaire sans eux. Le stade siffle un échauffement sans joueurs ; dans le bus, personne ne bouge."}

  - id: en.alarme.vestiaire_bas_vecchio
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: vecchio
    when: "gauges.vestiaire < 25"
    text: "Vecchio, sur le marchepied, gants sous le bras : « Ils ne descendent pas. La dernière fois que j'ai vu ça, le club a fermé l'été d'après. Monte, toi. Moi, je leur montre la marche. »"
    left: {label: "Je monte", effects: {vestiaire: "+++", direction: "-", relation: {vecchio: 1}, journal: {text: "{annee} : le bus. {nom} est monté{pg, select, f{e} other{}} ; Gigi Vecchio est descendu le premier.", poids: 2, tags: [vestiaire]}}, answer: "Gigi descend le premier, gants sous le bras. Derrière lui, les autres descendent sans te regarder."}
    right: {label: "Je les laisse dedans", effects: {vestiaire: "-", tribunes: "+", set: [bus_menace], journal: {text: "{annee} : le bus est resté fermé. Gigi Vecchio est descendu seul, gants sous le bras.", poids: 2, tags: [vestiaire]}}, answer: "Gigi descend seul et s'assoit sur le muret du parking. Il attend un coup d'envoi qui ne vient pas."}

  - id: en.alarme.vestiaire_haut_brehaut
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: brehaut
    when: "gauges.vestiaire > 75"
    text: "Bréhaut, le brassard roulé dans la main : « Les gars t'appellent par ton prénom devant le président. Trois fois samedi, je les ai comptées. Lui aussi, il les a comptées. »"
    left: {label: "Je remets de la distance", effects: {vestiaire: "--", direction: "+", journal: {text: "{annee} : retour au vouvoiement dans le vestiaire. Quelqu'un a ri, puis plus personne.", poids: 1, tags: [vestiaire]}}, answer: "Retour au vouvoiement. Quelqu'un rit, puis plus personne."}
    right: {label: "On est une famille", effects: {vestiaire: "+", direction: "--", journal: {text: "{annee} : « On est une famille », a dit {nom}. Le président a appris qu'il n'en était pas.", poids: 2, tags: [vestiaire, direction]}}, answer: "Bréhaut le répète au président le soir même, mot pour mot. Le président retient qu'il n'est pas de la famille."}

  - id: en.alarme.tribunes_bas_gege
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes]
    speaker: gege
    when: "gauges.tribunes < 25"
    text: "Gégé, les mains dans les poches : « Le virage n'a pas chanté de la seconde mi-temps, {toi}. Personne n'a sorti le mégaphone. Mon père appelait ça le silence d'avant la bâche. »"
    left: {label: "Je m'explique au local", effects: {tribunes: "+++", direction: "-", relation: {gege: 1}, journal: {text: "{annee} : deux heures au local pour un virage qui s'était tu. Le mégaphone est ressorti le samedi.", poids: 2, tags: [ultras, tribunes]}}, answer: "Deux heures au local. Le mégaphone ressort samedi ; il n'est pas encore accordé."}
    right: {label: "Je réponds sur le terrain", effects: {tribunes: "-", force: 2, journal: {text: "{annee} : le virage s'est tu deux journées. {nom} a répondu par le terrain ; Gégé a compté les journées.", poids: 2, tags: [ultras, tribunes]}}, answer: "Il hausse les épaules. Le virage se tait encore deux journées, puis il compte."}

  - id: en.alarme.tribunes_haut_gege
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes]
    speaker: gege
    tone: leger
    when: "gauges.tribunes > 75"
    text: "Gégé, de la peinture verte jusqu'aux coudes : « Le vestiaire est aux couleurs du virage depuis cette nuit. Deux couches. Le gardien de nuit nous a ouvert ; la clé, on l'a gardée. »"
    left: {label: "Je fais tout repeindre", effects: {tribunes: "--", vestiaire: "+", journal: {text: "{annee} : le virage a repeint le vestiaire la nuit. Deux couches de blanc le lundi.", poids: 1, tags: [ultras, vestiaire]}}, answer: "Deux couches de blanc lundi. Le virage note ceux qui ont tenu le rouleau."}
    right: {label: "Je laisse leurs couleurs", effects: {tribunes: "+", vestiaire: "--", set: [otage_kop], journal: {text: "{annee} : le vestiaire aux couleurs du virage. Bréhaut a retrouvé son casier en vert.", poids: 2, tags: [ultras, vestiaire]}}, answer: "Bréhaut retrouve son casier en vert. Il ne demande pas qui avait la clé."}

  - id: en.alarme.tribunes_haut_vukic
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes]
    speaker: vukic
    tone: leger
    when: "gauges.tribunes > 75"
    text: "Vukić, à sept heures, la main encore sur la poignée : « Le vestiaire est vert, {toi}. Murs, bancs, casiers. Le gardien de nuit dit qu'il dormait. Il a de la peinture sous les ongles. »"
    left: {label: "Je fais tout repeindre", effects: {tribunes: "--", vestiaire: "+", journal: {text: "{annee} : le virage a repeint le vestiaire la nuit. Deux couches de blanc le lundi.", poids: 1, tags: [ultras, vestiaire]}}, answer: "Deux couches de blanc lundi. Le virage note ceux qui ont tenu le rouleau."}
    right: {label: "Je laisse leurs couleurs", effects: {tribunes: "+", vestiaire: "--", set: [otage_kop], journal: {text: "{annee} : le vestiaire aux couleurs du virage. Bréhaut a retrouvé son casier en vert.", poids: 2, tags: [ultras, vestiaire]}}, answer: "Bréhaut retrouve son casier en vert. Il ne demande pas qui avait la clé."}

  - id: en.alarme.direction_bas_josiane
    roles: [entraineur]
    arc: direction
    tags: [direction]
    speaker: josiane
    when: "gauges.direction < 25"
    text: "Madame Josiane pose une deuxième tasse sur ton bureau, sans qu'on la lui ait demandée : « Le président m'a demandé votre numéro de fax personnel, {toi}. Il ne le demande qu'à ceux qui partent. »"
    left: {label: "Je force sa porte ce soir", effects: {direction: "+++", vestiaire: "-", journal: {text: "{annee} : une heure dans le bureau du président. Il n'a rien signé ; il a resservi un café à {nom}.", poids: 2, tags: [direction]}}, answer: "Une heure de bureau. Il ne signe rien, mais il te ressert un café."}
    right: {label: "Je lui donne le numéro", effects: {direction: "-", tribunes: "+", parole: -1, journal: {text: "{annee} : le président a demandé le numéro de fax de {nom}. Trois lignes ; la quatrième signait.", poids: 2, tags: [direction]}}, answer: "Le fax arrive le lendemain : trois lignes, puis une signature."}

  - id: en.alarme.direction_haut_aulard
    roles: [entraineur]
    arc: direction
    tags: [direction]
    speaker: aulard
    when: "gauges.direction > 75"
    text: "Vaubourg, une plaque en laiton sous le bras : « Directeur du Développement International, {toi}. Un bureau au deuxième, une secrétaire, le double de ton salaire. Le banc, on le confie à ton adjoint. »"
    left: {label: "J'accepte le titre", effects: {direction: "--", caisse: "+", journal: {text: "{annee} : {nom}, Directeur du Développement International. Le bureau existe, la fenêtre non.", poids: 2, tags: [direction, absurde]}}, answer: "Le bureau du deuxième n'a pas de fenêtre. Le vestiaire apprend la nouvelle par la plaque sur la porte."}
    right: {label: "Je reste sur le banc", effects: {direction: "---", vestiaire: "++", journal: {text: "{annee} : {nom} a refusé le placard doré. Le président a rangé la plaque dans un tiroir.", poids: 2, tags: [direction]}}, answer: "Il range la plaque. Il la garde dans un tiroir, à ton nom."}

  - id: en.alarme.caisse_bas_josiane
    roles: [entraineur]
    arc: direction
    tags: [caisse]
    speaker: josiane
    when: "gauges.caisse < 25"
    text: "Madame Josiane, un relevé à la main : « Le banquier a appelé. Deux fois. La deuxième, il a demandé combien coûtait votre indemnité, {toi}. »"
    left: {label: "On vend un joueur", effects: {caisse: "+++", vestiaire: "--", force: -3, journal: {text: "{annee} : un joueur vendu pour rassurer le banquier. Le vestiaire a compté les casiers ; il en manquait un.", poids: 2, tags: [caisse, vestiaire]}}, answer: "Le vestiaire compte les casiers vides. Il en manque un."}
    right: {label: "Je décale les salaires", effects: {caisse: "-", direction: "+", set: [salaires_retard], journal: {text: "{annee} : les salaires sont partis le 12 au lieu du 1er. Personne n'a rien dit. Encore.", poids: 2, tags: [caisse, vestiaire]}}, answer: "Les salaires partent le 12 au lieu du 1er. Personne ne dit rien. Encore."}

  - id: en.alarme.caisse_haut_meneche
    roles: [entraineur]
    arc: presse
    tags: [presse, caisse]
    speaker: meneche
    when: "gauges.caisse > 75"
    text: "Massenet, le carnet à spirale ouvert sur une page déjà pleine : « Votre caisse a doublé depuis l'été, {toi}. La Commission des comptes m'a appelé pour savoir d'où. Vous me le dites, je vous dis qui. »"
    left: {label: "Je dis : un mécène", effects: {caisse: "--", direction: "+", journal: {text: "{annee} : « Un mécène », a répondu {nom} à Massenet. Il a souligné le mot deux fois.", poids: 1, tags: [presse, caisse]}}, answer: "Il note « mécène ». Il souligne deux fois."}
    right: {label: "Ça ne vous regarde pas", effects: {caisse: "+", tribunes: "-", relation: {meneche: -1}, journal: {text: "{annee} : d'où vient l'argent ? « Ça ne vous regarde pas. » Massenet a noté le silence.", poids: 1, tags: [presse, caisse]}}, answer: "Il écrit « silence » dans la marge. Trois jours plus tard, le mot est dans le titre de sa chronique."}

  # ------------------------------------------------------------------- joueur
  - id: jp.alarme.vestiaire_bas_brehaut
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: brehaut
    when: "gauges.vestiaire < 25"
    text: "Bréhaut, en laçant sa chaussure : « Au toro ce matin, tu as touché trois ballons en vingt minutes. Je les ai comptés. Les gars ne te les donnent plus, et ce n'est pas moi qui leur ai dit. »"
    left: {label: "Je paie ma tournée", effects: {vestiaire: "+++", caisse: "-"}, answer: "Trois tournées au bar d'en face. Le lendemain, au toro, Bréhaut te donne le premier ballon, devant tout le monde."}
    right: {label: "Je joue pour moi", effects: {vestiaire: "-", tribunes: "+"}, answer: "Tu marques en solitaire. Personne ne vient te féliciter."}

  - id: jp.alarme.vestiaire_haut_brehaut
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: brehaut
    when: "gauges.vestiaire > 75"
    text: "Bréhaut, le brassard jaune roulé dans la main : « Quatorze gars veulent te le donner. J'ai compté. Moi, je le porte depuis six ans, et je compte aussi. »"
    left: {label: "Garde-le, Titi", effects: {vestiaire: "--", direction: "+", relation: {brehaut: 1}}, answer: "Il remet le brassard. Il te serre la main, un peu trop fort."}
    right: {label: "Je le prends", effects: {vestiaire: "+", direction: "--", relation: {brehaut: -2}, set: [capitaine]}, answer: "Le vestiaire applaudit. Bréhaut applaudit aussi, deux fois, puis va s'asseoir à l'autre bout du banc."}

  - id: jp.alarme.tribunes_bas_gege
    roles: [joueur]
    arc: ultras
    tags: [ultras, tribunes]
    speaker: gege
    when: "gauges.tribunes < 25"
    text: "Gégé, derrière la grille, pendant que tu t'étires : « On te siffle à l'échauffement, {toi}. Pour l'instant. On s'entraîne pour le parking. »"
    left: {label: "Je viens au local", effects: {tribunes: "+++", vestiaire: "-"}, answer: "Deux bières et une chanson. À ton nom, cette fois."}
    right: {label: "Ils sifflent, je marque", effects: {tribunes: "-", force: 2}, answer: "Tu marques. Le virage siffle plus fort."}

  - id: jp.alarme.tribunes_haut_lea
    roles: [joueur]
    arc: presse
    tags: [presse, tribunes]
    speaker: lea
    when: "gauges.tribunes > 75"
    text: "Léa, le carnet ouvert, à la sortie de l'entraînement : « Six tournages publicitaires en un mois, dont deux un jour de séance. J'ai les dates du concessionnaire. Vous répondez avant que j'écrive ? »"
    left: {label: "J'annule deux tournages", effects: {tribunes: "--", vestiaire: "+", caisse: "-"}, answer: "Fardelli rappelle deux annonceurs pour s'excuser et ne te parle plus de la semaine. Le coach te rend ta place à l'entraînement."}
    right: {label: "Je tourne le spot suivant", effects: {tribunes: "+", direction: "--", caisse: "+"}, answer: "Le lendemain, L'Écho titre « L'homme-sandwich ». Fardelli encadre la page dans son bureau."}

  - id: jp.alarme.direction_bas_vukic
    roles: [joueur]
    arc: direction
    tags: [direction]
    speaker: vukic
    when: "gauges.direction < 25"
    text: "Vukić, en te croisant dans le couloir : « Le coach a fait faire ta carte d'accès pour dimanche. Tribune Est, place 14B. Pas le banc, {toi}. »"
    left: {label: "Je frappe à sa porte", effects: {direction: "+++", vestiaire: "-"}, answer: "Vingt minutes de bureau. Tu ressors titulaire, et détesté{pg, select, f{e} other{}}."}
    right: {label: "Je prends la 14B", effects: {direction: "-", tribunes: "+"}, answer: "Tu vois le match depuis la 14B. La dame de la 14A t'offre un quartier d'orange et ne te demande rien."}

  - id: jp.alarme.direction_haut_vukic
    roles: [joueur]
    arc: direction
    tags: [direction]
    speaker: vukic
    when: "gauges.direction > 75"
    text: "Vukić, en rangeant les ballons dans le filet : « Le coach a signé pour l'an prochain dans un club de deuxième division, à six cents kilomètres. Ton nom est dans son contrat. Tu le savais ? »"
    left: {label: "Je reste ici", effects: {direction: "--", tribunes: "+"}, answer: "Le coach part seul en juin. Au bureau, on ne te sourit plus ; en tribune, on applaudit ton nom."}
    right: {label: "Je le suis", effects: {direction: "---", caisse: "++", vestiaire: "-"}, answer: "Six cents kilomètres, un salaire doublé. Le coach t'aime toujours ; là-bas, le vestiaire t'appelle « l'enfant du coach »."}

  - id: jp.alarme.caisse_bas_fardelli
    roles: [joueur]
    arc: mercato
    tags: [agents, caisse]
    speaker: fardelli
    when: "gauges.caisse < 25"
    text: "Fardelli, au téléphone d'un bar : « Ton compte est à découvert depuis le 3, {toi}. J'ai un ami qui cherche un visage pour une canette, et un ami qui rachète les voitures. Lequel ? »"
    left: {label: "Je prête mon visage", effects: {caisse: "+++", tribunes: "-"}, answer: "Ton visage sur une canette orange que tu n'as jamais goûtée. Elle est dans tous les distributeurs du stade."}
    right: {label: "Je vends la voiture", effects: {caisse: "+", vestiaire: "-"}, answer: "Le garagiste paie en liquide, moins que prévu. Tu viens à l'entraînement par la ligne 4 ; personne ne le dit, tout le monde l'a vu."}

  - id: jp.alarme.caisse_haut_fardelli
    roles: [joueur]
    arc: mercato
    tags: [agents, caisse, scandale]
    speaker: fardelli
    when: "gauges.caisse > 75"
    text: "Fardelli, sur le siège passager de ta voiture neuve : « Ton cousin a une société pour ton image, aux îles. Moi, je ne sais rien, {toi}. Je dis juste que le fisc lit les contrats d'image. »"
    left: {label: "Je déclare tout", effects: {caisse: "--", direction: "+"}, answer: "Tu déclares tout. Le cousin ne te rappelle plus ; l'inspecteur des impôts te salue au marché, le dimanche."}
    right: {label: "Je laisse faire le cousin", effects: {caisse: "+", relation: {fardelli: 1}, set: [offshore]}, answer: "Le cousin ouvre une société. Aux îles. Tu ne sais pas lesquelles."}

  # ═══════════════════════════════════════════════════════════════════════════
  # Les troisièmes porteurs (bible ch. 30 § 2.2 et § 2.3). Les dix-huit cartes
  # ci-dessus sont les porteurs 1 et 2 ; la bible ne les réécrit pas, elle leur
  # ajoute le porteur tardif — celui qui parle en saison 2, ou quand une trace
  # est posée. Jamais de drame, jamais de `end:` : une main courante, pas une
  # chute. Une sortie soulage la jauge, l'autre la creuse en payant ailleurs.
  # Écarts d'import : Rouvier (kiné) → Sabatier, Vialat (Commission) → Ilyas,
  # Dembo → Mbako, Paulette (place 14B) → Vecchio — ces quatre visages
  # n'existent pas encore dans content/characters.yaml.
  # ═══════════════════════════════════════════════════════════════════════════

  # ------------------------------------------- entraîneur · vestiaire, porteur 3
  - id: en.alarme.vestiaire_bas_sabatier
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: sabatier
    when: "gauges.vestiaire < 25"
    text: "Sabatier, les lunettes sur le front, la porte des soins ouverte : « Quatre allongés depuis neuf heures, {toi}. Pas une contracture, pas un hématome. Ils ne veulent pas aller à votre séance. »"
    left: {label: "Je vais les voir", effects: {vestiaire: "+++", direction: "-", journal: {text: "{annee} : deux heures assis par terre dans la salle de soins. La table s'est vidée toute seule.", poids: 2, tags: [vestiaire]}}, answer: "Tu t'assois par terre dans la salle de soins. Ça dure deux heures."}
    right: {label: "Je les sors de la table", effects: {vestiaire: "-", force: 2, journal: {text: "{annee} : quatre joueurs sortis de l'infirmerie en un matin. Officiellement, ils n'avaient rien.", poids: 1, tags: [vestiaire]}}, answer: "La table se vide en cinq minutes. Le Doc écrit quatre noms dans le carnet du tiroir, sans diagnostic."}

  # -------------------------------------------- entraîneur · tribunes, porteur 3
  - id: en.alarme.tribunes_haut_meneche
    roles: [entraineur]
    arc: presse
    tags: [presse, tribunes]
    speaker: meneche
    when: "gauges.tribunes > 75"
    text: "Massenet, le carnet fermé posé sur les genoux : « Samedi, le kop a chanté votre compo une heure avant que vous ne l'affichiez. Onze noms, dans l'ordre. Qui la leur a donnée, {toi} ? »"
    left: {label: "Je recadre en conférence", effects: {tribunes: "--", direction: "++", journal: {text: "{annee} : une phrase en conférence, sans nom. Le local l'a lue à voix haute le soir même.", poids: 2, tags: [presse, tribunes]}}, answer: "Une phrase, sans nom. Le local la lit à voix haute le soir."}
    right: {label: "Je laisse dire", effects: {tribunes: "+", direction: "-", journal: {text: "{annee} : « Qui compose ? » Le président a lu l'article et l'a posé sur la pile.", poids: 2, tags: [presse, direction]}}, answer: "Le président lit l'article et le pose sur la pile."}

  # ------------------------------------------ entraîneur · le président, porteur 3
  - id: en.alarme.direction_bas_camille
    roles: [entraineur]
    arc: famille
    tags: [famille, direction]
    speaker: camille
    when: "gauges.direction < 25 && !flag('divorce')"
    text: "Camille, sans lever les yeux du journal : « Un journaliste a appelé à sept heures. Il demandait si on cherchait un appartement ailleurs. La voisine demande déjà si on vend le buffet. »"
    left: {label: "Je rentre ce soir", effects: {direction: "+", vestiaire: "-", relation: {camille: 1}, journal: {text: "{annee} : un journaliste a appelé à la maison pour savoir si {nom} cherchait un appartement ailleurs.", poids: 2, tags: [famille, direction]}}, answer: "Tu dînes à la maison. Le téléphone sonne à neuf heures ; tu décroches, et tu dis au journaliste que tu restes."}
    right: {label: "Je reste au club", effects: {direction: "-", force: 2, relation: {camille: -1}, journal: {text: "{annee} : deux nuits au centre. Le gardien de nuit connaît le prénom du coach.", poids: 1, tags: [famille]}}, answer: "Tu dors au centre. Le gardien te connaît par ton prénom."}

  # --------------------------------------------- entraîneur · le budget, porteur 3
  - id: en.alarme.caisse_haut_nassir
    roles: [entraineur]
    arc: direction
    tags: [caisse, direction]
    speaker: nassir
    when: "gauges.caisse > 75"
    text: "Ilyas déplie un tableau de trois feuilles scotchées : « Masse salariale doublée, billetterie stable. La Commission écrit aux clubs qui ont ce profil, {toi}. Le fonds préfère écrire avant elle. »"
    left: {label: "Je rends deux recrues", effects: {caisse: "--", vestiaire: "-", journal: {text: "{annee} : deux recrues rendues avant janvier. Le vestiaire a compté les absents avant le club.", poids: 2, tags: [caisse, vestiaire]}}, answer: "Deux valises repartent. Le vestiaire compte les absents."}
    right: {label: "Je dépense tout", effects: {caisse: "+", direction: "-", set: [fede_dossier], journal: {text: "{annee} : la lettre est arrivée un mardi, avec accusé de réception, au nom de {nom}.", poids: 3, tags: [caisse, direction]}}, answer: "La lettre arrive un mardi, avec accusé de réception."}

  # ----------------------------------------------- joueur · vestiaire, porteur 3
  - id: jp.alarme.vestiaire_bas_mbako
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: mbako
    when: "gauges.vestiaire < 25"
    text: "Mbako, le ballon calé sous le bras : « Trois semaines que tu tires au lieu de passer. Jeudi, les gars ne te donnent plus rien. Ils m'ont demandé de faire pareil. »"
    left: {label: "Je joue pour l'équipe", effects: {vestiaire: "+++", force: -2, journal: {text: "{annee} : deux passes en retrait pour le petit. Il a marqué, et il a montré {nom} du doigt.", poids: 2, tags: [vestiaire, formation]}}, answer: "Deux passes en retrait. Il marque et te montre du doigt."}
    right: {label: "Je continue comme ça", effects: {vestiaire: "-", tribunes: "+", journal: {text: "{annee} : encore un but tout seul. Le toro se fait sans lui depuis un mois.", poids: 1, tags: [vestiaire]}}, answer: "Tu marques encore. Le toro se fait sans toi."}

  # ------------------------------------------------ joueur · tribunes, porteur 3
  - id: jp.alarme.tribunes_bas_vecchio
    roles: [joueur]
    arc: vestiaire
    tags: [tribunes, vestiaire]
    speaker: vecchio
    when: "gauges.tribunes < 25"
    text: "Vecchio, seul sur le banc de touche : « En soixante-dix-huit, ils ont sifflé un ailier trois dimanches de suite. Le quatrième, il n'est pas venu. Moi, je ne siffle personne, {toi}. Là, j'ai envie. »"
    left: {label: "Raconte-moi l'ailier", effects: {tribunes: "++", vestiaire: "+", relation: {vecchio: 1}, journal: {text: "{annee} : une heure avec le vieux gardien après l'entraînement. Il n'a pas parlé du sifflet.", poids: 2, tags: [tribunes, vestiaire]}}, answer: "Il raconte une heure : l'ailier tient un tabac à Puymarin et ne va plus au stade. Gigi ne parle pas du sifflet."}
    right: {label: "Je fais mon match", effects: {tribunes: "-", force: 2, journal: {text: "{annee} : Gigi Vecchio a rangé ses gants à la mi-temps, comme d'habitude. Personne n'a relevé.", poids: 1, tags: [tribunes]}}, answer: "À la mi-temps, il range ses gants sans un mot. Le virage siffle encore ton nom ; lui ne siffle pas."}

  # -------------------------------------------------- joueur · le club, porteur 3
  - id: jp.alarme.direction_haut_josiane
    roles: [joueur]
    arc: direction
    tags: [direction]
    speaker: josiane
    when: "gauges.direction > 75"
    text: "Madame Josiane laisse un dossier ouvert sur le comptoir du secrétariat, à ton nom : « Douze notes du bureau en votre faveur, toutes datées. Le prochain entraîneur le lira avant de vous voir jouer. »"
    left: {label: "Je prends mes distances", effects: {direction: "-", vestiaire: "++", journal: {text: "{annee} : déjeuner au vestiaire, plus au bureau. Le bureau l'a remarqué le troisième jour.", poids: 1, tags: [direction, vestiaire]}}, answer: "Tu déjeunes au vestiaire. Le bureau le remarque."}
    right: {label: "Je reste au chaud", effects: {direction: "+", tribunes: "-", journal: {text: "{annee} : le bureau trouve {nom} parfait{pg, select, f{e} other{}}. Le vestiaire trouve ça drôle.", poids: 2, tags: [direction, vestiaire]}}, answer: "Le bureau te trouve parfait{pg, select, f{e} other{}}. Le vestiaire trouve ça drôle."}

  # --------------------------------------------------- joueur · compte, porteur 3
  - id: jp.alarme.caisse_haut_camille
    roles: [joueur]
    arc: famille
    tags: [famille, caisse]
    speaker: camille
    when: "gauges.caisse > 75 && !flag('divorce')"
    text: "Camille, les clés de la maison neuve à la main : « Celle-ci est payée, la deuxième aussi. Ton cousin a appelé pour une société aux îles, à ton nom. J'ai dit que tu rappellerais. »"
    left: {label: "Je ne rappelle pas", effects: {caisse: "-", relation: {camille: 1}, journal: {text: "{annee} : le cousin est vexé. Le compte de {nom} reste lisible par un humain.", poids: 1, tags: [famille, caisse]}}, answer: "Le cousin est vexé. Le compte reste lisible."}
    right: {label: "Je rappelle le cousin", effects: {caisse: "+", relation: {camille: -1}, set: [offshore], journal: {text: "{annee} : une société avec un joli nom et une adresse loin. Camille a demandé laquelle.", poids: 3, tags: [famille, caisse, scandale]}}, answer: "Une société au joli nom, une adresse loin. Camille demande laquelle ; tu ne sais pas."}
