# Camille, la cinquième jauge (bible §4.2 H). Aucun arc : une routine d'hiver,
# deux routines de fond, et les paliers de relation servis par `on_relation`
# (characters.yaml → camille) : −1 dispute, −2 chambre d'amis, −3 valise
# (pose `divorce`), +3 secours selon le métier tiré au start (camille_<metier>).
# La valise pose `divorce` **et** `char: {camille: {statut: parti}}` : le
# moteur écarte alors toutes ses cartes du tirage et purge ses entrées en file
# (spec variété §1.10). Le `!flag('divorce')` des cartes `famille` reste la
# ceinture ; le statut est la bretelle, et il couvre les cartes d'arc que les
# `when` avaient oubliées. Ce qui doit continuer d'exister après son départ le
# déclare : `co.camille.appel_de_loin` (ci-dessous) et les deux retrouvailles
# (`co.retrouvailles.camille_sourire` / `_noir`, `statut_ok: [parti, retraite]`).
cards:
  # ------------------------------------------------------------- routines
  # Le sapin et l'adjoint : un joueur n'a pas d'adjoint. Version joueur juste
  # dessous (« qui décide, qui possède »).
  - id: co.camille.noel
    roles: [entraineur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: leger
    cooldown: 30
    when: "season.phase == 'hiver' && !flag('divorce')"
    text: "Camille, au téléphone : « Le sapin attend dans l'entrée depuis midi. Ton adjoint aussi, avec son cahier ; il a refusé le vin chaud. C'est le vingt-quatre. »"
    left:
      label: "Je rentre"
      effects: {vestiaire: "-", relation: {camille: 1}}
      answer: "L'adjoint repart avec une part de bûche. Le sapin tient debout."
    right:
      label: "Après le match"
      effects: {vestiaire: "+", relation: {camille: -1}}
      answer: "Le 26, le sapin est encore dans l'entrée. Camille, non."

  - id: co.camille.noel_jp
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: leger
    cooldown: 30
    when: "season.phase == 'hiver' && !flag('divorce')"
    text: "Camille, en enjambant ton sac de match : « Le sapin est dans l'entrée, à côté de ton sac, qui n'a pas bougé depuis mardi. Ma mère arrive à sept heures. Elle va le voir, le sac. »"
    left:
      label: "Je rentre, et je vide le sac"
      effects: {vestiaire: "-", relation: {camille: 1}}
      answer: "Tu vides le sac. Il y a un maillot, deux chaussettes dépareillées et une orange de septembre."
    right:
      label: "Après le 26"
      effects: {vestiaire: "+", relation: {camille: -1}}
      answer: "Le 26, le sapin est décoré ; le sac est dessous, avec les cadeaux. Camille dit que ça fait un paquet de plus."

  - id: co.camille.anniversaire
    roles: [entraineur, joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: leger
    cooldown: 28
    when: "!flag('divorce')"
    text: "Camille, la robe déjà sur le lit : « J'ai réservé au restaurant du port pour vingt heures. Le président a appelé : il a réservé pour toi aussi, même heure, au club. C'est mon anniversaire. »"
    left:
      label: "La table pour deux"
      effects: {direction: "-", relation: {camille: 1}}
      answer: "Le président dîne avec ta chaise vide. Il la retient pour plus tard."
    right:
      label: "Le dîner du président"
      effects: {direction: "+", relation: {camille: -1}}
      answer: "Le restaurant garde la table jusqu'à vingt-trois heures. Camille aussi."

  - id: co.camille.dimanche
    roles: [entraineur, joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: leger
    cooldown: 26
    when: "!flag('divorce')"
    text: "Camille, la liste du marché aimantée sur le frigo : « Dimanche, le marché, la sieste, et toi. Les deux premiers, je les ai depuis trois ans. Le troisième, je l'écris au crayon. »"
    left:
      label: "Le dimanche est à toi"
      effects: {force: -1, relation: {camille: 1}}
      answer: "Le marché, la sieste, toi. Le vestiaire découvre un dimanche sans vidéo."
    right:
      label: "Dimanche, c'est vidéo"
      effects: {force: 1, relation: {camille: -1}}
      answer: "Trois heures de ralenti. À la maison, la sieste se fait à une place."

  # ---------------------------------------------- paliers (on_relation, once)
  # Les trois paliers **constatent**, ils n'aggravent pas : une sortie qui
  # rebaisserait la relation franchirait le seuil suivant dans la foulée et
  # enfilerait les trois cartes en trois swipes (dispute, chambre d'amis,
  # valise), sans un match entre elles. La droite coûte donc autre chose que
  # Camille, et la valise attend une saison : un couple ne se défait pas au
  # quatrième swipe d'une carrière.
  - id: co.camille.dispute
    roles: [entraineur, joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: leger
    once: true
    when: "!flag('divorce')"
    text: "Camille, la facture du chauffagiste sur la table : « Il est passé à quatorze heures, comme convenu. Toi aussi, tu avais convenu. J'ai payé, j'ai signé, j'ai dit que le club te gardait. Encore. »"
    left:
      label: "Je rentre tôt ce soir"
      effects: {direction: "-", relation: {camille: 1}}
      answer: "Tu rentres à sept heures. Le président appelle trois fois pendant le dîner ; tu ne décroches pas."
    right:
      label: "Je finis la vidéo d'abord"
      effects: {force: 1}
      answer: "Tu rentres à minuit. La facture est rangée, la cuisine aussi ; une seule assiette sèche sur l'égouttoir."

  - id: co.camille.chambre_amis
    roles: [entraineur, joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: strategique
    once: true
    when: "!flag('divorce')"
    text: "Camille, des draps propres sur les bras, devant la porte du fond : « J'ai fait le lit de la chambre d'amis. C'est pour toi. Pas pour un ami. »"
    left:
      label: "On se parle ce soir"
      effects: {vestiaire: "-", relation: {camille: 1}}
      answer: "Tu rates la séance vidéo. Le lit de la chambre d'amis reste fait, mais vide."
    right:
      label: "Après la saison"
      effects: {direction: "+"}
      answer: "Le lit est bien fait. Tu dors dedans jusqu'en juin, au moins."

  - id: co.camille.valise
    roles: [entraineur, joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: strategique
    once: true
    when: "!flag('divorce') && season >= 1"
    text: "Camille, le manteau déjà mis : « La valise est dans l'entrée. Elle est à moi. »"
    left:
      label: "Je regarde la valise"
      effects: {caisse: "--", set: [divorce], char: {camille: {statut: parti}}}
      answer: "La porte ne claque pas. C'est pire. L'avocat, lui, facture."
    right:
      label: "Je regarde la valise"
      effects: {caisse: "--", set: [divorce], char: {camille: {statut: parti}}}
      answer: "La porte ne claque pas. C'est pire. L'avocat, lui, facture."

  # ------------------------------------------- secours (+3, une par métier)
  - id: co.camille.secours_avocate
    roles: [entraineur, joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: strategique
    once: true
    when: "!flag('divorce')"
    text: "Camille, robe sur le bras : « Ta sanction, je l'ai lue. Elle a un vice de forme gros comme le stade. Je plaide demain, si tu veux. »"
    left:
      label: "Plaide"
      effects: {direction: "+++", relation: {camille: 1}}
      answer: "La commission annule tout en dix minutes. Elle rentre avant toi, pour une fois."
    right:
      label: "Je me débrouille"
      effects: {direction: "+", parole: 1}
      answer: "Tu négocies toi-même. La sanction tombe, à moitié. La robe retourne au placard."

  - id: co.camille.secours_journaliste
    roles: [entraineur, joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: strategique
    once: true
    when: "!flag('divorce')"
    text: "Camille, au téléphone : « Massenet a un papier sur toi pour demain. J'ai le rédacteur en chef en ligne. Je le bloque ? »"
    left:
      label: "Bloque-le"
      effects: {tribunes: "+++", relation: {meneche: -1, camille: 1}}
      answer: "Le papier ne paraît pas. Massenet sait qui a appelé ; il range son papier dans le tiroir du bas, celui qui ferme."
    right:
      label: "Laisse-le paraître"
      effects: {tribunes: "-", parole: 1, relation: {meneche: 1}}
      answer: "Le papier paraît. Massenet te trouve honnête. Camille ne dit rien du tout."

  - id: co.camille.secours_elue
    roles: [entraineur, joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: strategique
    once: true
    when: "!flag('divorce')"
    text: "Camille, écharpe pliée : « La subvention bloquée depuis mars, je l'ai fait passer au conseil ce soir. Aubert a voté contre. »"
    left:
      label: "Merci pour le club"
      effects: {caisse: "+++", relation: {camille: 1, aubert: -1}}
      answer: "La mairie vire la subvention le vendredi. Josiane la note dans le classeur, au nom de Camille, et pas au tien."
    right:
      label: "Ça va faire parler"
      effects: {caisse: "+", direction: "-"}
      answer: "La subvention passe, réduite. Le journal ne parle de rien. Camille non plus."

  - id: co.camille.secours_generique
    roles: [entraineur, joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: strategique
    once: true
    when: "!flag('divorce')"
    text: "Camille, sur le parking du stade, les clés de la voiture à la main : « J'ai invité tout le vestiaire dimanche. Un gratin pour vingt-deux. Je cuisine, tu te tais, ils parlent. »"
    left:
      label: "Je serai là avant eux"
      effects: {vestiaire: "++", relation: {camille: 1}}
      answer: "Vingt-deux parts de gratin. Bréhaut fait la vaisselle, et personne ne parle du match."
    right:
      label: "Je passe en fin de repas"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Ils sont partis à ton arrivée. Ils ont adoré. Camille range seule."

  # ---------------------------------------------- après la valise : à distance
  # Camille est partie (`statut: parti`) : elle ne parle plus « d'ici ». Cette
  # carte est la seule qui la fasse revenir, au téléphone, et elle le déclare
  # (`statut_ok`). Sans elle la cinquième jauge disparaît du jour au lendemain,
  # ce qui est faux : on ne cesse pas d'avoir quelqu'un à rappeler.
  - id: co.camille.appel_de_loin
    roles: [entraineur, joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: strategique
    cooldown: 26
    statut_ok: [parti, retraite]
    when: "flag('divorce')"
    text: "Camille, au téléphone, une porte qui se ferme derrière elle : « Il reste un carton à toi dans mon entrée. Tes coupures de presse et tes premiers crampons. Le propriétaire veut l'entrée vide samedi. »"
    left:
      label: "Je passe le prendre"
      effects: {direction: "-", relation: {camille: 1}}
      answer: "Le carton tient dans une main. Tu restes debout dans l'entrée onze minutes."
    right:
      label: "Garde-le, ou jette-le"
      effects: {vestiaire: "+", parole: -1}
      answer: "Elle ne jette rien. Le carton passe de l'entrée au garage, et il y reste."
