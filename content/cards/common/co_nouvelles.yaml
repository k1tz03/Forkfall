cards:
  # ---- Nouvelles du monde (flavor, deux labels « Encaisser », effet identique) ----
  # Retirées du sac par la spec § 1.5 « Corrections » : leurs jumelles datées
  # les remplacent et les datent — `co.nouvelle.droits_tele` → co.nv.1990_droits_tele,
  # `co.nouvelle.arret_contrats` → co.nv.1993_arret_vaneste, `co.nouvelle.fonds_voisins`
  # → co.nv.1999_fonds. Les garder ici faisait annoncer deux fois la même
  # nouvelle d'époque, et diluait le système de datation.
  # Relecture « répétitions » : deux héritées de plus tombaient dans le même
  # piège et sont retirées à leur tour — `co.nouvelle.equipementier_fluo`
  # (jumelle : co.nv.2021_quatre_sponsors, « quatre noms sur un maillot ») et
  # `co.nouvelle.record_transfert` (jumelle : co.nv.2028_milliard, « un joueur
  # transféré pour un milliard »). Deux constats sans année les remplacent :
  # le sac garde ses quatre Nouvelles intemporelles, secours des saisons où
  # aucune datée n'est éligible.
  # Datée 2016 par la bible ch. 20 § 3.3 : le texte, les libellés et l'effet ne
  # changent pas (charte § 6.1 n° 11) ; l'import ajoute `year`, `once` et la
  # trace de monde `monde_video`, lue par content/unes/monde.yaml.
  - id: co.nouvelle.arbitrage_video
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: meneche
    once: true
    year: 2016
    cooldown: 25
    text: "Massenet, en régie, devant douze écrans : « L'an prochain, un arbitre revoit les buts au ralenti, dans un camion derrière la tribune. Trois minutes de silence par but. On vendra les trois minutes. »"
    left: {label: "Je regarde l'écran", effects: {tribunes: "-", set: [monde_video]}, answer: "Au bar d'en face, on parie déjà sur le premier but que le camion annulera."}
    right: {label: "Je regarde l'écran", effects: {tribunes: "-", set: [monde_video]}, answer: "Au bar d'en face, on parie déjà sur le premier but que le camion annulera."}

  - id: co.nouvelle.coach_vire_ailleurs
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: meneche
    cooldown: 25
    text: "Massenet, au comptoir, la page des sports pliée : « Le Racing Nordique a viré son entraîneur hier soir, entre la soupe et le dessert. Vingt ans de maison. Son adjoint a fini le repas. »"
    left: {label: "Je replie le journal", effects: {vestiaire: "-"}, answer: "Le lendemain, quelqu'un a punaisé l'article dans le vestiaire, juste à côté du tableau de la compo."}
    right: {label: "Je replie le journal", effects: {vestiaire: "-"}, answer: "Le lendemain, quelqu'un a punaisé l'article dans le vestiaire, juste à côté du tableau de la compo."}

  # Deux Nouvelles intemporelles de remplacement : les héritées qui disaient déjà
  # ce que dit une datée ont été retirées (voir l'en-tête), et le sac a besoin de
  # quatre constats sans année pour les saisons où aucune datée n'est éligible.
  # Celles-ci ne datent rien : elles pourraient tomber en 1991 comme en 2044.
  - id: co.nouvelle.terrain_impraticable
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: legruet
    cooldown: 25
    text: "Berthomier, sur le perron de la Fédération, sous un parapluie qu'on lui tient : « Onze matchs reportés, et deux clubs jurent que leur pelouse était bonne. Je ferai étudier la question. En mars. »"
    left: {label: "Je reprends le calendrier", effects: {direction: "-"}, answer: "Ton match est replacé un mercredi soir, entre deux déplacements. Le président l'apprend par un fax de la Fédération."}
    right: {label: "Je reprends le calendrier", effects: {direction: "-"}, answer: "Ton match est replacé un mercredi soir, entre deux déplacements. Le président l'apprend par un fax de la Fédération."}

  - id: co.nouvelle.tribune_evacuee
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: lea
    cooldown: 25
    text: "Léa, au bord du terrain annexe : « À Terrenoire, samedi, une tribune évacuée à la mi-temps : une fissure. La commission de sécurité vient chez vous jeudi. Je le tiens de la préfecture. »"
    left: {label: "J'attends jeudi", effects: {tribunes: "-"}, answer: "Jeudi, deux hommes en casque ferment trois rangées de la Nord au ruban rouge. Samedi, le virage chante serré."}
    right: {label: "J'attends jeudi", effects: {tribunes: "-"}, answer: "Jeudi, deux hommes en casque ferment trois rangées de la Nord au ruban rouge. Samedi, le virage chante serré."}

  - id: co.nouvelle.tout_assis
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, ultras]
    speaker: aulard
    cooldown: 25
    text: "Vaubourg, une circulaire de la Fédération à la main : « Tout-assis dans trois ans. Huit mille sièges numérotés dans le virage, à mes frais. Mon club paie, et c'est Gégé qui va crier. »"
    left: {label: "Je lis la circulaire", effects: {tribunes: "-"}, answer: "Le samedi suivant, le virage reste debout quatre-vingt-dix minutes, exprès. Une bâche dit « ASSIS, JAMAIS »."}
    right: {label: "Je lis la circulaire", effects: {tribunes: "-"}, answer: "Le samedi suivant, le virage reste debout quatre-vingt-dix minutes, exprès. Une bâche dit « ASSIS, JAMAIS »."}

  # ---- Rescue (une par jauge, côté bas ET côté haut) : vrais dilemmes, donc
  # cartes de routine à deux choix rangées sous leur thème, pas des Nouvelles ----
  # « Qui décide, qui possède » : vendre le parking du stade, c'est le club. La
  # jauge « caisse » du joueur est son compte en banque, pas la caisse du club :
  # sa version parle de ce qu'il a, lui.
  - id: co.nouvelle.caisse_a_sec
    roles: [entraineur]
    arc: caisse
    tags: [rescue:caisse, direction]
    speaker: josiane
    cooldown: 30
    when: "gauges.caisse < 25"
    text: "Madame Josiane, le ticket de l'épicerie à la main : « Les oranges de la mi-temps, je les paie de ma poche depuis trois semaines. Un promoteur a appelé pour le parking du stade. Il rappelle lundi. »"
    left: {label: "Je vends le parking", effects: {caisse: "+++", tribunes: "--"}, answer: "Une palissade autour du parking en huit jours. Les abonnés tournent trois fois dans le quartier avant de se garer."}
    right: {label: "Je garde le parking", effects: {tribunes: "+", caisse: "-"}, answer: "Tu dis non au promoteur. Josiane paie encore les oranges, et range les tickets dans une enveloppe à ton nom."}

  - id: co.nouvelle.caisse_a_sec_jp
    roles: [joueur]
    arc: caisse
    tags: [rescue:caisse, agents]
    speaker: fardelli
    cooldown: 30
    when: "gauges.caisse < 25"
    text: "Fardelli, adossé au capot de sa voiture : « Ton compte est vide et ta prime tombe en avril. Un ami concessionnaire veut ton visage sur une affiche. Deux heures, un mardi. »"
    left: {label: "Deux heures un mardi", effects: {caisse: "+++", tribunes: "-", relation: {fardelli: 1}}, answer: "L'affiche reste six ans à l'entrée de la ville. On te klaxonne dessous, et pas toujours pour te saluer."}
    right: {label: "Je tiens jusqu'en avril", effects: {caisse: "-", vestiaire: "+", parole: 1}, answer: "Tu tiens jusqu'en avril. Tu manges au self du centre de formation ; les gamins te regardent faire la queue."}

  - id: co.nouvelle.trop_plein_caisse
    roles: [entraineur]
    arc: caisse
    tags: [rescue:caisse, retorse]
    speaker: aulard
    cooldown: 30
    when: "gauges.caisse > 75"
    text: "Vaubourg, le téléphone coincé contre l'épaule : « La caisse déborde, et la Commission des comptes regarde les clubs trop riches. Fardelli a une star pour jeudi, mon banquier un placement. Choisis. »"
    left: {label: "On signe une star", effects: {caisse: "---", force: "+", tribunes: "+"}, answer: "La star descend du train de onze heures jeudi. Le virage l'attend sur le quai, avec une bâche à son nom."}
    right: {label: "Je laisse dormir l'argent", effects: {direction: "+", caisse: "-"}, answer: "L'argent dort sur un compte à terme. La Commission ne trouve rien à redire, pour cette année."}

  - id: co.nouvelle.trop_plein_caisse_jp
    roles: [joueur]
    arc: caisse
    tags: [rescue:caisse, retorse]
    speaker: fardelli
    cooldown: 30
    when: "gauges.caisse > 75"
    text: "Fardelli, une brochure sur papier glacé à la main : « Ton compte déborde, et c'est le genre de compte que le fisc aime lire. Un ami à moi monte des sociétés pour l'image. Ou tu laisses dormir. »"
    left: {label: "On monte la société", effects: {caisse: "---", direction: "+", parole: -1}, answer: "La société a un nom d'oiseau et une adresse au bord d'une mer que tu n'as jamais vue."}
    right: {label: "Je laisse dormir", effects: {caisse: "-", vestiaire: "+"}, answer: "Ça dort. Ça rapporte trois pour cent, et personne ne t'écrit."}

  - id: co.nouvelle.conseil_veut_ta_tete
    roles: [entraineur, joueur]
    arc: direction
    tags: [rescue:direction, retorse]
    speaker: aulard
    cooldown: 30
    when: "gauges.direction < 25"
    text: "Vaubourg, entre deux portes, le manteau sur l'épaule : « Le conseil a demandé ta tête mardi, et encore jeudi. Samedi, tu me serres la main devant Télé-Stade, longtemps. Ça me fait un mois. »"
    left: {label: "Je serre la main", effects: {direction: "+++", vestiaire: "-"}, answer: "Le vestiaire voit la poignée de main au journal du soir. Le lendemain, à la douche, on en parle sans toi."}
    right: {label: "Je refuse la photo", effects: {direction: "-", vestiaire: "+"}, answer: "Tu passes devant la caméra sans t'arrêter. Le vestiaire l'a vu ; Vaubourg aussi, et il compte en semaines."}

  - id: co.nouvelle.creature_du_president
    roles: [entraineur, joueur]
    arc: direction
    tags: [rescue:direction]
    speaker: josiane
    cooldown: 30
    when: "gauges.direction > 75"
    text: "Madame Josiane, en te tendant le courrier : « Le président a dit « mon enfant » en parlant de vous, hier, au dîner des partenaires. Trois personnes me l'ont répété ce matin. Pas pour vous féliciter. »"
    left: {label: "Je prends mes distances", effects: {direction: "--", vestiaire: "+"}, answer: "Tu déclines le dîner suivant. Le président le remarque ; le vestiaire aussi, et il te parle un peu plus fort."}
    right: {label: "Je reste son chouchou", effects: {direction: "+", caisse: "+"}, answer: "Au dîner suivant, tu es à sa droite. Le lendemain, ta prime arrive avant celle des autres."}

  - id: co.nouvelle.vestiaire_en_feu
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [rescue:vestiaire]
    speaker: sabatier
    cooldown: 30
    when: "gauges.vestiaire < 25"
    text: "Doc Sabatier, les gants encore tachés : « Six points à l'arcade, ce matin, sous la douche. Deux clans. Celui qui a frappé portait une alliance ; je l'ai vu à la plaie. »"
    left: {label: "Trois jours de stage", effects: {vestiaire: "+++", force: "+", caisse: "-"}, answer: "Trois jours dans un camp militaire, sous la pluie. Au retour, les deux clans portent le même sac, et ça tient."}
    right: {label: "Je laisse retomber", effects: {vestiaire: "-", tribunes: "+"}, answer: "Ça retombe, en surface. À la séance suivante, personne ne passe le ballon à celui qui a frappé."}

  - id: co.nouvelle.vestiaire_trop_calin
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [rescue:vestiaire]
    speaker: sabatier
    cooldown: 30
    when: "gauges.vestiaire > 75"
    text: "Doc Sabatier, le chronomètre dans la main : « Tests de mercredi : onze gars plus lents qu'en août, et ils rient en arrivant. Les corps se reposent, {toi}. Un exemple réveillerait les autres. »"
    left: {label: "Je désigne un coupable", effects: {vestiaire: "--", force: "+"}, answer: "Un nom remonte jusqu'au bureau. Les autres courent ; celui-là ne parle plus à personne jusqu'à Noël."}
    right: {label: "Je ne touche à rien", effects: {vestiaire: "+", force: "-"}, answer: "Le vestiaire rit encore samedi, et prend deux buts dans le dernier quart d'heure. Personne n'arrête de rire."}

  - id: co.nouvelle.stade_se_vide
    roles: [entraineur, joueur]
    arc: tribunes
    tags: [rescue:tribunes, presse]
    speaker: meneche
    cooldown: 30
    when: "gauges.tribunes < 25"
    text: "Massenet, le stylo sur une page blanche : « Huit mille places vides, et votre nom sifflé avant le coup d'envoi. Donnez-moi votre enfance, une larme. Je vous rends le virage en une page. »"
    left: {label: "Je donne l'exclu", effects: {tribunes: "+++", direction: "-"}, answer: "Deux pages, une photo de toi enfant. Le virage applaudit dimanche ; le président n'aime pas lire ta vie dans le journal."}
    right: {label: "Je refuse tout net", effects: {tribunes: "-", direction: "+"}, answer: "Massenet referme le carnet sans rien écrire. Dimanche, sa chronique compte les places vides, une par une."}

  - id: co.nouvelle.ultras_gouvernent
    roles: [entraineur, joueur]
    arc: tribunes
    tags: [rescue:tribunes, ultras]
    speaker: meneche
    cooldown: 30
    # Doublonne l'alarme tribunes haute et D2 « le onze du virage » : après l'arc du kop seulement.
    when: "gauges.tribunes > 75 && arc('en.kop_qui_aime_trop') == 'done'"
    text: "Massenet, appuyé à ta voiture : « Mardi, le kop a voté la compo au local, à la craie. Samedi, l'équipe alignée était la même, à un nom près. J'ai la photo du mur. Elle sort lundi. »"
    left: {label: "Je recadre le kop", effects: {tribunes: "--", direction: "+"}, answer: "Tu effaces toi-même la craie du local, sans aide. Lundi, la photo sort quand même ; L'Écho publie le mur blanc à côté."}
    right: {label: "Je les laisse faire", effects: {tribunes: "+", vestiaire: "-"}, answer: "La photo paraît lundi. Le vestiaire la découpe et la colle sur le tableau tactique, par-dessus ta compo."}
