cards:
  # ---- Nouvelles du monde (flavor, deux labels « Encaisser », effet identique) ----
  # Retirées du sac par la spec § 1.5 « Corrections » : leurs jumelles datées
  # les remplacent et les datent — `co.nouvelle.droits_tele` → co.nv.1990_droits_tele,
  # `co.nouvelle.arret_contrats` → co.nv.1993_arret_vaneste, `co.nouvelle.fonds_voisins`
  # → co.nv.1999_fonds. Les garder ici faisait annoncer deux fois la même
  # nouvelle d'époque, et diluait le système de datation.
  # Relecture « répétitions » : deux héritées de plus tombaient dans le même
  # piège et sont retirées à leur tour — `co.nouvelle.equipementier_fluo`
  # (jumelle : co.nv.2021_quatre_sponsors, « quatre noms sur un maillot ») et
  # `co.nouvelle.record_transfert` (jumelle : co.nv.2028_milliard, « un joueur
  # transféré pour un milliard »). Deux constats sans année les remplacent :
  # le sac garde ses quatre Nouvelles intemporelles, secours des saisons où
  # aucune datée n'est éligible.
  # Datée 2016 par la bible ch. 20 § 3.3 : le texte, les libellés et l'effet ne
  # changent pas (charte § 6.1 n° 11) ; l'import ajoute `year`, `once` et la
  # trace de monde `monde_video`, lue par content/unes/monde.yaml.
  - id: co.nouvelle.arbitrage_video
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: meneche
    once: true
    year: 2016
    cooldown: 25
    text: "Massenet : « On va juger les buts au ralenti, avec des caméras. Trois minutes d'attente pour valider un corner. »"
    left: {label: "Noter", effects: {tribunes: "-", set: [monde_video]}}
    right: {label: "Noter", effects: {tribunes: "-", set: [monde_video]}}

  - id: co.nouvelle.coach_vire_ailleurs
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: meneche
    cooldown: 25
    text: "Massenet : « Le grand coach du Nord a sauté après une défaite. Vingt ans de maison, viré entre la soupe et le dessert. »"
    left: {label: "Compatir", effects: {vestiaire: "-"}}
    right: {label: "Compatir", effects: {vestiaire: "-"}}

  # Deux Nouvelles intemporelles de remplacement : les héritées qui disaient déjà
  # ce que dit une datée ont été retirées (voir l'en-tête), et le sac a besoin de
  # quatre constats sans année pour les saisons où aucune datée n'est éligible.
  # Celles-ci ne datent rien : elles pourraient tomber en 1991 comme en 2044.
  - id: co.nouvelle.terrain_impraticable
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: legruet
    cooldown: 25
    text: "Berthomier : « Onze matchs reportés le même week-end pour terrain impraticable, et deux clubs disent que le leur était bon. On verra ça après le Congrès. »"
    left: {label: "Prendre acte", effects: {direction: "-"}}
    right: {label: "Prendre acte", effects: {direction: "-"}}

  - id: co.nouvelle.tribune_evacuee
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: lea
    cooldown: 25
    text: "Léa : « Une tribune a été évacuée à la mi-temps dans un stade du championnat, sans un blessé et sans une image. Vous confirmez qu'on visite la vôtre ? »"
    left: {label: "Encaisser", effects: {tribunes: "-"}}
    right: {label: "Encaisser", effects: {tribunes: "-"}}

  - id: co.nouvelle.tout_assis
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, ultras]
    speaker: aulard
    cooldown: 25
    text: "Vaubourg : « On m'impose des stades tout-assis, fini les places debout. Mes ultras vont adorer, c'est certain. »"
    left: {label: "Ranger les banderoles", effects: {tribunes: "-"}}
    right: {label: "Ranger les banderoles", effects: {tribunes: "-"}}

  # ---- Rescue (une par jauge, côté bas ET côté haut) : vrais dilemmes, donc
  # cartes de routine à deux choix rangées sous leur thème, pas des Nouvelles ----
  # « Qui décide, qui possède » : vendre le parking du stade, c'est le club. La
  # jauge « caisse » du joueur est son compte en banque, pas la caisse du club :
  # sa version parle de ce qu'il a, lui.
  - id: co.nouvelle.caisse_a_sec
    roles: [entraineur]
    arc: caisse
    tags: [rescue:caisse, direction]
    speaker: josiane
    cooldown: 30
    when: "gauges.caisse < 25"
    text: "Josiane : « Plus un franc en caisse, je paie les oranges de ma poche. Un promoteur veut racheter le parking du stade. »"
    left: {label: "Je vends le parking", effects: {caisse: "+++", tribunes: "--"}, answer: "Les abonnés feront trois tours du quartier avant de se garer."}
    right: {label: "Je garde le parking", effects: {tribunes: "+", caisse: "-"}}

  - id: co.nouvelle.caisse_a_sec_jp
    roles: [joueur]
    arc: caisse
    tags: [rescue:caisse, agents]
    speaker: fardelli
    cooldown: 30
    when: "gauges.caisse < 25"
    text: "Fardelli, mon ami, le carnet ouvert : « Ton compte est à zéro et ta prime est en avril. Le concessionnaire veut ta tête sur une affiche, deux heures un mardi. »"
    left: {label: "Deux heures un mardi", effects: {caisse: "+++", tribunes: "-", relation: {fardelli: 1}}, answer: "L'affiche reste six ans à l'entrée de la ville. On te klaxonne dessous jusqu'en 2001."}
    right: {label: "Je tiens jusqu'en avril", effects: {caisse: "-", vestiaire: "+", parole: 1}, answer: "Tu tiens. Camille avance le loyer et ne le dit pas ; Josiane, si."}

  - id: co.nouvelle.trop_plein_caisse
    roles: [entraineur]
    arc: caisse
    tags: [rescue:caisse, retorse]
    speaker: aulard
    cooldown: 30
    when: "gauges.caisse > 75"
    text: "Vaubourg : « On croule sous le cash et la Commission de contrôle louche sur nos comptes. On claque tout sur une star, ou on planque ? »"
    left: {label: "On signe une star", effects: {caisse: "---", force: "+", tribunes: "+"}}
    right: {label: "On planque le magot", effects: {direction: "+", caisse: "-"}, answer: "Le magot dort au chaud. La Commission aussi, pour l'instant."}

  - id: co.nouvelle.trop_plein_caisse_jp
    roles: [joueur]
    arc: caisse
    tags: [rescue:caisse, retorse]
    speaker: fardelli
    cooldown: 30
    when: "gauges.caisse > 75"
    text: "Fardelli, mon ami, une brochure à la main : « Ton compte déborde et l'administration lit les comptes qui débordent. On monte une société pour l'image, ou tu laisses dormir ? »"
    left: {label: "On monte la société", effects: {caisse: "---", direction: "+", parole: -1}, answer: "La société a un nom d'oiseau et une adresse au bord d'une mer que tu n'as jamais vue."}
    right: {label: "Je laisse dormir", effects: {caisse: "-", vestiaire: "+"}, answer: "Ça dort. Ça rapporte trois pour cent, et personne ne t'écrit."}

  - id: co.nouvelle.conseil_veut_ta_tete
    roles: [entraineur, joueur]
    arc: direction
    tags: [rescue:direction, retorse]
    speaker: aulard
    cooldown: 30
    when: "gauges.direction < 25"
    text: "Vaubourg : « Le conseil réclame ta tête à chaque réunion. Une poignée de main devant les caméras et je te couvre encore un mois. »"
    left: {label: "Je serre la main", effects: {direction: "+++", vestiaire: "-"}, answer: "Le vestiaire t'a vu ramper. Il n'oubliera pas."}
    right: {label: "Je garde ma dignité", effects: {direction: "-", vestiaire: "+"}}

  - id: co.nouvelle.creature_du_president
    roles: [entraineur, joueur]
    arc: direction
    tags: [rescue:direction]
    speaker: josiane
    cooldown: 30
    when: "gauges.direction > 75"
    text: "Josiane : « Le président te présente comme son fils, et déjà tout le monde chuchote que tu es sa marionnette. Tu prends du recul ? »"
    left: {label: "Je prends mes distances", effects: {direction: "--", vestiaire: "+"}}
    right: {label: "Je reste son chouchou", effects: {direction: "+", caisse: "+"}}

  - id: co.nouvelle.vestiaire_en_feu
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [rescue:vestiaire]
    speaker: sabatier
    cooldown: 30
    when: "gauges.vestiaire < 25"
    text: "Doc Sabatier : « Deux clans se battent au vestiaire, j'ai recousu une arcade ce matin. Je propose un stage commando dans la boue. »"
    left: {label: "Stage dans la boue", effects: {vestiaire: "+++", force: "+", caisse: "-"}}
    right: {label: "On laisse retomber", effects: {vestiaire: "-", tribunes: "+"}}

  - id: co.nouvelle.vestiaire_trop_calin
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [rescue:vestiaire]
    speaker: sabatier
    cooldown: 30
    when: "gauges.vestiaire > 75"
    text: "Doc Sabatier : « Le vestiaire est un club de vacances, plus personne ne court aux tests. Il faut un bouc émissaire pour réveiller tout ça. »"
    left: {label: "Je désigne un coupable", effects: {vestiaire: "--", force: "+"}}
    right: {label: "On reste entre copains", effects: {vestiaire: "+", force: "-"}}

  - id: co.nouvelle.stade_se_vide
    roles: [entraineur, joueur]
    arc: tribunes
    tags: [rescue:tribunes, presse]
    speaker: meneche
    cooldown: 30
    when: "gauges.tribunes < 25"
    text: "Massenet : « Le stade sonne creux, on te siffle avant le coup d'envoi. Une exclu bien larmoyante et je te réhabilite en une. »"
    left: {label: "Je donne l'exclu", effects: {tribunes: "+++", direction: "-"}, answer: "L'article te sauve. Le président déteste lire ta vie privée."}
    right: {label: "Je refuse tout net", effects: {tribunes: "-", direction: "+"}}

  - id: co.nouvelle.ultras_gouvernent
    roles: [entraineur, joueur]
    arc: tribunes
    tags: [rescue:tribunes, ultras]
    speaker: meneche
    cooldown: 30
    # Doublonne l'alarme tribunes haute et D2 « le onze du virage » : après l'arc du kop seulement.
    when: "gauges.tribunes > 75 && arc('en.kop_qui_aime_trop') == 'done'"
    text: "Massenet : « Les ultras t'adorent au point de composer ton équipe. Un kop qui gouverne, ça finit toujours en prise d'otage. »"
    left: {label: "Je recadre le kop", effects: {tribunes: "--", direction: "+"}}
    right: {label: "Je les laisse faire", effects: {tribunes: "+", vestiaire: "-"}}
