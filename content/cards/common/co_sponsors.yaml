cards:
  - id: co.monde.chamelle
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [sponsors, absurde]
    speaker: nassir
    cooldown: 24
    text: "Ilyas pose une canette orange sur la table du vestiaire, sans la décapsuler : « Notre boisson sur le short, et un verre bu devant la caméra avant chaque match. Le contrat dit « bu », pas « tenu ». »"
    left: {label: "Pas de verre filmé", effects: {caisse: "--", tribunes: "+"}, answer: "Ilyas remet la canette dans sa poche. Le contrat part chez {rival} la semaine suivante, avec le verre."}
    right: {label: "Je signe pour le verre", effects: {caisse: "+++", vestiaire: "-", tribunes: "-"}, answer: "Le premier verre finit dans le seau, hors champ. La caméra exige une deuxième prise ; le vestiaire la boit en silence."}

  - id: co.monde.numero_surtaxe
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [sponsors, absurde]
    speaker: nassir
    cooldown: 22
    text: "Ilyas déplie un maillot neuf, un numéro de téléphone en lettres blanches sur la poitrine : « Chaque appel paie le club. Ceux d'en face appelleront pour vous insulter ; ils paieront aussi. »"
    left: {label: "Je refuse le maillot", effects: {caisse: "-", tribunes: "+"}, answer: "Ilyas replie le maillot. Gégé, qui a tout vu depuis le couloir, le raconte au local le soir même."}
    right: {label: "Je fais floquer le numéro", effects: {caisse: "++", tribunes: "-"}, answer: "Le numéro sonne toute la nuit du derby. Le virage d'en face a trouvé comment payer pour t'insulter."}

  - id: co.monde.arbitre_cousin
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [arbitrage, presse]
    speaker: meneche
    cooldown: 20
    text: "Massenet, une photocopie pliée dans la main : « L'arbitre de dimanche est le cousin par alliance du président d'en face. J'ai l'acte de mariage. On me dit que vous portez réclamation ? »"
    left: {label: "Je porte réclamation", effects: {tribunes: "+", direction: "-"}, answer: "Ta réclamation fait la une de L'Écho. La Fédération garde l'arbitre, et le président te reproche le bruit."}
    right: {label: "Je ne dis rien", effects: {direction: "+", tribunes: "-"}, answer: "Massenet écrit que tu as peur. Dimanche, l'arbitre te salue à l'échauffement, un peu trop longtemps."}

  - id: co.monde.arbitre_reclame
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [arbitrage, rescue:tribunes, ultras]
    speaker: gege
    cooldown: 30
    when: "gauges.tribunes < 30"
    text: "Gégé, accroché à la grille, la voix cassée : « Le penalty de la 90e, tout le virage l'a vu. Trois cents gars attendent l'arbitre au tunnel. On t'attend aussi, {toi}. »"
    left: {label: "Je descends au tunnel", effects: {tribunes: "+++", direction: "-", vestiaire: "-"}, answer: "Tu descends. Une photo te montre le doigt pointé sur l'arbitre ; la commission de discipline la reçoit lundi."}
    right: {label: "Je rentre au vestiaire", effects: {tribunes: "--", direction: "+"}, answer: "Tu rentres. L'arbitre passe le tunnel sous les crachats ; le virage scande ton nom avec un autre mot devant."}

  - id: co.monde.derby_veille
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [ultras, piege]
    speaker: gege
    cooldown: 26
    text: "Gégé, au local, devant le calendrier où dimanche est entouré trois fois : « Le derby contre {rival}, c'est dans trois jours. On a peint quarante mètres de bâche. Toi, tu prépares quoi, {toi} ? »"
    left: {label: "Trois séances de plus", effects: {force: "+", vestiaire: "-", tribunes: "+"}, answer: "Trois séances de plus, le soir, sous les projecteurs. Les gars grognent ; le virage, venu regarder, approuve."}
    right: {label: "Je lève le pied", effects: {tribunes: "--", force: "-"}, answer: "Séance légère, footing, rires. Au local, le soir même, on parle de toi comme d'un touriste."}

  - id: co.monde.derby_treve
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [ultras, arbitrage]
    speaker: aubert
    cooldown: 26
    text: "Madame Aubert, les ciseaux de l'inauguration encore à la main : « Avant le derby, vous serrerez la main du capitaine de {rival}, face aux photographes. La ville vote en mars. »"
    left: {label: "Je serre la main", effects: {direction: "+", tribunes: "--"}, answer: "La photo fait la une de L'Écho. Au local, elle finit au mur, à l'envers."}
    right: {label: "Pas de photo avec eux", effects: {tribunes: "++", direction: "-", relation: {aubert: -1}}, answer: "Madame Aubert ne te regarde plus aux inaugurations. Gégé, lui, t'envoie une écharpe du virage, sans carte."}

  - id: co.monde.belle_mere_consultante
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [famille, absurde]
    speaker: camille
    cooldown: 24
    text: "Camille, la main sur le combiné : « Ma mère a enregistré le match sur la cassette de mon anniversaire. Elle a des questions sur ton arrière gauche. Elle n'appelle jamais. Prends ton temps. »"
    left: {label: "Je prends le combiné", effects: {relation: {camille: 1}, vestiaire: "-"}, answer: "Vingt minutes sur l'arrière gauche. Elle a raison sur un point ; tu le répètes à l'entraînement, et le vestiaire n'apprécie pas."}
    right: {label: "Je lui dis bonsoir, vite", effects: {relation: {camille: -1}, vestiaire: "+"}, answer: "Tu abrèges. Camille raccroche à ta place et ne te parle plus de la soirée. La cassette reste dans le magnétoscope."}

  - id: co.monde.belle_mere_vip
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [famille, direction]
    speaker: camille
    cooldown: 24
    text: "Camille, une liste écrite au dos d'une enveloppe : « Ma mère veut venir au derby. Avec ses amies du club de belote. Douze. En loge. Le président a demandé qui paie. »"
    left: {label: "Je réserve la loge", effects: {caisse: "-", relation: {camille: 1}, direction: "-"}, answer: "Treize dames en loge, des chapeaux. Le président dîne à côté d'elles et te fait porter la note le lundi."}
    right: {label: "Elles iront en tribune", effects: {relation: {camille: -2}, direction: "+"}, answer: "Tribune Est, sous la pluie, avec des parapluies prêtés par le virage. Ta belle-mère annule Noël ; Camille ne te le pardonne pas."}

  - id: co.monde.boucher_arrive
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [sponsors, absurde]
    cooldown: 28
    text: "Dupuis, le boucher de la place, tablier propre et chèque plié en quatre : « Mon nom sur le dos des maillots, mes merguez à la buvette, et cinq minutes avec les gars avant les matchs. »"
    left: {label: "Bienvenue au club", effects: {caisse: "++", vestiaire: "-", set: [boucher_sponsor], schedule: [{card: co.monde.boucher_causerie, in: [3, 6]}]}, answer: "Le samedi suivant, les merguez fument derrière le but, et son nom est cousu de travers sur les dos."}
    right: {label: "Gardez votre chèque", effects: {caisse: "-", tribunes: "+"}, answer: "Il remballe son chèque. À la buvette, on raconte que tu as dit non au boucher ; le virage trouve ça propre."}

  - id: co.monde.boucher_causerie
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [sponsors, chaine, absurde]
    sablier: true
    when: "flag('boucher_sponsor')"
    text: "Dupuis attend devant le vestiaire, en costume du dimanche, son discours plié en quatre : « Mes cinq minutes, c'est aujourd'hui. J'ai écrit. Ça parle de mon père, et du club en cinquante-huit. »"
    left: {label: "Trois minutes, pas plus", effects: {vestiaire: "-", caisse: "+"}, answer: "Il lit trop vite, la feuille tremble. Les gars regardent leurs crampons et entrent sur le terrain froids."}
    right: {label: "Je garde le vestiaire", effects: {vestiaire: "+", caisse: "-", clear: [boucher_sponsor]}, answer: "Il remet son discours dans la poche de son costume. La semaine suivante, son nom n'est plus sur les maillots."}

  - id: co.monde.chaussettes
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [absurde, vestiaire]
    speaker: vecchio
    cooldown: 22
    text: "Vecchio tient une paire de chaussettes reprisées trois fois : « Huit victoires avec. L'intendant veut les jeter. À mon âge, tu sais, on ne garde pas grand-chose qui marche encore. »"
    left: {label: "Garde-les, Gigi", effects: {vestiaire: "+", tribunes: "-"}, answer: "Il les remet samedi. L'Écho publie la photo des reprises ; le virage rit, Gigi non."}
    right: {label: "Je les mets à la machine", effects: {vestiaire: "-", force: "+"}, answer: "Elles sortent de la machine grises et propres. Gigi les regarde sécher sur le radiateur toute la soirée."}

  - id: co.monde.bus_meme_route
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [absurde, moment]
    speaker: brehaut
    cooldown: 22
    text: "Bréhaut, debout dans l'allée du bus : « Six victoires en passant par la rue du Marché. Ce matin, elle est fermée pour les forains. Les gars veulent qu'on passe quand même. Norbert attend. »"
    left: {label: "On passe quand même", effects: {vestiaire: "+", direction: "-", caisse: "-"}, answer: "Norbert passe entre les étals à cinq à l'heure. Un forain porte plainte ; le club paie les cageots et la une de L'Écho."}
    right: {label: "On prend l'autre rue", effects: {vestiaire: "-", force: "+"}, answer: "Le bus fait le tour par le pont. Personne ne parle jusqu'au stade ; Bréhaut regarde par la vitre tout le trajet."}

  - id: co.monde.sanglier
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [absurde, moment]
    speaker: aubert
    cooldown: 26
    text: "Madame Aubert, en bottes, devant la surface labourée : « Un sanglier, cette nuit. Le garde propose une battue ce soir, au fusil, près des maisons. Ou l'équipe rebouche, et il revient. »"
    left: {label: "Va pour la battue", effects: {direction: "+", tribunes: "-"}, answer: "Deux coups de fusil vers minuit. Le quartier se plaint à la mairie ; L'Écho publie la bête sur le capot du garde."}
    right: {label: "On rebouche nous-mêmes", effects: {tribunes: "++", vestiaire: "+", force: "-"}, answer: "Les gars rebouchent à la pelle jusqu'à minuit. Samedi, le stade les applaudit à l'échauffement ; deux ont mal au dos."}

  - id: co.monde.terrain_gele
    roles: [entraineur, joueur]
    arc: sponsors
    tags: [moment, risk:vestiaire]
    speaker: sabatier
    cooldown: 22
    text: "Doc Sabatier, accroupi dans la surface, un crampon qui ne s'enfonce pas : « Gelé sur trois centimètres. Si on joue, je promets deux ischios avant la mi-temps. Le délégué décide à quatorze heures. »"
    left: {label: "On joue, tant pis", effects: {force: "+", vestiaire: "--", tribunes: "+"}, answer: "On joue. Deux ischios avant la mi-temps, comme il l'avait dit. Le stade, lui, a son match."}
    right: {label: "Je demande le report", effects: {caisse: "-", direction: "-", tribunes: "-"}, answer: "Report. Le club rembourse quatre mille billets, et le président demande ce que coûte un ischio."}

  # « Qui décide, qui possède » : programmer l'heure du coup d'envoi et parler de
  # « tes joueurs », c'est le banc. Le joueur, lui, SUBIT l'horaire : sa version
  # est portée par le capitaine, et le choix porte sur ce qu'on fait du groupe.
  - id: co.monde.canicule_tv
    roles: [entraineur]
    arc: sponsors
    tags: [sponsors, absurde]
    speaker: nassir
    cooldown: 24
    text: "Ilyas, la grille des programmes à la main : « Trente-huit degrés dimanche. Une chaîne d'Al-Dorado paie double pour jouer à quinze heures. Vos joueurs auront chaud ; le fonds a chiffré le risque. »"
    left: {label: "On joue à quinze heures", effects: {caisse: "++", vestiaire: "--", force: "-"}, answer: "Coup d'envoi en plein soleil. Le Doc pose des serviettes mouillées sur les nuques à la mi-temps ; deux gars vomissent au tunnel."}
    right: {label: "Je décale en soirée", effects: {caisse: "-", vestiaire: "+"}, answer: "Le match passe à vingt heures. La chaîne retire la moitié de la prime ; Ilyas note ce que tu viens de lui coûter."}

  - id: co.monde.canicule_tv_jp
    roles: [joueur]
    arc: sponsors
    tags: [sponsors, absurde]
    speaker: brehaut
    cooldown: 24
    text: "Bréhaut, le maillot trempé dès l'échauffement : « Trente-huit degrés, et on joue à quinze heures parce qu'une télé d'Al-Dorado paie double. Les gars écrivent une lettre. Tu signes, ou tu joues ? »"
    left: {label: "Je signe la lettre", effects: {vestiaire: "++", direction: "--", caisse: "-"}, answer: "Onze signatures, aucune réponse : on joue à quinze heures. Bréhaut range la lettre dans son casier, pour plus tard."}
    right: {label: "Je joue, c'est tout", effects: {direction: "+", force: "-", vestiaire: "--"}, answer: "Tu joues. Tu sors à la 60e, livide, et personne ne te demande si ça va."}

  - id: co.monde.nassir_cheque
    roles: [entraineur]
    arc: sponsors
    tags: [sponsors, rescue:caisse]
    speaker: nassir
    cooldown: 34
    when: "gauges.caisse < 30"
    text: "Ilyas, un chèque posé face cachée sur le bureau : « Votre caisse tient jusqu'en mars, j'ai lu vos comptes. Retournez-le : le montant contre le nom du stade, et un siège au conseil. »"
    left: {label: "Je retourne le chèque", effects: {caisse: "+++", direction: "-", parole: -1}, answer: "Les lettres du fonds montent sur la façade du stade en août. Gégé les regarde poser depuis le trottoir d'en face."}
    right: {label: "Je le laisse face cachée", effects: {caisse: "-", tribunes: "+"}, answer: "Il reprend le chèque sans le retourner. Tu ne sauras jamais le montant ; le virage chante toujours le vieux nom du stade."}

  # Version joueur : sa jauge « Compte », c'est son compte à lui — on ne lui
  # achète pas le nom du stade, on lui achète trois jours et son visage.
  - id: co.monde.nassir_cheque_jp
    roles: [joueur]
    arc: sponsors
    tags: [sponsors, rescue:caisse]
    speaker: nassir
    cooldown: 34
    when: "gauges.caisse < 30"
    text: "Ilyas, dans le hall de l'hôtel, sans s'asseoir : « Votre compte est à découvert depuis février. Trois jours chez nous en juin, un match de gala, et votre visage sur une bouteille. »"
    left: {label: "Je prends les trois jours", effects: {caisse: "+++", vestiaire: "-", parole: -1}, answer: "Le match dure une mi-temps ; la bouteille dure onze ans. On la voit encore dans les stations-service."}
    right: {label: "Je passe mon tour", effects: {caisse: "-", vestiaire: "+", relation: {nassir: -1}}, answer: "« Une autre année. » Il le dit comme un rendez-vous, pas comme un refus."}
