# « Les douze pages » (content/arcs/common/deballage.yaml) : le dossier de tes
# promesses rompues, posé devant toi quand la parole tombe à −5, en mode
# histoire. Un choix : répondre à tout (la carrière continue, la parole revient
# à zéro) ou démentir (la fin `grand_deballage`). Une variante par livre, puis
# la chemise sous la porte ; et le dimanche, si tu as répondu.
cards:
  # ---------------------------------------------- Trois mille visages (h1)
  - id: co.deballage.h1
    roles: [entraineur, joueur, president, ds, selectionneur]   # le `if` de l'étape dit le livre
    arc: presse
    tags: [presse]
    speaker: meneche
    lieu: echo
    tone: strategique
    once: true
    text: "Massenet pose une chemise sur son bureau : douze pages, tes promesses, datées. « En 1974, une seule page m'a suffi pour un capitaine. Pour vous, il en a fallu douze. Je publie dimanche. »"
    left:
      label: "Je réponds à chaque page"
      effects: {parole: 5, tribunes: "-", direction: "-", set: [deballage_avoue]}
      answer: "Tu réponds une heure, page par page ; il note tout. Sur le seuil, il remet son chapeau : « Le capitaine de 1974, lui, n'avait rien répondu. »"
    right:
      label: "Publiez. Je démentirai"
      effects: {end: grand_deballage}
      answer: "Il range la chemise. « J'écrirai “dément formellement”. C'est ce qu'on avait écrit en 1974, sous la photo. »"

  # ---------------------------------------------- Le Sapin en carton (h2)
  - id: co.deballage.h2
    roles: [entraineur, joueur, president, ds, selectionneur]   # le `if` de l'étape dit le livre
    arc: presse
    tags: [presse]
    speaker: lea
    lieu: echo
    tone: strategique
    once: true
    text: "Léa pose une chemise devant toi : douze pages, une par promesse depuis ton premier lundi, le témoin, la date, ce qui est arrivé. « Tout est vérifié deux fois. Vous voulez être cité ? »"
    left:
      label: "Citez-moi. Sur tout"
      effects: {parole: 5, tribunes: "-", direction: "-", set: [deballage_avoue]}
      answer: "Tu réponds à chaque page ; elle cite mot pour mot. Le dimanche, ta voix est entre guillemets douze fois, et pour une fois personne ne parle de Roland."
    right:
      label: "Je n'ai rien à dire"
      effects: {end: grand_deballage}
      answer: "« Alors j'écrirai : n'a pas souhaité répondre. » Elle referme la chemise. « C'est ce qu'on écrit pour les disparus. »"

  # ------------------------------------------------------- La Sirène (h3)
  - id: co.deballage.h3
    roles: [entraineur, joueur, president, ds, selectionneur]   # le `if` de l'étape dit le livre
    arc: presse
    tags: [presse]
    speaker: fardelli
    lieu: parking
    tone: strategique
    once: true
    text: "Fardelli te tend par la vitre l'épreuve de la Gazette Rose : douze promesses que tu n'as pas tenues, avec les dates. « Ça sort jeudi. Je peux l'acheter. Ou tu peux répondre. »"
    left:
      label: "Je leur réponds moi-même"
      effects: {parole: 5, tribunes: "-", caisse: "-", set: [deballage_avoue]}
      answer: "Tu appelles la Gazette d'une cabine et tu réponds à tout. Fardelli démarre sans te regarder : « Tu viens de baisser ton prix. Personne ne baisse son prix. »"
    right:
      label: "Achète-la"
      effects: {end: grand_deballage}
      answer: "Il l'achète. Le jeudi suivant, la Gazette sort quand même les douze pages, avec une treizième : le reçu, à ton nom."

  # --------------------------------------------- La Route de la Rive (h4)
  - id: co.deballage.h4
    roles: [entraineur, joueur, president, ds, selectionneur]   # le `if` de l'étape dit le livre
    arc: presse
    tags: [presse]
    speaker: meneche
    lieu: bar
    tone: strategique
    once: true
    text: "Au bar d'en face, Massenet fait glisser une chemise : douze promesses, tes dates. Sa main reste à plat sur une treizième feuille, retournée. « Celles-là sortent dimanche. Celle-ci, je la garde. »"
    left:
      label: "Je réponds aux douze"
      effects: {parole: 5, tribunes: "-", direction: "-", set: [deballage_avoue]}
      answer: "Tu réponds aux douze. Il range la treizième dans sa poche intérieure, sans la retourner. « Un jour, vous me demanderez celle-là. Je la garde depuis 1984. »"
    right:
      label: "Écrivez que je démens"
      effects: {end: grand_deballage}
      answer: "Il écrit « dément » dans la marge. « En 1984, on m'a fait enlever huit lignes. Celles-ci, je les laisse toutes. »"

  # ------------------------------------------------------ La Maquette (h5)
  - id: co.deballage.h5
    roles: [entraineur, joueur, president, ds, selectionneur]   # le `if` de l'étape dit le livre
    arc: presse
    tags: [presse]
    speaker: vialat
    lieu: bureau
    tone: strategique
    once: true
    text: "Madame Vialat pose une feuille sur ton bureau : douze lignes, douze promesses de président, la date de chacune. « D'habitude, je compte l'argent. Cette fois, j'ai compté ça. »"
    left:
      label: "J'assume les douze"
      effects: {parole: 5, tribunes: "-", direction: "-", set: [deballage_avoue]}
      answer: "Tu signes au bas de la feuille. Elle la range avec la coupure de Vaucastel. « Ceux qui signent, en général, je les revois. Les autres, je les lis au greffe. »"
    right:
      label: "Je n'ai rien promis"
      effects: {end: grand_deballage}
      answer: "« Bien. » Elle referme son sac. Le lundi, la feuille est à la Une de L'Écho, à côté d'une photo de la maquette. Personne ne sait qui l'a donnée."

  # ------------------------------------------------------- 23 h 58 (h6)
  - id: co.deballage.h6
    roles: [entraineur, joueur, president, ds, selectionneur]   # le `if` de l'étape dit le livre
    arc: presse
    tags: [fax, presse]
    lieu: bureau
    tone: strategique
    once: true
    text: "23:58 · 12 PAGES · AUCUN NUMÉRO D'APPEL. DOUZE PROMESSES, DOUZE DATES, TOUTES À TON NOM. LÉA LES AURA DEMAIN MATIN."
    left:
      label: "Les porter à Léa moi-même"
      effects: {parole: 5, tribunes: "-", direction: "-", set: [deballage_avoue]}
      answer: "Tu traverses la ville à minuit avec douze pages tièdes. Léa les lit sur son palier. « Vous savez que ce papier blanchit ? » — « Oui. C'est pour ça. »"
    right:
      label: "Les brûler"
      effects: {end: grand_deballage}
      answer: "Le papier thermique noircit sans flamme. Le lendemain, à 23 h 58, le fax imprime les douze pages une seconde fois ; Léa a déjà les siennes."

  # --------------------------------------------------- L'Oreillette (h8)
  - id: co.deballage.h8
    roles: [entraineur, joueur, president, ds, selectionneur]   # le `if` de l'étape dit le livre
    arc: presse
    tags: [presse]
    speaker: lea
    lieu: cafe
    tone: strategique
    once: true
    text: "Léa pose sa tablette : douze promesses que tu as faites, l'heure exacte, et à côté ton rythme cardiaque, acheté à un revendeur. « Là, à la septième, il monte. Vous voulez commenter ? »"
    left:
      label: "Je commente les douze"
      effects: {parole: 5, tribunes: "-", direction: "-", set: [deballage_avoue]}
      answer: "Tu commentes les douze. Elle coupe l'enregistreur à la fin : « Votre cœur n'a pas bougé une seule fois. C'est ça que je vais écrire. »"
    right:
      label: "Mon avocat vous appellera"
      effects: {end: grand_deballage}
      answer: "« Il m'a déjà appelée. » Elle tourne l'écran vers toi : ton cœur, à l'instant, cent vingt-deux. « Celui-là, je l'ai eu gratuitement. »"

  # ------------------------------------------- sans livre : sous la porte
  - id: co.deballage.dossier
    roles: [entraineur, joueur, president, ds, selectionneur]
    arc: presse
    tags: [presse]
    lieu: domicile
    tone: strategique
    once: true
    text: "Sous ta porte, une chemise cartonnée : douze pages, douze promesses que tu as faites, la date, le témoin, ce qui est arrivé. Au crayon, sur la dernière : « Publication dimanche. Réponse ? »"
    left:
      label: "Répondre à chaque page"
      effects: {parole: 5, tribunes: "-", direction: "-", set: [deballage_avoue]}
      answer: "Tu écris toute la nuit : oui, c'était moi ; non, je n'ai pas tenu. Au matin, il te reste une promesse à faire, et tu ne la fais pas."
    right:
      label: "Tout démentir"
      effects: {end: grand_deballage}
      answer: "Ton démenti tient en trois lignes. Le journal le publie en page quatre, sous les douze pages."

  # ------------------------------------------------ le dimanche d'après
  - id: co.deballage.dimanche
    roles: [entraineur, joueur, president, ds, selectionneur]
    arc: presse
    tags: [presse]
    lieu: rue
    tone: leger
    once: true
    text: "Dimanche. Les douze pages sont sorties, tes réponses à côté de chacune. Au kiosque, on te rend la monnaie sans un mot. Un seul homme te demande : « Et la treizième, c'est pour quand ? »"
    left:
      label: "Il n'y en aura pas"
      effects: {parole: 1}
      answer: "Il hoche la tête, à moitié convaincu. Dans cette ville, la moitié, c'est déjà beaucoup."
    right:
      label: "Je ne promets plus rien"
      effects: {tribunes: "-"}
      answer: "« Ça aussi, c'est une promesse. » Le kiosquier plie ton journal en quatre, la Une à l'intérieur."
