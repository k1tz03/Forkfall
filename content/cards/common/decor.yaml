# Le décor (bible scénaristique, ch. 31 « Les anecdotes, les running gags et
# l'almanach du monde »). Ce fichier ne raconte aucune histoire : il fournit ce
# qui se passe **entre** les histoires — les quatorze lieux, les objets qui
# changent de main, les gags qui vieillissent. Toutes les cartes sont des
# cartes de routine (`arc: routine`) : elles tombent dans la bande de
# respiration, jamais deux d'affilée, et le metteur en scène les tire du sac.
#
# Règles de l'anecdote (ch. 31 § 0) : elle (a) ne fait jamais avancer une
# intrigue, (b) ne pose qu'une trace légère au plus, (c) touche une jauge, deux
# au maximum, jamais `+++`, (d) n'appelle jamais `end`, (e) ne cite le nom du
# joueur qu'une carte sur quatre, (f) est rejouable sauf mention `once`,
# (g) parle d'un lieu ou d'un objet, pas d'un enjeu.
#
# ── Le plafond d'exposition du sac (mesuré, spec variété § 5.1) ─────────────
# Budget § 5.1 : « cartes distinctes vues en 10 carrières / cartes du rôle
# ≥ 70 % ». Il ne peut pas être tenu tant que le calendrier sert le sac au
# rythme actuel, et c'est une contrainte d'arithmétique, pas d'écriture :
#   · une carrière du promu sert 3,5 cartes de **sac** (mesuré sur 300
#     carrières : 17 étapes, 10 Nouvelles, 8 ancres de script, 7 réactions,
#     3 paliers, 2 alarmes, 1,5 événement… et 3,5 routines) ;
#   · le sac de l'entraîneur compte 300 cartes ;
#   · dix carrières font donc **35** tirages de sac au maximum, sans une seule
#     répétition, pour 300 cartes de sac dans un dénominateur de ~650.
# Plafond arithmétique de la mesure : (650 − 300 + 35) / 650 ≈ **59 %**, pour
# un budget de 70 % ; mesure réelle 36 %. Les deux budgets tirent d'ailleurs en
# sens contraire : § 5.2 (« isolement < 10 % en S0 ») pousse la part des cartes
# de routine vers le bas, § 5.1 la voudrait vers le haut. Ce qui est réparable
# côté écriture, c'est le **second** bloc du rapport (exposition sur tous les
# tirages, seuil interne 90 %) : là, 300 careers font 1 050 tirages de sac,
# assez pour tout couvrir — et c'est là que se voient les cartes qu'aucune
# garde ne laisse jamais sortir. Le premier bloc, lui, se lit comme une mesure
# de rythme, pas comme une dette d'écriture.
#
# Ce qui reste hors de portée du promu dans le second bloc, et qui n'est pas
# une dette d'écriture non plus (mesuré sur 2 000 carrières) : les douze
# `co.retrouvailles.*` (il faut qu'un visage parte puis revienne, ce qu'une
# carrière de 2,1 saisons ne fait pas), les onze `co.nouvelle.passe_*` (elles
# demandent `stats.clubs >= 2` : le promu n'a qu'un club), et les cartes de
# palier `co.<visage>.faveur_*` / `trahison_*` des visages que le postulat ne
# fait pas assez parler pour atteindre ±3 de relation (Aubert, Léa, Sabatier,
# la mère de Mbako). Les treize cartes-réaction du script de l'intérimaire,
# elles, sont sorties du dénominateur : `simulate.dart` sait maintenant qu'une
# réaction n'existe que si un `react:` de ce postulat la nomme.
#
# ── Écarts d'import assumés (le schéma technique tranche, charte § 5.3) ──────
# · Le moteur ne connaît que deux rôles (`entraineur`, `joueur`) : les cartes
#   de la bible réservées au DS, aux présidents, au sélectionneur ou aux
#   instances ne sont pas ici (elles attendent leur rôle). Une carte « tous »
#   devient `roles: [entraineur, joueur]`.
# · `speaker:` est un **id** de `characters.yaml`. Les voix sans portrait de la
#   bible (Norbert le chauffeur, Lulu et son chien Corner, Marinette, Nino,
#   Momo, le stagiaire de l'Écho, la petite Josiane, Gérard, Dédé, Dupuis,
#   Pichon, Paulette, Rouvier, Dembo, Brissac, Barbier, Solvang, Colline,
#   Dauzat, Vaz, Vogler) n'ont pas de fiche : leur carte est écrite **sans**
#   `speaker`, la voix est nommée dans le texte, et elle ne dit jamais `{toi}`.
# · `react:` est interdit sur une carte de routine (le build le refuse) : les
#   « Réactions déclenchées » de la bible ne sont pas importées ici.
# · Une trace posée hors d'un arc n'a pas de ligne d'Almanach d'arc : elle est
#   écrite à la main dans `journal:` (README § 3.1).
# · `tone` du moteur : `leger | strategique | drame`. Le « neutre » de la bible
#   devient `leger` (respiration) ou `strategique` (quand la carte pèse).
cards:

  # ==========================================================================
  # § 2.1 — Le couloir et le distributeur (8)
  # Le distributeur est le vrai bulletin de santé du club : le 5 du mois, on
  # sait avant le président.
  # ==========================================================================

  - id: co.dec.couloir_distributeur
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    speaker: vecchio
    tone: leger
    cooldown: 25
    when: "!flag('salaires_retard')"
    text: "Vecchio te tend un ticket de distributeur plié en deux, côté blanc dessus : « Ramassé dans la fente, au centre commercial. Le solde d'un de nos jeunes. Moi, je ne l'ai pas lu. »"
    left:
      label: "Je lis le chiffre"
      effects: {vestiaire: "-", direction: "+"}
      answer: "Un découvert à quatre chiffres, au nom du gamin à la voiture neuve. Tu ne dis rien ; à l'entraînement, tu ne le regardes plus pareil."
    right:
      label: "Je le retourne aussi"
      effects: {vestiaire: "+"}
      answer: "Il le glisse dans le casier du gamin, côté blanc dessus. Le lendemain, le gamin le remercie d'un signe de tête, les yeux sur ses lacets."

  - id: co.dec.couloir_le_cinq
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, caisse, vestiaire]
    tone: strategique
    cooldown: 20
    when: "flag('salaires_retard')"
    text: "Momo, au portail, trois cartes bancaires en éventail : la sienne et celles de deux jeunes. « Le 5 est passé depuis deux jours. On va au distributeur à trois, ça fait moins pitié. Tu viens ? »"
    left:
      label: "Je viens avec vous"
      effects:
        vestiaire: "++"
        direction: "-"
        set: [distributeur_groupe]   # Almanach : « {annee} : ils y sont allés à trois. »
      answer: "Vous êtes cinq devant le distributeur du centre commercial. Il rend les cartes une par une, et rien d'autre."
    right:
      label: "J'attends le communiqué"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Ils y vont sans toi. Le communiqué du président arrive le 11 : une demi-page, et pas une date."

  - id: co.dec.couloir_affiche
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, direction, absurde]
    speaker: josiane
    tone: leger
    cooldown: 30
    text: "Josiane remet au mur l'affiche du stage de secourisme, une punaise entre les dents. La feuille d'inscription, dessous, est vierge. « Samedi, neuf heures. Le formateur vient de Valdorne. J'annule ? »"
    left:
      label: "Annulez, personne n'ira"
      effects: {direction: "+", relation: {josiane: -1}}
      answer: "Elle décroche l'affiche et garde la punaise. Le carré plus clair reste au mur ; au stade, personne ne sait faire un massage cardiaque."
    right:
      label: "Je signe en premier"
      effects: {vestiaire: "+"}
      answer: "Tu écris ton nom en haut de la feuille. Le lendemain, trois joueurs ont signé dessous, et Momo a ajouté Lulu."

  - id: co.dec.couloir_pesee
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, absurde]
    tone: leger
    cooldown: 25
    text: "Nadia Rouvier, la kiné, tape du pied la balance du couloir : « Elle ment de deux kilos depuis que la cave a pris l'eau, et tout le monde s'en arrange. Je la règle avant la pesée de lundi ? »"
    left:
      label: "Règle-la"
      effects: {vestiaire: "-", force: 1}
      answer: "Trois joueurs découvrent leur vrai poids devant les autres. Deux ne mangent plus à la cantine du club."
    right:
      label: "On garde le mensonge"
      effects: {vestiaire: "+"}
      answer: "Elle laisse la balance comme elle est. Lundi, tout le monde pèse deux kilos de moins que la vérité, et personne ne proteste."

  - id: co.dec.couloir_cafe
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, direction, moment]
    speaker: josiane
    tone: leger
    cooldown: 25
    text: "Josiane pose sa cafetière italienne sur le radiateur du couloir et sort deux tasses : « La machine est morte jeudi. Le technicien passe dans quinze jours, dit-il. Un sucre, {toi} ? »"
    left:
      label: "Je paie un percolateur"
      effects: {caisse: "-", direction: "+", vestiaire: "+"}
      answer: "Le percolateur arrive le lundi, payé par le club. Sa cafetière reste sur son bureau, rincée, au cas où."
    right:
      label: "Je prends votre café"
      effects: {relation: {josiane: 1}, direction: "+"}
      answer: "Elle sert deux tasses et s'assoit, pour une fois. Elle te parle cinq minutes du président sans jamais dire son nom."

  - id: co.dec.couloir_plaque
    roles: [entraineur]
    arc: routine
    tags: [decor, direction, moment]
    speaker: josiane
    tone: strategique
    cooldown: 40
    when: "season >= 1"
    text: "Josiane tient une plaque gravée à ton nom, pas encore vissée. Dans le tiroir du bas, sept autres, les vis scotchées au dos. « Je la visse, {toi}, ou j'attends la fin de l'hiver ? »"
    left:
      label: "Vissez-la aujourd'hui"
      effects: {direction: "+"}
      answer: "Elle visse les quatre vis devant toi. Le président passe, lit ton nom en tapotant la plaque et dit que ça fait sérieux."
    right:
      label: "Attendez la fin de l'hiver"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Elle pose la plaque sur l'armoire, face contre le bois. Les joueurs le remarquent ; le président aussi, autrement."

  - id: co.dec.couloir_chaussures
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, absurde, moment]
    tone: leger
    cooldown: 30
    text: "Lulu, le gardien du stade, repeint à genoux la bande blanche du couloir, que les crampons ont mangée. Des traces fraîches la traversent déjà. « La commission de sécurité passe demain, huit heures. »"
    left:
      label: "Je vous aide à repeindre"
      effects: {direction: "-", tribunes: "+"}
      answer: "Vous repeignez à deux jusqu'à dix heures du soir. La commission passe, coche sa case et repart ; au local, on sait déjà qui tenait le pinceau."
    right:
      label: "Je longe le mur"
      effects: {vestiaire: "+"}
      answer: "Tu longes le mur sans marcher sur la peinture. Derrière toi, les joueurs font pareil, en file, sans qu'on le leur dise."

  - id: co.dec.couloir_liste
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    speaker: brehaut
    tone: leger
    cooldown: 25
    text: "Bréhaut s'arrête devant la liste des seize, punaisée de travers depuis huit heures : « Personne n'ose la toucher. Ils ont peur qu'on croie qu'ils cherchent leur nom. Moi aussi, un peu. »"
    left:
      label: "Je la redresse"
      effects: {vestiaire: "+"}
      answer: "Tu la redresses d'un doigt. Bréhaut s'écarte du panneau, et les gars s'approchent enfin pour lire."
    right:
      label: "Je la laisse de travers"
      effects: {vestiaire: "-", direction: "+"}
      answer: "Deux joueurs la lisent la tête penchée. Le dix-septième, celui qui n'y est pas, l'a lue de loin."

  # ==========================================================================
  # § 2.2 — Le vestiaire, la table du Doc, la pharmacie (8)
  # La table du Doc est la seule pièce sans témoin, donc la seule où l'on parle.
  # ==========================================================================

  - id: co.dec.doc_table
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    speaker: sabatier
    tone: strategique
    cooldown: 30
    when: "season.phase != 'sprint'"
    text: "Le Doc s'essuie les mains, l'odeur de camphre partout : « Trois gars m'ont parlé sur la table ce matin, {toi}. Deux choses touchent dimanche. La troisième, je n'aurais pas dû l'entendre. »"
    left:
      label: "Je ne demande rien"
      effects: {vestiaire: "++", relation: {sabatier: 1}}
      answer: "Il range la serviette, pliée en quatre. Les gars le savent avant midi : sur sa table, on peut parler."
    right:
      label: "Dis-moi la troisième"
      effects: {direction: "+", vestiaire: "-", relation: {sabatier: -1}}
      answer: "Un joueur doit de l'argent à des types de la friche de la Tréfilerie. La porte est fermée ; quelqu'un l'a entendu quand même."

  - id: co.dec.vestiaire_crochet
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    speaker: vecchio
    tone: leger
    cooldown: 35
    text: "Vecchio désigne du menton le crochet du fond, le seul vide : « Celui du petit Jojo. La route du retour, en quatre-vingt-quatre, dans le brouillard. Depuis, on n'y accroche rien. »"
    left:
      label: "J'y pends ma veste"
      effects: {vestiaire: "--", force: 1}
      answer: "Le vestiaire se tait d'un coup. Ta veste reste seule sur le mur, et Vecchio se change dos à toi."
    right:
      label: "Je le laisse vide"
      effects: {vestiaire: "+"}
      answer: "Le crochet reste vide. Vecchio passe la main dessus en sortant, comme chaque jour, sans savoir que tu regardes."

  - id: co.dec.vestiaire_musique
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, absurde]
    tone: leger
    cooldown: 20
    text: "Dembo pose sur le banc un poste à cassettes gros comme un cartable, déjà allumé : « C'est la musique de chez moi. Sans elle, je ne marque pas. Le président a tapé au mur, j'ai entendu. »"
    left:
      label: "Baisse de moitié"
      effects: {vestiaire: "-", direction: "+"}
      answer: "Il baisse, sans te regarder. Il joue sans sourire, et à la mi-temps il remonte le son, juste un peu, pour voir."
    right:
      label: "Monte, et gagne"
      effects: {vestiaire: "++", direction: "-"}
      answer: "Le couloir tremble jusqu'au bureau du président, qui ferme sa porte à clé. Dembo marque, et te cherche des yeux en courant."

  - id: co.dec.doc_flan
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, absurde]
    tone: leger
    cooldown: 30
    text: "À l'infirmerie, Nadia Rouvier fait manger le dernier flan à un gamin qui a pleuré toute la matinée : les ligaments, six mois. « L'autre blessé ne doit pas savoir que j'ai choisi. »"
    left:
      label: "Je ne dis rien"
      effects: {vestiaire: "+"}
      answer: "Tu ne dis rien. Le gamin finit son flan et dort une heure sur la table, la première fois depuis le diagnostic."
    right:
      label: "J'en rachète douze"
      effects: {caisse: "-", vestiaire: "++"}
      answer: "Douze flans arrivent le lendemain, un par blessé et le reste pour les autres. Le gamin en mange deux, et rit enfin."

  - id: co.dec.pharmacie_boite
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, scandale]
    speaker: sabatier
    tone: strategique
    cooldown: 40
    when: "season >= 1 && !flag('pharmacie_propre')"
    text: "Le Doc pose sur la table une boîte sans étiquette, trouvée derrière les bandes : « L'ancien staff l'a laissée. Je connais ce genre de boîte. Je n'aime pas la savoir chez moi. On en fait quoi ? »"
    left:
      label: "Jetez-la devant moi"
      effects:
        direction: "+"
        vestiaire: "+"
        set: [pharmacie_propre]      # Almanach : « {annee} : l'armoire a été vidée devant témoin. »
      answer: "Il la jette dans la benne du parking, devant toi et devant Vukić. Il demande que ce soit écrit quelque part."
    right:
      label: "Rangez-la tout au fond"
      effects: {caisse: "+", direction: "-"}
      answer: "Il la remet au fond, derrière les bandes. L'armoire ferme mal ; il le note sur la porte, au crayon."

  - id: co.dec.vestiaire_ballon_signe
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    speaker: brehaut
    tone: leger
    cooldown: 30
    when: "world.serie_victoires >= 1"
    text: "Bréhaut fait passer le ballon du match et un marqueur qui n'écrit qu'à plat : « On le signe et on l'offre. Les gars ont voté : onze pour Josiane, neuf pour le kop. Il manque ta voix. »"
    left:
      label: "Je vote Josiane"
      effects: {direction: "+", relation: {josiane: 1}}
      answer: "Elle le pose sur le classeur, entre le téléphone et le fax. Elle n'en parle jamais, mais elle l'époussette chaque lundi."
    right:
      label: "Je vote le kop"
      effects: {tribunes: "++", direction: "-"}
      answer: "Gégé l'accroche au plafond du local, dans le filet à oranges, la date à la craie. Les neuf l'ont su avant toi."

  - id: co.dec.vestiaire_douche_froide
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, caisse]
    speaker: vukic
    tone: leger
    cooldown: 25
    when: "season.phase == 'aller' || season.phase == 'hiver'"
    text: "Vukić, les cheveux mouillés, une serviette sur l'épaule : « L'eau chaude tient onze minutes. Ils sont vingt-deux. Ce matin, ils ont tiré au sort qui se lave. Le petit a perdu trois fois. »"
    left:
      label: "Je change le chauffe-eau"
      effects: {caisse: "--", vestiaire: "++"}
      answer: "Le chauffe-eau neuf tient une heure. Le petit se douche le dernier, longtemps, et chante sous l'eau."
    right:
      label: "Je laisse le tirage"
      effects: {vestiaire: "-", force: 1}
      answer: "Le tirage continue. Les perdants se rhabillent mouillés et courent plus fort pour avoir chaud ; deux tombent malades."

  - id: co.dec.vestiaire_maillot_numero
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    tone: leger
    cooldown: 30
    when: "season.phase == 'presaison'"
    text: "Momo vide sur le banc un sac de maillots encore tièdes de la laverie de la rue du Stade : « Le sept, ils sont trois à le vouloir. Le douze, personne. Tu tranches, ou on fait comme l'an dernier ? »"
    left:
      label: "Je tranche"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Le sept va au plus ancien. Les deux autres passent la semaine à s'entraîner en lui tournant le dos."
    right:
      label: "Débrouillez-vous"
      effects: {vestiaire: "+"}
      answer: "Ils s'arrangent entre eux. Le douze finit sur le dos du plus jeune, comme chaque année, et il l'enfile sans discuter."

  # ==========================================================================
  # § 2.3 — Le bus et Norbert (8)
  # La hiérarchie du club se lit à l'œil nu dans l'ordre des sièges. Norbert
  # conduit depuis 1988 ; il ne commente pas, ce qui est une manière de tout dire.
  # ==========================================================================

  - id: co.dec.bus_siege_douze
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    tone: leger
    cooldown: 25
    when: "season.phase == 'aller' || season.phase == 'retour'"
    text: "Norbert pose sa veste sur le siège douze, comme à chaque départ, sans regarder personne : « Le siège du petit Jojo. Je ne conduisais pas, cette nuit-là. Je garde la place quand même. »"
    left:
      label: "Je m'assois au douze"
      effects: {vestiaire: "-", force: 1, tribunes: "+"}
      answer: "Vingt kilomètres, et dans le car on n'entend que le moteur. Puis Norbert remet la radio, plus fort que d'habitude, et personne ne la baisse."
    right:
      label: "Je reste debout"
      effects: {vestiaire: "+"}
      answer: "Tu restes debout jusqu'à la sortie de la ville. Norbert te regarde une fois dans le rétroviseur, et lève deux doigts du volant."

  - id: co.dec.bus_radio
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, absurde, moment]
    tone: leger
    cooldown: 20
    when: "season.phase == 'aller' || season.phase == 'retour'"
    text: "Norbert, la main sur le bouton de la radio, sans tourner la tête : « À six heures, c'est la chronique sportive. Le président y passe ce soir, en direct. Je laisse, ou je coupe ? »"
    left:
      label: "Laissez la radio"
      effects: {vestiaire: "-", direction: "+"}
      answer: "Le président parle quatre minutes de « son » club, jamais de l'équipe. Norbert coupe le poste, et personne ne le rallume jusqu'à l'hôtel."
    right:
      label: "Mettez la cassette des gars"
      effects: {vestiaire: "+", force: -1}
      answer: "Norbert glisse la cassette des joueurs. Le car chante faux jusqu'à l'hôtel ; le lendemain, l'échauffement traîne."

  - id: co.dec.bus_arret_frites
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, absurde]
    speaker: vecchio
    tone: leger
    cooldown: 30
    when: "season.phase == 'aller' || season.phase == 'retour'"
    text: "Sur l'aire de la nationale, la friterie est encore allumée à onze heures du soir. Vecchio : « Le patron nous attend depuis quinze ans. Sa femme est morte en mars. Il a gardé la friteuse. »"
    left:
      label: "Vingt minutes, pas plus"
      effects: {vestiaire: "+", force: -1}
      answer: "Le patron sort douze cornets et refuse l'argent. Il demande juste qu'on signe le mur, à côté de la photo de sa femme."
    right:
      label: "On roule"
      effects: {force: 1, vestiaire: "--"}
      answer: "Le car passe sans ralentir. Dans le rétroviseur, le patron reste sur le parking, la friteuse allumée derrière lui."

  - id: co.dec.bus_retard_president
    roles: [entraineur]
    arc: routine
    tags: [decor, direction, moment]
    tone: strategique
    cooldown: 30
    when: "season.phase == 'aller' || season.phase == 'retour'"
    text: "Norbert tapote sa montre, moteur tournant devant le stade : « Vingt-deux à bord. Il manque le président. Si on attend encore, on arrive là-bas pendant l'échauffement. Je pars ? »"
    left:
      label: "On part sans lui"
      effects: {direction: "--", vestiaire: "++"}
      answer: "Le car démarre. Le président arrive en taxi au coup d'envoi, s'assoit en tribune et ne descend pas te serrer la main."
    right:
      label: "On attend le président"
      effects: {vestiaire: "-", direction: "+"}
      answer: "Onze minutes, moteur tournant. Il monte sans s'excuser, s'assoit devant, et personne ne parle jusqu'à l'autoroute."

  - id: co.dec.bus_carte_papier
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, absurde, moment]
    tone: leger
    cooldown: 35
    when: "year < 2010"
    text: "Norbert a déplié la carte routière sur le volant, à l'arrêt, et plisse les yeux sous le plafonnier : « La sortie a changé cet été. Je vois mal, la nuit. À droite par le vieux pont, ou tout droit ? »"
    left:
      label: "Par le vieux pont"
      effects: {force: -1, vestiaire: "+"}
      answer: "Vous arrivez par le vieux pont, plus lentement. Norbert roule à cinquante, penché sur son volant, et ne dit plus rien."
    right:
      label: "Tout droit"
      effects: {force: 1, tribunes: "-"}
      answer: "Tout droit, par la zone commerciale. Vous êtes à l'heure ; tu remarques qu'il a demandé à Vecchio de lire les panneaux."

  - id: co.dec.bus_chant_impose
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    speaker: mbako
    tone: leger
    cooldown: 25
    when: "(season.phase == 'aller' || season.phase == 'retour') && world.serie_victoires >= 1"
    text: "Dans l'allée du car, on tend à Mbako une bouteille en guise de micro : le nouveau chante, c'est la règle. Il ne la prend pas. « Je suis le nouveau depuis deux ans. Je chante quand je joue. »"
    left:
      label: "Chante quand même"
      effects: {vestiaire: "++", relation: {mbako: -1}}
      answer: "Il chante, faux, exprès, très longtemps, en te regardant. Le car l'adore ; lui ne te parle plus jusqu'au mardi."
    right:
      label: "Je chante à sa place"
      effects: {vestiaire: "+", tribunes: "+"}
      answer: "Tu prends la bouteille et tu chantes. Norbert klaxonne une fois ; Mbako rit malgré lui, la main devant la bouche."

  - id: co.dec.bus_gigi_descend
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, tribunes]
    speaker: vecchio
    tone: leger
    cooldown: 30
    when: "flag('gigi_staff') || chars.vecchio.statut == 'club' || chars.vecchio.statut == 'present'"
    text: "Vecchio est debout dans l'allée avant même que le car s'arrête, le sac de gants sur l'épaule : « Depuis mes vingt ans, je descends le premier. Le jour où je descends deuxième, c'est que c'est fini. »"
    left:
      label: "Descends le premier"
      effects: {vestiaire: "+", tribunes: "+"}
      answer: "Il descend. Les supporters massés devant les grilles l'applaudissent, comme chaque fois ; il ne se retourne pas."
    right:
      label: "Le capitaine d'abord"
      effects: {vestiaire: "-", direction: "+"}
      answer: "Il laisse passer Bréhaut. Il descend deuxième, compte les marches à voix basse, et ne dit plus un mot jusqu'au vestiaire."

  - id: co.dec.bus_norbert_retraite
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, moment, vestiaire]
    tone: strategique
    once: true
    cooldown: 40
    when: "season >= 4"
    text: "Norbert rend deux clés au lieu d'une : celle du car et celle du dépôt, où il dormait les veilles de départ. « Deux cent mille kilomètres. Les pneus arrière sont à changer, je l'ai écrit trois fois. »"
    left:
      label: "On vous garde le douze"
      effects: {vestiaire: "++", tribunes: "+"}
      answer: "Pour son dernier trajet, il s'assoit au douze, sa veste sur les genoux. Personne ne fait de discours, et le car part à l'heure."
    right:
      label: "Merci, et bonne route"
      effects: {direction: "+"}
      answer: "Il serre les mains une à une sur le trottoir. Le car part avec un autre chauffeur, et les pneus arrière qu'on n'a pas changés."

  # ==========================================================================
  # § 2.4 — Le parking (6 sur 7 : « la photo de La Plume » attend son rôle)
  # Le parking est la salle de rédaction de la Gazette Rose : le prix des
  # voitures, et qui attend dans la sienne, moteur éteint.
  # ==========================================================================

  - id: co.dec.parking_meneche_attend
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, presse, direction]
    speaker: meneche
    tone: strategique
    cooldown: 25
    text: "Massenet, appuyé à une portière qui n'est pas la sienne, carnet fermé : « Quarante minutes que j'attends, {toi}. J'ai entendu un chiffre au bureau du président. Je vous le donne contre une phrase. »"
    left:
      label: "Une phrase, pas plus"
      effects: {direction: "-", tribunes: "+"}
      answer: "Il note tes huit mots, puis lâche son chiffre : celui que le président a cité pour te remplacer."
    right:
      label: "Je sors par derrière"
      effects: {direction: "+", tribunes: "-"}
      answer: "Tu sors par la porte des livreurs. Il y est déjà, carnet ouvert cette fois, et il note l'heure."

  - id: co.dec.parking_voiture_president
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, ultras, tribunes]
    speaker: gege
    tone: leger
    cooldown: 30
    text: "Gégé, assis sur le muret, regarde la place du président, peinte à son nom : « Avril quatre-vingt-sept : on nous promet un parking pour les cars de supporters. Depuis, c'est la boue. »"
    left:
      label: "Je fais peindre le parking"
      effects: {caisse: "-", tribunes: "++"}
      answer: "Les lignes blanches sont tracées un mardi. Le nom du président est repeint aussi, plus gros ; Gégé le voit, et serre la main du peintre."
    right:
      label: "Je ne touche à rien"
      effects: {tribunes: "-", direction: "+"}
      answer: "Gégé crache par terre, poliment. Au match suivant, les cars de supporters se garent en travers de la place du président."

  - id: co.dec.parking_fardelli_moteur
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, agents, caisse]
    speaker: fardelli
    tone: leger
    cooldown: 25
    text: "Fardelli, vitre baissée de dix centimètres, moteur tournant : « Je ne descends pas, {toi}, j'ai quatre-vingts kilomètres. Un ami à moi cherche un petit service. Tu montes deux minutes ? »"
    left:
      label: "Je reste dehors"
      effects: {direction: "+", caisse: "-"}
      answer: "Il remonte la vitre en souriant. Le lendemain, il rappelle, et le service a un prix."
    right:
      label: "Je monte deux minutes"
      effects: {caisse: "+", vestiaire: "-"}
      answer: "Il coupe le moteur ; les deux minutes en durent quarante. Tu ressors avec un sponsor pour les maillots, et trois joueurs t'ont vu monter."

  - id: co.dec.parking_voitures_jeunes
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, formation]
    speaker: vukic
    tone: leger
    cooldown: 30
    when: "year >= 2000"
    text: "Vukić regarde la voiture jaune de Mbako, garée deux roues sur le trottoir, devant le centre de formation : « Les gamins tournent autour depuis huit heures. Ils ne regardent plus le terrain. »"
    left:
      label: "Je lui parle"
      effects: {vestiaire: "+", relation: {mbako: -1}}
      answer: "La semaine suivante, Mbako se gare plus loin, et ne te salue plus. Les gamins retournent au terrain."
    right:
      label: "Je laisse la voiture là"
      effects: {vestiaire: "-"}
      answer: "La voiture reste devant la porte. Deux mois plus tard, deux gamins du centre ont la même, à crédit."

  - id: co.dec.parking_camionnette_supporters
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, ultras, tribunes]
    tone: leger
    cooldown: 30
    text: "Nino, le neveu de Gégé, attend devant le portail fermé du parking, une camionnette pleine de peinture : « La bâche fait vingt mètres. Il nous faut le parking, une nuit. Le club ne répond pas. »"
    left:
      label: "J'ouvre le portail"
      effects: {tribunes: "++", direction: "-"}
      answer: "La bâche est peinte sur le bitume jusqu'à l'aube. Le sol garde l'ombre des lettres, et le président la voit en se garant."
    right:
      label: "Je les renvoie au club"
      effects: {tribunes: "-", direction: "+"}
      answer: "Ils peignent sur le trottoir d'en face. Trois jours après, la mairie envoie une amende au nom de Gégé ; il la punaise au local."

  - id: co.dec.parking_flaque
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, absurde, tribunes]
    tone: leger
    cooldown: 35
    text: "Lulu, en bottes, sonde du talon la grande flaque au fond du parking : « Depuis que la mairie a coupé l'entretien, elle revient à chaque pluie. Les gamins de la cité y jouent, les jours de match. »"
    left:
      label: "On la bouche"
      effects: {caisse: "-", direction: "+"}
      answer: "Deux camions de gravier. La flaque revient au printemps, trois mètres plus loin ; Lulu le savait."
    right:
      label: "Je laisse les gamins jouer"
      effects: {tribunes: "+", vestiaire: "+"}
      answer: "Les gamins y jouent tout l'après-midi, trempés jusqu'aux genoux. Deux d'entre eux s'inscrivent au centre la semaine suivante."

  # ==========================================================================
  # § 2.5 — Le local, sous la Tribune Nord (8)
  # Trois bières, un mur, une craie, un filet à oranges : la seule archive du
  # club qui n'a jamais brûlé.
  # ==========================================================================

  # Les quatre cartes du local, l'écharpe de 1971 et la bâche disent « ici » :
  # Gégé est le capo de la Tribune Nord du club d'origine (bible ch. 01, il
  # finit élu au conseil de « ton ancien club »). Après une vente ou une
  # transition, il ne tient plus ces scènes de vive voix — c'est la garde
  # `stats.clubs <= 1 && !role_was('joueur')`, l'exact contraire de celle des
  # Nouvelles du passé, où il téléphone. La scène qui doit continuer d'exister
  # après le départ est écrite à distance : `co.dec.local_au_telephone`.
  - id: co.dec.local_mur_craie
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, ultras, tribunes]
    speaker: gege
    tone: strategique
    cooldown: 30
    when: "relation.gege >= 0 && stats.clubs <= 1 && !role_was('joueur')"
    text: "Gégé lève la craie vers le mur du local : cent onze dates de matchs, et deux promesses écrites plus gros, avec un nom et une somme. « Celles-là, on ne les efface pas, {toi}. Tu veux les lire ? »"
    left:
      label: "Montre-moi les deux"
      effects: {tribunes: "+", direction: "-", parole: 1}
      answer: "Il lit le mur en suivant la craie du doigt : deux présidents, deux dates, deux sommes jamais versées. L'un des deux habite encore en face du stade."
    right:
      label: "Montre-moi les matchs"
      effects: {tribunes: "++", relation: {gege: 1}}
      answer: "Il fait le tour du mur avec toi, date par date, score par score. Ça prend une heure et deux bières, et il garde ta place à côté de lui."

  - id: co.dec.local_filet_oranges
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, ultras, moment]
    tone: leger
    cooldown: 35
    when: "season >= 1"
    text: "Nino décroche du plafond du local un filet à oranges plein de ballons, un par victoire à l'extérieur, la date au feutre : « Il en manque un pour la dernière. Le club dit qu'il n'en a plus à donner. »"
    left:
      label: "Je vous en donne un"
      effects: {tribunes: "++", vestiaire: "-"}
      answer: "Tu en prends un dans le sac d'entraînement. Le filet est complet ; à la séance, il en manque un, et Vukić compte deux fois."
    right:
      label: "Je n'ai rien à donner"
      effects: {tribunes: "-"}
      answer: "Nino raccroche le filet. Il écrit la date sur un ballon crevé, trouvé derrière la tribune, et le glisse dans le filet, avec les autres."

  - id: co.dec.local_unes_decoupees
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, ultras, presse]
    speaker: gege
    tone: leger
    cooldown: 30
    when: "season >= 1 && stats.clubs <= 1 && !role_was('joueur')"
    text: "Gégé découpe aux ciseaux une Une de La Gazette Rose, ta photo dessus, mauvaise : « Au local, on garde toutes celles qui parlent de nous. Les belles et les autres. Celle-là, on l'affiche ? »"
    left:
      label: "Affichez-la"
      effects: {tribunes: "+", direction: "-"}
      answer: "La Une est punaisée au-dessus de la porte du local. Tu la vois chaque fois que tu sors, et eux te voient la voir."
    right:
      label: "Brûlez-la"
      effects: {tribunes: "-", vestiaire: "+"}
      answer: "Il la brûle dans un seau, devant toi, sans discuter. Il en garde une photocopie, pliée dans son portefeuille."

  - id: co.dec.local_bache_nom
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, ultras, tribunes]
    tone: strategique
    cooldown: 40
    when: "season >= 1"
    text: "Nino, un pinceau à la main, au-dessus de vingt mètres de bâche étalés dans le local : ton nom, moins trois lettres. « Après, c'est peint. Si tu pars en cours de saison, on la brûle. »"
    left:
      label: "Peignez les trois lettres"
      effects: {tribunes: "++", direction: "-", promise: true}
      answer: "Vingt mètres portent ton nom au match suivant, tendus sous la Tribune Nord. Juin est loin, et la bâche ne se replie plus."
    right:
      label: "Attendez juin"
      effects: {tribunes: "-", direction: "+"}
      answer: "La bâche est repliée avec ses trois lettres manquantes. Au local, on l'appelle « la bâche à trous », et on attend."

  - id: co.dec.local_chaise_du_pere
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, ultras, moment]
    speaker: gege
    tone: strategique
    once: true
    cooldown: 45
    when: "stats.clubs <= 1 && !role_was('joueur')"
    text: "Gégé pose la main sur le dossier d'une chaise vide, près du bar : « Mon père. Interdit de stade en soixante et onze, pour une bâche. Il est mort sans revenir. Personne ne s'assoit là. »"
    left:
      label: "Je reste debout"
      effects: {tribunes: "+", relation: {gege: 1}}
      answer: "Il approuve d'un mouvement de menton. Il sort de sous le bar une bâche pliée, jaunie, et te laisse lire la première ligne."
    right:
      label: "Je m'assois"
      effects: {tribunes: "--", relation: {gege: -1}}
      answer: "Les verres se posent. Le local se vide en quatre minutes, et Gégé essuie la chaise avec sa manche quand tu te lèves."

  - id: co.dec.local_vote_compo
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, ultras, vestiaire]
    tone: leger
    cooldown: 25
    when: "season.phase != 'presaison'"
    text: "Nino tient le tableau noir du local, onze noms à la craie, votés à main levée : « Le virage a fait son onze. Mbako est dedans, Dembo non. Gégé veut que tu le voies. »"
    left:
      label: "Je regarde le tableau"
      effects: {tribunes: "+", vestiaire: "-"}
      answer: "Tu le regardes longtemps. Deux noms te restent en tête jusqu'à dimanche, et l'un d'eux joue."
    right:
      label: "Je passe sans regarder"
      effects: {vestiaire: "+", tribunes: "-"}
      answer: "Ils effacent avant que tu sortes. La semaine suivante, le tableau est accroché dans l'escalier, là où tu passes."

  - id: co.dec.local_biere_tiede
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, ultras, absurde]
    speaker: gege
    tone: leger
    cooldown: 30
    when: "(season.phase == 'retour' || season.phase == 'sprint') && stats.clubs <= 1 && !role_was('joueur')"
    text: "Gégé pose trois bières tièdes sur une caisse : « Le frigo est mort en mars. La mairie a promis, le club a promis. Toi, tu promets aussi, ou tu payes ? »"
    left:
      label: "Je paie le frigo"
      effects: {caisse: "-", tribunes: "++"}
      answer: "Le frigo neuf arrive le jeudi. Ils gardent l'ancien contre le mur, débranché, avec le nom de ceux qui avaient promis."
    right:
      label: "Je bois une tiède"
      effects: {tribunes: "+", force: -1}
      answer: "Tu bois la tienne debout, jusqu'au fond. Gégé écrit la date à la craie, à côté des autres promesses, sans rien ajouter."

  # Le local, à distance : quand tu es parti ailleurs, Gégé ne t'y reçoit plus,
  # il t'appelle. C'est la variante « à distance » des quatre cartes ci-dessus.
  - id: co.dec.local_au_telephone
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, ultras, tribunes]
    speaker: gege
    tone: leger
    cooldown: 30
    when: "stats.clubs >= 2 || role_was('joueur')"
    text: "Gégé au téléphone, un tabouret qui racle derrière lui : « Le mur du local a une place libre au-dessus du bar, {toi}. On la garde pour toi, ou on la donne au suivant ? »"
    left:
      label: "Gardez-la-moi"
      effects: {tribunes: "+", direction: "-"}
      answer: "La place reste vide deux ans. Personne n'ose y punaiser une facture."
    right:
      label: "Donnez-la au suivant"
      effects: {tribunes: "-", parole: 1}
      answer: "Ils la donnent au suivant. Ils gardent quand même une punaise, au cas où."

  - id: co.dec.local_paulette_visite
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, tribunes, moment]
    tone: leger
    cooldown: 40
    when: "year <= 2009"
    text: "Mamie Paulette descend l'escalier du local marche par marche, un cabas au bras, deux tartes aux pommes dedans : « Ils mangent n'importe quoi, ces garçons. Mon mari aussi descendait ici. »"
    left:
      label: "Je prends une part"
      effects: {tribunes: "+", vestiaire: "+"}
      answer: "Tu manges debout, avec eux. Pendant vingt minutes, personne au local ne jure, et Gégé lui porte son cabas jusqu'en haut."
    right:
      label: "Je repasserai"
      effects: {tribunes: "-"}
      answer: "Elle laisse les deux tartes sur le bar et remonte seule, une main sur la rampe. Nino la suit des yeux jusqu'à la dernière marche."

  # ==========================================================================
  # § 2.6 — La buvette et le club-house (4 sur 8 : le reste attend le rôle
  # « président amateur »). La trésorerie réelle du football amateur.
  # ==========================================================================

  - id: co.dec.buvette_ardoise
    roles: [entraineur]
    arc: routine
    tags: [decor, caisse, vestiaire]
    tone: strategique
    cooldown: 25
    text: "Gérard ouvre sur le comptoir son carnet à spirale couvert de bâtons : « L'ardoise du dimanche fait quatre pages. Trois noms partout, dont deux de tes joueurs. J'efface, ou je présente la note ? »"
    left:
      label: "J'efface tout"
      effects: {caisse: "--", vestiaire: "++", tribunes: "+"}
      answer: "Il arrache les quatre pages d'un coup et les brûle dans le cendrier. Trois hommes te serrent la main trop longtemps."
    right:
      label: "Que chacun paie"
      effects: {caisse: "++", vestiaire: "-", tribunes: "-"}
      answer: "Deux paient le dimanche suivant, en comptant les pièces sur le comptoir. Le troisième ne revient plus, ni à la buvette, ni au stade."

  - id: co.dec.buvette_merguez
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, sponsors, absurde]
    tone: leger
    once: true
    cooldown: 45
    text: "Dupuis, le boucher, décharge ses cagettes de merguez devant la buvette : « Deux cents, pour le derby. Le fils devait m'aider, mais il est au centre, il veut jouer, pas couper. Je les grille toutes ? »"
    left:
      label: "Grillez les deux cents"
      effects:
        caisse: "-"
        tribunes: "++"
        set: [merguez_deux_cents]   # Almanach : « {annee} : deux cents merguez, comme en quatre-vingt-douze. »
      answer: "La fumée monte jusqu'à la Tribune Nord. À la mi-temps, il n'en reste pas une, et son fils passe en courant sans s'arrêter."
    right:
      label: "Cent suffiront"
      effects: {caisse: "+", tribunes: "-"}
      answer: "Il en grille cent et remballe le reste. Jusqu'au coup de sifflet final, il reste au gril, le dos au match."

  - id: co.dec.buvette_merguez_record
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, sponsors, absurde]
    tone: leger
    cooldown: 40
    when: "flag('merguez_deux_cents')"
    text: "Dupuis compte les cagettes vides derrière la buvette : « Les deux cents sont parties avant la mi-temps, la dernière fois. Cette fois, mon fils m'aide. Il n'a pas été gardé au centre. On remet ça ? »"
    left:
      label: "On remet ça"
      effects: {caisse: "-", tribunes: "+"}
      answer: "Le père grille, le fils coupe, sans se parler. Le stade sent la merguez jusqu'au parking, et le fils ne regarde pas le terrain."
    right:
      label: "Pas cette fois"
      effects: {caisse: "+", tribunes: "-"}
      answer: "Il range son gril dans la camionnette. Son fils rentre seul à pied, son sac de sport encore à l'épaule."

  - id: co.dec.buvette_photo_1974
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, tribunes, moment]
    tone: leger
    cooldown: 35
    text: "Pichon, le boulanger, redresse un cadre de la buvette : l'équipe de soixante-quatorze, treize joueurs, douze noms. Le treizième a été gratté au couteau. « Ici, on n'en parle pas. »"
    left:
      label: "Je demande son nom"
      effects: {tribunes: "+", direction: "-"}
      answer: "Trois anciens finissent par lâcher un prénom, à voix basse : le gardien, parti en prison en soixante-quinze. Il est sorti cet hiver."
    right:
      label: "Je laisse le nom gratté"
      effects: {tribunes: "+"}
      answer: "Le cadre est droit. Le treizième sourit toujours au-dessus de la caisse, et quelqu'un a glissé une fleur sèche derrière le verre."

  - id: co.dec.buvette_anciens_samedi
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, tribunes, moment]
    speaker: vecchio
    statut_ok: [retraite, parti]
    tone: leger
    cooldown: 30
    when: "year >= 2005"
    text: "Vecchio, un torchon sur l'épaule, derrière le comptoir de la buvette des anciens : « Le samedi matin, on refait les matchs de quatre-vingt-quinze. On les gagne tous, maintenant. Tu t'assois ? »"
    left:
      label: "Je m'assois avec vous"
      effects: {vestiaire: "+", tribunes: "+"}
      answer: "Tu écoutes un match que tu n'as pas joué, raconté par trois hommes qui ne sont pas d'accord. À midi, tu as l'impression d'y avoir été."
    right:
      label: "Je passe en coup de vent"
      effects: {direction: "+"}
      answer: "Il te sert un café à emporter dans un gobelet qui fuit. Il le sait, et il te regarde partir."

  # ==========================================================================
  # § 2.7 — Le secrétariat, le bureau, le fax (3 sur 7 : le reste attend les
  # rôles de bureau). Josiane a le vrai plan du club : un tiroir du bas.
  # ==========================================================================

  - id: co.dec.bureau_tiroir_du_bas
    roles: [entraineur]
    arc: routine
    tags: [decor, direction, caisse]
    speaker: josiane
    tone: strategique
    cooldown: 35
    when: "season >= 1"
    text: "Josiane ouvre le tiroir du bas de dix centimètres, pas plus : des chemises sans étiquette, des reçus, une enveloppe à l'en-tête de la mairie. « Ce que personne n'a classé. Il faudrait une soirée. »"
    left:
      label: "On trie ce soir"
      effects: {direction: "+", caisse: "+", relation: {josiane: 1}}
      answer: "Vous triez jusqu'à minuit. Il en sort une subvention jamais encaissée, et un contrat signé du président que personne ne cherchait."
    right:
      label: "Laissez-le fermé"
      effects: {direction: "-", vestiaire: "+"}
      answer: "Elle repousse le tiroir du genou. Il ne ferme plus tout à fait ; l'enveloppe de la mairie dépasse d'un centimètre."

  - id: co.dec.bureau_fax_faute
    roles: [entraineur]
    arc: routine
    tags: [decor, direction, absurde]
    speaker: josiane
    tone: leger
    cooldown: 25
    when: "year <= 2010"
    text: "Josiane te tend une page encore tiède : l'heure imprimée par le fax a une heure d'avance. « Personne ne sait la régler. Un transfert envoyé à minuit moins le quart arrive à une heure moins le quart. »"
    left:
      label: "On le fait réparer"
      effects: {caisse: "-", direction: "+"}
      answer: "Le technicien règle l'horloge et facture le déplacement. Au changement d'heure suivant, le fax reprend son heure d'avance."
    right:
      label: "Corrigez à la main"
      effects: {direction: "+", relation: {josiane: 1}}
      answer: "Elle note l'heure vraie au stylo rouge sur chaque page, avec ses initiales. Le président signe sans voir ce qu'elle a corrigé."

  - id: co.dec.bureau_sms_faute
    roles: [entraineur]
    arc: routine
    tags: [decor, direction, retorse]
    speaker: aulard
    tone: strategique
    cooldown: 40
    when: "relation.aulard <= 0"
    text: "Vaubourg sort de son sous-main une lettre tapée, non signée, adressée « à l'entraîneur » : « Je l'ai fait taper cet été. Je la garde sous la main, c'est plus simple. Tu veux la lire ? »"
    left:
      label: "Montrez-la-moi"
      effects:
        direction: "-"
        parole: 1
        set: [faute_lue]   # Almanach : « {annee} : la faute du patron a été lue avant d'être envoyée. »
      answer: "« Vous êtes convocqué lundi à huit heures. » La faute est là, au troisième mot. Il reprend la lettre et la range sans la plier."
    right:
      label: "Gardez-la pour un autre"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Il la glisse dans la poche de sa veste. Le lendemain, il descend parler des primes aux joueurs, sans toi."

  # ==========================================================================
  # § 2.8 — Le centre de formation (7)
  # Un préfabriqué, une pelouse trop courte, un panneau avec les horaires du car.
  # ==========================================================================

  - id: co.dec.centre_flans
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, formation, absurde]
    tone: leger
    cooldown: 25
    when: "season.phase != 'bilan'"
    text: "Marinette pousse le chariot de la cantine du centre et pose un flan devant une chaise vide : « Le petit de Portclair n'est pas rentré hier soir. Je ne l'ai dit qu'à vous. »"
    left:
      label: "Je m'assois avec eux"
      effects: {vestiaire: "+", tribunes: "+"}
      answer: "Tu manges avec treize gamins et une chaise vide. À la fin, l'un d'eux te dit où dort le petit : à la gare routière."
    right:
      label: "Je préviens la direction"
      effects: {direction: "+"}
      answer: "Le centre appelle la famille, puis les gendarmes. On retrouve le petit à la gare routière, assis sur son sac, un billet aller en poche."

  - id: co.dec.centre_panneau
    roles: [entraineur]
    arc: routine
    tags: [decor, formation, moment]
    tone: strategique
    cooldown: 30
    when: "season.phase == 'retour' || season.phase == 'sprint'"
    text: "Solange Brissac, la directrice technique nationale, en visite au centre, pose un doigt sur la liste des quatorze : « Deux passeront pro. Les douze autres l'apprendront par une lettre, en juin. »"
    left:
      label: "Je les préviens moi-même"
      effects: {vestiaire: "-", direction: "+", parole: 1}
      answer: "Tu passes une matinée à dire non, un gamin après l'autre, dans le préfabriqué. Douze familles s'en souviennent longtemps, pas toutes mal."
    right:
      label: "Je laisse la lettre partir"
      effects: {direction: "-", caisse: "+"}
      answer: "La lettre part le 30 juin, tapée par Josiane, très bien écrite. Deux gamins l'ouvrent debout devant la boîte aux lettres."

  - id: co.dec.centre_barbier_pluie
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, formation, moment]
    tone: leger
    cooldown: 30
    when: "season.phase == 'aller' || season.phase == 'hiver'"
    text: "Barbier, le recruteur de Valdorne, en doudoune trempée au bord du terrain annexe : « En soixante-six, il pleuvait, je suis parti à la mi-temps. J'ai raté un gardien. Depuis, je reste jusqu'au bout. »"
    left:
      label: "Qui regardez-vous ?"
      effects: {direction: "+", force: 1}
      answer: "Il montre le dossard neuf sans le nommer. Lundi, Valdorne appelle le président, et le neuf vaut soudain quelque chose."
    right:
      label: "Je le laisse regarder"
      effects: {vestiaire: "+"}
      answer: "Il reste jusqu'au coup de sifflet. Vecchio, sous l'auvent, le reconnaît, et ne vient pas lui serrer la main."

  - id: co.dec.centre_chaussures_trop_grandes
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, formation, vestiaire]
    speaker: mbako
    tone: leger
    cooldown: 30
    when: "season.phase == 'hiver' || season.phase == 'retour'"
    text: "Mbako lace des crampons trop grands, du papier journal enfoncé au bout : « C'est du quarante-cinq. C'est ce qu'il y avait au vestiaire, {toi}. Ma mère ne sait pas. Elle ne doit pas savoir. »"
    left:
      label: "On t'achète ta pointure"
      effects: {caisse: "-", relation: {mbako: 1}, vestiaire: "+"}
      answer: "Les crampons à sa taille arrivent le jeudi. Il les garde dans leur boîte jusqu'au samedi ; sa mère te remercie d'un signe, de loin."
    right:
      label: "Tu joues avec ceux-là"
      effects: {force: 1, relation: {mbako: -1}}
      answer: "Il joue avec le papier journal dans les chaussures. Il ne s'en plaint jamais, et il ne l'oublie jamais non plus."

  - id: co.dec.centre_car_horaire
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, formation, moment]
    tone: leger
    cooldown: 35
    when: "season.phase == 'aller' || season.phase == 'hiver'"
    text: "Marinette, deux sandwichs emballés à la main, sur le quai de la gare routière : « Le car de six heures quarante ramasse les gamins des trois villages. Il en manque un. Il n'y a pas de deuxième car. »"
    left:
      label: "Je vais le chercher"
      effects: {direction: "-", vestiaire: "++"}
      answer: "Tu arrives chez lui à sept heures dix. Sa mère te fait un café qu'elle n'a pas les moyens de faire, et il monte, le sac serré contre lui."
    right:
      label: "Le car part sans lui"
      effects: {vestiaire: "-", force: 1}
      answer: "Il apprend : il arrive à l'heure pendant six ans. Il ne dit jamais à personne qu'il a marché neuf kilomètres ce matin-là."

  - id: co.dec.centre_mur_des_partis
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, formation, moment]
    tone: strategique
    cooldown: 40
    when: "season >= 2"
    text: "Brissac s'arrête devant le mur du préfabriqué : une photo par promotion, un rond au feutre autour de ceux qui sont passés pros. Des années entières sans un rond. « Et les autres, ils sont où ? »"
    left:
      label: "On entoure aussi les autres"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Deux cents ronds au feutre bleu, un par gamin, avec ce qu'il fait aujourd'hui. Le mur devient illisible, et plus juste."
    right:
      label: "Je garde la règle"
      effects: {direction: "+"}
      answer: "Un rond de plus cette année. La promotion d'il y a trois ans n'en a toujours aucun, et Brissac la regarde longtemps."

  - id: co.dec.centre_but_sans_filet
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, formation, caisse]
    tone: leger
    cooldown: 30
    when: "season.phase == 'hiver' || season.phase == 'retour'"
    text: "Lulu porte sous le bras un filet roulé, troué de partout : « Le but nord du terrain annexe n'a plus de filet depuis Noël. Les gamins vont chercher le ballon dans les orties, jusqu'à la friche. »"
    left:
      label: "J'achète deux filets"
      effects: {caisse: "-", vestiaire: "+"}
      answer: "Les filets neufs sont posés le jeudi. Lulu range le vieux dans sa loge, plié, au cas où."
    right:
      label: "Qu'ils aillent le chercher"
      effects: {force: 1, vestiaire: "-"}
      answer: "Ils courent jusqu'à la friche à chaque but. Un soir, l'un d'eux revient sans le ballon, pâle, et ne dit pas ce qu'il a vu."

  # ==========================================================================
  # § 2.9 — L'hôtel du club et les déplacements (6)
  # Chambre 12, moquette à motifs, un plateau de fruits sous film.
  # ==========================================================================

  - id: co.dec.hotel_chambre_douze
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    speaker: vukic
    tone: leger
    cooldown: 30
    when: "season.phase == 'aller' || season.phase == 'retour'"
    text: "Vukić fait tourner la clé de la chambre douze, celle qui donne sur la nationale : « Les camions passent toute la nuit. D'habitude, elle va au dernier arrivé. Ce soir, c'est le petit, {toi}. »"
    left:
      label: "Je prends la douze"
      effects: {vestiaire: "++", force: -1}
      answer: "Tu dors mal, entre deux camions. Au petit-déjeuner, le vestiaire sait déjà que tu as pris la chambre du petit."
    right:
      label: "Donnez-la au petit"
      effects: {vestiaire: "-", direction: "+"}
      answer: "Le petit dort mal et joue en colère. Ça marche une mi-temps, puis il prend un carton pour un tacle en retard."

  - id: co.dec.hotel_plateau_fruits
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, absurde, caisse]
    speaker: sabatier
    tone: leger
    cooldown: 25
    when: "season.phase == 'aller' || season.phase == 'retour'"
    text: "Le Doc soulève le film plastique du plateau de l'hôtel et renifle les poires : « Le même plateau depuis lundi, avec un film neuf dessus. Je ne veux pas d'une gastro la veille d'un match. »"
    left:
      label: "On change de traiteur"
      effects: {caisse: "-", vestiaire: "+"}
      answer: "Le plateau du soir est frais, et facturé le double. Les joueurs mangent sans savoir que le Doc a goûté chaque fruit avant eux."
    right:
      label: "Que personne n'y touche"
      effects: {direction: "+"}
      answer: "Le plateau reste dans le couloir, intact. Le président voit la ligne sur la facture, et te félicite de surveiller les dépenses."

  - id: co.dec.hotel_cloison
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    speaker: brehaut
    tone: leger
    cooldown: 30
    when: "season.phase == 'aller' || season.phase == 'retour'"
    text: "Bréhaut, en survêtement à minuit, frappe deux fois la cloison de l'hôtel : « On entend tout, à travers. Dembo a pleuré au téléphone pendant une heure. Les gars font semblant de dormir. »"
    left:
      label: "Je change les chambres"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Tu refais le plan des chambres à minuit. Dembo dort seul, la porte entrouverte ; au matin, il ne dit pas merci, il dit bonjour."
    right:
      label: "Chacun reste où il est"
      effects: {force: 1, vestiaire: "-"}
      answer: "Personne ne dort. Au petit-déjeuner, Dembo mange seul, et l'échauffement se fait dans un silence de veillée."

  - id: co.dec.hotel_ascenseur
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, absurde, moment]
    tone: leger
    cooldown: 35
    when: "season.phase == 'aller' || season.phase == 'retour'"
    text: "Vogler, l'entraîneur d'en face, casquette vissée, montre au-dessus du poignet, tient la porte de l'ascenseur de l'hôtel : « Quatre places. Mes gars prennent l'escalier, toujours. Les vôtres ? »"
    left:
      label: "On prend l'escalier"
      effects: {force: 1, vestiaire: "+"}
      answer: "Six étages côte à côte avec ses joueurs, dans le bruit des semelles. En haut, les tiens respirent moins fort que les siens, et il le voit."
    right:
      label: "Après vous"
      effects: {direction: "+", force: -1}
      answer: "Il monte seul. Tu attends l'ascenseur suivant avec vingt-deux personnes et un groom qui compte les sacs."

  - id: co.dec.hotel_facture_minibar
    roles: [entraineur]
    arc: routine
    tags: [decor, caisse, vestiaire]
    speaker: josiane
    tone: strategique
    cooldown: 30
    when: "season.phase == 'aller' || season.phase == 'retour'"
    text: "Josiane déplie la note de l'hôtel, longue comme un bras : « Le minibar de la neuf a coûté plus cher que la chambre. Du whisky, à trois heures du matin, la veille du match. La neuf, c'est Dembo. »"
    left:
      label: "Le club paie"
      effects: {caisse: "--", vestiaire: "+"}
      answer: "Le club paie sans rien écrire nulle part. Dembo l'apprend par Josiane, et vient te le dire, les yeux sur ses chaussures."
    right:
      label: "Il paiera lui-même"
      effects: {caisse: "+", vestiaire: "--"}
      answer: "La somme est retenue sur sa paie, au vu de tous. Il raconte l'histoire à chaque nouveau pendant des années, en riant trop fort."

  - id: co.dec.hotel_fenetre_fanfare
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, ultras, absurde]
    speaker: gege
    tone: leger
    cooldown: 35
    when: "season.phase == 'aller' || season.phase == 'retour'"
    text: "Gégé, dans la rue de l'hôtel, un tambour et onze gars du virage, sous les fenêtres de l'équipe d'en face : « Ils sont venus chanter sous les vôtres, en mars. On rend. Jusqu'à quatre heures. »"
    left:
      label: "Rentrez, s'il vous plaît"
      effects: {tribunes: "-", force: 1}
      answer: "Ils remballent en chantant plus bas. Le tambour continue deux rues plus loin, et la police relève les plaques de leurs voitures."
    right:
      label: "Je les laisse jouer"
      effects: {tribunes: "++", force: -1}
      answer: "Le tambour tient jusqu'à quatre heures ; personne ne dort, ni eux ni vous. Leur kop promet de rendre la visite au match retour."

  # ==========================================================================
  # § 2.10 — Le port, la ville, le marché du dimanche (6)
  # La seule sonde de TRIBUNES qui ne passe pas par le stade.
  # ==========================================================================

  - id: co.dec.ville_marche_dimanche
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, tribunes, moment]
    tone: leger
    cooldown: 25
    text: "Au marché du quai sud, Mamie Paulette te fait signe de prendre la file derrière elle : « Trois personnes m'ont parlé du match avant mes poireaux. Aucune n'était contente. Écoutez-les. »"
    left:
      label: "Je fais la queue"
      effects: {tribunes: "++", direction: "-"}
      answer: "Tu écoutes vingt minutes, entre les poireaux et le poisson. Tu apprends deux choses que le club ignore, dont une sur le président."
    right:
      label: "Je passe devant"
      effects: {tribunes: "-", force: 1}
      answer: "Tu passes avec un signe de tête. La file te regarde passer, et le poissonnier te rend la monnaie en regardant ailleurs."

  - id: co.dec.ville_vitrine
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, presse, tribunes]
    tone: leger
    cooldown: 30
    when: "world.rang >= 10"
    text: "Le stagiaire de L'Écho scotche le classement dans la vitrine du journal, rue du Stade, en petit format cette semaine : « Le rédacteur veut une phrase de vous pour la légende. Une seule. »"
    left:
      label: "Je donne une phrase"
      effects: {tribunes: "+", parole: 1, promise: true}
      answer: "« On remontera avant Noël. » Ta phrase reste six semaines dans la vitrine, sous le classement, et tout le quartier la lit."
    right:
      label: "Je ne donne rien"
      effects: {tribunes: "-", direction: "+"}
      answer: "Il affiche le classement sans légende. Le lendemain, quelqu'un a écrit au feutre, sur la vitre, une phrase à ta place."

  - id: co.dec.port_bateau_puymarin
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, moment, absurde]
    tone: leger
    cooldown: 35
    when: "season.phase == 'aller' || season.phase == 'retour'"
    text: "Norbert arrête le car devant la passerelle du bac pour Puymarin, le moteur encore chaud : « Le dernier bac part dans onze minutes. Quatre cents mètres, avec les sacs. Sinon, c'est l'hôtel du port. »"
    left:
      label: "On court"
      effects: {force: -1, vestiaire: "++"}
      answer: "Vingt-deux personnes courent sur le quai avec les sacs. Le marin attend deux minutes de plus, et refuse qu'on le remercie."
    right:
      label: "On dormira sur place"
      effects: {caisse: "-", vestiaire: "+"}
      answer: "Une nuit imprévue à l'hôtel du port ; les chambres sentent le gasoil. Des années après, trois joueurs en parlent comme de la meilleure."

  - id: co.dec.ville_coiffeur
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, famille, tribunes]
    speaker: camille
    tone: leger
    cooldown: 30
    when: "!flag('divorce')"
    text: "Camille pose sur la table une photo découpée dans L'Écho : « Le coiffeur de la rue des Lilas t'a mis en vitrine, entre un chanteur et un cheval de course. Il demande si tu passes avant sept heures. »"
    left:
      label: "Je passe avant sept heures"
      effects: {tribunes: "+", relation: {camille: 1}}
      answer: "Tu y vas. Le coiffeur refuse d'être payé et parle d'un match de soixante-dix-huit ; Camille t'attend dehors, et vous rentrez à pied."
    right:
      label: "Une autre fois"
      effects: {tribunes: "-", relation: {camille: -1}}
      answer: "La photo jaunit en vitrine. Camille y passe seule, le samedi, et répond pour toi aux questions du coiffeur."

  - id: co.dec.ville_ecole
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, presse, tribunes]
    speaker: lea
    tone: leger
    cooldown: 40
    text: "Léa pose sur la table un paquet de lettres d'écoliers, ficelé : « Une classe de CM2 de la rue des Lilas. Trente lettres. Vingt-huit demandent si vous restez, {toi}. Je publie la réponse. »"
    left:
      label: "Je réponds aux trente"
      effects: {tribunes: "++", direction: "-", parole: 1, promise: true}
      answer: "Trente réponses à la main, une par soirée. L'Écho en publie deux ; dans les deux, tu écris que tu restes."
    right:
      label: "Je réponds à la classe"
      effects: {tribunes: "+"}
      answer: "Une seule lettre, lue devant la classe par la maîtresse. Léa la publie entière, sans couper la phrase où tu ne promets rien."

  - id: co.dec.port_bookmaker
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, scandale, retorse]
    tone: strategique
    cooldown: 40
    when: "year >= 1994 && !flag('pisteur')"
    text: "Au bar du quai sud, le patron efface une cote à l'ardoise : {club} champion, à cinq mille contre un. « Deux personnes ont misé. Je dis qui seulement aux clients. Vous prenez un ticket ? »"
    left:
      label: "Je prends un ticket"
      effects:
        direction: "-"
        tribunes: "+"
        set: [pisteur]   # Almanach : « {annee} : une ardoise du port portait deux noms, dont un connu. »
      answer: "Ton ticket porte le numéro quarante et un, à ton nom. Il te souffle un prénom : quelqu'un qui dort dans ton vestiaire."
    right:
      label: "Je ressors sans rien"
      effects: {vestiaire: "+"}
      answer: "Il efface la cote et en écrit une autre, à la craie mouillée. Tu ne sais pas qui ; au vestiaire, quelqu'un respire mieux."

  # ==========================================================================
  # § 2.11 — Salle 3, la salle d'attente (2 sur 8 : le Congrès et l'hôtel du
  # Lac attendent les rôles « président » et « instance »).
  # ==========================================================================

  - id: co.dec.salle3_horloge
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, arbitrage, absurde]
    tone: leger
    cooldown: 35
    when: "season >= 1"
    text: "Devant la salle 3, l'horloge de la salle d'attente avance de quatre minutes. Aurélien Dauzat, le secrétaire général, dossier fermé sur les genoux : « Votre audition est à onze heures. À la leur. »"
    left:
      label: "Je la règle"
      effects: {direction: "-", parole: 1}
      answer: "Tu montes sur une chaise et règles l'horloge devant deux commissaires. Ils notent quelque chose, et ce n'est pas l'heure."
    right:
      label: "J'attends"
      effects: {direction: "+", force: -1}
      answer: "Tu attends quarante minutes, trente-six selon l'horloge. On t'appelle en dernier, et l'audition dure quatre minutes."

  - id: co.dec.salle3_chaise_orange
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, arbitrage, moment]
    tone: leger
    cooldown: 40
    when: "season >= 1"
    text: "Colline, l'arbitre, attend lui aussi devant la salle 3, sur la chaise orange fêlée, son rapport sur les genoux : « Je vous préviens : je ne parle pas du match avant l'audition. Ni après. »"
    left:
      label: "Je m'assois à côté"
      effects: {direction: "+", vestiaire: "+"}
      answer: "Vous attendez côte à côte, quarante minutes, sans parler du match. En sortant, il te tient la porte, et c'est tout."
    right:
      label: "Je reste debout"
      effects: {force: 1, direction: "-"}
      answer: "Tu restes debout quarante minutes devant lui. Il le remarque, et son rapport ne change pas d'une virgule."

  # ==========================================================================
  # § 2.12 — La pelouse, la tribune Est, le panneau (8)
  # Le décor est un personnage : une pelouse qui a un avis, un panneau qui
  # change de nom plus souvent que l'équipe.
  # ==========================================================================

  - id: co.dec.pelouse_taupe
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, absurde, moment]
    tone: leger
    cooldown: 30
    text: "Lulu, à genoux au point de penalty, tasse une taupinière avec les mains : « La troisième cette semaine. Le produit coûte cher, et la mairie ne paie plus. Je le prends sur ma paie ? »"
    left:
      label: "Le club paiera le produit"
      effects: {caisse: "-", direction: "+"}
      answer: "Un homme de la mairie vient avec une boîte et un masque. Les taupes passent sous le terrain annexe, trois mètres plus loin."
    right:
      label: "Laissez-la vivre"
      effects: {tribunes: "+", force: -1}
      answer: "Lulu tasse la terre chaque matin, à genoux. Dimanche, un penalty part de travers sur la bosse, et personne ne parle de la taupe."

  - id: co.dec.tribune_est_14b
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, tribunes, moment]
    tone: strategique
    cooldown: 35
    when: "year <= 2009"
    text: "Le samedi de la réserve, Mamie Paulette essuie le siège 14A avec son mouchoir, puis s'assoit en 14B : « Personne ne s'y met depuis mon mari. Vous voulez regarder d'ici ? »"
    left:
      label: "Je m'assois en 14A"
      effects: {tribunes: "+", vestiaire: "+"}
      answer: "Tu regardes une mi-temps à côté d'elle. À la soixante-dixième minute, elle te prend le bras, les yeux sur le terrain, puis le lâche."
    right:
      label: "Je vous laisse avec lui"
      effects: {tribunes: "+"}
      answer: "Elle pose son mouchoir plié sur le 14A. Le siège reste vide et propre jusqu'au coup de sifflet."

  - id: co.dec.panneau_naming
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, sponsors, ultras]
    speaker: gege
    tone: strategique
    cooldown: 30
    when: "flag('naming_signe')"
    text: "Gégé, sous le nouveau panneau du stade : les lettres orange du sponsor en haut, le nom du club en petit dessous. « Mon père disait le nom du stade avant de dire bonjour, {toi}. Il dirait quoi, là ? »"
    left:
      label: "J'agrandis le nom du club"
      effects: {caisse: "-", tribunes: "++"}
      answer: "Les lettres du club doublent de taille, aux frais du club. Le sponsor demande pourquoi, par écrit, poliment."
    right:
      label: "Je respecte le contrat"
      effects: {tribunes: "--", caisse: "+"}
      answer: "Le panneau reste. Le virage chante l'ancien nom tous les dimanches, et le speaker ne prononce jamais l'autre."

  - id: co.dec.pelouse_arrosage
    roles: [entraineur]
    arc: routine
    tags: [decor, arbitrage, moment]
    tone: leger
    cooldown: 30
    when: "season.phase != 'presaison'"
    text: "Lulu, la main sur la vanne d'arrosage, la veille du match : « Leur équipe joue au sol, et vite. Je peux arroser beaucoup cette nuit. Le délégué ne dira rien : c'est permis. »"
    left:
      label: "Arrosez cette nuit"
      effects: {force: 1, direction: "-", tribunes: "-"}
      answer: "Le terrain est lourd, gras. L'adversaire glisse, vous un peu moins, et l'arbitre te regarde longtemps au coup de sifflet final."
    right:
      label: "Comme d'habitude, Lulu"
      effects: {direction: "+", vestiaire: "+"}
      answer: "Le terrain est parfait. Lulu le répète à tout le monde à la buvette, plus fier de sa pelouse que du résultat."

  - id: co.dec.tribune_travaux
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, caisse, tribunes]
    speaker: josiane
    tone: strategique
    cooldown: 35
    when: "flag('tribune_a_renover')"
    text: "Josiane te montre le devis de la Tribune Nord, deux pages, la seconde agrafée dessous : « Il date de trois étés. L'architecte a souligné une poutre en rouge, et il a écrit « urgent » au crayon. »"
    left:
      label: "On signe cet été"
      effects: {caisse: "--", tribunes: "++", promise: true}
      answer: "Le devis est signé devant toi. L'échafaudage arrive en août, et Gégé vient regarder les ouvriers chaque matin."
    right:
      label: "L'été prochain"
      effects: {tribunes: "-", caisse: "+"}
      answer: "Elle range le devis dans le tiroir du bas. Le dimanche suivant, deux stadiers ferment un rang de la Tribune Nord sans dire pourquoi."

  - id: co.dec.stade_horloge_arretee
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, tribunes, absurde]
    tone: leger
    cooldown: 40
    when: "season >= 1"
    text: "L'horloge du stade de la Rive est arrêtée sur quatre heures dix. Lulu, au pied de l'échelle : « Le réparateur peut venir lundi. Mais en ville, on se donne rendez-vous sous quatre heures dix. »"
    left:
      label: "Faites-la réparer"
      effects: {caisse: "-", tribunes: "-"}
      answer: "L'horloge repart un lundi. Le dimanche suivant, deux anciens s'attendent dessous à quatre heures dix, et ne se trouvent pas."
    right:
      label: "Laissez-la arrêtée"
      effects: {tribunes: "++"}
      answer: "Elle reste sur quatre heures dix. L'Écho en fait sa photo de rentrée, et la ville continue d'y donner rendez-vous."

  - id: co.dec.stade_chien_corner
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, absurde, vestiaire]
    tone: leger
    cooldown: 25
    text: "Corner, le vieux chien de Lulu, dort au bord de la surface pendant la séance, comme chaque jour depuis dix ans. Lulu, gêné : « Le président a écrit : l'assurance ne couvre pas les chiens. »"
    left:
      label: "Il peut rester"
      effects: {vestiaire: "++", force: -1}
      answer: "Corner reste. Les joueurs le contournent sans y penser, et l'un d'eux lui garde la moitié de son sandwich."
    right:
      label: "Sortez-le"
      effects: {force: 1, vestiaire: "-"}
      answer: "Lulu l'attache à la grille du parking. Il gémit toute la séance, et la séance est courte, sèche, efficace."

  - id: co.dec.stade_sono
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, ultras, sponsors]
    tone: leger
    cooldown: 30
    when: "season.phase != 'presaison'"
    text: "Nino tient la prise de la sono qu'il vient d'arracher, dans la cabine du speaker : « Ils passent la chanson du sponsor à l'entrée des joueurs. Le virage veut son chant à lui. On remet le nôtre ? »"
    left:
      label: "Remettez votre chant"
      effects: {tribunes: "++", direction: "-"}
      answer: "Le virage chante seul à l'entrée des joueurs, sans sono, plus fort que jamais. Le sponsor appelle le président dès le lundi."
    right:
      label: "Rebranchez la sono"
      effects: {tribunes: "-", caisse: "+"}
      answer: "La chanson du sponsor passe. Le virage la couvre en chantant par-dessus, comme chaque dimanche."

  # ==========================================================================
  # § 2.13 — Le restaurant, la boucherie, le bistrot (4 sur 7 : la boucherie
  # et le comptoir attendent les rôles amateurs). On mange, jamais gratuitement.
  # ==========================================================================

  - id: co.dec.resto_port_addition
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, agents, caisse]
    speaker: fardelli
    tone: leger
    cooldown: 25
    text: "Au restaurant du port, Fardelli pose la main à plat sur l'addition avant que tu la voies : « Laisse, {toi}. Entre amis, on ne compte pas. Un jour, tu me rendras un petit service, trois fois rien. »"
    left:
      label: "Je paie ma part"
      effects: {caisse: "-", direction: "+", parole: 1}
      answer: "Tu poses tes billets sur la nappe. Il les regarde, sourit sans les toucher, et note quelque chose dans son carnet."
    right:
      label: "Je le laisse payer"
      effects: {caisse: "+", direction: "-"}
      answer: "Il paie tout, en liquide. Onze jours plus tard, à midi pile, il rappelle pour le petit service."

  - id: co.dec.resto_solvang_eau
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, agents, direction]
    tone: leger
    cooldown: 30
    when: "year >= 2000"
    text: "Ingrid Solvang, l'agente, une carafe d'eau et un carnet ouvert, rien d'autre sur la table : « Je note tout ce qu'on se dit, et je vous envoie la page, signée. Fardelli, lui, ne note jamais. »"
    left:
      label: "Notez tout"
      effects: {direction: "+", caisse: "+"}
      answer: "Elle note. La page arrive par courrier trois jours plus tard, datée, signée, et il n'y manque rien."
    right:
      label: "On parle sans papier"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Elle referme le carnet et pose son stylo dessus. Un mois plus tard, elle te cite mot pour mot."

  - id: co.dec.resto_dembo_table
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, presse]
    tone: leger
    cooldown: 30
    text: "Au restaurant du port, Dembo préside une table de quatorze, dont six qu'il ne connaît pas. Il paie pour tous : « Ils sont de mon quartier, je crois. On ne dit pas non aux gens de son quartier. »"
    left:
      label: "Je m'assois deux minutes"
      effects: {vestiaire: "+", tribunes: "+"}
      answer: "Tu restes une heure. Deux photos sortent le lendemain dans La Gazette, floues, et l'addition de Dembo aussi."
    right:
      label: "Je passe mon chemin"
      effects: {force: 1, vestiaire: "-"}
      answer: "Il lève son verre vers toi, de loin. À minuit, il paie quatorze repas, et rentre seul à pied le long du quai."

  - id: co.dec.bistrot_ecran
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, ultras, presse]
    speaker: gege
    tone: leger
    cooldown: 35
    when: "year >= 2003"
    text: "Au bistrot de la rue du Stade, Gégé montre l'écran : le match du dimanche soir, celui de la capitale. « Le nôtre, personne ne le passe. L'abonnement, c'est le prix d'un car de supporters. »"
    left:
      label: "On paie l'abonnement"
      effects: {caisse: "-", tribunes: "++"}
      answer: "Le bistrot diffuse le club. Il est plein le dimanche, et le patron colle une affiche à ton nom à côté du menu."
    right:
      label: "Je laisse l'autre match"
      effects: {tribunes: "-", direction: "+"}
      answer: "L'écran montre la capitale. Douze habitués partent au stade à pied, et Gégé reste seul au comptoir, devant les autres."

  # ==========================================================================
  # § 2.14 — La maison (3 sur 4 : le dessin de Sacha attend sa fiche)
  # La maison n'est pas un décor, c'est la cinquième jauge.
  # ==========================================================================

  - id: co.dec.maison_repas_froid
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, famille, moment]
    speaker: camille
    tone: leger
    cooldown: 25
    when: "!flag('divorce')"
    text: "Camille soulève l'assiette retournée sur la tienne : « Ton dîner. Je l'ai gardé au chaud jusqu'à neuf heures, {toi}. Après, je l'ai juste gardé. La voisine demande si tu habites encore ici. »"
    left:
      label: "Je le mange froid"
      effects: {relation: {camille: 1}, force: -1}
      answer: "Tu manges froid en face d'elle. Elle raconte sa journée, la voisine, le loyer, et c'est mieux que le repas."
    right:
      label: "J'ai déjà mangé"
      effects: {relation: {camille: -1}, direction: "+"}
      answer: "Elle range l'assiette. Le lendemain, elle ne met qu'un couvert, et ne dit pas pourquoi."

  - id: co.dec.maison_valise_couloir
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, famille, moment]
    speaker: camille
    tone: strategique
    cooldown: 40
    when: "season >= 2 && relation.camille <= 0 && !flag('divorce')"
    text: "Camille enjambe la valise ouverte, vide, posée à plat dans le couloir depuis le dernier déplacement : « Trois semaines qu'elle est là. Je ne sais plus si elle est à toi, ou si je dois la remplir. »"
    left:
      label: "Je la range"
      effects: {relation: {camille: 1}, direction: "-"}
      answer: "Tu la ranges en haut du placard. Le couloir redevient un couloir, et elle te regarde faire, appuyée au chambranle."
    right:
      label: "Je repars jeudi"
      effects: {relation: {camille: -1}, force: 1}
      answer: "La valise reste ouverte. Chaque soir, quelque chose de plus est plié dedans, et ce n'est pas à toi."

  - id: co.dec.maison_telephone_clow
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, famille, moment]
    speaker: clow
    statut_ok: [parti, retraite]
    tone: leger
    cooldown: 35
    when: "year <= 2000"
    text: "Corven au téléphone, un verre qu'on entend poser : « Ton match, sur un poste qui prend une chaîne et demie. Ton arrière gauche part trop tôt. Comme Jeannot, en soixante-huit. Tu veux la suite ? »"
    left:
      label: "Dis-moi ce que tu as vu"
      effects: {vestiaire: "+", force: 1, relation: {clow: 1}}
      answer: "Il parle onze minutes du même joueur, et de Jeannot, qui a fini à l'usine. Il a raison sur dix ; à la onzième, il tousse."
    right:
      label: "Une autre fois, il est tard"
      effects: {relation: {clow: -1}, direction: "+"}
      answer: "Il dit « bien sûr ». Il rappelle quinze jours plus tard, plus court, et ne parle plus de Jeannot."

  # ==========================================================================
  # § 3 — Les vingt running gags (quatorze importés ici)
  #
  # Règle du gag (ch. 31 § 3) : deux fois par saison au plus, jamais deux
  # d'affilée, et il **vieillit**. Quatre âges : S0 découverte, S1
  # confirmation, S2+ variation, lignée héritage. Le troisième passage doit
  # être tordu, sinon le gag meurt. Jamais plus d'une jauge.
  #
  # Mécanique d'import : l'âge se lit avec `seen()` sur la carte de l'âge
  # précédent ; S0 et S1 sont `once: true`, S2+ l'est devenu (voir plus bas).
  #
  # `priority: 1` sur les âges S1 et S2 (relecture des quatre postulats, défaut
  # d'exposition § 5.1). Mesure : une carrière du promu ne tire que **3,5**
  # cartes de sac (300 cartes dans le sac de l'entraîneur), et l'âge suivant
  # d'un gag n'était qu'une carte de plus parmi trois cents le jour où sa garde
  # devenait vraie. Résultat : sur 300 carrières, les vingt-huit cartes
  # `co.gag.*_s1` / `*_s2` n'étaient **jamais** servies — un running gag qui ne
  # revient pas n'est pas un gag, c'est une carte de décor. La bande de
  # priorité est faite pour ça (« la plus haute bande éligible gagne ») : le
  # jour où le gag a commencé, sa suite passe devant le décor ordinaire, et
  # elle ne coûte qu'un tirage de sac.
  # `once: true` ajouté aux âges S2 : sans lui, une carte de priorité 1 sans
  # `once` reprendrait la main tous les 30 tirages jusqu'à la fin de la
  # carrière. La variation se voit une fois ; la lignée (le quatrième âge) est
  # une autre carte.
  # Les six gags manquants (les plantes vertes de l'hôtel du sponsor, le badge
  # vert, « après le Congrès », le stagiaire de l'Écho, la minute de silence,
  # le distributeur d'après 2038) tiennent à des rôles ou à des décennies que
  # ce lot ne sert pas encore.
  # ==========================================================================

  # --- § 3.1 La faute du président (« convocqué » depuis 1991) ---------------
  # S1 est la carte de décor `co.dec.bureau_sms_faute` (le brouillon, trace
  # `faute_lue`) : le gag ne la double pas, il la lit.
  - id: co.gag.faute_s0
    roles: [entraineur]
    arc: routine
    tags: [gag, direction, absurde]
    speaker: aulard
    tone: leger
    once: true
    cooldown: 30
    text: "Vaubourg punaise lui-même une note au tableau du vestiaire : « Les joueurs sont convocqués samedi, neuf heures, à mon bureau. » Il se retourne vers toi : « Quelque chose à redire ? »"
    left:
      label: "Rien à redire"
      effects: {direction: "+"}
      answer: "La note reste six semaines au tableau. Samedi, les joueurs montent un par un à son bureau, et redescendent sans te regarder."
    right:
      label: "Une lettre de trop"
      effects: {direction: "-", vestiaire: "+"}
      answer: "Tu barres le « q » au stylo, devant les joueurs. Il sourit pour eux, pas pour toi, et repunaise la note telle quelle."

  - id: co.gag.faute_s2
    roles: [entraineur]
    arc: routine
    tags: [gag, direction, absurde]
    speaker: josiane
    tone: leger
    cooldown: 30
    priority: 1
    once: true
    when: "flag('faute_lue')"
    text: "Josiane pose sur ton bureau cent convocations pour les parents du centre, tirées sur le modèle du président, avec sa faute. « Il tient à son modèle. Je les retape quand même ? »"
    left:
      label: "Retapez-les"
      effects: {direction: "+"}
      answer: "Elle retape les cent le soir, seule au bureau. Le président ne remarque rien, et on la félicite pour la propreté du courrier."
    right:
      label: "Envoyez-les comme ça"
      effects: {vestiaire: "+"}
      answer: "Les cent partent. Au vestiaire, quelqu'un en punaise une à côté de la note du président, et on en rit jusqu'au mardi."

  # --- § 3.2 Le journal rangé « sous les autres » ----------------------------
  - id: co.gag.journal_s0
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, presse, direction]
    speaker: josiane
    tone: leger
    once: true
    cooldown: 25
    when: "season >= 1"
    text: "Josiane glisse L'Écho sous la pile du courrier au moment où tu entres : « Page cinq, il y a votre nom à côté d'un mot que je n'aime pas. Je le mets dessous. Vous le lirez si vous voulez. »"
    left:
      label: "Je le lis maintenant"
      effects: {direction: "-", parole: 1}
      answer: "Le mot est « sursis ». Elle range la pile pendant que tu lis, sans jamais lever les yeux vers toi."
    right:
      label: "Laissez-le dessous"
      effects: {relation: {josiane: 1}}
      answer: "La pile est droite. Le coin du journal dépasse d'un demi-centimètre, et tu le vois toute la journée."

  - id: co.gag.journal_s1
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, presse, direction]
    speaker: josiane
    tone: leger
    once: true
    cooldown: 25
    priority: 1
    when: "seen('co.gag.journal_s0')"
    text: "Cette fois, Josiane ne t'en parle pas. Le café est fait, le courrier trié, et un coin de papier rose dépasse de la pile, exactement là où ta main se pose d'habitude."
    left:
      label: "Je tire le coin rose"
      effects: {direction: "-", tribunes: "+"}
      answer: "La Gazette Rose te descend en page trois. À midi, le local l'a déjà découpée et punaisée à l'envers, en signe de soutien."
    right:
      label: "Je pose la main à côté"
      effects: {relation: {josiane: 1}}
      answer: "Elle repousse le coin du pouce sous la pile. Tu ne lis pas la page trois ; le facteur, lui, l'a lue."

  - id: co.gag.journal_s2
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, presse, direction]
    speaker: josiane
    tone: strategique
    cooldown: 30
    priority: 1
    once: true
    when: "seen('co.gag.journal_s1')"
    text: "Le tiroir du bas est entrouvert : une chemise à ton nom, épaisse d'un doigt, des coupures datées au crayon. Josiane ne le referme pas : « Toutes. Pour le jour où quelqu'un les demandera. »"
    left:
      label: "Ouvrez la chemise"
      effects: {direction: "-", parole: 1}
      answer: "Onze coupures datées. Deux ne parlent pas de toi : elles parlent du président, et de l'argent de la mairie."
    right:
      label: "Refermez le tiroir"
      effects: {direction: "+", relation: {josiane: 1}}
      answer: "Elle le referme du genou. Le dossier reste là, et toi, maintenant, tu sais qu'il existe."

  # --- § 3.3 La canette orange du fonds -------------------------------------
  - id: co.gag.canette_s0
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, sponsors, absurde]
    speaker: nassir
    tone: leger
    once: true
    cooldown: 30
    text: "Cheikh Ilyas pose deux canettes orange sur la table de réunion, la marque tournée vers toi, et n'en ouvre aucune : « Notre boisson. Elle pourrait être sur vos maillots l'an prochain. Servez-vous. »"
    left:
      label: "J'en prends une"
      effects: {caisse: "+", vestiaire: "-"}
      answer: "Tu la gardes fermée toute la réunion. Tu repars avec, et les joueurs l'ont vue dans ta main."
    right:
      label: "Je bois de l'eau"
      effects: {direction: "-"}
      answer: "Il range les deux canettes dans sa serviette, sans commentaire. Il note quelque chose au dos d'une carte de visite."

  - id: co.gag.canette_s1
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, sponsors, absurde]
    speaker: nassir
    tone: leger
    once: true
    cooldown: 30
    priority: 1
    when: "seen('co.gag.canette_s0')"
    text: "Ilyas appelle à huit heures, sans dire bonjour : « Les deux canettes de l'autre jour. Elles sont ouvertes ? Je ne vous le demande pas pour la boisson. »"
    left:
      label: "Toujours fermées"
      effects: {direction: "+"}
      answer: "« Bien. » Le mois suivant, un coursier en dépose deux autres, ton nom tapé à la machine sur l'étiquette."
    right:
      label: "J'en ai bu une"
      effects: {caisse: "+", vestiaire: "-"}
      answer: "Silence au bout du fil. La semaine suivante, une palette entière attend devant le vestiaire, à ton nom."

  - id: co.gag.canette_s2
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, sponsors, absurde]
    tone: leger
    cooldown: 30
    priority: 1
    once: true
    when: "seen('co.gag.canette_s1')"
    text: "La machine à boissons du couloir a été remplacée dans la nuit : quarante-huit canettes orange, le logo du fonds, rien d'autre. Le livreur avait un bon signé du président, pas de toi."
    left:
      label: "Je fais remettre de l'eau"
      effects: {caisse: "-", vestiaire: "+"}
      answer: "Deux rangées d'eau reviennent, sur la facture du club. Le livreur note qui l'a demandé, sur un carnet qui ne reste pas au club."
    right:
      label: "Je laisse la machine"
      effects: {caisse: "+", vestiaire: "-"}
      answer: "Le couloir sent le sucre. Trois joueurs apportent leur gourde de chez eux, et ne disent pas pourquoi."

  # --- § 3.4 Le « devant » du mentor ----------------------------------------
  - id: co.gag.devant_s0
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, moment, vestiaire]
    speaker: clow
    statut_ok: [parti, retraite]
    tone: leger
    once: true
    cooldown: 30
    when: "year <= 2000"
    text: "Au bar d'en face, Corven fait rouler son chewing-gum, un verre d'eau plein devant lui : « Ton six court après tout. J'en avais un pareil en soixante-quatre. Tu veux savoir ce qu'il est devenu ? »"
    left:
      label: "Raconte-moi"
      effects: {vestiaire: "+", relation: {clow: 1}}
      answer: "Celui de soixante-quatre a fini pompiste, les genoux en verre. Le lendemain, tu glisses un mot à Vukić, et le tien souffle une séance."
    right:
      label: "Pas ce soir"
      effects: {force: 1, relation: {clow: -1}}
      answer: "Il repousse le verre de deux centimètres, sans insister. Dimanche, ton six court partout, encore."

  - id: co.gag.devant_s1
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, moment, vestiaire]
    speaker: clow
    statut_ok: [parti, retraite]
    tone: leger
    once: true
    cooldown: 30
    priority: 1
    when: "seen('co.gag.devant_s0') && year <= 2000"
    text: "Corven te regarde sortir du couloir, le verre plein devant lui : « Tu as tenu, ce soir, {toi}. » Puis, très vite, comme on reprend une pièce sur le comptoir : « Enfin. Un soir. On verra en juin. »"
    left:
      label: "Je m'assois avec toi"
      effects: {vestiaire: "+", relation: {clow: 1}}
      answer: "Vous restez jusqu'à la fermeture. Il te pousse son verre plein ; tu ne le bois pas non plus, et il a l'air content."
    right:
      label: "Je rentre revoir le match"
      effects: {force: 1}
      answer: "Il approuve d'un mouvement de mâchoire. Juin arrive, et il ne redit pas la phrase, même quand il le pourrait."

  - id: co.gag.devant_s2
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, moment, formation]
    speaker: clow
    statut_ok: [parti, retraite]
    tone: strategique
    cooldown: 35
    priority: 1
    once: true
    when: "seen('co.gag.devant_s1')"
    text: "Corven pose une coupure de L'Écho à côté de son verre : un gamin que le club a laissé partir en juin, deux buts dimanche en Régional. « Il les met ailleurs, {toi}. Tu as vu ses appuis ? »"
    left:
      label: "Je le rappelle"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Le gamin ne rappelle pas. Sa mère, si, trois semaines plus tard, pour demander ce qu'on propose, par écrit."
    right:
      label: "Je n'appelle pas"
      effects: {direction: "+", relation: {clow: -1}}
      answer: "Il replie la coupure et la glisse sous son verre. Il ne te demande plus jamais de nouvelles de personne."

  # --- § 3.5 « Ici, on payait en bières » -----------------------------------
  - id: co.gag.bieres_s0
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, caisse, absurde]
    tone: leger
    once: true
    cooldown: 30
    text: "Gérard compte la recette du dimanche dans sa boîte à gâteaux en fer, l'élastique au poignet : « Vingt ans que je compte seul, le soir, sans témoin. Tu restes, pour une fois ? »"
    left:
      # « écus » était un anachronisme : le monde du jeu ne passe à l'écu qu'en
      # 2002 (co.nv.2000_ecus_annonce, co.nv.2002_ecus) et cette carte est
      # servie dès la première saison, en 1990.
      label: "Je reste et je compte"
      effects: {caisse: "+"}
      answer: "Vous comptez deux fois. Il manque un billet, puis il le retrouve sous l'élastique, et te remercie trop longtemps."
    right:
      label: "Je vous fais confiance"
      effects: {tribunes: "+"}
      answer: "Il note un chiffre dans son carnet à spirale sans te le montrer. Au comptoir, on t'offre la bière d'après."

  - id: co.gag.bieres_s1
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, caisse, absurde]
    tone: leger
    once: true
    cooldown: 30
    priority: 1
    when: "seen('co.gag.bieres_s0')"
    text: "Gérard tranche un jambon derrière le comptoir, quatre habitués accoudés : « Paraît que ton salaire d'un mois, c'est deux saisons de buvette. Moi, vingt ans de dimanches, c'est zéro. »"
    left:
      label: "Baissez la voix"
      effects: {direction: "+", tribunes: "-"}
      answer: "Il baisse la voix. Les quatre habitués ont déjà retenu le chiffre, et ils le répètent mieux que lui."
    right:
      label: "Je confirme le chiffre"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Le comptoir se tait. Gérard te sert sans faire payer ; vendredi, le président a le chiffre et la phrase sur son bureau."

  - id: co.gag.bieres_s2
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, caisse, mercato]
    tone: leger
    cooldown: 30
    priority: 1
    once: true
    when: "seen('co.gag.bieres_s1')"
    text: "Gérard a entouré au crayon, dans le journal, le prix d'un transfert : « Avec ça, on refait la buvette quarante fois. On me refuse un évier neuf depuis trois ans. Un jour, je pars au soleil, tu sais. »"
    left:
      label: "Affichez la page"
      effects: {tribunes: "++"}
      answer: "La page est punaisée au-dessus de la caisse. Les abonnés la lisent en payant leur bière, et grognent contre le club."
    right:
      label: "Rangez ce papier"
      effects: {direction: "+", tribunes: "-"}
      answer: "Il plie la page en quatre et la glisse dans la boîte en fer, sous l'élastique, avec la recette du jour."

  # --- § 3.6 « J'étais là en cinquante et un » ------------------------------
  - id: co.gag.cinquante_et_un_s0
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, tribunes, moment]
    tone: leger
    once: true
    cooldown: 30
    when: "year <= 2009"
    text: "Mamie Paulette tapote la rambarde de la tribune Est, sa carte d'abonnée numéro sept à la main : « Inaugurée un dimanche de pluie. Mon mari a pris froid ce jour-là. Il est revenu tous les dimanches. »"
    left:
      label: "Racontez-moi"
      effects: {tribunes: "+"}
      answer: "Elle raconte douze minutes : la fanfare, la boue, le maire qui glisse sur l'estrade. Tu rates le début de la séance, et ça t'est égal."
    right:
      label: "Une autre fois"
      effects: {tribunes: "-"}
      answer: "Elle regarde le terrain sans répondre. Le dimanche suivant, elle ne te salue pas, et tu le remarques."

  - id: co.gag.cinquante_et_un_s1
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, tribunes, moment]
    tone: leger
    once: true
    cooldown: 30
    priority: 1
    when: "seen('co.gag.cinquante_et_un_s0') && year <= 2009"
    text: "Mamie Paulette t'arrête dans l'escalier de la tribune Est, son programme roulé dans la main : « Celui d'avant m'a promis le maintien, ici même, sur cette marche. Il est resté onze mois. Et vous ? »"
    left:
      label: "Je resterai plus longtemps"
      effects: {tribunes: "+", promise: true}
      answer: "Elle note la date sur son programme, au stylo bille. Elle garde tous les programmes dans une boîte à chaussures, avec les promesses."
    right:
      label: "Je ne promets rien"
      effects: {tribunes: "-", vestiaire: "+"}
      answer: "Elle approuve d'un signe. Dans l'escalier, deux joueurs ont entendu, et ils te regardent autrement."

  - id: co.gag.cinquante_et_un_s2
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, tribunes, sponsors]
    tone: strategique
    cooldown: 35
    priority: 1
    once: true
    when: "seen('co.gag.cinquante_et_un_s1') && year <= 2009"
    text: "La tribune Est passe tout-assis, sièges neufs offerts par un sponsor. Mamie Paulette tient son abonnement : la 14B n'existe plus. « Mon mari est parti en 14A. Je m'assois où, maintenant ? »"
    left:
      label: "Gardez-lui la 14B"
      effects: {tribunes: "++", caisse: "-"}
      answer: "On peint « 14B » à la main sur un siège neuf. L'Écho le raconte, et deux mille abonnés le répètent au guichet."
    right:
      label: "Elle aura une place neuve"
      effects: {caisse: "+", tribunes: "-"}
      answer: "Elle prend la place neuve, rang G. À la soixante-dixième minute, chaque dimanche, elle se retourne vers l'ancienne."

  # --- § 3.7 Le seau du mystique --------------------------------------------
  - id: co.gag.seau_s0
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, absurde, moment]
    tone: leger
    once: true
    cooldown: 30
    text: "Sur le banc d'en face, Anselmo Vaz a retourné un seau à un mètre de la ligne et parle à son ailier à chaque arrêt de jeu. Ton latéral perd pied. Le délégué ne trouve aucun article."
    left:
      label: "Je descends au bord aussi"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Tu passes la mi-temps debout sur la ligne, à parler à ton latéral. Il se calme ; le délégué note ton nom."
    right:
      label: "Je reste sur le banc"
      effects: {direction: "+"}
      answer: "Vaz gagne son duel à un mètre de la ligne. Le président te félicite pour ta tenue, ce qui ne rattrape rien."

  - id: co.gag.seau_s1
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, absurde, moment]
    tone: leger
    once: true
    cooldown: 30
    priority: 1
    when: "seen('co.gag.seau_s0')"
    text: "La fois d'après, Anselmo Vaz a de nouveau son seau, numéroté au pochoir. Il t'attend dans le couloir, avant le coup d'envoi : « Votre six joue trop haut. Je vous le dis avant. Ça ne changera rien. »"
    left:
      label: "Je lui serre la main"
      effects: {vestiaire: "+"}
      answer: "Il garde ta main une seconde de trop, sans sourire. Tes joueurs l'ont vu, et ils entrent sur le terrain sans peur de lui."
    right:
      label: "Je passe sans répondre"
      effects: {force: 1}
      answer: "Le six joue haut quand même, et marque à la trentième. Vaz ne se lève pas de son seau ; il lève deux doigts vers toi."

  - id: co.gag.seau_s2
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, absurde, arbitrage]
    tone: leger
    cooldown: 30
    priority: 1
    once: true
    when: "seen('co.gag.seau_s1')"
    text: "Le règlement interdit désormais tout objet dans la zone technique. Anselmo Vaz s'est assis par terre, dos au grillage, le costume dans la poussière. Ses joueurs n'osent plus le regarder."
    left:
      label: "Je lui envoie une chaise"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Il refuse la chaise d'un geste, sans lever la tête. Tes joueurs t'ont vu faire ; certains trouvent que tu as pitié de l'adversaire."
    right:
      label: "Je laisse faire le règlement"
      effects: {direction: "+", tribunes: "-"}
      answer: "Il reste par terre toute la seconde période. Au retour, sa tribune apporte des seaux par centaines, et siffle ton nom."

  # --- § 3.9 Le radiateur qui tousse ----------------------------------------
  - id: co.gag.radiateur_s0
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, caisse, absurde]
    speaker: josiane
    tone: leger
    once: true
    cooldown: 30
    when: "season.phase == 'hiver'"
    text: "Josiane te tend un pull, puis le relevé du gaz : « Trois mois de retard. Ils coupent le quinze. D'ici là, le radiateur tousse, et on garde nos pulls. »"
    left:
      label: "On paie la facture"
      effects: {caisse: "-", direction: "+"}
      answer: "Le chèque part le jour même. Le radiateur se tait deux jours, puis il recommence le jeudi, plus grave."
    right:
      label: "Je garde le pull"
      effects: {vestiaire: "+", relation: {josiane: 1}}
      answer: "Tu gardes le pull jusqu'en avril. Les joueurs s'entraînent en tenue d'hiver et ne se plaignent pas devant toi."

  - id: co.gag.radiateur_s1
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, absurde, direction]
    tone: leger
    once: true
    cooldown: 30
    priority: 1
    when: "seen('co.gag.radiateur_s0')"
    text: "À la Fédération, on te fait attendre dans un bureau glacé, sous un portrait officiel. Le radiateur tousse exactement comme celui du club. L'huissier : « Il fait ça depuis trois présidents. »"
    left:
      label: "Je le signale"
      effects: {direction: "-"}
      answer: "On note ta remarque au procès-verbal : « incident technique ». Ton dossier passe en dernier, et tu sais pourquoi."
    right:
      label: "Je garde mon manteau"
      effects: {vestiaire: "+"}
      answer: "Tu gardes ton manteau toute l'audience. Le soir, tu racontes le radiateur au vestiaire, et pour une fois ils rient avec toi."

  - id: co.gag.radiateur_s2
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, absurde, caisse]
    tone: leger
    cooldown: 30
    priority: 1
    once: true
    when: "seen('co.gag.radiateur_s1')"
    text: "Le radiateur neuf, enfin payé, garanti dix ans, s'est mis à tousser mardi. Le plombier, à genoux, l'oreille contre le tuyau : « C'est pas lui. C'est le bâtiment. Tout est pourri, dedans. »"
    left:
      label: "On refait la tuyauterie"
      effects: {caisse: "--", direction: "+"}
      answer: "Trois semaines de travaux, le couloir éventré. Le président fait visiter le chantier à la mairie, et pose devant pour L'Écho."
    right:
      label: "On fait avec"
      effects: {vestiaire: "+"}
      answer: "Au bout d'un mois, plus personne ne l'entend. Les visiteurs l'entendent toujours, eux, en premier."

  # --- § 3.10 Le fax et « transfet » ----------------------------------------
  # S0 est la carte de décor `co.dec.bureau_fax_faute`.
  - id: co.gag.transfet_s1
    roles: [entraineur]
    arc: routine
    tags: [gag, mercato, absurde]
    speaker: josiane
    tone: leger
    once: true
    cooldown: 30
    priority: 1
    when: "year <= 2010 && seen('co.dec.bureau_fax_faute')"
    text: "Josiane tient une page renvoyée par {rival} : ton offre pour leur arrière, l'heure du fax entourée en rouge. « Ils disent qu'elle est arrivée après minuit. Elle est partie à onze heures moins dix. »"
    left:
      label: "Envoyez votre registre"
      effects: {direction: "+"}
      answer: "Elle faxe la copie de son registre, l'heure vraie, signée. On ne répond plus, en face, et l'arrière signe ailleurs."
    right:
      label: "Ne répondez pas"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Elle range la page dans le tiroir du bas, cercle rouge compris. Le vestiaire apprend l'histoire, et la garde pour le derby."

  - id: co.gag.transfet_s2
    roles: [entraineur]
    arc: routine
    tags: [gag, mercato, absurde]
    speaker: josiane
    tone: leger
    cooldown: 30
    priority: 1
    once: true
    when: "year >= 2010"
    text: "Josiane débranche le fax, enroule le câble autour et pose le registre des heures sur l'armoire : « Tout part par courriel, maintenant. Je continue le registre, ou je le range ? »"
    left:
      label: "Rangez le registre"
      effects: {direction: "+"}
      answer: "Le registre part aux archives, des années d'heures écrites à la main. Le président trouve le bureau plus moderne."
    right:
      label: "Continuez le registre"
      effects: {vestiaire: "+", relation: {josiane: 1}}
      answer: "Elle imprime chaque courriel et note l'heure au stylo. Un soir de mercato, c'est son registre qui fait foi."

  # --- § 3.11 Le sifflet de la kiné -----------------------------------------
  - id: co.gag.sifflet_s0
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, vestiaire, moment]
    tone: leger
    once: true
    cooldown: 30
    text: "Nadia Rouvier, la kiné, siffle la fin de la séance à l'heure pile, au milieu de l'exercice : « Le dix tire sur son mollet depuis mardi. Dix minutes de plus, c'est trois semaines sans lui. »"
    left:
      label: "Encore dix minutes"
      effects: {force: 1, vestiaire: "-"}
      answer: "Dix minutes de plus. Le dix sort en se tenant le mollet, et elle note l'heure dans son carnet rouge."
    right:
      label: "On rentre"
      effects: {vestiaire: "+"}
      answer: "Le groupe rentre au trot. Le soir, le dix passe sur sa table ; elle dit qu'on a eu de la chance, cette fois."

  - id: co.gag.sifflet_s1
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, vestiaire, absurde]
    tone: leger
    once: true
    cooldown: 30
    priority: 1
    when: "seen('co.gag.sifflet_s0')"
    text: "Le sifflet de Rouvier a disparu de sa trousse : quelqu'un l'a rangé au fond d'un tiroir du bureau, sous les feuilles de match. À l'heure pile, elle siffle quand même, deux doigts dans la bouche."
    left:
      label: "Je lui rends le sifflet"
      effects: {vestiaire: "+"}
      answer: "Elle le raccroche à son cou sans commentaire. Le point de vernis rouge est écaillé ; elle le gratte du pouce."
    right:
      label: "Je laisse le tiroir fermé"
      effects: {force: 1, vestiaire: "-"}
      answer: "Deux doigts suffisent : on l'entend du parking. Au vestiaire, on commence à compter qui est avec elle."

  - id: co.gag.sifflet_s2
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, vestiaire, formation]
    tone: leger
    cooldown: 30
    priority: 1
    once: true
    when: "seen('co.gag.sifflet_s1')"
    text: "Rouvier a prêté son sifflet à un jeune kiné qui n'ose pas s'en servir : la séance a douze minutes de retard. Elle regarde du bord, les bras croisés, son manteau déjà sur le dos."
    left:
      label: "Siffle à sa place"
      effects: {vestiaire: "-", force: 1}
      answer: "Elle ne bouge pas : « Il faut qu'il ose sans moi. » Le soir, elle a rendez-vous à la banque, pour un local en ville."
    right:
      label: "J'attends qu'il ose"
      effects: {vestiaire: "+"}
      answer: "Il ose à la seizième minute. Le groupe applaudit, il rougit, et Rouvier s'en va avant la fin."

  # --- § 3.12 « Le groupe vit bien » ----------------------------------------
  - id: co.gag.groupe_s0
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, vestiaire, moment]
    speaker: brehaut
    tone: leger
    once: true
    cooldown: 25
    text: "Bréhaut passe la tête par la porte, une glacière sous le bras : « Jeudi, on mange tous chez Momo. Même les deux qui ne se parlent plus depuis le penalty. C'est mieux avec toi, ou sans ? »"
    left:
      label: "Je viens jeudi"
      effects: {vestiaire: "+"}
      answer: "Tu manges, tu repars à neuf heures ; ils restent. Le vendredi, les deux du penalty se font des passes."
    right:
      label: "Faites-le entre vous"
      effects: {vestiaire: "+", direction: "+"}
      answer: "Il approuve. Le jeudi dure jusqu'à minuit ; le vendredi, la séance est lente, et personne ne s'excuse."

  - id: co.gag.groupe_s1
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, vestiaire, moment]
    speaker: brehaut
    tone: strategique
    once: true
    cooldown: 25
    priority: 1
    when: "seen('co.gag.groupe_s0')"
    text: "Une chaise cassée, un maillot déchiré au col. Bréhaut ferme la porte derrière toi : « Deux gars fatigués, un vestiaire trop petit, {toi}. C'est réglé entre nous. Ça ne sort pas d'ici. »"
    left:
      label: "Je veux les deux noms"
      effects: {vestiaire: "-", direction: "+"}
      answer: "Il donne un nom, pas deux. Le deuxième s'entraîne très bien pendant un mois, et ne te regarde plus."
    right:
      label: "Je te fais confiance"
      effects: {vestiaire: "+", direction: "-"}
      answer: "La chaise est remplacée jeudi, payée par les joueurs. Le président apprend l'histoire par La Gazette, pas par toi."

  - id: co.gag.groupe_s2
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, vestiaire, direction]
    speaker: brehaut
    statut_ok: [parti, retraite]
    tone: strategique
    cooldown: 30
    priority: 1
    once: true
    when: "seen('co.gag.groupe_s1') && season >= 3"
    text: "Bréhaut a un bureau au premier étage, une cravate, une ligne de téléphone à lui. Il n'est pas descendu au vestiaire depuis l'hiver : « Les gars vont bien. C'est ce qu'on me dit, en tout cas. »"
    left:
      label: "Descends une fois"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Il descend le mardi, cravate desserrée. Il remonte en sachant deux choses qu'il ignorait, et ne t'en dit qu'une."
    right:
      label: "Je te crois sur parole"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Il te raccompagne, rassuré. Au vestiaire, on comprend que le premier étage ne descend plus ; on ne lui fait plus rien monter."

  # --- § 3.13 « J'en ai vu d'autres » — l'inventaire du vieux gardien -------
  - id: co.gag.vu_dautres_s0
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, vestiaire, moment]
    speaker: vecchio
    tone: leger
    once: true
    cooldown: 25
    text: "Le car est en panne sur la nationale, sous la pluie, à deux heures du coup d'envoi. Vecchio remonte son col : « En quatre-vingt-un, on a fait quatre kilomètres à pied, avec les sacs. On avait gagné. »"
    left:
      label: "On marche, alors"
      effects: {vestiaire: "+", force: -1}
      answer: "Vous marchez huit cents mètres sous la pluie avant qu'un car de la mairie vous ramasse. Vecchio chante dans l'allée, trempé."
    right:
      label: "On appelle un car"
      effects: {caisse: "-", direction: "+"}
      answer: "Un car arrive en quarante minutes, facturé double. Vecchio raconte quatre-vingt-un au plus jeune, à voix basse, tout le trajet."

  - id: co.gag.vu_dautres_s1
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, vestiaire, moment]
    speaker: vecchio
    tone: strategique
    once: true
    cooldown: 25
    priority: 1
    when: "seen('co.gag.vu_dautres_s0')"
    text: "Cinq buts encaissés, et le président a parlé à la radio avant de descendre au vestiaire. Vecchio, les gants encore aux mains, met longtemps à parler : « Les deux le même soir. Jamais. »"
    left:
      label: "Dis-moi ce qui a changé"
      effects: {vestiaire: "+", relation: {vecchio: 1}}
      answer: "Il dit trois mots, puis va se doucher : « Ils ont peur. » Les trois mots te suivent jusqu'au mardi."
    right:
      label: "On efface et on repart"
      effects: {force: 1, vestiaire: "-"}
      answer: "Il ne répond pas. Il n'efface rien : il plie la feuille de match en quatre et la range dans son sac."

  - id: co.gag.vu_dautres_s2
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, vestiaire, moment]
    speaker: vecchio
    tone: leger
    cooldown: 30
    priority: 1
    once: true
    when: "seen('co.gag.vu_dautres_s1')"
    text: "Sur la doublure de son sac, au stylo bille, Vecchio tient une liste : des dates, des scores, la première ligne de soixante-huit. Il ajoute celle du jour, puis : « Il reste de la place pour combien ? »"
    left:
      label: "Laisse-moi lire"
      effects: {vestiaire: "+", relation: {vecchio: 1}}
      answer: "Il tourne le sac vers toi trente secondes. Ta première saison y est, avec le score, et un mot que tu ne déchiffres pas."
    right:
      label: "Je le laisse écrire"
      effects: {direction: "+"}
      answer: "Il referme le sac sur la ligne fraîche. Le soir, il demande à Josiane combien de matchs il lui reste sous contrat."

  # --- § 3.14 Corner, le chien du gardien de stade --------------------------
  - id: co.gag.corner_s0
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, absurde, vestiaire]
    tone: leger
    once: true
    cooldown: 25
    text: "Un vieux chien traverse la séance en boitant et va se coucher au poteau de corner. Lulu arrive en courant : « C'est Corner. Le grillage du fond est encore ouvert ; trois semaines que je le signale. »"
    left:
      label: "On continue avec lui"
      effects: {vestiaire: "+"}
      answer: "Le chien regarde la fin de l'exercice, la tête sur les pattes. Les joueurs lui laissent son coin, et ça les fait sourire."
    right:
      label: "Sortez-le, Lulu"
      effects: {force: 1, vestiaire: "-"}
      answer: "Lulu l'emmène par le collier, en s'excusant. La séance reprend, plus sèche ; personne ne pense plus au grillage du fond."

  - id: co.gag.corner_s1
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, absurde, vestiaire]
    tone: leger
    once: true
    cooldown: 25
    priority: 1
    when: "seen('co.gag.corner_s0')"
    text: "L'intendant a recompté deux fois : il manque un ballon depuis novembre, et le club n'en rachètera pas. Ce matin, Corner l'a rapporté, dégonflé, sorti des ronces derrière la Tribune Nord."
    left:
      label: "On le regonfle"
      effects: {vestiaire: "++"}
      answer: "Le ballon regonflé sert à l'échauffement. Lulu dit qu'il a trouvé aussi, derrière la Tribune Nord, des bouteilles et un briquet."
    right:
      label: "Donnez-le au local"
      effects: {tribunes: "+"}
      answer: "Le ballon finit dans le filet à oranges du local, avec une date au feutre et le nom du chien."

  - id: co.gag.corner_s2
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, absurde, moment]
    tone: leger
    cooldown: 30
    priority: 1
    once: true
    when: "seen('co.gag.corner_s1')"
    text: "La mairie a confié la pelouse de la Rive à une entreprise : tondeuse autoportée, deux gars en combinaison. Lulu les regarde depuis sa loge, Corner couché contre la grille. « Ils coupent trop court. »"
    left:
      label: "Lulu garde la pelouse"
      effects: {tribunes: "+", direction: "-"}
      answer: "Tu exiges que Lulu dirige la tonte. Les deux gars le laissent passer devant ; le président te le reproche au téléphone."
    right:
      label: "Je laisse l'entreprise"
      effects: {direction: "+", vestiaire: "-"}
      answer: "La pelouse est rase et dure comme une table. Trois joueurs se plaignent des chevilles ; Lulu ne sort plus de sa loge."

  # --- § 3.16 Le distributeur du 5 ------------------------------------------
  - id: co.gag.distributeur_s0
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, caisse, vestiaire]
    tone: leger
    once: true
    cooldown: 25
    text: "Le 5 du mois, sept heures, il y a déjà quelqu'un devant le distributeur du centre commercial : Momo, seul, le dos très droit, la carte encore dans la fente. Il fait semblant de ne pas te voir."
    left:
      label: "Je fais demi-tour"
      effects: {vestiaire: "+"}
      answer: "Tu repars avant qu'il se retourne. À l'entraînement, il te serre la main un peu plus longtemps que d'habitude."
    right:
      label: "Je passe derrière lui"
      effects: {vestiaire: "-", direction: "+"}
      answer: "Il s'écarte poliment, le ticket froissé dans le poing. Vous n'en parlez jamais, et il évite ton regard jusqu'au 10."

  - id: co.gag.distributeur_s1
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, caisse, vestiaire]
    tone: leger
    once: true
    cooldown: 25
    priority: 1
    when: "flag('distributeur_groupe')"
    text: "Le 5, ils y vont à trois dans la vieille voiture de Momo, comme l'autre fois. Au retour, ils rient trop fort sur le parking ; tout le monde a compris que rien n'est tombé."
    left:
      label: "Je prends le volant"
      effects: {vestiaire: "++", direction: "-"}
      answer: "Le mois suivant, c'est toi qui conduis. Au retour, personne ne rit : on parle d'une lettre au président, signée par tous."
    right:
      label: "Je les laisse rire"
      effects: {vestiaire: "+"}
      answer: "Ils rient jusqu'au portail du club. Là, ça s'arrête net, et Josiane baisse les yeux derrière sa vitre."

  - id: co.gag.distributeur_s2
    roles: [entraineur, joueur]
    arc: routine
    tags: [gag, caisse, vestiaire]
    tone: strategique
    cooldown: 30
    priority: 1
    once: true
    when: "seen('co.gag.distributeur_s1')"
    text: "Le 5, personne ne va plus au distributeur : ils savent. Au vestiaire, un carnet passe de main en main, avec des sommes prêtées entre joueurs et les dates où on rendra."
    left:
      label: "Je demande à tout le monde"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Deux répondent, puis quatre. Le carnet atterrit sur le banc, ouvert ; le silence d'après est plus court que celui d'avant."
    right:
      label: "Je ne dis rien"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Le carnet continue de passer. Un jeune doit déjà trois mois de loyer à un ancien, et il joue avec ça dans les jambes."

  # ==========================================================================
  # § 4 — Les huit objets qui reviennent (six importés ici)
  #
  # Un objet FUSIBLE change de main (il raconte une relation), ne vaut rien (le
  # donner coûte autre chose que de l'argent) et survit à celui qui le portait.
  # La valise (§ 4.2) est déjà `co.dec.maison_valise_couloir` ; l'enveloppe
  # (§ 4.6) appartient à l'intrigue `en.enveloppe` et n'est pas doublée ici.
  # ==========================================================================

  # --- § 4.1 Le cahier : quadrillé, couverture noire, une page par joueur, la
  # dernière page réservée à ceux qu'il n'a pas pris.
  - id: co.obj.cahier_passation
    roles: [entraineur, joueur]
    arc: routine
    tags: [objet, vestiaire, moment]
    speaker: vukic
    tone: strategique
    once: true
    cooldown: 40
    when: "season >= 2"
    text: "Vukić pose sur le bureau un cahier noir quadrillé : une page par joueur, et la dernière pour ceux qu'on n'a pas pris. « Il était au coach d'avant, {toi}. Il est à qui le prend. »"
    left:
      label: "Je le laisse sur le bureau"
      effects: {direction: "-", relation: {vukic: 1}, vestiaire: "+"}
      answer: "Il le récupère au matin, sous son bras. Il n'écrit rien dedans pendant un an, mais il le relit le dimanche soir."
    right:
      label: "Je l'emporte"
      effects: {direction: "+", relation: {vukic: -1}}
      answer: "La dernière page est pleine de noms. Tu la lis deux fois, et l'un d'eux est celui d'un joueur que le club vient de signer."

  # --- § 4.3 Le sifflet : plastique jauni, un point de vernis rouge.
  - id: co.obj.sifflet_legue
    roles: [entraineur, joueur]
    arc: routine
    tags: [objet, vestiaire, moment]
    tone: strategique
    once: true
    cooldown: 40
    when: "year >= 2014"
    text: "Nadia Rouvier vide sa trousse sur la table de massage : elle ouvre son cabinet en ville lundi. Le sifflet jauni, au point de vernis rouge, reste au milieu. « Il ne me suit pas. Il est à qui ? »"
    left:
      label: "Je le prends"
      effects: {vestiaire: "+", force: 1}
      answer: "Tu le mets dans ta poche. Tu ne t'en sers jamais, et tu le sens à chaque fin de séance."
    right:
      label: "Qu'il reste au club"
      effects: {vestiaire: "++"}
      answer: "Il est accroché au clou de l'infirmerie, avec la date au feutre. Le jeune kiné le décroche le lundi suivant, et siffle."

  # --- § 4.4 Le brassard : tissu élastique, cousu deux fois, à la taille du
  # bras de celui de 1994. On ne le donne pas : on le pose sur un banc.
  - id: co.obj.brassard_pose
    roles: [entraineur, joueur]
    arc: routine
    tags: [objet, vestiaire, moment]
    speaker: brehaut
    tone: strategique
    once: true
    cooldown: 40
    when: "season >= 2"
    text: "Bréhaut pose au milieu du banc un brassard élastique, cousu deux fois, détendu par son biceps : « On ne le donne pas. On le pose, et on regarde qui le ramasse. Moi, je ne regarde pas. »"
    left:
      label: "Je le laisse sur le banc"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Il reste deux jours sur le banc. Le troisième matin, il n'y est plus, et Bréhaut ne demande pas qui."
    right:
      label: "Je le donne en main propre"
      effects: {vestiaire: "-", direction: "+"}
      answer: "Le joueur l'enfile devant tout le monde. Bréhaut applaudit le premier, et range ses crampons sans se retourner."

  # --- § 4.5 L'écharpe : tricotée en 1971 par la mère de Gégé pour son père,
  # interdit de stade. Elle ne se lave pas.
  - id: co.obj.echarpe_rendue
    roles: [entraineur, joueur]
    arc: routine
    tags: [objet, ultras, moment]
    speaker: gege
    tone: strategique
    once: true
    cooldown: 45
    when: "season >= 3 && relation.gege >= 2 && stats.clubs <= 1 && !role_was('joueur')"
    text: "Gégé plie une écharpe de laine qui a l'âge du virage et la pose sur ton siège : « Ma mère l'a tricotée en soixante et onze pour mon père, qui n'avait plus le droit d'entrer. Elle ne se lave pas. »"
    left:
      label: "Je la garde"
      effects:
        tribunes: "++"
        relation: {gege: 1}
        set: [echarpe_rendue]   # Almanach : « {annee} : l'écharpe de soixante et onze a changé d'épaule. »
      answer: "Elle sent la laine et le tabac froid. Tu la gardes sur l'épaule tout le match, et le virage le voit avant toi."
    right:
      label: "Gardez-la, Gégé"
      effects: {tribunes: "+", relation: {gege: 1}}
      answer: "Il la remet à son cou, lentement, et garde la main dessus, comme on garde une offre ouverte."

  - id: co.obj.echarpe_brulee
    roles: [entraineur, joueur]
    arc: routine
    tags: [objet, ultras, scandale]
    speaker: gege
    tone: strategique
    once: true
    cooldown: 45
    when: "season >= 3 && relation.gege <= -2 && stats.clubs <= 1 && !role_was('joueur')"
    text: "Une photo est arrivée au club, sans lettre : un seau, une écharpe de laine dedans, de la fumée. Gégé attend au portail : « Celle de mon père. Elle ne pouvait plus te regarder. »"
    left:
      label: "Vous n'aviez pas le droit"
      effects: {tribunes: "--", parole: 1}
      answer: "Il te regarde, puis le seau, puis toi encore. Le seau est encore chaud au fond du parking, et personne ne le vide."
    right:
      label: "Je ne réponds pas"
      effects: {tribunes: "-", vestiaire: "+"}
      answer: "Il range la photo dans sa doudoune. Au local, un cadre vide attend déjà au-dessus du bar."

  - id: co.obj.echarpe_siege
    roles: [entraineur, joueur]
    arc: routine
    tags: [objet, ultras, moment]
    tone: leger
    cooldown: 40
    when: "flag('echarpe_rendue')"
    text: "L'écharpe de soixante et onze est pliée sur le dossier de ton siège, à sa place, chaque dimanche. Personne ne l'a jamais lavée et personne ne s'assoit dessus par erreur."
    left:
      label: "Je la mets sur mes épaules"
      effects: {tribunes: "+"}
      answer: "Le virage la reconnaît de loin. Le chant démarre trois secondes plus tôt."
    right:
      label: "Elle reste pliée"
      effects: {tribunes: "+", vestiaire: "+"}
      answer: "Elle reste pliée. C'est ce qu'il en aurait fait, et c'est ce qu'il voit."

  # --- § 4.7 La boîte en fer : une boîte à gâteaux, un élastique, un carnet à
  # spirale dedans. Quand la caisse a fui, c'est elle qui manquait.
  - id: co.obj.boite_revenue
    roles: [entraineur, joueur]
    arc: routine
    tags: [objet, caisse, moment]
    tone: strategique
    once: true
    cooldown: 45
    when: "year >= 2005"
    text: "La boîte à gâteaux en fer de Gérard est revenue par la poste, avec son élastique, son carnet à spirale et des francs qui n'ont plus cours. Le mot d'excuse tient en deux lignes, sans adresse."
    left:
      label: "On rouvre la buvette"
      effects: {caisse: "-", tribunes: "++"}
      answer: "La buvette des anciens rouvre un samedi, la boîte sur le comptoir. Le carnet reprend à la page qu'il avait quittée."
    right:
      label: "On garde la boîte fermée"
      effects: {caisse: "+", tribunes: "-"}
      answer: "La boîte va sur une étagère du bureau. Il manque deux pages au carnet, et Josiane passe une semaine à chercher pourquoi."

  # --- § 4.8 La cassette : vierge, étiquetée « FINALE » d'une écriture
  # appliquée. Personne n'a jamais osé la lire.
  - id: co.obj.cassette_lue
    roles: [entraineur, joueur]
    arc: routine
    tags: [objet, absurde, moment]
    tone: strategique
    once: true
    cooldown: 45
    when: "year >= 2020"
    text: "Dans un carton du club, une cassette vidéo étiquetée « FINALE », de l'écriture appliquée d'Anselmo Vaz. Le dernier magnétoscope qui marche, en ville, est chez le réparateur de la rue du Stade."
    left:
      label: "Je la fais lire"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Quatre-vingt-dix minutes de neige, puis la voix de Vaz qui dit trois mots. Tu ne les répètes à personne."
    right:
      label: "Je la garde fermée"
      effects: {direction: "+", tribunes: "+"}
      answer: "Elle retourne dans le carton, étiquette en haut. Le musée du club la met sous verre, fermée, et les gens viennent la regarder."

  # ==========================================================================
  # § 12 — L'époque, en deux boutons (lot « anecdotes d'époque »)
  # Les cartes de `epoque_*.yaml` sont des constats : un bouton, on encaisse.
  # Ici, la même matière — l'histoire réelle du SPORT, jamais un nom réel — a
  # deux sorties et des effets faibles, parce que le décor de l'époque se
  # traverse aussi en décidant quelque chose de minuscule. La fenêtre se lit
  # sur `year` : la carte disparaît quand l'usage disparaît, comme le cendrier
  # du vestiaire ou le magnétoscope de la salle vidéo.
  # Règle du lot, sans exception : le sport est réel, le monde reste fictif.
  # ==========================================================================

  - id: co.ep.dec.cigarette_vestiaire
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    speaker: sabatier
    tone: leger
    cooldown: 35
    when: "year <= 1998"
    text: "Le Doc montre du menton le cendrier plein, posé sur le banc du vestiaire : « Trois qui fument avant le match, deux après. Je les ausculte le lundi, et je n'aime pas ce que j'entends. »"
    left:
      label: "Je vide le cendrier"
      effects: {vestiaire: "-", force: 1}
      answer: "Le cendrier disparaît un mardi. En février, il est revenu sous le banc, à sa place exacte, et personne ne l'a vu revenir."
    right:
      label: "Je le laisse où il est"
      effects: {vestiaire: "+"}
      answer: "« On fume moins quand personne ne compte », dit le Doc, sans y croire. Il note les noms dans son carnet."

  - id: co.ep.dec.car_sans_clim
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    tone: leger
    cooldown: 35
    when: "year <= 1999"
    text: "Norbert a ouvert les six lucarnes du car et calé la porte avec un plot. Il fait trente-quatre degrés, il reste trois cents kilomètres, et la glacière ne tient que des sodas tièdes."
    left:
      label: "Je fais arrêter le car"
      effects: {vestiaire: "+", caisse: "-"}
      answer: "Quinze minutes à l'ombre d'un pont d'autoroute. On repart avec de l'eau froide et une heure de retard."
    right:
      label: "On roule"
      effects: {vestiaire: "-", force: 1}
      answer: "On arrive collés aux sièges. Le premier quart d'heure se joue au ralenti, et ça se voit de la tribune."

  - id: co.ep.dec.repondeur_lundi
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, direction, gag]
    speaker: josiane
    tone: leger
    cooldown: 30
    when: "year >= 1993 && year <= 2003"
    text: "Josiane rembobine la bande du répondeur avec la pointe d'un crayon : « Vingt-deux messages depuis dimanche. Quatre de supporters. Dix-huit du même numéro, tous à trois heures du matin. »"
    left:
      label: "J'écoute les vingt-deux"
      effects: {direction: "-", tribunes: "+"}
      answer: "Les quatre premiers te souhaitent bon courage. Les dix-huit autres ne disent rien : une respiration et, au fond, une télé."
    right:
      label: "J'efface tout"
      effects: {direction: "+"}
      answer: "La bande repart à zéro. Le mardi, à trois heures, le même numéro rappelle, et laisse sonner jusqu'au bout."

  - id: co.ep.dec.magnetoscope_mange
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, absurde]
    speaker: vukic
    tone: leger
    cooldown: 35
    when: "year >= 1993 && year <= 2005"
    text: "Vukić tient une bande vidéo entortillée autour de deux doigts : « Le magnétoscope a mangé leurs vingt minutes. Juste avant la séance. Je les ai en tête. Je les raconte ? »"
    left:
      label: "Je le laisse parler"
      effects: {force: 1, vestiaire: "-"}
      answer: "Il parle quarante minutes sans une image, joueur par joueur, l'heure, la jambe. Deux joueurs prennent des notes ; on ne les avait jamais vus avec un stylo."
    right:
      label: "On va sur le terrain"
      effects: {vestiaire: "+"}
      answer: "On refait la séance à onze contre sept, avec des plots. Ça marche aussi, et ça fatigue davantage."

  - id: co.ep.dec.terrain_gele
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    tone: leger
    cooldown: 35
    when: "year <= 2005"
    text: "Le terrain est gelé sur trois centimètres et la mairie ne prête pas le gymnase avant midi. Le vieux Dédé propose de faire des feux dans des bidons, comme en soixante-trois."
    left:
      label: "On allume les bidons"
      effects: {vestiaire: "+", caisse: "-"}
      answer: "Trois bidons, deux heures, un carré dégelé de vingt mètres. On y joue à cinq, et on y croit."
    right:
      label: "On court sur la route"
      effects: {force: 1, vestiaire: "-"}
      answer: "Neuf kilomètres le long du port, dans le vent de face. Deux joueurs rentrent en marchant."

  - id: co.ep.dec.seance_video
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    speaker: brehaut
    tone: strategique
    cooldown: 30
    when: "year >= 2000 && year <= 2014"
    text: "Bréhaut se regarde courir après un attaquant, en boucle, quatre fois, sur l'écran de la salle vidéo : « On ne s'était jamais vus de dos. Je cours comme mon père. Les gars rient, mais pas fort. »"
    left:
      label: "Je passe à la suite"
      effects: {vestiaire: "+"}
      answer: "Il réclame la séquence sur une cassette, le soir même. Il la regarde encore des années plus tard, seul."
    right:
      label: "Je la repasse une fois"
      effects: {vestiaire: "-", force: 1}
      answer: "Personne ne parle jusqu'au parking. Le dimanche, il ne perd pas un duel de la journée, et ne sourit pas une fois."

  - id: co.ep.dec.note_sur_un_site
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, presse, gag]
    speaker: lea
    tone: leger
    cooldown: 30
    when: "year >= 2006 && year <= 2020"
    text: "Léa fait défiler sur son écran une page de notes sur dix, joueur par joueur : « Un logiciel les calcule. Mon rédacteur veut les publier le lundi. Votre six a deux sur dix. Vous répondez ? »"
    left:
      label: "Je réponds à la note"
      effects: {tribunes: "-", direction: "+"}
      answer: "Ta réponse est publiée sous la note. La semaine suivante, le six a trois sur dix, et personne ne sait pourquoi, elle non plus."
    right:
      label: "Je ne lis pas les notes"
      effects: {vestiaire: "+"}
      answer: "Le vestiaire te les lit le lundi, debout sur le banc. On en rit, jusqu'au jour où le six ne rit plus."

  - id: co.ep.dec.tableau_des_donnees
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, gag]
    speaker: vecchio
    tone: leger
    cooldown: 30
    when: "year >= 2011"
    text: "Vecchio, les lunettes au bout du nez, lit le tableau des distances scotché près de la porte : « Le gardien est dernier. Évidemment. Ils comptent ses kilomètres, pas ses arrêts. »"
    left:
      label: "Je décroche le tableau"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Le tableau finit dans le bureau de l'adjoint, toujours à jour. Le gardien remercie Vecchio, pas toi."
    right:
      label: "Je le laisse au mur"
      effects: {force: 1, vestiaire: "-"}
      answer: "Deux joueurs courent pour le tableau et plus pour le match. Ça se voit dès novembre, sur les replis."

  - id: co.ep.dec.telephones_confisques
    roles: [entraineur, joueur]
    arc: routine
    tags: [decor, vestiaire, moment]
    speaker: vukic
    tone: strategique
    cooldown: 30
    when: "year >= 2014"
    text: "Vukić tend une boîte en plastique à l'entrée du vestiaire, onze téléphones dedans : « Deux heures sans écran avant le coup d'envoi. Le tien aussi. Je compte, je ne demande pas. »"
    left:
      label: "Je pose le mien dedans"
      effects: {vestiaire: "+"}
      answer: "La boîte se remplit. Trois joueurs qui s'ignoraient depuis le début de la saison parlent de rien, du match."
    right:
      label: "Je garde le mien"
      effects: {vestiaire: "-", direction: "+"}
      answer: "Onze téléphones dans la boîte, un dans ta poche. Le vestiaire compte très bien jusqu'à douze."
