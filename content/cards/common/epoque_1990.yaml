    tags: [nouvelle, vestiaire]
    speaker: sabatier
    tone: leger
    once: true
    year: 1990
    text: "Le Doc raye le steak-frites sur le menu de la cantine : « Pâtes, riz, eau, trois heures avant le coup d'envoi. Les jambes me diront merci en mars. Lulu, elle, me dit plus bonjour. »"
    left:  {label: "Je mange les pâtes", effects: {vestiaire: "-", force: 1}, answer: "Trois joueurs cachent des frites dans le car. Le Doc les voit par la vitre, leur montre trois doigts, et va s'asseoir devant."}
    right: {label: "Je mange les pâtes", effects: {vestiaire: "-", force: 1}, answer: "Trois joueurs cachent des frites dans le car. Le Doc les voit par la vitre, leur montre trois doigts, et va s'asseoir devant."}

