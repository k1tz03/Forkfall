    tags: [nouvelle, tribunes]
    speaker: aubert
    tone: leger
    once: true
    year: 1990
    text: "Madame Aubert déplie un plan de tribune couvert de croix : « Un rapport officiel veut la fin des places debout dans les grands stades. Le stade, c'est de l'argent public. »"
    left:  {label: "Regarder le plan", effects: {tribunes: "-", set: [monde_tout_assis]}, answer: "On mesure la tribune Nord au décamètre. Elle fait deux mille debout, ou onze cents assis."}
    right: {label: "Regarder le plan", effects: {tribunes: "-", set: [monde_tout_assis]}, answer: "On mesure la tribune Nord au décamètre. Elle fait deux mille debout, ou onze cents assis."}

  - id: co.ep.1990_pates
