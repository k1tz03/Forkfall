# Les cartes d'époque, 1990-1999 — « le football change, et tu es dedans »
#
# Retour joueur : « les anecdotes liées au foot dans son histoire générale, je
# ne les ai jamais retrouvées ». Ce fichier est la réponse : une carte par
# tournant du SPORT, dans l'année où il arrive.
#
# ── La règle du lot (arbitrage, à ne jamais desserrer) ───────────────────────
# Ce qui est réel ici, c'est **le sport** : les règles qui bougent, l'argent de
# la télévision, les stades qui s'assoient, l'équipement, la médecine, les
# mœurs, les techniques. Ce qui reste fictif, c'est **le monde** : aucun club,
# aucun joueur, aucun entraîneur, aucun dirigeant, aucune marque, aucune
# compétition réels — jamais, sous aucun prétexte, même en creux. Une anecdote
# qui permettrait d'identifier une personne réelle est un défaut de lot, pas
# une coquille. On dit « un rapport officiel », « la Fédération », « un club de
# la capitale » ; on ne dit jamais qui.
#
# ── La forme (identique aux Nouvelles datées, spec variété §1.5) ─────────────
#   arc: nouvelle · once: true · year: <l'année où ça se passe>
# La carte est servable pendant les saisons `year` et `year - 1` (une saison
# court d'août à juin, elle couvre deux années civiles) et le metteur en scène
# sert **en priorité** une datée de la saison en cours, aux créneaux réservés
# de `calendar.yaml`. Passée son année, elle est perdue.
# Un seul bouton au rendu (`kind: nouvelle`) : les deux sorties portent les
# mêmes effets, faibles, et le libellé reste à l'infinitif — c'est un constat,
# pas un choix. La conséquence, elle, date la scène : elle dit ce que l'époque
# a fait de la chose, un an ou dix ans plus tard.
# Le locuteur est quelqu'un qui **vit** le changement, jamais un narrateur
# hors-sol : le gardien à qui on retire les mains, la secrétaire à qui on pose
# une machine sur le bureau, l'ultra à qui on visse un siège dans le virage.
cards:

  # ── 1990 ───────────────────────────────────────────────────────────────────
  - id: co.ep.1990_hors_jeu_hauteur
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: vukic
    tone: strategique
    once: true
    year: 1990
    text: "Vukić aligne deux salières et un verre sur la nappe : « À hauteur, l'attaquant est en jeu maintenant. Je te le dis parce que personne ne te le dira : la ligne ne sauve plus. »"
    left:  {label: "Refaire le dessin", effects: {force: 1, set: [monde_hors_jeu_hauteur]}, answer: "Le défenseur central lève le bras tout l'automne. Il le baisse en janvier, tout seul."}
    right: {label: "Refaire le dessin", effects: {force: 1, set: [monde_hors_jeu_hauteur]}, answer: "Le défenseur central lève le bras tout l'automne. Il le baisse en janvier, tout seul."}

  - id: co.ep.1990_tout_assis
