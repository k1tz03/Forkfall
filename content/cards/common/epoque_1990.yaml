    speaker: aubert
    tone: leger
    once: true
    year: 1990
    text: "Madame Aubert déplie le plan de la tribune Nord, couvert de croix au crayon : « Un rapport veut tout le monde assis. Deux mille debout, ça fait onze cents sièges. Qui paie les sièges ? Pas la ville. »"
    left:  {label: "Je compte les croix", effects: {tribunes: "-", set: [monde_tout_assis]}, answer: "Le chiffre arrive au local avant la nuit. Sur l'ardoise, quelqu'un écrit 900 à la craie, et personne ne l'efface."}
    right: {label: "Je compte les croix", effects: {tribunes: "-", set: [monde_tout_assis]}, answer: "Le chiffre arrive au local avant la nuit. Sur l'ardoise, quelqu'un écrit 900 à la craie, et personne ne l'efface."}

  - id: co.ep.1990_pates
    roles: [entraineur, joueur]
