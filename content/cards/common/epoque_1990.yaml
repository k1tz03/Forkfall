    speaker: sabatier
    tone: leger
    once: true
    year: 1990
    text: "Le Doc referme un cahier de menus d'un coup de pouce : « Fini le steak-frites de onze heures : pâtes, riz, eau. Ça reste entre la table et moi, le cuisinier a pleuré. »"
    left:  {label: "Goûter quand même", effects: {vestiaire: "-", force: 1}, answer: "Trois joueurs cachent des frites dans le bus. Le Doc les compte et ne dit rien."}
    right: {label: "Goûter quand même", effects: {vestiaire: "-", force: 1}, answer: "Trois joueurs cachent des frites dans le bus. Le Doc les compte et ne dit rien."}

