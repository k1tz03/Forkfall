# Les cartes d'époque, 2000-2019 — l'argent, la donnée, la vidéo
#
# Même règle que `epoque_1990.yaml`, sans une exception : le SPORT est réel
# (les règles, l'équipement, la médecine, la technique, les mœurs), le MONDE
# reste fictif (aucun club, joueur, entraîneur, dirigeant, marque ni
# compétition réels, même en creux). Voir l'en-tête de `epoque_1990.yaml`
# pour la forme (`arc: nouvelle`, `once: true`, `year:`, un seul bouton,
# effets faibles, conséquence qui date la scène).
#
# Ces vingt années sont celles où le métier change de nature : le calendrier
# se ferme (les deux fenêtres), le corps devient un relevé, l'image devient un
# arbitre. Le fil est toujours le même : quelqu'un du club encaisse la
# nouveauté avec son tic, et la conséquence dit ce qu'elle a coûté.
cards:

  - id: co.ep.2000_site_internet
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: josiane
    tone: leger
    once: true
    year: 2000
    text: "Madame Josiane imprime la page qu'elle vient d'ouvrir : « Le club a son adresse sur l'internet, avec les résultats et une photo du stade. La photo date de 1988. On y voit l'ancien président. »"
    left:  {label: "Je prends la page", effects: {direction: "+"}, answer: "Vaubourg fait changer la photo dans la semaine. Sur la nouvelle, il est au premier plan, et la tribune Nord est coupée."}
    right: {label: "Je prends la page", effects: {direction: "+"}, answer: "Vaubourg fait changer la photo dans la semaine. Sur la nouvelle, il est au premier plan, et la tribune Nord est coupée."}

  - id: co.ep.2001_maillot_moulant
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: brehaut
    tone: leger
    once: true
    year: 2001
    text: "Bréhaut tire sur un maillot neuf qui revient tout seul : « Ça colle, ça sèche en dix minutes, ça montre ce qu'on a mangé en juillet. Les gars veulent la taille au-dessus. Elle n'existe pas. »"
    left:  {label: "Je tire sur le maillot", effects: {vestiaire: "+"}, answer: "Deux joueurs coupent l'étiquette et mentent sur leur taille. Bréhaut le sait, et commande pour eux sur son propre budget."}
    right: {label: "Je tire sur le maillot", effects: {vestiaire: "+"}, answer: "Deux joueurs coupent l'étiquette et mentent sur leur taille. Bréhaut le sait, et commande pour eux sur son propre budget."}

  - id: co.ep.2002_fenetres_mercato
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, mercato]
    speaker: fardelli
    tone: strategique
    once: true
    year: 2002
    text: "Fardelli tape sur le calendrier, en août puis en janvier : « Le reste de l'année, porte fermée. Alors tout le monde se presse, et celui qui se presse paie plus cher. Tu m'appelles en janvier ? »"
    left:  {label: "Je regarde les deux dates", effects: {caisse: "-", set: [monde_fenetres_mercato]}, answer: "Le 31 janvier, le fax du secrétariat crache jusqu'à minuit. Fardelli est dans le couloir à 23 h 50, sans rendez-vous."}
    right: {label: "Je regarde les deux dates", effects: {caisse: "-", set: [monde_fenetres_mercato]}, answer: "Le 31 janvier, le fax du secrétariat crache jusqu'à minuit. Fardelli est dans le couloir à 23 h 50, sans rendez-vous."}

  - id: co.ep.2003_oreillette
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: legruet
    tone: leger
    once: true
    year: 2003
    text: "Berthomier montre un boîtier gros comme un paquet de cartes : « Les arbitres se parleront dans l'oreille. En D2, l'équipement est à la charge des clubs. Les dérogations, par écrit, avant le 30. »"
    left:  {label: "J'écoute le boîtier", effects: {direction: "-"}, answer: "Le premier hors-jeu discuté à l'oreille dure onze secondes. Le stade siffle les onze, une par une."}
    right: {label: "J'écoute le boîtier", effects: {direction: "-"}, answer: "Le premier hors-jeu discuté à l'oreille dure onze secondes. Le stade siffle les onze, une par une."}

  - id: co.ep.2004_ecole_au_centre
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, formation]
    speaker: clow
    tone: strategique
    once: true
    year: 2004
    text: "Corven regarde la salle de classe neuve du centre de formation : « À quatorze ans, je déchargeais des caisses au marché. Personne ne m'a appris à lire un contrat. Eux, on leur apprendra. »"
    left:  {label: "J'entre dans la classe", effects: {vestiaire: "+", caisse: "-"}, answer: "Sur trente gamins entrés cette année-là, deux signent pro. Les autres passent le bac ; l'un d'eux revient au club comme kiné."}
    right: {label: "J'entre dans la classe", effects: {vestiaire: "+", caisse: "-"}, answer: "Sur trente gamins entrés cette année-là, deux signent pro. Les autres passent le bac ; l'un d'eux revient au club comme kiné."}

  - id: co.ep.2005_tutoiement
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: brehaut
    tone: leger
    once: true
    year: 2005
    text: "Bréhaut hésite une seconde avant de répéter le mot : « Les trois jeunes tutoient le staff, Vukić compris. Personne ne relève. Moi, à leur âge, je disais encore monsieur à l'intendant. »"
    left:  {label: "Je ne relève pas", effects: {vestiaire: "+"}, answer: "Le plus vieux du groupe continue de vouvoyer tout le monde, par principe. On le laisse faire, jusqu'à son dernier match."}
    right: {label: "Je ne relève pas", effects: {vestiaire: "+"}, answer: "Le plus vieux du groupe continue de vouvoyer tout le monde, par principe. On le laisse faire, jusqu'à son dernier match."}

  - id: co.ep.2006_pelouse_chauffee
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: aubert
    tone: leger
    once: true
    year: 2006
    text: "Madame Aubert tourne trois fois la même page du devis : « Des tapis chauffants sous la pelouse, des fibres cousues dans l'herbe. Le ministère en paiera un tiers. Le reste, c'est pour le club. »"
    left:  {label: "Je relis le devis", effects: {caisse: "-", tribunes: "+"}, answer: "Le terrain tient tout l'hiver, pour la première fois. En janvier, on coupe le chauffage du vestiaire pour payer celui de la pelouse."}
    right: {label: "Je relis le devis", effects: {caisse: "-", tribunes: "+"}, answer: "Le terrain tient tout l'hiver, pour la première fois. En janvier, on coupe le chauffage du vestiaire pour payer celui de la pelouse."}

  - id: co.ep.2008_commotion
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    year: 2008
    text: "Le Doc agrafe un protocole de trois pages : « Un joueur sonné sort, même s'il jure qu'il va bien. Ils jurent tous. En 82, j'ai laissé un garçon rejouer. Il ne se souvient pas de cette semaine-là. »"
    left:  {label: "Je lis les trois pages", effects: {vestiaire: "-"}, answer: "Le capitaine sort à la vingtième, furieux, en insultant le banc. Des années plus tard, au repas des anciens, il remercie le Doc."}
    right: {label: "Je lis les trois pages", effects: {vestiaire: "-"}, answer: "Le capitaine sort à la vingtième, furieux, en insultant le banc. Des années plus tard, au repas des anciens, il remercie le Doc."}

  - id: co.ep.2011_gps
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: vukic
    tone: strategique
    once: true
    year: 2011
    text: "Vukić soulève un maillot avec une bosse entre les omoplates : « Les mètres, les chocs, les accélérations. Et l'heure d'arrivée au parking. Chaque soir, le boîtier part au bureau du président. »"
    left:  {label: "Je touche la bosse", effects: {force: 1, vestiaire: "-"}, answer: "Le premier joueur mis au repos par un chiffre le prend très mal. Le deuxième est celui qui arrivait en retard."}
    right: {label: "Je touche la bosse", effects: {force: 1, vestiaire: "-"}, answer: "Le premier joueur mis au repos par un chiffre le prend très mal. Le deuxième est celui qui arrivait en retard."}

  - id: co.ep.2012_ligne_de_but
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: meneche
    tone: leger
    once: true
    year: 2012
    text: "Massenet tapote sa montre : « Sept caméras, et la montre de l'arbitre vibre quand le ballon passe la ligne. Votre but refusé de l'an dernier, on n'en parlerait plus. Il m'a fait trois chroniques. »"
    left:  {label: "Je regarde la montre", effects: {direction: "-", set: [monde_ligne_de_but]}, answer: "Le premier but validé par une vibration l'est en une seconde. On en discute quand même six mois, sur le plateau de Massenet."}
    right: {label: "Je regarde la montre", effects: {direction: "-", set: [monde_ligne_de_but]}, answer: "Le premier but validé par une vibration l'est en une seconde. On en discute quand même six mois, sur le plateau de Massenet."}

  - id: co.ep.2014_mousse
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: gege
    tone: leger
    once: true
    year: 2014
    text: "Gégé imite l'arbitre qui trace un trait par terre, très sérieux : « Une bombe, un trait à neuf mètres, et ça s'efface tout seul. Ton mur ne volera plus un mètre. Le leur non plus. On regardera. »"
    left:  {label: "Je refais le geste", effects: {tribunes: "+"}, answer: "Le mur recule d'un mètre pour la première fois depuis toujours. Au premier coup franc, le virage compte les pas à voix haute."}
    right: {label: "Je refais le geste", effects: {tribunes: "+"}, answer: "Le mur recule d'un mètre pour la première fois depuis toujours. Au premier coup franc, le virage compte les pas à voix haute."}

  - id: co.ep.2015_feminines
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: lea
    tone: strategique
    once: true
    year: 2015
    text: "Léa referme un carnet de noms de joueuses : « Onze contrats, un bus, et le terrain à vingt et une heures. Le président dit que le vestiaire refuse de leur céder le samedi. C'est vrai ? »"
    left:  {label: "Je leur cède le terrain", effects: {tribunes: "+", caisse: "-"}, answer: "Elles ont le samedi à quinze heures. Huit cents personnes viennent ; la buvette n'avait commandé que pour trois cents."}
    right: {label: "Je leur cède le terrain", effects: {tribunes: "+", caisse: "-"}, answer: "Elles ont le samedi à quinze heures. Huit cents personnes viennent ; la buvette n'avait commandé que pour trois cents."}

  - id: co.ep.2017_analyste
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: clow
    tone: strategique
    once: true
    year: 2017
    text: "Corven regarde un garçon brancher trois écrans : « Vingt-quatre ans, jamais joué, et il compte tes passes ratées. En 71, on m'a viré sans compter. Toi, ils auront les chiffres. »"
    left:  {label: "Je regarde les écrans", effects: {force: 1, direction: "-"}, answer: "En trois ans, l'analyste devient adjoint. Le lundi, c'est lui qui présente les chiffres au président, sans te les montrer avant."}
    right: {label: "Je regarde les écrans", effects: {force: 1, direction: "-"}, answer: "En trois ans, l'analyste devient adjoint. Le lundi, c'est lui qui présente les chiffres au président, sans te les montrer avant."}

  - id: co.ep.2018_maillots_retro
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    speaker: gege
    tone: leger
    once: true
    year: 2018
    text: "Gégé déplie un maillot neuf sous plastique : « Ils ressortent celui de 1988, avec la faute sur le nom du sponsor. Soixante-dix écus. En 88, on le payait quatre-vingts francs, et on râlait. »"
    left:  {label: "Je cherche la faute", effects: {tribunes: "+", caisse: "+"}, answer: "La boutique en vend six cents en deux mois. Au local, on garde l'original, avec la faute et la tache de vin."}
    right: {label: "Je cherche la faute", effects: {tribunes: "+", caisse: "+"}, answer: "La boutique en vend six cents en deux mois. Au local, on garde l'original, avec la faute et la tache de vin."}

  - id: co.ep.2019_trois_regles
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: legruet
    tone: leger
    once: true
    year: 2019
    text: "Berthomier, de passage au club, lit la circulaire à voix haute dans le couloir : « Le mur à un mètre. Un pied du gardien sur la ligne. Le remplacé sort par le côté le plus proche. Voté sans moi. »"
    left:  {label: "J'écoute la circulaire", effects: {direction: "-"}, answer: "Les arbitres passent l'automne à réexpliquer. Au premier match, un remplacé sort par le mauvais côté et prend un jaune : un des nôtres."}
    right: {label: "J'écoute la circulaire", effects: {direction: "-"}, answer: "Les arbitres passent l'automne à réexpliquer. Au premier match, un remplacé sort par le mauvais côté et prend un jaune : un des nôtres."}
