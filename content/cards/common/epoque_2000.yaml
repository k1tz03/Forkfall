# Les cartes d'époque, 2000-2019 — l'argent, la donnée, la vidéo
#
# Même règle que `epoque_1990.yaml`, sans une exception : le SPORT est réel
# (les règles, l'équipement, la médecine, la technique, les mœurs), le MONDE
# reste fictif (aucun club, joueur, entraîneur, dirigeant, marque ni
# compétition réels, même en creux). Voir l'en-tête de `epoque_1990.yaml`
# pour la forme (`arc: nouvelle`, `once: true`, `year:`, un seul bouton,
# effets faibles, conséquence qui date la scène).
#
# Ces vingt années sont celles où le métier change de nature : le calendrier
# se ferme (les deux fenêtres), le corps devient un relevé, l'image devient un
# arbitre. Le fil est toujours le même : quelqu'un du club encaisse la
# nouveauté avec son tic, et la conséquence dit ce qu'elle a coûté.
cards:

  - id: co.ep.2000_site_internet
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: josiane
    tone: leger
    once: true
    year: 2000
    text: "Josiane imprime une page qu'elle vient de voir à l'écran : « Le club a une adresse sur l'internet, avec les résultats et une photo du stade. J'en ai vu passer ; celle-là, je l'imprime. »"
    left:  {label: "Prendre la page", effects: {direction: "+"}, answer: "Le classeur des pages imprimées fait onze centimètres en juin. Il est encore dans l'armoire du haut."}
    right: {label: "Prendre la page", effects: {direction: "+"}, answer: "Le classeur des pages imprimées fait onze centimètres en juin. Il est encore dans l'armoire du haut."}

  - id: co.ep.2001_maillot_moulant
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: brehaut
    tone: leger
    once: true
    year: 2001
    text: "Bréhaut tire sur un maillot neuf qui revient tout seul : « Ça colle, ça sèche, et ça montre tout ce qu'on a mangé en juillet. Le groupe vit bien ; le groupe rentre le ventre. »"
    left:  {label: "Tirer dessus aussi", effects: {vestiaire: "+"}, answer: "Deux joueurs commandent une taille au-dessus. Le fournisseur répond qu'il ne la fabrique pas."}
    right: {label: "Tirer dessus aussi", effects: {vestiaire: "+"}, answer: "Deux joueurs commandent une taille au-dessus. Le fournisseur répond qu'il ne la fabrique pas."}

  - id: co.ep.2002_fenetres_mercato
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, mercato]
    speaker: fardelli
    tone: strategique
    once: true
    year: 2002
    text: "Fardelli tape deux fois sur un calendrier mural, à deux endroits : « On ne signe plus qu'en été et en janvier ; le reste de l'année, porte fermée. On parle d'argent ou d'amitié ? »"
    left:  {label: "Regarder les deux dates", effects: {caisse: "-", set: [monde_fenetres_mercato]}, answer: "Le dernier jour de janvier devient une fête et une catastrophe. Les deux, chaque année, jusqu'à aujourd'hui."}
    right: {label: "Regarder les deux dates", effects: {caisse: "-", set: [monde_fenetres_mercato]}, answer: "Le dernier jour de janvier devient une fête et une catastrophe. Les deux, chaque année, jusqu'à aujourd'hui."}

  - id: co.ep.2003_oreillette
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: legruet
    tone: leger
    once: true
    year: 2003
    text: "Berthomier montre un boîtier gros comme un paquet de cartes : « Les arbitres se parlent dans l'oreille pendant le match, sans lever le drapeau. On verra ça après le Congrès. »"
    left:  {label: "Écouter le boîtier", effects: {direction: "-"}, answer: "Le premier hors-jeu discuté à l'oreille dure onze secondes. Le stade siffle les onze, une par une."}
    right: {label: "Écouter le boîtier", effects: {direction: "-"}, answer: "Le premier hors-jeu discuté à l'oreille dure onze secondes. Le stade siffle les onze, une par une."}

  - id: co.ep.2004_ecole_au_centre
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, formation]
    speaker: clow
    tone: strategique
    once: true
    year: 2004
    text: "Corven désigne une salle de classe au fond du centre : « Le matin l'école, l'après-midi le ballon, dans le même bâtiment. Je ne dirais pas que j'étais un grand : j'étais absent. »"
    left:  {label: "Entrer dans la classe", effects: {vestiaire: "+", caisse: "-"}, answer: "Sur trente entrés cette année-là, deux signeront pro. Vingt-huit passeront le bac, et deux reviendront ici."}
    right: {label: "Entrer dans la classe", effects: {vestiaire: "+", caisse: "-"}, answer: "Sur trente entrés cette année-là, deux signeront pro. Vingt-huit passeront le bac, et deux reviendront ici."}

  - id: co.ep.2005_tutoiement
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: brehaut
    tone: leger
    once: true
    year: 2005
    text: "Bréhaut hésite une seconde avant de lâcher le mot : « Les jeunes tutoient l'entraîneur, maintenant, et personne ne relève. Le groupe vit bien ; il vit juste plus fort. »"
    left:  {label: "Ne pas relever", effects: {vestiaire: "+"}, answer: "Le plus vieux du groupe continue de vouvoyer, par principe. On le laisse, et ça dure jusqu'à sa retraite."}
    right: {label: "Ne pas relever", effects: {vestiaire: "+"}, answer: "Le plus vieux du groupe continue de vouvoyer, par principe. On le laisse, et ça dure jusqu'à sa retraite."}

  - id: co.ep.2006_pelouse_chauffee
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: aubert
    tone: leger
    once: true
    year: 2006
    text: "Madame Aubert lit un devis en tournant trois fois la même page : « Des tapis chauffants sous la pelouse et des fibres cousues dedans, pour jouer en février. C'est de l'argent public. »"
    left:  {label: "Relire le devis", effects: {caisse: "-", tribunes: "+"}, answer: "Le terrain tient tout l'hiver, pour la première fois. Le chauffage du vestiaire, lui, est coupé en janvier."}
    right: {label: "Relire le devis", effects: {caisse: "-", tribunes: "+"}, answer: "Le terrain tient tout l'hiver, pour la première fois. Le chauffage du vestiaire, lui, est coupé en janvier."}

  - id: co.ep.2008_commotion
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    year: 2008
    text: "Le Doc referme un protocole de trois pages agrafées : « Un joueur assommé sort et ne revient pas, même s'il jure qu'il va bien. Ça reste entre la table et moi : ils jurent tous. »"
    left:  {label: "Lire les trois pages", effects: {vestiaire: "-"}, answer: "Le capitaine sort à la vingtième, furieux, en insultant le banc. Il remercie le Doc onze ans plus tard."}
    right: {label: "Lire les trois pages", effects: {vestiaire: "-"}, answer: "Le capitaine sort à la vingtième, furieux, en insultant le banc. Il remercie le Doc onze ans plus tard."}

  - id: co.ep.2011_gps
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: vukic
    tone: strategique
    once: true
    year: 2011
    text: "Vukić soulève un maillot d'entraînement avec une bosse entre les omoplates : « Ça compte les mètres, les chocs et les accélérations. Personne ne te le dira : ça te compte aussi. »"
    left:  {label: "Toucher la bosse", effects: {force: 1, vestiaire: "-"}, answer: "Le premier joueur mis au repos par un chiffre le prend très mal. Il ne se blesse pas de la saison."}
    right: {label: "Toucher la bosse", effects: {force: 1, vestiaire: "-"}, answer: "Le premier joueur mis au repos par un chiffre le prend très mal. Il ne se blesse pas de la saison."}

  - id: co.ep.2012_ligne_de_but
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: meneche
    tone: leger
    once: true
    year: 2012
    text: "Massenet montre sa montre, puis celle de l'arbitre à la télé : « Sept caméras décident si le ballon a passé la ligne, et la montre vibre. Hors micro : le doute devient quoi ? »"
    left:  {label: "Regarder la montre", effects: {direction: "-", set: [monde_ligne_de_but]}, answer: "Le premier but validé par une vibration l'est en une seconde. On en discute six mois quand même."}
    right: {label: "Regarder la montre", effects: {direction: "-", set: [monde_ligne_de_but]}, answer: "Le premier but validé par une vibration l'est en une seconde. On en discute six mois quand même."}

  - id: co.ep.2014_mousse
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: gege
    tone: leger
    once: true
    year: 2014
    text: "Gégé imite un arbitre qui trace un trait par terre, très sérieusement : « Il sort une bombe, il fait un trait à neuf mètres, et ça s'efface tout seul. La tribune n'oublie rien. »"
    left:  {label: "Refaire le geste", effects: {tribunes: "+"}, answer: "Le mur recule d'un mètre pour la première fois depuis toujours. Il revient à sa place en avril."}
    right: {label: "Refaire le geste", effects: {tribunes: "+"}, answer: "Le mur recule d'un mètre pour la première fois depuis toujours. Il revient à sa place en avril."}

  - id: co.ep.2015_feminines
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: lea
    tone: strategique
    once: true
    year: 2015
    text: "Léa referme un carnet plein de noms de femmes : « La section féminine a onze contrats, un bus et un créneau à vingt et une heures. Vous confirmez qu'on leur donne le samedi ? »"
    left:  {label: "Donner le samedi", effects: {tribunes: "+", caisse: "-"}, answer: "Elles ont le samedi à quinze heures. Il vient huit cents personnes, et personne au club ne s'y attendait."}
    right: {label: "Donner le samedi", effects: {tribunes: "+", caisse: "-"}, answer: "Elles ont le samedi à quinze heures. Il vient huit cents personnes, et personne au club ne s'y attendait."}

  - id: co.ep.2017_analyste
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: clow
    tone: strategique
    once: true
    year: 2017
    text: "Corven regarde un garçon installer trois écrans dans le bureau du fond : « Il sait combien de passes vers l'avant on rate, et il a vingt-quatre ans. Je ne savais rien, moi. »"
    left:  {label: "Regarder les écrans", effects: {force: 1, direction: "-"}, answer: "L'analyste devient adjoint en trois ans. Il n'a jamais joué un match en équipe première, nulle part."}
    right: {label: "Regarder les écrans", effects: {force: 1, direction: "-"}, answer: "L'analyste devient adjoint en trois ans. Il n'a jamais joué un match en équipe première, nulle part."}

  - id: co.ep.2018_maillots_retro
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    speaker: gege
    tone: leger
    once: true
    year: 2018
    text: "Gégé déplie un maillot d'il y a trente ans, vendu neuf sous plastique : « Ils rééditent celui de nos pères, avec la faute d'orthographe d'époque. La tribune n'oublie rien. »"
    left:  {label: "Chercher la faute", effects: {tribunes: "+", caisse: "+"}, answer: "La boutique en vend six cents en deux mois. C'est la faute d'orthographe qui se vend, pas le maillot."}
    right: {label: "Chercher la faute", effects: {tribunes: "+", caisse: "+"}, answer: "La boutique en vend six cents en deux mois. C'est la faute d'orthographe qui se vend, pas le maillot."}

  - id: co.ep.2019_trois_regles
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: legruet
    tone: leger
    once: true
    year: 2019
    text: "Berthomier compte sur ses doigts, puis recommence : « Le mur à un mètre, un pied du gardien sur la ligne, et on sort par le côté le plus proche. On verra ça après le Congrès. »"
    left:  {label: "Recompter avec lui", effects: {direction: "-"}, answer: "Les arbitres passent l'automne à réexpliquer. Les joueurs passent l'automne à essayer de sortir lentement."}
    right: {label: "Recompter avec lui", effects: {direction: "-"}, answer: "Les arbitres passent l'automne à réexpliquer. Les joueurs passent l'automne à essayer de sortir lentement."}
