# Les cartes d'époque, 2020-2050 — ce que le sport devient
#
# Même règle que `epoque_1990.yaml` : le SPORT est réel — jusqu'en 2022, ce
# sont des changements datés (les cinq changements, le remplacement pour
# commotion, le hors-jeu calculé, le ballon à puce, l'arbitre qui explique au
# micro) ; au-delà, ce sont les MÊMES axes prolongés (l'équipement, la donnée,
# le corps, les mœurs, le calendrier), jamais une prophétie gratuite. Le monde,
# lui, reste fictif : aucun club, joueur, entraîneur, dirigeant, marque ni
# compétition réels.
#
# Les carrières de ce jeu commencent en 1990 : ces cartes-là sont pour celles
# qui durent, et pour les postulats tardifs qui viendront. Elles portent le
# même format (`arc: nouvelle`, `once: true`, un bouton, effets faibles).
cards:

  - id: co.ep.2020_cinq_changements
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: brehaut
    tone: leger
    once: true
    year: 2020
    text: "Bréhaut compte les places du banc à voix haute, deux fois : « Cinq changements par match, et on tient neuf mois à dix-huit. Le groupe vit bien, et le groupe tourne. »"
    left:  {label: "Recompter le banc", effects: {vestiaire: "+"}, answer: "Trois remplaçants jouent plus que deux titulaires. Plus personne ne sait dire qui est titulaire."}
    right: {label: "Recompter le banc", effects: {vestiaire: "+"}, answer: "Trois remplaçants jouent plus que deux titulaires. Plus personne ne sait dire qui est titulaire."}

  - id: co.ep.2021_sortie_commotion
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    year: 2021
    text: "Le Doc tapote une carte plastifiée dans sa poche de poitrine : « Un joueur assommé sort, et il ne compte pas dans les cinq. Ça reste entre la table et moi : j'ai attendu ça vingt ans. »"
    left:  {label: "Regarder la carte", effects: {vestiaire: "+"}, answer: "Il la sort deux fois en trois saisons. Les deux fois, le joueur voulait rester et l'a dit très fort."}
    right: {label: "Regarder la carte", effects: {vestiaire: "+"}, answer: "Il la sort deux fois en trois saisons. Les deux fois, le joueur voulait rester et l'a dit très fort."}

  - id: co.ep.2022_hors_jeu_machine
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: meneche
    tone: leger
    once: true
    year: 2022
    text: "Massenet fait tourner un ballon qui a une puce dedans : « Le hors-jeu se calcule pendant que le joueur court, et on le dessine à l'écran. Hors micro : c'est joli et c'est froid. »"
    left:  {label: "Faire tourner le ballon", effects: {direction: "-", set: [monde_hors_jeu_machine]}, answer: "Un orteil coûte une demi-finale à quelqu'un, quelque part. On repasse le dessin en boucle pendant huit jours."}
    right: {label: "Faire tourner le ballon", effects: {direction: "-", set: [monde_hors_jeu_machine]}, answer: "Un orteil coûte une demi-finale à quelqu'un, quelque part. On repasse le dessin en boucle pendant huit jours."}

  - id: co.ep.2023_arbitre_au_micro
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: gege
    tone: leger
    once: true
    year: 2023
    text: "Gégé, casquette relevée, la tête tournée vers les haut-parleurs : « L'arbitre a expliqué au micro pourquoi le but est refusé, avec des mots. La tribune n'oublie rien : elle a applaudi. »"
    left:  {label: "Écouter l'annonce", effects: {tribunes: "+"}, answer: "Il explique quarante fois cette saison-là. On ne conteste plus qu'à moitié, et seulement par habitude."}
    right: {label: "Écouter l'annonce", effects: {tribunes: "+"}, answer: "Il explique quarante fois cette saison-là. On ne conteste plus qu'à moitié, et seulement par habitude."}

  - id: co.ep.2025_lunettes
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: vukic
    tone: strategique
    once: true
    year: 2025
    text: "Vukić tient une paire de lunettes opaques comme un objet sale : « On répète les coups de pied arrêtés là-dedans, assis, sans transpirer. Personne ne te le dira : ça marche. »"
    left:  {label: "Les essayer", effects: {force: 1, vestiaire: "-"}, answer: "Le gardien les garde le soir pour revoir les penaltys. Il dort mal deux semaines, puis il en arrête trois."}
    right: {label: "Les essayer", effects: {force: 1, vestiaire: "-"}, answer: "Le gardien les garde le soir pour revoir les penaltys. Il dort mal deux semaines, puis il en arrête trois."}

  - id: co.ep.2029_maillot_ecran
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    speaker: nassir
    tone: strategique
    once: true
    year: 2029
    text: "Le Cheikh Ilyas fait défiler trois logos sur le même maillot : « La publicité change à la mi-temps, selon qui regarde et d'où. Ce n'est pas un club, c'est un actif. »"
    left:  {label: "Regarder défiler", effects: {caisse: "+", tribunes: "-"}, answer: "Le maillot vendu en boutique, lui, n'a aucun logo. C'est devenu l'option la plus chère du catalogue."}
    right: {label: "Regarder défiler", effects: {caisse: "+", tribunes: "-"}, answer: "Le maillot vendu en boutique, lui, n'a aucun logo. C'est devenu l'option la plus chère du catalogue."}

  - id: co.ep.2031_mardi_midi
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: lea
    tone: leger
    once: true
    year: 2031
    text: "Léa déplie une grille d'horaires écrite en trois fuseaux : « On joue le mardi à midi pour être vus le soir de l'autre côté du monde. Vous confirmez que les gens d'ici travaillent ? »"
    left:  {label: "Lire les trois fuseaux", effects: {tribunes: "-", caisse: "+"}, answer: "Il y a quatre cents personnes au stade et onze millions ailleurs. On compte les onze millions, et on titre dessus."}
    right: {label: "Lire les trois fuseaux", effects: {tribunes: "-", caisse: "+"}, answer: "Il y a quatre cents personnes au stade et onze millions ailleurs. On compte les onze millions, et on titre dessus."}

  - id: co.ep.2036_crampons_imprimes
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    year: 2036
    text: "Le Doc pose une semelle encore tiède sur l'empreinte d'un pied : « On imprime la chaussure sur le pied du joueur, en une nuit. Ça reste entre la table et moi : le pied vieillit pareil. »"
    left:  {label: "Toucher la semelle", effects: {force: 1, caisse: "-"}, answer: "Les blessures au pied baissent d'un tiers en deux saisons. Celles du dos montent d'autant, et on cherche pourquoi."}
    right: {label: "Toucher la semelle", effects: {force: 1, caisse: "-"}, answer: "Les blessures au pied baissent d'un tiers en deux saisons. Celles du dos montent d'autant, et on cherche pourquoi."}

  - id: co.ep.2041_debout_homologue
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: lea
    tone: leger
    once: true
    year: 2041
    text: "Léa passe la main sur une barre d'appui toute neuve, dans le virage : « Le debout est autorisé de nouveau, avec des barres et un billet moins cher. Vous confirmez, cinquante ans ? »"
    left:  {label: "Tenir la barre", effects: {tribunes: "+", set: [monde_debout_revenu]}, answer: "Le virage retrouve le bruit qu'il avait avant les sièges. Les sièges partent à la casse, en une matinée."}
    right: {label: "Tenir la barre", effects: {tribunes: "+", set: [monde_debout_revenu]}, answer: "Le virage retrouve le bruit qu'il avait avant les sièges. Les sièges partent à la casse, en une matinée."}

  - id: co.ep.2045_maillot_capteur
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    year: 2045
    text: "Le Doc lit un bilan de sommeil sur l'écran du vestiaire : « Le maillot sait qu'il a mal dormi avant lui, et il le dit au staff. Ça reste entre la table et moi, sauf que non. »"
    left:  {label: "Fermer l'écran", effects: {vestiaire: "-", force: 1}, answer: "Un joueur enlève son maillot pour dormir. Le staff apprend quand même qu'il a mal dormi, et le note."}
    right: {label: "Fermer l'écran", effects: {vestiaire: "-", force: 1}, answer: "Un joueur enlève son maillot pour dormir. Le staff apprend quand même qu'il a mal dormi, et le note."}

  - id: co.ep.2048_foot_a_cinq
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, formation]
    speaker: clow
    tone: leger
    once: true
    year: 2048
    text: "Corven regarde un terrain coupé en quatre par des plots orange : « Jusqu'à douze ans, on ne joue plus qu'à cinq, sur un mouchoir. Je ne dirais pas que j'étais un grand : j'étais loin. »"
    left:  {label: "Compter les plots", effects: {vestiaire: "+"}, answer: "Les gamins touchent le ballon six fois plus qu'avant. Les parents, eux, ne voient plus la ligne médiane."}
    right: {label: "Compter les plots", effects: {vestiaire: "+"}, answer: "Les gamins touchent le ballon six fois plus qu'avant. Les parents, eux, ne voient plus la ligne médiane."}

  - id: co.ep.2050_ballon_rond
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, moment]
    speaker: vukic
    tone: leger
    once: true
    year: 2050
    text: "Vukić fait rouler un ballon sous sa semelle sans le regarder : « Tout a changé en soixante ans : les règles, l'argent, les stades. Personne ne te le dira : la balle est ronde pareil. »"
    left:  {label: "Le renvoyer du pied", effects: {vestiaire: "+", set: [monde_ballon_rond]}, answer: "Le stade se lève à la même minute qu'en 1990. On n'a jamais su pourquoi cette minute-là plutôt qu'une autre."}
    right: {label: "Le renvoyer du pied", effects: {vestiaire: "+", set: [monde_ballon_rond]}, answer: "Le stade se lève à la même minute qu'en 1990. On n'a jamais su pourquoi cette minute-là plutôt qu'une autre."}

  # ══ densité 2033-2049 (lot « anecdotes d'époque ») ═════════════════════════
  # Onze années n'avaient qu'UNE carte datée : une carrière longue arrivait
  # dans les années 2030-2040 avec deux anecdotes servables par saison, tout
  # juste le budget, et la même à chaque partie. Même moule que 1990 : une
  # règle, un objet, un usage — le SPORT change, le monde reste fictif.

  - id: co.ep.2033_dix_minutes
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: vukic
    tone: strategique
    once: true
    year: 2033
    text: "Vukić montre le banc du menton : « Dix minutes dehors pour une contestation, et on joue à dix pendant ce temps. Je te le dis parce que personne ne te le dira : ça calme tout le monde. »"
    left:  {label: "Compter les dix minutes", effects: {vestiaire: "+"}, answer: "Les protestations tombent de moitié en un an. Les entraîneurs, eux, apprennent à hurler sans être vus."}
    right: {label: "Compter les dix minutes", effects: {vestiaire: "+"}, answer: "Les protestations tombent de moitié en un an. Les entraîneurs, eux, apprennent à hurler sans être vus."}

  - id: co.ep.2034_chrono_arrete
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: meneche
    tone: leger
    once: true
    year: 2034
    text: "Massenet retourne son chronomètre sur la table : « Soixante minutes, chrono arrêté à chaque ballon sorti. Hors micro : on a enfin le même match pour tout le monde, et il dure plus longtemps. »"
    left:  {label: "Regarder le chrono", effects: {tribunes: "-"}, answer: "Le ballon vit huit minutes de plus. La buvette, elle, ferme huit minutes plus tard, et ne s'en plaint pas."}
    right: {label: "Regarder le chrono", effects: {tribunes: "-"}, answer: "Le ballon vit huit minutes de plus. La buvette, elle, ferme huit minutes plus tard, et ne s'en plaint pas."}

  - id: co.ep.2037_pelouse_arrosee
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    year: 2037
    text: "Le Doc pose la main à plat sur la pelouse, à midi : « Août est devenu injouable : les séances passent à six heures, et les matchs à vingt-deux. Ça reste entre la table et moi : on a mis vingt ans. »"
    left:  {label: "Toucher l'herbe", effects: {vestiaire: "+", caisse: "-"}, answer: "Les enfants ne viennent plus : ils dorment. On joue devant des adultes, et devant des caméras."}
    right: {label: "Toucher l'herbe", effects: {vestiaire: "+", caisse: "-"}, answer: "Les enfants ne viennent plus : ils dorment. On joue devant des adultes, et devant des caméras."}

  - id: co.ep.2038_carton_du_lundi
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: gege
    tone: leger
    once: true
    year: 2038
    text: "Gégé tape sur la grille avec sa chevalière : « Les cartons tombent le lundi maintenant, à la vidéo, pour ce que l'arbitre n'a pas vu. La tribune n'oublie rien : elle attend le lundi. »"
    left:  {label: "Attendre lundi", effects: {tribunes: "-"}, answer: "Un joueur est suspendu trois jours après le match. Le virage a chanté son nom entre-temps."}
    right: {label: "Attendre lundi", effects: {tribunes: "-"}, answer: "Un joueur est suspendu trois jours après le match. Le virage a chanté son nom entre-temps."}

  - id: co.ep.2039_biere_au_virage
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: vecchio
    tone: leger
    once: true
    year: 2039
    text: "Gigi Vecchio regarde la buvette rouverte dans le virage : « J'en ai vu d'autres : la bière est revenue en tribune, en gobelet consigné, et le stade est plus calme qu'avant. »"
    left:  {label: "Prendre un gobelet", effects: {tribunes: "+", caisse: "+"}, answer: "On ramasse deux cents gobelets au lieu de deux mille. Le virage a inventé un chant pour la consigne."}
    right: {label: "Prendre un gobelet", effects: {tribunes: "+", caisse: "+"}, answer: "On ramasse deux cents gobelets au lieu de deux mille. Le virage a inventé un chant pour la consigne."}

  - id: co.ep.2042_journee_a_l_etranger
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    speaker: nassir
    tone: strategique
    once: true
    year: 2042
    text: "Le Cheikh Ilyas déplie une carte du monde sur le bureau : « Une journée de championnat se jouera à six mille kilomètres, en janvier. Ce n'est pas un club, c'est un actif qui voyage. »"
    left:  {label: "Regarder la carte", effects: {caisse: "+", tribunes: "-"}, answer: "Les abonnés paient la même saison, avec un match en moins. On leur offre une écharpe collector."}
    right: {label: "Regarder la carte", effects: {caisse: "+", tribunes: "-"}, answer: "Les abonnés paient la même saison, avec un match en moins. On leur offre une écharpe collector."}

  - id: co.ep.2043_plafond_de_matchs
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: brehaut
    tone: strategique
    once: true
    year: 2043
    text: "Titi Bréhaut lit la liste des indisponibles à voix haute : « Cinquante-cinq matchs par joueur et par an, pas un de plus : c'est la règle. Le groupe vit bien, et le groupe est obligé de tourner. »"
    left:  {label: "Relire la liste", effects: {vestiaire: "+", force: -1}, answer: "Deux titulaires sont mis au repos en mars, par ordinateur. Le club perd les deux matchs, et personne ne discute."}
    right: {label: "Relire la liste", effects: {vestiaire: "+", force: -1}, answer: "Deux titulaires sont mis au repos en mars, par ordinateur. Le club perd les deux matchs, et personne ne discute."}

  - id: co.ep.2044_buts_plus_larges
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, moment]
    speaker: clow
    tone: leger
    once: true
    year: 2044
    text: "Corven mesure la cage avec ses deux bras écartés : « On essaie des buts plus larges en amical, pour marquer davantage. Je ne dirais pas que j'étais un grand gardien : là, j'aurais pleuré. »"
    left:  {label: "Mesurer la cage", effects: {tribunes: "+"}, answer: "Trois buts de plus par match, et deux gardiens qui prennent leur retraite. L'essai est abandonné en juin."}
    right: {label: "Mesurer la cage", effects: {tribunes: "+"}, answer: "Trois buts de plus par match, et deux gardiens qui prennent leur retraite. L'essai est abandonné en juin."}

  - id: co.ep.2046_probabilite_au_tableau
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: lea
    tone: leger
    once: true
    year: 2046
    text: "Léa désigne le tableau d'affichage, où un pourcentage bouge tout seul : « Ils affichent vos chances de gagner, en direct, minute par minute. Vous confirmez qu'on peut jouer sans ça ? »"
    left:  {label: "Lever les yeux", effects: {tribunes: "-", vestiaire: "-"}, answer: "À 8 %, la tribune est partie avant l'égalisation. Le pourcentage, lui, avait raison ; ça n'aide personne."}
    right: {label: "Lever les yeux", effects: {tribunes: "-", vestiaire: "-"}, answer: "À 8 %, la tribune est partie avant l'égalisation. Le pourcentage, lui, avait raison ; ça n'aide personne."}

  - id: co.ep.2047_tete_a_quatorze
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, formation]
    speaker: vukic
    tone: strategique
    once: true
    year: 2047
    text: "Vukić range les ballons de la séance des petits : « Plus une seule tête avant quatorze ans, c'est écrit. Je te le dis parce que personne ne te le dira : on jouera au sol pendant vingt ans. »"
    left:  {label: "Ranger les ballons", effects: {vestiaire: "+", force: 1}, answer: "Les corners deviennent des passes en retrait. Une génération entière ne sait plus sauter à deux."}
    right: {label: "Ranger les ballons", effects: {vestiaire: "+", force: 1}, answer: "Les corners deviennent des passes en retrait. Une génération entière ne sait plus sauter à deux."}

  - id: co.ep.2049_match_a_la_minute
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    speaker: josiane
    tone: leger
    once: true
    year: 2049
    text: "Madame Josiane relit une facture de diffusion : « On paie le match à la minute regardée, comme le téléphone. J'en ai vu passer, vous savez : celle-là, personne ne sait la lire. »"
    left:  {label: "Relire la facture", effects: {caisse: "+", direction: "-"}, answer: "Les prolongations rapportent double. On ne l'a dit à personne, et deux clubs ont joué très lentement."}
    right: {label: "Relire la facture", effects: {caisse: "+", direction: "-"}, answer: "Les prolongations rapportent double. On ne l'a dit à personne, et deux clubs ont joué très lentement."}
