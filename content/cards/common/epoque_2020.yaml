# Les cartes d'époque, 2020-2050 — ce que le sport devient
#
# Même règle que `epoque_1990.yaml` : le SPORT est réel — jusqu'en 2022, ce
# sont des changements datés (les cinq changements, le remplacement pour
# commotion, le hors-jeu calculé, le ballon à puce, l'arbitre qui explique au
# micro) ; au-delà, ce sont les MÊMES axes prolongés (l'équipement, la donnée,
# le corps, les mœurs, le calendrier), jamais une prophétie gratuite. Le monde,
# lui, reste fictif : aucun club, joueur, entraîneur, dirigeant, marque ni
# compétition réels.
#
# Les carrières de ce jeu commencent en 1990 : ces cartes-là sont pour celles
# qui durent, et pour les postulats tardifs qui viendront. Elles portent le
# même format (`arc: nouvelle`, `once: true`, un bouton, effets faibles).
cards:

  - id: co.ep.2020_cinq_changements
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: brehaut
    tone: leger
    once: true
    year: 2020
    text: "Bréhaut compte les places du banc du doigt, deux fois : « Cinq changements par match. Ceux qui ne jouaient jamais vont jouer. Regarde-les au fond du vestiaire : ils l'ont compris avant nous. »"
    left:  {label: "Je recompte le banc", effects: {vestiaire: "+"}, answer: "Trois remplaçants jouent plus que deux titulaires. À Noël, plus personne au vestiaire ne sait dire qui est titulaire."}
    right: {label: "Je recompte le banc", effects: {vestiaire: "+"}, answer: "Trois remplaçants jouent plus que deux titulaires. À Noël, plus personne au vestiaire ne sait dire qui est titulaire."}

  - id: co.ep.2021_sortie_commotion
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    year: 2021
    text: "Le Doc, retraité, tapote la carte plastifiée de sa poche de poitrine : « Un joueur sonné sort, et il ne compte plus dans les cinq. Plus d'excuse pour le laisser. J'ai attendu ça quarante ans. »"
    left:  {label: "Je regarde la carte", effects: {vestiaire: "+"}, answer: "Le remplacement sert deux fois en trois saisons. Les deux fois, le joueur voulait rester, et il le dit très fort en sortant."}
    right: {label: "Je regarde la carte", effects: {vestiaire: "+"}, answer: "Le remplacement sert deux fois en trois saisons. Les deux fois, le joueur voulait rester, et il le dit très fort en sortant."}

  - id: co.ep.2022_hors_jeu_machine
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: meneche
    tone: leger
    once: true
    year: 2022
    text: "Massenet fait tourner un ballon à puce : « Le hors-jeu se calcule pendant la course, et on le dessine en couleur. Votre avant-centre a de larges épaules. Il va apprendre qu'elles comptent. »"
    left:  {label: "Je fais tourner le ballon", effects: {direction: "-", set: [monde_hors_jeu_machine]}, answer: "En novembre, une épaule coûte un but à {club}. On repasse le dessin en boucle huit jours ; l'avant-centre ne le regarde pas."}
    right: {label: "Je fais tourner le ballon", effects: {direction: "-", set: [monde_hors_jeu_machine]}, answer: "En novembre, une épaule coûte un but à {club}. On repasse le dessin en boucle huit jours ; l'avant-centre ne le regarde pas."}

  - id: co.ep.2023_arbitre_au_micro
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: gege
    tone: leger
    once: true
    year: 2023
    text: "Gégé, la casquette relevée vers les haut-parleurs : « L'arbitre a expliqué au micro pourquoi il refusait le but. Avec des mots. Cinquante ans qu'on attendait ça. Le virage a applaudi un arbitre. »"
    left:  {label: "J'écoute l'annonce", effects: {tribunes: "+"}, answer: "Il s'explique quarante fois cette saison-là. Le virage ne conteste plus qu'à moitié, et seulement par habitude."}
    right: {label: "J'écoute l'annonce", effects: {tribunes: "+"}, answer: "Il s'explique quarante fois cette saison-là. Le virage ne conteste plus qu'à moitié, et seulement par habitude."}

  - id: co.ep.2025_lunettes
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: vukic
    tone: strategique
    once: true
    year: 2025
    text: "Vukić tient une paire de lunettes opaques à bout de bras : « Ils répètent les coups francs là-dedans, assis, sans transpirer. J'ai essayé. J'ai revu le ballon de 1979. Je l'ai encore lâché. »"
    left:  {label: "J'essaie les lunettes", effects: {force: 1, vestiaire: "-"}, answer: "Le gardien les garde le soir pour revoir les penaltys. Il dort mal deux semaines, puis il en arrête trois de suite."}
    right: {label: "J'essaie les lunettes", effects: {force: 1, vestiaire: "-"}, answer: "Le gardien les garde le soir pour revoir les penaltys. Il dort mal deux semaines, puis il en arrête trois de suite."}

  - id: co.ep.2029_maillot_ecran
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    speaker: nassir
    tone: strategique
    once: true
    year: 2029
    text: "Le Cheikh Ilyas fait défiler trois logos sur le même maillot : « La publicité change à la mi-temps, selon qui regarde et d'où. Votre poitrine se loue à la minute. Le rendement est excellent. »"
    left:  {label: "Je regarde défiler", effects: {caisse: "+", tribunes: "-"}, answer: "En boutique, le maillot sans aucun logo devient l'article le plus cher. Au local, on le porte à l'envers, par principe."}
    right: {label: "Je regarde défiler", effects: {caisse: "+", tribunes: "-"}, answer: "En boutique, le maillot sans aucun logo devient l'article le plus cher. Au local, on le porte à l'envers, par principe."}

  - id: co.ep.2031_mardi_midi
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: lea
    tone: leger
    once: true
    year: 2031
    text: "Léa déplie une grille d'horaires en trois fuseaux : « Mardi midi, pour être vus le soir à l'autre bout du monde. L'usine de la zone nord me dit : pas de pause ce jour-là. Vous jouerez devant qui ? »"
    left:  {label: "Je lis les trois fuseaux", effects: {tribunes: "-", caisse: "+"}, answer: "Quatre cents personnes au stade, onze millions ailleurs. Le club affiche les onze millions dans le hall, en très grand."}
    right: {label: "Je lis les trois fuseaux", effects: {tribunes: "-", caisse: "+"}, answer: "Quatre cents personnes au stade, onze millions ailleurs. Le club affiche les onze millions dans le hall, en très grand."}

  - id: co.ep.2036_crampons_imprimes
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    year: 2036
    text: "On imprime la chaussure sur le pied du joueur, en une nuit. Sur la porte de l'atelier, quelqu'un a punaisé une vieille ordonnance du Doc : « Changez la chaussure. Le pied vieillira pareil. »"
    left:  {label: "Je touche la semelle", effects: {force: 1, caisse: "-"}, answer: "Les blessures au pied baissent d'un tiers en deux saisons. Celles du dos montent d'autant, et personne ne relit l'ordonnance."}
    right: {label: "Je touche la semelle", effects: {force: 1, caisse: "-"}, answer: "Les blessures au pied baissent d'un tiers en deux saisons. Celles du dos montent d'autant, et personne ne relit l'ordonnance."}

  - id: co.ep.2041_debout_homologue
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: lea
    tone: leger
    once: true
    year: 2041
    text: "Léa passe la main sur une barre d'appui neuve du virage : « Le debout revient, avec des barres et un billet moins cher. Cinquante et un ans après. J'étais là quand ils ont vissé les sièges. »"
    left:  {label: "Je tiens la barre", effects: {tribunes: "+", set: [monde_debout_revenu]}, answer: "Le virage retrouve le bruit d'avant les sièges. Les sièges bleus de 1994 partent à la casse en une matinée ; trois finissent au local."}
    right: {label: "Je tiens la barre", effects: {tribunes: "+", set: [monde_debout_revenu]}, answer: "Le virage retrouve le bruit d'avant les sièges. Les sièges bleus de 1994 partent à la casse en une matinée ; trois finissent au local."}

  - id: co.ep.2045_maillot_capteur
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    year: 2045
    text: "Le maillot sait qu'un joueur a mal dormi avant lui, et il le dit au staff. Sur la vieille table qui porte le nom du Doc, une phrase gravée : « Un homme qui dort mal, regardez-le dans les yeux. »"
    left:  {label: "Je ferme l'écran", effects: {vestiaire: "-", force: 1}, answer: "Un joueur enlève son maillot pour dormir. Le staff apprend quand même qu'il a mal dormi, et le note dans son dossier."}
    right: {label: "Je ferme l'écran", effects: {vestiaire: "-", force: 1}, answer: "Un joueur enlève son maillot pour dormir. Le staff apprend quand même qu'il a mal dormi, et le note dans son dossier."}

  - id: co.ep.2048_foot_a_cinq
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, formation]
    speaker: clow
    tone: leger
    once: true
    year: 2048
    text: "Les moins de douze ans ne jouent plus qu'à cinq. Au stage Corven, on repasse sa vieille cassette : « À onze contre onze, j'ai touché trois ballons par match jusqu'à quinze ans. Trois. »"
    left:  {label: "Je compte les plots", effects: {vestiaire: "+"}, answer: "Les gamins touchent le ballon six fois plus qu'avant. Derrière la main courante, les parents ne voient plus la ligne médiane."}
    right: {label: "Je compte les plots", effects: {vestiaire: "+"}, answer: "Les gamins touchent le ballon six fois plus qu'avant. Derrière la main courante, les parents ne voient plus la ligne médiane."}

  - id: co.ep.2050_ballon_rond
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, moment]
    speaker: vukic
    tone: leger
    once: true
    year: 2050
    text: "Sur la dernière page du cahier de Vukić, de son écriture serrée : « Soixante ans. Les règles, l'argent, les stades ont changé. Le ballon pèse pareil. Je l'ai lâché une fois. Toi, tiens-le. »"
    left:  {label: "Je tiens le ballon", effects: {vestiaire: "+", set: [monde_ballon_rond]}, answer: "Le stade se lève à la même minute qu'en 1990, sans que personne l'ait demandé. Le cahier reste ouvert sur le banc jusqu'au coup de sifflet."}
    right: {label: "Je tiens le ballon", effects: {vestiaire: "+", set: [monde_ballon_rond]}, answer: "Le stade se lève à la même minute qu'en 1990, sans que personne l'ait demandé. Le cahier reste ouvert sur le banc jusqu'au coup de sifflet."}

  # ══ densité 2033-2049 (lot « anecdotes d'époque ») ═════════════════════════
  # Onze années n'avaient qu'UNE carte datée : une carrière longue arrivait
  # dans les années 2030-2040 avec deux anecdotes servables par saison, tout
  # juste le budget, et la même à chaque partie. Même moule que 1990 : une
  # règle, un objet, un usage — le SPORT change, le monde reste fictif.

  - id: co.ep.2033_dix_minutes
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: vukic
    tone: strategique
    once: true
    year: 2033
    text: "Vukić montre le banc du bout de sa canne : « Dix minutes dehors pour une contestation, et l'équipe joue à dix. J'ai compté nos cartons de l'an dernier. Ça nous aurait coûté quatre matchs. »"
    left:  {label: "Je compte les dix minutes", effects: {vestiaire: "+"}, answer: "Les protestations tombent de moitié en un an. Les entraîneurs apprennent à hurler dans le couloir, là où personne ne compte."}
    right: {label: "Je compte les dix minutes", effects: {vestiaire: "+"}, answer: "Les protestations tombent de moitié en un an. Les entraîneurs apprennent à hurler dans le couloir, là où personne ne compte."}

  - id: co.ep.2034_chrono_arrete
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: meneche
    tone: leger
    once: true
    year: 2034
    text: "Massenet pose son vieux chrono : « Soixante minutes de jeu effectif. Le match finit vingt minutes plus tard qu'avant. Le dernier car de la gare routière, lui, part toujours à l'heure. »"
    left:  {label: "Je regarde le chrono", effects: {tribunes: "-"}, answer: "À la 85e, un tiers de la tribune Est se lève pour le car. La buvette, elle, ferme vingt minutes plus tard et ne s'en plaint pas."}
    right: {label: "Je regarde le chrono", effects: {tribunes: "-"}, answer: "À la 85e, un tiers de la tribune Est se lève pour le car. La buvette, elle, ferme vingt minutes plus tard et ne s'en plaint pas."}

  - id: co.ep.2037_pelouse_arrosee
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    year: 2037
    text: "Août est devenu injouable : séances à six heures, matchs à vingt-deux. Dans le vieux carnet du Doc, une ligne de 1998 : « Trente-quatre degrés au bord du terrain. Un jour, on jouera la nuit. »"
    left:  {label: "Je touche l'herbe", effects: {vestiaire: "+", caisse: "-"}, answer: "Les enfants ne viennent plus : à vingt-deux heures, ils dorment. On joue devant des adultes, et devant les caméras."}
    right: {label: "Je touche l'herbe", effects: {vestiaire: "+", caisse: "-"}, answer: "Les enfants ne viennent plus : à vingt-deux heures, ils dorment. On joue devant des adultes, et devant les caméras."}

  - id: co.ep.2038_carton_du_lundi
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: gege
    tone: leger
    once: true
    year: 2038
    text: "Les cartons tombent le lundi, à la vidéo, pour ce que l'arbitre n'a pas vu. Sur le compte Tribune_N_1971, que tout le monde sait être Gégé : « Samedi on chante son nom. Lundi ils l'enlèvent. »"
    left:  {label: "J'attends lundi", effects: {tribunes: "-"}, answer: "Lundi, un des nôtres prend trois matchs pour un coude que personne n'avait vu. Samedi, le virage avait chanté son nom."}
    right: {label: "J'attends lundi", effects: {tribunes: "-"}, answer: "Lundi, un des nôtres prend trois matchs pour un coude que personne n'avait vu. Samedi, le virage avait chanté son nom."}

  - id: co.ep.2039_biere_au_virage
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: vecchio
    tone: leger
    once: true
    year: 2039
    text: "La bière revient au virage, en gobelet consigné. Au-dessus de la tireuse, la photo de Gigi Vecchio, et au feutre : « Moi, j'ai toujours bu de l'eau. C'est pour ça que j'ai vu les matchs. »"
    left:  {label: "Je prends un gobelet", effects: {tribunes: "+", caisse: "+"}, answer: "On ramasse deux cents gobelets au lieu de deux mille. Le virage invente un chant pour la consigne ; il rime mal, et tout le monde le chante."}
    right: {label: "Je prends un gobelet", effects: {tribunes: "+", caisse: "+"}, answer: "On ramasse deux cents gobelets au lieu de deux mille. Le virage invente un chant pour la consigne ; il rime mal, et tout le monde le chante."}

  - id: co.ep.2042_journee_a_l_etranger
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    speaker: nassir
    tone: strategique
    once: true
    year: 2042
    text: "Le Cheikh Ilyas déplie une carte du monde : « En janvier, une journée de championnat se jouera à six mille kilomètres. Votre match à domicile en est. Les droits couvrent vos abonnés, et au-delà. »"
    left:  {label: "Je cherche notre ville", effects: {caisse: "+", tribunes: "-"}, answer: "Les abonnés paient la même saison avec un match en moins. Le club leur offre une écharpe ; deux cents la rendent au guichet, pliée."}
    right: {label: "Je cherche notre ville", effects: {caisse: "+", tribunes: "-"}, answer: "Les abonnés paient la même saison avec un match en moins. Le club leur offre une écharpe ; deux cents la rendent au guichet, pliée."}

  - id: co.ep.2043_plafond_de_matchs
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: brehaut
    tone: strategique
    once: true
    year: 2043
    text: "À la buvette des anciens, Bréhaut lit le journal pour toute la table : « Cinquante-cinq matchs par joueur et par an, pas un de plus. En 1979, j'en ai joué soixante et un. Mon genou s'en souvient. »"
    left:  {label: "Je relis l'article", effects: {vestiaire: "+", force: -1}, answer: "En mars, deux titulaires de {club} atteignent le plafond. Ils regardent les deux derniers matchs en tribune, et le club perd les deux."}
    right: {label: "Je relis l'article", effects: {vestiaire: "+", force: -1}, answer: "En mars, deux titulaires de {club} atteignent le plafond. Ils regardent les deux derniers matchs en tribune, et le club perd les deux."}

  - id: co.ep.2044_buts_plus_larges
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, moment]
    speaker: clow
    tone: leger
    once: true
    year: 2044
    text: "On essaie des buts plus larges en amical. Au bar d'en face, sous la photo de Corven, quelqu'un a recopié sa phrase : « Une cage, c'est un homme seul. Agrandis-la, il est plus seul. »"
    left:  {label: "Je mesure la cage", effects: {tribunes: "+"}, answer: "Trois buts de plus par match, et deux gardiens prennent leur retraite en mai. L'essai est abandonné en juin."}
    right: {label: "Je mesure la cage", effects: {tribunes: "+"}, answer: "Trois buts de plus par match, et deux gardiens prennent leur retraite en mai. L'essai est abandonné en juin."}

  - id: co.ep.2046_probabilite_au_tableau
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: lea
    tone: leger
    once: true
    year: 2046
    text: "Léa montre le tableau d'affichage, où un pourcentage bouge : « Vos chances de gagner, en direct, minute par minute. Samedi, à 8 %, j'ai compté trois cents départs. Vous avez égalisé à la 88e. »"
    left:  {label: "Je lève les yeux", effects: {tribunes: "-", vestiaire: "-"}, answer: "Les joueurs regardent le tableau à chaque arrêt de jeu. Au vestiaire, quelqu'un colle du ruban adhésif sur l'écran de la salle de soins."}
    right: {label: "Je lève les yeux", effects: {tribunes: "-", vestiaire: "-"}, answer: "Les joueurs regardent le tableau à chaque arrêt de jeu. Au vestiaire, quelqu'un colle du ruban adhésif sur l'écran de la salle de soins."}

  - id: co.ep.2047_tete_a_quatorze
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, formation]
    speaker: vukic
    tone: strategique
    once: true
    year: 2047
    text: "Vukić, sur une chaise pliante, regarde les petits : « Plus de tête avant quatorze ans. À neuf ans, en Dalmarie, j'en faisais cent par séance. Mal au crâne chaque lundi, jusqu'à quarante ans. »"
    left:  {label: "Je range les ballons", effects: {vestiaire: "+", force: 1}, answer: "Les corners deviennent des passes en retrait. Une génération entière ne sait plus sauter à deux, et ne se plaint plus le lundi."}
    right: {label: "Je range les ballons", effects: {vestiaire: "+", force: 1}, answer: "Les corners deviennent des passes en retrait. Une génération entière ne sait plus sauter à deux, et ne se plaint plus le lundi."}

  - id: co.ep.2049_match_a_la_minute
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    speaker: josiane
    tone: leger
    once: true
    year: 2049
    text: "La télé paie le match à la minute regardée. La petite Josiane apporte la facture et répète le conseil de sa tante : « Une facture qu'on ne comprend pas, on la relit devant témoin, ligne par ligne. »"
    left:  {label: "Je la relis devant témoin", effects: {caisse: "+", direction: "-"}, answer: "Les prolongations rapportent double. Personne ne le dit tout haut, et deux clubs jouent très lentement la dernière journée."}
    right: {label: "Je la relis devant témoin", effects: {caisse: "+", direction: "-"}, answer: "Les prolongations rapportent double. Personne ne le dit tout haut, et deux clubs jouent très lentement la dernière journée."}
