# TES FANTÔMES (docs/histoires/fantomes.md) — les cartes d'une carrière qui se souvient d'une
# autre. Une carrière finie laisse quelques faits (preview_dossier.js) ; une carrière plus
# tardive les reçoit au début comme des drapeaux `fantome_*` (Engine.heritage, aucun tirage) et
# le nom de famille du fantôme comme `{fantome_<livre>}`. Les cartes ci-dessous sont des cartes
# du sac, `once`, de priorité 1 : le jour où la garde est vraie, la carte passe devant le décor
# ordinaire au tirage de sac suivant (une carrière n'en tire que trois ou quatre ; sans la bande,
# le souvenir ne sortirait presque jamais). Sans héritage, aucune garde n'est vraie : la carrière
# est celle d'avant, carte pour carte.
#
# Le fantôme n'a pas de genre ici (son nom, jamais « il » ni « elle ») : il peut avoir été une
# entraîneuse, un joueur, une présidente.
cards:
  # ═══════════════════════════════ L'Oreillette (2024) : Lian Mbako, entraîneur, et le matin de 1990
  # La Route de la Rive, carte jp.fin.pro3_place : Mbako, seize ans, était assis à ta place.
  # Trente-quatre ans plus tard, il entraîne le Racing, et il s'en souvient. La scène de la semaine
# fa.sc.h8_mbako_* (content/ville/fantomes.yaml) tient le même souvenir quand le sac ne sert
# rien ; l'une tait l'autre (`fantome_h8_mbako_dit`).
  - id: co.fantome.h8_mbako_cote
    roles: [ds]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: mbako
    tone: leger
    once: true
    priority: 1
    when: "flag('histoire_h8') && flag('fantome_h4_mbako_cote') && !flag('fantome_h8_mbako_dit')"
    text: "Mbako pousse un gamin de dix-sept ans sur le banc, à côté de Kerdal : « En 1990, {fantome_h4} m'a fait une place comme ça, sans un mot. Ton modèle dit que ça ne sert à rien. Il a raison ? »"
    left:
      label: "Le modèle a ses chiffres"
      effects: {direction: "+", relation: {mbako: -1}, set: [fantome_h8_mbako_dit]}
      answer: "Mbako renvoie le gamin au bout du banc, une main sur l'épaule. « En 1990, personne n'avait de chiffres. On avait des places. »"
    right:
      label: "Laisse-le à côté"
      effects: {vestiaire: "+", relation: {mbako: 1}, set: [fantome_h8_mbako_dit]}
      answer: "Le gamin reste à côté de Kerdal jusqu'à la fin de la séance. Mbako regarde la place, pas l'écran. Il ne dit pas merci ; il n'a jamais su."

  - id: co.fantome.h8_mbako_leve
    roles: [ds]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: mbako
    tone: leger
    once: true
    priority: 1
    when: "flag('histoire_h8') && flag('fantome_h4_mbako_leve') && !flag('fantome_h8_mbako_dit')"
    text: "Au vestiaire, un gamin se lève devant un ancien sans qu'on le lui demande. Mbako : « En 1990, {fantome_h4} m'a fait lever de sa place. J'ai mis vingt ans à m'asseoir. Je le laisse faire ? »"
    left:
      label: "Chacun sa place"
      effects: {direction: "+", vestiaire: "-", set: [fantome_h8_mbako_dit]}
      answer: "Mbako hoche la tête, comme on signe sans lire. Le gamin reste debout jusqu'à l'échauffement, les mains dans les manches."
    right:
      label: "Rassieds-le"
      effects: {vestiaire: "+", relation: {mbako: 1}, set: [fantome_h8_mbako_dit]}
      answer: "Mbako rassied le gamin d'une main sur l'épaule ; l'ancien se pousse sans un mot. Personne ne parle de 1990. Tout le monde a compris."

  # ═══════════════════════════════ La Maquette (1999) : les masques de Trois mille visages
  # Gégé n'a jamais su jeter. Seulement si les masques n'ont été ni brûlés ni montés aux Hauts.
  - id: co.fantome.h5_masques
    roles: [president]
    arc: tribunes
    tags: [ultras, objet]
    speaker: gege
    tone: leger
    once: true
    priority: 1
    when: "flag('histoire_h5') && flag('fantome_h1') && !flag('fantome_h1_brasero') && !flag('fantome_h1_hauts')"
    text: "Gégé pose sur ton bureau un masque en carton jauni : la figure de {fantome_h1}, 1990. « Il en reste trois cartons au local. On les ressort pour ton premier match, ou on les laisse dormir ? »"
    left:
      label: "Laissez-les dormir"
      effects: {direction: "+", tribunes: "-"}
      answer: "Gégé replie le masque en deux et le glisse dans sa veste. « Ils dorment depuis neuf ans. Ils ont le sommeil léger. »"
    right:
      label: "Ressortez-les"
      effects: {tribunes: "+", direction: "-"}
      answer: "Au premier match, la Nord porte deux cents fois la même figure. Les gamins du virage demandent qui c'est ; les vieux ne répondent pas."

  # ═══════════════════════════════ 23 h 58 (2003) : la valise de La Maquette
  # Hubert Malbec a poussé une valise sous une table d'hôtel en 1999 ; quelqu'un l'a prise.
  - id: co.fantome.h6_malbec
    roles: [ds]
    arc: mercato
    tags: [agents, mercato]
    speaker: malbec
    tone: strategique
    once: true
    priority: 1
    when: "flag('histoire_h6') && flag('fantome_h5_valise')"
    text: "Hubert Malbec s'assoit sans qu'on l'invite : « En 1999, {fantome_h5} a pris une valise sous une table d'hôtel. Je ne viens pas la reprendre. Je viens voir si la table est libre. »"
    left:
      label: "La table est prise"
      effects: {direction: "+", caisse: "-"}
      answer: "Il sourit comme on range un stylo. « Les tables se libèrent toujours. Je repasserai en juin. »"
    right:
      label: "Asseyez-vous"
      effects: {caisse: "+", direction: "-"}
      answer: "Il pose une enveloppe kraft sur ton sous-main, bien au milieu, et ne dit pas ce qu'il y a dedans. Derrière la porte, Josiane a cessé de taper."

  # ═══════════════════════════════ Vingt degrés dedans (2029) : l'oreillette rendue
  # L'Oreillette, fin `modele_silence` : la voix, les courbes et une ligne de code données à Léa.
  - id: co.fantome.h9_oreillette
    roles: [selectionneur]
    arc: presse
    tags: [presse]
    speaker: lea
    tone: strategique
    once: true
    priority: 1
    when: "flag('histoire_h9') && flag('fantome_h8_silence')"
    text: "À L'Écho, Léa ouvre un tiroir : une oreillette dans un sachet de congélation. « {fantome_h8} me l'a donnée, avec la voix. Elle parle encore quand on la branche. Vous voulez l'entendre ? »"
    left:
      label: "Rangez-la"
      effects: {direction: "+"}
      answer: "Léa referme le tiroir à clé. « Je ne l'écoute pas non plus. Je la garde pour le jour où quelqu'un dira qu'elle n'a jamais existé. »"
    right:
      label: "Branchez-la"
      effects: {tribunes: "-", relation: {lea: 1}}
      answer: "Un souffle, puis une voix calme : « On commence par les ventes ? » Léa débranche avant la suite. « Elle dit ça à tout le monde. Même aux sélectionneurs. »"
