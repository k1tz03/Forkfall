    left:  {label: "Encaisser", effects: {direction: "-", set: [monde_libre_1993]}, answer: "Les présidents relisent tous leurs contrats en une nuit. Les agents aussi, mais en riant."}
    right: {label: "Encaisser", effects: {direction: "-", set: [monde_libre_1993]}, answer: "Les présidents relisent tous leurs contrats en une nuit. Les agents aussi, mais en riant."}

