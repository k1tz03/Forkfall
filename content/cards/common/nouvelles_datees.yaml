    tags: [nouvelle, sponsors]
    speaker: nassir
    tone: leger
    once: true
    year: 2021
    text: "Le Cheikh Ilyas déplie un maillot sur le comptoir : « Quatre emplacements : poitrine, manche, dos, short. Le boucher de la place veut la manche. Nous gardons la poitrine. Le dos se négocie. »"
    left:  {label: "Je regarde la manche", effects: {caisse: "+", var: {sponsor: 2}}, answer: "Le maillot rapporte trois fois plus. Il devient illisible de la tribune Est."}
    right: {label: "Je regarde la manche", effects: {caisse: "+", var: {sponsor: 2}}, answer: "Le maillot rapporte trois fois plus. Il devient illisible de la tribune Est."}

  - id: co.nv.2022_josiane_retraite
