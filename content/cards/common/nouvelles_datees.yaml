    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: josiane
    tone: leger
    once: true
    year: 2035
    text: "Madame Josiane appelle de Chauderne : « On me dit que vous partagez le stade avec un autre club, un dimanche sur deux. Qui garde les clés du vestiaire ? Il faut un registre. Je peux le tenir. »"
    left:  {label: "Je lui dicte le planning", effects: {caisse: "+", set: [monde_stade_partage]}, answer: "La pelouse tient jusqu'en novembre. Après, elle ne tient plus pour personne."}
    right: {label: "Je lui dicte le planning", effects: {caisse: "+", set: [monde_stade_partage]}, answer: "La pelouse tient jusqu'en novembre. Après, elle ne tient plus pour personne."}

  - id: co.nv.2036_joueur_clone
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, absurde]
    speaker: lea
    tone: leger
    once: true
    year: 2036
    text: "Léa pose le doigt sur la Une de la Gazette : « Un club aurait aligné deux fois le même avant-centre en amical, sous deux numéros. C'est le vôtre. Je suis allée voir : des jumeaux. Ils le savaient. »"
    left:  {label: "Je cherche le démenti", effects: {tribunes: "+"}, answer: "Le démenti paraît quatre jours plus tard, en corps huit. Le mème, lui, dure six ans."}
    right: {label: "Je cherche le démenti", effects: {tribunes: "+"}, answer: "Le démenti paraît quatre jours plus tard, en corps huit. Le mème, lui, dure six ans."}

