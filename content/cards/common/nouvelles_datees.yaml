    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: gege
    tone: leger
    once: true
    year: 2032
    text: "Gégé, un badge trop grand sur l'écharpe : « Trois clubs rachetés par leurs abonnés, à cinquante écus la part. Pour le nôtre, j'ai déjà quatre cents promesses. Tu en prends une ? »"
    left:  {label: "Je prends une part", effects: {tribunes: "+", set: [monde_socios]}, answer: "Le conseil se réunit au local, le mardi, à dix-neuf heures. Il y a du café et des chaises pliantes."}
    right: {label: "Je prends une part", effects: {tribunes: "+", set: [monde_socios]}, answer: "Le conseil se réunit au local, le mardi, à dix-neuf heures. Il y a du café et des chaises pliantes."}

  - id: co.nv.2032_gazette_payante
