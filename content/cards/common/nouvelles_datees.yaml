    text: "Madame Aubert, communiqué à la main : « La buvette d'un club voisin a brûlé la veille d'une demi-finale : deux cents merguez, personne dedans. Le stade, c'est de l'argent public, le fil aussi. »"
    left:  {label: "Encaisser", effects: {caisse: "-", var: {tribune_alerte: 3}}, answer: "Le préfet écrit à tous les clubs. Ici, on regarde le plafond de la buvette pour la première fois depuis 1974."}
    right: {label: "Encaisser", effects: {caisse: "-", var: {tribune_alerte: 3}}, answer: "Le préfet écrit à tous les clubs. Ici, on regarde le plafond de la buvette pour la première fois depuis 1974."}

  - id: co.nv.1992_depot_bilan
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: josiane
    tone: leger
    once: true
    year: 1992
    text: "Josiane, le fax n'a pas fini de sortir : « Vaucastel a déposé le bilan ce matin, quatre-vingts ans de club dans une chemise cartonnée. J'en ai vu passer, jamais avec le trésorier qui pleure. »"
    left:  {label: "Se taire", effects: {caisse: "-", set: [monde_vaucastel]}, answer: "Ils repartiront du District. Ils remonteront en 2009 ; personne ne le sait encore."}
    right: {label: "Se taire", effects: {caisse: "-", set: [monde_vaucastel]}, answer: "Ils repartiront du District. Ils remonteront en 2009 ; personne ne le sait encore."}

  - id: co.nv.1993_continentale
