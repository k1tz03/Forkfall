    tags: [nouvelle, tribunes]
    speaker: gege
    tone: leger
    once: true
    year: 2031
    text: "Gégé pose son vieux casque de Radio Tribune sur la table : « Elle s'est arrêtée mardi à minuit, au milieu d'un appel. Un gars de Crevelaine parlait de son père. Je ne connais même pas son nom. »"
    left:  {label: "Je cherche l'auditeur", effects: {tribunes: "-"}, answer: "Gégé retrouve le gars de Crevelaine au bout d'un mois. Ils parlent une heure au téléphone, du père, de 1974, de rien."}
    right: {label: "Je cherche l'auditeur", effects: {tribunes: "-"}, answer: "Gégé retrouve le gars de Crevelaine au bout d'un mois. Ils parlent une heure au téléphone, du père, de 1974, de rien."}

