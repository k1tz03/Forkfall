    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: lea
    tone: leger
    once: true
    year: 2020
    text: "Léa projette une capture d'écran sur le mur de la rédaction : « Un compte sans nom, douze mille abonnés. Il sait ce qui se dit au local avant nous. Son pseudo finit par 1971. Ça ne vous dit rien ? »"
    left:  {label: "Je cherche qui c'est", effects: {tribunes: "-", set: [monde_compte_anonyme]}, answer: "On cherche pendant six mois. On trouve une écharpe de profil, jamais lavée, et on arrête de chercher."}
    right: {label: "Je cherche qui c'est", effects: {tribunes: "-", set: [monde_compte_anonyme]}, answer: "On cherche pendant six mois. On trouve une écharpe de profil, jamais lavée, et on arrête de chercher."}

  - id: co.nv.2021_quatre_sponsors
