    speaker: gege
    tone: leger
    once: true
    year: 2030
    text: "Gégé tient une ardoise réécrite trois fois : « Quinze écus la bière au stade, trois à la buvette des anciens. Les jeunes descendent boire chez nous et remontent à la mi-temps. Le club a remarqué. »"
    left:  {label: "Je reste en bas", effects: {tribunes: "-", var: {abonnement: 2}}, answer: "La buvette des anciens ne désemplit pas. Le club envisage de la fermer pour concurrence déloyale."}
    right: {label: "Je reste en bas", effects: {tribunes: "-", var: {abonnement: 2}}, answer: "La buvette des anciens ne désemplit pas. Le club envisage de la fermer pour concurrence déloyale."}

  - id: co.nv.2031_vecchio
