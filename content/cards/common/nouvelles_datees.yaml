    tags: [nouvelle, direction]
    speaker: legruet
    tone: leger
    once: true
    year: 1994
    text: "Berthomier lit au téléphone un communiqué qu'il n'a pas écrit : « Les Cobalts ne vont pas au Mondial. La commission technique conclura en septembre. D'ici là, personne n'est responsable. »"
    left:  {label: "Je raccroche", effects: {direction: "-", set: [monde_sans_mondial]}, answer: "La sélection joue un amical un mardi de juin, devant quatre mille personnes. Le seul international du club s'y tord la cheville."}
    right: {label: "Je raccroche", effects: {direction: "-", set: [monde_sans_mondial]}, answer: "La sélection joue un amical un mardi de juin, devant quatre mille personnes. Le seul international du club s'y tord la cheville."}

  - id: co.nv.1994_dimanche_soir
