    left:  {label: "Je compte les descentes", effects: {direction: "-", set: [monde_dix_huit]}, answer: "La réforme passe de neuf voix, dont celle de Vaubourg. Il est certain que {club} n'est pas dans les quatre."}
    right: {label: "Je compte les descentes", effects: {direction: "-", set: [monde_dix_huit]}, answer: "La réforme passe de neuf voix, dont celle de Vaubourg. Il est certain que {club} n'est pas dans les quatre."}

