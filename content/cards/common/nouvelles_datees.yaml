    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: aulard
    tone: leger
    once: true
    year: 1994
    text: "Vaubourg signe la grille de Télé-Stade sans la lire : « Dimanche, vingt heures trente, en direct. Ils paient double. La Tréfilerie embauche à six heures, le lundi ? Ils dormiront à l'usine. »"
    left:  {label: "Je regarde la grille", effects: {tribunes: "-", set: [monde_dimanche_soir]}, answer: "Les cars partent à seize heures et rentrent à deux. Le lundi, la Tréfilerie compte onze absents, tous en écharpe."}
    right: {label: "Je regarde la grille", effects: {tribunes: "-", set: [monde_dimanche_soir]}, answer: "Les cars partent à seize heures et rentrent à deux. Le lundi, la Tréfilerie compte onze absents, tous en écharpe."}

  - id: co.nv.1993_arret_vaneste
