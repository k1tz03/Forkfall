    once: true
    year: 2045
    text: "Léa, presse arrêtée, odeur d'encre : « L'Écho ne paraît plus que le dimanche matin, quatre pages, dernier journal papier du pays. On garde Au local en une et On nous écrit en dernière. »"
    left:  {label: "Prendre les quatre pages", effects: {tribunes: "+"}, answer: "Le tirage baisse d'un tiers. La boîte à prix libre se remplit deux fois plus."}
    right: {label: "Prendre les quatre pages", effects: {tribunes: "+"}, answer: "Le tirage baisse d'un tiers. La boîte à prix libre se remplit deux fois plus."}

  - id: co.nv.2046_mondial_64
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, famille]
    speaker: camille
    tone: leger
    once: true
    year: 2046
    text: "Camille, carnet et badge d'observatrice : « Le Mondial commence aujourd'hui : soixante-quatre pays, onze stades neufs dans trois pays. Tu rentres à quelle heure ? La finale est dans six semaines. »"
    left:  {label: "Noter la date", effects: {vestiaire: "+", set: [monde_mondial_64]}, answer: "Trois des onze stades n'auront plus d'usage en septembre. On le sait avant le coup d'envoi."}
    right: {label: "Noter la date", effects: {vestiaire: "+", set: [monde_mondial_64]}, answer: "Trois des onze stades n'auront plus d'usage en septembre. On le sait avant le coup d'envoi."}

  - id: co.nv.2047_sans_guichet
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: josiane
    tone: leger
    once: true
    year: 2047
    text: "Josiane fait tourner la clé d'un local qui ne sert plus : « On a fermé le dernier guichet du stade : tout se prend sur l'application. J'en ai vu passer ; celui-là, je l'ai tenu douze ans en août. »"
    left:  {label: "Garder la clé", effects: {tribunes: "-"}, answer: "Le guichet devient l'endroit où l'on range les bâches. C'est bien pour les bâches."}
    right: {label: "Garder la clé", effects: {tribunes: "-"}, answer: "Le guichet devient l'endroit où l'on range les bâches. C'est bien pour les bâches."}

  - id: co.nv.2048_derniere_buvette
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: gege
    tone: leger
    once: true
    year: 2048
    text: "Gégé, devant une plaque neuve : « La buvette a été refaite, deux tireuses et la boîte en fer d'origine sous verre. On payait en bières ; c'est écrit sur la plaque, avec la date et une faute. »"
    left:  {label: "Lire la plaque", effects: {tribunes: "+", set: [monde_buvette_refaite]}, answer: "La faute est sur le mot « bénévole ». On ne la corrige pas ; on la montre."}
    right: {label: "Lire la plaque", effects: {tribunes: "+", set: [monde_buvette_refaite]}, answer: "La faute est sur le mot « bénévole ». On ne la corrige pas ; on la montre."}

  - id: co.nv.2049_district_renait
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: aubert
    tone: leger
    once: true
    year: 2049
    text: "Madame Aubert, registre neuf, écriture tremblée : « Il y a plus de clubs dans le district qu'en mille neuf cent quatre-vingt-dix, et aucun n'a de budget. La base a repris toute la place. »"
    left:  {label: "Signer le registre", effects: {tribunes: "+", set: [monde_district_plein]}, answer: "Quarante-deux clubs, dont onze créés depuis 2040. Neuf ont repris le nom d'un club mort."}
    right: {label: "Signer le registre", effects: {tribunes: "+", set: [monde_district_plein]}, answer: "Quarante-deux clubs, dont onze créés depuis 2040. Neuf ont repris le nom d'un club mort."}

  - id: co.nv.2050_bilan_siecle
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: josiane
    tone: leger
    once: true
    year: 2050
    text: "Josiane, un seul feuillet imprimé : « La Fédération a publié le bilan du demi-siècle : soixante ans, quatre monnaies, deux formats, un journal survivant. J'en ai vu passer ; ça tient sur une page. »"
    left:  {label: "Lire la page", effects: {direction: "-", set: [monde_fin]}, answer: "Le tableau tient sur une page. On y lit tout, sauf ce que ça faisait d'y être."}
    right: {label: "Lire la page", effects: {direction: "-", set: [monde_fin]}, answer: "Le tableau tient sur une page. On y lit tout, sauf ce que ça faisait d'y être."}

  - id: co.nv.2050_dernier_dimanche
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, moment]
    speaker: lea
    tone: leger
    once: true
    year: 2050
    text: "Léa, dernière page composée à la main : « Le journal fête ses cent quarante-huit ans dimanche, et le stade joue à quinze heures comme en 1902. Au local, on a ressorti les photos. »"
    left:  {label: "Regarder la photo", effects: {tribunes: "+"}, answer: "On identifie deux visages sur la photo. On invente les autres, et on les note au dos."}
    right: {label: "Regarder la photo", effects: {tribunes: "+"}, answer: "On identifie deux visages sur la photo. On invente les autres, et on les note au dos."}
