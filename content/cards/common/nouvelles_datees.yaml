    left:  {label: "Lever son verre", effects: {tribunes: "+", set: [monde_continentale_1993]}, answer: "Trois ans plus tard, un inspecteur compte les factures de la fête. Il en trouve une de mille sept cents couverts."}
    right: {label: "Lever son verre", effects: {tribunes: "+", set: [monde_continentale_1993]}, answer: "Trois ans plus tard, un inspecteur compte les factures de la fête. Il en trouve une de mille sept cents couverts."}

  - id: co.nv.1993_bons_essence
