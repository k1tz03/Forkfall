    left:  {label: "J'appelle le président", effects: {caisse: "-", var: {cousin: 3}}, answer: "Il a encaissé quatre avances, dont celle du club, et pris le car de nuit à la gare routière. Personne ne l'a jamais vu jouer."}
    right: {label: "J'appelle le président", effects: {caisse: "-", var: {cousin: 3}}, answer: "Il a encaissé quatre avances, dont celle du club, et pris le car de nuit à la gare routière. Personne ne l'a jamais vu jouer."}

  - id: co.nv.1997_droits_doublent
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: josiane
    tone: leger
    once: true
    year: 1997
    text: "Madame Josiane, entre deux piles de courrier : « Les droits ont encore doublé. La part des petits clubs a baissé de trois lignes dans le tableau de la Ligue. J'ai surligné la nôtre en jaune. »"
    left:  {label: "Je lis la ligne jaune", effects: {caisse: "+", set: [monde_droits_1997], var: {sponsor: 2}}, answer: "La part du club augmente en francs et baisse en pourcentage. Les deux sont vrais ; Vaubourg n'annonce que le premier."}
    right: {label: "Je lis la ligne jaune", effects: {caisse: "+", set: [monde_droits_1997], var: {sponsor: 2}}, answer: "La part du club augmente en francs et baisse en pourcentage. Les deux sont vrais ; Vaubourg n'annonce que le premier."}

