    tags: [nouvelle, moment]
    speaker: meneche
    tone: leger
    once: true
    year: 2031
    text: "Massenet, sa montre arrêtée au poignet : « Une minute de silence pour Gigi Vecchio. Le stade en a tenu deux ; l'arbitre a ajouté la deuxième. Je n'ai rien écrit. Je n'ai pas trouvé. »"
    left:  {label: "Je compte jusqu'à deux", effects: {vestiaire: "-", set: [monde_vecchio_mort]}, answer: "Les gants jaunes sont accrochés au-dessus du couloir. Personne ne les décroche, jamais."}
    right: {label: "Je compte jusqu'à deux", effects: {vestiaire: "-", set: [monde_vecchio_mort]}, answer: "Les gants jaunes sont accrochés au-dessus du couloir. Personne ne les décroche, jamais."}

  - id: co.nv.2031_radio_ferme
    roles: [entraineur, joueur]
