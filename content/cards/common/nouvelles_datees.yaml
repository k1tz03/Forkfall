# Nouvelles datées du postulat « Le promu sans un sou » (saison 2) : cartes
# `arc: nouvelle` servies aux slots réservés, un seul bouton (effets
# identiques des deux côtés), chacune une fois par carrière. Plus la routine
# de Massenet qui ressort le dossier de la voiture du président.
#
# ── `year:` — les Nouvelles datées (spec variété §1.5) ───────────────────────
# Une Nouvelle qui dit l'époque (la télé, l'arrêt Vaneste, les écus, le Flux)
# porte l'année où elle se passe :
#
#   - id: co.nv.1995_arret_vaneste
#     roles: [entraineur, joueur]
#     arc: nouvelle          # obligatoire (ou kind: nouvelle)
#     once: true             # obligatoire : elle ne dit son année qu'une fois
#     year: 1995             # servable pendant les saisons 1994 et 1995
#
# Le metteur en scène sert **en priorité** une Nouvelle datée de la saison en
# cours, `year ∈ [{annee}, {annee} + 1]` : une saison commence en août et finit
# en juin, elle couvre donc deux années civiles, et l'événement du printemps
# arrive dans la saison ouverte l'été d'avant. Tant qu'il reste une datée
# éligible et non vue, aucune Nouvelle intemporelle n'est tirée (un seul
# `weightedIndex`, comme avant).
# Passée son année, elle n'est plus jamais servie : elle est **perdue**, et
# `simulate --narrative` compte les perdues par carrière
# (`stats.nouvelle_datee_perdue`).
#
# ── Le budget a changé (lot « anecdotes d'époque ») ──────────────────────────
# Il disait ici « ≈ une datée par demi-saison suffit ; au-delà, la chronologie
# mange les créneaux de respiration ». Le retour joueur l'a démenti : « les
# anecdotes liées au foot dans son histoire générale, je ne les ai jamais
# retrouvées ». À une datée par an, une saison n'en croisait qu'une ou deux, et
# deux carrières de la même décennie lisaient exactement la même chronologie.
# La banque est désormais **plus profonde que les quatre créneaux réservés** :
# deux à trois cartes par année vécue, dont celles de
# `content/cards/common/epoque_*.yaml` (cinquante cartes sur l'histoire réelle
# du SPORT — les règles, l'argent de la télévision, les stades, l'équipement,
# la médecine, les mœurs, la technologie — sans jamais un nom réel).
# Ce que `simulate --narrative` mesure maintenant : **≥ 2 cartes d'époque
# servies par saison**, une dans ≥ 80 % des premières saisons et dans les douze
# premiers créneaux, et ≥ 95 % des datées à portée vues au moins une fois sur
# l'ensemble des carrières. Les « laissées » ne sont plus un plafond : ce sont
# les cartes que CETTE carrière n'a pas tirées, et que la suivante tirera.
# Une datée peut armer une intrigue (`set: [monde_video]` lu par le `if` d'une
# entrée de réservoir) : c'est ainsi que l'époque change les histoires.
cards:
  # Descente : la clause de départ du petit Mbako joue d'office.
  - id: co.nouvelle.mbako_parti
    roles: [entraineur]
    arc: nouvelle
    tags: [nouvelle, mercato]
    speaker: meneche
    tone: leger
    once: true
    when: "flag('descente') && !flag('mbako_vendu')"
    text: "Massenet, le carnet ouvert sur le capot de ta voiture : « Le petit Mbako a signé chez un grand ce matin. Une clause de descente, deux lignes, page trois. Vous l'aviez lue ? Moi, je l'ai depuis mars. »"
    # Vendu hors de l'arc B : ses étapes en attente (salaire de star, offre,
    # Fardelli) n'ont plus de sens, l'arc est fermé ; `!flag('mbako_vendu')`
    # garantit que la branche « marque contre toi » n'est pas concernée.
    left:
      label: "Je relis la clause"
      effects: {tribunes: "-", set: [mbako_vendu], arc: [{id: en.prodige, status: abandonne}]}
      answer: "Sa mère l'a lue avant tout le monde. C'est elle qui l'a écrite."
    right:
      label: "Je relis la clause"
      effects: {tribunes: "-", set: [mbako_vendu], arc: [{id: en.prodige, status: abandonne}]}
      answer: "Sa mère l'a lue avant tout le monde. C'est elle qui l'a écrite."

  # Naming signé : la tribune découvre le panneau à la reprise.
  # L'identifiant portait le nom du fonds sur une racine géographique
  # transparente : renommé sur le nom du panneau, qui est le seul mot servi.
  - id: co.nouvelle.arena_almadis
    roles: [entraineur]
    arc: nouvelle
    tags: [nouvelle, ultras, sponsors]
    speaker: gege
    tone: leger
    once: true
    when: "flag('naming_signe') && season == 1"
    text: "Gégé, devant le panneau neuf : « Arena Almadis. En orange, quatre mètres de haut. Le nom du stade en dessous, en petit, comme une note de bas de page. Tu le savais depuis quand, {toi} ? »"
    left:
      label: "Je regarde ailleurs"
      effects: {tribunes: "-"}
      answer: "Le virage chante l'ancien nom. Le panneau ne répond pas."
    right:
      label: "Je regarde ailleurs"
      effects: {tribunes: "-"}
      answer: "Le virage chante l'ancien nom. Le panneau ne répond pas."

  # Routine du sac : Massenet ressort la voiture du président.
  - id: en.presse.dossier_voiture
    roles: [entraineur]
    arc: presse
    tags: [presse, scandale]
    speaker: meneche
    tone: leger
    once: true
    when: "seen('en.evt.voiture')"
    text: "Massenet garde la main sur un dossier fermé : « La voiture du président. J'ai la station où l'essence a été achetée, et l'heure. Je publie lundi. Sauf si vous avez mieux à me donner. »"
    left:
      label: "Je vous donne autre chose"
      effects: {relation: {meneche: 1}, direction: "-"}
      answer: "Tu lui donnes la compo de samedi, deux jours avant tout le monde. Il range le dossier de la voiture au-dessus des autres."
    right:
      label: "Publiez lundi"
      effects: {tribunes: "+", direction: "--", relation: {meneche: -1}}
      answer: "Titre du lundi : « L'incendiaire ». Le vestiaire découpe l'article et le colle sur la porte du bureau du président."

  # ==========================================================================
  # La chronologie du monde, 1990 → 2050 (bible ch. 20 § 3, quatre-vingt-sept
  # Nouvelles datées ; la quatre-vingt-septième est `co.nouvelle.arbitrage_video`
  # de co_nouvelles.yaml, datée 2016 sur place comme le demande le § 3.3).
  #
  # Une Nouvelle datée ne se joue pas : elle se constate. Elle dit l'époque par
  # ses mœurs et elle **arme** quelque chose — un drapeau de monde
  # (`set: [monde_…]`, lu par les manchettes de content/unes/monde.yaml) ou une
  # variable qui double le poids d'une entrée de réservoir (`var: {x: 2}`, lue
  # par `poids_if` des chapitres 10 à 15). Les libellés restent à l'infinitif
  # (« Encaisser », « Prendre acte », « Soupirer ») : ce sont des constats, pas
  # des choix — seule exception à la règle de la première personne
  # (charte § 6.1 n° 4), déjà en vigueur dans les cartes existantes.
  #
  # Les deux sorties portent des effets identiques (un seul bouton au rendu),
  # l'effet est petit, `once: true` toujours, `roles` = les deux rôles jouables.
  # Locuteurs : la bible nomme des voix que content/characters.yaml ne connaît
  # pas encore (Vialat, Dauzat, Roux, Gérard, Dédé, Solvang, la petite Josiane,
  # le stagiaire de l'Écho…) ; chaque réplique a été rendue à la voix la plus
  # proche du casting compilé, tic compris, sans changer ce qui est dit.
  #
  # Passe « fait reconnaissable » (règle du dépôt : jamais de nom réel NI de
  # fait reconnaissable ; relecture des quatre postulats, défaut mineur sur
  # l'Almanach). Aucun nom réel n'apparaît ici — les acteurs sont les Cobalts,
  # Télé-Stade, l'arrêt Vaneste — mais cinq Nouvelles paraphrasaient un fait
  # daté qu'on reconnaissait à l'année ou au détail. Le curseur a bougé de la
  # plus petite quantité qui coupe la reconnaissance sans perdre l'époque :
  # · `co.nv.1990_tirs_au_but` : « a tiré le cinquième » → « a tiré le
  #   dernier » (le rang du tir datait la soirée ; le silence du bar, non).
  # · `co.nv.1991_tele_stade` : année 1991 → 1992 (une chaîne achète le club
  #   de la capitale ; c'est l'année qui faisait le fait, pas la chaîne).
  # · `co.nv.1996_grand_stade` : « quatre-vingts mille places » → « soixante-
  #   douze mille » (la jauge exacte était la signature du stade).
  # · `co.nv.2002_cobalts` : année 1998 → 1999 (l'id et le drapeau
  #   `monde_titre_2002` gardent la trace du décalage d'écriture d'origine).
  # · `co.nv.2011_fonds_capitale` : année 2011 → 2013, et « un fonds du
  #   désert » → « un fonds venu de très loin » (la géographie datait autant
  #   que l'année).
  # Le reste de l'Almanach est laissé tel quel : `co.nv.1993_arret_vaneste`
  # est déjà décalé de deux ans et renommé, et le principe de l'Almanach
  # (bible ch. 31) est justement de faire vivre l'époque — un almanach qui ne
  # ressemblerait à rien ne raconterait rien.
  # ==========================================================================
  - id: co.nv.1990_droits_tele
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: josiane
    tone: leger
    once: true
    year: 1990
    text: "Madame Josiane plie le Quotidien sur le radiateur : « Les droits de télévision ont triplé cette nuit. Je prépare la lettre à la Ligue pour réclamer notre part ? Elle doit partir avant le 15. »"
    left:  {label: "Je poste la lettre", effects: {caisse: "+", set: [monde_droits_1990], var: {sponsor: 2}}, answer: "La réponse de la Ligue met deux saisons à venir. Le chèque refait le toit du parking, et rien d'autre."}
    right: {label: "Je poste la lettre", effects: {caisse: "+", set: [monde_droits_1990], var: {sponsor: 2}}, answer: "La réponse de la Ligue met deux saisons à venir. Le chèque refait le toit du parking, et rien d'autre."}

  - id: co.nv.1990_tirs_au_but
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, moment]
    speaker: meneche
    tone: leger
    once: true
    year: 1990
    text: "Massenet, au bar d'en face, la télé sans le son : « Le capitaine des Cobalts a tiré le dernier. Tout le bar s'est assis d'un coup. Je note où chacun était ce soir. Vous, c'était où ? »"
    left:  {label: "Je reste assis", effects: {tribunes: "+", set: [monde_cobalts_1990]}, answer: "Tout le monde se souvient d'où il était. Personne ne se souvient du gardien d'en face."}
    right: {label: "Je reste assis", effects: {tribunes: "+", set: [monde_cobalts_1990]}, answer: "Tout le monde se souvient d'où il était. Personne ne se souvient du gardien d'en face."}

  - id: co.nv.1991_tele_stade
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: aulard
    tone: leger
    once: true
    year: 1992
    text: "Vaubourg repose le combiné sans avoir parlé : « Une chaîne a acheté le club de la capitale, stade et joueurs compris. Bientôt, une antenne fixera l'heure de nos matchs. Et le prix de mon club. »"
    left:  {label: "Je lui sers un verre", effects: {direction: "-", set: [monde_tele_stade]}, answer: "Le dimanche soir devient une case de grille. Personne n'a demandé au dimanche."}
    right: {label: "Je lui sers un verre", effects: {direction: "-", set: [monde_tele_stade]}, answer: "Le dimanche soir devient une case de grille. Personne n'a demandé au dimanche."}

  - id: co.nv.1991_controle
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: sabatier
    tone: leger
    once: true
    year: 1991
    text: "Le Doc ferme la mallette d'un coup sec, lunettes sur le front : « Deux inspecteurs, sans prévenir, à sept heures. Repartis avec des flacons numérotés. Les résultats, dans six semaines. »"
    left:  {label: "Je regarde la mallette", effects: {vestiaire: "-", var: {pharmacie: 2}}, answer: "La mallette change de placard. Le placard change de clé."}
    right: {label: "Je regarde la mallette", effects: {vestiaire: "-", var: {pharmacie: 2}}, answer: "La mallette change de placard. Le placard change de clé."}

  - id: co.nv.1992_buvette_portclair
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: aubert
    tone: leger
    once: true
    year: 1992
    text: "Madame Aubert pose une coupure de journal sur le comptoir : « À Portclair, la buvette a brûlé la veille d'une demi-finale. Personne dedans, deux cents merguez. La vôtre date de quand ? »"
    left:  {label: "Je lève les yeux au plafond", effects: {caisse: "-", var: {tribune_alerte: 3}}, answer: "Le préfet écrit à tous les clubs. Ici, on regarde le plafond de la buvette pour la première fois depuis 1974."}
    right: {label: "Je lève les yeux au plafond", effects: {caisse: "-", var: {tribune_alerte: 3}}, answer: "Le préfet écrit à tous les clubs. Ici, on regarde le plafond de la buvette pour la première fois depuis 1974."}

  - id: co.nv.1992_depot_bilan
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: josiane
    tone: leger
    once: true
    year: 1992
    text: "Madame Josiane, le fax encore dans la machine : « Vaucastel a déposé le bilan ce matin, après quatre-vingts ans. Leur trésorier m'a appelée en pleurant. Il voulait savoir comment nous, on tient. »"
    left:  {label: "Je lis le fax", effects: {caisse: "-", set: [monde_vaucastel]}, answer: "Le soir, Madame Josiane laisse le relevé du club ouvert sur le bureau, à la page du découvert. Elle n'en parle pas."}
    right: {label: "Je lis le fax", effects: {caisse: "-", set: [monde_vaucastel]}, answer: "Le soir, Madame Josiane laisse le relevé du club ouvert sur le bureau, à la page du découvert. Elle n'en parle pas."}

  - id: co.nv.1993_continentale
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: gege
    tone: leger
    once: true
    year: 1993
    text: "Gégé, une écharpe blanc et bleu ciel au cou : « Marsange a gagné la Coupe Continentale avec un budget de deuxième division. Le port chante depuis dimanche. Nous, on y descend en car samedi. »"
    left:  {label: "Je lève mon verre", effects: {tribunes: "+", set: [monde_continentale_1993]}, answer: "Trois ans plus tard, un inspecteur compte les factures de la fête. Il en trouve une de mille sept cents couverts."}
    right: {label: "Je lève mon verre", effects: {tribunes: "+", set: [monde_continentale_1993]}, answer: "Trois ans plus tard, un inspecteur compte les factures de la fête. Il en trouve une de mille sept cents couverts."}

  - id: co.nv.1993_bons_essence
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: meneche
    tone: leger
    once: true
    year: 1993
    text: "Massenet ouvre son carnet : « Un club de D2 payait son gardien en bons d'essence et en jambons, trois saisons. La Fédération examine. Et votre trésorier, il paie comment, les primes ? »"
    left:  {label: "Je ne réponds pas", effects: {direction: "-", var: {enveloppe: 2}}, answer: "Le gardien, lui, a fait quatre-vingt mille kilomètres. Il les a tous faits pour venir s'entraîner."}
    right: {label: "Je ne réponds pas", effects: {direction: "-", var: {enveloppe: 2}}, answer: "Le gardien, lui, a fait quatre-vingt mille kilomètres. Il les a tous faits pour venir s'entraîner."}

  - id: co.nv.1998_sans_mondial
