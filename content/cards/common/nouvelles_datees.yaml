    text: "Léa tient l'épreuve encore humide de la Une : « Je dirige le Quotidien depuis ce matin. Demain, la Une finit par un point d'interrogation, une première en soixante-douze ans. Elle parle de vous. »"
    left:  {label: "Je lis l'épreuve", effects: {direction: "-", set: [monde_lea_redac]}, answer: "Quatre présidents appellent avant la parution. Trois pour la féliciter ; le quatrième est le tien."}
    right: {label: "Je lis l'épreuve", effects: {direction: "-", set: [monde_lea_redac]}, answer: "Quatre présidents appellent avant la parution. Trois pour la féliciter ; le quatrième est le tien."}

  - id: co.nv.2019_ligue_fermee
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: aulard
    tone: leger
    once: true
    year: 2019
    text: "Le téléphone sonne à trois heures du matin. Vaubourg : « Quatorze clubs ont annoncé leur ligue fermée, et l'ont retirée le surlendemain. Ils ne m'ont pas appelé. Mon club aurait dû en être. »"
    left:  {label: "Je le laisse parler", effects: {tribunes: "-", set: [monde_ligue_fermee]}, answer: "Les bâches sortent en deux heures dans quarante stades. Elles restent pliées sous les bars vingt ans."}
    right: {label: "Je le laisse parler", effects: {tribunes: "-", set: [monde_ligue_fermee]}, answer: "Les bâches sortent en deux heures dans quarante stades. Elles restent pliées sous les bars vingt ans."}

  - id: co.nv.2019_prix_du_billet
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: gege
    tone: leger
    once: true
    year: 2019
    text: "Gégé étale trois talons de billets sur le comptoir : « 2013, 2016, 2019. Le billet du virage a doublé, la Nord a vieilli de huit ans. Les gamins regardent sur leur téléphone, devant la grille. »"
    left:  {label: "Je compte les talons", effects: {tribunes: "-", var: {abonnement: 2}}, answer: "Le club crée un tarif jeune en février. Il est plafonné à deux cents places."}
    right: {label: "Je compte les talons", effects: {tribunes: "-", var: {abonnement: 2}}, answer: "Le club crée un tarif jeune en février. Il est plafonné à deux cents places."}

  - id: co.nv.2020_compte_anonyme
