    speaker: meneche
    tone: leger
    once: true
    year: 1993
    text: "Massenet, carnet ouvert et stylo capuchonné : « Un club de D2 payait son gardien en bons d'essence et en jambons, sur trois saisons. Juste une question, hors micro : la Fédération examine quoi ? »"
    left:  {label: "Encaisser", effects: {direction: "-", var: {enveloppe: 2}}, answer: "Le gardien, lui, a fait quatre-vingt mille kilomètres. Il les a tous faits pour venir s'entraîner."}
    right: {label: "Encaisser", effects: {direction: "-", var: {enveloppe: 2}}, answer: "Le gardien, lui, a fait quatre-vingt mille kilomètres. Il les a tous faits pour venir s'entraîner."}

