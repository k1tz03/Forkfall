    left:  {label: "Je prends la carte", effects: {force: 1, set: [monde_quotas]}, answer: "Les trois garçons de Dalmarie arrivent en car un lundi d'août. Le même jour, au centre, trois gamins vident leur casier."}
    right: {label: "Je prends la carte", effects: {force: 1, set: [monde_quotas]}, answer: "Les trois garçons de Dalmarie arrivent en car un lundi d'août. Le même jour, au centre, trois gamins vident leur casier."}

  - id: co.nv.1996_dix_huit
