    left:  {label: "Prendre acte", effects: {direction: "-", set: [monde_sans_mondial]}, answer: "La sélection joue un amical un mardi de juin. Il y a quatre mille personnes et deux caméras."}
    right: {label: "Prendre acte", effects: {direction: "-", set: [monde_sans_mondial]}, answer: "La sélection joue un amical un mardi de juin. Il y a quatre mille personnes et deux caméras."}

