    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: josiane
    tone: leger
    once: true
    year: 2022
    text: "Madame Josiane pose deux stylos sur un carton d'archives : « Je m'arrête. Trente-cinq ans, quatre présidents, une machine à café gagnée en 1994. Ma nièce commence lundi. Vos dossiers sont en haut. »"
    left:  {label: "Je porte le carton", effects: {direction: "-", set: [monde_josiane_retraite]}, answer: "Elle laisse les dossiers rangés par année. Le lundi suivant, à neuf heures, elle téléphone pour savoir si le fax est arrivé."}
    right: {label: "Je porte le carton", effects: {direction: "-", set: [monde_josiane_retraite]}, answer: "Elle laisse les dossiers rangés par année. Le lundi suivant, à neuf heures, elle téléphone pour savoir si le fax est arrivé."}

  - id: co.nv.2023_calendrier_plein
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: brehaut
    tone: leger
    once: true
    year: 2023
    text: "Bréhaut, un calendrier annoté au feutre : « Soixante-douze matchs pour un international cette saison, sans les avions. Nos deux dormiront chez eux quarante nuits. Les gars prononcent le mot grève. »"
    left:  {label: "Je compte les avions", effects: {vestiaire: "-", var: {greve: 2}}, answer: "Le syndicat demande une réunion. On la fixe en juin, pendant le tournoi."}
    right: {label: "Je compte les avions", effects: {vestiaire: "-", var: {greve: 2}}, answer: "Le syndicat demande une réunion. On la fixe en juin, pendant le tournoi."}

  - id: co.nv.2024_kick
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: meneche
    tone: leger
    once: true
    year: 2024
    text: "Massenet regarde l'écran, pas toi : « Kick diffuse tout, avec les commentaires qui défilent sur le terrain. Pendant votre penalty, c'était écrit « rate-le » quatre mille fois. Le tireur l'a lu. »"
    left:  {label: "Je coupe le fil", effects: {tribunes: "-", set: [monde_kick]}, answer: "On peut couper le fil de commentaires. Onze pour cent des gens le coupent."}
    right: {label: "Je coupe le fil", effects: {tribunes: "-", set: [monde_kick]}, answer: "On peut couper le fil de commentaires. Onze pour cent des gens le coupent."}

  - id: co.nv.2024_billet_sans_papier
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: josiane
    tone: leger
    once: true
    year: 2024
    text: "Madame Josiane, retraitée, revient avec son vieux tampon : « Plus de carnet : un code sur le téléphone, qui change à chaque match. Quatre cents abonnés ont plus de soixante-dix ans. J'ai la liste. »"
    left:  {label: "J'imprime des carnets", effects: {tribunes: "-", var: {abonnement: 2}}, answer: "Le club imprime quatre cents carnets pour les anciens. Ils partent en trois jours ; Madame Josiane tamponne chaque page."}
    right: {label: "J'imprime des carnets", effects: {tribunes: "-", var: {abonnement: 2}}, answer: "Le club imprime quatre cents carnets pour les anciens. Ils partent en trois jours ; Madame Josiane tamponne chaque page."}

  - id: co.nv.2025_memoires_meneche
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: meneche
    tone: leger
    once: true
    year: 2025
    text: "Massenet pousse vers toi un livre épais, un marque-page au chapitre onze : « Six cents pages, trente-cinq ans. J'ai gardé deux histoires pour moi. Le chapitre onze en raconte une à moitié. La vôtre. »"
    left:  {label: "J'ouvre au chapitre onze", effects: {direction: "-", set: [monde_memoires]}, answer: "Le livre se vend quarante mille exemplaires. Le chapitre onze fait quatre pages et ne nomme personne."}
    right: {label: "J'ouvre au chapitre onze", effects: {direction: "-", set: [monde_memoires]}, answer: "Le livre se vend quarante mille exemplaires. Le chapitre onze fait quatre pages et ne nomme personne."}

  - id: co.nv.2026_greve
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: brehaut
    tone: leger
    once: true
    year: 2026
    text: "Sur le parking du stade, Bréhaut lit le communiqué aux gars : « Trente et un pays, deux journées sans match. Personne n'a prévenu les clubs, c'est voulu. Nous, en 1989, on n'aurait pas osé. »"
    left:  {label: "Je reste avec les gars", effects: {vestiaire: "+", caisse: "-", set: [monde_greve]}, answer: "Deux journées sans football. Les buvettes ouvrent quand même, par habitude."}
    right: {label: "Je reste avec les gars", effects: {vestiaire: "+", caisse: "-", set: [monde_greve]}, answer: "Deux journées sans football. Les buvettes ouvrent quand même, par habitude."}

  - id: co.nv.2026_mondial_amateurs
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, moment]
    speaker: clow
    tone: leger
    once: true
    year: 2026
    text: "Corven, au téléphone, la voix toute mince : « Tu as vu le tournoi des villages ? C'était plein. Mon plus beau match, c'était un match de village, en 58. C'était mieux. Ça ne durera pas. »"
    left:  {label: "Je regarde jusqu'au bout", effects: {tribunes: "+", set: [monde_mondial_amateurs]}, answer: "Un gardien de district passe à la télévision nationale un mardi soir. Il travaille le mercredi."}
    right: {label: "Je regarde jusqu'au bout", effects: {tribunes: "+", set: [monde_mondial_amateurs]}, answer: "Un gardien de district passe à la télévision nationale un mardi soir. Il travaille le mercredi."}

  - id: co.nv.2027_arbitre_machine
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: meneche
    tone: leger
    once: true
    year: 2027
    text: "Massenet fait rouler un sifflet sur la table : « Une machine décide seule des hors-jeu, en huit centièmes. Votre stade est dans le test dès novembre. J'ai interviewé l'arbitre : il s'ennuie. »"
    left:  {label: "Je regarde le sifflet", effects: {tribunes: "-", set: [monde_arbitre_machine]}, answer: "La main de l'arbitre reste en l'air un dimanche de novembre. Personne ne la regrette à voix haute."}
    right: {label: "Je regarde le sifflet", effects: {tribunes: "-", set: [monde_arbitre_machine]}, answer: "La main de l'arbitre reste en l'air un dimanche de novembre. Personne ne la regrette à voix haute."}

  - id: co.nv.2028_milliard
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, mercato]
    speaker: fardelli
    tone: leger
    once: true
    year: 2028
    text: "Fardelli, retraité, fait glisser une serviette où il a écrit un chiffre à neuf zéros : « Pour un seul joueur. Je ne dis pas le nom de l'agent. C'est un ami. Il m'a appelé pour me remercier. »"
    left:  {label: "Je relis la serviette", effects: {caisse: "-", set: [monde_milliard]}, answer: "Le club vendeur construit un centre de formation et une piscine. Il redescend quatre ans plus tard."}
    right: {label: "Je relis la serviette", effects: {caisse: "-", set: [monde_milliard]}, answer: "Le club vendeur construit un centre de formation et une piscine. Il redescend quatre ans plus tard."}

  - id: co.nv.2028_limite_age
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: legruet
    tone: leger
    once: true
    year: 2028
    text: "Berthomier, très lentement, le doigt sur le règlement : « Le Congrès a voté une limite d'âge, soixante-quinze ans, au prochain mandat. Lisez la page 41. L'exception, je l'ai écrite en 1994. »"
    left:  {label: "Je lis la page 41", effects: {direction: "-", set: [monde_limite_age]}, answer: "Quatre dirigeants fêtent leurs soixante-quinze ans la même année. Trois trouvent la page."}
    right: {label: "Je lis la page 41", effects: {direction: "-", set: [monde_limite_age]}, answer: "Quatre dirigeants fêtent leurs soixante-quinze ans la même année. Trois trouvent la page."}

  - id: co.nv.2020_legruet_mort
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: aubert
    tone: leger
    once: true
    year: 2029
    text: "Madame Aubert, chapeau à la main, reste sur le parvis : « Trois cents districts derrière le corbillard de Noé Berthomier. Quarante ans qu'on se croisait. Il n'a jamais retenu mon prénom. »"
    left:  {label: "Je reste sur le parvis", effects: {direction: "-", set: [monde_legruet_mort]}, answer: "La Fédération met un drapeau en berne trois jours. Le quatrième, on discute de la succession."}
    right: {label: "Je reste sur le parvis", effects: {direction: "-", set: [monde_legruet_mort]}, answer: "La Fédération met un drapeau en berne trois jours. Le quatrième, on discute de la succession."}

  - id: co.nv.2030_mondial_hiver
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: sabatier
    tone: leger
    once: true
    year: 2030
    text: "Le Doc, retraité, regarde les genoux depuis la tribune : « Mondial en décembre, en plein championnat. Nos deux internationaux rentrent un lundi, jouent le mercredi. Je donne leurs genoux à mars. »"
    left:  {label: "Je note les deux noms", effects: {vestiaire: "-", set: [monde_mondial_hiver]}, answer: "En février, l'un des deux se rompt les ligaments croisés. En tribune, le Doc ne dit rien ; il avait dit mars."}
    right: {label: "Je note les deux noms", effects: {vestiaire: "-", set: [monde_mondial_hiver]}, answer: "En février, l'un des deux se rompt les ligaments croisés. En tribune, le Doc ne dit rien ; il avait dit mars."}

