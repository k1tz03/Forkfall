    right: {label: "Je regarde la maquette", effects: {tribunes: "-", var: {tribune_alerte: 2}}, answer: "On visite le Grand Stade en autocar. Au retour, personne ne regarde plus les poutres de la tribune Nord de la même façon."}

  - id: co.nv.2002_cobalts
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: gege
    tone: leger
    once: true
