    tags: [nouvelle, mercato]
    speaker: fardelli
    tone: leger
    once: true
    year: 1993
    text: "Fardelli agite l'arrêt Vaneste comme un billet gagnant : « En fin de contrat, un joueur part où il veut, gratuitement. Les meilleurs du club finissent en juin, non ? Des amis y ont pensé avant toi. »"
    left:  {label: "Je relis mon contrat", effects: {direction: "-", set: [monde_libre_1993]}, answer: "Vaubourg relit tous les contrats du club en une nuit. Le tien est sur le dessus, la date de fin entourée au feutre."}
    right: {label: "Je relis mon contrat", effects: {direction: "-", set: [monde_libre_1993]}, answer: "Vaubourg relit tous les contrats du club en une nuit. Le tien est sur le dessus, la date de fin entourée au feutre."}

