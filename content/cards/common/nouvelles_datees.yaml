    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, absurde]
    speaker: vukic
    tone: leger
    once: true
    year: 2037
    text: "Vukić, au bar du port, un verre d'eau devant lui : « Tissemont a joué un amical sans entraîneur. La compo, les changements : un modèle. Trois à zéro. Ton président a demandé la vidéo. »"
    left:  {label: "Je regarde la vidéo", effects: {direction: "-", set: [monde_modele]}, answer: "Personne ne sait qui féliciter, alors on ne félicite personne. Le lundi, le président déjeune avec un vendeur du modèle."}
    right: {label: "Je regarde la vidéo", effects: {direction: "-", set: [monde_modele]}, answer: "Personne ne sait qui féliciter, alors on ne félicite personne. Le lundi, le président déjeune avec un vendeur du modèle."}

  - id: co.nv.2038_kick_rachete
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: lea
    tone: leger
    once: true
    year: 2038
    text: "Léa, sur le plateau démonté de Télé-Stade : « Kick a racheté la chaîne ce matin. Le nom reste, pour les vieux. Cinquante-quatre ans d'archives partent sur un serveur. Vos matchs de 1990 aussi. »"
    left:  {label: "Je regarde le plateau", effects: {direction: "-"}, answer: "Le générique de 1984 est rediffusé une fois, par erreur. Il fait la meilleure audience du mois."}
    right: {label: "Je regarde le plateau", effects: {direction: "-"}, answer: "Le générique de 1984 est rediffusé une fois, par erreur. Il fait la meilleure audience du mois."}

  - id: co.nv.2039_debat_franchises
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: aulard
    tone: leger
    once: true
    year: 2039
    text: "La loi qui fermerait la première division : vingt clubs la veulent, quatre-vingts la craignent. Un député cite Vaubourg, 1998 : « Mon club ne descendra plus jamais. J'y mettrai le prix. »"
    left:  {label: "J'écoute le débat", effects: {direction: "-", var: {franchises: 2}}, answer: "Les vingt ont les voix. Les quatre-vingts ont les tribunes, et dimanche, toutes les bâches disent non."}
    right: {label: "J'écoute le débat", effects: {direction: "-", var: {franchises: 2}}, answer: "Les vingt ont les voix. Les quatre-vingts ont les tribunes, et dimanche, toutes les bâches disent non."}

  - id: co.nv.2040_franchises
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: aulard
    tone: leger
    once: true
    year: 2040
    text: "La première division est fermée, c'est voté. On ouvre l'enveloppe que Vaubourg avait laissée « pour ce jour-là » : « Si mon club est dedans, remerciez-moi. S'il est dehors, oubliez-moi. »"
    left:  {label: "Je relis la lettre", effects: {tribunes: "-", direction: "+", set: [monde_franchises]}, answer: "Le championnat garde ses dix-huit clubs pour toujours. La Coupe devient le seul endroit où tomber."}
    right: {label: "Je relis la lettre", effects: {tribunes: "-", direction: "+", set: [monde_franchises]}, answer: "Le championnat garde ses dix-huit clubs pour toujours. La Coupe devient le seul endroit où tomber."}

  - id: co.nv.2040_prix_libre
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: lea
    tone: leger
    once: true
    year: 2040
    text: "Léa secoue la boîte en fer posée à l'entrée du local : « L'Écho n'a plus de prix : chacun met ce qu'il veut. Premier dimanche, quatre-vingts écus et une pièce de dix francs. Je sais qui l'a mise. »"
    left:  {label: "Je mets quelque chose", effects: {tribunes: "+"}, answer: "La pièce de dix francs reste dans la boîte huit ans. Personne ne la prend, personne ne la rend."}
    right: {label: "Je mets quelque chose", effects: {tribunes: "+"}, answer: "La pièce de dix francs reste dans la boîte huit ans. Personne ne la prend, personne ne la rend."}

  - id: co.nv.2041_national_vrai_foot
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: clow
    tone: leger
    once: true
    year: 2041
    text: "Depuis que la première division est fermée, tout le monde regarde en bas. Télé-Stade rediffuse une vieille interview de Corven : « En bas, petit, on peut encore tomber. C'est pour ça qu'on regarde. »"
    left:  {label: "Je regarde en bas", effects: {tribunes: "+", set: [monde_national_vivant]}, answer: "Une chaîne achète les droits du National. Elle filme les matchs avec deux caméras et un drone."}
    right: {label: "Je regarde en bas", effects: {tribunes: "+", set: [monde_national_vivant]}, answer: "Une chaîne achète les droits du National. Elle filme les matchs avec deux caméras et un drone."}

  - id: co.nv.2042_voix_generee
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: josiane
    tone: leger
    once: true
    year: 2042
    text: "Une lettre de Madame Josiane, d'une écriture tremblée : « Les matchs sont commentés avec la voix d'un gardien mort il y a onze ans. Je l'ai reconnue. Il ne disait jamais « magnifique ». »"
    left:  {label: "Je débranche le poste", effects: {tribunes: "-", set: [monde_voix_generee]}, answer: "La voix ne se trompe jamais de nom. C'est à ça qu'on la reconnaît."}
    right: {label: "Je débranche le poste", effects: {tribunes: "-", set: [monde_voix_generee]}, answer: "La voix ne se trompe jamais de nom. C'est à ça qu'on la reconnaît."}

  - id: co.nv.2043_coupe_suspense
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: gege
    tone: leger
    once: true
    year: 2043
    text: "Avant le seizième de Coupe, on repasse au local une bande de Radio Tribune, la voix de Gégé en 2006 : « On ne gagnait rien. On venait quand même. Le seul soir où j'ai tremblé, c'était un seizième. »"
    left:  {label: "Je monte le son", effects: {tribunes: "+", var: {coupe: 2}}, answer: "La bande dure vingt-deux secondes. On la repasse tous les ans jusqu'en 2050."}
    right: {label: "Je monte le son", effects: {tribunes: "+", var: {coupe: 2}}, answer: "La bande dure vingt-deux secondes. On la repasse tous les ans jusqu'en 2050."}

  - id: co.nv.2044_vote_soixante_quatre
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: aulard
    tone: leger
    once: true
    year: 2044
    text: "Le Mondial passera à soixante-quatre équipes en 2046 : cent quatre matchs, six semaines. Dans le bureau du président, sous la photo de Vaubourg, sa vieille devise : « Plus de matchs, plus de droits. »"
    left:  {label: "Je lis la devise", effects: {direction: "+", set: [monde_soixante_quatre]}, answer: "Les qualifications sont supprimées pour trois confédérations. Elles votent pour, à l'unanimité."}
    right: {label: "Je lis la devise", effects: {direction: "+", set: [monde_soixante_quatre]}, answer: "Les qualifications sont supprimées pour trois confédérations. Elles votent pour, à l'unanimité."}

  - id: co.nv.2045_echo_dimanche
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: lea
    tone: leger
    once: true
    year: 2045
    text: "Léa, devant la presse arrêtée : « L'Écho ne paraîtra plus que le dimanche. Quatre pages, le dernier journal papier du pays. « Au local » en première, « On nous écrit » en dernière. »"
    left:  {label: "Je prends les quatre pages", effects: {tribunes: "+"}, answer: "Le tirage baisse d'un tiers. La boîte à prix libre se remplit deux fois plus."}
    right: {label: "Je prends les quatre pages", effects: {tribunes: "+"}, answer: "Le tirage baisse d'un tiers. La boîte à prix libre se remplit deux fois plus."}

  - id: co.nv.2046_mondial_64
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, famille]
    speaker: camille
    tone: leger
    once: true
    year: 2046
    text: "Camille pose deux tasses devant la télé, une pour toi : « Soixante-quatre pays, onze stades neufs, six semaines de matchs. Tu m'avais promis une finale ensemble. Une seule. C'est dans six semaines. »"
    left:  {label: "Je m'assois avec elle", effects: {vestiaire: "+", set: [monde_mondial_64]}, answer: "Trois des onze stades sont déjà promis à la démolition. On le sait avant le coup d'envoi, et on regarde quand même."}
    right: {label: "Je m'assois avec elle", effects: {vestiaire: "+", set: [monde_mondial_64]}, answer: "Trois des onze stades sont déjà promis à la démolition. On le sait avant le coup d'envoi, et on regarde quand même."}

  - id: co.nv.2047_sans_guichet
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: josiane
    tone: leger
    once: true
    year: 2047
    text: "On ferme le dernier guichet du stade : tout se prend sur l'application. Dans le tiroir, la clé porte encore l'étiquette de Madame Josiane : « Guichet. Ne se prête pas. »"
    left:  {label: "Je garde la clé", effects: {tribunes: "-"}, answer: "Le guichet devient l'endroit où l'on range les bâches. C'est bien pour les bâches."}
    right: {label: "Je garde la clé", effects: {tribunes: "-"}, answer: "Le guichet devient l'endroit où l'on range les bâches. C'est bien pour les bâches."}

  - id: co.nv.2048_derniere_buvette
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: gege
    tone: leger
    once: true
    year: 2048
    text: "La buvette des anciens est refaite : deux tireuses, la boîte en fer d'origine sous verre. Sur la plaque, une phrase de Gégé, avec une faute : « Ici on payait en bières, et on était bénévolles. »"
    left:  {label: "Je lis la plaque", effects: {tribunes: "+", set: [monde_buvette_refaite]}, answer: "La faute est sur le mot « bénévole ». On ne la corrige pas ; on la montre."}
    right: {label: "Je lis la plaque", effects: {tribunes: "+", set: [monde_buvette_refaite]}, answer: "La faute est sur le mot « bénévole ». On ne la corrige pas ; on la montre."}

  - id: co.nv.2049_district_renait
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: aubert
    tone: leger
    once: true
    year: 2049
    text: "Le district compte plus de clubs qu'en 1990, et aucun n'a de budget. Le registre est le même : en première page, la signature de Madame Aubert et sa promesse : « La ville paiera les ballons. »"
    left:  {label: "Je signe le registre", effects: {tribunes: "+", set: [monde_district_plein]}, answer: "Quarante-deux clubs, dont onze créés depuis 2040. Neuf ont repris le nom d'un club mort."}
    right: {label: "Je signe le registre", effects: {tribunes: "+", set: [monde_district_plein]}, answer: "Quarante-deux clubs, dont onze créés depuis 2040. Neuf ont repris le nom d'un club mort."}

  - id: co.nv.2050_bilan_siecle
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: josiane
    tone: leger
    once: true
    year: 2050
    text: "La Fédération publie le bilan du demi-siècle sur une seule page. On le range dans le classeur de Madame Josiane, à la dernière pochette, où elle avait écrit : « 2050. Laisser de la place. »"
    left:  {label: "Je lis la page", effects: {direction: "-", set: [monde_fin]}, answer: "Le tableau tient sur une page. On y lit tout, sauf ce que ça faisait d'y être."}
    right: {label: "Je lis la page", effects: {direction: "-", set: [monde_fin]}, answer: "Le tableau tient sur une page. On y lit tout, sauf ce que ça faisait d'y être."}

  - id: co.nv.2050_dernier_dimanche
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, moment]
    speaker: lea
    tone: leger
    once: true
    year: 2050
    text: "Léa compose la dernière page à la main : « L'Écho a cent quarante-huit ans dimanche. On joue à quinze heures, comme en 1902. Au local, on a ressorti les photos. Il y en a une de vous. »"
    left:  {label: "Je regarde la photo", effects: {tribunes: "+"}, answer: "Sur la photo, on reconnaît ton visage et deux autres. Les noms des autres, on les invente, et on les écrit au dos."}
    right: {label: "Je regarde la photo", effects: {tribunes: "+"}, answer: "Sur la photo, on reconnaît ton visage et deux autres. Les noms des autres, on les invente, et on les écrit au dos."}
