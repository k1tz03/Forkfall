    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: meneche
    tone: leger
    once: true
    year: 2032
    text: "Massenet, sans carnet pour la première fois : « La Gazette vend ses affaires à l'unité, dix écus, payés avant de lire. Il y en a une sur votre club cette semaine. Je l'ai achetée. Je vous la prête ? »"
    left:  {label: "Je lis l'affaire", effects: {direction: "-"}, answer: "Celle sur le club se revend deux écus dans la cour du collège, dès le lendemain. Le tirage de la Gazette triple."}
    right: {label: "Je lis l'affaire", effects: {direction: "-"}, answer: "Celle sur le club se revend deux écus dans la cour du collège, dès le lendemain. Le tirage de la Gazette triple."}

  - id: co.nv.2033_agence_notation
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: legruet
    tone: leger
    once: true
    year: 2033
    text: "La Commission devient une agence : chaque club reçoit une note de A à E, tous les six mois. En exergue de la circulaire, une phrase de Noé Berthomier : « Une note ne décide rien. Elle constate. »"
    left:  {label: "Je demande la grille", effects: {caisse: "-", set: [monde_notation]}, answer: "Le club est noté D. Le lendemain, la banque relève le taux du prêt, sans un coup de fil."}
    right: {label: "Je demande la grille", effects: {caisse: "-", set: [monde_notation]}, answer: "Le club est noté D. Le lendemain, la banque relève le taux du prêt, sans un coup de fil."}

  - id: co.nv.2034_ecole_a_douze
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, formation]
    speaker: clow
    tone: leger
    once: true
    year: 2034
    text: "Les centres recrutent à douze ans, école comprise. Au mur des éducateurs, une phrase de Corven, encadrée : « Un gamin de douze ans, ça ne se recrute pas. Ça se ramène chez sa mère le soir. »"
    left:  {label: "Je relis la phrase", effects: {vestiaire: "-", var: {pepite: 2}}, answer: "Sur quarante enfants entrés à douze ans, un signe pro. On le sait, et on recrute quand même."}
    right: {label: "Je relis la phrase", effects: {vestiaire: "-", var: {pepite: 2}}, answer: "Sur quarante enfants entrés à douze ans, un signe pro. On le sait, et on recrute quand même."}

  - id: co.nv.2035_quotidien_offert
    roles: [entraineur, joueur]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: lea
    tone: leger
    once: true
    year: 2035
    text: "Léa montre le bandeau orange sous le titre de l'épreuve : « Le Quotidien est offert, désormais. Par Almadis, en orange, sous notre nom. J'ai gardé la Une. On m'a pris la page des comptes des clubs. »"
    left:  {label: "Je lis le bandeau", effects: {direction: "-"}, answer: "Le tirage triple en un mois. Les questions en Une passent de trois par semaine à une."}
    right: {label: "Je lis le bandeau", effects: {direction: "-"}, answer: "Le tirage triple en un mois. Les questions en Une passent de trois par semaine à une."}

