# Les Nouvelles du passé (bible ch. 20 § 4) : ce que l'ancien club te fait
# savoir, une fois, plus tard, quand tu as changé de club ou de rôle.
#
# Le moteur planifie la carte générique `tr.nouvelles_du_passe` (Josiane, un
# fax à la main — content/cards/common/transversal.yaml) quand une intrigue est
# abandonnée pour cause de changement de club. Les vingt variantes ci-dessous
# nomment l'affaire au lieu de la désigner et donnent la parole à quelqu'un
# d'autre que la secrétaire : elles vivent dans le sac ordinaire, gardées par
# la trace qu'elles rappellent et par « tu es parti d'ailleurs »
# (`stats.clubs >= 2 || role_was('joueur')`), jamais en saison 0, une seule
# fois chacune. La générique reste le secours de la file.
#
# Gabarit : un seul bouton (deux libellés, effets identiques), un effet petit,
# `once: true`, `tone: leger`, aucun placeholder de nom (c'est le club qui
# parle du joueur, pas l'inverse).
cards:
  # --------------------------------------------------------- ce qu'on a promis
  - id: co.nouvelle.passe_pacte
    roles: [entraineur, joueur]
    arc: passe
    tags: [ultras, tribunes]
    speaker: gege
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && flag('pacte_gege')"
    text: "Gégé, au téléphone, des verres qu'on empile : « Le club a repeint le local cet été, sans qu'on demande. Le peintre a contourné la date à la craie, et ton nom. Ils sont restés au milieu du blanc. »"
    left:  {label: "Qu'ils l'effacent", effects: {tribunes: "-"}, answer: "Le carré de craie reste sur le mur blanc. Aux nouveaux qui demandent, on répond « une promesse », sans dire laquelle."}
    right: {label: "Qu'elle reste au mur", effects: {tribunes: "-"}, answer: "Le carré de craie reste sur le mur blanc. Aux nouveaux qui demandent, on répond « une promesse », sans dire laquelle."}

  - id: co.nouvelle.passe_gigi
    roles: [entraineur, joueur]
    arc: passe
    tags: [vestiaire]
    speaker: vecchio
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && flag('vecchio_promis')"
    text: "Vecchio, au téléphone, lentement : « Le nouveau m'a sorti des buts en octobre. Entraîneur des gardiens, ils appellent ça. Ta saison promise, je l'ai finie sur le banc, des gants propres aux mains. »"
    left:  {label: "Je lui promets de passer", effects: {vestiaire: "-"}, answer: "Il raccroche le premier. Ça ne lui était jamais arrivé."}
    right: {label: "Je ne promets plus rien", effects: {vestiaire: "-"}, answer: "Il raccroche le premier. Ça ne lui était jamais arrivé."}

  - id: co.nouvelle.passe_tribune
    roles: [entraineur, joueur]
    arc: passe
    tags: [tribunes, ultras]
    speaker: gege
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && flag('tribune_a_renover')"
    text: "Gégé, sans lever la voix : « Ils ont refait la tribune Nord en juillet, après ton départ. Des sièges partout, deux rangs en moins pour les caméras. Maintenant, au virage, on chante assis. »"
    left:  {label: "Je viendrai la voir", effects: {tribunes: "-"}, answer: "Trois cents places de moins, quatre cents abonnés de plus. Le virage chante moins fort ; il chante quand même."}
    right: {label: "Je change de sujet", effects: {tribunes: "-"}, answer: "Trois cents places de moins, quatre cents abonnés de plus. Le virage chante moins fort ; il chante quand même."}

  - id: co.nouvelle.passe_bache
    roles: [entraineur, joueur]
    arc: passe
    tags: [ultras, tribunes]
    speaker: gege
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && (flag('otage_kop') || flag('ami_ultras'))"
    text: "Gégé, sans sourire : « Ta bâche, on l'a décrochée en octobre. Pliée en trois, sous le bar du local, à côté de celle de mon père. On n'en jette aucune. On les ressort quand quelqu'un revient. »"
    left:  {label: "Je demande à la voir", effects: {tribunes: "-"}, answer: "Elle est toujours sous le bar. Vingt mètres, trois plis, ton nom à l'intérieur."}
    right: {label: "Gardez-la pliée", effects: {tribunes: "-"}, answer: "Elle est toujours sous le bar. Vingt mètres, trois plis, ton nom à l'intérieur."}

  # ------------------------------------------------------------ ce qu'on a vendu
  - id: co.nouvelle.passe_mbako
    roles: [entraineur, joueur]
    arc: passe
    tags: [mercato, presse]
    speaker: meneche
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && flag('mbako_lance') && !flag('mbako_vendu')"
    text: "Massenet, le carnet ouvert : « Le petit Mbako est parti pour trente millions, six mois après vous. Je vous donne le chiffre ; vous me donnez la clause. Il y en avait une à votre nom, non ? »"
    left:  {label: "Il n'y a pas de clause", effects: {direction: "-"}, answer: "Le club encaisse. Toi, tu lis le chiffre dans le journal comme tout le monde."}
    right: {label: "Je ne commente pas", effects: {direction: "-"}, answer: "Le club encaisse. Toi, tu lis le chiffre dans le journal comme tout le monde."}

  - id: co.nouvelle.passe_prodige
    roles: [entraineur, joueur]
    arc: passe
    tags: [formation, mercato]
    speaker: vukic
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 2 && (stats.clubs >= 2 || role_was('joueur')) && !flag('mbako_lance') && !flag('pepite')"
    text: "Vukić, une feuille de quatre lignes pliée dans le cahier : « Le gamin de la réserve, celui du mercredi. Valdorne l'a pris en janvier. Il a marqué en février, du gauche. Tu l'avais vu deux fois. »"
    left:  {label: "Je relis les quatre lignes", effects: {force: -1}, answer: "La quatrième ligne dit « à revoir dans deux ans ». C'est ton écriture."}
    right: {label: "Je range la feuille", effects: {force: -1}, answer: "La quatrième ligne dit « à revoir dans deux ans ». C'est ton écriture."}

  - id: co.nouvelle.passe_naming
    roles: [entraineur, joueur]
    arc: passe
    tags: [sponsors, tribunes]
    speaker: lea
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && flag('naming_signe')"
    text: "Léa, une photo sur la table : « Le panneau est monté en août : ancien nom en petit, marque en orange, quatre mètres de haut. Au local, on donne toujours rendez-vous à l'ancien. »"
    left:  {label: "Encaisser", effects: {tribunes: "-"}, answer: "La photo de Une est prise de la tribune Est. On y voit surtout l'orange."}
    right: {label: "Dire l'ancien nom", effects: {tribunes: "-"}, answer: "La photo de Une est prise de la tribune Est. On y voit surtout l'orange."}

  # ---------------------------------------------------------- ce qu'on a laissé
  - id: co.nouvelle.passe_vukic
    roles: [entraineur, joueur]
    arc: passe
    tags: [direction, vestiaire]
    speaker: vukic
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && flag('vukic_dauphin')"
    text: "Vukić, au téléphone, à sept heures pile : « J'ai le banc depuis janvier ; le second discours était le bon. Le cahier est dans mon tiroir, moins deux pages, celles de mars. Je ne sais pas qui les a. »"
    left:  {label: "Je réclame les deux pages", effects: {direction: "-"}, answer: "Il envoie une photocopie trois semaines plus tard. Elle est incomplète."}
    right: {label: "Garde le cahier", effects: {direction: "-"}, answer: "Il envoie une photocopie trois semaines plus tard. Elle est incomplète."}

  - id: co.nouvelle.passe_brassard
    roles: [entraineur, joueur]
    arc: passe
    tags: [vestiaire]
    speaker: brehaut
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && flag('capitaine')"
    text: "Bréhaut, au téléphone : « Ton brassard, c'est un latéral de vingt-trois ans qui l'a. Il le met à l'envers un match sur deux ; les gars le lui retournent dans le tunnel. Je lui transmets un mot ? »"
    left:  {label: "Dis-lui de le serrer", effects: {vestiaire: "-"}, answer: "Le latéral garde le brassard à l'envers jusqu'en mai. Plus personne ne le corrige ; c'est devenu le sien."}
    right: {label: "Ne lui dis rien", effects: {vestiaire: "-"}, answer: "Le latéral garde le brassard à l'envers jusqu'en mai. Plus personne ne le corrige ; c'est devenu le sien."}

  - id: co.nouvelle.passe_clow
    roles: [entraineur, joueur]
    arc: passe
    tags: [vestiaire, formation]
    speaker: clow
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && flag('clow_ingrat')"
    text: "Corven, au bar d'en face, un verre d'eau plein à ras bord : « J'ai écrit sur un sous-bock mes six meilleurs élèves. Le cinquième, je l'ai barré. Au crayon, pas au stylo. Le crayon, ça s'efface. »"
    left:  {label: "Je passe le voir", effects: {vestiaire: "-"}, answer: "Le sous-bock reste sous son verre. Le crayon pâlit un peu chaque semaine ; personne ne repasse dessus."}
    right: {label: "Je ne réponds pas", effects: {vestiaire: "-"}, answer: "Le sous-bock reste sous son verre. Le crayon pâlit un peu chaque semaine ; personne ne repasse dessus."}

  - id: co.nouvelle.passe_josiane
    roles: [entraineur, joueur]
    arc: passe
    tags: [direction]
    speaker: josiane
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && year < 2008"
    text: "Madame Josiane pose un sac de sport sur la chaise : « J'ai vidé votre bureau. Deux cahiers, une photo d'équipe, un sifflet, et une lettre timbrée jamais postée. L'adresse n'est écrite qu'à moitié. »"
    left:  {label: "Postez-la pour moi", effects: {relation: {josiane: 1}}, answer: "Elle la range dans le tiroir du haut, timbre compris. Elle ne la lit pas ; elle sait déjà à qui elle était."}
    right: {label: "Gardez-la, Josiane", effects: {relation: {josiane: 1}}, answer: "Elle la range dans le tiroir du haut, timbre compris. Elle ne la lit pas ; elle sait déjà à qui elle était."}

  - id: co.nouvelle.passe_plaque
    roles: [entraineur, joueur]
    arc: passe
    tags: [tribunes, presse]
    speaker: lea
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && stats.saisons >= 5"
    text: "Léa, une photo de vestiaire : « Une plaque a été posée au-dessus de la porte, avec le nom, les années et une faute d'accent. Au local, on a voté pour garder la faute. »"
    left:  {label: "Encaisser", effects: {tribunes: "+"}, answer: "La faute reste. Elle devient le détail qu'on raconte aux nouveaux."}
    right: {label: "Regarder l'accent", effects: {tribunes: "+"}, answer: "La faute reste. Elle devient le détail qu'on raconte aux nouveaux."}

  # ------------------------------------------------------- ce qui a mal fini là-bas
  - id: co.nouvelle.passe_salaires
    roles: [entraineur, joueur]
    arc: passe
    tags: [caisse]
    speaker: josiane
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && flag('salaires_retard')"
    text: "Madame Josiane, au téléphone : « Les arriérés sont tombés en novembre, d'un coup, intérêts compris. Tout le vestiaire est passé au distributeur le même soir. Votre ligne à vous a été rayée. »"
    left:  {label: "Je réclame ma part", effects: {caisse: "-"}, answer: "Ton dû part chez l'avocat du club, qui ne répond pas. Au vestiaire, on lève quand même un verre à ta santé."}
    right: {label: "Je laisse courir", effects: {caisse: "-"}, answer: "Ton dû part chez l'avocat du club, qui ne répond pas. Au vestiaire, on lève quand même un verre à ta santé."}

  - id: co.nouvelle.passe_enveloppe
    roles: [entraineur, joueur]
    arc: passe
    tags: [scandale, direction]
    speaker: legruet
    tone: strategique
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && flag('enveloppe_promise')"
    text: "Berthomier, la main sur une chemise : « Un club adverse veut rouvrir l'affaire de l'enveloppe, de votre temps là-bas. Ce sera salle 3. Je n'ai pas fixé de date ; je peux ne pas en fixer. »"
    left:  {label: "Fixez une date", effects: {direction: "-"}, answer: "La chemise reste sur son bureau, ouverte à la première page. Dauzat recopie ton nom dans le registre, au cas où."}
    right: {label: "Ne fixez rien", effects: {direction: "-"}, answer: "La chemise reste sur son bureau, ouverte à la première page. Dauzat recopie ton nom dans le registre, au cas où."}

  - id: co.nouvelle.passe_commission
    roles: [entraineur, joueur]
    arc: passe
    tags: [scandale, caisse]
    speaker: legruet
    tone: strategique
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && flag('fede_dossier')"
    text: "Berthomier, une lettre recommandée à la main : « La convocation est partie le 12 ; vous aviez quitté le club le 4. Elle porte votre nom quand même. Une commission n'aime pas qu'on parte avant elle. »"
    left:  {label: "Je viendrai salle 3", effects: {caisse: "-"}, answer: "La lettre suit deux adresses et t'arrive en mars, déjà ouverte. L'amende, elle, n'a pas attendu."}
    right: {label: "Je réponds par écrit", effects: {caisse: "-"}, answer: "La lettre suit deux adresses et t'arrive en mars, déjà ouverte. L'amende, elle, n'a pas attendu."}

  - id: co.nouvelle.passe_flacon
    roles: [entraineur, joueur]
    arc: passe
    tags: [scandale, vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && flag('flacon_b')"
    text: "Le Doc, au téléphone, à voix basse : « Le flacon B est classé depuis avril. Une ligne, pas d'audition, pas de nom. J'ai gardé le double du bordereau dans le tiroir. Au cas où on le demande. »"
    left:  {label: "Brûlez le double", effects: {direction: "-"}, answer: "Le classement tient en une ligne : « éléments insuffisants ». Le double du bordereau reste dans le tiroir."}
    right: {label: "Gardez-le, Doc", effects: {direction: "-"}, answer: "Le classement tient en une ligne : « éléments insuffisants ». Le double du bordereau reste dans le tiroir."}

  # ------------------------------------------------------- ce qu'ils sont devenus
  - id: co.nouvelle.passe_descente
    roles: [entraineur, joueur]
    arc: passe
    tags: [presse]
    speaker: meneche
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 2 && (stats.clubs >= 2 || role_was('joueur'))"
    text: "Massenet, carnet fermé, ce qui est rare : « Votre ancien club est descendu, à deux points, avec quatre entraîneurs dans la saison. Je n'écris rien sur vous si vous ne dites rien. Alors ? »"
    left:  {label: "Je ne dis rien", effects: {tribunes: "+"}, answer: "Le lendemain, il écrit que tu as souri en l'apprenant. Tu n'avais pas souri."}
    right: {label: "Je dis que je les plains", effects: {tribunes: "+"}, answer: "Le lendemain, il écrit que tu as souri en l'apprenant. Tu n'avais pas souri."}

  - id: co.nouvelle.passe_montee
    roles: [entraineur, joueur]
    arc: passe
    tags: [presse, direction]
    speaker: lea
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 2 && (stats.clubs >= 2 || role_was('joueur'))"
    text: "Léa, calepin ouvert : « Ils ont gagné l'étage du dessus, au bout de la deuxième saison, avec neuf joueurs que vous aviez fait signer. Le président ne vous a pas cité une fois. »"
    left:  {label: "Encaisser", effects: {direction: "-"}, answer: "Le président remercie le groupe, la ville et le hasard. Dans cet ordre."}
    right: {label: "Confirmer", effects: {direction: "-"}, answer: "Le président remercie le groupe, la ville et le hasard. Dans cet ordre."}

  - id: co.nouvelle.passe_president
    roles: [entraineur, joueur]
    arc: passe
    tags: [direction]
    speaker: aulard
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 2 && (stats.clubs >= 2 || role_was('joueur'))"
    text: "Vaubourg, le téléphone sous le menton : « Ton ancien président est tombé hier, en assemblée, onze voix contre neuf. Onze actionnaires qu'il croyait à lui. Moi, je recompte les miens chaque lundi. »"
    left:  {label: "Je n'en dis rien", effects: {direction: "+"}, answer: "L'ancien président t'appelle deux mois plus tard, pour rien. Tu décroches, pour rien aussi."}
    right: {label: "Je lui envoie un mot", effects: {direction: "+"}, answer: "L'ancien président t'appelle deux mois plus tard, pour rien. Tu décroches, pour rien aussi."}

  - id: co.nouvelle.passe_camille
    roles: [entraineur, joueur]
    arc: passe
    tags: [famille]
    speaker: camille
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 1 && (stats.clubs >= 2 || role_was('joueur')) && flag('camille_ici') && !flag('divorce')"
    text: "Camille, une carte postale à la main : « La voisine du deuxième écrit que la boulangerie a fermé et qu'elle pense à nous. Elle demande si on reviendra un jour. Je lui réponds, ou c'est toi ? »"
    left:  {label: "Réponds-lui, toi", effects: {relation: {camille: 1}}, answer: "La carte reste sur le frigo trois ans. On finit par ne plus la voir."}
    right: {label: "Je lui écris dimanche", effects: {relation: {camille: 1}}, answer: "La carte reste sur le frigo trois ans. On finit par ne plus la voir."}

  # ------------------------------------------ le second fax (la générique revient)
  # `tr.nouvelles_du_passe` (Josiane, le fax) est passée `once` : le cadre ne se
  # répète plus. Quand une deuxième affaire remonte, c'est cette carte-là qui la
  # dit — même mécanisme, autre bouche, autre objet, et elle nomme la fatigue de
  # l'ancien club au lieu de la désigner.
  - id: co.nouvelle.passe_second_fax
    roles: [entraineur, joueur]
    arc: passe
    tags: [direction]
    speaker: josiane
    tone: leger
    once: true
    cooldown: 0
    when: "season >= 2 && (stats.clubs >= 2 || role_was('joueur')) && seen('tr.nouvelles_du_passe')"
    text: "Madame Josiane, deux feuilles de fax déjà pâles : « Votre ancien club m'a encore faxé. Deuxième envoi ce mois-ci, toujours la nuit, jamais signé. Quelqu'un, là-bas, tient à ce que vous sachiez. »"
    left:  {label: "Je veux lire les deux", effects: {direction: "-"}, answer: "Elle range les deux feuilles dans une chemise neuve. Elle écrit un nom dessus, pas le tien."}
    right: {label: "Faites changer le numéro", effects: {direction: "-"}, answer: "Elle range les deux feuilles dans une chemise neuve. Elle écrit un nom dessus, pas le tien."}

