# Cartes de palier de relation (characters.yaml → on_relation ; kind palier
# dérivé par le build). Programmées en dur dans [1,3] cartes quand la relation
# franchit le seuil, une fois par carrière. Hors du sac.
#   gege    −3 → en.gege.trahison_banderole      +3 → en.gege.faveur_insurrection
#   meneche −3 → en.meneche.trahison_dossier
#   mbako   +3 → co.mbako.faveur_refus_grand_club (entraîneur et joueur)
# Une seule sortie = les deux côtés identiques (single dérivé).
cards:
  # ------------------------------------------------------------- Gégé, −3
  - id: en.gege.trahison_banderole
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, risk:tribunes]
    speaker: gege
    # strategique, pas drame : le palier −3 est atteignable dès la S0 (D1
    # « Pas ce soir » −1, C2 « Signez » −2) où le drame est interdit, et le
    # seul drame de la carrière est réservé à l'hôpital / la tribune noire.
    tone: strategique
    once: true
    text: "Gégé, sans un regard, la banderole pliée sur l'épaule : « Vingt mètres. DÉMISSION, et ton nom devant, en lettres d'un mètre. On a hésité sur l'accent. »"
    left:
      label: "Je lis"
      effects: {tribunes: "---", direction: "--", journal: {text: "{annee} : vingt mètres de banderole en tribune Nord : « {NOM} DÉMISSION ». Gégé a hésité sur l'accent.", poids: 3, tags: [ultras, tribunes]}}
      answer: "L'accent est là. Le président aussi, en face, avec un stylo."
    right:
      label: "Je lis"
      effects: {tribunes: "---", direction: "--", journal: {text: "{annee} : vingt mètres de banderole en tribune Nord : « {NOM} DÉMISSION ». Gégé a hésité sur l'accent.", poids: 3, tags: [ultras, tribunes]}}
      answer: "L'accent est là. Le président aussi, en face, avec un stylo."

  # ------------------------------------------------------------- Gégé, +3
  - id: en.gege.faveur_insurrection
    roles: [entraineur]
    arc: ultras
    tags: [ultras, vestiaire, rescue:vestiaire]
    speaker: gege
    tone: strategique
    once: true
    text: "Gégé, à voix basse, sur le parking : « Quarante gars voulaient descendre au vestiaire ce soir, après le match. Avec des barres. J'ai dit non, {toi}. Ils m'écoutent encore. Pour l'instant. »"
    left:
      label: "Merci, Gégé"
      effects: {vestiaire: "+++", tribunes: "+", journal: {text: "{annee} : une insurrection prévue au vestiaire, annulée par Gégé. {nom} ne saura jamais qui.", poids: 3, tags: [ultras, vestiaire]}}
      answer: "Le vestiaire ne saura jamais qui a dit non. Toi, si."
    right:
      label: "Qui voulait ma tête ?"
      effects: {vestiaire: "+", direction: "+", relation: {gege: -1}}
      answer: "Il ne donne pas les noms. Il remet sa casquette et repart vers le local, lentement."

  # ---------------------------------------------------------- Massenet, −3
  - id: en.meneche.trahison_dossier
    roles: [entraineur]
    arc: presse
    tags: [presse, tribunes, risk:tribunes]
    speaker: meneche
    tone: strategique
    once: true
    text: "Massenet, une chemise cartonnée fermée devant lui, les deux mains dessus : « Le dossier sort demain, {toi}. Toutes vos promesses, datées, avec les témoins. Choisissez la page : la une, ou la trois. »"
    left:
      label: "La une, je signe tout"
      effects: {parole: -2, tribunes: "--", journal: {text: "{annee} : le dossier Massenet en Une : toutes les promesses de {nom}, datées. Gégé a découpé l'article.", poids: 3, tags: [presse, tribunes]}}
      answer: "Douze promesses, douze dates. Le soir même, l'article est au mur du local, découpé au cordeau."
    right:
      label: "Page trois, et un entretien"
      effects: {parole: -2, tribunes: "-", direction: "-", relation: {meneche: 1}, journal: {text: "{annee} : le dossier Massenet en page trois. Le président a lu la page trois en premier.", poids: 3, tags: [presse, direction]}}
      answer: "Page trois. Le président lit quand même la page trois en premier."

  # ------------------------------------------------------------ Mbako, +3
  - id: co.mbako.faveur_refus_grand_club
    roles: [entraineur, joueur]
    arc: mercato
    tags: [mercato, vestiaire, formation]
    speaker: mbako
    tone: strategique
    once: true
    text: "Mbako, le sac sur l'épaule, dans l'encadrement de la porte : « Le grand club a appelé ce matin. J'ai dit non. Tout seul. Ma mère ne le sait pas encore. »"
    left:
      label: "Tu es fou, et merci"
      effects: {vestiaire: "++", tribunes: "++", caisse: "-", journal: {text: "{annee} : Lian Mbako a dit non au grand club pour rester avec {nom}. Sa mère a gardé le numéro.", poids: 3, tags: [mercato, vestiaire]}}
      answer: "Sa mère raccroche au nez du grand club. Elle garde le numéro quand même."
    right:
      label: "Tu devrais partir"
      effects: {direction: "+", caisse: "+", relation: {mbako: -1}}
      answer: "Il ne part pas. Il joue moins bien pendant un mois."

  # ═══════════════════════════════════════════════════════════════════════════
  # Les face-à-face de palier de la bible ch. 30 § 3.1 (la table des quatre-
  # vingt-deux paliers) et § 3.2 (les transversaux), pour les quinze visages du
  # casting qui n'en avaient pas encore. Trois règles : la trahison n'a qu'une
  # sortie (on ne négocie pas un −3, on le lit) ; la faveur en a deux (accepter,
  # ou demander pourquoi — ce qui coûte un cran) ; aucune n'est un drame, même
  # quand elle fait mal. Un −3 pose l'Ennemi : `enemy('<id>')` devient vrai et
  # les fins, les manchettes et les retrouvailles le lisent.
  # ═══════════════════════════════════════════════════════════════════════════

  # ---------------------------------------------------------- Bréhaut, −3 / +3
  - id: co.brehaut.trahison_petition
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, risk:vestiaire]
    speaker: brehaut
    tone: strategique
    once: true
    text: "Bréhaut déplie la feuille sur le bureau du président, sa signature en haut : « Vingt-deux noms contre toi. Le mien en premier ; un capitaine signe en premier. Les gars l'ont voulue, je l'ai écrite. »"
    left: {label: "Je lis les noms", effects: {vestiaire: "---", direction: "--", enemy: [brehaut], journal: {text: "{annee} : vingt-deux noms sur une feuille contre {nom}. Le capitaine avait signé en premier.", poids: 3, tags: [vestiaire]}}, answer: "Vingt-deux noms. Le premier est celui qui te tutoyait hier."}
    right: {label: "Je lis les noms", effects: {vestiaire: "---", direction: "--", enemy: [brehaut], journal: {text: "{annee} : vingt-deux noms sur une feuille contre {nom}. Le capitaine avait signé en premier.", poids: 3, tags: [vestiaire]}}, answer: "Vingt-deux noms. Le premier est celui qui te tutoyait hier."}

  - id: co.brehaut.faveur_lettre
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, rescue:vestiaire]
    speaker: brehaut
    tone: strategique
    once: true
    text: "Bréhaut, une feuille pliée en quatre, pleine de fautes : « Les gars ont écrit au président, pour toi. Vingt-deux noms, le mien en premier. C'est parti par fax ce matin, avant qu'ils changent d'avis. »"
    left: {label: "Merci, capitaine", effects: {vestiaire: "+++", direction: "+", set: [lettre_du_vestiaire], journal: {text: "{annee} : la lettre du vestiaire pour {nom}, vingt-deux noms, reçue par fax au premier étage.", poids: 3, tags: [vestiaire]}}, answer: "Le fax a chauffé onze minutes. Le président a lu la deuxième page."}
    right: {label: "Qui a refusé de signer ?", effects: {vestiaire: "+", relation: {brehaut: -1}}, answer: "Il replie la feuille. « Personne », dit-il, et tu sais que c'est faux."}

  # ------------------------------------------------------------ Vukić, −3 / +3
  - id: co.vukic.trahison_serrure
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, vestiaire, risk:direction]
    speaker: vukic
    tone: strategique
    once: true
    text: "Vukić, une clé neuve entre deux doigts : « Le bureau a une serrure neuve depuis six heures ce matin. Le président m'a donné la clé. Il ne t'en a pas fait faire, {toi}. »"
    left: {label: "J'ai compris", effects: {vestiaire: "--", direction: "---", set: [cahier_perdu], enemy: [vukic], journal: {text: "{annee} : la serrure du bureau changée un mardi. Le cahier de {nom} est resté dedans.", poids: 3, tags: [direction]}}, answer: "Le cahier est resté dans le tiroir. Deux pages étaient de ta main."}
    right: {label: "J'ai compris", effects: {vestiaire: "--", direction: "---", set: [cahier_perdu], enemy: [vukic], journal: {text: "{annee} : la serrure du bureau changée un mardi. Le cahier de {nom} est resté dedans.", poids: 3, tags: [direction]}}, answer: "Le cahier est resté dans le tiroir. Deux pages étaient de ta main."}

  - id: co.vukic.faveur_trois_valises
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, rescue:vestiaire]
    speaker: vukic
    tone: strategique
    once: true
    text: "Vukić, trois valises alignées dans le couloir du centre : « Où tu vas, je viens. Trois valises, c'est tout ce que j'ai. Je les ai faites avant de te demander. »"
    left: {label: "Viens", effects: {vestiaire: "++", direction: "+", set: [trois_valises], journal: {text: "{annee} : trois valises dans le couloir. L'adjoint suit {nom}, et il n'a pas demandé où.", poids: 2, tags: [vestiaire]}}, answer: "Il prend deux valises, toi la troisième. Le cahier est dans celle du milieu, entre deux survêtements marine."}
    right: {label: "Pourquoi tu ferais ça ?", effects: {vestiaire: "+", relation: {vukic: -1}}, answer: "Il souffle par le nez. Il remonte une valise à l'étage ; les deux autres restent dans le couloir."}

  # ---------------------------------------------------------- Vecchio, −3 / +3
  - id: co.vecchio.trahison_une_rendue
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, risk:vestiaire]
    speaker: vecchio
    tone: strategique
    once: true
    text: "Vecchio, son maillot plié sur l'avant-bras : « Vingt-quatre ans que je le rends à l'intendant, le dimanche soir. Aujourd'hui, je te le rends à toi. Devant eux. »"
    left: {label: "Je le prends", effects: {vestiaire: "---", tribunes: "-", enemy: [vecchio], journal: {text: "{annee} : le vieux gardien a rendu son maillot devant le groupe. Personne n'a parlé pendant une minute.", poids: 3, tags: [vestiaire]}}, answer: "Il le pose plié, à l'endroit. Le numéro est vers le haut."}
    right: {label: "Je le prends", effects: {vestiaire: "---", tribunes: "-", enemy: [vecchio], journal: {text: "{annee} : le vieux gardien a rendu son maillot devant le groupe. Personne n'a parlé pendant une minute.", poids: 3, tags: [vestiaire]}}, answer: "Il le pose plié, à l'endroit. Le numéro est vers le haut."}

  - id: co.vecchio.faveur_reunion
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, rescue:vestiaire]
    speaker: vecchio
    tone: strategique
    once: true
    text: "Vecchio, appuyé sur ta voiture, les gants aux mains : « Hier soir, j'ai réuni les gars, sans toi. Pour toi. Mon entraîneur de quatre-vingt-un, personne ne l'a fait pour lui ; il a sauté en mars. »"
    left: {label: "Merci, Gigi", effects: {vestiaire: "+++", relation: {vecchio: 1}, journal: {text: "{annee} : une réunion de vestiaire sans le coach, pour le coach. Gigi Vecchio a parlé six minutes.", poids: 3, tags: [vestiaire]}}, answer: "Six minutes, gants aux mains. Personne ne l'a coupé."}
    right: {label: "Qui parlait contre moi ?", effects: {vestiaire: "+", relation: {vecchio: -1}}, answer: "Il enlève ses gants pour répondre, puis les remet sans répondre."}

  # --------------------------------------------------------- Sabatier, −3 / +3
  - id: co.sabatier.trahison_dossier
    roles: [entraineur, joueur]
    arc: presse
    tags: [presse, direction, risk:direction]
    speaker: sabatier
    tone: strategique
    once: true
    text: "Sabatier, le tiroir de la table ouvert et vide : « Le dossier est parti jeudi. Les radios, les dates, les ordonnances. Trois personnes l'ont demandé poliment ; je n'avais plus de raison de dire non. »"
    left: {label: "Je lis la page trois", effects: {direction: "--", vestiaire: "--", enemy: [sabatier], journal: {text: "{annee} : le dossier médical est sorti de la table du Doc. Page trois, deux dates et un nom.", poids: 3, tags: [presse, direction]}}, answer: "Page trois : deux dates, une signature, et une piqûre que tu avais oubliée."}
    right: {label: "Je lis la page trois", effects: {direction: "--", vestiaire: "--", enemy: [sabatier], journal: {text: "{annee} : le dossier médical est sorti de la table du Doc. Page trois, deux dates et un nom.", poids: 3, tags: [presse, direction]}}, answer: "Page trois : deux dates, une signature, et une piqûre que tu avais oubliée."}

  - id: co.sabatier.faveur_controle
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, scandale, rescue:direction]
    speaker: sabatier
    tone: strategique
    once: true
    text: "Sabatier, les lunettes sur le nez pour une fois, la porte de l'armoire entrouverte : « Contrôle antidopage jeudi, huit heures. Je ne te l'ai pas dit. L'armoire, je ne l'ai pas rangée non plus. »"
    left: {label: "Merci, docteur", effects: {direction: "+", vestiaire: "++", journal: {text: "{annee} : le contrôle de jeudi huit heures était attendu. Personne n'a jamais su par qui.", poids: 2, tags: [vestiaire, scandale]}}, answer: "L'armoire est rangée mercredi soir. Il n'y était pas."}
    right: {label: "Pourquoi me prévenir ?", effects: {direction: "+", relation: {sabatier: -1}}, answer: "« Parce que je sais ce qu'il y a dedans. » Il ferme l'armoire à clé et garde la clé."}

  # ------------------------------------------------------------- Corven, −3 / +3
  - id: co.clow.trahison_devant
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, risk:direction]
    speaker: clow
    tone: strategique
    once: true
    statut_ok: [parti, retraite]
    text: "Corven, au bar, sans se lever, à deux hommes qui écoutent : « En soixante et onze, on m'a viré par télégramme. Lui, je ne prendrai même pas la peine d'écrire. Il n'appelait plus. »"
    left: {label: "Je m'en vais", effects: {vestiaire: "-", direction: "--", parole: -1, enemy: [clow], journal: {text: "{annee} : le vieux mentor a rayé {nom} de sa liste. Il l'a dit devant deux personnes, exprès.", poids: 2, tags: [vestiaire]}}, answer: "Il ne se lève pas. C'est la première fois qu'il ne se lève pas."}
    right: {label: "Je m'en vais", effects: {vestiaire: "-", direction: "--", parole: -1, enemy: [clow], journal: {text: "{annee} : le vieux mentor a rayé {nom} de sa liste. Il l'a dit devant deux personnes, exprès.", poids: 2, tags: [vestiaire]}}, answer: "Il ne se lève pas. C'est la première fois qu'il ne se lève pas."}

  - id: co.clow.faveur_telegramme
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, objet, rescue:tribunes]
    speaker: clow
    tone: strategique
    once: true
    statut_ok: [parti, retraite]
    text: "Corven pose sur le comptoir le télégramme de soixante et onze, jauni, plié en quatre, et ne le pousse pas : « Cinquante-neuf jours, six mots. Je l'ai gardé assez longtemps. Prends-le. »"
    left: {label: "Je le garde", effects: {tribunes: "+", parole: 2, set: [telegramme_clow], journal: {text: "{annee} : six mots par télégramme, du vieux monsieur. {nom} les a comptés deux fois.", poids: 3, tags: [objet, vestiaire]}}, answer: "Six mots. Tu les comptes deux fois, et ils font toujours six."}
    right: {label: "Six mots, c'est court", effects: {parole: 1, relation: {clow: -1}}, answer: "« C'est un télégramme. » Il le reprend et le remet dans sa poche."}

  # Second registre +3 du mentor (bible ch. 01 § 5.2 : « Lundi, huit heures.
  # J'ai mis ta chaise devant. »). Il sert quand le télégramme est déjà donné,
  # ou pendant que « Lundi, huit heures » (co.clow_lundi) le garde pour son
  # climax : deux fois la même révélation à trois cartes d'écart, sinon.
  - id: co.clow.faveur_chaise
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, objet, rescue:tribunes]
    speaker: clow
    tone: strategique
    once: true
    statut_ok: [parti, retraite]
    text: "Corven pousse le tabouret du bout contre le comptoir : « Lundi, huit heures. J'ai mis ta chaise devant. En soixante-huit, mon entraîneur m'avait fait le même coup ; j'étais arrivé à sept. »"
    left: {label: "J'y serai à sept", effects: {tribunes: "+", parole: 1, relation: {clow: 1}, journal: {text: "{annee} : Dan Corven a réservé un tabouret à {nom}. Le premier du comptoir, celui qui voit la porte.", poids: 2, tags: [objet, vestiaire]}}, answer: "Il ne dit pas merci. Il tourne le tabouret d'un quart pour qu'il voie la porte."}
    right: {label: "Je ne suis plus stagiaire", effects: {parole: 1, relation: {clow: -1}}, answer: "« Personne ne l'est. » Il remet le tabouret contre le mur, du bout du pied."}

  # ------------------------------------------------------------------ Mbako, −3
  - id: co.mbako.trahison_clause
    roles: [entraineur, joueur]
    arc: mercato
    tags: [mercato, vestiaire, risk:vestiaire]
    speaker: mbako
    tone: strategique
    once: true
    text: "Mbako, sa mère deux pas derrière lui : « La clause est levée. Je signe ailleurs demain matin. Elle l'avait écrite pour ce jour-là. Vous, vous ne l'aviez pas lue. »"
    left: {label: "Je relis la clause", effects: {vestiaire: "--", caisse: "-", enemy: [mbako], journal: {text: "{annee} : la clause du petit a été levée au centime. Sa mère l'avait écrite elle-même.", poids: 3, tags: [mercato]}}, answer: "Onze lignes, une virgule bien placée. Elle l'avait écrite en trois jours."}
    right: {label: "Je relis la clause", effects: {vestiaire: "--", caisse: "-", enemy: [mbako], journal: {text: "{annee} : la clause du petit a été levée au centime. Sa mère l'avait écrite elle-même.", poids: 3, tags: [mercato]}}, answer: "Onze lignes, une virgule bien placée. Elle l'avait écrite en trois jours."}

  # -------------------------------------------------- la mère de Mbako, −3 / +3
  - id: co.mere_mbako.trahison_lea
    roles: [entraineur, joueur]
    arc: presse
    tags: [presse, famille, risk:tribunes]
    speaker: mere_mbako
    tone: strategique
    once: true
    text: "La mère de Mbako, au téléphone, chaque mot pesé comme un chiffre : « La journaliste de L'Écho voulait trois choses sur vous. Je les avais notées, avec les dates. Elle les a depuis ce matin. »"
    left: {label: "Je lis l'article", effects: {tribunes: "--", direction: "-", enemy: [mere_mbako], journal: {text: "{annee} : trois choses racontées à la presse par la mère du petit. Les trois étaient vraies.", poids: 3, tags: [presse, famille]}}, answer: "Trois choses. Les trois sont vraies, et c'est ce qui fait mal."}
    right: {label: "Je lis l'article", effects: {tribunes: "--", direction: "-", enemy: [mere_mbako], journal: {text: "{annee} : trois choses racontées à la presse par la mère du petit. Les trois étaient vraies.", poids: 3, tags: [presse, famille]}}, answer: "Trois choses. Les trois sont vraies, et c'est ce qui fait mal."}

  - id: co.mere_mbako.faveur_numero
    roles: [entraineur, joueur]
    arc: mercato
    tags: [mercato, famille, rescue:direction]
    speaker: mere_mbako
    tone: strategique
    once: true
    text: "La mère de Mbako te tend un papier plié en quatre, sans en lâcher le coin : « Mon numéro direct. Ni le club ni Fardelli ne l'ont. Le jour où on voudra vendre mon fils dans votre dos, appelez. »"
    left: {label: "Je ne le donnerai pas", effects: {direction: "++", vestiaire: "+", journal: {text: "{annee} : le numéro direct de la mère du petit, plié en quatre, dans la poche de {nom}.", poids: 2, tags: [mercato, famille]}}, answer: "Un papier plié en quatre. Il ne quittera pas la poche intérieure."}
    right: {label: "Pourquoi moi ?", effects: {direction: "+", relation: {mere_mbako: -1}}, answer: "« Parce que vous l'avez regardé jouer avant de regarder son prix. » Elle reprend le papier, puis le rend."}

  # --------------------------------------------------------- Fardelli, −3 / +3
  - id: co.fardelli.trahison_signe_ailleurs
    roles: [entraineur, joueur]
    arc: mercato
    tags: [agents, mercato, risk:direction]
    speaker: fardelli
    tone: strategique
    once: true
    text: "Fardelli, au téléphone, onze heures, un couloir d'hôtel derrière lui : « C'est signé depuis trois heures du matin, ailleurs. Vous dormiez, {toi}. Je vous le dis avant les journaux, par politesse. »"
    left: {label: "Je demande où", effects: {direction: "--", caisse: "-", enemy: [fardelli], journal: {text: "{annee} : signé ailleurs pendant la nuit. L'agent a appelé {nom} à onze heures, pour le dire.", poids: 3, tags: [agents, mercato]}}, answer: "Il donne la ville, pas le nom. Le nom, c'est pour les amis."}
    right: {label: "Je ne demande rien", effects: {direction: "--", caisse: "-", enemy: [fardelli], journal: {text: "{annee} : signé ailleurs pendant la nuit. L'agent a appelé {nom} à onze heures, pour le dire.", poids: 3, tags: [agents, mercato]}}, answer: "Il donne la ville quand même, pas le nom. Le nom, c'est pour les amis."}

  - id: co.fardelli.faveur_premier_appel
    roles: [entraineur, joueur]
    arc: mercato
    tags: [agents, mercato, rescue:caisse]
    speaker: fardelli
    tone: strategique
    once: true
    text: "Fardelli, le carnet ouvert sur la table du café, sept heures dix : « Trois clubs sur la même page, {toi}. Tu es mon premier appel. Le président sera le quatrième. »"
    left: {label: "Je t'écoute", effects: {caisse: "++", direction: "+", journal: {text: "{annee} : trois clubs sur une page de carnet. {nom} a été le premier appel, pour une fois.", poids: 2, tags: [agents, mercato]}}, answer: "Il compose devant toi. Le deuxième numéro décroche tout de suite."}
    right: {label: "Pourquoi moi d'abord ?", effects: {caisse: "+", relation: {fardelli: -1}}, answer: "« Tu m'as rendu un service, un jour. Je ne dis pas lequel. » Il referme le carnet avant que tu voies la page."}

  # ------------------------------------------------------------------ Massenet, +3
  - id: co.meneche.faveur_enterre
    roles: [entraineur, joueur]
    arc: presse
    tags: [presse, rescue:tribunes]
    speaker: meneche
    tone: strategique
    once: true
    text: "Massenet, au bar de l'hôtel, tard, une enveloppe fermée sous la main : « J'ai un dossier sur vous, {toi}. Je l'enterre ce soir. Je vous le dis pour que vous sachiez qu'il existe, et qui le tient. »"
    left: {label: "Merci", effects: {tribunes: "+", direction: "+", journal: {text: "{annee} : un dossier enterré par le journaliste, et dit à {nom} pour qu'il le sache.", poids: 2, tags: [presse]}}, answer: "Il ne l'ouvre pas. Il te laisse regarder l'épaisseur, c'est tout."}
    right: {label: "Montrez-le-moi", effects: {tribunes: "+", relation: {meneche: -1}}, answer: "« Enterré, c'est fermé. » Il remet l'enveloppe sous son bras et paie les deux verres."}

  # -------------------------------------------------------------- Léa, −3 / +3
  - id: co.lea.trahison_une_question
    roles: [entraineur, joueur]
    arc: presse
    tags: [presse, tribunes, risk:tribunes]
    speaker: lea
    tone: strategique
    once: true
    text: "Léa, la dernière en zone mixte, magnéto allumé, carnet fermé : « Une seule question. Vous saviez ? Avec ou sans votre réponse, c'est la Une de demain. »"
    left: {label: "Je réponds", effects: {tribunes: "---", parole: -1, enemy: [lea], journal: {text: "{annee} : une question, une réponse, une Une. {NOM} tenait sur trois colonnes.", poids: 3, tags: [presse, tribunes]}}, answer: "Tu réponds onze mots. Neuf sont en Une le lendemain."}
    right: {label: "Je réponds", effects: {tribunes: "---", parole: -1, enemy: [lea], journal: {text: "{annee} : une question, une réponse, une Une. {NOM} tenait sur trois colonnes.", poids: 3, tags: [presse, tribunes]}}, answer: "Tu réponds onze mots. Neuf sont en Une le lendemain."}

  - id: co.lea.faveur_vingt_quatre_heures
    roles: [entraineur, joueur]
    arc: presse
    tags: [presse, rescue:direction]
    speaker: lea
    tone: strategique
    once: true
    text: "Léa, au téléphone, la rotative derrière elle : « J'ai l'histoire, avec deux sources. Je la tiens vingt-quatre heures. Après-demain, six heures, elle sort ; d'ici là, vous parlez avant tout le monde. »"
    left: {label: "Merci pour l'avance", effects: {direction: "++", tribunes: "+", journal: {text: "{annee} : vingt-quatre heures d'avance sur un papier de six heures du matin. {nom} n'a pas dormi.", poids: 2, tags: [presse]}}, answer: "Vingt-quatre heures. Tu en passes trois à choisir qui appeler d'abord."}
    right: {label: "Pourquoi me prévenir ?", effects: {direction: "+", relation: {lea: -1}}, answer: "« Parce que vous répondez au téléphone. » Elle raccroche la première."}

  # ----------------------------------------------------------- Vaubourg, −3 / +3
  # Écart d'import assumé : la bible donne une seule sortie à une trahison ; ce
  # palier en a deux, parce que la FIN co_cheque (§ 5.2) est précisément
  # « accepter l'indemnité quand le patron la propose », et que c'est ici
  # qu'elle est proposée.
  - id: co.aulard.trahison_cheque_non_date
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, caisse, risk:direction]
    speaker: aulard
    tone: strategique
    once: true
    text: "Vaubourg arrache un chèque du carnet à souches ; la porte est restée ouverte sur le secrétariat : « Signé. Pas daté, {toi}. Vous le daterez le jour où je vous dirai de partir. »"
    left: {label: "Je ne le prends pas", effects: {direction: "---", parole: 2, set: [cheque_non_date], enemy: [aulard], journal: {text: "{annee} : un chèque non daté refusé dans un bureau du premier étage. Le carnet est resté ouvert.", poids: 3, tags: [direction, caisse]}}, answer: "Le carnet reste ouvert sur le bureau. Personne ne le referme."}
    right: {label: "Je prends le chèque", effects: {caisse: "++", set: [cheque_non_date], end: co_cheque}, answer: "Le chèque est gros. La porte aussi ; Josiane la tient ouverte sans lever les yeux."}

  - id: co.aulard.faveur_rappel
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, rescue:direction]
    speaker: aulard
    tone: strategique
    once: true
    # Correction de relecture : ce palier +3 se jouait pendant que Vaubourg était
    # le patron en poste, et « le jour où ça tombe, tu as un bureau chez moi »
    # n'a aucun sens dit par l'homme qui te paie et dont tu occupes déjà le
    # bureau. La bible (02 § co.aulard.faveur_rappel) le range ailleurs : la
    # table des paliers dit « il te rappelle, **cinq ans après** », la fiche
    # ajoute `statut_ok: [club, rival, retraite]` — c'est-à-dire tout sauf
    # « votre président ». La garde le dit avec ce que le moteur sait : tu as
    # changé de club ou de rôle depuis, ou il n'est plus au club. Le `statut_ok`
    # accompagne la garde pour le jour où une carte le fera partir.
    statut_ok: [rival, retraite, parti]
    when: "stats.clubs >= 2 || role_was('joueur') || chars.aulard.statut != 'present'"
    text: "Vaubourg, au téléphone, après minuit, sans bonjour : « Je t'ai mis dehors, {toi}, je sais. Le jour où ça retombe pour toi, il y a un bureau chez moi. Avec une fenêtre. Je raccroche, on m'attend. »"
    left: {label: "Je garde le numéro", effects: {direction: "++", relation: {aulard: 1}, set: [aulard_rappelle], journal: {text: "{annee} : « Je vire souvent, je rappelle toujours. » Vaubourg a promis un bureau à {nom}.", poids: 3, tags: [direction]}}, answer: "Il raccroche. Josiane note l'heure : c'est une promesse, elle les date."}
    right: {label: "Je n'en aurai pas besoin", effects: {direction: "+", tribunes: "+", parole: 1, set: [aulard_rappelle], journal: {text: "{annee} : Vaubourg a offert un bureau à {nom}, qui a dit non. Il a noté quand même.", poids: 2, tags: [direction]}}, answer: "Il rit. Il garde le bureau libre quand même."}

  # ----------------------------------------------------------- Ilyas, −3 / +3
  - id: co.nassir.trahison_notification
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, caisse, risk:direction]
    speaker: nassir
    tone: strategique
    once: true
    text: "Ilyas tourne l'écran vers toi, sans un mot de plus que nécessaire : « Deux lignes de notification. À compter de midi, vous ne faites plus partie du périmètre du fonds. »"
    left: {label: "Je lis les deux lignes", effects: {direction: "---", caisse: "-", enemy: [nassir], journal: {text: "{annee} : deux lignes de notification, et {nom} sort du périmètre. L'écran s'est éteint tout seul.", poids: 3, tags: [direction]}}, answer: "Deux lignes, une virgule. L'écran s'éteint avant que tu répondes."}
    right: {label: "Je lis les deux lignes", effects: {direction: "---", caisse: "-", enemy: [nassir], journal: {text: "{annee} : deux lignes de notification, et {nom} sort du périmètre. L'écran s'est éteint tout seul.", poids: 3, tags: [direction]}}, answer: "Deux lignes, une virgule. L'écran s'éteint avant que tu répondes."}

  - id: co.nassir.faveur_un_club
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, caisse, rescue:caisse]
    speaker: nassir
    tone: strategique
    once: true
    text: "Ilyas, l'écran tourné vers toi, un tableau de dix lignes : « La dernière ligne, c'est un club. Le fonds l'a acheté ce matin. J'ai pensé à vous en signant. »"
    left: {label: "J'accepte", effects: {direction: "++", caisse: "++", journal: {text: "{annee} : un club acheté pour {nom}, en bas d'un tableau, un mardi, au téléphone, haut-parleur ouvert.", poids: 3, tags: [direction, caisse]}}, answer: "Le contrat fait quatre pages, déjà paraphées. Le club a un nom que tu ne connaissais pas la veille."}
    right: {label: "Pourquoi moi ?", effects: {direction: "+", relation: {nassir: -1}}, answer: "« Parce que vous êtes une ligne lisible. » Il éteint l'écran, et garde le tableau."}

  # ---------------------------------------------------------- Josiane, −3 / +3
  - id: co.josiane.trahison_sous_les_autres
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, risk:direction]
    speaker: josiane
    tone: strategique
    once: true
    text: "Madame Josiane, la porte fermée, ce qui n'arrive jamais, une pile de chemises devant elle : « Votre dossier, je viens de le ranger sous les autres. Il y restera. »"
    left: {label: "Je regarde la pile", effects: {direction: "--", vestiaire: "-", enemy: [josiane], journal: {text: "{annee} : le dossier de {nom} rangé sous les autres, un vendredi, sans commentaire.", poids: 2, tags: [direction]}}, answer: "La pile fait onze centimètres. Le tien est tout en bas, sous celui de ton prédécesseur."}
    right: {label: "Je regarde la pile", effects: {direction: "--", vestiaire: "-", enemy: [josiane], journal: {text: "{annee} : le dossier de {nom} rangé sous les autres, un vendredi, sans commentaire.", poids: 2, tags: [direction]}}, answer: "La pile fait onze centimètres. Le tien est tout en bas, sous celui de ton prédécesseur."}

  # Bible ch. 30 § 3.2 — « La seule qui sait » : le face-à-face transversal.
  - id: co.josiane.faveur_classeur
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, objet, rescue:direction]
    speaker: josiane
    tone: strategique
    once: true
    text: "Madame Josiane, un classeur vert sur les genoux, un café à deux sucres posé à côté : « Je le garde depuis 1987, pour le jour où quelqu'un en aurait besoin. Vous le lisez ici, et il ne sort pas. »"
    left: {label: "Je le lis ici", effects: {direction: "++", set: [classeur_josiane], journal: {text: "{annee} : douze pages dans un classeur vert, lues sur place. La signature n'était pas celle de {nom}.", poids: 3, tags: [direction, objet]}}, answer: "Douze pages, trois dates, une signature qui n'est pas la tienne."}
    right: {label: "Pourquoi moi ?", effects: {direction: "+", relation: {josiane: -1}}, answer: "Elle referme le classeur. « Parce que vous avez dit bonjour », et elle sort."}

  # ----------------------------------------------------------- Aubert, −3 / +3
  - id: co.aubert.trahison_subvention
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, caisse, risk:caisse]
    speaker: aubert
    tone: strategique
    once: true
    text: "Madame Aubert, en séance du conseil, lit sans te regarder : « Point quatre : la subvention au club est supprimée pour l'exercice, à l'unanimité moins une voix. Point cinq : les trottoirs. »"
    left: {label: "Je note la date", effects: {caisse: "---", direction: "-", enemy: [aubert], journal: {text: "{annee} : subvention coupée en séance du conseil. Le compte rendu tient en une ligne.", poids: 3, tags: [direction, caisse]}}, answer: "Le compte rendu tient en une ligne. Elle a fait relire la ligne."}
    right: {label: "Je note la date", effects: {caisse: "---", direction: "-", enemy: [aubert], journal: {text: "{annee} : subvention coupée en séance du conseil. Le compte rendu tient en une ligne.", poids: 3, tags: [direction, caisse]}}, answer: "Le compte rendu tient en une ligne. Elle a fait relire la ligne."}

  - id: co.aubert.faveur_ministere
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, rescue:direction]
    speaker: aubert
    tone: strategique
    once: true
    text: "Madame Aubert, la main sur le combiné, sous un ruban encadré : « Le cabinet du ministre est en ligne. Il ne décroche que pour moi. Là, il décroche pour vous ; on s'en souviendra tous les deux. »"
    left: {label: "Merci, madame la maire", effects: {direction: "++", caisse: "+", journal: {text: "{annee} : le ministère a décroché pour {nom}. La maire a gardé la main sur le combiné.", poids: 2, tags: [direction]}}, answer: "Elle passe le combiné sans lâcher le fil. Ça dure quatre minutes."}
    right: {label: "Ça me coûte quoi ?", effects: {direction: "+", relation: {aubert: -1}}, answer: "« Une inauguration. » Elle repose le combiné et note une date."}

  # ---------------------------------------------------------- Berthomier, −3 / +3
  - id: co.legruet.trahison_avant_toi
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, risk:direction]
    speaker: legruet
    tone: strategique
    once: true
    text: "Berthomier, dans un couloir de la Fédération, sans s'arrêter de marcher : « La commission s'est réunie à huit heures, sans ordre du jour. Elle a nommé quelqu'un d'autre. Je comptais vous le dire. »"
    left: {label: "Je le félicite", effects: {direction: "--", tribunes: "-", enemy: [legruet], journal: {text: "{annee} : la Fédération a nommé quelqu'un d'autre avant de prévenir {nom}. Le couloir était long.", poids: 3, tags: [direction]}}, answer: "Il te le dit dans un couloir. Le couloir fait quarante mètres."}
    right: {label: "Je le félicite", effects: {direction: "--", tribunes: "-", enemy: [legruet], journal: {text: "{annee} : la Fédération a nommé quelqu'un d'autre avant de prévenir {nom}. Le couloir était long.", poids: 3, tags: [direction]}}, answer: "Il te le dit dans un couloir. Le couloir fait quarante mètres."}

  - id: co.legruet.faveur_les_districts
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, rescue:tribunes]
    speaker: legruet
    tone: strategique
    once: true
    text: "Berthomier te prend le bras, ce qu'il ne fait jamais : « Trois cents districts se sont levés ce matin au Congrès, {toi}. Pour vous. J'avais dit à Roux de compter. Il a compté juste, pour une fois. »"
    left: {label: "Merci, président", effects: {direction: "++", tribunes: "+", journal: {text: "{annee} : trois cents districts se sont levés au Congrès pour {nom}. Deux sont restés assis.", poids: 3, tags: [direction]}}, answer: "Trois cents mains levées, deux restées baissées. Il compte les deux."}
    right: {label: "Qui a voté contre ?", effects: {direction: "+", relation: {legruet: -1}}, answer: "« Deux. Je vous les nommerai à l'élection suivante. » Il sourit et regarde ailleurs."}
