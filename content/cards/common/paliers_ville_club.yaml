    speaker: pelissou
    tone: strategique
    once: true
    text: "Raoul t'emmène dans la chambre froide et referme la porte. « Ici, pas de téléphone qui passe, pas de micro qui tienne. Le jour où vous devrez parler sans que personne entende, c'est ici. »"
    left:
      label: "Merci, Raoul"
      effects: {direction: "++", vestiaire: "+", journal: {text: "{annee} : Raoul Pélissou a ouvert à {nom} sa chambre froide, le seul endroit de la ville où rien ne s'entend.", poids: 3, tags: [direction]}}
