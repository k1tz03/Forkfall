      answer: "Rien de faux. Un plat du jour avec un agent, un dessert avec un adjoint au maire. À la brasserie, la table du fond n'est plus jamais libre pour toi."

  - id: vi.pelissou.faveur
    roles: [ds, president, selectionneur]
    arc: direction
