# Cartes-réactions communes (spec variété §1.4, §2.3) : servies AU TIRAGE
# SUIVANT le swipe qui les pose (effet `react:` d'un choix, ou `react:` d'une
# manchette de unes.yaml), hors créneau (bande 8), sans avancer le beat, le
# slot ni `ncards`. Le build dérive `kind: reaction` de toute carte citée par
# un `react` : ne pas écrire `kind:`. Une réaction a un `speaker` obligatoire,
# jamais `end`, jamais `react`, jamais `tone: drame`, des effets petits ;
# deux sorties identiques = un seul bouton. Plafond 4 par saison, jamais deux
# d'affilée. Une même réaction peut être citée par plusieurs déclencheurs.
#
# Déclencheur côté carte source (script, étape, palier, alarme, événement) :
#   effects: { …, react: en.re.josiane_chauffage }
#   effects: { …, react: [ { card: en.re.aulard_sms_brouillon, if: "relation.aulard >= 0" }, { card: en.re.josiane_numero } ] }
#   (la dernière variante n'a pas de `if` ; `chance: 0.5` consomme 1 tirage seulement si présent)
# Les réactions propres à un rôle vivent dans content/cards/<role>/reactions.yaml
# (`<role>.re.<qui>_<quoi>`) ; ici, les `co.re.*` posées par la Une : quelqu'un
# a lu le journal. Une réaction `once` (Josiane) est guardée par `!seen()` dans
# le `react` de la manchette, sinon elle serait perdue (miss_reaction).
cards:
  # Toute manchette de priorité ≥ 2 (react de la Une) : Josiane a lu le journal.
  - id: co.re.josiane_a_lu
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, presse]
    speaker: josiane
    tone: leger
    once: true
    text: "Madame Josiane, le journal plié en quatre : « J'ai lu. Je l'ai rangé sous les autres. J'en ai vu passer, vous savez. »"
    left:
      label: "Merci, Josiane"
      effects: {direction: "+", relation: {josiane: 1}}
      answer: "Elle en garde un exemplaire. Pour le dossier."
    right:
      label: "Rangez-le sous les autres"
      effects: {direction: "+", relation: {josiane: 1}}
      answer: "Elle en garde un exemplaire. Pour le dossier."

  # Une manchette, Gigi dans le couloir : il garde celle-là.
  - id: co.re.vecchio_garde
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, presse]
    speaker: vecchio
    tone: leger
    text: "Vecchio, le journal sous le bras avec les gants : « J'en ai vu d'autres, des Unes. Celle-là, je la garde. Pas pour moi. »"
    left:
      label: "Garde-la, Gigi"
      effects: {vestiaire: "+", relation: {vecchio: 1}}
      answer: "Il la plie dans le sac, entre les deux gants. Elle y restera."
    right:
      label: "Garde-la, Gigi"
      effects: {vestiaire: "+", relation: {vecchio: 1}}
      answer: "Il la plie dans le sac, entre les deux gants. Elle y restera."

  # Une manchette, Camille a lu le journal. Tout le quartier aussi.
  - id: co.re.camille_journal
    roles: [entraineur, joueur]
    arc: famille
    tags: [famille, presse]
    speaker: camille
    tone: leger
    when: "!flag('divorce')"
    text: "Camille, le journal ouvert sur la table : « Tu rentres à quelle heure ? J'ai lu le journal. La boulangère aussi. Elle m'a fait un prix. »"
    left:
      label: "Je rentre tôt"
      effects: {relation: {camille: 1}, direction: "-"}
      answer: "Tu rentres tôt. Le journal est encore sur la table. Elle a entouré ton nom."
    right:
      label: "Ne le lis pas"
      effects: {relation: {camille: -1}, vestiaire: "+"}
      answer: "Elle l'a déjà lu deux fois. La deuxième, à voix haute, pour le chat."

  # Une manchette, Gégé l'a découpée pour le local. Le mur se remplit lentement :
  # `since` tient un cran d'une saison et demie entre deux découpages, sinon la
  # même phrase revient deux Bilans de suite, usée et fausse (le mur, lui, a
  # changé). Les ciseaux ne sortent pas à chaque Une.
  - id: co.re.gege_decoupe
    roles: [entraineur, joueur]
    arc: ultras
    tags: [ultras, presse]
    speaker: gege
    tone: leger
    when: "since('co.re.gege_decoupe') >= 24"
    text: "Gégé, des ciseaux à la main : « On a découpé la Une. Elle est au local, au-dessus du bar, à côté des autres. La tribune n'oublie rien. »"
    left:
      label: "Je passerai la voir"
      effects: {tribunes: "+", direction: "-"}
      answer: "Elle est là, entre une coupure de 1987 et une facture de bière."
    right:
      label: "Laissez-la sécher"
      effects: {tribunes: "+", direction: "-"}
      answer: "Elle est là, entre une coupure de 1987 et une facture de bière."

  # Deuxième et troisième découpage : le rituel le plus visible du virage ne
  # peut pas revenir avec la même phrase à chaque Bilan (spec variété §5.3).
  # Les appelants les tirent sur `seen()`, la dernière variante sans `if`.
  - id: co.re.gege_decoupe_1987
    roles: [entraineur, joueur]
    arc: ultras
    tags: [ultras, presse]
    speaker: gege
    tone: leger
    when: "since('co.re.gege_decoupe_1987') >= 24"
    text: "Gégé, des ciseaux à la main : « Celle-là, on l'a punaisée à côté de 1987 ; c'est la seule qu'on ait sous verre. La tribune n'oublie rien. »"
    left:
      label: "Mettez-la sous verre"
      effects: {tribunes: "+", relation: {gege: 1}}
      answer: "Il ne la met pas sous verre. Il déplace 1987 de deux centimètres, pour faire de la place."
    right:
      label: "1987, c'était mieux"
      effects: {tribunes: "+", direction: "-"}
      answer: "Il rit, puis il ne rit plus. « 1987, on est descendus », dit-il en punaisant quand même."

  - id: co.re.gege_decoupe_mur
    roles: [entraineur, joueur]
    arc: ultras
    tags: [ultras, presse]
    speaker: gege
    tone: leger
    when: "since('co.re.gege_decoupe_mur') >= 24"
    text: "Gégé, des ciseaux à la main : « Le mur est plein, alors on a décroché une facture de bière pour te faire de la place. La tribune n'oublie rien. »"
    left:
      label: "Décrochez la facture"
      effects: {tribunes: "+", direction: "-"}
      answer: "Il la décroche. Il la range dans le tiroir du bar, avec les autres factures, qu'il garde aussi."
    right:
      label: "Gardez la facture"
      effects: {tribunes: "+", relation: {gege: 1}}
      answer: "Il garde la facture et punaise la Une par-dessus. On voit encore un coin du montant."
