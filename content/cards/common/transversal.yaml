# Cartes transversales (les deux rôles) : le décor, les sponsors, la presse.
#
# ── Champs et effets ajoutés par le lot « personnages à état » ───────────────
# `statut_ok: [parti, retraite, mort]` (carte ou étape d'arc, spec variété
# §1.10) : par défaut, un locuteur dont le statut n'est ni `present`, ni `club`,
# ni `staff` **ne parle plus** (sa carte sort du tirage, son entrée en file est
# purgée). `statut_ok` rouvre les statuts qui la laissent servir : le coup de
# fil de Gigi parti, la lettre du mort, l'ancien passé chez le rival.
#
# `char: { mbako: { statut: vendu } }` (effet d'un choix) : pose le statut d'un
# personnage — `present | club | staff | vendu | parti | retraite | rival |
# mort` — et/ou son âge (`age: "+1"` déplace, `age: 17` pose). Forme courte :
# `char: {mbako: vendu}`. Les `when` le lisent : `chars.mbako.statut ==
# 'vendu'`, `chars.vecchio.age >= 44` ; les textes aussi : « J'ai
# {age_vecchio} ans. »
#
# `club: { change: true, division: 2 }` (effet d'un choix, spec variété §1.11) :
# nouveau club et nouvelle ville **sans changer de rôle** — la vente forcée de
# la pépite, l'exil doré. Le moteur recale les jauges (vestiaire 50, direction
# 55, tribunes 40 + 0,3 × anciennes, caisse conservée), incrémente `clubSeq`
# (les étapes `same_club` en attente deviennent des « Nouvelles du passé »),
# jette la réaction en attente, écrit la ligne d'Almanach `club_change` et
# programme les retrouvailles des deux visages à |relation| maximale.
cards:
  - id: co.presse.derby
    roles: [entraineur, joueur]
    arc: divers
    tags: [ultras]
    speaker: gege
    cooldown: 20
    text: "Gégé, chef de tribune : « Derby dimanche. Perdre, c'est pas une option. Tu fais quoi de ta semaine ? »"
    left: {label: "Mise au vert, sans portable", effects: {force: "+", vestiaire: "-"}}
    right: {label: "Semaine normale", effects: {tribunes: "-"}}

  - id: co.sponsor.maillot   # côté entraîneur, remplacée par en.nassir.maillot (arc C)
    roles: [joueur]
    arc: sponsors
    tags: [sponsors, absurde]
    speaker: nassir
    cooldown: 30
    text: "Cheikh Ilyas : « Nous aimerions le maillot orange fluo. Comme notre boisson. »"
    left: {label: "Le maillot est sacré", effects: {caisse: "-", tribunes: "+"}}
    right: {label: "Va pour l'orange", effects: {caisse: "++", tribunes: "--"}}

  - id: co.famille.belle_maman
    roles: [entraineur, joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    cooldown: 25
    text: "Camille : « Le repas chez ma mère, c'est le jour du match. Choisis. »"
    left: {label: "Je viens au repas", effects: {vestiaire: "-", tribunes: "-"}}
    right: {label: "C'est un match", effects: {tribunes: "+"}, answer: "Camille ne répond plus à tes messages."}

  # --- Script générique (arcs/common/generique.yaml) : les deux ancres de saison.
  # Ces deux ancres sont rejouées à CHAQUE saison ("0+") de tout postulat dont le
  # script s'est arrêté — c'est le cas de « Fin de contrat » dès que le joueur
  # passe entraîneur au Carrefour (deux carrières sur trois). Sans variante,
  # elles servaient la même réplique de Josiane au slot 1 et la même de Vukić au
  # slot 17, saison après saison : mesuré sur 40 traces de trois saisons, dix
  # rejouaient la rentrée et huit la veille. La spec § 1.2 exige ≥ 2 variantes
  # par ancre de script ; l'escalier se lit sur `season` et sur les traces du
  # postulat quitté (`vers_entraineur`, `banc_regarde`, `recule_poste`).
  # Ordre : le contexte d'abord (une fois, drapeau `_vu`), puis les marches.
  - id: co.script.rentree
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction]
    speaker: josiane
    tone: leger
    cooldown: 0
    text: "Madame Josiane, un café à la main : « Nouvelle saison. Le radiateur marche, c'est la seule nouvelle. J'en ai vu passer, vous savez. »"
    left: {label: "Un café, et les comptes", effects: {direction: "+"}, answer: "Elle sort le classeur. Il est plus épais que l'an dernier."}
    right: {label: "Un café, et le terrain", effects: {vestiaire: "+"}, answer: "Elle range le classeur. Elle le garde à portée de main."}

  - id: co.script.veille
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: vukic
    tone: strategique
    cooldown: 0
    text: "Vukić, la veille du dernier bloc : « Je te le dis parce que personne ne te le dira : le président a deux discours prêts. »"
    left: {label: "On joue le nôtre", effects: {vestiaire: "+", force: 1}, answer: "Le vestiaire connaît le plan. Le président non."}
    right: {label: "On joue le sien", effects: {direction: "+", vestiaire: "-"}, answer: "Le président range un discours. Il garde l'autre."}

  - id: co.script.rentree_encore
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction]
    speaker: josiane
    tone: leger
    cooldown: 0
    text: "Madame Josiane, le même café, le classeur déjà sorti : « Le radiateur a lâché en février, on a mis un pull sur la chaise. Deuxième saison : vous voulez le classeur, ou le pull ? »"
    left: {label: "Le classeur", effects: {direction: "+"}, answer: "Elle l'ouvre à la page de février. Le pull reste sur la chaise ; il y est encore l'année d'après."}
    right: {label: "Le pull", effects: {vestiaire: "+"}, answer: "Elle te tend le pull. Il est trop grand ; il a servi à trois personnes avant toi, elle donne les noms."}

  - id: co.script.rentree_troisieme
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction]
    speaker: josiane
    tone: leger
    cooldown: 0
    text: "Madame Josiane, sans café cette fois : « J'en ai vu passer, je vous l'ai déjà dit. Vous, je vous ai vu rester. On refait les comptes de zéro, ou on repart de l'an dernier ? »"
    left: {label: "De zéro", effects: {direction: "+", caisse: "-"}, answer: "Elle recommence à la première ligne. À midi elle en est à mars ; elle avait raison, l'an dernier était juste."}
    right: {label: "De l'an dernier", effects: {caisse: "+", direction: "-"}, answer: "Elle repart de sa colonne. Personne ne vérifie ; personne n'a jamais vérifié."}

  - id: co.script.rentree_survetement
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, vestiaire]
    speaker: josiane
    tone: strategique
    cooldown: 0
    text: "Madame Josiane, une pile de survêtements sur le comptoir : « Vous n'êtes plus sur la feuille de match, alors vous êtes sur la mienne. Je vous mets où : au budget, ou aux clés du terrain ? »"
    left: {label: "Au budget", effects: {direction: "+", vestiaire: "-", set: [rentree_survet_vu]}, answer: "Elle t'inscrit au budget. Tu apprends le prix d'un jeu de chasubles ; tu ne l'oublieras plus."}
    right: {label: "Aux clés du terrain", effects: {vestiaire: "++", direction: "-", set: [rentree_survet_vu]}, answer: "Elle te donne les clés. Il y en a onze ; deux n'ouvrent plus rien, elle ne sait plus lesquelles."}

  - id: co.script.rentree_quatrieme
    roles: [entraineur, joueur]
    arc: direction
    tags: [direction, moment]
    speaker: josiane
    tone: leger
    cooldown: 0
    text: "Madame Josiane, la porte du secrétariat ouverte avec le pied : « Le radiateur, on l'a changé. C'est la nouvelle. On accroche votre photo au couloir, ou on laisse le mur ? »"
    left: {label: "Accrochez", effects: {tribunes: "+", direction: "-"}, answer: "Elle accroche. La photo est de la deuxième saison ; c'est celle qu'elle préfère, elle ne dit pas pourquoi."}
    right: {label: "Laissez le mur", effects: {vestiaire: "+"}, answer: "Elle range le cadre dans le placard, avec les autres. Il y en a six ; elle les connaît dans l'ordre."}

  - id: co.script.veille_encore
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: vukic
    tone: strategique
    cooldown: 0
    text: "Vukić, la veille du dernier bloc, le cahier fermé : « Cette année le président n'a qu'un discours, et je te le dis parce que personne ne te le dira : c'est le mauvais. On le devance, ou il le lit ? »"
    left: {label: "On le devance", effects: {vestiaire: "+", direction: "-"}, answer: "Tu parles avant lui. Il lit quand même, à trois personnes, dans le couloir."}
    right: {label: "Qu'il le lise", effects: {direction: "+", vestiaire: "-"}, answer: "Il le lit. Le vestiaire écoute debout ; deux joueurs regardent leurs crampons pendant tout le passage sur l'honneur."}

  - id: co.script.veille_troisieme
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vukic
    tone: strategique
    cooldown: 0
    text: "Vukić, la veille, le cahier ouvert à une page pleine : « Trois ans que je note la veille. Tu veux savoir ce que tu as dit les deux fois d'avant, ou tu préfères pas ? »"
    left: {label: "Lis-moi ça", effects: {vestiaire: "+", parole: 1}, answer: "Il lit. C'est la même phrase, à un mot près. Le mot qui change est celui qui compte, et il le souligne."}
    right: {label: "Je préfère pas", effects: {direction: "+", vestiaire: "-"}, answer: "Il referme. Il note la date quand même, et à côté : « n'a pas voulu »."}

  - id: co.script.veille_banc
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vukic
    tone: strategique
    cooldown: 0
    text: "Vukić, la veille, deux gobelets sur le muret : « Tu as changé de côté de la ligne blanche, et d'ici on voit tout, sauf le score. Tu regardes le match debout, ou assis avec moi ? »"
    left: {label: "Debout", effects: {tribunes: "+", vestiaire: "-", set: [veille_banc_vu]}, answer: "Tu restes debout tout le match. Le quatrième arbitre te le dit deux fois ; la deuxième, il sourit."}
    right: {label: "Assis, avec toi", effects: {vestiaire: "+", direction: "+", relation: {vukic: 1}, set: [veille_banc_vu]}, answer: "Tu t'assois. Il te passe le gobelet et le cahier ; le cahier d'abord."}

  - id: co.script.veille_quatrieme
    roles: [entraineur, joueur]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: vukic
    tone: leger
    cooldown: 0
    text: "Vukić, la veille, le même muret : « Le président a fait imprimer les deux discours cette année, pour gagner du temps. J'en ai récupéré un à la photocopieuse. Tu le lis, ou on le brûle ? »"
    left: {label: "Fais voir", effects: {direction: "-", parole: 1}, answer: "Tu lis celui qui commence par « après mûre réflexion ». Tu sais maintenant lequel il garde en poche."}
    right: {label: "On le brûle", effects: {vestiaire: "+", direction: "+"}, answer: "Vous ne le brûlez pas ; vous le laissez sur la photocopieuse, à l'endroit. Le lendemain il n'y est plus."}

  # --- « Nouvelles du passé » : une affaire d'un ancien club refait surface (effets = épilogue de l'arc).
  # `once` : le moteur met cette carte en file à chaque intrigue abandonnée pour
  # changement de club, et une carrière en abandonne deux ou trois. Le même fax,
  # la même secrétaire, la même phrase deux ou trois fois par carrière : c'est le
  # cadre qui s'use, pas l'affaire qu'il nomme. Le fax ne sort donc qu'une fois ;
  # les abandons suivants sont racontés par les vingt Nouvelles du passé nommées
  # (content/cards/common/nouvelles_du_passe.yaml), qui vivent dans le sac et
  # donnent la parole à quelqu'un d'autre. La ligne d'Almanach de l'intrigue
  # abandonnée, elle, est écrite avant la mise en file : rien ne se perd.
  - id: tr.nouvelles_du_passe
    roles: [entraineur, joueur]
    arc: nouvelle
    kind: passe
    tags: [nouvelle]
    speaker: josiane
    tone: leger
    once: true
    cooldown: 0
    text: "Madame Josiane, un fax à la main : « Une vieille affaire — {passe_titre} — refait surface. Ça ne vous concerne plus. Presque. »"
    left: {label: "Tourner la page", effects: {}}
    right: {label: "Tourner la page", effects: {}}
