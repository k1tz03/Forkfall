# Histoire 6 — « 23 h 58 » : les Nouvelles datées de la directrice sportive,
# 2003-2007 (`arc: nouvelle`, `once`, `year`, un seul bouton : deux sorties
# identiques). Le monde autour du fax : les droits télévisés, Massenet à la
# télévision, l'oreillette des arbitres, Vogler en Vestrie, la salle de classe
# du centre, les commissions déclarées, la retraite de Barbier, le Flux. Les
# faits du monde qu'elles reprennent sont ceux de content/cards/common
# (nouvelles_datees.yaml, epoque_2000.yaml) : mêmes dates, autres témoins.
cards:
  # ───────────────────────────────────────────────────────────────── 2003
  - id: ds.h6.nv.2003_droits
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: arnaud_vaubourg
    tone: leger
    once: true
    year: 2003
    when: "flag('histoire_h6')"
    text: "Arnaud Vaubourg pose devant toi la lettre de la Ligue. Médiacrash rachète les droits télé, deux fois ce que payait Télé-Stade. « Mon père a négocié. L'argent arrive en août. Il dit toujours août. »"
    left:  {label: "Je lis la lettre", effects: {caisse: "+", set: [monde_mediacrash]}, answer: "L'argent arrive bien en août, le 31, à 23 h. Josiane note l'heure au crayon sur le relevé."}
    right: {label: "Je lis la lettre", effects: {caisse: "+", set: [monde_mediacrash]}, answer: "L'argent arrive bien en août, le 31, à 23 h. Josiane note l'heure au crayon sur le relevé."}

  - id: ds.h6.nv.2003_massenet_tele
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: meneche
    tone: leger
    once: true
    year: 2003
    when: "flag('histoire_h6')"
    text: "Pierre Massenet a quitté le papier pour Télé-Stade : un fauteuil, une cravate prêtée, quatre minutes le dimanche soir. « À la télé, on ne prend pas de notes, on retient. Je vais devoir apprendre. »"
    left:  {label: "Je regarderai", effects: {tribunes: "+"}, answer: "Dimanche, il tient ses quatre minutes sans regarder ses mains. Il parle de toi à la troisième, sans te nommer."}
    right: {label: "Je regarderai", effects: {tribunes: "+"}, answer: "Dimanche, il tient ses quatre minutes sans regarder ses mains. Il parle de toi à la troisième, sans te nommer."}

  - id: ds.h6.nv.2003_oreillette
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: vukic
    tone: leger
    once: true
    year: 2003
    when: "flag('histoire_h6')"
    text: "Samedi, l'arbitre portait une oreillette, la première qu'on voit à la Rive. Vukić se gratte la nuque. « Ils se parlent dans l'oreille, maintenant. Nous, on crie. Qui gagne, je sais pas encore. »"
    left:  {label: "On criera plus fort", effects: {vestiaire: "+"}, answer: "Au match suivant, le banc crie si fort que l'arbitre ôte son oreillette pour mieux entendre, puis la remet."}
    right: {label: "On criera plus fort", effects: {vestiaire: "+"}, answer: "Au match suivant, le banc crie si fort que l'arbitre ôte son oreillette pour mieux entendre, puis la remet."}

  # ───────────────────────────────────────────────────────────────── 2004
  - id: ds.h6.nv.2004_vestrie
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    tone: leger
    once: true
    year: 2004
    when: "flag('histoire_h6') && season >= 1"
    text: "La Vestrie présente son nouveau sélectionneur : Vogler, casquette aux couleurs du pays. Pendant que le président lit le communiqué, il fait le tour du terrain en courant, sous les flashs."
    left:  {label: "Je lui écris un mot", effects: {vestiaire: "+"}, answer: "Il te répond sur une carte postale de la capitale de Vestrie, trois mots et un dessin de casquette."}
    right: {label: "Je lui écris un mot", effects: {vestiaire: "+"}, answer: "Il te répond sur une carte postale de la capitale de Vestrie, trois mots et un dessin de casquette."}

  - id: ds.h6.nv.2004_ecole
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, formation]
    speaker: tibo_rance
    tone: leger
    once: true
    year: 2004
    when: "flag('histoire_h6')"
    text: "La salle de classe neuve du centre de formation sent la peinture. Au premier rang, Tibo Rancé lève la main pour demander ce que c'est, une clause. Le professeur ne sait pas ; il promet de chercher."
    left:  {label: "J'irai leur expliquer", effects: {tribunes: "+", relation: {tibo_rance: 1}}, answer: "Tu fais une heure sur la clause libératoire devant quatorze gamins. Tibo prend des notes ; il est le seul."}
    right: {label: "J'irai leur expliquer", effects: {tribunes: "+", relation: {tibo_rance: 1}}, answer: "Tu fais une heure sur la clause libératoire devant quatorze gamins. Tibo prend des notes ; il est le seul."}

  - id: ds.h6.nv.2004_formulaire
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: josiane
    tone: leger
    once: true
    year: 2004
    when: "flag('histoire_h6')"
    text: "La Ligue impose de déclarer chaque commission d'agent au-dessus de dix mille écus, sur un formulaire bleu. Madame Josiane en commande cinquante. « Il en faudra cent. Ou aucun, selon qui les remplit. »"
    left:  {label: "Commandez-en cent", effects: {caisse: "-"}, answer: "Cent formulaires bleus arrivent en carton. À Noël, il en reste quatre-vingt-dix-sept dans le placard du couloir."}
    right: {label: "Commandez-en cent", effects: {caisse: "-"}, answer: "Cent formulaires bleus arrivent en carton. À Noël, il en reste quatre-vingt-dix-sept dans le placard du couloir."}

  # ───────────────────────────────────────────────────────────────── 2005
  - id: ds.h6.nv.2005_monsieur
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, formation]
    speaker: barbier
    tone: leger
    once: true
    year: 2005
    when: "flag('histoire_h6')"
    text: "Barbier hausse les épaules : « Les gamins du centre tutoient Vukić, maintenant, et il laisse faire. Le petit stagiaire, lui, me dit encore monsieur. Il le dit à tout le monde, même au téléphone. »"
    left:  {label: "C'est une politesse", effects: {vestiaire: "+"}, answer: "« Une politesse. » Barbier mâche le mot. « Moi, on m'a appris qu'on est poli avec ceux qu'on craint. »"}
    right: {label: "C'est une politesse", effects: {vestiaire: "+"}, answer: "« Une politesse. » Barbier mâche le mot. « Moi, on m'a appris qu'on est poli avec ceux qu'on craint. »"}

  - id: ds.h6.nv.2005_buvette
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    tone: leger
    once: true
    year: 2005
    when: "flag('histoire_h6')"
    text: "La buvette des anciens rouvre le dimanche matin, verres de 1962, bière à un écu. On y parle de tes ventes plus que des matchs ; quelqu'un a écrit les prix à la craie, sur l'ardoise des consommations."
    left:  {label: "Je passe boire un verre", effects: {tribunes: "+", set: [monde_buvette_anciens]}, answer: "On efface l'ardoise quand tu entres, d'un coup de chiffon. Tu bois ta bière ; quelqu'un la paie avant toi."}
    right: {label: "Je passe boire un verre", effects: {tribunes: "+", set: [monde_buvette_anciens]}, answer: "On efface l'ardoise quand tu entres, d'un coup de chiffon. Tu bois ta bière ; quelqu'un la paie avant toi."}

  - id: ds.h6.nv.2005_camera
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, presse]
    tone: leger
    once: true
    year: 2005
    when: "flag('histoire_h6')"
    text: "Télé-Stade filme désormais les tribunes pendant les matchs. Au virage, on a appris en trois samedis à baisser la tête quand le voyant rouge de la caméra s'allume."
    left:  {label: "Je regarde la caméra", effects: {tribunes: "-"}, answer: "La caméra te filme en tribune présidentielle pendant le but adverse. Le plan passe trois fois, au ralenti."}
    right: {label: "Je regarde la caméra", effects: {tribunes: "-"}, answer: "La caméra te filme en tribune présidentielle pendant le but adverse. Le plan passe trois fois, au ralenti."}

  # ───────────────────────────────────────────────────────────────── 2006
  - id: ds.h6.nv.2006_pelouse
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, caisse]
    tone: leger
    once: true
    year: 2006
    when: "flag('histoire_h6')"
    text: "Le devis de la pelouse chauffée arrive sur ton bureau par erreur : des tapis sous l'herbe, des fibres cousues dans le gazon. En marge, l'écriture d'Arnaud : « Après les ventes d'hiver. »"
    left:  {label: "Je le monte au président", effects: {direction: "+"}, answer: "Arnaud le reprend sans un mot, en rougissant, comme un bulletin de notes qu'on n'aurait pas dû voir."}
    right: {label: "Je le monte au président", effects: {direction: "+"}, answer: "Arnaud le reprend sans un mot, en rougissant, comme un bulletin de notes qu'on n'aurait pas dû voir."}

  - id: ds.h6.nv.2006_defaut
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: aulard
    tone: leger
    once: true
    year: 2006
    when: "flag('histoire_h6')"
    text: "Médiacrash n'a pas versé la deuxième échéance des droits. À la Ligue, le père Vaubourg réunit les présidents un dimanche : « Vendez en janvier pour payer mars. Toi, tu sais faire, il paraît. »"
    left:  {label: "Je relis les échéances", effects: {caisse: "--", set: [monde_defaut_droits]}, answer: "Trois clubs vendent leur meilleur joueur la même semaine. Les prix baissent partout ; les tiens étaient déjà en bas."}
    right: {label: "Je relis les échéances", effects: {caisse: "--", set: [monde_defaut_droits]}, answer: "Trois clubs vendent leur meilleur joueur la même semaine. Les prix baissent partout ; les tiens étaient déjà en bas."}

  - id: ds.h6.nv.2006_barbier
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, formation]
    tone: leger
    once: true
    year: 2006
    when: "flag('histoire_h6')"
    text: "Lucien Barbier prend sa retraite à soixante-quatorze ans. Il laisse sa doudoune au portemanteau du centre, « pour le prochain qui aura froid ». Le stagiaire hérite de son bureau, et de ses boîtes."
    left:  {label: "Je garde la doudoune", effects: {vestiaire: "+", char: {barbier: retraite}}, answer: "Elle reste au portemanteau. L'hiver, un gamin la met pour regarder les matchs du dimanche ; elle lui arrive aux genoux."}
    right: {label: "Je garde la doudoune", effects: {vestiaire: "+", char: {barbier: retraite}}, answer: "Elle reste au portemanteau. L'hiver, un gamin la met pour regarder les matchs du dimanche ; elle lui arrive aux genoux."}

  # ───────────────────────────────────────────────────────────────── 2007
  - id: ds.h6.nv.2007_flux
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: lea
    tone: leger
    once: true
    year: 2007
    when: "flag('histoire_h6')"
    text: "Léa a ouvert un compte sur le Flux pour L'Écho : « Tout le monde y écrit, sous son nom ou pas. Hier, un anonyme a écrit à 23 h 58 : MERCI. MERCI. J'ai pensé à vous. »"
    left:  {label: "Je ne lis pas le Flux", effects: {tribunes: "-", set: [monde_flux]}, answer: "Tu ne le lis pas. Tu y penses quand même, chaque soir, deux minutes avant minuit."}
    right: {label: "Je ne lis pas le Flux", effects: {tribunes: "-", set: [monde_flux]}, answer: "Tu ne le lis pas. Tu y penses quand même, chaque soir, deux minutes avant minuit."}
