# « L'Oreillette » (Histoire 8) — les intrigues de la saison 3, « Le silence »
# (content/arcs/ds/h8_intrigues.yaml) : Le petit de Nino (mis en file par la
# canne, ds.h8.c1_canne), puis le réservoir tardif : Le Kambara, Les courbes de
# tout le monde, La ligne qui coûte. Ce qui n'a pas eu le temps de s'ouvrir
# avant 23 h 58 s'ouvre dans l'épilogue : ce sont des conséquences, pas des
# redites.
#
# Après la saisie (ds.h8.c2_propriete, créneau 4), il n'y a plus d'oreillette
# ni d'ordinateur : ces cartes n'ont pas de voix, sauf celle qu'on croit
# entendre. Le terminal du club reste, jusqu'au mercato d'hiver.
#
# Le secret du personnage se paie ici : la règle « fin de cycle » qui a classé
# Kerdal, et qui classe Milo à seize ans, porte tes initiales et la date de
# 2017. Le casting : Milo (le fils de Nino, seize ans), Nino (le capo, voix
# sans portrait), la juge de Valdorne (voix sans portrait).
cards:
  # ================================================== LE PETIT DE NINO
  # ----------------------------------------------- 1 · Le grillage
  # Si Mbako a laissé son sifflet au plus jeune (ds.h8.kb.dernier), le plus
  # jeune, c'était lui.
  - id: ds.h8.mi.grillage_sifflet
    roles: [ds]
    arc: formation
    tags: [formation, tribunes, objet]
    speaker: gege
    lieu: terrain
    tone: leger
    once: true
    text: "Gégé a les doigts dans le grillage des moins de dix-sept ans : « Le petit de Nino. Milo. Seize ans. » Au cou du gamin, le sifflet de Mbako. « Ta machine l'a vu aussi, {toi} ? »"
    left:
      label: "Je regarde sa courbe"
      effects: {direction: "+", tribunes: "-", var: {h8_obei: "+1"}}
      answer: "Rouge depuis ses quatorze ans. Une règle simple : trop de matchs trop tôt, fin de cycle. Elle date de 2017. Tu te rappelles la date."
    right:
      label: "Je le regarde courir"
      effects: {vestiaire: "+", relation: {gege: 1}, var: {h8_refus: "+1"}}
      answer: "Il court, le sifflet battant contre sa poitrine. Il ne s'en sert plus. Gégé : « Il le garde pour le jour où ça comptera. »"

  - id: ds.h8.mi.grillage
    roles: [ds]
    arc: formation
    tags: [formation, tribunes]
    speaker: gege
    lieu: terrain
    tone: leger
    once: true
    text: "Gégé a les doigts dans le grillage du terrain des moins de dix-sept ans : « Le petit de Nino. Milo. Seize ans, il court plus vite que le ballon. Ta machine l'a vu aussi, {toi} ? »"
    left:
      label: "Je regarde sa courbe"
      effects: {direction: "+", tribunes: "-", var: {h8_obei: "+1"}}
      answer: "Rouge depuis ses quatorze ans. Une règle simple : trop de matchs trop tôt, fin de cycle. Elle date de 2017. Tu te rappelles la date."
    right:
      label: "Je le regarde courir"
      effects: {vestiaire: "+", relation: {gege: 1}, var: {h8_refus: "+1"}}
      answer: "Il court plus vite que le ballon, puis il l'attend. Gégé : « Son père faisait pareil. On l'a mis capo pour qu'il arrête. »"

  # ------------------------------------------------ 2 · La ligne de 2017
  - id: ds.h8.mi.ligne
    roles: [ds]
    arc: formation
    tags: [formation, objet]
    lieu: bureau
    tone: strategique
    once: true
    text: "Vingt-deux heures, le terminal du club. La règle « fin de cycle », ouverte. En commentaire, tes initiales et une date : 2017. Une ligne. On peut la réécrire, et le modèle recalculera tout le centre."
    left:
      label: "Je la réécris"
      effects: {vestiaire: "+", direction: "--", set: [h8_regle_changee], var: {h8_refus: "+1"}, outcome: regle}
      answer: "Le modèle recalcule le centre toute la nuit. Au matin, quatorze gamins ne sont plus rouges. Milo n'a plus de couleur du tout."
    right:
      label: "Je ferme le fichier"
      effects: {direction: "+", set: [h8_milo_rouge], outcome: rouge}
      answer: "La ligne reste, avec tes initiales. Le lendemain, deux gamins de plus passent au rouge. Elle travaille très bien sans toi."

  # ------------------------------------------------------ 3 · Nino
  - id: ds.h8.mi.nino_adresse
    roles: [ds]
    arc: formation
    tags: [formation, ultras]
    lieu: domicile
    tone: strategique
    once: true
    text: "Dimanche midi, Nino sonne chez toi, Milo derrière lui en survêtement : « Ton adresse, je l'ai depuis le compte du vieux. Je ne m'en suis jamais servi. Le petit veut rester au club. »"
    left:
      label: "Il restera"
      effects: {tribunes: "++", direction: "-", set: [h8_milo_promis]}
      answer: "Nino serre ta main, puis la garde une seconde de trop. « Je l'ai entendu. Lui aussi. » Milo regarde le palier, pas toi."
    right:
      label: "Ce n'est pas moi qui décide"
      effects: {tribunes: "--", direction: "+"}
      answer: "« Alors c'est qui ? » Il n'attend pas la réponse. Dans l'escalier, Milo demande à son père qui décide. Nino ne répond pas."

  - id: ds.h8.mi.nino
    roles: [ds]
    arc: formation
    tags: [formation, ultras]
    lieu: terrain
    tone: strategique
    once: true
    text: "Nino, le capo, t'attend au grillage, les mains dans les poches : « On dit que ta machine a mis mon fils au rouge. Moi, j'ai mis vingt ans à chanter moins fort. Le petit veut rester. »"
    left:
      label: "Il restera"
      effects: {tribunes: "++", direction: "-", set: [h8_milo_promis]}
      answer: "Il sort enfin les mains de ses poches. « Je l'ai entendu. Le virage aussi, bientôt. » Il ne sourit pas."
    right:
      label: "La machine décide"
      effects: {tribunes: "--", direction: "+"}
      answer: "« Alors je chanterai contre la machine. Elle n'a pas d'oreilles, ça tombe bien. » Il repart par le parking, sans se retourner."

  # ========================================================= LE KAMBARA
  # ------------------------------------------------------ 1 · L'appel
  - id: ds.h8.kb.appel
    roles: [ds]
    arc: selection
    tags: [vestiaire, moment]
    speaker: mbako
    lieu: bureau
    tone: leger
    once: true
    text: "Mbako pose son téléphone sur ton bureau, haut-parleur : la fédération du Kambara, le pays de ses parents, lui offre la sélection. Il raccroche, et attend. « Tu me retiens, {toi} ? »"
    left:
      label: "Je te retiens"
      effects: {vestiaire: "+", direction: "-"}
      answer: "« Avec quoi ? » Il le dit sans colère, en rangeant le téléphone. « Ton fonds a déjà mon remplaçant. Je l'ai vu sur un écran. »"
    right:
      label: "Pars"
      effects: {vestiaire: "-", relation: {mbako: 1}, react: [{card: ds.h8.re.gege_kambara}]}
      answer: "Il regarde ses mains longtemps. « Là-bas, il n'y a pas de courbes. Il y a un terrain en terre et des gamins qui courent pieds nus. »"

  # ------------------------------------------- 2 · Le dernier entraînement
  - id: ds.h8.kb.dernier
    roles: [ds]
    arc: selection
    tags: [vestiaire, objet]
    speaker: mbako
    lieu: terrain
    tone: leger
    once: true
    text: "Dernier entraînement de Mbako. Il ne siffle pas une fois ; il regarde courir. À la fin, il te tend son sifflet, la cordelette roulée autour : « Garde-le, {toi}. Ta machine n'a jamais eu de bouche. »"
    left:
      label: "Je le garde"
      effects: {vestiaire: "+", relation: {mbako: 1}, set: [h8_sifflet]}
      answer: "Le métal est encore chaud de sa main. Tu le mets dans ta poche de poitrine, là où était la montre, et tu le sens battre."
    right:
      label: "Donne-le au plus jeune"
      effects: {vestiaire: "++", set: [h8_sifflet_donne]}
      answer: "Il le passe au cou du plus jeune, un gamin du centre monté pour la séance. Le gamin siffle la fin, une minute trop tôt."

  # --------------------------------------------- 3 · Le car de six heures
  - id: ds.h8.kb.car_bras
    roles: [ds]
    arc: selection
    tags: [vestiaire, moment]
    speaker: mbako
    lieu: gare
    tone: leger
    once: true
    text: "Six heures, le car pour l'aéroport, devant la gare routière. Mbako descend au lieu de monter, et te serre dans ses bras devant le chauffeur : « Regarde-les courir, {toi}. Promets. »"
    left:
      label: "Je promets"
      effects: {vestiaire: "++", relation: {mbako: 1}, set: [h8_mbako_embrasse], char: {mbako: parti}, outcome: embrasse}
      answer: "Il remonte. Par la vitre arrière, il fait le geste de courir avec deux doigts sur la paume, jusqu'au virage du pont."
    right:
      label: "Je regarderai"
      effects: {vestiaire: "+", relation: {mbako: 1}, set: [h8_mbako_embrasse], char: {mbako: parti}, outcome: embrasse}
      answer: "« Ce n'est pas pareil, mais je prends. » Il remonte. Le chauffeur attend que tu sois sur le trottoir pour fermer la porte."

  - id: ds.h8.kb.car
    roles: [ds]
    arc: selection
    tags: [vestiaire, moment]
    speaker: mbako
    lieu: gare
    tone: leger
    once: true
    text: "Six heures, le car pour l'aéroport, devant la gare routière. Mbako te serre la main par la vitre baissée, sans descendre : « Le Kambara joue en août, {toi}. Tu viendras ? »"
    left:
      label: "Je viendrai"
      effects: {vestiaire: "+", relation: {mbako: 1}, set: [h8_mbako_parti], char: {mbako: parti}, outcome: poignee}
      answer: "« Tu ne viendras pas, mais c'est gentil. » Le car démarre. Il garde la main ouverte sur la vitre jusqu'au pont."
    right:
      label: "Je ne voyage plus"
      effects: {direction: "+", set: [h8_mbako_parti], char: {mbako: parti}, outcome: poignee}
      answer: "Il pose la main sur la vitre. « Moi non plus, avant. » Le car démarre. Sur la vitre, la buée de sa main reste plus longtemps que lui."

  # ===================================== LES COURBES DE TOUT LE MONDE
  # -------------------------------------------- 1 · La dernière boîte
  - id: ds.h8.ob.derniere_boite_prise
    roles: [ds]
    arc: corps
    tags: [direction, objet]
    speaker: ober
    lieu: cabinet
    tone: leger
    once: true
    text: "Ober te tend une dernière boîte, sans ordonnance : « Le fonds ne renouvelle pas mon contrat. Prenez celle-là. Après, ce sera un autre docteur, avec d'autres courbes, et les mêmes boîtes. »"
    left:
      label: "Je la prends"
      effects: {direction: "+", var: {h8_obei: "+1"}}
      answer: "Elle tient dans la paume. « Un demi », dit-il encore, par habitude. Puis : « Ou rien. Je ne suis plus votre médecin. »"
    right:
      label: "Gardez-la"
      effects: {vestiaire: "+", relation: {ober: 1}, var: {h8_refus: "+1"}}
      answer: "Il la remet dans un carton, au-dessus des autres. « Je la garde pour moi, alors. Je ne dors pas non plus, vous savez. »"

  - id: ds.h8.ob.derniere_boite
    roles: [ds]
    arc: corps
    tags: [direction, objet]
    speaker: ober
    lieu: cabinet
    tone: leger
    once: true
    text: "Ober met son cabinet en cartons. Il te tend la seule boîte qu'il n'a pas rangée : « Vous ne m'en avez jamais pris. Prenez au moins celle-là. Pour le jour où. »"
    left:
      label: "Je la prends"
      effects: {direction: "+"}
      answer: "Tu la ranges dans le tiroir, à côté de la place où dormait l'oreillette. Les deux tiroirs se ressemblent, maintenant."
    right:
      label: "Gardez-la"
      effects: {vestiaire: "+", relation: {ober: 1}}
      answer: "« Vous avez raison. Le jour où, il n'y a jamais de boîte. » Il la jette dans le carton, avec ses diplômes."

  # ------------------------------------------------- 2 · Les cartons
  - id: ds.h8.ob.cartons
    roles: [ds]
    arc: corps
    tags: [direction, objet]
    speaker: ober
    lieu: cabinet
    tone: leger
    once: true
    text: "Les cartons d'Ober au pied de l'escalier, étiquetés au feutre : COURBES 2019-2026. Le délégué les fait charger dans un camion sans inscription. Ober te tend la décharge : « Vous signez ? »"
    left:
      label: "Je signe"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Le camion part à onze heures. Ober le regarde tourner au bout du quai, puis se frotte le poignet, à l'endroit d'une montre."
    right:
      label: "Je garde un carton"
      effects: {direction: "--", relation: {ober: 1}, set: [h8_carton_ober]}
      answer: "Tu le prends sous le bras avant le camion. Le délégué compte, recompte, et écrit « manquant : un » sur sa liste."

  # ---------------------------------------------------- 3 · La juge
  - id: ds.h8.ob.juge_carton
    roles: [ds]
    arc: corps
    tags: [direction, scandale]
    lieu: mairie
    tone: strategique
    once: true
    text: "Une juge d'instruction de Valdorne te reçoit au palais, dans un bureau qui sent le radiateur. Elle regarde le carton COURBES 2019-2026 sous ton bras : « Vous me l'apportez, ou vous le promenez ? »"
    left:
      label: "Je vous l'apporte"
      effects: {tribunes: "+", direction: "--", set: [h8_ober_temoin], outcome: temoin}
      answer: "Elle l'ouvre devant toi. La première feuille est la tienne, la deuxième celle de Kerdal. Elle les pose côte à côte et lisse les plis du plat de la main."
    right:
      label: "Je le promène"
      effects: {direction: "+", set: [h8_ober_couvert], outcome: silence}
      answer: "« Promenez-le, alors. » Elle note l'heure de ta visite, et celle de ton départ, à la minute. Tu connais ce genre d'exactitude."

  - id: ds.h8.ob.juge
    roles: [ds]
    arc: corps
    tags: [direction, scandale]
    lieu: mairie
    tone: strategique
    once: true
    text: "Une juge d'instruction de Valdorne te reçoit au palais, dans un bureau qui sent le radiateur : « Le docteur Ober dit que vous saviez, pour les courbes. Vous saviez ? »"
    left:
      label: "Je savais"
      effects: {tribunes: "+", direction: "--", set: [h8_ober_temoin], outcome: temoin}
      answer: "Elle écrit ta réponse en entier, à la main, et te la relit. « Il a dit la même chose de vous. Mot pour mot. »"
    right:
      label: "Je ne savais rien"
      effects: {direction: "+", set: [h8_ober_couvert], outcome: silence}
      answer: "« Rien », répète-t-elle en l'écrivant. Elle souligne le mot. Ober garde son cabinet, et ne te salue plus dans l'escalier."

  # =================================================== LA LIGNE QUI COÛTE
  # ---------------------------------------------- 1 · La visite (une phrase)
  # Cheikh Ilyas ne parle qu'une fois dans le livre : ici.
  - id: ds.h8.fd.visite
    roles: [ds]
    arc: direction
    tags: [direction, caisse]
    speaker: nassir
    lieu: bureau
    tone: strategique
    once: true
    text: "Cheikh Ilyas visite le club-house sans ôter son manteau. Sur ton seuil, il dit sa seule phrase : « Un club, c'est une ligne qui rapporte. Le modèle aussi. Vous, vous êtes la ligne qui coûte. »"
    left:
      label: "Je lui ouvre la porte"
      effects: {direction: "+", tribunes: "-", set: [h8_ilyas_vu]}
      answer: "Il ne rentre pas. Il regarde ton bureau depuis le seuil, comme un appartement qu'on va relouer, puis il redescend."
    right:
      label: "Je reste assis"
      effects: {direction: "--", tribunes: "+", set: [h8_ilyas_vu]}
      answer: "Il attend trois secondes devant ta porte, puis repart. Le délégué reste un moment, et note l'heure de ton silence."

  # ------------------------------------------------------ 2 · Le siège
  - id: ds.h8.fd.siege
    roles: [ds]
    arc: direction
    tags: [direction, caisse]
    lieu: bureau
    tone: leger
    once: true
    text: "Le délégué te propose le siège d'Almadis, à la capitale : un bureau sans fenêtre, un titre en trois lettres, plus d'oreillette. « Là-bas, c'est vous qui parlerez dedans. » Il tend le stylo."
    left:
      label: "Je signe"
      effects: {direction: "++", tribunes: "-", set: [h8_siege], outcome: siege}
      answer: "Il te serre la main en regardant ta montre. « Vous commencerez par les ventes. » La phrase te reste dans l'oreille jusqu'au soir."
    right:
      label: "Je reste à Aubérive"
      effects: {direction: "-", tribunes: "+", set: [h8_reste_auberive], outcome: refus}
      answer: "Il range le contrat sans le plier. « Le fonds n'insistera pas. Le fonds n'insiste jamais : il attend. »"

  # ------------------------------------------------ 3 · La page quatorze
  - id: ds.h8.fd.page_enregistre
    roles: [ds]
    arc: direction
    tags: [direction, objet]
    speaker: josiane
    lieu: secretariat
    tone: leger
    once: true
    text: "Josiane a souligné au crayon la page quatorze de ton contrat : « Les enregistrements réalisés par l'équipement restent la propriété du fonds. » Elle tapote la ligne : « Vos nuits, c'est ça ? »"
    left:
      label: "Je la raye"
      effects: {direction: "--", relation: {josiane: 1}, set: [h8_page_rayee]}
      answer: "Tu la rayes à l'encre, et tu paraphes la rature. Josiane photocopie la page deux fois. « Une pour vous, une pour moi. »"
    right:
      label: "Je la laisse"
      effects: {direction: "+"}
      answer: "Elle gomme son trait de crayon, proprement, jusqu'à ce qu'il ne reste rien. « Comme ça, personne n'aura rien vu. »"

  - id: ds.h8.fd.page
    roles: [ds]
    arc: direction
    tags: [direction, objet]
    speaker: josiane
    lieu: secretariat
    tone: leger
    once: true
    text: "Josiane a souligné au crayon la page quatorze de ton contrat : « La voix de l'utilisateur, captée par l'équipement, reste la propriété du fonds. » « Votre voix, c'est quoi, exactement ? »"
    left:
      label: "Je la raye"
      effects: {direction: "--", relation: {josiane: 1}, set: [h8_page_rayee]}
      answer: "Tu la rayes à l'encre, et tu paraphes la rature. Josiane photocopie la page deux fois. « Une pour vous, une pour moi. »"
    right:
      label: "Je la laisse"
      effects: {direction: "+"}
      answer: "Elle gomme son trait de crayon, proprement, jusqu'à ce qu'il ne reste rien. « Comme ça, personne n'aura rien vu. »"

  # ================================================== LA VOIX DES AUTRES
  # ----------------------------------------------- 1 · L'appel de Léa
  - id: ds.h8.sv.appel
    roles: [ds]
    arc: presse
    tags: [presse, oreillette]
    speaker: lea
    lieu: domicile
    tone: strategique
    once: true
    text: "Tard le soir, Léa au téléphone : « Un directeur sportif de Castérac m'a écrit. Depuis lundi, dans son oreillette, la voix a changé. Il dit que c'est la vôtre. Vous voulez l'entendre ? »"
    left:
      label: "Faites-la-moi entendre"
      effects: {direction: "-", relation: {lea: 1}, var: {h8_nuits: "+1"}}
      answer: "Elle approche le combiné de son ordinateur. « On commence par les ventes ? » Ta voix, avec ton hésitation sur « ventes ». Tu raccroches."
    right:
      label: "Je ne veux pas"
      effects: {vestiaire: "+", relation: {lea: -1}}
      answer: "« Lui non plus, il n'a rien demandé. » Elle raccroche. Le lendemain, dans ta boîte, une clé USB, sans lettre, étiquetée à ton nom."

  # ----------------------------------------------- 2 · Le quai
  - id: ds.h8.sv.quai
    roles: [ds]
    arc: mercato
    tags: [mercato, oreillette]
    lieu: rue
    tone: strategique
    once: true
    text: "Le directeur sportif de Castérac descend du train de sept heures. Vingt-neuf ans, une main à l'oreille. Sur le quai : « Elle me dit de vendre mon gardien. Avec votre voix. Je fais quoi ? »"
    left:
      label: "Ce qu'elle dit"
      effects: {direction: "+", tribunes: "-"}
      answer: "Il baisse les yeux, comme on obéit. Il repart par le train de sept heures quarante, la main toujours à l'oreille."
    right:
      label: "Garde ton gardien"
      effects: {vestiaire: "+", direction: "-", set: [h8_sv_garde]}
      answer: "Il lâche son oreille lentement, comme on lâche une rampe. « Votre voix ne m'a jamais dit ça. » Il reprend le train sans elle."

  # ----------------------------------------------- 3 · Le formulaire
  - id: ds.h8.sv.formulaire
    roles: [ds]
    arc: direction
    tags: [direction, objet]
    speaker: josiane
    lieu: secretariat
    tone: strategique
    once: true
    text: "Madame Josiane pose sur ton bureau un formulaire du fonds : « Opposition à l'usage de votre voix ». La loi les y oblige. Une seule case. Elle a posé un stylo à côté."
    left:
      label: "Je coche la case"
      effects: {direction: "-", vestiaire: "+", set: [h8_voix_retiree], outcome: retiree}
      answer: "Josiane poste la lettre elle-même, en recommandé. Un mois après : « Votre voix a été retirée du modèle. Une voix équivalente la remplace. »"
    right:
      label: "Je la laisse parler"
      effects: {caisse: "+", direction: "+", set: [h8_voix_laissee], outcome: laissee}
      answer: "Tu ranges le formulaire dans le classeur de Josiane, entre deux fax de 2003. Les pages sans signature, c'est là qu'elles finissent."
