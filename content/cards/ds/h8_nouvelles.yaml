# « L'Oreillette » (Histoire 8) — les Nouvelles : ce que le sport devient
# entre 2024 et 2027, et dans l'épilogue jusqu'en 2031, vu d'Aubérive
# (créneaux réservés du directeur sportif : 3, 6, 9, 13). Le sport est vrai
# dans ses axes (le calendrier qui gonfle, les
# corps mesurés, les voix recréées, les paris, la grève des joueurs) ; le
# monde reste inventé : aucun club, aucune compétition, aucun nom réels.
#
# Une Nouvelle datée vit dans la fenêtre [year, year + 1]. Une carte à un seul
# bouton : deux sorties identiques. Elles ne sortent que dans cette histoire.
cards:
  # ================================================================= 2024
  - id: ds.h8.nv.2024_soixante_douze
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: mbako
    tone: leger
    once: true
    year: 2024
    when: "flag('histoire_h8')"
    text: "Le nouveau calendrier tombe : avec la coupe d'été à trente-deux clubs, un titulaire jouera jusqu'à soixante-douze matchs. Mbako le lit deux fois. « Ils ont compté les matchs, {toi}. Pas les nuits. »"
    left:  {label: "Je range le calendrier", effects: {vestiaire: "-"}, answer: "Il le punaise quand même au mur du vestiaire, à hauteur d'yeux. En octobre, quelqu'un a entouré les nuits au crayon."}
    right: {label: "Je range le calendrier", effects: {vestiaire: "-"}, answer: "Il le punaise quand même au mur du vestiaire, à hauteur d'yeux. En octobre, quelqu'un a entouré les nuits au crayon."}

  - id: ds.h8.nv.2024_coeur_ecran
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: gege
    tone: leger
    once: true
    year: 2024
    when: "flag('histoire_h8')"
    text: "À la télévision, le cœur des joueurs s'affiche en direct, en bas de l'écran, à côté du score. Gégé repousse son verre sur le comptoir. « On voit qu'il a peur avant que lui le sache. »"
    left:  {label: "Je regarde l'écran", effects: {tribunes: "+"}, answer: "Toute la buvette regarde le cœur du tireur de penalty monter à cent quatre-vingts. Il le rate. Gégé paie une tournée et ne touche pas à la sienne."}
    right: {label: "Je regarde l'écran", effects: {tribunes: "+"}, answer: "Toute la buvette regarde le cœur du tireur de penalty monter à cent quatre-vingts. Il le rate. Gégé paie une tournée et ne touche pas à la sienne."}

  - id: ds.h8.nv.2024_commentateur
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: josiane
    tone: leger
    once: true
    year: 2024
    when: "flag('histoire_h8')"
    text: "Télé-Stade fait commenter le match du dimanche par la voix recréée d'un commentateur mort en 2019. Josiane coupe le son. « Il ne se trompe jamais de prénom. Le vrai en ratait un par match. »"
    left:  {label: "Je coupe le son aussi", effects: {direction: "-"}, answer: "Vous regardez la seconde mi-temps sans le son, elle et toi. Elle commente à mi-voix, et se trompe de prénom deux fois."}
    right: {label: "Je coupe le son aussi", effects: {direction: "-"}, answer: "Vous regardez la seconde mi-temps sans le son, elle et toi. Elle commente à mi-voix, et se trompe de prénom deux fois."}

  # ================================================================= 2025
  - id: ds.h8.nv.2025_arbitre_voix
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    speaker: gege
    tone: leger
    once: true
    year: 2025
    when: "flag('histoire_h8')"
    text: "Le stade entend désormais ce que la cabine vidéo dit dans l'oreillette de l'arbitre. Gégé, en tribune : « Même l'arbitre entend des voix, {toi}. Toi, au moins, t'as de la compagnie. »"
    left:  {label: "J'écoute la cabine", effects: {tribunes: "+"}, answer: "La cabine dit « revoyez la main ». L'arbitre revoit la main. Le stade siffle la cabine, qu'il n'a jamais vue."}
    right: {label: "J'écoute la cabine", effects: {tribunes: "+"}, answer: "La cabine dit « revoyez la main ». L'arbitre revoit la main. Le stade siffle la cabine, qu'il n'a jamais vue."}

  - id: ds.h8.nv.2025_paris_maillot
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    speaker: lea
    tone: leger
    once: true
    year: 2025
    when: "flag('histoire_h8')"
    text: "La loi interdira les sponsors de paris sur les maillots dès l'été 2027. Léa, au téléphone : « Votre Pari-Rive a deux ans pour changer de nom. Ils hésitent entre deux. Les deux sont des paris. »"
    left:  {label: "Je raccroche", effects: {caisse: "-"}, answer: "Le logo vert reste sur la poitrine des joueurs jusqu'au dernier match autorisé. On le recouvrira d'un ruban adhésif, à la main."}
    right: {label: "Je raccroche", effects: {caisse: "-"}, answer: "Le logo vert reste sur la poitrine des joueurs jusqu'au dernier match autorisé. On le recouvrira d'un ruban adhésif, à la main."}

  - id: ds.h8.nv.2025_donnees
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: ober
    tone: leger
    once: true
    year: 2025
    when: "flag('histoire_h8')"
    text: "Le Parlement débat d'une loi : les données du corps d'un joueur lui appartiendraient. Ober lit le compte rendu, un sandwich à la main : « Lui appartiendraient. Le conditionnel coûte cher, chez nous. »"
    left:  {label: "Je lis le compte rendu", effects: {direction: "+"}, answer: "La loi passe en commission, puis s'y endort. Ober découpe l'article et le glisse sous le verre de son bureau, à côté de son diplôme."}
    right: {label: "Je lis le compte rendu", effects: {direction: "+"}, answer: "La loi passe en commission, puis s'y endort. Ober découpe l'article et le glisse sous le verre de son bureau, à côté de son diplôme."}

  - id: ds.h8.nv.2025_ville_nuit
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    tone: leger
    once: true
    year: 2025
    when: "flag('histoire_h8')"
    text: "Selon une étude parue à la capitale, depuis les matchs à vingt et une heures, les villes de football dorment quarante minutes de moins le samedi. Aubérive est onzième. Le maire s'en félicite."
    left:  {label: "Je découpe l'article", effects: {tribunes: "+"}, answer: "Tu le punaises au-dessus de ton lit, sous le pont roulant. Onzième. Cette nuit-là, ta montre te compte une heure et quart de sommeil."}
    right: {label: "Je découpe l'article", effects: {tribunes: "+"}, answer: "Tu le punaises au-dessus de ton lit, sous le pont roulant. Onzième. Cette nuit-là, ta montre te compte une heure et quart de sommeil."}

  # ================================================================= 2026
  - id: ds.h8.nv.2026_vote
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    tone: leger
    once: true
    year: 2026
    when: "flag('histoire_h8') && !flag('h8_greve_soutenue') && !flag('h8_club_joue')"
    text: "Le syndicat mondial des joueurs vote la grève dans quarante pays. Karim Fauvel lit les résultats à la radio, un par un, comme un tirage au sort. Au vestiaire, personne ne parle pendant les chiffres."
    left:  {label: "J'écoute jusqu'au bout", effects: {vestiaire: "+"}, answer: "Au quarantième pays, quelqu'un éteint la radio. Puis quelqu'un la rallume, pour entendre le nôtre une deuxième fois."}
    right: {label: "J'écoute jusqu'au bout", effects: {vestiaire: "+"}, answer: "Au quarantième pays, quelqu'un éteint la radio. Puis quelqu'un la rallume, pour entendre le nôtre une deuxième fois."}

  - id: ds.h8.nv.2026_repos_kerdal
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    tone: leger
    once: true
    year: 2026
    when: "flag('histoire_h8') && flag('h8_kerdal_mort')"
    text: "La Ligue adopte les soixante-douze heures de repos obligatoires entre deux matchs. Le lendemain, sur le tableau du vestiaire, quelqu'un a écrit à la craie : TROP TARD POUR LE 4."
    left:  {label: "Je laisse la craie", effects: {vestiaire: "+"}, answer: "Personne n'efface. Le préparateur écrit les séances de la semaine autour, sans toucher aux quatre mots, en serrant les lignes."}
    right: {label: "Je laisse la craie", effects: {vestiaire: "+"}, answer: "Personne n'efface. Le préparateur écrit les séances de la semaine autour, sans toucher aux quatre mots, en serrant les lignes."}

  - id: ds.h8.nv.2026_repos
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: kerdal
    tone: leger
    once: true
    year: 2026
    when: "flag('histoire_h8') && flag('h8_kerdal_vit')"
    text: "La Ligue adopte les soixante-douze heures de repos obligatoires entre deux matchs. Kerdal lit la dépêche à voix haute au vestiaire : « Soixante-douze. Comme les matchs. Ils ont de l'humour. »"
    left:  {label: "Je ris avec eux", effects: {vestiaire: "+"}, answer: "Le vestiaire rit, puis Kerdal s'arrête le premier. Il range son téléphone et va s'allonger sur la table de massage, sans rien demander."}
    right: {label: "Je ris avec eux", effects: {vestiaire: "+"}, answer: "Le vestiaire rit, puis Kerdal s'arrête le premier. Il range son téléphone et va s'allonger sur la table de massage, sans rien demander."}

  - id: ds.h8.nv.2026_nuits_vendues
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    tone: leger
    once: true
    year: 2026
    when: "flag('histoire_h8')"
    text: "Une juge de la capitale interdit à un sponsor de revendre les nuits des joueurs. Le sponsor fait appel. En attendant, il continue de les revendre, un peu plus cher, « en raison du risque judiciaire »."
    left:  {label: "Je classe la dépêche", effects: {caisse: "+"}, answer: "Le chèque de Cadence arrive à la date prévue, augmenté de quatre pour cent. Personne ne dit pourquoi. Tout le monde le sait."}
    right: {label: "Je classe la dépêche", effects: {caisse: "+"}, answer: "Le chèque de Cadence arrive à la date prévue, augmenté de quatre pour cent. Personne ne dit pourquoi. Tout le monde le sait."}

  # ================================================================= 2027
  - id: ds.h8.nv.2027_sans_ds
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, mercato]
    speaker: gege
    tone: leger
    once: true
    year: 2027
    when: "flag('histoire_h8') && !seen('ds.h8.nv.2028_roquemont')"
    text: "Un club de Roquemont annonce qu'il n'aura plus de directeur sportif : « le modèle suffit ». Le premier mois, il achète onze défenseurs. Gégé : « Lui, au moins, il a compris d'où viennent les buts. »"
    left:  {label: "Je lis la liste", effects: {direction: "-"}, answer: "Onze défenseurs, tous excellents dormeurs. En mars, Roquemont n'a pas encaissé un but et n'en a marqué aucun. Le modèle est satisfait."}
    right: {label: "Je lis la liste", effects: {direction: "-"}, answer: "Onze défenseurs, tous excellents dormeurs. En mars, Roquemont n'a pas encaissé un but et n'en a marqué aucun. Le modèle est satisfait."}

  - id: ds.h8.nv.2027_kambara
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, moment]
    tone: leger
    once: true
    year: 2027
    when: "flag('histoire_h8') && (flag('h8_mbako_embrasse') || flag('h8_mbako_parti'))"
    text: "Le Kambara de Lian Mbako bat la Dorsavie, un à zéro, sur un terrain en terre rouge. Le but est d'un gamin de dix-sept ans, pieds nus, qu'aucune machine n'avait jamais classé."
    left:  {label: "Je découpe la photo", effects: {vestiaire: "+"}, answer: "Sur la photo, Mbako ne regarde pas le but. Il regarde le gamin courir vers lui, et il a les bras à moitié ouverts."}
    right: {label: "Je découpe la photo", effects: {vestiaire: "+"}, answer: "Sur la photo, Mbako ne regarde pas le but. Il regarde le gamin courir vers lui, et il a les bras à moitié ouverts."}

  # ======================================================== SANS DATE (la ville)
  - id: ds.h8.nv.friche_bougies
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, decor]
    tone: leger
    once: true
    when: "flag('histoire_h8')"
    text: "À la friche de la Tréfilerie, là où l'on a trouvé la voiture de Ferlac en décembre, quelqu'un entretient des bougies électriques sur une palette. Personne ne sait qui change les piles."
    left:  {label: "Je passe par la friche", effects: {direction: "-"}, answer: "Sept bougies, une photo plastifiée d'un homme jeune en pull, et pas de nom. Les piles sont neuves. Tu ne t'approches pas plus."}
    right: {label: "Je passe par la friche", effects: {direction: "-"}, answer: "Sept bougies, une photo plastifiée d'un homme jeune en pull, et pas de nom. Les piles sont neuves. Tu ne t'approches pas plus."}

  - id: ds.h8.nv.balancoire
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, decor]
    tone: leger
    once: true
    year: 2025
    when: "flag('histoire_h8') && !flag('h8_voiture_rendue')"
    text: "Le duplex du dessous s'est vendu. Les nouveaux ont accroché une balançoire au pont roulant, pour leur fille. La nuit, quand le vent passe par les verrières, tu l'entends grincer."
    left:  {label: "Je compte les grincements", effects: {vestiaire: "+"}, answer: "Quatorze, puis plus rien. Le matin, dans l'escalier, la petite te dit bonjour, la marque de l'oreiller sur la joue."}
    right: {label: "Je compte les grincements", effects: {vestiaire: "+"}, answer: "Quatorze, puis plus rien. Le matin, dans l'escalier, la petite te dit bonjour, la marque de l'oreiller sur la joue."}

  - id: ds.h8.nv.rive_crue
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, decor]
    speaker: mbako
    tone: leger
    once: true
    when: "flag('histoire_h8')"
    text: "La Rive monte de deux mètres en une nuit. Le terrain annexe est sous l'eau ; les plots flottent jusqu'au pont. Mbako regarde les buts sans filet sortir de l'eau : « Au moins, ils sont propres. »"
    left:  {label: "J'enfile des bottes", effects: {vestiaire: "+"}, answer: "Vous ramassez les plots ensemble, dans l'eau jusqu'aux genoux. Il en manque trois ; on les retrouve en mai, à Valdorne."}
    right: {label: "J'enfile des bottes", effects: {vestiaire: "+"}, answer: "Vous ramassez les plots ensemble, dans l'eau jusqu'aux genoux. Il en manque trois ; on les retrouve en mai, à Valdorne."}

  - id: ds.h8.nv.chant_allo
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, ultras]
    tone: leger
    once: true
    when: "flag('histoire_h8')"
    text: "Le virage a inventé un chant : « Allô, {nom}, qui choisit l'équipe ? » Il dure tout le match. Au coup de sifflet final, la Nord raccroche en chœur, d'un même geste, la main à l'oreille."
    left:  {label: "Je raccroche avec eux", effects: {tribunes: "+"}, answer: "De la loge, tu fais le geste aussi. Personne ne te voit, sauf Gégé, qui se tient l'oreille encore un peu, pour toi."}
    right: {label: "Je raccroche avec eux", effects: {tribunes: "+"}, answer: "De la loge, tu fais le geste aussi. Personne ne te voit, sauf Gégé, qui se tient l'oreille encore un peu, pour toi."}

  - id: ds.h8.nv.josiane_bougies
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, famille]
    speaker: josiane
    tone: leger
    once: true
    when: "flag('histoire_h8') && season >= 1"
    text: "Josiane fête ses quatre-vingt-sept ans au secrétariat, avec un gâteau qu'elle a fait elle-même. Elle compte les bougies, puis les gens autour de la table, puis s'arrête. « Il en manque. »"
    left:  {label: "Je rallume les bougies", effects: {vestiaire: "+"}, answer: "Elle souffle une deuxième fois, pour ceux qui manquent. La fumée monte vers le palier du premier, et y reste."}
    right: {label: "Je rallume les bougies", effects: {vestiaire: "+"}, answer: "Elle souffle une deuxième fois, pour ceux qui manquent. La fumée monte vers le palier du premier, et y reste."}

  - id: ds.h8.nv.sirene
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, decor]
    tone: leger
    once: true
    when: "flag('histoire_h8') && season >= 2"
    text: "Journées du patrimoine : la Tréfilerie fait sonner sa vieille sirène, une seule fois, à midi. Tout le quai se tourne vers elle, comme vers quelqu'un qui aurait appelé un nom."
    left:  {label: "Je me tourne aussi", effects: {tribunes: "+"}, answer: "Le son dure onze secondes. Après, les gens restent un moment immobiles, gênés, comme au sortir d'une minute de silence."}
    right: {label: "Je me tourne aussi", effects: {tribunes: "+"}, answer: "Le son dure onze secondes. Après, les gens restent un moment immobiles, gênés, comme au sortir d'une minute de silence."}

  # ============================================= SECONDE MAIN : Vaubourg, 2024-2025
  # Le président d'honneur regarde le sport changer (la présence de Vaubourg
  # en première saison ne tient pas qu'à son intrigue).
  - id: ds.h8.nv.2024_tourniquet
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: aulard
    tone: leger
    once: true
    year: 2024
    when: "flag('histoire_h8') && !flag('h8_vaubourg_mort')"
    text: "Plus de billets à la Rive, les tourniquets lisent les visages. Vaubourg s'y présente le premier, le chapeau à la main. Le tourniquet bipe rouge. « Il a raison. Je me ressemble plus. »"
    left:  {label: "Je le fais entrer", effects: {tribunes: "-"}, answer: "Un stadier de vingt ans lui ouvre le portillon des livreurs. Vaubourg y passe en soulevant son chapeau, à droite, à gauche."}
    right: {label: "Je le fais entrer", effects: {tribunes: "-"}, answer: "Un stadier de vingt ans lui ouvre le portillon des livreurs. Vaubourg y passe en soulevant son chapeau, à droite, à gauche."}

  - id: ds.h8.nv.2025_extraits
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: aulard
    tone: leger
    once: true
    year: 2025
    when: "flag('histoire_h8') && !flag('h8_vaubourg_mort')"
    text: "Les droits du championnat partent chez une plateforme qui découpe chaque match en extraits d'une minute. Vaubourg : « En 1977, on regardait le match entier, et on s'ennuyait ensemble. »"
    left:  {label: "Je regarde un extrait", effects: {caisse: "+"}, answer: "Une minute : un but, une publicité. Vaubourg regarde par-dessus ton épaule. « Et le reste du match, qui l'a vu ? »"}
    right: {label: "Je regarde un extrait", effects: {caisse: "+"}, answer: "Une minute : un but, une publicité. Vaubourg regarde par-dessus ton épaule. « Et le reste du match, qui l'a vu ? »"}

  # ===================================================== 2027 et après (l'épilogue)
  # Ce que le sport devient quand l'histoire est finie : les graines de 2024
  # et 2025 paient ici (le ruban sur le logo, le calendrier au crayon, la voix
  # du commentateur, la loi sur les corps, les onze défenseurs, la friche).
  - id: ds.h8.nv.2027_ruban
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    tone: leger
    once: true
    year: 2027
    when: "flag('histoire_h8') && year == 2027"
    text: "Depuis l'été, plus de paris sur les maillots. L'intendant a recouvert le logo vert de Pari-Rive d'un ruban adhésif, à la main, sur quarante maillots. Sous la pluie, le ruban se décolle."
    left:  {label: "Je regarde les rubans", effects: {tribunes: "+"}, answer: "Au coup de sifflet final, le vert dépasse de toutes les poitrines. Les photographes ne prennent que ça."}
    right: {label: "Je regarde les rubans", effects: {tribunes: "+"}, answer: "Au coup de sifflet final, le vert dépasse de toutes les poitrines. Les photographes ne prennent que ça."}

  - id: ds.h8.nv.2027_soixante
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    tone: leger
    once: true
    year: 2027
    when: "flag('histoire_h8')"
    text: "Après la grève, la Ligue ramène la saison à soixante matchs. Au mur du vestiaire, le calendrier de 2024 est toujours punaisé, les nuits entourées au crayon. Personne ne l'a décroché."
    left:  {label: "Je le laisse au mur", effects: {vestiaire: "+"}, answer: "Le nouveau, on le punaise à côté. Les jeunes comparent les deux, comme on compare deux radios du même genou."}
    right: {label: "Je le laisse au mur", effects: {vestiaire: "+"}, answer: "Le nouveau, on le punaise à côté. Les jeunes comparent les deux, comme on compare deux radios du même genou."}

  - id: ds.h8.nv.2028_voix_morts
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: josiane
    tone: leger
    once: true
    year: 2028
    when: "flag('histoire_h8')"
    text: "Une loi interdit de faire parler les morts sans l'accord des familles. Télé-Stade rend sa voix au commentateur de 2019 ; le nouveau est vivant, et il se trompe de prénom. Josiane : « Enfin. »"
    left:  {label: "Je remets le son", effects: {tribunes: "+"}, answer: "Il confond deux défenseurs, s'excuse, se trompe encore. Josiane monte le volume d'un cran, et ne commente plus rien."}
    right: {label: "Je remets le son", effects: {tribunes: "+"}, answer: "Il confond deux défenseurs, s'excuse, se trompe encore. Josiane monte le volume d'un cran, et ne commente plus rien."}

  - id: ds.h8.nv.2028_loi_corps
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, direction]
    tone: leger
    once: true
    year: 2028
    when: "flag('histoire_h8')"
    text: "Quatre ans après le débat, la loi est votée : les données du corps d'un joueur lui appartiennent. Le premier à réclamer les siennes est un gardien de quarante ans. On les lui livre en trois cartons."
    left:  {label: "Je demande les miennes", effects: {direction: "-"}, answer: "Tu écris, sur papier. On te répond qu'elles ont été « transférées au siège avec les outils ». Le siège n'a pas d'adresse."}
    right: {label: "Je demande les miennes", effects: {direction: "-"}, answer: "Tu écris, sur papier. On te répond qu'elles ont été « transférées au siège avec les outils ». Le siège n'a pas d'adresse."}

  - id: ds.h8.nv.2028_roquemont
    roles: [ds]
    arc: nouvelle
    tags: [nouvelle, mercato]
    speaker: gege
    tone: leger
    once: true
    year: 2028
    when: "flag('histoire_h8')"
    text: "Roquemont, le club sans directeur sportif, en rembauche un : un ancien gardien qui n'a pas de téléphone. Gégé replie le journal : « Tu vois, {toi}. On finit toujours par revenir aux gardiens. »"
