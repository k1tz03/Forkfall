# Cartes d'étape de « Le brassard » (content/arcs/entraineur/brassard.yaml).
# Toutes hors du sac. Le nom du joueur : sur le genou et sur le costume, jamais
# sur deux étapes de suite ; Bréhaut dit {toi}, le Doc dit {toi}, Vukić dit
# « coach ». Traces : brehaut_capitaine, brassard_gigi, brassard_mbako,
# brehaut_staff.
cards:
  # --------------------------------------------------------- S1 · ce que le genou a dit
  - id: en.brassard.genou
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: sabatier
    tone: leger
    text: "Sabatier parle à la table, pas à toi : « Le genou du capitaine a trente-trois ans et il en parle comme s'il en avait quarante. Ça reste entre la table et moi : le chiffre, ou l'homme ? »"
    left:
      label: "Le chiffre"
      effects: {direction: "+", relation: {sabatier: 1, brehaut: -1}, var: {genou_brehaut: "=1"}}
      answer: "Il dit un chiffre de minutes par match. Il est inférieur à quatre-vingt-dix ; il est supérieur à zéro."
    right:
      label: "L'homme"
      effects: {vestiaire: "+", relation: {brehaut: 1, sabatier: -1}}
      answer: "Il range la seringue. Il dit « il tiendra », ce qui n'est pas une réponse de médecin."

  # --------------------------------------------------------- S2 · sur une jambe
  - id: en.brassard.brehaut
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut est assis pour une fois, le brassard plié sur le bureau : « Le groupe vit bien, et son capitaine a mal en montant l'escalier. Je le garde jusqu'en juin, {toi}, ou tu le donnes ? »"
    left:
      label: "Jusqu'en juin, c'est toi"
      effects: {vestiaire: "++", force: -2, relation: {brehaut: 1}, set: [brehaut_capitaine], outcome: garde, next: {step: cercle, in: [2, 4]}}
      answer: "Il reprend le brassard. Il monte l'escalier en dernier, pour qu'on ne le voie pas."
    right:
      label: "Je décide cette semaine"
      effects: {vestiaire: "-", direction: "+", relation: {brehaut: -1}, react: {card: en.re.mbako_brassard, if: "chars.mbako.statut == 'club' || chars.mbako.statut == 'present'"}}
      answer: "Il laisse le brassard sur le bureau. Il descend l'escalier plus vite qu'il ne l'a monté."

  # --------------------------------------------------------- S3 · deux bras, un brassard
  - id: en.brassard.choix
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, tribunes]
    speaker: vukic
    tone: leger
    text: "Vukić tient un dossard dans chaque main : « Le vieux : des gants et dix secondes de rire. Le petit : dix-sept ans, la tribune l'adore, les anciens font un cercle. Pas de bon bras. »"
    left:
      label: "Gigi, jusqu'en juin"
      # `vestiaire +` → `++` : même correctif que la branche du petit à droite
      # (la politique ne lit que les jauges). L'issue `gigi` restait à 8 % des
      # clôtures contre 14 % à `mbako`, pour un plancher de 10 %.
      effects: {vestiaire: "++", tribunes: "+", relation: {vecchio: 2, mbako: -1}, set: [brassard_gigi], outcome: gigi}
      answer: "Dix secondes de rire. Puis Gigi met le brassard sur le gant, et plus personne ne rit."
    right:
      label: "Le petit, tout de suite"
      # vestiaire −− → − : la politique human_like ne lit que les jauges, et un
      # double cran de vestiaire (à 45 au départ) rendait la branche du petit
      # strictement perdante — l'issue `mbako` restait sous 10 %.
      effects: {tribunes: "++", vestiaire: "-", relation: {mbako: 2, brehaut: -1}, set: [brassard_mbako], outcome: mbako}
      answer: "Le brassard glisse sur son bras ; il est trop grand. La mère demande une photo pour le dossier."

  - id: en.brassard.choix_chiffre
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vukic
    tone: strategique
    text: "Vukić ne montre qu'un dossard : « Le chiffre du Doc dit que le capitaine tiendra soixante minutes, et un capitaine qui sort à l'heure en vaut un et demi. Sors-le toi-même. »"
    left:
      label: "Il sort à l'heure"
      effects: {vestiaire: "+", force: -1, set: [brehaut_capitaine], outcome: garde, relation: {brehaut: 1}}
      answer: "Il sort à la soixantième, chaque match. Il applaudit son remplaçant ; c'est nouveau."
    right:
      label: "Le petit, tout de suite"
      # vestiaire −− → − : la politique human_like ne lit que les jauges, et un
      # double cran de vestiaire (à 45 au départ) rendait la branche du petit
      # strictement perdante — l'issue `mbako` restait sous 10 %.
      effects: {tribunes: "++", vestiaire: "-", relation: {mbako: 2, brehaut: -1}, set: [brassard_mbako], outcome: mbako}
      answer: "Le brassard glisse sur son bras ; il est trop grand. Bréhaut range le chiffre du Doc dans sa poche."

  # --------------------------------------------------------- S4 · le cercle
  - id: en.brassard.cercle_mbako
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, risk:vestiaire]
    speaker: vecchio
    tone: leger
    text: "Vecchio te parle par-dessus les épaules du cercle : « Les anciens ont fait un cercle et le petit est dehors avec son brassard trop grand. Tu entres dedans, ou tu le casses ? »"
    left:
      label: "J'entre dans le cercle"
      effects: {vestiaire: "+", tribunes: "-", relation: {mbako: -1, brehaut: 1}}
      answer: "Tu entres. Le petit reste dehors ; il s'échauffe seul, plus vite que tout le monde."
    right:
      label: "Je le casse"
      effects: {vestiaire: "--", tribunes: "+", relation: {mbako: 1, brehaut: -1}, set: [bus_menace]}
      answer: "Tu casses le cercle. Il se reforme dans le bus, sans le petit, sans toi."

  - id: en.brassard.cercle_gigi
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: brehaut
    tone: leger
    text: "Bréhaut est dans le cercle, sans brassard : « Le groupe a fait un cercle autour de Gigi et personne n'a ri ; c'est mon cercle, il me manque le tissu. Je parle dedans, ou c'est lui ? »"
    left:
      label: "C'est toi qui parles"
      effects: {vestiaire: "++", relation: {brehaut: 1, vecchio: -1}}
      answer: "Il parle. Gigi écoute, le brassard sur le gant ; il n'a jamais aimé parler."
    right:
      label: "C'est le capitaine"
      effects: {vestiaire: "+", relation: {vecchio: 1, brehaut: -1}}
      answer: "Gigi parle. Trois phrases ; la troisième est « j'en ai vu d'autres », et ça suffit."

  - id: en.brassard.cercle
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: brehaut
    tone: leger
    text: "Bréhaut est dans le cercle, le brassard au bras : « Le groupe vit bien, et le groupe a vu que tu m'as gardé avec le genou ; il fera le reste. Tu entres, ou tu regardes ? »"
    left:
      label: "J'entre"
      effects: {vestiaire: "+", relation: {brehaut: 1}}
      answer: "Tu entres. Personne ne parle de genou."
    right:
      label: "Je regarde"
      effects: {vestiaire: "+", direction: "+"}
      answer: "Tu regardes. Le président regarde aussi, depuis la loge ; il compte."

  # --------------------------------------------------------- S5 · le costume
  - id: en.brassard.raccroche
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, direction, chaine]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut en costume, la cravate mal nouée : « J'ai raccroché ce matin, et j'ai deux offres : ton staff, ou un bureau avec « sportif » sur la porte. En bas, {toi}, ou au-dessus ? »"
    left:
      label: "Au vestiaire, avec moi"
      effects: {vestiaire: "++", direction: "-", relation: {brehaut: 2}, set: [brehaut_staff], char: {brehaut: {statut: staff}}}
      answer: "Il enlève la cravate. Il la range dans le carton de crampons."
    right:
      label: "Au-dessus, on verra"
      effects: {direction: "++", vestiaire: "-", relation: {brehaut: -1}, set: [brehaut_staff], char: {brehaut: {statut: parti}}}
      answer: "Il garde la cravate. Il la renoue mieux ; quelqu'un lui a montré."

  - id: en.brassard.raccroche_actif
    roles: [entraineur]
    arc: direction
    tags: [direction, vestiaire, sponsors, chaine]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut tourne une plaque orange entre ses doigts : « Le fonds m'a proposé « directeur sportif », avec un bureau au-dessus du tien. Tu me veux au vestiaire, ou en orange ? »"
    left:
      label: "Au vestiaire, avec moi"
      effects: {vestiaire: "++", direction: "-", relation: {brehaut: 2, nassir: -1}, set: [brehaut_staff], char: {brehaut: {statut: staff}}}
      answer: "Il refuse la plaque. On en fait faire une autre, à un autre nom."
    right:
      label: "Au-dessus, en orange"
      effects: {direction: "++", vestiaire: "--", relation: {brehaut: -1}, set: [brehaut_staff], char: {brehaut: {statut: staff}}}
      answer: "Il prend la plaque. Il achète un ailier en janvier, sans te demander."
