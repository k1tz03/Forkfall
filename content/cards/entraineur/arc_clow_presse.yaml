# Cartes de l'arc « Le mentor » (en.mentor_clow) et de « La conférence de
# presse » (en.conf_presse), content/arcs/entraineur/clow_presse.yaml, plus les
# deux routines qui les entourent (en.clow.top_un, en.presse.meme).
# `arc:` est le THÈME de la carte, pas l'id de l'arc.
cards:
  # ============================================================ F · Le mentor
  # ---------------------------------------------- F0 · le top un (routine S0)
  # Tutoriel déguisé du piège des 80 : sort du sac (priorité 1) dès qu'un slot
  # libre existe et que la tribune déborde. Premier conseil possible.
  - id: en.clow.top_un
    roles: [entraineur]
    arc: tribunes
    tags: [tribunes, piege]
    speaker: clow
    tone: leger
    once: true
    priority: 1
    # Seuil 75 comme la bible ; season <= 1 (et non == 0) en filet : la S0
    # du promu est presque entièrement réservée (script, semis, Nouvelles).
    when: "gauges.tribunes >= 75 && season <= 1 && !flag('clow_ingrat')"
    text: "Dan Corven, un verre d'eau devant lui : « Une jauge pleine tue autant qu'une vide, petit. Je ne dirais pas que j'étais un grand. Je dirais que j'étais devant. »"
    left:
      label: "Je note"
      effects: {var: {clow_conseils: "+1"}, relation: {clow: 1}}
      answer: "Tu regardes la tribune. Elle te regarde aussi. Ce n'est pas le même regard."
    right:
      label: "Pas besoin de conseils"
      effects: {relation: {clow: -1}, tribunes: "+"}
      answer: "Il ne touche pas son verre. La tribune chante ton nom, un peu trop fort."

  # -------------------------------------------------- F1 · cinquante-neuf jours
  # Variante qui lit le chapitre 01 (clow_stage) : il t'a eu au stage du
  # diplôme, et il se souvient de celui qui écrivait tout.
  - id: en.clow.44_jours_stage
    roles: [entraineur]
    arc: direction
    tags: [direction, piege]
    speaker: clow
    tone: leger
    once: true
    text: "Corven, un comptoir derrière la voix : « Au stage, petit, tu écrivais tout, même ce que je ne disais pas. Peur du président ? Je ne dirais pas que j'étais un grand ; j'étais devant les sans-peur. »"
    left:
      label: "Je l'écoute"
      effects: {var: {clow_conseils: "+1"}, relation: {clow: 1}, direction: "-", react: {card: en.re.josiane_au_telephone, chance: 0.6}}
      answer: "Une heure au téléphone. Le président t'a cherché ; on lui a dit « le stage »."
    right:
      label: "Je gère"
      effects: {relation: {clow: -1}, direction: "+"}
      answer: "Tu raccroches le premier. Il repose un verre qu'il n'a pas bu."

  - id: en.clow.44_jours
    roles: [entraineur]
    arc: direction
    tags: [direction, piege]
    speaker: clow
    tone: leger
    once: true
    text: "Corven, au téléphone : « Peur du président, {toi} ? Cinquante-neuf jours à Capitale FC, en 1971. Je ne dirais pas que j'étais un grand. Je dirais que j'étais devant. »"
    left:
      label: "Je l'écoute"
      effects: {var: {clow_conseils: "+1"}, relation: {clow: 1}, direction: "-", react: {card: en.re.josiane_au_telephone, chance: 0.6}, journal: {text: "{annee} : une heure au téléphone avec Dan Corven. Le président a cherché {nom} pendant une heure.", poids: 2, tags: [direction, piege]}}
      answer: "Une heure au téléphone. Le président t'a cherché pendant une heure."
    right:
      label: "Je gère"
      effects: {relation: {clow: -1}, direction: "+", journal: {text: "{annee} : Dan Corven a appelé. {nom} a raccroché le premier ; le président a apprécié.", poids: 1, tags: [direction]}}
      answer: "Tu raccroches le premier. Le président t'a vu raccrocher. Il apprécie."

  # ------------------------------------------------------------ F2 · le verre
  - id: en.clow.verre
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, piege]
    speaker: clow
    tone: leger
    once: true
    text: "Dan Corven, verre d'eau plein à ras bord : « Une promesse, petit, c'est un chèque. Tu en as signé combien ? Un vestiaire, c'est un verre : trop plein, ça déborde. »"
    left:
      label: "J'en ai signé trop"
      effects: {var: {clow_conseils: "+1"}, parole: 1, journal: {text: "{annee} : « J'en ai signé trop », a avoué {nom} à Dan Corven. Une goutte est tombée sur la nappe.", poids: 2, tags: [vestiaire, piege]}}
      answer: "Il lève son verre d'eau sans boire. Une goutte tombe sur la nappe. Il la regarde."
    right:
      label: "Ce sont mes chèques"
      effects: {relation: {clow: -1}}
      answer: "Il repose le verre plein. Il n'en boit aucun. Il les remplit, c'est tout."

  # ---------------------------------------------------------- F2b · le silence
  # Sortie basse de l'arc : trop tôt ou pas assez écouté. Les deux côtés posent
  # clow_ingrat ; seule la relation diffère.
  - id: en.clow.silence
    roles: [entraineur]
    arc: divers
    tags: [direction]
    speaker: clow
    tone: leger
    once: true
    text: "Corven, répondeur : « Tu n'appelles plus. Bon signe, un coach qui écoute n'en est pas un. Je ne dirais pas que j'étais un grand. Je dirais que j'étais devant. »"
    left:
      label: "Je le rappelle"
      effects: {set: [clow_ingrat], relation: {clow: 1}}
      answer: "Répondeur. Tu raccroches avant le bip. Le numéro reste dans le carnet, sans nom."
    right:
      label: "Il a fait son temps"
      effects: {set: [clow_ingrat], relation: {clow: -1}, direction: "+"}
      answer: "Tu effaces le message. Le président, lui, en a un tout prêt pour toi."

  # ----------------------------------------------------------- F3 · l'hôpital
  # Drame sans choix : les deux côtés sont identiques, aucun effet.
  - id: en.clow.hopital
    roles: [entraineur]
    arc: moment
    tags: [moment]
    speaker: josiane
    tone: drame
    once: true
    text: "Madame Josiane, sans frapper : « Monsieur Corven est à l'hôpital. Il a demandé si vous aviez gagné dimanche. Il n'a pas demandé le score. »"
    left:
      label: "Je prends mon manteau"
      effects: {}
      answer: "Chambre 12. Il dort. Sur la table, un verre d'eau plein à ras bord."
    right:
      label: "J'y passe demain"
      effects: {}
      answer: "Chambre 12. Il dort. Sur la table, un verre d'eau plein à ras bord."

  # --------------------------------------------------------- F4 · le testament
  - id: en.clow.testament
    roles: [entraineur]
    arc: moment
    tags: [moment, direction]
    speaker: josiane
    tone: leger
    once: true
    text: "Madame Josiane, une enveloppe : « Il a laissé ça pour vous, {toi}. Dedans, une phrase et un choix : dire ce que vous pensez, ou voir ce que les autres cachent. »"
    left:
      label: "Franc-parler"
      effects: {set: [franc_parler], outcome: ecoute, journal: {text: "{annee} : Dan Corven a laissé une enveloppe à {nom}. Dedans, une phrase et un choix : le franc-parler.", poids: 3, tags: [moment, direction]}}
      answer: "La phrase : « Je ne dirais pas que j'étais un grand. Je dirais que j'étais devant. » Tu la dis en conférence samedi. Massenet note."
    right:
      label: "Nez à joueurs"
      effects: {set: [nez_a_joueurs], outcome: ecoute, journal: {text: "{annee} : Dan Corven a laissé une enveloppe à {nom}. Dedans, une phrase et un choix : le nez à joueurs.", poids: 3, tags: [moment, direction]}}
      answer: "La phrase : « Je ne dirais pas que j'étais un grand. Je dirais que j'étais devant. » Tu la gardes. Tu regardes les autres, désormais."

  - id: en.clow.testament_ingrat
    roles: [entraineur]
    arc: moment
    tags: [moment]
    speaker: josiane
    tone: leger
    once: true
    text: "Madame Josiane, les mains vides : « Il n'a rien laissé. Le fils de Corven a demandé qu'on ne vous prévienne pas de l'enterrement. J'en ai vu passer, vous savez. »"
    left:
      label: "Je comprends"
      effects: {set: [clow_ingrat], outcome: ingrat}
      answer: "Tu y vas quand même. Au fond, derrière un pilier. Le fils te voit. Il ne dit rien."
    right:
      label: "Je comprends"
      effects: {set: [clow_ingrat], outcome: ingrat}
      answer: "Tu y vas quand même. Au fond, derrière un pilier. Le fils te voit. Il ne dit rien."

  # ================================================ G · La conférence de presse
  # ------------------------------------------------------ G1 · trois questions
  # Pas `once` : l'arc est ré-armé chaque saison et la carte doit ressortir.
  - id: en.presse.trois_questions
    roles: [entraineur]
    arc: presse
    tags: [presse, piege]
    speaker: meneche
    tone: leger
    cooldown: 14
    text: "Massenet, micro posé sur la table : « Trois questions, un journaliste gentil. Juste une question, hors micro. L'objectif, {nom}, vous y croyez ou vous le dites ? »"
    left:
      label: "Je ne commente pas"
      effects: {var: {no_comment: "+1"}, tribunes: "-", direction: "+", outcome: no_comment, react: {card: en.re.meneche_embuscade, chance: 0.6}, journal: {text: "{annee} : conférence de presse. « Je ne commente pas », a dit {nom}. Massenet a noté le silence.", poids: 1, tags: [presse]}}
      answer: "Il note le silence. Il note toujours. Le président apprécie qu'on note peu."
    right:
      label: "Franchement"
      effects: {tribunes: "+", parole: 1, promise: true, relation: {meneche: 1}, outcome: franc, set: [presse_franc], react: {card: en.re.lea_confirmez, chance: 0.7}, journal: {text: "{annee} : conférence de presse. « Franchement », a dit {nom}. Titre du samedi, avec un point d'interrogation.", poids: 1, tags: [presse]}}
      answer: "Il note « franchement ». Le mot sort en titre samedi, avec un point d'interrogation."

  # --------------------------------------------------- le mème (routine S1+)
  # Ramasse les « je ne commente pas » de A3, B5a et G1. Priorité 2 : sort dès
  # qu'un slot de routine est libre.
  - id: en.presse.meme
    roles: [entraineur]
    arc: presse
    tags: [presse, absurde]
    speaker: meneche
    tone: leger
    once: true
    priority: 2
    when: "count('no_comment') >= 3"
    text: "Massenet, une photocopie à la main : « Trois « je ne commente pas ». Votre visage est partout avec la légende. Juste une question, hors micro. Vous en riez ? »"
    left:
      label: "J'en ris"
      effects: {tribunes: "+", relation: {meneche: 1}}
      answer: "Tu signes une photocopie. Elle finit au local de Gégé, au-dessus du bar."
    right:
      label: "Je porte plainte"
      effects: {tribunes: "--", relation: {meneche: -2}}
      answer: "La plainte fait un deuxième mème. Avec la même légende, en plus gros."

  # ------------------------------------------------------ Réactions des arcs
  # Le build dérive `kind: reaction` de tout `react:` qui les cite : ne pas
  # écrire `kind:`.
  # Après en.clow.44_jours (← je l'écoute) : le président a cherché pendant
  # l'heure de téléphone, et quelqu'un a répondu à sa place.
  - id: en.re.josiane_au_telephone
    roles: [entraineur]
    arc: direction
    tags: [direction, presse]
    speaker: josiane
    tone: leger
    text: "Madame Josiane, le combiné encore dans la main : « Le président a appelé trois fois ; j'ai dit que vous étiez avec un ancien. J'en ai vu passer, vous savez, des anciens. »"
    left:
      label: "Vous avez bien fait"
      effects: {direction: "-", relation: {josiane: 1}}
      answer: "Elle note l'heure sur un post-it. Elle le colle sous le sous-main, pas dessus."
    right:
      label: "Ne notez rien"
      effects: {direction: "-", relation: {josiane: 1}}
      answer: "Elle note l'heure sur un post-it quand même. Elle le colle sous le sous-main."

  # Après en.presse.trois_questions (→ Franchement) : le lendemain, la stagiaire
  # de L'Écho rappelle pour faire confirmer le mot (ch. 90 § 2.4).
  - id: en.re.lea_confirmez
    roles: [entraineur]
    arc: presse
    tags: [presse]
    speaker: lea
    tone: leger
    text: "Léa, un carnet et un stylo qui ne marche pas : « Vous avez dit « franchement » hier, et tout le monde l'a repris ce matin, en titre. Vous confirmez ? »"
    left:
      label: "Je confirme"
      effects: {tribunes: "+", relation: {lea: 1}}
      answer: "Elle écrit le mot deux fois. La seconde, entre guillemets, avec ton nom devant."
    right:
      label: "Je confirme"
      effects: {tribunes: "+", relation: {lea: 1}}
      answer: "Elle écrit le mot deux fois. La seconde, entre guillemets, avec ton nom devant."
