# Cartes de l'arc « Le mentor » (en.mentor_clow) et de « La conférence de
# presse » (en.conf_presse), content/arcs/entraineur/clow_presse.yaml, plus les
# deux routines qui les entourent (en.clow.top_un, en.presse.meme).
# `arc:` est le THÈME de la carte, pas l'id de l'arc.
cards:
  # ============================================================ F · Le mentor
  # ---------------------------------------------- F0 · le top un (routine S0)
  # Tutoriel déguisé du piège des 80 : sort du sac (priorité 1) dès qu'un slot
  # libre existe et que la tribune déborde. Premier conseil possible.
  - id: en.clow.top_un
    roles: [entraineur]
    arc: tribunes
    tags: [tribunes, piege]
    speaker: clow
    tone: leger
    once: true
    priority: 1
    # Seuil 75 comme la bible ; season <= 1 (et non == 0) en filet : la S0
    # du promu est presque entièrement réservée (script, semis, Nouvelles).
    when: "gauges.tribunes >= 75 && season <= 1"
    text: "Brian Clow, verre à la main : « Une jauge pleine tue autant qu'une vide, petit. Je ne dirais pas que j'étais le meilleur, mais j'étais dans le top un. »"
    left:
      label: "Je note"
      effects: {var: {clow_conseils: "+1"}, relation: {clow: 1}}
      answer: "Tu regardes la tribune. Elle te regarde aussi. Ce n'est pas le même regard."
    right:
      label: "Pas besoin de conseils"
      effects: {relation: {clow: -1}, tribunes: "+"}
      answer: "Il finit son verre. La tribune chante ton nom, un peu trop fort."

  # ------------------------------------------------- F1 · quarante-quatre jours
  - id: en.clow.44_jours
    roles: [entraineur]
    arc: direction
    tags: [direction, piege]
    speaker: clow
    tone: leger
    once: true
    text: "Clow, au téléphone : « Peur du président ? Quarante-quatre jours dans un grand club. Je ne dirais pas que j'étais le meilleur, mais j'étais dans le top un. »"
    left:
      label: "Je l'écoute"
      effects: {var: {clow_conseils: "+1"}, relation: {clow: 1}, direction: "-"}
      answer: "Une heure au téléphone. Le président t'a cherché pendant une heure."
    right:
      label: "Je gère"
      effects: {relation: {clow: -1}, direction: "+"}
      answer: "Tu raccroches le premier. Le président t'a vu raccrocher. Il apprécie."

  # ------------------------------------------------------------ F2 · le verre
  - id: en.clow.verre
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, piege]
    speaker: clow
    tone: leger
    once: true
    text: "Brian Clow, verre plein à ras bord : « Une promesse, petit, c'est un chèque. Tu en as signé combien ? Un vestiaire, c'est un verre : trop plein, ça déborde. »"
    left:
      label: "J'en ai signé trop"
      effects: {var: {clow_conseils: "+1"}, parole: 1}
      answer: "Il lève son verre sans boire. Une goutte tombe sur la nappe. Il la regarde."
    right:
      label: "Ce sont mes chèques"
      effects: {relation: {clow: -1}}
      answer: "Il repose le verre. Il ne le finit pas. Il ne finit jamais ceux-là."

  # ---------------------------------------------------------- F2b · le silence
  # Sortie basse de l'arc : trop tôt ou pas assez écouté. Les deux côtés posent
  # clow_ingrat ; seule la relation diffère.
  - id: en.clow.silence
    roles: [entraineur]
    arc: divers
    tags: [direction]
    speaker: clow
    tone: leger
    once: true
    text: "Clow, répondeur : « Tu n'appelles plus. Bon signe, un coach qui écoute n'en est pas un. Je ne dirais pas que j'étais le meilleur, mais j'étais dans le top un. »"
    left:
      label: "Je le rappelle"
      effects: {set: [clow_ingrat], relation: {clow: 1}}
      answer: "Répondeur. Tu raccroches avant le bip. Le numéro reste dans le carnet, sans nom."
    right:
      label: "Il a fait son temps"
      effects: {set: [clow_ingrat], relation: {clow: -1}, direction: "+"}
      answer: "Tu effaces le message. Le président, lui, en a un tout prêt pour toi."

  # ----------------------------------------------------------- F3 · l'hôpital
  # Drame sans choix : les deux côtés sont identiques, aucun effet.
  - id: en.clow.hopital
    roles: [entraineur]
    arc: moment
    tags: [moment]
    speaker: josiane
    tone: drame
    once: true
    text: "Madame Josiane, sans frapper : « Monsieur Clow est à l'hôpital. Il a demandé si vous aviez gagné dimanche. Il n'a pas demandé le score. »"
    left:
      label: "Je prends mon manteau"
      effects: {}
      answer: "Chambre 12. Il dort. Sur la table, un verre d'eau plein à ras bord."
    right:
      label: "Je prends mon manteau"
      effects: {}
      answer: "Chambre 12. Il dort. Sur la table, un verre d'eau plein à ras bord."

  # --------------------------------------------------------- F4 · le testament
  - id: en.clow.testament
    roles: [entraineur]
    arc: moment
    tags: [moment, direction]
    speaker: josiane
    tone: leger
    once: true
    text: "Madame Josiane, une enveloppe : « Il a laissé ça pour vous. Dedans, une phrase et un choix : dire ce que vous pensez, ou voir ce que les autres cachent. »"
    left:
      label: "Franc-parler"
      effects: {set: [franc_parler]}
      answer: "La phrase : « Je ne dirais pas que j'étais le meilleur, mais j'étais dans le top un. » Tu la dis en conférence samedi. Ménèche note."
    right:
      label: "Nez à joueurs"
      effects: {set: [nez_a_joueurs]}
      answer: "La phrase : « Je ne dirais pas que j'étais le meilleur, mais j'étais dans le top un. » Tu la gardes. Tu regardes les autres, désormais."

  - id: en.clow.testament_ingrat
    roles: [entraineur]
    arc: moment
    tags: [moment]
    speaker: josiane
    tone: leger
    once: true
    text: "Madame Josiane, les mains vides : « Il n'a rien laissé. Le fils de Clow a demandé qu'on ne vous prévienne pas de l'enterrement. J'en ai vu passer, vous savez. »"
    left:
      label: "Je comprends"
      effects: {set: [clow_ingrat]}
      answer: "Tu y vas quand même. Au fond, derrière un pilier. Le fils te voit. Il ne dit rien."
    right:
      label: "Je comprends"
      effects: {set: [clow_ingrat]}
      answer: "Tu y vas quand même. Au fond, derrière un pilier. Le fils te voit. Il ne dit rien."

  # ================================================ G · La conférence de presse
  # ------------------------------------------------------ G1 · trois questions
  # Pas `once` : l'arc est ré-armé chaque saison et la carte doit ressortir.
  - id: en.presse.trois_questions
    roles: [entraineur]
    arc: presse
    tags: [presse, piege]
    speaker: meneche
    tone: leger
    cooldown: 14
    text: "Ménèche, micro posé sur la table : « Trois questions, un journaliste gentil. Juste une question, hors micro. L'objectif, vous y croyez ou vous le dites ? »"
    left:
      label: "Je ne commente pas"
      effects: {var: {no_comment: "+1"}, tribunes: "-", direction: "+"}
      answer: "Il note le silence. Il note toujours. Le président apprécie qu'on note peu."
    right:
      label: "Franchement"
      effects: {tribunes: "+", parole: 1, promise: true, relation: {meneche: 1}}
      answer: "Il note « franchement ». Le mot sort en titre samedi, avec un point d'interrogation."

  # --------------------------------------------------- le mème (routine S1+)
  # Ramasse les « je ne commente pas » de A3, B5a et G1. Priorité 2 : sort dès
  # qu'un slot de routine est libre.
  - id: en.presse.meme
    roles: [entraineur]
    arc: presse
    tags: [presse, absurde]
    speaker: meneche
    tone: leger
    once: true
    priority: 2
    when: "count('no_comment') >= 3"
    text: "Ménèche, une photocopie à la main : « Trois « je ne commente pas ». Votre visage est partout avec la légende. Juste une question, hors micro. Vous en riez ? »"
    left:
      label: "J'en ris"
      effects: {tribunes: "+", relation: {meneche: 1}}
      answer: "Tu signes une photocopie. Elle finit au local de Gégé, au-dessus du bar."
    right:
      label: "Je porte plainte"
      effects: {tribunes: "--", relation: {meneche: -2}}
      answer: "La plainte fait un deuxième mème. Avec la même légende, en plus gros."
