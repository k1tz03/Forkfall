# Cartes de l'intrigue « La cote du promu » (arcs/entraineur/cote_du_promu.yaml).
# L'empire et la cote sont les anciennes ancres A2 et A3 du script du promu ;
# l'encaissement est la conséquence, en quatre variantes.
# Le nom du joueur : Vaubourg le dit à l'empire ({toi} → « {nom} »), Josiane à
# l'encaissement ; jamais à la cote, entre les deux. Réactions : Josiane et le
# chèque non daté (empire ← budget), Massenet qui compte les « projet » (empire
# → projet), Massenet en embuscade (cote → je ne commente pas).
cards:
  # 1 · L'empire — Vaubourg vend le rêve
  - id: en.cote.empire
    roles: [entraineur]
    arc: direction
    tags: [direction, caisse]
    speaker: aulard
    tone: leger
    once: true
    text: "Vaubourg, la main sur le combiné d'un abonné qui attend : « Un promu, ça fait rêver, {toi}. Moi, je vends le rêve ; toi, tu le fais tenir jusqu'en mai. Un budget, ou un projet ? »"
    left:
      label: "Un budget, ou rien"
      effects: {caisse: "+", direction: "--", relation: {aulard: -1}, react: {card: en.re.josiane_cheque, chance: 0.7}, journal: {text: "{annee} : « Un budget, ou rien. » Le président a signé un chèque pour {nom}. Sans le dater.", poids: 2, tags: [direction, caisse]}}
      answer: "Il signe un chèque. Il ne le date pas."
    right:
      label: "Un projet, et le maintien"
      effects: {direction: "++", parole: 1, promise: true, set: [projet_promis], relation: {aulard: 1}, react: {card: en.re.meneche_projet, chance: 0.7}}
      answer: "Il répète « projet » à trois journalistes avant le parking."

  # 2 · La cote — Massenet vend la cote
  - id: en.cote.cote
    roles: [entraineur]
    arc: presse
    tags: [presse, tribunes]
    speaker: meneche
    tone: leger
    once: true
    text: "Massenet pose la page des cotes sur la table : « Cinq mille contre un pour le titre, cinq contre un pour le maintien. Vous avez parié ? Dites-le-moi, et je vous dis qui a parié contre. »"
    left:
      label: "Sur le maintien, cent francs"
      effects: {tribunes: "++", parole: 1, set: [pari_promu], relation: {meneche: 1}}
      answer: "Il note la somme. En échange, il te souffle un nom du conseil d'administration : celui-là a misé sur la descente."
    right:
      label: "Je ne commente pas"
      effects: {var: {no_comment: "+1"}, relation: {meneche: -1}, direction: "+", journal: {text: "{annee} : cinq mille contre un pour le titre. {nom} n'a pas commenté la cote ; Massenet a noté le silence.", poids: 1, tags: [presse]}}
      answer: "Il referme le carnet sur le nom. « Tant pis, coach. Je le vendrai à quelqu'un d'autre. »"

  # 3 · L'encaissement — le pari tient (classement de l'instant ≤ 13)
  - id: en.cote.encaissement_gagne
    roles: [entraineur]
    arc: presse
    tags: [presse, tribunes]
    speaker: meneche
    tone: leger
    once: true
    text: "Massenet, ton ticket entre deux doigts : « Cent francs sur le maintien, et le maintien tient. L'homme du conseil, lui, a doublé sur la descente. Vous encaissez, ou vous laissez courir ? »"
    left:
      label: "J'encaisse"
      effects: {caisse: "+", tribunes: "+", outcome: pari_tenu, relation: {meneche: 1}, journal: {text: "{annee} : {nom} a encaissé cinq cents francs : cent sur le maintien, à cinq contre un. Photo du ticket en Une.", poids: 2, tags: [presse, caisse]}}
      answer: "Il photographie le ticket. La Une de demain a sa photo."
    right:
      label: "Je laisse courir"
      effects: {tribunes: "++", parole: 1, outcome: pari_tenu, journal: {text: "{annee} : le pari tenait ; {nom} a laissé courir. Le virage a appris le mot « courir » et l'a aimé.", poids: 2, tags: [presse, tribunes]}}
      answer: "Le virage apprend le mot « courir ». Il l'aime."

  # 3 · L'encaissement — le pari est mal parti
  - id: en.cote.encaissement_perdu
    roles: [entraineur]
    arc: presse
    tags: [presse, direction]
    speaker: meneche
    tone: strategique
    once: true
    text: "Massenet, sans ticket : « Cent francs sur le maintien, et le classement dit autre chose. L'homme du conseil qui a misé contre vous sourit depuis lundi. Vous doublez ? »"
    left:
      label: "Je double"
      effects: {tribunes: "+", caisse: "-", parole: -1, outcome: pari_perdu, journal: {text: "{annee} : le pari était mal parti ; {nom} a doublé. Massenet a noté la perte, il note surtout celles-là.", poids: 2, tags: [presse, caisse]}}
      answer: "Il inscrit la nouvelle somme sous l'ancienne et souligne le total deux fois."
    right:
      label: "Je ne joue plus"
      effects: {direction: "+", tribunes: "-", outcome: pari_perdu, relation: {meneche: -1}, journal: {text: "{annee} : « Il ne joue plus », a titré Massenet. Vaubourg a découpé l'article.", poids: 2, tags: [presse, direction]}}
      answer: "Titre du lendemain : « Il ne joue plus ». Vaubourg découpe l'article."

  # 3 · L'encaissement — le projet promis au président
  - id: en.cote.encaissement_projet
    roles: [entraineur]
    arc: presse
    tags: [presse, direction]
    speaker: meneche
    tone: leger
    once: true
    text: "Massenet, calepin ouvert sur une page où « projet » est écrit onze fois : « Le président le dit depuis août, et je n'ai toujours pas la suite. Le projet, en un mot ? »"
    left:
      label: "Le maintien"
      effects: {parole: 1, direction: "-", outcome: jamais_parie, relation: {meneche: 1}, journal: {text: "{annee} : « Le projet, en un mot ? » « Le maintien. » {nom} l'a dit, Massenet l'a écrit en gros.", poids: 2, tags: [presse, direction]}}
      answer: "Un mot. Il l'écrit en gros."
    right:
      label: "Le Top 10"
      effects: {tribunes: "++", direction: "+", parole: -1, outcome: jamais_parie, journal: {text: "{annee} : « Le projet, en un mot ? » « Le Top 10. » Deux mots ; Vaubourg les a répétés à trois journalistes.", poids: 2, tags: [presse, direction]}}
      answer: "Deux mots. Vaubourg les répète à trois journalistes."

  # 3 · L'encaissement — personne n'a parié : Josiane affiche les cotes
  - id: en.cote.encaissement
    roles: [entraineur]
    arc: caisse
    tags: [caisse, vestiaire]
    speaker: josiane
    tone: leger
    once: true
    text: "Madame Josiane tend un bordereau découpé dans le journal : « Les cotes de janvier, {toi}. Cinq cents contre un pour le titre ; en août, c'était cinq mille. On l'affiche au vestiaire ? »"
    left:
      label: "On affiche"
      effects: {vestiaire: "+", tribunes: "+", outcome: jamais_parie, journal: {text: "{annee} : cinq cents contre un en janvier. Les cotes affichées au vestiaire ; Bréhaut les a encadrées.", poids: 1, tags: [caisse, vestiaire]}}
      answer: "Le vestiaire lit la cote. Bréhaut l'encadre."
    right:
      label: "On jette"
      effects: {vestiaire: "-", direction: "+", outcome: jamais_parie}
      answer: "Elle jette. Elle en garde une copie."
