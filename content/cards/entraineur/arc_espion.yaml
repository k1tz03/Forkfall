# Cartes d'étape de « L'espion dans la haie »
# (content/arcs/entraineur/espion.yaml). Toutes hors du sac.
# Le nom du joueur : nulle part ici sauf le retour — c'est une intrigue de
# regards, pas de titres ; Vukić parle bas, sans tourner la tête,
# Gégé dit {toi}. Traces : espion_cafe, espion_presse, espion_retour.
cards:
  # ----------------------------------------------------------- S1 · la casquette
  - id: en.espion.haie
    roles: [entraineur]
    arc: presse
    tags: [presse, absurde]
    speaker: vukic
    tone: leger
    text: "Vukić parle au rond central, pas à toi : « Fond du terrain, à gauche du poteau : une casquette, des jumelles, vingt minutes sans bouger. Samedi, on va chez {rival}. Je continue la vraie séance ? »"
    left:
      label: "On lui montre un faux onze"
      effects: {force: 2, vestiaire: "-", relation: {vukic: 1}, next: {step: cafe, in: [1, 2]}}
      answer: "Tu fais répéter une défense à trois que tu ne joueras jamais. La casquette note tout, page après page."
    right:
      label: "J'appelle Massenet"
      effects: {tribunes: "+", direction: "-", relation: {meneche: 1}, next: {step: presse, in: [1, 3]}}
      answer: "Massenet arrive en vingt minutes avec un photographe. La haie est vide ; une voiture grise s'en va."

  - id: en.espion.haie_encore
    roles: [entraineur]
    arc: presse
    tags: [presse, absurde, retorse]
    speaker: vukic
    tone: leger
    text: "Vukić, sans tourner la tête : « Il est revenu. Autre casquette, mêmes jumelles, même trou dans la haie, qu'on n'a jamais bouché. Il ne se cache même plus. On lui joue quoi ? »"
    left:
      label: "On lui montre un faux onze"
      effects: {force: 2, vestiaire: "-", relation: {vukic: 1}, next: {step: cafe, in: [1, 2]}}
      answer: "Deux faux onze en deux ans. Il note les deux, sur la même page."
    right:
      label: "J'appelle Massenet"
      effects: {tribunes: "+", direction: "-", relation: {meneche: 1}, next: {step: presse, in: [1, 3]}}
      answer: "Le photographe vient avec le même objectif que la dernière fois. La haie est vide ; le trou, lui, est toujours là."

  - id: en.espion.haie_car
    roles: [entraineur]
    arc: presse
    tags: [presse, absurde]
    speaker: vukic
    tone: leger
    text: "Vukić montre le parking du menton : « Plus personne dans la haie. Il y a un homme dans le car de la presse qui filme nos ateliers, pas le terrain. On ferme le car, ou on ferme les yeux ? »"
    left:
      label: "On ferme le car"
      effects: {force: 2, direction: "-", relation: {vukic: 1}, next: {step: cafe, in: [1, 2]}}
      answer: "Le car repart vide. La cassette, elle, est déjà partie dans une autre voiture."
    right:
      label: "J'appelle Massenet"
      effects: {tribunes: "+", direction: "-", relation: {meneche: 1}, next: {step: presse, in: [1, 3]}}
      answer: "Massenet monte dans le car et en redescend avec un nom. Il ne te le donne pas ; il le garde pour samedi."

  # Variante `flag('cassette_regardee')` (bible ch. 11, scène en.espion.haie) :
  # elle manquait à la transcription, alors que la matrice du ch. 90 § 1
  # déclare `cassette_regardee` comme une trace LUE — sans elle, la couture
  # annoncée n'existait pas. Le seau et le carnet viennent de la cassette du
  # mystique (arc_interim_grand_nom.yaml).
  - id: en.espion.haie_eleve
    roles: [entraineur]
    arc: presse
    tags: [presse, absurde, retorse]
    speaker: vukic
    tone: leger
    text: "Vukić, sans quitter le rond central des yeux : « Une casquette dans la haie, un seau retourné, un carnet. Pas Vaz : quelqu'un qui a regardé sa cassette, comme toi. On lui montre quoi ? »"
    left:
      label: "On lui montre un faux onze"
      effects: {force: 2, vestiaire: "-", relation: {vukic: 1}, next: {step: cafe, in: [1, 2]}}
      answer: "Tu fais répéter un faux onze. L'élève note, souligne, recopie au propre ; il croit tout."
    right:
      label: "J'appelle Massenet"
      effects: {tribunes: "+", direction: "-", relation: {meneche: 1}, next: {step: presse, in: [1, 3]}}
      answer: "Le photographe arrive trop tard. Il ne reste qu'un seau retourné ; Vukić le range au local du matériel."

  # ----------------------------------------------------------- S2a · le café
  - id: en.espion.cafe
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, presse]
    speaker: gege
    tone: leger
    text: "Gégé arrive avec deux gobelets : « On l'a vu depuis le bar, {toi}, on a apporté un café pour lui et un pour toi. Je le lui offre gentiment, ou je le raccompagne gentiment ? »"
    left:
      label: "Le café, gentiment"
      effects: {tribunes: "++", relation: {gege: 1}, set: [espion_cafe], outcome: cafe, react: en.re.gege_jumelles}
      answer: "Il boit le café debout. Il donne son prénom, et dit que chez eux la haie est plus haute. Gégé note la plaque."
    right:
      label: "Raccompagne-le, gentiment"
      effects: {tribunes: "+", direction: "-", set: [espion_cafe], outcome: cafe, react: en.re.gege_jumelles}
      answer: "Trois écharpes autour d'une voiture grise. Elle démarre en marche arrière, longtemps."

  # ----------------------------------------------------------- S2b · le croquis
  - id: en.espion.presse
    roles: [entraineur]
    arc: presse
    tags: [presse, scandale]
    speaker: meneche
    tone: strategique
    text: "Massenet dessine la haie sur son carnet, une croix au bon endroit : « J'écris « un espion de {rival} », ou « un homme à jumelles » ? Le second est vrai. Le premier se vend. »"
    left:
      label: "Écrivez « espion »"
      effects: {tribunes: "++", direction: "-", parole: -1, set: [espion_presse], outcome: presse, relation: {meneche: 1}, react: en.re.vukic_croquis}
      answer: "Le journal titre le lendemain. {rival} dément avec un communiqué qui mentionne la haie."
    right:
      label: "Écrivez ce qui est vrai"
      effects: {tribunes: "+", parole: 1, set: [espion_presse], outcome: presse, relation: {meneche: -1}, react: en.re.vukic_croquis}
      answer: "Il écrit « un homme ». Le croquis paraît en page six, avec la croix."

  # ------------------------------------------ S1 bis · la casquette, sans l'adjoint
  # Repli de porteur : l'intrigue est portée par Vukić, et quand il quitte le
  # club l'étape armée tombait (raison `statut`) — l'histoire commençait, tenait
  # deux ou trois créneaux, puis disparaissait sans issue. Le capitaine, déjà au
  # cast, la reprend : c'est lui qui regarde la haie depuis le rond central.
  - id: en.espion.haie_brehaut
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, presse, absurde]
    speaker: brehaut
    tone: leger
    text: "Bréhaut, une chaussure à la main, montre le fond du terrain : « La casquette, là, dans la haie : vingt minutes qu'elle ne bouge pas. Avant, Zoran serait déjà allé voir. On fait quoi ? »"
    left:
      label: "On lui montre un faux onze"
      effects: {force: 2, vestiaire: "-", relation: {brehaut: 1}, next: {step: cafe, in: [1, 2]}}
      answer: "Tu fais répéter un faux onze. La casquette note ; Bréhaut compte les pages qu'elle tourne."
    right:
      label: "J'appelle Massenet"
      effects: {tribunes: "+", direction: "-", relation: {meneche: 1}, next: {step: presse, in: [1, 3]}}
      answer: "Massenet arrive avec un photographe. Le temps qu'il cadre, la haie est vide ; une voiture grise tourne au coin."

  # ----------------------------------------------------------- S3 · la compo
  - id: en.espion.compo
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut tapote la feuille de match vierge : « L'autre a vu la séance de mardi, la vraie ou la fausse. Les gars ne savent plus laquelle ils ont répétée. Tu joues ce qu'il a vu, ou autre chose ? »"
    left:
      label: "Ce qu'il a vu, à l'envers"
      effects: {force: 3, vestiaire: "-", relation: {brehaut: -1}}
      answer: "Tu joues mardi à l'envers, côté pour côté. Leur plan était fait pour l'autre ; à la vingtième, le petit est seul."
    right:
      label: "Ce qu'on joue toujours"
      effects: {vestiaire: "+", force: -1, relation: {brehaut: 1}}
      answer: "Le onze de toujours. Il le connaissait ; il connaît aussi le sien, et ça ne l'a jamais aidé."

  - id: en.espion.compo_cafe
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, ultras, retorse]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut pose une feuille pliée sur la table de massage : « Gégé l'a glissée dans mon sac : leur compo. Le café a duré deux heures sur le parking, paraît-il. Tu la regardes, ou tu fais l'honnête ? »"
    left:
      label: "Je la regarde"
      effects: {force: 3, parole: -1, tribunes: "+"}
      answer: "Tu la regardes. Elle est fausse ; ils avaient aussi un faux onze."
    right:
      label: "Je fais l'honnête"
      effects: {vestiaire: "+", parole: 1}
      answer: "Tu ne la regardes pas. Bréhaut la regarde pour toi."

  # ----------------------------------------------------------- S4 · le retour
  - id: en.espion.retour
    roles: [entraineur]
    arc: presse
    tags: [presse, absurde, chaine]
    speaker: vukic
    tone: leger
    text: "Vukić tient des jumelles neuves par la courroie : « On les joue samedi. Leur haie est plus haute que la nôtre, mais leur parking donne sur le terrain. Tu m'envoies ? »"
    left:
      label: "Vas-y, sans te faire voir"
      effects: {force: 3, parole: -1, set: [espion_retour], outcome: retour, relation: {vukic: 1}}
      answer: "Il revient à midi. Il a vu leur faux onze, et leur gardien qui fume."
    right:
      label: "On ne fait pas ça"
      effects: {parole: 1, tribunes: "+", force: -1, set: [espion_retour], outcome: retour}
      answer: "Il range les jumelles. Le samedi, dans leur tribune, quelqu'un porte une casquette et te salue."

  # ------------------------------------------- S4 bis · le retour, sans l'adjoint
  - id: en.espion.retour_brehaut
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, presse, chaine]
    speaker: brehaut
    tone: leger
    text: "Bréhaut fait tourner une paire de jumelles au bout de la courroie : « Leur haie est plus haute que la nôtre, {toi}, et j'ai un cousin qui habite en face. Je regarde, ou je range ça ? »"
    left:
      label: "Regarde, sans te faire voir"
      effects: {force: 3, parole: -1, set: [espion_retour], outcome: retour, relation: {brehaut: 1}}
      answer: "Il revient à midi. Il a vu leur faux onze, et leur gardien qui fume derrière le but."
    right:
      label: "On ne fait pas ça"
      effects: {parole: 1, tribunes: "+", force: -1, set: [espion_retour], outcome: retour}
      answer: "Il range les jumelles chez son cousin. Le samedi, quelqu'un dans leur tribune te salue."
