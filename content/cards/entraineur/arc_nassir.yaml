# Cartes d'étape de l'arc « Le sponsor qui devient propriétaire »
# (content/arcs/entraineur/nassir.yaml). Toutes sont des étapes (kind: etape
# dérivé par le build), jamais dans le sac. `arc:` est le THÈME de la carte,
# pas l'id de l'arc. Remplace la routine co.sponsor.maillot (doublon de C1).
# Le nom du joueur : Ilyas dit {toi} (« coach » tant qu'il vous respecte,
# « monsieur {nom} » quand il ne vous respecte plus) au maillot et au prêt ;
# Josiane le lit sur le logo au rachat. Réactions : la mère de Mbako après
# l'orange, Ilyas qui reviendra après chaque refus. Traces : nassir_sponsor,
# naming_signe, club_a_lancienne, nassir_pret, club_actif.
cards:
  # ------------------------------------------------------------- C1 · maillot
  # Variante « encore » qui lit une autre intrigue (ch. 11 § 2.3.1) : le fonds
  # a retiré ses panneaux (nassir_retire, ch. 02) et revient sans eux.
  - id: en.nassir.maillot_sans_panneaux
    roles: [entraineur]
    arc: sponsors
    tags: [sponsors, absurde, caisse]
    speaker: nassir
    tone: strategique
    text: "Cheikh Ilyas, devant le rectangle propre sur le mur : « Nous avions retiré nos panneaux ; il en reste un au local, paraît-il. Nous revoilà, {toi}, et le maillot est à nous. »"
    left:
      label: "Le maillot est sacré"
      effects: {caisse: "-", tribunes: "+", relation: {nassir: -1}, var: {nassir_refus: "+1"}, set: [nassir_retire], journal: {text: "{annee} : le fonds est revenu chercher ses panneaux. {nom} a redit non ; le rectangle est resté propre.", poids: 2, tags: [sponsors]}}
      answer: "Il repose la canette sur le rectangle propre. Elle y laisse un rond."
    right:
      label: "Va pour le maillot, encore"
      effects: {caisse: "++", tribunes: "--", var: {nassir_palier: "=1"}, set: [nassir_sponsor], react: {card: en.re.mere_orange, chance: 0.7}}
      answer: "Le panneau du local revient au parking. Gégé l'a rendu ; il a gardé une vis."

  # Variante « encore » (relance, plays >= 1) : le fonds revient, canette neuve.
  - id: en.nassir.maillot_encore
    roles: [entraineur]
    arc: sponsors
    tags: [sponsors, absurde, caisse]
    speaker: nassir
    tone: leger
    text: "Cheikh Ilyas pose une canette neuve sur ton bureau : « Nous revoilà, {toi}. Depuis votre refus, notre offre a pris dix pour cent ; votre caisse en a perdu trente. Le maillot, maintenant ? »"
    left:
      label: "Le maillot est sacré"
      effects: {caisse: "-", tribunes: "+", relation: {nassir: -1}, var: {nassir_refus: "+1"}, set: [nassir_retire], journal: {text: "{annee} : le fonds est revenu avec une canette neuve. {nom} a encore dit non.", poids: 1, tags: [sponsors]}}
      answer: "Il repose la canette. Il la laisse sur le bureau, pleine."
    right:
      label: "Va pour l'orange, encore"
      effects: {caisse: "++", tribunes: "--", var: {nassir_palier: "=1"}, set: [nassir_sponsor], react: {card: en.re.mere_orange, chance: 0.7}, journal: {text: "{annee} : le fonds est revenu, le maillot est repassé à l'orange. Gégé a compté les manches.", poids: 2, tags: [sponsors, tribunes]}}
      answer: "Le maillot est orange lundi. Gégé compte les manches."

  - id: en.nassir.maillot
    roles: [entraineur]
    arc: sponsors
    tags: [sponsors, absurde, tribunes]
    speaker: nassir
    tone: leger
    text: "Cheikh Ilyas fait tourner une canette orange sur ton bureau : « Votre maillot a une histoire, votre caisse a un trou. Nous bouchons le trou si le maillot prend notre couleur. Orange, {toi}. »"
    left:
      label: "Le maillot est sacré"
      effects: {caisse: "-", tribunes: "+", relation: {nassir: -1}, var: {nassir_refus: "+1"}, set: [nassir_retire], journal: {text: "{annee} : {nom} a refusé l'orange fluo. Ilyas a reposé la canette sans la finir.", poids: 2, tags: [sponsors, tribunes]}}
      answer: "Il repose la canette. Il ne la finit pas."
    right:
      label: "Va pour l'orange"
      effects: {caisse: "++", tribunes: "--", var: {nassir_palier: "=1"}, set: [nassir_sponsor], react: {card: en.re.mere_orange, chance: 0.7}}
      answer: "Au premier match en orange, la tribune nord tourne le dos pendant l'échauffement. Gégé a donné le signal."

  # ------------------------------------------- C2 · naming (variante express)
  # Cible du saut d'arc depuis A4 (en.promu.a4_commission → « On trouve un
  # sponsor », schedule in [2,4]) : Ilyas arrive sans être passé par le maillot.
  - id: en.nassir.naming_express
    roles: [entraineur]
    arc: sponsors
    tags: [sponsors, direction, tribunes]
    speaker: nassir
    tone: strategique
    text: "Cheikh Ilyas, au fax : « Un sponsor qui paie d'avance ? Nous payons d'avance. Arena Almadis, dix millions, le vieux président sur une plaque aux toilettes. »"
    left:
      label: "Le stade garde son nom"
      effects: {caisse: "-", tribunes: "+", relation: {gege: 1}, var: {nassir_refus: "+1"}, react: en.re.nassir_reviendrons, journal: {text: "{annee} : le stade garde son nom. La Commission attend toujours son plan ; Vaubourg aussi.", poids: 2, tags: [sponsors, direction]}}
      answer: "La Commission attend toujours son plan. Vaubourg aussi."
    right:
      label: "Signez"
      effects: {caisse: "+++", tribunes: "---", relation: {gege: -2}, var: {nassir_palier: "=2"}, set: [naming_signe], outcome: naming, react: {card: en.re.nassir_courbe, chance: 0.6}}
      answer: "La Commission a son plan. Gégé apprend le nom sur une pancarte."

  # -------------------------------------------------------------- C2 · naming
  - id: en.nassir.naming
    roles: [entraineur]
    arc: sponsors
    tags: [sponsors, tribunes, direction]
    speaker: nassir
    tone: strategique
    text: "Cheikh Ilyas déroule un plan du stade sur ton bureau : « Arena Almadis : dix millions sur cinq ans. Le nom du fondateur, nous le gardons, en petit, sous le tableau d'affichage. Il ne rapporte rien. »"
    left:
      label: "Le stade garde son nom"
      effects: {caisse: "-", tribunes: "+", relation: {gege: 1}, var: {nassir_refus: "+1"}, react: en.re.nassir_reviendrons, journal: {text: "{annee} : le stade garde son nom. Gégé l'a appris par Josiane ; il lui a offert un vrai café.", poids: 2, tags: [sponsors, tribunes]}}
      answer: "Gégé l'apprend par Josiane. Il lui offre un café. Un vrai."
    right:
      label: "Signez"
      effects: {caisse: "+++", tribunes: "---", relation: {gege: -2}, var: {nassir_palier: "=2"}, set: [naming_signe], outcome: naming, react: {card: en.re.nassir_courbe, chance: 0.6}}
      answer: "Gégé apprend le nom sur une pancarte. Le soir, au local, il écrit la date à la craie, sous les autres."

  # ------------------------------------------------------------- C2b · retrait
  # Une seule sortie : gauche et droite identiques. Refus total → le trait
  # `club_a_lancienne` ; le `when` de l'arc interdit toute réouverture.
  - id: en.nassir.retrait
    roles: [entraineur]
    arc: sponsors
    tags: [sponsors, caisse]
    speaker: nassir
    tone: leger
    text: "Un fax d'Almadis, trois lignes, signé d'une initiale : « Nous retirons notre offre. Le dossier {club} est clos. Nous ne rouvrons pas les dossiers clos. »"
    left:
      label: "Bon vent"
      effects: {caisse: "-", set: [club_a_lancienne]}
      answer: "Josiane range le fax avec les autres. Le radiateur tousse."
    right:
      label: "Bon vent"
      effects: {caisse: "-", set: [club_a_lancienne]}
      answer: "Josiane range le fax avec les autres. Le radiateur tousse."

  # ---------------------------------------------------------------- C3 · pret
  - id: en.nassir.pret
    roles: [entraineur]
    arc: caisse
    tags: [sponsors, caisse, direction]
    speaker: nassir
    tone: strategique
    text: "Cheikh Ilyas, sans canette : « Un prêt sans intérêt ni garantie. Presque : une option sur Mbako, et cinquante et un pour cent. Vous restez coach, {toi}. De nom. »"
    left:
      label: "Ni le petit, ni le club"
      # Fin de l'arc : le retrait (`club_a_lancienne`) est réservé au palier 0.
      effects: {relation: {nassir: -2}, caisse: "-", var: {nassir_refus: "+1"}, next: end, react: en.re.nassir_reviendrons, journal: {text: "{annee} : ni le petit, ni le club. {nom} a renvoyé le prêt de Ilyas ; il l'a plié en quatre.", poids: 2, tags: [sponsors, caisse]}}
      answer: "Il plie le contrat en quatre. Il le garde."
    right:
      label: "Signé"
      effects: {caisse: "+++", var: {nassir_palier: "=3"}, set: [option_mbako, nassir_pret], relation: {aulard: -1}}
      answer: "Le président signe après toi. Il ne lit pas la page trois."

  # -------------------------------------------------------------- C4 · rachat
  - id: en.nassir.rachat
    roles: [entraineur]
    arc: direction
    tags: [direction, caisse, sponsors]
    speaker: josiane
    tone: strategique
    text: "Madame Josiane pose le fax à l'envers sur ton bureau, puis le retourne : « Le fonds a racheté le club cette nuit. En haut, le logo orange. En bas, « {nom} », en petit, sous « ambassadeur ». »"
    left:
      label: "Ambassadeur, alors"
      effects: {direction: "++", caisse: "++", set: [club_actif], enemy: [aulard], arc: [{id: en.kop_qui_aime_trop, status: done}]}
      answer: "Le président apprend le rachat par le même fax. Il monte te voir ; il ne frappe pas."
    right:
      label: "Entraîneur, pas ambassadeur"
      effects: {direction: "---", tribunes: "++", set: [club_actif, parti_tete_haute]}
      answer: "Gégé fait peindre ton nom en grand. Sur une bâche, pas sur un logo."

  # -------------------------------------------------------- C5 · notification
  - id: en.nassir.notification
    roles: [entraineur]
    arc: direction
    tags: [direction, sponsors]
    speaker: nassir
    tone: strategique
    text: "Un fax d'Almadis, trois lignes et une signature : « Votre poste est réorganisé avec effet immédiat. Le fonds vous remercie de votre contribution. Un bureau vous est réservé au sous-sol. »"
    left:
      label: "Je pars"
      effects: {end: en_placard}
      answer: "Le bureau d'ambassadeur n'a pas de fenêtre. Ta plaque est déjà vissée sur la porte."
    right:
      label: "Je conteste"
      effects: {direction: "---", caisse: "-", tribunes: "+", journal: {text: "{annee} : poste « réorganisé » par fax. {nom} a contesté ; l'avocat a demandé la page deux. Il n'y en avait pas.", poids: 3, tags: [direction, sponsors]}}
      answer: "Ton avocat lit le fax. Il demande la page deux. Il n'y en a pas."

  # ------------------------------------------------------- Réaction de l'arc
  # Le build dérive `kind: reaction` de tout `react:` qui la cite : ne pas
  # écrire `kind:`. Après en.nassir.naming (→ Signez) : le fonds montre la
  # courbe (ch. 90 § 2.4, réaction citée par le ch. 11 et écrite ici).
  - id: en.re.nassir_courbe
    roles: [entraineur]
    arc: sponsors
    tags: [sponsors, direction]
    speaker: nassir
    tone: leger
    text: "Cheikh Ilyas pose une feuille où une courbe monte : « Six jours après le changement de nom : plus neuf pour cent de notoriété. Les abonnements, eux, baissent. Nous suivons les deux courbes. »"
    left:
      label: "Je regarde la courbe"
      effects: {caisse: "+", tribunes: "-"}
      answer: "Il laisse la feuille sur le bureau. Elle a une deuxième page, en orange."
    right:
      label: "Je regarde la courbe"
      effects: {caisse: "+", tribunes: "-"}
      answer: "Il laisse la feuille sur le bureau. Elle a une deuxième page, en orange."
