# Cartes d'étape de l'arc « Le prodige » (content/arcs/entraineur/prodige.yaml).
# Toutes sont des étapes (kind: etape dérivé par le build), jamais dans le sac.
# `arc:` est le THÈME de la carte, pas l'id de l'arc.
# Le nom du joueur : Fardelli dit {toi} (« mon ami {prenom} ») à l'étape 3 et
# au salaire, jamais à l'offre (collée à l'étape 3). Réaction : Fardelli après
# le gamin (les deux côtés). Traces : mbako_lance, mbako_vendu, mbako_garde,
# mbako_mere.
cards:
  # ---------------------------------------------------------------- B1 · gamin
  - id: en.prodige.gamin_u19
    roles: [entraineur]
    arc: formation
    tags: [formation, vestiaire]
    speaker: vukic
    tone: leger
    once: true
    text: "Vukić, au bord du terrain des U19, ne quitte pas le gamin des yeux : « Mbako, seize ans. Trois buts aux pros, jeudi. Le président est venu le voir vendredi, avec quelqu'un. »"
    left:
      label: "Titulaire samedi"
      effects: {vestiaire: "-", tribunes: "++", direction: "-", set: [mbako_lance, pepite], relation: {mbako: 2, aulard: -1}}
      answer: "Seize ans. Le virage apprend son nom en dix minutes ; deux rangs plus haut, trois types crient autre chose. Gégé se retourne."
    right:
      label: "Trop tôt, on le protège"
      effects: {direction: "+", relation: {mbako: -1}, react: {card: en.re.fardelli_numero, chance: 0.5}, journal: {text: "{annee} : {nom} a renvoyé Lian Mbako aux U19. « Trop tôt. » Il a regardé ses chaussures.", poids: 2, tags: [formation, vestiaire]}}
      answer: "Il retourne aux U19, les mains dans les manches. Vendredi, le président revient voir l'entraînement, pas seul."

  # ----------------------------------------------------------- B2a · maintenant
  - id: en.prodige.maintenant
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: mbako
    tone: leger
    once: true
    text: "Mbako attend devant ton bureau, les mains dans les manches : « J'ai marqué contre les pros à chaque séance. Samedi, encore en tribune. Ma mère a le numéro d'un club qui me ferait jouer. »"
    left:
      label: "Samedi, tu joues"
      effects: {vestiaire: "-", tribunes: "+", set: [mbako_lance], relation: {mbako: 2}}
      answer: "Il ne sourit pas. Il va chercher ses crampons."
    right:
      label: "Tu attends ton tour"
      effects: {direction: "+", relation: {mbako: -1}, journal: {text: "{annee} : Lian Mbako a demandé à jouer maintenant. {nom} a dit « ton tour ». Il a attendu. Mal.", poids: 2, tags: [vestiaire, formation]}}
      answer: "Il attend. Le lendemain, sa mère est assise dans le bureau de Josiane, un carnet sur les genoux."

  # -------------------------------------------------------------- B2b · la_mere
  - id: en.prodige.la_mere
    roles: [entraineur]
    arc: agents
    tags: [agents, formation]
    speaker: mere_mbako
    tone: leger
    once: true
    text: "La mère de Mbako pose trois exemplaires d'un contrat sur ton bureau, un stylo sur chacun : « Seize ans, un contrat aspirant. Vous le faites jouer, {toi} : c'est un contrat pro. Sans agent. »"
    left:
      label: "Contrat pro, zéro agent"
      effects: {caisse: "-", relation: {mbako: 1}, set: [mbako_mere]}
      answer: "Elle signe les trois. Elle relit la page trois deux fois ; cette page-là, c'est elle qui l'a écrite."
    right:
      label: "Fardelli s'en occupe"
      effects: {caisse: "+", relation: {fardelli: 1, mbako: -1}, journal: {text: "{annee} : le contrat de Lian Mbako confié à Fardelli. Sa mère avait son numéro depuis mardi.", poids: 2, tags: [agents, formation]}}
      answer: "Elle range son stylo. Elle a le numéro de Fardelli depuis mardi."

  # ------------------------------------------------------------- B3 · fardelli
  - id: en.prodige.fardelli_tourne
    roles: [entraineur]
    arc: mercato
    tags: [mercato, agents]
    speaker: fardelli
    tone: leger
    once: true
    text: "Fardelli, cigare éteint, glisse une carte de visite sous ta tasse ; au dos, un trois suivi de sept zéros : « Le petit, dans deux ans. {Toi}, ce jour-là, il ne sera plus à toi. »"
    left:
      label: "On en parle maintenant"
      effects: {caisse: "+", relation: {fardelli: 1}, set: [commission_vente], journal: {text: "{annee} : Fardelli a tourné autour du petit Mbako. {nom} a dit « on en parle ». Trois numéros à appeler.", poids: 2, tags: [mercato, agents]}}
      answer: "Il rallume le cigare. Il a déjà trois numéros à appeler."
    right:
      label: "On n'en parle pas"
      effects: {vestiaire: "+", relation: {fardelli: -1}, journal: {text: "{annee} : Fardelli a tourné autour du petit Mbako. {nom} n'en a pas parlé. Fardelli a noté.", poids: 1, tags: [mercato, agents]}}
      answer: "Il reprend sa carte. Le lendemain, elle est dans le casier du petit, glissée dans une chaussure."

  # ---------------------------------------------- B4 · offre (trois variantes)
  # Saut d'arc depuis A4 « On vend le gamin » : la Commission a tranché avant
  # que Fardelli ait tourné.
  - id: en.prodige.offre_express
    roles: [entraineur]
    arc: mercato
    tags: [mercato, agents, caisse]
    speaker: fardelli
    tone: strategique
    once: true
    # Texte neutre sur le lancement : la cible du saut d'arc depuis A4 arrive
    # souvent après B1 « Titulaire samedi ».
    text: "Fardelli, à huit heures, pose un fax encore tiède : trente millions, en chiffres et en lettres. « Le président a dit oui, la mère a dit non. Il ne manque que toi. »"
    left:
      label: "On vend, la caisse d'abord"
      effects: {caisse: "+++", tribunes: "---", vestiaire: "-", set: [mbako_vendu], relation: {mbako: -2, fardelli: 1, gege: -1}, outcome: vendu, char: {mbako: {statut: vendu}}, react: {card: en.re.mere_clause, chance: 0.6}}
      answer: "Gégé peint « JUDAS » sur la bâche. En doré, quand même."
    right:
      label: "Il reste, je le garde"
      effects: {direction: "--", tribunes: "+", set: [mbako_garde], relation: {mbako: 1, fardelli: -1, aulard: -1}, outcome: garde}
      answer: "Fardelli range son cigare. La Commission, elle, ne range rien."

  - id: en.prodige.offre_lance
    roles: [entraineur]
    arc: mercato
    tags: [mercato, agents, caisse]
    speaker: fardelli
    tone: strategique
    once: true
    text: "Fardelli, tout sourire, déplie un fax : trente millions au bas de la page. « Depuis que tu l'as lancé, ils appellent tous. Le président a dit oui, la mère a dit non. Et toi ? »"
    left:
      label: "On vend, la caisse d'abord"
      effects: {caisse: "+++", tribunes: "---", vestiaire: "-", set: [mbako_vendu], relation: {mbako: -2, fardelli: 1, gege: -1}, outcome: vendu, char: {mbako: {statut: vendu}}, react: {card: en.re.mere_clause, chance: 0.6}}
      answer: "Gégé peint « JUDAS » sur la bâche. En doré, quand même."
    right:
      label: "Il reste, je l'ai lancé"
      effects: {direction: "--", tribunes: "+", set: [mbako_garde], relation: {mbako: 1, fardelli: -1, aulard: -1}, outcome: garde}
      answer: "Fardelli replie le fax en quatre et le glisse dans son portefeuille. « Je le garde au chaud. »"

  - id: en.prodige.offre_banc
    roles: [entraineur]
    arc: mercato
    tags: [mercato, direction, caisse]
    speaker: aulard
    tone: strategique
    once: true
    text: "Vaubourg agite un fax au-dessus de son bureau : « Trente millions pour un gamin qui n'a pas joué une minute chez moi. Mon club n'a jamais vu ce chiffre. Tu bloques, ou tu signes ? »"
    left:
      label: "On signe, la caisse d'abord"
      effects: {caisse: "+++", tribunes: "---", vestiaire: "-", set: [mbako_vendu], relation: {mbako: -2, fardelli: 1, gege: -1}, outcome: vendu, char: {mbako: {statut: vendu}}, react: {card: en.re.mere_clause, chance: 0.6}}
      answer: "Gégé peint « JUDAS » sur la bâche. En doré, quand même."
    right:
      label: "Je bloque, il reste"
      effects: {direction: "--", tribunes: "+", set: [mbako_garde], relation: {mbako: 1, fardelli: -1, aulard: -1}, outcome: garde}
      answer: "Il raccroche au nez de Fardelli. Il note ton nom sur le fax."

  # ------------------------------------------------- B5a · marque (S2, vendu)
  - id: en.prodige.marque_contre_toi
    roles: [entraineur]
    arc: presse
    tags: [presse, tribunes]
    speaker: meneche
    tone: strategique
    once: true
    text: "Massenet, dans le tunnel, carnet ouvert : « Mbako vient de marquer contre vous, et il n'a pas célébré. Il vous a regardé{pg, select, f{e} other{}}. Je peux écrire que vous regrettez ? »"
    left:
      label: "Je regrette"
      effects: {tribunes: "+", vestiaire: "-", relation: {mbako: 1}, journal: {text: "{annee} : Lian Mbako a marqué contre nous sans célébrer. « Je regrette », a dit {nom} ; le vestiaire l'a relu.", poids: 2, tags: [presse, mercato]}}
      answer: "Titre du lendemain : « Le regret ». Le vestiaire le lit deux fois."
    right:
      label: "Je ne commente pas"
      effects: {var: {no_comment: "+1"}, relation: {meneche: -1}, react: {card: en.re.meneche_embuscade, chance: 0.6}, journal: {text: "{annee} : Lian Mbako a marqué contre {club} sans célébrer. {nom} n'a pas commenté.", poids: 2, tags: [presse, mercato]}}
      answer: "Il ferme le carnet. Le lendemain, ta photo en page deux, et dessous, en gros : « Pas de commentaire »."

  # ------------------------------------------------- B5b · salaire (gardé)
  - id: en.prodige.salaire_star
    roles: [entraineur]
    arc: caisse
    tags: [caisse, agents]
    speaker: fardelli
    tone: leger
    once: true
    text: "Fardelli pose un contrat sur ton bureau, le pouce sur la ligne du salaire : « Le petit veut être payé ce qu'il vaut, {toi}. Tu l'as gardé ; moi, je prends ma part. »"
    left:
      label: "Il l'a mérité"
      effects: {caisse: "--", vestiaire: "++", relation: {mbako: 1}, journal: {text: "{annee} : salaire de star pour Lian Mbako, seize ans. Fardelli a compté dix pour cent, le vestiaire a applaudi.", poids: 2, tags: [caisse, agents]}}
      answer: "Le petit signe. Au vestiaire, on applaudit ; Bréhaut, lui, relit sa propre fiche de paie."
    right:
      label: "Pas à seize ans"
      effects: {caisse: "+", vestiaire: "-", relation: {mbako: -2}, journal: {text: "{annee} : « Pas à seize ans » : {nom} a refusé le salaire de star. Le petit a rangé ses crampons sans un mot.", poids: 2, tags: [caisse, agents]}}
      answer: "Il range le contrat. Le petit range ses crampons dans un sac neuf."

  # ------------------------------------------------------- Réaction de l'arc
  # Le build dérive `kind: reaction` de tout `react:` qui la cite : ne pas
  # écrire `kind:`. Après les trois cartes d'offre (← on vend) : la mère lit la
  # clause qu'elle a écrite (ch. 90 § 2.3, « tu as vendu un gamin ; deux
  # personnes s'en souviennent, dont une pour toujours »).
  - id: en.re.mere_clause
    roles: [entraineur]
    arc: mercato
    tags: [mercato, famille]
    speaker: mere_mbako
    tone: strategique
    text: "La mère de Mbako pose un contrat ouvert à la page trois : « Cette clause, c'est moi qui l'ai écrite. Vous l'avez signée sans la lire. Lisez-la maintenant, devant moi. »"
    left:
      label: "Je l'ai lue, madame"
      effects: {relation: {mere_mbako: -1}, parole: 1}
      answer: "Elle repose les trois exemplaires. Le troisième est pour toi ; il est surligné."
    right:
      label: "Je l'ai lue, madame"
      effects: {relation: {mere_mbako: -1}, parole: 1}
      answer: "Elle repose les trois exemplaires. Le troisième est pour toi ; il est surligné."
