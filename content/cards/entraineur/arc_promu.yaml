# Cartes de l'arc de postulat « Sans un sou » (arcs/entraineur/promu.yaml).
# Toutes sont des cartes d'étape (kind script dérivé par le build) : elles ne
# sortent jamais du sac, seulement à leur slot. Saison 1 : l'inventaire (trois
# variantes lues sur le fil rouge tiré), la lettre de la Commission, le dernier
# match, le dernier virage. L'empire et la cote vivent dans arc_cote_du_promu.yaml.
# Saison 2 : l'épilogue (4 variantes), le twist (3 variantes), la deuxième finale.
# Saisons 3+ : deux ancres rejouables, rentrée et veille (+ la variante
# « dauphin » de la veille, qui peut conclure la carrière : fin en_dauphin).
#
# Le nom du joueur (spec variété §1.8) : les ancres nominatives sont A1 (slot 1),
# A4 (10-11), A7 (S1, slot 1-2), A8, A9 et la rentrée — jamais A5/A6 (slots
# 15-17, collés aux échéances des intrigues) ni la veille (collée à la rentrée
# de la saison suivante) : jamais deux cartes de suite avec le nom.
# Les traces du script (choix_maillots, finale_gigi, finale_attaque,
# parti_tete_haute, fidele, special, projet_jeunes, tribune_a_renover,
# vukic_dauphin) écrivent leur ligne d'Almanach ; `journal:` couvre l'autre côté.
cards:
  # ============================================================ saison 1 (S0)
  # A1 · L'inventaire — slot 1 (variante par fil rouge : tribune / argent / président)
  - id: en.promu.a1_inventaire_tribune
    roles: [entraineur]
    arc: caisse
    tags: [caisse, tribunes]
    speaker: josiane
    tone: leger
    once: true
    text: "Madame Josiane pose deux devis côte à côte : « Les maillots neufs ou le chauffage du vestiaire, {toi}. Pas les deux. Gégé est passé voir les maillots hier ; il les a touchés. »"
    left:
      label: "Les maillots"
      effects: {tribunes: "++", vestiaire: "-", set: [choix_maillots], react: {card: en.re.josiane_chauffage, chance: 0.7}}
      answer: "Le virage applaudit la couleur. Le vestiaire souffle dans ses mains."
    right:
      label: "Le chauffage"
      effects: {vestiaire: "+", tribunes: "--", relation: {josiane: 1}, react: {card: en.re.gege_chauffage, chance: 0.6}, journal: {text: "{annee} : le chauffage plutôt que les maillots. Gégé a compté les manches longues.", poids: 2, tags: [caisse, tribunes]}}
      answer: "Au premier entraînement, Gégé compte les manches longues depuis la grille, à voix haute."

  - id: en.promu.a1_inventaire_argent
    roles: [entraineur]
    arc: caisse
    tags: [caisse, sponsors]
    speaker: josiane
    tone: leger
    once: true
    text: "Madame Josiane pose deux devis côte à côte : « Les maillots ou le chauffage, {toi}. Le chauffage, je peux le passer sur le compte du sponsor. Il n'a pas encore signé. »"
    left:
      label: "Les maillots"
      effects: {tribunes: "+", vestiaire: "-", set: [choix_maillots], react: {card: en.re.josiane_chauffage, chance: 0.7}}
      answer: "Les maillots neufs arrivent sans nom sur la poitrine. Le vestiaire souffle dans ses mains."
    right:
      label: "Le chauffage"
      effects: {vestiaire: "+", caisse: "-", relation: {josiane: 1}, journal: {text: "{annee} : le chauffage, payé avec le compte d'un sponsor qui n'existait pas encore.", poids: 2, tags: [caisse, sponsors]}}
      answer: "Elle paie la facture avec le compte du sponsor. Le sponsor n'existe pas encore."

  - id: en.promu.a1_inventaire
    roles: [entraineur]
    arc: caisse
    tags: [caisse, direction]
    speaker: josiane
    tone: leger
    once: true
    text: "Madame Josiane pose deux devis côte à côte, agrafés : « Les maillots neufs ou le chauffage du vestiaire, {toi}. Le compte en paie un. Le fournisseur des maillots rappelle à onze heures. »"
    left:
      label: "Les maillots"
      effects: {tribunes: "+", vestiaire: "-", set: [choix_maillots], react: {card: en.re.josiane_chauffage, chance: 0.7}}
      answer: "Le président trouve que ça fait riche. Le vestiaire souffle dans ses mains."
    right:
      label: "Le chauffage"
      effects: {vestiaire: "+", tribunes: "-", relation: {josiane: 1}, journal: {text: "{annee} : le chauffage plutôt que les maillots. Josiane a noté. Elle note toujours.", poids: 2, tags: [caisse, direction]}}
      answer: "Le chauffagiste passe jeudi. Les vieux maillots ressortent, reprisés aux coudes."

  # A4 · La lettre de la Commission (twist) — slots 10-11
  # Chaque sortie saute dans un autre arc : B (Le prodige, étape `offre`) ou C (Ilyas, étape `naming`).
  - id: en.promu.a4_commission
    roles: [entraineur]
    arc: direction
    tags: [direction, mercato, sponsors]
    speaker: aulard
    tone: strategique
    once: true
    text: "Vaubourg pose la lettre de la Commission sur la compo du week-end : « Sans plan pour janvier, ils bloquent les licences de mon club, {toi}. Le petit Mbako se vend, ou un sponsor paie d'avance. »"
    left:
      label: "On vend le gamin"
      effects:
        direction: "+"
        relation: {mbako: -1}
        set: [commission_vente]
        schedule: [{card: en.prodige.offre_express, in: [2, 4]}]
        react:                                   # carte-réaction servie au tirage suivant (spec variété §1.4)
          - { card: en.re.aulard_sms_brouillon, if: "relation.aulard >= 0" }
          - { card: en.re.josiane_numero }
        # Intention, pas fait accompli : l'offre vient après, et Mbako peut rester
        # (la trace mbako_vendu / mbako_garde de l'intrigue tranche).
        journal: { text: "{annee} : la Commission voulait un plan. {nom} accepte de vendre le petit.", poids: 2, tags: [direction, mercato] }
      answer: "Vaubourg décroche avant que tu aies passé la porte. Fardelli avait déjà le numéro de la mère ; il l'avait avant toi."
    right:
      label: "On trouve un sponsor"
      effects:
        caisse: "-"
        direction: "-"
        set: [commission_sponsor]
        schedule: [{card: en.nassir.naming_express, in: [2, 4]}]
        journal: { text: "{annee} : plutôt un sponsor qu'une vente. {prenom} {nom} a choisi l'orange.", poids: 2, tags: [direction, sponsors] }
      answer: "Josiane compose un numéro à l'étranger. On décroche à la première sonnerie, comme si on attendait."

  # Troisième plan de la Commission : la ville. C'est la seule sortie de A4 qui
  # n'ouvre ni `en.prodige` ni `en.nassir_proprietaire` — les deux sorties de
  # la carte de base sautent directement dans ces deux intrigues (schedule) et
  # poussaient `en.prodige` à 82 % de couverture, hors de la bande [10 %, 65 %]
  # du § 5.1, sans qu'aucun poids de réservoir puisse y faire quoi que ce soit.
  # Servie sur le fil rouge « tribune », c'est-à-dire quand la question de la
  # carrière est déjà « ce club est à la tribune » : le plan passe par la
  # mairie, pas par le mercato ni par le fonds.
  - id: en.promu.a4_commission_mairie
    roles: [entraineur]
    arc: direction
    tags: [direction, tribunes]
    speaker: aulard
    tone: strategique
    once: true
    text: "Vaubourg étale un plan de la ville sur la lettre de la Commission : « Un plan pour janvier, {toi}. Le stade est à la mairie, et la mairie me doit des voix. Tu y montes, ou j'envoie Josiane ? »"
    left:
      label: "J'y vais moi-même"
      effects:
        direction: "+"
        tribunes: "+"
        relation: {aubert: 1}
        set: [commission_mairie]
        schedule: [{card: en.promu.a4_mairie_reponse, in: [2, 4]}]
        journal: { text: "{annee} : la Commission voulait un plan. {prenom} {nom} est allé{pg, select, f{e} other{}} le chercher à la mairie.", poids: 2, tags: [direction, tribunes] }
      answer: "Tu montes à la mairie à pied. Le stade est en face ; ça se voit de son bureau."
    right:
      label: "Envoyez Josiane"
      effects:
        direction: "-"
        caisse: "+"
        relation: {josiane: 1}
        set: [commission_mairie]
        schedule: [{card: en.promu.a4_mairie_reponse, in: [2, 4]}]
        react: en.re.josiane_page_rouge
        journal: { text: "{annee} : la Commission voulait un plan. C'est Josiane qui est montée à la mairie, avec le classeur.", poids: 2, tags: [direction] }
      answer: "Elle prend le classeur rouge et son manteau. Elle connaît l'étage."

  # La réponse de la ville (schedule de A4-mairie) : Madame Aubert entre dans le
  # promu, où elle n'apparaissait jamais — ses deux cartes de palier n'étaient
  # donc jamais tirées.
  - id: en.promu.a4_mairie_reponse
    roles: [entraineur]
    arc: direction
    tags: [direction, tribunes, caisse]
    speaker: aubert
    tone: strategique
    once: true
    text: "Madame Aubert déplie un plan du stade : « La ville avance six mois de subvention, et la ville inaugure quelque chose. Vous avez une tribune Nord ; moi j'ai un ruban. Marché ? »"
    left:
      label: "Marché"
      effects: {caisse: "++", tribunes: "-", relation: {aubert: 2}, set: [subvention_avancee]}
      answer: "Elle note une date de février. Le ruban existe déjà ; il attend un stade."
    right:
      label: "Pas de ruban"
      effects: {direction: "-", tribunes: "+", relation: {aubert: -1}}
      answer: "Elle replie le plan dans le bon sens. La subvention arrivera, à sa date."

  # A5 · Le dernier match — slot 16 (deux variantes selon `vecchio_promis`)
  # Jamais nominative : Gigi dit « coach », et le palier de Gégé, l'encaissement
  # ou les banderoles tombent souvent au slot 15 (jamais deux de suite).
  - id: en.promu.a5_dernier_match
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vecchio
    tone: strategique
    once: true
    text: "Vecchio, gants jaunes sous le bras, devant le tableau de la compo : « Dernier match, coach. Je garde des buts depuis soixante-six ; je voudrais finir dedans. Moi, ou le jeune ? »"
    left:
      label: "Gigi dans les cages"
      effects: {vestiaire: "++", force: -2, relation: {vecchio: 2}, set: [finale_gigi]}
      answer: "Il touche les deux poteaux avant le coup d'envoi, comme en soixante-six. Le vestiaire joue pour lui."
    right:
      label: "Le jeune, l'avenir"
      effects: {vestiaire: "-", force: 2, relation: {vecchio: -2}, journal: {text: "{annee} : dernier match, le jeune dans les buts. Gigi Vecchio a rangé ses gants sans un mot.", poids: 2, tags: [vestiaire, moment]}}
      answer: "Il pose ses gants sur le banc des remplaçants et s'assoit à côté. Il ne les remet pas, même à l'échauffement."

  - id: en.promu.a5_dernier_match_promis
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vecchio
    tone: strategique
    once: true
    text: "Vecchio, gants jaunes sous le bras : « Dernier match, coach. Tu as dit « dans les buts jusqu'en juin », et je l'ai répété à tout le monde. On est en mai. Je les mets, ou c'est le jeune ? »"
    left:
      label: "Gigi dans les cages, promis"
      effects: {vestiaire: "++", force: -2, parole: 1, relation: {vecchio: 2}, set: [finale_gigi]}
      answer: "Il ne dit pas merci. Il touche les deux poteaux et parle au gauche plus longtemps que d'habitude."
    right:
      label: "Le jeune, l'avenir"
      effects: {vestiaire: "-", force: 2, parole: -2, relation: {vecchio: -2}, journal: {text: "{annee} : promis en juin, refusé en mai. Gigi Vecchio a regardé le dernier match du banc.", poids: 3, tags: [vestiaire, moment]}}
      answer: "Il regarde le match du banc, les gants sur les genoux. Le vestiaire, lui, a retenu le mot « promis »."

  # A6 · Le dernier virage — slot 17
  - id: en.promu.a6_dernier_virage
    roles: [entraineur]
    arc: moment
    tags: [direction, moment]
    speaker: aulard
    tone: strategique
    once: true
    text: "Vaubourg, dans l'escalier, tapote la poche de sa veste : « Si on se maintient, je te garde. Si on descend, je te garde aussi, et tu paies le chauffage. Là-dedans, j'ai un numéro. »"
    left:
      label: "On attaque, on se maintient"
      effects: {vestiaire: "+", direction: "-", force: 2, set: [finale_attaque], relation: {aulard: 1}, react: en.re.brehaut_on_attaque}
      answer: "Le vestiaire a entendu « on attaque » par la porte restée ouverte. Le président aussi."
    right:
      label: "On ferme, on assure"
      effects: {tribunes: "--", direction: "+", react: en.re.vukic_bloc_bas, journal: {text: "{annee} : {nom} a fermé le jeu pour le dernier bloc. Gégé a écrit « fermer » sur ton pare-brise.", poids: 2, tags: [direction, moment]}}
      answer: "Le lendemain, « FERMER » est écrit au feutre sur ton pare-brise. Gégé dit qu'il ne sait pas qui ; il a encore le feutre."

  # ============================================================ saison 2 (S1)
  # A7 · Épilogue — slots 1-2, quatre variantes (lues au Bilan de la saison 1)
  - id: en.promu.a7_ingratitude
    roles: [entraineur]
    arc: direction
    tags: [direction]
    speaker: aulard
    tone: strategique
    once: true
    text: "Vaubourg accroche la photo du maintien derrière son bureau ; tu es au bord, l'épaule coupée par le cadre : « Merci, {toi}. Le maintien, c'est le club qui l'a fait. Toi, tu étais là. »"
    left:
      label: "Je claque la porte"
      # Aucun départ réel : le moteur ne change ni de club ni de rôle ici. Le
      # choix est une sortie de bureau, la tête haute, et la carrière continue
      # au même club (pas de `next: end` : l'arc de postulat resterait `done`
      # et openSeason n'enfilerait plus aucune ancre). La trace
      # `parti_tete_haute` dit exactement cela, rien de plus.
      effects: {direction: "--", tribunes: "+", set: [parti_tete_haute]}
      answer: "La porte claque. Le virage applaudit jusqu'au parking ; Vaubourg regarde sa montre. Tu reviens lundi."
    right:
      label: "Je reste, je me bats"
      effects: {direction: "---", vestiaire: "++", relation: {aulard: -1}, journal: {text: "{annee} : « Merci, c'est fini », a dit le président. {nom} est resté{pg, select, f{e} other{}} quand même.", poids: 3, tags: [direction]}}
      answer: "Le vestiaire t'a vu rester. Le président aussi : il fait recadrer la photo, et tu n'es plus dessus."

  - id: en.promu.a7_miracle
    roles: [entraineur]
    arc: presse
    tags: [presse, tribunes]
    speaker: meneche
    tone: leger
    once: true
    text: "Massenet, carnet ouvert à une page blanche : « Demain, je titre sur le miraculé de {ville}. J'hésite entre {nom} et le vieux gardien. Aidez-moi à choisir. »"
    left:
      label: "C'est le groupe"
      effects: {vestiaire: "++", tribunes: "+", relation: {meneche: 1}, journal: {text: "{annee} : « C'est le groupe », a répondu {nom}. Titre du lendemain : « Le groupe ». Bréhaut l'a encadré.", poids: 2, tags: [presse, vestiaire]}}
      answer: "Titre du lendemain : « Le groupe ». Bréhaut l'encadre."
    right:
      label: "C'est moi"
      effects: {tribunes: "++", vestiaire: "--", set: [special]}
      answer: "Titre du lendemain : « Le Spécial ». Vaubourg découpe l'article."

  - id: en.promu.a7_projet
    roles: [entraineur]
    arc: direction
    tags: [direction, caisse]
    speaker: aulard
    tone: leger
    once: true
    text: "Vaubourg, entre deux coups de fil : « Le maintien, c'est bien, {toi}. Maintenant il nous faut un projet, et le projet, c'est le Top 10, et le Top 10, c'est toi qui le paies. »"
    left:
      label: "Je présente un projet"
      effects: {direction: "++", caisse: "-", parole: 1, promise: true, journal: {text: "{annee} : {nom} a présenté un projet. Douze pages, couverture en couleur. Le président a lu la couverture.", poids: 2, tags: [direction]}}
      answer: "Douze pages, une couverture en couleur. Il lit la couverture."
    right:
      label: "Le projet, c'est le maintien"
      effects: {direction: "--", vestiaire: "+", journal: {text: "{annee} : « Le projet, c'est le maintien », a dit {nom}. Le président a noté le mot sans l'entourer.", poids: 2, tags: [direction]}}
      answer: "Il note « maintien ». Il ne l'entoure pas."

  - id: en.promu.a7_chauffage
    roles: [entraineur]
    arc: caisse
    tags: [caisse, direction]
    speaker: josiane
    tone: leger
    once: true
    text: "Madame Josiane, dos au radiateur qui tousse : « Division 2, {toi}. J'ai rallumé le chauffage ; pas de maillots neufs avant deux ans. Le dernier qui nous a fait remonter était resté. »"
    left:
      label: "Je reste"
      effects: {vestiaire: "++", tribunes: "+", set: [fidele]}
      answer: "Elle ressert un café. Le radiateur fait du bruit, mais il marche."
    right:
      label: "Je regarde ailleurs"
      effects: {vestiaire: "-", direction: "-", journal: {text: "{annee} : Division 2. {nom} a regardé ailleurs ; Josiane a vu passer le regard.", poids: 2, tags: [caisse, direction]}}
      answer: "Elle range le classeur. Le soir, dans le tiroir du haut, une lettre de démission à ton nom, déjà tapée, sans date."

  # A8 · Twist S2 — slots 10-11, trois variantes
  - id: en.promu.a8_montoya
    roles: [entraineur]
    arc: mercato
    tags: [mercato, agents]
    speaker: fardelli
    tone: strategique
    once: true
    text: "Fardelli, cigare éteint, sur le parking : « Le Sporting Montoya te veut, {toi}, maintenant, pas en juin. Je sais ce que tu as dit à la tribune. Mes amis, là-bas, ne lisent pas L'Écho. »"
    left:
      label: "Je pars"
      effects: {caisse: "++", tribunes: "---", parole: -2, role: entraineur, journal: {text: "{annee} : le Sporting Montoya a appelé. {prenom} {nom} a dit oui. Le virage a peint le mot d'après.", poids: 3, tags: [mercato, tribunes]}}
      answer: "Le virage peint ton nom sur la bâche. Puis le mot d'après."
    right:
      label: "Je reste"
      effects: {tribunes: "++", caisse: "-", parole: 1, set: [fidele], relation: {fardelli: -1}, journal: {text: "{annee} : le Sporting Montoya a appelé. {nom} est resté{pg, select, f{e} other{}}. Fardelli a rayé un chiffre.", poids: 2, tags: [mercato, tribunes]}}
      answer: "Il range le cigare. Il note un chiffre, et le raye."

  - id: en.promu.a8_aubert
    roles: [entraineur]
    arc: direction
    tags: [direction, tribunes, caisse]
    speaker: aubert
    tone: strategique
    once: true
    text: "Madame Aubert pose des ciseaux à ruban sur la maquette d'un stade neuf : « La ville construit, {toi}. Vous serez locataire, et le nom, c'est le conseil municipal qui le vote. Mardi. »"
    left:
      label: "On signe"
      effects: {caisse: "++", direction: "+", tribunes: "--", journal: {text: "{annee} : {nom} a signé pour le stade de la ville. Le nom est celui d'un ancien maire ; Gégé ne le prononce pas.", poids: 2, tags: [direction, tribunes]}}
      answer: "Le nom est celui d'un ancien maire. Gégé ne le prononce jamais."
    right:
      label: "On rénove le nôtre"
      effects: {caisse: "--", tribunes: "++", set: [tribune_a_renover]}
      answer: "La tribune Nord garde ses fissures. Et son nom."

  - id: en.promu.a8_projet_aulard
    roles: [entraineur]
    arc: direction
    tags: [direction, caisse]
    speaker: aulard
    tone: strategique
    once: true
    text: "Vaubourg, le rapport du comptable roulé dans le poing : « Le conseil dit « projet », la presse dit « projet », le comptable dit « non ». Tu tranches, {toi}, ou je tranche à ta place ? »"
    left:
      label: "Je tranche : les jeunes"
      effects: {vestiaire: "++", direction: "-", force: -2, set: [projet_jeunes]}
      answer: "Trois gamins des U19 sur la feuille. Le comptable sourit, seul."
    right:
      label: "Je tranche : on vend"
      effects: {caisse: "++", vestiaire: "--", direction: "+", journal: {text: "{annee} : « On vend », a tranché {nom}. Un casier vide lundi ; le président a dit « projet ».", poids: 2, tags: [direction, caisse]}}
      answer: "Un casier vide lundi. Le président dit « projet »."

  # A9 · Deuxième finale — slot 17
  - id: en.promu.a9_finale
    roles: [entraineur]
    arc: moment
    tags: [direction, moment]
    speaker: aulard
    tone: strategique
    once: true
    text: "Vaubourg tapote la poche de sa veste, la même qu'en mai dernier : « Deuxième dernier match, {toi}. Le numéro est toujours là. Tu m'as coûté combien, cette saison ? »"
    left:
      label: "Moins qu'un remplaçant"
      effects: {direction: "+", vestiaire: "+", journal: {text: "{annee} : « Moins qu'un remplaçant », a répondu {nom}. Le président a gardé le numéro dans la même poche.", poids: 1, tags: [direction]}}
      answer: "Il range le numéro. Il le garde dans la même poche."
    right:
      label: "Plus que tu ne crois"
      effects: {direction: "--", tribunes: "++", relation: {aulard: -1}, journal: {text: "{annee} : « Plus que tu ne crois », a répondu {nom} au président. Le virage a une bâche prête, au cas où.", poids: 2, tags: [direction, tribunes]}}
      answer: "Le virage a entendu. Il a une bâche à ton nom, au cas où."

  # ========================================================== saisons 3+ (S2+)
  # Deux ancres rejouables chaque saison : la rentrée (slot 1) et la veille du dernier bloc (slot 17).
  - id: en.promu.rentree
    roles: [entraineur]
    arc: direction
    tags: [direction]
    speaker: josiane
    tone: leger
    cooldown: 0
    text: "Madame Josiane pose un café et un classeur d'une couleur neuve : « Nouvelle saison, {toi}. Le radiateur tient, le président aussi. Les comptes, ou le terrain d'abord ? »"
    left:
      label: "Un café, et les comptes"
      effects: {direction: "+", react: en.re.josiane_page_rouge, journal: {text: "{annee} : rentrée. Le classeur de Josiane a pris une couleur de plus. {nom} l'a ouvert.", poids: 1, tags: [direction, caisse]}}
      answer: "Elle sort le classeur. Il a pris une couleur de plus."
    right:
      label: "Un café, et le terrain"
      effects: {vestiaire: "+", journal: {text: "{annee} : rentrée. {nom} a pris le café debout, puis le chemin du terrain. Le classeur attend.", poids: 1, tags: [direction, vestiaire]}}
      answer: "Elle range le classeur. Elle le garde à portée de main."

  - id: en.promu.veille
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: vukic
    tone: strategique
    cooldown: 0
    text: "Vukić attend que le couloir se vide, la veille du dernier bloc : « Le président a deux discours dans son tiroir. Je les ai vus. Ton nom n'est que dans un. »"
    left:
      label: "On joue le nôtre"
      effects: {vestiaire: "+", force: 1, react: en.re.aulard_le_mien, journal: {text: "{annee} : veille du dernier bloc. Deux discours chez le président ; le vestiaire a joué le sien.", poids: 1, tags: [vestiaire, direction]}}
      answer: "Le vestiaire connaît le plan. Le président non."
    right:
      label: "On joue le sien"
      effects: {direction: "+", vestiaire: "-", react: en.re.vukic_second_discours, journal: {text: "{annee} : veille du dernier bloc. {nom} a joué le discours du président. Il en avait deux.", poids: 1, tags: [vestiaire, direction]}}
      answer: "Le président range un discours. Il garde l'autre."

  # La veille, variante « dauphin » : l'adjoint a relu le second discours, son
  # nom est dedans. Servie quand Vukić t'en veut et que la direction vacille ;
  # lui laisser le banc conclut la carrière (fin en_dauphin, spec §1.13).
  - id: en.promu.veille_dauphin
    roles: [entraineur]
    arc: direction
    tags: [direction, vestiaire, risk:direction]
    speaker: vukic
    tone: strategique
    once: true
    text: "Vukić pose une feuille pliée en quatre sur ton bureau, la veille du dernier bloc : « Le second discours. Mon nom est dedans, {toi}. Il m'a demandé de le relire ; je l'ai relu. »"
    left:
      label: "Relis le mien aussi"
      effects: {direction: "--", relation: {vukic: -1}, set: [vukic_dauphin]}
      answer: "Il relit le tien. Il ne corrige rien. Il n'y a rien à corriger, dit-il."
    right:
      label: "Prends le banc, Zoran"
      effects: {end: en_dauphin}
      answer: "Il ne dit pas merci. Il « réfléchissait » depuis novembre."

  # ---------------------------------------------- variantes de la rentrée (S2+)
  # Les deux ancres rejouables des saisons 3+ n'avaient qu'une carte chacune :
  # à partir de la S2, chaque saison s'ouvrait et se fermait sur exactement les
  # mêmes deux répliques, réactions comprises (spec § 1.2 : « chaque ancre
  # reçoit ≥ 2 variantes lues sur `fil_rouge` et sur les traces »). Les
  # variantes ci-dessous lisent les traces déjà posées (gigi_staff,
  # salaires_retard / pacte_gege, naming_signe, mbako_vendu), le fil rouge, et
  # montent en escalier sur les saisons. Elles changent aussi de visage : la
  # rentrée n'est plus fatalement un monologue de Josiane au slot 1.
  - id: en.promu.rentree_gigi
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vecchio
    tone: leger
    cooldown: 0
    text: "Vecchio, gants neufs sous le bras, dans le couloir : « Rentrée, {toi}. J'ai compté : je suis le seul ici qui ait vu l'ancienne tribune debout. Tu commences par eux, ou par les comptes ? »"
    left:
      label: "Par eux"
      effects: {vestiaire: "+", relation: {vecchio: 1}, journal: {text: "{annee} : rentrée. {nom} a commencé par le vestiaire. Gigi Vecchio tenait la porte, gants neufs.", poids: 1, tags: [vestiaire]}}
      answer: "Il tient la porte. Il la tient déjà, en fait ; il voulait l'entendre."
    right:
      label: "Par les comptes"
      effects: {direction: "+", vestiaire: "-", journal: {text: "{annee} : rentrée. {nom} est monté au bureau avant de descendre au terrain.", poids: 1, tags: [direction]}}
      answer: "Il monte les gants au bureau, les pose, redescend. Personne ne lui a demandé."

  - id: en.promu.rentree_ardoise
    roles: [entraineur]
    arc: tribunes
    tags: [tribunes, caisse]
    speaker: gege
    tone: leger
    cooldown: 0
    text: "Gégé, devant le local rouvert : « Rentrée. J'ai gardé l'ardoise de juin, parce qu'elle n'est pas payée et parce qu'elle est belle. On l'efface, ou on la laisse au mur ? »"
    left:
      label: "On l'efface"
      effects: {caisse: "-", tribunes: "+", relation: {gege: 1}, journal: {text: "{annee} : rentrée. L'ardoise de juin a été effacée. Gégé a gardé le chiffon, encadré.", poids: 1, tags: [tribunes, caisse]}}
      answer: "Il efface, lentement, en lisant chaque ligne à voix haute. Ça prend le café."
    right:
      label: "Laissez-la au mur"
      effects: {tribunes: "+", direction: "-", journal: {text: "{annee} : rentrée. L'ardoise de juin est restée au mur du local, à la craie.", poids: 1, tags: [tribunes]}}
      answer: "Elle reste au mur. En octobre, quelqu'un ajoute une ligne dessous."

  - id: en.promu.rentree_naming
    roles: [entraineur]
    arc: direction
    tags: [direction, caisse]
    speaker: josiane
    tone: strategique
    cooldown: 0
    text: "Madame Josiane tend une feuille du nouveau papier à en-tête : « Le nom du stade prend toute la ligne ; l'adresse du club est passée dessous, en petit. On commande, ou on finit les vieux ? »"
    left:
      label: "On commande"
      effects: {caisse: "-", direction: "+", react: en.re.josiane_page_rouge, journal: {text: "{annee} : rentrée. Le nouveau nom du stade est passé sur le papier à en-tête. {nom} a signé le bon.", poids: 1, tags: [direction, argent]}}
      answer: "Elle commande. Elle garde une rame des anciens, « pour le brouillon »."
    right:
      label: "On finit les vieux"
      effects: {caisse: "+", tribunes: "+", journal: {text: "{annee} : rentrée. Le club a continué d'écrire sous l'ancien nom du stade, faute de papier.", poids: 1, tags: [direction, tribunes]}}
      answer: "Le club écrit encore sous l'ancien nom. Personne au virage ne s'en plaint."

  - id: en.promu.rentree_vieille
    roles: [entraineur]
    arc: direction
    tags: [direction, moment]
    speaker: josiane
    tone: leger
    cooldown: 0
    text: "Madame Josiane pose le café sans le lâcher : « Une couleur de classeur par saison ; avec vous, ça fait une étagère. Personne n'en avait rempli une depuis 1987. Le classeur, ou le café ? »"
    left:
      label: "Le classeur d'abord"
      effects: {direction: "+", relation: {josiane: 1}, journal: {text: "{annee} : rentrée. Josiane a aligné les classeurs par couleur. {nom} les a comptés à voix haute.", poids: 1, tags: [direction]}}
      answer: "Elle les aligne par couleur. Elle sait laquelle a été la pire ; elle ne le dit pas."
    right:
      label: "Le café d'abord"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Elle s'assoit en face. C'est la première fois qu'elle s'assoit en face."

  # ------------------------------------------- variantes de la veille (S2+)
  - id: en.promu.veille_mbako
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, mercato]
    speaker: brehaut
    tone: strategique
    cooldown: 0
    text: "Bréhaut, la veille du dernier bloc, s'adosse au casier vide de Mbako : « Les gars passent devant sans le regarder depuis la vente. On en parle avant, ou on joue et on verra ? »"
    left:
      label: "On en parle avant"
      effects: {vestiaire: "+", tribunes: "-", relation: {brehaut: 1}, journal: {text: "{annee} : veille du dernier bloc. {nom} a nommé le joueur parti, devant le groupe. Le groupe a écouté.", poids: 2, tags: [vestiaire, mercato]}}
      answer: "Tu le nommes. Personne ne répond ; tout le monde a entendu son propre chiffre."
    right:
      label: "On joue, et on verra"
      effects: {force: 1, vestiaire: "-", journal: {text: "{annee} : veille du dernier bloc. Personne n'a nommé le joueur parti. Le vestiaire a compté tout seul.", poids: 1, tags: [vestiaire]}}
      answer: "On joue. Le nom sort quand même, à la mi-temps, par la fenêtre du couloir."

  - id: en.promu.veille_virage
    roles: [entraineur]
    arc: tribunes
    tags: [tribunes, moment]
    speaker: gege
    tone: leger
    cooldown: 0
    text: "Gégé, la veille du dernier bloc, une bâche roulée sous le bras : « Elle est peinte des deux côtés, {toi}. On déroule le côté qu'on veut samedi. Tu veux savoir ce qu'il y a derrière ? »"
    left:
      label: "Je veux savoir"
      effects: {tribunes: "+", direction: "-", relation: {gege: 1}, journal: {text: "{annee} : veille du dernier bloc. {nom} a demandé à voir l'autre côté de la bâche. Gégé l'a déroulée.", poids: 2, tags: [tribunes]}}
      answer: "Il déroule. L'autre côté est ton nom, en plus petit, et déjà décoloré."
    right:
      label: "Samedi, je verrai"
      effects: {tribunes: "-", vestiaire: "+"}
      answer: "Il reroule. Samedi, c'est le côté peint en dernier qui est dehors."

  - id: en.promu.veille_encore
    roles: [entraineur]
    arc: direction
    tags: [direction, vestiaire, retorse]
    speaker: vukic
    tone: strategique
    cooldown: 0
    text: "Vukić, même couloir, même veille, le cahier sous le bras : « Chaque année, deux discours. Cette fois, j'ai lu les deux, et ton nom est dans les deux. Ça veut dire deux choses. »"
    left:
      label: "Lesquelles ?"
      effects: {direction: "-", vestiaire: "+", relation: {vukic: 1}, journal: {text: "{annee} : veille du dernier bloc. Les deux discours du président avaient le nom de {nom} dedans.", poids: 2, tags: [direction]}}
      answer: "« Qu'il t'aime, ou qu'il a préparé les deux. » Il n'en choisit pas une."
    right:
      label: "Je préfère ne pas savoir"
      effects: {direction: "+", relation: {vukic: -1}}
      answer: "Il hausse les épaules. Il connaît la réponse depuis novembre ; il la garde."
