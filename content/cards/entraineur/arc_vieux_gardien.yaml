# Cartes d'étape de l'arc « Le vieux gardien » (content/arcs/entraineur/vieux_gardien.yaml).
# Toutes sont des étapes (kind: etape dérivé par le build), jamais dans le sac.
# `arc:` est le THÈME de la carte, pas l'id de l'arc.
cards:
  # ------------------------------------------------------------- E1 · retraite
  # Escalier du rituel (plays >= 1) : « encore une ».
  - id: en.vieux.retraite_encore
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: vecchio
    tone: leger
    text: "Vecchio, gants sous le bras : « Ma retraite en juin, je l'ai prise. Elle n'a pas pris. Encore une, coach, la dernière. J'en ai vu d'autres, des dernières. Dans les buts, ou tout court ? »"
    left:
      label: "Dans les buts, encore"
      effects: {vestiaire: "+", force: -2, parole: 1, promise: true, set: [vecchio_promis], var: {vecchio_retraites: "+1"}, relation: {vecchio: 2}, outcome: finale}
      answer: "Il range ses gants. Il les ressort. Il en a vu d'autres, des juin."
    right:
      label: "Coach des gardiens, janvier"
      effects: {force: 2, vestiaire: "-", set: [gardien_jeune], relation: {vecchio: -1}, outcome: jeune}
      answer: "Il ne dit rien. Le jeune a déjà ses gants ; ce sont les siens."

  # Escalier du rituel (plays >= 2) : « cette fois c'est vrai ».
  - id: en.vieux.retraite_vrai
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: vecchio
    tone: strategique
    text: "Vecchio, sans ses gants : « Cette fois c'est vrai. Le doc l'a écrit, ma femme l'a lu. J'en ai vu d'autres, des retraites ; celle-là, je la vois. Tu me gardes au staff, ou tu me laisses partir ? »"
    left:
      label: "Reste, au staff"
      effects: {vestiaire: "++", direction: "+", set: [gigi_staff], relation: {vecchio: 2}, outcome: staff, next: end}
      answer: "Il pose les gants sur ton bureau. Il les reprendra pour les montrer."
    right:
      label: "Bon vent, Gigi"
      effects: {vestiaire: "-", force: 1, relation: {vecchio: -1}, outcome: parti, next: end}
      answer: "Il ne dit rien. Il en a vu d'autres, des bons vents."

  - id: en.vieux.retraite
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: vecchio
    tone: leger
    text: "Vecchio, gants sous le bras : « Je prends ma retraite en juin, comme chaque juin. J'en ai vu d'autres. Tu me gardes dans les buts, ou tout court ? »"
    left:
      label: "Dans les buts, capitaine"
      effects: {vestiaire: "+", force: -2, parole: 1, promise: true, set: [vecchio_promis], var: {vecchio_retraites: "+1"}, relation: {vecchio: 2}, outcome: finale}
      answer: "Il ne dit rien. Il en a vu d'autres, des promesses."
    right:
      label: "Coach des gardiens, janvier"
      effects: {force: 2, vestiaire: "-", set: [gardien_jeune], relation: {vecchio: -1}, outcome: jeune}
      answer: "Le jeune arrête tout à l'entraînement. Le vieux regarde ailleurs."

  # --------------------------------------------------------------- E2 · epaule
  - id: en.vieux.epaule
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vecchio
    tone: strategique
    text: "Vecchio, le bras raide : « Un coup sur l'épaule en sortant dans les pieds. Le doc dit que ça reste entre la table et lui ; moi je te le dis. Tu me sors ? »"
    left:
      label: "Tu joues, tu décides"
      effects: {force: -3, relation: {vecchio: 1, sabatier: -1}}
      answer: "Il joue d'un bras. Le doc ne te salue plus, mais il regarde le match."
    right:
      label: "Repos forcé"
      effects: {force: -1, vestiaire: "-", set: [gardien_jeune], relation: {vecchio: -1}, outcome: jeune}
      answer: "Le jeune prend sa place. Le vieux regarde ses gants."

  # ------------------------------------------- E3 · retour (deux variantes, S2)
  - id: en.vieux.retour_sourire
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vecchio
    tone: leger
    text: "Vecchio, à la reprise : « J'ai pris ma retraite en juin. Elle n'a pas pris. J'en ai vu d'autres, des gardiens de quarante-deux ans. Enfin, un. »"
    left:
      label: "Bienvenue, Gigi"
      effects: {vestiaire: "++", var: {vecchio_retraites: "+1"}, relation: {vecchio: 1}}
      answer: "Il range ses gants dans son casier. Le même. Personne n'y avait touché."
    right:
      label: "Le staff, cette fois"
      effects: {force: 1, direction: "+", set: [gigi_staff], outcome: staff}
      answer: "Il accroche ses gants chez les jeunes. Il les décroche parfois, le samedi."

  - id: en.vieux.retour_noir
    roles: [entraineur]
    arc: mercato
    tags: [vestiaire, mercato]
    speaker: vecchio
    tone: strategique
    text: "Vecchio, sac sur l'épaule : « Je signe chez {rival}. Ils m'ont demandé, eux. J'en ai vu d'autres, des entraîneurs. »"
    left:
      label: "Reste, je m'excuse"
      effects: {vestiaire: "+", caisse: "-", relation: {vecchio: 2}}
      answer: "Il pose le sac. Il ne dit pas oui. Il reste."
    right:
      label: "Bon vent"
      effects: {vestiaire: "--", force: 1, outcome: parti}
      answer: "Il part sans un mot. Son casier reste vide jusqu'en octobre."

  # ---------------------------------------------- E4 · bus (deux variantes, S2)
  # Contre-alarme protectrice : Gigi te prévient avant que le bus ne reste
  # fermé. Choisie par l'arc si gauges.vestiaire < 45.
  - id: en.vieux.bus
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, rescue:vestiaire]
    speaker: vecchio
    tone: strategique
    text: "Vecchio, porte du bus : « Les gars parlent de ne pas descendre dimanche. J'en ai vu d'autres. Pas celle-là. Je descends le premier si tu montes leur parler. »"
    left:
      label: "Je monte"
      effects: {vestiaire: "+++", direction: "-", relation: {vecchio: 1}}
      answer: "Gigi descend le premier. Les autres suivent, un par un, sans un mot."
    right:
      label: "Qu'ils restent dedans"
      effects: {vestiaire: "--", direction: "+"}
      answer: "Gigi descend seul. Il attend sur le parking."

  # La même scène sans menace : le vestiaire va bien, Gigi descend le premier
  # pour rire.
  - id: en.vieux.bus_calme
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, absurde]
    speaker: vecchio
    tone: leger
    text: "Vecchio, sur le parking : « Les gars parlaient de rester dans le bus dimanche, pour rire. Je suis descendu le premier, ils ont suivi. J'en ai vu d'autres. »"
    left:
      label: "Je monte quand même"
      effects: {vestiaire: "++", direction: "-", relation: {vecchio: 1}}
      answer: "Tu montes dans un bus vide. Ils applaudissent depuis le parking."
    right:
      label: "Je les laisse rire"
      effects: {vestiaire: "+", tribunes: "+"}
      answer: "Le bus arrive au stade en chantant. Le chauffeur aussi."
