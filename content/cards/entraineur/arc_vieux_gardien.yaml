# Cartes d'étape de l'arc « Le vieux gardien » (content/arcs/entraineur/vieux_gardien.yaml).
# Toutes sont des étapes (kind: etape dérivé par le build), jamais dans le sac.
# `arc:` est le THÈME de la carte, pas l'id de l'arc.
# Gigi dit toujours « coach » (c'est le personnage : son adresse ne cite pas le
# nom) — sauf une fois, le prénom, quand la retraite est vraie ; le reste du
# nom vit dans les lignes d'Almanach. Traces : vecchio_promis,
# gardien_jeune, gigi_staff.
cards:
  # ------------------------------------------------------------- E1 · retraite
  # Variante d'ouverture de l'intérimaire (ch. 11 § 2.3.1) : Gigi compte les
  # coachs de l'année et s'arrête au pouce.
  - id: en.vieux.retraite_quatrieme
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: vecchio
    tone: leger
    text: "Vecchio compte sur ses doigts et s'arrête au pouce : « Quatre coachs cette année, coach ; toi, tu es le pouce. Je prends ma retraite en juin. Tu me gardes dans les buts, ou tout court ? »"
    left:
      label: "Dans les buts, jusqu'en juin"
      effects: {vestiaire: "+", force: -2, parole: 1, promise: true, set: [vecchio_promis], var: {vecchio_retraites: "+1"}, relation: {vecchio: 2}, outcome: finale}
      answer: "Il replie le pouce. « Jusqu'en juin », répète-t-il, pour l'entendre une deuxième fois."
    right:
      label: "Entraîneur des gardiens"
      effects: {force: 2, vestiaire: "-", set: [gardien_jeune], relation: {vecchio: -1}, outcome: jeune}
      answer: "Le jeune a déjà les gants. Le vieux les lui a prêtés ; il ne le dit pas."

  # Escalier du rituel (plays >= 1) : « encore une ».
  - id: en.vieux.retraite_encore
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: vecchio
    tone: leger
    text: "Vecchio, gants sous le bras : « Ma retraite de juin, je l'ai prise ; elle n'a pas pris. Encore une, coach, la dernière : ma femme a déjà dit oui. Dans les buts, ou tout court ? »"
    left:
      label: "Dans les buts, encore"
      effects: {vestiaire: "+", force: -2, parole: 1, promise: true, set: [vecchio_promis], var: {vecchio_retraites: "+1"}, relation: {vecchio: 2}, outcome: finale, journal: {text: "{annee} : encore une saison dans les buts pour Gigi Vecchio. {nom} a promis. Encore.", poids: 2, tags: [vestiaire, formation]}}
      answer: "Il range ses gants dans son casier, sur la pile des Unes qu'il garde. « Encore une », dit-il au casier."
    right:
      label: "Coach des gardiens, janvier"
      effects: {force: 2, vestiaire: "-", set: [gardien_jeune], relation: {vecchio: -1}, outcome: jeune, journal: {text: "{annee} : Gigi Vecchio, coach des gardiens en janvier. Le jeune avait déjà ses gants.", poids: 1, tags: [vestiaire, formation]}}
      answer: "Il ne dit rien. Le jeune a déjà ses gants ; ce sont les siens."

  # Escalier du rituel (plays >= 2) : « cette fois c'est vrai ».
  - id: en.vieux.retraite_vrai
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: vecchio
    tone: strategique
    text: "Vecchio, sans ses gants, les mains à plat sur les genoux : « Cette fois, c'est vrai, {toi}. Le doc l'a écrit, ma femme l'a lu. Tu me gardes au staff, ou tu me laisses partir ? »"
    left:
      label: "Reste, au staff"
      # `caisse: "-"` : garder un gardien de quarante et un ans au staff coûte
      # une ligne au budget. Sans ce prix, la gauche était gratuite et double,
      # et l'issue `parti` restait à 4 % des clôtures (plancher 10 %).
      effects: {vestiaire: "++", direction: "+", caisse: "-", set: [gigi_staff], relation: {vecchio: 2}, outcome: staff, next: end, char: {vecchio: {statut: staff}}}
      answer: "Il pose les gants sur ton bureau. Il les reprendra pour les montrer."
    right:
      label: "Bon vent, Gigi"
      effects: {vestiaire: "-", force: 1, relation: {vecchio: -1}, outcome: parti, next: end, journal: {text: "{annee} : Gigi Vecchio a raccroché pour de vrai. « Bon vent », a dit {nom}. Il en avait vu d'autres, des vents.", poids: 3, tags: [vestiaire]}}
      answer: "Il vide son casier en dix minutes. Sur l'étagère, il laisse une paire de gants jaunes, pour le jeune."

  - id: en.vieux.retraite
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: vecchio
    tone: leger
    text: "Vecchio, gants jaunes sous le bras, le casier ouvert derrière lui : « Je prends ma retraite en juin, comme chaque juin, coach. Tu me gardes dans les buts, ou tout court ? »"
    left:
      label: "Dans les buts, capitaine"
      effects: {vestiaire: "+", force: -2, parole: 1, promise: true, set: [vecchio_promis], var: {vecchio_retraites: "+1"}, relation: {vecchio: 2}, outcome: finale}
      answer: "Il le répète au vestiaire : « dans les buts jusqu'en juin ». Maintenant, tout le monde l'a entendu."
    right:
      label: "Coach des gardiens, janvier"
      effects: {force: 2, vestiaire: "-", set: [gardien_jeune], relation: {vecchio: -1}, outcome: jeune}
      answer: "Le jeune arrête tout à l'entraînement. Le vieux regarde ailleurs."

  # --------------------------------------------------------------- E2 · epaule
  - id: en.vieux.epaule
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vecchio
    tone: strategique
    text: "Vecchio, le bras droit raide le long du corps : « Un coup en sortant dans les pieds. Le doc veut me garder à l'infirmerie samedi ; il ne te l'a pas dit, moi si. Tu me sors ? »"
    left:
      label: "Tu joues, tu décides"
      effects: {force: -3, relation: {vecchio: 1, sabatier: -1}, react: {card: en.re.sabatier_la_table, chance: 0.6}, journal: {text: "{annee} : Gigi Vecchio a joué d'un bras. Le doc n'a plus salué {nom}, mais il a regardé le match.", poids: 2, tags: [vestiaire, moment]}}
      answer: "Il joue d'un bras. Le doc ne te salue plus, mais il regarde le match."
    right:
      label: "Repos forcé"
      effects: {force: -1, vestiaire: "-", set: [gardien_jeune], relation: {vecchio: -1}, outcome: jeune}
      answer: "Le jeune prend sa place. Le vieux regarde ses gants."

  # Escalier du rituel (plays >= 1) : la même épaule, un an de plus, et le doc
  # qui ne salue plus. Sans cette variante, la scène de l'épaule se rejouait
  # mot pour mot à chaque reprise du rituel (le lint ne le voyait pas : sa
  # règle « arc replay ⇒ ≥ 1 variante lisant plays() » était déjà satisfaite
  # par l'étape 1).
  - id: en.vieux.epaule_encore
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment, retorse]
    speaker: vecchio
    tone: strategique
    text: "Vecchio remonte la même manche sur la même épaule, un an plus tard : « Le doc ne me salue plus. Il la regarde, et il écrit dans un carnet. Tu me sors, cette fois ? »"
    left:
      label: "Tu joues, tu décides"
      effects: {force: -3, relation: {vecchio: 1, sabatier: -2}, react: {card: en.re.sabatier_la_table, chance: 0.6}, journal: {text: "{annee} : Gigi Vecchio a rejoué du même bras. Le doc a écrit la même ligne, en dessous de celle de l'an dernier.", poids: 2, tags: [vestiaire, moment]}}
      answer: "Il rejoue d'un bras. Le doc écrit la même ligne, sous celle de l'an dernier."
    right:
      label: "Repos forcé, cette fois"
      effects: {force: -1, vestiaire: "-", set: [gardien_jeune], relation: {vecchio: -1}, outcome: jeune}
      answer: "Le jeune reprend les gants. Le vieux regarde le doc, pas les gants."

  # ------------------------------------------- E3 · retour (deux variantes, S2)
  - id: en.vieux.retour_sourire
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vecchio
    tone: leger
    text: "Vecchio, à la reprise, gants jaunes sous le bras : « J'ai rendu mes gants en juin, ils sont revenus en août. Un gardien de quarante-deux ans, ça existe, coach. Enfin, un. »"
    left:
      # Défaut de relecture (« issues » de en.vieux_gardien, mesuré sur la
      # pépite) : l'issue `finale` tombait à 0 % et `staff` prenait 68 % des
      # clôtures. `finale` est posée à l'étape 1 (« encore une saison ») puis
      # écrasée par la dernière issue de l'arc — elle n'était donc jamais la
      # sortie retenue. Deux corrections : le côté qui la garde la POSE
      # explicitement (c'est bien la promesse tenue : il a eu sa saison, il
      # revient la jouer), et il ne coûte plus deux crans de vestiaire.
      # Même remède que `co.destin.statue_bronze` : un côté qui ne fait que
      # monter une jauge déjà haute est systématiquement évité, et la branche
      # meurt. Accueillir Gigi ne devrait rien coûter ; c'est tout le propos.
      label: "Bienvenue, Gigi"
      effects: {vestiaire: "+", var: {vecchio_retraites: "+1"}, relation: {vecchio: 1}, outcome: finale, journal: {text: "{annee} : Gigi Vecchio est revenu de sa retraite. Son casier l'attendait ; personne n'y avait touché.", poids: 2, tags: [vestiaire, moment]}}
      answer: "Il range ses gants dans son casier. Le même. Personne n'y avait touché."
    right:
      label: "Le staff, cette fois"
      effects: {force: 1, direction: "+", set: [gigi_staff], outcome: staff, char: {vecchio: {statut: staff}}}
      answer: "Il accroche ses gants chez les jeunes. Il les décroche parfois, le samedi."

  # Le retour quand les gants ont changé de mains (`gardien_jeune`). Sans cette
  # variante, l'issue `jeune` — posée à l'étape 1 ou à l'épaule — était écrasée
  # par le `finale` du retour souriant : Gigi revenait « pour jouer » alors
  # qu'un gamin portait ses gants depuis janvier. Elle ferme sur `jeune`.
  - id: en.vieux.retour_jeune
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, formation, moment]
    speaker: vecchio
    tone: strategique
    text: "Vecchio, à la reprise, en survêtement et sans gants : « Le jeune les a, mes gants, et il les tient bien. Je viens quand même le mardi, ou je ne viens plus ? »"
    left:
      label: "Viens le mardi"
      effects: {vestiaire: "+", relation: {vecchio: 1}, outcome: jeune, journal: {text: "{annee} : Gigi Vecchio vient le mardi. Il ne met pas de gants ; il montre où se mettre.", poids: 2, tags: [vestiaire, formation]}}
      answer: "Il vient le mardi. Il ne met pas de gants ; il montre où se mettre, et le jeune écoute."
    right:
      label: "Repose-toi, Gigi"
      # `parti`, pas `jeune` : il ne vient plus, il n'est plus au club. C'est la
      # seconde porte de l'issue `parti`, qui ne tenait qu'au retour amer
      # (relation basse) et tombait sous le plancher de 10 %.
      effects: {vestiaire: "-", direction: "+", outcome: parti, journal: {text: "{annee} : Gigi Vecchio ne vient plus le mardi. Le petit apprend seul ; il apprend plus lentement.", poids: 2, tags: [vestiaire]}}
      answer: "Il ne vient plus le mardi. Le jeune apprend seul ; il apprend, plus lentement."

  - id: en.vieux.retour_noir
    roles: [entraineur]
    arc: mercato
    tags: [vestiaire, mercato]
    speaker: vecchio
    tone: strategique
    text: "Vecchio, sac sur l'épaule, devant son casier vidé : « Je signe chez {rival}. Ils m'ont demandé, eux. Toi, en juin, tu ne m'as rien demandé du tout. »"
    left:
      # Même raison : il pose le sac, il reste, il joue — c'est `finale`.
      label: "Reste, je m'excuse"
      effects: {vestiaire: "+", caisse: "-", relation: {vecchio: 2}, outcome: finale, journal: {text: "{annee} : {nom} s'est excusé{pg, select, f{e} other{}} auprès de Gigi Vecchio. Il a posé le sac. Il est resté.", poids: 2, tags: [vestiaire]}}
      answer: "Il pose le sac. Il ne dit pas oui. Il reste."
    right:
      label: "Bon vent"
      # `vestiaire: "--"` → `"-"` : deux crans de vestiaire face à une gauche
      # qui en rend un rendaient « Bon vent » strictement perdant.
      effects: {vestiaire: "-", force: 1, outcome: parti, journal: {text: "{annee} : Gigi Vecchio a signé chez {rival}. Son casier est resté vide jusqu'en octobre.", poids: 3, tags: [vestiaire, mercato]}}
      answer: "Il part sans un mot. Son casier reste vide jusqu'en octobre."

  # ---------------------------------------------- E4 · bus (deux variantes, S2)
  # Contre-alarme protectrice : Gigi te prévient avant que le bus ne reste
  # fermé. Choisie par l'arc si gauges.vestiaire < 45.
  - id: en.vieux.bus
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, rescue:vestiaire]
    speaker: vecchio
    tone: strategique
    text: "Vecchio, en bas des marches du bus : « Les gars parlent de ne pas descendre dimanche. Ça ne s'est jamais fait dans un bus où j'étais. Je descends le premier si tu montes leur parler. »"
    left:
      label: "Je monte"
      effects: {vestiaire: "+++", direction: "-", relation: {vecchio: 1}, journal: {text: "{annee} : le bus. {nom} est monté{pg, select, f{e} other{}} parler ; Gigi Vecchio est descendu le premier.", poids: 2, tags: [vestiaire]}}
      answer: "Gigi descend le premier. Les autres suivent, un par un, sans un mot."
    right:
      label: "Qu'ils restent dedans"
      effects: {vestiaire: "--", direction: "+", journal: {text: "{annee} : le bus est resté fermé. Gigi Vecchio est descendu seul et a attendu sur le parking.", poids: 2, tags: [vestiaire]}}
      answer: "Gigi descend seul. Il attend sur le parking."

  # La même scène sans menace : le vestiaire va bien, Gigi descend le premier
  # pour rire.
  - id: en.vieux.bus_calme
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, absurde]
    speaker: vecchio
    tone: leger
    text: "Vecchio, sur le parking, la main sur la porte du bus : « Dimanche, les gars ont fait semblant de ne pas descendre, pour rire. J'ai attendu en bas. Au bout d'une minute, ils riaient moins. »"
    left:
      label: "Je monte quand même"
      effects: {vestiaire: "++", direction: "-", relation: {vecchio: 1}, journal: {text: "{annee} : {nom} est monté{pg, select, f{e} other{}} dans un bus vide. Le parking a applaudi.", poids: 1, tags: [vestiaire, absurde]}}
      answer: "Tu montes. Au fond, quelqu'un a écrit « on descend » dans la buée. Ils applaudissent depuis le parking."
    right:
      label: "Je les laisse rire"
      effects: {vestiaire: "+", tribunes: "+", journal: {text: "{annee} : le bus est arrivé au stade en chantant. Le chauffeur aussi.", poids: 1, tags: [vestiaire, absurde]}}
      answer: "Le bus arrive au stade en chantant. Le chauffeur aussi."

  # ------------------------------------------------------- Réaction de l'arc
  # Le build dérive `kind: reaction` de tout `react:` qui la cite : ne pas
  # écrire `kind:`. Après en.vieux.epaule (← tu joues, tu décides) : ce qui
  # était entre la table et lui est sorti de la salle de soins.
  - id: en.re.sabatier_la_table
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: sabatier
    tone: strategique
    text: "Doc Sabatier laisse la porte de la salle de soins ouverte pour que tu entendes : « Une épaule qui sort deux fois sort une troisième. Ce jour-là, j'écrirai que je l'avais dit, et je daterai. »"
    left:
      label: "Écris ce que tu veux"
      effects: {vestiaire: "+", relation: {sabatier: -1}}
      answer: "Il l'écrit. Le carnet reste dans le tiroir ; le tiroir ferme mal."
    right:
      label: "Écris ce que tu veux"
      effects: {vestiaire: "+", relation: {sabatier: -1}}
      answer: "Il l'écrit. Le carnet reste dans le tiroir ; le tiroir ferme mal."
