cards:
  - id: en.presse.gros_titre
    roles: [entraineur]
    arc: presse
    tags: [presse, direction]
    speaker: meneche
    text: "Massenet, au téléphone, la rotative derrière : « Je boucle dans vingt minutes. J'ai une place en haut de page pour une phrase de vous. Ambitieuse, c'est la Une ; prudente, c'est la page six. »"
    left:
      label: "Je promets le titre"
      effects: { tribunes: "++", direction: "-", parole: 1, promise: true }
      answer: "La phrase fait la Une, en gras. Vaubourg la découpe et l'épingle au mur de ton bureau, avec la date."
    right:
      label: "Je donne la phrase prudente"
      effects: { direction: "+", tribunes: "-" }
      answer: "Page six, sous une publicité. Le président la trouve juste ; au virage, personne ne l'a lue."
  - id: en.presse.pas_vu_action
    roles: [entraineur]
    arc: presse
    tags: [presse, arbitrage]
    speaker: meneche
    text: "Massenet, en salle de presse, le carnet ouvert : « Un penalty pour eux à la 89e, un but refusé pour vous, votre capitaine expulsé. La commission lit mes papiers. Votre avis sur l'arbitre ? »"
    left:
      label: "Je n'ai pas vu l'action"
      effects: { direction: "+", tribunes: "--" }
      answer: "Il écrit « n'a pas vu ». La commission ne te convoque pas ; le virage, lui, a tout vu, et il siffle."
    right:
      label: "Je démonte l'arbitre"
      effects: { tribunes: "++", direction: "---", caisse: "-" }
      answer: "Ta phrase fait la Une. Une lettre de la commission arrive mardi : une amende, et ton nom sur la liste de la salle 3."
  - id: en.presse.le_special
    roles: [entraineur]
    arc: presse
    tags: [presse, absurde]
    once: true
    speaker: meneche
    text: "Massenet, le journal du matin plié sous le bras : « La Gazette vous appelle « le Spécial » depuis votre phrase de samedi. Moi, je ne l'ai pas encore écrit. Je l'écris, ou je l'enterre ? »"
    left:
      label: "J'endosse le Spécial"
      effects: { tribunes: "++", direction: "-", set: [special] }
      answer: "Le surnom colle. Le samedi suivant, Gégé l'a peint sur une bâche ; Vaubourg demande ce que ça rapporte."
    right:
      label: "Enterrez-le"
      effects: { direction: "+", tribunes: "-" }
      answer: "Il ne l'écrit pas. La Gazette le répète seule deux semaines, puis le surnom s'use."
  - id: en.presse.punchline
    roles: [entraineur]
    arc: presse
    tags: [presse, moment]
    speaker: lea
    text: "Léa pose son magnétophone sur la table de la salle de presse : « Une seule question, et la radio reprend ma bande à midi. Après la défaite de samedi, à qui la faute ? »"
    left:
      label: "J'accuse le mercato"
      effects: { tribunes: "++", direction: "--" }
      answer: "La radio passe ta phrase toutes les heures. À dix-huit heures, Vaubourg appelle Léa pour demander la bande."
    right:
      label: "Je prends tout pour moi"
      effects: { direction: "+", tribunes: "-" }
      answer: "Ta réponse passe une fois, à midi, entre deux publicités. Le président l'a entendue ; le virage, non."
  - id: en.presse.clash_consultant
    roles: [entraineur]
    arc: presse
    tags: [presse, scandale]
    text: "Au bord de la pelouse, Vence, de Télé-Stade, te tend son micro : sur leur plateau, l'ancien capitaine de {rival} t'a donné « jusqu'à Noël ». Ils repassent sa phrase ce soir. Tu lui réponds ?"
    left:
      label: "Je lui réponds en face"
      effects: { tribunes: "++", direction: "-" }
      answer: "Ta phrase passe à vingt heures, juste après la sienne. Le virage la chante samedi ; Vaubourg demande qui t'a autorisé."
    right:
      label: "Je passe sans m'arrêter"
      effects: { direction: "+", tribunes: "-" }
      answer: "Tu passes devant la caméra sans t'arrêter. Le plateau parle de toi dix minutes ; le président, lui, apprécie."
  - id: en.presse.rumeur
    roles: [entraineur]
    arc: presse
    tags: [presse, mercato, chaine]
    once: true
    speaker: meneche
    text: "Massenet, vitre baissée, sur le parking du stade : « Une source me dit que vous signez à Capitale FC en juin. Elle est bonne, d'habitude. Je publie demain, sauf si vous me donnez mieux. »"
    left:
      label: "Je démens fermement"
      effects: { direction: "++", tribunes: "+", set: [rumeur_mercato], schedule: [{ card: en.presse.dementi_suite, in: [3, 6] }] }
      answer: "Il publie ton démenti en page trois, avec un point d'interrogation. Capitale FC, elle, ne dément rien."
    right:
      label: "Je laisse planer le doute"
      effects: { tribunes: "++", direction: "--", set: [rumeur_mercato], schedule: [{ card: en.presse.dementi_suite, in: [3, 6] }] }
      answer: "La rumeur fait la Une. Vaubourg te lance « Capitale ? » dans l'escalier, sans s'arrêter."
  - id: en.presse.dementi_suite
    roles: [entraineur]
    arc: presse
    tags: [presse, mercato, chaine, retorse]
    when: "flag('rumeur_mercato')"
    sablier: true
    once: true
    speaker: meneche
    text: "Massenet, au téléphone : « Ma source avait raison sur un point : l'offre existe. Elle est arrivée ce matin par fax chez votre président, sur papier de Capitale FC. Vous en dites quoi ? »"
    left:
      label: "Je repousse l'offre"
      effects: { vestiaire: "++", tribunes: "+", direction: "+", clear: [rumeur_mercato] }
      answer: "Tu renvoies le fax barré d'un « non ». Bréhaut l'affiche dans le vestiaire, au-dessus du tableau."
    right:
      label: "Je négocie en douce"
      effects: { caisse: "++", vestiaire: "--", direction: "-", clear: [rumeur_mercato] }
      answer: "Ta prime de fidélité double en une semaine. Au vestiaire, quelqu'un a punaisé l'article de Massenet."
  - id: en.presse.hors_contexte
    roles: [entraineur]
    arc: presse
    tags: [presse, retorse]
    speaker: lea
    text: "Léa, deux journaux pliés à la même page : « La Gazette n'a gardé que la moitié de votre phrase : « les arbitres se trompent ». J'ai la bande entière. Un rectificatif, ou vous laissez courir ? »"
    left:
      label: "Je demande un rectificatif"
      effects: { direction: "+", tribunes: "-", caisse: "-" }
      answer: "Le rectificatif paraît en page douze, sous les petites annonces. L'avocat du club t'envoie sa note."
    right:
      label: "Je laisse courir la phrase"
      effects: { tribunes: "++", direction: "--" }
      answer: "La phrase coupée fait le tour des bars. Samedi, le virage la peint sur une bâche, les fautes en plus."
  # en.presse.le_meme est remplacée par en.presse.meme (arc_clow_presse.yaml).
  - id: en.presse.langue_de_bois
    roles: [entraineur]
    arc: presse
    tags: [presse, piege]
    speaker: meneche
    text: "Massenet referme son carnet au milieu de ta réponse : « Trois fois « match après match » en dix minutes. Je peux l'écrire, avec ce que je pense du vide. Une vraie phrase, ou je titre sur rien ? »"
    left:
      label: "Je reste dans le vague"
      effects: { tribunes: "--", direction: "-" }
      answer: "Samedi, le titre tient en quatre mots : « UN COACH, AUCUNE IDÉE ». Au local, on le découpe pour la bâche."
    right:
      label: "Je prends position"
      effects: { tribunes: "+", direction: "+", vestiaire: "-", parole: 1, promise: true }
      answer: "Tu promets le haut du tableau, à voix haute. Il rouvre son carnet et note la phrase, la date et l'heure."
  - id: en.presse.rescue_tribunes
    roles: [entraineur]
    arc: presse
    tags: [presse, tribunes, rescue:tribunes]
    when: "gauges.tribunes < 30"
    speaker: lea
    text: "Léa, à la sortie du stade, un soir de sifflets : « Radio Tribune vous offre une heure d'antenne jeudi, sans montage. Les supporters appelleront. Je serai là pour L'Écho. Vous y allez ? »"
    left:
      label: "J'y vais, sans filtre"
      effects: { tribunes: "+++", direction: "-" }
      answer: "Jeudi soir, tu réponds à quarante appels. Le dernier vient de Gégé ; il dit seulement « à samedi »."
    right:
      label: "Je garde mes distances"
      effects: { direction: "+", tribunes: "-" }
      answer: "Tu envoies un communiqué de quatre lignes. L'animateur le lit à l'antenne, lentement, en riant au milieu."
  - id: en.presse.rescue_direction
    roles: [entraineur]
    arc: presse
    tags: [presse, direction, rescue:direction]
    when: "gauges.direction < 30"
    speaker: meneche
    text: "Massenet, au bar de l'hôtel, sans carnet : « Gratuit, pour une fois : Vaubourg m'a appelé hier pour savoir si vous parliez trop. J'ai dit oui. Votre prochaine conférence décidera du reste. »"
    left:
      label: "Je rentre dans le rang"
      effects: { direction: "+++", tribunes: "-" }
      answer: "Huit minutes, un papier lu, aucune question. Vaubourg appelle pour dire « bien ». Au virage, on bâille."
    right:
      label: "Je parle comme d'habitude"
      effects: { tribunes: "++", direction: "--" }
      answer: "Tu parles vingt minutes, sans papier. La salle rit deux fois ; au fond, Vaubourg ne rit pas."
  - id: en.presse.silence_radio
    roles: [entraineur]
    arc: presse
    tags: [presse, direction]
    speaker: lea
    text: "Léa, sur le pas de la porte : « On dit que vous fermez la salle de presse jusqu'à nouvel ordre. Le président trouve ça très bien. Massenet, moins : il a déjà commencé un papier sur vous. »"
    left:
      label: "Je ferme la salle de presse"
      effects: { direction: "++", tribunes: "-", relation: { meneche: -2 } }
      answer: "La salle reste fermée trois semaines. Massenet écrit sur toi tous les jours, sans jamais te citer."
    right:
      label: "Je garde la porte ouverte"
      effects: { tribunes: "+", relation: { meneche: 1 } }
      answer: "Massenet est le premier assis, jeudi. Il pose une question facile ; il te la fera payer plus tard, poliment."
  - id: en.presse.exclu
    roles: [entraineur]
    arc: presse
    tags: [presse, sponsors, caisse]
    speaker: meneche
    text: "Massenet, un chèque du Quotidien entre deux doigts : « Le journal paie l'exclusivité : deux pages, votre photo, et au club la somme écrite là. Mes questions, elles, ne seront pas gentilles. »"
    left:
      label: "J'accepte l'exclusivité"
      effects: { caisse: "++", direction: "+", tribunes: "-" }
      answer: "Deux pages, quatorze questions. La treizième porte sur tes promesses de juillet ; c'est elle qui fait le titre."
    right:
      label: "Je refuse par principe"
      effects: { tribunes: "+", relation: { meneche: -1 }, caisse: "-" }
      answer: "Il range le chèque. Le Quotidien interroge ton prédécesseur, qui parle de toi pendant deux pages."
  - id: en.presse.consultant_faveur
    roles: [entraineur]
    arc: presse
    tags: [presse, retorse]
    text: "Radio Tribune, vingt-trois heures : l'ancien buteur du club, consultant, te défend depuis trois semaines. Ce soir, au téléphone, il te parle de son neveu : dix-neuf ans, latéral, « sérieux »."
    left:
      label: "Je prends le neveu à l'essai"
      effects: { tribunes: "+", direction: "--" }
      answer: "Le neveu s'entraîne avec la réserve. À l'antenne, ton nom revient chaque soir ; au bureau, on parle de copinage."
    right:
      label: "Je refuse poliment"
      effects: { direction: "+", tribunes: "-" }
      answer: "Dès le lendemain, il trouve que ton équipe manque d'idées. Il le dit poliment, à vingt-trois heures."
  - id: en.presse.derapage_direct
    roles: [entraineur]
    arc: presse
    tags: [presse, scandale, moment]
    once: true
    speaker: lea
    text: "Léa, magnétophone à la main, dans le couloir : « Le micro de la radio était resté ouvert. On vous entend traiter ceux de {rival} de « touristes ». Ils repassent la bande à minuit. Un mot ? »"
    left:
      label: "J'assume, c'était mérité"
      effects: { tribunes: "++", direction: "--" }
      answer: "Le virage imprime « TOURISTES » sur des écharpes. Vaubourg te convoque à huit heures, une écharpe posée sur son bureau."
    right:
      label: "Je présente mes excuses"
      effects: { direction: "+", tribunes: "-", vestiaire: "-" }
      answer: "Tu t'excuses au micro, phrase par phrase. Dans le bus, les joueurs ne te regardent pas ; ils avaient ri."
