cards:
  # en.ultras.banderole (« deux banderoles prêtes ») est devenue l'étape D3b
  # en.kop.banderoles de l'arc « Le kop qui t'aime trop ».
  # en.ultras.premiere_rencontre, en.ultras.pacte_kop et en.ultras.pacte_suite
  # sont remplacées par l'arc D « Le kop qui aime trop » (arc_kop.yaml).
  - id: en.ultras.greve_encouragements
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, rescue:tribunes]
    speaker: gege
    when: "gauges.tribunes < 25"
    text: "Gégé, à la grille du virage, la bâche roulée sous le bras : « Dimanche, pas un chant, pas un drapeau. Quatre-vingt-dix minutes de silence. Au local, trois de tes promesses sont encore à la craie. »"
    left: {label: "Je monte chanter avec eux", effects: {tribunes: "+++", direction: "--"}, answer: "Tu prends le mégaphone. Le stade explose."}
    right: {label: "Qu'ils se taisent", effects: {tribunes: "--"}, answer: "On entend le ballon rouler. C'est glaçant."}

  - id: en.ultras.tifo
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, caisse]
    speaker: gege
    when: "gauges.tribunes > 30"
    text: "Gégé déplie un plan sur le capot de ta voiture : « Le tifo du prochain match à domicile. Quatre cents mètres de tissu, soixante pots de peinture, deux nuits au local. Il manque l'argent du tissu. »"
    left: {label: "Le club paie le tifo", effects: {caisse: "--", tribunes: "++"}, answer: "Au coup d'envoi, ton visage sur quatre cents mètres carrés. Le président le regarde longtemps, sans applaudir."}
    right: {label: "Débrouillez-vous, les gars", effects: {tribunes: "-", direction: "+", caisse: "+"}, answer: "Ils font la quête au marché, un samedi entier. Le tifo sort, plus petit ; ton nom n'y est pas."}

  - id: en.ultras.derby
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, moment]
    speaker: gege
    when: "gauges.tribunes > 35"
    text: "Gégé, sur le parking, la veille du derby contre {rival} : « L'an dernier, chez eux, ils ont brûlé notre bâche sur la pelouse. Demain, on veut que tes gars s'en souviennent. Tu le jures ? »"
    left: {label: "Je te le jure", effects: {tribunes: "++", vestiaire: "-", parole: 1, promise: true}, answer: "Le vestiaire entend le serment par la fenêtre."}
    right: {label: "Je ne jure rien", effects: {tribunes: "--", vestiaire: "+"}, answer: "Il remonte en voiture et claque la portière. Le lendemain, le virage chante pour les joueurs, jamais pour toi."}

  - id: en.ultras.envahissement
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, risk:direction]
    speaker: brehaut
    when: "gauges.tribunes > 60"
    text: "Bréhaut, au retour de l'échauffement : « Gégé a prévenu : si on se maintient, le virage descend sur la pelouse au coup de sifflet. Le commissaire veut cadenasser les grilles. Ça dépend de toi. »"
    left: {label: "Je les laisse fêter ça", effects: {rand: [{p: 0.6, tribunes: "++", direction: "--"}, {tribunes: "-", direction: "---"}]}, answer: "Les grilles s'ouvrent au coup de sifflet. Ce qui se passe ensuite, le président le regarde de la loge, sans bouger."}
    right: {label: "Tout le monde reste dehors", effects: {tribunes: "--", direction: "+"}, answer: "Les cadenas tiennent. Le virage chante derrière les grilles, puis les secoue, jusqu'à l'arrivée de la police."}

  - id: en.ultras.naming_virage
    roles: [entraineur]
    arc: ultras
    tags: [ultras, sponsors, retorse]
    speaker: aulard
    when: "gauges.caisse < 55"
    text: "Vaubourg pose un chèque sur ton bureau sans le lâcher : « Le garage Mauduit paie la saison si le virage porte son nom. Tribune Mauduit, en lettres rouges. Tu l'annonces à Gégé, ou je m'en charge ? »"
    left: {label: "On signe, la caisse d'abord", effects: {caisse: "+++", tribunes: "--", relation: {gege: -2}}, answer: "Gégé découvre la pancarte un mardi matin. Le mercredi, elle est repeinte en noir, et personne n'a rien vu."}
    right: {label: "Je refuse le chèque", effects: {caisse: "-", tribunes: "++", relation: {gege: 2}}, answer: "Le chèque retourne dans la poche du président. Au local, quelqu'un écrit ton nom à la craie au-dessus du bar."}

  - id: en.ultras.mairie_subvention
    roles: [entraineur]
    arc: ultras
    tags: [ultras, caisse, retorse]
    speaker: aubert
    when: "gauges.caisse < 60"
    text: "Madame Aubert, à la sortie du conseil municipal : « La subvention est votée. Je veux un panneau sur la tribune, « La Ville de {ville} soutient son club », avec mon nom dessous. Et deux loges. »"
    left: {label: "Marché conclu, Madame", effects: {caisse: "++", tribunes: "-", direction: "+"}, answer: "Le panneau est déjà commandé, plus grand que prévu."}
    right: {label: "Je refuse le panneau", effects: {caisse: "--", tribunes: "+"}, answer: "Elle range le dossier sans le fermer. La subvention repasse au conseil suivant, amputée d'un tiers."}

  - id: en.ultras.portes_ouvertes
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, rescue:tribunes]
    speaker: gege
    when: "gauges.tribunes < 25"
    text: "Gégé, la mine grave, devant le local à moitié vide : « Le virage se vide, coach. Viens signer des maillots aux gamins mercredi, au terrain annexe. Ça peut encore se retourner. »"
    left: {label: "J'ouvre les portes un jour", effects: {tribunes: "+++", vestiaire: "-", caisse: "-"}, answer: "Trois cents gamins, des maillots signés au feutre, des appareils jetables. Gégé compte les écharpes à la sortie."}
    right: {label: "On sauvera ça au score", effects: {tribunes: "-", force: 4}, answer: "Tu ne viens pas. Au local, Gégé raye une ligne au tableau, d'un seul trait."}

  - id: en.ultras.fumigenes
    roles: [entraineur]
    arc: ultras
    tags: [ultras, direction, risk:direction]
    speaker: vukic
    when: "gauges.tribunes > 45"
    text: "Vukić, une lettre de la Commission de discipline à la main : « Troisième fumigène sur la pelouse en deux matchs. Au prochain, c'est le huis clos. Le président veut des noms. »"
    left: {label: "Je couvre le kop", effects: {tribunes: "++", direction: "--", caisse: "-"}, answer: "Au micro, tu parles de « fumée de supporters ». Au match suivant, une bâche à ton nom, et deux fumigènes de plus."}
    right: {label: "Je condamne en public", effects: {tribunes: "--", direction: "++"}, answer: "Tu lis le communiqué devant L'Écho. Le soir, la porte du local reste fermée quand tu passes devant."}

  - id: en.ultras.deplacement
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, absurde]
    speaker: gege
    when: "gauges.tribunes > 30"
    text: "Gégé, la liste des inscrits à la main : « Cent quarante pour le déplacement dans le Sud, sept heures de route. Trois cars : le club paie l'essence ? Sinon, on part de nuit, à cinq par voiture. »"
    left: {label: "Le club affrète les cars", effects: {caisse: "-", tribunes: "++"}, answer: "Trois cars derrière celui de l'équipe. À chaque péage, ils chantent ton nom ; Norbert monte la radio."}
    right: {label: "Débrouillez-vous", effects: {tribunes: "+", caisse: "+"}, answer: "Ils arrivent à la 60e, trempés. Au retour, une des voitures finit dans un fossé ; Gégé ne t'en parle pas."}

  - id: en.ultras.ville_endormie
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, piege]
    speaker: aubert
    when: "gauges.tribunes < 50"
    text: "Madame Aubert, un ruban de rond-point dans son sac, devant le stade à moitié vide : « Quatre mille dimanche, dix mille l'an dernier. Les gens votent comme ils vont au stade. Vous me les ramenez ? »"
    left: {label: "Je lance une grande fête", effects: {tribunes: "++", caisse: "--", direction: "+"}, answer: "Fanfare, buvette, feu d'artifice derrière la tribune Nord. Elle coupe un ruban ; la caisse du club paie la poudre."}
    right: {label: "On gagne, c'est tout", effects: {tribunes: "--", direction: "-"}, answer: "Elle repart sans serrer de main. Au conseil suivant, le club passe en dernier point de l'ordre du jour."}
