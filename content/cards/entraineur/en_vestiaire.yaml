cards:
  - id: en.vestiaire.cadres_conseil
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: brehaut
    text: "Bréhaut, assis sur le banc du fond, les crampons à la main : « Vecchio, Momo et moi, on voudrait se réunir le jeudi, sans le staff. Les amendes, les retards, la musique. Toi, tu gardes le tableau. »"
    left: {label: "Je délègue aux cadres", effects: {vestiaire: "++", direction: "-"}, answer: "Le jeudi, la porte du vestiaire se ferme à dix-huit heures. Les retards baissent, et tu ne sais plus pourquoi."}
    right: {label: "Je garde la main", effects: {vestiaire: "-", force: "+"}, answer: "Tu gardes les amendes et le carnet. Bréhaut range le brassard dans son casier au lieu de le mettre."}

  - id: en.vestiaire.star_reveil
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, absurde]
    speaker: vukic
    text: "Vukić, à voix basse : « Dembo est arrivé à onze heures par la porte des livreurs. Il dit qu'il ne se change plus avec les autres. Il veut l'infirmerie pour lui seul. »"
    left: {label: "Donne-lui l'infirmerie", effects: {vestiaire: "--", tribunes: "+"}, answer: "Rouvier, la kiné, pousse sa table dans le couloir. Le reste du groupe compte les mètres carrés."}
    right: {label: "J'impose la douche commune", effects: {vestiaire: "+", direction: "-"}, answer: "Il se change avec les autres, dos au mur. Le soir, le président t'appelle : Dembo lui a téléphoné le premier."}

  - id: en.vestiaire.bizutage_chant
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: mbako
    text: "Mbako, rouge jusqu'aux oreilles, près de la table de massage : « Les anciens veulent que je chante sur la table, en slip, devant tout le monde. Ma mère vient me chercher à huit heures. »"
    left: {label: "Je le laisse chanter", effects: {vestiaire: "++"}, answer: "Il chante une berceuse de sa mère, dans sa langue à elle. Personne ne rit ; Vecchio applaudit le premier."}
    right: {label: "Je protège le petit", effects: {vestiaire: "-", relation: {mbako: 1}}, answer: "Tu dis non devant tout le monde. Les anciens rangent leurs serviettes ; le bizutage passe au jeune gardien."}

  - id: en.vestiaire.mutinerie_couve
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, chaine]
    speaker: vukic
    text: "Vukić s'assoit à côté de toi dans le car, au retour d'un déplacement perdu : « Au fond, trois joueurs, toujours les mêmes. Une réunion jeudi soir, chez l'un d'eux. J'ai entendu ton nom deux fois. »"
    left: {label: "Je crève l'abcès ce soir", effects: {vestiaire: "+", force: "+"}, answer: "Tu te lèves au milieu du car et tu demandes qui veut parler. Personne. Jeudi, la réunion n'a pas lieu."}
    right: {label: "Je laisse couver", effects: {vestiaire: "-", set: [mutinerie], schedule: [{card: en.vestiaire.mutinerie_eclate, in: [3, 8]}]}, answer: "Tu regardes la route. Jeudi soir, trois voitures restent garées devant le même pavillon jusqu'à minuit."}

  - id: en.vestiaire.mutinerie_eclate
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, chaine, scandale]
    sablier: true
    when: "flag('mutinerie')"
    text: "Ton bureau, neuf heures. Quatre joueurs debout, une lettre signée posée sur ta compo : « Pour le président. On ne joue plus comme ça. » Bréhaut est resté dans le couloir."
    left: {label: "Je vends le meneur", effects: {vestiaire: "+", caisse: "+", clear: [mutinerie]}, answer: "Le meneur est vendu avant la fin du mois, à perte. Le vestiaire se tait, et la lettre ne monte jamais."}
    right: {label: "Je cède, ils décident", effects: {vestiaire: "--", direction: "--", clear: [mutinerie]}, answer: "Ils écrivent la compo de samedi au tableau, à ta place. La lettre monte quand même chez le président."}

  - id: en.vestiaire.capitaine_usure
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: brehaut
    text: "Bréhaut, la cheville dans un seau de glace : « Rouvier m'a strappé trois fois cette semaine. Je veux l'apprendre de toi, pas du journal : il me reste combien de dimanches ? »"
    left: {label: "Je te garde titulaire", effects: {vestiaire: "+", force: "-"}, answer: "Il joue dimanche, strappé jusqu'au mollet. À la 70e, le stade se lève pour lui, comme pour un adieu."}
    right: {label: "Je passe la main aux jeunes", effects: {vestiaire: "-", force: "+", relation: {brehaut: -1}}, answer: "Il sort le pied de la glace et le sèche. Il apprend la compo avant les autres, comme il l'a demandé."}

  - id: en.vestiaire.prime_contestee
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: brehaut
    text: "Bréhaut pose une enveloppe de paie ouverte sur ton bureau : « La prime de la victoire : promise cinq mille, payée moitié. Les gars ont recompté deux fois. Tu montes le dire au président ? »"
    left: {label: "Je réclame la prime pleine", effects: {direction: "-", vestiaire: "++"}, answer: "Le trésorier fait semblant de chercher un stylo."}
    right: {label: "Je calme le vestiaire", effects: {vestiaire: "-", direction: "+"}, answer: "Tu dis « le mois prochain ». Bréhaut range l'enveloppe et écrit la date dessus, au stylo bille."}

  - id: en.vestiaire.clan_anciens
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: vecchio
    text: "Vecchio, son plateau sur la table des anciens, au réfectoire du centre : « Ici, la radio, c'est Bréhaut et moi. Les jeunes mangent debout, près des frigos. Moi aussi, en soixante-dix. »"
    left: {label: "Je mélange les tables", effects: {vestiaire: "-", force: "+"}, answer: "Lundi, les plateaux sont mélangés. Les anciens boudent une semaine ; un gamin du centre mange en face de Vecchio, qui lui passe le sel."}
    right: {label: "La table reste aux anciens", effects: {vestiaire: "+", relation: {vecchio: 1}}, answer: "Rien ne change. Les jeunes mangent debout, le plateau sur le frigo, et écoutent la radio des anciens."}

  - id: en.vestiaire.mise_au_vert
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, absurde]
    speaker: vukic
    text: "Vukić, au comptoir de l'hôtel de la mise au vert : « Le patron demande s'il coupe le téléphone des chambres. Hier, un des nôtres a appelé le Sud jusqu'à deux heures du matin. »"
    left: {label: "Je coupe tout", effects: {vestiaire: "-", force: "++"}, answer: "Le standard se tait à vingt et une heures. Ils dorment, ou font semblant ; à minuit, la cabine du hall est occupée."}
    right: {label: "Le téléphone jusqu'à 22 h", effects: {vestiaire: "+", force: "-"}, answer: "Les chambres appellent jusqu'à dix heures. La facture arrive chez Josiane une semaine plus tard, avec les numéros."}

  - id: en.vestiaire.retour_blessure
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, risk:vestiaire]
    speaker: sabatier
    text: "Sabatier tient une radio de genou contre la fenêtre : « Le ménisque de Dembo a cicatrisé, à peu près. Le genou dit peut-être. Fardelli a téléphoné deux fois pour dire dimanche. »"
    left: {label: "Je le relance dimanche", effects: {rand: [{p: 0.5, vestiaire: "+", force: "++"}, {vestiaire: "--", force: "-", set: [genou]}]}, answer: "Dimanche, il joue. Sabatier ne regarde pas le match ; il regarde le genou, à chaque appui."}
    right: {label: "Je le laisse au repos", effects: {force: "-", relation: {sabatier: 1}}, answer: "Sabatier range la radio dans son armoire. Fardelli rappelle le soir pour demander qui a décidé."}

  - id: en.vestiaire.ego_double
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, absurde]
    speaker: vukic
    text: "Vukić, le cahier ouvert à la page du mois : « Dembo et l'attaquant du président : trente passes chacun, aucune entre eux. Dimanche, Dembo a tiré au lieu de lui offrir un but vide. »"
    left: {label: "Je n'en garde qu'un", effects: {vestiaire: "-", direction: "-", caisse: "+"}, answer: "L'attaquant du président part en janvier. Dembo marque deux fois, puis l'attaque tourne en rond."}
    right: {label: "Même chambre à l'hôtel", effects: {vestiaire: "+", force: "-"}, answer: "Une semaine dans la même chambre. Ils ne se parlent pas ; dimanche, Dembo lui donne un ballon, un seul."}

  - id: en.vestiaire.soiree_karaoke
    roles: [entraineur]
    arc: vestiaire
    tags: [rescue:vestiaire, moment]
    speaker: brehaut
    cooldown: 20
    when: "gauges.vestiaire < 25"
    text: "Bréhaut, au téléphone, vendredi soir : « Depuis la Coupe perdue chez des amateurs, plus personne ne se parle. Samedi, karaoké dans l'arrière-salle du Café des Sports. Le club paie les verres ? »"
    left: {label: "Je viens à la soirée", effects: {vestiaire: "+++", caisse: "-"}, answer: "On rit enfin, vers une heure du matin. Bréhaut chante faux ; Vecchio gagne aux cartes et rend l'argent."}
    right: {label: "Je fais bosser le groupe", effects: {vestiaire: "-", force: "+"}, answer: "Double séance samedi matin. Ils courent sans se parler, et repartent chacun dans sa voiture."}

  - id: en.vestiaire.vieux_gardien
    roles: [entraineur]
    arc: vestiaire
    tags: [rescue:vestiaire]
    speaker: vecchio
    cooldown: 20
    when: "gauges.vestiaire < 25"
    text: "Vecchio, les gants jaunes sous le bras, dans le couloir : « Laisse-moi dix minutes avec eux. Porte fermée, sans toi, sans Zoran. Je l'ai déjà fait en quatre-vingt-deux, une saison où on descendait. »"
    left: {label: "Je te laisse parler", effects: {vestiaire: "++", relation: {vecchio: 1}}, answer: "Dix minutes, porte fermée. Ils ressortent et vont s'entraîner ; tu ne sauras jamais ce qu'il leur a dit."}
    right: {label: "Je gère seul", effects: {vestiaire: "-", force: "+"}, answer: "Tu parles toi-même. Ils écoutent, les yeux sur leurs chaussures ; Vecchio range ses gants plus tôt que d'habitude."}

  - id: en.vestiaire.cap_ou_meuble
    roles: [entraineur]
    arc: vestiaire
    tags: [piege]
    speaker: vukic
    text: "Vukić pose deux cafés sur ton bureau, à sept heures : « Trois semaines sans une décision. Hier, Bréhaut a fait la compo du jeudi à ta place, et personne n'a demandé où tu étais. »"
    left: {label: "J'impose une règle forte", effects: {vestiaire: "-", force: "++", direction: "+"}, answer: "À neuf heures, une feuille au tableau : horaires, amendes, téléphone. Dembo la lit en riant ; il paie la première amende."}
    right: {label: "J'attends encore un peu", effects: {vestiaire: "--", direction: "-"}, answer: "Jeudi, Bréhaut refait la compo. Vendredi, le président l'appelle, lui, pour savoir qui joue."}

  - id: en.vestiaire.brassard_vote
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: vukic
    text: "Vukić, en ramassant les plots : « Les jeunes veulent voter pour le brassard. Ils poussent le petit Mbako. Bréhaut le sait et continue ses étirements. Un vote ne se reprend pas. »"
    left: {label: "Je laisse voter", effects: {vestiaire: "+", relation: {brehaut: -1}}, answer: "Mbako gagne de deux voix. Bréhaut lui passe le brassard lui-même, et sourit mal."}
    right: {label: "Je nomme le capitaine", effects: {vestiaire: "-", direction: "+", force: "+"}, answer: "Tu gardes Bréhaut. Le vote a lieu quand même, le soir, au café : Mbako gagne, sans brassard."}

  - id: en.vestiaire.veteran_banc
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vecchio
    text: "Vecchio attend que les jeunes soient sortis de la douche : « Le jeune Lorrain a enfilé mes gants ce matin, pour rire. Si tu me mets au banc samedi, d'accord. Mais pas en tribune, coach. »"
    left: {label: "Je te laisse dans les buts", effects: {vestiaire: "-", force: "-", relation: {vecchio: 1}}, answer: "Il garde les buts samedi. Il prend un but de quarante mètres, et ne regarde pas le banc en rentrant au vestiaire."}
    right: {label: "Je lance le jeune", effects: {vestiaire: "+", force: "+", relation: {vecchio: -2}}, answer: "Il laisse son casier au jeune et prend celui du fond. Samedi, il est au bout du banc, les gants jaunes sur les genoux."}

  - id: en.vestiaire.star_argent
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, agents]
    speaker: fardelli
    when: "!flag('mbako_vendu')"
    text: "Fardelli, une main sur ton épaule, dans le couloir : « Le petit marque, toute la ville le voit. Un geste à chaque but, entre amis. Sinon il aura des douleurs ; à son âge, ça arrive. »"
    left: {label: "J'accepte la prime au but", effects: {caisse: "-", vestiaire: "--"}, answer: "Le vestiaire découvre un nouveau tarif. Bréhaut demande, poliment, le même pour les passes."}
    right: {label: "Je refuse, qu'il joue", effects: {vestiaire: "+", relation: {mbako: -1}}, answer: "Fardelli lève les mains et sourit. Le lendemain, Mbako boite à l'entraînement et cherche Fardelli des yeux en tribune."}

  - id: en.vestiaire.toro_coach
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vukic
    text: "Terrain annexe, fin de séance. Le toro s'ouvre et Bréhaut te fait signe d'entrer au milieu. Vukić, qui note quelque chose dans son cahier : « Ils te testent. Ou ils t'aiment bien. »"
    left: {label: "Je rentre dans le rond", effects: {vestiaire: "++", force: "-"}, answer: "Tu prends trois petits ponts, dont un de Vecchio. Ils rient ; le lendemain, tout le monde est à l'heure."}
    right: {label: "Je siffle la fin", effects: {vestiaire: "-", force: "+"}, answer: "Tu siffles. Le toro se défait ; Bréhaut ramasse les plots, seul."}
