# Cartes des événements exceptionnels (arcs/entraineur/evenements.yaml, kind
# evenement dérivé par le build) et la carte d'alarme de surcharge du postulat
# « Le promu sans un sou » (postulats.yaml → alarm_overrides caisse.low).
# Toutes hors du sac. `arc:` est le THÈME de la carte, pas l'id de l'arc.
# Une seule sortie = les deux côtés identiques (single dérivé).
cards:
  # ============================================================ 1 · L'ultimatum
  - id: en.evt.ultimatum
    roles: [entraineur]
    arc: direction
    tags: [direction, risk:direction]
    speaker: aulard
    tone: strategique
    once: true
    text: "Aulard, debout : « Trois défaites de suite. Le prochain bloc est un ultimatum. J'ai déjà le numéro de ton remplaçant, il est dans mon écurie de trot. »"
    left:
      label: "On attaque à outrance"
      effects: {force: 4, vestiaire: "-", set: [ultimatum], next: {step: verdict, in: [2, 4]}}
      answer: "Le vestiaire apprend le mot « outrance ». Le président apprend la date."
    right:
      label: "Bloc bas, on assure"
      effects: {tribunes: "--", direction: "+", next: end}
      answer: "Gégé apprend « bloc bas » par la presse. Aulard range le numéro. Pas loin."

  # Verdict, variante noire : la série continue.
  - id: en.evt.ultimatum_sms
    roles: [entraineur]
    arc: direction
    tags: [direction]
    speaker: aulard
    tone: strategique
    once: true
    text: "Aulard, au téléphone : « Le SMS est parti à 23 h 47. Je te le lis pour que tu l'aies avant les journalistes. J'ai pas le temps, j'ai un empire. »"
    left:
      label: "Je l'écoute jusqu'au bout"
      effects: {end: en_sms}
      answer: "Il y a une faute d'orthographe. Tu la corriges."
    right:
      label: "Je l'écoute jusqu'au bout"
      effects: {end: en_sms}
      answer: "Il y a une faute d'orthographe. Tu la corriges."

  # Verdict, variante claire : la série s'est arrêtée.
  - id: en.evt.ultimatum_fils
    roles: [entraineur]
    arc: direction
    tags: [direction, rescue:direction]
    speaker: aulard
    tone: strategique
    once: true
    text: "Aulard, bras ouvert : « Je parle de toi comme de mon fils. Mon vrai fils est furieux. J'ai pas le temps, j'ai un empire : tu montes dans la loge ? »"
    left:
      label: "Je monte, président"
      effects: {direction: "+++", set: [homme_president], relation: {aulard: 1}}
      answer: "Le vrai fils quitte la loge. Tu prends sa chaise, encore chaude."
    right:
      label: "Je reste sur le banc"
      effects: {direction: "+", vestiaire: "+", relation: {aulard: -1}}
      answer: "Il rit. Il note quand même le mot « banc »."

  # ================================================ 2 · La voiture du président
  - id: en.evt.voiture
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, direction, absurde]
    speaker: vukic
    tone: leger
    once: true
    text: "Vukić, essoufflé : « Je te le dis parce que personne ne te le dira. Le vestiaire a brûlé la voiture du président. Il t'attend au parking avec ton contrat. »"
    left:
      label: "Je couvre les gars"
      effects: {vestiaire: "+++", direction: "---", relation: {aulard: -2}, set: [voiture_couverte]}
      answer: "Le vestiaire t'applaudit. Le président lit ton contrat à voix haute, page trois."
    right:
      label: "Je livre les coupables"
      effects: {vestiaire: "---", direction: "++", relation: {brehaut: -1}}
      answer: "Trois noms sur un papier. Bréhaut te regarde les écrire."

  # ===================================================== 3 · La tribune vétuste
  - id: en.evt.tribune
    roles: [entraineur]
    arc: tribunes
    tags: [tribunes, caisse, direction]
    speaker: aubert
    tone: strategique
    once: true
    text: "Madame Aubert, un rapport à la main : « La tribune Nord ne tient plus. Les travaux coûtent une saison de recettes. Le stade, c'est de l'argent public. »"
    left:
      label: "On ferme la tribune"
      effects: {tribunes: "---", caisse: "-", relation: {gege: -1}, set: [tribune_fermee], next: end}
      answer: "Gégé chante depuis la tribune Sud. Moins fort. Il compte les absents."
    right:
      label: "On verra l'été prochain"
      effects: {var: {tribune_ignoree: "+1"}}
      answer: "Elle range le rapport. Elle garde la date."

  - id: en.evt.tribune_rappel
    roles: [entraineur]
    arc: tribunes
    tags: [tribunes, caisse, risk:tribunes]
    speaker: aubert
    tone: strategique
    once: true
    text: "Madame Aubert, deuxième rapport : « La poutre a bougé de trois centimètres. Je n'ai pas de tribune de rechange. Le stade, c'est de l'argent public. »"
    left:
      label: "On ferme la tribune"
      effects: {tribunes: "---", caisse: "-", relation: {gege: -1}, set: [tribune_fermee], next: end}
      answer: "Gégé apprend le mot « fermer » par affichage municipal. Il compte encore."
    right:
      label: "On verra l'été prochain"
      effects: {var: {tribune_ignoree: "+1"}}
      answer: "Elle ne range pas le rapport. Elle le laisse sur ton bureau."

  # rappel2, variante noire : deux « on verra » de suite.
  - id: en.evt.tribune_noir
    roles: [entraineur]
    arc: tribunes
    tags: [tribunes, moment]
    speaker: aubert
    tone: drame
    once: true
    text: "Madame Aubert, sans rapport : « La tribune Nord est tombée à la soixante-douzième minute. On compte encore. Vous aviez dit : l'été prochain. »"
    left:
      label: "Je descends sur la pelouse"
      effects: {end: en_tribune}
      answer: "Le stade est silencieux. Gégé n'est pas là pour le remplir."
    right:
      label: "Je descends sur la pelouse"
      effects: {end: en_tribune}
      answer: "Le stade est silencieux. Gégé n'est pas là pour le remplir."

  # rappel2, variante claire : la préfecture tranche.
  - id: en.evt.tribune_ferme
    roles: [entraineur]
    arc: tribunes
    tags: [tribunes, direction]
    speaker: aubert
    tone: strategique
    once: true
    text: "Madame Aubert, un arrêté à la main : « La préfecture a signé. La tribune Nord ferme demain, sans vous demander. Le stade, c'est de l'argent public. »"
    left:
      label: "On ferme"
      effects: {tribunes: "--", set: [tribune_fermee]}
      answer: "Les grilles se ferment un mardi. Gégé accroche son écharpe dessus."
    right:
      label: "On ferme"
      effects: {tribunes: "--", set: [tribune_fermee]}
      answer: "Les grilles se ferment un mardi. Gégé accroche son écharpe dessus."

  # ========================================================== 4 · Gérard a fui
  - id: en.evt.gerard
    roles: [entraineur]
    arc: caisse
    tags: [caisse, absurde, scandale]
    speaker: josiane
    tone: leger
    once: true
    text: "Madame Josiane, tiroir vide : « Gérard tenait la buvette et la caisse depuis vingt ans. Il est en Thaïlande. La caisse aussi. J'en ai vu passer, vous savez. »"
    left:
      label: "On porte plainte"
      effects: {direction: "+", caisse: "--", tribunes: "-"}
      answer: "Le journal titre sur la buvette. Les abonnés apprennent le mot « détournement »."
    right:
      label: "On étouffe, on refait"
      effects: {caisse: "---", vestiaire: "+"}
      answer: "Bréhaut tient la buvette le samedi. Le groupe vit bien, et boit gratis."

  # ================================== alarme de surcharge · caisse basse, Nassir
  # Servie avant en.alarme.caisse_bas_josiane dans le postulat « Le promu sans
  # un sou » quand Nassir est déjà dans la place (postulats.yaml →
  # alarm_overrides caisse.low, when relation.nassir >= 0 && vars.nassir_palier >= 1).
  - id: en.promu.alarme_nassir_offre
    roles: [entraineur]
    arc: sponsors
    tags: [sponsors, caisse]
    speaker: nassir
    tone: strategique
    cooldown: 10
    when: "gauges.caisse < 25"
    text: "Cheikh Nassir, par fax : « Mon offre tient toujours. Elle a juste un peu baissé. Ce n'est pas un club, c'est un actif. »"
    left:
      label: "On prend, même baissée"
      # Pas de `nassir_palier` ici : seules les cartes de l'arc C posent le
      # palier (sinon un joueur qui refuse le prêt partait quand même au rachat).
      effects: {caisse: "+++", tribunes: "-", relation: {nassir: 1}}
      answer: "Le virement arrive avant le fax. Josiane classe le fax quand même."
    right:
      label: "On serre les dents"
      effects: {caisse: "-", direction: "+", var: {nassir_refus: "+1"}, relation: {nassir: -1}, set: [salaires_retard]}
      answer: "Les salaires partent le 12. Nassir note la date, lui aussi."
