# HISTOIRE 1 — « TROIS MILLE VISAGES » : les cartes du prologue et du script
# (content/arcs/entraineur/h1_script.yaml, arcs `en.h1.prologue` et
# `en.h1.visages`).
#
# Ce que le joueur sait, et ce que la ville ignore : tu es l'enfant d'Henri
# Ravenel, numéro 5 et capitaine du Racing de 1974, accusé d'avoir vendu la
# finale, sorti de la Rive en mars 1975. Tu as pris le car de six heures avec
# ta mère, et son nom à elle ({nom}). Personne ne le sait à Aubérive, sauf
# Gégé, qui t'a reconnu sur la photo de L'Écho en juin.
#
# Les voix (charte d'écriture § 3) : Gégé dit « nous », retient les dates et
# les sommes, ne ment jamais, se tait. Vaubourg est pressé, possessif, tape sa
# chevalière sur ce qu'il touche (la chevalière revient : c'est elle que le
# neveu de Gégé décrira à Lhoste). Josiane avertit par un geste. Vukić dit
# l'heure et ce qu'il a vu. Camille parle de ce que la ville coûte. Gigi est
# lent et regarde trop longtemps. Les intermèdes n'ont pas de locuteur : ils
# déforment, ils ne mentent pas.
#
# Le protagoniste peut être une femme : aucun accord sur « tu » sans
# `{pg, select, f{e} other{}}`. Henri est « ton père » ; Gégé dit « le tien ».
# Les ancres lisent `stats.clubs < 2` : hors d'Aubérive, le livre se tait.
cards:
  # ═══════════════════════════════════════════════════════════ LE PROLOGUE
  # 1/6 · La photo — l'escalier du club-house, les deux clés.
  - id: en.h1.pro1_photo
    roles: [entraineur]
    arc: direction
    tags: [direction, decor]
    speaker: josiane
    tone: leger
    once: true
    text: "Dans l'escalier, la photo de la finale de 1974, le cinquième visage gratté au couteau jusqu'au carton. Josiane tend deux clés : « Le bureau, le local à ballons. Les archives, on n'y monte plus. »"
    left:
      label: "Je prends les deux"
      effects: {direction: "+", vestiaire: "-", set: [h1_cle_bureau]}
      answer: "Elle te les donne sans quitter la photo des yeux. « On ne l'a jamais décrochée. Ni fait réparer. »"
    right:
      label: "Le local me suffit"
      effects: {vestiaire: "+", direction: "-", relation: {josiane: 1}}
      answer: "Elle garde la clé du bureau. En remontant, elle redresse le cadre d'un doigt, sans regarder le trou."

  - id: en.h1.pro1_photo_argent
    roles: [entraineur]
    arc: direction
    tags: [direction, caisse, decor]
    speaker: josiane
    tone: leger
    once: true
    text: "Dans l'escalier, la photo de la finale de 1974 porte une étiquette À VENDRE de la boutique. Le cinquième visage est gratté au couteau. Josiane tend deux clés : « Le bureau, le local à ballons. »"
    left:
      label: "Je prends les deux"
      effects: {direction: "+", vestiaire: "-", set: [h1_cle_bureau]}
      answer: "« Le président vend tout ce qui est encadré, cet été. » Elle décolle l'étiquette avec l'ongle, puis la recolle, droite."
    right:
      label: "Le local me suffit"
      effects: {vestiaire: "+", direction: "-", relation: {josiane: 1}}
      answer: "Elle garde la clé du bureau. « Les archives, on n'y monte plus. Elles, au moins, ne sont pas à vendre. »"

  # 2/6 · Le chant — la Tribune Nord vide ; ton nom est déjà dedans.
  - id: en.h1.pro2_chant
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes]
    speaker: gege
    tone: leger
    once: true
    text: "La Nord vide. Trente voix répètent un chant où ton nom est déjà, et Gégé bat la mesure du plat de la main sur le grillage : « On l'a appris en juin. Tu veux savoir pourquoi on t'aime déjà ? »"
    left:
      label: "Dites-le-moi"
      effects: {vestiaire: "-", relation: {gege: 1}, set: [h1_chant_su]}
      answer: "« Parce que tu fais tenir les équipes qui ont rien. » Il sourit, la main à plat sur le grillage. « C'est ce qu'on dira aux journaux. »"
    right:
      label: "Je ne veux pas savoir"
      effects: {direction: "+"}
      answer: "« Tant mieux. » Sa main s'arrête. Au couplet suivant, les trente voix ralentissent sur ton nom, exprès, pour que tu l'entendes."

  - id: en.h1.pro2_chant_president
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, direction]
    speaker: gege
    tone: leger
    once: true
    text: "La Nord vide. Trente voix répètent un chant où ton nom est déjà. Gégé bat la mesure du plat de la main : « Le président croit qu'il t'a trouvé tout seul, {toi}. On le laisse croire ? »"
    left:
      label: "Qui m'a trouvé, alors ?"
      effects: {vestiaire: "-", relation: {gege: 1}, set: [h1_chant_su]}
      answer: "« Quelqu'un qui lit L'Écho. » Il tapote le journal plié dans sa poche, ouvert à la page trois, où ta photo est entourée au stylo bille."
    right:
      label: "Laissez-le croire"
      effects: {direction: "+"}
      answer: "« On sait faire. » Derrière lui, un ancien fait répéter ton nom aux plus jeunes, syllabe par syllabe."

  # 3/6 · Le café — Vukić a vu ce que le président a vu.
  - id: en.h1.pro3_cafe
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: vukic
    tone: leger
    once: true
    text: "Vukić pose deux tasses, la sienne ébréchée : « Le président, devant cette porte, six heures et demie. Ce matin, toi devant la photo de l'escalier, lui derrière à te regarder. Demain ? »"
    left:
      label: "Je serai là avant lui"
      effects: {direction: "+", vestiaire: "-", relation: {vukic: 1}, set: [h1_matin_tot]}
      answer: "Le président te trouve devant la machine à café à six heures vingt et te salue du menton. Dans l'escalier, il ne lève pas les yeux vers la photo."
    right:
      label: "J'arrive avec le groupe"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Tu arrives à sept heures avec les joueurs. Vukić note l'heure, et une autre ligne dessous, qu'il cache de la main."

  # 4/6 · La lettre — rue des Lilas. La graine que la saison 3 ouvre.
  - id: en.h1.pro4_lettre
    roles: [entraineur]
    arc: famille
    tags: [famille, decor]
    speaker: camille
    tone: leger
    once: true
    text: "Rue des Lilas, deux pièces au troisième. Camille vide un carton et lève une enveloppe jaunie : « Ta lettre. Tu la changes de poche à chaque veste depuis quinze ans. Je la range où, ici ? »"
    left:
      label: "Dans ma veste"
      effects: {set: [h1_lettre_sur_soi]}
      answer: "Elle te la tend sans la déplier. « Tu l'as jamais lue jusqu'au bout. Moi non plus, rassure-toi. »"
    right:
      label: "Dans le tiroir du bas"
      effects: {relation: {camille: 1}}
      answer: "Elle la glisse sous les quittances. « Quinze ans que je te demande rien sur cette ville. C'est pas ce soir que je vais commencer. »"

  # 5/6 · Ce que la ville garde — dit par le gardien de quarante et un ans. (La carte
  # disait jadis « quatre décident si tu restes » : en mode histoire aucune jauge ne
  # décide, c'est le livre.)
  - id: en.h1.pro5_quatre
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, decor]
    speaker: vecchio
    tone: leger
    once: true
    text: "Vecchio scotche ses doigts au bord du terrain annexe : « Dix-neuf entraîneurs, {toi}. Pas un est parti sur un score. Un mot de travers devant qui il fallait pas, et on te le ressort deux ans après. »"
    left:
      label: "Je m'en souviendrai"
      effects: {}
      answer: "Il tient le scotch entre les dents. En partant, il se retourne une fois, pour revoir ton visage."
    right:
      label: "Je m'en souviendrai"
      effects: {}
      answer: "Il tient le scotch entre les dents. En partant, il se retourne une fois, pour revoir ton visage."

  # 6/6 · Le seuil — l'escalier condamné depuis 1977.
  - id: en.h1.pro6_rendezvous
    roles: [entraineur]
    arc: direction
    tags: [direction, decor]
    speaker: josiane
    tone: strategique
    once: true
    text: "Madame Josiane, la main sur le combiné : « Le président vous attend au premier. Il a écrit un chiffre sur son sous-main. Prenez l'escalier de gauche ; l'autre est condamné depuis 1977. »"
    left:
      label: "Je monte au premier"
      effects: {}
      answer: "L'escalier craque à la neuvième marche, devant la photo. Le temps de monter, tu choisis une phrase ; lui a déjà son chiffre."
    right:
      label: "Je monte au premier"
      effects: {}
      answer: "L'escalier craque à la neuvième marche, devant la photo. Le temps de monter, tu choisis une phrase ; lui a déjà son chiffre."

  # ═══════════════════════════════════════════════ SAISON 1 — LE VISAGE (S0)
  # Créneau 1 · Trois mille visages (scène 3). Les masques se lèvent ; l'ancre
  # ouvre les masques et le maillot, et ferme les nuits génériques qui
  # doubleraient le livre (voir l'en-tête de l'arc).
  - id: en.h1.a1_presentation
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, direction]
    speaker: aulard
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Le match de présentation. Au coup d'envoi, la Nord se lève avec trois mille fois ton visage en carton, noir sur blanc. Dans la loge, Vaubourg, le téléphone à l'oreille : « Qui a payé ça ? Pas moi. »"
    left:
      label: "Je salue le virage"
      effects:
        vestiaire: "-"
        relation: {gege: 1}
        set: [h1_masques_tifo, h1_salut_virage]
        react: en.h1.re.vaubourg_salut
        schedule: [{card: en.h1.masques.biere, in: [1, 1]}, {card: en.h1.maillot.enchere, in: [3, 4]}]
        arc: [{id: en.sb.local_feu, status: abandonne}, {id: en.sb.cercueil, status: abandonne}, {id: en.sb.devant_chez_toi, status: abandonne}, {id: en.sb.appel_nuit, status: abandonne}, {id: en.sb.laverie, status: abandonne}, {id: en.sb.perquisition, status: abandonne}, {id: en.sb.ancien, status: abandonne}, {id: en.evt.voiture, status: abandonne}]
      answer: "Trois mille mains se lèvent avec la tienne. Au premier rang, un enfant porte ton visage par-dessus le sien et ne te quitte pas des yeux."
    right:
      label: "Je regarde le terrain"
      effects:
        direction: "+"
        tribunes: "-"
        set: [h1_masques_tifo]
        schedule: [{card: en.h1.masques.biere, in: [1, 1]}, {card: en.h1.maillot.enchere, in: [3, 4]}]
        arc: [{id: en.sb.local_feu, status: abandonne}, {id: en.sb.cercueil, status: abandonne}, {id: en.sb.devant_chez_toi, status: abandonne}, {id: en.sb.appel_nuit, status: abandonne}, {id: en.sb.laverie, status: abandonne}, {id: en.sb.perquisition, status: abandonne}, {id: en.sb.ancien, status: abandonne}, {id: en.evt.voiture, status: abandonne}]
      answer: "Tu fixes le rond central. Derrière toi, trois mille fois ta figure regarde la même pelouse. Pendant une minute, on n'entend plus que le ballon."

