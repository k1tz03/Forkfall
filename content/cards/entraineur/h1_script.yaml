    arc: ultras
    tags: [ultras, tribunes]
    speaker: gege
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Le match de présentation. Gégé, dos au terrain, lève un bras, et la Nord se lève avec trois mille fois ton visage en carton. Il se retourne vers le banc : « Tu nous dois un salut, {toi}. »"
    left:
      label: "Je salue le virage"
      effects:
        vestiaire: "-"
        relation: {gege: 1}
        set: [h1_masques_tifo, h1_salut_virage]
        react: en.h1.re.vaubourg_salut
        schedule: [{card: en.h1.masques.biere, in: [1, 1]}, {card: en.h1.maillot.enchere, in: [3, 4]}]
        arc: [{id: en.sb.local_feu, status: abandonne}, {id: en.sb.cercueil, status: abandonne}, {id: en.sb.devant_chez_toi, status: abandonne}, {id: en.sb.appel_nuit, status: abandonne}, {id: en.sb.laverie, status: abandonne}, {id: en.sb.perquisition, status: abandonne}, {id: en.sb.ancien, status: abandonne}, {id: en.evt.voiture, status: abandonne}]
      answer: "Trois mille mains se lèvent avec la tienne. Dans la loge, Vaubourg cherche au téléphone qui a payé l'imprimeur."
    right:
      label: "Je regarde le terrain"
      effects:
        direction: "+"
        tribunes: "-"
        relation: {gege: -1}
        set: [h1_masques_tifo]
        schedule: [{card: en.h1.masques.biere, in: [1, 1]}, {card: en.h1.maillot.enchere, in: [3, 4]}]
        arc: [{id: en.sb.local_feu, status: abandonne}, {id: en.sb.cercueil, status: abandonne}, {id: en.sb.devant_chez_toi, status: abandonne}, {id: en.sb.appel_nuit, status: abandonne}, {id: en.sb.laverie, status: abandonne}, {id: en.sb.perquisition, status: abandonne}, {id: en.sb.ancien, status: abandonne}, {id: en.evt.voiture, status: abandonne}]
      answer: "Tu ne te retournes pas. Gégé baisse le bras, lentement. Les trois mille visages restent levés, tous les tiens, tournés vers ton dos."

  - id: en.h1.a1_presentation_argent
    roles: [entraineur]
    arc: ultras
    tags: [ultras, caisse, direction]
    speaker: aulard
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Le match de présentation. La Nord se lève avec trois mille fois ton visage en carton. Vaubourg te tend une facture par-dessus la balustrade : « Cartonnages de la Rive. Qui a commandé ça ? Pas moi. »"
    left:
      label: "Je salue le virage"
      effects:
        caisse: "-"
        relation: {gege: 1}
        set: [h1_masques_tifo, h1_salut_virage]
        react: en.h1.re.vaubourg_salut
        schedule: [{card: en.h1.masques.biere, in: [1, 1]}, {card: en.h1.maillot.enchere, in: [3, 4]}]
        arc: [{id: en.sb.local_feu, status: abandonne}, {id: en.sb.cercueil, status: abandonne}, {id: en.sb.devant_chez_toi, status: abandonne}, {id: en.sb.appel_nuit, status: abandonne}, {id: en.sb.laverie, status: abandonne}, {id: en.sb.perquisition, status: abandonne}, {id: en.sb.ancien, status: abandonne}, {id: en.evt.voiture, status: abandonne}]
      answer: "Vaubourg plie la facture en quatre et la glisse dans ta poche de survêtement : « Alors c'est toi qui paies. »"
    right:
      label: "Je regarde le terrain"
      effects:
        direction: "+"
        tribunes: "-"
        set: [h1_masques_tifo]
        schedule: [{card: en.h1.masques.biere, in: [1, 1]}, {card: en.h1.maillot.enchere, in: [3, 4]}]
        arc: [{id: en.sb.local_feu, status: abandonne}, {id: en.sb.cercueil, status: abandonne}, {id: en.sb.devant_chez_toi, status: abandonne}, {id: en.sb.appel_nuit, status: abandonne}, {id: en.sb.laverie, status: abandonne}, {id: en.sb.perquisition, status: abandonne}, {id: en.sb.ancien, status: abandonne}, {id: en.evt.voiture, status: abandonne}]
      answer: "Tu laisses la facture dans sa main. Il la regarde, puis la Nord, puis toi, et compose un numéro sans te quitter des yeux."

  # Créneaux 10-11 · Le local (scène 7). Le grand retournement de la saison :
  # Gégé sait. En 1971, le capitaine tenait l'autre bout de la bâche.
  - id: en.h1.a2_local
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, moment]
    speaker: gege
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Le local, sous la Nord. Gégé déroule une bâche jaunie : LE PRÉSIDENT VEND, LE VIRAGE RESTE. « Mon père l'a peinte en 1971. Le tien en tenait l'autre bout, ce jour-là. » Il ne lâche pas son bout."
    left:
      label: "Qu'est-ce que tu veux ?"
      effects: {direction: "-", relation: {gege: 1}, set: [h1_local_aveu], schedule: [{card: en.h1.massenet.article, in: [2, 4]}]}
      answer: "« Que tu restes. Le reste, on s'en occupe. » Il roule la bâche comme on plie un drapeau sur une caisse, sans te quitter des yeux."
    right:
      label: "Tu te trompes de visage"
      effects: {direction: "+", relation: {gege: -1}, schedule: [{card: en.h1.massenet.article, in: [2, 4]}]}
      answer: "« Alors on se trompe à trois mille. » Il roule la bâche lentement. À la porte, il te tend quand même une bière, tiède."

  - id: en.h1.a2_local_phrase
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, moment]
    speaker: gege
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Au local, Gégé déroule la bâche de 1971. « Mon père l'a peinte. Le tien tenait l'autre bout, ce jour-là. T'as dit que ceux de 74 paieraient. Lui, il a payé pour eux. »"
    left:
      label: "Qu'est-ce que tu veux ?"
      effects: {direction: "-", relation: {gege: 1}, set: [h1_local_aveu], schedule: [{card: en.h1.massenet.article, in: [2, 4]}]}
      answer: "« Que tu tiennes parole. On t'a entendu{pg, select, f{e} other{}}. » Il roule la bâche serré, sans te quitter des yeux."
    right:
      label: "Tu te trompes de visage"
      effects: {direction: "+", relation: {gege: -1}, schedule: [{card: en.h1.massenet.article, in: [2, 4]}]}
      answer: "« Alors c'était qui, à la buvette, avec ta bouche ? » Il roule la bâche sans se presser et te laisse la porte ouverte."

  # Créneau 12 · Le feu au local (sombre). Qui a pris les masques, qui a mis le
  # feu : la question de la saison 2. Gégé ne ment pas ; il ne dit pas tout.
  - id: en.h1.a3_feu
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, sombre]
    speaker: gege
    lieu: stade
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Minuit, sous la Nord. Le local brûle. Gégé, la bâche de son père sous le bras, compte les cartons sortis à temps : « Il manque quatre cent douze masques. Le radiateur, ils diront. »"
    left:
      label: "Qui a pris les masques ?"
      effects: {direction: "+", set: [h1_incendie]}
      answer: "Il recompte, lentement, jusqu'au bout. Puis il te regarde : « Pas toi. C'est déjà ça. » Les pompiers arrivent sans sirène."
    right:
      label: "On refera le local"
      effects: {caisse: "-", relation: {gege: 1}, set: [h1_incendie]}
      answer: "Il ne quitte pas le feu des yeux. « Le radiateur, tu le choisiras toi-même. Comme ça, si ça recommence, on saura qui. »"

  - id: en.h1.a3_feu_vendus
    roles: [entraineur]
    arc: ultras
    tags: [ultras, sponsors, sombre]
    speaker: gege
    lieu: stade
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Minuit, sous la Nord. Le local brûle. Gégé aligne les cartons sortis : « Quatre cent douze. Il en manque, je crois. Depuis que ta boutique les vend quinze francs, mes chiffres valent plus rien. »"
    left:
      label: "Qui a pris les masques ?"
      effects: {direction: "+", relation: {gege: -1}, set: [h1_incendie]}
      answer: "« N'importe qui avec quinze francs. » Il jette un carton vide dans les flammes. « T'as vendu ta figure. Viens pas te plaindre si elle sort sans toi. »"
    right:
      label: "On refera le local"
      effects: {caisse: "-", relation: {gege: 1}, set: [h1_incendie]}
      answer: "Il dit oui de la tête, sans donner de chiffre pour une fois. La bâche de son père reste sur son bras toute la nuit."

  # Créneau 14 · Intermède. La neuvième marche : la photo déformée dit vrai,
  # le cinquième visage ressemble au tien.
  - id: en.h1.a4_marche
    roles: [entraineur]
    arc: moment
    tags: [intermede, decor]
    tone: leger
    once: true
    when: "stats.clubs < 2"
    text: "Tu montes l'escalier du club-house et il ne finit pas. À la neuvième marche, la photo de 1974 colle aux doigts, la peinture encore fraîche, et le cinquième visage n'est plus gratté. C'est le tien."
    left:
      label: "Je monte encore"
      effects: {}
      answer: "Tu te réveilles dans le noir, une main sur le montant du lit. Dans l'escalier de l'immeuble, quelqu'un descend sans allumer."
    right:
      label: "Je monte encore"
      effects: {}
      answer: "Tu te réveilles dans le noir, une main sur le montant du lit. Dans l'escalier de l'immeuble, quelqu'un descend sans allumer."

  # Créneau 17 · L'homme sous la fenêtre (scène 8, sombre). Le masque immobile.
  - id: en.h1.a5_fenetre
    roles: [entraineur]
    arc: famille
    tags: [famille, tribunes, sombre]
    speaker: camille
    lieu: domicile
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Mardi, minuit, rue des Lilas. En bas, entre deux voitures, un homme en manteau porte ton visage et ne bouge pas. Camille a éteint la lampe. « Il est là depuis onze heures. Toi aussi, à la fenêtre. »"
    left:
      label: "Je descends"
      effects: {relation: {camille: -1}, set: [h1_masque_sous_fenetre], react: en.h1.re.camille_manteau}
      answer: "Quand tu pousses la porte de l'immeuble, il n'y a plus personne. Entre les deux voitures, un masque plié en quatre, encore tiède."
    right:
      label: "J'appelle la police"
      effects: {direction: "+", relation: {gege: -1}, set: [h1_masque_sous_fenetre, h1_police_fenetre]}
      answer: "La patrouille arrive à une heure dix. Plus personne entre les voitures. Le brigadier braque sa lampe sur ta figure et l'y garde longtemps."

