    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Mardi, minuit, rue des Lilas. Tu éteins la lampe toi-même. En bas, entre deux voitures, un homme en manteau porte ton visage. Depuis onze heures, il n'a pas bougé d'un pas."
    left:
      label: "Je descends"
      effects: {set: [h1_masque_sous_fenetre]}
      answer: "Quand tu pousses la porte de l'immeuble, il n'y a plus personne. Entre les deux voitures, un masque plié en quatre, encore tiède."
    right:
      label: "J'appelle la police"
      effects: {direction: "+", relation: {gege: -1}, set: [h1_masque_sous_fenetre, h1_police_fenetre]}
      answer: "La patrouille arrive à une heure dix. Plus personne entre les voitures. Le brigadier braque sa lampe sur ta figure et l'y garde longtemps."

  # ═══════════════════════════════════════════════ SAISON 2 — LES NUITS (S1)
  # Créneau 1 · La berline (scène 10, sombre). Le masque sur le capot. L'ancre
  # ouvre le Quai et l'inspecteur (la vitrine de la banque attend le ticket du
  # maillot, en saison 3 : neuf fils ouverts à la fois débordaient la file du
  # metteur en scène).
  - id: en.h1.b1_berline
    roles: [entraineur]
    arc: direction
    tags: [direction, ultras, sombre]
    speaker: aulard
    lieu: parking
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Une heure du matin, parking du stade. La berline du président brûle ; sur le capot, un masque posé bien droit. Vaubourg, en pyjama sous son manteau : « Dis-moi que ce n'est pas toi. »"
    left:
      label: "Ce n'est pas moi"
      effects: {direction: "+", set: [h1_berline_brulee], schedule: [{card: en.h1.quai.offre, in: [1, 1]}, {card: en.h1.lhoste.bureau, in: [2, 3]}]}
      answer: "« Ils avaient ta tête. » Il ne te croit pas, ou il te croit trop. Le capot se soulève tout seul dans la chaleur, comme une bouche."
    right:
      label: "Demandez-vous pourquoi"
      effects: {direction: "--", tribunes: "+", relation: {aulard: -1}, set: [h1_berline_brulee], schedule: [{card: en.h1.quai.offre, in: [1, 1]}, {card: en.h1.lhoste.bureau, in: [2, 3]}]}
      answer: "Il te regarde comme un homme qui refait ses comptes. Les pompiers arrivent ; il leur montre le masque, pas la voiture."

  - id: en.h1.b1_berline_president
    roles: [entraineur]
    arc: direction
    tags: [direction, ultras, sombre]
    speaker: aulard
    lieu: parking
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Une heure du matin. La berline du président brûle, un masque sur le capot, 1977 griffé dans la portière. Vaubourg, en pyjama : « L'année où je suis devenu président. Pourquoi 1977, à ton avis ? »"
    left:
      label: "Je n'en sais rien"
      effects: {direction: "+", set: [h1_berline_brulee], schedule: [{card: en.h1.quai.offre, in: [1, 1]}, {card: en.h1.lhoste.bureau, in: [2, 3]}]}
      answer: "« Moi non plus. » Il le dit trop vite. Il frotte sa chevalière contre son pouce, encore et encore, jusqu'aux pompiers."
    right:
      label: "Demandez à vos comptes"
      effects: {direction: "--", tribunes: "+", relation: {aulard: -1}, set: [h1_berline_brulee], schedule: [{card: en.h1.quai.offre, in: [1, 1]}, {card: en.h1.lhoste.bureau, in: [2, 3]}]}
      answer: "Il ne répond pas. Il regarde brûler la portière jusqu'à ce que le 1977 disparaisse, comme s'il attendait exactement ça."

  # Créneau 11 · La passerelle (sombre). On ne voit rien : un cri, des pas, ton
  # visage trois fois. La carte d'après est le coup de fil de six heures.
  - id: en.h1.b2_passerelle
    roles: [entraineur]
    arc: tribunes
    tags: [tribunes, ultras, sombre]
    lieu: rue
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Vingt-trois heures, sur le quai. Un cri sous la passerelle, un seul. Puis des pas qui courent vers toi : trois silhouettes passent sous la lampe du quai, ton visage sur les trois."
    left:
      label: "Je les suis"
      effects: {set: [h1_passerelle], react: en.h1.re.vukic_six_heures}
      answer: "Au coin de la friche, le dernier se retourne et lève la main : ton salut du dimanche, exactement. Puis plus rien que les palettes."
    right:
      label: "Je reste dans l'ombre"
      effects: {set: [h1_passerelle], react: en.h1.re.vukic_six_heures}
      answer: "L'un d'eux s'arrête devant toi une seconde, comme devant un miroir, la tête un peu penchée. Puis il repart en courant."

  # Créneau 14 · Intermède (scène 14). Le virage chante avec ta voix ; une
  # seule tête sans masque, au dernier rang, regarde la Rive.
  - id: en.h1.b3_virage
    roles: [entraineur]
    arc: moment
    tags: [intermede, tribunes]
    tone: leger
    once: true
    when: "stats.clubs < 2"
    text: "La Nord est pleine. Trois mille personnes portent ton visage et chantent avec ta voix, même tes reprises de souffle. Au dernier rang, une seule tête sans masque regarde ailleurs, vers la Rive."
    left:
      label: "Je monte les marches"
      effects: {}
      answer: "Plus tu montes, plus le dernier rang recule. La tête sans masque a les cheveux mouillés. Tu te réveilles avant qu'elle se retourne."
    right:
      label: "Je monte les marches"
      effects: {}
      answer: "Plus tu montes, plus le dernier rang recule. La tête sans masque a les cheveux mouillés. Tu te réveilles avant qu'elle se retourne."

  # Créneau 15 · La saisie (scène 15). Six heures du matin, rue des Lilas :
  # Lhoste fait enlever ta voiture, un masque sous scellés dans le coffre. Ce
  # n'est pas un soir. Au coin, le neveu de Gégé, qui ne court pas.
  - id: en.h1.b4_saisie
    roles: [entraineur]
    arc: instances
    tags: [scandale, direction]
    speaker: lhoste
    lieu: domicile
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Six heures, rue des Lilas. Lhoste fait monter ta voiture sur une dépanneuse. Dans le coffre, sous scellés, un masque que tu n'y as pas mis. Au coin, un gamin porte ton visage. Il ne court pas."
    left:
      label: "Ce masque n'est pas à moi"
      effects: {direction: "+", set: [h1_voiture_saisie], var: {saisie_vehicules: "+1"}}
      answer: "Lhoste écrit sur le capot : « {nom}, ne reconnaît pas l'objet. » Au coin, le gamin soulève son masque pour mieux voir."
    right:
      label: "Prenez-la"
      effects: {tribunes: "+", relation: {lhoste: 1}, set: [h1_voiture_saisie], var: {saisie_vehicules: "+1"}}
      answer: "Tu tends les clés avant qu'il les demande. Au coin, le gamin lève la main vers toi : ton salut du dimanche, et il la garde levée."

  - id: en.h1.b4_saisie_quai
    roles: [entraineur]
    arc: instances
    tags: [scandale, direction]
    speaker: lhoste
    lieu: domicile
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Six heures, rue des Lilas. Lhoste fait monter ta voiture sur une dépanneuse. Sous scellés : un masque que tu n'y as pas mis, et l'enveloppe du Quai, que tu y avais mise. Au coin, un gamin te regarde."
    left:
      label: "Ce masque n'est pas à moi"
      effects: {direction: "-", set: [h1_voiture_saisie], var: {saisie_vehicules: "+1"}}
      answer: "« Et l'enveloppe ? » Lhoste attend, le stylo levé. Comme rien ne vient, il écrit une ligne très courte, et la souligne."
    right:
      label: "Prenez-la"
      effects: {direction: "--", set: [h1_voiture_saisie], var: {saisie_vehicules: "+1"}}
      answer: "Tu tends les clés. L'agent qui porte l'enveloppe la tient du bout des doigts, comme une chose mouillée. Au coin, le gamin n'a pas bougé."

  # ═══════════════════════════════════════════ SAISON 3 — LE DERNIER SOIR (S2)
  # Créneau 1 · La lettre (scène 16), lue jusqu'au bout. Le lendemain matin, la
  # photo de l'escalier revient sur ton bureau, le cinquième visage intact.
  - id: en.h1.c1_lettre
    roles: [entraineur]
    arc: famille
    tags: [famille, moment]
    lieu: domicile
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Deux heures du matin. Tu déplies enfin la lettre d'Henri Ravenel jusqu'au bout : « J'ai fait ce qu'il fallait pour ta mère. Le reste, Vaubourg le sait. Ne reviens pas. »"
    left:
      label: "Je la brûle"
      effects: {set: [h1_lettre_lue, h1_lettre_brulee], react: en.h1.re.photo_rendue}
      answer: "Elle brûle mal, le papier est trop vieux. Il reste un coin avec sa signature ; tu le gardes sans savoir pourquoi."
    right:
      label: "Je la garde sur moi"
      effects: {set: [h1_lettre_lue], react: en.h1.re.photo_rendue}
      answer: "Tu la replies sur ses anciens plis. Elle reprend sa place dans ta poche intérieure, plus lourde qu'avant."

  - id: en.h1.c1_lettre_tiroir
    roles: [entraineur]
    arc: famille
    tags: [famille, moment]
    speaker: camille
    lieu: domicile
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Deux heures du matin. Camille pose la lettre dépliée sur la table : « Jusqu'au bout, cette fois. » Tu lis : « J'ai fait ce qu'il fallait pour ta mère. Le reste, Vaubourg le sait. Ne reviens pas. »"
    left:
      label: "Je la brûle"
      effects: {relation: {camille: -1}, set: [h1_lettre_lue, h1_lettre_brulee], react: en.h1.re.photo_rendue}
      answer: "Camille ouvre la fenêtre pour la fumée. Il reste un coin avec la signature ; elle le glisse dans ton portefeuille."
    right:
      label: "Je la garde"
      effects: {relation: {camille: 1}, set: [h1_lettre_lue], react: en.h1.re.photo_rendue}
      answer: "Camille la replie sur ses vieux plis. « On n'écrit pas “ne reviens pas” à quelqu'un qui ne reviendra pas. Il savait. »"

  # Créneau 10 · L'ordre sans visage, ou le cercueil si le virage s'est retourné
  # (sombre). L'ordre donne le rendez-vous de l'acte final, des mois d'avance.
  - id: en.h1.c2_appel
    roles: [entraineur]
    arc: ultras
    tags: [ultras, telephone, sombre]
    lieu: domicile
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Trois heures du matin, le téléphone. Une voix calme, qui ne se presse pas : « Le dernier samedi, on finit. Mets ton masque. » On a raccroché avant ton premier mot."
    left:
      label: "Je raccroche"
      effects: {direction: "+", set: [h1_appel]}
      answer: "Tu reposes le combiné sur une ligne morte. Jusqu'au jour, tu restes près de l'appareil, au cas où il sonnerait pour dire le contraire."
    right:
      label: "Qui êtes-vous ?"
      effects: {tribunes: "+", set: [h1_appel]}
      answer: "Rien. Puis, très loin derrière le silence, quelqu'un fredonne ton nom sur l'air du dimanche, et la ligne se coupe."

  - id: en.h1.c2_cercueil
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, sombre]
    speaker: vukic
    lieu: stade
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "Six heures, devant la grille du stade : un cercueil en contreplaqué, et dessus, peint en blanc, RAVENEL. Vukić : « Il était là à cinq heures. Les jardiniers font le tour pour ne pas passer devant. »"
    left:
      label: "Je l'ouvre"
      effects: {tribunes: "-", set: [h1_cercueil]}
      answer: "Vide, sauf un masque au fond : ton visage, les yeux découpés au cutter. Le soir même, toute la ville sait comment tu t'appelles."
    right:
      label: "Faites-le enlever"
      effects: {direction: "+", set: [h1_cercueil]}
      answer: "Les jardiniers l'emportent sur une brouette. À midi, au Corner, on dit déjà « Ravenel » en te regardant entrer."

  # Créneau 14 · Intermède. Le car de six heures, 1975 ; ton père derrière la
  # vitre du café dit trois mots que la lettre dit aussi.
  - id: en.h1.c3_car
    roles: [entraineur]
    arc: moment
    tags: [intermede, famille]
    tone: leger
    once: true
    when: "stats.clubs < 2"
    text: "Six heures, la gare routière, 1975. Ta mère tient les deux billets. Derrière la vitre du café, ton père, en maillot numéro cinq, parle sans un bruit. Le car démarre. Tu as vingt-trois ans."
    left:
      label: "Je lis sur ses lèvres"
      effects: {}
      answer: "Trois mots, toujours les mêmes, que tu ne comprends qu'en te réveillant : « Ne reviens pas. » Il ne pleure pas. Toi, si."
    right:
      label: "Je lis sur ses lèvres"
      effects: {}
      answer: "Trois mots, toujours les mêmes, que tu ne comprends qu'en te réveillant : « Ne reviens pas. » Il ne pleure pas. Toi, si."

  # Créneau 16 · La veille du dernier match (sombre). Trois portes : le brasero
  # (Gégé sait ce qu'a fait ton père, il t'aime, et le Racing se maintient), le
  # masque neuf, ou sans toi.
  - id: en.h1.c4_brasero
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, sombre]
    speaker: gege
    lieu: friche
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "La friche, la veille du dernier match. Gégé vide les cartons de masques dans le feu de palettes. Il en garde un, le regarde longtemps : « Tu lui ressembles quand tu ne dis rien. » Il te le tend."
    left:
      label: "Je le jette au feu"
      effects: {relation: {gege: 1}, end: promu_brasero}
      answer: "Le carton noircit par les yeux d'abord. Gégé garde la main sur ton épaule tant qu'il brûle, du poids d'une bâche qu'on tient à deux."
    right:
      label: "Je le garde"
      effects: {tribunes: "+", set: [h1_dernier_masque]}
      answer: "Tu le plies dans ta poche intérieure. Gégé tisonne le feu : « Celui-là, je ne le compterai pas. » Le feu prend les autres."

  # La veille, quand le registre du Quai a une page pour toi et que tu as nié :
  # Lhoste revient, comme il l'avait dit. La police passe avant les masques.
  - id: en.h1.c4_lhoste
    roles: [entraineur]
    arc: instances
    tags: [scandale, sombre]
    speaker: lhoste
    lieu: parking
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "La veille du dernier match, Lhoste t'attend sur le parking, le registre du Quai sous le bras : « Le nom de celui qui a écrit votre zéro-deux la veille, {toi}. Ou vous finissez la saison chez nous. »"
    left:
      label: "Le fils Sauvat"
      effects: {relation: {lhoste: 1}, set: [h1_sauvat_donne]}
      answer: "Il note le nom, en capitales. « Son père aussi, en 1974. » Il range le registre. « Allez dormir. Demain, vous avez un match. »"
    right:
      label: "Je n'ai rien à dire"
      effects: {end: co_garde_a_vue}
      answer: "« Comme vous voudrez. » Il ouvre la portière arrière de sa voiture et attend, une main sur le toit, que tu montes."

  - id: en.h1.c4_masque_neuf
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes, sombre]
    speaker: gege
    lieu: friche
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "La friche, la veille du dernier match. Gégé te tend un masque neuf, sans trous pour les yeux : « Demain soir, les Hauts-de-Rive. Les quatre cent douze du local sont prêts. Tu viens avec la nôtre ? »"
    left:
      label: "Je monte avec vous"
      effects: {tribunes: "+", end: promu_visage}
      answer: "Tu prends le masque. Il ne pèse rien. Gégé le pose sur ton visage lui-même, doucement, et tu n'y vois plus."
    right:
      label: "Montez sans moi"
      effects: {direction: "+", relation: {gege: -1}, set: [h1_hauts_sans_toi]}
      answer: "Il range le masque dans sa veste, contre lui. « Alors on montera avec celle de ton père. Elle, elle ne dit jamais non. »"

  - id: en.h1.c4_sans_toi
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, ultras, sombre]
    speaker: vukic
    lieu: vestiaire
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "La veille du dernier match, Vukić referme la porte du vestiaire : « Ils montent aux Hauts-de-Rive demain soir, après le match. Sans toi. Gégé a dit : surtout sans {pg, select, f{elle} other{lui}}. »"
    left:
      label: "Je préviens Lhoste"
      effects: {direction: "+", relation: {gege: -1}, set: [h1_lhoste_prevenu]}
      answer: "Lhoste note l'heure, l'adresse, et ne te remercie pas. « Vous savez ce que vous venez de faire à ce virage ? »"
    right:
      label: "Je laisse faire"
      effects: {tribunes: "+", set: [h1_hauts_sans_toi]}
      answer: "Vukić rouvre la porte et s'efface. Dans le couloir, un gamin du centre essaie ton visage devant le miroir des douches."

  # Créneau 17 · La salle de presse (scène 20), après le dernier match à
  # domicile. Toutes les sorties ferment le livre.
  - id: en.h1.c5_presse
    roles: [entraineur]
    arc: presse
    tags: [presse, moment]
    speaker: meneche
    lieu: stade
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "La salle de presse, après le dernier match à domicile. Massenet est au premier rang, son article de 1974 plié sur les genoux. Le négatif d'Odette est dans ta poche. La salle se tait avant sa question."
    left:
      label: "Je dis tout sur 1974"
      effects: {tribunes: "+", end: promu_plaque}
      answer: "Tu parles une heure. Massenet n'écrit rien ; à la fin, il déplie son article de 1974 et le déchire en deux, lentement."
    right:
      label: "Je parle du match"
      effects: {direction: "+", end: promu_car}
      answer: "Tu parles du match. Massenet range son stylo sans avoir posé sa question. Le lendemain, à six heures, le car part à l'heure."

  - id: en.h1.c5_presse_brasero
    roles: [entraineur]
    arc: presse
    tags: [presse, moment]
    speaker: meneche
    lieu: stade
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "La salle de presse. Les masques sont en cendres à la friche ; le dernier est dans ta poche, plié. Massenet, au premier rang, son article de 1974 sur les genoux : « Alors, {toi}, 1974 ? »"
    left:
      label: "Je dis tout sur 1974"
      effects: {tribunes: "+", end: promu_plaque}
      answer: "Tu poses le masque sur la table. Les flashs partent sur ton visage, puis sur le sien, en carton, puis encore sur le tien."
    right:
      label: "Je parle du match"
      effects: {direction: "+", end: promu_car}
      answer: "Tu parles du deuxième but et de la pelouse. Dans ta poche, le carton se froisse quand tu croises les bras."

  - id: en.h1.c5_presse_hauts
    roles: [entraineur]
    arc: presse
    tags: [presse, moment]
    speaker: meneche
    lieu: stade
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "La salle de presse. Ce soir, les masques montent aux Hauts-de-Rive ; tu le sais, Massenet le devine. Son article de 1974 sur les genoux : « Vous avez quelque chose à dire, avant minuit ? »"
    left:
      label: "Je dis tout sur 1974"
      effects: {tribunes: "+", end: promu_plaque}
      answer: "Tu dis tout, en direct. À minuit, devant la villa, Gégé écoute le transistor d'un gamin, puis renvoie tout le monde chez soi."
    right:
      label: "Je parle du match"
      effects: {direction: "+", end: promu_vengeance}
      answer: "Tu parles du match. À minuit, les fenêtres des Hauts-de-Rive s'allument une à une, et la ville voit monter quatre cents fois ton visage."

  - id: en.h1.c5_presse_lhoste
    roles: [entraineur]
    arc: presse
    tags: [presse, moment]
    speaker: meneche
    lieu: stade
    tone: strategique
    once: true
    when: "stats.clubs < 2"
    text: "La salle de presse. Aux Hauts-de-Rive, Lhoste a posté quatre voitures. Massenet, son article de 1974 plié sur les genoux, attend que tu le regardes pour lever la main."
    left:
      label: "Je dis tout sur 1974"
      effects: {tribunes: "+", end: promu_plaque}
      answer: "Tu dis tout. Cette nuit-là, Lhoste relâche les gamins arrêtés à la grille de la villa ; il garde le dossier de 1974."
    right:
      label: "Je parle du match"
      effects: {direction: "+", end: promu_car}
      answer: "Tu parles du match. Cette nuit-là, Lhoste ramasse onze masques dans l'herbe des Hauts-de-Rive, et ton nom dans chaque bouche."

  # ═══════════════════════════════════════════════ SAISONS 4+ — L'ÉPILOGUE
  # Pour la carrière qui aurait traversé l'acte final sans le jouer : une
  # rentrée, un mois de juin, les cicatrices. Le clou de l'escalier reste vide
  # (docs/histoires : « le clou est resté au mur »).
  - id: en.h1.d1_rentree
    roles: [entraineur]
    arc: direction
    tags: [direction, decor]
    speaker: josiane
    tone: leger
    when: "stats.clubs < 2"
    text: "La rentrée. Dans l'escalier, le clou de 1974 n'a toujours rien à porter. Cet été, Madame Josiane y a noué un ruban noir, sans rien demander : « Je l'enlève, {toi}, ou il reste ? »"
    left:
      label: "Le ruban reste"
      effects: {vestiaire: "+", relation: {josiane: 1}}
      answer: "Le soir, en partant, elle passe devant le clou sans le regarder, comme tous les soirs."
    right:
      label: "Enlevez-le"
      effects: {direction: "+"}
      answer: "Elle le roule autour de deux doigts et le glisse dans son gilet. Les anciens qui montent te voir regardent quand même le clou."

  - id: en.h1.d1_rentree_plaque
    roles: [entraineur]
    arc: direction
    tags: [direction, famille]
    speaker: josiane
    tone: leger
    when: "stats.clubs < 2"
    text: "La rentrée. Josiane pose sur ton bureau la facture du marbrier, acquittée : « Ils viennent voir la plaque le dimanche, {toi}. Certains la touchent. Je mets une ligne au budget, pour les fleurs ? »"
    left:
      label: "Une ligne pour les fleurs"
      effects: {caisse: "-", tribunes: "+"}
      answer: "Elle l'écrit en dernier, à la main, sous les ballons et les maillots : « fleurs, caveau ». Elle ne demande pas lesquelles."
    right:
      label: "Le virage s'en occupe"
      effects: {vestiaire: "+"}
      answer: "Elle range la facture. Le dimanche suivant, il y a du buis frais au caveau, et personne n'a rien demandé à personne."

