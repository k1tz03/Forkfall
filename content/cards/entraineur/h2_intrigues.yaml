      effects: {relation: {achard: 1}, set: [h2_achard_sait]}
      answer: "Il note « wagon » et referme son carnet. « N'y retournez pas cette semaine. On suit toujours ceux qui y vont. »"

  # ══════════════════════════════════════════════════════ UN AN ET UN JOUR
  - id: en.h2.an.toux
    roles: [entraineur]
    arc: famille
    tags: [famille, moment]
    speaker: mercadier
    tone: leger
    once: true
    lieu: friche
    text: "Le wagon sent la fièvre. Roland tousse dans son poing, puis regarde son poing : « Si je vais à l'hôpital, je suis vivant. Si je suis vivant, ils me trouvent. Le Doc, lui, ne parle pas. »"
    left:
      label: "Je fais venir le Doc"
      effects: {vestiaire: "-", relation: {sabatier: 1}, set: [h2_doc_wagon], outcome: doc}
      answer: "Sabatier vient à pied, sa sacoche sous le manteau. Il écoute la poitrine longtemps, et dit seulement : « Pas un deuxième hiver. »"
    right:
      label: "J'apporte des cachets"
      effects: {outcome: cachets}
      answer: "La pharmacienne ne pose pas de question sur une toux qui n'est pas la tienne. Josiane ajoute du sirop dans le cabas, sans un mot."

  - id: en.h2.an.toux_rasoir
    roles: [entraineur]
    arc: famille
    tags: [famille, moment, objet]
    speaker: mercadier
    tone: leger
    once: true
    lieu: friche
    text: "Sur la caisse qui sert de table, le rasoir rapporté du quai, jamais déplié. Roland tousse dans son poing : « Je me rase pour qui ? À l'hôpital, je serais vivant. Ils me trouveraient. »"
    left:
      label: "Je fais venir le Doc"
      effects: {vestiaire: "-", relation: {sabatier: 1}, set: [h2_doc_wagon], outcome: doc}
      answer: "Sabatier vient à pied, écoute la poitrine longtemps, puis rase Roland lui-même, à l'eau froide. « Pas un deuxième hiver. »"
    right:
      label: "J'apporte des cachets"
      effects: {outcome: cachets}
      answer: "Tu reviens avec du sirop et des cachets. Le rasoir n'a pas bougé de la caisse ; il est posé comme une promesse."

  - id: en.h2.an.monique
    roles: [entraineur]
    arc: famille
    tags: [famille]
    speaker: monique
    tone: leger
    once: true
    lieu: domicile
    text: "Monique Mercadier sur ton palier, rue des Lilas, son sac serré contre elle : « Il m'a appelée une fois, de la cabine. Je n'ai rien dit. L'assurance rembourse la maison, vous comprenez ? »"
    left:
      label: "Je comprends"
      effects: {relation: {monique: 1}, set: [h2_monique_aveu]}
      answer: "Elle hoche la tête, soulagée qu'on ne lui demande rien d'autre. Dans l'escalier, elle s'arrête : « Il mange, au moins ? »"
    right:
      label: "Allez le voir"
      effects: {relation: {monique: -1}, set: [h2_monique_aveu, h2_rasoir_neuf]}
      answer: "Elle descend sans répondre. Le lendemain, dans le cabas de Josiane, il y a un rasoir neuf, encore dans sa boîte."

  - id: en.h2.an.chemin
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, scandale]
    speaker: vukic
    tone: strategique
    once: true
    lieu: terrain
    text: "Vukić, en ramassant les plots : « Hier soir, le car du club était garé derrière la friche, moteur coupé. Norbert n'habite pas par là. Tu y vas souvent, à la friche ? »"
    left:
      label: "Plus que je ne devrais"
      effects: {relation: {vukic: 1}, set: [h2_chemin_avoue]}
      answer: "Il pose le dernier plot. « Change de chemin. Passe par le lavoir, le jeudi, quand il fait les courses du club. »"
    right:
      label: "Je n'y vais jamais"
      effects: {relation: {vukic: -1}}
      answer: "« Alors c'est quelqu'un qui marche comme toi. » Il range les plots dans le filet, un par un, en les comptant à voix haute."

  - id: en.h2.an.message
    roles: [entraineur]
    arc: direction
    tags: [repondeur, direction]
    tone: strategique
    once: true
    lieu: bureau
    when: "!flag('h2_feu')"
    text: "La diode, un mardi, pour la première fois. « Ils ont trouvé le chemin. Si le wagon brûle, ne viens pas. Garde le banc ; c'est tout ce que je te demande. » Une quinte de toux. La tonalité."
    left:
      label: "J'irai quand même"
      effects: {direction: "-"}
      answer: "Tu gardes la bande. Ce soir-là, tu dors avec tes chaussures au pied du lit, les lacets défaits, une lampe de poche sous l'oreiller."
    right:
      label: "J'obéis"
      effects: {direction: "+", set: [h2_ordre_obei]}
      answer: "Tu effaces. Pour la première fois, tu fais exactement ce que dit le répondeur, et c'est la nuit la plus longue de la saison."

  # ═════════════════════════════════════════════════════════ LE DÉNOUEMENT
  - id: en.h2.fin.poursuite_seul
    roles: [entraineur]
    arc: direction
    tags: [direction]
    tone: strategique
    once: true
    lieu: friche
    text: "Tu cours vers la veste, et personne ne court derrière toi. La silhouette entre dans la grande halle, s'arrête dans le noir, et se retourne. Elle t'attend."
    left:
      label: "J'entre dans la halle"
      effects: {end: interim_suivant}
      answer: "Le noir sent l'huile et le carton mouillé. Quelqu'un dit « coach », très doucement, juste derrière toi."
    right:
      label: "Je reviens vers le feu"
      effects: {set: [h2_hopital]}
      answer: "Les pompiers emportent Roland sur un brancard, sous son vrai nom : Josiane l'a crié au chef. Il est vivant, officiellement."

  - id: en.h2.fin.poursuite_vukic
    roles: [entraineur]
    arc: direction
    tags: [direction, vestiaire]
    speaker: vukic
    tone: strategique
    once: true
    lieu: friche
    text: "Tu cours vers la veste. Au grillage, un souffle derrière toi : Vukić, qui avait suivi. À deux, vous coincez l'homme contre le grillage. Dans la lueur du feu, une moustache."
    left:
      label: "On le tient"
      effects: {relation: {vukic: 1}, set: [h2_norbert_pris]}
      answer: "Norbert ne se débat pas. Il regarde le wagon brûler par-dessus ton épaule. « Il aimait trop les carnets », dit-il, poliment."
    right:
      label: "Je le laisse filer"
      effects: {relation: {vukic: -1}, set: [h2_norbert_libre]}
      answer: "Tu lâches. Vukić te regarde sans comprendre. La veste disparaît derrière la halle ; quelque part, un car démarre sans phares."

  - id: en.h2.fin.poursuite_josiane
    roles: [entraineur]
    arc: direction
    tags: [direction]
    speaker: josiane
    tone: strategique
    once: true
    lieu: friche
    text: "Tu cours. Derrière toi, Josiane crie « Norbert ! » ; la veste se retourne une seconde dans la lueur du feu. C'est bien lui. Puis il court vers la halle, et la nuit le prend."
    left:
      label: "Je reviens vers Roland"
      effects: {relation: {josiane: 1}, set: [h2_hopital]}
      answer: "Josiane a déjà crié son nom au chef des pompiers. Roland part sur un brancard, sous son nom. Vivant, officiellement."
    right:
      label: "Je relève sa plaque"
      effects: {set: [h2_norbert_libre]}
      answer: "Derrière la halle, le car du club démarre sans phares. Tu as le numéro, pas le visage ; Josiane, elle, a les deux."

  - id: en.h2.fin.pompiers
    roles: [entraineur]
    arc: direction
    tags: [direction, scandale]
    tone: strategique
    once: true
    lieu: friche
    text: "Tu perds la veste dans la halle. Quand tu reviens, les pompiers sont là, et un gendarme qui renifle tes manches : « Essence. Et ces billets, dans votre boîte à gants, ils viennent d'où ? »"
    left:
      label: "Je suis le gendarme"
      effects: {end: co_garde_a_vue}
      answer: "On te fait asseoir à l'arrière d'une voiture bleue. Par la vitre, tu vois Josiane qui parle au chef des pompiers, en montrant le wagon."
    right:
      label: "Je suis le gendarme"
      effects: {end: co_garde_a_vue}
      answer: "On te fait asseoir à l'arrière d'une voiture bleue. Par la vitre, tu vois Josiane qui parle au chef des pompiers, en montrant le wagon."

  - id: en.h2.fin.banquette
    roles: [entraineur]
    arc: famille
    tags: [famille]
    speaker: josiane
    tone: strategique
    once: true
    lieu: rue
    text: "Roland sur ta banquette arrière, la tête sur les genoux de Josiane. Il tousse du noir. Josiane : « L'hôpital, et il est vivant pour tout le monde. Le Doc, et il reste mort. Vous choisissez. »"
    left:
      label: "L'hôpital"
      effects: {relation: {josiane: 1}, set: [h2_hopital]}
      answer: "À l'accueil, Josiane épelle MERCADIER lettre par lettre. L'infirmière lève la tête à la troisième lettre, et décroche son téléphone."
    right:
      label: "Chez le Doc"
      effects: {relation: {sabatier: 1}, set: [h2_doc]}
      answer: "Sabatier ouvre en pyjama, ne pose aucune question, et pousse sa table de massage contre le radiateur. « Personne ne vient ici la nuit. »"

  - id: en.h2.fin.lendemain_pris_carnet
    roles: [entraineur]
    arc: presse
    tags: [presse, scandale]
    speaker: lea
    tone: strategique
    once: true
    lieu: echo
    text: "Léa, au matin, la voix cassée par la fumée : « Norbert est en garde à vue. Il ne dit rien. Sans pièce, ils le relâchent jeudi. Vous l'avez, le carnet, non ? »"
    left:
      label: "Je le leur donne"
      effects: {parole: 1, relation: {lea: 1}, set: [h2_carnet_police]}
      answer: "Le carnet passe de main en main au commissariat, sous plastique. Jeudi, Norbert n'est pas relâché. Vendredi non plus."
    right:
      label: "Je le garde pour mardi"
      effects: {parole: -1}
      answer: "« Mardi, c'est l'audience. Vous jouez gros. » Jeudi, Norbert ressort du commissariat et prend le car de midi, côté chauffeur."

  - id: en.h2.fin.lendemain_pris
    roles: [entraineur]
    arc: presse
    tags: [presse, scandale]
    speaker: lea
    tone: strategique
    once: true
    lieu: echo
    text: "Léa, au matin : « Norbert est en garde à vue. Il dit qu'il passait par là, qu'il a vu le feu, qu'il a eu peur. Sans pièce, ils le relâchent jeudi. Vous témoignez ? »"
    left:
      label: "Je témoigne"
      effects: {parole: 1, relation: {lea: 1}}
      answer: "Tu signes une déposition de deux pages. Jeudi, on le relâche quand même ; il te salue de la main depuis le car, poliment."
    right:
      label: "Je n'ai rien vu"
      effects: {parole: -1}
      answer: "Jeudi, on le relâche. Samedi, il conduit le car au déplacement, et règle son rétroviseur pour te voir, toi."

  - id: en.h2.fin.lendemain_hopital
    roles: [entraineur]
    arc: direction
    tags: [direction, caisse]
    speaker: achard
    tone: leger
    once: true
    lieu: rue
    text: "Couloir de l'hôpital, une gerbe de la Prévoyance sous le bras de Monsieur Achard : « Vivant, et sous son nom. Mes deux millions vous remercient. Le président, lui, n'est pas venu. »"
    left:
      label: "Remerciez Josiane"
      effects: {relation: {achard: 1, josiane: 1}}
      answer: "« C'est fait. Je lui ai offert un cabas neuf ; elle l'a refusé. » Il pose la gerbe sur une chaise et repart sans elle."
    right:
      label: "Il n'est pas sauvé"
      effects: {relation: {achard: -1}}
      answer: "« Non. Il est vivant ; ce n'est pas pareil. » Achard regarde la porte de la chambre 4, et l'agent en civil assis devant."

  - id: en.h2.fin.lendemain
    roles: [entraineur]
    arc: direction
    tags: [direction]
    speaker: josiane
    tone: strategique
    once: true
    lieu: secretariat
    text: "Madame Josiane, au secrétariat, les yeux rouges de fumée : « Il dort chez le Doc. Le président a appelé trois fois pour savoir si l'audience est toujours mardi. Je lui dis quoi ? »"
    left:
      label: "Que oui, mardi"
      effects: {direction: "+"}
      answer: "Elle le dit au téléphone avec une voix que tu ne lui connaissais pas, une voix de pierre. Le président raccroche, satisfait."
    right:
      label: "Qu'il est vivant"
      effects: {direction: "-", relation: {josiane: 1}, set: [h2_dit_vivant_au_president]}
      answer: "Elle le dit, mot pour mot. Un long silence au bout du fil, puis : « Vivant où ? » Elle raccroche sans répondre."

  # ═══════════════════════════════════════════════ variantes de relecture
  # Monique, sur le palier : elle avait été crue, pour le sapin (h2_monique_crue).
  - id: en.h2.an.monique_crue
    roles: [entraineur]
    arc: famille
    tags: [famille]
    speaker: monique
    tone: leger
    once: true
    lieu: domicile
    text: "Monique Mercadier sur ton palier, rue des Lilas : « Vous m'aviez crue, pour le sapin. Je vous dois la suite. Il m'a appelée une fois, de la cabine. Je n'ai rien dit. Pour la maison. »"
    left:
      label: "Je comprends"
      effects: {relation: {monique: 1}, set: [h2_monique_aveu]}
      answer: "« Vous êtes le seul à qui je le dis. Josiane le sait sans que je le dise. » Elle descend une marche, puis remonte : « Il tousse ? »"
    right:
      label: "Allez le voir"
      effects: {relation: {monique: -1}, set: [h2_monique_aveu, h2_rasoir_neuf]}
      answer: "« Il ne veut pas. Il dit que je perdrais la maison. » Le lendemain, un rasoir neuf dans sa boîte attend au fond du cabas de Josiane."

  # La banquette : le Doc est déjà venu au wagon (h2_doc_wagon).
  - id: en.h2.fin.banquette_doc
