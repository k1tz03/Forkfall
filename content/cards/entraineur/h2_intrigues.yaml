    lieu: rue
    text: "Roland sur ta banquette arrière, la tête sur les genoux de Josiane, il tousse du noir. Josiane : « Le Doc connaissait le chemin du wagon. Chez lui, il reste mort. L'hôpital, il est vivant. »"
