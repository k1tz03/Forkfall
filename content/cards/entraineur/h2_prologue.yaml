# HISTOIRE 2 — LE SAPIN EN CARTON · le prologue (arc `en.h2.prologue`,
# content/arcs/entraineur/h2_script.yaml). Six scènes hors créneau, avant la
# carte Objectif : la place peinte et sa berline, le tiroir du milieu, la compo
# de l'autre, la phrase que le groupe attend, le communiqué, l'escalier.
#
# Les graines plantées ici, et ce qui les paie :
#   · l'imperméable sur le siège passager (il est parti sans, sous la pluie) et
#     la place choisie au parking (h2_gare_a_cote / h2_gare_loin) → les trois
#     mètres, puis la place vide vue de « ton » réverbère ;
#   · le répondeur que Josiane n'a pas débranché → la diode du premier lundi ;
#   · le sifflet pris dans le tiroir (h2_sifflet_pris) → le banc dans la brume ;
#   · « il reviendra peut-être » (h2_dit_reviendra) → samedi, Bréhaut s'en souvient ;
#   · 23 h 10, au dos du communiqué → l'heure où Lulu l'a vu traverser le
#     parking vers le car, pas vers sa voiture.
# Effets faibles (un cran moyen au plus), sans rand, react, schedule ni next.
cards:
  - id: en.h2.pro.place
    roles: [entraineur]
    arc: moment
    tags: [decor, direction]
    tone: leger
    once: true
    lieu: parking
    text: "Il pleut sur la tôle du parking. Sur la place peinte ENTRAÎNEUR, une berline grise, un sapin en carton au rétroviseur, et sous l'essuie-glace un ticket de stationnement de la semaine dernière."
    left:
      label: "Je me gare à côté"
      effects: {set: [h2_gare_a_cote]}
      answer: "Ta portière s'ouvre à dix centimètres de la sienne. Sur son siège passager, un imperméable plié. Il pleut depuis lundi."
    right:
      label: "Je me gare au fond"
      effects: {set: [h2_gare_loin]}
      answer: "Tu te gares au fond, sous le réverbère. De là, tu as la berline, la place peinte et le car du club dans le même pare-brise."

  - id: en.h2.pro.sifflet
    roles: [entraineur]
    arc: direction
    tags: [direction, vestiaire, objet]
    speaker: josiane
    tone: leger
    once: true
    lieu: bureau
    text: "Madame Josiane ouvre le tiroir du milieu : un sifflet, sa licence. « Il n'est pas venu les chercher. Son répondeur, je ne l'ai pas débranché non plus. Vous prenez le sifflet, {toi} ? »"
    left:
      label: "Je prends le sien"
      effects: {direction: "+", vestiaire: "-", set: [h2_sifflet_pris]}
      answer: "Le sifflet est froid, la lanière raide. Elle referme le tiroir sur la licence et tourne la petite clé."
    right:
      label: "J'ai le mien"
      effects: {vestiaire: "+", direction: "-", relation: {josiane: 1}}
      answer: "Elle referme le tiroir et range la petite clé sur son trousseau, entre celle du secrétariat et celle de chez elle."

  - id: en.h2.pro.compo
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: vukic
    tone: strategique
    once: true
    lieu: vestiaire
    text: "Vukić, le cahier fermé sur les genoux, devant la compo punaisée au mur : « Vendredi, vingt-deux heures, il l'a écrite. Lundi, plus personne. Son écriture, mes punaises. Je la décroche ? »"
    left:
      label: "Décroche-la"
      effects: {direction: "+", vestiaire: "-", set: [h2_compo_cahier]}
      answer: "Il la plie en quatre et la glisse dans le cahier, entre deux pages blanches, avec les punaises."
    right:
      label: "Laisse-la jusqu'à dimanche"
      effects: {vestiaire: "+", direction: "-", relation: {vukic: 1}}
      answer: "Elle reste. À sept heures, les gars la lisent en se changeant, et personne ne demande pourquoi elle est encore là."

  - id: en.h2.pro.phrase
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, direction, risk:vestiaire]
    speaker: brehaut
    tone: strategique
    once: true
    lieu: vestiaire
    text: "Bréhaut tient la porte du vestiaire avec le pied, vingt-deux gars en chaussettes derrière : « Ils savent, pour les six semaines. Lui, il a dit au revoir à personne. Vous leur dites quoi, {toi} ? »"
    left:
      label: "Six semaines, c'est vrai"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Tu le dis. Au fond, quelqu'un tousse. Bréhaut lâche la porte, qui se referme sur le bruit des crampons."
    right:
      label: "Qu'il reviendra peut-être"
      effects: {vestiaire: "++", direction: "-", set: [h2_dit_reviendra]}
      answer: "Bréhaut te regarde longtemps. « Alors vous savez quelque chose. » Il referme la porte avant ta réponse."

  - id: en.h2.pro.communique
    roles: [entraineur]
    arc: presse
    tags: [presse, direction, decor]
    speaker: meneche
    tone: strategique
    once: true
    lieu: stade
    text: "Massenet replie le communiqué du club, une seule ligne, « remercié ». « Moi, le résultat, j'y crois pas. Quelqu'un l'a lâché, et je me demande bien qui. »"
    left:
      label: "Le président, sûrement"
      effects: {direction: "-", relation: {meneche: 1}, set: [h2_accuse_president]}
      answer: "Il note « le président » et souligne. Au dos du communiqué, au crayon, une heure : 23 h 10. Il ne dit pas de quel soir."
    right:
      label: "Je n'en sais rien"
      effects: {direction: "+"}
      answer: "Il range le communiqué. Au dos, au crayon, tu as le temps de lire une heure : 23 h 10. Il ne dit pas de quel soir."

  - id: en.h2.pro.escalier
    roles: [entraineur]
    arc: direction
    tags: [direction, decor]
    speaker: vecchio
    tone: leger
    once: true
    lieu: bureau
    text: "Gigi Vecchio, les gants sous le bras, devant l'ascenseur en panne : « Cinq entraîneurs en huit ans. Les quatre autres, je les ai vus descendre cet escalier. Lui, personne. Le président t'attend. »"
    left:
      label: "Je monte au premier"
      effects: {}
      answer: "Tu prends l'escalier. En bas, Gigi reste planté devant l'ascenseur en panne, les yeux sur les portes."
    right:
      label: "Je monte au premier"
      effects: {}
      answer: "Tu prends l'escalier. En bas, Gigi reste planté devant l'ascenseur en panne, les yeux sur les portes."
