    roles: [entraineur]
    arc: direction
    tags: [direction, objet]
    speaker: josiane
    tone: leger
    once: true
    lieu: bureau
    text: "Une carte postale de la côte, sans signature, punaisée au-dessus du répondeur. Madame Josiane : « Arrivée lundi, au courrier de sept heures. Je la laisse au mur, {toi} ? »"
    left:
      label: "Laissez-la"
      effects: {vestiaire: "+"}
      answer: "Elle la laisse. Au dos, d'une écriture penchée, une compo en 4-4-2, et un nom souligné deux fois : le tien."
    right:
      label: "Rangez-la"
      effects: {direction: "+"}
      answer: "Elle la range dans le tiroir du milieu, avec les deux plaques. Au dos, une compo, et ton nom souligné deux fois."

