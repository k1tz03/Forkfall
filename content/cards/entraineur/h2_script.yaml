  # ═════════════════════════════════════════════ S3 · l'épilogue (une fois)
  - id: en.h2.s3.rentree
    roles: [entraineur]
    arc: direction
    tags: [direction, objet]
    speaker: josiane
    tone: leger
    once: true
    lieu: bureau
    text: "Madame Josiane ouvre le tiroir du milieu : deux plaques, la tienne et la sienne, l'une sur l'autre. « Je les garde ensemble. Je ne sais pas laquelle visser, cette année. Vous, {toi} ? »"
    left:
      label: "La mienne"
      effects: {direction: "+"}
      answer: "Elle visse la tienne. L'autre retourne dans le tiroir, face contre le bois, avec le sifflet et sa lanière."
    right:
      label: "Aucune"
      effects: {vestiaire: "+", direction: "-"}
      answer: "La porte reste nue toute la saison. Les nouveaux frappent quand même, deux coups, sans savoir pourquoi deux."

