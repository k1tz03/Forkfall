# HISTOIRE 2 — LE SAPIN EN CARTON · les ancres du script (arc `en.h2.script`,
# content/arcs/entraineur/h2_script.yaml). Servies à leur créneau, quoi qu'il
# arrive ; leurs variantes lisent ce que la carrière a déjà posé.
#
# La ligne d'ordre de ce livre est le répondeur à microcassette du bureau
# (tag `repondeur`, aucune voix nommée, aucun locuteur) : une phrase courte,
# un nom, une heure, et derrière, toujours le même bruit. Les nuits (la place
# vide, la panne, la Rive, le wagon) portent le tag `sombre` et leur `lieu:` ;
# les trois intermèdes, un par saison, portent `intermede`.
cards:
  # ═════════════════════════════════════════════ S0 · 1 · Les cartons
  - id: en.h2.s0.cartons
    roles: [entraineur]
    arc: direction
    tags: [direction, vestiaire, objet]
    speaker: josiane
    tone: leger
    once: true
    lieu: bureau
    text: "Madame Josiane hésite entre le tournevis et le scotch, devant la plaque à son nom : « Il n'a rien demandé, rien emporté. Je jette ses cartons, {toi}, ou je les garde ? »"
    left:
      label: "Jetez, c'est mon bureau"
      effects: {direction: "+", vestiaire: "-", relation: {josiane: -1}, set: [h2_cartons_jetes], schedule: [{card: en.h2.rep.diode, in: [1, 1]}, {card: en.h2.berl.dix_heures, in: [4, 5]}]}
      answer: "Elle dévisse la plaque. Elle descend les cartons elle-même, un par un, et laisse la cafetière branchée sur le bureau."
    right:
      label: "Gardez-les six semaines"
      effects: {vestiaire: "+", direction: "-", relation: {josiane: 1}, set: [h2_cartons_gardes], schedule: [{card: en.h2.rep.diode, in: [1, 1]}, {card: en.h2.berl.dix_heures, in: [4, 5]}]}
      answer: "Elle scotche les cartons sans les fermer tout à fait. Le soir, elle en rouvre un, prend quelque chose, et le referme."

  - id: en.h2.s0.cartons_vestiaire
    roles: [entraineur]
    arc: direction
    tags: [direction, vestiaire, objet]
    speaker: josiane
    tone: leger
    once: true
    lieu: bureau
    text: "Madame Josiane, tournevis en main, devant la plaque à son nom : « Deux joueurs m'ont demandé son adresse, ce matin. Je n'ai pas su quoi répondre. Je jette ses cartons, {toi} ? »"
    left:
      label: "Jetez, c'est mon bureau"
      effects: {direction: "+", vestiaire: "--", relation: {josiane: -1}, set: [h2_cartons_jetes], schedule: [{card: en.h2.rep.diode, in: [1, 1]}, {card: en.h2.berl.dix_heures, in: [4, 5]}]}
      answer: "Elle dévisse la plaque. Les deux joueurs passent devant les cartons en tournant la tête vers le mur."
    right:
      label: "Gardez-les six semaines"
      effects: {vestiaire: "+", direction: "-", relation: {josiane: 1}, set: [h2_cartons_gardes], schedule: [{card: en.h2.rep.diode, in: [1, 1]}, {card: en.h2.berl.dix_heures, in: [4, 5]}]}
      answer: "Elle scotche les cartons. Le soir, elle en rouvre un, en sort un pull bordeaux, et le referme sans bruit."

  - id: en.h2.s0.cartons_diplome
    roles: [entraineur]
    arc: direction
    tags: [direction, objet]
    speaker: josiane
    tone: leger
    once: true
    lieu: bureau
    text: "Madame Josiane, la main sur le combiné : « La Fédération, pour votre papier. C'est le troisième appel. Et le bureau est toujours à son nom. Je jette ses cartons, {toi}, ou je les garde ? »"
    left:
      label: "Jetez, c'est mon bureau"
      effects: {direction: "+", vestiaire: "-", relation: {josiane: -1}, set: [h2_cartons_jetes], schedule: [{card: en.h2.rep.diode, in: [1, 1]}, {card: en.h2.berl.dix_heures, in: [4, 5]}]}
      answer: "Elle dévisse la plaque, puis rappelle la Fédération pour dire que tu es en réunion. La cafetière, elle la garde."
    right:
      label: "Gardez-les six semaines"
      effects: {vestiaire: "+", direction: "-", relation: {josiane: 1}, set: [h2_cartons_gardes], schedule: [{card: en.h2.rep.diode, in: [1, 1]}, {card: en.h2.berl.dix_heures, in: [4, 5]}]}
      answer: "Elle scotche les cartons et pose dessus le message de la Fédération, à plat, sous le rouleau de scotch."

  - id: en.h2.s0.cartons_grand_nom
    roles: [entraineur]
    arc: direction
    tags: [direction, mercato, objet]
    speaker: josiane
    tone: leger
    once: true
    lieu: bureau
    text: "Madame Josiane, un message rose à la main : « Un agent a appelé. Il a un grand nom pour janvier, et il demande si le bureau est libre. Je jette ses cartons, {toi} ? »"
    left:
      label: "Jetez, c'est mon bureau"
      effects: {direction: "+", vestiaire: "-", relation: {josiane: -1}, set: [h2_cartons_jetes], schedule: [{card: en.h2.rep.diode, in: [1, 1]}, {card: en.h2.berl.dix_heures, in: [4, 5]}]}
      answer: "Elle dévisse la plaque. Le message rose reste au milieu du bureau, bien à plat, sous la cafetière."
    right:
      label: "Gardez-les six semaines"
      effects: {vestiaire: "+", direction: "-", relation: {josiane: 1}, set: [h2_cartons_gardes], schedule: [{card: en.h2.rep.diode, in: [1, 1]}, {card: en.h2.berl.dix_heures, in: [4, 5]}]}
      answer: "Elle scotche les cartons et jette le message rose sans t'en parler. Tu le retrouves le soir, dans la corbeille."

  # ═════════════════════════════════════════════ S0 · 10 · Le verdict, et le quai
  # L'appartement du quai est un cadeau du club (la ville le loge à la place de
  # la rue des Lilas) ; il est repris la nuit de la Rive (S1 · 17).
  - id: en.h2.s0.verdict
    roles: [entraineur]
    arc: direction
    tags: [direction]
    speaker: aulard
    tone: strategique
    once: true
    lieu: bureau
    text: "Vaubourg, le combiné contre l'épaule : « Six semaines, ni bon ni mauvais. Un mois de plus, sans prime. Et tu prends l'appartement du quai, {toi}. Il y dormait, c'est payé jusqu'en juin. »"
    left:
      label: "Je prends"
      effects: {direction: "+", vestiaire: "-", set: [interim_prolonge, h2_quai], var: {cadeau_appartement_quai: "+1"}}
      answer: "Il te lance un trousseau par-dessus le bureau. Une des clés porte une étiquette à l'encre : « R. M. Ne pas perdre »."
    right:
      label: "Je veux un papier"
      effects: {direction: "-", parole: 1, set: [interim_prolonge, h2_quai], var: {cadeau_appartement_quai: "+1"}}
      answer: "Il écrit trois lignes sur un papier à en-tête, sans les dater, et pose le trousseau du quai dessus. « Voilà ton papier. »"

  - id: en.h2.s0.verdict_confirme
    roles: [entraineur]
    arc: direction
    tags: [direction]
    speaker: aulard
    tone: strategique
    once: true
    lieu: bureau
    text: "Vaubourg tapote un contrat d'une page : « Deux victoires : je te confirme jusqu'en juin. Le titre, je ne peux pas, il est encore à lui sur le papier. Et le quai est à toi, {toi}. »"
    left:
      label: "Je signe"
      effects: {direction: "++", set: [cdi_signe, h2_quai], var: {cadeau_appartement_quai: "+1"}}
      answer: "Tu signes. Il pousse vers toi le trousseau du quai ; une clé porte une étiquette à l'encre : « R. M., ne pas perdre »."
    right:
      label: "Je lis d'abord"
      effects: {direction: "-", vestiaire: "+", set: [interim_prolonge, h2_quai], var: {cadeau_appartement_quai: "+1"}}
      answer: "Il reprend le contrat et le range dans son sous-main. Le trousseau du quai, il te le laisse : c'est toujours ça qu'il ne paiera pas à l'hôtel."

  - id: en.h2.s0.verdict_regle
    roles: [entraineur]
    arc: direction
    tags: [direction]
    speaker: aulard
    tone: strategique
    once: true
    lieu: bureau
    text: "Vaubourg signe un autre papier en te parlant : « J'en voulais un vrai. Tant qu'il n'a pas démissionné, je ne peux pas en payer deux. Tu restes, {toi}, jusqu'à ce que ce soit réglé. »"
    left:
      label: "Réglé comment ?"
      effects: {direction: "-", parole: 1, set: [interim_prolonge, h2_quai, h2_regle], var: {cadeau_appartement_quai: "+1"}}
      answer: "Il ne répond pas. Il pousse vers toi les clés du quai, et un formulaire de la Prévoyance qu'il retourne aussitôt, face contre le bois."
    right:
      label: "Je reste"
      effects: {direction: "+", vestiaire: "-", set: [interim_prolonge, h2_quai], var: {cadeau_appartement_quai: "+1"}}
      answer: "Il te lance les clés du quai. « Il y dormait la semaine. C'est calme ; la nuit, on entend la Rive. »"

  # ═════════════════════════════════════════════ S0 · 11 · Ne me cherche pas
  - id: en.h2.s0.message
    roles: [entraineur]
    arc: direction
    tags: [repondeur, vestiaire]
    tone: strategique
    once: true
    lieu: bureau
    text: "Lundi, sept heures, la diode. « Ne me cherche pas. Garde le banc. Et ne monte jamais seul dans le car avec lui. » Derrière, des pièces qui tombent dans une cabine, puis la tonalité."
    left:
      label: "Je garde la cassette"
      effects: {direction: "-", set: [h2_cassette], react: en.h2.re.josiane_cassettes}
      answer: "Tu sors la microcassette et en glisses une neuve. L'ancienne voyage désormais dans ta poche intérieure, avec tes clés."
    right:
      label: "J'efface le message"
      effects: {vestiaire: "+", set: [h2_efface_janvier]}
      answer: "La bande rembobine en couinant. Le soir, au quai, tu te surprends à répéter la phrase tout seul : « avec lui »."

  - id: en.h2.s0.message_efface
    roles: [entraineur]
    arc: direction
    tags: [repondeur, vestiaire]
    tone: strategique
    once: true
    lieu: bureau
    text: "Lundi, la diode, encore. « Cette fois, écoute jusqu'au bout. Me cherche pas. Garde le banc. Et monte jamais seul dans le car avec lui. » Des pièces qui tombent, puis la tonalité."
    left:
      label: "Je garde la cassette"
      effects: {direction: "-", set: [h2_cassette], react: en.h2.re.josiane_cassettes}
      answer: "Cette fois, tu sors la microcassette avant qu'elle ne rembobine. Elle passe la nuit sous ton oreiller, au quai."
    right:
      label: "J'efface le message"
      effects: {vestiaire: "+", set: [h2_efface_janvier]}
      answer: "Tu effaces, comme la première fois. La diode s'éteint, mais toute la semaine, dans le car, tu entends encore « avec lui »."

  # ═════════════════════════════════════════════ S0 · 12 · La place vide
  - id: en.h2.s0.place_vide
    roles: [entraineur]
    arc: direction
    tags: [direction, sombre]
    tone: strategique
    once: true
    lieu: parking
    text: "Minuit, parking du stade, sous la pluie. La place ENTRAÎNEUR est vide : un rectangle d'asphalte encore sec, une flaque d'huile, et au-dessus, le seul réverbère éteint du parking."
    left:
      label: "Je porte plainte"
      effects: {direction: "-", parole: 1, set: [h2_place_vide, h2_plainte], react: en.h2.re.lea_fusible, schedule: [{card: en.h2.nor.cafe, in: [2, 3]}]}
      answer: "Au commissariat, on tape « véhicule disparu, propriétaire disparu », puis on s'arrête de taper. Le planton demande si c'est une blague."
    right:
      label: "Je fais repeindre la place"
      effects: {direction: "+", tribunes: "-", set: [h2_place_vide, h2_place_repeinte], react: en.h2.re.lea_fusible, schedule: [{card: en.h2.nor.cafe, in: [2, 3]}]}
      answer: "Le lendemain, un peintre efface ENTRAÎNEUR au rouleau. Il demande quoi écrire à la place ; personne ne sait lui répondre."

  - id: en.h2.s0.place_vide_guet
    roles: [entraineur]
    arc: direction
    tags: [direction, sombre]
    tone: strategique
    once: true
    lieu: parking
    text: "Minuit. De ta place au fond du parking, tu vois la place ENTRAÎNEUR vide, un rectangle sec sous la pluie et une flaque d'huile. Au-dessus de toi, ton réverbère est éteint."
    left:
      label: "Je porte plainte"
      effects: {direction: "-", parole: 1, set: [h2_place_vide, h2_plainte], react: en.h2.re.lea_fusible, schedule: [{card: en.h2.nor.cafe, in: [2, 3]}]}
      answer: "Au commissariat, on tape « véhicule disparu, propriétaire disparu », puis on s'arrête de taper. Le planton demande si c'est une blague."
    right:
      label: "Je fais repeindre la place"
      effects: {direction: "+", tribunes: "-", set: [h2_place_vide, h2_place_repeinte], react: en.h2.re.lea_fusible, schedule: [{card: en.h2.nor.cafe, in: [2, 3]}]}
      answer: "Un peintre efface ENTRAÎNEUR au rouleau. Toi, tu gardes ta place au fond, sous le réverbère, qu'on rallume le lendemain."

  # ═════════════════════════════════════════════ S0 · 15 · Intermède : la bande
  - id: en.h2.s0.intermede
    roles: [entraineur]
    arc: moment
    tags: [intermede]
    tone: leger
    once: true
    lieu: bureau
    text: "Tu dors au bureau, la tête sur le cahier. La diode clignote. La voix dit « {prenom} », puis « ne mets pas… », et le nom se noie. Derrière, pas un car qui manœuvre, mais de l'eau, beaucoup d'eau."
    left:
      label: "Je rembobine"
      effects: {}
      answer: "La bande tourne dans le vide. Au réveil, la diode est éteinte, et la cafetière de l'autre est chaude."
    right:
      label: "Je rembobine"
      effects: {}
      answer: "La bande tourne dans le vide. Au réveil, la diode est éteinte, et la cafetière de l'autre est chaude."

  # ═════════════════════════════════════════════ S0 · 17 · La porte, et la police
  - id: en.h2.s0.porte
    roles: [entraineur]
    arc: direction
    tags: [direction, tribunes]
    speaker: aulard
    tone: strategique
    once: true
    lieu: bureau
    text: "Vaubourg relit une police d'assurance, l'index sur la ligne « homme-clé », et la range. « Si on tient, t'as trois pages en juin, {toi}. Si on tombe, la porte. Tu me promets quoi ? »"
    left:
      label: "Le maintien, propre"
      effects: {direction: "+", vestiaire: "+", force: -1, set: [h2_police_vue]}
      answer: "Tu parles de bloc bas. Il range la police dans le tiroir de gauche, celui qui ferme à clé, et laisse la clé dessus."
    right:
      label: "La montée, en réponse"
      effects: {tribunes: "++", direction: "-", force: 2, parole: 1, promise: true, set: [montee_promise, h2_police_vue]}
      answer: "Le mot sort du bureau avant toi. Le soir même, au Terminus, Norbert le répète à la table du fond, mot pour mot."

  - id: en.h2.s0.porte_diplome
    roles: [entraineur]
    arc: instances
    tags: [direction]
    speaker: aulard
    tone: strategique
    once: true
    lieu: bureau
    text: "Vaubourg, le stylo en travers d'une police d'assurance : « Sans papier, t'as rien, {toi}, et ta dérogation finit en juin. L'examen cet été, ou quelqu'un qui signe à ta place ? »"
    left:
      label: "Je passe l'examen"
      effects: {parole: 1, direction: "+", set: [examen_promis, h2_police_vue]}
      answer: "Il note « juillet » au dos de la police, sous la ligne « homme-clé ». Il ne voit pas où il écrit ; toi, si."
    right:
      label: "Quelqu'un signera"
      effects: {direction: "++", parole: -1, relation: {aulard: 1}, set: [diplome_arrange, h2_police_vue]}
      answer: "Il décroche son téléphone et compose un numéro de tête. Il range la police dans le même tiroir que ton dossier."

  # ═════════════════════════════════════════════ S1 · 1 · L'assureur
  - id: en.h2.s1.assureur
    roles: [entraineur]
    arc: direction
    tags: [direction, caisse]
    speaker: achard
    tone: leger
    once: true
    lieu: bureau
    text: "Monsieur Achard pose sa serviette sur le bureau du président : « Deux millions, homme-clé. Sans corps, c'est un départ en vacances. Nous ne remboursons pas les vacances. » Vaubourg te regarde."
    left:
      label: "Il est parti, c'est tout"
      effects: {direction: "+", relation: {aulard: 1, achard: -1}, set: [h2_dit_parti], schedule: [{card: en.h2.wag.message, in: [1, 1]}, {card: en.h2.prev.visite, in: [14, 14]}]}
      answer: "Achard note « parti » et souligne deux fois. « Alors il reviendra chercher ses affaires. On revient toujours pour ses affaires. »"
    right:
      label: "Il n'est pas parti"
      effects: {direction: "-", parole: 1, relation: {achard: 1}, set: [h2_dit_pas_parti], schedule: [{card: en.h2.wag.message, in: [1, 1]}, {card: en.h2.prev.visite, in: [14, 14]}]}
      answer: "Achard lève les yeux de son dossier. « Voilà quelqu'un qui me fait économiser deux millions. » Vaubourg range la police."

  - id: en.h2.s1.assureur_plainte
    roles: [entraineur]
    arc: direction
    tags: [direction, caisse]
    speaker: achard
    tone: leger
    once: true
    lieu: bureau
    text: "Monsieur Achard, ta plainte de décembre à la main : « Véhicule disparu, propriétaire disparu. Une plainte, c'est un vivant qui manque. Et sans corps, nous ne payons pas. » Vaubourg te regarde."
    left:
      label: "Il est parti, c'est tout"
      effects: {direction: "+", relation: {aulard: 1, achard: -1}, set: [h2_dit_parti], schedule: [{card: en.h2.wag.message, in: [1, 1]}, {card: en.h2.prev.visite, in: [14, 14]}]}
      answer: "Achard plie ta plainte en deux. « Parti, avec sa voiture, sans son rasoir. Je note. » Il ne note rien ; il regarde Vaubourg."
    right:
      label: "Il n'est pas parti"
      effects: {direction: "-", parole: 1, relation: {achard: 1}, set: [h2_dit_pas_parti], schedule: [{card: en.h2.wag.message, in: [1, 1]}, {card: en.h2.prev.visite, in: [14, 14]}]}
      answer: "Achard sourit sans les dents. « Vous et moi, nous allons bien nous entendre. » Vaubourg range la police dans le tiroir."

  # ═════════════════════════════════════════════ S1 · 13 · La panne
  - id: en.h2.s1.panne
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, sombre]
    speaker: norbert
    tone: strategique
    once: true
    lieu: gare
    text: "Vingt kilomètres avant Aubérive, le car s'arrête dans la neige. Les joueurs partent en taxi. Norbert coupe le moteur : « Il faut quelqu'un pour signer le bon de la dépanneuse. Vous, ou Vukić ? »"
    left:
      label: "Je reste avec lui"
      effects: {vestiaire: "+", set: [h2_panne_seul], react: en.h2.re.norbert_panne}
      answer: "Le dernier taxi s'éloigne, ses feux rouges rapetissent dans la neige. Norbert remet le chauffage et allume la radio, tout bas."
    right:
      label: "Vukić reste"
      effects: {direction: "+", relation: {vukic: -1}, set: [h2_panne_vukic], react: en.h2.re.vukic_panne}
      answer: "Vukić s'assoit au premier rang, son sac sur les genoux. Dans le taxi, tu te retournes : le car est déjà noir, phares éteints."

  - id: en.h2.s1.panne_averti
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, sombre]
    speaker: norbert
    tone: strategique
    once: true
    lieu: gare
    text: "Neige, vingt kilomètres avant Aubérive. Le car est mort, les joueurs partent en taxi. Norbert : « Quelqu'un pour le bon de la dépanneuse. Vous, coach ? » Ne monte jamais seul dans le car avec lui."
    left:
      label: "Je reste quand même"
      effects: {vestiaire: "+", set: [h2_panne_seul], react: en.h2.re.norbert_panne}
      answer: "Tu signes le bon. Le dernier taxi s'en va. Norbert ferme les portes, remet le chauffage, et dit : « On est bien, là. »"
    right:
      label: "Vukić et moi, on reste"
      effects: {vestiaire: "+", relation: {vukic: 1}, set: [h2_panne_deux]}
      answer: "Vukić s'assoit à côté de toi, au premier rang. Norbert vous regarde dans le rétroviseur toute la nuit, sans dire un mot."

  # ═════════════════════════════════════════════ S1 · 14 · Intermède : le car de nuit
  - id: en.h2.s1.intermede
    roles: [entraineur]
    arc: moment
    tags: [intermede]
    tone: leger
    once: true
    lieu: rue
    text: "Le car du club roule sur le quai, phares éteints, sans chauffeur. Tous les sièges sont vides. Sur celui du chauffeur, une veste pliée, bien droite ; au rétroviseur, un sapin tourne."
    left:
      label: "Je m'approche du volant"
      effects: {}
      answer: "Le car s'arrête au bord de l'eau. Le moteur tourne longtemps, comme quelqu'un qui réfléchit. Tu te réveilles au quai, la fenêtre ouverte."
    right:
      label: "Je m'approche du volant"
      effects: {}
      answer: "Le car s'arrête au bord de l'eau. Le moteur tourne longtemps, comme quelqu'un qui réfléchit. Tu te réveilles au quai, la fenêtre ouverte."

  # ═════════════════════════════════════════════ S1 · 16 · La Rive
  - id: en.h2.s1.rive
    roles: [entraineur]
    arc: direction
    tags: [direction, sombre]
    tone: strategique
    once: true
    lieu: rue
    text: "Une heure du matin, sous tes fenêtres du quai. Un bruit d'eau énorme, puis plus rien. Le car du club est garé, tous feux éteints. Dans la Rive, des bulles, et un sapin en carton qui tourne."
    left:
      label: "Je cours vers le car"
      effects: {direction: "-", set: [h2_rive, h2_rive_couru]}
      answer: "Le car démarre avant que tu arrives, sans phares. Sur le quai, une odeur d'essence, et deux traces de pneus qui finissent dans l'eau."
    right:
      label: "Je reste dans l'ombre"
      effects: {vestiaire: "-", set: [h2_rive, h2_rive_vu]}
      answer: "Un homme descend du car, regarde l'eau longtemps, allume une cigarette. À la flamme du briquet, une moustache. Il remonte sans phares."

  # ═════════════════════════════════════════════ S1 · 17 · Les deux sacs (la saisie)
  - id: en.h2.s1.saisie
    roles: [entraineur]
    arc: famille
    tags: [famille, direction]
    speaker: josiane
    tone: leger
    once: true
    lieu: domicile
