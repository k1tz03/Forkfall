    text: "Deux heures, la friche. Le wagon flambe. Roland tousse dans la boue, en chaussettes. Derrière le feu de palettes, une veste de chauffeur s'éloigne. Josiane arrive en courant, sans son cabas."
    left:
      label: "Je cours vers la veste"
      effects: {set: [h2_feu, h2_course]}
