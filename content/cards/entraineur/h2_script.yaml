  # ═════════════════════════════════════════════ S2 · 16 · L'audience
  # Tribunal de Portclair : loin d'Aubérive (`lieu: ailleurs`).
  - id: en.h2.s2.audience
    roles: [entraineur]
    arc: instances
    tags: [direction, scandale]
    tone: strategique
    once: true
    lieu: ailleurs
    text: "Tribunal de Portclair, un mardi d'avril. Le juge demande si quelqu'un a un signe de vie. Monique regarde ses mains. Achard te regarde, toi. Tu n'as rien dans les poches qu'une vieille clé."
    left:
      label: "Il est vivant, je l'ai vu"
      effects: {direction: "--", relation: {aulard: -1}, set: [h2_mort_papier]}
      answer: "Le greffier note « témoignage sans pièce ». Le juge déclare le décès à onze heures dix. Vaubourg ne te regarde plus de la journée."
    right:
      label: "Je me tais"
      effects: {direction: "+", set: [h2_mort_papier, cdi_signe]}
      answer: "Le juge déclare le décès à onze heures dix. Monique signe un registre. Dans le couloir, Achard range un stylo qu'il n'a pas ouvert."

  - id: en.h2.s2.audience_cassette
    roles: [entraineur]
    arc: instances
    tags: [direction, scandale]
    tone: strategique
    once: true
    lieu: ailleurs
    text: "Tribunal de Portclair, un mardi d'avril. Le juge demande un signe de vie. Dans ta poche, la cassette de janvier, une voix qui dit « Garde le banc ». Vaubourg ne te regarde pas."
    left:
      label: "Je dépose la cassette"
      effects: {direction: "---", parole: 2, relation: {aulard: -1, achard: 1}, set: [h2_vivant_papier]}
      answer: "Le greffier cherche un magnétophone pendant vingt minutes. La voix remplit la salle. Le juge ajourne ; Vaubourg sort sans manteau."
    right:
      label: "Je me tais"
      effects: {direction: "+", set: [h2_mort_papier, cdi_signe]}
      answer: "Le juge déclare le décès à onze heures dix. La cassette pèse dans ta poche toute la journée, comme une pierre."

  - id: en.h2.s2.audience_preuves
    roles: [entraineur]
    arc: instances
    tags: [direction, scandale]
    tone: strategique
    once: true
    lieu: ailleurs
    text: "Tribunal de Portclair, un mardi d'avril. Le juge demande un signe de vie. Dans ta poche, la cassette de janvier ; dans ton sac, quatre ans de paris d'une écriture serrée. Léa attend dehors."
    left:
      label: "Je dépose les deux"
      effects: {end: interim_revenant}
      answer: "Le juge écoute la voix, lit trois pages du carnet, et suspend. Le lendemain, Roland entre au tribunal par la grande porte, rasé."
    right:
      label: "Je me tais"
      effects: {direction: "+", set: [h2_mort_papier, cdi_signe]}
      answer: "Le juge déclare le décès à onze heures dix. Dans le couloir, Léa te regarde passer avec ton sac, sans rien demander."

  - id: en.h2.s2.audience_hopital
    roles: [entraineur]
    arc: instances
    tags: [direction, scandale]
    tone: strategique
    once: true
    lieu: ailleurs
    text: "Tribunal de Portclair. L'audience dure quatre minutes : un homme est vivant à l'hôpital d'Aubérive, sous son nom. Le juge lève la séance. Achard sourit. Vaubourg sort sans manteau."
    left:
      label: "Je vais voir Roland"
      effects: {relation: {josiane: 1}, set: [h2_vivant_papier]}
      answer: "Chambre 4, une perfusion, un journal plié sur le drap. « On a gagné, samedi ? » demande-t-il avant bonjour."
    right:
      label: "Je rattrape Vaubourg"
      effects: {direction: "+", set: [h2_vivant_papier]}
      answer: "Sur les marches, Vaubourg allume une cigarette, les mains qui tremblent. « Deux millions. Tu sais combien de joueurs ça fait ? »"

  - id: en.h2.s2.audience_hopital_carnet
    roles: [entraineur]
    arc: instances
    tags: [direction, scandale]
    tone: strategique
    once: true
    lieu: ailleurs
    text: "L'audience dure quatre minutes : Roland est vivant, à l'hôpital, sous son nom. Dans le couloir, Léa : « Il est vivant, vous avez le carnet. Il peut parler, maintenant. Il veut ? »"
    left:
      label: "Il veut parler"
      effects: {end: interim_revenant}
      answer: "Il parle trois heures, la perfusion au bras, devant un juge et une greffière. Il commence par octobre et finit par le car."
    right:
      label: "Pas encore"
      effects: {set: [h2_vivant_papier]}
      answer: "Léa referme son carnet. « Un jour, il faudra. » Dans la chambre 4, Roland demande seulement le score de samedi."

