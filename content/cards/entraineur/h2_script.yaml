    tags: [direction, scandale]
    speaker: aulard
    tone: strategique
    once: true
    lieu: bureau
    text: "Vaubourg pose une convocation sur le bureau : tribunal de Portclair, avril, « jugement déclaratif de décès ». « Ce jour-là, tu as ton contrat, {toi}. Il est mort, pour toi ? »"
    left:
      label: "Il est mort pour moi"
      effects: {direction: "++", relation: {aulard: 1}, set: [h2_mort_pour_moi], schedule: [{card: en.h2.an.toux, in: [2, 3]}]}
      answer: "Il range la convocation comme un billet de loterie. Dans la journée, il dit « avril » trois fois, à trois personnes différentes."
    right:
      label: "Il est vivant"
      effects: {direction: "--", parole: 1, relation: {aulard: -1}, set: [h2_vivant], schedule: [{card: en.h2.an.toux, in: [2, 3]}]}
      answer: "Il ne demande pas comment tu le sais. Il range la convocation et décroche le téléphone ; il n'appelle personne, il écoute la tonalité."

  - id: en.h2.s2.un_an_pas_parti
    roles: [entraineur]
    arc: direction
    tags: [direction, scandale]
    speaker: aulard
    tone: strategique
    once: true
    lieu: bureau
    text: "Vaubourg, une convocation à la main : « L'assureur me répète ce que tu lui as dit. Tribunal de Portclair, avril : jugement déclaratif de décès. Il est mort, pour toi, {toi}, oui ou non ? »"
    left:
      label: "Il est mort pour moi"
      effects: {direction: "++", relation: {aulard: 1}, set: [h2_mort_pour_moi], schedule: [{card: en.h2.an.toux, in: [2, 3]}]}
      answer: "« Enfin. » Il range la convocation et appelle l'assureur devant toi, pour qu'il entende ta phrase dans sa bouche à lui."
    right:
      label: "Il est vivant"
      effects: {direction: "--", parole: 1, relation: {aulard: -1}, set: [h2_vivant], schedule: [{card: en.h2.an.toux, in: [2, 3]}]}
      answer: "Il te regarde comme on regarde un chèque refusé. « Alors trouve-le avant avril. Ou tais-toi après. »"

