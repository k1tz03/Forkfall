    text: "Tribunal de Portclair, un mardi d'avril. Le juge demande un signe de vie. Dans ton sac, quatre ans de paris d'une écriture penchée, et la compo du vendredi que Vukić avait gardée, pliée en quatre."
    left:
      label: "Je dépose le carnet"
      effects: {direction: "--", parole: 1, relation: {aulard: -1}, set: [h2_vivant_papier, h2_carnet_police]}
      answer: "Le juge pose la compo à côté de la dernière page, datée de décembre : même main. Il ajourne : on ne déclare pas mort un homme qui écrit encore."
    right:
      label: "Je me tais"
      effects: {direction: "+", set: [h2_mort_papier, cdi_signe]}
      answer: "Le juge déclare le décès à onze heures dix. La compo reste pliée dans ton sac : vendredi, vingt-deux heures, la dernière heure sûre."

  # L'audience : Monique a avoué l'appel de la cabine (h2_monique_aveu), et elle
  # jure le contraire devant le juge.
  - id: en.h2.s2.audience_monique
    roles: [entraineur]
    arc: instances
    tags: [direction, scandale]
    tone: strategique
    once: true
    lieu: ailleurs
    text: "Tribunal de Portclair, un mardi d'avril. Le juge demande à Monique Mercadier si elle a eu des nouvelles de son mari. Elle dit non. En le disant, elle te regarde."
    left:
      label: "Il est vivant, je l'ai vu"
      effects: {direction: "--", relation: {aulard: -1, monique: -1}, set: [h2_mort_papier]}
      answer: "« Témoignage sans pièce. » Le juge déclare le décès à onze heures dix. Monique sort la première, sans attendre son avocat."
    right:
      label: "Je me tais"
      effects: {direction: "+", set: [h2_mort_papier, cdi_signe]}
      answer: "Le juge déclare le décès à onze heures dix. Sur les marches, Monique te serre la main longtemps : un merci, ou une excuse."
