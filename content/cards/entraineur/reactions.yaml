# Cartes-réactions de l'entraîneur (spec variété §1.4, §4.1) : servies AU
# TIRAGE SUIVANT le swipe qui les pose (effet `react:` d'un choix), hors
# créneau (bande 8), sans avancer le beat ni le slot. Le build dérive
# `kind: reaction` de toute carte citée par un `react` : ne pas écrire `kind:`.
# Trois familles : la relance (le même visage revient à la charge), la
# conséquence immédiate (le fax, le numéro, la douche), le tiers qui commente
# (Camille, Bréhaut, Vukić). Effets petits, une carte chacune, jamais `end`,
# jamais `react`, jamais `drame`. Les déclencheurs sont cités en commentaire ;
# une même réaction peut être posée par plusieurs cartes.
#
# Le nom du joueur : une réaction qui suit une carte nominative (A1, A4,
# l'empire, le prêt, la rentrée) ne porte ni {toi} ni {prenom} — jamais deux
# cartes de suite avec le nom (spec §1.8). Les autres disent {toi} quand la
# bouche s'y prête (Bréhaut après le onze, la mère de Mbako après l'orange).
cards:
  # ================================================================ A1 · L'inventaire
  # ← les maillots : Josiane revient à la charge (relance).
  - id: en.re.josiane_chauffage
    roles: [entraineur]
    arc: caisse
    tags: [caisse]
    speaker: josiane
    tone: leger
    text: "Madame Josiane, son manteau sur le dos, dans l'encadrement de la porte : « Les maillots sont commandés. Il fait six degrés au vestiaire, j'ai vérifié. Je commande des gants, au moins ? »"
    left:
      label: "Commandez les gants"
      effects: {caisse: "-", vestiaire: "+"}
      answer: "Elle note. Vingt-deux paires. Elle en commande vingt-trois."
    right:
      label: "Pas de gants, ils courront"
      effects: {relation: {josiane: -1}, tribunes: "+"}
      answer: "Elle referme la porte sans bruit. Le lendemain, un thermomètre est punaisé au vestiaire, à côté de la compo."

  # → le chauffage : Gégé au parking (le tiers qui commente).
  - id: en.re.gege_chauffage
    roles: [entraineur]
    arc: ultras
    tags: [ultras, tribunes]
    speaker: gege
    tone: leger
    text: "Gégé, sur le parking, moteur allumé, vitre baissée : « Le chauffage pour eux, les vieux maillots pour nous. Le radiateur du local est mort en mars. On a froid aussi, tu sais. »"
    left:
      label: "Je passe au local"
      effects: {tribunes: "+", direction: "-", relation: {gege: 1}}
      answer: "Une bière tiède sous le radiateur mort. Il a posé son écharpe dessus, comme sur un malade."
    right:
      label: "Le vestiaire d'abord"
      effects: {vestiaire: "+", relation: {gege: -1}}
      answer: "Il coupe le moteur. Il note quelque chose sur le pare-brise embué."

  # ================================================================ A4 · La Commission
  # ← on vend le gamin : Vaubourg lit son SMS (conséquence immédiate).
  - id: en.re.aulard_sms_brouillon
    roles: [entraineur]
    arc: direction
    tags: [direction]
    speaker: aulard
    tone: leger
    text: "Vaubourg, dans le couloir, le fax pour Fardelli à la main : « Je te le lis avant qu'il parte : « Le club étudiera toute offre pour le joueur Mbako. » Ça te va ? »"
    left:
      label: "Je corrige le nom"
      effects: {relation: {aulard: 1}}
      answer: "Il barre, réécrit « Mbako » au-dessus, et envoie. Le fax part avec la rature."
    right:
      label: "Envoyez-le"
      effects: {direction: "+", parole: -1}
      answer: "Le fax part tel quel. Fardelli rappelle dix minutes plus tard ; lui, il a écrit le nom juste."

  # → on trouve un sponsor : Josiane a composé le numéro (conséquence immédiate).
  - id: en.re.josiane_numero
    roles: [entraineur]
    arc: sponsors
    tags: [sponsors, caisse]
    speaker: josiane
    tone: leger
    text: "Madame Josiane, le combiné contre l'épaule, un numéro griffonné sur un ticket de caisse : « Ça sonne à l'étranger. Là-bas, il est trois heures du matin. Je laisse sonner ? »"
    left:
      label: "Laissez sonner"
      effects: {direction: "+", tribunes: "-"}
      answer: "Quelqu'un décroche dans une autre langue, sans dire bonjour. Josiane épelle le nom du club, deux fois."
    right:
      label: "Raccrochez, on rappelle"
      effects: {relation: {josiane: 1}, direction: "-"}
      answer: "Elle raccroche. Le fax sonne à sa place. Il a déjà le numéro."

  # ================================================================ A6 · Le dernier virage
  # ← on attaque : Bréhaut a entendu (le tiers qui commente).
  - id: en.re.brehaut_on_attaque
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut, à la porte du vestiaire, en chaussettes : « Les gars ont entendu « on attaque ». Ils demandent avec qui, devant. Le petit ou les anciens ? Ils veulent l'entendre de ta bouche. »"
    left:
      label: "Je mets le petit devant"
      effects: {tribunes: "+", relation: {mbako: 1}}
      answer: "Il hoche la tête. Il va prévenir les anciens lui-même."
    right:
      label: "Je garde les anciens"
      effects: {vestiaire: "+", relation: {brehaut: 1}}
      answer: "Il sourit. Le petit range ses crampons sans un mot."

  # → on ferme, on assure : Vukić a vu la bâche de Gégé (le tiers qui commente).
  - id: en.re.vukic_bloc_bas
    roles: [entraineur]
    arc: ultras
    tags: [ultras, vestiaire]
    speaker: vukic
    tone: strategique
    text: "Vukić, la porte à peine refermée : « Gégé a écrit « fermer » sur ton pare-brise. Au local, il y a une bâche roulée sous un siège ; je l'ai vue ce matin. On ferme quand même ? »"
    left:
      label: "On ferme"
      effects: {direction: "+", tribunes: "-"}
      answer: "Bloc bas. La bâche reste roulée jusqu'à la soixantième minute."
    right:
      label: "On ouvre un peu"
      effects: {tribunes: "+", direction: "-"}
      answer: "Un attaquant de plus sur la feuille. Le président relit la feuille."

  # ================================================================ La cote du promu
  # empire ← un budget : Josiane et le chèque non daté (relance).
  - id: en.re.josiane_cheque
    roles: [entraineur]
    arc: caisse
    tags: [caisse, direction]
    speaker: josiane
    tone: leger
    text: "Madame Josiane, le chèque du bout des doigts : « Signé, pas daté. Le dernier chèque sans date que j'ai vu ici, c'était l'indemnité de votre prédécesseur. Je le date de quand ? »"
    left:
      label: "Datez-le d'aujourd'hui"
      effects: {caisse: "+", relation: {aulard: -1}}
      answer: "Elle date. Elle encaisse. Le président apprend le mot « aujourd'hui »."
    right:
      label: "Gardez-le sans date"
      effects: {relation: {josiane: 1}}
      answer: "Elle le range dans le tiroir du milieu. Celui qui ferme à clé."

  # empire → un projet : Massenet compte les « projet » (le tiers qui commente).
  - id: en.re.meneche_projet
    roles: [entraineur]
    arc: presse
    tags: [presse, direction]
    speaker: meneche
    tone: leger
    text: "Massenet, déjà au parking, le carnet ouvert : « Le président a dit « projet » trois fois entre la salle et sa voiture. Je l'écris demain. Et vous, vous l'avez dit combien de fois ? »"
    left:
      label: "Écrivez : zéro"
      effects: {parole: 1, relation: {aulard: -1}}
      answer: "Il note « zéro ». Le président lit le chiffre le lendemain, entouré."
    right:
      label: "Écrivez : autant que lui"
      effects: {direction: "+", parole: -1}
      answer: "Il note « quatre ». Il arrondit toujours vers le haut."

  # ================================================================ Le kop qui t'aime trop
  # local ← j'y vais : Camille à une heure du matin (le tiers qui commente).
  - id: en.re.camille_le_verre
    roles: [entraineur]
    arc: famille
    tags: [famille, ultras]
    speaker: camille
    tone: leger
    when: "!flag('divorce')"
    text: "Camille, dans la cuisine éteinte, ton assiette sous une autre assiette : « Il est une heure. Tu sens la bière et le tabac froid. La voisine t'a vu chanter sur le parking du stade. »"
    left:
      label: "Je t'explique"
      effects: {relation: {camille: 1}, tribunes: "-"}
      answer: "Tu expliques le local, Gégé, la craie. Elle rallume la lumière pour t'écouter."
    right:
      label: "C'est le métier"
      effects: {relation: {camille: -1}}
      answer: "Elle éteint la lumière du couloir. Tu trouves le lit quand même."

  # onze ← le peuple a raison : Bréhaut a lu la compo (le tiers qui commente).
  - id: en.re.brehaut_onze
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, ultras]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut, L'Écho plié en deux sous le bras : « Les gars ont lu la compo dans le journal, {toi}. Celle du virage. Le gars du Nord a appris qu'il était au banc par sa mère. »"
    left:
      label: "Je sais"
      effects: {vestiaire: "-"}
      answer: "Il pose le journal sur ton bureau. Compo vers le haut."
    right:
      label: "Je sais"
      effects: {vestiaire: "-"}
      answer: "Il pose le journal sur ton bureau. Compo vers le haut."

  # ================================================================ Le prodige
  # gamin (les deux côtés) : Fardelli a déjà le gamin (conséquence immédiate).
  - id: en.re.fardelli_numero
    roles: [entraineur]
    arc: agents
    tags: [agents, mercato]
    speaker: fardelli
    tone: leger
    text: "Fardelli, cigare éteint, dans l'escalier des U19 : « Vous l'avez renvoyé chez les petits ce matin. À midi, sa mère m'a appelé. Le gamin a un agent, maintenant. Moi. »"
    left:
      label: "Je lui serre la main"
      effects: {set: [mbako_agent_fardelli], relation: {fardelli: 1}}
      answer: "Il rallume le cigare. Il a le numéro de la mère, elle a le sien."
    right:
      label: "Je lui serre la main"
      effects: {set: [mbako_agent_fardelli], relation: {fardelli: 1}}
      answer: "Il rallume le cigare. Il a le numéro de la mère, elle a le sien."

  # ================================================================ Le sponsor qui devient propriétaire
  # maillot → va pour l'orange : la mère de Mbako (le tiers qui commente).
  - id: en.re.mere_orange
    roles: [entraineur]
    arc: sponsors
    tags: [sponsors, agents]
    speaker: mere_mbako
    tone: strategique
    text: "La mère de Mbako, un maillot orange à bout de bras, au secrétariat : « Mon fils ne portera pas une boisson sur la poitrine. Pas sans une ligne dans son contrat, et c'est moi qui l'écris. »"
    left:
      label: "Il portera le maillot"
      effects: {relation: {mbako: -1}}
      answer: "Elle plie le maillot. Elle le plie très bien, et très longtemps."
    right:
      label: "Un maillot blanc pour lui"
      effects: {caisse: "-", relation: {mbako: 1}}
      answer: "Un maillot blanc, sans sponsor. Ilyas compte les manches sur la photo."

  # maillot ← sacré · naming ← garde son nom · prêt ← ni le petit ni le club : Ilyas reviendra (relance).
  - id: en.re.nassir_reviendrons
    roles: [entraineur]
    arc: sponsors
    tags: [sponsors, caisse]
    speaker: nassir
    tone: leger
    text: "Cheikh Ilyas remet son manteau sans se presser, la canette dans la poche : « Nous reviendrons. Votre caisse, elle, ne rajeunit pas. Saluez votre secrétaire ; elle sait compter. »"
    left:
      label: "On vous raccompagne"
      effects: {tribunes: "+"}
      answer: "Gégé tient la porte. Il la tient jusqu'à ce que la voiture tourne."
    right:
      label: "On vous raccompagne"
      effects: {tribunes: "+"}
      answer: "Gégé tient la porte. Il la tient jusqu'à ce que la voiture tourne."

  # ================================================================ L'alarme du bus
  # vestiaire_bas_vukic → qu'ils restent dedans : Gigi descend seul (le tiers qui agit).
  - id: en.re.vecchio_bus
    roles: [entraineur]
    arc: vestiaire
    tags: [vestiaire, rescue:vestiaire]
    speaker: vecchio
    tone: strategique
    text: "Vecchio, le sac déjà sur l'épaule : « Quarante ans passés, je ne fais pas grève contre un ballon. Je vais m'échauffer, coach. Tout seul, s'il le faut. »"
    left:
      label: "Vas-y, Gigi"
      effects: {vestiaire: "+", relation: {vecchio: 1}}
      answer: "Il s'échauffe seul devant le but vide, les gants jaunes aux mains. Au bout de dix minutes, deux autres le rejoignent."
    right:
      label: "Vas-y, Gigi"
      effects: {vestiaire: "+", relation: {vecchio: 1}}
      answer: "Il s'échauffe seul devant le but vide, les gants jaunes aux mains. Au bout de dix minutes, deux autres le rejoignent."

  # ================================================================ La presse
  # trois_questions ← je ne commente pas · cote → je ne commente pas · marque → je ne commente pas :
  # Massenet en embuscade au parking (relance).
  - id: en.re.meneche_embuscade
    roles: [entraineur]
    arc: presse
    tags: [presse, absurde]
    speaker: meneche
    tone: leger
    text: "Massenet, entre deux voitures du parking, le carnet fermé : « Je range le stylo. Ce que vous me dites maintenant ne sort pas. Sauf si quelqu'un d'autre l'écrit avant moi. »"
    left:
      label: "Je lui parle, carnet fermé"
      effects: {relation: {meneche: 1}, direction: "-"}
      answer: "Tu parles trois minutes. Il ne note rien, il retient tout, et il te serre la main en partant."
    right:
      label: "Je ne commente pas non plus"
      effects: {var: {no_comment: "+1"}, relation: {meneche: -1}}
      answer: "Il rouvre le carnet et note l'heure. Deux silences de suite, ça finit toujours en titre."

  # ================================================================ Saisons 3+ · la rentrée
  # rentree ← un café et les comptes : Josiane et la page rouge (relance).
  - id: en.re.josiane_page_rouge
    roles: [entraineur]
    arc: caisse
    tags: [caisse, direction]
    speaker: josiane
    tone: leger
    text: "Madame Josiane, le classeur ouvert : « La couleur de plus, c'est le rouge. Je vous montre la page rouge, ou vous finissez votre café d'abord ? »"
    left:
      label: "La page rouge"
      effects: {direction: "+", relation: {josiane: 1}}
      answer: "Un chiffre, souligné deux fois. Elle referme avant que tu le recopies."
    right:
      label: "Le café d'abord"
      effects: {vestiaire: "+", relation: {josiane: -1}}
      answer: "Le café refroidit. La page rouge, non."

  # ================================================================ Saisons 3+ · la veille
  # veille → on joue le sien : Vukić a le second discours (relance).
  - id: en.re.vukic_second_discours
    roles: [entraineur]
    arc: direction
    tags: [direction, vestiaire]
    speaker: vukic
    tone: strategique
    text: "Vukić, une feuille pliée en quatre entre deux pages du cahier : « Le président a deux discours prêts pour samedi. Josiane a tapé le second hier soir ; j'ai le double. Tu veux le lire ? »"
    left:
      label: "Je le lis"
      effects: {direction: "-", relation: {vukic: 1}}
      answer: "Ton nom n'y est pas. Le sien, en bas, en petit."
    right:
      label: "Je ne veux pas savoir"
      effects: {vestiaire: "+"}
      answer: "Il replie la feuille. Il la garde dans la poche du survêtement, côté cœur."

  # veille ← on joue le nôtre : Vaubourg garde le sien (relance).
  - id: en.re.aulard_le_mien
    roles: [entraineur]
    arc: direction
    tags: [direction]
    speaker: aulard
    tone: strategique
    text: "Vaubourg, au téléphone, sans dire bonjour : « Vukić me dit que tu joues ton plan. Le mien est dans ma poche, tapé à la machine. Tu veux savoir ce qu'il dit ? »"
    left:
      label: "Gardez-le"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Il raccroche. Il rappelle pour dire qu'il ne rappellera pas."
    right:
      label: "Lisez-le-moi"
      effects: {direction: "+", relation: {aulard: 1}}
      answer: "Il lit. Ton nom y est, une fois, entre deux virgules."
