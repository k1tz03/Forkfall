    speaker: josiane
    lieu: secretariat
    tone: strategique
    text: "Madame Josiane a étalé vingt talons d'invitation sur le bureau, en éventail, comme des cartes. « La préfecture les a ramassés au guichet, revendus cinq fois le prix. Le président veut un nom lundi. »"
