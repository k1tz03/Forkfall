# Cartes de l'intrigue « Le banc » (arc jp.banc_hiver) — bible ch. 10 § 6.7.
# Vukić ouvre (« je te le dis parce que personne ne te le dira »), le président
# propose le loft, l'agent invente une blessure, et le retour se fait par la
# petite porte ou pas du tout.
cards:
  - id: jp.banc.vukic
    roles: [joueur]
    arc: direction
    tags: [direction, vestiaire]
    speaker: vukic
    tone: strategique
    text: "Vukić, devant la compo, le cahier ouvert à ta page : « Banc, dimanche. Tu regardes le ballon, jamais l'homme derrière toi ; c'est écrit là, trois fois. Tu bosses, ou tu vas taper chez le coach ? »"
    left:
      label: "Je bosse en silence"
      effects: {direction: "+", vestiaire: "+", force: 1, relation: {vukic: 1}, set: [banc_bosse], outcome: bosse}
      answer: "Tu bosses. Il reste avec toi après la séance, à te faire chercher l'homme derrière toi. Ta page du cahier se remplit."
    right:
      label: "Je tape à sa porte"
      effects: {tribunes: "+", direction: "--", set: [banc_boude], outcome: boude}
      answer: "Tu tapes. Il ouvre, écoute, referme. La porte est plus lourde en repartant."

  - id: jp.banc.vukic_encore
    roles: [joueur]
    arc: direction
    tags: [direction, vestiaire]
    speaker: vukic
    tone: leger
    text: "Vukić tourne son cahier vers toi : ton nom, encore, dans la colonne des remplaçants. « La première fois, c'était une punition. La deuxième, c'est un classement. Tu bosses, ou tu vas taper ? »"
    left:
      label: "Je bosse en silence"
      effects: {direction: "+", vestiaire: "+", force: 1, relation: {vukic: 1}, set: [banc_bosse], outcome: bosse}
      answer: "Tu bosses. Ta page est déjà à moitié pleine ; il en commence une autre, sans rien dire."
    right:
      label: "Je tape à sa porte"
      effects: {tribunes: "+", direction: "--", set: [banc_boude], outcome: boude}
      answer: "Tu tapes. Il ouvre moins grand que la première fois."

  - id: jp.banc.loft
    roles: [joueur]
    arc: mercato
    tags: [mercato, direction]
    speaker: aulard
    tone: leger
    text: "Vaubourg ne se lève pas ; sa fenêtre donne sur le terrain des U17 : « Sur le banc, tu me coûtes autant que dans le onze. Tu pars en janvier, ou tu t'entraînes avec les gamins en attendant ? »"
    left:
      label: "Je pars en janvier"
      effects: {caisse: "++", tribunes: "-", relation: {aulard: 1}, set: [parti_janvier], club: {change: true}, outcome: partir, react: {card: co.re.josiane_a_lu, if: "!seen('co.re.josiane_a_lu')"}}
      answer: "Il te tend un stylo qui fuit. Tu signes avec. La tache est sur le contrat ; Josiane la garde."
    right:
      label: "Je vais chez les U17"
      effects: {vestiaire: "-", tribunes: "++", direction: "--", relation: {aulard: -1}, set: [loft_tenu]}
      answer: "Tu t'entraînes avec des gamins de dix-sept ans. Le petit est dedans. Il te fait la passe ; il est le seul."

  - id: jp.banc.recruteurs
    roles: [joueur]
    arc: agents
    tags: [agents, mercato]
    speaker: fardelli
    tone: strategique
    text: "Fardelli regarde trois doudounes regagner le parking : « Trois recruteurs, et toi sur le banc. Je leur ai dit que tu étais blessé{pg, select, f{e} other{}}, pour te rendre service. Tu confirmes ? »"
    left:
      label: "Je confirme la blessure"
      effects: {caisse: "+", direction: "-", parole: -1, set: [blessure_inventee], react: jp.re.sabatier_certificat}
      answer: "Le Doc signe un certificat sans te regarder. Il appuie si fort que le stylo marque la feuille de dessous."
    right:
      label: "Je suis sur le banc, point"
      effects: {tribunes: "+", caisse: "-", relation: {fardelli: -1}}
      answer: "Il dit « d'accord ». Les trois doudounes vont voir le petit. C'est plus simple."

  - id: jp.banc.retour
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vukic
    tone: strategique
    text: "Vukić pose le doigt en bas de la feuille de match, sur ton nom : « J'ai insisté. Le coach te donne vingt minutes, pas une de plus. Tu les prends, ou tu attends qu'il te rappelle lui-même ? »"
    left:
      label: "Je prends les vingt minutes"
      effects: {vestiaire: "+", tribunes: "+", force: 1, relation: {vukic: 1}, set: [retour_petite_porte]}
      answer: "Tu joues vingt minutes. Tu fais une passe décisive au petit ; c'est le meilleur retour possible, et il est à lui."
    right:
      label: "J'attends qu'il m'appelle"
      effects: {tribunes: "-", direction: "-", force: -1}
      answer: "Tu attends. Le coach ne t'appelle pas de la saison. Vukić range le cahier ; il souligne ton nom quand même."

  - id: jp.banc.retour_ailleurs
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, mercato]
    speaker: vukic
    tone: strategique
    # Défaut de relecture : la carte disait « tu es parti en janvier » quatre
    # cartes après le loft, alors que le changement de club est DIFFÉRÉ à
    # l'ouverture de la saison suivante (la saison close garde son club, son
    # objectif et sa Tribune Nord). La demi-saison de janvier n'existe pas dans
    # le modèle : la scène se dit donc au futur proche.
    text: "Vukić t'attend au parking pour te rendre ta page du cahier, arrachée proprement : « Là-bas aussi, il y a un banc, et il est plus long. Si tu veux savoir où tomber, tu m'appelles. Tu appelleras ? »"
    left:
      label: "Je t'appellerai"
      effects: {direction: "+", relation: {vukic: 1}, force: 1, set: [retour_petite_porte]}
      answer: "Tu appelleras. Il te dira trois choses sur ton nouveau coach ; les trois seront vraies."
    right:
      label: "Je me débrouillerai"
      effects: {tribunes: "+", vestiaire: "-"}
      answer: "Tu te débrouilleras. Ça prendra six mois de plus ; ça tiendra mieux, peut-être."
