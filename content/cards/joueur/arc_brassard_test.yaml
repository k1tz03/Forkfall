# Cartes de l'intrigue « Le test du capitaine » (arc jp.brassard_test) —
# bible ch. 10 § 6.2. Bréhaut dit {toi} (« petit » en neutre, « le {numero} »
# quand il ne t'aime plus) ; le nom du joueur ne sort pas de l'intrigue :
# c'est une histoire de dossard.
cards:
  - id: jp.brassard.penalty
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: brehaut
    tone: strategique
    text: "Quatre-vingt-huitième, un partout. Titi Bréhaut te tend le ballon à moitié : « Le tireur, c'est moi. Mais au toro, tu as ouvert la bouche, et ça s'est vu. Je demande une fois : toi, ou moi ? »"
    left:
      label: "Tire, capitaine"
      effects: {vestiaire: "++", tribunes: "-", relation: {brehaut: 1}, react: {card: jp.re.vecchio_bouteilles, chance: 0.5}}
      answer: "Il tire. Il marque. Il te montre du doigt en courant ; le groupe a vu."
    right:
      label: "Je le tire"
      effects: {vestiaire: "-", rand: [{p: 0.7, tribunes: "+++", set: [penalty_marque]}, {tribunes: "--", vestiaire: "-", set: [penalty_rate]}]}
      answer: "Tu tires. Le stade retient. Il retient jusqu'au filet, ou jusqu'au poteau."

  - id: jp.brassard.penalty_mouton
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: brehaut
    tone: strategique
    text: "Quatre-vingt-huitième, un partout. Titi Bréhaut pose le ballon sur le point et parle aux autres, pas à toi : « Personne ne bouge. On sait tous qui tire. »"
    left:
      label: "Je regarde"
      effects: {vestiaire: "-"}
      answer: "Il tire sans te regarder. Il marque. Personne ne te tape dans le dos ; personne ne te voit."
    right:
      label: "Je regarde"
      effects: {vestiaire: "-"}
      answer: "Il tire sans te regarder. Il marque. Personne ne te tape dans le dos ; personne ne te voit."

  - id: jp.brassard.toro
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: vecchio
    tone: leger
    text: "Gigi Vecchio, au milieu du toro où il ne va jamais, souffle près de toi : « Dix minutes, j'ai touché le ballon deux fois. Toi, zéro. Ils ne te la passent pas ; c'est voulu. Tu dis quelque chose ? »"
    left:
      label: "Je dis quelque chose"
      effects: {vestiaire: "+", tribunes: "-", outcome: accepte, rand: [{p: 0.5, clear: [mouton_noir], set: [groupe_accepte]}, {vestiaire: "-"}]}
      answer: "Tu dis « oh ». Bréhaut te passe le ballon, une fois, fort. C'est un début, ou une fin."
    right:
      label: "J'attends"
      effects: {vestiaire: "--", force: 1, set: [mouton_noir], outcome: mouton}
      answer: "Tu attends. Le toro finit sans toi. Le lendemain, tu t'entraînes à côté ; c'est plus calme."

  - id: jp.brassard.genou_de_titi
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: brehaut
    tone: strategique
    text: "Titi Bréhaut, la glace sur le genou, fait tourner le brassard autour de deux doigts : « Le Doc dit trois semaines ; je sais compter, c'est la saison. Il faut un brassard qui court. Toi, ou Gigi ? »"
    left:
      label: "Je le prends"
      effects: {vestiaire: "+", direction: "+", set: [capitaine], outcome: capitaine, react: jp.re.vukic_capitaine}
      answer: "Il te le met lui-même. Il serre un peu trop fort sur l'épaule ; il le fait exprès."
    right:
      label: "Donne-le à Gigi"
      effects: {vestiaire: "++", tribunes: "-", relation: {vecchio: 1}, set: [brassard_gigi], react: [ { card: co.re.vecchio_garde_eau, if: "seen('co.re.vecchio_garde_casier')", chance: 0.6 }, { card: co.re.vecchio_garde_casier, if: "seen('co.re.vecchio_garde')", chance: 0.6 }, { card: co.re.vecchio_garde, chance: 0.6 } ]}
      answer: "Vecchio le met sur le gant. Il tombe deux fois par match ; le stade applaudit quand il le remet."

  - id: jp.brassard.discours
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vukic
    tone: strategique
    text: "Vukić s'adosse à la porte et te laisse le milieu du vestiaire : « Le derby. Depuis le brassard, ils t'écoutent ; avant, ils te regardaient. Tu leur parles, ou tu les laisses à leur match ? »"
    left:
      label: "Je leur parle, fort"
      effects: {rand: [{p: 0.6, vestiaire: "++", tribunes: "+"}, {vestiaire: "-"}], set: [discours_feu]}
      answer: "Tu parles. Le petit regarde ses chaussures ; le gardien regarde le plafond ; Bréhaut te regarde, toi."
    right:
      label: "Je me tais, on joue"
      effects: {vestiaire: "+", force: 1}
      answer: "Tu ne dis rien. Vecchio dit « allez », un seul mot, et ils se lèvent tous ensemble."

  - id: jp.brassard.discours_sans
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vukic
    tone: strategique
    text: "Vukić te croise dans le couloir, la veille du derby : « Demain, le capitaine parlera aux gars. Ce qu'on dit juste avant lui, on s'en souvient plus longtemps. Tu parles avant lui, ou tu écoutes ? »"
    left:
      label: "Je parle avant lui"
      effects: {vestiaire: "-", tribunes: "+", force: 1, set: [discours_feu]}
      answer: "Tu parles le premier. Le capitaine attend que tu finisses, puis dit trois mots ; on retient les siens."
    right:
      label: "J'écoute"
      effects: {vestiaire: "+", relation: {brehaut: 1}}
      answer: "Tu écoutes, au fond, debout. Bréhaut le remarque ; à la sortie, il te tient la porte."
