# Cartes de l'intrigue « Le bac de Camille » (arc jp.camille_bac) —
# bible ch. 10 § 6.9. Dix-neuf ans tous les deux, et un seul des deux a un
# agent. Camille dit {toi} ({prenom}) ; Josiane vouvoie.
cards:
  - id: jp.bac.revision
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: leger
    text: "Camille surligne ses fiches à la table de la cuisine sans lever la tête ; ton ballon dort sous sa chaise : « Le bac, c'est en juin. Ton transfert aussi, paraît-il. Tu me fais réciter, le soir ? »"
    left:
      label: "Je te fais réviser"
      effects: {vestiaire: "-", force: -1, relation: {camille: 1}, set: [camille_bac_aidee], outcome: aide}
      answer: "Tu lui fais réciter. Tu apprends des choses. Le téléphone sonne deux fois pour toi ; tu ne décroches pas ; c'est la première fois."
    right:
      label: "Après le transfert"
      effects: {force: 1, tribunes: "+", relation: {camille: -1}, set: [bac_apres], outcome: apres}
      answer: "Elle révise seule. Elle a le bac. Elle ne te le dit pas le jour même."

  - id: jp.bac.annales
    roles: [joueur]
    arc: famille
    tags: [famille, absurde]
    speaker: josiane
    tone: leger
    text: "Madame Josiane pose sur ton casier un carton d'annales, l'étiquette datée de juin 1957 : « Les miennes. Moi, je n'en ai rien fait. Elle, qu'elle en fasse quelque chose. Vous les lui portez, {toi} ? »"
    left:
      label: "Je les apporte"
      effects: {relation: {camille: 1, josiane: 1}, vestiaire: "+"}
      answer: "Tu portes le carton. Camille rit ; c'est rare cette semaine."
    right:
      label: "Apportez-les, en passant"
      effects: {relation: {josiane: 1}, vestiaire: "+"}
      answer: "Elle passe. Elle reste dîner. Elle raconte 1957 ; tu apprends qu'elle a eu dix-huit en philosophie."

  - id: jp.bac.jour_j
    roles: [joueur]
    arc: famille
    tags: [famille, moment]
    speaker: camille
    tone: leger
    text: "Camille, devant la grille du lycée à huit heures moins le quart, sa carte d'identité dans une main, ton écharpe du club dans l'autre : « Je sors à midi. Ton match est à quinze heures. Tu m'attends ? »"
    left:
      label: "Je t'attends à midi"
      effects: {vestiaire: "-", force: -1, relation: {camille: 2}, set: [attendu_lycee]}
      answer: "Tu attends. Elle sort à midi dix. Tu arrives au stade à quatorze heures trente ; on te met quand même."
    right:
      label: "Je pars avant"
      effects: {vestiaire: "+", tribunes: "+", relation: {camille: -1}}
      answer: "Tu pars. Elle sort seule, prend le bus jusqu'au stade, arrive à la mi-temps ; tu ne l'as pas vue."

  # Variante des résultats quand la révision a été renvoyée « après le transfert »
  # (`bac_apres`). Défaut de relecture (« issues » de jp.camille_bac) : l'issue
  # `apres`, posée à la première étape, était écrasée par le `voiture` de la
  # dernière — elle tombait à 6 % pour un plancher de 10 %, et la branche « je
  # révise plus tard » n'avait pas de fin à elle. Ici elle en a une : elle a eu
  # le bac sans toi, et la voiture ne rachète pas juin.
  - id: jp.bac.resultats_apres
    roles: [joueur]
    arc: famille
    tags: [famille, agents]
    speaker: camille
    tone: strategique
    text: "Camille tient son relevé de notes plié en quatre, daté du 4 juillet : « Tu l'as appris le 11, par ta mère. Ce soir, on fête quelque chose. Mon bac, ou ton transfert ? »"
    left:
      label: "Ton bac, d'abord"
      effects: {tribunes: "-", vestiaire: "+", relation: {camille: 1}, outcome: apres, journal: {text: "{annee} : Camille a eu son bac seule. {nom} l'a su une semaine après ; la fête du transfert est annulée.", poids: 2, tags: [famille]}}
      answer: "Vous fêtez son bac. Personne ne parle du transfert ; c'est une soirée courte, et elle est bien."
    right:
      label: "Les deux, le même soir"
      effects: {caisse: "-", tribunes: "+", relation: {camille: -1}, outcome: apres, journal: {text: "{annee} : deux gâteaux le même soir chez {prenom} {nom}. Les photos sont toutes du côté du transfert.", poids: 2, tags: [famille]}}
      answer: "Deux gâteaux, une salle louée, trente personnes. Sur les photos, on ne voit qu'un des deux gâteaux."

  - id: jp.bac.resultats
    roles: [joueur]
    arc: agents
    tags: [agents, famille]
    speaker: fardelli
    tone: leger
    text: "Fardelli parle au rétroviseur ; derrière, Camille serre son relevé de notes : « Un bac et une offre de D1, la même semaine. Je vous offre la voiture ; on se rendra service. À ton nom, ou au sien ? »"
    left:
      label: "À son nom"
      effects: {caisse: "-", relation: {camille: 1}, set: [voiture_camille], outcome: voiture}
      answer: "La voiture est à elle. Elle apprend à conduire dessus ; elle a une fac à quatre cents kilomètres, et une voiture."
    right:
      label: "À mon nom"
      effects: {caisse: "+", relation: {camille: -1}}
      answer: "La voiture est à toi. Tu roules seul dedans. C'est une belle voiture."

  - id: jp.bac.resultats_seul
    roles: [joueur]
    arc: famille
    tags: [famille, caisse]
    speaker: camille
    tone: leger
    text: "Camille entoure une annonce dans L'Écho, une petite citadine d'occasion : « J'ai le bac, tu as une prime, et personne ne prend dix pour cent sur nous. On l'achète demain. Elle sera à qui ? »"
    left:
      label: "À ton nom"
      effects: {caisse: "-", relation: {camille: 1}, set: [voiture_camille], outcome: voiture}
      answer: "La carte grise est à elle. Elle conduit mal pendant six mois ; personne ne le lui dit."
    right:
      label: "Au mien, pour l'assurance"
      effects: {caisse: "+", relation: {camille: -1}}
      answer: "Elle dit « pour l'assurance », deux fois, avec la même voix. La deuxième est plus lente."
