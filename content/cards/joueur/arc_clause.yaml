# Cartes de l'intrigue « La clause » (arc jp.clause) — bible ch. 10 § 6.11.
# Un rival a payé la clause au centime ; le club fulmine et ne peut rien faire.
# La page deux double la clause ; Gégé veut le blason ; le fax arrive à 23 h 58.
cards:
  - id: jp.clause.rival
    roles: [joueur]
    arc: mercato
    tags: [mercato, agents]
    speaker: fardelli
    tone: strategique
    text: "Fardelli te montre la photocopie d'un chèque, l'original dans sa veste : « {rival} a payé ta clause au centime, {toi}. Le président hurle, et il ne peut rien. Tes valises, ou tu déclines ? »"
    left:
      label: "Mes valises"
      effects: {caisse: "++", tribunes: "--", direction: "-", set: [parti_chez_rival], club: {change: true}, outcome: part, react: jp.re.gege_blason}
      answer: "Tu pars chez le rival. Gégé décroche ton nom du local ; il ne le brûle pas, il le garde pour le derby."
    right:
      label: "Je décline"
      effects: {tribunes: "+", direction: "+", relation: {fardelli: -1}, set: [fidele], outcome: refuse}
      answer: "Tu déclines. Il plie la photocopie en quatre, la range avec l'original, et attend l'an prochain."

  - id: jp.clause.rival_gigi
    roles: [joueur]
    arc: mercato
    tags: [mercato, agents]
    speaker: fardelli
    tone: strategique
    text: "Fardelli cale la photocopie du chèque contre le volant : « {rival} a payé ta clause au centime. Gigi t'a conseillé de me dire non une fois, je sais. C'est ce soir, ou tu fais tes valises ? »"
    left:
      label: "Mes valises"
      effects: {caisse: "++", tribunes: "--", direction: "-", set: [parti_chez_rival], club: {change: true}, outcome: part, react: jp.re.gege_blason}
      answer: "Tu pars chez le rival. Gégé décroche ton nom du local ; il le garde pour le derby."
    right:
      label: "C'est ce soir : non"
      effects: {tribunes: "+", direction: "+", relation: {fardelli: -2}, set: [fidele], outcome: refuse}
      answer: "Tu dis non. Il range la photocopie ; il garde tout ce qu'on lui refuse."

  - id: jp.clause.page_deux
    roles: [joueur]
    arc: direction
    tags: [direction, mercato]
    speaker: aulard
    tone: strategique
    text: "Vaubourg repasse au stylo un cercle, page deux : « Si tu restes, ta clause double. Je l'ai écrite cette nuit, {toi}, pour que plus personne ne puisse la lever. Tu signes, ou au prix d'avant ? »"
    left:
      label: "Je signe la page deux"
      effects: {caisse: "++", direction: "+", tribunes: "-", set: [mercenaire], outcome: double, react: {card: jp.re.josiane_classeur, chance: 0.5}}
      answer: "Tu signes, et le club paie pour que tu restes. La Gazette Rose écrit « le mercenaire fidèle » ; les deux mots sont vrais."
    right:
      label: "Au prix d'avant"
      effects: {tribunes: "++", caisse: "-", set: [fidele], outcome: refuse}
      answer: "Tu restes au prix d'avant. Il ne comprend pas ; il te serre la main ; c'est rare."

  - id: jp.clause.page_deux_lue
    roles: [joueur]
    arc: direction
    tags: [direction, mercato]
    speaker: aulard
    tone: strategique
    text: "Vaubourg pose son stylo à côté de la ligne entourée : « Toi, tu l'as lue avant moi, la page deux, dès ton premier jour. Ta clause double si tu restes. Tu signes, ou tu la relis encore ? »"
    left:
      label: "Je signe"
      effects: {caisse: "++", direction: "+", tribunes: "-", set: [mercenaire], outcome: double}
      answer: "Tu signes. Il repose le stylo à l'endroit exact où il l'avait pris ; il aime que les choses reviennent."
    right:
      label: "Je la relis"
      effects: {direction: "-", caisse: "+", tribunes: "+", set: [fidele], outcome: refuse}
      answer: "Tu la relis. Il y a une ligne sur les primes de match qu'il espérait que tu ne lirais pas ; tu la lis."

  - id: jp.clause.blason
    roles: [joueur]
    arc: ultras
    tags: [ultras, tribunes]
    speaker: gege
    tone: strategique
    text: "Gégé tend son écharpe par-dessus la main courante, le blason vers toi : « Les autres partent pour des valises. Toi, tu es d'ici : embrasse-le devant la Nord. Ou tu prends les billets ? »"
    left:
      label: "J'embrasse le blason"
      effects: {tribunes: "+++", caisse: "-", relation: {gege: 1}, set: [blason_embrasse], react: [ { card: co.re.gege_decoupe_mur, if: "seen('co.re.gege_decoupe_1987')", chance: 0.5 }, { card: co.re.gege_decoupe_1987, if: "seen('co.re.gege_decoupe')", chance: 0.5 }, { card: co.re.gege_decoupe, chance: 0.5 } ]}
      answer: "Tu l'embrasses, et la Nord chante ton nom. En loge, le président applaudit du bout des doigts ; il calcule ce que vaut un baiser."
    right:
      label: "Je prends les billets"
      effects: {caisse: "+", tribunes: "--"}
      answer: "Tu ne l'embrasses pas ; l'écharpe reste tendue. Il la range, et il ne la range pas vite."

  - id: jp.clause.blason_mercenaire
    roles: [joueur]
    arc: ultras
    tags: [ultras, tribunes]
    speaker: gege
    tone: strategique
    text: "Gégé tend l'écharpe, puis la retire d'un centimètre : « On a lu la Gazette : ta clause a doublé pour que tu restes. On a fait le calcul au local, à la craie. Tu embrasses le blason, ou le chèque ? »"
    left:
      label: "Le blason"
      effects: {tribunes: "++", caisse: "-", relation: {gege: 1}, set: [blason_embrasse]}
      answer: "Tu l'embrasses, et la Nord chante à moitié. La moitié qui chante, c'est celle qui n'a pas lu."
    right:
      label: "Le chèque, honnêtement"
      effects: {caisse: "+", tribunes: "--", relation: {gege: -1}}
      answer: "Il remonte son col. « Au moins c'est dit », lâche-t-il, et il range l'écharpe très lentement."

  # Câblage de la fin `jp_fax` (ch. 10 § 11.3, cause : « fax_rate puis DIRECTION
  # vide »). La variante ne tire pas au sort : le dé ne décide pas d'une fin
  # (charte § 3.2), c'est le bureau vide qui décide.
  - id: jp.clause.fax_dernier
    roles: [joueur]
    arc: mercato
    tags: [mercato, absurde, chaine]
    speaker: josiane
    tone: strategique
    text: "Madame Josiane tient la page coincée par un coin : « 23 h 58, et c'est la trois qui bloque. Le président a dit que c'était la dernière fois qu'il signait pour vous. Je tire, ou je l'appelle ? »"
    left:
      label: "Tirez"
      effects: {direction: "--", tribunes: "-", set: [fax_rate], end: jp_fax}
      answer: "Elle tire ; la page se déchire en biais, sur le numéro de licence. Le fax imprime minuit une."
    right:
      label: "Appelez-le chez lui"
      effects: {direction: "-", caisse: "+", relation: {josiane: 1}, set: [fax_passe]}
      answer: "Il décroche à la neuvième sonnerie. Il signe en pyjama ; il ne le redira jamais."

  - id: jp.clause.fax
    roles: [joueur]
    arc: mercato
    tags: [mercato, absurde]
    speaker: josiane
    tone: strategique
    text: "Tout est éteint au secrétariat, sauf le fax qui crache page par page. Madame Josiane : « 23 h 58, {toi}, et la page trois est coincée, celle des signatures. Je tire dessus, ou j'attends ? »"
    left:
      label: "Tirez"
      effects: {rand: [{p: 0.6, caisse: "++", set: [fax_passe]}, {direction: "--", tribunes: "-", set: [fax_rate]}]}
      answer: "Elle tire ; la page vient, ou elle se déchire. Le fax imprime l'heure, et il ne ment pas."
    right:
      label: "Attendez"
      effects: {rand: [{p: 0.5, caisse: "++", set: [fax_passe]}, {direction: "--", set: [fax_rate]}]}
      answer: "Elle reste devant le fax, bras croisés. La dernière page sort, l'heure imprimée en haut ; elle la lit avant de te la tendre."

  - id: jp.clause.fax_mail
    roles: [joueur]
    arc: mercato
    tags: [mercato, absurde]
    speaker: josiane
    tone: strategique
    text: "Madame Josiane fixe l'écran du secrétariat, sa tasse froide : « Le contrat est parti sur le serveur de la Ligue à 23 h 58. Depuis, l'écran dit « en attente ». On rappelle, ou on attend ? »"
    left:
      label: "On rappelle"
      effects: {rand: [{p: 0.6, caisse: "++", set: [fax_passe]}, {direction: "--", tribunes: "-", set: [fax_rate]}]}
      answer: "Elle rappelle ; quelqu'un décroche, ou pas. L'horodatage, lui, ne discute pas."
    right:
      label: "On attend"
      effects: {rand: [{p: 0.5, caisse: "++", set: [fax_passe]}, {direction: "--", set: [fax_rate]}]}
      answer: "Elle garde les yeux sur l'écran. Il finit par changer ; elle lit la ligne deux fois avant de te la dire."
