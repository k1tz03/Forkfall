# Cartes de l'intrigue rituelle « Les trois conseils de Gigi »
# (arc jp.conseils_gigi) — bible ch. 10 § 6.10. Un conseil par saison, dans
# l'ordre : la tribune, l'agent, le genou, puis « encore une ». Vecchio dit
# {toi} (« petit » tant qu'il t'aime) et pèle toujours la même orange.
# Aucune carte `once` : c'est un rituel, il revient.
cards:
  - id: jp.gigi.tribune
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, tribunes]
    speaker: vecchio
    tone: leger
    text: "Vecchio pèle une orange d'un seul ruban, sur le banc vide : « Premier conseil, {toi}. Une tribune pleine tue aussi bien qu'une vide ; c'est juste plus long. Tu le notes, ou tu attends de voir ? »"
    left:
      label: "Je le note"
      effects: {tribunes: "-", vestiaire: "+", var: {gigi_conseils: "+1"}}
      answer: "Tu le notes. Il te tend un quartier, et en garde deux pour Mamie Paulette, tribune Est, comme à chaque mi-temps."
    right:
      label: "J'attends de voir"
      effects: {tribunes: "+", var: {gigi_conseils: "+1"}}
      answer: "Tu attends ; elle se remplit, elle chante ton nom. Le soir où elle le siffle, il est sur le banc, et il ne dit rien."

  - id: jp.gigi.tribune_age
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: vecchio
    tone: leger
    text: "Vecchio pèle son orange, assis sur la glacière du kiné : « Premier conseil, {toi}, et à ton âge le dernier passe devant : quand le genou parle, tu te tais. Tu l'écoutes, lui, ou ton agent ? »"
    left:
      label: "Le genou"
      effects: {force: 1, tribunes: "-", var: {gigi_conseils: "+1"}}
      answer: "Tu l'écoutes. Il pèle l'orange en une fois, comme d'habitude ; c'est sa façon d'approuver."
    right:
      label: "L'agent"
      effects: {caisse: "+", var: {gigi_conseils: "+1"}}
      answer: "Tu écoutes l'agent. Gigi range l'orange dans sa poche sans la finir ; il la finira seul, sur le parking."

  - id: jp.gigi.agent
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, agents]
    speaker: vecchio
    tone: leger
    text: "Vecchio défait le nœud de son gant, le refait : « Deuxième conseil : l'agent est ton employé, pas ton père. J'ai vu un gars payer la couronne du sien. Tu lui dis non une fois cette saison ? »"
    left:
      label: "Une fois, pour voir"
      effects: {relation: {fardelli: -1}, direction: "+", set: [gigi_non_agent], var: {gigi_conseils: "+1"}}
      answer: "Tu dis non sur un détail. Il le note, et toi aussi."
    right:
      label: "Jamais, il sait mieux"
      effects: {caisse: "+", relation: {fardelli: 1}, var: {gigi_conseils: "+1"}}
      answer: "Tu ne dis pas non. Gigi resserre le nœud de son gant, trop fort, et le laisse comme ça."

  - id: jp.gigi.genou
    roles: [joueur]
    arc: corps
    tags: [vestiaire]
    speaker: vecchio
    tone: strategique
    text: "Sur la table d'à côté, Vecchio garde un sac de glace sur le genou : « Troisième conseil, et après je n'en ai plus : le genou a toujours raison. Tu l'écoutes cette année, ou l'année prochaine ? »"
    left:
      label: "Cette année"
      effects: {force: 2, tribunes: "-", set: [gigi_genou_ecoute], var: {gigi_conseils: "+1"}}
      answer: "Tu lèves le pied une semaine. Le genou dit merci ; il ne le dit qu'une fois."
    right:
      label: "L'année prochaine"
      effects: {tribunes: "+", force: -1, var: {gigi_conseils: "+1"}}
      answer: "L'année prochaine, il te le redira. Autrement."

  - id: jp.gigi.encore_une
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: vecchio
    tone: leger
    text: "« Plus de conseils, {toi}, je les ai tous donnés ; alors une question : je raccroche cette fois, ou j'en fais encore une ? Toi tu me vois jouer, dis-moi. »"
    left:
      label: "Encore une, Gigi"
      effects: {vestiaire: "++", tribunes: "+", relation: {vecchio: 1}, set: [gigi_encore_une], react: [ { card: co.re.vecchio_garde_eau, if: "seen('co.re.vecchio_garde_casier')", chance: 0.6 }, { card: co.re.vecchio_garde_casier, if: "seen('co.re.vecchio_garde')", chance: 0.6 }, { card: co.re.vecchio_garde, chance: 0.6 } ]}
      answer: "Il rentre ; il jouera dix matchs. Il en arrêtera trois de trop, et un d'assez."
    right:
      label: "Raccroche, on t'aime"
      effects: {vestiaire: "+", direction: "+", relation: {vecchio: 1}, set: [gigi_staff]}
      answer: "Il raccroche, et revient le lundi en survêtement d'entraîneur des gardiens. Le survêtement, il l'a acheté lui-même."

  - id: jp.gigi.orange
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, absurde]
    speaker: vecchio
    tone: leger
    text: "À la mi-temps, Vecchio pèle son orange d'un seul ruban, comme depuis 1971 : « C'est un gardien de Nerville qui m'a appris. Tu veux un quartier, ou savoir ce qu'il est devenu ? »"
    left:
      label: "Un quartier"
      effects: {vestiaire: "+", relation: {vecchio: 1}}
      answer: "Tu prends le quartier. Il ne parle pas du gardien de Nerville ; il range la peau entière dans sa poche."
    right:
      label: "Ce qu'il est devenu"
      effects: {vestiaire: "+", tribunes: "-"}
      answer: "Il raconte 1971, un gardien de trente-neuf ans qui pelait les oranges et refusait d'arrêter. Il s'arrête avant la fin."

  # Deuxième saison du rituel : la même orange, mais on sait déjà la fin.
  - id: jp.gigi.orange_deux
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, absurde]
    speaker: vecchio
    tone: leger
    text: "Vecchio te tend l'orange et le couteau à la mi-temps, comme on tend des gants : « Un an que tu me regardes faire, {toi}. Cette fois, c'est toi qui la pèles, d'un seul ruban. Ou je m'y colle ? »"
    left:
      label: "Je la pèle"
      effects: {vestiaire: "+", relation: {vecchio: 1}}
      answer: "Tu casses le ruban au tiers. Il ne dit rien ; il ramasse les bouts et les mange."
    right:
      label: "Vas-y, toi"
      effects: {vestiaire: "+", tribunes: "-"}
      answer: "Il la pèle en un morceau, encore. Il te tend la peau entière, comme un trophée."

  - id: jp.gigi.orange_gants
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: vecchio
    tone: leger
    text: "Vecchio, en survêtement d'entraîneur des gardiens, te lance ses gants jaunes : « Je ne conseille plus que les gardiens. Toi, tu les as toujours regardés, ces gants. Tu les essaies, une fois ? »"
    left:
      label: "Une fois"
      effects: {vestiaire: "+", tribunes: "+", relation: {vecchio: 1}}
      answer: "Tu essaies, et tu arrêtes un tir. Il dit « bon, c'est tout »."
    right:
      label: "Jamais"
      effects: {vestiaire: "+"}
      answer: "Il rit, sans bruit, et remet les gants sous son bras. Personne d'autre ne les a jamais enfilés."

  - id: jp.gigi.comptoir
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, absurde]
    speaker: vecchio
    tone: leger
    text: "À la buvette, Vecchio aligne cinq verres d'eau sur le zinc, un par retraite annoncée : « Cinq fois j'ai dit « j'arrête », {toi}. Une fois, je le pensais. Tu t'assois, ou tu rentres dormir ? »"
    left:
      label: "Je m'assois avec toi"
      effects: {vestiaire: "+", tribunes: "-", relation: {vecchio: 1}, outcome: ecoute}
      answer: "Vous videz les cinq verres ; il raconte les cinq retraites. La quatrième était la vraie, et il ne le dit qu'à toi."
    right:
      label: "Je rentre dormir"
      effects: {direction: "+", force: 1, outcome: ignore}
      answer: "Tu rentres. Il reste au comptoir avec ses cinq verres ; le patron éteint la salle autour de lui."

  # Deuxième saison du rituel au comptoir : il a ajouté une retraite à sa liste.
  - id: jp.gigi.comptoir_encore
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, absurde]
    speaker: vecchio
    tone: leger
    text: "Vecchio ajoute un sixième verre d'eau au bout de la rangée : « Celui-là, c'est juin dernier. J'ai dit « j'arrête » devant le président, et je suis revenu en août. Tu t'assois, ou tu rentres ? »"
    left:
      label: "Je m'assois"
      effects: {vestiaire: "+", tribunes: "-", relation: {vecchio: 1}, outcome: ecoute}
      answer: "Vous videz les six verres. Il raconte la sixième deux fois ; la deuxième fois, il rit, et toi aussi."
    right:
      label: "Je rentre"
      effects: {direction: "+", force: 1, outcome: ignore}
      answer: "Tu rentres. Par la vitre, tu le vois repousser le premier verre du bout des doigts, comme pour l'effacer."

  - id: jp.gigi.orange_encore
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, absurde]
    speaker: vecchio
    tone: leger
    text: "Vecchio pèle son orange plus lentement que d'habitude, le genou bandé : « Encore une, je l'ai dit, et depuis tout le monde me demande si je suis sûr. Toi aussi, tu doutes, {toi} ? »"
    left:
      label: "Je ne doute pas"
      effects: {vestiaire: "+", tribunes: "+", relation: {vecchio: 1}}
      answer: "Il pèle l'orange en un morceau, comme toujours. Il en garde la moitié cette fois ; il dit que c'est pour plus tard."
    right:
      label: "Un peu, oui"
      effects: {vestiaire: "+", direction: "+"}
      answer: "Il hausse les épaules. « Moi aussi », dit-il, et il enfile les gants quand même."
