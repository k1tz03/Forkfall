# Cartes de l'intrigue « Le contrat d'image » (arc jp.contrat_image) —
# bible ch. 10 § 6.4. Le cousin des îles est une voix sans portrait : c'est
# Fardelli qui le présente, comme un plat. Josiane tient le rôle de l'agente
# qui compte (Solvang dans la bible) : elle a vu passer les deux factures.
cards:
  - id: jp.image.cousin
    roles: [joueur]
    arc: agents
    tags: [agents, caisse, scandale]
    speaker: fardelli
    tone: leger
    text: "Au restaurant, Fardelli présente comme un plat un cousin que tu n'as jamais vu : « Il a monté une société aux îles pour ton image. Zéro impôt. Dix-neuf ans et une image : tu signes sans lire ? »"
    left:
      label: "Je signe"
      effects: {caisse: "++", relation: {fardelli: 1}, set: [offshore], outcome: signe, react: jp.re.camille_montre}
      answer: "Tu signes ; le cousin range le dossier bleu. La semaine suivante, il a une montre neuve au poignet."
    right:
      label: "Je paie mes impôts"
      effects: {caisse: "-", tribunes: "+", direction: "+", set: [image_propre], outcome: refuse}
      answer: "Le cousin repart aux îles. Fardelli paie l'addition ; il la garde, pour la déduire."

  - id: jp.image.cousin_frere
    roles: [joueur]
    arc: agents
    tags: [agents, vestiaire, caisse]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut lit le papier de son frère, la mâchoire qui bouge : « Même société aux îles que ton agent, moins cher. Moi, il m'a coûté un contrat, en 88. Tu signes avec lui, ou tu restes chez le tien ? »"
    left:
      label: "Avec ton frère"
      effects: {caisse: "++", relation: {brehaut: 1, fardelli: -2}, set: [offshore], outcome: signe, react: jp.re.camille_montre}
      answer: "Le frère vend moins cher. Il vend quand même."
    right:
      label: "Je reste chez le mien"
      effects: {vestiaire: "-", relation: {brehaut: -1}, set: [image_propre], outcome: refuse}
      answer: "Titi replie le papier de son frère. Le groupe fait la passe, un peu moins."

  - id: jp.image.cousin_encore
    roles: [joueur]
    arc: agents
    tags: [agents, caisse, scandale]
    speaker: fardelli
    tone: leger
    text: "Fardelli fait glisser un dossier vert, cette fois : « Ton cousin a remonté une société ailleurs, plus propre, dit-il. Il a gardé sa montre. Tu signes une deuxième fois, ou une t'a suffi ? »"
    left:
      label: "Je signe encore"
      effects: {caisse: "++", relation: {fardelli: 1}, set: [offshore], outcome: signe, react: jp.re.camille_montre}
      answer: "Tu signes. Le cousin a déjà la deuxième montre ; il te montre la première, par nostalgie."
    right:
      label: "Une fois m'a suffi"
      effects: {caisse: "-", tribunes: "+", direction: "+", set: [image_propre], outcome: refuse}
      answer: "Fardelli hausse les épaules. Il paie l'addition ; il la garde, comme la dernière fois."

  - id: jp.image.montre
    roles: [joueur]
    arc: famille
    tags: [famille, caisse]
    speaker: camille
    tone: leger
    text: "Camille pose un relevé plié en deux à côté du pain : « Ton cousin portait dimanche une montre à trois mois de ton salaire. Tu lui demandes d'où elle vient, ou tu ne veux pas savoir ? »"
    left:
      label: "Je lui demande"
      effects: {caisse: "-", direction: "+", relation: {camille: 1}, set: [camille_a_lu], outcome: camille}
      answer: "Tu demandes ; le cousin dit « les frais ». Tu régularises la moitié, l'autre est déjà partie."
    right:
      label: "Je ne veux pas savoir"
      effects: {caisse: "+", relation: {camille: -1}}
      answer: "Tu ne sais pas ; elle, si. Elle range le relevé dans un tiroir qui ferme à clé."

  - id: jp.image.double_mandat
    roles: [joueur]
    arc: agents
    tags: [agents, direction]
    speaker: josiane
    tone: strategique
    text: "Madame Josiane aligne deux factures, même date, même tampon : « Votre agent facture le club, {toi}, et vous aussi, pour le même contrat d'image. Vous en changez, ou vous restez avec lui ? »"
    left:
      label: "J'en change"
      effects: {direction: "+", caisse: "-", relation: {josiane: 1, fardelli: -2}, set: [sans_agent], clear: [agent_fardelli], react: jp.re.fardelli_amitie}
      answer: "Elle agrafe les deux factures ensemble. Fardelli l'apprend le soir même ; il appelle Josiane, pas toi."
    right:
      label: "Je reste avec lui"
      effects: {caisse: "+", relation: {josiane: -1}}
      answer: "Elle range les factures dans deux dossiers différents. Elle en garde une photocopie ; par habitude."

  - id: jp.image.fisc
    roles: [joueur]
    arc: scandale
    tags: [scandale, presse, risk:direction]
    speaker: meneche
    tone: strategique
    text: "Massenet tient un dossier fermé, une île dessinée dessus : « Les îles ont fuité : votre nom, votre image, la montre de votre cousin. Je publie jeudi. Vous régularisez avant, ou vous niez ? »"
    left:
      label: "Je régularise"
      effects: {caisse: "--", direction: "-", clear: [offshore], set: [regularise]}
      answer: "Tu paies ; le cousin garde la montre. Massenet garde le dossier, ne publie pas, et note."
    right:
      label: "Je nie"
      effects: {tribunes: "--", direction: "--", caisse: "-", relation: {meneche: -1}}
      answer: "Tu nies, et il publie. Le fisc lit le journal ; il lit vite."

  - id: jp.image.fisc_moitie
    roles: [joueur]
    arc: scandale
    tags: [scandale, presse, risk:direction]
    speaker: meneche
    tone: strategique
    text: "Massenet ouvre le dossier au milieu : « La moitié est régularisée ; quelqu'un chez vous sait lire un relevé. L'autre dort aux îles. Vous régularisez le reste, ou vous niez la moitié ? »"
    left:
      label: "Je régularise le reste"
      effects: {caisse: "--", direction: "-", clear: [offshore], set: [regularise]}
      answer: "Tu paies le reste. Il referme le dossier ; il ne publie pas ; il note qui avait lu en premier."
    right:
      label: "Je nie la moitié"
      effects: {tribunes: "--", direction: "-", caisse: "-", relation: {meneche: -1}}
      answer: "Tu nies la moitié, il publie la moitié. C'est celle qui a une photo."

  # Le compte a débordé : nier, c'est la fin (aucun aléa, c'est la caisse).
  - id: jp.image.fisc_compte_plein
    roles: [joueur]
    arc: scandale
    tags: [scandale, presse, risk:caisse]
    speaker: meneche
    tone: strategique
    text: "Massenet pose un relevé photocopié, une colonne surlignée en jaune : « Votre compte des îles pèse plus lourd que le budget de votre club. Le fisc l'aura jeudi. Vous régularisez, ou vous niez ? »"
    left:
      label: "Je régularise"
      effects: {caisse: "---", direction: "-", clear: [offshore], set: [regularise]}
      answer: "Tu paies, beaucoup. Le cousin garde la montre ; Massenet garde le dossier, fermé."
    right:
      label: "Je nie"
      effects: {end: jp_panama}
      answer: "Tu nies ; il publie le relevé, colonne par colonne. Le fisc lit le journal, et il lit vite."
