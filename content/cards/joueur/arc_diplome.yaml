# Cartes de l'intrigue « Le diplôme » (arc jp.diplome_joueur) — bible ch. 10
# § 6.13. La transition vers le banc devient une intrigue en cinq temps :
# l'adjoint pose la question, le mentor tient le stage, le président ne veut
# pas d'un joueur qui étudie, la Fédération tamponne, et le capitaine passe
# le même diplôme la même année.
cards:
  - id: jp.diplome.vukic
    roles: [joueur]
    arc: formation
    tags: [formation, direction]
    speaker: vukic
    tone: strategique
    text: "Sur le banc vide de la réserve, Vukić tapote la place à côté : « Je t'ai chronométré sur les replis. Tu as perdu un mètre. La réserve n'a pas d'entraîneur. Tu passes ton diplôme cet été ? »"
    left:
      label: "Je le passe cet été"
      effects: {direction: "+", vestiaire: "+", relation: {vukic: 1}, set: [diplome_en_cours]}
      answer: "Il te donne le formulaire. Il l'avait dans le cahier depuis mars."
    right:
      label: "Encore un an sans papier"
      effects: {tribunes: "+", direction: "-", set: [diplome_reporte]}
      answer: "Il range le formulaire. Il en aura un l'an prochain ; il en a toujours un."

  - id: jp.diplome.clow
    roles: [joueur]
    arc: formation
    tags: [formation]
    speaker: clow
    tone: leger
    text: "Au bar d'en face, Corven pousse un tabouret vers toi du pied, son verre d'eau plein à ras bord : « Le stage, c'est chez moi. Lundi, huit heures. Tu viens à sept, ou à huit comme les autres ? »"
    left:
      label: "À sept"
      effects: {direction: "+", relation: {clow: 1}, set: [clow_stage]}
      answer: "Tu es là à sept ; il est là depuis six. Il a mis ta chaise devant."
    right:
      label: "À huit, comme tout le monde"
      effects: {vestiaire: "+", relation: {clow: -1}}
      answer: "Tu arrives à huit ; il a commencé. Il ne recommence pas."

  - id: jp.diplome.clow_deja
    roles: [joueur]
    arc: formation
    tags: [formation]
    speaker: clow
    tone: leger
    text: "Corven fait rouler son chewing-gum, l'air de ne pas te reconnaître : « Toi, tu es déjà venu à sept heures, {toi}. Cette fois, j'ai mis deux chaises devant. Lundi, huit heures, comme d'habitude ? »"
    left:
      label: "Comme d'habitude"
      effects: {direction: "+", relation: {clow: 1}, set: [clow_stage]}
      answer: "Il a mis deux chaises. La deuxième est pour quelqu'un qui n'est pas encore arrivé ; il ne dit pas qui."
    right:
      label: "Comme d'habitude"
      effects: {direction: "+", relation: {clow: 1}, set: [clow_stage]}
      answer: "Il a mis deux chaises. La deuxième est pour quelqu'un qui n'est pas encore arrivé ; il ne dit pas qui."

  - id: jp.diplome.clow_ferme
    roles: [joueur]
    arc: formation
    tags: [formation]
    speaker: clow
    tone: strategique
    text: "Corven ne pousse pas le tabouret, cette fois : « J'ai formé quelqu'un qui portait ton nom. Il n'a jamais appelé pour dire merci. Le stage est complet, pour toi. Ailleurs, ou tu attends un an ? »"
    left:
      label: "Ailleurs"
      effects: {direction: "-", caisse: "-", set: [clow_stage_ailleurs]}
      answer: "Tu le passes à la capitale. Personne ne met ta chaise devant."
    right:
      label: "J'attends un an"
      effects: {tribunes: "+", set: [diplome_reporte], outcome: pas_encore}
      answer: "Tu attends. Il t'appelle en octobre, sans raison, pour parler d'un ailier de 1974."

  - id: jp.diplome.aulard
    roles: [joueur]
    arc: direction
    tags: [direction, formation]
    speaker: aulard
    tone: strategique
    text: "Vaubourg retourne ton formulaire, le lit, le retourne encore : « Un joueur qui étudie pendant la saison pense à après. Moi, je te paie pour maintenant. Tu attends juin, ou c'est le banc ? »"
    left:
      label: "J'attends juin"
      effects: {direction: "++", relation: {aulard: 1}, set: [diplome_juin]}
      answer: "Tu attends juin. Le formulaire reste dans le cahier de Vukić, plié, à la même page."
    right:
      label: "Je le passe, tant pis"
      effects: {direction: "--", tribunes: "-", force: -1, set: [diplome_contre_aulard]}
      answer: "Il te met sur le banc ; tu regardes les matchs en prenant des notes. Vukić les lit, et il corrige."

  - id: jp.diplome.legruet
    roles: [joueur]
    arc: formation
    tags: [formation, arbitrage]
    speaker: legruet
    tone: strategique
    text: "Berthomier lit ton dossier avant de prendre le tampon : « Il est écrit « présent à sept heures », ou « à huit ». Je tamponne les deux, pas pareil. Le papier tout de suite, ou l'oral de juin ? »"
    left:
      label: "Tout de suite"
      effects: {direction: "+", set: [diplome], outcome: diplome}
      answer: "Il tamponne ; le papier est encore chaud. Vukić le range dans le dossier, sur le dessus."
    right:
      label: "L'oral de juin"
      effects: {direction: "-", force: 1, set: [diplome_reporte], outcome: pas_encore}
      answer: "Tu repasses en juin, et tu as le papier en juillet ; Vukić l'avait déjà mis dans le dossier, en blanc."

  - id: jp.diplome.brehaut
    roles: [joueur]
    arc: formation
    tags: [formation, vestiaire]
    speaker: brehaut
    tone: strategique
    text: "Dans le couloir de la Fédération, Bréhaut déplie le même papier que le tien : « Deux diplômés, toi et moi, et une seule réserve. Tu me prends comme adjoint, ou on se présente tous les deux ? »"
    left:
      label: "Tu seras mon adjoint"
      effects: {vestiaire: "++", direction: "+", relation: {brehaut: 1}, set: [brehaut_diplome, brehaut_adjoint, vers_entraineur], outcome: brehaut}
      answer: "Il dit « d'accord ». Il le dit vite ; il y a pensé avant toi."
    right:
      label: "On se présente tous les deux"
      effects: {direction: "-", vestiaire: "-", relation: {brehaut: -1}, set: [brehaut_diplome, brehaut_rival_banc, vers_entraineur], outcome: brehaut}
      answer: "Vous vous présentez. Le président choisit celui qui coûte le moins, et ce n'est pas forcément toi."

  - id: jp.diplome.vukic_encore
    roles: [joueur]
    arc: formation
    tags: [formation, direction]
    speaker: vukic
    tone: strategique
    text: "Vukić rouvre le cahier à la même page, le formulaire toujours plié dedans : « Il n'a pas bougé depuis mars, {toi}. Un premier non, c'est une hésitation. Le deuxième, c'est un choix. »"
    left:
      label: "Alors je le passe"
      effects: {direction: "+", vestiaire: "+", relation: {vukic: 1}, clear: [diplome_reporte], set: [diplome_en_cours]}
      answer: "Il te tend le formulaire, plié en deux depuis mars. Il n'a même pas eu à le chercher."
    right:
      label: "Non. C'est un choix"
      effects: {tribunes: "+", force: 1, set: [diplome_reporte], outcome: pas_encore}
      answer: "Il referme le cahier. Il ne le rouvrira pas cette saison ; il le dit, et il tient parole."
