# Cartes de l'intrigue « L'exil doré » (arc jp.exil_dore) — bible ch. 10 § 6.12.
# Le fonds propose (Ilyas dans la bible : ici Ilyas, même phrase, même
# maquette de stade à toit ouvrant) ; Camille ne suit pas, ou si ; l'agent
# prend dix pour cent de l'or ; le cousin gère le compte depuis les îles.
cards:
  - id: jp.exil.nassir
    roles: [joueur]
    arc: mercato
    tags: [mercato, sponsors]
    speaker: nassir
    tone: strategique
    text: "Dans la loge du sponsor, Ilyas ouvre le toit d'une maquette de stade : « Chez nous, on paie comme l'or, et le niveau reste entre nous. Vous seriez notre meilleure ligne. Vous venez cet été ? »"
    left:
      label: "Je pars pour l'or"
      effects: {caisse: "+++", tribunes: "--", force: -1, set: [exil_dore], club: {change: true, division: 2}, outcome: part}
      answer: "Tu signes ; le stade a un toit. Tu ne verras plus la pluie pendant deux ans ; le genou dit merci, le reste non."
    right:
      label: "Je garde l'ambition"
      effects: {tribunes: "+", direction: "+", set: [or_refuse], outcome: reste, react: {card: jp.re.nassir_reviendrai, chance: 0.6}}
      answer: "Il referme le toit de la maquette. « Je reviendrai », dit-il ; il revient toujours, avec une maquette plus grande."

  - id: jp.exil.nassir_encore
    roles: [joueur]
    arc: mercato
    tags: [mercato, sponsors]
    speaker: nassir
    tone: strategique
    text: "Ilyas pose une maquette plus grande que la dernière, le toit en deux parties : « Vous avez dit non une fois, {toi}. Nous avons attendu ; l'offre a grandi avec la maquette. Cette fois ? »"
    left:
      label: "Cette fois, je pars"
      effects: {caisse: "+++", tribunes: "--", force: -1, set: [exil_dore], club: {change: true, division: 2}, outcome: part}
      answer: "Tu signes, et il t'offre la maquette. Là-bas, le vrai toit s'ouvre en deux temps, sur des tribunes à moitié vides."
    right:
      label: "Toujours pas"
      effects: {tribunes: "+", direction: "+", set: [or_refuse], outcome: reste, react: {card: jp.re.nassir_reviendrai, chance: 0.6}}
      answer: "Il referme le toit. Il ne dit plus « je reviendrai » ; il le fait, c'est tout."

  - id: jp.exil.camille
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: strategique
    text: "Deux billets d'avion sur la table de la cuisine ; Camille n'a rempli que le tien : « Là-bas, quatre heures de décalage et un désert. Je viens six mois pour voir, ou je reste ici avec mon métier ? »"
    left:
      label: "Viens six mois"
      effects: {caisse: "-", relation: {camille: 1}, set: [camille_ici]}
      answer: "Elle vient, puis elle reste. Elle ouvre quelque chose là-bas ; ce n'est pas ce qu'elle voulait, mais c'est à elle."
    right:
      label: "Reste avec ton métier"
      effects: {caisse: "+", relation: {camille: -2}, set: [camille_reste]}
      answer: "Elle reste. Tu appelles à des heures qui ne sont bonnes pour personne, et le téléphone sonne souvent dans le vide."

  - id: jp.exil.dix_pour_cent
    roles: [joueur]
    arc: agents
    tags: [agents, caisse]
    speaker: fardelli
    tone: leger
    text: "Fardelli, en costume clair, te tend une facture : « Ma part sur l'offre du désert, prise ou non, c'est notre contrat. Et j'ai fait poser la climatisation chez toi. Tu la paies, ou je la déduis ? »"
    left:
      label: "Je la paie"
      effects: {caisse: "-", relation: {fardelli: 1}}
      answer: "Tu paies. Il a froid chez toi ; il vient souvent."
    right:
      label: "Déduis-la"
      effects: {caisse: "+", relation: {fardelli: -1}, set: [gigi_non_agent]}
      answer: "Il déduit. Il n'a plus froid chez toi ; il ne vient plus."

  - id: jp.exil.climatisation
    roles: [joueur]
    arc: caisse
    tags: [caisse, absurde]
    speaker: nassir
    tone: leger
    text: "Ilyas, au téléphone, d'une voix égale : « Le climatiseur livré chez vous figure dans vos avantages, et un avantage s'amortit sur cinq ans. Vous le laissez tourner la nuit, ou vous économisez ? »"
    left:
      label: "Il tourne la nuit"
      effects: {caisse: "-", force: 1}
      answer: "Il tourne, et tu dors. Le relevé arrive chez Almadis avant d'arriver chez toi ; c'est la première ligne du budget que tu comprends."
    right:
      label: "J'économise"
      effects: {caisse: "+", force: -1, tribunes: "-"}
      answer: "Tu économises, et tu dors mal. À l'entraînement de sept heures, ça se voit."

  # Câblage de la fin `jp_exil` (ch. 10 § 6.12 : « si tu pars et que le compte
  # déborde, Parti pour l'or tombe au Carrefour suivant »). La porte a longtemps
  # été pourvue sur le papier seulement : `gauges.caisse >= 80` n'était jamais
  # vraie (la caisse part à 60, l'or la monte une fois de 18 puis elle dérive) et
  # la sortie gauche, avec un `caisse: ++` par-dessus une caisse déjà haute,
  # était systématiquement écartée par le joueur simulé. La garde lit maintenant
  # une caisse de fin de contrat OU la société du cousin déjà ouverte ailleurs
  # (`offshore`, posé par jp.contrat_image), et la sortie gauche paie en
  # vestiaire et en tribunes plutôt qu'en caisse.
  - id: jp.exil.cousin_compte_plein
    roles: [joueur]
    arc: caisse
    tags: [caisse, scandale, chaine]
    speaker: fardelli
    tone: strategique
    text: "Fardelli, au téléphone, sa gourmette contre le combiné : « Le compte des îles a débordé cette nuit ; ton cousin s'est offert une troisième montre. Tu signes trois ans de plus, ou tu rentres jouer ? »"
    left:
      label: "Trois ans de plus"
      effects: {caisse: "+", tribunes: "-", vestiaire: "-", set: [compte_cousin, offshore], outcome: cousin, end: jp_exil}
      answer: "Tu signes. Le niveau reste entre eux, le compte reste rond, et personne au pays ne connaît ton numéro."
    right:
      label: "Je rentre jouer"
      effects: {caisse: "--", direction: "+", tribunes: "+", clear: [offshore], outcome: cousin}
      answer: "Tu rentres, pour un tiers du salaire, dans un stade froid et plein. Le cousin garde la montre."

  # Câblage de la fin `jp_agent` (ch. 10 § 11.3, cause : imposture,
  # `agent_fardelli` et Fardelli au plus bas). Le palier −3 de l'agent est une
  # carte partagée avec l'entraîneur (`on_relation` n'accepte qu'un id par
  # seuil) : la variante joueur vit ici, à l'étape où il prend ses dix pour cent.
  - id: jp.exil.vendu_en_dormant
    roles: [joueur]
    arc: agents
    tags: [agents, mercato, chaine]
    speaker: fardelli
    tone: strategique
    text: "Le téléphone sonne à six heures. Fardelli, guilleret : « On a signé cette nuit, pendant que tu dormais : un club du désert, qui paie mieux. Tu relis le contrat, ou tu fais ta valise ? »"
    left:
      label: "Montre-moi ma signature"
      effects: {direction: "--", caisse: "-", enemy: [fardelli], end: jp_agent}
      answer: "Elle est là, en bas de la page quatre, et tu la reconnais. Personne ne se souvient de l'avoir vue faire ; toi non plus."
    right:
      label: "Je ne fais pas ma valise"
      effects: {direction: "-", caisse: "--", tribunes: "+", relation: {fardelli: -1}, set: [or_refuse], outcome: reste}
      answer: "Tu restes ; il annule en soupirant, et facture l'annulation. Il ne t'appelle plus le dimanche."

  - id: jp.exil.cousin
    roles: [joueur]
    arc: caisse
    tags: [caisse, scandale]
    speaker: fardelli
    tone: strategique
    text: "« Ton cousin met l'or sur le compte des îles, à côté de l'image ; c'est plus simple pour tout le monde. On continue, ou tu veux un compte ici, avec des impôts ? »"
    left:
      label: "On continue"
      effects: {caisse: "++", set: [compte_cousin, offshore], outcome: cousin, react: [ { card: co.re.camille_journal_frigo, if: "!flag('divorce') && seen('co.re.camille_journal_ecole')", chance: 0.5 }, { card: co.re.camille_journal_ecole, if: "!flag('divorce') && seen('co.re.camille_journal')", chance: 0.5 }, { card: co.re.camille_journal, chance: 0.5 } ]}
      answer: "Le cousin continue, et s'achète une deuxième montre. Il t'en envoie une ; elle est belle, et elle est à ton nom."
    right:
      label: "Un compte ici"
      effects: {caisse: "-", direction: "+", clear: [offshore]}
      answer: "Tu ouvres un compte, et le cousin est vexé. Il garde la montre ; il l'avait « avancée »."
