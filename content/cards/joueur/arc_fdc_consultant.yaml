# Cartes de l'intrigue « Le consultant du dimanche » (arc jp.consultant) —
# bible ch. 10 § 6.17. Il joue le samedi, il juge le dimanche. Le fauteuil vide
# est celui du chroniqueur ; le micro du direct est tendu par la presse.
cards:
  - id: jp.consultant.plateau
    roles: [joueur]
    arc: presse
    tags: [presse]
    speaker: meneche
    tone: strategique
    text: "Au studio de la télé régionale, Massenet tapote l'accoudoir d'un fauteuil vide : « Le dimanche soir, à côté de moi, {toi}. On paie bien pour juger les autres. Ça vous tente ? »"
    left:
      label: "Je prends le fauteuil"
      effects: {tribunes: "+", vestiaire: "-", caisse: "+", set: [consultant], outcome: accepte}
      answer: "Tu juges. Tu es bon. C'est le problème."
    right:
      label: "Je reste sur le terrain"
      effects: {vestiaire: "+", relation: {meneche: -1}, outcome: refuse}
      answer: "Il garde le fauteuil vide. Il le filme vide le dimanche suivant ; c'est une menace."

  - id: jp.consultant.aulard
    roles: [joueur]
    arc: direction
    tags: [direction, presse]
    speaker: aulard
    tone: strategique
    text: "Vaubourg montre du menton la télé éteinte de son bureau : « Tu juges mes joueurs le dimanche. Je ne regarde pas ; Josiane me raconte. Tu arrêtes, ou tu ne joues plus le samedi ? »"
    left:
      label: "J'arrête"
      effects: {direction: "++", caisse: "-", clear: [consultant], react: co.re.josiane_a_lu}
      answer: "Tu arrêtes. Le dimanche suivant, Massenet l'annonce à l'antenne, deux fois, avec ton nom."
    right:
      label: "Je continue"
      effects: {direction: "--", tribunes: "++", set: [consultant_assume]}
      answer: "Tu continues. Tu joues moins. Tu juges mieux."

  - id: jp.consultant.vukic
    roles: [joueur]
    arc: direction
    tags: [direction, formation]
    speaker: vukic
    tone: strategique
    text: "Dans le vestiaire vide, Vukić lit une de tes phrases du dimanche, sans intonation : « Je note ce que tu dis à l'antenne, {toi}. Une fois sur deux, tu as raison. Tu me montres tes notes ? »"
    left:
      label: "Je te les montre"
      effects: {relation: {vukic: 1}, vestiaire: "+", set: [notes_partagees]}
      answer: "Vous comparez. Vous êtes d'accord une fois sur deux ; c'est beaucoup."
    right:
      label: "Je les garde pour l'antenne"
      effects: {relation: {vukic: -1}, tribunes: "+"}
      answer: "Il ferme le cahier. Il regarde quand même, chaque dimanche ; il prend des notes sur toi."

  # Câblage de la fin ∃ `jp_consultant` (ch. 10 § 6.17 : « Carrefour si
  # age >= 33 »). La fin existait sans porte : aucune carte ne la citait.
  - id: jp.consultant.dimanche_adieu
    roles: [joueur]
    arc: presse
    tags: [presse, moment, chaine]
    speaker: meneche
    tone: strategique
    text: "Massenet, carnet fermé, à la sortie du studio : « La chaîne vous offre le fauteuil à l'année. Le samedi, vous jouez un quart d'heure. On ne tient pas longtemps les deux. Vous gardez lequel ? »"
    left:
      label: "Je garde le dimanche"
      effects: {tribunes: "+", direction: "-", set: [consultant, consultant_assume], outcome: accepte, end: jp_consultant}
      answer: "Tu gardes le fauteuil. Le samedi, on te jugeait ; le dimanche, c'est toi qui juges, et Vaubourg éteint la télé."
    right:
      label: "Je garde le samedi"
      effects: {tribunes: "-", vestiaire: "+", force: 2, parole: 1, outcome: refuse}
      answer: "Tu rends le fauteuil. Ils le donnent à un ancien gardien ; il parle moins bien et il a raison plus souvent."

  - id: jp.consultant.dimanche
    roles: [joueur]
    arc: presse
    tags: [presse, moment]
    speaker: lea
    tone: strategique
    text: "Léa t'attend à la sortie du studio, carnet ouvert : « En direct, vous avez dit que votre propre coach « joue trop bas ». C'est passé. Je l'imprime demain : un mot pour lui, ou un mot pour vous ? »"
    left:
      label: "Pour lui : pardon"
      effects: {direction: "+", tribunes: "-", parole: 1}
      answer: "Ton pardon est imprimé. Il le lit. Samedi, il ne te met pas ; c'est sa réponse."
    right:
      label: "Pour moi : j'assume"
      effects: {tribunes: "++", direction: "--", set: [consultant_assume], outcome: accepte}
      answer: "Tu assumes. Le fauteuil du dimanche t'attend à l'année ; il est confortable."

  - id: jp.consultant.dimanche_notes
    roles: [joueur]
    arc: presse
    tags: [presse, moment]
    speaker: lea
    tone: strategique
    text: "Léa, au téléphone de L'Écho : « Vukić m'a dit ce matin qu'il était d'accord avec vous « une fois sur deux ». C'est la dernière phrase de mon article. Vous répondez, ou je le laisse conclure ? »"
    left:
      label: "Je le laisse conclure"
      effects: {vestiaire: "+", relation: {vukic: 1}}
      answer: "L'article finit sur sa phrase. Le lundi, il la découpe et la colle dans son cahier, à ta page."
    right:
      label: "Je réponds"
      effects: {tribunes: "++", relation: {vukic: -1}, set: [consultant_assume], outcome: accepte}
      answer: "Ta phrase prend la place de la sienne, en dernière ligne. Il ne te la reproche pas ; il la recopie."
