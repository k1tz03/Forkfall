# Cartes de l'intrigue partagée « Le derby » (arc co.derby), versant joueur —
# bible ch. 10 § 6.23 ; le ch. 11 écrit le versant banc. Le seul match que la
# ville regarde deux fois. Rejouable : aucune de ces cartes n'est `once`.
cards:
  - id: co.derby.semaine
    roles: [joueur]
    arc: tribunes
    tags: [ultras, tribunes]
    speaker: gege
    tone: leger
    text: "Gégé peint une bâche à même le sol du local : « Dimanche, c'est le derby, {toi}. La ville le regarde deux fois : le jour même, et toute l'année d'après. Tu viens peindre jeudi ? »"
    left:
      label: "Jeudi, au local"
      effects: {tribunes: "++", force: -1, set: [ami_ultras]}
      answer: "Tu peins. Tu as de la peinture sur les mains dimanche ; le rival la voit."
    right:
      label: "Je reste concentré"
      effects: {force: 1, tribunes: "-"}
      answer: "Tu ne viens pas. Le tifo est beau ; ton nom n'y est pas."

  - id: co.derby.semaine_encore
    roles: [joueur]
    arc: tribunes
    tags: [ultras, tribunes]
    speaker: gege
    tone: leger
    text: "Gégé te tend un pinceau sec, celui de l'an dernier : « Au coup d'envoi, l'an passé, tu avais encore de la peinture sur les mains. La photo est au-dessus du bar. Jeudi, on refait la bâche ? »"
    left:
      label: "Je repeins"
      effects: {tribunes: "++", force: -1, relation: {gege: 1}}
      answer: "Vous repeignez la même bâche. Elle est plus lourde chaque année ; personne ne le dit."
    right:
      label: "J'ai déjà donné"
      effects: {force: 1, tribunes: "-", relation: {gege: -1}}
      answer: "Il hausse les épaules. La bâche sort quand même ; il a repris ton pinceau."

  - id: co.derby.match
    roles: [joueur]
    arc: tribunes
    tags: [moment, tribunes]
    speaker: vecchio
    tone: strategique
    text: "Dans le tunnel, Vecchio enfile ses gants un doigt après l'autre : « Mon premier derby, j'en ai pris quatre. C'est le seul dont on me parle encore. Tu joues pour marquer, ou pour ne pas perdre ? »"
    left:
      label: "Pour marquer"
      effects: {tribunes: "++", rand: [{p: 0.5, set: [derby_gagne], outcome: gagne}, {set: [derby_perdu], tribunes: "-", outcome: perdu}]}
      answer: "Tu joues devant. La ville s'en souviendra, dans un sens ou dans l'autre."
    right:
      label: "Pour ne pas perdre"
      effects: {vestiaire: "+", rand: [{p: 0.65, set: [derby_gagne], outcome: gagne}, {set: [derby_perdu], outcome: perdu}]}
      answer: "Tu joues derrière. Il approuve d'un signe de gant : c'est comme ça qu'on n'en prend pas quatre."

  - id: co.derby.lendemain
    roles: [joueur]
    arc: famille
    tags: [famille, presse]
    speaker: camille
    tone: leger
    text: "Camille a L'Écho ouvert sur la table de la cuisine, le doigt sur le titre du derby : « La porte a claqué à trois heures du matin, {toi}. Gagné ou perdu, je ne sais pas. Tu racontes, ou je lis ? »"
    left:
      label: "Je raconte"
      effects: {relation: {camille: 1}, tribunes: "-", react: [ { card: co.re.camille_journal_frigo, if: "!flag('divorce') && seen('co.re.camille_journal_ecole')" }, { card: co.re.camille_journal_ecole, if: "!flag('divorce') && seen('co.re.camille_journal')" }, { card: co.re.camille_journal } ]}
      answer: "Elle écoute. Elle a déjà lu ; elle écoute quand même."
    right:
      label: "Lis le journal"
      effects: {relation: {camille: -1}, force: 1}
      answer: "Elle lit. Le journal dit « tête haute ». Elle demande à qui ; tu ne sais pas."

  - id: co.derby.lendemain_local
    roles: [joueur]
    arc: tribunes
    tags: [ultras, presse]
    speaker: gege
    tone: leger
    text: "Gégé, au téléphone du local, des voix derrière lui : « Le lendemain d'un derby, on relit L'Écho tous ensemble, ligne par ligne, avec les notes. La tienne arrive bientôt. Tu viens l'entendre ? »"
    left:
      label: "Je viens l'entendre"
      effects: {tribunes: "+", vestiaire: "-", relation: {gege: 1}}
      answer: "Tu écoutes Gégé lire ta propre note. Elle est basse ; personne ne conteste."
    right:
      label: "Je laisse dire"
      effects: {vestiaire: "+", tribunes: "-"}
      answer: "Ils lisent sans toi. Le local garde la page punaisée jusqu'au match retour."

  - id: co.derby.ancien
    roles: [joueur]
    arc: tribunes
    tags: [ultras, moment]
    speaker: gege
    tone: strategique
    text: "Derrière la grille, Gégé tient ton nom découpé en deux morceaux de bâche : « Aujourd'hui, tu es en face, avec leur maillot. Un morceau pour l'aller, un pour le retour. Tu salues le virage ? »"
    left:
      label: "Je salue le virage"
      effects: {tribunes: "+", vestiaire: "-", relation: {gege: 1}, set: [salue_ancien_virage], react: jp.re.gege_blason}
      answer: "Tu salues. Il ne répond pas. Il range un morceau ; il garde l'autre pour le retour."
    right:
      label: "Je regarde mes crampons"
      effects: {vestiaire: "+", tribunes: "-", relation: {gege: -1}}
      answer: "Tu ne salues pas. Le virage siffle ton nom en entier ; il le connaît par cœur."
