# Cartes de l'intrigue « Le jubilé » (arc jp.jubile) — bible ch. 10 § 6.14.
# Un jubilé, c'est une fin ; tu n'as pas fini. L'affiche a une date en mars et
# tu joues en avril. La place 14A est tenue par Josiane (la bible dit Paulette).
cards:
  - id: jp.jubile.gege
    roles: [joueur]
    arc: tribunes
    tags: [ultras, tribunes]
    speaker: gege
    tone: leger
    text: "Au local, Gégé te montre une affiche à moitié dessinée, ton numéro au milieu, la date en blanc : « La Nord a voté ton jubilé, {toi}. Il manque la date. Tu la choisis, ou tu n'as pas fini ? »"
    left:
      label: "Je choisis la date"
      effects: {tribunes: "++", direction: "-", set: [jubile_prevu], react: jp.re.lea_jubile_mars}
      answer: "Tu écris la date. Il la repasse au feutre. Elle est en mars ; tu joues encore en avril."
    right:
      label: "Je n'ai pas fini"
      effects: {tribunes: "+", vestiaire: "+", set: [jubile_reporte], outcome: reporte}
      answer: "Il garde l'affiche. Il la ressort chaque année, la date toujours vide."

  - id: jp.jubile.aulard
    roles: [joueur]
    arc: caisse
    tags: [direction, caisse]
    speaker: aulard
    tone: strategique
    text: "Vaubourg tape du stylo sur la ligne à ton nom, dans son tableau des recettes : « Un jubilé, c'est mon stade plein sans adversaire à payer. La recette, on la partage, ou tu la donnes ? »"
    left:
      label: "On la partage"
      effects: {caisse: "++", direction: "+", tribunes: "-"}
      answer: "Tu prends ta part. Elle est correcte. Le local l'apprend ; il laisse passer."
    right:
      label: "Je la donne aux anciens"
      effects: {caisse: "-", tribunes: "++", set: [jubile_charite], outcome: charite}
      answer: "La recette va à la buvette des anciens. Gigi la gère ; il ne compte pas ; ça marche."

  - id: jp.jubile.place
    roles: [joueur]
    arc: tribunes
    tags: [tribunes]
    speaker: josiane
    tone: leger
    text: "Madame Josiane pose le doigt sur une ligne vide du classeur des abonnés : « La 14A, tribune Est. Libre depuis 1987, {toi} ; personne ne l'a reprise. Vous montez vous y asseoir cinq minutes ? »"
    left:
      label: "Cinq minutes, là-haut"
      effects: {tribunes: "++", vestiaire: "-", relation: {josiane: 1}, set: [place_14a]}
      answer: "Tu t'assois. Tu vois le stade de la 14A. Il est petit, et il est tout."
    right:
      label: "Je reste en bas"
      effects: {tribunes: "+", relation: {josiane: -1}}
      answer: "Elle range la fiche d'abonnement, sans la remplir."

  - id: jp.jubile.jour
    roles: [joueur]
    arc: tribunes
    tags: [tribunes, moment]
    speaker: vecchio
    tone: strategique
    text: "Vecchio a remis ses gants jaunes, trop petits maintenant : « Stade plein, petit. Je n'ai jamais vu un jubilé rejouer le mois d'après. Tu raccroches ce soir, ou tu rejoues en avril ? »"
    left:
      label: "Je raccroche"
      effects: {tribunes: "+++", direction: "-", set: [jubile_fait, dernier_annonce], outcome: accepte, end: jubile}
      answer: "Tu fais le tour d'honneur. À la fin, tu demandes où est le vestiaire, par habitude."
    right:
      label: "Je rejoue en avril"
      effects: {tribunes: "++", vestiaire: "+", set: [jubile_fait], outcome: accepte, react: co.re.vecchio_garde}
      answer: "En avril, tu joues. L'Écho titre « Le jubilé continue ». Au stade, personne ne sait plus s'il faut applaudir."

  # L'issue `charite` était posée à l'étape « recette » puis écrasée par
  # `accepte` au jour du jubilé (spec §1.3 : l'arc garde la dernière issue) :
  # elle tombait à 9 %. La variante du jour la reprend et la ferme.
  - id: jp.jubile.jour_anciens
    roles: [joueur]
    arc: tribunes
    tags: [tribunes, moment]
    speaker: gege
    tone: strategique
    text: "Gégé, au bord de la pelouse, un carnet à souches à la main : « Stade plein. On a compté nous-mêmes : tout part à la buvette des anciens. Tu raccroches ce soir, ou tu rejoues en avril ? »"
    left:
      label: "Je raccroche"
      effects: {tribunes: "+++", direction: "-", set: [jubile_fait, dernier_annonce], outcome: charite, end: jubile}
      answer: "Tu fais le tour d'honneur. À la buvette, on sert gratuit ; personne ne compte."
    right:
      label: "Je rejoue en avril"
      effects: {tribunes: "++", vestiaire: "+", set: [jubile_fait], outcome: charite}
      answer: "En avril, tu joues. La buvette des anciens a repeint la porte avec la recette."

  - id: jp.jubile.jour_14a
    roles: [joueur]
    arc: tribunes
    tags: [tribunes, moment]
    speaker: vecchio
    tone: strategique
    text: "Vecchio lève un gant vers la tribune Est : « Stade plein, petit, et la 14A est occupée, pour une fois. Là-haut, quelqu'un compte tes tours d'honneur. Tu raccroches ce soir, ou tu rejoues en avril ? »"
    left:
      label: "Je raccroche"
      effects: {tribunes: "+++", direction: "-", set: [jubile_fait, dernier_annonce], outcome: accepte, end: jubile}
      answer: "Tu fais le tour. En passant sous la 14A, tu lèves la main ; elle lève la sienne."
    right:
      label: "Je rejoue en avril"
      effects: {tribunes: "++", vestiaire: "+", set: [jubile_fait], outcome: accepte}
      answer: "En avril, tu joues. La 14A est reprise pour l'année ; c'est écrit sur le classeur."
