# Cartes de l'intrigue « Les mémoires » (arc jp.memoires) — bible ch. 10 § 6.16.
# Ta vie en livre à trente et un ans ; le chapitre trois parle du vestiaire, et
# le vestiaire lit. Le chroniqueur veut la radio avant le papier.
cards:
  - id: jp.memoires.lea
    roles: [joueur]
    arc: presse
    tags: [presse]
    speaker: lea
    tone: strategique
    text: "Au café, Léa pose un cahier neuf et un magnétophone éteint : « Un éditeur veut vos mémoires, {toi}. C'est tôt, mais on se souvient encore. Toute la vérité, ou une version pour Noël ? »"
    left:
      label: "Toute la vérité"
      effects: {tribunes: "+", vestiaire: "-", direction: "-", set: [memoires_verite], outcome: verite, react: jp.re.meneche_radio_d_abord}
      answer: "Elle allume le magnéto. Tu parles trois heures. Elle ne coupe rien ; c'est sa règle."
    right:
      label: "La version de Noël"
      effects: {direction: "+", caisse: "+", set: [memoires_lisses], outcome: lisse, react: jp.re.meneche_radio_d_abord}
      answer: "Elle écrit. Personne ne se souvient de la page cent douze ; il n'y en a pas."

  - id: jp.memoires.meneche
    roles: [joueur]
    arc: presse
    tags: [presse]
    speaker: meneche
    tone: strategique
    text: "Massenet a le cahier de Léa en photocopie et ne dit pas d'où : « Un livre se vend s'il passe d'abord à la radio. Une heure, dimanche soir, et vous choisissez le chapitre. Le trois ? »"
    left:
      label: "Le chapitre trois"
      effects: {tribunes: "++", vestiaire: "--", relation: {meneche: 1}, set: [chapitre_trois_radio]}
      answer: "Le vestiaire écoute la radio dans le bus. Le bus est silencieux jusqu'à l'hôtel."
    right:
      label: "Un autre, le premier"
      effects: {tribunes: "+", relation: {meneche: -1}}
      answer: "Tu racontes ton enfance. Il bâille ; il n'a jamais bâillé en direct, il le fait exprès."

  - id: jp.memoires.chapitre_trois
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, presse]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut referme ton livre en gardant le doigt au chapitre trois : « Les gars l'ont lu, {toi}. Ce qui se dit ici ne sort pas d'ici. Tu le retires de la réédition, ou tu assumes devant eux ? »"
    left:
      label: "Je le retire"
      effects: {vestiaire: "+", tribunes: "-", parole: -1, set: [chapitre_retire]}
      answer: "Elle retire. Elle garde la page dans un tiroir ; elle la ressortira dans ses mémoires."
    right:
      label: "J'assume"
      effects: {vestiaire: "--", tribunes: "++", set: [chapitre_assume], react: jp.re.brehaut_plus_de_passe}
      answer: "Le groupe ne te fait plus la passe une semaine. La semaine d'après, si ; quelqu'un a aimé."

  - id: jp.memoires.camille
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: leger
    text: "Camille ouvre ton livre à la page de dédicace, encore blanche : « Au chapitre un, je suis dans la cuisine. Au chapitre trois, je n'existe plus. Tu me le dédicaces, ou tu l'écris au vestiaire ? »"
    left:
      label: "Je te le dédicace"
      effects: {relation: {camille: 2}, tribunes: "-"}
      answer: "Tu écris son prénom. Elle range le livre sur l'étagère de ce qui compte."
    right:
      label: "Je l'écris au vestiaire"
      effects: {vestiaire: "++", relation: {camille: -1}}
      answer: "Tu écris « au groupe ». Elle le lit quand même ; elle s'arrête au chapitre trois."

  - id: jp.memoires.josiane
    roles: [joueur]
    arc: direction
    tags: [direction, presse]
    speaker: josiane
    tone: leger
    text: "Madame Josiane tient ton livre comme un dossier ; elle l'a payé de sa poche. « Ces livres-là finissent au vestiaire, jamais à la maison. Vous me le dédicacez pour le classeur, ou pour la buvette ? »"
    left:
      label: "Pour le classeur"
      effects: {direction: "+", relation: {josiane: 1}}
      answer: "Elle le range debout, entre deux dossiers. C'est la meilleure place du club."
    right:
      label: "Pour la buvette"
      effects: {tribunes: "+", vestiaire: "+"}
      answer: "Il est sur le comptoir. Trois pages sont cornées ; toujours les mêmes trois."
