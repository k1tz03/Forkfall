# Cartes de l'intrigue partagée « La pharmacie du club » (arc co.pharmacie),
# versant joueur — bible ch. 10 § 6.21 ; le ch. 11 écrit le versant banc.
# De la créatine, légal, enfin, encore. La kiné du club est une voix sans
# portrait (la bible l'appelle Rouvier).
cards:
  - id: jp.pharmacie.creatine
    roles: [joueur]
    arc: corps
    tags: [scandale, moment]
    speaker: sabatier
    tone: strategique
    text: "Sabatier laisse rouler vers toi un flacon blanc sans étiquette : « De la créatine, {toi}. C'est légal, pour l'instant. Tu tiens jusqu'au coup de sifflet sans souffler. Tu avales, ou de l'eau ? »"
    left:
      label: "J'avale"
      effects: {force: 4, vestiaire: "+", relation: {sabatier: 1}, set: [vitamines]}
      answer: "Il range le flacon dans ta poche. L'air de rien."
    right:
      label: "Je bois de l'eau"
      effects: {force: -1, vestiaire: "+", relation: {sabatier: -1}, set: [pharmacie_propre], outcome: propre}
      answer: "Il range le flacon dans le tiroir. Il te regarde autrement ; moins."

  - id: jp.pharmacie.creatine_finir
    roles: [joueur]
    arc: corps
    tags: [scandale, moment]
    speaker: sabatier
    tone: strategique
    text: "Sabatier pose un flacon blanc sans étiquette au bord de la table : « Un coup de pouce pour finir la saison. Légal, pour l'instant. À ton âge, on ne demande pas si ça marche ; on finit. Tu avales ? »"
    left:
      label: "J'avale"
      effects: {force: 4, tribunes: "+", relation: {sabatier: 1}, set: [vitamines]}
      answer: "Il range le flacon dans ta poche. Il ne dit pas combien de temps ça dure."
    right:
      label: "Je finis sans"
      effects: {force: -1, vestiaire: "+", relation: {sabatier: -1}, set: [pharmacie_propre], outcome: propre}
      answer: "Il range le flacon dans le tiroir. Il dit « c'est plus rare que tu crois »."

  - id: jp.pharmacie.armoire
    roles: [joueur]
    arc: corps
    tags: [scandale]
    tone: strategique
    text: "La kiné referme du pied l'armoire à pharmacie, plus grande que le vestiaire, et parle à l'armoire, pas à toi : « J'ai signé de ne rien dire. Je le dis quand même : arrête le flacon. »"
    left:
      label: "J'arrête"
      effects: {force: -2, vestiaire: "+", clear: [vitamines], set: [flacon_arrete]}
      answer: "Tu arrêtes. Le contrôle vient ; il ne trouve rien ; il trouve quelqu'un d'autre."
    right:
      label: "Je tiens jusqu'au contrôle"
      effects: {force: 1, vestiaire: "-"}
      answer: "Elle ne dit plus rien. Elle masse ta cuisse en silence ; c'est tout ce qu'elle peut."

  - id: jp.pharmacie.controleur
    roles: [joueur]
    arc: corps
    tags: [scandale, moment]
    speaker: sabatier
    tone: strategique
    text: "Sabatier entre en courant, ce qu'il ne fait jamais : « Le contrôleur est à l'accueil, {toi}. Je l'ai envoyé au mauvais bâtiment ; on a quatre-vingt-dix minutes. Trois litres d'eau, ou tu y vas ? »"
    left:
      label: "Je bois trois litres"
      effects: {direction: "+", parole: -1, rand: [{p: 0.5, set: [flacon_b]}, {set: [controle_negatif]}]}
      answer: "Tu bois. Il trouve le bâtiment à la quatre-vingt-neuvième minute. Il est patient."
    right:
      label: "Je vais le voir"
      effects: {direction: "-", tribunes: "+", rand: [{p: 0.7, set: [flacon_b]}, {set: [controle_negatif]}]}
      answer: "Tu y vas. Le flacon B dit ce qu'il a à dire, ou ne dit rien."

  - id: jp.pharmacie.flacon_b
    roles: [joueur]
    arc: scandale
    tags: [scandale, presse]
    speaker: meneche
    tone: strategique
    text: "Massenet tient le communiqué du laboratoire comme un menu : « Flacon B, « non conforme ». Et votre médecin vient de poser trois semaines de vacances. Vous contestez, ou vous acceptez ? »"
    left:
      label: "Je conteste"
      effects: {direction: "-", caisse: "-", tribunes: "+", set: [flacon_b], outcome: flacon}
      answer: "Tu contestes. Le tribunal siège loin et répond tard ; il répond « deux ans »."
    right:
      label: "J'accepte"
      effects: {vestiaire: "--", force: -3, set: [flacon_b], outcome: flacon}
      answer: "Deux ans. Personne ne te demande ce qu'il y avait dedans ; on te demande combien."

  - id: jp.pharmacie.victime
    roles: [joueur]
    arc: scandale
    tags: [scandale]
    tone: drame
    once: true
    text: "La kiné, porte fermée, une feuille d'analyse qu'elle a lue trois fois : « Ce n'est pas la créatine, c'est autre chose, dans les vitamines du Doc. Et tu ne le savais pas. »"
    left:
      label: "Je ne le savais pas"
      effects: {set: [flacon_b, dope_a_son_insu], relation: {sabatier: -3}, outcome: victime}
      answer: "La commission ne fait pas la différence. Elle, si ; elle témoigne ; ça compte plus tard."
    right:
      label: "Je ne le savais pas"
      effects: {set: [flacon_b, dope_a_son_insu], relation: {sabatier: -3}, outcome: victime}
      answer: "La commission ne fait pas la différence. Elle, si ; elle témoigne ; ça compte plus tard."
