# Cartes de l'intrigue « Le vestiaire te porte » (arc jp.vestiaire_porte) —
# bible ch. 10 § 6.19. Vingt-deux noms, Vecchio deux fois, un fax, un sous-main,
# et une photo dans un journal qui n'est pas le bon.
cards:
  - id: jp.porte.petition
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut tient une feuille à deux mains, par les coins : « Les gars ont signé pour que tu restes, {toi}. Vingt-deux noms, et Gigi a signé deux fois. On l'envoie au président, ou tu la déchires ? »"
    left:
      label: "Envoyez-la"
      effects: {vestiaire: "++", direction: "-", set: [petition_portee], outcome: porte, react: jp.re.vecchio_encore_une}
      answer: "Elle part par fax. Josiane la classe sous « pétitions », une chemise presque vide."
    right:
      label: "Déchire-la"
      effects: {vestiaire: "-", direction: "+", set: [petition_retiree], outcome: retire}
      answer: "Il la déchire. Il garde le morceau avec ta signature ; tu n'avais pas signé, il l'a imitée."

  - id: jp.porte.josiane
    roles: [joueur]
    arc: direction
    tags: [direction, vestiaire]
    speaker: josiane
    tone: leger
    text: "Madame Josiane tient la pétition par un coin, encore tiède du fax : « Vingt-deux noms, et deux fois Vecchio. Je n'ai pas de dossier pour ça. Je la pose sur le bureau du président, ou dessous ? »"
    left:
      label: "Posez-la dessus"
      effects: {direction: "+", relation: {josiane: 1}, react: co.re.josiane_a_lu}
      answer: "Elle la pose dessus. Il la lit debout, en deux minutes, sans enlever son manteau."
    right:
      label: "Dessous, pour plus tard"
      effects: {direction: "-", vestiaire: "+", set: [petition_retard]}
      answer: "Elle la glisse dessous. Il la trouve en juin, en soulevant le sous-main pour chercher autre chose."

  - id: jp.porte.aulard
    roles: [joueur]
    arc: direction
    tags: [direction]
    speaker: aulard
    tone: strategique
    text: "Vaubourg retourne la pétition sur son sous-main, deux fois, sans la lire : « Ça se lit en deux minutes, {toi}, et mes deux minutes coûtent cher. Je la lis devant toi, ou tu me résumes ? »"
    left:
      label: "Lisez-la"
      effects: {direction: "+", vestiaire: "+"}
      answer: "Il lit, le doigt sur chaque nom. Arrivé en bas, il cherche le sien, qui n'y est pas."
    right:
      label: "Je résume : ils m'aiment"
      effects: {direction: "-", tribunes: "+"}
      answer: "« Moi aussi. » Il range la pétition dans le tiroir, sans sortir de contrat."

  - id: jp.porte.presse
    roles: [joueur]
    arc: presse
    tags: [presse, vestiaire]
    speaker: lea
    tone: strategique
    text: "Léa pose entre vous une photo de La Gazette Rose où l'on reconnaît le fax : « Ils l'ont en photo, floue. Moi, j'ai l'original. Je publie la pétition dans L'Écho avec les noms, ou sans ? »"
    left:
      label: "Avec les noms"
      effects: {tribunes: "++", direction: "--", set: [petition_presse], outcome: presse, react: jp.re.lea_confirme}
      answer: "Elle publie. Vaubourg lit les vingt-deux noms au petit-déjeuner, et en entoure trois au stylo."
    right:
      label: "Sans, ou pas du tout"
      effects: {direction: "+", relation: {lea: -1}}
      answer: "Elle ne publie pas. La Gazette, si : sans les noms, avec le tien, en gros."

  - id: jp.porte.presse_dechiree
    roles: [joueur]
    arc: presse
    tags: [presse, vestiaire]
    speaker: lea
    tone: strategique
    text: "Léa, de la rédaction de L'Écho : « Deux joueurs m'ont parlé d'une feuille à vingt-deux noms, déchirée au vestiaire. Il me faut une troisième source. Vous démentez, ou vous laissez dire ? »"
    left:
      label: "Je démens"
      effects: {direction: "+", vestiaire: "-", relation: {lea: -1}}
      answer: "Elle écrit « dément ». Le capitaine lit le mot ; il a gardé le morceau, lui."
    right:
      # L'issue `presse` n'était atteignable que par la branche « pétition
      # portée » : elle tombait à 8 % (spec §5.1, « aucune issue < 10 % »).
      # La feuille déchirée sort quand même — c'est la même histoire.
      label: "Laissez dire"
      effects: {vestiaire: "+", tribunes: "+", relation: {lea: 1}, outcome: presse}
      answer: "Elle écrit trois lignes. Le vestiaire les découpe et les met dans un casier."
