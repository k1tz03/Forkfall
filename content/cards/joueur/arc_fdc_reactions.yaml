# Réactions du postulat « Fin de contrat à 31 ans » (bible ch. 10 § 7).
# Servies au tirage suivant, hors créneau ; jamais de `end`, jamais de drame,
# jamais deux d'affilée. Le build leur pose `kind: reaction` par le `react:`
# qui les cite ; elles ne portent donc pas de `kind` à la main.
cards:
  - id: jp.re.camille_projet
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: leger
    text: "Camille, au téléphone du vestiaire : « Ton agent a appelé à la maison, {toi}. Il voulait savoir si on avait « un projet ». Je n'ai pas su quoi répondre. On en parle quand ? »"
    left:
      label: "Ce soir, je rentre tôt"
      effects: {relation: {camille: 1}, vestiaire: "-"}
      answer: "Tu rentres tôt. Vous parlez. Il n'y a pas de projet ; c'est déjà un début."
    right:
      label: "Après l'entraînement"
      effects: {relation: {camille: -1}}
      answer: "Elle raccroche. Il rappelle à sept heures ; il tombe sur elle."

  - id: jp.re.vecchio_encore_une
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: vecchio
    tone: leger
    text: "Vecchio te frappe l'épaule, la sienne plus basse que l'autre : « À ton âge, {toi}, on m'appelait déjà papy. J'ai joué dix ans de plus. Les années qui restent, tu les comptes, ou tu les joues ? »"
    left:
      label: "Je les joue"
      effects: {vestiaire: "+", tribunes: "+"}
      answer: "Il hoche la tête et repart vers son but sans se retourner, du même pas qu'à vingt ans."
    right:
      label: "Je les compte"
      effects: {direction: "+"}
      answer: "Il compte pour toi. Il trouve un chiffre ; il ne le dit pas."

  - id: jp.re.vukic_feuille
    roles: [joueur]
    arc: direction
    tags: [direction, formation]
    speaker: vukic
    tone: strategique
    text: "Vukić, la feuille de match sur les genoux, ne quitte pas le terrain des yeux : « Tu regardes le match comme quelqu'un qui compte les passes, {toi}. Pas les buts. Leur milieu, tu en dis quoi ? »"
    left:
      label: "Le milieu est trop bas"
      effects: {direction: "+", relation: {vukic: 1}, set: [notes_partagees]}
      answer: "Tu réponds. Il écrit ta réponse dans le cahier ; à ta page."
    right:
      label: "Je regarde encore"
      effects: {tribunes: "+"}
      answer: "Il range la feuille. Il te la redonnera en juin ; la question sera la même."

  - id: jp.re.lea_jubile_mars
    roles: [joueur]
    arc: presse
    tags: [presse]
    speaker: lea
    tone: leger
    text: "Léa a le calendrier du championnat ouvert à côté de l'affiche : « Jubilé en mars, et vous êtes sur la feuille de match en avril, {toi}. J'ai vérifié deux fois. Je titre « Le jubilé continue » ? »"
    left:
      label: "« Le jubilé continue »"
      effects: {tribunes: "+"}
      answer: "Elle titre. Au club, on vend les places d'avril avec la coupure agrafée au guichet."
    right:
      label: "Plutôt « Encore une »"
      effects: {tribunes: "+", relation: {lea: 1}}
      answer: "Elle titre « Encore une ». Gigi découpe ; il a le même titre depuis cinq ans."

  - id: jp.re.meneche_radio_d_abord
    roles: [joueur]
    arc: presse
    tags: [presse]
    speaker: meneche
    tone: leger
    text: "Massenet, au téléphone : « Léa écrit vos mémoires, {toi}. Je l'ai su avant votre agent. Vous me donnez la primeur, une heure dimanche soir, ou je raconte ce que je sais déjà ? »"
    left:
      label: "Dimanche, une heure"
      effects: {tribunes: "+", relation: {lea: -1}}
      answer: "Elle l'apprend. Elle ne dit rien ; elle coupe deux pages."
    right:
      label: "Le livre d'abord"
      effects: {relation: {meneche: -1, lea: 1}}
      answer: "Il note la date de sortie. Dimanche, il parle du livre quand même : sans vous, et avant vous."

  - id: jp.re.brehaut_plus_de_passe
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut ramasse les plots un par un, à la fin de l'entraînement : « Depuis le chapitre trois, plus personne ne te passe le ballon, {toi}. Moi non plus. Tu continues sans nous, ou tu le retires ? »"
    left:
      label: "Je continue sans vous"
      effects: {vestiaire: "-", force: 1}
      answer: "Une semaine sans ballon. Le samedi suivant, un jeune te sert quand même ; il a aimé le chapitre."
    right:
      label: "Je vais le retirer"
      effects: {vestiaire: "+", parole: -1, set: [chapitre_retire]}
      answer: "Elle retire. Elle garde la page ; elle la range avec les autres pages gardées."

  - id: jp.re.fardelli_on_ne_parle_plus
    roles: [joueur]
    arc: mercato
    tags: [agents, mercato]
    speaker: fardelli
    tone: strategique
    text: "Fardelli, sur le parking, ne descend pas de voiture : « Tu as gagné, {toi}. Mon ami a perdu une fortune, et c'est moi qui te l'avais présenté. Tu te cherches un autre agent ? »"
    left:
      label: "J'en cherche un autre"
      effects: {relation: {fardelli: -1}, direction: "+", set: [sans_agent], clear: [agent_fardelli]}
      answer: "Tu cherches. Une carte de visite traîne dans ton casier depuis trois ans."
    right:
      label: "Je t'appellerai"
      effects: {relation: {fardelli: 1}, parole: -1}
      answer: "Tu l'appelleras. Il le sait. Il note « appellera » ; il souligne."

  # Après la quinzième jouée (F2b, slot 16) : l'agent compte les matchs aussi,
  # et il compte plus vite que le Doc. C'est la seconde apparition garantie de
  # Fardelli en première saison — le porteur du postulat n'apparaissait deux fois
  # que dans trois S0 sur quatre, pour une cible de casting de 2,5 (§ 5.2).
  - id: jp.re.fardelli_quinze
    roles: [joueur]
    arc: agents
    tags: [agents, caisse]
    speaker: fardelli
    tone: leger
    text: "Fardelli t'attend à la sortie du vestiaire : « Quinze matchs, {toi}. Page trois de ton contrat, en tout petit, une prime à quinze. C'est moi qui l'avais glissée. Je la réclame, ou j'attends juin ? »"
    left:
      label: "Fais-la valoir"
      effects: {caisse: "+", direction: "-", relation: {fardelli: 1}}
      answer: "Il la fait valoir le lundi. Le président lit le petit caractère à voix haute, deux fois, pour lui-même."
    right:
      label: "Attends juin"
      effects: {direction: "+", relation: {fardelli: -1}, set: [attend_juin]}
      answer: "Il attend. Il écrit « juin » dans son carnet, l'entoure deux fois, et referme le carnet sur son stylo."

  - id: jp.re.josiane_formulaire
    roles: [joueur]
    arc: direction
    tags: [direction]
    speaker: josiane
    tone: leger
    text: "Madame Josiane pose un formulaire jaune à l'envers sur le comptoir : « Les fins de contrat se déclarent en juin, {toi}, sur ce papier-là. Je le prépare dès maintenant, ou je le range ? »"
    left:
      label: "Préparez-le"
      effects: {direction: "+", relation: {josiane: 1}}
      answer: "Elle le prépare. Il attend sur le coin du bureau, en jaune, tout l'hiver."
    right:
      label: "Laissez-le dans le tiroir"
      effects: {tribunes: "+", vestiaire: "+"}
      answer: "Elle le laisse. Le tiroir en contient quatorze ; elle connaît les quatorze noms."

  - id: jp.re.sabatier_trois_pas
    roles: [joueur]
    arc: corps
    tags: [moment]
    speaker: sabatier
    tone: strategique
    text: "Sabatier range le chronomètre dans sa blouse : « Trois pas, {toi}, on ne les rattrape pas en courant plus vite. On les rattrape à sept heures, sur ma table, avant les autres. Tu viens ? »"
    left:
      label: "Je viens à sept heures"
      effects: {force: 1, relation: {sabatier: 1}}
      answer: "Tu viens. Il compte. Tu rattrapes un pas ; c'est déjà ça."
    right:
      label: "Je cours avec les autres"
      effects: {vestiaire: "+", relation: {sabatier: -1}}
      answer: "Tu cours avec le groupe. Il regarde depuis la fenêtre ; il ne compte plus."
