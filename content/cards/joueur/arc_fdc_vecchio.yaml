# Cartes du rituel « Vecchio l'exemple » (arc jp.vecchio_exemple) — bible
# ch. 10 § 6.27. Cinq verres sur le comptoir, un par retraite, et il en ajoute
# un chaque saison. Rejouable : aucune de ces cartes n'est `once`.
cards:
  - id: jp.vecchio_exemple.retraites
    roles: [joueur]
    arc: vestiaire
    tags: [absurde, vestiaire]
    speaker: vecchio
    statut_ok: [retraite]
    tone: leger
    text: "À la buvette des anciens, Vecchio aligne cinq verres d'eau sur le comptoir, un par retraite : « Cinq fois, j'ai dit que j'arrêtais, {toi}. Je te raconte la première, ou la vraie ? »"
    left:
      label: "La première"
      effects: {vestiaire: "+", relation: {vecchio: 1}, outcome: premiere}
      answer: "Il raconte la première. Il avait dit « je raccroche » ; il a rejoué en août."
    right:
      label: "La vraie"
      effects: {tribunes: "+", relation: {vecchio: 1}, set: [vecchio_vraie_retraite], outcome: vraie}
      answer: "Il raconte la vraie. Il a rendu les gants à un jeune ; le jeune les a gardés."

  - id: jp.vecchio_exemple.retraites_encore
    roles: [joueur]
    arc: vestiaire
    tags: [absurde, vestiaire]
    speaker: vecchio
    statut_ok: [retraite]
    tone: leger
    text: "Vecchio ajoute un verre d'eau au bout de la rangée, sur le comptoir de la buvette : « Un de plus, petit. J'ai arrêté de compter les miennes. Et toi, tu en es à combien, de retraites annoncées ? »"
    left:
      label: "Aucune, pour l'instant"
      effects: {vestiaire: "+", tribunes: "+", outcome: premiere}
      answer: "Il aligne un verre à ton nom, vide. « Pour quand ce sera », dit-il, et il l'oublie là."
    right:
      label: "Une, l'an dernier"
      effects: {tribunes: "+", relation: {vecchio: 1}, set: [vecchio_vraie_retraite], outcome: vraie}
      answer: "Il rit sans bruit. Il remplit le verre à ton nom et le boit à ta place."

  - id: jp.vecchio_exemple.gants
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: vecchio
    statut_ok: [retraite]
    tone: leger
    text: "Vecchio montre du menton le jeune gardien de la réserve : « Je lui ai donné mes gants. Il les a rangés dans une boîte, comme une relique. Des gants, ça s'use. Tu lui dis, ou tu le laisses faire ? »"
    left:
      label: "Je lui dis de les user"
      effects: {vestiaire: "+", relation: {mbako: 1}}
      answer: "Le jeune les sort de la boîte. Il les use en trois mois ; c'était fait pour."
    right:
      label: "Laisse-le les garder"
      effects: {tribunes: "+", relation: {vecchio: 1}}
      answer: "La boîte reste sur l'étagère du vestiaire. Elle y sera encore dans vingt ans."

  - id: jp.vecchio_exemple.comptoir
    roles: [joueur]
    arc: tribunes
    tags: [tribunes, absurde]
    speaker: vecchio
    statut_ok: [retraite]
    tone: leger
    text: "Vecchio essuie le comptoir de la buvette des anciens : « Ici, {toi}, qui annonce sa retraite paie la tournée, et qui revient la repaie. J'ai payé cinq fois. Tu paies d'avance, ou tu attends ? »"
    left:
      label: "Je paie d'avance"
      effects: {caisse: "-", tribunes: "++"}
      answer: "Tu paies. Le comptoir te doit une tournée si tu reviens ; il n'oublie pas les dettes."
    right:
      label: "J'attends de savoir"
      effects: {caisse: "+", vestiaire: "+"}
      answer: "Personne ne paie. Le patron met la tournée sur l'ardoise, au nom du club."
