# Cartes de l'intrigue « La première Une » (arc jp.premiere_une) —
# bible ch. 10 § 6.6. Léa dit {toi} et vouvoie ; Massenet tient le rôle du
# chroniqueur (Massenet de la bible : même magnéto, même « hors micro »).
cards:
  - id: jp.une.conference
    roles: [joueur]
    arc: presse
    tags: [presse]
    speaker: lea
    tone: leger
    text: "Léa règle le micro et pose devant toi une feuille, trois phrases au feutre : c'est une fierté, le groupe est bien, merci au coach. « Vous lisez ça, ou vous dites ce que vous pensez ? Je gère demain. »"
    left:
      label: "Je lis les trois phrases"
      effects: {direction: "+", tribunes: "-", set: [modeste_une], outcome: modeste}
      answer: "Tu lis. Au fond, Massenet bâille. L'Écho titre « Rien à signaler » en page six ; c'est le pire titre possible, et il est gentil."
    right:
      label: "Je dis ce que je pense"
      effects: {tribunes: "++", direction: "-", vestiaire: "-", set: [special], outcome: special, react: jp.re.brehaut_decoupe}
      answer: "Tu dis : « Le meilleur, ici, c'est moi. » Au fond, Massenet arrête de bâiller. La Gazette Rose titre avant ton retour."

  - id: jp.une.hors_micro
    roles: [joueur]
    arc: presse
    tags: [presse, retorse]
    speaker: meneche
    tone: leger
    text: "Massenet referme son carnet, bien en vue ; le magnéto, lui, tourne dans sa poche de poitrine : « Entre nous : qui commande ce vestiaire, vous ou le coach ? Si vous ne dites rien, j'écris ma réponse. »"
    left:
      label: "Le collectif, voyons"
      effects: {direction: "+", tribunes: "-", var: {no_comment: "+1"}}
      answer: "Tu dis « le collectif ». Il écrit « langue de bois ». Il a raison ; ça se lit."
    right:
      label: "Moi, et il le sait"
      effects: {tribunes: "++", direction: "--", vestiaire: "-", set: [coach_critique], outcome: critique}
      answer: "Il écrit ta phrase. Le coach la lit au petit-déjeuner ; il te met sur le banc au déjeuner."

  - id: jp.une.vestiaire
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, presse]
    speaker: brehaut
    tone: leger
    text: "Titi Bréhaut te montre le tableau de la compo : quelqu'un y a recopié ta phrase de la conférence, à côté de ton nom, en jaune. « Les gars veulent savoir si tu la penses encore. Tu l'effaces ? »"
    left:
      label: "Je la laisse au tableau"
      effects: {tribunes: "+", vestiaire: "-", force: 1, set: [special_assume]}
      answer: "Tu la laisses. Tu marques dimanche. La phrase reste ; quelqu'un ajoute la date du but au feutre."
    right:
      label: "Je l'efface devant eux"
      effects: {vestiaire: "++", tribunes: "-", clear: [special], set: [special_retire]}
      answer: "Tu l'effaces avec ta manche. Au fond, quelqu'un dit « enfin » ; Bréhaut ne se retourne pas pour voir qui."

  - id: jp.une.meme
    roles: [joueur]
    arc: presse
    tags: [presse, absurde]
    speaker: meneche
    tone: leger
    text: "Dans la zone mixte, Massenet te tend son téléphone : ta tête en boucle, qui dit « je ne commente pas ». « Trois fois en un mois, et le Flux s'en est chargé. Vous en riez, ou vous commentez enfin ? »"
    left:
      label: "J'en ris"
      effects: {tribunes: "++", direction: "-", relation: {meneche: 1}, set: [meme_assume]}
      answer: "Tu ris, et tu la partages toi-même. Le club imprime ta tête sur des mugs ; tu ne touches rien sur les ventes."
    right:
      label: "Je commente, enfin"
      effects: {tribunes: "+", direction: "--", relation: {meneche: 1}, parole: 1}
      answer: "Tu commentes. Longtemps. Il note tout ; il en a pour deux Unes."

  - id: jp.une.meme_dessin
    roles: [joueur]
    arc: presse
    tags: [presse, absurde]
    speaker: meneche
    tone: leger
    text: "Massenet pose La Gazette Rose ouverte à la page trois : toi, en poteau de corner, « je ne commente pas » dans la bulle. « Trois fois en un mois. Vous encadrez, ou vous répondez enfin ? »"
    left:
      label: "J'encadre"
      effects: {tribunes: "++", direction: "-", relation: {meneche: 1}, set: [meme_assume]}
      answer: "Tu l'encadres au-dessus de ton casier. Le vestiaire rit avec toi, pour une fois ; la Gazette en dessine une deuxième."
    right:
      label: "Je réponds, enfin"
      effects: {tribunes: "+", direction: "--", relation: {meneche: 1}, parole: 1}
      answer: "Tu réponds. Longtemps. Il note tout ; il en a pour deux Unes."
