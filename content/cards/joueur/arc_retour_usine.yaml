# Cartes de l'intrigue « Le retour à l'usine » (arc jp.retour_usine) —
# bible ch. 10 § 6.25. Rejouable : la variante « encore » de l'étape 1 lit
# plays(). Aucune carte `once` (un rituel de rancune revient).
cards:
  - id: jp.retour.parking
    roles: [joueur]
    arc: direction
    tags: [direction, absurde]
    speaker: josiane
    tone: leger
    text: "Madame Josiane t'attend sur le parking de l'usine, un tournevis à la main, devant une plaque à ton nom : « Personne n'a osé l'enlever, {toi}. Vous vous garez dessus, ou avec les visiteurs ? »"
    left:
      label: "Dessus"
      effects: {tribunes: "+", direction: "-", react: {card: co.re.josiane_a_lu, if: "!seen('co.re.josiane_a_lu')"}}
      answer: "Tu te gares. À la mi-temps, la plaque a disparu ; il reste quatre trous dans le mur, et un rectangle plus clair."
    right:
      label: "Avec les visiteurs"
      effects: {direction: "+", relation: {josiane: 1}}
      answer: "Elle enlève la plaque elle-même. Elle la garde dans le classeur, sous la pétition."

  - id: jp.retour.parking_encore
    roles: [joueur]
    arc: direction
    tags: [direction, absurde]
    speaker: josiane
    tone: leger
    text: "Madame Josiane te montre une place repeinte côté visiteurs, ton nom au pochoir : « Encore vous, et encore contre nous. Celle-là, je l'ai fait peindre exprès. Vous vous garez dessus ? »"
    left:
      label: "Dessus"
      effects: {relation: {josiane: 1}, tribunes: "+"}
      answer: "Tu te gares. La peinture est fraîche ; c'est voulu."
    right:
      label: "Dessus"
      effects: {relation: {josiane: 1}, tribunes: "+"}
      answer: "Tu te gares. La peinture est fraîche ; c'est voulu."

  - id: jp.retour.gamin
    roles: [joueur]
    arc: formation
    tags: [formation, vestiaire]
    speaker: mbako
    tone: strategique
    text: "Mbako porte ton ancien numéro, les mains dans les manches : « Ils m'ont acheté avec ton prix, {toi} ; ma mère a lu le chiffre. Tu sais ce que c'est, d'être vendu. Tu me dis, ou je découvre ? »"
    left:
      label: "Je te dis"
      effects: {vestiaire: "+", relation: {mbako: 1}, set: [vendu_explique], react: {card: jp.re.mere_mbako_note, chance: 0.5}}
      answer: "Tu lui dis le fax, la secrétaire d'ailleurs, le casier sans nom. Il écoute, ce qui est rare ; c'est parce que c'est toi."
    right:
      label: "Tu découvriras"
      effects: {tribunes: "+", relation: {mbako: -1}}
      answer: "Tu ne dis rien ; il découvre en juin. Il t'envoie une carte sans texte, avec le chiffre dessus."

  - id: jp.retour.gamin_inconnu
    roles: [joueur]
    arc: formation
    tags: [formation, vestiaire]
    speaker: vecchio
    tone: leger
    text: "À l'échauffement, Vecchio, côté usine, te glisse à l'oreille : « Le gamin qu'ils ont payé avec ton prix porte ton ancien numéro, et il ne le sait pas. Tu le lui dis, petit, ou tu le laisses ? »"
    left:
      label: "Je lui dis"
      effects: {vestiaire: "+", relation: {vecchio: 1}, set: [vendu_explique]}
      answer: "Tu lui dis. Il tord le cou pour regarder le numéro dans son dos."
    right:
      label: "Je le laisse"
      effects: {tribunes: "+", vestiaire: "-"}
      answer: "Il l'apprend par la Gazette, deux mois plus tard, avec ta photo à côté."

  - id: jp.retour.but
    roles: [joueur]
    arc: ultras
    tags: [ultras, tribunes, moment]
    speaker: gege
    tone: strategique
    text: "Tu viens de marquer devant la Nord. À la grille, Gégé pose le pied sur un sac poubelle fermé : « La bâche est dedans, pliée. On l'a apportée, au cas où. Tu célèbres, ou tu baisses la tête ? »"
    left:
      label: "Je baisse la tête"
      effects: {tribunes: "++", vestiaire: "-", set: [tifo_adieu], outcome: baisse, react: [ { card: co.re.gege_decoupe_mur, if: "seen('co.re.gege_decoupe_1987')", chance: 0.5 }, { card: co.re.gege_decoupe_1987, if: "seen('co.re.gege_decoupe')", chance: 0.5 }, { card: co.re.gege_decoupe, chance: 0.5 } ]}
      answer: "La Nord applaudit un visiteur. Ça n'arrive qu'une fois ; c'est la fois."
    right:
      label: "Je célèbre"
      effects: {vestiaire: "++", tribunes: "--", relation: {gege: -2}, set: [celebre_contre_usine], outcome: celebre}
      answer: "La bâche sort du sac. Elle est brûlée le soir ; proprement."

  # Variante lue sur `bache_a_la_cave` (posée par jp.tifo.un_an_apres_pliee) :
  # la bâche n'est plus dans le sac du local, elle est chez toi. Le virage ne
  # peut donc pas la brûler — il a repeint la sienne.
  - id: jp.retour.but_cave
    roles: [joueur]
    arc: ultras
    tags: [ultras, tribunes, moment]
    speaker: gege
    tone: strategique
    text: "« Celle qu'on t'a donnée, tu l'as chez toi ; nous on en a repeint une autre, sans ton nom. Tu viens de marquer : tu célèbres, ou tu baisses la tête ? »"
    left:
      label: "Je baisse la tête"
      effects: {tribunes: "++", vestiaire: "-", set: [tifo_adieu], outcome: baisse, react: [ { card: co.re.gege_decoupe_mur, if: "seen('co.re.gege_decoupe_1987')", chance: 0.5 }, { card: co.re.gege_decoupe_1987, if: "seen('co.re.gege_decoupe')", chance: 0.5 }, { card: co.re.gege_decoupe, chance: 0.5 } ]}
      answer: "La Nord applaudit un visiteur. Chez toi, à la cave, il y a vingt mètres qui disent le contraire."
    right:
      label: "Je célèbre"
      effects: {vestiaire: "++", tribunes: "--", relation: {gege: -2}, set: [celebre_contre_usine], outcome: celebre}
      answer: "C'est la neuve qui brûle, celle sans ton nom. La tienne dort à la cave ; elle ne le saura jamais."

  - id: jp.retour.aulard
    roles: [joueur]
    arc: mercato
    tags: [mercato, direction]
    speaker: aulard
    tone: strategique
    text: "Vaubourg te montre un chiffre sur un bout de fax, sans te le tendre : « Tu as bien joué contre nous. L'usine rachète parfois ce qu'elle a vendu, moins cher. Tu reviens l'été prochain ? »"
    left:
      label: "Je reviens"
      effects: {tribunes: "+++", caisse: "-", set: [retour_usine_signe], club: {change: true, division: 2, retour: true}, outcome: rachete, react: {card: jp.re.lea_aller_simple, chance: 0.6}}
      answer: "Tu reviens. Gégé ressort la bâche ; il repeint « POUR TOUJOURS » ; il ajoute « (BIS) »."
    right:
      label: "Je reste"
      effects: {caisse: "+", direction: "+"}
      answer: "Il range ton dossier. Il vend un autre gamin."

  - id: jp.retour.aulard_brule
    roles: [joueur]
    arc: mercato
    tags: [mercato, direction]
    speaker: aulard
    tone: strategique
    text: "Vaubourg sent encore la fumée du parking : « La Nord a brûlé quelque chose hier soir ; je n'ai pas demandé quoi. L'usine rachète parfois ce qu'elle a vendu, moins cher. Tu reviens quand même ? »"
    left:
      label: "Je reviens quand même"
      effects: {tribunes: "+", caisse: "-", set: [retour_usine_signe], club: {change: true, division: 2, retour: true}, outcome: rachete}
      answer: "Tu reviens. Il n'y a plus de bâche à repeindre ; il y a un mur, et une date à la craie dessous."
    right:
      label: "Je reste"
      effects: {caisse: "+", direction: "+"}
      answer: "Il range ton dossier. Il vend un autre gamin, et le vend plus cher que toi."
