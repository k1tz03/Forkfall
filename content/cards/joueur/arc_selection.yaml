# Cartes de l'intrigue « La liste des vingt-six » (arc jp.selection) —
# bible ch. 10 § 6.5. Berthomier tient le téléphone de la Fédération (Berthomier
# dans la bible : même Congrès, même voix). Le plus vieux du groupe, c'est
# Vecchio : quarante et un ans et une chambre à deux lits.
# La carte d'ouverture absorbe `jp.selection.liste` (content/cards/joueur/
# carriere.yaml) : le texte existant y reste, cette carte en est l'étape.
cards:
  - id: jp.selection.groupe
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: vecchio
    tone: leger
    text: "Hall de l'hôtel des Cobalts. Vecchio te tend une clé, garde l'autre : « Ici, le nouveau dort avec le plus vieux, et le plus vieux, c'est moi. Tu prends la chambre, ou tu en demandes une autre ? »"
    left:
      label: "Je prends la chambre"
      effects: {vestiaire: "++", tribunes: "+", relation: {vecchio: 1}, set: [chambre_fauvel]}
      answer: "Tu partages sa chambre ; il ne dort pas. Il te raconte le tir au but de 1990 à deux heures du matin, une fois, et plus jamais."
    right:
      label: "Je demande la mienne"
      effects: {direction: "+", vestiaire: "-", relation: {vecchio: -1}}
      answer: "Tu as ta chambre, au bout du couloir. Au petit-déjeuner, la chaise à côté de Gigi reste vide jusqu'au départ du car."

  - id: jp.selection.retour
    roles: [joueur]
    arc: direction
    tags: [direction, moment]
    speaker: aulard
    tone: strategique
    text: "Vaubourg tient L'Écho par un coin, ta photo en bleu cobalt en Une : « Tu rentres en héros ou en boitant, le Doc n'a pas fini. Tu joues dimanche pour prouver que ça valait le coup, ou je vends ? »"
    left:
      label: "Je joue dimanche"
      effects: {tribunes: "++", direction: "+", force: -1, rand: [{p: 0.2, set: [genou], tribunes: "-"}, {}], react: {card: jp.re.lea_confirme, chance: 0.6}}
      answer: "Tu joues, et le stade chante le nom du pays et le tien, dans l'ordre. Il applaudit en regardant le prix."
    right:
      label: "Je me repose"
      effects: {direction: "--", force: 1, set: [repos_selection]}
      answer: "Tu te reposes. Il vend en juin, ou pas ; il dit que c'est à cause de ça ; c'est faux."

  - id: jp.selection.retour_forfait
    roles: [joueur]
    arc: direction
    tags: [direction]
    speaker: aulard
    tone: leger
    text: "Vaubourg te tape sur l'épaule, assez fort pour que Josiane entende : « Tu as déclaré forfait pour mon club, {toi}. La Fédération l'a noté. Tu joues dimanche, ou tu soignes cette cheville ? »"
    left:
      label: "Je joue dimanche"
      effects: {tribunes: "+", direction: "++", force: -1}
      answer: "Tu joues ; la cheville n'avait rien. Tout le monde le sait, personne ne le dit."
    right:
      label: "Je soigne la cheville"
      effects: {direction: "-", force: 1, set: [repos_selection]}
      answer: "Tu la soignes trois semaines. Le Doc écrit « repos » ; il n'écrit pas pourquoi."
