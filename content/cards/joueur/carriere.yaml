cards:
  - id: jp.mercato.transfert_siecle
    roles: [joueur]
    arc: mercato
    tags: [mercato]
    speaker: fardelli
    once: true
    when: "gauges.tribunes > 70 && season >= 1 && !flag('exil_dore')"
    text: "Fardelli étale sur le capot un fax à l'en-tête du Castel Montoya : « Le plus gros chèque jamais signé dans ce pays, {toi}. Ta clause est publique ; ton club ne peut rien. Tu montes dans l'avion ? »"
    left: {label: "Je monte dans l'avion", effects: {caisse: "+++", tribunes: "--", set: [galactique]}, answer: "Tu signes sur le capot. Le lendemain, le Quotidien titre sur le transfert du siècle ; Gégé découpe la Une sans la lire."}
    right: {label: "Je reste ici", effects: {tribunes: "++", direction: "+"}, answer: "Tu restes ; Fardelli replie le fax en quatre. Samedi, la Nord a peint « PAS À VENDRE » sur un drap."}

  - id: jp.moment.penalty
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: brehaut
    when: "!flag('mouton_noir')"
    text: "88e, 1-1, penalty. Bréhaut t'arrache le ballon et le serre contre son brassard : « Le tireur désigné, c'est moi, {toi}. Le coach l'a écrit au tableau. Tu me le laisses ? »"
    left: {label: "Prends-le, capitaine", effects: {vestiaire: "++", tribunes: "-"}, answer: "Il pose le ballon et recule de six pas. Le stade voulait ton nom ; le vestiaire retient que tu l'as laissé."}
    right: {label: "Je tire", effects: {rand: [{p: 0.7, tribunes: "+++", vestiaire: "-"}, {p: 0, tribunes: "--", vestiaire: "-"}]}, answer: "Tu poses le ballon ; Bréhaut recule sans te regarder. Le stade se tait jusqu'au bruit du filet, ou du poteau."}

  - id: jp.presse.bouteilles
    roles: [joueur]
    arc: presse
    tags: [presse, sponsors]
    speaker: lea
    when: "gauges.tribunes > 65 && !flag('special')"
    text: "Léa pose une bouteille du sponsor devant toi : « Hier, en conférence, vous l'avez poussée hors du champ. Le sponsor veut des excuses écrites, {toi}, avant jeudi. Je les tape, ou je leur dis non ? »"
    left: {label: "Pas d'excuses", effects: {tribunes: "++", direction: "-", caisse: "-"}, answer: "Elle répond au sponsor en une ligne. Samedi, la Nord apporte des carafes d'eau du robinet ; le sponsor coupe une prime."}
    right: {label: "Tapez les excuses", effects: {direction: "+", tribunes: "-"}, answer: "Tu signes la lettre qu'elle a tapée. Le sponsor l'affiche dans son hall, à côté d'une photo de toi, la bouteille en main."}

  - id: jp.scandale.pari
    roles: [joueur]
    arc: scandale
    tags: [scandale, risk:direction]
    speaker: null
    when: "gauges.caisse < 45 && !flag('pari')"
    text: "Au café de la gare, Tony, ton pote d'enfance, baisse la voix : « Juste le nombre de corners, samedi. Un type du port prend les mises ; personne ne saura que c'est toi. Tu me donnes un chiffre ? »"
    left: {label: "Un chiffre, une fois", effects: {caisse: "+", set: [pisteur], schedule: [{card: jp.scandale.brigade, in: [4, 8]}]}, answer: "Tu dis « neuf » ; Tony l'écrit sur un sous-bock et le glisse dans sa poche. Tu paies les cafés, un peu vite."}
    right: {label: "Jamais, Tony", effects: {tribunes: "+"}, answer: "Tony hausse les épaules et paie les cafés. Il ne te redemande rien ; il demandera à quelqu'un d'autre, au vestiaire."}

  - id: jp.scandale.brigade
    roles: [joueur]
    arc: scandale
    tags: [scandale, chaine]
    speaker: meneche
    sablier: true
    when: "flag('pisteur')"
    text: "Massenet ouvre son carnet : « La brigade financière a saisi les cahiers d'un bookmaker du port. Votre nom y est, à côté d'un nombre de corners. Vous niez, ou vous leur parlez avant moi ? »"
    left: {label: "Je nie tout", effects: {direction: "--", tribunes: "--"}, answer: "Tu nies ; il écrit « nie tout » et le souligne deux fois. Jeudi, c'est en page trois, avec ta photo."}
    right: {label: "Je coopère", effects: {direction: "-", tribunes: "-", caisse: "-"}, answer: "Tu racontes tout à la brigade : le café, le chiffre, le nom. Tu sors par la porte de derrière ; quelqu'un t'a vu quand même."}

  # Absorbée par l'intrigue « La liste des vingt-six » (arc jp.selection,
  # bible ch. 10 § 6.5) : le texte existant reste, la carte devient l'étape 1
  # et pose ses deux issues.
  - id: jp.selection.liste
    roles: [joueur]
    arc: instances
    tags: [formation]
    speaker: legruet
    tone: leger
    text: "Josiane te tend le combiné. Berthomier, avec sa voix de Congrès : « {Toi}, vous êtes dans ma liste. Votre club, lui, voudrait un forfait pour votre cheville. Vous venez, ou vous êtes blessé ? »"
    left:
      label: "Je viens"
      effects: {tribunes: "++", direction: "-", set: [international], outcome: cobalts, react: jp.re.aulard_cheville}
      answer: "Tu viens. Le président l'apprend par Josiane ; il dit qu'il n'est pas fâché, et il casse un crayon en le disant."
    right:
      label: "Je suis blessé, monsieur"
      effects: {direction: "++", tribunes: "-", relation: {legruet: -1}, set: [selection_refusee], outcome: refus}
      answer: "Tu déclares forfait. « On ne dit pas non deux fois », dit-il ; ce n'est pas une menace, et c'en est une."

  - id: jp.corps.genou
    roles: [joueur]
    arc: divers
    tags: [risk:tribunes]
    speaker: sabatier
    when: "age >= 30 && !flag('genou_opere')"
    text: "Sabatier colle la radio contre le néon, les lunettes sur le front : « Ce genou, {toi}, c'est six mois si on l'ouvre. Ou une piqûre, et tu joues dimanche ; il paiera plus tard. Tu choisis ? »"
    left: {label: "J'opère", effects: {tribunes: "-", set: [genou]}, answer: "Il prend rendez-vous à la clinique pour lundi. Dimanche, tu regardes le match de la tribune, la jambe raide sous une couverture."}
    right: {label: "La piqûre, je joue", effects: {tribunes: "+", vestiaire: "+", set: [genou]}, answer: "Il prépare la seringue, l'aiguille vers le plafond. Dimanche, tu ne sens rien ; c'est bien ça qui l'inquiète."}

  - id: jp.famille.frere_agent
    roles: [joueur]
    arc: famille
    tags: [famille, agents]
    speaker: null
    when: "flag('agent_fardelli')"
    text: "Ton frère est venu en train, avec une chemise neuve et un classeur vide : « Vire Fardelli. Je m'occupe de tout, et moi, je ne prends pas de commission : je suis de la famille. Tu me signes ça ? »"
    left: {label: "D'accord, frérot", effects: {caisse: "-", relation: {fardelli: -2}}, answer: "Tu appelles Fardelli le soir même. Le lendemain, ton frère s'achète trois costumes ; la note arrive chez toi."}
    right: {label: "Reste à ta place", effects: {tribunes: "+"}, answer: "Il reprend le train du soir avec son classeur vide. Ta mère t'appelle à minuit ; elle ne dit pas bonjour."}

  - id: jp.vestiaire.yacht
    roles: [joueur]
    arc: presse
    tags: [presse]
    speaker: null
    when: "flag('genou')"
    text: "Quelqu'un a punaisé la Gazette Rose dans le vestiaire : toi sur un bateau à Portclair, l'attelle au genou, un mardi d'entraînement. Le titre dit « LA RÉCUPÉRATION ». Tu réponds comment ?"
    left: {label: "Je m'excuse dans L'Écho", effects: {tribunes: "+"}, answer: "L'Écho publie tes trois lignes d'excuses, page sports. Au vestiaire, la Gazette reste punaisée une semaine de plus."}
    right: {label: "J'assume, blessé pas mort", effects: {tribunes: "--", vestiaire: "-"}, answer: "La Gazette titre ta réponse le lendemain, en plus gros. Au vestiaire, quelqu'un a entouré l'attelle au feutre rouge."}

  - id: jp.piege.confort
    roles: [joueur]
    arc: divers
    tags: [piege]
    speaker: clow
    text: "Au bar en face du stade, Corven ne touche pas à son verre d'eau : « Tout le monde t'aime, {toi}, et tu joues pour ne pas perdre. Ceux-là s'endorment, et on les réveille en juin. Tu fais quoi ? »"
    left: {label: "Je hausse le ton", effects: {vestiaire: "++", tribunes: "-"}, answer: "Lundi, toi qui ne cries jamais, tu cries au vestiaire. Le groupe se réveille ; la tribune trouve que tu as changé."}
    right: {label: "Je reste discret", effects: {tribunes: "--"}, answer: "Tu te tais. Les applaudissements baissent d'un ton chaque samedi, si lentement que tu ne l'entends pas."}
