  # ═══════════════════════════════════════════════ 7 · L'ARRIÈRE-SALLE
  - id: jp.h3.terminus.enveloppe
    roles: [joueur]
    arc: scandale
    tags: [sombre]
    speaker: steph
    lieu: tripot
    once: true
    tone: strategique
    when: "flag('h3_ardoise') && stats.clubs <= 1"
    text: "L'arrière-salle du Terminus, minuit. Steph pousse une enveloppe sur le tapis vert. « L'ardoise du Rideau, on te la rachète. Portclair, dimanche. Et samedi, tu ne marques pas avant la mi-temps. »"
    left:
      label: "Je porte l'enveloppe"
      effects: {caisse: "++", var: {ville_francs_sales: "+5000"}, set: [h3_enveloppe_portee], outcome: portee}
      answer: "L'enveloppe est épaisse comme un missel et ne pèse rien. Tu la ranges dans la boîte à gants, sous la carte routière."
    right:
      label: "Je sors par la cuisine"
      effects: {relation: {steph: -2}, set: [h3_enveloppe_refusee], outcome: refusee}
      answer: "La cuisine, les bacs de vaisselle, la porte de service. Dans la ruelle, deux hommes fument et te regardent passer sans bouger."

  - id: jp.h3.terminus.enveloppe_mere
    roles: [joueur]
    arc: scandale
    tags: [sombre, famille]
    speaker: steph
    lieu: tripot
    once: true
    tone: strategique
    when: "flag('h3_ardoise') && stats.clubs <= 1"
    text: "L'arrière-salle du Terminus. Steph pousse une enveloppe sur le tapis vert. « Ta page au Rideau est payée. Celle de ta mère, à l'épicerie, on l'a rachetée ce matin. Portclair, dimanche. »"
    left:
      label: "Je porte l'enveloppe"
      effects: {caisse: "++", var: {ville_francs_sales: "+5000"}, set: [h3_enveloppe_portee], outcome: portee}
      answer: "Tu prends l'enveloppe. Steph ajoute, en regardant ailleurs : « Et samedi, rien avant la mi-temps. » Il le dit comme une recette."
    right:
      label: "Je sors par la cuisine"
      effects: {relation: {steph: -2}, set: [h3_enveloppe_refusee], outcome: refusee}
      answer: "Tu sors par la cuisine. Le lendemain, l'épicière refuse l'argent de ta mère : « C'est réglé. » Elle regarde la porte en le disant."

  - id: jp.h3.terminus.route
    roles: [joueur]
    arc: scandale
    tags: []
    lieu: ailleurs
    once: true
    tone: strategique
    text: "Dimanche, la départementale de Portclair. Un gendarme lève la main, se penche à la vitre et reconnaît ta tête. « Contrôle. Ouvrez la boîte à gants, s'il vous plaît. »"
    left:
      label: "J'ouvre la boîte à gants"
      effects: {set: [h3_garde_a_vue], end: co_garde_a_vue}
      answer: "L'enveloppe glisse sur le tapis de sol. Il la ramasse avec deux doigts, comme une lettre d'amour qui ne serait pas pour lui."
    right:
      label: "Elle est coincée"
      effects: {tribunes: "-"}
      answer: "Il force le loquet, renonce. « Ma fille a votre photo au-dessus de son lit. » Il te fait signe de passer. Tu trembles jusqu'à Portclair."

  - id: jp.h3.terminus.mi_temps
    roles: [joueur]
    arc: moment
    tags: [moment]
    lieu: stade
    once: true
    tone: strategique
    text: "Trente-huitième minute. Le ballon te revient sur le pied droit, le gardien est au sol, le but est vide. En tribune Est, Steph est assis, les bras croisés. La mi-temps est dans sept minutes."
    left:
      label: "Je tire à côté"
      effects: {vestiaire: "--", caisse: "+", set: [h3_match_vendu], outcome: vendu}
      answer: "Le ballon frôle le poteau. Le stade crie, puis se tait. Dans le tunnel, Bréhaut ne te regarde pas : il regarde tes chaussures."
    right:
      label: "Je marque"
      effects: {tribunes: "++", relation: {steph: -2}, set: [h3_match_trahi], outcome: trahi}
      answer: "Le filet tremble. Tu cours vers la Nord sans regarder l'Est. Quand tu regardes enfin, la place de Steph est vide."

  # ═══════════════════════════════════════════════ 8 · LE CROCHET DU FOND (l'épilogue)
  - id: jp.h3.crochet.laverie
