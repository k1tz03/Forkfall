    text: "Léa déplie un journal étranger : « DIDIER VALLIN, {age_vallin} ANS, DOUBLÉ EN COUPE », un garçon blond en photo. « Ce nom était sous le vôtre, au crochet. Le vrai dort à la friche. Vous le saviez ? »"
    left:
      label: "Il faut l'écrire"
      effects: {direction: "-", relation: {lea: 1}, set: [h3_lea_ecrit]}
      answer: "Elle tape le titre avant le reste, QUI EST DIDIER VALLIN ?, et laisse la feuille dans la machine. « Il me faut une signature de plus. »"
    right:
      label: "Je ne savais pas"
      effects: {relation: {lea: -1}}
      answer: "« Maintenant, si. » Elle range le journal dans le tiroir sous sa machine à écrire, la photo du garçon blond au-dessus."

  - id: jp.h3.journal.photo
    roles: [joueur]
    arc: presse
    tags: [vestiaire, presse]
    speaker: vecchio
    lieu: vestiaire
    once: true
    tone: leger
    text: "Gigi Vecchio regarde longtemps la photo du garçon blond dans le journal étranger. « Didier était brun. Il tirait les coups francs du gauche, la main droite dans la poche. » Il rend le journal."
    left:
      label: "Dites-le à Léa"
      effects: {relation: {vecchio: 1, lea: 1}, set: [h3_gigi_a_parle]}
      answer: "Il n'y va pas. Le lendemain, Léa a une ligne de plus dans son papier, entre guillemets, signée « un ancien du club »."
    right:
      label: "Gardez ça pour vous"
      effects: {relation: {vecchio: -1}}
      answer: "Il remet ses gants, le droit d'abord. « Une chose de plus à garder. J'ai la place. » Il ne te regarde plus de la séance."

