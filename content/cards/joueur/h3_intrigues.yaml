# HISTOIRE 3 — LA SIRÈNE : les cartes des huit intrigues
# (content/arcs/joueur/h3_intrigues.yaml).
#
#   La maison de la cité  : la lettre, le chèque, le fanion de 1958, le pavillon, le garage
#   Le genou              : la porte du genou, le seau, la boîte (Momo ou Steph), le sac, le tiroir
#   L'ardoise             : la porte sans poignée, le combiné, les photos, la page vendue
#   Le coupé rouge        : la bâche, les lettres d'or, la dépanneuse
#   La ligne de touche    : Didier à la craie, la clé, la loge, le nom
#   Le journal étranger   : le doublé du garçon blond, Gigi ou le feu, la page composée
#   L'arrière-salle       : l'enveloppe, la départementale, la trente-huitième minute
#   Le crochet du fond    : la laverie, la vente aux enchères, le sparadrap du petit
#
# Aucune carte en drame ; les soirs (`sombre`) sont mis en scène le soir, à leur
# lieu, par la ville. Les accords du joueur passent par {pg, select, …} ou une
# tournure neutre.
cards:
  # ═══════════════════════════════════════════════ 1 · LA MAISON DE LA CITÉ
  - id: jp.h3.maison.lettre
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: odile
    lieu: domicile
    once: true
    tone: strategique
    text: "Odile pose la lettre de l'usine sur la toile cirée : fermeture à Noël, les maisons de la cité vendues aux locataires, cent quatre-vingt mille francs. « On partira. C'est pas grave. »"
    left:
      label: "On ne partira pas"
      effects: {relation: {odile: 1}, caisse: "-"}
      answer: "Elle replie la lettre en trois, dans les plis de la poste, et la glisse sous la photo de ton père. « Alors faudra de l'argent. »"
    right:
      label: "On partira, maman"
      effects: {caisse: "+", set: [h3_maison_lachee]}
      answer: "« Voilà. » Elle se lève pour la vaisselle, qui est faite. Elle la refait quand même, assiette par assiette, le dos tourné."

  # Variante du fil : Odile a débranché le téléphone le soir de l'appel de Fardelli (h3_fil_debranche).
  - id: jp.h3.maison.lettre_fil
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: odile
    lieu: domicile
    once: true
    tone: strategique
    text: "Odile pose la lettre de l'usine près du téléphone débranché depuis le soir de Fardelli : les maisons vendues aux locataires, cent quatre-vingt mille francs. « On partira. Ce n'est pas grave. »"
    left:
      label: "On ne partira pas"
      effects: {relation: {odile: 1}, caisse: "-"}
      answer: "Elle replie la lettre en trois, la glisse sous la photo de ton père et rebranche le téléphone. « Alors il faudra de l'argent. »"
    right:
      label: "On partira, maman"
      effects: {caisse: "+", set: [h3_maison_lachee]}
      answer: "« Voilà. » Elle se lève pour la vaisselle, qui est faite. Le téléphone reste débranché ; elle la refait quand même, le dos tourné."

  - id: jp.h3.maison.cheque
    roles: [joueur]
    arc: agents
    tags: [agents, famille]
    speaker: fardelli
    lieu: parking
    once: true
    tone: strategique
    text: "Sur le tableau de bord de Fardelli, il y a un chèque déjà rempli de cent quatre-vingt mille. « La maison de ta mère. Tu me rendras quand tu vaudras dix fois ça, {toi}. »"
    left:
      label: "Je prends le chèque"
      effects:
        caisse: "+"
        relation: {fardelli: 1}
        set: [h3_maison_achetee]
        outcome: achetee
        schedule: [{card: jp.h3.ardoise.porte, in: [2, 4]}]
        react: {card: jp.h3.re.odile_cheque}
      answer: "Le chèque est tiède d'avoir dormi au soleil. Au dos, au crayon, ta date de naissance. Tu le plies en deux sans poser la question."
    right:
      label: "Je refuse"
      effects:
        direction: "-"
        relation: {fardelli: -1}
        set: [h3_cheque_refuse]
        outcome: refuse
        schedule: [{card: jp.h3.ardoise.porte, in: [2, 4]}]
      answer: "Il glisse le chèque sous le pare-soleil sans le plier. « Il bouge pas de là. Le pare-soleil, c'est le meilleur coffre de la ville. »"

  - id: jp.h3.maison.cheque_lachee
    roles: [joueur]
    arc: agents
    tags: [agents, famille]
    speaker: fardelli
    lieu: parking
    once: true
    tone: strategique
    text: "Fardelli, vitre baissée, un chèque déjà rempli sur le tableau de bord : « Ta mère a dit qu'elle partirait. Elle l'a dit à la caisse de l'épicerie, en pleurant. La maison, {toi}. Tu prends ? »"
    left:
      label: "Je prends le chèque"
      effects:
        caisse: "+"
        relation: {fardelli: 1}
        set: [h3_maison_achetee]
        outcome: achetee
        schedule: [{card: jp.h3.ardoise.porte, in: [2, 4]}]
        react: {card: jp.h3.re.odile_cheque}
      answer: "Le soir, ta mère regarde le chèque posé sur la toile cirée sans le toucher, comme une lettre qui ne serait pas pour elle."
    right:
      label: "Je refuse"
      effects:
        direction: "-"
        relation: {fardelli: -1}
        set: [h3_cheque_refuse]
        outcome: refuse
        schedule: [{card: jp.h3.ardoise.porte, in: [2, 4]}]
      answer: "« Elle pleurera ailleurs, alors. » Il glisse le chèque sous le pare-soleil, sans le plier. « Il attendra. Moi aussi. »"

  - id: jp.h3.maison.fanion
    roles: [joueur]
    arc: sponsors
    tags: [sponsors, decor]
    lieu: friche
    once: true
    tone: leger
    text: "Le bureau du directeur de la Tréfilerie est à moitié vidé. Il te tend le fanion du club de l'usine, 1958. « Le chèque des maillots va revenir impayé. Le fanion, je le laisse pas partir aux enchères. »"
    left:
      label: "Je le prends"
      effects: {tribunes: "+", set: [h3_fanion]}
      answer: "Le feutre a passé au soleil, sauf là où la punaise le tenait. Ta mère le range dans son sac à main, pas au mur, entre son porte-monnaie et ses clés."
    right:
      label: "Gardez-le, monsieur"
      effects: {tribunes: "-"}
      answer: "Il le repose sur le bureau vide. Le lendemain, le fanion est sur la liste du liquidateur, lot 340, entre deux machines à écrire."

  - id: jp.h3.maison.pavillon
    roles: [joueur]
    arc: agents
    tags: [agents, famille]
    speaker: fardelli
    lieu: rue
    once: true
    tone: strategique
    text: "Fardelli tapote la vitrine de l'agence Tessandier : un pavillon aux Lilas, un jardin, un garage. « La cité meurt. J'avance l'argent sur ton prochain transfert, {toi}. Ta mère n'a qu'à signer. »"
    left:
      label: "Signez pour ma mère"
      effects: {caisse: "+", relation: {fardelli: 1}, var: {cadeau_pavillon: "+1"}, set: [h3_pavillon]}
      answer: "Il signe le compromis sur le capot. L'argent passera par un marchand de spiritueux de Portclair. « Un ami. Il avance pour moi. »"
    right:
      label: "Elle reste à la cité"
      effects: {relation: {fardelli: -1, odile: 1}}
      answer: "« La cité, alors. » Il regarde encore la vitrine, comme on regarde un plat qu'on n'a pas commandé, et entre seul dans l'agence."

  - id: jp.h3.maison.pavillon_cite
    roles: [joueur]
    arc: agents
    tags: [agents, famille]
    speaker: fardelli
    lieu: rue
    once: true
    tone: strategique
    text: "Fardelli devant la vitrine de Tessandier : « La cité se mure, rangée par rangée. Ta mère ne va pas finir entre deux parpaings, {toi}. Le pavillon des Lilas, avec jardin. J'avance. »"
    left:
      label: "Signez pour ma mère"
      effects: {caisse: "+", relation: {fardelli: 1}, var: {cadeau_pavillon: "+1"}, set: [h3_pavillon]}
      answer: "Il signe sur le capot. « On revend la maison de la cité au liquidateur, on prend le pavillon. Le marchand de Portclair fait le reste. »"
    right:
      label: "Elle reste à la cité"
      effects: {relation: {fardelli: -1, odile: 1}}
      answer: "« Entre deux parpaings, alors. » Il allume une cigarette, la regarde brûler sans la fumer, et l'écrase dans le cendrier de la portière."

  - id: jp.h3.maison.garage
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: odile
    lieu: domicile
    once: true
    tone: leger
    text: "Ta mère n'a pas défait les cartons du pavillon. Ils sont dans le garage, empilés, étiquetés au feutre : CUISINE, PAPIERS, TON PÈRE. « Au cas où », dit-elle. Elle ne dit pas au cas où quoi."
    left:
      label: "Je les défais avec toi"
      effects: {relation: {odile: 1}, set: [h3_cartons_defaits]}
      answer: "Vous ouvrez CUISINE. Elle range trois assiettes dans le placard neuf, puis les remet dans le carton. « Demain. »"
    right:
      label: "Ils sont bien là"
      effects: {relation: {odile: -1}}
      answer: "« Ils sont bien là », répète-t-elle. Le soir, elle dort sur le canapé du salon, tournée vers la porte du garage."

  # ═══════════════════════════════════════════════ 2 · LE GENOU
  - id: jp.h3.genou.porte
    roles: [joueur]
    arc: corps
    tags: []
    speaker: sabatier
    lieu: cabinet
    once: true
    tone: strategique
    text: "Sabatier plie ton genou lentement, l'oreille presque contre la rotule. « Il a un avis, ton genou. Je l'écris dans ton dossier, ou je le garde pour moi jusqu'en juin ? »"
    left:
      label: "Écrivez-le"
      effects: {direction: "-", relation: {sabatier: 1}, set: [h3_genou_ecrit], outcome: ecrit}
      answer: "Il écrit trois lignes à l'encre et date. Puis il te les lit, le nez sur la feuille. Tu les sauras par cœur avant juin."
    right:
      label: "Gardez-le pour vous"
      effects:
        direction: "+"
        set: [h3_genou_cache]
        outcome: cache
        react: {card: jp.h3.re.sabatier_tiroir}
      answer: "Il repose ta jambe sur la table, doucement, à deux mains. « Jusqu'en juin. » Il n'écrit rien, et rebouche son stylo sans te regarder."

  - id: jp.h3.genou.seau
    roles: [joueur]
    arc: corps
    tags: [vestiaire]
    speaker: vecchio
    lieu: vestiaire
    once: true
    tone: leger
    text: "Gigi te trouve au local du matériel, le genou dans un seau de glace. Il s'assoit sur le panier de ballons. « Didier, il mettait le sien dans ce seau-là. Il disait que la glace rend le genou sourd. »"
    left:
      label: "Il est parti où, Didier ?"
      effects: {relation: {vecchio: 1}, set: [h3_didier_demande]}
      answer: "« À l'étranger. C'est ce qu'on a écrit. » Il te tend une serviette pour le genou, et sort sans fermer la porte."
    right:
      label: "Pas un mot au coach"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Il remet de la glace dans le seau, à la main, et compte jusqu'à soixante pour toi, tout bas."

  - id: jp.h3.genou.momo
    roles: [joueur]
    arc: corps
    tags: [vestiaire]
    lieu: vestiaire
    once: true
    tone: strategique
    text: "Au vestiaire, Momo, le latéral gauche, attend que les autres soient sous la douche. « La boîte de Steph, il paraît que ça marche. Tu m'en passes deux, en attendant ? »"
    left:
      label: "Va voir Steph"
      effects: {vestiaire: "+", set: [h3_momo_steph]}
      answer: "« Steph. D'accord. » Il le répète pour s'en souvenir. Le lundi suivant, il porte un survêtement neuf, comme Steph."
    right:
      label: "N'y touche pas"
      effects: {vestiaire: "-"}
      answer: "Il hausse les épaules. « Toi, tu y touches. » Il va sous la douche et chante faux, plus fort que d'habitude."

  - id: jp.h3.genou.banc
    roles: [joueur]
    arc: corps
    tags: []
    speaker: steph
    lieu: muscu
    once: true
    tone: strategique
    text: "Steph s'assoit au bout de ton banc de développé, un sac de sport entre les pieds. « Tu boites à gauche, comme Didier. Lui, il prenait ça. » Il pose une boîte sans étiquette sur la fonte."
    left:
      label: "Je la prends"
      effects: {caisse: "-", set: [h3_boite_prise]}
      answer: "La boîte tient dans la poche du blouson. Tu la sens à chaque pas jusqu'à la cité, comme une deuxième rotule."
    right:
      label: "Je la laisse sur la fonte"
      effects: {relation: {steph: -1}, tribunes: "-"}
      answer: "Il la remet dans son sac sans se vexer. « Elle t'attendra. » Quand tu sors, il est au rameur, immobile, les mains sur la poignée."

  # Variante de la question : tu as demandé à Gigi où était Didier ; Steph le sait (h3_didier_demande).
  - id: jp.h3.genou.banc_gigi
    roles: [joueur]
    arc: corps
    tags: []
    speaker: steph
    lieu: muscu
    once: true
    tone: strategique
    text: "Steph s'assoit au bout de ton banc, un sac entre les pieds. « Tu as demandé où était Didier. Ça se sait, un vestiaire. Il boitait à gauche aussi. » Il pose une boîte sans étiquette sur la fonte."
    left:
      label: "Je la prends"
      effects: {caisse: "-", set: [h3_boite_prise]}
      answer: "La boîte tient dans la poche du blouson. Tu la sens à chaque pas jusqu'à la cité, comme une deuxième rotule."
    right:
      label: "Je la laisse sur la fonte"
      effects: {relation: {steph: -1}, tribunes: "-"}
      answer: "Il la remet dans son sac sans se vexer. « Gigi te répondra encore l'étranger. Elle t'attendra. » Il retourne au rameur, immobile."

  - id: jp.h3.genou.sac
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: odile
    lieu: domicile
    once: true
    tone: strategique
    text: "Odile a vidé ton sac de sport sur la table de la cuisine, comme elle vidait les poches de ton père le vendredi. Les protège-tibias, la serviette, et au milieu, sous la lampe, la boîte."
    left:
      label: "C'est pour le genou"
      effects: {relation: {odile: -1}, set: [h3_boite_trouvee], outcome: gardee}
      answer: "Elle repousse la boîte vers toi du bout de l'index. « Ton père aussi avait mal au genou. » Elle garde la serviette, pour la laver."
    right:
      label: "Je ne mens pas"
      effects: {relation: {odile: 1}, tribunes: "-", set: [h3_boite_trouvee, h3_boite_jetee], outcome: jetee}
      answer: "Elle met la boîte dans sa poche de blouse et sort sans manteau. Au retour, elle dit seulement : « La Rive. Du haut du pont. »"

  - id: jp.h3.genou.arret
    roles: [joueur]
    arc: corps
    tags: []
    speaker: sabatier
    lieu: cabinet
    once: true
    tone: strategique
    text: "Sabatier prend ta tension, la reprend, regarde le cadran longtemps, puis ouvre le tiroir du bas, vide. « Tu poses la boîte là-dedans, et on n'en parle plus. Ou tu la gardes. Choisis ici. »"
    left:
      label: "Je la pose"
      effects: {force: -1, relation: {sabatier: 1}, set: [h3_boite_arretee], outcome: arretee}
      answer: "Le tiroir se referme avec un bruit de dossier. Trois semaines plus tard, le genou fait mal comme avant. C'est presque un soulagement."
    right:
      label: "Encore un mois"
      effects: {caisse: "-", relation: {sabatier: -1}, outcome: gardee}
      answer: "Il referme le tiroir vide, doucement. « Un mois. » Il note la date dans son carnet, et l'heure, ce qu'il ne fait jamais."

  # ═══════════════════════════════════════════════ 3 · L'ARDOISE
  - id: jp.h3.ardoise.porte
    roles: [joueur]
    arc: scandale
    tags: [sombre]
    speaker: irene
    lieu: club_prive
    once: true
    tone: strategique
    text: "Samedi, vingt-trois heures, le match dans les jambes. Derrière la porte sans poignée, Madame Irène te tend un masque de soie noire. « Mes clients n'ont pas de nom. Le vôtre est sur l'ardoise. »"
    left:
      label: "Je mets le masque"
      effects: {caisse: "-", tribunes: "-", set: [h3_ardoise]}
      answer: "La soie sent le parfum de quelqu'un d'autre. À trois heures, Irène écrit un chiffre sous ton nom, à l'encre violette, et souffle dessus."
    right:
      label: "Je redescends la rue"
      effects: {direction: "+", outcome: refuse}
      answer: "L'homme en costume t'ouvre de l'intérieur. Dehors, il pleut. Le masque est resté sur le velours, plié en deux, pour le suivant."

  - id: jp.h3.ardoise.mere
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: irene
    lieu: club_prive
    once: true
    tone: strategique
    text: "Trois heures du matin. Madame Irène tient le combiné du bar, la main sur le micro : « Votre mère. Elle demande si vous êtes ici. Je lui dis que vous n'êtes plus là depuis longtemps ? »"
    left:
      label: "Mentez-lui"
      effects: {relation: {irene: 1, odile: -1}, set: [h3_irene_ment]}
      answer: "« Parti depuis longtemps, madame. Dormez. » Elle raccroche et note une ligne de plus sous ton nom. « Le mensonge, je le mets sur votre ardoise. »"
    right:
      label: "Passez-la-moi"
      effects: {relation: {odile: 1}, tribunes: "-"}
      answer: "Au bout du fil, dix secondes de souffle. Puis : « Rentre. » Irène t'appelle un taxi et l'ajoute à l'ardoise."

  - id: jp.h3.ardoise.photos
    roles: [joueur]
    arc: scandale
    tags: [sombre, scandale]
    lieu: cafe
    once: true
    tone: strategique
    text: "Café de la Mairie. Un inconnu glisse une enveloppe sous ta soucoupe : toi à trois heures, sortant du Rideau, le masque à la main. « La Gazette paie cinq mille. Moi, dix, pour qu'elles dorment. »"
    left:
      label: "Je paie"
      effects: {caisse: "--", var: {ville_amende: "+10000"}, set: [h3_photos_payees]}
      answer: "Dix mille en liquide, sous la même soucoupe. Il laisse son café payé. Les négatifs, eux, ne sont pas dans l'enveloppe."
    right:
      label: "Qu'il les vende"
      effects:
        tribunes: "--"
        set: [h3_photos_gazette]
        react: {card: jp.h3.re.meneche_photos, if: "relation.meneche >= 0"}
      answer: "Jeudi, page trois de la Gazette Rose : le masque, l'heure, ton nom en capitales. Ta mère achète tous les exemplaires de l'épicerie."

  - id: jp.h3.ardoise.rachat
    roles: [joueur]
    arc: scandale
    tags: []
    speaker: irene
    lieu: club_prive
    once: true
    tone: strategique
    text: "Madame Irène ouvre le cahier à ta page et tourne vers toi le total, à l'encre violette. « Monsieur Fardelli veut racheter votre page. Je la lui vends demain, si vous ne la réglez pas ce soir. »"
    left:
      label: "Je règle ce soir"
      effects: {caisse: "--", var: {ville_amende: "+20000"}, set: [h3_ardoise_payee], outcome: payee}
      answer: "Tu comptes vingt mille sur le velours. Elle raye ta page d'un trait, sans arracher la feuille. « Le nom reste. Il reste toujours. »"
    right:
      label: "Qu'il la rachète"
      effects: {caisse: "+", relation: {fardelli: -1}, set: [h3_ardoise_fardelli], outcome: vendue}
      answer: "Le lendemain, au parking, Fardelli tapote la poche de sa veste en te croisant, et ne s'arrête même pas."

  # ═══════════════════════════════════════════════ 4 · LE COUPÉ ROUGE
  - id: jp.h3.coupe.bache
    roles: [joueur]
    arc: sponsors
    tags: [sponsors, agents]
    speaker: fardelli
    lieu: parking
    once: true
    tone: strategique
    when: "stats.clubs <= 1"
    text: "Au fond du garage du Pont, Fardelli soulève une bâche sur un coupé rouge, SPIRITUEUX DAUBRAC en lettres d'or sur la portière. « Daubrac te le prête, {toi}. Contre une soirée au Rideau par mois. »"
    left:
      label: "Je prends les clés"
      effects: {caisse: "+", tribunes: "-", var: {cadeau_coupe_sport: "+1"}, set: [h3_coupe]}
      answer: "Le moteur prend au premier tour. Le vendeur t'ouvre le portail en regardant les lettres d'or, pas toi."
    right:
      label: "Je garde le car"
      effects: {direction: "-", set: [h3_coupe_mbako], outcome: refuse}
      answer: "Fardelli rabat la bâche. « Daubrac le prêtera à un autre, va. » Il regarde vers le centre de formation."

  - id: jp.h3.coupe.lettres
    roles: [joueur]
    arc: tribunes
    tags: [ultras]
    speaker: gege
    lieu: parking
    once: true
    tone: leger
    text: "Gégé fait le tour du coupé sans le toucher, mains dans le dos. « Daubrac, c'est celui qui a racheté la cantine de l'usine pour un franc. » Il s'arrête devant les lettres d'or. « Tu nous ramènes ? »"
    left:
      label: "Montez, je vous ramène"
      effects: {tribunes: "+", relation: {gege: 1}, set: [h3_nord_ramenee]}
      answer: "Quatre de la Nord sur la banquette, Gégé devant. Il ne touche à rien. Au feu rouge, il essuie de sa manche la buée de son souffle."
    right:
      label: "C'est un prêt"
      effects: {tribunes: "-", relation: {gege: -1}, set: [h3_coupe_pret]}
      answer: "« Un prêt. » Il le répète au virage samedi, au mégaphone, et la Nord le chante sur l'air d'une berceuse."

  - id: jp.h3.coupe.lettres_mbako
    roles: [joueur]
    arc: formation
    tags: [formation]
    speaker: mbako
    lieu: parking
    once: true
    tone: leger
    text: "Le coupé rouge de Daubrac est garé devant le centre de formation. Lian Mbako, {age_mbako} ans, sans permis, fait tourner les clés sur son doigt. « Ils me l'ont prêté. Tu montes ? »"
    left:
      label: "Rends-lui les clés"
      effects: {vestiaire: "-", relation: {mbako: 1}}
      answer: "Il te regarde comme on regarde un adulte, et garde les clés. « Toi, tu les as rendues. Moi, je n'ai jamais eu de voiture. »"
    right:
      label: "Je monte"
      effects: {tribunes: "-", relation: {mbako: 1}}
      answer: "Il cale deux fois, rit, repart. Sur la portière, les lettres d'or. Personne ne regarde le conducteur ; tout le monde lit le nom."

  - id: jp.h3.coupe.depanneuse
