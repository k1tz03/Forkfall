    once: true
    tone: strategique
    text: "Au feu de palettes, Didier lit le journal étranger : son nom en gros, la photo du garçon blond. Il le plie en quatre. « Il marque plus que moi. » Il le tend vers les flammes, sans le lâcher."
    left:
      label: "Laisse Léa l'écrire"
      effects: {relation: {vallin: 1}, set: [h3_lea_ecrit]}
      answer: "Il retire le journal du feu, un coin noirci. « Qu'elle écrive mon nom. Pas le sien, à lui. » Il te le rend pour Léa."
    right:
      label: "Brûle-le"
      effects: {relation: {vallin: -1}}
      answer: "Le papier prend d'un coup. Le garçon blond brûle en dernier. Didier regarde jusqu'à la cendre, puis va dormir dans le wagon."

  - id: jp.h3.journal.une
    roles: [joueur]
    arc: presse
    tags: [presse]
    speaker: lea
    lieu: echo
    once: true
    tone: strategique
    text: "Léa a composé la page : QUI EST DIDIER VALLIN ?, la licence de 1989, le garçon blond. « Mercredi, si j'ai une deuxième signature. Josiane hésite. Et vous, {toi} ? »"
    left:
      label: "Mettez mon nom"
      effects: {direction: "--", tribunes: "+", relation: {lea: 1}, set: [h3_signe_lea], outcome: signe}
      answer: "Elle tape ton nom sous le sien, sans une faute de frappe. « Mercredi. Ne répondez pas au téléphone mardi soir. »"
    right:
      label: "Attendez Josiane"
      effects: {relation: {lea: -1}, set: [h3_josiane_prevenue], outcome: seule}
      answer: "« Je lui porte la page ce soir. » Elle la glisse dans une chemise cartonnée. Sur la chemise, au feutre : JOSIANE."

