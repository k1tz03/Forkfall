    once: true
    tone: leger
    text: "La laverie de la rue du Stade. Ta mère y lave les maillots du club depuis que la machine du stade a été saisie. Elle plie le tien, le numéro en dedans. « Tu restes, ou tu as entraînement ? »"
    left:
      label: "Je plie avec toi"
      effects: {relation: {odile: 1}}
