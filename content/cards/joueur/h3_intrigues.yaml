  # ═══════════════════════════════════════════════ 5 · LA LIGNE DE TOUCHE
  - id: jp.h3.didier.ligne
    roles: [joueur]
    arc: formation
    tags: []
    speaker: vallin
    lieu: friche
    once: true
    tone: leger
    text: "Grande halle, le soir. Didier Vallin repasse à la craie la ligne de touche de son terrain, à genoux, sans lever la tête. « Ils t'ont mis sur mon crochet. Ils t'ont donné la place près de la porte ? »"
    left:
      label: "Tu jouais où, avant ?"
      effects: {relation: {vallin: 1}, set: [h3_halle_vue]}
      answer: "« Ici. » Il tape la craie sur le béton. « Avant ici, au stade. Avant le stade, à ta place. » Il se remet à tracer."
    right:
      label: "Je ne te connais pas"
      effects:
        relation: {vallin: -1}
        set: [h3_halle_vue]
        react: {card: jp.h3.re.vallin_craie}
      answer: "« Personne ne me connaît. C'est le principe. » Il finit sa ligne jusqu'au poteau de béton, et ne se retourne pas."

  - id: jp.h3.didier.ligne_did
    roles: [joueur]
    arc: formation
    tags: []
    speaker: vallin
    lieu: friche
    once: true
    tone: leger
    text: "Didier Vallin, à genoux sur le béton de la grande halle, repasse la ligne de touche à la craie. « Tu as laissé mes trois lettres sous ton nom. Les autres arrachaient. » Il ne lève pas la tête."
    left:
      label: "Tu jouais où, avant ?"
      effects: {relation: {vallin: 1}, set: [h3_halle_vue]}
      answer: "« À ta place. Près de la porte. » Il souffle la poussière de craie sur sa ligne. « Le courant d'air, je l'ai eu deux ans. »"
    right:
      label: "C'était par hasard"
      effects:
        relation: {vallin: -1}
        set: [h3_halle_vue]
        react: {card: jp.h3.re.vallin_craie}
      answer: "« Le hasard, c'est déjà quelque chose. » Il trace jusqu'au poteau, et s'assoit dessus, le dos tourné."

  - id: jp.h3.didier.cle
    roles: [joueur]
    arc: formation
    tags: []
    speaker: vallin
    lieu: friche
    once: true
    tone: leger
    text: "Didier lève les yeux vers la tour de la grande halle. « La sirène, en février, c'était moi. Depuis, le gardien du liquidateur a repris la clé. Elle pend à sa loge, avec un chien dessous. »"
    left:
      label: "J'irai la chercher"
      effects: {relation: {vallin: 1}, direction: "-", set: [h3_cle_promise]}
      answer: "« Pas pour moi. Pour le prochain. » Il trace une croix à la craie sur ton blouson, à l'épaule, là où on coud les numéros."
    right:
      label: "Pourquoi tu tires ?"
      effects: {relation: {vallin: 1}}
      answer: "« Quand un gamin descend, il faut que la ville l'entende. Le club ne le dit pas. » Il range sa craie dans une boîte de pellicule."

  - id: jp.h3.didier.loge
    roles: [joueur]
    arc: scandale
    tags: [sombre]
    lieu: friche
    once: true
    tone: leger
    text: "La loge du gardien de l'usine, une nuit sans lune. Ta lampe sur la fenêtre, le chien du liquidateur qui dort contre la porte. La clé pend à un clou, une étiquette dessus : TOUR."
    left:
      label: "Je décroche la clé"
      effects: {vestiaire: "-", set: [h3_cle_sirene]}
      answer: "Le clou grince ; le chien ouvre un œil, et le referme. La clé reste froide dans ta poche jusqu'au matin. Didier la prend sans un merci."
    right:
      label: "Je laisse dormir le chien"
      effects: {direction: "+"}
      answer: "Tu éteins ta lampe et tu attends que la fenêtre redevienne noire. Le chien n'a pas bougé. Didier, lui, ne demande rien."

  - id: jp.h3.didier.loge_faite
    roles: [joueur]
    arc: formation
    tags: []
    speaker: vallin
    lieu: friche
    once: true
    tone: leger
    text: "Didier fait tourner la clé de la tour entre ses doigts, au-dessus du feu de palettes. « Le chien ne t'a pas entendu. Moi, si. » Il la glisse dans sa capote. « Je ne tirerai plus pour rien. »"
    left:
      label: "Tire pour qui tu veux"
      effects: {relation: {vallin: 1}}
      answer: "« Pour celui qui finit debout. » Il jette une palette dans le feu. Les étincelles montent jusqu'au toit troué de la halle."
    right:
      label: "Tire pour moi"
      effects: {relation: {vallin: 1}, tribunes: "+"}
      answer: "« Pour toi, il faudra jouer jusqu'au bout. » Il le dit sans sourire, comme on fixe une heure de rendez-vous."

  - id: jp.h3.didier.nom
    roles: [joueur]
    arc: formation
    tags: []
    speaker: vallin
    lieu: friche
    once: true
    tone: leger
    text: "Sur le mur de la grande halle, Didier écrit son nom à la craie, en lettres d'un mètre. Il te tend la craie. « Personne l'a dit depuis juin 1989. Lis-le. Fort. »"
    left:
      label: "Je le lis tout haut"
      effects: {relation: {vallin: 2}, set: [h3_didier_nom], outcome: nom}
      answer: "Ta voix revient du toit troué, deux fois. Didier écoute l'écho jusqu'au bout, puis il essuie la craie sur sa capote."
    right:
      label: "Pas ici, Didier"
      effects: {relation: {vallin: -1}, outcome: silence}
      answer: "Il passe la paume sur son nom, jusqu'à ce qu'il ne reste qu'une tache blanche sur le mur."

  # ═══════════════════════════════════════════════ 6 · LE JOURNAL ÉTRANGER
  - id: jp.h3.journal.journal
    roles: [joueur]
    arc: presse
    tags: [presse]
    speaker: lea
    lieu: echo
    once: true
    tone: strategique
    text: "Léa déplie un journal d'un pays qu'on ne nomme pas : « DIDIER VALLIN, {age_vallin} ANS, DOUBLÉ EN COUPE ». Sur la photo, un garçon blond que personne ici ne connaît. « Didier est brun. »"
    left:
      label: "Il faut l'écrire"
      effects: {direction: "-", relation: {lea: 1}, set: [h3_lea_ecrit]}
      answer: "Elle glisse une feuille dans la machine et tape le titre avant le reste : QUI EST DIDIER VALLIN ? « Il me faut un nom à côté du mien. »"
    right:
      label: "Laissez-moi lui dire"
      effects: {relation: {lea: -1, vallin: 1}, set: [h3_didier_prevenu]}
      answer: "Elle replie le journal et te le tend. « Vingt-quatre heures. Après, je l'écris, avec ou sans lui. » Elle garde la photo."

  - id: jp.h3.journal.inconnu
