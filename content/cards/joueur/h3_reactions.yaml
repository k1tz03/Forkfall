# HISTOIRE 3 — LA SIRÈNE : les réactions (spec variété § 1.4). Une carte
# servie au tirage suivant, hors créneau, quand un choix a quelqu'un pour
# témoin : Gigi derrière la vitre du vestiaire, Odile devant le chèque, la mère
# qui monte l'escalier du studio. Quatre par saison au plus (le moteur).
cards:
  - id: jp.h3.re.vecchio_main
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: vecchio
    lieu: vestiaire
    once: true
    tone: leger
    text: "Gigi Vecchio essuie la buée de la vitre du vestiaire avec sa manche. « Je t'ai vu au parking. Ton père aussi avait serré cette main-là. Il serrait toutes les mains, ton père. »"
    left:
      label: "Il avait tort ?"
      effects: {relation: {vecchio: 1}}
      answer: "Gigi hausse une épaule. « Il est mort à quarante et un ans. » Il retourne à ses gants."
    right:
      label: "Ça ne vous regarde pas"
      effects: {relation: {vecchio: -1}}
      answer: "« Non. » Il enfile le gant droit, puis le gauche, plus lentement. « Rien me regarde, moi. Je regarde quand même. »"

  - id: jp.h3.re.odile_cheque
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: odile
    lieu: domicile
    once: true
    tone: leger
    text: "Odile regarde le chèque de Fardelli posé contre le sucrier, sans y toucher. « Ton père, il disait que cet homme avait des mains de notaire. Dans sa bouche, c'était pas un compliment. »"
    left:
      label: "On le signera ensemble"
      effects: {relation: {odile: 1}}
      answer: "Elle signe le compromis à la table de la cuisine, en appuyant fort. Le stylo a percé le papier sur le O de son prénom."
    right:
      label: "Je m'en occupe"
      effects: {relation: {odile: -1}}
      answer: "Elle se lève pour ranger le sucrier. Le chèque, privé d'appui, tombe à plat sur la toile cirée. Elle ne le ramasse pas."

  - id: jp.h3.re.brehaut_sirene
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: brehaut
    lieu: vestiaire
    once: true
    tone: leger
    text: "Bréhaut te rattrape au vestiaire, après la dernière sirène. « T'as laissé le groupe au premier rang, pour la photo. Ta mère, je comprends. Les autres, je leur explique comment ? »"
    left:
      label: "Comme ça"
      effects: {vestiaire: "-", relation: {brehaut: 1}}
      answer: "« Comme ça. » Le lendemain, la photo de L'Écho montre le groupe, et un trou au premier rang, à ta taille."
    right:
      label: "Je paie une tournée"
      effects: {caisse: "-", vestiaire: "+"}
      answer: "La tournée au Corner, vingt-deux demis. Bréhaut boit le sien en dernier, en regardant la porte, pas toi."

  # L'autre côté du grillage : resté avec l'équipe pour la photo, c'est la Nord
  # qui a vu ta mère.
  - id: jp.h3.re.gege_grillage
    roles: [joueur]
    arc: tribunes
    tags: [ultras]
    speaker: gege
    lieu: friche
    once: true
    tone: leger
    text: "Après la sirène, Gégé décroche ses doigts du grillage. « T'étais sur la photo, avec l'équipe. Ta mère était derrière nous. Elle a ralenti devant toi, comme d'habitude. »"
    left:
      label: "Elle a dit quelque chose ?"
      effects: {relation: {gege: 1, odile: 1}}
      answer: "« Rien. Elle a regardé l'usine jusqu'au bout du son. » Gégé remet son bonnet. « Nous aussi. C'était la dernière. »"
    right:
      label: "J'étais avec l'équipe"
      effects: {tribunes: "-", relation: {gege: -1}}
      answer: "« On t'a vu. » Il remet son bonnet. « De ce côté du grillage, on était quatre cents. Toi, t'étais sur la photo. »"

  - id: jp.h3.re.sabatier_tiroir
    roles: [joueur]
    arc: corps
    tags: []
    speaker: sabatier
    lieu: stade
    once: true
    tone: leger
    text: "Sabatier te croise dans le couloir du stade, ton dossier sous le bras. « Ce que je garde pour moi, je le garde aussi contre toi. Tu comprends ça ? »"
    left:
      label: "Je le comprends"
      effects: {relation: {sabatier: 1}}
      answer: "« Alors tu sais tout. » Il serre le dossier contre sa blouse, côté cœur, et s'éloigne vers l'infirmerie."
    right:
      label: "Contre moi ?"
      effects: {relation: {sabatier: -1}}
      answer: "« Contre ton genou, si tu préfères. » Il s'en va en boitant un peu, du même genou que toi."

  - id: jp.h3.re.meneche_photos
    roles: [joueur]
    arc: presse
    tags: [presse]
    speaker: meneche
    lieu: stade
    once: true
    tone: leger
    text: "Pierre Massenet t'arrête à la sortie du stade, son carnet fermé. « On me les a proposées avant la Gazette. Je ne les ai pas achetées. Je voulais que vous le sachiez, pas que vous me remerciiez. »"
    left:
      label: "Merci quand même"
      effects: {relation: {meneche: 1}}
      answer: "« Je vous ai dit de ne pas. » Il range le carnet. Il le ressortira le jour où il aura besoin d'une phrase de vous."
    right:
      label: "Mais vous les avez vues"
      effects: {relation: {meneche: -1}}
      answer: "« Je les ai vues. » Il soutient ton regard. « Les voir, c'est mon travail. Ne pas les vendre, c'était une décision. »"

  - id: jp.h3.re.lea_sirene
    roles: [joueur]
    arc: presse
    tags: [presse, telephone]
    speaker: lea
    lieu: domicile
    once: true
    tone: leger
    text: "Léa appelle à huit heures. « La sirène de la Tréfilerie a sonné à trois heures, cette nuit. Le liquidateur dit que c'est le vent. Vous l'avez entendue, vous ? »"
    left:
      label: "Je l'ai entendue"
      effects: {relation: {lea: 1}, tribunes: "-"}
      answer: "« D'où ? » Tu ne réponds pas. Au bout du fil, son stylo gratte trois lignes, puis une quatrième. Elle dit merci."
    right:
      label: "Je dormais"
      effects: {relation: {lea: -1}}
      answer: "« Toute la ville dormait, alors. » Elle raccroche. Le lendemain, dans L'Écho : « LE VENT DANS LA TOUR », six lignes."

  - id: jp.h3.re.vallin_craie
    roles: [joueur]
    arc: formation
    tags: []
    speaker: vallin
    lieu: parking
    once: true
    tone: leger
    text: "Le lendemain, une ligne à la craie sur le bitume du parking, de la porte du vestiaire à la grille. Didier, assis sur le muret, mange une pomme. « Pour que tu me reconnaisses, la prochaine fois. »"
    left:
      label: "Je te reconnais"
      effects: {relation: {vallin: 1}}
      answer: "« Pas encore. » Il croque la pomme jusqu'au trognon, et lance le trognon dans la benne de l'usine, de loin, sans viser."
    right:
      label: "Efface ça"
      effects: {relation: {vallin: -1}}
      answer: "Il efface la ligne à la semelle, lentement, sur vingt mètres. Il en reste une trace blanche, droite quand même."

  - id: jp.h3.re.mbako_buvard
    roles: [joueur]
    arc: formation
    tags: [formation]
    speaker: mbako
    lieu: terrain
    once: true
    tone: leger
    text: "Lian Mbako t'attend au terrain annexe, les crampons à la main. « Le président m'a fait monter. Il m'a montré son buvard : mon nom, entouré au crayon. C'est bien, entouré ? »"
    left:
      label: "C'est bien"
      effects: {relation: {mbako: -1}}
      answer: "Il sourit, soulagé, et lace ses crampons en double nœud. Tu le regardes faire les deux nœuds, et tu ne dis plus rien."
    right:
      label: "Méfie-toi du crayon"
      effects: {relation: {mbako: 1}, direction: "-"}
      answer: "Il fronce les sourcils. « Ma mère dit pareil. Elle dit : méfie-toi de tout ce qui se gomme. » Il s'en va le répéter."

  - id: jp.h3.re.odile_studio
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: odile
    lieu: tripot
    once: true
    tone: leger
    text: "Ta mère monte l'escalier du studio, au-dessus du Terminus, avec ses deux valises. En bas, quelqu'un rit à l'arrière-salle. « C'est propre », dit-elle. Elle n'a pas encore ouvert la porte."
    left:
      label: "Je monte avec toi"
      effects: {relation: {odile: 1}}
      answer: "Une pièce, un évier, une fenêtre sur la cour des poubelles. Elle pose la photo de ton père sur le rebord, face au mur, puis la retourne."
    right:
      label: "Je passe demain"
      effects: {relation: {odile: -1}}
      answer: "« Demain. » Elle monte seule. Tu attends dans la rue que la lumière s'allume. Elle s'allume tard, et pas longtemps."

  - id: jp.h3.re.gege_depanneuse
    roles: [joueur]
    arc: tribunes
    tags: [ultras]
    speaker: gege
    lieu: buvette
    once: true
    tone: leger
    text: "Gégé pose une bière devant toi à la buvette, sans que tu aies demandé. « On a chanté ton nom pendant qu'ils levaient la voiture. On le chantera pour la prochaine. Il y en aura une ? »"
    left:
      label: "Il n'y en aura pas"
      effects: {tribunes: "+", relation: {gege: 1}}
      answer: "« Tant mieux. » Il trinque contre ton verre plein. « La Nord n'aime pas chanter pour des voitures. Elle aime chanter pour toi. »"
    right:
      label: "Il y en a toujours une"
      effects: {tribunes: "-", relation: {gege: -1}}
      answer: "Il reprend la bière et la vide lui-même, sans respirer. « Alors on économise la voix. » Il retourne derrière le comptoir."

  - id: jp.h3.re.josiane_classeur
    roles: [joueur]
    arc: direction
    tags: [direction]
    speaker: josiane
    lieu: secretariat
    once: true
    tone: leger
    text: "Josiane t'arrête dans l'escalier du club-house, sous la photo de 1974. « J'ai remis la licence de Didier à la lettre V, entre deux autres, comme si de rien n'était. C'est ce que vous vouliez ? »"
    left:
      label: "C'est ce que je voulais"
      effects: {relation: {josiane: -1}}
      answer: "« Bien. » Elle remonte l'escalier. À mi-hauteur, elle s'arrête devant la photo de 1974 et la redresse, alors qu'elle était droite."
    right:
      label: "Mettez-la à la fin"
      effects: {relation: {josiane: 1}, set: [h3_josiane_temoin]}
      answer: "Elle te regarde longtemps. « À la fin, alors. Après le Z. » Le soir, elle appelle Léa d'une cabine, pas du club."

  - id: jp.h3.re.fardelli_fax
    roles: [joueur]
    arc: mercato
    tags: [agents]
    speaker: fardelli
    lieu: parking
    once: true
    tone: leger
    text: "Fardelli ramasse les morceaux du fax sur le tapis de sol et les met dans le cendrier. « Le petit club rappellera Mbako. Toi, je te rappellerai, {toi}. Quand ton genou aura fini de parler. »"
    left:
      label: "Il a fini"
      effects: {relation: {fardelli: -1}}
      answer: "« Non. » Il allume une cigarette à l'allume-cigare, et brûle un coin du fax avec. « Il commence. »"
    right:
      label: "Rappelez Mbako"
      effects: {relation: {mbako: -1, fardelli: 1}}
      answer: "Il note le numéro du petit club sur le dos de sa main, au stylo. « Tu vois. Tu apprends le métier. »"
