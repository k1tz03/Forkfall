# HISTOIRE 4 — « La Route de la Rive » : les cartes des intrigues du livre
# (content/arcs/joueur/h4_intrigues.yaml). Les rêves de la route sont à part,
# dans h4_route.yaml.
#
# Les graines et ce qui les paie (docs/histoires § Histoire 4, 5) :
#   · la photo du carton (prologue) → les morceaux → la photo entière : le
#     visage découpé est celui d'à droite, au-dessus d'une main à chevalière ;
#   · la mobylette qu'on guette un mardi soir → le moteur au téléphone → la
#     cour du tabac du Quai ;
#   · la prise arrachée à trois heures → « Vous débranchez la prise, la nuit »
#     au standard ;
#   · la feuille jaunie du tiroir de Vaubourg (le rabais) → Fardelli, « je
#     négocie contre elle » → le coffre (l'ancre d'hiver de la saison 2) ;
#   · le verre de poire au Corner → la bouteille sur le siège passager, la
#     dernière nuit.
#
# Personne n'accorde rien au joueur : il peut être une joueuse.
cards:
  # =========================================================== LES MORCEAUX
  # ------------------------------------------------- 1 · le premier morceau
  - id: jp.h4.morceaux.premier
    roles: [joueur]
    arc: famille
    tags: [sombre, famille]
    lieu: domicile
    tone: strategique
    text: "Rue des Lilas, vingt-deux heures. Sous la porte, une enveloppe sans timbre, et dedans un morceau de la photo de la montée, découpé dans L'Écho de 1984. Il manque un visage, ôté aux ciseaux."
    left:
      label: "Je le montre à Camille"
      effects: {vestiaire: "+", set: [h4_premier_morceau, h4_morceau_montre]}
      answer: "Elle le tient sous la lampe de la cuisine. « Il manque une tête. » Tu dis que c'est la tienne. En le disant, tu le crois."
    right:
      label: "Je le brûle dans l'évier"
      effects: {tribunes: "-", set: [h4_premier_morceau, h4_morceau_brule]}
      answer: "Le papier journal brûle vite. Dans la grille de l'évier, il reste un coin noirci, un bout de maillot. Sacha le trouve au matin."

  # ------------------------------------------------- 2 · le moteur
  - id: jp.h4.morceaux.moteur
    roles: [joueur]
    arc: famille
    tags: [sombre, famille]
    lieu: domicile
    tone: strategique
    text: "Trois heures. Le téléphone de l'entrée sonne dans le noir. Au bout du fil, personne, seulement un moteur de mobylette au ralenti, longtemps, puis la tonalité."
    left:
      label: "Je débranche le téléphone"
      effects: {direction: "-", vestiaire: "+", set: [h4_moteur, h4_prise_debranchee], react: jp.h4.re.lavergne_matin}
      answer: "Tu arraches la prise du mur et tu restes assis dans l'entrée jusqu'au jour. À six heures, tu la rebranches, pour le club, pour l'agent."
    right:
      label: "J'attends qu'on rappelle"
      effects: {vestiaire: "-", set: [h4_moteur], react: jp.h4.re.lavergne_matin}
      answer: "Tu attends sur la dernière marche, le combiné sur les genoux. Il ne sonne plus. Le moteur, tu l'entends encore à l'entraînement."

  # ------------------------------------------------- 3 · le deuxième morceau
  - id: jp.h4.morceaux.deuxieme_sacha
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: sacha
    lieu: domicile
    tone: leger
    text: "Sacha a étalé trois morceaux de papier journal sur la moquette de sa chambre : « Y en a un sous la porte, tous les mardis. C'est un puzzle de footballeurs. Je peux le finir, {toi} ? »"
    left:
      label: "Donne-les-moi"
      effects: {vestiaire: "+", relation: {sacha: -1}}
      answer: "Elle te les tend un par un, en comptant. « Y en a un qui a pas de tête. » Tu les glisses dans ta poche intérieure, contre ta licence."
    right:
      label: "Finis-le, toi"
      effects: {relation: {sacha: 1}, set: [h4_puzzle_sacha]}
      answer: "Elle les range dans une boîte à chaussures marquée PUZZLE, au feutre rouge. Chaque mardi soir, en pyjama, elle guette la porte."

  - id: jp.h4.morceaux.deuxieme_camille
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    lieu: domicile
    tone: strategique
    text: "Camille pose une deuxième enveloppe ouverte. Dedans, Gigi et un bout de banderole où on lit MONTÉE. « Encore un mardi. Celui qui découpe, il a tout son temps. Qui t'en veut comme ça, {toi} ? »"
    left:
      label: "Quelqu'un de 1984"
      effects: {relation: {camille: 1}, set: [h4_camille_1984]}
      answer: "« En 1984, tout le monde t'aimait. » Elle range l'enveloppe avec la première, dans sa boîte à couture, et ne pose plus la question."
    right:
      label: "Un supporter, rien de plus"
      effects: {relation: {camille: -1}}
      answer: "« Un supporter qui garde L'Écho six ans. » Elle jette l'enveloppe à la poubelle. Le soir, tu l'y reprends sans faire de bruit."

  - id: jp.h4.morceaux.deuxieme
    roles: [joueur]
    arc: famille
    tags: [sombre, famille]
    lieu: domicile
    tone: strategique
    text: "Mardi, vingt-deux heures, sous la porte : un autre morceau. Gigi au premier rang, un bout de banderole, MONTÉE. Quelqu'un découpe avec patience, et sait où tu dors."
    left:
      label: "Je les garde ensemble"
      effects: {vestiaire: "+", caisse: "-"}
      answer: "Tu les ranges dans l'enveloppe de ta licence de 1984. Ils s'emboîtent mal ; il manque tout le milieu."
    right:
      label: "Je guette le mardi"
      effects: {tribunes: "-", set: [h4_mobylette_vue]}
      answer: "Mardi, derrière le rideau. Une mobylette s'arrête au portail, moteur au ralenti, le temps d'une enveloppe, et repart sans phare."

  # ------------------------------------------------- 4 · la photo entière
  - id: jp.h4.morceaux.entiere_su
    roles: [joueur]
    arc: famille
    tags: [famille, moment]
    lieu: domicile
    tone: strategique
    text: "Cuisine, minuit. Les morceaux de 1984 sur la toile cirée, enfin tous. Tu savais quel visage manquerait. Tu le cherches quand même, à ta droite, et il n'y est pas."
    left:
      label: "J'appelle Bréhaut"
      effects: {vestiaire: "-", set: [h4_photo_entiere, h4_appel_brehaut], outcome: appelee}
      answer: "Il décroche à la deuxième sonnerie. Tu ne dis rien ; lui non plus. Au bout d'une minute, c'est lui qui raccroche."
    right:
      label: "Je range les morceaux"
      effects: {direction: "+", set: [h4_photo_entiere], outcome: rangee}
      answer: "Tu les fais glisser dans une enveloppe, un par un, celui du trou en dernier. Tu ne rêves pas, cette nuit-là."

  - id: jp.h4.morceaux.entiere_sacha
    roles: [joueur]
    arc: famille
    tags: [famille, moment]
    speaker: sacha
    lieu: domicile
    tone: strategique
    text: "Sacha a fini son puzzle sur la toile cirée de la cuisine. Elle pose le doigt sur toi, au milieu, puis sur le trou à ta droite : « Lui, il n'a pas de tête. C'est qui, {toi} ? »"
    left:
      label: "J'appelle Bréhaut"
      effects: {vestiaire: "-", set: [h4_photo_entiere, h4_appel_brehaut], outcome: appelee}
      answer: "Il décroche à la deuxième sonnerie. Tu ne dis rien ; lui non plus. Au bout d'une minute, c'est lui qui raccroche."
    right:
      label: "Je range les morceaux"
      effects: {relation: {sacha: -1}, set: [h4_photo_entiere], outcome: rangee}
      answer: "« Il est fini, pourtant. » Tu fermes la boîte et tu la poses en haut de l'armoire, là où elle ne monte pas."

  - id: jp.h4.morceaux.entiere_archives
    roles: [joueur]
    arc: famille
    tags: [famille, moment]
    lieu: domicile
    tone: strategique
    text: "Cuisine, minuit. Les morceaux sur la toile cirée ; l'original est parti aux archives, il a fallu l'assembler de mémoire. Le visage découpé n'est pas le tien. C'est celui de ta droite."
    left:
      label: "J'appelle Bréhaut"
      effects: {vestiaire: "-", set: [h4_photo_entiere, h4_appel_brehaut], outcome: appelee}
      answer: "Il décroche à la deuxième sonnerie. Tu ne dis rien ; lui non plus. Au bout d'une minute, c'est lui qui raccroche."
    right:
      label: "Je range les morceaux"
      effects: {direction: "+", set: [h4_photo_entiere], outcome: rangee}
      answer: "Tu les fais glisser dans une enveloppe, un par un, celui du trou en dernier. Tu dors mal. Tu ne rêves pas."

  - id: jp.h4.morceaux.entiere_cadre
    roles: [joueur]
    arc: famille
    tags: [famille, moment]
    lieu: domicile
    tone: strategique
    text: "Cuisine, minuit. Les morceaux assemblés à côté de la photo sauvée du carton. Le trou n'est pas à ta place : il est à ta droite, au-dessus d'une main à chevalière posée sur ton épaule."
    left:
      label: "J'appelle Bréhaut"
      effects: {vestiaire: "-", set: [h4_photo_entiere, h4_appel_brehaut], outcome: appelee}
      answer: "Il décroche à la deuxième sonnerie. Tu ne dis rien ; lui non plus. Au bout d'une minute, c'est lui qui raccroche."
    right:
      label: "Je range les morceaux"
      effects: {direction: "+", set: [h4_photo_entiere], outcome: rangee}
      answer: "Tu retournes le cadre contre le mur, comme à midi dans le couloir, il y a deux ans. La main reste sur ton épaule, de l'autre côté."

  # Variante de Camille : tu lui avais dit « quelqu'un de 1984 » ; elle a recollé les morceaux sans toi (h4_camille_1984).
  - id: jp.h4.morceaux.entiere_camille
    roles: [joueur]
    arc: famille
    tags: [famille, moment]
    speaker: camille
    lieu: domicile
    tone: strategique
    text: "Cuisine, minuit. Camille a recollé les morceaux sur la toile cirée, sans un mot. « Tu m'avais dit : quelqu'un de 1984. » Elle pose le doigt sur le trou, à ta droite. « C'est qui, {toi} ? »"
    left:
      label: "J'appelle Bréhaut"
      effects: {vestiaire: "-", set: [h4_photo_entiere, h4_appel_brehaut], outcome: appelee}
      answer: "Camille te regarde composer. Il décroche à la deuxième sonnerie. Tu ne dis rien ; lui non plus. C'est lui qui raccroche."
    right:
      label: "Je range les morceaux"
      effects: {direction: "+", set: [h4_photo_entiere], outcome: rangee}
      answer: "Tu les ranges un par un, le trou en dernier. Camille te regarde faire et ne pose plus la question : elle a vu où était le trou."

  # =========================================================== JULES BERTIN
  # ------------------------------------------------- 1 · le fleuriste
  - id: jp.h4.bertin.fleuriste
    roles: [joueur]
    arc: famille
    tags: [famille, caisse]
    speaker: huguette
    tone: leger
    text: "Aux Immortelles, Madame Huguette ouvre son cahier de commandes : « Votre abonnement du 14 mai, on le renouvelle ? Monsieur Fardelli l'avait payé pour dix ans, en 1985. Il en reste trois. »"
    left:
      label: "Arrêtez l'abonnement"
      effects: {caisse: "+", set: [h4_abonnement_arrete], outcome: arrete, react: [{card: jp.h4.re.camille_facture, if: "flag('h4_mensonge_camille') && !flag('divorce')"}]}
      answer: "Elle raye la ligne d'un trait de règle. « Monsieur Bertin s'en remettra. Il a l'habitude d'être seul. »"
    right:
      label: "Renouvelez-le"
      effects: {caisse: "-", set: [h4_abonnement_renouvele], outcome: renouvele, react: [{card: jp.h4.re.camille_facture, if: "flag('h4_mensonge_camille') && !flag('divorce')"}]}
      answer: "« À votre nom, cette fois ? » Tu hésites. Elle écrit : pour Monsieur Bertin. Elle souligne deux fois, sans te regarder."

  # ------------------------------------------------- 2 · Fardelli
  # Les deux sorties ouvrent « Les deux lignes » (le tiroir de Massenet).
  - id: jp.h4.bertin.fardelli
    roles: [joueur]
    arc: agents
    tags: [agents, famille]
    speaker: fardelli
    tone: leger
    text: "Fardelli remue un café sans sucre : « Oui, j'ai choisi la pierre, {toi}. En 1985, il te fallait une tombe, et le carré ancien en avait une sans visite. Bertin ne s'est jamais plaint. »"
    left:
      label: "Et la vraie tombe ?"
      effects: {direction: "-", set: [h4_pas_de_tombe], schedule: [{card: jp.h4.deux_lignes.tiroir, in: [3, 8]}]}
      answer: "« Il n'y en a jamais eu d'autre. » Il pose un billet sur la soucoupe. « Réfléchis à ce que ça veut dire, et ne me le dis pas. »"
    right:
      label: "Six ans devant un inconnu"
      effects: {direction: "-", vestiaire: "+", relation: {fardelli: -1}, schedule: [{card: jp.h4.deux_lignes.tiroir, in: [3, 8]}]}
      answer: "« Un inconnu, c'était plus simple qu'une adresse. » Il paie les deux cafés. « Je t'ai évité une sonnette, pendant six ans. »"

  - id: jp.h4.bertin.fardelli_pourquoi
    roles: [joueur]
    arc: agents
    tags: [agents, direction]
    speaker: fardelli
    tone: leger
    text: "Fardelli remue un café sans sucre : « Tu voulais savoir pourquoi tu signes au rabais, {toi}. Vaubourg garde une feuille de 1984 dans son coffre. Je négocie contre elle depuis six ans. »"
    left:
      label: "Et la tombe de Bertin ?"
      effects: {direction: "-", set: [h4_pas_de_tombe], schedule: [{card: jp.h4.deux_lignes.tiroir, in: [3, 8]}]}
      answer: "« La pierre, c'est moi. Il n'y en a jamais eu d'autre. » Il pose un billet sur la soucoupe. « Réfléchis à ce que ça veut dire. »"
    right:
      label: "Quelle feuille ?"
      effects: {direction: "-", caisse: "+", set: [h4_feuille_sue], schedule: [{card: jp.h4.deux_lignes.tiroir, in: [3, 8]}]}
      answer: "« Celle que tu as signée à l'hôpital, entre deux piqûres. Tu ne t'en souviens pas : c'était fait pour. » Il paie et s'en va."

  # ------------------------------------------------- 3 · la dernière livraison (l'épilogue, 1994)
  - id: jp.h4.bertin.livraison
    roles: [joueur]
    arc: famille
    tags: [famille, moment]
    speaker: abel
    lieu: cimetiere
    tone: leger
    text: "14 mai 1994. Sur la tombe de Jules Bertin, des chrysanthèmes livrés à huit heures. Monsieur Abel les redresse du bout de sa chaussure : « Vous restez un peu, cette année ? »"
    left:
      label: "Je reste avec lui"
      effects: {tribunes: "-", relation: {abel: 1}}
      answer: "Tu t'assois sur le banc du carré ancien jusqu'à la fermeture. Bertin n'avait personne. Il t'a, maintenant, et tu sais pourquoi."
    right:
      label: "Je vais au tabac du Quai"
      effects: {vestiaire: "-"}
      answer: "Au tabac du Quai, le rideau de fer est à mi-hauteur. Tu attends qu'on le relève. Personne ne le relève."

  - id: jp.h4.bertin.livraison_arrete
    roles: [joueur]
    arc: famille
    tags: [famille, moment]
    speaker: abel
    lieu: cimetiere
    tone: leger
    text: "14 mai 1994. La tombe de Jules Bertin est nue pour la première fois depuis 1985. Monsieur Abel l'a remarqué avant toi : « Il a perdu son seul visiteur. Je l'écris dans le registre ? »"
    left:
      label: "Écrivez-le"
      effects: {relation: {abel: -1}}
      answer: "Il trempe sa plume. « Bertin, J. — personne. » Il souffle sur l'encre. « Ça lui ressemble plus que les fleurs. »"
    right:
      label: "Je lui en apporte"
      effects: {caisse: "-", relation: {abel: 1}}
      answer: "Tu redescends aux Immortelles et tu remontes avec un pot, à tes frais. Abel ne l'écrit pas. Il te regarde le poser."

  # =========================================================== LES DEUX LIGNES
  # ------------------------------------------------- 1 · le tiroir
  - id: jp.h4.deux_lignes.tiroir_hopital
    roles: [joueur]
    arc: presse
    tags: [presse, scandale]
    speaker: meneche
    tone: strategique
    text: "Massenet lit ta photocopie de l'hôpital sans la toucher, puis ouvre un tiroir : « Le 15 mai 1984, j'ai écrit dix lignes. On m'en a fait barrer huit. Celles du milieu disaient la même chose. »"
    left:
      label: "Qui vous l'a demandé ?"
      effects: {direction: "-", tribunes: "+", relation: {meneche: 1}, set: [h4_deux_lignes, h4_massenet_appel]}
      answer: "« Ton président, au téléphone, à minuit. Mon rédacteur en chef a dit oui avant moi. Moi, j'ai barré. J'avais un crayon. »"
    right:
      label: "Republiez les dix"
      effects: {tribunes: "-", vestiaire: "+", set: [h4_deux_lignes]}
      answer: "« Pas sans la onzième. » Il referme le tiroir à clé. « Le nom de celui qui conduisait. Tu me l'apporteras, un jour ? »"

  - id: jp.h4.deux_lignes.tiroir_corbeau
    roles: [joueur]
    arc: presse
    tags: [presse, scandale]
    speaker: meneche
    tone: strategique
    text: "Sur le bureau de Massenet, la lettre du corbeau ; à côté, un tiroir ouvert : « Le 15 mai 1984, j'ai écrit dix lignes. On m'en a fait barrer huit. J'ai gardé celles du milieu. »"
    left:
      label: "Qui vous l'a demandé ?"
      effects: {direction: "-", tribunes: "+", relation: {meneche: 1}, set: [h4_deux_lignes, h4_massenet_appel]}
      answer: "Il te tend la feuille : « La jeune fille a été transportée vivante. » « Ton président a appelé à minuit. Moi, j'ai barré. »"
    right:
      label: "Republiez les dix"
      effects: {tribunes: "-", vestiaire: "+", set: [h4_deux_lignes]}
      answer: "« Pas sans la onzième : le nom du conducteur. » Il pose la lettre du corbeau sur les deux lignes, et ferme le tiroir à clé."

  - id: jp.h4.deux_lignes.tiroir
    roles: [joueur]
    arc: presse
    tags: [presse, scandale]
    speaker: meneche
    tone: strategique
    text: "Massenet ouvre un tiroir, à L'Écho : « Le 15 mai 1984, j'ai écrit dix lignes. On m'en a fait barrer huit. Il me reste celles du milieu : la jeune fille a été transportée vivante. »"
    left:
      label: "Qui vous l'a demandé ?"
      effects: {direction: "-", tribunes: "+", relation: {meneche: 1}, set: [h4_deux_lignes, h4_massenet_appel]}
      answer: "« Ton président, au téléphone, à minuit. Mon rédacteur en chef a dit oui avant moi. Moi, j'ai barré. J'avais un crayon. »"
    right:
      label: "Republiez les dix"
      effects: {tribunes: "-", vestiaire: "+", set: [h4_deux_lignes]}
      answer: "« Pas sans la onzième. » Il referme le tiroir à clé. « Le nom de celui qui conduisait. Tu me l'apporteras, un jour ? »"

  # ------------------------------------------------- 2 · la onzième ligne (saison 2)
  - id: jp.h4.deux_lignes.onze
    roles: [joueur]
    arc: presse
    tags: [presse, scandale]
    speaker: meneche
    tone: strategique
    text: "Massenet a remis les deux lignes de 1984 dans une épreuve, avec une ligne blanche en dessous : « La onzième, c'est le nom du conducteur. Tu me la dictes, {toi} ? »"
    left:
      label: "Je la dicte"
      effects: {tribunes: "+", vestiaire: "--", parole: 1, set: [h4_nom_dicte]}
      answer: "Tu dis un prénom et un nom. Il les tape à deux doigts. « Je ne la publierai pas sans toi. Mais elle existe, maintenant. »"
    right:
      label: "Laissez-la blanche"
      effects: {vestiaire: "+", outcome: blanc}
      answer: "Il passe la règle sur la ligne blanche. « Huit barrées, une blanche. Un journal finit toujours par ressembler à quelqu'un. »"

  # Variante de minuit : tu sais qui a demandé de barrer ; la onzième ligne lui sera lue avant l'imprimeur (h4_massenet_appel).
  - id: jp.h4.deux_lignes.onze_appel
    roles: [joueur]
    arc: presse
    tags: [presse, scandale]
    speaker: meneche
    tone: strategique
    text: "Massenet a remis les deux lignes de 1984 dans une épreuve, une ligne blanche dessous : « Celui de minuit lira la onzième avant l'imprimeur. C'est le nom du conducteur. Tu me la dictes, {toi} ? »"
    left:
      label: "Je la dicte"
      effects: {tribunes: "+", vestiaire: "--", parole: 1, set: [h4_nom_dicte]}
      answer: "Tu dis un prénom et un nom. Il les tape à deux doigts. « Je ne la publierai pas sans toi. Mais celui de minuit le saura demain. »"
    right:
      label: "Laissez-la blanche"
      effects: {vestiaire: "+", outcome: blanc}
      answer: "Il passe la règle sur la ligne blanche. « Huit barrées, une blanche. Un journal finit toujours par ressembler à quelqu'un. »"

  # ------------------------------------------------- 3 · l'épreuve
  - id: jp.h4.deux_lignes.epreuve
    roles: [joueur]
    arc: presse
    tags: [presse, scandale]
    speaker: meneche
    tone: strategique
    text: "Massenet pose l'épreuve du samedi devant toi, l'encre encore fraîche : onze lignes, et un nom à la dernière. « La rotative tourne à minuit. Je l'arrête, ou je la laisse ? »"
    left:
      label: "Laissez-la tourner"
      effects: {tribunes: "+", vestiaire: "--", set: [h4_nom_imprime], outcome: nom}
      answer: "Au matin, le nom de Bréhaut est en page sept, à la onzième ligne, sous un titre qui ne dit rien. Imprimé n'est pas dit."
    right:
      label: "Arrêtez-la"
      effects: {vestiaire: "+", outcome: blanc}
      answer: "Il décroche le téléphone de l'atelier : « Enlevez la onzième. » Il raccroche. « La deuxième fois, c'est plus facile. C'est ça, le pire. »"

  - id: jp.h4.deux_lignes.epreuve_blanche
    roles: [joueur]
    arc: presse
    tags: [presse, scandale]
    speaker: meneche
    tone: strategique
    text: "Massenet t'apporte l'épreuve du samedi : dix lignes de 1984, et une blanche. « Je ne l'imprimerai jamais comme ça. Tu as jusqu'à minuit pour me dicter le nom. »"
    left:
      label: "Je dicte le nom"
      effects: {tribunes: "+", vestiaire: "--", set: [h4_nom_imprime], outcome: nom}
      answer: "Il le tape debout, sur l'épreuve. Au matin, le nom est en page sept, à la onzième ligne. Le kiosque du quai en vend douze."
    right:
      label: "Gardez votre blanc"
      effects: {vestiaire: "+", outcome: blanc}
      answer: "Il plie l'épreuve en quatre et la glisse dans le tiroir, sur les deux lignes. « Elles vont finir par s'y sentir à l'étroit. »"

  # =========================================================== LE STANDARD
