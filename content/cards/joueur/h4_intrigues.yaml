  # =========================================================== LA DÉCLARATION
  # ------------------------------------------------- 1a · l'huissier (Rouvrez)
  - id: jp.h4.declaration.huissier
    roles: [joueur]
    arc: direction
    tags: [direction, famille]
    speaker: camille
    lieu: domicile
    tone: strategique
    text: "Mardi, huit heures, aux Lilas. Un huissier fait l'inventaire du salon pour le compte de la famille Lavergne. Camille le suit de pièce en pièce : « Tu as rouvert ça sans me le dire, {toi} ? »"
    left:
      label: "Je devais le faire"
      effects: {direction: "-", tribunes: "+", relation: {camille: -1}, set: [h4_saisie]}
      answer: "Elle regarde l'huissier soupeser la montre de la montée, lire la gravure, la reposer. « Ça ne vaut rien, une montre gravée », dit-il."
    right:
      label: "Pardon de ne rien dire"
      effects: {caisse: "-", relation: {camille: 1}, set: [h4_saisie]}
      answer: "« Pas à moi. » Elle tend un stylo à l'huissier, qui a oublié le sien. Il note le piano, la berline, les deux vélos de Sacha."

  - id: jp.h4.declaration.huissier_seul
    roles: [joueur]
    arc: direction
    tags: [direction, famille]
    lieu: domicile
    tone: strategique
    text: "Mardi, huit heures, aux Lilas. Un huissier fait l'inventaire pour le compte de la famille Lavergne. Il n'y a plus grand-chose : la valise de Camille a déjà fait le tri."
    left:
      label: "Je lui ouvre tout"
      effects: {direction: "-", tribunes: "+", set: [h4_saisie]}
      answer: "Il soupèse la montre de la montée, lit la gravure, la repose sur la cheminée. « Ça ne vaut rien, une montre gravée. »"
    right:
      label: "Je reste dans l'entrée"
      effects: {caisse: "-", set: [h4_saisie]}
      answer: "Tu l'entends ouvrir les placards un par un, compter à voix basse, s'excuser auprès de personne. Les voisins sont aux fenêtres."

  # ------------------------------------------------- 1b · prescrit (Laissez dormir ça)
  # Qui n'a prévenu personne (ni exigé de Bréhaut, ni promis à Sandrine) peut
  # aller seul au commissariat : la fin « Prescrit ».
  - id: jp.h4.declaration.prescrit_seul
    roles: [joueur]
    arc: agents
    tags: [agents, direction]
    speaker: fardelli
    lieu: cafe
    tone: strategique
    text: "Fardelli compte sur ses doigts, au café de la Mairie : « Le pénal, trois ans : prescrit depuis 1987. Le civil, dix ans : jusqu'au 14 mai 1994. Tu te tais un an de plus, et tout le monde est quitte. »"
    left:
      label: "J'enverrai de l'argent"
      effects: {caisse: "-", vestiaire: "+", set: [h4_cheques]}
      answer: "« Un chèque par mois, sans lettre, au tabac du Quai. Ils ne l'encaisseront pas. » Il hausse les épaules. « Toi, tu auras payé. »"
    right:
      label: "Je vais au commissariat"
      effects: {direction: "-", relation: {fardelli: -1}, next: {step: commissariat, in: [1, 1]}}
      answer: "« Pour t'entendre dire quoi ? » Tu laisses ton café. Il ne te retient pas ; il finit la tasse, puis la tienne."

  - id: jp.h4.declaration.prescrit
    roles: [joueur]
    arc: agents
    tags: [agents, direction]
    speaker: fardelli
    lieu: cafe
    tone: strategique
    text: "Fardelli compte sur ses doigts, au café de la Mairie : « Le pénal, trois ans : prescrit depuis 1987. Le civil, dix ans : jusqu'au 14 mai 1994. Tu te tais un an de plus, et tout le monde est quitte. »"
    left:
      label: "J'enverrai de l'argent"
      effects: {caisse: "-", vestiaire: "+", set: [h4_cheques]}
      answer: "« Un chèque par mois, sans lettre, au tabac du Quai. Ils ne l'encaisseront pas. » Il hausse les épaules. « Toi, tu auras payé. »"
    right:
      label: "Personne ne sera quitte"
      effects: {direction: "-", relation: {fardelli: -1}}
      answer: "« Personne ne l'est jamais. Mais on fait comme si, et ça marche presque. » Il paie les deux cafés, encore une fois."

  # ------------------------------------------------- 2 · le commissariat
  - id: jp.h4.declaration.commissariat
    roles: [joueur]
    arc: direction
    tags: [direction, moment]
    lieu: rue
    tone: strategique
    text: "Commissariat du Quai, dix-sept heures. Le commissaire écoute tout, la fête, le pont, une heure cinquante, sans prendre une note. Puis il referme un dossier vide : « C'est prescrit. »"
    left:
      label: "Je signe quand même"
      effects: {end: fdc_prescrit}
      answer: "Il tape ta déposition à deux doigts, la tamponne et la range dans un classeur marqué ARCHIVES. Il te serre la main à la porte."
    right:
      label: "Je repars sans signer"
      effects: {vestiaire: "-"}
      answer: "« Comme vous voudrez. » Sur le trottoir, l'horloge du Quai marque dix-sept heures dix. Il te reste le jubilé."
