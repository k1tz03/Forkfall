# Routines du sac joueur écrites pour le lot « pépite » (bible ch. 10 § 6 et
# § 12) : elles ne portent pas d'intrigue, mais elles LISENT ses traces —
# la bâche, le brassard, l'agent, le genou, le petit — pour que le sac ne
# parle jamais d'un joueur qui n'existe pas. Toutes ont un locuteur du casting
# du postulat et disent {toi}.
cards:
  - id: jp.routine.mere_couloir
    roles: [joueur]
    arc: formation
    tags: [formation, famille]
    speaker: mere_mbako
    tone: leger
    text: "La mère de Mbako t'arrête dans le couloir, une boîte à chaussures vide à la main : « On lui a promis des crampons à sa taille. Les autres gamins ont eu les leurs. Vous chaussez du combien, {toi} ? »"
    left:
      label: "J'ai ma pointure en double"
      effects: {vestiaire: "+", caisse: "-", relation: {mere_mbako: 1, mbako: 1}}
      answer: "Il les porte trois mois. Il ne dit jamais d'où ils viennent ; sa mère, si, une fois, à quelqu'un d'autre."
    right:
      label: "Demandez à l'intendant"
      effects: {direction: "+", relation: {mere_mbako: -1}}
      answer: "Elle demande. L'intendant dit « la semaine prochaine ». Elle achète les crampons elle-même, le samedi."

  - id: jp.routine.mere_chiffre
    roles: [joueur]
    arc: formation
    tags: [formation, mercato]
    speaker: mere_mbako
    tone: strategique
    when: "season >= 1"
    text: "La mère de Mbako ouvre son carnet sur le capot de ta voiture : « Ils veulent faire signer mon fils ce soir, un chiffre en bas de la page trois. Votre premier contrat, {toi}, vous l'aviez lu ? »"
    left:
      label: "Je l'ai lu. Mal"
      effects: {vestiaire: "+", relation: {mere_mbako: 1}}
      answer: "Elle note la page qui t'avait échappé. Elle la lira deux fois, elle."
    right:
      label: "On l'a lu pour moi"
      effects: {caisse: "+", relation: {mere_mbako: -1}}
      answer: "Elle referme le carnet. « Alors vous ne l'avez pas lu », dit-elle, et elle a raison."

  - id: jp.routine.bache_dimanche
    roles: [joueur]
    arc: ultras
    tags: [ultras, tribunes]
    speaker: gege
    tone: leger
    when: "(flag('enfant_du_pays') || flag('honnete_tribune')) && stats.clubs <= 1 && !role_was('joueur')"
    text: "« La bâche sort dimanche, {toi}, et elle a pris la pluie trois fois : il manque une lettre à ton nom. On la repeint, ou on laisse le trou ? »"
    left:
      label: "Repeignez-la"
      effects: {tribunes: "+", caisse: "-", relation: {gege: 1}}
      answer: "Ils la repeignent le samedi, au local, à quatre. La lettre neuve est plus brillante que les autres."
    right:
      label: "Laissez le trou"
      effects: {tribunes: "+", vestiaire: "+"}
      answer: "Le trou reste. Au bout d'un an, c'est le trou qu'on reconnaît de loin, pas le nom."

  - id: jp.routine.capitaine_pieces
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, caisse]
    speaker: brehaut
    tone: leger
    when: "flag('capitaine')"
    text: "Titi Bréhaut secoue la boîte des amendes, presque vide : « Trois retards, deux cartons, rien de payé depuis octobre. Le capitaine, c'est toi. Tu relances, {toi}, ou tu laisses courir jusqu'en juin ? »"
    left:
      label: "Je relance"
      effects: {vestiaire: "+", direction: "+", caisse: "+"}
      answer: "Tu relances. Deux paient tout de suite, un paie en pièces, un paie en juin ; c'est toujours le même."
    right:
      label: "Je laisse courir"
      effects: {vestiaire: "+", caisse: "-"}
      answer: "Tu laisses courir. En juin, la boîte paie le repas de fin de saison ; il manque le dessert, et personne ne dit rien."

  - id: jp.routine.agent_repondeur
    roles: [joueur]
    arc: agents
    tags: [agents]
    speaker: fardelli
    tone: leger
    when: "flag('agent_fardelli')"
    text: "Fardelli t'attend à la sortie du parking, le coude à la portière : « Trois messages sur ton répondeur, {toi}, et un seul rappel, en mars. Un ami, ça rappelle le jour même. Je compte sur toi ? »"
    left:
      label: "Je rappelle le jour même"
      effects: {direction: "+", relation: {fardelli: 1}, tribunes: "-"}
      answer: "Tu rappelles. Il parle vingt minutes ; trois d'entre elles servent à quelque chose."
    right:
      label: "Je rappelle quand je peux"
      effects: {tribunes: "+", relation: {fardelli: -1}}
      answer: "Il appelle chez toi. Camille prend le message ; elle ne le transmet pas tout de suite."

  - id: jp.routine.sans_agent_courrier
    roles: [joueur]
    arc: direction
    tags: [direction, agents]
    speaker: josiane
    tone: leger
    when: "flag('sans_agent')"
    text: "Madame Josiane a trié ton courrier par date de tampon : « Deux offres de clubs et une facture, {toi}. Sans agent, c'est à vous de les ouvrir. Je vous les lis, ou vous emportez tout ? »"
    left:
      label: "Lisez-moi tout"
      effects: {direction: "+", relation: {josiane: 1}}
      answer: "Elle lit les trois à voix haute, dans l'ordre du tampon. La facture d'abord ; c'est sa méthode."
    right:
      label: "J'emporte tout"
      effects: {caisse: "+", tribunes: "+"}
      answer: "Tu emportes. Tu lis dans la voiture, deux fois, et tu comprends à la deuxième."

  - id: jp.routine.genou_escalier
    roles: [joueur]
    arc: corps
    tags: [risk:tribunes]
    speaker: sabatier
    tone: strategique
    when: "flag('genou') || flag('genou_opere')"
    text: "Doc Sabatier t'a regardé monter l'escalier : « En trois temps, depuis mardi, {toi}. Personne d'autre ne l'a vu, pas encore. Tu passes à la table lundi, ou on attend que ça se voie du parking ? »"
    left:
      label: "Je passe lundi"
      effects: {force: 1, tribunes: "-", relation: {sabatier: 1}}
      answer: "Tu passes. Il note « escalier » dans le tiroir. Le tiroir a une page à ton nom, maintenant."
    right:
      label: "Ça se verra bien"
      effects: {tribunes: "+", force: -1}
      answer: "Ça se voit du parking, trois semaines plus tard. C'est Gégé qui le dit en premier, et il le dit fort."

  - id: jp.routine.vestiaire_musique
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, absurde]
    speaker: vukic
    tone: leger
    text: "Vukić baisse le son du poste du vestiaire : « Ta chanson, trois semaines de suite. On gagne, alors les anciens se taisent. Le jour où on perd, c'est toi qu'ils regarderont. Tu changes, {toi} ? »"
    left:
      label: "Je change"
      effects: {vestiaire: "+", tribunes: "-"}
      answer: "Tu changes. Deux protestent, six approuvent, le gardien fait semblant de ne pas entendre."
    right:
      label: "On garde ce qui gagne"
      effects: {vestiaire: "-", force: 1}
      answer: "La même chanson, jusque dans le bus. Le soir de la première défaite, le poste finit sous la douche, et personne n'a rien vu."

  - id: jp.routine.lea_photo
    roles: [joueur]
    arc: presse
    tags: [presse, sponsors]
    speaker: lea
    tone: leger
    when: "gauges.tribunes >= 55"
    text: "Léa tient la liste de la séance photo du calendrier du club : « Jeudi. Le sponsor veut les jeunes torse nu, le photographe préfère le costume. Qu'est-ce que je réponds au sponsor, {toi} ? »"
    left:
      label: "Je viens en costume"
      effects: {direction: "+", tribunes: "-", caisse: "+"}
      answer: "Le costume est trop grand aux épaules. Le calendrier se vend quand même ; c'est le mois de mars."
    right:
      label: "Torse nu, si ça paie"
      effects: {tribunes: "++", vestiaire: "-"}
      answer: "Le vestiaire découpe la page et la scotche au-dessus des douches. Elle y reste deux saisons."
