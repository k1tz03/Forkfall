# Cartes du script d'ouverture de la pépite (arc jp.pepite.club_usine,
# content/arcs/joueur/pepite_script.yaml) — bible ch. 10 § 3, gabarit § 4.1.
# Hors du sac. `arc:` porte le THÈME de la carte, pas l'id de l'arc.
# Le nom du joueur : jamais deux étapes de suite, jamais dans un libellé.
# Fardelli dit {toi} (« mon ami » / « mon ami {prenom} ») ; Vaubourg dit {toi}
# (« petit » quand il t'aime, {nom} sinon) ; Gégé dit « petit » ou « le {numero} ».
# Les deux dernières cartes sont les alarmes d'override du postulat
# (postulats.yaml → alarm_overrides).
cards:
  # ============================================================ S0 · 1 · la valeur
  - id: jp.pepite.p1_valeur
    roles: [joueur]
    arc: agents
    tags: [agents, mercato]
    speaker: fardelli
    tone: strategique
    text: "Fardelli baisse la vitre à moitié. Sur le tableau de bord, un ticket : un trois et six zéros. « Ça, {toi}, c'est ce matin. Si tu marques ce soir, je change le premier chiffre. On signe ? »"
    left:
      label: "Je signe tes dix pour cent"
      effects: {direction: "+", caisse: "+", relation: {fardelli: 1}, set: [agent_fardelli], react: jp.re.aulard_quatre_millions}
      answer: "Il monte la vitre. Le contrat était signé de sa main ; il manquait la tienne, en bas, là où il tapote."
    right:
      label: "Je choisis seul où je joue"
      effects: {direction: "-", tribunes: "+", relation: {fardelli: -1}, set: [sans_agent], react: jp.re.aulard_quatre_millions}
      answer: "Il remonte la vitre plus vite. « Trois millions sans agent, ça fait deux et demi », dit-il au pare-brise."

  - id: jp.pepite.p1_valeur_prix
    roles: [joueur]
    arc: agents
    tags: [agents, mercato]
    speaker: fardelli
    tone: strategique
    text: "Fardelli aligne trois tickets sur le tableau de bord : ce matin, ce soir, janvier. Trois, quatre, six. « Le six, {toi}, c'est si tu ne te blesses pas. Moi je compte ; toi, tu cours. »"
    left:
      label: "Je signe tes dix pour cent"
      effects: {direction: "+", caisse: "+", relation: {fardelli: 1}, set: [agent_fardelli], react: jp.re.aulard_quatre_millions}
      answer: "Il range les tickets dans son carnet et t'en laisse un, celui du jour. Au dos, son numéro de fax."
    right:
      label: "Je choisis seul où je joue"
      effects: {direction: "-", tribunes: "+", relation: {fardelli: -1}, set: [sans_agent]}
      answer: "« Trois millions sans agent, ça fait deux et demi », dit-il au pare-brise. Il compte encore, pour lui."

  - id: jp.pepite.p1_valeur_maison
    roles: [joueur]
    arc: agents
    tags: [agents, famille]
    speaker: fardelli
    tone: strategique
    text: "Fardelli baisse la vitre, moteur allumé : « Ta mère m'a appelé du bâtiment C. Elle voudrait qu'on te vende pas loin de la maison. Je l'aime bien, ta mère. Mais on ne vend pas près ; on vend bien. »"
    left:
      label: "Je signe tes dix pour cent"
      effects: {direction: "+", caisse: "+", relation: {fardelli: 1}, set: [agent_fardelli], react: jp.re.aulard_quatre_millions}
      answer: "Il note l'adresse de ta mère dans le carnet. À la page des frais."
    right:
      label: "Je choisis seul où je joue"
      effects: {direction: "-", tribunes: "+", relation: {fardelli: -1}, set: [sans_agent]}
      answer: "Il remonte la vitre. Ta mère l'apprendra par L'Écho, comme tout le monde."

  # ========================================================= S0 · 2 · le mercato d'hiver
  - id: jp.pepite.p2_hiver
    roles: [joueur]
    arc: mercato
    tags: [mercato, direction]
    speaker: aulard
    tone: strategique
    text: "Vaubourg lit le fax debout : « Un club de D1 paie en janvier et te prend en juin, {toi}. Mon club a besoin de cet argent maintenant. Tu signes ce soir, ou tu finis la saison et je vends plus cher ? »"
    left:
      label: "Je signe ce soir"
      effects: {caisse: "++", direction: "+", tribunes: "--", set: [vente_janvier], react: [{card: co.re.josiane_a_lu, if: "!seen('co.re.josiane_a_lu')"}, {card: jp.re.camille_janvier}]}
      answer: "Il signe le fax. Josiane le classe sous « janvier », le dossier le plus épais du club."
    right:
      label: "Je finis la saison ici"
      effects: {tribunes: "++", direction: "-", force: 1, set: [finit_saison], react: jp.re.camille_juin}
      answer: "Il déchire le fax. Il en a une copie ; à l'usine, on a toujours une copie."

  - id: jp.pepite.p2_hiver_maison
    roles: [joueur]
    arc: mercato
    tags: [mercato, famille]
    speaker: aulard
    tone: strategique
    text: "Vaubourg pose deux fax côte à côte : « Celui-ci, trente kilomètres de chez ta mère. Celui-là, six cents, et il paie trois fois plus. Mon club, lui, a déjà choisi. Toi ? »"
    left:
      label: "Je reste près de ma mère"
      effects: {tribunes: "+", caisse: "-", set: [finit_saison], react: jp.re.camille_juin}
      answer: "Il note « maison » sur le fax. Il ne comprend pas ce mot-là ; il le note quand même."
    right:
      label: "Je pars à six cents bornes"
      effects: {caisse: "++", tribunes: "-", set: [vente_janvier], react: jp.re.camille_janvier}
      answer: "Ta mère l'apprend par L'Écho, à la pause. Le soir, ta valise est sur ton lit, ouverte, vide."

  - id: jp.pepite.p2_hiver_bleu
    roles: [joueur]
    arc: mercato
    tags: [mercato, direction]
    speaker: aulard
    tone: strategique
    text: "Vaubourg relit le fax, ta photo en bleu cobalt découpée dans L'Écho posée à côté : « Depuis la sélection, ton prix a doublé. Je vends ce soir, ou on attend le Continental pour doubler encore ? »"
    left:
      label: "Je signe ce soir"
      effects: {caisse: "+++", direction: "+", tribunes: "--", set: [vente_janvier], react: jp.re.camille_janvier}
      answer: "Il signe le fax en regardant le chiffre, pas toi. Josiane classe sous « janvier »."
    right:
      label: "J'attends le Continental"
      effects: {tribunes: "++", direction: "-", force: 1, set: [finit_saison], react: jp.re.camille_juin}
      answer: "Il déchire le fax. Il garde la copie ; à l'usine, on a toujours une copie."

  - id: jp.pepite.p2_hiver_bache
    roles: [joueur]
    arc: mercato
    tags: [mercato, ultras]
    speaker: aulard
    tone: strategique
    text: "Vaubourg regarde par la fenêtre la bâche de la Nord, ton nom et « ICI, POUR TOUJOURS » : « J'ai un fax de janvier qui dit le contraire. Ce soir, je déchire lequel des deux ? »"
    left:
      label: "Je pars sous la bâche"
      effects: {caisse: "++", tribunes: "---", parole: -2, relation: {gege: -2}, set: [vente_janvier], react: jp.re.camille_janvier}
      answer: "Gégé décroche la bâche lui-même. Il la plie. Il ne la jette pas."
    right:
      label: "Je reste dessous"
      effects: {tribunes: "++", direction: "-", parole: 1, set: [finit_saison], react: jp.re.camille_juin}
      answer: "La bâche reste. Le président fait repeindre le prix sur le panneau d'à côté."

  # ====================================================== S0 · 3 · le dernier match
  - id: jp.pepite.p2b_dernier_bloc
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: brehaut
    tone: strategique
    text: "Titi Bréhaut serre la feuille de match contre lui : « Dimanche, la montée ou le barrage. Le président veut qu'on te sorte à l'heure, pour ta visite de lundi. Les gars te veulent jusqu'au bout. Toi ? »"
    left:
      label: "Quatre-vingt-dix, pour eux"
      effects: {vestiaire: "++", tribunes: "+", force: -1, set: [dernier_bloc_joue], rand: [{p: 0.15, set: [genou]}, {}], react: jp.re.fardelli_montre_tour}
      answer: "Tu joues tout. À la fin, les gars te portent, ou te ramassent. Fardelli regarde sa montre pendant le tour d'honneur."
    right:
      label: "Je sors à l'heure"
      effects: {direction: "+", caisse: "+", vestiaire: "--", set: [dernier_bloc_menage], react: jp.re.fardelli_montre_tour}
      answer: "Tu sors à la soixantième. Le stade siffle la sortie, pas toi ; c'est pareil. Lundi, ton genou est propre."

  - id: jp.pepite.p2b_dernier_bloc_bache
    roles: [joueur]
    arc: ultras
    tags: [ultras, tribunes]
    speaker: gege
    tone: strategique
    text: "Gégé roule la bâche sous son bras, ton nom à l'intérieur : « Dimanche, elle descend pour la dernière fois de la saison. Ou pour la dernière fois ; ça dépend de ton fax. Tu passes dessous ? »"
    left:
      label: "Je passe dessous"
      effects: {tribunes: "++", relation: {gege: 1}, set: [dernier_bloc_joue]}
      answer: "Tu passes dessous. Elle te touche la tête ; c'est voulu."
    right:
      label: "Je reste avec le groupe"
      effects: {tribunes: "-", vestiaire: "+", set: [dernier_bloc_joue]}
      answer: "Tu restes au milieu. La bâche descend quand même ; sur personne."

  - id: jp.pepite.p2b_dernier_bloc_mouton
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vecchio
    tone: strategique
    text: "Gigi Vecchio attend que Bréhaut soit passé pour te parler : « Dimanche, personne ne te fera la passe ; ils l'ont décidé au toro. Moi, j'en ai une pour toi. Tu la demandes, ou tu la prends ? »"
    left:
      label: "Je la demande"
      effects: {vestiaire: "+", set: [dernier_bloc_joue]}
      answer: "Tu demandes. On te la fait ; une ; Gigi, du pied."
    right:
      label: "Je la prends"
      effects: {tribunes: "+", vestiaire: "-", force: 1, set: [dernier_bloc_joue]}
      answer: "Tu la prends. Tu marques. Personne ne vient ; tu cours seul vers le virage."

  # ============================================================ S0 · 4 · la vente
  - id: jp.pepite.p3_vente
    roles: [joueur]
    arc: mercato
    tags: [mercato, direction]
    speaker: aulard
    tone: strategique
    text: "Vaubourg pousse deux fax vers toi, un à un, comme des cartes : « L'usine vend un jeune par an. Cette année, c'est toi : le grand club, et le chèque. Ou tu restes un an, et je te revends plus cher. »"
    left:
      label: "Je signe le grand club"
      effects: {caisse: "++", tribunes: "--", direction: "+", set: [vendu_d1], club: {change: true, division: 1}, outcome: vendu, react: jp.re.lea_aller_simple}
      answer: "Tu signes ; Josiane tamponne. Avec ton prix, l'usine achète un gamin de seize ans. Il a une mère, et il aura ton crochet."
    right:
      label: "Je reste, encore un an"
      effects: {tribunes: "+", vestiaire: "+", direction: "-", caisse: "-", set: [fidele], outcome: fidele}
      answer: "Il range les fax. Il dit « l'an prochain », et l'an prochain, à l'usine, c'est toujours cette année."

  # Le joueur mis au loft en novembre a signé ailleurs en janvier : jp.banc.loft
  # pose `parti_janvier` et un changement de club DIFFÉRÉ (la saison close garde
  # son club). Le fax de juin ne le concerne plus. Défaut de relecture (graine
  # 907) : sans cette variante, Vaubourg lui demandait au slot 17 « le grand
  # club, ou tu restes ici un an pour le prix ? », il pouvait répondre « je
  # reste » (drapeau `fidele`), et la S1 s'ouvrait sur « Tu es resté{e}, alors on
  # fait comme les grands » pendant que le moteur appliquait le changement de
  # club. Ici, il ne reste qu'un solde de tout compte et une secrétaire qui date
  # tout depuis 1987. Pas de `club: {change: true}` : le loft l'a déjà posé.
  - id: jp.pepite.p3_vente_janvier
    roles: [joueur]
    arc: direction
    tags: [direction, mercato]
    speaker: josiane
    tone: strategique
    text: "Madame Josiane a posé ton solde de tout compte sous la lampe, daté du 9 janvier : « Deux primes, une amende de novembre, et le stylo qui fuit. Vous signez, ou vous relisez ? »"
    left:
      label: "Je signe"
      effects: {caisse: "+", direction: "+", relation: {josiane: 1}, set: [vendu_d2], outcome: vendu, journal: {text: "{annee} : {prenom} {nom} a signé son solde de tout compte en juin. Il avait quitté l'usine en janvier.", poids: 2, tags: [mercato]}}
      answer: "Tu signes avec le stylo qui fuit. La tache est sur ta ligne ; elle classe le double sous « janvier »."
    right:
      label: "Je relis"
      effects: {caisse: "++", direction: "-", set: [vendu_d2], outcome: vendu, journal: {text: "{annee} : {prenom} {nom} a relu son solde de tout compte. L'amende de novembre n'y était plus.", poids: 2, tags: [mercato]}}
      answer: "Tu relis. L'amende de novembre saute ; elle la raye elle-même, et elle ne demande pas au président."

  - id: jp.pepite.p3_vente_bache
    roles: [joueur]
    arc: mercato
    tags: [mercato, ultras]
    speaker: aulard
    tone: strategique
    text: "Vaubourg a tiré le rideau sur la Nord : « Une vente par an, et cette année c'est toi. Eux ont peint autre chose sur vingt mètres. Je signe le grand club, ou tu leur donnes raison ? »"
    left:
      label: "Je signe le grand club"
      effects: {caisse: "++", tribunes: "---", direction: "+", set: [vendu_d1], club: {change: true, division: 1}, outcome: vendu, react: jp.re.lea_aller_simple}
      answer: "Tu signes. Josiane tamponne. La bâche descend le soir même, pliée, pas brûlée."
    right:
      label: "Je reste, la bâche a raison"
      effects: {tribunes: "+", vestiaire: "+", direction: "-", caisse: "-", parole: 1, set: [fidele, enfant_du_pays], outcome: fidele}
      answer: "Gégé repeint la bâche en doré. Le président repeint le prix, plus gros."

  - id: jp.pepite.p3_vente_or
    roles: [joueur]
    arc: mercato
    tags: [mercato, agents]
    speaker: aulard
    tone: strategique
    text: "Vaubourg pose deux fax sur le bureau : le grand club, et Al-Dorado, qui paie le double sans visite médicale. « Un fax du désert, je n'en avais jamais vu. Lequel je tamponne ? »"
    left:
      label: "Je signe pour le désert"
      effects: {caisse: "+", tribunes: "--", direction: "-", force: -1, set: [exil_dore], club: {change: true, division: 2}, outcome: exil, react: jp.re.lea_aller_simple}
      answer: "Tu signes. Le contrat compte dans une devise que tu ne connais pas ; ton nom y est rangé entre un hôtel et une flotte de bus."
    right:
      label: "Je signe le grand club"
      effects: {caisse: "++", tribunes: "--", direction: "+", set: [vendu_d1], club: {change: true, division: 1}, outcome: vendu}
      answer: "Tu signes le grand club. Avec ton prix, l'usine achète un gamin de seize ans ; il aura ton crochet."

  - id: jp.pepite.p3_vente_signee
    roles: [joueur]
    arc: mercato
    tags: [mercato, direction]
    speaker: aulard
    tone: strategique
    text: "Vaubourg ne se lève pas ; le fax de janvier attend sous le tampon : « C'était signé en janvier, {toi}. En juin, on livre. Ton casier sera vidé demain à huit heures. »"
    left:
      label: "Je pars, c'est signé"
      effects: {caisse: "+", tribunes: "--", set: [vendu_d1], club: {change: true, division: 1}, outcome: vendu, react: jp.re.lea_aller_simple}
      answer: "Il te serre la main en regardant le fax suivant."
    right:
      label: "Je pars, c'est signé"
      effects: {caisse: "+", tribunes: "--", set: [vendu_d1], club: {change: true, division: 1}, outcome: vendu, react: jp.re.lea_aller_simple}
      answer: "Il te serre la main en regardant le fax suivant."

  - id: jp.pepite.p3_vente_genou
    roles: [joueur]
    arc: mercato
    tags: [mercato, risk:direction]
    speaker: aulard
    tone: strategique
    text: "« Le grand club veut une visite médicale demain à huit heures, et le Doc dit que ton genou a un avis. Tu y vas, ou on vend à quelqu'un qui ne regarde pas ? »"
    left:
      label: "J'y vais, on verra"
      effects: {rand: [{p: 0.5, set: [vendu_d1], club: {change: true, division: 1}, outcome: vendu}, {set: [vente_annulee], tribunes: "--", direction: "-"}]}
      answer: "La visite dure trois heures. Le kiné du club acheteur regarde ton genou, puis la radio, puis la pendule."
    right:
      label: "Vendez à qui ne regarde pas"
      effects: {caisse: "+", tribunes: "--", direction: "+", set: [vendu_d2], club: {change: true, division: 2}, outcome: vendu}
      answer: "Tu pars pour un club qui ne regarde pas les genoux. Il regarde les prix."

  # ======================================================== S1 · 5 · le premier jour
  - id: jp.pepite.s1_premier_jour
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: vecchio
    tone: leger
    text: "Gigi Vecchio, un an de plus dans la moustache, te tend une caisse de bouteilles : « Même vestiaire, même crochet, et un nouveau qui ne sait pas encore. Tu portes encore, ou c'est son tour ? »"
    left:
      label: "Je porte encore"
      effects: {vestiaire: "++"}
      answer: "Tu portes. Il en prend une, la dernière, pour toi."
    right:
      label: "C'est au nouveau"
      effects: {vestiaire: "-", tribunes: "+"}
      answer: "Le nouveau porte. Il te regarde en portant ; tu te souviens de ce regard."

  - id: jp.pepite.s1_premier_jour_vendu
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: josiane
    tone: leger
    text: "Au vestiaire de {club}, un colis de l'usine : ton sparadrap du crochet du fond, décollé proprement, et un mot de Madame Josiane : « Ici, les noms s'écrivent au troisième match. Vous le collez ? »"
    left:
      label: "Je colle le sparadrap"
      effects: {direction: "+", tribunes: "-", set: [casier_nomme]}
      answer: "Tu le colles sur un casier neuf. Le feutre de l'usine a pâli ; de loin, on lit à peine ton nom."
    right:
      label: "J'attends de jouer"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Le casier reste sans nom. Au troisième match, un coéquipier y écrit « le nouveau » ; ça durera."

  - id: jp.pepite.s1_premier_jour_fidele
    roles: [joueur]
    arc: direction
    tags: [direction, mercato]
    speaker: aulard
    tone: strategique
    text: "Vaubourg te tend un contrat d'une page ; une deuxième est repliée dessous : « Tu es resté{pg, select, f{e} other{}}, {toi}, alors on fait comme les grands : un an, une page. Tu signes celle-là ? »"
    left:
      label: "Je signe la page"
      effects: {direction: "++", caisse: "+"}
      answer: "Tu signes. Il replie le contrat avant que tu voies le dessous ; tu le verras en juin."
    right:
      label: "Je lis la deuxième"
      effects: {direction: "-", caisse: "++", set: [page_lue]}
      answer: "La deuxième page dit « clause de vente ». Elle est à ton nom, pas au sien."

  - id: jp.pepite.s1_premier_jour_or
    roles: [joueur]
    arc: direction
    tags: [direction, sponsors]
    speaker: nassir
    tone: strategique
    text: "Cheikh Ilyas te fait visiter un stade vide où souffle la climatisation : « Vous êtes la ligne la plus chère de notre bilan. Le contrat ne vous oblige pas à jouer. Samedi, vous jouez ? »"
    left:
      label: "Je joue samedi"
      effects: {tribunes: "+", force: 1}
      answer: "Tu joues devant trois mille personnes et cinquante caméras. La climatisation souffle sur la pelouse."
    right:
      label: "Je me repose, c'est payé"
      effects: {caisse: "+", force: -2, tribunes: "-"}
      answer: "Tu te reposes. Le compte se remplit sans toi. Au téléphone, Camille demande ce que tu as fait de ta journée ; tu cherches."

  # ==================================================== S1 · 6 · le retour à l'usine
  - id: jp.pepite.s1_retour_usine_vendu
    roles: [joueur]
    arc: ultras
    tags: [ultras, tribunes, moment]
    speaker: gege
    tone: strategique
    text: "Gégé t'attend au couloir des visiteurs, la casquette à la main : « Dimanche, tu joues contre nous. On a ressorti ce qu'on avait peint pour toi. Si tu marques, tu célèbres, ou tu baisses la tête ? »"
    left:
      label: "Je baisse la tête"
      effects: {tribunes: "++", vestiaire: "-", relation: {gege: 1}, set: [tifo_adieu], react: [ { card: co.re.gege_decoupe_mur, if: "seen('co.re.gege_decoupe_1987')", chance: 0.6 }, { card: co.re.gege_decoupe_1987, if: "seen('co.re.gege_decoupe')", chance: 0.6 }, { card: co.re.gege_decoupe, chance: 0.6 } ]}
      answer: "Tu marques. Tu baisses la tête. La Tribune Nord applaudit un visiteur ; ça n'arrive qu'une fois."
    right:
      label: "Je célèbre, c'est mon métier"
      effects: {tribunes: "--", vestiaire: "++", relation: {gege: -2}, set: [celebre_contre_usine]}
      answer: "Tu célèbres devant la Nord. Ce qu'ils avaient peint pour toi descend pendant que tu cours ; le soir, ça brûle dans un bidon."

  - id: jp.pepite.s1_retour_usine_fidele
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, mercato]
    speaker: brehaut
    tone: strategique
    text: "Titi Bréhaut déplie une liste de vente, la mâchoire qui bouge : « Deux noms, le tien et le mien. Le président en vend un en janvier. Tu vas le voir pour qu'il me choisisse, ou tu te tais ? »"
    left:
      label: "Je vais voir le président"
      effects: {direction: "+", vestiaire: "--", relation: {brehaut: -2}, set: [brehaut_vendu_par_toi]}
      answer: "Il part en janvier. Les gars l'apprennent par le fax du club ; lui sait d'où il vient. Il ne te serre pas la main."
    right:
      label: "Je me tais"
      effects: {vestiaire: "++", direction: "-", set: [fidele_deux]}
      answer: "Tu te tais. Il te serre l'épaule, un peu trop fort ; c'est sa façon de dire merci."

  - id: jp.pepite.s1_retour_usine_or
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: strategique
    text: "Camille, au téléphone, tard, le décalage dans la voix : « L'usine joue la Coupe dimanche, et ta mère a pris deux places. Une pour toi. Tu prends l'avion, ou tu regardes de loin ? »"
    left:
      label: "Je prends l'avion"
      effects: {tribunes: "+", caisse: "-", relation: {camille: 1}}
      answer: "Tu es en tribune. Gégé te voit ; il ne dit rien ; c'est déjà ça."
    right:
      label: "Je regarde de loin"
      effects: {caisse: "+", relation: {camille: -1}}
      answer: "Ta mère va au stade avec Camille. La place qu'elle avait prise pour toi reste vide ; L'Écho la photographie."

  # ============================================================ S1 · 7 · la veille
  - id: jp.pepite.s1_veille
    roles: [joueur]
    arc: agents
    tags: [agents, moment]
    speaker: fardelli
    tone: strategique
    text: "Fardelli, la vitre baissée en entier cette fois, un ticket entre deux doigts : « Ce soir, ta valeur tient là-dessus. Demain, dernier match : elle monte si tu joues, elle baisse si tu te ménages. »"
    left:
      label: "Je fonce"
      effects: {tribunes: "+", force: 1, set: [veille_fonce]}
      answer: "Il écrit « fonce » au dos du ticket. Lundi, « La cote » du Quotidien donnera son chiffre ; il a déjeuné avec Massenet."
    right:
      label: "Je me ménage"
      effects: {force: -1, direction: "+", set: [veille_menage]}
      answer: "Il note « prudent ». Il vend les prudents aussi ; à des clubs prudents."

  - id: jp.pepite.s1_veille_seul
    roles: [joueur]
    arc: presse
    tags: [presse, moment]
    speaker: meneche
    tone: strategique
    text: "Massenet t'a fait appeler à la cabine du stade ; on l'entend tourner les pages : « Sans agent, qui fixe votre prix, vous ou ma colonne du lundi ? Demain, vous jouez pour vous, ou pour la cote ? »"
    left:
      label: "Je fonce"
      effects: {tribunes: "+", force: 1, set: [veille_fonce]}
      answer: "Il note. Il écrit « il joue pour lui » ; c'est un compliment, chez lui."
    right:
      label: "Je me ménage"
      effects: {force: -1, direction: "+", set: [veille_menage]}
      answer: "Il note « prudent ». Il garde le mot pour la Une de juin."

  # ========================================================= S2+ · 8 · la rentrée
  - id: jp.pepite.s2_rentree
    roles: [joueur]
    arc: agents
    tags: [agents, mercato]
    speaker: fardelli
    tone: strategique
    text: "Fardelli a changé de voiture, pas de gourmette : « Ce matin, tu vaux le double de l'an dernier. Dans deux ans, la moitié ; c'est le métier, je n'y peux rien. On vend cet été, ou on attend ? »"
    left:
      label: "On vend cet été"
      effects: {caisse: "++", tribunes: "-", set: [vente_ete]}
      answer: "Il sort le carnet. Trois clubs, deux pays qu'on ne nomme pas."
    right:
      label: "On attend"
      effects: {tribunes: "+", direction: "+", force: 1}
      answer: "Il range le carnet. Il ne le ferme pas complètement."

  - id: jp.pepite.s2_rentree_encore
    roles: [joueur]
    arc: agents
    tags: [agents, mercato]
    speaker: fardelli
    tone: leger
    text: "Fardelli laisse tourner le moteur sur le parking : « Deux étés que tu me dis « on attend », {toi}. À force, les clubs attendent aussi ; les genoux, eux, n'attendent pas. Cette fois ? »"
    left:
      label: "On vend cet été"
      effects: {caisse: "++", tribunes: "-", set: [vente_ete]}
      answer: "Il sort le carnet. Il l'avait déjà ouvert dans la voiture."
    right:
      label: "On attend encore"
      effects: {tribunes: "+", direction: "+", force: 1}
      answer: "Il range le carnet. Il ne le ferme toujours pas."

  - id: jp.pepite.s2_rentree_seul
    roles: [joueur]
    arc: mercato
    tags: [mercato, direction]
    speaker: aulard
    tone: strategique
    text: "Vaubourg te reçoit debout, le téléphone à la main : « Sans agent, {toi}, c'est moi qui fais tes comptes, et je les fais pour mon club d'abord. Trois fax sont arrivés. On vend cet été ? »"
    left:
      label: "On vend cet été"
      effects: {caisse: "++", tribunes: "-", set: [vente_ete, destination_choisie]}
      answer: "Il sort trois fax. Tu les lis toi-même, ligne à ligne ; c'est long ; c'est à toi."
    right:
      label: "On attend"
      effects: {tribunes: "+", direction: "+", force: 1}
      answer: "Il range les fax. « L'an prochain », dit-il ; chez lui, l'an prochain, c'est toujours cette année."

  # ===================================================== S2+ · 9 · la veille, encore
  - id: jp.pepite.s2_veille
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: vecchio
    tone: leger
    text: "Gigi Vecchio pèle son orange dans le vestiaire vide, la veille du dernier match : « {age} ans. À ton âge, je croyais que ça durait. Demain, tu joues pour la Une, ou pour ceux qui s'assoient ici ? »"
    left:
      label: "Je joue pour le vestiaire"
      effects: {vestiaire: "++", tribunes: "-"}
      answer: "Il te donne un quartier. Le dernier, il le garde pour Paulette, tribune Est, comme chaque samedi."
    right:
      label: "Je joue pour la Une"
      effects: {tribunes: "++", vestiaire: "-"}
      answer: "Il mange l'orange. Toute."

  - id: jp.pepite.s2_veille_brehaut
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: brehaut
    tone: leger
    text: "Titi Bréhaut mange son riz blanc de veille de match, seul à la grande table : « Demain, les gars ont besoin de toi pour eux, pas pour la Une. Tu joues pour qui, {toi} ? »"
    left:
      label: "Je joue pour le vestiaire"
      effects: {vestiaire: "++", tribunes: "-"}
      answer: "Il hoche la tête, un peu en retard, comme toujours. Il pousse son assiette de riz vers toi."
    right:
      label: "Je joue pour la Une"
      effects: {tribunes: "++", vestiaire: "-"}
      answer: "Il hausse les épaules. Il fait la passe quand même, le lendemain, une fois."

  # ============================================== alarmes d'override du postulat
  # Alarme tribunes.high nº 0 (postulats.yaml) : Gégé, avant Léa. La pépite
  # démarre à 80 de tribune — l'alarme haute est celle qui sonne le plus tôt et
  # le plus souvent de la S0, et elle n'avait qu'un visage, la chroniqueuse.
  # Défaut de relecture « récurrence du casting en S0 » : Gégé, le capo que le
  # cast déclare à 1,5 apparition, n'était vu que dans 59 % des premières
  # saisons, parce qu'il ne parle en S0 que si jp.tifo est tirée. Le local et la
  # bâche, eux, existent dès que la tribune chante.
  - id: jp.pepite.alarme_local_gege
    roles: [joueur]
    arc: tribunes
    tags: [ultras, tribunes]
    speaker: gege
    tone: leger
    once: true
    text: "Gégé t'attend au parking avec deux bières, une ouverte : « La Nord chante ton nom sans savoir l'écrire, {toi} : deux orthographes au local. Tu viens l'écrire à la craie, ou on tire au sort ? »"
    left:
      label: "Je viens l'écrire"
      effects: {tribunes: "+", vestiaire: "-", relation: {gege: 1}, journal: {text: "{annee} : {prenom} {nom} a écrit son nom à la craie au local de la Nord. La bâche a été refaite dessus.", poids: 2, tags: [tribunes]}}
      answer: "Tu l'écris à la craie sur le mur du local. Gégé repasse au pinceau, sans se tromper."
    right:
      label: "Qu'ils tirent au sort"
      effects: {tribunes: "-", force: 1, relation: {gege: -1}}
      answer: "Ils tirent au sort. La bâche sort avec une lettre en trop ; elle sortira comme ça pendant deux ans."

  # Alarme tribunes.high nº 1 (postulats.yaml) : servie seulement quand la bâche
  # ET le panneau du prix existent (`seen('jp.tifo.prix')`). `once: true` : Léa ne
  # fait confirmer la même photo qu'une fois par carrière.
  - id: jp.pepite.alarme_tifo_lea
    roles: [joueur]
    arc: presse
    tags: [presse, tribunes]
    speaker: lea
    tone: strategique
    once: true
    text: "Léa règle son appareil devant la Nord : ton nom sur vingt mètres, et sur le panneau d'à côté, le prix peint par le président. « Pour la Une de demain, je vous prends devant lequel ? »"
    left:
      label: "Devant la bâche"
      effects: {tribunes: "-", direction: "-", vestiaire: "+"}
      answer: "La photo montre la bâche. Le prix est coupé au cadrage ; le président le remarque."
    right:
      label: "Devant le prix"
      effects: {tribunes: "--", direction: "++", set: [photo_prix], react: [ { card: co.re.gege_decoupe_mur, if: "seen('co.re.gege_decoupe_1987')", chance: 0.6 }, { card: co.re.gege_decoupe_1987, if: "seen('co.re.gege_decoupe')", chance: 0.6 }, { card: co.re.gege_decoupe, chance: 0.6 } ]}
      answer: "La photo montre le prix. Gégé la découpe et la punaise au local, côté « à ne pas oublier »."

  # Alarme tribunes.high nº 2 : la pépite dont la tribune monte sans qu'aucune
  # bâche n'ait jamais été peinte (jp.tifo pas ouverte, ou ouverte trop tard).
  # Léa n'a pas de vingt mètres à faire confirmer : elle a la cote, la Une et le
  # prix seul, sur le panneau, sans le nom à côté.
  - id: jp.pepite.alarme_cote_lea
    roles: [joueur]
    arc: presse
    tags: [presse, tribunes]
    speaker: lea
    tone: strategique
    once: true
    text: "« Ils chantent votre numéro, pas votre nom : ils ne le connaissent pas encore. Le club, lui, a chiffré ce que ça vaut, et je fais la Une demain. Je titre le chant, ou le montant ? »"
    left:
      label: "Le chant"
      effects: {tribunes: "+", direction: "-", vestiaire: "+", relation: {lea: 1}}
      answer: "Elle titre le chant. Le montant passe en page quatre, en petit ; en loge, on lit la page quatre."
    right:
      label: "Le montant"
      effects: {tribunes: "--", direction: "++", caisse: "+", set: [photo_prix], react: [ { card: co.re.gege_decoupe_mur, if: "seen('co.re.gege_decoupe_1987')", chance: 0.6 }, { card: co.re.gege_decoupe_1987, if: "seen('co.re.gege_decoupe')", chance: 0.6 }, { card: co.re.gege_decoupe, chance: 0.6 } ]}
      answer: "Elle titre le montant. Gégé découpe la Une, coupe le chiffre, et punaise ce qui reste : un numéro, sans nom."

  - id: jp.pepite.alarme_fardelli_avance
    roles: [joueur]
    arc: agents
    tags: [agents, caisse]
    speaker: fardelli
    tone: strategique
    text: "Fardelli pose une enveloppe kraft sur le siège passager : « Une avance sur ton prochain transfert, {toi}. Entre nous, ça ne s'appelle pas un prêt ; ça ne s'appelle pas. Tu la prends, ou tu comptes ? »"
    left:
      label: "Je prends l'avance"
      effects: {caisse: "++", direction: "-", relation: {fardelli: 1}}
      answer: "Il compte devant toi, deux fois. La deuxième fois, le chiffre est le même ; c'est rassurant, et ça ne devrait pas."
    right:
      label: "Je compte moi-même"
      effects: {caisse: "-", tribunes: "+", relation: {fardelli: -1}}
      answer: "Tu comptes. Il attend, la main sur l'enveloppe. Il la remet dans la poche intérieure."

  # Variante « tu as demandé à partir » (bible ch. 10 § 6.3 → § 3, P3)
  - id: jp.pepite.p3_vente_demande
    roles: [joueur]
    arc: mercato
    tags: [mercato, direction]
    speaker: aulard
    tone: strategique
    text: "Vaubourg a écrit « deux pour le prix d'un » au crayon, en haut du fax : « Tu veux partir avec le petit, {toi}. L'acheteur en prend deux et paie un et demi. Ensemble, ou toi seul, plus cher ? »"
    left:
      label: "Avec lui"
      effects: {caisse: "+", tribunes: "--", vestiaire: "+", set: [vendu_d1], club: {change: true, division: 1}, outcome: vendu, react: jp.re.lea_aller_simple}
      answer: "Vous partez le même jour, dans deux voitures. Il arrive avant toi ; il arrive toujours avant."
    right:
      label: "Seul, et plus cher"
      effects: {caisse: "++", tribunes: "-", vestiaire: "--", direction: "+", set: [vendu_d1], club: {change: true, division: 1}, outcome: vendu}
      answer: "Tu pars seul. Il apprend le chiffre par sa mère, qui l'a lu ; il ne t'écrit pas."
