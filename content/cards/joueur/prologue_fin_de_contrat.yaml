# Les six scènes d'ouverture du postulat « Fin de contrat à 31 ans »
# (content/arcs/joueur/prologue_fin_de_contrat.yaml, arc `jp.fin.prologue`).
#
# Trente et un ans, la D1, un genou qui a un avis (bible ch. 10 § 4) : le
# couloir en travaux, la table de soins qui sent le camphre, le gamin de seize
# ans assis à ta place, la plaquette du club, la portière de l'agent. Le
# prologue s'arrête avant l'ancre F1 du script (`jp.fin.f1_derniere_annee`, le
# restaurant et les dix pour cent) : il ne parle ni de mandat, ni de contrat.
#
# Jauges : vestiaire 50, tribunes 50, direction 45, caisse 60. Effets faibles.
# Bréhaut, Vecchio et Sabatier appellent un joueur « petit » à l'expression
# neutre : à trente et un ans c'est faux, donc leurs cartes n'écrivent pas
# `{toi}` — elles s'adressent à toi sans adresse.
#
# Une carte à un bouton = deux sorties strictement identiques (charte § 4.1).
#
# HISTOIRE 4 — « La Route de la Rive » (docs/histoires/00_les_dix_histoires.md) :
# le prologue reste, trois scènes sont réécrites. Le carton (scène 1 du livre)
# remplace le couloir sous toutes ses variantes : la photo de la montée, toi au
# milieu, Bréhaut à ta droite, sa main à chevalière sur ton épaule — et le
# vétéran reçoit ce qu'il possède déjà (le pavillon des Lilas, la berline, la
# montre gravée « Montée — merci »). La radio (scène 2) porte un chiffre
# entouré : 14/5. La consultation de onze heures aligne toutes les radios
# depuis 1984.
cards:
  # ------------------------------------------------------- 1/6 · le couloir en travaux
  # Le décor, sans locuteur. Trois variantes lues sur le fil rouge.
  - id: jp.fin.pro1_couloir
    roles: [joueur]
    arc: moment
    tags: [decor, vestiaire]
    tone: leger
    once: true
    text: "Sept heures, couloir de {club}. Les peintres décrochent les photos des anciens pour un carton marqué ARCHIVES. La tienne est dessus, la montée de 1984, toi au milieu, Bréhaut à ta droite."
    left:
      label: "Je la garde"
      effects: {set: [h4_photo_gardee], var: {cadeau_pavillon: "+1", cadeau_berline: "+1", cadeau_montre_montee: "+1"}}
      answer: "Tu glisses le cadre sous ton bras. Sur la photo, la main de Bréhaut est posée sur ton épaule ; à son doigt, une chevalière brille."
    right:
      label: "Qu'ils l'emportent"
      effects: {set: [h4_photo_archives], var: {cadeau_pavillon: "+1", cadeau_berline: "+1", cadeau_montre_montee: "+1"}}
      answer: "Le carton descend à la cave, scotché deux fois. Sur le couvercle, Josiane écrit ARCHIVES 1984, et souligne l'année deux fois."

  - id: jp.fin.pro1_couloir_genou
    roles: [joueur]
    arc: moment
    tags: [decor, vestiaire]
    tone: leger
    once: true
    text: "Sept heures. Tu montes l'escalier du club-house une marche à la fois, le genou d'abord. En haut, les peintres rangent les photos des anciens dans un carton ARCHIVES. La tienne est dessus."
    left:
      label: "Je la garde"
      effects: {set: [h4_photo_gardee], var: {cadeau_pavillon: "+1", cadeau_berline: "+1", cadeau_montre_montee: "+1"}}
      answer: "La montée de 1984 : toi au milieu, Bréhaut à ta droite, sa main sur ton épaule, une chevalière au doigt. Tu glisses le cadre sous ton bras."
    right:
      label: "Qu'ils l'emportent"
      effects: {set: [h4_photo_archives], var: {cadeau_pavillon: "+1", cadeau_berline: "+1", cadeau_montre_montee: "+1"}}
      answer: "Le carton descend à la cave, scotché deux fois. Sur le couvercle, Josiane écrit ARCHIVES 1984, et souligne l'année deux fois."

  - id: jp.fin.pro1_couloir_vestiaire
    roles: [joueur]
    arc: moment
    tags: [decor, vestiaire]
    tone: leger
    once: true
    text: "Sept heures, couloir de {club}. Les peintres rangent les anciens dans un carton ARCHIVES. Sur la photo du dessus, la montée de 1984, Titi Bréhaut a la main posée sur ton épaule."
    left:
      label: "Je la garde"
      effects: {set: [h4_photo_gardee], var: {cadeau_pavillon: "+1", cadeau_berline: "+1", cadeau_montre_montee: "+1"}}
      answer: "Tu glisses le cadre sous ton bras. Toi au milieu, lui à ta droite, sa chevalière qui accroche la lumière du couloir."
    right:
      label: "Qu'ils l'emportent"
      effects: {set: [h4_photo_archives], var: {cadeau_pavillon: "+1", cadeau_berline: "+1", cadeau_montre_montee: "+1"}}
      answer: "Le carton descend à la cave, scotché deux fois. Sur le couvercle, Josiane écrit ARCHIVES 1984, et souligne l'année deux fois."

  # ------------------------------------------------------- 2/6 · la table
  # Qui tu es : un genou de trente et un ans qui a parlé cet hiver.
  - id: jp.fin.pro2_table
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, direction, risk:vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    text: "Salle de soins. Sur le négatoscope, la radio de ton genou, et dans un coin, au crayon gras, un « 14/5 » que Sabatier a entouré. Il tapote la table. « Tu montes maintenant, ou après la séance ? »"
    left:
      label: "C'est quoi, ce chiffre ?"
      effects: {direction: "+", vestiaire: "-", set: [h4_chiffre_demande]}
      answer: "« Un compte. » Il éteint le négatoscope. « Le nombre de fois où ton genou a dit non. » Il le dit en rangeant la radio dans sa pochette."
    right:
      label: "Après la séance"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Tu fais la séance entière. En revenant, la radio a quitté le négatoscope. Le chiffre, tu l'as lu quand même, à l'envers, dans la vitre."

  # ------------------------------------------------------- 3/6 · la place des anciens
  # La relève, seize ans, assise à ta place. Deux sorties.
  - id: jp.fin.pro3_place
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: mbako
    tone: leger
    once: true
    text: "Lian Mbako, seize ans, est assis à ta place, les mains dans les manches : « Le coach m'a mis là. Ma mère, elle a dit de me lever pour personne. Je me lève, ou vous vous mettez à côté ? »"
    left:
      label: "Lève-toi, c'est ma place"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Il se lève, prend son sac et s'assoit deux crochets plus loin. Jusqu'à l'échauffement, il regarde la place, pas toi."
    right:
      label: "Reste, je me mets à côté"
      effects: {vestiaire: "+", relation: {mbako: 1}, set: [h4_mbako_a_cote]}
      answer: "Il reste. Au bout d'un moment, il te demande tout bas comment on fait pour durer. Tu lui parles des étirements, faute de mieux."

  # ------------------------------------------------------- 4/6 · la plaquette
  # Le choix minuscule et vrai : la couverture, toi ou le petit. Il se voit sur
  # les tribunes, et l'agent le relève à la scène suivante. Deux variantes.
  - id: jp.fin.pro4_plaquette
    roles: [joueur]
    arc: presse
    tags: [presse, tribunes, vestiaire]
    speaker: lea
    tone: leger
    once: true
    text: "Léa pose deux épreuves de la plaquette sur le capot d'une voiture. « Vaubourg veut le petit Mbako en couverture. Le service commercial vous veut, vous. L'imprimeur attend à midi. Je mets qui ? »"
    left:
      label: "Moi en couverture"
      effects: {tribunes: "+", vestiaire: "-", set: [prologue_couverture]}
      answer: "Ta photo passe en couverture, celle de la montée, d'il y a six ans. Vaubourg signe le bon à tirer sans la regarder."
    right:
      label: "Le petit en couverture"
      effects: {vestiaire: "+", tribunes: "-"}
      answer: "Le gamin fait la couverture. Il en achète trois et en envoie une à sa mère, sans rien écrire dedans."

  - id: jp.fin.pro4_plaquette_genou
    roles: [joueur]
    arc: presse
    tags: [presse, tribunes, vestiaire]
    speaker: lea
    tone: leger
    once: true
    text: "Léa pose l'épreuve de la plaquette sur le capot. « La seule photo nette de vous, c'est en mars, et on voit le bandage. Sinon, c'est le petit Mbako. L'imprimeur attend à midi. Je mets qui ? »"
    left:
      label: "Moi, bandage compris"
      effects: {tribunes: "+", vestiaire: "-", set: [prologue_couverture]}
      answer: "Le bandage fait la couverture avec toi. À l'imprimerie, personne ne le remarque ; au bureau du président, quelqu'un l'entoure au stylo."
    right:
      label: "Le petit en couverture"
      effects: {vestiaire: "+", tribunes: "-"}
      answer: "Le gamin fait la couverture. Ta photo passe en page quatre, avec les jeunes du centre."

  # ------------------------------------------------------- 5/6 · les quatre
  # La règle du jeu, dite par l'agent. Deux variantes : il a vu la maquette.
  - id: jp.fin.pro5_quatre_couverture
    roles: [joueur]
    arc: agents
    tags: [agents, mercato, decor]
    speaker: fardelli
    tone: strategique
    once: true
    text: "Fardelli, moteur allumé : « Ta couverture, au bureau, ils s'en fichent, {toi}. Ce qui te prolonge, c'est quelqu'un qui se souvient de toi le jour du stylo. Et ici, les gens ont de la mémoire. »"
    left:
      label: "Qui se souvient ?"
      effects: {}
      answer: "Il remonte la vitre à moitié, comme toujours, et laisse tourner le moteur."
    right:
      label: "Qui se souvient ?"
      effects: {}
      answer: "Il remonte la vitre à moitié, comme toujours, et laisse tourner le moteur."

  - id: jp.fin.pro5_quatre
    roles: [joueur]
    arc: agents
    tags: [agents, mercato, decor]
    speaker: fardelli
    tone: strategique
    once: true
    text: "Fardelli, à la portière, moteur allumé : « Tu as laissé la couverture au petit, {toi}. On s'en souviendra. Un contrat se prolonge sur qui se souvient de toi. Ici, c'est tout le monde. »"
    left:
      label: "Qui se souvient ?"
      effects: {}
      answer: "Il remonte la vitre à moitié, comme toujours, et laisse tourner le moteur."
    right:
      label: "Qui se souvient ?"
      effects: {}
      answer: "Il remonte la vitre à moitié, comme toujours, et laisse tourner le moteur."

  # ------------------------------------------------------- 6/6 · le seuil
  # Le rendez-vous : la salle de soins, à onze heures. La carte suivante est
  # celle où l'on te fixe l'objectif de la saison.
  - id: jp.fin.pro6_onze_heures
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, decor]
    speaker: vukic
    tone: strategique
    once: true
    text: "Vukić s'assoit à côté de toi, la feuille de match sur les genoux : « Le Doc, onze heures. Toutes tes radios depuis 1984, sorties, alignées sur la table. »"
    left:
      label: "J'y vais"
      effects: {}
      answer: "Il te laisse la feuille de match. Dans son cahier, il en garde une autre, avec des ratures et un nom en moins."
    right:
      label: "J'y vais"
      effects: {}
      answer: "Il te laisse la feuille de match. Dans son cahier, il en garde une autre, avec des ratures et un nom en moins."

  # ══ deuxièmes variantes (lot « rejouabilité du prologue ») ═════════════════
  # Les trois fils rouges de la fin de contrat (le genou, l'agent, le
  # vestiaire) déplacent chacun une carte différente de l'ouverture.

  - id: jp.fin.pro2_table_agent
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, agents, risk:vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    text: "Sabatier pose la main sur ton dossier. « Ton agent a téléphoné à sept heures pour ta radio. Je ne l'ai pas donnée. » Derrière lui, sur le négatoscope, un chiffre entouré au crayon gras, 14/5."
    left:
      label: "C'est quoi, ce chiffre ?"
      effects: {direction: "+", vestiaire: "-", set: [h4_chiffre_demande]}
      answer: "« Un compte. » Il glisse la radio dans une enveloppe kraft. « Celui des fois où ton genou a dit non. » L'enveloppe part sous clé."
    right:
      label: "Après la séance"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Tu fais la séance entière. En revenant, l'enveloppe est sur la table, sans nom, et le téléphone de l'infirmerie sonne."

  - id: jp.fin.pro3_place_genou
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: mbako
    tone: leger
    once: true
    text: "Lian Mbako est assis à ta place, les mains dans les manches : « Au centre, ils disent que votre genou a lâché cet hiver. Le coach m'a mis là. Je me lève, ou vous vous mettez à côté ? »"
    left:
      label: "Lève-toi, c'est ma place"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Il se lève sans discuter. Il regarde ton genou, puis la place, puis ton genou."
    right:
      label: "Reste, je me mets à côté"
      effects: {vestiaire: "+", relation: {mbako: 1}, set: [h4_mbako_a_cote]}
      answer: "Il reste. « Ça fait mal, le matin ? » Tu dis que non, en te massant le genou."

  - id: jp.fin.pro6_onze_heures_vestiaire
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, decor]
    speaker: brehaut
    tone: strategique
    once: true
    text: "Titi Bréhaut s'assoit à côté de toi et se masse le genou, le même que le tien : « Le Doc te veut à onze heures. Il a sorti tes radios depuis 1984. Les miennes aussi, il les a gardées. »"
    left:
      label: "J'y vais"
      effects: {}
      answer: "Il te laisse passer. De sa poche dépasse une feuille pliée, la compo de dimanche, avec un nom en moins. Il ne dit pas lequel."
    right:
      label: "J'y vais"
      effects: {}
      answer: "Il te laisse passer. De sa poche dépasse une feuille pliée, la compo de dimanche, avec un nom en moins. Il ne dit pas lequel."
