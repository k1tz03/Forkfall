# Les six scènes d'ouverture du postulat « Fin de contrat à 31 ans »
# (content/arcs/joueur/prologue_fin_de_contrat.yaml, arc `jp.fin.prologue`).
#
# Trente et un ans, la D1, un genou qui a un avis (bible ch. 10 § 4) : le
# couloir en travaux, la table de soins qui sent le camphre, le gamin de seize
# ans assis à ta place, la plaquette du club, la portière de l'agent. Le
# prologue s'arrête avant l'ancre F1 du script (`jp.fin.f1_derniere_annee`, le
# restaurant et les dix pour cent) : il ne parle ni de mandat, ni de contrat.
#
# Jauges : vestiaire 50, tribunes 50, direction 45, caisse 60. Effets faibles.
# Bréhaut, Vecchio et Sabatier appellent un joueur « petit » à l'expression
# neutre : à trente et un ans c'est faux, donc leurs cartes n'écrivent pas
# `{toi}` — elles s'adressent à toi sans adresse.
#
# Une carte à un bouton = deux sorties strictement identiques (charte § 4.1).
cards:
  # ------------------------------------------------------- 1/6 · le couloir en travaux
  # Le décor, sans locuteur. Trois variantes lues sur le fil rouge.
  - id: jp.fin.pro1_couloir
    roles: [joueur]
    arc: moment
    tags: [decor, vestiaire]
    tone: leger
    once: true
    text: "Sept heures, couloir de {club}. Les peintres décrochent les photos des anciens et les rangent dans un carton marqué « ARCHIVES ». La tienne est dedans, celle de la montée de 1984."
    left:
      label: "Je la sors du carton"
      effects: {}
      answer: "Tu l'appuies contre le mur, à l'endroit. À midi, en repassant, tu la retrouves dans le carton, le cadre tourné vers le fond."
    right:
      label: "Je la sors du carton"
      effects: {}
      answer: "Tu l'appuies contre le mur, à l'endroit. À midi, en repassant, tu la retrouves dans le carton, le cadre tourné vers le fond."

  - id: jp.fin.pro1_couloir_genou
    roles: [joueur]
    arc: moment
    tags: [decor, vestiaire]
    tone: leger
    once: true
    text: "Sept heures. La salle de soins sent le camphre ; le négatoscope est resté allumé toute la nuit, la radio de ton genou dessus. Dans un coin du cliché, au crayon gras, un chiffre entouré."
    left:
      label: "Je m'approche de la radio"
      effects: {}
      answer: "Le néon grésille. Avant que tu lises le chiffre, une main éteint le négatoscope derrière toi : le Doc est arrivé plus tôt que d'habitude."
    right:
      label: "Je m'approche de la radio"
      effects: {}
      answer: "Le néon grésille. Avant que tu lises le chiffre, une main éteint le négatoscope derrière toi : le Doc est arrivé plus tôt que d'habitude."

  - id: jp.fin.pro1_couloir_vestiaire
    roles: [joueur]
    arc: moment
    tags: [decor, vestiaire]
    tone: leger
    once: true
    text: "Sept heures, vestiaire de {club}. Ta place est la première à droite depuis six ans. Ce matin, quelqu'un a décroché ton maillot et l'a plié sur le banc, comme on plie ceux des partants."
    left:
      label: "Je raccroche le maillot"
      effects: {}
      answer: "Tu le raccroches. Trois crochets plus loin, un sac neuf, une paire de crampons neufs, et seize ans dedans."
    right:
      label: "Je raccroche le maillot"
      effects: {}
      answer: "Tu le raccroches. Trois crochets plus loin, un sac neuf, une paire de crampons neufs, et seize ans dedans."

  # ------------------------------------------------------- 2/6 · la table
  # Qui tu es : un genou de trente et un ans qui a parlé cet hiver.
  - id: jp.fin.pro2_table
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, direction, risk:vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    text: "Doc Sabatier tapote la table de soins avec le capuchon de son stylo : « Ton genou a gonflé deux fois cet hiver, et la deuxième fois, ça a duré. Tu montes maintenant, ou après la séance ? »"
    left:
      label: "Je monte maintenant"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Il plie le genou deux fois et écoute ce qui craque. Il ne note rien devant toi ; dans le couloir, tu l'entends ouvrir son stylo."
    right:
      label: "Après la séance"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Tu fais la séance entière. Au troisième sprint, le genou chauffe ; derrière la vitre de l'infirmerie, il regardait."

  # ------------------------------------------------------- 3/6 · la place des anciens
  # La relève, seize ans, assise à ta place. Deux sorties.
  - id: jp.fin.pro3_place
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: mbako
    tone: leger
    once: true
    text: "Lian Mbako, seize ans, est assis à ta place, les mains dans les manches : « Le coach m'a mis là. Ma mère m'a dit de ne me lever pour personne. Je me lève, ou vous vous mettez à côté ? »"
    left:
      label: "Lève-toi, c'est ma place"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Il se lève sans un mot et s'assoit deux crochets plus loin. Jusqu'à l'échauffement, il regarde la place, pas toi."
    right:
      label: "Reste, je me mets à côté"
      effects: {vestiaire: "+", relation: {mbako: 1}}
      answer: "Il reste. Au bout d'un moment, il demande à voix basse comment on fait pour durer. Tu n'as pas de réponse qui tienne."

  # ------------------------------------------------------- 4/6 · la plaquette
  # Le choix minuscule et vrai : la couverture, toi ou le petit. Il se voit sur
  # les tribunes, et l'agent le relève à la scène suivante. Deux variantes.
  - id: jp.fin.pro4_plaquette
    roles: [joueur]
    arc: presse
    tags: [presse, tribunes, vestiaire]
    speaker: lea
    tone: leger
    once: true
    text: "Léa pose deux épreuves de la plaquette sur le capot d'une voiture : « Vaubourg veut le petit Mbako en couverture. Le service commercial vous veut, vous. L'imprimeur attend à midi : je mets qui ? »"
    left:
      label: "Moi en couverture"
      effects: {tribunes: "+", vestiaire: "-", set: [prologue_couverture]}
      answer: "Ta photo passe en couverture : celle de la montée, il y a six ans. Vaubourg signe le bon à tirer sans la regarder."
    right:
      label: "Le petit en couverture"
      effects: {vestiaire: "+", tribunes: "-"}
      answer: "Le gamin fait la couverture. Il en achète trois ; il en envoie une à sa mère, sans un mot dedans."

  - id: jp.fin.pro4_plaquette_genou
    roles: [joueur]
    arc: presse
    tags: [presse, tribunes, vestiaire]
    speaker: lea
    tone: leger
    once: true
    text: "Léa pose l'épreuve de la plaquette sur le capot : « La seule photo nette de vous date de mars, et on voit le bandage. Sinon, c'est le petit Mbako. L'imprimeur attend à midi : je mets qui ? »"
    left:
      label: "Moi, bandage compris"
      effects: {tribunes: "+", vestiaire: "-", set: [prologue_couverture]}
      answer: "Le bandage fait la couverture avec toi. À l'imprimerie, personne ne le remarque ; au bureau du président, quelqu'un l'entoure au stylo."
    right:
      label: "Le petit en couverture"
      effects: {vestiaire: "+", tribunes: "-"}
      answer: "Le gamin fait la couverture. Ta photo passe en page quatre, avec les jeunes du centre."

  # ------------------------------------------------------- 5/6 · les quatre
  # La règle du jeu, dite par l'agent. Deux variantes : il a vu la maquette.
  - id: jp.fin.pro5_quatre_couverture
    roles: [joueur]
    arc: agents
    tags: [agents, mercato, decor]
    speaker: fardelli
    tone: strategique
    once: true
    text: "Fardelli, à la portière, moteur allumé : « Une couverture ne prolonge personne, {toi}. Quatre décident si tu rejoues : le vestiaire, les tribunes, le club, ton compte. »"
    left:
      label: "Et mon compte ?"
      effects: {}
      answer: "Il remonte la vitre à moitié. Il laisse toujours la moitié, pour la phrase d'après."
    right:
      label: "Et mon compte ?"
      effects: {}
      answer: "Il remonte la vitre à moitié. Il laisse toujours la moitié, pour la phrase d'après."

  - id: jp.fin.pro5_quatre
    roles: [joueur]
    arc: agents
    tags: [agents, mercato, decor]
    speaker: fardelli
    tone: strategique
    once: true
    text: "Fardelli, à la portière, moteur allumé : « Tu as laissé la couverture au petit, {toi}. Quatre décident si tu rejoues : le vestiaire, les tribunes, le club, ton compte. »"
    left:
      label: "Et mon compte ?"
      effects: {}
      answer: "Il remonte la vitre à moitié. Il laisse toujours la moitié, pour la phrase d'après."
    right:
      label: "Et mon compte ?"
      effects: {}
      answer: "Il remonte la vitre à moitié. Il laisse toujours la moitié, pour la phrase d'après."

  # ------------------------------------------------------- 6/6 · le seuil
  # Le rendez-vous : la salle de soins, à onze heures. La carte suivante est
  # celle où l'on te fixe l'objectif de la saison.
  - id: jp.fin.pro6_onze_heures
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, decor]
    speaker: vukic
    tone: strategique
    once: true
    text: "Vukić s'assoit à côté de toi, la feuille de match sur les genoux : « Le Doc t'attend à onze heures avec ta radio. Il a déjà écrit un chiffre dessus, au crayon. Je l'ai vu en passant. »"
    left:
      label: "J'y vais"
      effects: {}
      answer: "Il te laisse la feuille de match. Dans son cahier, il en garde une autre, avec des ratures et un nom en moins."
    right:
      label: "J'y vais"
      effects: {}
      answer: "Il te laisse la feuille de match. Dans son cahier, il en garde une autre, avec des ratures et un nom en moins."

  # ══ deuxièmes variantes (lot « rejouabilité du prologue ») ═════════════════
  # Les trois fils rouges de la fin de contrat (le genou, l'agent, le
  # vestiaire) déplacent chacun une carte différente de l'ouverture.

  - id: jp.fin.pro2_table_agent
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, agents, risk:vestiaire]
    speaker: sabatier
    tone: strategique
    once: true
    text: "Doc Sabatier pose la main à plat sur ton dossier médical : « Ton agent a téléphoné à sept heures pour l'avoir. Je ne l'ai pas donné. Pas encore. Tu montes maintenant, ou après la séance ? »"
    left:
      label: "Je monte maintenant"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Il glisse la radio dans une enveloppe kraft et écrit ton nom dessus. Ton nom, et rien d'autre ; l'enveloppe part sous clé."
    right:
      label: "Après la séance"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Tu fais la séance entière. En revenant, l'enveloppe est sur la table, sans nom, et le téléphone de l'infirmerie sonne."

  - id: jp.fin.pro3_place_genou
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, formation]
    speaker: mbako
    tone: leger
    once: true
    text: "Lian Mbako est assis à ta place, les mains dans les manches : « Au centre, ils disent que votre genou a lâché cet hiver. Le coach m'a mis là. Je me lève, ou vous vous mettez à côté ? »"
    left:
      label: "Lève-toi, c'est ma place"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Il se lève sans discuter. Il regarde ton genou, puis la place, puis ton genou."
    right:
      label: "Reste, je me mets à côté"
      effects: {vestiaire: "+", relation: {mbako: 1}}
      answer: "Il reste. Il demande si ça fait mal le matin ; tu dis que non, et c'est faux."

  - id: jp.fin.pro6_onze_heures_vestiaire
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, decor]
    speaker: brehaut
    tone: strategique
    once: true
    text: "Titi Bréhaut s'assoit à côté de toi, une feuille pliée à la main : « Le Doc te veut à onze heures, avec ta radio. Les gars disent qu'il a déjà écrit un chiffre dessus. Moi, je ne dis rien. »"
    left:
      label: "J'y vais"
      effects: {}
      answer: "Il te laisse la feuille. Dans sa poche, il en garde une autre : la compo de dimanche, avec un nom en moins."
    right:
      label: "J'y vais"
      effects: {}
      answer: "Il te laisse la feuille. Dans sa poche, il en garde une autre : la compo de dimanche, avec un nom en moins."
