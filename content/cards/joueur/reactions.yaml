# Les réactions du rôle joueur (bible ch. 10 § 7, gabarit § 4.4).
# Servies au tirage suivant, hors créneau ; plafond quatre par saison ; jamais
# de `end`, jamais de `react`, jamais de drame ; effets petits. Le nom du
# joueur n'y figure pas : la scène précédente l'a déjà porté.
# `kind: reaction` est DÉRIVÉ par le build depuis le `react:` qui les cite.
cards:
  # ------------------------------------------------------- après la valeur (P1)
  - id: jp.re.aulard_quatre_millions
    roles: [joueur]
    arc: direction
    tags: [direction]
    speaker: aulard
    tone: strategique
    text: "Vaubourg te croise dans le couloir et ne s'arrête pas : « Quatre millions, m'a dit ton agent. Ou trois. Ça dépend de dimanche. Tu marques ? »"
    left:
      label: "Je marque"
      effects: {direction: "+", force: -1}
      answer: "Il continue son chemin. Il note « dimanche »."
    right:
      label: "On verra dimanche"
      effects: {direction: "-"}
      answer: "Il note « on verra ». C'est ce qu'il note le plus souvent."

  # ------------------------------------------------ après le dernier bloc (P2b)
  - id: jp.re.fardelli_montre_tour
    roles: [joueur]
    arc: agents
    tags: [agents]
    speaker: fardelli
    tone: strategique
    text: "Fardelli remet sa montre au poignet, sous la gourmette : « On m'a vu la regarder pendant le tour d'honneur ; tant pis. La visite médicale, c'est lundi, huit heures. Tu y seras ? »"
    left:
      label: "Je serai là"
      effects: {direction: "+", caisse: "+"}
      answer: "Il note l'heure. Il note toujours l'heure ; c'est son métier, dit-il."
    right:
      label: "Je dormirai"
      effects: {tribunes: "+", relation: {fardelli: -1}}
      answer: "Il décale d'une heure. Il facture le décalage ; pas à toi."

  # ------------------------------------------------------ après la vente (P3)
  - id: jp.re.lea_aller_simple
    roles: [joueur]
    arc: presse
    tags: [presse]
    speaker: lea
    tone: strategique
    text: "Léa, le combiné contre l'épaule : « La Gazette a votre chiffre pour demain, avant moi. Il me reste une ligne pour la Nord, en bas de page. Vous me la dictez, ou elle reste blanche ? »"
    left:
      label: "Un mot : merci"
      effects: {tribunes: "+", parole: 1}
      answer: "Elle l'ajoute en dernière ligne. C'est petit ; c'est là."
    right:
      label: "Laissez-la blanche"
      effects: {tribunes: "-"}
      answer: "La Une part sans. Gégé la découpe sans."

  # ----------------------------------------------------- après la bâche (tifo)
  - id: jp.re.lea_vingt_metres
    roles: [joueur]
    arc: presse
    tags: [presse, tribunes]
    speaker: lea
    tone: strategique
    text: "Léa a déjà la photo de la bâche sur son bureau : « Vingt mètres, une phrase dessous, et maintenant la vôtre. Je l'imprime mot pour mot demain, ou je laisse la photo parler seule ? »"
    left:
      label: "Imprimez-la"
      effects: {tribunes: "+", parole: 1}
      answer: "C'est imprimé sous la photo. Deux fois, donc : sur la bâche, et dans le journal."
    right:
      label: "Laissez parler la photo"
      effects: {direction: "+"}
      answer: "Elle n'écrit rien. La Gazette Rose, si ; avec la date."

  # ------------------------------------------------- après le penalty (brassard)
  - id: jp.re.vecchio_bouteilles
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: vecchio
    tone: leger
    text: "Vecchio porte une caisse de bouteilles : « Tout l'hiver tu les as portées, et ce soir tu lui as laissé le ballon. Ceux qui le gardent finissent seuls à table. Tu recommences l'an prochain ? »"
    left:
      label: "Je recommence"
      effects: {vestiaire: "+"}
      answer: "Il hoche la tête. Il porte la dernière caisse avec toi."
    right:
      label: "Au tour d'un autre"
      effects: {tribunes: "+", vestiaire: "-"}
      answer: "Il porte la caisse seul. Il ne dit rien ; il le racontera plus tard, à un autre petit."

  # ------------------------------------------------ après le brassard (brassard)
  - id: jp.re.vukic_capitaine
    roles: [joueur]
    arc: direction
    tags: [direction, vestiaire]
    speaker: vukic
    tone: strategique
    text: "Vukić, le cahier sous le bras, à la sortie du vestiaire : « Je t'ai vu le mettre. Un brassard, ça se porte aussi le lundi, au bureau, quand on parle des primes. Tu passes lundi ? »"
    left:
      label: "Je passe lundi"
      effects: {direction: "+", relation: {vukic: 1}, set: [capitaine_lundi]}
      answer: "Tu passes ; il note ce que tu dis. Il s'en sert, mais pas contre toi."
    right:
      label: "Le dimanche suffit"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Il referme le cahier. Il le rouvrira ; il rouvre toujours."

  # ------------------------------------------------- après la conférence (Une)
  - id: jp.re.brehaut_decoupe
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, presse]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut tient une paire de ciseaux qui n'est pas à lui : « L'article est dans ton casier, ta phrase passée au surligneur jaune. Tout le monde l'a lue avant l'entraînement. Toi, tu l'as lue ? »"
    left:
      label: "Je l'ai lue"
      effects: {vestiaire: "-"}
      answer: "Tu as lu. Ils t'ont regardé lire."
    right:
      label: "Pas encore"
      effects: {vestiaire: "-", tribunes: "+"}
      answer: "Tu la lis plus tard, seul. C'est pire, et c'est mieux."

  # ------------------------------------------------- après la société aux îles
  - id: jp.re.camille_montre
    roles: [joueur]
    arc: famille
    tags: [famille, caisse]
    speaker: camille
    tone: strategique
    # Après la valise (co.camille.valise pose `divorce`), Camille ne demande
    # plus l'heure : même garde que co.re.camille_journal.
    when: "!flag('divorce')"
    text: "Camille pose un dossier bleu entre les assiettes : « Un homme l'a déposé à midi, avec une montre que je ne pourrais pas m'offrir. On le lit ensemble ce soir, ou après ton entraînement ? »"
    left:
      label: "Ce soir, ensemble"
      effects: {relation: {camille: 1}, vestiaire: "-"}
      answer: "Vous lisez la page trois. Elle est écrite dans une langue que ni l'un ni l'autre ne lit."
    right:
      label: "Après l'entraînement"
      effects: {relation: {camille: -1}}
      answer: "Elle n'attend pas. Elle le lit seule, et photocopie la page trois, à tout hasard."

  # ----------------------------------- après le mercato d'hiver de la pépite
  # Défaut de relecture « récurrence du casting en S0 » : Camille, la cinquième
  # jauge, n'était vue que dans 58 % des premières saisons de la pépite depuis
  # que jp.camille_bac est redescendu à son poids juste (le bac tenait 96 % des
  # S0 à lui seul). Le mercato d'hiver, lui, est une ancre : il tombe dans
  # chaque S0, et c'est la carte du postulat qui la concerne le plus — on lui
  # apprend qu'on déménage, ou qu'on ne déménage pas.
  - id: jp.re.camille_janvier
    roles: [joueur]
    arc: famille
    tags: [famille, mercato]
    speaker: camille
    tone: strategique
    when: "!flag('divorce')"
    text: "Camille rapporte des cartons de la boulangerie, pliés sous le bras : « On m'a dit « janvier » au comptoir avant que tu me le dises, {toi}. On les remplit ce week-end, ou on attend juin ? »"
    left:
      label: "Les cartons ce week-end"
      effects: {relation: {camille: 1}, vestiaire: "-"}
      answer: "Vous faites les cartons le samedi. Elle en garde un, ouvert, « pour ce qu'on oublie »."
    right:
      label: "On attend juin"
      effects: {relation: {camille: -1}, direction: "+"}
      answer: "Elle range le carton vide sous l'escalier. Il y reste jusqu'en juin, ouvert."

  - id: jp.re.camille_juin
    roles: [joueur]
    arc: famille
    tags: [famille, mercato]
    speaker: camille
    tone: leger
    when: "!flag('divorce')"
    text: "Camille a la lettre du propriétaire sur les genoux : « Donc on reste jusqu'en juin. Lui veut savoir dès maintenant si on garde l'appartement. J'écris « on reste », ou j'écris « on verra » ? »"
    left:
      label: "Écris qu'on reste"
      effects: {relation: {camille: 1}, tribunes: "+"}
      answer: "Elle répond le soir même. Le propriétaire renouvelle au crayon ; lui aussi connaît les fax de juin."
    right:
      label: "Écris « on verra »"
      effects: {relation: {camille: -1}, caisse: "+"}
      answer: "Elle écrit « on verra ». Le propriétaire fait visiter l'appartement à un couple, un samedi, au cas où."

  # --------------------------------------------------- après le double mandat
  - id: jp.re.fardelli_amitie
    roles: [joueur]
    arc: agents
    tags: [agents]
    speaker: fardelli
    tone: strategique
    text: "Fardelli rappelle une heure après, la voix trop douce : « J'ai bien entendu. Ton dossier est sur mon siège passager, notre accord court jusqu'en juin. Je le garde, ou je te le rends ce soir ? »"
    left:
      label: "Garde-le jusqu'en juin"
      effects: {caisse: "-", relation: {fardelli: 1}}
      answer: "Il le garde. Il facture la garde chaque mois, avec un petit mot gentil au dos de la facture."
    right:
      label: "Rends-le ce soir"
      effects: {direction: "+", relation: {fardelli: -1}}
      answer: "Il le dépose dans ta boîte aux lettres à minuit. La page trois manque ; il dit qu'elle n'a jamais existé."

  # ------------------------------------------------- après le faux certificat
  - id: jp.re.sabatier_certificat
    roles: [joueur]
    arc: corps
    tags: [scandale]
    speaker: sabatier
    tone: strategique
    text: "Sabatier signe sans lire, puis il lit : « Une entorse que tu n'as pas, pour trois recruteurs venus quand même. Mon tiroir commence à être plein. C'est la dernière fois ? »"
    left:
      label: "La dernière"
      effects: {relation: {sabatier: 1}}
      answer: "Il classe. Dans le tiroir, pas dans le dossier."
    right:
      label: "On verra"
      effects: {relation: {sabatier: -1}, direction: "-"}
      answer: "Il classe dans le dossier. Le dossier, tout le monde peut le lire."

  # ------------------------------------------------------- après la radio (genou)
  - id: jp.re.sabatier_radio_agent
    roles: [joueur]
    arc: corps
    tags: [risk:tribunes]
    speaker: sabatier
    tone: strategique
    text: "Sabatier pose la main à plat sur le tiroir : « Ton agent a demandé ta radio ce matin, très poliment. Elle est là-dedans. Je la lui donne, ou le tiroir reste fermé ? »"
    left:
      label: "Le tiroir reste fermé"
      effects: {direction: "-", relation: {sabatier: 1}, set: [radio_cachee]}
      answer: "Il ferme à clé, devant toi. Ton agent demande deux fois ; deux fois non."
    right:
      label: "Donne-lui le dossier"
      effects: {caisse: "+", relation: {sabatier: -1}}
      answer: "Il donne. On vend avec ; on vend moins cher ; on vend."

  # -------------------------------------------------- après le retour de sélection
  - id: jp.re.lea_confirme
    roles: [joueur]
    arc: presse
    tags: [presse]
    speaker: lea
    tone: strategique
    text: "Au parking du stade, Léa pose deux feuilles sur le capot de ta voiture : le communiqué du club, et tes mots à toi. « Ils ne disent pas la même chose. Demain, j'en imprime un. Lequel ? »"
    left:
      label: "Celui du club"
      effects: {direction: "+", tribunes: "-"}
      answer: "Elle imprime celui du club. Tes mots restent dans son carnet ; elle ne jette jamais un carnet."
    right:
      label: "Les deux, côte à côte"
      effects: {tribunes: "+", direction: "-"}
      answer: "Elle imprime les deux, côte à côte. C'est la mise en page qui fait le scandale."

  # ------------------------------------------------------ après la mère du petit
  - id: jp.re.mere_mbako_note
    roles: [joueur]
    arc: formation
    tags: [formation]
    speaker: mere_mbako
    tone: strategique
    text: "La mère de Mbako t'arrête dans le couloir, son carnet contre la poitrine : « Ce que vous lui avez dit sur la vente, il me l'a répété mot pour mot. Le jour où on le vendra, vous l'appellerez ? »"
    left:
      label: "Je l'appellerai"
      effects: {relation: {mere_mbako: 1, mbako: 1}}
      answer: "Elle écrit ton nom dans le carnet de comptes, sur une page sans chiffre. C'est la première."
    right:
      label: "Il l'apprendra seul"
      effects: {tribunes: "+", relation: {mere_mbako: -1}}
      answer: "Elle referme le carnet. « Comme tout le monde, alors », dit-elle, et elle a raison."

  # ------------------------------------------------------ après un fax, un classeur
  - id: jp.re.josiane_classeur
    roles: [joueur]
    arc: direction
    tags: [direction]
    speaker: josiane
    tone: leger
    text: "Madame Josiane change ton contrat de classeur : « Votre dossier a déménagé cette nuit. Il est dans le vert, maintenant. Vous voulez savoir ce que veut dire le vert ? »"
    left:
      label: "Dites-moi"
      effects: {direction: "+", relation: {josiane: 1}}
      answer: "Le vert, c'est « en cours de vente ». Il y a aussi un rouge ; elle ne dit pas ce qu'est le rouge."
    right:
      label: "Je préfère ne pas savoir"
      effects: {tribunes: "+", relation: {josiane: -1}}
      answer: "Elle range le classeur vert. Elle le range plus haut que les autres, pour qu'on le voie."

  # ------------------------------------------------------ après la clause levée
  - id: jp.re.gege_blason
    roles: [joueur]
    arc: ultras
    tags: [ultras, tribunes]
    speaker: gege
    tone: strategique
    text: "Gégé tient la planche à ton nom, décrochée du mur du local : « Elle ne retournera pas au mur, {toi}. Tu viens la chercher, ou on la garde pour te la montrer à chaque derby ? »"
    left:
      label: "Je viens la chercher"
      effects: {tribunes: "-", relation: {gege: 1}}
      answer: "Tu descends au local un mardi, sans photographe. Il te tend la planche ; il garde le clou."
    right:
      label: "Gardez-la, montrez-la"
      effects: {tribunes: "--", relation: {gege: -1}}
      answer: "Au derby, la planche passe de main en main dans la Nord, qui siffle chaque fois que tu touches le ballon."

  # -------------------------------------------------------- après l'or refusé
  - id: jp.re.nassir_reviendrai
    roles: [joueur]
    arc: mercato
    tags: [mercato, sponsors]
    speaker: nassir
    tone: leger
    text: "Ilyas laisse sur la table la plaquette d'un stade à toit ouvrant, ton nom déjà imprimé en page deux : « Vous avez dit non ; je l'ai noté, sans rancune. Je vous la laisse, ou je la remporte ? »"
    left:
      label: "Laissez-la"
      effects: {caisse: "+", relation: {nassir: 1}}
      answer: "La plaquette reste sur ton étagère. Tu l'ouvres parfois à la page deux, sans raison."
    right:
      label: "Remportez-la"
      effects: {tribunes: "+", relation: {nassir: -1}}
      answer: "Il la remporte sous le bras. Elle revient trois ans plus tard, plus épaisse."

  # -------------------------------------------------------- après la sélection
  - id: jp.re.aulard_cheville
    roles: [joueur]
    arc: direction
    tags: [direction]
    speaker: aulard
    tone: strategique
    text: "Vaubourg tient une radio de cheville à l'envers : « Pour la Fédération, elle va très bien. Pour moi, elle allait mal. Tu me la ramènes entière, ou j'envoie la facture à Berthomier ? »"
    left:
      label: "Entière, promis"
      effects: {direction: "+", parole: 1, promise: true}
      answer: "Il note. Il facture quand même, pour le principe."
    right:
      label: "Envoyez la facture"
      effects: {direction: "-", tribunes: "+"}
      answer: "Il facture. La Fédération répond par une lettre qui annonce une commission ; la commission ne se réunit jamais."
