# Script d'ouverture du postulat « Fin de contrat à 31 ans » (bible ch. 10 § 4).
# Neuf ancres, leurs variantes, et les deux alarmes d'override du postulat.
# Le président est Vaubourg (`aulard`) ; le fonds est Ilyas (`nassir`).
# Toutes ces cartes sont des étapes de l'arc jp.fin.dernier_contrat : elles ne
# passent jamais par le sac.
cards:
  # ------------------------------------------------- F1 · La dernière année
  # Les trois variantes posent la MÊME réaction d'agent (`jp.re.fardelli_amitie`,
  # toutes sorties) : Fardelli est le porteur du postulat, et
  # seule la variante `fil_rouge == 'agent'` la posait — soit une S0 sur trois.
  # Il n'apparaissait deux fois qu'en 74 % des premières saisons, pour une cible
  # de casting de 2,5 (budget § 5.2 : ≥ 90 %). L'ancre du slot 1 est la seule
  # scène garantie de la S0 : c'est là que se tient la récurrence du patron.
  - id: jp.fin.f1_derniere_annee
    roles: [joueur]
    arc: contrat
    tags: [agents, mercato]
    speaker: fardelli
    # `leger` : le dessert pour deux qu'il mange tout seul est le gag d'entrée du
    # postulat, pas un calcul. Les deux variantes de fil rouge (le genou, le
    # vestiaire) gardent `strategique` — elles, elles calculent. Sans ça la S0
    # tombait juste sous le plancher « léger ≥ 50 % » du budget § 5.2.
    tone: leger
    text: "Fardelli coupe sa viande sans te regarder : « Personne ne prolonge un genou, {toi}. Moi, j'ai des amis qui ne regardent pas les radios. » Il écrit « 10 % » sur un coin de la nappe."
    left:
      label: "Dix pour cent, trouve"
      effects: {direction: "+", caisse: "-", relation: {fardelli: 1}, set: [agent_fardelli], react: [{card: jp.re.camille_projet, if: "!flag('divorce')"}, {card: jp.re.fardelli_amitie}]}
      answer: "Il commande un dessert pour deux. Il mange les deux."
    right:
      label: "Je cherche moi-même"
      effects: {direction: "-", vestiaire: "+", relation: {fardelli: -1}, set: [sans_agent], react: [{card: jp.re.camille_projet, if: "!flag('divorce')"}, {card: jp.re.fardelli_amitie}]}
      answer: "Il replie le contrat sous le cendrier. « Tu as trente et un ans » ; il ne dit pas la suite."

  - id: jp.fin.f1_derniere_annee_genou
    roles: [joueur]
    arc: contrat
    tags: [agents, mercato]
    speaker: fardelli
    tone: strategique
    text: "Fardelli beurre son pain sans te regarder : « J'ai demandé ta radio au Doc ce matin, {toi}, avant les autres. Un genou se vend mieux quand c'est un ami qui le montre. On travaille ensemble ? »"
    left:
      label: "On travaille ensemble"
      effects: {direction: "+", caisse: "-", relation: {fardelli: 1}, set: [agent_fardelli, radio_demandee], react: [{card: jp.re.fardelli_amitie, chance: 0.5}, {card: jp.re.sabatier_radio_agent}]}
      answer: "Il commande un dessert pour deux. Le Doc, lui, n'a pas encore ouvert le tiroir."
    right:
      label: "Laisse ma radio au Doc"
      effects: {direction: "-", vestiaire: "+", relation: {fardelli: -1}, set: [sans_agent, radio_demandee], react: {card: jp.re.fardelli_amitie}}
      answer: "Il replie le contrat sous le cendrier. Il a déjà appelé deux fois l'infirmerie ; il ne le dit pas."

  - id: jp.fin.f1_derniere_annee_vestiaire
    roles: [joueur]
    arc: contrat
    tags: [agents, vestiaire]
    speaker: fardelli
    tone: strategique
    text: "Fardelli pousse la salière vers toi : « Titi Bréhaut a ton genou, à un an près, et le brassard en plus. Un vestiaire ne garde qu'un ancien, {toi}. Cet hiver, je vends lequel des deux ? »"
    left:
      label: "Vends-moi, pas lui"
      effects: {direction: "+", vestiaire: "-", relation: {fardelli: 1}, set: [agent_fardelli], react: {card: jp.re.fardelli_amitie}}
      answer: "Il écrit ton nom en haut d'une liste, sur la nappe. Bréhaut n'apprendra jamais qu'il était juste en dessous."
    right:
      label: "Ni l'un ni l'autre"
      effects: {vestiaire: "++", direction: "-", relation: {fardelli: -1, brehaut: 1}, set: [sans_agent], react: {card: jp.re.fardelli_amitie}}
      answer: "Il replie le contrat sous le cendrier. Le lendemain, Bréhaut te serre la main plus longtemps que d'habitude, sans savoir pourquoi."

  # ------------------------------------------------------ F2 · L'offre d'hiver
  - id: jp.fin.f2_offre
    roles: [joueur]
    arc: contrat
    tags: [direction, mercato]
    speaker: aulard
    tone: strategique
    text: "Vaubourg signe autre chose en te parlant : « Un an de plus au rabais, {toi}, avec une clause : quinze matchs joués, ou le contrat s'arrête. Mon club paie des matchs, pas des genoux. Tu signes ? »"
    left:
      label: "Je signe le rabais"
      effects: {direction: "++", caisse: "-", set: [prolonge_rabais]}
      answer: "Tu signes. Le chiffre est petit ; la clause est grande."
    right:
      label: "J'attends juin"
      effects: {direction: "--", tribunes: "+", set: [attend_juin], react: jp.re.josiane_formulaire}
      answer: "Il range la page. En juin, il en aura une autre, ou pas."

  - id: jp.fin.f2_offre_fax
    roles: [joueur]
    arc: contrat
    tags: [direction, vestiaire]
    speaker: aulard
    tone: strategique
    text: "Vaubourg pose la main sur un fax : « Une pétition du vestiaire, {toi}. Vingt-deux noms ; je ne l'ai pas lue, je l'ai pesée. Mon offre ne bouge pas : un an au rabais, quinze matchs. Tu signes ? »"
    left:
      label: "Je signe, pour eux"
      effects: {direction: "+", vestiaire: "++", set: [prolonge_rabais]}
      answer: "Tu signes. Josiane classe la pétition sous le contrat, à l'endroit."
    right:
      label: "J'attends juin"
      effects: {direction: "-", vestiaire: "+", set: [attend_juin]}
      answer: "Il range la page sur la pétition. Les deux attendront juin ensemble."

  - id: jp.fin.f2_offre_or
    roles: [joueur]
    arc: contrat
    tags: [mercato, caisse]
    speaker: nassir
    tone: strategique
    text: "Cheikh Ilyas ouvre le toit d'une maquette de stade posée entre vous : « Un nom comme le vôtre rapporte plus chez nous qu'ici, {toi}. Deux ans au chaud, payés d'avance, ou six mois ici pour finir ? »"
    left:
      label: "Deux ans au chaud"
      effects: {caisse: "+++", tribunes: "--", set: [exil_dore], club: {change: true}, outcome: parti}
      answer: "Tu signes. Le genou aime la chaleur ; le reste, moins."
    right:
      label: "Six mois ici"
      effects: {tribunes: "++", caisse: "-", relation: {nassir: -1}, react: jp.re.nassir_reviendrai}
      answer: "Il referme le toit de la maquette et la laisse sur la table. « Je reviendrai », dit-il ; il revient toujours."

  - id: jp.fin.f2_offre_maison
    roles: [joueur]
    arc: contrat
    tags: [famille, mercato]
    speaker: camille
    tone: strategique
    text: "Camille déplie une carte routière, un cercle au feutre autour de ta ville natale : « Le club de là-bas veut un nom pour monter. Moi, là-bas, je ne connais personne. On rentre, {toi} ? »"
    left:
      label: "On rentre"
      effects: {tribunes: "+", caisse: "-", relation: {camille: 2}, set: [maison_pays_signee], club: {change: true, division: 2}, outcome: parti}
      answer: "Tu signes en Division 2, chez toi. Ta mère fait construire ; elle n'a pas attendu."
    right:
      label: "On finit ici"
      effects: {direction: "+", relation: {camille: -1}, set: [pays_refuse]}
      answer: "Elle replie la carte. Le cercle au feutre reste visible à travers le papier."

  # Le script commente le feuilleton, il ne le raconte plus (spec §1.2) : quand
  # « La maison du pays » a déjà posé la question du retour, l'ancre d'hiver ne
  # la repose pas — elle passe la lettre sous le contrat.
  - id: jp.fin.f2_offre_maison_refus
    roles: [joueur]
    arc: contrat
    tags: [direction, famille]
    speaker: josiane
    tone: strategique
    text: "« Le contrat d'un an au rabais est sur le bureau, {toi}, et dessous il y a la lettre du club de chez vous, celle que vous avez refusée. Je monte laquelle des deux ? »"
    left:
      label: "Le rabais, en haut"
      effects: {direction: "++", caisse: "-", set: [prolonge_rabais]}
      answer: "Elle monte le contrat. La lettre reste dessous, pliée en trois, avec un cercle au feutre."
    right:
      label: "Aucune des deux"
      effects: {direction: "--", tribunes: "+", set: [attend_juin]}
      answer: "Elle range les deux dans le même dossier. Le dossier s'appelle « juin »."

  # ------------------------------------------------------- F2b · La quinzième
  - id: jp.fin.f2b_quinzieme
    roles: [joueur]
    arc: corps
    tags: [moment, vestiaire]
    speaker: sabatier
    tone: strategique
    text: "Sabatier compte les croix du calendrier avec son capuchon : « En août, j'avais écrit quinze sur ta radio, {toi}. Ton genou en a tenu quatorze. Dimanche, la quinzième : tu la joues, ou tu regardes ? »"
    left:
      label: "Je joue la quinzième"
      effects: {tribunes: "++", force: -1, set: [quinzieme_jouee], rand: [{p: 0.2, set: [genou_grave]}, {}], react: jp.re.fardelli_quinze}
      answer: "Tu joues. Le genou tient, ou dit ce qu'il avait à dire. En loge, on compte autre chose."
    right:
      label: "En tribune, radio propre"
      effects: {direction: "+", tribunes: "-", force: 1, set: [quinzieme_tribune, banc_regarde], react: jp.re.vukic_feuille}
      answer: "Tu regardes. L'adjoint s'assoit à côté, la feuille de match sur les genoux."

  - id: jp.fin.f2b_quinzieme_clause
    roles: [joueur]
    arc: corps
    tags: [moment, direction]
    speaker: sabatier
    tone: strategique
    text: "Sabatier pose son capuchon sur la quatorzième croix : « Quinze. Le chiffre de ma radio, et celui de la clause du président, {toi}. Lui aussi, il compte. Tu joues pour la clause, ou tu la laisses ? »"
    left:
      label: "Pour la clause"
      effects: {direction: "+", tribunes: "+", set: [quinzieme_jouee], rand: [{p: 0.25, set: [genou_grave]}, {}], react: jp.re.fardelli_quinze}
      answer: "Tu joues. La clause est cochée ; Josiane la coche elle-même, au crayon."
    right:
      label: "Je la laisse tomber"
      effects: {caisse: "--", direction: "-", force: 1, set: [quinzieme_tribune, banc_regarde], clear: [prolonge_rabais], react: jp.re.vukic_feuille}
      answer: "Le contrat s'arrête à la case quatorze. Au bureau, Vaubourg raye ton nom sur la liste des salaires, au stylo rouge."

  # -------------------------------------------------------------- F3 · Juin
  - id: jp.fin.f3_juin
    roles: [joueur]
    arc: contrat
    tags: [direction, mercato]
    speaker: aulard
    tone: strategique
    text: "Vaubourg, le téléphone contre l'épaule, fait glisser un contrat vers toi : « Ton genou a tenu la saison, {toi}, ou presque. Un an de plus ici, ou l'offre d'ailleurs ? J'ai un président en ligne. »"
    left:
      label: "Un an de plus, ici"
      effects: {direction: "+", tribunes: "+", caisse: "-", set: [prolonge], outcome: prolonge, react: jp.re.vecchio_encore_une}
      answer: "Tu signes. Le Doc signe le certificat en dessous, sans lire le montant."
    right:
      label: "L'offre d'ailleurs"
      effects: {caisse: "++", tribunes: "--", club: {change: true}, set: [parti_juin], outcome: parti}
      answer: "Tu pars. Le vestiaire t'offre une aile de poulet et une lettre ; la lettre est courte."

  - id: jp.fin.f3_juin_rabais
    roles: [joueur]
    arc: contrat
    tags: [direction]
    speaker: josiane
    tone: leger
    text: "Madame Josiane ouvre ton dossier à la page de janvier, un crayon à la main : « La clause des quinze matchs, {toi}. Le président la veut avant le 30 juin. Je la coche, ou je laisse en blanc ? »"
    left:
      label: "Cochez, c'est fait"
      effects: {direction: "+", relation: {josiane: 1}, set: [prolonge], outcome: prolonge}
      answer: "Elle coche au crayon. Le président lit la croix ; il ne compte pas derrière elle."
    right:
      label: "Laissez en blanc"
      effects: {vestiaire: "+", direction: "-", set: [prolonge], outcome: prolonge}
      answer: "Elle laisse blanc. Personne ne réclame ; c'est ce qui s'appelle un an de plus."

  - id: jp.fin.f3_juin_petition
    roles: [joueur]
    arc: contrat
    tags: [vestiaire, direction]
    speaker: aulard
    tone: strategique
    text: "Vaubourg tapote la pétition du vestiaire, posée à plat devant lui : « J'ai fini par la lire, {toi}. Vingt-deux noms, ça se prolonge, même avec un genou pareil. Un an de plus, pour eux ? »"
    left:
      label: "Un an, pour eux"
      effects: {vestiaire: "++", direction: "+", set: [prolonge, prolonge_vestiaire], outcome: prolonge}
      answer: "Bréhaut a signé en premier. Il le fait remarquer, deux fois, à deux personnes."
    right:
      label: "Je pars quand même"
      effects: {vestiaire: "--", caisse: "++", club: {change: true}, set: [parti_juin], outcome: parti}
      answer: "La pétition reste sur le bureau. Il s'en sert de sous-main tout l'été."

  - id: jp.fin.f3_juin_aucune
    roles: [joueur]
    arc: contrat
    tags: [agents, caisse]
    speaker: fardelli
    tone: strategique
    text: "Fardelli, d'une cabine, la voix trop gaie : « J'ai appelé tous mes amis, {toi}. En juin, on achète des jambes, pas des souvenirs. Tu attends août sans club, ou tu prends la réserve de Vukić ? »"
    left:
      # `sans_club` posait une trace, une manchette et une fin, mais AUCUN
      # changement de club ni de rôle : la saison suivante s'ouvrait sur « tu es
      # là depuis août » puis enchaînait une saison de club entière — derby,
      # coupe, vestiaire, offre de D2 — pendant que l'Almanach imprimait
      # « trente-deux ans, sans club ». Le contrat s'arrête donc pour de bon :
      # l'été est vide, et ce qui rappelle fin août rappelle deux divisions plus
      # bas (l'`answer` le disait déjà, elle est maintenant vraie).
      label: "J'attends août"
      effects: {caisse: "--", tribunes: "-", set: [sans_club], outcome: sans_club, club: {change: true, division: 2}}
      answer: "Tout l'été, le téléphone se tait ; quelqu'un l'avait débranché. Le 31 août, deux divisions plus bas, un club rappelle."
    right:
      label: "Le banc de la réserve"
      effects: {direction: "+", tribunes: "--", caisse: "-", set: [banc_reserve, vers_entraineur], outcome: banc, relation: {vukic: 1}}
      answer: "Vukić te tend un survêtement de la réserve. Il est à ta taille ; il l'avait pris exprès."

  # --------------------------------------------------- S1 · Le premier jour
  - id: jp.fin.s1_premier_jour
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: vukic
    tone: strategique
    text: "Vukić t'arrête au bord du terrain, le cahier sous le bras : « Le coach a fait sa liste, {toi}. Tu es dans les seize, pas dans les onze. Ce n'est pas une punition : c'est ton genou. Tu l'acceptes ? »"
    left:
      label: "J'accepte"
      effects: {vestiaire: "+", relation: {vukic: 1}}
      answer: "Il hoche la tête. Il note la date dans son cahier, à ta page."
    right:
      label: "Je vais le voir"
      effects: {direction: "-", tribunes: "+"}
      answer: "Tu y vas. Il t'écoute jusqu'au bout, puis il fait la compo sans toi."

  - id: jp.fin.s1_premier_jour_prolonge
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: brehaut
    tone: leger
    text: "Bréhaut tend devant lui son genou bandé, à côté du tien : « Deux vieux genoux, {toi}. Au vestiaire, ça fait un joueur et demi. On se partage les matchs, ou on se bat pour le brassard ? »"
    left:
      label: "On se partage les matchs"
      effects: {vestiaire: "++", force: -1, relation: {brehaut: 1}, set: [partage_brehaut]}
      answer: "Vous jouez un match sur deux. Le coach compte ; vous, non."
    right:
      label: "Je veux le brassard"
      effects: {tribunes: "+", vestiaire: "-", relation: {brehaut: -1}}
      answer: "Vous jouez tous les deux, tous les matchs. En mars il n'en reste qu'un."

  - id: jp.fin.s1_premier_jour_parti
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: josiane
    tone: strategique
    text: "Madame Josiane t'appelle à ton nouveau club, pour le courrier : « J'ai lu leur fax avant de le classer, {toi}. Ils vous prennent pour le vestiaire, pas pour les jambes. Vous prenez quel casier ? »"
    left:
      label: "Près des jeunes"
      effects: {vestiaire: "++", direction: "-"}
      answer: "Le premier jour, les jeunes te vouvoient. Le troisième, ils te tutoient et te demandent comment on dure."
    right:
      label: "Près du coach"
      effects: {direction: "++", vestiaire: "-"}
      answer: "Le coach t'appelle « mon relais ». Les jeunes t'appellent « le relais »."

  # Le premier jour du club d'après. `sans_club` a fait son travail — la ligne
  # d'Almanach, la manchette de la gazette, l'issue du script — et il se referme
  # ici : sans `clear`, il restait posé pour toute la carrière et la Une « 32
  # ANS, SANS CLUB » pouvait s'imprimer une saison où le joueur disputait son
  # derby. La trace reste écrite au passé dans le journal ; le drapeau, lui, ne
  # survit pas au premier jour.
  - id: jp.fin.s1_premier_jour_sans_club
    roles: [joueur]
    arc: famille
    tags: [famille, caisse]
    speaker: camille
    tone: strategique
    text: "Camille a noté les kilomètres sur un ticket de caisse, à côté de tes clés : « Deux heures aller, deux heures retour, depuis le 31 août, {toi}. Tu finis la saison là-bas, ou tu prends la réserve ? »"
    left:
      # Pas d'`outcome:` ici : l'issue de la carrière est `sans_club`, posée en
      # juin. La reprendre en `banc` effaçait la seule trace de l'été sans club
      # (spec §1.3 : `ArcState.outcome` garde la dernière issue posée).
      label: "Le poste à la réserve"
      effects: {direction: "+", caisse: "+", relation: {camille: 1, vukic: 1}, set: [vers_entraineur], clear: [sans_club]}
      answer: "Tu appelles Vukić ; il décroche à la première sonnerie. La route, tu la fais une dernière fois, pour rendre le maillot."
    right:
      label: "Je finis la saison là-bas"
      effects: {caisse: "-", tribunes: "-", relation: {camille: -2}, clear: [sans_club]}
      answer: "Tu finis. Deux heures le samedi, deux heures le dimanche. En janvier le club paie en retard, et une fois en merguez."

  # Après la valise (co.camille.valise pose `divorce`), Camille ne pose plus la
  # question de l'heure : c'est l'agent qui appelle, et il ne dit plus « ami ».
  - id: jp.fin.s1_premier_jour_sans_club_seul
    roles: [joueur]
    arc: caisse
    tags: [agents, caisse]
    speaker: fardelli
    tone: strategique
    text: "Fardelli, au téléphone, d'une voix d'affaires : « Un club deux divisions plus bas te prend au match, {toi}. Ta maison est vide, je sais ; ça laisse le temps de la route. Tu y vas ? »"
    left:
      label: "Le banc de la réserve"
      effects: {direction: "+", caisse: "+", relation: {vukic: 1}, set: [vers_entraineur], clear: [sans_club]}
      answer: "Tu appelles Vukić. Il répond à la première sonnerie ; il attendait, lui aussi."
    right:
      label: "J'y vais"
      effects: {caisse: "-", tribunes: "-", relation: {fardelli: -1}, clear: [sans_club]}
      answer: "Tu y vas. Un contrat au match, et le train. Fardelli ne prend pas dix pour cent d'un contrat au match ; il ne rappelle plus."

  # ---------------------------------------------------------- S1 · Les jambes
  - id: jp.fin.s1_jambes
    roles: [joueur]
    arc: corps
    tags: [moment]
    speaker: sabatier
    tone: strategique
    text: "Sabatier compare son chronomètre et celui de la kiné : « D'accord sur une seule chose, {toi} : trois pas de moins sur trente mètres. Tu recules d'un cran, ou tu cours après ? »"
    left:
      label: "Je recule d'un cran"
      effects: {force: 2, tribunes: "-", vestiaire: "+", set: [recule_poste]}
      answer: "Tu joues plus bas. Tu vois le jeu de derrière ; l'adjoint dit qu'on voit tout, de là."
    right:
      label: "Je cours après"
      effects: {tribunes: "+", force: -4, react: jp.re.sabatier_trois_pas, rand: [{p: 0.3, set: [genou_grave], tribunes: "--"}, {}]}
      answer: "Tu cours. Trois pas, ça ne se rattrape pas ; ça se paie, en mars, ou en mai."

  - id: jp.fin.s1_jambes_gigi
    roles: [joueur]
    arc: corps
    tags: [moment, vestiaire]
    speaker: vecchio
    tone: strategique
    text: "Vecchio, les gants jaunes sous le bras, te regarde finir ton sprint : « Le Doc a compté trois pas au chronomètre, {toi}. Moi, je les ai vus depuis mon but. Tu recules d'un cran, ou tu cours après ? »"
    left:
      label: "Je recule d'un cran"
      effects: {force: 2, vestiaire: "+", relation: {vecchio: 1}, set: [recule_poste]}
      answer: "Tu joues plus bas. Il dit que les gardiens font ça depuis toujours ; c'est vrai."
    right:
      label: "Je cours après"
      effects: {tribunes: "+", force: -2, relation: {vecchio: -1}}
      answer: "Tu cours. Il te regarde courir. Il ne dit rien ; il a arrêté de compter."

  # Seconde vague : le Doc a compté quatorze croix en S0, il compte trois pas en
  # S1 (couture, spec §5.2 : une saison S1+ lit une trace posée avant).
  - id: jp.fin.s1_jambes_quinzieme
    roles: [joueur]
    arc: corps
    tags: [moment]
    speaker: sabatier
    tone: strategique
    text: "Sabatier a gardé le calendrier de l'an dernier et ses quinze croix : « Depuis la quinzième, {toi}, tu as perdu trois pas. Je les ai mesurés deux fois. Tu recules d'un cran, ou tu cours après ? »"
    left:
      label: "Je recule d'un cran"
      effects: {force: 2, tribunes: "-", vestiaire: "+", set: [recule_poste]}
      answer: "Tu joues plus bas. Il barre la quinzième croix et en dessine une autre, plus loin."
    right:
      label: "Je cours après"
      effects: {tribunes: "+", force: -3, rand: [{p: 0.25, set: [genou_grave], tribunes: "--"}, {}]}
      answer: "Tu cours. Il ferme le carnet des croix ; il en ouvre un autre, pour compter les mois."

  # --------------------------------------------------- S1 · La veille, le papier
  - id: jp.fin.s1_veille
    roles: [joueur]
    arc: direction
    tags: [direction, formation]
    speaker: vukic
    tone: strategique
    text: "Vukić ouvre son cahier à une page presque vide, ton nom en haut : « Le banc de la réserve se libère en juin, {toi}. Ton nom est le premier. Demain, tu joues, ou tu regardes déjà le banc ? »"
    left:
      label: "Je joue demain"
      effects: {tribunes: "+", force: 1, relation: {vukic: 1}}
      answer: "Il referme le cahier. Il ne raye pas ton nom ; il en garde un autre en dessous."
    right:
      label: "Je regarde déjà le banc"
      effects: {direction: "+", tribunes: "-", relation: {vukic: 1}, set: [banc_regarde]}
      answer: "Il te donne le cahier. Il en a un autre ; il en a toujours un autre."

  - id: jp.fin.s1_veille_ailleurs
    roles: [joueur]
    arc: direction
    tags: [direction, formation]
    speaker: vukic
    tone: strategique
    text: "Vukić, au téléphone, du vent derrière lui : « J'ai un banc à moi, maintenant, {toi}, et un poste d'adjoint à ton nom, écrit au crayon. Le train part lundi. Tu joues demain, ou tu viens ? »"
    left:
      label: "Je joue demain"
      effects: {tribunes: "+", force: 1}
      answer: "Il dit « dimanche prochain, alors ». Il le dit tous les dimanches."
    right:
      label: "Je viens"
      effects: {direction: "+", relation: {vukic: 2}, set: [vers_entraineur, suit_vukic], outcome: banc}
      answer: "Tu prends le train le lundi. Le cahier est dans le sac, sous les crampons."

  # Seconde vague : le vestiaire a écrit vingt-deux noms l'an dernier. Cette
  # année, la veille du dernier bloc, il en manque deux (couture, spec §5.2).
  - id: jp.fin.s1_veille_petition
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, moment]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut déplie la pétition de l'an dernier, deux noms rayés depuis : « Cette année, personne ne l'a ressortie, {toi}. Les gars ont changé, ou toi. Demain, tu joues, ou tu laisses la place ? »"
    left:
      label: "Je joue demain"
      effects: {tribunes: "+", force: 1, vestiaire: "-"}
      answer: "Tu joues. Deux jeunes regardent depuis le banc ; ils ont signé la feuille, eux."
    right:
      label: "Je laisse la place"
      effects: {vestiaire: "++", tribunes: "-", relation: {brehaut: 1}, set: [banc_regarde]}
      answer: "Tu laisses. Il garde la feuille dans son casier ; il ne la jette jamais."

  # ------------------------------------------------- S2+ · Une saison de plus
  # Marche 1 de l'escalier (bible ch. 10 § 4, « Une saison de plus ») : la
  # chaussette trouée, la quatrième retraite. Les deux sorties posent
  # `s2_saison_marche` : la saison suivante, l'ancre monte d'une marche au lieu
  # de rejouer la même scène (correctif « la colonne vertébrale se répète »).
  - id: jp.fin.s2_saison_de_plus
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: vecchio
    tone: leger
    text: "Vecchio brandit une chaussette trouée au talon, comme une pièce à conviction : « Quatre retraites, {toi}, et toujours la même paire. Une saison de plus : tu la joues pour toi, ou pour les jeunes ? »"
    left:
      label: "Je la joue pour moi"
      effects: {tribunes: "+", force: -1, set: [s2_saison_marche]}
      answer: "Il hoche la tête. Il a connu des égoïstes qui ont duré longtemps ; il les aimait bien."
    right:
      label: "Pour montrer aux jeunes"
      effects: {vestiaire: "++", tribunes: "-", relation: {mbako: 1}, set: [s2_saison_marche]}
      answer: "Le petit te regarde t'échauffer. Il copie. Il fait mieux ; c'est le but."

  # Marche 2 : les gants sous le bras. Elle pose `s2_saison_encore`, qui ouvre
  # la marche 3 la saison d'après.
  - id: jp.fin.s2_saison_de_plus_encore
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, absurde]
    speaker: vecchio
    tone: leger
    text: "Vecchio regarde l'échauffement depuis la touche, les gants jaunes sous le bras et plus aux mains : « Encore une saison, {toi}. Moi, je n'en ai plus. Tu la joues pour toi, ou pour eux ? »"
    left:
      label: "Je la joue pour moi"
      effects: {tribunes: "+", relation: {vecchio: 1}, set: [s2_saison_encore]}
      answer: "Il raconte ta carrière à un jeune, à ta place. Il se trompe d'une saison ; personne ne corrige."
    right:
      label: "Je la joue pour eux"
      effects: {vestiaire: "++", force: -1, relation: {mbako: 1}, set: [s2_saison_encore]}
      answer: "Les jeunes te laissent le ballon à l'échauffement. C'est une politesse ; tu la prends."

  # Marche 3, écrite pour ce lot (bible ch. 10 § 4, variante « les chaussettes
  # de quatre-vingt-dix ») : Gigi a rendu les gants et gardé les chaussettes.
  # Elle efface `s2_saison_encore` : au-delà, l'escalier redescend d'une marche
  # au lieu de servir trois fois la même carte.
  - id: jp.fin.s2_saison_de_plus_vrai
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, absurde]
    speaker: vecchio
    tone: leger
    text: "Vecchio pose sur le banc des chaussettes grises, trouées au talon : « J'ai rendu les gants pour de bon, {toi}. Celles-là datent de quatre-vingt-dix. Tu les mets, ou tu en prends des neuves ? »"
    left:
      label: "Je mets les siennes"
      effects: {vestiaire: "++", tribunes: "-", relation: {vecchio: 2}, clear: [s2_saison_encore]}
      answer: "Il te les donne sans les laver. « Le lavage, ça enlève les saisons », dit-il ; il s'en va sans se retourner."
    right:
      label: "Je prends des neuves"
      effects: {tribunes: "+", force: 1, clear: [s2_saison_encore]}
      answer: "Il repose les siennes dans le casier que personne ne touche, et le referme doucement."

  # Seconde vague : celui qui a reculé d'un cran voit tout, y compris le banc.
  # `recule_poste` et `banc_regarde` sont des traces définitives : sans garde
  # propre, Vukić reposait la même question toutes les saisons. Les deux sorties
  # posent `s2_recule_vu` et la variante ne revient plus (garde d'une saison).
  - id: jp.fin.s2_saison_de_plus_recule
    roles: [joueur]
    arc: direction
    tags: [direction, formation]
    speaker: vukic
    tone: strategique
    text: "Vukić se place derrière toi, là où tu joues maintenant, et regarde dans le même sens : « D'ici, on voit tout le jeu, {toi}. Et le banc. Tu rejoues une saison, ou tu regardes un peu avec moi ? »"
    left:
      label: "Je rejoue"
      effects: {tribunes: "+", force: 1, relation: {vukic: 1}, set: [s2_recule_vu]}
      answer: "Il note la date. Il laisse la page ouverte ; il sait qu'il la relira en juin."
    right:
      label: "Je regarde, un peu"
      effects: {direction: "+", tribunes: "-", relation: {vukic: 1}, set: [banc_regarde, s2_recule_vu]}
      answer: "Tu t'assois à côté de lui. Il te passe le cahier sans rien dire ; c'est un cadeau."

  # ------------------------------------------------------- S2+ · La veille
  # Marche 1 de la veille (bible ch. 10 § 4, « La veille, Camille ») : elle
  # baisse le son, elle ne coupe pas. Les deux sorties posent `s2_veille_marche`
  # pour que la saison suivante monte d'une marche.
  - id: jp.fin.s2_veille
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: strategique
    text: "Camille baisse le son de la télé sans l'éteindre : « Demain soir, après le dernier match, je ne sais pas qui va rentrer, {toi}. Un joueur, ou quelqu'un d'autre. Tu me le dis ce soir ? »"
    left:
      label: "Ce soir : je continue"
      effects: {tribunes: "+", relation: {camille: -1}, set: [s2_veille_marche]}
      answer: "Elle remonte le son. Le match à la télé, c'est celui d'un joueur de vingt ans."
    right:
      label: "Ce soir : c'est le dernier"
      effects: {direction: "+", relation: {camille: 2}, set: [dernier_annonce, s2_veille_marche]}
      answer: "Elle coupe la télé. Elle ne dit rien ; c'est la première fois que le silence est bon."

  # Marche 2, écrite pour ce lot : la même veille, une saison plus tard. Elle
  # ne demande plus l'heure — elle a arrêté de la demander. Elle efface
  # `s2_veille_marche` : l'ancre alterne au lieu de se répéter.
  - id: jp.fin.s2_veille_encore
    roles: [joueur]
    arc: famille
    tags: [famille]
    speaker: camille
    tone: strategique
    text: "Camille compte les couverts dans le tiroir sans te regarder : « Demain soir, après ton match, j'en sors deux, {toi}, ou j'attends de voir qui rentre ? »"
    left:
      label: "Deux couverts"
      effects: {direction: "+", relation: {camille: 2}, set: [dernier_annonce]}
      answer: "Elle met les deux couverts le soir même, pour s'entraîner. Elle laisse la télé éteinte."
    right:
      label: "On verra"
      effects: {tribunes: "+", force: 1, relation: {camille: -1}, clear: [s2_veille_marche]}
      answer: "Elle en met un. Le deuxième reste dans le tiroir, propre, à portée de main."

  - id: jp.fin.s2_veille_josiane
    roles: [joueur]
    arc: direction
    tags: [direction]
    speaker: josiane
    tone: strategique
    text: "Madame Josiane t'attend à la sortie de l'entraînement, le formulaire jaune à la main, daté de l'an dernier : « Dernier match demain, {toi}. L'an dernier, ce n'en était pas un. Celui-là ? »"
    left:
      label: "Celui-là, oui"
      effects: {direction: "+", relation: {josiane: 1}, set: [dernier_annonce, s2_josiane_vu]}
      answer: "Elle rature l'année sur le formulaire et écrit la bonne au-dessus, en appuyant fort."
    right:
      label: "On verra en juin"
      effects: {tribunes: "+", relation: {josiane: -1}, set: [s2_josiane_vu]}
      answer: "Elle referme le classeur. Elle laisse le formulaire dessus, en évidence."

  # Seconde vague : la tribune se souvient du jubilé — celui qu'on a fait, ou
  # celui dont l'affiche est restée sans date. `jubile_fait` / `jubile_reporte`
  # sont définitifs : la variante pose `s2_jubile_vu` et ne tient qu'une saison.
  - id: jp.fin.s2_veille_jubile
    roles: [joueur]
    arc: tribunes
    tags: [ultras, tribunes]
    speaker: gege
    tone: strategique
    text: "Gégé t'attend sur le parking, l'affiche de ton jubilé roulée sous le bras : « Le virage t'a déjà dit au revoir une fois, {toi}, et tu es encore là. Demain, une saison de plus, ou la fin ? »"
    left:
      label: "Une saison de plus"
      effects: {tribunes: "++", force: -1, relation: {gege: 1}, set: [s2_jubile_vu]}
      answer: "Il garde l'affiche roulée sous le bras. Il ne la range pas ; il la garde, ce n'est pas pareil."
    right:
      label: "La fin, demain"
      effects: {tribunes: "+", direction: "+", set: [dernier_annonce, s2_jubile_vu]}
      answer: "Il déroule l'affiche sur ton capot et écrit la date de demain au feutre, en appuyant."

  # --------------------------------------------- Les alarmes du postulat
  # Alarme `vestiaire.low`. La fin `jp_mouton` (« On ne t'a plus jamais fait de
  # passe. Même au toro. ») n'était atteinte par aucune carrière de ce postulat
  # sur 5 000 : le vestiaire part à 50 et toutes les intrigues du réservoir le
  # remontent (la pétition, le capitaine, Vecchio), tandis que la seule alarme
  # basse du rôle rend +10 d'un côté et −5 de l'autre. Ici le refus coûte le
  # double : le vieux qui joue seul finit seul, et la fin a enfin sa pente.
  - id: jp.fin.alarme_brehaut_plus_de_passe
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, rescue:vestiaire]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut te rattrape au parking, son sac sur l'épaule : « Trois semaines que les gars ne te font plus la passe, {toi}. J'ai compté avec eux. Tu viens leur parler, ou tu continues sans eux ? »"
    left:
      label: "Je viens leur parler"
      effects: {vestiaire: "++", tribunes: "-", relation: {brehaut: 1}}
      answer: "Tu le dis debout, au milieu. Trois joueurs regardent leurs crampons ; le quatrième te sert samedi."
    right:
      label: "Je joue sans eux"
      effects: {vestiaire: "--", force: 1, relation: {brehaut: -1}, set: [joue_seul]}
      answer: "Personne ne te siffle ; personne ne te sert non plus. Au toro, tu es au milieu, et tu y restes."

  # Deuxième marche : quand on a déjà choisi de jouer seul, le vestiaire ne
  # propose plus rien, il constate. C'est la pente qui mène à `jp_mouton`.
  - id: jp.fin.alarme_brehaut_toro_seul
    roles: [joueur]
    arc: vestiaire
    tags: [vestiaire, rescue:vestiaire]
    speaker: brehaut
    tone: strategique
    text: "Bréhaut, à la fin du toro, le ballon sous le pied : « Trois semaines que tu es au milieu, {toi}, et personne ne t'en sort. Les gars ont même arrêté de compter. Tu demandes à sortir, ou tu restes ? »"
    left:
      label: "Je demande à sortir"
      effects: {vestiaire: "++", tribunes: "-", relation: {brehaut: 1}, clear: [joue_seul]}
      answer: "Tu demandes. Bréhaut te sort au bout de deux passes ; il les compte à voix haute, les deux."
    right:
      label: "Je reste au milieu"
      effects: {vestiaire: "---", force: 1}
      answer: "Tu restes. À la fin de la séance, tout le monde est parti et le ballon est encore là. Toi aussi."

  - id: jp.fin.alarme_gege_papy
    roles: [joueur]
    arc: tribunes
    tags: [ultras, tribunes]
    speaker: gege
    once: true
    text: "Après la défaite, Gégé t'attend derrière la grille de la Nord : « Avant, le virage chantait ton nom à chaque sprint, {toi}. Aujourd'hui, il regardait ses pieds. Tu lui donnes un match, ou ta place ? »"
    left:
      label: "Un match, dimanche"
      effects: {tribunes: "++", force: -2, rand: [{p: 0.25, set: [genou_grave]}, {}]}
      answer: "Tu joues fort. Une fois. La tribune chante ; le genou, lui, siffle."
    right:
      label: "Ma place, au jeune"
      effects: {tribunes: "+", vestiaire: "+", direction: "-", relation: {mbako: 1}, set: [place_au_jeune]}
      answer: "Le jeune joue. La tribune chante son nom ; elle a rangé le tien, elle ne le siffle plus."

  - id: jp.fin.alarme_fardelli_aucune_offre
    roles: [joueur]
    arc: caisse
    tags: [agents, caisse]
    speaker: fardelli
    once: true
    text: "Fardelli feuillette son carnet sans trouver ta page : « Un genou à ce prix-là, {toi}, personne n'en veut. On baisse le prix, ou on attend que quelqu'un se blesse ailleurs ? »"
    left:
      label: "On baisse le prix"
      effects: {caisse: "+", direction: "+", relation: {fardelli: 1}}
      answer: "Il rappelle trois clubs. Deux répondent. Le troisième était le bon ; il rappellera."
    right:
      label: "On attend"
      effects: {caisse: "-", tribunes: "+", relation: {fardelli: -1}}
      answer: "Vous attendez. Il attend moins longtemps que toi ; il a d'autres joueurs."
