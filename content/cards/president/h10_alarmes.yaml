# « Les Deux Téléphones » — les alarmes du postulat `escalier_ferme`, montées en
# tête des candidats par `alarm_overrides` (content/postulats.yaml) : quand une
# jauge franchit 20 ou 80, c'est un visage du livre qui vient la porter. Une
# sortie rattrape la jauge, l'autre a un prix ailleurs. Le dernier candidat de
# chaque liste parle toujours (Owen peut avoir été viré, Gégé être mort).
cards:
  # ------------------------------------------------------------ Le club (vestiaire)
  - id: pr.h10.alarme.vestiaire_bas_owen
    roles: [president]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: owen
    tone: leger
    once: true
    text: "Owen, le verre d'eau intact : « Les joueurs ont lu que le club serait vendu. Ils me demandent si leurs contrats portent le nom de la ville, ou celui de la capitale. Je leur réponds quoi ? »"
    left:
      label: "Le nom de la ville"
      effects: {vestiaire: "++", direction: "-"}
      answer: "Owen le leur dit mot pour mot. Le lendemain, à l'entraînement, ils courent comme si on leur avait rendu quelque chose."
    right:
      label: "Qu'ils lisent leur contrat"
      effects: {vestiaire: "-", direction: "+"}
      answer: "Ils le lisent. À partir de la page trois, il est en anglais. Owen le traduit à voix haute, mal, exprès."

  - id: pr.h10.alarme.vestiaire_bas_nino
    roles: [president]
    arc: vestiaire
    tags: [vestiaire, ultras]
    speaker: nino
    tone: leger
    text: "Nino, devant la porte du vestiaire : « Les joueurs ne viennent plus boire un verre au local après les matchs. Ils rentrent chez eux. En trente ans, je n'avais jamais vu ça. »"
    left:
      label: "J'offre la tournée"
      effects: {vestiaire: "++", caisse: "-"}
      answer: "Ils viennent à six, puis à onze. À minuit, le gardien chante une chanson de la Nord qu'il ne connaissait pas la veille."
    right:
      label: "Ils sont payés pour jouer"
      effects: {vestiaire: "-", direction: "+"}
      answer: "« Pour jouer, oui. » Nino ferme le local une heure plus tôt que d'habitude, et éteint l'enseigne."

  - id: pr.h10.alarme.vestiaire_haut_owen
    roles: [president]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: owen
    tone: leger
    once: true
    text: "Owen a fait mettre une seconde chaise dans ton bureau, la sienne : « Les joueurs veulent que je signe moi-même les prolongations. Ils disent que vous êtes d'accord. Vous l'êtes ? »"
    left:
      label: "Je signerai moi-même"
      effects: {vestiaire: "--", direction: "+"}
      answer: "Il remporte sa chaise. Le soir, au vestiaire, on parle de toi comme du temps qu'il fait : on fait avec."
    right:
      label: "Signez, vous"
      effects: {vestiaire: "+", direction: "-"}
      answer: "Il signe sur ton bureau, avec ton stylo, et te le rend sans le reboucher."

  - id: pr.h10.alarme.vestiaire_haut_maillots
    roles: [president]
    arc: vestiaire
    tags: [vestiaire, objet]
    tone: leger
    text: "Le vestiaire a fait imprimer des maillots d'entraînement à ton nom. Le capitaine t'en apporte un, plié en carré : « Pour la photo. Après la photo, on vous demandera quelque chose. »"
    left:
      label: "Pas de photo"
      effects: {vestiaire: "--", tribunes: "+"}
      answer: "Le maillot reste plié sur ton bureau jusqu'en mai. Personne ne revient demander quoi que ce soit."
    right:
      label: "Une photo, alors"
      effects: {vestiaire: "+", caisse: "-"}
      answer: "La photo est prise devant l'escalier nord. Le lendemain, ils demandent des primes doublées, poliment."

  # ------------------------------------------------------------------ Tribunes
  - id: pr.h10.alarme.tribunes_bas_gege
    roles: [president]
    arc: tribunes
    tags: [tribunes, ultras]
    speaker: gege
    lieu: buvette
    tone: leger
    once: true
    text: "Gégé, sur le pas de la buvette : « La Nord a voté de se taire vingt minutes samedi. Je n'ai pas levé ma carte. Je n'ai pas levé la main contre non plus. »"
    left:
      label: "Je viendrai au local"
      effects: {tribunes: "++", direction: "-"}
      answer: "Tu viens au local le jeudi, sans cravate. On ne t'offre rien ; on te laisse la chaise du fond, celle qui boite."
    right:
      label: "Qu'ils se taisent"
      effects: {tribunes: "-", direction: "+"}
      answer: "Ils se taisent vingt minutes. On entend les joueurs s'appeler, le ballon, l'arbitre. C'est pire que des sifflets."

  - id: pr.h10.alarme.tribunes_bas_nino
    roles: [president]
    arc: tribunes
    tags: [tribunes, ultras]
    speaker: nino
    tone: leger
    text: "Nino pose sur ton bureau une liasse agrafée : « Trois cent douze signatures pour une assemblée extraordinaire. Il en faut trois cents. J'en ai pris douze de plus, pour être sûr. »"
    left:
      label: "Convoquez-la"
      effects: {tribunes: "++", direction: "-"}
      answer: "L'assemblée dure quatre heures. On te reproche tout, une chose après l'autre. À la fin, on t'applaudit, par fatigue."
    right:
      label: "Je la refuse"
      effects: {tribunes: "-", direction: "+"}
      answer: "Nino reprend sa liasse. « Douze de plus, et toujours pas assez. » Il le dit comme une prévision météo."

  - id: pr.h10.alarme.tribunes_haut_gege
    roles: [president]
    arc: tribunes
    tags: [tribunes, ultras]
    speaker: gege
    lieu: buvette
    tone: leger
    once: true
    text: "Gégé, au local : « Ils veulent peindre ton nom sur la bâche de mon père, à côté du sien. Mon père n'aurait pas aimé. Moi, je ne sais plus. »"
    left:
      label: "Pas sur la bâche"
      effects: {tribunes: "--", direction: "+", relation: {gege: 1}}
      answer: "Il hoche la tête. « Mon père t'aurait offert un verre pour ça. » Il le paie lui-même, avec la monnaie du thermos."
    right:
      label: "Laissez-les peindre"
      effects: {tribunes: "+", direction: "-"}
      answer: "Ton nom sèche toute la nuit à côté de celui de son père, en lettres plus petites. C'est Gégé qui a fixé la taille."

  - id: pr.h10.alarme.tribunes_haut_nino
    roles: [president]
    arc: tribunes
    tags: [tribunes, ultras]
    speaker: nino
    tone: leger
    text: "Nino te tend une écharpe neuve, ton nom tissé dedans, bordeaux sur gris : « Trois cents commandées, toutes vendues. À la mairie, on demande si tu te présentes en mars. »"
    left:
      label: "Je ne me présente pas"
      effects: {tribunes: "-", direction: "+"}
      answer: "« Je leur dirai. Ils ne me croiront pas ; ils ne croient que les écharpes. » Il en garde une, pour lui."
    right:
      label: "On verra en mars"
      effects: {tribunes: "+", direction: "-"}
      answer: "La phrase fait le tour du local avant minuit. Le lendemain, elle est à la mairie, plus courte : « En mars. »"

  # ------------------------------------------- Les socios et la Ligue (direction)
  - id: pr.h10.alarme.direction_bas_lea
    roles: [president]
    arc: presse
    tags: [presse, direction]
    speaker: lea
    tone: leger
    text: "Léa, au kiosque du quai : « Dimanche, L'Écho publie la liste des socios qui demandent votre départ. Il y a des noms que vous connaissez. Le premier est celui de Mireille. »"
    left:
      label: "Je parlerai à Mireille"
      effects: {direction: "++", tribunes: "-"}
      answer: "Mireille t'écoute jusqu'au bout, puis raye son nom elle-même, au stylo de sa tante. Dimanche, il en reste quarante."
    right:
      label: "Publiez la liste"
      effects: {direction: "-", tribunes: "+"}
      answer: "La liste paraît sur deux colonnes. Le lundi, trois socios viennent t'expliquer pourquoi ils y sont. Tu les écoutes."

  - id: pr.h10.alarme.direction_haut_ilyas
    roles: [president]
    arc: contrat
    tags: [direction, sponsors]
    speaker: nassir
    tone: leger
    text: "Cheikh Ilyas t'appelle, la voix lente : « Le conseil de la Ligue vous trouve parfait{pg, select, f{e} other{}}. C'est le mot qu'ils ont employé. Je leur ai demandé de ne pas l'écrire. »"
    left:
      label: "Dites-leur l'inverse"
      effects: {direction: "--", tribunes: "+"}
      answer: "« L'inverse de parfait ? » Il rit, un rire de vieil homme qui a payé pour tout. « Ils vont adorer. »"
    right:
      label: "Merci du compliment"
      effects: {direction: "+", tribunes: "-"}
      answer: "« Ce n'était pas un compliment. C'était un inventaire. » Il raccroche avant que tu répondes."

  # ------------------------------------------------------- Trésorerie (caisse)
  - id: pr.h10.alarme.caisse_bas_tazi
    roles: [president]
    arc: escalier
    tags: [caisse, sponsors]
    speaker: tazi
    lieu: stade
    tone: leger
    once: true
    text: "Tazi, au pied de l'escalier nord : « La mairie ne paie plus le sable. Rive Capital propose de le payer, et le reste avec. Je prends leur sable, {toi} ? »"
    left:
      label: "Prenez leur sable"
      effects: {caisse: "++", tribunes: "-"}
      answer: "Le lendemain, les sacs arrivent avec une étiquette Rive Capital. Tazi les retourne pour ne pas la voir."
    right:
      label: "Le club paiera"
      effects: {caisse: "-", tribunes: "+"}
      answer: "Le club paie avec trois semaines de retard. Tazi mure la marche du mois avec le sable de l'an dernier, plus gris."

  - id: pr.h10.alarme.caisse_bas_clemence
    roles: [president]
    arc: sponsors
    tags: [caisse, sponsors]
    speaker: clemence
    tone: leger
    text: "Clémence Tessandier : « Rive Capital rachèterait le parking du stade, comptant. Ils en feraient l'entrée de la troisième tranche. Vous en avez besoin, je crois. »"
    left:
      label: "Vendez le parking"
      effects: {caisse: "+++", tribunes: "--"}
      answer: "Les places du parking sont repeintes en vert dans la semaine. Les socios se garent dans la rue, et le disent."
    right:
      label: "Le parking reste"
      effects: {caisse: "-", tribunes: "+"}
      answer: "Elle le note comme on note une adresse. Le lendemain, la banque rappelle deux fois avant midi."

  - id: pr.h10.alarme.caisse_haut_clemence
    roles: [president]
    arc: sponsors
    tags: [caisse, sponsors]
    speaker: clemence
    tone: leger
    text: "Clémence, en riant à moitié : « Avec une trésorerie pareille, ma grand-mère aurait acheté la rive d'en face. Rive Capital demande si vous comptez la dépenser avant mai. »"
    left:
      label: "Je recrute"
      effects: {caisse: "--", vestiaire: "+", force: 3}
      answer: "Deux joueurs arrivent en janvier, un milieu et un gardien. Clémence leur trouve des appartements avec vue sur le stade."
    right:
      label: "Je la garde"
      effects: {vestiaire: "-", caisse: "+", direction: "+"}
      answer: "« Ils aiment les trésoreries qu'on garde. Ça se rachète plus facilement. » Elle le dit sans méchanceté."
