  # ═══════════════════ la banderole contre Owen (→ le lundi d'Owen)
  - id: pr.h10.lu.lundi_decrochee
    roles: [president]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: owen
    lieu: bureau
    tone: strategique
    once: true
    text: "Owen frappe à ton bureau un lundi, jour de congé des joueurs, un verre d'eau à la main : « Nino a décroché la banderole pour moi. Si vous devez me virer, c'est aujourd'hui. Je préfère. »"
    left:
      label: "Personne ne vous vire"
      effects: {vestiaire: "+", direction: "-", force: 1, set: [h10_owen_garde], outcome: garde}
      answer: "Il boit son verre, le pose, s'en va. Le lendemain, il fait courir les joueurs une heure de plus, et salue Nino du menton, au passage."
    right:
      label: "Videz votre casier"
      effects: {vestiaire: "--", direction: "++", force: -2, set: [h10_owen_vire], outcome: vire, char: {owen: {statut: parti}}}
      answer: "Il vide son casier dans un carton de bananes. Il laisse le verre sur le banc ; personne ne le range de la saison."

  - id: pr.h10.lu.lundi_seche
    roles: [president]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: owen
    lieu: bureau
    tone: strategique
    once: true
    text: "Owen frappe un lundi, jour de congé des joueurs, un verre d'eau à la main : « La banderole a séché jusqu'au mardi ; je suis passé dessous. Si vous devez me virer, c'est aujourd'hui. »"
    left:
      label: "Personne ne vous vire"
      effects: {vestiaire: "+", direction: "-", force: 1, set: [h10_owen_garde], outcome: garde}
      answer: "Il boit son verre, le pose, s'en va. Le lendemain, il passe sous la Nord sans baisser la tête, et fait courir les joueurs une heure de plus."
    right:
      label: "Videz votre casier"
      effects: {vestiaire: "--", direction: "++", force: -2, set: [h10_owen_vire], outcome: vire, char: {owen: {statut: parti}}}
      answer: "Il vide son casier dans un carton de bananes. Il laisse le verre sur le banc ; personne ne le range de la saison."

  - id: pr.h10.lu.lundi_cv_decrochee
    roles: [president]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: owen
    lieu: bureau
    tone: strategique
    once: true
    text: "Owen frappe un lundi, jour de congé des joueurs, un verre d'eau à la main : « Nino a décroché la banderole ; le CV dépasse de votre tiroir, {toi}. Si vous devez me virer, c'est aujourd'hui. »"
    left:
      label: "Personne ne vous vire"
      effects: {vestiaire: "+", direction: "-", force: 1, set: [h10_owen_garde], outcome: garde}
      answer: "Il pousse le CV au fond du tiroir, du bout du doigt, et le referme. « Nino, lui, l'a décrochée. » Puis il boit son verre et s'en va."
    right:
