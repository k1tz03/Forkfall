  # ═══════════════════ la feuille aux trente-trois cases (→ la dernière marche)
  - id: pr.h10.c6_marche_decrochee
    roles: [president]
    arc: escalier
    tags: [tribunes, sombre]
    speaker: tazi
    lieu: stade
    tone: strategique
    once: true
    text: "Escalier nord, un soir de mai, la dernière marche. Tazi sort de sous sa casquette la feuille décrochée en avril : « Je l'ai gardée. On devait compter, ce soir. Je la mure, {toi} ? »"
    left:
      label: "Laissez-la ouverte"
      effects: {tribunes: "+", direction: "-", relation: {tazi: 1}, set: [h10_marche_ouverte]}
      answer: "Il retourne le seau et s'assoit dessus, la feuille sur les genoux. « Cette nuit-là, je dors ici. On comptera ensemble. »"
    right:
      label: "Murez-la"
      effects: {tribunes: "-", direction: "+", set: [h10_marche_muree]}
      answer: "Il glisse la feuille dans sa caisse, sous le niveau. « Je viendrai tard. Il n'y aura personne pour compter. »"

