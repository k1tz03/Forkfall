    tone: strategique
    once: true
    text: "Escalier nord, un soir de mai, la dernière marche. Au mur, la feuille d'avril : trente-trois cases, des noms au feutre noir, le tien dans la dernière. Tazi, sa truelle : « Je la mure, {toi} ? »"
    left:
