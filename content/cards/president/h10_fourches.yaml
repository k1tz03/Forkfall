    lieu: stade
    tone: strategique
    once: true
    text: "Le match d'après. La Nord se lève : trois mille visages de Gégé en carton, imprimés dans la nuit. Nino te salue du menton, comme dans l'escalier. Les haut-parleurs sont muets ; la Nord dit son nom."
