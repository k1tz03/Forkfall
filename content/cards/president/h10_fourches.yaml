  # ═══════════════════ Gégé à la mi-temps du derby (→ le projet de fusion)
  - id: pr.h10.vb.fusion_descendu
    roles: [president]
    arc: tribunes
    tags: [tribunes, direction]
    speaker: nino
    lieu: buvette
    tone: strategique
    once: true
    text: "Nino, après le derby, le projet de fusion imprimé à la main : « Mon oncle t'a parlé à l'oreille, à la mi-temps. Je n'ai pas entendu. Les socios voteraient, si tu le proposes. Moi, je compterais. »"
    left:
      label: "On l'étudie"
      effects: {direction: "+", tribunes: "-", set: [h10_fusion_etudiee], outcome: etudiee}
      answer: "Il range le projet dans sa veste, côté clapet. « Il t'a dit non. » Le soir, le président de {rival} t'envoie une deuxième bouteille."
    right:
      label: "Jamais"
      effects: {tribunes: "+", direction: "-", set: [h10_fusion_refusee], outcome: refusee}
      answer: "« Jamais, c'est long. » Il déchire le projet en deux, puis en quatre. « C'est ce qu'il t'a dit à l'oreille, non ? »"

  - id: pr.h10.vb.fusion_loge
    roles: [president]
    arc: tribunes
    tags: [tribunes, direction]
    speaker: nino
    lieu: buvette
    tone: strategique
    once: true
    text: "Nino, après le derby, le projet de fusion imprimé à la main : « Mon oncle t'a fait signe ; tu es resté en loge. Les socios voteraient, si tu le proposes. Moi, je compterais. »"
    left:
      label: "On l'étudie"
      effects: {direction: "+", tribunes: "-", set: [h10_fusion_etudiee], outcome: etudiee}
      answer: "Il range le projet dans sa veste, côté clapet. « Mon oncle n'a rien dit. » Le soir, le président de {rival} t'envoie une deuxième bouteille."
    right:
      label: "Jamais"
      effects: {tribunes: "+", direction: "-", set: [h10_fusion_refusee], outcome: refusee}
      answer: "« Jamais, c'est long. » Il déchire le projet en deux, puis en quatre. « Mon oncle aurait dit pareil, si tu étais descendu. »"

