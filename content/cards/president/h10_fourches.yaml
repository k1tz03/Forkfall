      effects: {direction: "-", tribunes: "++", set: [h10_debout_masques], react: pr.h10.re.tazi_minute}
      answer: "Tu te lèves. Au premier rang, Nino te rend le salut sans lâcher son masque. Derrière la vitre, trois mille cartons qui ne clignent pas."
