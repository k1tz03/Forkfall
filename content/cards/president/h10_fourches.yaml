# Histoire 10 · Les Deux Téléphones — les fourches. Sept cartes dont les deux sorties ne se
# distinguaient que par des jauges cachées (ou par une relation) posent maintenant un drapeau, et
# ce drapeau revient quelques cartes plus tard (charte § 4 : planter, puis payer). Les payoffs sont
# des variantes d'étape rangées devant la carte d'origine dans leur arc (mêmes effets, mêmes issues
# que la carte qu'elles remplacent : seuls le texte et les réponses changent). Les cartes d'origine
# gardent leur texte : elles ne font que poser le drapeau.
#
#   h10_cafe_monte / h10_cafe_nino            ← le café de novembre (pr.h10.c_novembre)
#                                               → la lettre de Gégé (pr.h10.c2_lettre*)
#   h10_nino_salue / h10_nino_passe           ← Nino dans l'escalier du local (pr.h10.re.nino_escalier)
#                                               → la nuit de Gégé (pr.h10.c3_nuit*, la carte suivante),
#                                                 puis les trois mille visages (pr.h10.c4_masques*)
#   h10_motion_soir / h10_motion_conseil      ← la motion du virage (pr.h10.so.motion*)
#                                               → le guichet de la Nord (pr.h10.so.guichet*)
#   h10_banderole_decrochee / h10_banderole_seche ← la banderole contre Owen (pr.h10.lu.banderole)
#                                               → le lundi d'Owen (pr.h10.lu.lundi*)
#   h10_derby_descendu / h10_derby_loge       ← Gégé à la mi-temps du derby (pr.h10.vb.derby)
#                                               → le projet de fusion (pr.h10.vb.fusion*)
#   h10_oncle_occupe / h10_oncle_affaires     ← Gégé et les dettes du petit (pr.h10.ni.oncle)
#                                               → le tambour de Nino (pr.h10.ni.tambour)
#   h10_feuille_decrochee / h10_feuille_laissee ← la feuille aux trente-trois cases (pr.h10.a_avril)
#                                               → la dernière marche, deux ans après (pr.h10.c6_marche*)
cards:
  # ═══════════════════ le café de novembre (→ la lettre de Gégé)
  - id: pr.h10.c2_lettre_promesse_cafe
    roles: [president]
    arc: tribunes
    tags: [ultras, famille]
    speaker: gege
    lieu: stade
    tone: strategique
    once: true
    text: "Au-dessus du local, Gégé dans son lit, la bâche de 1971 sur les pieds : « Tu m'as monté le café en novembre, et tu m'avais promis, {prenom}. Je sais pour les deux téléphones. Monte quand même. »"
    left:
      label: "Je monterai"
      effects: {direction: "-", tribunes: "+", relation: {gege: 1}, set: [h10_lettre_gardee], react: pr.h10.re.nino_escalier}
      answer: "Il pousse une enveloppe vers toi. « Tu la liras s'ils te demandent de perdre. Pas avant. » Elle sent encore le café, sous la cire."
    right:
      label: "Je ne sais plus"
      effects: {relation: {gege: -1}, set: [h10_lettre_nino]}
      answer: "Il glisse l'enveloppe sous l'oreiller. « Alors je la donne au petit. Il saura, lui. » Sur la table de nuit, la tasse est vide."

  - id: pr.h10.c2_lettre_promesse_nino
    roles: [president]
    arc: tribunes
    tags: [ultras, famille]
    speaker: gege
    lieu: stade
    tone: strategique
    once: true
    text: "Au-dessus du local, Gégé dans son lit, la bâche de 1971 sur les pieds : « C'est le petit qui m'a monté le café. Toi, tu m'avais promis, {prenom}. Je sais pour les deux téléphones. Monte quand même. »"
    left:
      label: "Je monterai"
      effects: {direction: "-", tribunes: "+", relation: {gege: 1}, set: [h10_lettre_gardee], react: pr.h10.re.nino_escalier}
      answer: "Il pousse une enveloppe vers toi. « Tu la liras s'ils te demandent de perdre. Pas avant. » Elle est cachetée à la cire de bougie."
    right:
      label: "Je ne sais plus"
      effects: {relation: {gege: -1}, set: [h10_lettre_nino]}
      answer: "Il glisse l'enveloppe sous l'oreiller. « Alors je la donne au petit. Lui, il est monté. » Il ferme les yeux."

