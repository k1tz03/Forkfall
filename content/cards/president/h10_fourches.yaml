  # ═══════════════════ la motion du virage (→ le guichet de la Nord)
  - id: pr.h10.so.guichet_soir
    roles: [president]
    arc: tribunes
    tags: [tribunes, ultras]
    speaker: gege
    lieu: stade
    tone: leger
    once: true
    text: "Guichet de la Nord, le premier samedi. Gégé paie son abonnement au prix de 1990, en écus, et recompte sa monnaie deux fois. « On a voté debout. Le petit dit que c'est une victoire. »"
    left:
      label: "C'en est une"
      effects: {direction: "-", tribunes: "+", relation: {gege: 1}}
      answer: "« Alors on en a eu une. » Il glisse le ticket dans sa casquette, contre le front, comme son père."
    right:
      label: "C'est un début"
      effects: {tribunes: "-", direction: "+"}
      answer: "Il regarde le guichetier, pas toi. « À mon âge, les débuts, on les compte aussi. »"

  - id: pr.h10.so.guichet_conseil
    roles: [president]
    arc: tribunes
    tags: [tribunes, ultras]
    speaker: gege
    lieu: stade
    tone: leger
    once: true
    text: "Guichet de la Nord, le premier samedi. Gégé paie son abonnement au prix de 1990, en écus, et recompte sa monnaie deux fois. « Le conseil a décidé. C'est nous, le conseil, dit le petit. Une victoire. »"
    left:
      label: "C'en est une"
      effects: {direction: "-", tribunes: "+", relation: {gege: 1}}
      answer: "« Alors on en a eu une. » Il glisse le ticket dans sa casquette, contre le front, comme son père."
    right:
      label: "C'est un début"
      effects: {tribunes: "-", direction: "+"}
      answer: "Il regarde le guichetier, pas toi. « À mon âge, les débuts, on les compte aussi. »"

  - id: pr.h10.so.guichet_recompte_soir
    roles: [president]
    arc: tribunes
    tags: [tribunes, ultras]
    speaker: gege
    lieu: stade
    tone: leger
    once: true
    text: "Guichet de la Nord, le premier samedi. Gégé paie son abonnement au prix de 1990 et recompte sa monnaie deux fois. « Le vote. T'as recompté devant tout le monde. Le petit t'en veut. »"
    left:
      label: "Il comptait mal"
      effects: {tribunes: "-", relation: {gege: 1}, direction: "+"}
      answer: "« Il compte vite. C'est pas pareil. » Il glisse le ticket dans sa casquette, contre le front, comme son père."
    right:
      label: "Je lui ferai des excuses"
      effects: {direction: "-", relation: {nino: 1}, tribunes: "+"}
      answer: "« T'excuse pas. T'as bien compté. » Il range sa monnaie pièce par pièce, dans un vieux porte-monnaie à fermoir."

