# « Les Deux Téléphones » — les Nouvelles datées de la présidente, 2037-2040
# (spec variété §1.5) : le monde qui ferme l'escalier, une respiration par
# créneau réservé (3, 6, 9, 13). Un seul bouton (deux sorties identiques),
# effet d'un cran au plus, `once`. Une Nouvelle de l'année A est servable la
# saison qui commence en A - 1 et celle qui commence en A (director.dart,
# pickNouvelle) : la saison du livre est donc fixée par le `when`, sinon la
# saison 1 mangeait les Nouvelles de 2039 et la dernière saison n'en avait
# plus qu'une. Trois pour la saison 0 (à quatre, la saison n'avait plus la
# place de finir ses deux intrigues, et leurs dernières étapes tombaient
# échues en S1), six pour la 1, cinq pour la 2. Les
# Nouvelles communes sont écrites pour l'entraîneur et le joueur : celles-ci
# sont au rôle de président, et gardées par le drapeau d'histoire.
cards:
  # ---------------------------------------------- 2037-2038 (saison 0)
  - id: pr.h10.nv.2037_voix
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, presse]
    tone: leger
    once: true
    year: 2037
    when: "flag('histoire_h10')"
    text: "La chaîne de la deuxième division a acheté les droits de la voix de Gigi Vecchio à sa sœur, à Castérac. Prix non communiqué. Elle a posé une condition : qu'il ne dise jamais « penalty »."
    left:  {label: "Je lis la dépêche", effects: {tribunes: "-"}, answer: "Au premier penalty de la saison, la voix dit « tir de réparation ». Personne ne savait qu'il avait horreur de l'autre mot."}
    right: {label: "Je lis la dépêche", effects: {tribunes: "-"}, answer: "Au premier penalty de la saison, la voix dit « tir de réparation ». Personne ne savait qu'il avait horreur de l'autre mot."}

  - id: pr.h10.nv.2037_carte
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, direction]
    tone: leger
    once: true
    year: 2037
    when: "flag('histoire_h10')"
    text: "La Ligue publie la carte des vingt futures franchises : vingt villes, vingt points rouges. Aucun sur la Rive. Le plus proche est à cent quarante kilomètres, au bord d'une autoroute."
    left:  {label: "Je regarde la carte", effects: {direction: "-"}, answer: "Au local, quelqu'un dessine un vingt et unième point rouge sur la Rive, au feutre indélébile. À Noël, il y est encore."}
    right: {label: "Je regarde la carte", effects: {direction: "-"}, answer: "Au local, quelqu'un dessine un vingt et unième point rouge sur la Rive, au feutre indélébile. À Noël, il y est encore."}

  - id: pr.h10.nv.2038_projet
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, direction]
    tone: leger
    once: true
    year: 2038
    when: "flag('histoire_h10') && season == 0"
    text: "Le projet de loi des franchises est déposé. En séance, son rapporteur cite un article de Lian Mbako, publié en 2032 : « Le football doit cesser de tomber. »"
    left:  {label: "Je lis le compte rendu", effects: {direction: "-"}, answer: "« Cesser de tomber » devient un slogan, imprimé sur des tee-shirts, puis sur des banderoles qui disent le contraire."}
    right: {label: "Je lis le compte rendu", effects: {direction: "-"}, answer: "« Cesser de tomber » devient un slogan, imprimé sur des tee-shirts, puis sur des banderoles qui disent le contraire."}


  # ---------------------------------------------- 2038-2039 (saison 1)
  - id: pr.h10.nv.2038_echo
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: lea
    tone: leger
    once: true
    year: 2038
    when: "flag('histoire_h10') && season == 1"
    text: "Léa : « L'Écho ne paraîtra plus que le dimanche. Le dernier quotidien papier du pays devient un hebdomadaire. Ils m'ont gardée pour la lettre des lecteurs. »"
    left:  {label: "J'achète le premier", effects: {tribunes: "+"}, answer: "Le premier dimanche, il est épuisé à neuf heures. Le deuxième, à onze. Léa garde un exemplaire de chaque, dans une valise."}
    right: {label: "J'achète le premier", effects: {tribunes: "+"}, answer: "Le premier dimanche, il est épuisé à neuf heures. Le deuxième, à onze. Léa garde un exemplaire de chaque, dans une valise."}

  - id: pr.h10.nv.2038_machine
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    tone: leger
    once: true
    year: 2038
    when: "flag('histoire_h10') && season == 1"
    text: "L'arbitre-machine des hors-jeu devient obligatoire en deuxième division. Au premier match, elle signale un hors-jeu du gardien, resté devant sa ligne à boire de l'eau."
    left:  {label: "Je regarde l'action", effects: {direction: "+"}, answer: "La Ligue corrige le logiciel en une nuit. Le gardien, lui, ne boit plus pendant les matchs ; on ne sait jamais."}
    right: {label: "Je regarde l'action", effects: {direction: "+"}, answer: "La Ligue corrige le logiciel en une nuit. Le gardien, lui, ne boit plus pendant les matchs ; on ne sait jamais."}

  - id: pr.h10.nv.2038_assis
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    tone: leger
    once: true
    year: 2038
    when: "flag('histoire_h10') && season == 1"
    text: "Les tribunes debout seront interdites en première division dès 2040. Les clubs d'en bas pourront garder les leurs. Le texte dit : « par tolérance »."
    left:  {label: "Je relis le mot", effects: {tribunes: "+"}, answer: "« Par tolérance » se lit le dimanche suivant sur une bâche de la Nord, avec une faute d'orthographe faite exprès."}
    right: {label: "Je relis le mot", effects: {tribunes: "+"}, answer: "« Par tolérance » se lit le dimanche suivant sur une bâche de la Nord, avec une faute d'orthographe faite exprès."}

  - id: pr.h10.nv.2038_cent_ans
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, famille]
    speaker: josiane
    tone: leger
    once: true
    year: 2038
    when: "flag('histoire_h10') && season == 1"
    text: "Madame Josiane a cent ans. Elle a demandé que la maison de retraite, derrière Saint-Aubin, passe le match de samedi à la radio, pas à la télévision. On lui a dit oui."
    left:  {label: "J'envoie des fleurs", effects: {tribunes: "+"}, answer: "Les fleurs arrivent avec un ruban bordeaux et gris. Elle fait enlever le ruban et le garde, plié dans son missel."}
    right: {label: "J'envoie des fleurs", effects: {tribunes: "+"}, answer: "Les fleurs arrivent avec un ruban bordeaux et gris. Elle fait enlever le ruban et le garde, plié dans son missel."}

  - id: pr.h10.nv.2038_greve
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    tone: leger
    once: true
    year: 2038
    when: "flag('histoire_h10') && season == 1"
    text: "Les joueurs de deuxième division font grève un samedi : dix matchs, zéro but. Les tribunes, elles, sont pleines, et chantent quatre-vingt-dix minutes pour personne."
    left:  {label: "J'écoute le stade", effects: {vestiaire: "-"}, answer: "Le lundi, les joueurs reprennent. Personne ne leur a rien promis ; ils voulaient seulement entendre ça une fois."}
    right: {label: "J'écoute le stade", effects: {vestiaire: "-"}, answer: "Le lundi, les joueurs reprennent. Personne ne leur a rien promis ; ils voulaient seulement entendre ça une fois."}

  - id: pr.h10.nv.2039_visages
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    tone: leger
    once: true
    year: 2039
    when: "flag('histoire_h10') && season == 1"
    text: "Les stades de première division passent à la reconnaissance faciale : plus de billets, plus de cartes. À la capitale, un abonné de trente ans a été refoulé ; il s'était laissé pousser la barbe."
    left:  {label: "Je lis l'article", effects: {tribunes: "+"}, answer: "Au local, Nino fait voter les socios avec des cartes en carton, levées à bout de bras. Personne ne propose de changer."}
    right: {label: "Je lis l'article", effects: {tribunes: "+"}, answer: "Au local, Nino fait voter les socios avec des cartes en carton, levées à bout de bras. Personne ne propose de changer."}

  # ---------------------------------------------- 2039-2040 (saison 2)
  - id: pr.h10.nv.2039_journal_officiel
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, direction]
    tone: leger
    once: true
    year: 2039
    when: "flag('histoire_h10') && season == 2"
    text: "La loi des franchises paraît au journal officiel : deux cent douze articles. Le premier tient en une ligne : « La première division est close au 30 juin 2040. »"
    left:  {label: "Je lis l'article un", effects: {direction: "-"}, answer: "Au local, on remarque le nombre d'articles. Deux cent douze. Personne ne dit rien ; tout le monde te regarde."}
    right: {label: "Je lis l'article un", effects: {direction: "-"}, answer: "Au local, on remarque le nombre d'articles. Deux cent douze. Personne ne dit rien ; tout le monde te regarde."}

  - id: pr.h10.nv.2039_cote
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    tone: leger
    once: true
    year: 2039
    when: "flag('histoire_h10') && season == 2"
    text: "Au tabac du Quai, l'ardoise des paris ouvre une cote sur « la dernière montée de l'histoire ». Le Racing y est à douze contre un. Un habitué a joué sa voiture."
    left:  {label: "Je regarde la cote", effects: {tribunes: "+"}, answer: "La cote tombe à neuf contre un en une semaine. Personne ne sait qui joue ; tout le monde sait que ce n'est pas la Nord."}
    right: {label: "Je regarde la cote", effects: {tribunes: "+"}, answer: "La cote tombe à neuf contre un en une semaine. Personne ne sait qui joue ; tout le monde sait que ce n'est pas la Nord."}

  - id: pr.h10.nv.2039_capitale
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    tone: leger
    once: true
    year: 2039
    when: "flag('histoire_h10') && season == 2"
    text: "La franchise de la capitale présente son nom, son logo, son stade de quarante mille places et ses couleurs. Il ne lui manque qu'un club. Elle dit en chercher un « avec une histoire »."
    left:  {label: "Je regarde le logo", effects: {direction: "-"}, answer: "Le logo est un escalier stylisé, trois marches, en or. Au local, on le découpe dans le journal et on le punaise à l'envers."}
    right: {label: "Je regarde le logo", effects: {direction: "-"}, answer: "Le logo est un escalier stylisé, trois marches, en or. Au local, on le découpe dans le journal et on le punaise à l'envers."}

  - id: pr.h10.nv.2039_huit
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, caisse]
    tone: leger
    once: true
    year: 2039
    when: "flag('histoire_h10') && season == 2"
    text: "Huit clubs de première division annoncent leur rachat par des franchises, la même semaine. Ils gardent leurs noms « à titre patrimonial ». Leurs stades, non."
    left:  {label: "Je lis la liste", effects: {caisse: "-"}, answer: "Un de ces stades est rasé avant l'été. Ses sièges sont vendus un par un, numérotés, aux anciens abonnés."}
    right: {label: "Je lis la liste", effects: {caisse: "-"}, answer: "Un de ces stades est rasé avant l'été. Ses sièges sont vendus un par un, numérotés, aux anciens abonnés."}

  - id: pr.h10.nv.2040_billets
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    tone: leger
    once: true
    year: 2040
    when: "flag('histoire_h10') && season == 2"
    text: "La Ligue imprime les derniers billets « debout » de son histoire : une série 2040, numérotée, sur papier gris. Les collectionneurs les achètent par carnets ; les virages, à l'unité."
    left:  {label: "J'en achète un", effects: {tribunes: "+"}, answer: "Nino en achète deux cents avec la caisse des tambours, « pour les gamins ». Il en garde un dans sa veste, à côté du clapet."}
    right: {label: "J'en achète un", effects: {tribunes: "+"}, answer: "Nino en achète deux cents avec la caisse des tambours, « pour les gamins ». Il en garde un dans sa veste, à côté du clapet."}
