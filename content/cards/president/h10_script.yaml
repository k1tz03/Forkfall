    right:
      label: "Je ne sais plus"
      effects: {relation: {gege: -1}, set: [h10_lettre_nino]}
      answer: "Il glisse l'enveloppe sous l'oreiller. « Alors je la donne au petit. Il saura, lui, quoi en faire. » Il ferme les yeux."

