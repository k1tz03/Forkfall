    once: true
    text: "Tu marches dans la Nord vide. Trois mille visages de Gégé posés sur les sièges, face au terrain. Tu en retournes un : au dos, en petits caractères, l'adresse d'un imprimeur, et « Rive Capital »."
    left:
      label: "Je les retourne tous"
      effects: {}
