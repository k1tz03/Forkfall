      label: "Je ne compte plus"
      effects: {direction: "-", tribunes: "+"}
      answer: "« Alors je compterai pour deux. » Elle raccroche. À neuf heures, Tazi mure la vingt-cinquième, en sifflotant."
    right:
      label: "Comptons"
      effects: {tribunes: "-", direction: "+", set: [h10_obei_s2]}
      answer: "« Vingt-cinq. » Tu l'entends sourire. De l'autre côté de la Rive, Tazi lève sa truelle comme on salue."

  # C1b · Le café de novembre — le local du kop (créneau 7). Gégé ne
  # descend plus ; la bâche de 1971 est montée avec lui (la lettre, au 11),
  # et la radio compte les marches (la vingt-septième).
