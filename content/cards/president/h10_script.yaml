    lieu: buvette
    tone: strategique
    once: true
    text: "Buvette, après la fermeture. Nino seul au zinc, la veste sur l'épaule, son clapet posé à côté du tien : « Deux téléphones, une seule défaite. Ils nous paient pour la même chose, {toi}. »"
    left:
      label: "On les trahit ensemble"
      effects: {direction: "-", tribunes: "+", relation: {nino: 2}, set: [h10_nino_retourne]}
