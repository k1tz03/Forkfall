    right:
      label: "Je les retourne tous"
      effects: {}
      answer: "Au réveil, tu as de l'encre sur les doigts, et dans ta veste une facture d'imprimeur pliée en quatre, datée de janvier."

  # C5 · Madame Mai — la dernière consigne (créneau 16, mai).
  - id: pr.h10.c5_mai_d1
    roles: [president]
    arc: clapet
    tags: [direction, portable]
    lieu: domicile
    tone: strategique
    once: true
    text: "« Ici Madame Mai. Montés trop tôt, {prenom} : c'est fâcheux. Le dernier match ne compte plus ; l'assemblée, si. Le lendemain, elle vend la place. Nino s'en occupe. »"
    left:
      label: "Vous aurez la place"
      effects: {tribunes: "-", direction: "+", caisse: "+", set: [h10_defaite_promise, h10_obei_s2], react: [{card: pr.h10.re.lettre, if: "flag('h10_lettre_gardee')"}]}
      answer: "« Je n'en doutais pas. Les masques étaient réussis ; nous les avions commandés en janvier. » La tonalité, longue."
    right:
      label: "Je raccroche"
      effects: {direction: "-", tribunes: "+", react: [{card: pr.h10.re.lettre, if: "flag('h10_lettre_gardee')"}, {card: pr.h10.re.nino_quatre}]}
      answer: "Tu raccroches au milieu d'un mot. Le clapet sonne encore trois fois cette nuit-là. Tu comptes les sonneries, pas les heures."

