# « Les Deux Téléphones » — les cartes du script (arcs/president/h10_script.yaml,
# pr.h10.script) et sa chaîne (l'enveloppe crème). Toutes hors du sac, toutes
# `once`.
#
# Les supports : le clapet (`portable`, l'écran vert « Numéro masqué ») porte la
# voix du mois, sans locuteur ; les soirs portent `sombre` et un `lieu:` ; les
# intermèdes (`intermede`) n'ont ni locuteur ni effet, un seul bouton.
#
# Les graines et ce qui les paie, d'une saison à l'autre :
#   · la promesse de la buvette (prologue) → la lettre de Gégé (S2, 11) ;
#   · la première marche (S0, 1) → la dernière (S2, 17), et le ciment frais ;
#   · « à l'hôtel, cette fois » (Madame Mai, S0, 17) → la photo de l'hôtel (S1) ;
#   · « par la voie des airs » (l'appel d'après la photo) → l'hélicoptère (S1, 4-5) ;
#   · le manteau sur une autre photo (S1, 1-2) → la sonnerie dans la veste de
#     Nino (S1, 10) ;
#   · « Bonsoir à tous les deux » (l'intermède de S0) → la même sonnerie ;
#   · l'enveloppe crème (S1, 5) → la truelle (S2) → la brigade sous l'escalier ;
#   · « On a déjà la photo » (l'imprimeur, S2, 12) → l'intermède des masques →
#     « nous les avions commandés en janvier » (Madame Mai, S2, 16).
cards:
  # ================================================================ saison 0
  # A1 · La première marche — escalier nord (créneau 1, septembre).
  - id: pr.h10.a1_marche_ville
    roles: [president]
    arc: escalier
    tags: [tribunes, objet]
    speaker: tazi
    lieu: stade
    tone: strategique
    once: true
    text: "Escalier nord. Des écoliers regardent un maçon murer la première marche. Il lisse le joint du pouce. « Par sécurité, {toi}. Une par mois, jusqu'à la loi. Je mure, je ne décide pas. »"
    left:
      label: "Arrêtez ce chantier"
      effects: {tribunes: "+", direction: "-", set: [h10_escalier, h10_chantier_conteste], react: pr.h10.re.tazi_ordre}
      answer: "Il pose la truelle en travers du seau. Les écoliers applaudissent. Dès que tu as tourné le coin, il la reprend."
    right:
      label: "Combien de marches ?"
      effects: {tribunes: "-", direction: "+", set: [h10_escalier]}
      answer: "« Trente-trois. » Un des enfants les compte en montant, un, deux, trois, jusqu'à ce que sa mère le rappelle."

  - id: pr.h10.a1_marche_consortium
    roles: [president]
    arc: escalier
    tags: [tribunes, sponsors]
    speaker: tazi
    lieu: stade
    tone: strategique
    once: true
    text: "Escalier nord. Un maçon mure la première marche ; sur sa brouette, le sigle de Rive Capital, gratté à moitié. « Par sécurité, {toi}. Une par mois, jusqu'à la loi. Je mure, je ne décide pas. »"
    left:
      label: "Arrêtez ce chantier"
      effects: {tribunes: "+", direction: "-", set: [h10_escalier, h10_chantier_conteste], react: pr.h10.re.tazi_ordre}
      answer: "Il pose la truelle en travers du seau et regarde la brouette, pas toi. « C'est pas moi qui paie le ciment. »"
    right:
      label: "Combien de marches ?"
      effects: {tribunes: "-", direction: "+", set: [h10_escalier]}
      answer: "« Trente-trois. La dernière, ce sera en mai 2040. » Il gratte le sigle de l'ongle, sans conviction."

  - id: pr.h10.a1_marche
    roles: [president]
    arc: escalier
    tags: [tribunes, objet]
    speaker: tazi
    lieu: stade
    tone: strategique
    once: true
    text: "Escalier nord de la tribune. Un maçon en bleu de travail mure la première marche, sans se presser : « Par sécurité, {toi}. Une par mois, jusqu'à la loi. Je mure, je ne décide pas. »"
    left:
      label: "Arrêtez ce chantier"
      effects: {tribunes: "+", direction: "-", set: [h10_escalier, h10_chantier_conteste], react: pr.h10.re.tazi_ordre}
      answer: "Il pose la truelle en travers du seau. « L'ordre vient de la Ligue. Je peux appeler, si vous voulez. Ils répondent pas. »"
    right:
      label: "Combien de marches ?"
      effects: {tribunes: "-", direction: "+", set: [h10_escalier]}
      answer: "« Trente-trois. » Il compte sur ses doigts, les rouvre trois fois. « La dernière, ce sera en mai 2040. Je serai encore là. »"

  # A2 · La voix de Gigi — loge, jour de match (créneau 5, octobre).
  - id: pr.h10.a2_voix
    roles: [president]
    arc: tribunes
    tags: [tribunes, presse]
    speaker: gege
    lieu: stade
    tone: strategique
    once: true
    text: "Loge, jour de match. Au micro, la voix de Gigi Vecchio, mort en 2031, salue « {prenom}, en loge ». Gégé : « Il t'a jamais vu{pg, select, f{e} other{}}. Et il disait pas “magnifique”. »"
    left:
      label: "Coupez cette voix"
      effects: {tribunes: "+", caisse: "-", relation: {gege: 1}, set: [h10_voix_coupee], react: pr.h10.re.nino_chant}
      answer: "À la reprise, les haut-parleurs se taisent. La chaîne retient une pénalité sur les droits. La Nord commente elle-même, plus fort."
    right:
      label: "Laissez-le parler"
      # Le clapet change de nom pour la première fois : en octobre, la femme
      # du mois appelle pendant la mi-temps, Gégé assis à côté (au créneau 6,
      # on est en novembre : rien).
      effects: {caisse: "+", tribunes: "-", set: [h10_voix_gardee], react: [{card: pr.h10.re.gege_sonnerie, if: "slot <= 5"}]}
      answer: "Au premier but, la voix dit « magnifique ». Gégé remet sa casquette et ne l'enlève plus de tout le match."

  # Intermède · Les deux sonneries (créneau 8, décembre). Le fait déformé : il
  # y a un second clapet au bout du couloir du local (S1, 10).
  - id: pr.h10.a_intermede
    roles: [president]
    arc: clapet
    tags: [intermede, portable]
    tone: strategique
    once: true
    text: "Tu dors. Le clapet sonne dans ta veste, puis un second, plus loin, au bout d'un couloir qui sent la bière froide. Tu décroches le tien. « Ici Madame Décembre. Bonsoir à tous les deux. »"
    left:
      label: "Je raccroche"
      effects: {}
      answer: "Au réveil, le clapet est dans ta veste, éteint. Tu ne te rappelles pas l'avoir rangé."
    right:
      label: "Je raccroche"
      effects: {}
      answer: "Au réveil, le clapet est dans ta veste, éteint. Tu ne te rappelles pas l'avoir rangé."

  # A3 · La première commande — le clapet, la nuit (créneaux 10-11, janvier).
  - id: pr.h10.a3_commande_titulaire
    roles: [president]
    arc: clapet
    tags: [mercato, portable]
    lieu: domicile
    tone: strategique
    once: true
    text: "Une heure du matin. « Ici Madame Janvier. Bonsoir, {prenom}. Le petit Brac a marqué trois fois ; la capitale l'attend en février. Ce sera bien pour tout le monde. »"
    left:
      label: "Il reste"
      effects: {vestiaire: "+", caisse: "-", force: 3, relation: {brac: 1}, set: [h10_brac_garde]}
      answer: "Tu rappelles le numéro. Une voix d'homme dit qu'il n'est pas attribué. Samedi, Brac marque une quatrième fois et cherche ta loge."
    right:
      label: "Il partira"
      effects: {caisse: "++", vestiaire: "-", force: -2, set: [h10_brac_vendu, h10_obei_s0], char: {brac: {statut: vendu}}, react: pr.h10.re.owen_crampons}
      answer: "La capitale appelle à neuf heures et commence par « comme convenu ». L'offre tient sur une ligne. Elle est bonne."

  - id: pr.h10.a3_commande_froid
    roles: [president]
    arc: clapet
    tags: [mercato, portable]
    lieu: domicile
    tone: strategique
    once: true
    text: "Une heure du matin. « Ici Madame Janvier. Vous n'aviez pas d'objectifs, {prenom} ; en voici un. Le petit Brac ira à la capitale cet hiver. Ce sera bien pour lui. »"
    left:
      label: "Il reste"
      effects: {vestiaire: "+", caisse: "-", force: 3, relation: {brac: 1}, set: [h10_brac_garde]}
      answer: "Tu rappelles le numéro. Une voix d'homme dit qu'il n'est pas attribué. Le lendemain, Brac s'entraîne avec les pros, et ne sait rien."
    right:
      label: "Il partira"
      effects: {caisse: "++", vestiaire: "-", force: -2, set: [h10_brac_vendu, h10_obei_s0], char: {brac: {statut: vendu}}, react: pr.h10.re.owen_crampons}
      answer: "La capitale appelle à neuf heures et commence par « comme convenu ». L'offre tient sur une ligne. Elle est bonne."

  - id: pr.h10.a3_commande
    roles: [president]
    arc: clapet
    tags: [mercato, portable]
    lieu: domicile
    tone: strategique
    once: true
    text: "Une heure du matin, le clapet. « Ici Madame Janvier. Bonsoir, {prenom}. Le petit Brac ira à la capitale cet hiver. Ce sera bien pour lui, et pour vous. »"
    left:
      label: "Il reste"
      effects: {vestiaire: "+", caisse: "-", force: 3, relation: {brac: 1}, set: [h10_brac_garde]}
      answer: "Tu rappelles le numéro. Une voix d'homme dit qu'il n'est pas attribué. Le lendemain, Brac s'entraîne avec les pros, et ne sait rien."
    right:
      label: "Il partira"
      effects: {caisse: "++", vestiaire: "-", force: -2, set: [h10_brac_vendu, h10_obei_s0], char: {brac: {statut: vendu}}, react: pr.h10.re.owen_crampons}
      answer: "La capitale appelle à neuf heures et commence par « comme convenu ». L'offre tient sur une ligne. Elle est bonne."

  # A3b · La feuille aux trente-trois cases — l'escalier nord (créneau 14,
  # avril, la huitième marche). L'horloge de l'escalier au printemps ; le nom
  # dans la dernière case attend la dernière marche (S2, 17).
  - id: pr.h10.a_avril
    roles: [president]
    arc: escalier
    tags: [tribunes, objet]
    speaker: tazi
    lieu: stade
    tone: leger
    once: true
    text: "Escalier nord, en avril. Tazi mure la huitième marche. Au mur, une feuille punaisée : trente-trois cases, huit cochées au feutre rouge. « C'est pas moi, {toi}. Mais le compte est bon. »"
    left:
      label: "Je décroche la feuille"
      effects: {tribunes: "-", direction: "+", set: [h10_feuille_decrochee]}
      answer: "Tazi la plie en quatre et la glisse sous sa casquette. « Je la garde. Le jour de la dernière, on comptera. »"
    right:
      label: "Je laisse le compte"
      effects: {tribunes: "+", direction: "-", set: [h10_feuille_laissee]}
      answer: "Le lendemain, des noms remplissent les cases au feutre noir, ceux de socios morts depuis 1974. La trente-troisième porte le tien."

  # A4 · Le président de la Fédération — le palier du club-house, sous le clou
  # de la photo de 1974 (créneau 16, mai). Trois variantes : la photo
  # raccrochée, ta photo à la place, le clou nu.
  - id: pr.h10.a4_mbako_photo
    roles: [president]
    arc: instances
    tags: [direction, objet]
    speaker: mbako
    lieu: bureau
    tone: strategique
    once: true
    text: "Sur le palier, Mbako s'arrête sous la photo de 1974, raccrochée au clou, et la regarde longtemps. « Sans la loi, huit clubs déposent le bilan. Je sauve ce que je peux. Et toi, {prenom}, en 1990 ? »"
    left:
      label: "Je jouais au foot"
      effects: {direction: "-", vestiaire: "+", relation: {mbako: 1}, set: [h10_mbako_visite, h10_mbako_joueur]}
      answer: "« Moi aussi. » Il touche le cadre du bout des doigts, comme un poteau. Il redescend sans être entré dans ton bureau."
    right:
      label: "Je vous écoutais"
      effects: {vestiaire: "-", direction: "+", set: [h10_mbako_visite]}
      answer: "« À la radio ? » Il regarde la photo, pas toi. « Ils sont tous morts, sauf un. » Il redescend sans entrer."

  - id: pr.h10.a4_mbako_cadre
    roles: [president]
    arc: instances
    tags: [direction, objet]
    speaker: mbako
    lieu: bureau
    tone: strategique
    once: true
    text: "Le palier du club-house. Lian Mbako s'arrête sous ta photo de 2016, accrochée au clou. « Sans la loi, huit clubs déposent le bilan. Je sauve ce que je peux. T'étais où, {prenom}, en 1990 ? »"
    left:
      label: "Je jouais au foot"
      effects: {direction: "-", vestiaire: "+", relation: {mbako: 1}, set: [h10_mbako_visite, h10_mbako_joueur]}
      answer: "« Ça se voit sur la photo. » Il redresse le cadre d'un millimètre. Il redescend sans être entré dans ton bureau."
    right:
      label: "Je vous écoutais"
      effects: {vestiaire: "-", direction: "+", set: [h10_mbako_visite]}
      answer: "« À la radio ? » Il sourit, pas longtemps. « Avant ta photo, y en avait une autre, à ce clou. » Il redescend sans entrer."

  - id: pr.h10.a4_mbako
    roles: [president]
    arc: instances
    tags: [direction, objet]
    speaker: mbako
    lieu: bureau
    tone: strategique
    once: true
    text: "Le palier du club-house. Lian Mbako s'arrête sous le clou, où plus rien n'est accroché. « Sans la loi, huit clubs déposent le bilan. Je sauve ce que je peux. T'étais où, {prenom}, en 1990 ? »"
    left:
      label: "Je jouais au foot"
      effects: {direction: "-", vestiaire: "+", relation: {mbako: 1}, set: [h10_mbako_visite, h10_mbako_joueur]}
      answer: "« Moi aussi. Tout de suite, sans attendre personne. » Il regarde le clou. Il redescend sans être entré dans ton bureau."
    right:
      label: "Je vous écoutais"
      effects: {vestiaire: "-", direction: "+", set: [h10_mbako_visite]}
      answer: "« À la radio ? » Il sourit, pas longtemps. « Alors tu sais ce que c'est, attendre. » Il redescend sans entrer."

  # A5 · Madame Mai — le clapet, au retour du stade (créneau 17, mai). Elle
  # plante l'hôtel de la Rive : la photo de septembre.
  - id: pr.h10.a5_mai_brac
    roles: [president]
    arc: clapet
    tags: [direction, portable]
    lieu: domicile
    tone: strategique
    once: true
    text: "Minuit, au retour du stade. « Ici Madame Mai. Le petit Brac a coûté cher, cette année. Pas à vous. Ne recommencez pas. Nous nous verrons en septembre, à l'hôtel. »"
    left:
      label: "Je recommencerai"
      effects: {tribunes: "+", direction: "-", set: [h10_mai_tenue]}
      answer: "« Vous avez une jolie voix quand vous mentez. » La tonalité. Dans la rue, la voiture sans volant allume ses phares toute seule."
    right:
      label: "Bien, madame"
      effects: {tribunes: "-", direction: "+", caisse: "+", set: [h10_obei_s0]}
      answer: "« Merci. » Elle ne l'avait jamais dit. Le lendemain, la banque te propose un crédit que tu n'as pas demandé."

  - id: pr.h10.a5_mai_haut
    roles: [president]
    arc: clapet
    tags: [direction, portable]
    lieu: domicile
    tone: strategique
    once: true
    text: "Minuit, au retour du stade. « Ici Madame Mai. Vous êtes trop haut pour un mois de mai. Ralentissez, la saison prochaine. Nous en parlerons en septembre, à l'hôtel. »"
    left:
      label: "Je ne ralentirai pas"
      effects: {tribunes: "+", direction: "-", set: [h10_mai_tenue]}
      answer: "« Vous avez une jolie voix quand vous mentez. » La tonalité. Dans la rue, la voiture sans volant allume ses phares toute seule."
    right:
      label: "Bien, madame"
      effects: {tribunes: "-", direction: "+", caisse: "+", set: [h10_obei_s0]}
      answer: "« Merci. » Elle ne l'avait jamais dit. Le lendemain, la banque te propose un crédit que tu n'as pas demandé."

  - id: pr.h10.a5_mai
    roles: [president]
    arc: clapet
    tags: [direction, portable]
    lieu: domicile
    tone: strategique
    once: true
    text: "Minuit, au retour du stade. « Ici Madame Mai. Belle saison. Ne la recommencez pas. Nous vous rappellerons en septembre ; à l'hôtel, cette fois. »"
    left:
      label: "Je la recommencerai"
      effects: {tribunes: "+", direction: "-", set: [h10_mai_tenue]}
      answer: "« Vous avez une jolie voix quand vous mentez. » La tonalité. Dans la rue, la voiture sans volant allume ses phares toute seule."
    right:
      label: "Bien, madame"
      effects: {tribunes: "-", direction: "+", caisse: "+", set: [h10_obei_s0]}
      answer: "« Merci. » Elle ne l'avait jamais dit. Le lendemain, la banque te propose un crédit que tu n'as pas demandé."

  # ================================================================ saison 1
  # B1 · La photo — chez toi, trois heures (créneau 1, septembre, soir).
  - id: pr.h10.b1_photo
    roles: [president]
    arc: presse
    tags: [presse, scandale, sombre]
    lieu: domicile
    tone: strategique
    once: true
    text: "Trois heures du matin. Une photo circule : toi, au bar de l'hôtel de la Rive, face à une femme en manteau d'automne. Dessous, en capitales : « {NOM} BOIT AVEC QUI ? »"
    left:
      label: "Je dis la vérité"
      effects: {tribunes: "--", direction: "+", set: [h10_photo_hotel, h10_verite_hotel]}
      answer: "Trois lignes : un rendez-vous d'affaires, Rive Capital, le centre de formation. À six heures, les trois lignes ont deux mille réponses."
    right:
      label: "Je dis : une amie"
      effects: {tribunes: "+", direction: "-", set: [h10_photo_hotel], react: pr.h10.re.lea_patere}
      answer: "« Une amie de trente ans. » À midi, quelqu'un retrouve le même manteau sur une photo de 2036, au fond d'une fête de socios."

  # L'appel d'après la photo — le clapet, à l'heure du café (créneaux 2-3,
  # septembre encore : la voix dit son mois). Une ancre, et non une chaîne :
  # posée par la photo, la chaîne cédait son créneau aux dernières étapes de la
  # saison 0 et sortait échue trois fois sur quatre.
  - id: pr.h10.b1_appel
    roles: [president]
    arc: clapet
    tags: [direction, portable]
    lieu: domicile
    tone: strategique
    once: true
    text: "Le clapet, à l'heure du café. « Ici Madame Septembre. Vous êtes très bien, sur cette photo. Moi, un peu moins. Je n'aime pas les manteaux d'automne. »"
    left:
      label: "C'était vous ?"
      effects: {direction: "-", set: [h10_madame_vue]}
      answer: "« Vous m'avez offert un verre. Vous ne vous souvenez pas ? » Tu te souviens d'un verre, d'un manteau, pas d'un visage."
    right:
      label: "Que voulez-vous ?"
      effects: {tribunes: "-", direction: "+", set: [h10_madame_vue, h10_obei_s1]}
      answer: "« Que vous gardiez votre calme. Le reste viendra en octobre, par la voie des airs. » Elle raccroche sur le mot « airs »."

  # B2 · L'hélicoptère — la pelouse, un mardi matin (créneau 5, octobre).
  - id: pr.h10.b2_helico_d1
    roles: [president]
    arc: sponsors
    tags: [sponsors, objet]
    lieu: stade
    tone: strategique
    once: true
    text: "Mardi matin, la pelouse d'un club de première division depuis juin. Un hélicoptère blanc se pose au rond central. Le pilote te tend une enveloppe crème : « De la part de Rive Capital. Pour fêter ça. »"
    left:
      label: "Renvoyez-le"
      effects: {tribunes: "+", direction: "-", set: [h10_helico_renvoye], schedule: [{card: pr.h10.ch_novembre, in: [2, 3]}], react: pr.h10.re.tazi_pelouse}
      answer: "Le pilote remonte sans discuter, l'enveloppe avec lui. Les pales arrachent trois mètres carrés de pelouse en repartant."
    right:
      label: "Je le garde"
      effects: {direction: "+", tribunes: "-", var: {cadeau_helico: "+1"}, set: [h10_helico, h10_obei_s1], schedule: [{card: pr.h10.ch_enveloppe, in: [2, 4]}], react: pr.h10.re.gege_helico}
      answer: "Le pilote te laisse les clés, un carnet d'entretien, l'enveloppe. Le jardinier regarde les patins enfoncés dans sa pelouse."

  - id: pr.h10.b2_helico
    roles: [president]
    arc: sponsors
    tags: [sponsors, objet]
    lieu: stade
    tone: strategique
    once: true
    text: "Mardi matin, pelouse de la Rive. Un hélicoptère blanc se pose au rond central. Le pilote te tend une enveloppe crème : « De la part de Rive Capital. Il se pose sur un terrain de football. Le vôtre. »"
    left:
      label: "Renvoyez-le"
      effects: {tribunes: "+", direction: "-", set: [h10_helico_renvoye], schedule: [{card: pr.h10.ch_novembre, in: [2, 3]}], react: pr.h10.re.tazi_pelouse}
      answer: "Le pilote remonte sans discuter, l'enveloppe avec lui. Les pales arrachent trois mètres carrés de pelouse en repartant."
    right:
      label: "Je le garde"
      effects: {direction: "+", tribunes: "-", var: {cadeau_helico: "+1"}, set: [h10_helico, h10_obei_s1], schedule: [{card: pr.h10.ch_enveloppe, in: [2, 4]}], react: pr.h10.re.gege_helico}
      answer: "Le pilote te laisse les clés, un carnet d'entretien, l'enveloppe. Le jardinier regarde les patins enfoncés dans sa pelouse."

  # La chaîne de l'enveloppe crème — l'argent qu'on ne peut pas expliquer (le
  # pont `ville_francs_sales`) ; la truelle s'en souviendra.
  - id: pr.h10.ch_enveloppe
    roles: [president]
    arc: sponsors
    tags: [chaine, sponsors, piege]
    lieu: domicile
    tone: strategique
    once: true
    text: "Chez toi, l'enveloppe crème ouverte sur la table de la cuisine : quatre liasses de billets neufs et un carton, « Pour le kérosène ». Pas de signature. Il n'en faut pas."
    left:
      label: "Je la range au coffre"
      effects: {tribunes: "-", caisse: "+", var: {ville_francs_sales: "+250000"}, set: [h10_enveloppe_gardee]}
      answer: "Le coffre de la villa, sous l'acte de propriété. L'enveloppe tient exactement dans la largeur, au millimètre."
    right:
      label: "Je la rapporte"
      effects: {direction: "-", tribunes: "+"}
      answer: "L'accueil de Rive Capital, quai de la Rive, prend l'enveloppe sans la compter. « On nous l'avait dit. » Un reçu sans en-tête."

  # La chaîne de Madame Novembre — l'hélicoptère renvoyé a un prix : le
  # mercato d'hiver. Elle tombe deux à trois cartes après l'hélicoptère (fin
  # novembre). Le refus lui ouvre une porte quand même : l'annexe du contrat,
  # que la ville fait lire en janvier (scenes_h10.yaml, h10.sc.annexe).
  - id: pr.h10.ch_novembre
    roles: [president]
    arc: clapet
    tags: [chaine, mercato, portable]
    lieu: domicile
    tone: strategique
    once: true
    text: "Le dernier dimanche de novembre, le clapet. « Ici Madame Novembre. Vous avez renvoyé l'hélicoptère ; nous gardons le mercato. En janvier, personne n'arrive, personne ne part. »"
    left:
      label: "Personne n'arrivera"
      effects: {caisse: "+", direction: "+", tribunes: "-", set: [h10_obei_s1, h10_mercato_gele]}
      answer: "« Merci. La Ligue aime les présidences raisonnables ; elle le dira. » La tonalité tombe avant que tu demandes à qui."
    right:
      label: "Je recruterai"
      effects: {caisse: "-", vestiaire: "+", force: 2, set: [h10_recrue_janvier]}
      answer: "« Recrutez. Nous paierons une partie du salaire, si vous voulez. » Elle raccroche sur le mot « partie »."

  # B3 · La seconde sonnerie — le local du kop, un soir (créneau 10, janvier).
  # Variante : le vote recompté (pr.h10.socios) a déjà montré comment Nino compte.
  - id: pr.h10.b3_sonnerie_recompte
    roles: [president]
    arc: tribunes
    tags: [ultras, sombre]
    speaker: gege
    lieu: stade
    tone: strategique
    once: true
    text: "Local du kop, un soir de janvier. Nino compte les mains pour l'accord, vite, comme le soir des trois cartes. À la patère, sa veste sonne : ta sonnerie de 1995. Près du poêle, Gégé te regarde."
    left:
      label: "Je décroche"
      effects: {tribunes: "-", relation: {nino: -1}, set: [h10_clapet_nino, h10_voix_entendue], react: pr.h10.re.nino_veste}
      answer: "Dans la poche de Nino : « Ici Madame Janvier. Bonsoir, Nino. » Un temps. « Vous n'êtes pas Nino. Bonsoir, {prenom}. » La tonalité."
    right:
      label: "Je laisse sonner"
      effects: {relation: {gege: 1}, set: [h10_clapet_nino], react: pr.h10.re.tazi_neuf}
      answer: "Neuf sonneries. Nino finit son compte, décroche sa veste et sort fumer. Gégé n'a pas cessé de te regarder."

