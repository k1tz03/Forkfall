    right:
      label: "Chacun pour soi"
      effects: {tribunes: "-", direction: "+", relation: {nino: -1}, set: [h10_chacun]}
      answer: "Il remet son clapet dans sa poche. « Alors je compterai les mains pour eux. » Il éteint la buvette en sortant, toi dedans."

  # ================================================================ saison 2
  # C1 · Madame Septembre, la dernière (créneaux 1-2). Neuf mois, neuf marches :
  # la vingt-cinquième est murée ce mois-ci, la trente-troisième le sera en mai.
  - id: pr.h10.c1_septembre_deux
    roles: [president]
    arc: clapet
    tags: [direction, portable]
    lieu: domicile
    tone: strategique
    once: true
    text: "Un matin de septembre. « Ici Madame Septembre, la dernière. Bonjour, {prenom}. Neuf mois, neuf marches. Je compte avec vous, et avec Nino. C'est plus gai, à trois. »"
    left:
      label: "Je ne compte plus"
      effects: {direction: "-", tribunes: "+"}
      answer: "« Alors je compterai pour deux. » Elle raccroche. À neuf heures, Tazi mure la vingt-cinquième, en sifflotant."
