      label: "Je rentre au club-house"
      effects: {tribunes: "--", var: {saisie_vehicules: "+1"}, set: [h10_helico_saisi]}
      answer: "De la fenêtre du bureau, tu vois le camion passer la grille, les pales repliées. Quelqu'un a noué une écharpe dessus."

  # B6 · Le neveu — la buvette, après la fermeture (créneau 17, mai).
  - id: pr.h10.b6_neveu_decroche
    roles: [president]
    arc: tribunes
    tags: [ultras, retorse]
    speaker: nino
    lieu: buvette
    tone: strategique
    once: true
    text: "Buvette, après la fermeture. Nino au zinc, les deux clapets côte à côte : « Tu as décroché le mien en janvier. Elle me l'a dit le soir même. Deux téléphones, une seule défaite, {toi}. »"
    left:
      label: "On les trahit ensemble"
      effects: {direction: "-", tribunes: "+", relation: {nino: 2}, set: [h10_nino_retourne]}
      answer: "Il remplit deux verres de la bouteille sans étiquette. « Pour mon oncle. Il ne doit jamais savoir que j'en ai eu un. »"
    right:
      label: "Chacun pour soi"
      effects: {tribunes: "-", direction: "+", relation: {nino: -1}, set: [h10_chacun]}
      answer: "Il remet son clapet dans sa poche. « Alors je compterai les mains pour eux. » Il éteint la buvette en sortant, toi dedans."

