  # Intermède · L'escalier (créneau 12, février). Le fait déformé : Gégé est
  # déjà de l'autre côté, et il sait.
  - id: pr.h10.b4_intermede
    roles: [president]
    arc: escalier
    tags: [intermede]
    tone: strategique
    once: true
    text: "Tu montes l'escalier nord dans le noir. À chaque marche, derrière toi, un bruit de truelle. En haut, tu te retournes : il n'y a plus que le mur. De l'autre côté, Gégé frappe, trois coups, puis trois."
    left:
      label: "Je frappe aussi"
      effects: {}
      answer: "Le mur est tiède sous ta main. Au réveil, tu as les phalanges rouges, et le clapet un appel manqué, à trois heures."
    right:
      label: "Je frappe aussi"
      effects: {}
      answer: "Le mur est tiède sous ta main. Au réveil, tu as les phalanges rouges, et le clapet un appel manqué, à trois heures."

  # B4b · Madame Avril — le clapet, la veille de l'entraînement ouvert
  # (créneau 14). La prime du dernier bloc ; obéir ou non, les pales tombent
  # le lendemain : un prêt se reprend, la désobéissance ne fait que fixer
  # l'heure.
  - id: pr.h10.b_avril
    roles: [president]
    arc: clapet
    tags: [vestiaire, portable]
    lieu: domicile
    tone: strategique
    once: true
    text: "Mardi soir, le clapet. « Ici Madame Avril. La prime de victoire du dernier bloc, vous la supprimez demain. Dites que c'est la trésorerie : ce sera presque vrai. »"
    left:
      label: "Je la supprime"
      effects: {vestiaire: "--", caisse: "+", force: -2, set: [h10_obei_s1, h10_prime_supprimee]}
      answer: "Le lendemain, la note est punaisée au vestiaire, signée de ta main. Personne ne demande qui l'a dictée. Tout le monde a une idée."
    right:
      label: "La prime reste"
      effects: {caisse: "-", vestiaire: "+", set: [h10_prime_gardee]}
      answer: "« Gardez-la. Nous reprendrons autre chose. » Jeudi, à l'heure de l'entraînement ouvert, il pleut sur la Rive."

  # B5 · Les pales — la saisie, l'entraînement ouvert du soir (créneau 15,
  # avril). Le consortium fait payer la première désobéissance devant la Nord.
  - id: pr.h10.b5_pales_renvoye
    roles: [president]
    arc: sponsors
    tags: [sponsors, scandale, sombre]
    lieu: stade
    tone: strategique
    once: true
    text: "Entraînement ouvert du soir. Sur le parking, devant la Nord, un huissier lit : « Saisie du véhicule, détenteur : {NOM}. » Plus bas : « Vous avez refusé l'hélicoptère. Elle, c'était un prêt. »"
    left:
      label: "Je parle au virage"
      effects: {tribunes: "+", direction: "-", var: {saisie_vehicules: "+1"}, set: [h10_voiture_saisie, h10_parle_virage], react: pr.h10.re.nino_megaphone}
      answer: "Tu montes sur le banc des remplaçants. Tu dis « prêt », « Rive Capital ». Le virage écoute jusqu'au bout, puis siffle les huissiers."
    right:
      label: "Je rentre à pied"
      effects: {tribunes: "-", var: {saisie_vehicules: "+1"}, set: [h10_voiture_saisie]}
      answer: "La voiture monte seule sur la dépanneuse, en marche arrière, prudemment. La Nord applaudit la manœuvre."

