  # C4 · Trois mille visages — le stade, le match d'après (créneau 14, avril).
  # Ils répondent aux trois mille masques de 1990, que les vieux ne nomment plus.
  - id: pr.h10.c4_masques_coupee
    roles: [president]
    arc: tribunes
    tags: [tribunes, ultras, moment]
    lieu: stade
    tone: strategique
    once: true
    text: "Le match d'après. La Nord se lève : trois mille visages de Gégé en carton, imprimés dans la nuit. Les haut-parleurs que tu as fait couper restent muets ; la Nord dit son nom, une minute entière."
    left:
      label: "Je me lève avec eux"
      effects: {direction: "-", tribunes: "++", set: [h10_debout_masques], react: pr.h10.re.tazi_minute}
