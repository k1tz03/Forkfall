    tone: strategique
    once: true
    text: "Le clapet. « Ici Madame Mai. Le dernier match, {prenom}, vous le perdez. Le lendemain, Nino lit l'accord à l'assemblée. Nous comptons sur vous deux ; vous savez qui. »"
