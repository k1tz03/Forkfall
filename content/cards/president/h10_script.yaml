  # C6 · La dernière marche — l'escalier nord, un soir de mai (créneau 17).
  # La décision se prend ici ; le mur se monte (ou non) la nuit d'avant le
  # dernier match, après le dernier bloc de journées : c'est l'annonce du
  # Grand Match qui dit ce qui s'est passé (content/setpieces/h10.yaml).
  # Trois variantes : la brigade (la truelle payée avec l'enveloppe crème), la
  # truelle payée de ta poche, et la base.
  - id: pr.h10.c6_marche_brigade
    roles: [president]
    arc: escalier
    tags: [scandale, sombre]
    lieu: stade
    tone: strategique
    once: true
    text: "Escalier nord, un soir de mai. Tazi n'est pas seul : deux hommes de la brigade financière tiennent l'enveloppe crème dans un sachet. « Les billets se suivent. Ils viennent d'où ? »"
    left:
      label: "De Rive Capital"
      effects: {direction: "--", tribunes: "+", set: [h10_enquete, h10_marche_ouverte]}
      answer: "L'inspecteur écrit « Rive Capital » en capitales, souligne deux fois. Ils partent avec l'enveloppe ; la dernière marche reste ouverte."
    right:
      label: "D'un pourboire"
      effects: {end: co_garde_a_vue}
      answer: "« Un pourboire de cette taille, ça s'explique au commissariat. » Ils t'emmènent par l'escalier sud. Le nord reste ouvert."

  - id: pr.h10.c6_marche_payee
    roles: [president]
    arc: escalier
    tags: [tribunes, sombre]
    speaker: tazi
    lieu: stade
    tone: strategique
    once: true
    text: "Escalier nord, un soir de mai. Tazi fume, assis sur la dernière marche : « Vous m'avez payé pour l'oublier. La nuit d'avant le match, on me paie le double pour m'en souvenir. Je la mure ? »"
    left:
      label: "Laissez-la ouverte"
      effects: {tribunes: "+", direction: "-", relation: {tazi: 1}, set: [h10_marche_ouverte]}
      answer: "Il écrase sa cigarette dans le seau de ciment sec. « Alors j'oublierai deux fois. Cette nuit-là, je dors ici. »"
    right:
      label: "Murez-la"
      effects: {tribunes: "-", direction: "+", set: [h10_marche_muree]}
      answer: "Il te rend ton enveloppe. « Je ne prends pas deux fois pour la même marche. » Il range sa lampe frontale dans le seau, pour la nuit dite."

  - id: pr.h10.c6_marche
    roles: [president]
    arc: escalier
    tags: [tribunes, sombre]
    speaker: tazi
    lieu: stade
    tone: strategique
    once: true
    text: "Escalier nord, un soir de mai, la dernière marche. Tazi pose sa truelle : « On m'a demandé de la murer la nuit d'avant le dernier match, quand tout le monde dort. Je la mure, {toi} ? »"
    left:
      label: "Laissez-la ouverte"
      effects: {tribunes: "+", direction: "-", relation: {tazi: 1}, set: [h10_marche_ouverte]}
      answer: "Il retourne le seau et s'assoit dessus, pour essayer. « Cette nuit-là, je dors ici. Comme ça, personne ne la mure. »"
    right:
      label: "Murez-la"
      effects: {tribunes: "-", direction: "+", set: [h10_marche_muree]}
      answer: "Il règle sa lampe frontale, pour la nuit dite. « Je viendrai tard. Il n'y aura personne pour compter. »"

  # ================================================================ saison 3
  # D1 · L'assemblée — la buvette du kop, le lendemain du dernier match. Toutes
  # les sorties ferment le livre. Les variantes (ordre de l'arc) : la fin rare,
  # le mur, la montée avec la preuve, la montée, la preuve, la base.
  - id: pr.h10.d1_assemblee_rare
    roles: [president]
    arc: tribunes
    tags: [tribunes, ultras, moment]
    speaker: nino
    lieu: buvette
    tone: strategique
    once: true
    text: "Buvette du kop, le lendemain de la montée. Nino au micro ne lit pas l'accord : il pose son clapet sur la table, à côté du tien, et attend. Au mur, quelqu'un a descendu la photo de 1974 du club-house."
    left:
      label: "Je montre les clapets"
      effects: {end: escalier_montee}
      answer: "Tu lèves les deux clapets au-dessus de ta tête, comme une carte de socio. Trois mille cartes se lèvent avec."
    right:
      label: "Je laisse voter"
      effects: {end: escalier_franchise}
      answer: "Nino te regarde longtemps, puis reprend l'accord à l'article un. Il lit lentement, pour te laisser le temps."

  - id: pr.h10.d1_assemblee_mur
    roles: [president]
    arc: tribunes
    tags: [tribunes, ultras, scandale]
    speaker: nino
    lieu: buvette
    tone: strategique
    once: true
    text: "Buvette du kop, le lendemain. Nino au micro ne lit pas l'accord : il lit une lettre de Gégé, cachetée à la cire, qui parle de deux téléphones. Toute la buvette se tourne vers ta table."
    left:
      label: "Je montre les clapets"
      effects: {end: escalier_mur}
      answer: "Tu poses ton clapet. Nino a déjà rangé le sien. On ne regarde que le tien ; on ne croit que la lettre."
    right:
      label: "Je sors par la cuisine"
      effects: {end: escalier_mur}
      answer: "La cuisine donne sur le parking. Ta voiture n'y est plus. Tu marches jusqu'à la gare routière sans te retourner."

