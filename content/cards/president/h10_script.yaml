    lieu: stade
    tone: leger
    once: true
    text: "Novembre. Gégé ne descend plus au local : il a fait monter la radio et la bâche de 1971. Nino, au pied de l'escalier, un thermos à la main : « Il veut que ce soit toi qui montes le café. »"
    left:
      label: "Je monte le café"
      effects: {tribunes: "+", direction: "-", relation: {gege: 1}, set: [h10_cafe_monte]}
      answer: "Il boit, grimace, reboit. « Le petit le fait trop fort. Toi, trop clair. » À la radio, on annonce la vingt-septième marche."
    right:
      label: "Monte-le, toi"
      effects: {direction: "+", tribunes: "-", relation: {nino: 1}, set: [h10_cafe_nino]}
      answer: "Nino monte, le thermos à la main. Par la fenêtre du local, tu le vois poser le thermos, s'asseoir, et ne plus bouger jusqu'au soir."

