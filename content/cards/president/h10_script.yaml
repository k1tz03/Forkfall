    arc: tribunes
    tags: [ultras, famille]
    speaker: gege
    lieu: stade
    tone: strategique
    once: true
    text: "Au-dessus du local, Gégé dans son lit, la bâche de 1971 sur les pieds : « Tu m'avais promis, {prenom}. Je sais pour les deux téléphones, le tien et celui du petit. Monte quand même. »"
    left:
