  # C3 · La nuit de Gégé — deux heures (créneau 12, février, soir). Le seul drame
  # du livre. Variante : Nino appelle sur le clapet, s'il est retourné au zinc.
  - id: pr.h10.c3_nuit_clapet
    roles: [president]
    arc: tribunes
    tags: [ultras, sombre, portable]
    speaker: nino
    lieu: domicile
    tone: drame
    once: true
    text: "Deux heures du matin. Ce n'est pas le fixe qui sonne, c'est le clapet, et ce n'est pas une femme. Nino, d'une voix que tu ne lui connais pas : « Il est deux heures. Il faut imprimer. »"
    left:
      label: "J'appelle l'imprimeur"
      effects: {caisse: "-", tribunes: "+", set: [h10_gege_mort, h10_masques_payes], char: {gege: {statut: mort}}, react: pr.h10.re.josiane_clou}
      answer: "L'imprimeur de la zone décroche à la deuxième sonnerie. « Trois mille, c'est ça ? On a déjà la photo. »"
    right:
      label: "Je monte au local"
      effects: {direction: "-", tribunes: "+", relation: {nino: 1}, set: [h10_gege_mort], char: {gege: {statut: mort}}, react: pr.h10.re.josiane_clou}
      answer: "Nino est assis au bord du lit, la bâche pliée sur les genoux. Il ne pleure pas. Il compte les plis, à voix basse."

