# Les Nouvelles de « La Maquette » : le monde de 1999 à 2002 vu du bureau d'un
# président de deuxième division, et la ville qui bouge autour de la Rive. Le
# président n'a pas d'autre respiration d'époque que celles-ci : les Nouvelles
# communes sont écrites pour l'entraîneur et le joueur. Une datée est servable
# la saison qui commence l'année d'avant et celle de son année (`year`). Un seul
# bouton : les deux sorties sont identiques. Les objets datés sont bornés par
# leur année ; la Nouvelle de 2002 pose `monde_ecus` (la ville compte en écus).
cards:
  # ------------------------------------------------------------------ 1999
  - id: pr.h5.nv.1999_tout_assis
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: aulard
    when: "flag('histoire_h5') && !flag('h5_tribune_est_brulee')"
    tone: leger
    once: true
    year: 1999
    text: "Vaubourg, à la Ligue, un mètre de couturière à la main : « Quarante-cinq centimètres par spectateur, assis, numéroté, d'ici 2001. Les bancs de chêne, c'est fini. Le béton, c'est l'avenir. »"
    left: {label: "Je prends note", effects: {direction: "+"}, answer: "Le soir, Josiane mesure un banc de la tribune Est avec son mètre de couturière : soixante-dix centimètres, pour deux."}
    right: {label: "Je prends note", effects: {direction: "+"}, answer: "Le soir, Josiane mesure un banc de la tribune Est avec son mètre de couturière : soixante-dix centimètres, pour deux."}

  - id: pr.h5.nv.1999_savonnette
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: gege
    when: "flag('histoire_h5')"
    tone: leger
    once: true
    year: 1999
    text: "Gégé montre un téléphone gros comme une savonnette : « Les gars du virage s'appellent d'une tribune à l'autre, pendant le match, pour dire qu'ils sont là. Avant, on se voyait. »"
    left: {label: "Le monde change", effects: {tribunes: "+"}, answer: "À la mi-temps, quatre téléphones sonnent en même temps dans la Nord. Le kop chante plus fort, pour couvrir les sonneries."}
    right: {label: "Le monde change", effects: {tribunes: "+"}, answer: "À la mi-temps, quatre téléphones sonnent en même temps dans la Nord. Le kop chante plus fort, pour couvrir les sonneries."}

  - id: pr.h5.nv.1999_premiere_tranche
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, presse]
    speaker: lea
    when: "flag('histoire_h5')"
    tone: leger
    once: true
    year: 1999
    text: "Léa lit le communiqué de l'agence à voix haute : « Première tranche des Terrasses : onze appartements vendus sur quarante, en six ans. La seconde sera “plus ouverte sur l'eau”. »"
    left: {label: "Ouverte sur quoi ?", effects: {direction: "+"}, answer: "Elle souligne « plus ouverte » au crayon. En dessous, dans la marge, elle écrit « sur quoi ? », et entoure le point d'interrogation."}
    right: {label: "Ouverte sur quoi ?", effects: {direction: "+"}, answer: "Elle souligne « plus ouverte » au crayon. En dessous, dans la marge, elle écrit « sur quoi ? », et entoure le point d'interrogation."}

  - id: pr.h5.nv.1999_creanciers
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, caisse]
    when: "flag('histoire_h5')"
    tone: leger
    once: true
    year: 1999
    text: "Le tribunal de commerce accorde au Racing un plan de continuation. L'audience a duré onze minutes ; la liste des créanciers fait quatre pages, tapées serré."
    left: {label: "Quatre pages", effects: {caisse: "+"}, answer: "Josiane photocopie les quatre pages. En haut de la troisième, un nom qu'elle ne connaît pas : SCI Rive Gauche."}
    right: {label: "Quatre pages", effects: {caisse: "+"}, answer: "Josiane photocopie les quatre pages. En haut de la troisième, un nom qu'elle ne connaît pas : SCI Rive Gauche."}

  # ------------------------------------------------------------------ 2000
  - id: pr.h5.nv.2000_berges
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, direction]
    when: "flag('histoire_h5') && !flag('h5_rive_voiture')"
    tone: leger
    once: true
    year: 2000
    text: "Le confortement des berges de la Rive commence lundi : des palplanches, une grue sur une barge, des plongeurs. Le marché aux puces du quai déménage au square, en attendant."
    left: {label: "Des plongeurs", effects: {direction: "+"}, answer: "Le premier matin, un plongeur remonte un caddie, une roue de vélo et une plaque minéralogique. Il les aligne sur le quai."}
    right: {label: "Des plongeurs", effects: {direction: "+"}, answer: "Le premier matin, un plongeur remonte un caddie, une roue de vélo et une plaque minéralogique. Il les aligne sur le quai."}

  - id: pr.h5.nv.2000_six_secondes
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    speaker: vukic
    when: "flag('histoire_h5') && season >= 1"
    tone: leger
    once: true
    year: 2000
    text: "Vukić compte sur ses doigts au bord du terrain : « Six secondes avec le ballon dans les mains, pas une de plus. L'arbitre compte à voix haute. Notre gardien, lui, compte encore sur ses doigts. »"
    left: {label: "Six secondes", effects: {vestiaire: "+"}, answer: "Samedi, le gardien dégage à cinq. Le stade applaudit la cinquième seconde comme un but, et le gardien ne sait pas pourquoi."}
    right: {label: "Six secondes", effects: {vestiaire: "+"}, answer: "Samedi, le gardien dégage à cinq. Le stade applaudit la cinquième seconde comme un but, et le gardien ne sait pas pourquoi."}

  - id: pr.h5.nv.2000_lundi_soir
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: malbec
    when: "flag('histoire_h5') && season >= 1"
    tone: leger
    once: true
    year: 2000
    text: "Hubert Malbec agite une coupure de presse : « La télévision paie la première division trois fois plus qu'en 1995. La deuxième, elle la filme le lundi soir, en différé, quand les enfants dorment. »"
    left: {label: "Le lundi soir", effects: {direction: "-"}, answer: "Le lundi suivant, le Racing passe à vingt-trois heures dix, entre la météo et un film. Josiane l'enregistre sur une cassette neuve."}
    right: {label: "Le lundi soir", effects: {direction: "-"}, answer: "Le lundi suivant, le Racing passe à vingt-trois heures dix, entre la météo et un film. Josiane l'enregistre sur une cassette neuve."}

  # ------------------------------------------------------------------ 2001
  - id: pr.h5.nv.2001_etiquettes
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: josiane
    when: "flag('histoire_h5') && !flag('monde_ecus')"
    tone: leger
    once: true
    year: 2001
    text: "Madame Josiane recolle les étiquettes de la buvette : le prix en francs, et dessous, plus petit, en écus. « Une bière, deux écus quatre-vingt-dix. Personne ne sait si c'est cher. »"
    left: {label: "C'est cher", effects: {direction: "+"}, answer: "Gégé fait la conversion à voix haute pour toute la buvette, en se trompant exprès. On rit. On paie quand même, en francs."}
    right: {label: "C'est cher", effects: {direction: "+"}, answer: "Gégé fait la conversion à voix haute pour toute la buvette, en se trompant exprès. On rit. On paie quand même, en francs."}

  - id: pr.h5.nv.2001_page_sept
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, direction]
    when: "flag('histoire_h5')"
    tone: leger
    once: true
    year: 2001
    text: "Un club de première division vient d'être racheté par un fonds lointain. Ses supporters ont appris le nouveau nom de leur stade dans le journal, en page sept, sous la météo."
    left: {label: "Page sept", effects: {direction: "+"}, answer: "À la buvette, quelqu'un découpe l'article et le punaise au-dessus de la caisse. Dessous, au feutre : PAS ICI."}
    right: {label: "Page sept", effects: {direction: "+"}, answer: "À la buvette, quelqu'un découpe l'article et le punaise au-dessus de la caisse. Dessous, au feutre : PAS ICI."}

  - id: pr.h5.nv.2001_grillages
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, tribunes, ultras]
    speaker: gege
    when: "flag('histoire_h5')"
    tone: leger
    once: true
    year: 2001
    text: "Gégé, devant le virage : « La Ligue fait enlever les grillages devant les tribunes. Des stadiers en chasuble, à la place. Trente ans qu'on s'accroche au grillage. On s'accrochera aux stadiers. »"
    left: {label: "Ils tiendront moins", effects: {direction: "+"}, answer: "Le samedi, les stadiers en chasuble orange se tiennent à un mètre de la Nord. Gégé leur apporte du café à la mi-temps."}
    right: {label: "Ils tiendront moins", effects: {direction: "+"}, answer: "Le samedi, les stadiers en chasuble orange se tiennent à un mètre de la Nord. Gégé leur apporte du café à la mi-temps."}

  - id: pr.h5.nv.2001_sachets
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: josiane
    when: "flag('histoire_h5') && season >= 1 && !flag('monde_ecus')"
    tone: leger
    once: true
    year: 2001
    text: "Madame Josiane vide sur ton sous-main un sachet transparent acheté au tabac : quinze pièces d'écus, pour cent francs. « Pour s'habituer, dit le buraliste. On ne pourra s'en servir qu'en janvier. »"
    left: {label: "Gardez-le", effects: {direction: "+"}, answer: "Elle le range dans le tiroir de la caisse, sous les francs, sans l'ouvrir. En janvier, elle sera la seule à avoir de la monnaie."}
    right: {label: "Gardez-le", effects: {direction: "+"}, answer: "Elle le range dans le tiroir de la caisse, sous les francs, sans l'ouvrir. En janvier, elle sera la seule à avoir de la monnaie."}

  # ------------------------------------------------------------------ 2002
  - id: pr.h5.nv.2002_calculette
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, caisse]
    speaker: josiane
    when: "flag('histoire_h5')"
    tone: leger
    once: true
    year: 2002
    text: "Premier mois en écus. Madame Josiane compte la recette avec une calculette neuve. « La banque me l'a fait porter, avec un mot : pour Josie. Je recompte quand même à la main. »"
    left: {label: "Comptez à la main", effects: {caisse: "-", set: [monde_ecus]}, answer: "Elle compte à la main, puis à la calculette. Il y a deux écus de différence. Elle fait confiance à sa main."}
    right: {label: "Comptez à la main", effects: {caisse: "-", set: [monde_ecus]}, answer: "Elle compte à la main, puis à la calculette. Il y a deux écus de différence. Elle fait confiance à sa main."}

  - id: pr.h5.nv.2002_ministre
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: aubert
    when: "flag('histoire_h5') && flag('h5_tribune_est_brulee')"
    tone: leger
    once: true
    year: 2002
    text: "Madame Aubert, députée, passe au stade en coup de vent, entre deux trains. Elle serre la main de Gégé, regarde l'Est en ruine, et demande où sont les toilettes."
    left: {label: "Au fond à gauche", effects: {direction: "+"}, answer: "Elle revient en s'essuyant les mains. « Il faudra rénover tout ça. » Elle ne dit pas tout quoi. Le photographe a déjà fini."}
    right: {label: "Au fond à gauche", effects: {direction: "+"}, answer: "Elle revient en s'essuyant les mains. « Il faudra rénover tout ça. » Elle ne dit pas tout quoi. Le photographe a déjà fini."}

  - id: pr.h5.nv.2002_reserve
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, caisse]
    when: "flag('histoire_h5')"
    tone: leger
    once: true
    year: 2002
    text: "Le tribunal de commerce prolonge le plan de continuation du Racing jusqu'en juin, « sous réserve du vote municipal ». La réserve tient en une ligne ; le plan, en quarante pages."
    left: {label: "Une ligne", effects: {caisse: "+"}, answer: "Josiane surligne la ligne en jaune. Puis elle surligne aussi, en vert, la date du vote, qu'elle entoure deux fois."}
    right: {label: "Une ligne", effects: {caisse: "+"}, answer: "Josiane surligne la ligne en jaune. Puis elle surligne aussi, en vert, la date du vote, qu'elle entoure deux fois."}

  # ------------------------------------------------------------ sans date
  - id: pr.h5.nv.neige
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    when: "flag('histoire_h5') && flag('h5_tribune_est_brulee')"
    tone: leger
    once: true
    text: "Il a neigé sur les gradins noirs de l'Est. Au matin, les gamins du quartier y ont laissé des empreintes de pas, rang par rang, comme des supporters."
    left: {label: "Je regarde", effects: {direction: "-"}, answer: "À midi, la neige a fondu. Les empreintes sont restées un peu plus longtemps que le reste, dans le noir du bois brûlé."}
    right: {label: "Je regarde", effects: {direction: "-"}, answer: "À midi, la neige a fondu. Les empreintes sont restées un peu plus longtemps que le reste, dans le noir du bois brûlé."}

  - id: pr.h5.nv.crue
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, objet]
    when: "flag('histoire_h5') && flag('h5_maquette_vue')"
    tone: leger
    once: true
    text: "La Rive est montée d'un mètre en une nuit. Elle a recouvert le quai, les palplanches et le bas de la vitrine Tessandier, puis elle est redescendue sans rien dire."
    left: {label: "Je vais voir", effects: {direction: "+"}, answer: "Sur la vitre de l'agence, une ligne de boue marque la hauteur de l'eau. Elle passe exactement au-dessus du petit lac en résine."}
    right: {label: "Je vais voir", effects: {direction: "+"}, answer: "Sur la vitre de l'agence, une ligne de boue marque la hauteur de l'eau. Elle passe exactement au-dessus du petit lac en résine."}

  - id: pr.h5.nv.horloge
    roles: [president]
    arc: nouvelle
    tags: [nouvelle, objet]
    when: "flag('histoire_h5') && flag('h5_conseil_entendu')"
    tone: leger
    once: true
    text: "L'horloge du club-house s'est arrêtée à dix-huit heures, un mardi. Josiane l'a remontée. Le mardi suivant, à dix-huit heures, elle s'est arrêtée encore."
    left: {label: "Faites-la réparer", effects: {direction: "+"}, answer: "L'horloger dit qu'elle n'a rien. Il la remonte devant toi. Le mardi d'après, à dix-huit heures, elle s'arrête."}
    right: {label: "Faites-la réparer", effects: {direction: "+"}, answer: "L'horloger dit qu'elle n'a rien. Il la remonte devant toi. Le mardi d'après, à dix-huit heures, elle s'arrête."}
