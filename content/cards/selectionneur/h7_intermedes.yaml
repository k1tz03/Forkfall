# Histoire 7 · Chambre 12 — les trois rêves (docs/histoires § 1.2 : l'intermède).
# Un par année, jamais tiré au sort : deux sont des ancres du script
# (content/arcs/selectionneur/h7_script.yaml), le troisième est l'étape du
# milieu de la trame de la mère (h7_intrigues.yaml, « La mère »).
#
#   2011 · le vingt-septième double (créneaux 10-11) — avant la liste et la nuit
#          du 14 : un double de trop au tableau, au numéro de ta chambre, tiède ;
#   2012 · le couloir (créneaux 9-10) — entre la main de 1 h 47 et le cahier de
#          nuit : toutes les portes portent le 12, et c'est toi qui réponds ;
#   2013 · le standard — la nuit de l'appel de la mère : toutes les voix
#          demandent la 12, et la dernière est la tienne (la porte de la 12, au
#          créneau 15, s'ouvre parce que tu en demandes le double).
#
# Un intermède ne ment pas sur les faits : il les déforme. Le motif des trois
# est le même, ta clé, ton double, ta voix : la signature du premier jour est au
# bas de la pile, et le rêve le sait avant toi. Sans locuteur, sans jauge, un
# seul bouton ; le réveil est la réponse.
cards:
  - id: sl.h7.i1_vingt_septieme
    roles: [selectionneur]
    arc: selection
    tags: [intermede]
    lieu: hotel
    tone: leger
    once: true
    text: "Tu rêves du tableau. Vingt-six crochets, vingt-sept doubles. Le vingt-septième porte le numéro de ta chambre, et il est tiède, comme si quelqu'un venait de le rendre."
    left:
      label: "Je le prends"
      effects: {}
      answer: "Au réveil, ta clé est sur la table de nuit, là où tu l'as posée. Tu la touches quand même. Elle est froide."
    right:
      label: "Je le prends"
      effects: {}
      answer: "Au réveil, ta clé est sur la table de nuit, là où tu l'as posée. Tu la touches quand même. Elle est froide."

  - id: sl.h7.i2_couloir
    roles: [selectionneur]
    arc: instances
    tags: [intermede]
    lieu: hotel
    tone: leger
    once: true
    text: "Le couloir du deuxième n'a pas de fin. Toutes les portes portent le numéro 12 ; derrière chacune, une télévision allumée sur le barrage. Tu frappes, et c'est toi qui réponds."
    left:
      label: "J'ouvre"
      effects: {}
      answer: "Derrière la porte, ta chambre, ton lit défait, et sur la table de nuit un double que tu n'as jamais demandé. Au réveil, il n'y est pas."
    right:
      label: "J'ouvre"
      effects: {}
      answer: "Derrière la porte, ta chambre, ton lit défait, et sur la table de nuit un double que tu n'as jamais demandé. Au réveil, il n'y est pas."

  - id: sl.h7.i3_standard
    roles: [selectionneur]
    arc: famille
    tags: [intermede]
    lieu: hotel
    tone: leger
    once: true
    text: "Tu rêves du standard. Tous les téléphones de l'hôtel sonnent ensemble, et dans chaque combiné une voix demande la 12. Tu décroches le dernier. C'est ta voix qui demande."
    left:
      label: "Je raccroche"
      effects: {}
      answer: "À trois heures, le téléphone de ta chambre sonne pour de vrai. Personne au bout. Sandrine jure qu'elle n'a rien passé."
    right:
      label: "Je raccroche"
      effects: {}
      answer: "À trois heures, le téléphone de ta chambre sonne pour de vrai. Personne au bout. Sandrine jure qu'elle n'a rien passé."
