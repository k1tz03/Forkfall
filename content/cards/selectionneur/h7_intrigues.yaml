# Histoire 7 · Chambre 12 — les cartes du réservoir (content/arcs/selectionneur/h7_intrigues.yaml).
# Cartes d'étape : hors du sac, servies par leur intrigue. `arc:` est le thème.
#
# Les graines et ce qui les paie, d'une intrigue à l'autre :
#   · le chiffre au crayon de Rouvier (le footing) et le rendez-vous du 16
#     novembre reviennent avec l'appel du cabinet de cardiologie, puis dans la
#     valise de la docteure (« son cardiologue de Valdorne m'écrivait ») ;
#   · le couvre-feu de minuit et les plafonds du petit reviennent à 1 h 47 ;
#   · le sachet sans étiquette du vestiaire de juin revient dans la main de la
#     photo ; Léa le voit « à votre bouche » ;
#   · « soixante » (la docteure, au prologue) revient chez Fardelli, qui
#     appelle chaque soir à onze heures — d'où « Passez-moi la 12 » ;
#   · le trombone rouge revient avec la page trois, qui revient dans la copie de
#     Rouvier (ancre de 2013) ;
#   · le brouillon de Josiane revient devant Dauzat ; l'heure donnée à Rossard
#     revient dans le registre ;
#   · la main levée dans le bus de 2010 revient au vote de Fauvel.
#
# Les étapes de 2011 qui montrent le petit vivant ont une variante pour après
# la nuit du 14, ou un `when` qui les retient avant.
cards:
  # ═════════════════════════════════════════ 2011 · Le vingt-sixième (Rouvier)
  - id: sl.h7.v1_tours
    roles: [selectionneur]
    arc: corps
    tags: [vestiaire, formation]
    speaker: rouvier
    lieu: terrain
    tone: leger
    once: true
    when: "!flag('h7_rance_mort')"
    text: "Terrain annexe, le footing du matin. Nadia Rouvier tient le chronomètre contre sa poitrine. « Le petit Rancé s'arrête au troisième tour, une main là, et il rit. J'aime pas quand ils rient, là. »"
    left:
      label: "Il sort du footing"
      effects: {vestiaire: "-", relation: {rouvier: 1}, set: [h7_footing_coupe]}
      answer: "Rouvier siffle deux coups. Rancé sort en marchant, vexé, et s'assoit sur le banc des remplaçants, bras croisés, pour regarder les autres."
    right:
      label: "Il court avec les autres"
      effects: {vestiaire: "+", set: [h7_footing_force]}
      answer: "Il finit les dix tours, dernier, en souriant. Rouvier écrit un chiffre dans la marge de son carnet, et l'entoure."

  - id: sl.h7.v2_plafond
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire, presse]
    speaker: mbako
    lieu: hotel
    tone: leger
    once: true
    when: "year >= 2008 && !flag('h7_rance_mort')"
    text: "Dans le couloir, Mbako te montre son téléphone. Sur le Flux du petit, la photo d'un plafond, « nuit 2 ». « Tous les soirs, il poste son plafond. Il dit que c'est pour sa mère. Tu lui dis d'arrêter ? »"
    left:
      label: "Laisse-le poster"
      effects: {vestiaire: "+", relation: {mbako: 1}}
      answer: "« Il sera content. » Le soir même, « nuit 3 », le même plafond, avec une fissure que personne n'avait remarquée."
    right:
      label: "Plus de téléphone à minuit"
      effects: {direction: "+", vestiaire: "-", set: [h7_couvre_feu]}
      answer: "Mbako range son téléphone. « Je lui dirai. » À minuit dix, « nuit 3 » est en ligne quand même, avec un cœur en dessous."

  - id: sl.h7.v2_plafond_apres
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire, presse]
    lieu: hotel
    tone: strategique
    once: true
    when: "year >= 2008"
    text: "Le Flux du petit Rancé publie encore, chaque nuit à minuit : « nuit 5 », « nuit 6 ». Le même plafond. Il avait tout programmé pour la fenêtre, jusqu'au soir du barrage."
    left:
      label: "Je fais fermer le compte"
      effects: {direction: "+", set: [h7_compte_ferme]}
      answer: "Le Flux demande un certificat de décès. Dauzat en envoie une copie tamponnée. « nuit 7 » ne sort jamais."
    right:
      label: "Je les regarde tous"
      effects: {vestiaire: "+", set: [h7_plafonds_vus]}
      answer: "Tu attends minuit, chaque nuit. Le dernier plafond est daté du soir du barrage. Il n'y a rien dessus, à part la fissure."

  - id: sl.h7.v3_rendez_vous
    roles: [selectionneur]
    arc: corps
    tags: [vestiaire]
    speaker: tibo_rance
    lieu: hotel
    tone: strategique
    once: true
    when: "!flag('h7_rance_mort')"
    text: "Tibo Rancé frappe à ta porte, le carnet à élastique rouge à la main : « Le 16 novembre, j'ai un rendez-vous à Valdorne. Une heure, c'est personnel. Je peux y aller ? »"
    left:
      label: "Vas-y, le 16"
      effects: {vestiaire: "+", set: [h7_rendez_vous_accorde], outcome: accorde}
      answer: "Il écrit une ligne dans le carnet et referme l'élastique. Il ne te dit pas quel genre de rendez-vous ; tu ne demandes pas."
    right:
      label: "Après le barrage"
      effects: {direction: "+", set: [h7_rendez_vous_repousse], outcome: repousse}
      answer: "« Après le barrage », répète-t-il en hochant la tête, comme quelqu'un qui recompte un calcul déjà fait."

  - id: sl.h7.v3_cabinet
    roles: [selectionneur]
    arc: corps
    tags: [vestiaire, direction]
    lieu: hotel
    tone: strategique
    once: true
    text: "La réception te passe un appel : un cabinet de cardiologie de Valdorne. « M. Rancé ne s'est pas présenté le 16 novembre. Il avait insisté pour ce créneau. On envoie la note à qui ? »"
    left:
      label: "À la Fédération"
      effects: {direction: "-", set: [h7_cardiologue], outcome: appel}
      answer: "La secrétaire épelle « Fédération » lettre par lettre. Puis, sans qu'on lui demande : « Il venait depuis 2010, vous savez. »"
    right:
      label: "Envoyez-la-moi"
      effects: {caisse: "-", set: [h7_cardiologue], outcome: appel}
      answer: "La note arrive au quai trois jours plus tard : une consultation, quarante écus. Au dos, au stylo : suivi depuis 2010."

  # ═══════════════════════════════════════════════ 2011 · Le brassard (Ferrol)
  - id: sl.h7.c1_prime
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire, caisse]
    speaker: fauvel
    lieu: hotel
    tone: leger
    once: true
    text: "Karim Fauvel, du syndicat des joueurs, pose une lettre à côté de ta tasse : « La prime de 2010 est gelée depuis le bus. Les mutins ne réclament rien. Moi, je réclame pour eux, {toi}. »"
    left:
      label: "Je la débloque"
      effects: {vestiaire: "++", caisse: "-", direction: "-", relation: {fauvel: 1}, set: [h7_prime_debloquee]}
      answer: "Fauvel replie la lettre en quatre. Le soir, au dîner, Mbako lève son verre d'eau vers toi, une seconde, et le repose."
    right:
      label: "Elle reste gelée"
      effects: {direction: "+", vestiaire: "-", caisse: "+", relation: {fauvel: -1}, set: [h7_prime_gelee]}
      answer: "Il écrit « noté » au bas de la lettre, la date à côté, et te la laisse. Elle reste sur la table jusqu'au soir."

  - id: sl.h7.c1_prime_ministre
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire, direction]
    speaker: aubert
    lieu: hotel
    tone: leger
    once: true
    text: "Madame Aubert, au téléphone, la voix de quelqu'un qui lit une note : « Un mutin avec le brassard, et le syndicat réclame la prime de 2010. Le pays ne paie pas un bus qui n'est pas descendu. »"
    left:
      label: "Je la débloque quand même"
      effects: {vestiaire: "++", direction: "-", relation: {aubert: -1, fauvel: 1}, set: [h7_prime_debloquee]}
      answer: "« Avec quel argent ? » Elle raccroche avant ta réponse. La prime arrive en juin, prise sur les primes de match ; personne ne s'en plaint."
    right:
      label: "Elle reste gelée"
      effects: {direction: "+", vestiaire: "-", caisse: "+", relation: {aubert: 1, fauvel: -1}, set: [h7_prime_gelee]}
      answer: "« Voilà une phrase que je pourrai répéter. » Elle la répète le soir même, à la radio. Fauvel l'entend dans sa voiture."

  - id: sl.h7.c2_sachet
    roles: [selectionneur]
    arc: corps
    tags: [vestiaire]
    speaker: ferrol
    lieu: vestiaire
    tone: strategique
    once: true
    text: "Le vestiaire, avant le match de juin. Ferrol vide un sachet blanc dans sa gourde, dos aux autres : « C'est pour les jambes, {toi}. À Valdorne, tout le monde en prend. Vous voulez voir ? »"
    left:
      label: "Montre-moi"
      effects: {direction: "+", set: [h7_sachet_vu]}
      answer: "Il te tend le sachet. Pas d'étiquette, juste un trait au feutre. « Mon préparateur les fait lui-même. » Il le reprend, et boit."
    right:
      label: "Ce sont tes jambes"
      effects: {vestiaire: "+", relation: {ferrol: 1}}
      answer: "Il secoue la gourde et boit d'un trait. Le soir, il court plus que tout le monde, et il le sait."

  - id: sl.h7.c3_car
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire]
    lieu: stade
    tone: leger
    once: true
    text: "Le car du retour, après le match. Les mutins au fond, les nouveaux devant ; au milieu, une rangée vide que personne ne prend. Ta place est au premier rang, derrière le chauffeur."
    left:
      label: "Je m'assois au milieu"
      effects: {vestiaire: "++", direction: "-", set: [h7_rangee_milieu], outcome: milieu}
      answer: "Au bout d'une heure, Mbako vient s'asseoir à côté de toi, les coudes sur les genoux. Ferrol se retourne une fois, puis deux."
    right:
      label: "Je reste devant"
      effects: {direction: "+", vestiaire: "-", set: [h7_rangee_vide], outcome: devant}
      answer: "La rangée reste vide jusqu'à Aubérive. Le chauffeur l'a vue dans son rétroviseur ; il le racontera au comptoir du Terminus."

  - id: sl.h7.c3_car_deuil
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire]
    lieu: stade
    tone: strategique
    once: true
    text: "Le car du retour, après le dernier match de la fenêtre. Les mutins au fond, les nouveaux devant. Au dernier rang, la place du petit est restée vide, et la rangée du milieu aussi."
    left:
      label: "Je m'assois au milieu"
      effects: {vestiaire: "++", direction: "-", set: [h7_rangee_milieu], outcome: milieu}
      answer: "Mbako vient s'asseoir à côté de toi au bout d'une heure. Personne ne prend la place du dernier rang. Personne ne la prendra."
    right:
      label: "Je reste devant"
      effects: {direction: "+", vestiaire: "-", set: [h7_rangee_vide], outcome: devant}
      answer: "Deux rangées vides jusqu'à Aubérive. Devant l'hôtel, le chauffeur ralentit sans qu'on le lui demande."

  # ══════════════════════════════════════ Le tableau des clés (Sandrine, rituel)
  - id: sl.h7.t1_minuit
    roles: [selectionneur]
    arc: selection
    tags: [vestiaire]
    speaker: sandrine
    lieu: hotel
    tone: leger
    once: true
    text: "Minuit, une nuit de fenêtre. Un seul crochet vide au tableau, le 14. Sandrine écrit dans son cahier. « M. Mbako rentre toujours avant deux heures. Toujours. Vous attendez avec moi ? »"
    left:
      label: "J'attends avec vous"
      effects: {vestiaire: "-", relation: {sandrine: 1, mbako: -1}}
      answer: "Il rentre à une heure cinquante, sent le Corner, et te fait un petit signe de deux doigts en passant. Sandrine écrit l'heure."
    right:
      label: "Bonne nuit, Sandrine"
      effects: {vestiaire: "+"}
      answer: "« Bonne nuit. » Elle a déjà repris son stylo. Au matin, le double du 14 est revenu au crochet, et l'heure est dans le cahier."

  - id: sl.h7.t1_minuit_2012
    roles: [selectionneur]
    arc: selection
    tags: [vestiaire]
    speaker: sandrine
    lieu: hotel
    tone: leger
    once: true
    text: "Minuit. Vingt-cinq doubles au tableau, et un crochet vide que personne n'a enlevé : le 12. La police garde le double. Sandrine a collé un sparadrap sur le crochet : « Je le compte, ou pas ? »"
    left:
      label: "Comptez-le"
      effects: {vestiaire: "+", set: [h7_crochet_compte]}
      answer: "« Vingt-six. » Elle écrit le chiffre en haut de la page, comme chaque nuit depuis 2011, et ne le corrigera jamais."
    right:
      label: "Ne le comptez plus"
      effects: {direction: "+"}
      answer: "« Vingt-cinq. » Elle l'écrit, le regarde, puis ajoute à côté un petit trait au crayon, qu'elle seule sait lire."

  - id: sl.h7.t1_minuit_2013
    roles: [selectionneur]
    arc: selection
    tags: [vestiaire]
    speaker: sandrine
    lieu: hotel
    tone: leger
    once: true
    text: "Minuit, 2013. Le crochet du 12 a disparu ; à sa place, un trou de cheville que personne n'a rebouché. Sandrine pose le doigt dessus : « Escande voulait du plâtre. J'ai dit non. Et vous ? »"
    left:
      label: "Pas de plâtre"
      effects: {vestiaire: "+", relation: {sandrine: 1}}
      answer: "Le trou reste. Les joueurs y passent le doigt en rendant leur double, sans que personne ne le leur ait appris."
    right:
      label: "Du plâtre, oui"
      effects: {direction: "+", relation: {sandrine: -1}}
      answer: "Le lendemain, le trou est bouché, peint en blanc. Sandrine écrit quand même « 12 » au crayon sur la peinture fraîche."

  # 2011 : le réveil de six heures. Le petit a écrit lui-même la ligne dans le
  # cahier de nuit ; le petit salon de quatre heures s'en servira (a4, variante
  # « réveil ») : la découverte fixée à l'heure où la réception l'appelle.
  - id: sl.h7.t2_reveil
    roles: [selectionneur]
    arc: selection
    tags: [vestiaire]
    speaker: sandrine
    lieu: hotel
    tone: leger
    once: true
    when: "!flag('h7_rance_mort')"
    text: "Minuit et demi. Sandrine te montre une ligne de son cahier, d'une autre écriture, « 12, réveil 6 h. Pas le réveil : Sandrine. » « Le petit Rancé. Je l'appelle à six heures, ou je le laisse dormir ? »"
    left:
      label: "Appelez-le à six heures"
      effects: {vestiaire: "+", relation: {sandrine: 1}, set: [h7_reveil_six]}
      answer: "Elle recopie la ligne de sa main, au propre. Le lendemain, à six heures pile, la 12 décroche à la première sonnerie."
    right:
      label: "Laissez-le dormir"
      effects: {direction: "+"}
      answer: "Elle barre la ligne d'un trait fin, sans l'effacer. « Il me l'a demandé deux fois. Il a peur de pas se réveiller, je crois. »"

  - id: sl.h7.t2_heures_2012
    roles: [selectionneur]
    arc: selection
    tags: [vestiaire]
    speaker: sandrine
    lieu: hotel
    tone: leger
    once: true
    text: "Sandrine te montre la marge de son cahier : l'heure où chaque double revient depuis mars, en colonne. « Ils ne sortent plus le soir. Ils ne dorment pas non plus. Ils restent dans le couloir. »"
    left:
      label: "Qu'ils sortent un soir"
      effects: {vestiaire: "+", caisse: "-"}
      answer: "Le samedi suivant, vingt-cinq joueurs au Corner, en silence. Ils rentrent tous avant minuit, ensemble, comme en déplacement."
    right:
      label: "Qu'ils dorment"
      effects: {direction: "+", vestiaire: "-"}
      answer: "Rouvier distribue des bouchons d'oreilles. Le lendemain, Sandrine en trouve un, posé tout seul, sur le paillasson de la 12."

  # 2013 : le rêve déborde. Ton double revenu tout seul au crochet : la seule
  # ligne du cahier que Sandrine ne sait pas expliquer.
  - id: sl.h7.t2_double_2013
    roles: [selectionneur]
    arc: selection
    tags: [vestiaire]
    speaker: sandrine
    lieu: hotel
    tone: leger
    once: true
    text: "Minuit. Sandrine tient ton double entre deux doigts : « Il était au crochet ce soir. Vous ne l'avez pas rendu, je l'aurais écrit. Vous le reprenez, ou j'écris qu'il est revenu seul ? »"
    left:
      label: "Je le reprends"
      effects: {vestiaire: "+"}
      answer: "Il est froid. Tu le gardes dans le poing jusqu'à ta porte. Dans le cahier, Sandrine écrit l'heure, et rien d'autre."
    right:
      label: "Écrivez-le"
      effects: {direction: "+", relation: {sandrine: 1}}
      answer: "Elle écrit : « double rendu, minuit, pas vu passer ». La première ligne du cahier qu'elle ne sait pas expliquer. Elle ne la barre pas."

  - id: sl.h7.t3_ronde
    roles: [selectionneur]
    arc: selection
    tags: [vestiaire]
    speaker: sandrine
    lieu: hotel
    tone: leger
    once: true
    text: "Une nuit de fenêtre, minuit. Les vingt-six doubles sont au tableau. Sandrine les compte deux fois du bout de son crayon. « Ça arrive jamais. Vous allez descendre tous les soirs, maintenant ? »"
    left:
      label: "Tous les soirs"
      effects: {vestiaire: "-", direction: "+", set: [h7_ronde], outcome: ronde}
      answer: "Elle te fait une place au bout du comptoir, sur un tabouret haut. À minuit, chaque soir, tu comptes ; elle écrit."
    right:
      label: "Plus jamais"
      effects: {vestiaire: "+", set: [h7_confiance], outcome: confiance}
      answer: "« Alors je compterai seule. » Elle tourne la page du cahier et inscrit la date en haut."

  - id: sl.h7.t3_ronde_2012
    roles: [selectionneur]
    arc: selection
    tags: [vestiaire]
    speaker: sandrine
    lieu: hotel
    tone: leger
    once: true
    text: "Minuit, une fenêtre de 2012. Il manque trois doubles : le 7, le 14, le 16. Sandrine ne lève pas la tête : « Ils montent chez M. Mbako. Ils parlent de la nuit. Vous montez aussi ? »"
    left:
      label: "Je monte"
      effects: {vestiaire: "++", direction: "-", set: [h7_ronde], outcome: ronde}
      answer: "Dans la 14, cinq joueurs assis par terre, la lumière éteinte. Ils se taisent quand tu entres, puis reprennent, plus bas."
    right:
      label: "Je les laisse parler"
      effects: {vestiaire: "+", set: [h7_confiance], outcome: confiance}
      answer: "« Ils rendront les doubles avant deux heures », dit Sandrine. À une heure cinquante-huit, les trois sont au crochet."

  - id: sl.h7.t3_portes_2013
    roles: [selectionneur]
    arc: selection
    tags: [vestiaire]
    speaker: sandrine
    lieu: hotel
    tone: leger
    once: true
    text: "Minuit. Ferrol a laissé son double au tableau et dort la porte ouverte, au deuxième. Sandrine : « Il dit que ce sera comme ça jusqu'au match. Que la porte, c'est pour qu'on entende. »"
    left:
      label: "Que tous fassent pareil"
      effects: {vestiaire: "++", direction: "-", set: [h7_portes_ouvertes], outcome: ronde}
      answer: "Le lendemain, vingt-six portes ouvertes au deuxième, et vingt-six doubles au tableau. Le couloir sent le linge et la pommade."
    right:
      label: "Chacun sa porte"
      effects: {direction: "+", set: [h7_confiance], outcome: confiance}
      answer: "Ferrol referme la sienne le lendemain, sans discuter. Sandrine efface son nom de la colonne des portes, et garde la colonne."

  # ══════════════════════════════════════════════ 2011 · L'hymne (Madame Aubert)
  - id: sl.h7.h1_ministre
    roles: [selectionneur]
    arc: tribune
    tags: [tribunes, direction]
    speaker: aubert
    lieu: hotel
    tone: leger
    once: true
    text: "Madame Aubert, ministre des Sports, garde son manteau dans le salon de l'hôtel : « En 2010, ils ont regardé leurs chaussures pendant l'hymne. En novembre, le pays veut leur voir la bouche. »"
    left:
      label: "Ils chanteront"
      effects: {tribunes: "+", vestiaire: "-", relation: {aubert: 1}, set: [h7_hymne_promis]}
      answer: "Elle enfile un gant, puis l'autre. « Je viendrai écouter. Mon cabinet vous appellera pour la date. »"
    right:
      label: "Ils feront ce qu'ils veulent"
      effects: {vestiaire: "+", direction: "-", relation: {aubert: -1}}
      answer: "« Alors je ferai ce que je veux aussi. » Le lendemain, la subvention des déplacements est « à l'étude »."

  - id: sl.h7.h2_fiches
    roles: [selectionneur]
    arc: tribune
    tags: [tribunes, vestiaire]
    speaker: josiane
    lieu: hotel
    tone: leger
    once: true
    text: "Madame Josiane distribue des fiches bristol, les paroles de l'hymne tapées à la machine : « La ministre veut une répétition. M. Mbako m'a rendu la sienne sans la lire. Je la lui redonne ? »"
    left:
      label: "Redonnez-la-lui"
      effects: {tribunes: "+", relation: {mbako: -1}, set: [h7_fiche_rendue]}
      answer: "Mbako prend la fiche, la plie en deux et la glisse dans la poche où il garde le brassard. Il ne dit ni oui ni non."
    right:
      label: "Laissez-le"
      effects: {vestiaire: "+", relation: {mbako: 1}, set: [h7_fiche_laissee]}
      answer: "Josiane pince la fiche d'un trombone rouge et la range dans son classeur, à la lettre M. « Il saura où la trouver. »"

  - id: sl.h7.h3_repetition
    roles: [selectionneur]
    arc: tribune
    tags: [tribunes, vestiaire]
    lieu: hotel
    tone: leger
    once: true
    when: "!flag('h7_rance_mort')"
    text: "La salle du petit-déjeuner, une répétition à huis clos. Vingt-six joueurs debout entre les tables. Le petit Rancé chante le premier, faux, très fort ; les autres rient, puis chantent."
    left:
      label: "On recommence"
      effects: {tribunes: "+", vestiaire: "+", set: [h7_hymne_chante], outcome: chante}
      answer: "Trois fois, jusqu'à ce que ce soit juste. À la troisième, Mbako chante aussi, sans la fiche. Il connaissait les paroles par cœur."
    right:
      label: "Ça suffira"
      effects: {vestiaire: "+", set: [h7_hymne_muet], outcome: muet}
      answer: "Ils se rassoient. Le petit fredonne encore en beurrant sa tartine ; personne ne lui dit de se taire."

  - id: sl.h7.h3_repetition_deuil
    roles: [selectionneur]
    arc: tribune
    tags: [tribunes, vestiaire]
    lieu: hotel
    tone: strategique
    once: true
    text: "La salle du petit-déjeuner, une répétition à huis clos. Vingt-cinq joueurs debout entre les tables. Personne ne chante le premier : il manque celui qui chantait faux, très fort."
    left:
      label: "J'entonne l'hymne"
      effects: {tribunes: "+", vestiaire: "++", set: [h7_hymne_chante], outcome: chante}
      answer: "Tu chantes faux, toi aussi. Au deuxième vers, Mbako te rejoint, puis Ferrol, puis tous. Rouvier sort de la salle avant la fin."
    right:
      label: "On ne chantera pas"
      effects: {vestiaire: "+", tribunes: "-", set: [h7_hymne_muet], outcome: muet}
      answer: "Ils restent debout en silence jusqu'à la dernière mesure de la radio. Le silence aussi, ça se répète."

  # ══════════════════════════════════════════ 2011 · L'agent du petit (Fardelli)
  - id: sl.h7.g1_cafe
    roles: [selectionneur]
    arc: agent
    tags: [agents]
    speaker: fardelli
    lieu: cafe
    tone: leger
    once: true
    when: "!flag('h7_rance_mort')"
    text: "Café de la Mairie. Rocco Fardelli remue un café qu'il ne boira pas : « Le petit Rancé a besoin de minutes en novembre. Trois clubs de Portclair viendront le voir. Vous lui en donnez combien ? »"
    left:
      label: "Soixante, pas plus"
      effects: {direction: "+", relation: {fardelli: 1}, set: [h7_minutes_promises]}
      answer: "« Soixante. » Il répète le chiffre comme un prix. « C'est la docteure qui compte, alors. » Il paie les deux cafés."
    right:
      label: "Vous ne comptez pas ici"
      effects: {direction: "-", relation: {fardelli: -1}, set: [h7_fardelli_econduit]}
      answer: "Il pose une pièce sur la soucoupe sans se lever. « Alors j'appellerai l'hôtel, le soir. Lui, il décroche toujours. »"

  - id: sl.h7.g2_standard
    roles: [selectionneur]
    arc: agent
    tags: [agents]
    speaker: sandrine
    lieu: hotel
    tone: leger
    once: true
    when: "!flag('h7_rance_mort')"
    text: "Réception, onze heures du soir. Sandrine pose la main sur le téléphone qui sonne : « M. Fardelli, pour le petit Rancé. Tous les soirs à onze heures, depuis lundi. Je passe, ou il dort ? »"
    left:
      label: "Passez-le-lui"
      effects: {relation: {fardelli: 1}}
      answer: "Elle passe l'appel au 12. Le voyant reste allumé quarante minutes. Elle note : 23 h 00, 23 h 40, M. Fardelli, la 12."
    right:
      label: "Il dort"
      effects: {relation: {fardelli: -1}, set: [h7_standard_filtre]}
      answer: "« Il dort, monsieur Fardelli. » Elle raccroche et regarde le voyant du 12, allumé : le petit téléphone à quelqu'un d'autre."

  - id: sl.h7.g2_standard_muet
    roles: [selectionneur]
    arc: agent
    tags: [agents]
    speaker: sandrine
    lieu: hotel
    tone: strategique
    once: true
    text: "Réception, onze heures du soir. Le téléphone ne sonne pas. Sandrine Lavergne pose quand même la main dessus, à l'heure dite, et la laisse là jusqu'à onze heures cinq."
    left:
      label: "Il ne rappellera pas"
      effects: {direction: "+"}
      answer: "« Je sais. » Elle retire la main. Dans le cahier, elle écrit 23 h 00, et rien à côté."
    right:
      label: "Je reste avec vous"
      effects: {relation: {sandrine: 1}}
      answer: "Vous attendez cinq minutes sans parler. À onze heures cinq, elle retire la main et écrit : 23 h 05, personne."

  - id: sl.h7.g3_deux_ans
    roles: [selectionneur]
    arc: agent
    tags: [agents]
    speaker: fardelli
    lieu: terrain
    tone: strategique
    once: true
    when: "!flag('h7_rance_mort')"
    text: "Fardelli t'attend sur le parking du terrain annexe : « Il m'a demandé un contrat de deux ans. Pas plus. Un garçon de vingt-cinq ans qui veut deux ans, ça vous dit quelque chose ? »"
    left:
      label: "Pourquoi deux ans ?"
      effects: {direction: "-", set: [h7_deux_ans], outcome: ecoute}
      answer: "« Je lui ai demandé. Il m'a dit : deux ans, c'est un Mondial. » Fardelli remonte dans sa voiture sans attendre ta réponse."
    right:
      label: "Ça ne me regarde pas"
      effects: {direction: "+", set: [h7_deux_ans], outcome: ignore}
      answer: "« Non. Moi non plus, ça ne me regardait pas. » Il remonte en voiture et laisse la vitre baissée jusqu'au carrefour."

  - id: sl.h7.g3_deux_ans_apres
    roles: [selectionneur]
    arc: agent
    tags: [agents]
    speaker: fardelli
    lieu: hotel
    tone: strategique
    once: true
    text: "Fardelli, sur le parking de l'hôtel, sans descendre de voiture : « Il m'avait demandé un contrat de deux ans. Pas plus. Je trouvais ça bizarre, à vingt-cinq ans. Maintenant, je trouve ça précis. »"
    left:
      label: "Pourquoi deux ans ?"
      effects: {direction: "-", set: [h7_deux_ans], outcome: ecoute}
      answer: "« Deux ans, c'était un Mondial, il disait. » Fardelli remonte sa vitre. Il reste garé là une heure, moteur coupé."
    right:
      label: "Rentrez chez vous"
      effects: {direction: "+", set: [h7_deux_ans], outcome: ignore}
      answer: "Il démarre. Au coin de la rue, il s'arrête au fleuriste des Immortelles ; il en ressort les mains vides."

  # ═══════════════════════════════════════════ 2011 · La page des sports (Léa)
  - id: sl.h7.l1_portrait
    roles: [selectionneur]
    arc: formation
    tags: [presse, formation]
    speaker: lea
    lieu: hotel
    tone: leger
    once: true
    when: "!flag('h7_rance_mort')"
    text: "Léa, de L'Écho, t'attend au comptoir de la Rive, un carnet à spirale ouvert : « Le gamin du Racing revient en bleu. Vingt minutes avec lui pour la page des sports. Vous me le prêtez ? »"
    left:
      label: "Vingt minutes, pas plus"
      effects: {tribunes: "+"}
      answer: "Elle l'interroge à la fenêtre de la 12, dos au terrain annexe. Vingt minutes. Elle repart avec une phrase soulignée deux fois."
    right:
      label: "Pas avant novembre"
      effects: {direction: "+", tribunes: "-", set: [h7_portrait_refuse]}
      answer: "« En novembre, il sera titulaire, ou il sera rien. » Le lendemain, L'Écho publie une photo de lui prise de loin, au téléobjectif."

  - id: sl.h7.l2_phrase
    roles: [selectionneur]
    arc: formation
    tags: [presse]
    speaker: lea
    lieu: echo
    tone: strategique
    once: true
    text: "Léa, au téléphone, avant le bouclage, te lit sa note. Un tournoi, un seul, après on verra. « Il a dit ça en riant, la main sur la poitrine. Je laisse la phrase, ou je la coupe ? »"
    left:
      label: "Laissez-la"
      effects: {tribunes: "+", set: [h7_phrase_laissee]}
      answer: "Elle paraît le jeudi, en gras. Le soir, la docteure Arzel découpe l'article et le range dans sa mallette, sous le couvercle."
    right:
      label: "Coupez-la"
      effects: {direction: "+", set: [h7_phrase_coupee]}
      answer: "Elle la barre d'un trait ; tu entends le stylo au bout du fil. « Je la garde quand même, dans mon carnet. Elle ressortira. »"

  - id: sl.h7.l2_phrase_appel
    roles: [selectionneur]
    arc: formation
    tags: [presse]
    speaker: lea
    lieu: echo
    tone: strategique
    once: true
    text: "Léa, au téléphone. « Il m'a appelée lui-même, du terrain annexe. » Elle te lit sa note. Un tournoi, un seul, après on verra. « Il riait. Je laisse la phrase, ou je la coupe ? »"
    left:
      label: "Laissez-la"
      effects: {tribunes: "+", set: [h7_phrase_laissee]}
      answer: "Elle paraît le jeudi, en gras, sous la photo prise au téléobjectif. Le soir, Arzel découpe l'article et le range dans sa mallette."
    right:
      label: "Coupez-la"
      effects: {direction: "+", set: [h7_phrase_coupee]}
      answer: "« Comme vous voudrez. Il me rappellera. » Elle la barre quand même au crayon, pas à l'encre, pour pouvoir la gommer."

  - id: sl.h7.l2_phrase_apres
    roles: [selectionneur]
    arc: formation
    tags: [presse]
    speaker: lea
    lieu: echo
    tone: strategique
    once: true
    text: "Léa, au téléphone, la voix basse : « J'avais gardé sa phrase pour jeudi. Un tournoi, un seul, après on verra. » Un silence. « Je la mets dans la nécrologie, ou dans mon carnet ? »"
    left:
      label: "Mettez-la"
      effects: {tribunes: "+", set: [h7_phrase_laissee]}
      answer: "Elle paraît sous la photo, en gras. Le lendemain, Arzel ne descend pas au petit-déjeuner ; Rouvier lui monte un café qu'elle ne boit pas."
    right:
      label: "Gardez-la"
      effects: {direction: "+", set: [h7_phrase_coupee]}
      answer: "« Dans mon carnet, alors. » Elle ne raccroche pas tout de suite. Tu l'entends taper la phrase quand même, puis l'effacer."

  - id: sl.h7.l3_photo
    roles: [selectionneur]
    arc: formation
    tags: [presse, formation]
    speaker: lea
    lieu: terrain
    tone: leger
    once: true
    text: "L'aube, au terrain annexe du Racing. Le photographe de L'Écho a posé Tibo dans les filets, en survêtement bleu. Léa : « Il veut que vous soyez sur la photo. Vous venez ? »"
    left:
      label: "Je viens"
      effects: {vestiaire: "+", set: [h7_photo_ensemble], outcome: montre}
      answer: "Sur la photo du jeudi, tu es à côté de lui, un peu flou. Il a une main sur la poitrine ; le photographe a cru qu'il chantait l'hymne."
    right:
      label: "La photo, c'est lui"
      effects: {direction: "+", outcome: garde}
      answer: "Il pose seul. Trente-six vues. Sur la dernière, il ne sourit plus et se tient la poitrine ; Léa garde ce tirage pour elle."

  - id: sl.h7.l3_photo_apres
    roles: [selectionneur]
    arc: formation
    tags: [presse]
    speaker: lea
    lieu: echo
    tone: strategique
    once: true
    text: "L'Écho, le soir. Léa pose un tirage qu'elle n'a jamais publié : Tibo dans les filets du terrain annexe, la main sur la poitrine, sans sourire. « Pour demain. Celle-là, ou une autre ? »"
    left:
      label: "Celle-là"
      effects: {tribunes: "+", set: [h7_photo_main], outcome: montre}
      answer: "Elle paraît le lendemain. À la réception, Sandrine la découpe et la punaise au-dessus du tableau des clés, à côté du crochet vide."
    right:
      label: "Une autre"
      effects: {direction: "+", outcome: garde}
      answer: "Elle range le tirage dans une enveloppe kraft. « Vous avez raison. Celle-là, ce sera pour le tribunal. »"

  # ════════════════════════════════════════ 2011 · Le pull bleu (Madame Rancé)
  - id: sl.h7.y1_linge
    roles: [selectionneur]
    arc: famille
    tags: [famille]
    speaker: sandrine
    lieu: hotel
    tone: leger
    once: true
    when: "!flag('h7_rance_mort')"
    text: "Le hall, un dimanche soir. Une femme en imperméable pose un sac de sport sur le comptoir : le linge de Tibo, lavé, plié. Sandrine : « Les familles ne montent pas. Je la laisse monter ? »"
    left:
      label: "Qu'elle monte"
      effects: {vestiaire: "+", direction: "-", relation: {rance_mere: 1}}
      answer: "Elle redescend dix minutes après, le sac vide. « Il a toujours froid. Je lui ai mis le pull bleu. » Elle te serre la main, fort."
    right:
      label: "Le règlement est le même"
      effects: {direction: "+", relation: {rance_mere: -1}}
      answer: "Elle laisse le sac au comptoir et ne s'assoit pas. « Dites-lui que c'est le pull bleu. Il a toujours froid. »"

  - id: sl.h7.y2_appels
    roles: [selectionneur]
    arc: famille
    tags: [famille, vestiaire]
    speaker: sandrine
    lieu: hotel
    tone: strategique
    once: true
    text: "Sandrine tourne son cahier vers toi : chaque nuit, à trois heures, la 12 appelle le même numéro en ville, sept minutes. « Le règlement veut que je vous le signale. Je vous le signale. »"
    left:
      label: "Ça ne regarde que lui"
      effects: {vestiaire: "+", set: [h7_appels_tus]}
      answer: "« Bien. » La nuit suivante, elle écrit quand même l'heure et la durée. Trois heures, sept minutes. Elle souligne le sept."
    right:
      label: "Je lui en parlerai"
      effects: {direction: "+", set: [h7_appels_parle]}
      answer: "Au petit-déjeuner, il rougit : « C'est ma mère. Elle ne dort pas si je n'appelle pas. » Le soir même, à trois heures, il appelle."

  - id: sl.h7.y2_appels_apres
    roles: [selectionneur]
    arc: famille
    tags: [famille]
    speaker: sandrine
    lieu: hotel
    tone: strategique
    once: true
    text: "Sandrine, en triant le courrier : « Cette nuit encore, à trois heures, le standard a sonné. Un numéro en ville. Personne ne parle : on écoute sept minutes, et on raccroche. Je décroche encore ? »"
    left:
      label: "Laissez sonner"
      effects: {vestiaire: "+", set: [h7_appels_tus]}
      answer: "Le standard sonne sept minutes, à trois heures, chaque nuit de la fenêtre. Sandrine ne décroche plus. Elle note."
    right:
      label: "Décrochez, je descends"
      effects: {direction: "+", set: [h7_appels_parle]}
      answer: "À trois heures, elle te tend le combiné. Une respiration de femme, très réveillée, sept minutes. Puis plus rien."

  - id: sl.h7.y3_calme
    roles: [selectionneur]
    arc: famille
    tags: [famille]
    speaker: rance_mere
    lieu: hotel
    tone: leger
    once: true
    text: "Sur le parking de la Rive, la mère de Tibo t'arrête avant le car de novembre : « Il dort mal, l'hiver, dans les hôtels. Vous le mettrez dans une chambre au calme, {toi} ? »"
    left:
      label: "Il aura la 12, au calme"
      effects: {relation: {rance_mere: 1}, set: [h7_chambre_promise], outcome: tendu}
      answer: "« La 12. » Elle répète le numéro comme on retient un code. « Il m'appellera à trois heures. Dites-lui de dormir, après. »"
    right:
      label: "Les chambres, c'est l'hôtel"
      effects: {direction: "+", outcome: ferme}
      answer: "Elle serre son sac contre elle et repart vers l'arrêt du bus. Tu la vois attendre longtemps ; le dimanche, le 4 ne passe plus."

  - id: sl.h7.y3_sac
    roles: [selectionneur]
    arc: famille
    tags: [famille]
    speaker: rance_mere
    lieu: hotel
    tone: strategique
    once: true
    text: "Le sac de sport de Tibo, rendu par la police, attend au comptoir. Sa mère le soupèse sans l'ouvrir : « Le pull bleu n'y est pas. Vous savez où il est, {toi} ? »"
    left:
      label: "Je vais le chercher"
      effects: {relation: {rance_mere: 1}, set: [h7_pull_perdu], outcome: tendu}
      answer: "Tu demandes à Benali, à Escande, à Sandrine. Personne ne l'a vu. Elle repart avec le sac, et sans le pull."
    right:
      label: "La police l'a gardé"
      effects: {direction: "+", set: [h7_pull_perdu], outcome: ferme}
      answer: "« La police. » Elle l'écrit dans un petit carnet, avec l'heure. Elle aussi, maintenant, note les heures."

  # ═════════════════════════════════════════════════════ 2012 · La main (Léa)
  - id: sl.h7.m1_photo
    roles: [selectionneur]
    arc: presse
    tags: [presse]
    speaker: lea
    lieu: echo
    tone: strategique
    once: true
    when: "year >= 2008"
    text: "L'Écho, le bureau du fond. Léa tourne son écran : sur le Flux, à 1 h 47, Rancé vivant, assis sur son lit. Dans le coin, une main qui tient un sachet. « Vous savez à qui est cette main ? »"
    left:
      label: "Non"
      effects: {direction: "+", set: [h7_main_vue]}
      answer: "Elle fait défiler : la photo a été effacée à 2 h 01. Elle note ton « non » dans la marge, avec un point d'interrogation."
    right:
      label: "Laissez-moi lui parler"
      effects: {vestiaire: "+", set: [h7_main_vue, h7_questions]}
      answer: "« Vous savez, donc. » Elle n'insiste pas. Elle imprime la photo, la plie en deux et te la tend."

  - id: sl.h7.m1_photo_couvre_feu
    roles: [selectionneur]
    arc: presse
    tags: [presse]
    speaker: lea
    lieu: echo
    tone: strategique
    once: true
    when: "year >= 2008"
    text: "L'Écho. Léa tourne son écran : sur le Flux, à 1 h 47, Rancé assis sur son lit, une heure et demie après votre couvre-feu. Dans le coin, une main qui tient un sachet. « À qui, cette main ? »"
    left:
      label: "Non, je ne sais pas"
      effects: {direction: "+", set: [h7_main_vue]}
      answer: "« Il postait après minuit, malgré vous. Il vous désobéissait pour sa mère. » Elle écrit ton « non » dans la marge."
    right:
      label: "Laissez-moi lui parler"
      effects: {vestiaire: "+", set: [h7_main_vue, h7_questions]}
      answer: "« Vous savez, donc. » Elle imprime la photo, la plie en deux, et souligne l'heure au stylo avant de te la tendre."

  - id: sl.h7.m1_photo_sachet
    roles: [selectionneur]
    arc: presse
    tags: [presse]
    speaker: lea
    lieu: echo
    tone: strategique
    once: true
    when: "year >= 2008"
    text: "L'Écho. Léa agrandit un coin de la dernière photo du petit, postée à 1 h 47 : une main, un sachet sans étiquette, un trait au feutre. « Vous l'avez déjà vu, ce sachet. Je le vois à votre bouche. »"
    left:
      label: "Non"
      effects: {direction: "+", set: [h7_main_vue]}
      answer: "« D'accord. » Elle écrit « non » et, juste à côté, « juin ». Elle ne t'explique pas pourquoi juin."
    right:
      label: "Laissez-moi lui parler"
      effects: {vestiaire: "+", set: [h7_main_vue, h7_questions]}
      answer: "« Valdorne, alors. » Elle n'a pas besoin de ta réponse. Elle imprime la photo et te la tend, pliée en deux."

  # La phrase coupée en 2011 (« La page des sports ») : Léa ne coupe plus.
  - id: sl.h7.m1_photo_phrase
    roles: [selectionneur]
