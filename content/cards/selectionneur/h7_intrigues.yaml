    speaker: ferrol
    lieu: terrain
    tone: strategique
    once: true
    text: "Terrain annexe. Ferrol garde les yeux sur son bracelet rouge et noir : « Il voulait se sentir comme avant. Je lui ai donné ce que je prends avant les matchs. Personne ne savait, pour son cœur ? »"
    left:
      label: "Tu vas le dire"
      effects: {vestiaire: "-", tribunes: "+", relation: {ferrol: 1}, set: [h7_ferrol_dira], outcome: dira}
      answer: "Il regarde le sachet, longtemps. Le soir, il coupe le bracelet de Valdorne aux ciseaux de Rouvier, et le garde en poche."
    right:
      label: "Tu ne dis rien"
      effects: {vestiaire: "+", direction: "+", set: [h7_ferrol_tait], outcome: tait}
      answer: "« D'accord. » Il dit « d'accord » comme on avale. Le soir même, il coupe son bracelet de Valdorne, et le jette."

  - id: sl.h7.m3_jeudi
    roles: [selectionneur]
    arc: presse
    tags: [presse]
    speaker: lea
    lieu: echo
    tone: strategique
    once: true
    text: "Léa, au téléphone : « Jeudi, la photo sort avec la main. Sans le nom : je n'ai qu'une source. Vous voulez être la deuxième ? »"
    left:
      label: "Je serai la deuxième"
      effects: {tribunes: "+", direction: "-", set: [h7_nom_confirme, h7_questions]}
      answer: "Le jeudi, la photo sort en page trois, la main et le nom. Le vendredi, Ferrol arrive à l'entraînement avant tout le monde."
    right:
      label: "Cherchez ailleurs"
      effects: {direction: "+", set: [h7_nom_tu]}
      answer: "Le jeudi, la photo sort sans le nom. En dessous, une ligne : « La sélection n'a pas souhaité répondre. »"

  - id: sl.h7.m3_ferrol_parle
    roles: [selectionneur]
    arc: presse
    tags: [presse]
    speaker: lea
    lieu: echo
    tone: strategique
    once: true
    text: "Léa repose le téléphone : « Ferrol est venu ce matin, seul. Jeudi, la photo sort avec la main, son nom, et ce qu'il a dit. Vous ajoutez une phrase ? »"
    left:
      label: "Il a eu du courage"
      effects: {tribunes: "+", vestiaire: "+", set: [h7_nom_confirme]}
      answer: "Ta phrase sort en gras sous la photo. Ferrol la découpe, la plie, et la glisse dans la poche où il gardait son bracelet."
    right:
      label: "Pas de commentaire"
      effects: {direction: "+"}
      answer: "La photo sort avec sa phrase à lui et ton silence en dessous. Ferrol lit les deux au petit-déjeuner, et son café refroidit."

  # ═══════════════════════════════════════════════ 2012 · Le plateau (Rossard)
