    left:
      label: "Je ne sais pas"
      effects: {direction: "+", set: [h7_main_vue]}
      answer: "« Alors je chercherai seule. » Elle colle au bas de l'écran, avec un bout de scotch, la phrase qu'elle avait coupée : un tournoi, un seul."
    right:
      label: "Laissez-moi lui parler"
      effects: {vestiaire: "+", set: [h7_main_vue, h7_questions]}
      answer: "« Vous savez, donc. » Elle imprime la photo, la plie en deux, et glisse dedans la phrase qu'elle avait coupée."

  - id: sl.h7.m2_sachet
