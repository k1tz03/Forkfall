    lieu: domicile
    tone: strategique
    once: true
    text: "Dimanche soir, le plateau de Vence. Rossard, les mains à plat : « Un capitaine qui sort de la 12 à deux heures vingt-cinq, je ne le garde pas une minute. » Il dit le nom de Mbako, deux fois."
    left:
      label: "J'appelle la chaîne"
      effects: {direction: "-", set: [h7_rossard_plateau, h7_chaine_appelee, h7_questions]}
      answer: "La standardiste prend ton nom et te met en attente. À l'antenne, Vence passe déjà à la météo des stades."
    right:
      label: "Je coupe le son"
      effects: {direction: "+", set: [h7_rossard_plateau]}
      answer: "Tu coupes le son. Le téléphone, lui, se met à sonner, et ne s'arrête plus jusqu'à une heure du matin."

  # Le brassard est à Ferrol : Rossard dit « ancien capitaine », de sa
  # formule de consultant (« Moi, à votre place »).
  - id: sl.h7.p2_dimanche_ancien
    roles: [selectionneur]
    arc: tribune
    tags: [presse, tribunes]
    speaker: rossard
    lieu: domicile
    tone: strategique
    once: true
    text: "Dimanche soir, le plateau de Vence. Rossard, les mains à plat : « Moi, à votre place, je ne garderais pas un ancien capitaine sorti de la 12 à deux heures vingt-cinq. » Puis le nom de Mbako."
    left:
      label: "J'appelle la chaîne"
      effects: {direction: "-", set: [h7_rossard_plateau, h7_chaine_appelee, h7_questions]}
      answer: "La standardiste prend ton nom et te met en attente. À l'antenne, Vence passe déjà à la météo des stades."
    right:
      label: "Je coupe le son"
      effects: {direction: "+", set: [h7_rossard_plateau]}
      answer: "Tu coupes le son. Le téléphone, lui, se met à sonner, et ne s'arrête plus jusqu'à une heure du matin."

  - id: sl.h7.p3_quatorze
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire, presse]
    speaker: mbako
    lieu: hotel
    tone: strategique
    once: true
    text: "La 14, en plein après-midi, rideaux tirés. Mbako n'a pas allumé : « Rossard a dit mon nom, et une heure. Pas ce que j'ai fait entre les deux. Toi, à la radio demain, tu dis quoi ? »"
    left:
      label: "Je te défends"
      effects: {vestiaire: "++", tribunes: "-", relation: {mbako: 1}, set: [h7_mbako_defendu], outcome: defendu}
      answer: "À la radio, tu dis : « Lian Mbako est un homme droit. » Tu ne dis pas de quoi. Le standard de la Fédération saute à dix heures."
    right:
      label: "La justice dira"
      effects: {vestiaire: "--", tribunes: "+", direction: "+", relation: {mbako: -1}, set: [h7_mbako_lache], outcome: lache}
      answer: "« La justice dira. » La phrase tourne toute la semaine. Mbako ne descend plus déjeuner ; Rouvier lui monte un plateau."

  # ═════════════════════════════════════════════ 2012 · La nuit du 14 (Benali)
  - id: sl.h7.n1_heures
    roles: [selectionneur]
    arc: instances
    tags: [direction]
    speaker: benali
    lieu: hotel
    tone: strategique
    once: true
    text: "La commandante Benali a posé une feuille sur la nappe : 2 h 10, des pas ; 2 h 30, votre téléphone ; 6 h, le constat. « Entre 2 h 30 et 6 h, il s'est passé quoi, {toi} ? »"
    left:
      label: "Une réunion, à quatre heures"
      effects: {direction: "--", tribunes: "+", set: [h7_quatre_heures_dite, h7_questions]}
      answer: "Elle écrit « 4 h » entre deux traits et entoure le chiffre. « Qui était assis où ? » Tu le lui dis, chaise par chaise."
    right:
      label: "J'ai dormi"
      effects: {direction: "+", set: [h7_dormi_dit]}
      answer: "« Jusqu'à six heures, alors. » Elle écrit « dormi » à côté, et l'heure de ta réponse. Elle note toujours l'heure des réponses."

  - id: sl.h7.n1_heures_appel
    roles: [selectionneur]
    arc: instances
    tags: [direction]
    speaker: benali
    lieu: hotel
    tone: strategique
    once: true
    text: "Benali pose une feuille sur la nappe : 2 h 10, des pas ; 2 h 41, votre appel, que l'hôtel dit n'avoir jamais passé ; 6 h, le constat. « Entre votre appel et six heures, quoi, {toi} ? »"
    left:
      label: "Une réunion, à quatre heures"
      effects: {direction: "--", tribunes: "+", set: [h7_quatre_heures_dite, h7_questions]}
      answer: "Elle entoure « 4 h » et, au-dessus, ton 2 h 41. « Vous avez appelé, puis vous avez signé. Dans cet ordre-là. »"
    right:
      label: "J'ai dormi"
      effects: {direction: "+", set: [h7_dormi_dit]}
      answer: "« Vous avez appelé, et vous avez dormi. » Elle écrit les deux l'un sous l'autre, et ne commente pas."

  # 2 h 24 : la seule ligne de la nuit où quelqu'un a demandé de l'aide. Le
  # standard garde les heures ; Mbako a appelé la docteure, pas la police (le
  # bus de 2012 s'en souvient, variante « la 3 »).
  - id: sl.h7.n2_deux_heures_vingt_quatre
    roles: [selectionneur]
    arc: instances
    tags: [direction]
    speaker: benali
    lieu: hotel
    tone: strategique
    once: true
    text: "Benali pose le relevé du standard sur la nappe, une ligne surlignée : 2 h 24, la 12 appelle la 3, quarante secondes. « La 3, c'est la docteure. Qui a composé le numéro, d'après vous ? »"
    left:
      label: "Celui qui avait le double"
      effects: {direction: "-", tribunes: "+", set: [h7_appel_trois]}
      answer: "« Il n'a pas appelé la police. Il a appelé le staff, comme on fait dans un bus. » Elle entoure 2 h 24, deux fois."
    right:
      label: "Je n'en sais rien"
      effects: {direction: "+"}
      answer: "« Moi si. Je voulais savoir si vous, vous saviez. » Elle range le relevé ; le surligneur a bavé sur la ligne de 2 h 25."

  - id: sl.h7.n3_procureure
    roles: [selectionneur]
    arc: instances
    tags: [direction]
    speaker: benali
    lieu: hotel
    tone: strategique
    once: true
    text: "Benali revient avec une ordonnance de la procureure Amsel : « Elle veut tout, maintenant. On me dit qu'aucun procès-verbal n'a été tenu cette nuit-là, à la Fédération. C'est exact ? »"
    left:
      label: "Il y en a un"
      effects: {direction: "-", tribunes: "+", set: [h7_pv_signale, h7_questions], outcome: aide}
      answer: "« Un registre noir, à la page de quatre heures. » Elle écrit « registre » et souligne. « Merci. Ça va vous coûter quelque chose. »"
    right:
      label: "Je n'en sais rien"
      effects: {direction: "+", outcome: mur}
      answer: "Elle range l'ordonnance dans sa sacoche. « Alors je le trouverai sans vous. Ce sera plus long, et vous serez dedans. »"

  # ══════════════════════════════════════════════ 2012 · Fulgor (Desforges)
  - id: sl.h7.f1_canette
    roles: [selectionneur]
    arc: argent
    tags: [sponsors, caisse]
    speaker: desforges
    lieu: hotel
    tone: leger
    once: true
    text: "Carole Desforges pose une canette orange sur la nappe : « Nos coffrets étaient dans toutes les chambres, la 12 comprise. Le sachet n'était pas à nous. Fulgor double vos primes. Vous signez, {toi} ? »"
    left:
      label: "Je signe"
      effects: {caisse: "++", tribunes: "-", set: [h7_fulgor_signe], var: {ville_francs_sales: "+60000"}}
      answer: "Elle fait glisser le contrat sous la canette, comme sous un presse-papier. « À vingt heures, un mot suffira. Le bon. »"
    right:
      label: "Pas devant une canette"
      effects: {caisse: "-", tribunes: "+", set: [h7_fulgor_refuse]}
      answer: "Elle reprend la canette sans s'offusquer. « Le président, lui, signe devant n'importe quoi. » Elle sort son téléphone."

  - id: sl.h7.f2_montres
    roles: [selectionneur]
    arc: argent
    tags: [sponsors, caisse]
    speaker: desforges
    lieu: hotel
    tone: leger
    once: true
    text: "Un coffret de velours ouvert sur la table : vingt-sept montres d'acier gravées COBALTS {annee}. Desforges : « Une par joueur, et la vingt-septième pour vous. Personne ne refuse une montre. »"
    left:
      label: "Je la porte"
      effects: {caisse: "+", set: [h7_montres], var: {cadeau_montre_acier: "+1"}}
      answer: "Elle te la passe au poignet elle-même ; le fermoir claque. Au dîner, les joueurs comparent les gravures. Mbako ne met pas la sienne."
    right:
      label: "Rendez les vingt-sept"
      effects: {caisse: "-", vestiaire: "-", set: [h7_montres_rendues]}
      answer: "Elle referme le coffret. Le lendemain, trois joueurs viennent te demander, poliment, où sont passées les montres."

  - id: sl.h7.f2_vaubourg
    roles: [selectionneur]
    arc: argent
    tags: [sponsors, direction]
    speaker: aulard
    lieu: hotel
    tone: leger
    once: true
    text: "Vaubourg, au téléphone : « Fulgor a signé avec moi, puisque vous faites des manières. Leurs canettes seront sur la table de presse. Vous direz ce que vous voudrez, à côté. »"
    left:
      label: "Je les ferai enlever"
      effects: {direction: "-", tribunes: "+", set: [h7_canettes_essai]}
      answer: "« Essayez. » Il raccroche. Le lendemain, les canettes sont sur la table, scotchées par le fond."
    right:
      label: "Elles resteront"
      effects: {direction: "+", caisse: "+", set: [h7_canettes_restent]}
      answer: "« Voilà. » Le chèque de Fulgor arrive à la Fédération le lundi ; les primes des joueurs, elles, arriveront en mars."

  - id: sl.h7.f3_plateau_canette
    roles: [selectionneur]
    arc: argent
    tags: [sponsors, presse]
    lieu: stade
    tone: strategique
    once: true
    text: "Le plateau du journal de vingt heures. Une canette orange à côté de ta main, l'étiquette vers la caméra. Le présentateur : « Sur la mort de Tibo Rancé, que dit la sélection ? »"
    left:
      label: "« Malaise cardiaque »"
      effects: {caisse: "+", direction: "+", set: [h7_fulgor_dit], outcome: dit}
      answer: "Deux mots, la canette dans le champ. Le lendemain, Desforges envoie une corbeille de fruits à l'hôtel, avec ta photo dedans."
    right:
      label: "Je pousse la canette"
      effects: {tribunes: "+", caisse: "-", set: [h7_canette_poussee], outcome: pousse}
      answer: "Du dos de la main, hors du champ. Tu ne dis rien d'autre. Le contrat de Fulgor a une clause pour ça ; Dauzat la lit."

  - id: sl.h7.f3_table_de_presse
    roles: [selectionneur]
    arc: argent
    tags: [sponsors, presse]
    lieu: stade
    tone: leger
    once: true
    text: "La table de presse de la Fédération, avant la conférence du mois : douze canettes orange alignées. Le photographe attend que tu t'assoies derrière, pour la photo."
    left:
      label: "Je m'assois"
      effects: {caisse: "+", direction: "+", outcome: dit}
      answer: "Tu t'assois. Sur la photo du lendemain, on ne voit de toi que les mains, entre deux canettes orange."
    right:
      label: "Je les fais enlever"
      effects: {direction: "-", tribunes: "+", outcome: pousse}
      answer: "Le photographe les range dans une caisse, une par une. Il reste un rond orange sur la nappe, que personne n'essuie."

  # ═════════════════════════════════════ 2012 · Le tarif de la chambre (Escande)
  - id: sl.h7.o1_offre
    roles: [selectionneur]
    arc: contrat
    tags: [direction, caisse]
    speaker: escande
    lieu: hotel
    tone: leger
    once: true
    text: "Monsieur Escande a fait monter du café dans le petit salon, celui des rideaux tirés : « Trois ans gratuits pour les Cobalts. Une condition : que le nom de l'hôtel ne sorte jamais avec l'incident. »"
    left:
      label: "La Fédération accepte"
      effects: {caisse: "++", tribunes: "-", set: [h7_hotel_gratuit]}
      answer: "Il signe le premier, d'un stylo de l'hôtel, et te le laisse. Dans le registre des tarifs, la 12 n'a plus de prix."
    right:
      label: "Nous paierons la note"
      effects: {caisse: "-", direction: "-", set: [h7_hotel_paye]}
      answer: "« Comme vous voudrez. » Il remporte le café. La note arrive le soir même : la 12 facturée vide, à demi-tarif."

  - id: sl.h7.o2_pilon
    roles: [selectionneur]
    arc: contrat
    tags: [direction]
    speaker: escande
    lieu: hotel
    tone: leger
    once: true
    text: "Monsieur Escande, au pied de l'escalier de service : « Les cahiers de nuit partent au pilon en janvier. Les archives, ça prend de la place, et Mme Lavergne écrit petit, mais beaucoup. »"
    left:
      label: "Gardez celui de 2011"
      effects: {direction: "-", relation: {sandrine: 1}, set: [h7_cahier_sauve]}
      answer: "Il tire un cahier de la pile sans chercher : il savait lequel. « Je le mets au coffre, avec les bijoux des clientes. »"
    right:
      label: "C'est votre hôtel"
      effects: {direction: "+", set: [h7_cahiers_pilon]}
      answer: "En janvier, la camionnette du pilon passe à six heures. Sandrine regarde partir les cartons depuis son fauteuil, sans se lever."

  - id: sl.h7.o3_plan
    roles: [selectionneur]
    arc: contrat
    tags: [direction]
    speaker: escande
    lieu: hotel
    tone: leger
    once: true
    text: "Escande te tend la note de la fenêtre, pliée en deux : « Le pompier est passé. La 12 n'est plus sur le plan d'évacuation, il a demandé pourquoi. Je lui ai dit qu'elle n'existait pas. »"
    left:
      label: "Remettez-la sur le plan"
      effects: {direction: "-", tribunes: "+", outcome: plan}
      answer: "« Comme vous voudrez. » Le lendemain, le plan est corrigé au feutre : un petit carré, sans numéro."
    right:
      label: "Elle n'existe pas"
      effects: {direction: "+", set: [h7_douze_effacee], outcome: effacee}
      answer: "Escande sourit, enfin. « Voilà. » Il replie la note et la range dans la poche de son gilet."

  # ═════════════════════════════════════════ 2012 · Le trombone rouge (Josiane)
  - id: sl.h7.j1_trombone
    roles: [selectionneur]
    arc: direction
    tags: [direction]
    speaker: josiane
    lieu: hotel
    tone: leger
    once: true
    text: "Madame Josiane, dans le salon de l'hôtel : « En mars 2011, vous aviez lu le premier dossier. La page trois manquait. Je l'ai cherchée tout l'été. Je n'ai trouvé que l'agrafe. »"
    left:
      label: "Qui l'avait enlevée ?"
      effects: {direction: "-", set: [h7_page_trois, h7_questions]}
      answer: "« Quelqu'un qui savait où était l'agrafeuse de la docteure. » Elle n'en dit pas plus, et range l'agrafe dans une enveloppe."
    right:
      label: "N'en parlons plus"
      effects: {direction: "+"}
      answer: "« Bien. » Elle referme son classeur. Sur la tranche, une étiquette neuve : RANCÉ, et rien d'autre."

  - id: sl.h7.j1_trombone_signees
    roles: [selectionneur]
    arc: direction
    tags: [direction]
    speaker: josiane
    lieu: hotel
    tone: leger
    once: true
    text: "Madame Josiane ouvre la main : le trombone rouge de mars 2011, qu'elle a gardé. « Je l'avais mis sur le premier dossier. Personne n'a soulevé la page. Vous voulez savoir ce qu'il y avait dessous ? »"
    left:
      label: "Qu'y avait-il dessous ?"
      effects: {direction: "-", set: [h7_page_trois, h7_questions]}
      answer: "« Rien. La page trois manquait déjà. Il tenait une page qui n'était plus là. » Elle repose le trombone dans ta main."
    right:
      label: "Rangez-le"
      effects: {direction: "+"}
      answer: "Elle le range dans sa poche, comme en mars 2011. Le même geste, à un an d'écart ; elle le sait, toi aussi."

  - id: sl.h7.j2_brouillon
    roles: [selectionneur]
    arc: direction
    tags: [direction]
    speaker: josiane
    lieu: hotel
    tone: strategique
    once: true
    text: "Madame Josiane baisse la voix, ce qu'elle ne fait jamais : « M. Dauzat m'a dicté le procès-verbal de la nuit à huit heures du matin. J'ai tapé « six heures » deux fois. J'ai gardé le brouillon. »"
    left:
      label: "Gardez-le"
      effects: {direction: "-", relation: {josiane: 1}, set: [h7_brouillon], outcome: brouillon}
      answer: "Elle le glisse dans son classeur, entre deux circulaires sur les frais de déplacement. « Là, personne ne lit. »"
    right:
      label: "Jetez-le"
      effects: {direction: "+", relation: {josiane: -1}, set: [h7_brouillon_jete], outcome: oubli}
      answer: "Elle le déchire en quatre, devant toi, et le jette dans la corbeille du salon. Puis elle reste là, à regarder la corbeille."

  - id: sl.h7.j3_dauzat
    roles: [selectionneur]
    arc: direction
    tags: [direction]
    speaker: dauzat
    lieu: hotel
    tone: strategique
    once: true
    text: "Aurélien Dauzat, de passage, s'arrête devant toi dans le hall : « On ne garde rien de cette nuit-là, {toi}. Les brouillons, c'est comme les rumeurs : ça ne signe rien. »"
    left:
      label: "Rien ne traîne"
      effects: {direction: "+"}
      answer: "« Bien. » Il repart vers sa voiture. Derrière la vitre du salon, Josiane n'a pas levé les yeux de sa machine."
    right:
      label: "Tout se garde"
      effects: {direction: "-", set: [h7_questions]}
      answer: "Il revient sur ses pas, très lentement. « Alors gardez-vous aussi. » Il le dit sans menace ; c'est le pire."

  - id: sl.h7.j3_dauzat_brouillon
    roles: [selectionneur]
    arc: direction
    tags: [direction]
    speaker: dauzat
    lieu: hotel
    tone: strategique
    once: true
    text: "Dauzat s'arrête devant Josiane et toi, dans le hall : « On me dit qu'un brouillon traîne, {toi}. Les brouillons, c'est comme les rumeurs : ça ne signe rien. Il traîne ? »"
    left:
      label: "Rien ne traîne"
      effects: {direction: "+", relation: {josiane: 1}}
      answer: "« Bien. » Josiane ne lève pas les yeux. Le brouillon est à vingt centimètres de lui, dans le classeur, entre deux circulaires."
    right:
      label: "Il est en lieu sûr"
      effects: {direction: "--", relation: {josiane: -1}, set: [h7_questions]}
      answer: "Dauzat regarde Josiane, puis toi, puis le classeur. Le lendemain, Josiane est mutée au service des licences, à la capitale."

  # ══════════════════════════════════════════════ 2013 · La docteure (Arzel)
  - id: sl.h7.d1_trombone_vert
    roles: [selectionneur]
    arc: corps
    tags: [direction]
    speaker: arzel
    lieu: hotel
    tone: leger
    once: true
    text: "Mars 2013. La docteure Arzel pose la pile des visites sur la table basse, un trombone vert sur celle du dessus : « Cette fois, vous lisez ? Je l'ai mis pour vous. »"
    left:
      label: "Je lis chaque page"
      effects: {direction: "-", set: [h7_lit_tout]}
      answer: "Vingt-six dossiers en deux jours. Il ne manque aucune page. Arzel te regarde lire comme on regarde quelqu'un creuser."
    right:
      label: "Je signe la pile"
      effects: {direction: "+", set: [h7_signe_encore]}
      answer: "Tu signes. Elle retire le trombone vert et le pose sur la table, à côté de ta main, comme une pièce de monnaie."

  - id: sl.h7.d2_mallette
    roles: [selectionneur]
    arc: corps
    tags: [vestiaire]
    speaker: rouvier
    lieu: cabinet
    tone: leger
    once: true
    text: "Nadia Rouvier, en refaisant un strapping : « La docteure ne lâche plus sa mallette, même au petit-déjeuner. Deux tours de clé. Elle a peur de quelqu'un, ou de ce qu'il y a dedans. »"
    left:
      label: "Demande-lui de quoi"
      effects: {vestiaire: "-", set: [h7_mallette_demandee]}
      answer: "Le soir, Rouvier revient : « Elle dit : de vous. » Elle serre le strapping un peu trop fort, et s'excuse."
    right:
      label: "Laisse-la tranquille"
      effects: {vestiaire: "+"}
      answer: "« Elle l'est. C'est ça, le problème. » Rouvier coupe le sparadrap avec les dents, comme toujours."

  - id: sl.h7.d3_lettre
    roles: [selectionneur]
    arc: corps
    tags: [direction]
    speaker: arzel
    lieu: hotel
    tone: strategique
    once: true
    text: "La docteure Arzel te tend une lettre ouverte : « Démission, pour raisons personnelles, à compter de décembre. Il me faut votre signature en dessous. Vous savez signer en dessous, {toi}. »"
    left:
      label: "Je signe"
      effects: {direction: "+", set: [h7_demission_signee], outcome: lettre}
      answer: "Tu signes sous la sienne. Elle souffle sur ton encre, longtemps, comme on souffle sur une soupe trop chaude."
    right:
      label: "Pas avant le match"
      effects: {direction: "-", set: [h7_demission_refusee], outcome: reste}
      answer: "Elle replie la lettre et la remet dans la mallette, deux tours. « Après le match, alors. Vous dites ça souvent. »"

  # ══════════════════════════════════════════ 2013 · Le procès-verbal (Dauzat)
  - id: sl.h7.v_registre
    roles: [selectionneur]
    arc: instances
    tags: [direction]
    speaker: dauzat
    lieu: hotel
    tone: strategique
    once: true
    text: "Aurélien Dauzat ouvre un registre noir sur le guéridon du hall : « Quatre heures : malaise cardiaque, constaté à six heures. Les procès-verbaux ne mentent pas. On leur fait dire ce qu'on a décidé. »"
    left:
      label: "Je veux une copie"
      effects: {direction: "-", set: [h7_copie_pv], outcome: copie}
      answer: "Il photocopie la page lui-même au bureau de la réception, et te la tend encore tiède. « Elle n'en dit pas plus que l'original. »"
    right:
      label: "Gardez votre registre"
      effects: {direction: "+", set: [h7_registre_ferme], outcome: registre}
      answer: "Il referme le registre d'un coup sec. La poussière de la reliure reste un moment en l'air, dans la lumière du hall."

  # Le registre lu sur ce qu'on a dit à la police (« La nuit du 14 », 2012), ou
  # sur le brouillon jeté (« Le trombone rouge », 2012).
  - id: sl.h7.v_registre_police
    roles: [selectionneur]
    arc: instances
    tags: [direction]
    speaker: dauzat
    lieu: hotel
    tone: strategique
    once: true
    text: "Dauzat ouvre le registre noir sur le guéridon. En marge, un tampon de la police : « Quatre heures : malaise, constaté à six heures. Vous leur avez dit qu'il existait. Il ment quand même, {toi}. »"
    left:
      label: "Je veux une copie"
      effects: {direction: "-", set: [h7_copie_pv], outcome: copie}
      answer: "« La police en a une. » Il photocopie la page quand même, tampon compris, et te la tend encore tiède."
    right:
      label: "Gardez votre registre"
      effects: {direction: "+", set: [h7_registre_ferme], outcome: registre}
      answer: "« Ils l'ont lu. Maintenant, il est à moi. » Il le referme d'un coup sec ; la poussière de la reliure reste en l'air."

  - id: sl.h7.v_registre_brouillon
    roles: [selectionneur]
    arc: instances
    tags: [direction]
    speaker: dauzat
    lieu: hotel
    tone: strategique
    once: true
    text: "Dauzat ouvre un registre noir sur le guéridon : « Le brouillon est parti à la corbeille, à votre demande. Pas ceci. Quatre heures : malaise, constaté à six heures. Ça ne ment pas : ça obéit. »"
    left:
      label: "Je veux une copie"
      effects: {direction: "-", set: [h7_copie_pv], outcome: copie}
      answer: "Il photocopie la page lui-même, à la réception, et te la tend encore tiède. « Gardez-la mieux que le brouillon. »"
    right:
      label: "Gardez votre registre"
      effects: {direction: "+", set: [h7_registre_ferme], outcome: registre}
      answer: "Il referme le registre d'un coup sec. « Vous jetez, je garde. On s'entend bien, {toi}. »"

  - id: sl.h7.v_berline
    roles: [selectionneur]
    arc: direction
    tags: [direction]
    speaker: aulard
    statut_ok: [parti]
    lieu: rue
    tone: leger
    once: true
    text: "Le quai, devant l'hôtel. Vaubourg, déposé par la tutelle, baisse la vitre de sa berline : « Ils m'ont dissous, comme un comité. Le registre est resté à Dauzat. Moi, je suis resté dans la voiture. »"
    left:
      label: "Vous avez choisi l'heure"
      effects: {tribunes: "+", relation: {aulard: -1}, set: [h7_berline_heure]}
      answer: "« J'ai choisi six heures parce qu'en novembre, à six heures, il fait encore nuit. » Il remonte la vitre."
    right:
      label: "Rentrez chez vous"
      effects: {direction: "+", set: [h7_berline_chez_lui]}
      answer: "« Je n'ai plus que ça à faire. » La berline démarre. Au bout du quai, elle s'arrête longtemps devant le fleuriste."

  - id: sl.h7.v_envoi
    roles: [selectionneur]
    arc: instances
    tags: [direction]
    speaker: dauzat
    lieu: hotel
    tone: strategique
    once: true
    text: "Dauzat range le registre dans une serviette neuve : « Le ministre veut les procès-verbaux de 2011. Tous. Je les envoie tous, ou tous sauf un ? C'est vous qui signez le bordereau. »"
    left:
      label: "Envoyez-les tous"
      effects: {direction: "-", tribunes: "+", set: [h7_registre_envoye]}
      answer: "Il compte les procès-verbaux en mouillant son pouce, quarante et un, et te tend le bordereau. Ta signature est la dernière de la page."
    right:
      label: "Tous sauf un"
      effects: {direction: "+", set: [h7_registre_garde]}
      answer: "Il en retire un sans chercher et le glisse dans sa poche intérieure. « Quarante. » Tu signes le bordereau de quarante."

  - id: sl.h7.v_source
    roles: [selectionneur]
    arc: instances
    tags: [direction, presse]
    speaker: dauzat
    lieu: hotel
    tone: strategique
    once: true
    text: "Dauzat, en refermant le registre : « Deux heures vingt-cinq, c'est moi qui l'ai donné à Rossard. Il fallait un nom pour qu'on cesse de chercher une heure. Ça a marché, non ? »"
    left:
      label: "Vous l'avez sacrifié"
      effects: {direction: "-", relation: {mbako: 1}, set: [h7_rossard_source]}
      answer: "« Je l'ai prêté. » Il boucle la serviette. « À la Fédération, on rend toujours ce qu'on prête. Avec les intérêts. »"
    right:
      label: "Ça a marché"
      effects: {direction: "+", relation: {mbako: -1}, set: [h7_rossard_source]}
      answer: "« Voilà. » Il te serre la main ; tu sens l'encre du registre sur ses doigts. Elle ne part pas au lavage."

  # ════════════════════════════════════════════ 2013 · La mère (Madame Rancé)
  - id: sl.h7.x1_standard
    roles: [selectionneur]
    arc: famille
    tags: [famille]
    speaker: rance_mere
    lieu: hotel
    tone: strategique
    once: true
    text: "Trois heures du matin. Le standard te passe une voix de femme, calme, très réveillée : « Passez-moi la 12. C'est sa mère. Je sais l'heure qu'il est. »"
    left:
      label: "Je vous écoute"
      effects: {relation: {rance_mere: 1}, set: [h7_mere_standard]}
      answer: "Elle ne pleure pas. Elle demande s'il faisait froid dans la 12, la nuit du 14. Tu dis non. Elle dit : « Il avait toujours froid. »"
    right:
      label: "Il est trois heures"
      effects: {relation: {rance_mere: -1}, set: [h7_mere_standard]}
      answer: "« Je sais. C'est l'heure où il m'appelait, de toutes les chambres d'hôtel. » Elle raccroche la première."

  # Les appels de trois heures de 2011 (« Le pull bleu »).
  - id: sl.h7.x1_standard_appels
    roles: [selectionneur]
    arc: famille
    tags: [famille]
    speaker: rance_mere
    lieu: hotel
    tone: strategique
    once: true
    text: "Trois heures du matin. Le standard te passe une voix de femme, très réveillée : « Passez-moi la 12. C'est sa mère. Vous saviez qu'il m'appelait à cette heure-là. Vous le saviez. »"
    left:
      label: "Je vous écoute"
      effects: {relation: {rance_mere: 1}, set: [h7_mere_standard]}
      answer: "Elle ne pleure pas. Elle te demande ce qu'il disait au petit-déjeuner, les lendemains d'appel. Tu lui dis qu'il rougissait."
    right:
      label: "Il est trois heures"
      effects: {relation: {rance_mere: -1}, set: [h7_mere_standard]}
      answer: "« Je sais. Sept minutes, c'était notre durée. » Elle reste en ligne sept minutes sans parler, puis raccroche."

  - id: sl.h7.x1_standard_tus
    roles: [selectionneur]
    arc: famille
    tags: [famille]
    speaker: rance_mere
    lieu: hotel
    tone: strategique
    once: true
    text: "Trois heures du matin. Le standard te passe une voix de femme : « Passez-moi la 12. C'est sa mère. À l'hôtel, quelqu'un trouvait que ses appels ne regardaient que lui. C'était vous ? »"
    left:
      label: "Je vous écoute"
      effects: {relation: {rance_mere: 1}, set: [h7_mere_standard]}
      answer: "« Alors écoutez. » Elle raconte trois heures du matin, de toutes les chambres d'hôtel, depuis ses quinze ans. Ça dure sept minutes."
    right:
      label: "Il est trois heures"
      effects: {relation: {rance_mere: -1}, set: [h7_mere_standard]}
      answer: "« Je sais l'heure. Lui aussi la savait. » Elle raccroche la première, comme il le faisait."

  - id: sl.h7.x3_double
    roles: [selectionneur]
    arc: famille
    tags: [famille]
    speaker: sandrine
    lieu: hotel
    tone: strategique
    once: true
    when: "slot <= 14"
    text: "Sandrine Lavergne sort de son tiroir le double de la 12 et le pose à plat sur le comptoir : « Sa mère me l'a demandé pour la dernière nuit. Je ne donne jamais les doubles. Vous me dites oui ? »"
    left:
      label: "Donnez-le-lui"
      effects: {relation: {rance_mere: 1, sandrine: 1}, set: [h7_double_mere], outcome: ouverte}
      answer: "Sandrine écrit dans son cahier : « double du 12 à Mme Rancé », l'heure, et, pour une fois, sa propre signature."
    right:
      label: "Rangez-le au tiroir"
      effects: {direction: "+", set: [h7_double_refuse], outcome: fermee}
      answer: "Le double retourne au tiroir. La mère attend dans le hall jusqu'au matin, sur la banquette, son sac sur les genoux."

  # ═══════════════════════════════════════════ 2013 · Dans cet ordre (Fauvel)
  - id: sl.h7.k1_lettre
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire, presse]
    speaker: fauvel
    lieu: hotel
    tone: strategique
    once: true
    text: "Karim Fauvel, dans le hall, une lettre anonyme à la main : « 2 h 10, le double, Mbako. On l'a glissée sous vingt-six portes. Je défends mes joueurs, {toi}, et la vérité. Dans cet ordre. »"
    left:
      label: "Défendez Mbako"
      effects: {vestiaire: "+", relation: {fauvel: 1, mbako: 1}, set: [h7_mbako_defendu]}
      answer: "« C'est déjà fait. » Il plie la lettre en quatre. « Je venais savoir si vous, vous le défendiez. »"
    right:
      label: "La vérité d'abord"
      effects: {direction: "-", tribunes: "+", relation: {fauvel: -1}, set: [h7_verite_dabord]}
      answer: "Il te regarde longtemps. « Alors on n'est pas dans le même ordre. Mais on va au même endroit. »"

  # La prime de 2010 revient deux ans plus tard (le brassard, 2011).
  - id: sl.h7.k1_lettre_note
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire, presse]
    speaker: fauvel
    lieu: hotel
    tone: strategique
    once: true
    text: "Fauvel pose deux lettres sur le comptoir : la sienne de 2011, « noté » au bas, et une anonyme, « 2 h 10, le double, Mbako ». « Je défends mes joueurs, {toi}, et la vérité. Dans cet ordre. »"
    left:
      label: "Défendez Mbako"
      effects: {vestiaire: "+", relation: {fauvel: 1, mbako: 1}, set: [h7_mbako_defendu]}
      answer: "« C'est déjà fait. » Il reprend l'anonyme. La sienne, il la laisse sur le comptoir : « Ça, c'est ce que j'avais noté. »"
    right:
      label: "La vérité d'abord"
      effects: {direction: "-", tribunes: "+", relation: {fauvel: -1}, set: [h7_verite_dabord]}
      answer: "« Vous, la vérité d'abord ? » Il souligne « noté » une deuxième fois, devant toi, et repart avec les deux lettres."

  - id: sl.h7.k1_lettre_prime
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire, presse]
    speaker: fauvel
    lieu: hotel
    tone: strategique
    once: true
    text: "Fauvel, une lettre anonyme à la main : « 2 h 10, le double, Mbako », glissée sous vingt-six portes. « Vous avez payé la prime de 2010, {toi}. Ça ne change pas l'ordre : mes joueurs, puis la vérité. »"
    left:
      label: "Défendez Mbako"
      effects: {vestiaire: "+", relation: {fauvel: 1, mbako: 1}, set: [h7_mbako_defendu]}
      answer: "« C'est déjà fait. Avec votre prime, il s'est payé un avocat. » Il plie la lettre en quatre et la glisse dans sa poche."
    right:
      label: "La vérité d'abord"
      effects: {direction: "-", tribunes: "+", relation: {fauvel: -1}, set: [h7_verite_dabord]}
      answer: "Il te regarde longtemps. « Alors on n'est pas dans le même ordre. Mais vous, au moins, vous payez vos dettes. »"

  - id: sl.h7.k2_main
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: mbako
    lieu: hotel
    tone: leger
    once: true
    text: "Mbako, dans le couloir du deuxième, devant la porte de la 12 : « Fauvel veut un vote. Vingt-six mains levées pour dire la nuit. Il dit que si je lève la mienne, les autres suivront. »"
    left:
      label: "Lève-la"
      effects: {vestiaire: "+", relation: {mbako: 1}, set: [h7_mbako_main]}
      answer: "Il regarde sa main, la retourne, comme pour vérifier qu'elle est à lui. « La dernière fois que je l'ai levée, c'était dans le bus. »"
    right:
      label: "Garde-la baissée"
      effects: {direction: "+", relation: {mbako: -1}}
      answer: "« C'est ce que je fais depuis deux ans. » Il remet les mains dans ses poches et rentre dans la 14."

  - id: sl.h7.k3_vote
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire]
    lieu: hotel
    tone: strategique
    once: true
    text: "La salle du petit-déjeuner, tables poussées contre les murs. Fauvel fait voter : « Qui veut qu'on dise la nuit du 14 ? » Les mains montent, une par une. Tu es debout près de la porte."
    left:
      label: "Je lève la mienne"
      effects: {vestiaire: "++", direction: "--", set: [h7_vote_verite], outcome: vote}
      answer: "Vingt-six mains, et la tienne. Fauvel écrit le chiffre sur la nappe en papier ; à la réception, Sandrine note l'heure."
    right:
      label: "On arrête ce vote"
      effects: {vestiaire: "--", direction: "+", set: [h7_vote_refuse], outcome: liste}
      answer: "Les mains redescendent, plus lentement qu'elles ne sont montées. Mbako garde la sienne en l'air jusqu'au bout."

  # Le bracelet de Valdorne, coupé en 2012 (« La main ») : le poignet nu revient.
  - id: sl.h7.k3_vote_poignet
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire]
    lieu: hotel
    tone: strategique
    once: true
    text: "La salle du petit-déjeuner, tables contre les murs. Fauvel compte : « Qui veut qu'on dise la nuit du 14 ? » Les mains montent, une par une. Ferrol garde les siennes sous la table, le poignet nu."
    left:
      label: "Je lève la mienne"
      effects: {vestiaire: "++", direction: "--", set: [h7_vote_verite], outcome: vote}
      answer: "Ferrol lève la sienne après toi, le dernier. Fauvel écrit le chiffre sur la nappe en papier ; à la réception, Sandrine note l'heure."
    right:
      label: "On arrête ce vote"
      effects: {vestiaire: "--", direction: "+", set: [h7_vote_refuse], outcome: liste}
      answer: "Les mains redescendent. Ferrol, qui n'avait rien levé, se frotte le poignet, à l'endroit où il y avait un bracelet."
