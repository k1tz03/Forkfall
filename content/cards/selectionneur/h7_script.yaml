    text: "Mars 2013, la Fédération sous tutelle. Le comité provisoire a repris l'appartement du quai. Monsieur Escande pose sur le comptoir la seule clé libre : la 11. « Le mur est mitoyen avec la 12. »"
    left:
      label: "Je prends la 11"
      effects: {caisse: "-", set: [h7_appartement_repris], var: {saisie_logement: "+1"}, char: {aulard: {statut: parti}}, schedule: [{card: sl.h7.x1_standard, in: [2, 3]}]}
