# Histoire 7 · Chambre 12 — les ancres du script (arc `sl.h7.chambre_douze`,
# content/arcs/selectionneur/h7_script.yaml). Cartes d'étape : elles ne sortent
# jamais du sac, seulement à leur créneau. `arc:` est le thème de la carte.
#
# 2011 · la nuit — le brassard (1) ; la liste de novembre (12-13) ; 2 h 10
#   (15, le seul soir de l'année) ; quatre heures (16) ; les scellés (17), suivis
#   de « Passez-moi la 12 » (réaction, content/cards/selectionneur/h7_reactions.yaml).
# 2012 · les portes — la plante devant la 12 (1-2) ; le cahier de nuit
#   (12-13) ; le bus, la nuit (17).
# 2013 · les signatures — la 11 (1) ; la copie (10) ; la valise (13, suivie de
#   six heures du matin) ; la 12 et la mère (15, la seule carte `drame` de la
#   carrière) ; le dernier tableau (16, la fin rare) ; la conférence (17).
# 2014 · la gerbe (1) : la fin « Malaise cardiaque » de qui a parlé du groupe.
#
# La mort de la chambre 12 n'est jamais montrée : des pas au-dessus d'un
# plafond, un téléphone, une docteure assise au bord d'un lit, les mains qui ne
# font plus rien. La violence est le lendemain : la cire, le registre, la plante.
cards:
  # ═════════════════════════════════════════════════ 2011 · A1 · le brassard
  - id: sl.h7.a1_brassard
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire]
    lieu: hotel
    tone: strategique
    once: true
    text: "Le salon de l'hôtel, avant le premier entraînement. Lian Mbako garde le brassard de 2010 au fond de sa poche ; Yanis Ferrol attend à l'autre bout, près de la fenêtre. Tous deux te regardent."
    left:
      label: "Mbako, une dernière fois"
      effects: {vestiaire: "+", direction: "-", relation: {mbako: 1, ferrol: -1}, set: [h7_capitaine_mbako, h7_capitaine_choisi], react: {card: sl.h7.re.ferrol_bracelet, chance: 0.5}}
      answer: "Mbako sort le brassard ; il est plié comme en 2010. Ferrol fait tourner son bracelet rouge et noir autour du poignet, deux tours."
    right:
      label: "Ferrol, pour la suite"
      effects: {tribunes: "+", vestiaire: "-", relation: {ferrol: 1, mbako: -1}, set: [h7_capitaine_ferrol, h7_capitaine_choisi], react: {card: sl.h7.re.mbako_fenetre, chance: 0.5}}
      answer: "Mbako pose le vieux brassard sur la table basse et va s'asseoir sous la fenêtre. Ferrol le ramasse, le secoue pour le déplier et l'enfile au bras."

  - id: sl.h7.a1_brassard_presse
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire, presse]
    lieu: hotel
    tone: strategique
    once: true
    text: "Le salon de l'hôtel. Une caméra de Télé-Stade attend derrière la vitre du hall. Mbako garde le brassard de 2010 au fond de sa poche ; Ferrol, près de la fenêtre, regarde l'objectif."
    left:
      label: "Mbako, une dernière fois"
      effects: {vestiaire: "+", direction: "-", relation: {mbako: 1, ferrol: -1}, set: [h7_capitaine_mbako, h7_capitaine_choisi], react: {card: sl.h7.re.ferrol_bracelet, chance: 0.5}}
      answer: "Mbako sort le brassard devant la vitre ; il est plié comme en 2010. Le soir, Télé-Stade passe l'image de {nom} au ralenti, sans le son."
    right:
      label: "Ferrol, pour la suite"
      effects: {tribunes: "+", vestiaire: "-", relation: {ferrol: 1, mbako: -1}, set: [h7_capitaine_ferrol, h7_capitaine_choisi], react: {card: sl.h7.re.mbako_fenetre, chance: 0.5}}
      answer: "Ferrol prend le brassard face à la caméra. Mbako est déjà assis sous la fenêtre ; au montage, on le coupe."

  - id: sl.h7.a1_brassard_mutins
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire]
    speaker: fauvel
    lieu: hotel
    tone: strategique
    once: true
    text: "Karim Fauvel, du syndicat, s'est assis entre les deux : Mbako, le brassard de 2010 dans la poche, et Ferrol, le nouveau. « Choisissez, {toi}. Le syndicat notera lequel, et pourquoi. »"
    left:
      label: "Mbako, une dernière fois"
      effects: {vestiaire: "+", direction: "-", relation: {mbako: 1, ferrol: -1, fauvel: 1}, set: [h7_capitaine_mbako, h7_capitaine_choisi], react: {card: sl.h7.re.ferrol_bracelet, chance: 0.5}}
      answer: "Fauvel écrit « {nom} : Mbako » et souligne. Ferrol fait tourner son bracelet rouge et noir autour du poignet, deux tours, puis trois."
    right:
      label: "Ferrol, pour la suite"
      effects: {tribunes: "+", vestiaire: "-", relation: {ferrol: 1, mbako: -1, fauvel: -1}, set: [h7_capitaine_ferrol, h7_capitaine_choisi], react: {card: sl.h7.re.mbako_fenetre, chance: 0.5}}
      answer: "Fauvel écrit « Ferrol », puis, plus bas, « 2010 », et referme son carnet. Mbako va s'asseoir sous la fenêtre."

  # ════════════════════════════════════════════ 2011 · A2 · la liste (12-13)
  - id: sl.h7.a2_liste
    roles: [selectionneur]
    arc: corps
    tags: [vestiaire, direction]
    speaker: arzel
    lieu: hotel
    tone: strategique
    once: true
    text: "L'automne, la liste de novembre sur la table. La docteure Arzel trace un cercle au crayon autour d'un nom : « Rancé est fatigué. Laissez-le chez lui en novembre. Ne me demandez pas pourquoi. »"
    left:
      label: "Je le laisse chez lui"
      effects: {direction: "-", set: [h7_rance_ecarte, h7_vaubourg_remet], react: {card: sl.h7.re.josiane_deux_listes, chance: 0.6}}
      answer: "Tu le rayes. Le lendemain, la liste revient de la présidence, le nom rajouté à la main : « Le petit est d'ici. Le barrage aussi. »"
    right:
      label: "Il vient en novembre"
      effects: {vestiaire: "+", set: [h7_rance_garde]}
      answer: "Elle gomme le cercle jusqu'à ce qu'il n'en reste qu'une trace grise. « Alors soixante minutes. Pas une de plus. »"

  - id: sl.h7.a2_liste_soixante
    roles: [selectionneur]
    arc: corps
    tags: [vestiaire, direction]
    speaker: arzel
    lieu: hotel
    tone: strategique
    once: true
    text: "L'automne, la liste de novembre sur la table. Arzel trace un cercle au crayon autour d'un nom : « Vous m'aviez demandé pourquoi soixante. Pour novembre, ce sera zéro. Laissez Rancé chez lui. »"
    left:
      label: "Je le laisse chez lui"
      effects: {direction: "-", set: [h7_rance_ecarte, h7_vaubourg_remet], react: {card: sl.h7.re.josiane_deux_listes, chance: 0.6}}
      answer: "Tu le rayes. Deux jours plus tard, la liste revient de la présidence, le nom rajouté à l'encre : « Le petit est d'ici. Le barrage aussi. »"
    right:
      label: "Il vient en novembre"
      effects: {vestiaire: "+", set: [h7_rance_garde]}
      answer: "« Alors soixante, et c'est vous qui signerez la feuille de match. » Elle gomme son cercle et souffle sur les miettes de gomme."

  # La côte du Corner (l'événement « Le Corner ») : quelqu'un l'a dit à la docteure.
  - id: sl.h7.a2_liste_cote
    roles: [selectionneur]
    arc: corps
    tags: [vestiaire, direction]
    speaker: arzel
    lieu: hotel
    tone: strategique
    once: true
    text: "L'automne, la liste de novembre sur la table. Arzel trace un cercle au crayon autour d'un nom : « On me dit qu'il s'arrête dans les côtes, la nuit, la main sur la poitrine. Laissez Rancé chez lui. »"
    left:
      label: "Je le laisse chez lui"
      effects: {direction: "-", set: [h7_rance_ecarte, h7_vaubourg_remet], react: {card: sl.h7.re.josiane_deux_listes, chance: 0.6}}
      answer: "Tu le rayes. Le lendemain, la liste revient de la présidence, le nom rajouté à la main : « Le petit est d'ici. Le barrage aussi. »"
    right:
      label: "Il vient en novembre"
      effects: {vestiaire: "+", set: [h7_rance_garde]}
      answer: "« C'était la côte, il vous a dit ? » Elle gomme le cercle, lentement. « Alors soixante minutes. Et pas de côtes. »"

  # ═══════════════════════════════════════════ 2011 · A3 · 2 h 10 (le soir)
  - id: sl.h7.a3_deux_heures_dix
    roles: [selectionneur]
    arc: corps
    tags: [vestiaire, sombre]
    speaker: sandrine
    lieu: hotel
    tone: strategique
    once: true
    text: "Novembre, la troisième nuit. Au-dessus de ta chambre, des pas, une porte, puis plus rien. À 2 h 30, le téléphone. Sandrine Lavergne : « Montez au 12. La docteure est déjà là. »"
    left:
      label: "J'y monte"
      effects: {vestiaire: "-", set: [h7_rance_mort, h7_monte_au_douze], char: {tibo_rance: {statut: mort}}}
      answer: "La porte de la 12 est ouverte. Arzel est assise au bord du lit, les mains qui ne font plus rien. Au fond du couloir, la 14 est entrouverte."
    right:
      label: "J'appelle la police"
      effects: {direction: "-", set: [h7_rance_mort, h7_police_appelee], char: {tibo_rance: {statut: mort}}}
      answer: "Le standard de l'hôtel sonne dans le vide. À 2 h 41, tu appelles de ta chambre ; une voix d'homme prend ton nom et l'adresse."

  - id: sl.h7.a3_deux_heures_dix_quinze
    roles: [selectionneur]
    arc: corps
    tags: [vestiaire, sombre]
    speaker: sandrine
    lieu: hotel
    tone: strategique
    once: true
    text: "Novembre, la troisième nuit. Dans la 15, au bout du couloir, tu n'entends rien. À 2 h 30, le téléphone te réveille. Sandrine : « Allez à la 12, trois portes avant la vôtre. La docteure y est. »"
    left:
      label: "J'y vais"
      effects: {vestiaire: "-", set: [h7_rance_mort, h7_monte_au_douze], char: {tibo_rance: {statut: mort}}}
      answer: "Trois portes. La 12 est ouverte ; Arzel est assise au bord du lit, les mains à plat sur les genoux. En face, la 14 est entrouverte."
    right:
      label: "J'appelle la police"
      effects: {direction: "-", set: [h7_rance_mort, h7_police_appelee], char: {tibo_rance: {statut: mort}}}
      answer: "Le standard de l'hôtel ne répond pas. À 2 h 41, tu appelles de ta chambre ; une voix d'homme prend ton nom, l'adresse, et l'heure."

  # ═══════════════════════════════════════ 2011 · A4 · quatre heures (16)
  - id: sl.h7.a4_quatre_heures
    roles: [selectionneur]
    arc: direction
    tags: [direction]
    speaker: aulard
    lieu: hotel
    tone: strategique
    once: true
    text: "Quatre heures, le petit salon, rideaux tirés. Vaubourg en robe de chambre, Dauzat et son bloc, Arzel les mains vides : « Malaise cardiaque, constaté à six heures par la kiné. On joue. D'accord ? »"
    left:
      label: "Je suis d'accord"
      effects: {direction: "++", vestiaire: "-", set: [h7_quatre_heures_accord], react: {card: sl.h7.re.rouvier_six_heures}}
      answer: "Dauzat écrit l'heure en haut de la page : 4 h 12. Vaubourg prend ta main dans les deux siennes et la garde, comme à un enterrement."
    right:
      label: "Je veux la police"
      effects: {direction: "--", vestiaire: "+", set: [h7_quatre_heures_refus]}
      answer: "« Elle viendra à six heures, comme tout le monde. » Dauzat écrit quand même ta phrase, en bas de la page, plus petit."

  - id: sl.h7.a4_quatre_heures_police
    roles: [selectionneur]
    arc: direction
    tags: [direction]
    speaker: aulard
    lieu: hotel
    tone: strategique
    once: true
    text: "Quatre heures, le petit salon. Vaubourg en robe de chambre : « Vous avez appelé la police à 2 h 41. L'hôtel n'a aucune trace d'appel. Six heures, la kiné, un malaise. D'accord ? »"
    left:
      label: "Je suis d'accord"
      effects: {direction: "++", vestiaire: "-", set: [h7_quatre_heures_accord], react: {card: sl.h7.re.rouvier_six_heures}}
      answer: "Dauzat écrit 4 h 12 en haut de la page, et rien sur 2 h 41. Vaubourg prend ta main dans les deux siennes, longtemps."
    right:
      label: "J'ai appelé, je maintiens"
      effects: {direction: "--", vestiaire: "+", set: [h7_quatre_heures_refus]}
      answer: "« Alors elle viendra. À six heures. » Dauzat écrit 2 h 41 dans la marge, puis le barre d'un trait propre, à la règle."

  # Le réveil de six heures (le rituel de 2011) : l'heure de la découverte est
  # celle où la réception appelle la 12 tous les matins. Ils le savent.
  - id: sl.h7.a4_quatre_heures_reveil
    roles: [selectionneur]
    arc: direction
    tags: [direction]
    speaker: aulard
    lieu: hotel
    tone: strategique
    once: true
    text: "Quatre heures, le petit salon. Vaubourg en robe de chambre, Arzel les mains vides : « La réception l'appelle à six heures, tous les matins. Elle appellera, la kiné montera. On joue. D'accord ? »"
    left:
      label: "Je suis d'accord"
      effects: {direction: "++", vestiaire: "-", set: [h7_quatre_heures_accord], react: {card: sl.h7.re.rouvier_six_heures}}
      answer: "Dauzat écrit 4 h 12 en haut de la page, puis « 6 h, appel de la réception ». Sandrine ne le saura qu'en lisant le procès-verbal."
    right:
      label: "Je veux la police"
      effects: {direction: "--", vestiaire: "+", set: [h7_quatre_heures_refus]}
      answer: "« La police viendra après l'appel de six heures. » Dauzat écrit ta phrase en bas de la page, plus petit, sous le mot réveil."

  # ═══════════════════════════════════════════ 2011 · A5 · les scellés (17)
  - id: sl.h7.a5_scelles
    roles: [selectionneur]
    arc: instances
    tags: [direction, vestiaire]
    speaker: benali
    lieu: hotel
    tone: strategique
    once: true
    text: "Le couloir du deuxième, sept heures. La commandante Benali pose les scellés sur la 12, puis se retourne. « Personne sort avant ce soir. Vous jouez samedi ? Moi, je travaille samedi. »"
    left:
      label: "On jouera"
      effects: {direction: "+", vestiaire: "-", set: [h7_benali_ici], react: [{card: sl.h7.re.fardelli_standard_dort, if: "flag('h7_standard_filtre')"}, {card: sl.h7.re.fardelli_standard}]}
      answer: "« Alors je les entends ici, un par un, avant le car. » Elle prend la salle du petit-déjeuner ; les croissants restent sur la desserte."
    right:
      label: "On ne jouera pas"
      effects: {direction: "--", vestiaire: "+", tribunes: "+", set: [h7_report_demande], react: [{card: sl.h7.re.fardelli_standard_dort, if: "flag('h7_standard_filtre')"}, {card: sl.h7.re.fardelli_standard}]}
      answer: "À neuf heures, Vaubourg rappelle : on jouera. Benali note l'heure de l'appel dans son carnet, sans te demander qui c'était."

  - id: sl.h7.a5_scelles_refus
    roles: [selectionneur]
    arc: instances
    tags: [direction, vestiaire]
    speaker: benali
    lieu: hotel
    tone: strategique
    once: true
    text: "Le couloir du deuxième, sept heures. Benali scelle la 12 : « On me dit, {toi}, que vous vouliez la police à quatre heures. Elle est là. Vous jouez samedi ? Moi, je travaille samedi. »"
    left:
      label: "On jouera"
      effects: {direction: "+", vestiaire: "-", set: [h7_benali_ici], react: [{card: sl.h7.re.fardelli_standard_dort, if: "flag('h7_standard_filtre')"}, {card: sl.h7.re.fardelli_standard}]}
      answer: "« Alors je les entends ici, avant le car. » Elle commence par toi, dans la salle du petit-déjeuner, et note l'heure de chaque réponse."
    right:
      label: "On ne jouera pas"
      effects: {direction: "--", vestiaire: "+", tribunes: "+", set: [h7_report_demande], react: [{card: sl.h7.re.fardelli_standard_dort, if: "flag('h7_standard_filtre')"}, {card: sl.h7.re.fardelli_standard}]}
      answer: "À neuf heures, Vaubourg rappelle : on jouera. Benali l'écrit sous ta demande de quatre heures, avec la même encre."

  # ═══════════════════════════════════════ 2012 · R1 · les portes (1-2)
  - id: sl.h7.r1_portes_gagne
    roles: [selectionneur]
    arc: selection
    tags: [vestiaire, direction]
    speaker: escande
    lieu: hotel
    tone: leger
    once: true
    text: "Mars 2012. Les Cobalts qualifiés reviennent au deuxième. Une grande plante cache la porte de la 12. Escande : « Nous ne louons plus la 12. À vrai dire, nous ne la louions pas beaucoup avant. »"
    left:
      label: "Enlevez cette plante"
      effects: {vestiaire: "+", set: [h7_barrage_gagne, h7_plante_enlevee], schedule: [{card: sl.h7.m1_photo, in: [2, 4]}]}
      answer: "Il la fait porter dans le hall. Toute la fenêtre, les joueurs passent devant le numéro en accélérant, comme devant un chien."
    right:
      label: "Laissez-la"
      effects: {direction: "+", set: [h7_barrage_gagne, h7_plante], react: {card: sl.h7.re.sandrine_plante, chance: 0.5}, schedule: [{card: sl.h7.m1_photo, in: [2, 4]}]}
      answer: "La plante reste devant la porte. Les joueurs la contournent sans la toucher, comme on contourne quelqu'un qui dort."

  - id: sl.h7.r1_portes_perdu
    roles: [selectionneur]
    arc: selection
    tags: [vestiaire, direction]
    speaker: escande
    lieu: hotel
    tone: leger
    once: true
    text: "Mars 2012. Éliminés, les Cobalts reviennent quand même au deuxième. Une plante cache la porte de la 12. Escande : « Nous ne louons plus la 12. À vrai dire, nous ne la louions pas beaucoup avant. »"
    left:
      label: "Enlevez cette plante"
      effects: {vestiaire: "+", set: [h7_barrage_perdu, h7_plante_enlevee], schedule: [{card: sl.h7.m1_photo, in: [2, 4]}]}
      answer: "On la porte dans le hall. Le numéro reparaît, en laiton terni. Le premier soir, quelqu'un a collé un 26 au feutre en dessous."
    right:
      label: "Laissez-la"
      effects: {direction: "+", set: [h7_barrage_perdu, h7_plante], react: {card: sl.h7.re.sandrine_plante, chance: 0.5}, schedule: [{card: sl.h7.m1_photo, in: [2, 4]}]}
      answer: "La plante reste. Le soir même, Lascombe, le gardien remplaçant, demande à changer de chambre : la 11 touche la 12."

  # ═══════════════════════════════════ 2012 · R2 · le cahier de nuit (12-13)
  - id: sl.h7.r2_cahier
    roles: [selectionneur]
    arc: instances
    tags: [vestiaire, direction]
    speaker: sandrine
    lieu: hotel
    tone: strategique
    once: true
    text: "Réception, une heure du matin. Sandrine ouvre son cahier à la page du 14 novembre : « 2 h 10, double du 12 à M. Mbako. 2 h 25, rendu. » « Personne ne me l'a demandé. Vous me le demandez ? »"
    left:
      label: "Je vous le demande"
      effects: {direction: "-", relation: {sandrine: 1}, set: [h7_cahier_lu, h7_page_poche, h7_questions], react: {card: sl.h7.re.mbako_page, chance: 0.6}}
      answer: "Elle détache la page au cutter, proprement, et te la tend. « Moi, je me souviens. » Dans la marge, au crayon : il tremblait."
    right:
      label: "Refermez le cahier"
      effects: {direction: "+", set: [h7_cahier_ferme]}
      answer: "Elle referme le cahier sur son crayon, comme sur un marque-page. « Il restera ouvert pour la police. Pas pour vous. »"

  - id: sl.h7.r2_cahier_premier_soir
    roles: [selectionneur]
    arc: instances
    tags: [vestiaire, direction]
    speaker: sandrine
    lieu: hotel
    tone: strategique
    once: true
    text: "Réception, une heure du matin. Sandrine ouvre son cahier au 14 novembre : « 2 h 10, double du 12 à M. Mbako. 2 h 25, rendu. » « Le premier soir, vous m'aviez demandé lesquels. Encore ? »"
    left:
      label: "Encore"
      effects: {direction: "-", relation: {sandrine: 1}, set: [h7_cahier_lu, h7_page_poche, h7_questions], react: {card: sl.h7.re.mbako_page, chance: 0.6}}
      answer: "Elle détache la page au cutter et te la tend. « Le 12 et le 14, comme le premier soir. » Dans la marge, au crayon : il tremblait."
    right:
      label: "Refermez le cahier"
      effects: {direction: "+", set: [h7_cahier_ferme]}
      answer: "Elle referme le cahier. « Ce soir-là aussi, vous ne surveilliez personne. » Elle ne le dit pas méchamment ; c'est pire."

  # ══════════════════════════════════════ 2012 · R3 · le bus, la nuit (17)
  - id: sl.h7.r3_bus
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire, sombre]
    speaker: mbako
    lieu: hotel
    tone: strategique
    once: true
    text: "Une heure du matin. Mbako boit seul dans le bus de 2010 : « En 2010, je suis resté dans le bus. Cette nuit-là, je suis entré. J'ai compté jusqu'à trente, et j'ai eu peur de rester. »"
    left:
      label: "Tu vas témoigner"
      effects: {vestiaire: "+", direction: "-", relation: {mbako: 1}, set: [h7_mbako_temoignera]}
      answer: "Il pose la bouteille sur le siège du chauffeur. « Debout, alors. Pas dans un bus. » Cette fois, c'est lui qui descend le premier."
    right:
      label: "Personne ne saura"
      effects: {direction: "+", vestiaire: "-", set: [h7_mbako_silence]}
      answer: "Il hoche la tête longtemps. Quand tu descends, il reste assis au dernier rang, à la place qui était celle du petit."

  - id: sl.h7.r3_bus_cahier
    roles: [selectionneur]
    arc: vestiaire
    tags: [vestiaire, sombre]
    speaker: mbako
    lieu: hotel
    tone: strategique
    once: true
    text: "Une heure du matin. Mbako boit seul dans le bus de 2010 : « Tu as la page de Sandrine. Écoute ce qui n'y est pas. Je suis entré. J'ai compté jusqu'à trente. Il ne revenait pas. »"
    left:
      label: "Tu vas témoigner"
      effects: {vestiaire: "+", direction: "-", relation: {mbako: 1}, set: [h7_mbako_temoignera]}
      answer: "« Avec ta page à côté de ma bouche, oui. » Il pose la bouteille sur le siège du chauffeur et descend le premier, cette fois."
    right:
      label: "Personne ne saura"
      effects: {direction: "+", vestiaire: "-", set: [h7_mbako_silence]}
