      effects: {direction: "-", set: [h7_appartement_repris, h7_douze_demandee], var: {saisie_logement: "+1"}, char: {aulard: {statut: parti}}, schedule: [{card: sl.h7.x1_standard, in: [2, 3]}]}
      answer: "« La 12 n'existe pas. » Escande pousse la clé de la 11 vers toi et retire sa main lentement, comme d'une plaque chaude."

