    tags: [direction]
    speaker: escande
    lieu: hotel
    tone: strategique
    once: true
    text: "Mars 2014, la première fenêtre. Escande pose ta clé sur une enveloppe du comité : Vaubourg est mis en examen pour la nuit du 14. « Elle est arrivée ce matin, {toi}. Vous montez la lire ? »"
    left:
