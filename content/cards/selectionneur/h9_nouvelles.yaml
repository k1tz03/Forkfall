# Histoire 9 — « Vingt degrés dedans » : les Nouvelles (le monde de 2029 à
# 2032, une carte, un bouton). Datées par `year` (une datée sert l'année d'avant
# et la sienne : chacune lit aussi `year`, pour ne pas sortir en avance) ; les
# trois d'Al-Dorado se servent pendant le Mondial (créneau 14 de 2030). Le sport
# peut être réel — un calendrier qui s'arrête en hiver, des capteurs dans les
# protège-tibias, une pause fraîcheur — ; les noms, jamais.
cards:
  # ═══════════════════════════════════════════════════════════════ 2029
  - id: sl.h9.nv.2029_calendrier
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, direction]
    speaker: nassir
    tone: leger
    once: true
    year: 2029
    when: "flag('histoire_h9') && year == 2029"
    text: "Cheikh Ilyas, président de la Ligue, présente le calendrier de 2030 : six semaines sans championnat en novembre et décembre, pour le Mondial. « Les clubs s'habitueront. Ils s'habituent à tout. »"
    left: {label: "Je lis le calendrier", effects: {direction: "+"}, answer: "Novembre et décembre sont en gris. Au bas de la page, en petit : « salaires dus pendant la trêve ». Le bas des pages, on ne le lit jamais."}
    right: {label: "Je lis le calendrier", effects: {direction: "+"}, answer: "Novembre et décembre sont en gris. Au bas de la page, en petit : « salaires dus pendant la trêve ». Le bas des pages, on ne le lit jamais."}

  - id: sl.h9.nv.2029_capteurs
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    tone: leger
    once: true
    year: 2029
    when: "flag('histoire_h9') && year == 2029"
    text: "Les protège-tibias des Cobalts ont des capteurs, désormais : distance, accélérations, battements du cœur, envoyés à la Fédération à la seconde. On mesure la fatigue, dit le médecin."
    left: {label: "Je regarde les courbes", effects: {vestiaire: "+"}, answer: "Vingt-six courbes à l'écran. Une seule ne descend jamais : celle de Noa Vandel. Le médecin la regarde aussi, longtemps."}
    right: {label: "Je regarde les courbes", effects: {vestiaire: "+"}, answer: "Vingt-six courbes à l'écran. Une seule ne descend jamais : celle de Noa Vandel. Le médecin la regarde aussi, longtemps."}

  - id: sl.h9.nv.2029_pelouse
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    speaker: gege
    tone: leger
    once: true
    year: 2029
    when: "flag('histoire_h9') && year == 2029"
    text: "Gégé tâte la pelouse de la Rive du bout de sa chaussure : « Chauffée par en dessous, depuis le Mondial des amateurs. En 1990, on mettait de la paille. La paille, au moins, ça sentait quelque chose. »"
    left: {label: "Je tâte aussi", effects: {tribunes: "+"}, answer: "Elle est tiède, comme une joue. Gégé retire son pied vite, comme s'il avait touché quelqu'un sans demander."}
    right: {label: "Je tâte aussi", effects: {tribunes: "+"}, answer: "Elle est tiède, comme une joue. Gégé retire son pied vite, comme s'il avait touché quelqu'un sans demander."}

  - id: sl.h9.nv.2029_temps_effectif
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    tone: leger
    once: true
    year: 2029
    when: "flag('histoire_h9') && year == 2029"
    text: "Le temps effectif est à l'essai dans les matchs de sélection : le chronomètre s'arrête à chaque sortie de balle. Un match dure deux heures. Les buvettes ne s'en plaignent pas."
    left: {label: "Je regarde l'horloge", effects: {vestiaire: "-"}, answer: "À la soixante-dixième minute, il fait nuit. Dans la tribune, des enfants se sont endormis sur des épaules qui ne sont pas les leurs."}
    right: {label: "Je regarde l'horloge", effects: {vestiaire: "-"}, answer: "À la soixante-dixième minute, il fait nuit. Dans la tribune, des enfants se sont endormis sur des épaules qui ne sont pas les leurs."}

  # ═══════════════════════════════════════════════════════════════ 2030
  - id: sl.h9.nv.2030_maillot
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    tone: leger
    once: true
    year: 2030
    when: "flag('histoire_h9') && year == 2030 && !flag('h9_depart')"
    text: "Présentation du maillot du Mondial : un tissu « respirant », des manches courtes, et sur le bras gauche, exactement à l'endroit du brassard, la flamme bleue de Gazéo."
    left: {label: "Je touche le tissu", effects: {caisse: "+"}, answer: "Il est léger comme rien. La flamme est thermocollée ; on ne pourrait rien coudre par-dessus sans la brûler. Quelqu'un y a pensé."}
    right: {label: "Je touche le tissu", effects: {caisse: "+"}, answer: "Il est léger comme rien. La flamme est thermocollée ; on ne pourrait rien coudre par-dessus sans la brûler. Quelqu'un y a pensé."}

  - id: sl.h9.nv.2030_pause_fraicheur
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, arbitrage]
    tone: leger
    once: true
    year: 2030
    when: "flag('histoire_h9') && year == 2030 && !flag('h9_depart')"
    text: "La FédéMonde impose une pause fraîcheur à la demi-heure, dès trente-deux degrés. Au Dôme, il fera vingt. La pause est maintenue quand même, « par cohérence »."
    left: {label: "Je note la pause", effects: {direction: "+"}, answer: "Trois minutes, deux fois par match. Le diffuseur les a déjà vendues : on y passera des publicités pour de l'eau en bouteille."}
    right: {label: "Je note la pause", effects: {direction: "+"}, answer: "Trois minutes, deux fois par match. Le diffuseur les a déjà vendues : on y passera des publicités pour de l'eau en bouteille."}

  - id: sl.h9.nv.2030_bouches
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, tribunes]
    tone: leger
    once: true
    year: 2030
    when: "flag('histoire_h9') && year == 2030 && !flag('h9_depart')"
    text: "Al-Dorado présente ses tribunes : une bouche d'air sous chaque siège, réglée à vingt degrés. Le spectateur peut la fermer. Aux essais, dit le communiqué, personne ne l'a fait."
    left: {label: "Je lis le communiqué", effects: {tribunes: "-"}, answer: "En bas de page, le nombre de sièges : quatre-vingt mille. Le nombre de bouches d'air. Pas le nombre de mains qui les ont posées."}
    right: {label: "Je lis le communiqué", effects: {tribunes: "-"}, answer: "En bas de page, le nombre de sièges : quatre-vingt mille. Le nombre de bouches d'air. Pas le nombre de mains qui les ont posées."}

  # ══════════════════════════════════════ AL-DORADO (le créneau 14 de 2030)
  - id: sl.h9.nv.ad_oranges
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, al_dorado]
    lieu: ailleurs
    tone: leger
    once: true
    year: 2030
    when: "flag('histoire_h9') && season == 1 && flag('h9_depart')"
    text: "L'hôtel des délégations sert des oranges pelées à toute heure, et de l'eau gravée DÔME 2030. Au petit-déjeuner, on annonce la température extérieure comme un score : trente-six."
    left: {label: "Je prends une orange", effects: {vestiaire: "+"}, answer: "Elle est glacée jusqu'au cœur. Le serveur te souhaite un bon tournoi dans ta langue, avec l'accent de quelqu'un qui l'a apprise ici."}
    right: {label: "Je prends une orange", effects: {vestiaire: "+"}, answer: "Elle est glacée jusqu'au cœur. Le serveur te souhaite un bon tournoi dans ta langue, avec l'accent de quelqu'un qui l'a apprise ici."}

  - id: sl.h9.nv.ad_ceremonie
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, al_dorado]
    lieu: ailleurs
    tone: leger
    once: true
    year: 2030
    when: "flag('histoire_h9') && season == 1 && flag('h9_depart')"
    text: "Répétition de la cérémonie d'ouverture : quatre cents figurants en blanc forment un cœur sur la pelouse du Dôme. Ils sont là depuis six heures du matin. On leur apporte de l'eau à midi."
    left: {label: "Je regarde le cœur", effects: {direction: "+"}, answer: "À midi, le cœur se défait d'un coup, vers les bouteilles. Il se reforme à midi dix, un peu de travers. On le laisse comme ça."}
    right: {label: "Je regarde le cœur", effects: {direction: "+"}, answer: "À midi, le cœur se défait d'un coup, vers les bouteilles. Il se reforme à midi dix, un peu de travers. On le laisse comme ça."}

  - id: sl.h9.nv.ad_lumieres
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, al_dorado]
    lieu: ailleurs
    tone: leger
    once: true
    year: 2030
    when: "flag('histoire_h9') && season == 1 && flag('h9_depart')"
    text: "La nuit, de ta fenêtre, on ne voit personne sur le toit du Dôme. On voit seulement de petites lumières qui avancent le long du bord, très lentement, comme une ronde."
    left: {label: "Je les compte", effects: {vestiaire: "-"}, answer: "Tu en comptes onze. À deux heures, dix. Tu refais le compte trois fois. Dix. Tu tires le rideau, et tu ne dors pas."}
    right: {label: "Je les compte", effects: {vestiaire: "-"}, answer: "Tu en comptes onze. À deux heures, dix. Tu refais le compte trois fois. Dix. Tu tires le rideau, et tu ne dors pas."}

  # ═══════════════════════════════════════════════════════════════ 2031
  - id: sl.h9.nv.2031_decompte
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, famille]
    speaker: sacha
    tone: leger
    once: true
    year: 2031
    when: "flag('histoire_h9') && year >= 2031"
    text: "L'association de Sacha publie son dernier décompte : quatre cent soixante et un. L'émirat répond par un communiqué de onze lignes. Sacha les a comptées : il n'y a pas un chiffre."
    left: {label: "Je lis les onze lignes", effects: {tribunes: "-"}, answer: "« Regrette », « tragique », « conditions exceptionnelles ». Sacha a surligné « exceptionnelles » en jaune, quatre cent soixante et une fois."}
    right: {label: "Je lis les onze lignes", effects: {tribunes: "-"}, answer: "« Regrette », « tragique », « conditions exceptionnelles ». Sacha a surligné « exceptionnelles » en jaune, quatre cent soixante et une fois."}

  # ══════════════════════════════════════════════════════ 2032 ET APRÈS
  - id: sl.h9.nv.2032_ete
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, direction]
    tone: leger
    once: true
    year: 2032
    when: "flag('histoire_h9') && year >= 2032"
    text: "La FédéMonde annonce que le prochain Mondial se jouera en été, « dans un pays où l'été est l'été ». Personne ne demande lequel. Personne ne demande pourquoi maintenant."
    left: {label: "Je plie le journal", effects: {direction: "+"}, answer: "En page deux, une photo du Dôme vide, ses bouches d'air couvertes de bâches. Une seule légende : « Reconversion à l'étude »."}
    right: {label: "Je plie le journal", effects: {direction: "+"}, answer: "En page deux, une photo du Dôme vide, ses bouches d'air couvertes de bâches. Une seule légende : « Reconversion à l'étude »."}

  - id: sl.h9.nv.2032_engagement
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, sponsors]
    tone: leger
    once: true
    year: 2032
    when: "flag('histoire_h9') && year >= 2032 && chars.josiane.statut != 'mort'"
    text: "Gazéo prolonge son contrat avec la Fédération jusqu'en 2040. La clause d'image a changé de nom : on l'appelle désormais « engagement de réputation »."
    left: {label: "Je relis la clause", effects: {caisse: "+"}, answer: "Mêmes mots, dans un autre ordre. Bréhaut l'a signée sans lunettes, dit Josiane. Il connaissait le texte par cœur."}
    right: {label: "Je relis la clause", effects: {caisse: "+"}, answer: "Mêmes mots, dans un autre ordre. Bréhaut l'a signée sans lunettes, dit Josiane. Il connaissait le texte par cœur."}

  - id: sl.h9.nv.2032_concert
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, moment]
    tone: leger
    once: true
    year: 2032
    when: "flag('histoire_h9') && year >= 2032"
    text: "Le Dôme d'Al-Dorado accueille son premier concert. Le chanteur salue « ceux qui ont construit ce lieu ». La caméra montre le public, longuement, puis le toit, une seconde."
    left: {label: "Je regarde le toit", effects: {vestiaire: "+"}, answer: "Il est vide et propre, éclairé en bleu. Au bord, un projecteur oublié qui clignote, une fois toutes les dix secondes."}
    right: {label: "Je regarde le toit", effects: {vestiaire: "+"}, answer: "Il est vide et propre, éclairé en bleu. Au bord, un projecteur oublié qui clignote, une fois toutes les dix secondes."}

  - id: sl.h9.nv.2032_chez_gigi
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, ultras]
    tone: leger
    once: true
    year: 2032
    when: "flag('histoire_h9') && year >= 2032 && flag('h9_vecchio_mort')"
    text: "La buvette du kop change de nom : sur la planche au-dessus du zinc, quelqu'un a peint « Chez Gigi ». La Fédération envoie une gerbe ; le virage la range derrière les caisses."
    left: {label: "Je trinque à Gigi", effects: {tribunes: "+"}, answer: "Gégé sert un verre de trop et le pose au bout du comptoir. Le verre reste plein jusqu'à la fermeture. Puis il le boit, lui."}
    right: {label: "Je trinque à Gigi", effects: {tribunes: "+"}, answer: "Gégé sert un verre de trop et le pose au bout du comptoir. Le verre reste plein jusqu'à la fermeture. Puis il le boit, lui."}

  - id: sl.h9.nv.2032_vote
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, direction]
    tone: leger
    once: true
    year: 2032
    when: "flag('histoire_h9') && year >= 2032"
    text: "La FédéMonde attribue le Mondial 2038 par un vote électronique, en direct, sans suspension de séance. Le scrutin dure onze minutes. Aucun téléphone ne sonne dans la salle."
    left: {label: "Je compte les minutes", effects: {direction: "-"}, answer: "Onze minutes. Tu fais le calcul malgré toi : une de moins qu'entre 23 h 40 et 23 h 52. Tu ne sais pas quoi faire de ce chiffre."}
    right: {label: "Je compte les minutes", effects: {direction: "-"}, answer: "Onze minutes. Tu fais le calcul malgré toi : une de moins qu'entre 23 h 40 et 23 h 52. Tu ne sais pas quoi faire de ce chiffre."}

  - id: sl.h9.nv.2032_capteurs
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, vestiaire]
    tone: leger
    once: true
    year: 2032
    when: "flag('histoire_h9') && year >= 2032"
    text: "Les capteurs des protège-tibias deviennent obligatoires en première division. Au bord du terrain, un écran montre au public la fatigue de chaque joueur, en couleurs."
    left: {label: "Je regarde l'écran", effects: {vestiaire: "+"}, answer: "Vert, vert, orange. Le public applaudit les rouges, ceux qui ont trop couru. Sur les formulaires du ministère, « fatigué » n'existe plus."}
    right: {label: "Je regarde l'écran", effects: {vestiaire: "+"}, answer: "Vert, vert, orange. Le public applaudit les rouges, ceux qui ont trop couru. Sur les formulaires du ministère, « fatigué » n'existe plus."}

  - id: sl.h9.nv.2032_radiateurs
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, ultras]
    tone: leger
    once: true
    year: 2032
    when: "flag('histoire_h9') && year >= 2032"
    text: "Pour les matchs d'hiver, la Ligue fait poser des radiateurs sous les sièges des tribunes. Au virage Nord de la Rive, un seul siège reste débranché, à la demande de son occupant."
    left: {label: "Je passe au virage", effects: {tribunes: "+"}, answer: "Une rangée de sièges tièdes et, au milieu, celui de Gégé, froid, avec un coussin. « Moi, j'ai mon écharpe. » Il a {age_gege} ans."}
    right: {label: "Je passe au virage", effects: {tribunes: "+"}, answer: "Une rangée de sièges tièdes et, au milieu, celui de Gégé, froid, avec un coussin. « Moi, j'ai mon écharpe. » Il a {age_gege} ans."}

  - id: sl.h9.nv.2032_brassard
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, direction]
    tone: leger
    once: true
    year: 2032
    when: "flag('histoire_h9') && year >= 2032"
    text: "La FédéMonde autorise désormais un brassard noir « en cas de deuil national déclaré ». Il faut en faire la demande par écrit, trois semaines à l'avance, en trois exemplaires."
    left: {label: "Je lis le règlement", effects: {direction: "+"}, answer: "Article quatre : le brassard est fourni par l'organisateur. Noir réglementaire. Matière non précisée. Chemise, sans doute pas."}
    right: {label: "Je lis le règlement", effects: {direction: "+"}, answer: "Article quatre : le brassard est fourni par l'organisateur. Noir réglementaire. Matière non précisée. Chemise, sans doute pas."}

  # ══════════════════════════════════════════════════════════ INTEMPORELLES
  - id: sl.h9.nv.radio_boulangerie
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, famille]
    tone: leger
    once: true
    when: "flag('histoire_h9') && season <= 1 && !(season == 1 && flag('h9_depart'))"
    text: "À la radio de la boulangerie, un ministre parle du Mondial comme d'« une fenêtre ouverte sur le monde ». Marie-Jo baisse le son, puis l'éteint, puis le rallume pour la météo."
    left: {label: "J'écoute la météo", effects: {direction: "-"}, answer: "Moins deux, de la neige en fin de journée. Marie-Jo sourit, comme à une bonne nouvelle. Pour elle, ça en est une."}
    right: {label: "J'écoute la météo", effects: {direction: "-"}, answer: "Moins deux, de la neige en fin de journée. Marie-Jo sourit, comme à une bonne nouvelle. Pour elle, ça en est une."}

  - id: sl.h9.nv.ecole_feutrine
    roles: [selectionneur]
    arc: nouvelle
    tags: [nouvelle, famille]
    tone: leger
    once: true
    when: "flag('histoire_h9') && (flag('h9_brassard_photo') || flag('h9_brassard_permis')) && season <= 1 && !(season == 1 && flag('h9_depart'))"
    text: "À l'école des Lilas, la classe de CM2 a fabriqué vingt-six brassards noirs en feutrine. Le directeur les a confisqués ; le lendemain, ils sont réapparus sur les cartables."
    left: {label: "Je souris", effects: {tribunes: "+"}, answer: "Le directeur fait une circulaire, les parents la signent. Le surlendemain, il y a vingt-sept brassards : le sien, à sa sacoche."}
    right: {label: "Je souris", effects: {tribunes: "+"}, answer: "Le directeur fait une circulaire, les parents la signent. Le surlendemain, il y a vingt-sept brassards : le sien, à sa sacoche."}
