      effects: {direction: "+", set: [h9_minute_immobile, h9_vecchio_mort], char: {vecchio: mort}, end: mondial_vingt_degres}
      answer: "La manche reste dans ta veste, pliée en quatre contre ta poitrine. Les caméras passent sur toi sans s'arrêter."

