    text: "Stade de la Rive, la minute de silence pour Gigi Vecchio ; l'arbitre en ajoute une. Dans la tribune, Marie-Jo, un brassard noir au bras. Les caméras te cherchent."
    left:
      label: "Je mets un brassard"
      effects: {tribunes: "+", set: [h9_minute_brassard, h9_vecchio_mort], char: {vecchio: mort}, end: mondial_vingt_degres}
      answer: "Tu noues un ruban noir pris à la boutique du club. Marie-Jo te voit faire ; elle regarde la pelouse, pas toi."
    right:
      label: "Je reste immobile"
      effects: {direction: "+", set: [h9_minute_immobile, h9_vecchio_mort], char: {vecchio: mort}, end: mondial_vingt_degres}
      answer: "Deux minutes, les mains dans le dos. Les caméras trouvent ton visage et n'y trouvent rien. Elles passent à la tribune."

