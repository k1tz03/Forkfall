    speaker: mariejo
    tone: leger
    once: true
    text: "Décembre, un an après le Dôme. La photo de Kévin est revenue au-dessus de la caisse, un brassard noir punaisé à côté. Marie-Jo te tend ta baguette : « Il fait froid, cette année. »"
    left:
      label: "Je prends ma baguette"
      effects: {tribunes: "+", set: [h9_pain_repris]}
      answer: "Elle te rend la monnaie et, pour la première fois, te demande le score. Tu le lui donnes. Elle hoche la tête."
    right:
      label: "Je reste un moment"
      effects: {vestiaire: "+", relation: {mariejo: 1}, set: [h9_pain_repris]}
      answer: "Vous regardez la rue ensemble jusqu'au premier car. Elle ne demande rien. Elle n'a plus besoin de demander."

  - id: sl.h9.c4_decembre_four
    roles: [selectionneur]
    arc: famille
    tags: [famille, decor]
    speaker: mariejo
    tone: leger
    once: true
    text: "Décembre. Le four neuf tourne depuis l'été, la banque a rendu la caution. Avec un clou, Marie-Jo a gravé une date dans la porte en fonte : celle de Kévin. « Pour qu'il ait chaud. »"
    left:
      label: "Je prends ma baguette"
      effects: {tribunes: "+", set: [h9_pain_repris]}
      answer: "Elle est brûlante. Marie-Jo l'enveloppe dans un papier de soie, comme un cadeau. « Il n'y a pas de caution, sur le pain. »"
    right:
      label: "Je touche la porte"
      effects: {vestiaire: "+", relation: {mariejo: 1}, set: [h9_pain_repris]}
      answer: "La fonte est chaude, la date gravée un peu de travers. « Deux cent cinquante degrés, dit-elle. Plus jamais quatre. »"

