# Les personnages transversaux, compilés dans le jeu : nom affiché, étiquette
# (la bande blanche sous la vignette), genre, `tic` — la phrase-signature, citée
# une seule fois au palier +3, au départ et dans les coulisses de la fin, jamais
# une formule qui revient dans les cartes (docs/bible/charte_histoire.md) —, camp (couleur de
# fond de la vignette), apparitions par saison visées hors casting, et les
# cartes programmées quand la relation franchit un seuil (`on_relation`).
#
# `adresse` (spec variété §1.8, §2.5) : comment le personnage s'adresse à toi.
# Résout `{toi}` / `{Toi}` dans ses cartes selon le rôle joué et son expression
# (sourire : relation ≥ 1 · neutre · noir : relation ≤ −1). Chaque valeur est
# un gabarit : `{prenom}`, `{nom}`, `{numero}` (dossard du joueur),
# `{pg, select, f{madame} other{monsieur}}` y sont interpolés (profondeur ≤ 2).
# Quand `adresse` est présente elle couvre les deux rôles et les trois
# expressions (erreur de build sinon). Sans adresse : « coach » (entraîneur)
# / « {prenom} » (joueur). Une carte qui dit {toi} doit avoir un `speaker`.
#
# `age` (en 1990) et `statut` (spec variété §1.10, charte de la bible § 2.4 et
# § 2.4 bis) : le moteur en fait un état de partie (`GameState.chars`), prend
# un an à chaque ouverture de saison, et le contenu le lit —
#   · dans un `when` : `chars.vecchio.age >= 44`, `chars.mbako.statut == 'vendu'`
#   · dans un texte : « J'ai {age_vecchio} ans. » (jamais un nombre en dur)
#   · dans un effet : `char: { mbako: { statut: vendu } }`, ou `char: {mbako: vendu}`
#     (`age: "+1"` déplace l'âge, `age: 17` le pose).
# Statuts : present · club · staff · vendu · parti · retraite · rival · mort.
# Un personnage dont le statut n'est ni present, ni club, ni staff **ne parle
# plus** : ses cartes sortent du tirage et ses entrées en file sont purgées
# (`miss` raison `statut`). Pour le faire parler quand même — le coup de fil de
# Vecchio parti, le mort au Fantôme —, la carte (ou l'étape) déclare
# `statut_ok: [parti, retraite]`. Un personnage sans `age` n'a pas d'état : il
# parle toujours.
#
# `retrouvailles` (spec variété §1.13) : les deux cartes servies quand tu
# changes de club ou de rôle, pour les deux visages à |relation| maximale —
#   retrouvailles: { sourire: co.retrouvailles.gege_sourire, noir: co.retrouvailles.gege_noir }
# Les deux visages sont requis dès que le champ est là, les cartes doivent
# exister, être `once: true`, et n'appartenir à aucun autre mécanisme.
characters:
  - id: fardelli
    name: "Rocco Fardelli"
    label: "AGENT DE JOUEURS"
    genre: m
    role: agent
    tic: "Les contrats passent, les numéros restent."
    camp: direction
    age: 44
    statut: present
    default_target: 1
    adresse:
      # `sourire` nommait le seul cas où Fardelli ne disait pas le prénom, et
      # c'est celui qu'on voit le plus (il parle à l'Objectif, à l'Après-match
      # et au Bilan) : le budget « nom » (spec § 5.3) y perdait une carte par
      # saison. Quand il t'aime, il met le prénom devant.
      entraineur: { sourire: "{prenom}, {pg, select, f{mon amie} other{mon ami}}", neutre: "{pg, select, f{mon amie} other{mon ami}} {prenom}", noir: "{pg, select, f{madame} other{monsieur}} {nom}" }
      joueur:     { sourire: "{prenom}, {pg, select, f{mon amie} other{mon ami}}", neutre: "{pg, select, f{mon amie} other{mon ami}} {prenom}", noir: "{prenom}" }
    on_relation:
      -3: co.fardelli.trahison_signe_ailleurs
      3: co.fardelli.faveur_premier_appel
    retrouvailles: { sourire: co.retrouvailles.fardelli_sourire, noir: co.retrouvailles.fardelli_noir }
