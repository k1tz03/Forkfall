# Les personnages transversaux, compilés dans le jeu : nom affiché, étiquette
# (la bande blanche sous la vignette), genre, tic de langage, camp (couleur de
# fond de la vignette), apparitions par saison visées hors casting, et les
# cartes programmées quand la relation franchit un seuil (`on_relation`).
#
# `adresse` (spec variété §1.8, §2.5) : comment le personnage s'adresse à toi.
# Résout `{toi}` / `{Toi}` dans ses cartes selon le rôle joué et son expression
# (sourire : relation ≥ 1 · neutre · noir : relation ≤ −1). Chaque valeur est
# un gabarit : `{prenom}`, `{nom}`, `{numero}` (dossard du joueur),
# `{pg, select, f{madame} other{monsieur}}` y sont interpolés (profondeur ≤ 2).
# Quand `adresse` est présente elle couvre les deux rôles et les trois
# expressions (erreur de build sinon). Sans adresse : « coach » (entraîneur)
# / « {prenom} » (joueur). Une carte qui dit {toi} doit avoir un `speaker`.
characters:
  - id: fardelli
    name: "Rocco Fardelli"
    label: "AGENT DE JOUEURS"
    genre: m
    role: agent
    tic: "Mon ami, on parle d'argent ou d'amitié ?"
    camp: direction
    default_target: 1
    adresse:
      entraineur: { sourire: "mon ami", neutre: "mon ami {prenom}", noir: "monsieur {nom}" }
      joueur:     { sourire: "mon ami", neutre: "mon ami {prenom}", noir: "{prenom}" }
  - id: meneche
    name: "Pierre Ménèche"
    label: "JOURNALISTE"
    genre: m
    role: journaliste
    tic: "Juste une question, hors micro."
    camp: direction
    default_target: 1.5
    adresse:
      entraineur: { sourire: "{prenom}", neutre: "coach", noir: "{pg, select, f{madame} other{monsieur}} {nom}" }
      joueur:     { sourire: "{prenom}", neutre: "{prenom} {nom}", noir: "{nom}" }
    on_relation:
      -3: en.meneche.trahison_dossier
  - id: gege
    name: "Gégé"
    label: "CAPO, TRIBUNE NORD"
    genre: m
    role: ultra
    tic: "La tribune n'oublie rien."
    camp: terrain
    default_target: 1.5
    adresse:
      entraineur: { sourire: "{prenom}", neutre: "coach", noir: "{nom}" }
      joueur:     { sourire: "petit", neutre: "{prenom}", noir: "le {numero}" }
    on_relation:
      -3: en.gege.trahison_banderole
      3: en.gege.faveur_insurrection
  - id: aulard
    name: "Jean-Marie Aulard"
    label: "PRÉSIDENT"
    genre: m
    role: president
    tic: "J'ai pas le temps, j'ai un empire."
    camp: direction
    default_target: 2
    adresse:
      entraineur: { sourire: "mon {prenom}", neutre: "{nom}", noir: "monsieur {nom}" }
      joueur:     { sourire: "petit", neutre: "{nom}", noir: "monsieur {nom}" }
  - id: vukic
    name: "Zoran Vukić"
    label: "ENTRAÎNEUR ADJOINT"
    genre: m
    role: adjoint
    tic: "Je te le dis parce que personne ne te le dira."
    camp: terrain
    default_target: 1.5
    adresse:
      entraineur: { sourire: "{prenom}", neutre: "coach", noir: "coach" }
      joueur:     { sourire: "{prenom}", neutre: "{prenom}", noir: "{nom}" }
  - id: brehaut
    name: "Titi Bréhaut"
    label: "CAPITAINE"
    genre: m
