# Les personnages transversaux, compilés dans le jeu : nom affiché, étiquette
# (la bande blanche sous la vignette), genre, tic de langage, camp (couleur de
# fond de la vignette), apparitions par saison visées hors casting, et les
# cartes programmées quand la relation franchit un seuil (`on_relation`).
characters:
  - id: fardelli
    name: "Rocco Fardelli"
    label: "AGENT DE JOUEURS"
    genre: m
    role: agent
    tic: "Mon ami, on parle d'argent ou d'amitié ?"
    camp: direction
    default_target: 1
  - id: meneche
    name: "Pierre Ménèche"
    label: "JOURNALISTE"
    genre: m
    role: journaliste
    tic: "Juste une question, hors micro."
    camp: direction
    default_target: 1.5
    on_relation:
      -3: en.meneche.trahison_dossier
  - id: gege
    name: "Gégé"
    label: "CAPO, TRIBUNE NORD"
    genre: m
    role: ultra
    tic: "La tribune n'oublie rien."
    camp: terrain
    default_target: 1.5
    on_relation:
      -3: en.gege.trahison_banderole
      3: en.gege.faveur_insurrection
  - id: aulard
    name: "Jean-Marie Aulard"
    label: "PRÉSIDENT"
    genre: m
    role: president
    tic: "J'ai pas le temps, j'ai un empire."
    camp: direction
    default_target: 2
  - id: vukic
    name: "Zoran Vukić"
    label: "ENTRAÎNEUR ADJOINT"
    genre: m
    role: adjoint
    tic: "Je te le dis parce que personne ne te le dira."
    camp: terrain
    default_target: 1.5
  - id: brehaut
    name: "Titi Bréhaut"
    label: "CAPITAINE"
    genre: m
    role: capitaine
    tic: "Le groupe vit bien."
    camp: terrain
    default_target: 1
  - id: sabatier
    name: "Doc Sabatier"
    label: "MÉDECIN DU CLUB"
    genre: m
    role: medecin
    tic: "Ça reste entre la table et moi."
    camp: terrain
    default_target: 1
  - id: camille
    name: "Camille"
    label: "À LA MAISON"
    genre: f
    role: conjoint
    tic: "Tu rentres à quelle heure ?"
    camp: terrain
    default_target: 1
    on_relation:
      -1: co.camille.dispute
      -2: co.camille.chambre_amis
      -3: co.camille.valise
      3:
        - { id: co.camille.secours_avocate, if: "flag('camille_avocate')" }
        - { id: co.camille.secours_journaliste, if: "flag('camille_journaliste')" }
        - { id: co.camille.secours_elue, if: "flag('camille_elue')" }
        - { id: co.camille.secours_generique }
  - id: aubert
    name: "Madame Aubert"
    label: "MAIRE"
    genre: f
    role: maire
    tic: "Le stade, c'est de l'argent public."
    camp: instances
    default_target: 0.5
  - id: legruet
    name: "Noël Legruet"
    label: "PRÉSIDENT DE LA FÉDÉRATION"
    genre: m
    role: federation
    tic: "On verra ça après le Congrès."
