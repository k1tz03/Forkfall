endings:
  # --- Entraîneur ---
  - {id: en_bus, gauge: vestiaire, side: vide, rarity: rare, title: "Le bus", epitaph: "Le vestiaire a refusé de descendre du bus. Tu es descendu seul, ta valise à la main. Il pleuvait, évidemment."}
  - {id: en_copain, gauge: vestiaire, side: plein, title: "Le copain", epitaph: "Tu étais leur meilleur ami. Les meilleurs amis ne se font pas obéir. Le président l'a compris avant toi."}
  - {id: en_banderole, gauge: tribunes, side: vide, title: "La banderole", epitaph: "La banderole faisait vingt mètres. Ton nom en prenait douze. Le mot DEHORS, le reste."}
  - {id: en_otage, gauge: tribunes, side: plein, title: "L'otage du kop", epitaph: "Les ultras t'aimaient tant qu'ils composaient ton équipe. Le président a préféré les laisser composer ton successeur."}
  - {id: en_sms, gauge: direction, side: vide, rarity: commune, title: "Le SMS de 23h47", epitaph: "Viré par SMS entre la conférence de presse et le parking. Le message contenait une faute d'orthographe. Tu l'as corrigée."}
  - {id: en_placard, gauge: direction, side: plein, title: "Promotion-placard", epitaph: "Nommé Directeur du Développement International. Ton bureau n'a pas de fenêtre. Ni de téléphone. Ni de développement."}
  - {id: en_decoupe, gauge: caisse, side: vide, title: "Vendu à la découpe", epitaph: "Plus de budget. L'équipe a été vendue joueur par joueur, et toi avec les meubles."}
  - {id: en_coupable, gauge: caisse, side: plein, title: "Le coupable désigné", epitaph: "Tu as réclamé et obtenu des moyens fous. La Commission a bloqué le club, et le président a trouvé le nom du responsable sur ta porte."}
  - {id: en_tribune, gauge: tribunes, side: plein, rarity: rare, share: false, title: "La tribune", epitaph: "La tribune Nord est tombée à la soixante-douzième minute, avec ceux qui chantaient dedans. Tu avais dit : l'été prochain."}
  - {id: en_retraite, golden: true, rarity: rare, title: "Le banc en bois", epitaph: "Soixante-cinq ans. On a mis un banc à ton nom derrière le but. Tu t'y assois à chaque échauffement et tu donnes des consignes que personne n'entend."}
  # --- Joueur ---
  - {id: jp_mouton, gauge: vestiaire, side: vide, title: "Le mouton noir", epitaph: "On ne t'a plus jamais fait de passe. Même à l'entraînement. Même au toro."}
  - {id: jp_porteparole, gauge: vestiaire, side: plein, title: "Le porte-parole", epitaph: "Trop aimé pour être gardé. Vendu à la trêve avec une lettre du vestiaire et une aile de poulet."}
  - {id: jp_siffle, gauge: tribunes, side: vide, title: "Sifflé", epitaph: "Sifflé à l'échauffement, à la mi-temps et à la sortie du parking. Le parking, ça n'était jamais arrivé."}
  - {id: jp_sandwich, gauge: tribunes, side: plein, title: "L'homme-sandwich", epitaph: "Tu as signé plus de contrats publicitaires que de passes décisives. Ton agent a pleuré de joie. Le coach a pleuré tout court."}
  - {id: jp_place14b, gauge: direction, side: vide, title: "La place 14B", epitaph: "Tu as fini par connaître par cœur les tribunes du stade. Depuis la place 14B."}
  - {id: jp_fils, gauge: direction, side: plein, title: "Le fils spirituel", epitaph: "Le coach t'aimait tant qu'il t'a emmené dans son nouveau club. En deuxième division lointaine."}
  - {id: jp_sansclub, gauge: caisse, side: vide, title: "Sans club", epitaph: "Ton agent a filé, le syndicat des joueurs t'a proposé son stage de chômeurs. Tu as fini en Régional, payé en merguez."}
  - {id: jp_panama, gauge: caisse, side: plein, title: "La carte Panama", epitaph: "Le contrat d'image aux îles lointaines était une idée de ton cousin. Le fisc a eu une idée aussi."}
  # --- Universelles ---
  - {id: grand_deballage, rarity: rare, title: "Le Grand Déballage", epitaph: "Le dossier faisait douze pages. Chaque page, une promesse. Chaque promesse, une date. Tu te souvenais de toutes."}
  - {id: jubile, golden: true, rarity: rare, title: "Le Jubilé", epitaph: "Stade plein, tour d'honneur. Tu as demandé où était le vestiaire. Par habitude."}
  - {id: generique, title: "Fin de carrière", epitaph: "Le foot t'a recraché, comme il le fait toujours. On recommence ?"}
