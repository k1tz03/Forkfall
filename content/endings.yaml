# `epitaph_plus` (spec variété §2.6) : seconde phrase conditionnelle sous
# l'épitaphe, la première variante dont le `when` est vrai (≤ 2 par fin ;
# `when` lit les traces, relations, ennemis, objectifs, `bilan.*` non).
# Placeholders de formatText autorisés ({prenom} {nom} {NOM} {club} {ville}
# {rival} {pg, select, …}). Chaque fin a une variante qui nomme le joueur.
# `rebond: { when, postulat }` est réservé (parsé, non lu) pour un lot ultérieur.
# Quatre fins concluent une histoire (spec §1.13) : en_valise (L'enveloppe,
# « J'assume »), en_dauphin (la veille, variante dauphin, « Prends le banc »),
# jp_exil et jp_consultant (intrigues du rôle joueur, étapes 5-6 : déclarées
# ici pour que le `end:` de leurs cartes compile).
#
# Où écrire : ici, ou dans `content/endings/<lot>.yaml` (même clef `endings:`).
# Le build lit les deux et refuse un id déclaré deux fois : deux salles peuvent
# écrire leurs fins en même temps sans se marcher dessus.
#
# `indice` (le Cimetière) : une ligne, 90 caractères au plus, aucun {placeholder},
# qui tient la place d'une fin pas encore trouvée. Elle donne envie sans dire ce
# qui arrive, dans la voix des indices d'objectifs (un objet, un lieu, une heure),
# et ne reprend pas les mots du titre. Une fin jouable sans `indice` est signalée
# par build_content (« Avertissement : … sans `indice` ») et se montre sous une
# ligne par défaut ; une fin dormante n'en a pas besoin.
# `livre` n'est pas écrit à la main : build_content le déduit du lot (le postulat
# qui porte le drapeau `histoire_h<N>` pour `content/endings/h<N>.yaml`) ; une fin
# des lots communs (ce fichier, joueur, police, roles_bureau, ruine,
# setpieces_fins, sponsors) n'en a pas, et le Cimetière la range sous « Toutes les
# histoires ».
endings:
  # --- Entraîneur ---
  - id: en_bus
    gauge: vestiaire
    side: vide
    rarity: rare
    title: "Le bus"
    epitaph: "Le vestiaire a refusé de descendre du bus. Tu es descendu{pg, select, f{e} other{}} seul{pg, select, f{e} other{}}, ta valise à la main, et le chauffeur a attendu que tu sois sur le trottoir pour refermer."
    epitaph_plus:
      - { when: "relation.vecchio >= 2", text: "Gigi Vecchio est descendu quand même. Il a porté la valise de {nom} jusqu'au taxi." }
      - { when: "flag('bus_menace')",    text: "Le bus avait déjà refusé une fois. {prenom} {nom} n'avait pas écouté Gigi." }
  - id: en_copain
    gauge: vestiaire
    side: plein
    title: "Le copain"
    epitaph: "Tu étais leur meilleur ami. Les meilleurs amis ne se font pas obéir. Le président l'a compris avant toi."
    epitaph_plus:
      - { when: "flag('onze_du_virage')", text: "La compo se votait en tribune Nord ; le vestiaire votait aussi. {prenom} {nom} comptait les mains." }
      - { when: "relation.brehaut >= 2",  text: "Bréhaut a signé la pétition contre, en premier. Il est venu le dire à {nom} lui-même ; ça n'a rien changé." }
  - id: en_banderole
    gauge: tribunes
    side: vide
    title: "La banderole"
    epitaph: "La banderole faisait vingt mètres. {NOM} en prenait douze. Le mot DEHORS, le reste."
    epitaph_plus:
      - { when: "flag('onze_du_virage')", text: "Le onze du virage, lui, est resté affiché au local." }
      - { when: "relation.gege <= -2",    text: "Gégé a hésité sur l'accent de {NOM}. Pas sur le reste." }
  - id: en_otage
    gauge: tribunes
    side: plein
    title: "L'otage du kop"
    epitaph: "Les ultras t'aimaient tant qu'ils composaient ton équipe. Le président a préféré les laisser composer ton successeur."
    epitaph_plus:
      - { when: "flag('pacte_gege')", text: "Le pacte de la craie tenait toujours. C'est le président que {prenom} {nom} n'avait pas fait signer." }
      - { when: "flag('ami_ultras')", text: "Adopté{pg, select, f{e} other{}} par le local, {nom} y a gardé sa chaise. Le président y a mis quelqu'un d'autre." }
  - id: en_sms
    gauge: direction
    side: vide
    rarity: commune
    title: "Le message de 23h47"
    indice: "Trois lignes tapées tard le soir, et une faute d'orthographe dans la dernière."
    epitaph: "Viré{pg, select, f{e} other{}} par un message de trois lignes, à 23 h 47, entre la conférence de presse et le parking. Il contenait une faute d'orthographe. Tu l'as corrigée."
    epitaph_plus:
      - { when: "flag('vukic_dauphin')", text: "Zoran Vukić a pris le banc le lendemain. Il avait gardé le cahier de {nom}." }
      - { when: "enemy('meneche')",      text: "Massenet avait le message avant {prenom} {nom}. Il l'a publié avec la faute." }
  - id: en_placard
    gauge: direction
    side: plein
    title: "Promotion-placard"
    indice: "Un beau titre sur la porte, un bureau sans fenêtre, des maillots entassés."
    epitaph: "Nommé{pg, select, f{e} other{}} Directeur du Développement International. Ton bureau n'a pas de fenêtre ; on y range les maillots de la saison dernière."
    epitaph_plus:
      - { when: "flag('club_actif')",       text: "Ilyas a signé la plaque : « ambassadeur ». Sur l'organigramme du fonds, {nom} est une ligne entre la billetterie et les parkings." }
      - { when: "flag('homme_president')",  text: "Le fils du président a eu le bureau avec fenêtre. {prenom} {nom}, la plaque." }
  - id: en_decoupe
    gauge: caisse
    side: vide
    title: "Vendu à la découpe"
    epitaph: "Plus de budget. L'équipe a été vendue joueur par joueur, et toi avec les meubles."
    epitaph_plus:
      - { when: "flag('mbako_vendu')",      text: "Le petit Mbako était parti le premier, trente millions. Ils n'ont pas suffi ; {nom} est parti{pg, select, f{e} other{}} avec les meubles." }
      - { when: "flag('club_a_lancienne')", text: "{prenom} {nom} avait renvoyé le fonds et sa canette. Le fonds a racheté les meubles aux enchères." }
  - id: en_coupable
    gauge: caisse
    side: plein
    title: "Le coupable désigné"
    indice: "Un relevé qui pèse trois saisons de salaires, et ta signature au bas."
    epitaph: "Tu as réclamé et obtenu des moyens fous. La Commission a bloqué le club, et le président a trouvé le nom du responsable sur ta porte."
    epitaph_plus:
      - { when: "flag('nassir_pret')",     text: "Page trois du prêt : le nom du responsable. {prenom} {nom} l'avait signée sans la lire." }
      - { when: "relation.aulard <= -1",   text: "Vaubourg a dicté le communiqué à Josiane : {nom} y figurait trois fois, et lui nulle part." }
  - id: en_tribune
    gauge: tribunes
    side: plein
    rarity: rare
    share: false
    title: "La tribune"
    indice: "« L'été prochain », avais-tu dit. Un soir de match, la Nord était pleine et chantait."
    epitaph: "La tribune Nord est tombée à la soixante-douzième minute, avec ceux qui chantaient dedans. Tu avais dit : l'été prochain."
    epitaph_plus:
      - { when: "flag('tribune_a_renover')", text: "{prenom} {nom} avait préféré garder la tribune Nord, ses fissures et son nom." }
      - { when: "relation.gege >= 1",        text: "Gégé était dedans, au premier rang. {prenom} {nom} n'a jamais su s'il chantait encore quand elle a cédé." }
  - id: en_retraite
    golden: true
    rarity: rare
    title: "Le banc en bois"
    indice: "Rester assez longtemps pour qu'on t'installe quelque chose à ton nom derrière le but."
    epitaph: "Soixante-cinq ans. On a mis un banc à ton nom derrière le but. Tu t'y assois à chaque échauffement et tu donnes des consignes que personne n'entend."
    epitaph_plus:
      - { when: "objectif('promu_banc_gigi')", text: "Gigi Vecchio a le banc d'à côté. Ils regardent l'échauffement sans se parler ; {nom} apporte le thermos." }
      - { when: "relation.josiane >= 2",       text: "Josiane a pris sa retraite la même semaine. Elle n'a emporté qu'un dossier chez elle : celui de {nom}." }
  - id: en_valise
    gauge: direction
    side: vide
    rarity: rare
    title: "La valise"
    indice: "Trois joueurs d'en face, une enveloppe, et un tampon posé à plat en salle 3."
    epitaph: "Trois joueurs adverses, une enveloppe, un maintien. La Fédération a « examiné ». Elle a trouvé {prenom} {nom}."
    epitaph_plus:
      - { when: "flag('pari_promu')",      text: "Cent francs sur le maintien à cinq mille contre un. L'enveloppe pesait plus lourd ; {nom} le savait." }
      - { when: "relation.brehaut >= 1",   text: "Bréhaut n'a rien dit à la commission. Il n'a plus rien dit à {nom} non plus." }
  - id: en_dauphin
    gauge: direction
    side: vide
    rarity: rare
    title: "Le dauphin"
    indice: "Quelqu'un relit tes discours avant toi, depuis novembre."
    epitaph: "Remplacé{pg, select, f{e} other{}} par ton adjoint. Il « réfléchissait » depuis novembre."
    epitaph_plus:
      - { when: "relation.aulard <= -1", text: "Vaubourg a lu le second discours sans lever les yeux. {NOM} n'y était pas." }
      - { when: "relation.vukic <= -2",  text: "Zoran Vukić a gardé le bureau, la cafetière et le cahier de {prenom} {nom}. Il a changé la serrure." }
  # --- Joueur ---
  - id: jp_mouton
    gauge: vestiaire
    side: vide
    title: "Le mouton noir"
    epitaph: "On ne t'a plus jamais fait de passe. Même à l'entraînement. Même au toro."
    epitaph_plus:
      - { when: "flag('special')",         text: "« Le meilleur », avait dit {nom}. Le groupe avait lu." }
      - { when: "relation.brehaut <= -2",  text: "Bréhaut a donné la consigne au toro, à voix basse : pas de passe à {prenom} {nom}. Tout le monde l'a suivie." }
  - id: jp_porteparole
    gauge: vestiaire
    side: plein
    title: "Le porte-parole"
    epitaph: "Trop aimé{pg, select, f{e} other{}} pour être gardé{pg, select, f{e} other{}}. Vendu{pg, select, f{e} other{}} à la trêve, avec dans ton sac une lettre du vestiaire, courte, signée par tous."
    epitaph_plus:
      - { when: "flag('capitaine')",      text: "Le brassard est resté dans le casier. {prenom} {nom} a emporté la lettre, pliée en quatre, dans la poche du survêtement." }
      - { when: "relation.brehaut >= 2",  text: "Bréhaut a écrit la lettre. Il l'a signée en premier, sous le nom de {nom}." }
  - id: jp_siffle
    gauge: tribunes
    side: vide
    title: "Sifflé"
    epitaph: "Sifflé{pg, select, f{e} other{}} à l'échauffement, à la mi-temps et à la sortie du parking. Le parking, ça n'était jamais arrivé."
    epitaph_plus:
      - { when: "relation.gege <= -2",   text: "Gégé a sifflé le premier. Il a hésité sur l'accent de {NOM}. Pas sur le sifflet." }
      - { when: "flag('international')", text: "Sifflé{pg, select, f{e} other{}} même en bleu cobalt. {prenom} {nom} avait le maillot du pays et les sifflets de la ville." }
  - id: jp_sandwich
    gauge: tribunes
    side: plein
    title: "L'homme-sandwich"
    epitaph: "Tu as signé plus de contrats publicitaires que de passes décisives. Ton visage est resté sur les abribus de la ville ; ton nom a quitté la feuille de match."
    epitaph_plus:
      - { when: "flag('offshore')",         text: "Les cachets passaient par la société du cousin de {nom}, aux îles. Le fisc a compté plus vite que l'agent." }
      - { when: "relation.fardelli >= 2",   text: "Fardelli a signé le dernier contrat pour {prenom} {nom} : une boisson orange. Il a gardé la page trois." }
  - id: jp_place14b
    gauge: direction
    side: vide
    title: "La place 14B"
    epitaph: "Tu as fini par connaître par cœur les tribunes du stade. Depuis la place 14B."
    epitaph_plus:
      - { when: "flag('pari')",          text: "L'enregistrement du bar d'hôtel a fait le reste. {prenom} {nom} connaît aussi les tribunes des autres stades." }
      - { when: "relation.vukic <= -1",  text: "Vukić choisissait la place chaque samedi, au crayon. {nom} l'a toujours lue sur la porte du vestiaire, jamais de sa bouche." }
  - id: jp_fils
    gauge: direction
    side: plein
    title: "Le fils spirituel"
    epitaph: "Le coach t'aimait tant qu'il t'a emmené{pg, select, f{e} other{}} dans son nouveau club. En deuxième division lointaine."
    epitaph_plus:
      - { when: "relation.vukic >= 2", text: "Vukić a suivi aussi. Trois valises, une deuxième division lointaine, et {nom} sur la feuille de match." }
      - { when: "flag('capitaine')",   text: "Le brassard a suivi {prenom} {nom} dans la valise. Il ne va sur aucun maillot de là-bas." }
  - id: jp_sansclub
    gauge: caisse
    side: vide
    title: "Sans club"
    epitaph: "Ton agent a filé, le syndicat des joueurs t'a proposé son stage de chômeurs. Tu as fini en Régional, payé{pg, select, f{e} other{}} au noir, le dimanche, dans une enveloppe de la buvette."
    epitaph_plus:
      - { when: "flag('offshore')", text: "La société du cousin existe toujours. {nom} n'y a jamais eu de compte." }
      - { when: "flag('genou')",    text: "Le genou de {prenom} {nom} avait raison depuis le début. On l'a écouté en Régional, sur un terrain stabilisé, trop tard." }
  - id: jp_panama
    gauge: caisse
    side: plein
    title: "Les îles lointaines"
    indice: "Un contrat d'image signé très loin, sur une idée de ton cousin."
    epitaph: "Le contrat d'image aux îles lointaines était une idée de ton cousin. Le fisc a eu une idée aussi."
    epitaph_plus:
      - { when: "flag('international')",   text: "Le maillot cobalt est resté dans le dossier, entre deux relevés. {prenom} {nom} l'avait gagné, celui-là." }
      - { when: "relation.fardelli <= -1", text: "Fardelli « ne connaissait pas le cousin ». Il connaissait le compte de {nom}." }
  - id: jp_exil
    golden: false
    rarity: rare
    title: "Parti pour l'or"
    indice: "Un championnat du désert qui paie sans compter, et un niveau qui reste entre eux."
    epitaph: "Le championnat du désert paie comme l'or. Le niveau reste entre eux. {prenom} {nom} a appris à dormir la journée."
    epitaph_plus:
      - { when: "relation.camille <= -1",  text: "Camille n'est pas venue. Elle appelle le dimanche, à l'heure de chez nous ; {nom} dort encore." }
      - { when: "relation.fardelli >= 1",  text: "Fardelli prend dix pour cent de l'or. Il a fait installer la climatisation chez {prenom} {nom}. Par amitié." }
  - id: jp_consultant
    golden: true
    rarity: rare
    title: "Le micro du dimanche"
    indice: "Un plateau de télévision, deux anciens, et des jugements sur ceux qui jouent."
    epitaph: "{prenom} {nom} juge les autres le dimanche soir, sur un plateau, entre deux anciens. Au club, le président regarde, et note les noms."
    epitaph_plus:
      - { when: "enemy('meneche')",     text: "Massenet est sur le même plateau. Il « ne commente pas » ; {nom}, si." }
      - { when: "relation.vukic >= 1",  text: "Vukić regarde chaque dimanche, le cahier sur les genoux. Il note ce que dit {prenom} {nom}, et ce qui manque." }
  # --- Universelles ---
  - id: grand_deballage
    rarity: rare
    title: "Le Grand Déballage"
    indice: "Ce que tu as promis, quelqu'un l'a gardé par écrit, page après page."
    epitaph: "Le dossier faisait douze pages. Chaque page, une promesse. Chaque promesse, une date. Tu te souvenais de toutes."
    epitaph_plus:
      - { when: "flag('pacte_gege')", text: "Page une : le pacte de la craie. La date, la main, et le nom de {nom}." }
      - { when: "enemy('meneche')",   text: "Massenet a signé le dossier. Chaque réponse de {prenom} {nom} était dans un carnet à spirale ; il en avait rempli douze." }
  - id: jubile
    golden: true
    rarity: rare
    title: "Le Jubilé"
    indice: "Un stade plein pour toi seul, et un dernier tour de pelouse."
    epitaph: "Stade plein, tour d'honneur. Tu as demandé où était le vestiaire. Par habitude."
    epitaph_plus:
      - { when: "flag('finale_gigi')",  text: "Gigi Vecchio était dans les buts, pour un soir. Il a laissé passer le penalty de {nom}, et personne ne l'a cru." }
      - { when: "relation.gege >= 2",   text: "Gégé a dirigé les chants. La Nord a chanté {prenom} {nom} sans se tromper d'accent, pour la première fois." }
  - id: generique
    title: "Fin de carrière"
    indice: "Le foot recrache tout le monde, un jour. Sans raison, sans bruit."
    epitaph: "Le foot t'a recraché{pg, select, f{e} other{}}, comme il le fait toujours. On recommence ?"
    epitaph_plus:
      - { when: "flag('fidele')",        text: "{prenom} {nom} était resté{pg, select, f{e} other{}}. C'est le foot qui est parti." }
      - { when: "relation.josiane >= 1", text: "Josiane a rangé le dossier {nom} sur le dessus de la pile, pas dessous. Elle seule sait ce que ça veut dire." }
