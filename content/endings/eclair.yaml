# LE MODE ÉCLAIR — « Le Fusible » : les seules fins qui ne sont pas une jauge (docs/histoires/mode_eclair.md).
#
# Un fusible saute quand une jauge touche le bas ou le haut : ce sont les fins des rôles
# (roles.yaml, `empty`/`full`), réveillées dans le mode éclair par `GameState.mode`. Celles-ci sont
# l'autre issue : la carrière qui atteint la dernière saison que son postulat déclare (`saisons: 10`,
# `fin_de_livre:`, postulats.yaml) sans qu'aucune jauge ait sauté. Dix saisons font trois cent
# soixante semaines : c'est le plafond du score, et presque personne n'y arrive.
#
# Une par rôle, parce que chaque postulat éclair a sa propre `fin_de_livre` (un `epitaph_plus` ne
# porterait que deux variantes) ; même titre, même scène — l'électricien et le boîtier —, la dernière
# phrase change. Elles se posent comme toute fin de verdict (`Engine._finDeLivre`), après le Bilan
# de la dixième saison. Elles n'ont pas de `cause:` : leur porte est un postulat éclair, que la couture
# des livres ignore (build_content les marque `dormante`, hors du Cimetière ; lint.dart ne les compte
# pas comme la porte d'un livre). La page les reconnaît à leur préfixe `ec_tenu_` (preview_eclair.js).
endings:
  - id: ec_tenu_banc
    rarity: epique
    golden: true
    title: "Le fusible a tenu"
    epitaph: "Dix saisons, quatre jauges, et aucune n'a touché le bord. L'électricien du stade ouvre le boîtier, regarde le fusible, le referme. Un fusible, ça se change ; celui-là, personne n'a eu à le faire. Quelqu'un a écrit « {nom} » au feutre, dessous. Le banc est resté chaud, sauf deux dimanches."

