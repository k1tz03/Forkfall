# HISTOIRE 4 — « La Route de la Rive » : les fins du livre (docs/histoires
# § Histoire 4, 8). Schéma : en-tête de content/endings.yaml. Toutes ont leur
# porte dans les cartes du livre (`end:`) :
#   · fdc_micro — le rond central, « Je dis qui conduisait » (la vérité) ;
#   · fdc_chrysanthemes — le silence payé : « Je parle du match » après les
#     chèques, ou le chèque de l'épilogue renvoyé une fois de plus ;
#   · fdc_tour_honneur — Bréhaut prend le micro (rare : Sandrine écoutée au
#     square, le buraliste à +1, Bréhaut convaincu, la route freinée) ;
#   · fdc_route — « J'accélère », la dernière nuit, après la poire du Corner ;
#   · fdc_prescrit — le commissariat, seul, sans avoir prévenu personne.
# Et trois lignes ajoutées à des fins communes, qui ne parlent que dans ce
# livre (`flag('histoire_h4')`) : la garde à vue, les croisés, le jubilé.
#
# Et la fin du livre (`fin_de_livre:` de postulats.yaml, `Engine._finDeLivre`) :
#   · fdc_quatorze_mai — la porte est le verdict de la dernière saison, pas une carte.
#     Elle prend ceux qui n'ont dit ni le micro ni le match : qui a rendu le micro
#     sans un mot (`h4_silence`), et surtout ceux que le Carrefour avait déjà passés
#     au banc de la réserve (la porte que le livre laisse ouverte, `roles.yaml`) :
#     ils continuaient entraîneurs dans le contenu générique, jusqu'à quatorze
#     saisons. Le livre se ferme sur ce qui n'a pas été dit.
endings:
  - id: fdc_micro
    cause: choix
    rarity: epique
    golden: true
    share: false
    title: "Le micro"
    indice: "Au rond central de ton jubilé, une phrase que personne n'a dite depuis le 14 mai 1984."
    epitaph: "Au rond central de son jubilé, {prenom} {nom} a dit au micro qui conduisait le 14 mai 1984, et qui s'était tu ensuite. Le pavillon des Lilas a payé ce que le tribunal a fixé."
    epitaph_plus:
      - { when: "flag('h4_promesse_micro')", text: "Au premier rang de la tribune Est, Sandrine Lavergne n'a pas applaudi. Elle est restée jusqu'au bout." }
      - { when: "flag('h4_cheques')",        text: "Sandrine Lavergne a encaissé le chèque du juge. Jamais ceux de {nom}, qui revenaient chaque mois." }

  - id: fdc_chrysanthemes
    cause: choix
    rarity: rare
    golden: false
    share: false
    title: "Les chrysanthèmes"
    indice: "Un chèque par mois au tabac du Quai, et chaque mois il revient."
    epitaph: "Chaque mois, {prenom} {nom} a envoyé un chèque au tabac du Quai, et chaque mois le chèque est revenu, non encaissé. Les chrysanthèmes sont allés à Jules Bertin jusqu'au bout de l'abonnement."
    epitaph_plus:
      - { when: "flag('h4_brehaut_convaincu')", text: "Titi Bréhaut avait demandé le micro. {nom} l'a gardé, et n'a parlé que du match." }
      - { when: "flag('h4_abonnement_arrete')", text: "L'abonnement, {nom} l'avait arrêté. Il a fallu le reprendre, à son nom, pour Monsieur Bertin." }

  - id: fdc_tour_honneur
    cause: choix
    rarity: legendaire
    golden: true
    share: false
    title: "Le tour d'honneur"
    indice: "Un fauteuil poussé le long de la ligne de touche, et le micro tendu à un autre."
    epitaph: "{prenom} {nom} a fait le tour du terrain en poussant un fauteuil, et c'est Titi Bréhaut qui a pris le micro. Sandrine Lavergne n'a pas pardonné ; elle a regardé le stade se lever."
    epitaph_plus:
      - { when: "flag('h4_cahier_lu')", text: "Le soir, au Corner, Vukić a lu une seule ligne de son cahier de 1984, debout au comptoir. Deux fois." }
      - { when: "relation.lavergne >= 2", text: "Le lundi, au tabac du Quai, Jean Lavergne a posé L'Écho sur le comptoir à l'endroit, la Une vers {nom}." }

  - id: fdc_route
    cause: choix
    rarity: rare
    golden: false
    share: false
    title: "La route"
    indice: "Deux heures du matin, le bout du pont, un fauteuil vide sous un réverbère."
    epitaph: "On a arrêté {prenom} {nom} à deux heures du matin au bout de la route de la Rive, ivre, le moteur chaud, à dix mètres d'un fauteuil vide sous le réverbère. Le procès-verbal donne l'heure exacte, la même qu'en 1984."
    epitaph_plus:
      - { when: "flag('h4_promesse_micro')", text: "Au jubilé, le micro est resté sur son pied, au rond central. Le fauteuil de l'Est n'est pas venu." }
      - { when: "!flag('divorce')",          text: "Camille est venue chercher {nom} au poste, à l'aube. Elle n'a pas demandé les clés." }

  - id: fdc_prescrit
    cause: choix
    rarity: epique
    golden: false
    share: false
    title: "Prescrit"
    indice: "Un commissariat à dix-sept heures, et un commissaire qui t'écoute jusqu'au bout."
    epitaph: "Le commissaire a écouté {prenom} {nom} jusqu'au bout, puis il a refermé le dossier : prescrit. Pour 1984, on ne punit plus personne ; il a quand même tapé la déposition, en trois exemplaires."
    epitaph_plus:
      - { when: "flag('h4_fiche_hopital')", text: "La déposition de {nom} dort aux archives du commissariat, à côté d'une fiche d'hôpital qui dit : vivante." }

  # La fin du livre : la porte est le verdict de la dernière saison, pas une carte.
  - id: fdc_quatorze_mai
    cause: livre
    rarity: commune
    golden: false
    share: false
    title: "Le 14 mai suivant"
    indice: "Aller au bout sans jamais dire qui conduisait la nuit de la montée."
    epitaph: "Le 14 mai suivant, {prenom} {nom} a posé les chrysanthèmes sur la pierre de Jules Bertin, au carré ancien, comme chaque année depuis 1985. Personne n'a entendu dire, ni ce jour-là ni après, qui conduisait la nuit de la montée."
    epitaph_plus:
      - { when: "role_was('joueur')",  text: "{nom} avait pris la réserve avant le jubilé. Vukić garde son cahier de 1984 ouvert à la page du 14 mai ; personne n'est venu la lui demander." }
      - { when: "flag('h4_silence')",  text: "Au rond central, {nom} avait rendu le micro sans s'en servir. Le stade avait applaudi quand même, longtemps, debout." }

# Les lignes du livre sous des fins communes : elles passent après les
# variantes de la fin elle-même.
epitaph_plus_ajouts:
  - { fin: co_garde_a_vue, when: "flag('histoire_h4') && flag('h4_denonce')", text: "Les inspecteurs n'avaient sur la table qu'une photocopie d'hôpital. De 1984, on n'a rien pu reprocher d'autre à {nom}." }
  - { fin: jp_croises,     when: "flag('histoire_h4')", text: "Le genou de {nom} a lâché comme Sabatier l'avait écrit en marge de chaque radio depuis 1984, au crayon gras : 14/5." }
  - { fin: jubile,         when: "flag('histoire_h4')", text: "Au micro, {nom} a remercié la tribune, le club et sa famille. Au premier rang de l'Est, un fauteuil est reparti avant la fin." }
