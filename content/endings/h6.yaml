# Histoire 6 — « 23 h 58 » : les fins du livre, posées par les cartes de la
# nuit du sous-sol (content/cards/ds/h6_script.yaml, créneaux 10-12 de la
# saison 2), et les lignes que l'histoire ajoute aux fins communes.
#   trente_classeur    la vérité : le classeur de Josiane et ta propre photo
#   trente_associe     le prix : tu t'associes au modèle
#   trente_petit_reste rare : Tibo gardé, l'ardoise payée proprement, le piège
#                      sans violence, la vérité dite à Vialat, trente millions
#                      faits une saison, sans l'argent de la Mutuelle
#   trente_une_heure   pire : tu laisses le père Rancé et le stagiaire seuls
#                      une heure
# Ce que le livre laisse au monde, quelle que soit la fin : Tibo Rancé quitte
# le club avant ses vingt et un ans ; Joachim Ferlac fondera une société
# d'analyse des joueurs ; Josiane garde un classeur de photocopies de fax datés
# de 2003 à 2006. Les épitaphes n'en contredisent aucun.
endings:
  - id: trente_classeur
    cause: chaine
    rarity: rare
    golden: true
    title: "Le classeur"
    indice: "Des photocopies empilées, une photo de 1999, et le bureau d'un juge."
    epitaph: "{prenom} {nom} a posé sur le bureau d'un juge un classeur de photocopies et sa propre photo de 1999, et deux noms sont tombés le même jour. Le papier des fax était blanc depuis longtemps ; celui de Josiane, non."
    epitaph_plus:
      - { when: "flag('h6_lea_attend')", text: "L'Écho a publié le surlendemain, deux noms dans l'ordre des faits. Léa avait attendu le second ; celui de {nom} venait en premier." }
      - { when: "flag('h6_tibo_garde')", text: "Tibo Rancé a témoigné aussi, en survêtement du centre. Il a demandé s'il devait signer quelque chose ; on lui a dit non." }

  - id: trente_associe
    cause: chaine
    rarity: rare
    golden: false
    title: "L'association"
    indice: "Trente millions deux saisons de suite, avec un partenaire qu'on ne voit jamais."
    epitaph: "Trente millions, deux saisons de suite, et un associé qu'on ne voyait jamais : {prenom} {nom} a vendu tous les noms que le fax imprimait à 23 h 58. Dix ans plus tard, on ne vendait plus personne sans le modèle de Joachim Ferlac."
    epitaph_plus:
      - { when: "flag('h6_tibo_vendu')", text: "Le petit Rancé est parti avant ses vingt et un ans, à un prix que le modèle trouvait juste." }
      - { when: "flag('h6_loge_vente')", text: "Ilyas a racheté le Racing l'été suivant, dettes comprises. Le modèle de Joachim Ferlac faisait partie du prix ; {nom} aussi." }

  - id: trente_petit_reste
    cause: chaine
    rarity: legendaire
    golden: true
    title: "Le petit reste"
    indice: "Un gamin de dix-sept ans qu'on garde, et un fax qui se tait un jeudi."
    epitaph: "Tibo Rancé a joué au Racing jusqu'à vingt ans, et {prenom} {nom} a fait ses trente millions sans le vendre. Le fax s'est tu un jeudi ; Josiane a rangé le classeur en haut de l'armoire, pour plus tard."
    epitaph_plus:
      - { when: "flag('h6_vl_negatifs')", text: "Les négatifs de 1999 dorment dans un tiroir que {nom} n'ouvre jamais. La maison n'a plus rien à vendre." }
      - { when: "flag('h6_dembo_salue') || relation.dembo >= 1", text: "Dembo a envoyé de Halvenne une carte postale, sans texte : une montre trop grosse, dessinée au stylo." }

  - id: trente_une_heure
    cause: chaine
    rarity: rare
    golden: false
    share: false
    title: "Une heure"
    indice: "Au comptoir du Terminus, un père te demande un peu de ton temps, la nuit."
    epitaph: "On a retrouvé le stagiaire au matin sur le quai, vivant, le nez cassé, ses ordinateurs dans la Rive, et l'on a mis en examen {prenom} {nom} pour complicité. Le fax ne sonne plus ; on reçoit encore, certains soirs, des pages blanches."
    epitaph_plus:
      - { when: "flag('h6_pere_chasse')", text: "Bertrand Rancé avait promis à {nom} d'être prévenu le premier. Il a tenu parole : il a appelé à minuit moins deux." }
      - { when: "flag('h6_photocopies') || flag('h6_classeur_revele')", text: "Le classeur de Josiane est resté au secrétariat. Personne n'est venu le chercher ; elle a continué de photocopier les pages blanches." }

epitaph_plus_ajouts:
  # Sur les fins du livre : servies quand aucune des deux variantes n'est vraie.
  - { fin: trente_classeur,  when: "flag('h6_commission_temoin')", text: "Berthomier a versé au dossier le témoignage de {nom}, daté de l'automne : il le gardait depuis, à la bonne lettre." }
  - { fin: trente_classeur,  when: "flag('h6_solvang_alliee')", text: "À la sortie du palais, Ingrid Solvang attendait, le manteau sur le bras : « Vous me deviez un client. » C'était {nom}." }
  - { fin: trente_classeur,  when: "flag('h6_envoi_vu')", text: "La dernière page du classeur est celle du 31 janvier : SÁ MOREIRA, 2 MILLIONS. Josiane l'avait photocopiée deux fois." }
  - { fin: trente_associe,   when: "flag('h6_tableur_adopte')", text: "Le tableau de 2005 tournait encore, dans un coin de l'écran, quand {nom} a quitté le bureau ; personne ne l'a éteint." }
  - { fin: trente_associe,   when: "flag('h6_dembo_evite')", text: "Des années plus tard, à un jubilé, Dembo est passé devant {nom} sans s'arrêter, comme dans le couloir de la Rive." }
  - { fin: trente_une_heure, when: "flag('h6_loge_refus')", text: "L'offre d'Ilyas est sortie du tiroir du père Vaubourg le surlendemain, revue à la baisse : le Racing ne valait plus que ses dettes." }
  # Sur les fins communes.
  - { fin: co_garde_a_vue,   when: "flag('h6_commission_accuse')", text: "La Commission avait déjà un dossier au nom de {nom} ; Berthomier l'a fait porter au commissariat en dix minutes." }
  - { fin: co_garde_a_vue,   when: "flag('h6_solvang_alliee')", text: "À la sortie du commissariat, Ingrid Solvang attendait, le manteau sur le bras : « Vous me deviez un client. » C'était {nom}." }
  - { fin: ds_commun_accord, when: "flag('h6_arnaud_soupconne')", text: "Arnaud Vaubourg a lu le communiqué sans lever les yeux vers {nom}. On lui avait demandé des preuves ; il en rendait une." }
  - { fin: co_garde_a_vue,   when: "flag('histoire_h6')", text: "Quarante-huit heures pour expliquer des enveloppes ; la seule photo qu'ils ont posée sur la table était de 1999." }
  - { fin: ds_roi_mercato,   when: "flag('histoire_h6')", text: "Trop de commissions, trop bien rangées : l'enquête a commencé par le bureau du recrutement et fini au sous-sol." }
  - { fin: ds_commun_accord, when: "flag('histoire_h6')", text: "Arnaud Vaubourg a lu le communiqué de trois lignes à la presse ; c'était son père qui l'avait écrit." }
  - { fin: ds_contrats,      when: "flag('histoire_h6') && vars.h6_fax_refus >= 2", text: "Les contrats impayables, {nom} les avait refusés au fax, un par un. Le fax, lui, n'avait rien à payer." }
  - { fin: ds_fronde,        when: "flag('histoire_h6') && vars.h6_ventes >= 3", text: "Le staff avait compté les départs au feutre, sur le mur du vestiaire : un trait par vente, et un trait plus gros pour Dembo." }
  - { fin: ds_mercato_rate,  when: "flag('histoire_h6') && flag('h6_tibo_vendu')", text: "La bâche disait aussi : RANCÉ, QUATRE MILLIONS. Les lettres du prix étaient plus grosses que celles du nom." }
