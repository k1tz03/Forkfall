# « L'Oreillette » (Histoire 8) — les fins (docs/histoires/00_les_dix_histoires.md,
# Histoire 8 § 8). Quatre fins neuves, et trois lignes ajoutées à des fins
# communes. Les portes :
#   · modele_voix       — « Je signe », à 23 h 58 (ds.h8.c4_23h58*) ;
#   · modele_silence    — « Je signe la ligne », le lendemain, chez Léa
#                         (ds.h8.c4b_lea) ;
#   · modele_six_heures — « Je reste », la veille de la date de Vaubourg
#                         (ds.h8.b3_veille_chaise, la variante rare) ;
#   · modele_clinique   — « Moi », dans le noir, l'oreillette gardée
#                         (ds.h8.c3_deux_heures_gardee), ou l'oreillette de la
#                         friche, l'été d'après (ds.h8.d1_boite_friche,
#                         ds.h8.d2_veille_friche).
# La garde à vue (la brigade, ds.h8.sb.brigade), le burn-out (la nuit blanche,
# ds.h8.sb.nuit_blanche*) et « D'un commun accord » (la jauge du président à
# zéro) reçoivent leur ligne propre.
#
# Et la fin du livre (`fin_de_livre:` de postulats.yaml, `Engine._finDeLivre`) :
#   · modele_cinq_heures — la porte est le verdict de la dernière saison, pas une
#     carte. Elle prend qui n'a signé ni la voix à 23 h 58 ni la ligne de 2017 chez
#     Léa : sans fin du livre sous la main, il finissait au burn-out ou au grand
#     déballage, des saisons plus tard (7 % des carrières, mesuré). Le livre se ferme
#     sur la dernière scène qu'il a écrite pour lui, six heures dix.
endings:
  - id: modele_silence
    cause: choix
    rarity: rare
    golden: true
    title: "Le silence"
    indice: "Une fenêtre de la Tréfilerie qui s'éteint maintenant avant minuit."
    epitaph: "{prenom} {nom} a enlevé l'oreillette pour de bon et donné à Léa les courbes, la voix et sa propre ligne de code ; le fonds a vendu le Racing au printemps. On dit qu'à la Tréfilerie, une fenêtre s'éteint maintenant avant minuit."
    epitaph_plus:
      - { when: "flag('h8_ober_temoin')", text: "Le docteur Ober a été mis en examen en mai. Il a demandé que le nom de Kerdal soit écrit en premier dans le dossier." }
      - { when: "flag('h8_kerdal_mort')", text: "Le Quotidien a publié la ligne de 2017 en entier, avec le nom de {nom} dessous et celui d'Erwan Kerdal à côté." }

  - id: modele_voix
    cause: choix
    rarity: commune
    golden: false
    title: "La voix"
    indice: "Vingt-trois heures cinquante-huit, un gamin de seize ans, ta main au-dessus de l'écran."
    epitaph: "Le Racing a gagné ce que le modèle avait prévu, et {prenom} {nom} a gardé la voix jusqu'au bout. L'année suivante, dans l'oreille du directeur sportif d'après, c'était sa voix qui disait : on commence par les ventes ?"
    epitaph_plus:
      - { when: "flag('h8_milo_promis')", text: "Nino avait eu une promesse, sur le palier. Milo a signé à Roquemont à minuit moins deux ; il avait lu tout le contrat." }
      - { when: "flag('h8_siege')", text: "Au siège d'Almadis, la porte d'un bureau sans fenêtre porte le nom de {nom}, en petites lettres, sous un numéro." }

  - id: modele_six_heures
    cause: choix
    rarity: rare
    golden: true
    title: "Six heures et demie"
    indice: "La chaise de 1977, devant le bureau d'un vieux président, la veille."
    epitaph: "Le modèle avait prévu l'heure, pas la chaise de 1977, où {prenom} {nom} était assis{pg, select, f{e} other{}} en face de Jean-Marie Vaubourg quand le vieil homme est mort. Juste avant, il avait dit qu'il n'avait jamais aimé le téléphone."
    epitaph_plus:
      - { when: "flag('h8_kerdal_vit')", text: "Kerdal a porté le cercueil avec Mbako. Il avait dormi la veille, et il le répétait à tout le monde à la sortie de l'église." }
      - { when: "relation.josiane >= 2", text: "Josiane a monté l'escalier sans la rampe, ce matin-là, et n'a rien demandé à {prenom} {nom}." }

  - id: modele_clinique
    cause: choix
    rarity: rare
    golden: false
    title: "La clinique"
    indice: "Chaque soir, on demande d'éteindre ce qui parle. L'infirmière dit qu'il n'y a personne."
    epitaph: "À la clinique des Hauts-de-Rive, {prenom} {nom} demande chaque soir qu'on éteigne la voix, et l'infirmière répond doucement qu'il n'y a personne. Dans le noir, la voix dit l'heure."
    epitaph_plus:
      - { when: "flag('h8_service_coupe')", text: "Le service de nuit d'Almadis avait été supprimé le 3 novembre. Inès Kara envoie une carte chaque mois, que l'infirmière lit au bord du lit." }
      - { when: "flag('h8_oreillette_friche')", text: "L'oreillette de la friche est dans le tiroir de la table de nuit. Elle n'a plus de pile. Elle est allumée." }

  # La fin du livre : la porte est le verdict de la dernière saison, pas une carte.
  - id: modele_cinq_heures
    cause: livre
    rarity: commune
    golden: false
    title: "Cinq heures"
    indice: "Le dernier soir du mercato, ne rien signer et laisser Milo au centre."
    epitaph: "Le dernier soir du mercato, {prenom} {nom} n'a rien signé ; à minuit, Milo était toujours au centre. À six heures dix, le car attendait devant le stade, moteur allumé, et {nom} avait dormi cinq heures d'une traite."
    epitaph_plus:
      - { when: "flag('h8_ligne_gardee')",  text: "La ligne de 2017 est restée sans personne dessous. Léa a publié le reste, « moins vrai » ; le démenti d'Almadis est tombé le lendemain, en page quatre." }
      - { when: "flag('h8_vaubourg_mort')", text: "La canne de Vaubourg est restée au clou de l'escalier. Josiane la frotte chaque matin à six heures et demie, sans le dire à personne." }

# Les lignes propres de cette histoire sous trois fins communes (elles passent
# après les variantes de la fin elle-même).
epitaph_plus_ajouts:
  - { fin: co_garde_a_vue, when: "flag('histoire_h8')", text: "Ni téléphone, ni écran, ni oreillette. Dans la cellule, personne ne t'a parlé à l'oreille, et tu as dormi deux nuits." }
  - { fin: burn_out, when: "flag('histoire_h8')", text: "Soixante-douze matchs par saison, deux heures de sommeil par nuit. Dans l'ambulance, la voix donnait encore le programme du lendemain." }
  - { fin: ds_commun_accord, when: "flag('histoire_h8')", text: "Le nom du suivant, c'est le modèle qui l'avait proposé, trois semaines plus tôt." }
