# La police — la fin commune des affaires qui tournent mal : sponsors louches
# (content/arcs/*/sponsors_louches.yaml), missions de la ville
# (content/ville/missions.yaml → content/arcs/*/ville_risques.yaml), et biens
# achetés avec de l'argent qu'on ne peut pas expliquer (content/arcs/*/biens.yaml).
# Une carte s'y ferme par `end: co_garde_a_vue`.
endings:
  - id: co_garde_a_vue
    cause: chaine
    rarity: rare
    golden: false
    title: "La garde à vue"
    indice: "Des inspecteurs, une cellule, et un communiqué où ton nom est écrit en entier."
    epitaph: "Quarante-huit heures dans une cellule du commissariat central. À la sortie, le club avait publié un communiqué de trois lignes ; ton nom y était en entier."
    epitaph_plus:
      - { when: "relation.josiane >= 1", text: "Josiane a vidé le bureau de {nom} elle-même, carton par carton, avant que la presse n'arrive." }
      - { when: "relation.gege <= -1", text: "Au virage, une banderole attendait {nom} à la sortie du commissariat. Elle disait seulement : MERCI POUR TOUT." }
