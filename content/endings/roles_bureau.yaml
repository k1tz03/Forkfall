# Les fins des rôles de bureau et de banc national : le directeur sportif (ds_),
# le président (pr_) et le sélectionneur (sl_) — huit fins de jauge chacun. La
# fin de vie qui les attend tous les trois, Ta loge (78 ans, roles.yaml
# `retraite`), est dans setpieces_fins.yaml. Transcrites de la bible
# (docs/bible/12 § 9, 13 § 11.2, 14 § 10) ; les `epitaph_plus` dont la trace
# n'existe pas encore dans le contenu sont laissées à la bible, en attendant les
# histoires qui les posent.
endings:
- id: ds_fronde
  gauge: vestiaire
  side: vide
  title: La fronde
  epitaph: Le coach et le capitaine ont donné une conférence de presse sans toi, sur toi. Massenet a noté ton silence ; il était au fond de la salle, à ta place.
- id: ds_copains
  gauge: vestiaire
  side: plein
  rarity: rare
  title: Le club des copains
  epitaph: Tu recrutais tes amis, et les amis ont des agents, et les agents ont des cousins. L'Inspecteur a compté les cousins ; il y en avait plus que de joueurs.
- id: ds_mercato_rate
  gauge: tribunes
  side: vide
  title: Le mercato raté
  epitaph: Viré{pg, select, f{e} other{}} avec le coach, le même jour, dans le même communiqué ; il avait deux lignes, tu en avais une. La bâche faisait vingt mètres et deux lettres.
  epitaph_plus:
  - when: flag('fax_rate')
    text: Le fax était parti à 23 h 59. Celui de Fardelli à 23 h 58 ; {prenom} {nom} avait attendu la page trois.
- id: ds_architecte
  gauge: tribunes
  side: plein
  rarity: rare
  golden: true
  title: L'architecte
  epitaph: 'On t''a crédité{pg, select, f{e} other{}} de tout : le titre, la pelouse, le gaucher. Le Castel Montoya t''a recruté{pg, select, f{e} other{}} comme architecte et t''a broyé{pg, select, f{e} other{}} comme fusible, en dix-huit mois, quatorze clubs, une table.'
- id: ds_commun_accord
  gauge: direction
  side: vide
  title: D'un commun accord
  epitaph: Le communiqué faisait trois lignes. La première disait « d'un commun accord », la deuxième te remerciait, la troisième donnait le nom du suivant ; il était déjà là.
- id: ds_homme_president
  gauge: direction
  side: plein
  title: L'homme du président
  epitaph: Le club a été racheté, et le nouveau propriétaire avait son homme. Tu étais celui de l'ancien ; on t'a laissé le bureau une semaine, pour vider le tiroir de la page deux.
- id: ds_contrats
  gauge: caisse
  side: vide
  title: Les contrats impayables
  epitaph: Les contrats que tu as signés couraient plus vite que les recettes. Le président t'a livré{pg, select, f{e} other{}} à la Commission avec les originaux ; il avait gardé les copies.
- id: ds_roi_mercato
  gauge: caisse
  side: plein
  rarity: rare
  title: Le roi du mercato
  epitaph: Tu as vendu tout le monde, deux fois. Les commissions ont fait le tour du monde et sont revenues par une île ; l'enquête a commencé par ton bureau, à six heures du matin.
- id: pr_greve
  gauge: vestiaire
  side: vide
  title: La grève des salariés
  epitaph: Le jour du derby, même le jardinier était en grève. La pelouse a tenu ; pas toi.
- id: pr_fantome
  gauge: vestiaire
  side: plein
  rarity: rare
  title: Le président fantôme
  epitaph: L'entraîneur signait les recrues, les contrats et les cartes de vœux. Le conseil a signé ton départ ; il ne manquait que ça.
- id: pr_siege
  gauge: tribunes
  side: vide
  title: Le siège du siège
  epitaph: Les supporters ont occupé le siège du club. Tu as appris ce jour-là que le tien était éjectable.
- id: pr_mairie
  gauge: tribunes
  side: plein
  rarity: rare
  title: La mairie
  epitaph: Porté{pg, select, f{e} other{}} par les tribunes, tu t'es présenté{pg, select, f{e} other{}} à la mairie. Tu as perdu ; le club aussi, entre-temps.
  epitaph_plus:
  - when: flag('subvention_perdue')
    text: Le stade promis n'avait pas de grue. {prenom} {nom} en a fait un argument de campagne ; la Gazette en a fait une date.
- id: pr_ag
  gauge: direction
  side: vide
  title: L'AG
  epitaph: À l'assemblée générale, on a voté ton départ à main levée. La tienne était la seule à ne pas se lever ; elle a été comptée quand même.
- id: pr_pantin
  gauge: direction
  side: plein
  rarity: rare
  title: Le pantin
  epitaph: Tu étais si proche de la Ligue qu'on t'y a offert un bureau. Le club a été vendu pendant que tu signais la carte de membre.
- id: pr_commission
  gauge: caisse
  side: vide
  title: La Commission des comptes
  epitaph: La Commission a compté. Tu avais compté aussi, mais pas dans le même sens.
- id: pr_fonds
  gauge: caisse
  side: plein
  rarity: rare
  title: Le fonds
  epitaph: Un fonds a trouvé ta trésorerie magnifique. Il l'a achetée, avec le club autour, sans toi.
- id: sl_clans
  gauge: vestiaire
  side: vide
  title: Les deux clans
  epitaph: Deux clans, un vestiaire, une seule porte. Tu étais du mauvais côté de la porte.
  epitaph_plus:
  - when: flag('mutinerie')
    text: Le bus n'est pas descendu. {prenom} {nom} est descendu{pg, select, f{e} other{}} seul{pg, select, f{e} other{}} ; il pleuvait, comme pour l'entraîneur.
- id: sl_fete
  gauge: vestiaire
  side: plein
  rarity: rare
  title: La fête
  epitaph: Tu les as laissés fêter, et ils ont fêté. Le pays entier a vu les photos de {prenom} {nom}, et elles étaient nettes.
- id: sl_ennemi_public
  gauge: tribunes
  side: vide
  title: L'ennemi public
  epitaph: Un pays entier a appris ton nom pour le crier. Tu as déménagé. Ils ont suivi.
- id: sl_ambassadeur
  gauge: tribunes
  side: plein
  rarity: rare
  title: L'ambassadeur
  indice: "Trop aimé du pays pour un chef d'État nerveux : il t'enverra loin."
  epitaph: Trop populaire pour un chef d'État nerveux. {prenom} {nom} a été nommé{pg, select, f{e} other{}} ambassadeur aux îles Basses.
- id: sl_minuit
  gauge: direction
  side: vide
  title: Minuit et une
  indice: "Ton contrat expire ce soir. Tu restes près du téléphone et tu regardes l'heure."
  epitaph: Ton contrat expirait à minuit, et {prenom} {nom} a attendu près du téléphone. Il a sonné à minuit et une, et on a raccroché à minuit deux.
- id: sl_homme_president
  gauge: direction
  side: plein
  rarity: rare
  title: L'homme du président
  indice: "Celui qui t'a nommé tombe une nuit de novembre. Tu es le premier sur sa liste."
  epitaph: Tu étais l'homme du président, et le président est tombé une nuit de novembre. {prenom} {nom} était le premier nom de la liste des siens.
- id: sl_charters
  gauge: caisse
  side: vide
  title: Les charters
  epitaph: La Fédération n'avait plus de quoi payer les charters et a sacrifié le plus gros salaire. {prenom} {nom} voyageait en première ; c'est ce qui a été retenu.
- id: sl_primes_cachees
  gauge: caisse
  side: plein
  rarity: rare
  title: Les primes cachées
  epitaph: Le sponsor versait à {prenom} {nom} des primes que la Fédération ignorait, et elle l'a appris par la presse un dimanche. Rupture pour faute grave le lundi, à neuf heures.
  epitaph_plus:
  - when: relation.nassir >= 2
    text: Ilyas a dit que ce n'était pas une sélection, c'était un actif. L'actif s'appelait {nom} ; il a été déprécié.
