# La ruine — la fin commune de l'argent qui manque (le mode histoire : la
# carrière s'arrête par l'histoire, et la banqueroute en est une). C'est la
# ville qui la déclare (packages/tools/web/ville.js, `nouvelleSemaine`) : le
# découvert a duré, l'huissier est passé et n'a plus rien trouvé à saisir. Le
# moteur la pose par `Engine.banqueroute` ; aucune carte ne s'y ferme.
endings:
  - id: co_banqueroute
    cause: ruine
    rarity: rare
    golden: false
    title: "La banqueroute"
    indice: "Un découvert qui dure, un huissier qui passe, un tribunal de commerce un mardi."
    epitaph: "Le tribunal de commerce de Portclair a lu la liste un mardi : la voiture, la montre, le canapé, le reste. Le greffier a fait l'addition à la main, et il manquait encore de l'argent."
    epitaph_plus:
      - { when: "relation.josiane >= 1", text: "Josiane a glissé une enveloppe sous ta porte, avec son écriture de secrétaire : « Pour le loyer. Ne me la rendez pas. »" }
      - { when: "relation.fardelli >= 1", text: "Fardelli a appelé le lendemain : « Ton nom, mon ami, j'ai quelqu'un que ça intéresse. » Tu as raccroché ; il a rappelé deux fois." }
