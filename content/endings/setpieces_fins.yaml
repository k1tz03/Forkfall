# Les fins de la bible ch. 30 § 5, pour les deux rôles qui existent aujourd'hui
# (entraîneur et joueur). Le chapitre en écrit trente et une : celles des six
# autres familles (président amateur, président pro, directeur sportif,
# sélectionneur, dirigeant d'instance) attendent leurs rôles et ne sont pas
# importées ici — voir le rapport de lot.
#
# Chaque plaque : titre, épitaphe de deux phrases (le joueur nommé une fois,
# accord de genre par `{pg, select, …}`), et deux `epitaph_plus` — une phrase,
# jamais deux, qui ne répète pas l'épitaphe mais ajoute le détail que seule
# cette carrière-là a produit, et qui ne nomme pas le joueur (§ 5.7).
endings:
  # ─────────────────────────────────── § 5.2 · les fins de choix et de chaîne
  - id: co_cheque
    cause: choix
    rarity: commune
    golden: false
    title: "Le Chèque"
    indice: "Un papier signé, pas daté, et une porte restée ouverte sur le secrétariat."
    epitaph: "Tu as pris le chèque. Josiane tenait la porte, et {prenom} {nom} est sorti{pg, select, f{e} other{}} en marchant droit, le papier plié dans la poche."
    epitaph_plus:
      - { when: "flag('cheque_non_date')", text: "Vaubourg ne l'avait pas daté. La banque a attendu trois semaines avant de le payer." }
      - { when: "objective.promised",      text: "La promesse d'août tenait sur une ligne ; le chèque, sur deux." }

  - id: en_chaussure
    cause: choix
    rarity: rare
    golden: false
    title: "La chaussure"
    indice: "Quelque chose a été jeté au milieu du vestiaire, et le couloir est plein de micros."
    epitaph: "Tu as shooté dans une chaussure, un soir de défaite. Elle a ouvert l'arcade de ta star devant douze micros, et la photo a fait trois Unes."
    epitaph_plus:
      - { when: "flag('mbako_revu')", text: "Mbako a montré l'arcade en direct, longuement, sous trois angles." }
      - { when: "flag('otage_kop')",  text: "Le virage a chanté « encore » ; le président a lu ça comme un programme." }

  # ──────────────────────────── § 5.3 · les fins judiciaires et financières
  - id: co_dix_huit_mois
    cause: chaine
    rarity: rare
    golden: false
    share: false
    title: "Dix-huit mois"
    indice: "Une convocation en recommandé : deux inspecteurs, jeudi matin, et trois ans de comptes."
    epitaph: "Fraude fiscale, dix-huit mois, une cellule avec vue sur un parking. Ton codétenu demandait des pronostics à {nom}, qui les donnait faux."
    epitaph_plus:
      - { when: "flag('offshore')",        text: "La société du cousin s'appelait comme une plage. Le juge a demandé laquelle." }
      - { when: "flag('carnet_fardelli')", text: "Le carnet noir a été saisi le même jour ; le nom y était deux fois, dont une au crayon." }

  # ──────────────────────────────────────────── § 5.4 · les fins d'objectif
  - id: co_relegation
    cause: objectif
    rarity: commune
    golden: false
    title: "La relégation"
    indice: "Une table longue, douze chaises occupées, et quelqu'un qui réclame un nom."
    epitaph: "Descendu{pg, select, f{e} other{}} d'une division. Au premier match, on voyait les rangées vides depuis le banc, et aucun actionnaire n'est venu au vestiaire."
    epitaph_plus:
      - { when: "flag('salaires_retard')", text: "Les salaires de mai sont tombés en août, dans une division de moins." }
      - { when: "relation.gege >= 1",      text: "Le virage a chanté jusqu'à la fin, et il est resté après le coup de sifflet, à chanter pour le terrain vide." }

  # « Sixième à un point » dans la bible ; le classement du moteur ne rend jamais
  # un rang entre 5 et 10 (packages/core, seasonVerdict), et le Cimetière ne doit
  # pas afficher un rang que le Bilan n'a pas écrit : la plaque dit « quatrième »,
  # et sa porte (co.verdict.photo_famille) lit `world.rang_final == 4`.
  - id: co_photo_famille
    cause: objectif
    rarity: commune
    golden: false
    title: "La photo de famille"
    indice: "À un point du podium. Jeudi, le photographe demande qui sera sur le cliché."
    epitaph: "Quatrième, à un point. On a refait la photo de famille du club sans {nom}, et le photographe s'est excusé, lui."
    epitaph_plus:
      - { when: "objective.promised",         text: "La promesse d'août était affichée au local, datée, à la craie." }
      - { when: "flag('classeur_josiane')",   text: "Le classeur vert avait la photo de l'an dernier. La même, à un visage près." }

  # ─────────────── § 5.5 · les fins de fin de vie, dorées, et de conclusion
  - id: ta_loge
    cause: age
    rarity: rare
    golden: true
    title: "Ta loge"
    indice: "Un salon chauffé au-dessus du terrain, un derby dimanche, et « assis » sur l'ordonnance."
    epitaph: "Tu t'es endormi{pg, select, f{e} other{}} dans ta loge à la soixante-dixième, souriant{pg, select, f{e} other{}}. Le derby a été gagné ; on ne t'a pas réveillé{pg, select, f{e} other{}}."
    epitaph_plus:
      - { when: "flag('banc_de_gigi')",    text: "Deux sièges vides ce jour-là : le banc en bois derrière le but, et le tien." }
      - { when: "flag('dimanche_promis')", text: "Le dimanche était noté en rouge sur un planning. On a baissé la musique." }

  - id: mort_au_poste
    cause: age
    rarity: rare
    golden: false
    share: false
    title: "Mort au poste"
    indice: "Dix-neuf de tension, un derby dimanche, et personne pour te dire non."
    epitaph: "Tu es mort{pg, select, f{e} other{}} dans ton fauteuil, au stade, pendant la quatre-vingt-neuvième minute. L'arbitre a ajouté une minute d'arrêt de jeu."
    epitaph_plus:
      - { when: "relation.sabatier >= 1",   text: "Le médecin était à trois rangs. Il a signé le certificat sur ses genoux, avant la fin du temps additionnel." }
      - { when: "flag('telegramme_clow')",  text: "Le télégramme de six mots était dans la poche de la veste, usé aux pliures." }

  - id: statue_de_bronze
    cause: choix
    rarity: rare
    golden: true
    title: "La statue de bronze"
    indice: "Une boîte en fer : les pièces de la quête du virage, depuis ton premier match."
    epitaph: "Tu as tout gagné, tout dit, et {prenom} {nom} est parti{pg, select, f{e} other{}} avant qu'on le lui demande. On a coulé la statue en bronze, pas en résine."
    epitaph_plus:
      - { when: "flag('pacte_gege')", text: "Le virage a payé le socle, en pièces, dans une boîte en fer." }
      - { when: "flag('clow_revu')",  text: "Un vieux monsieur au premier rang, un verre d'eau plein à la main, a dit qu'il n'était pas surpris. L'eau tremblait dans le verre." }

  - id: burn_out
    cause: chaine
    rarity: commune
    golden: false
    share: false
    title: "Le burn-out"
    indice: "La troisième conférence de presse de la journée. Ta main tremble depuis la deuxième."
    epitaph: "Tu as fait un malaise à la troisième conférence de presse de la journée. Pendant que le médecin parlait de repos, le président appelait ton remplaçant."
    epitaph_plus:
      - { when: "relation.camille >= 1", text: "Camille est venue à l'hôpital avec des vêtements propres, et elle n'a posé aucune question." }
      - { when: "flag('divorce')",       text: "Personne n'avait le numéro à appeler. On a appelé le club." }

  - id: co_pacte_tenu
    cause: chaine
    rarity: rare
    golden: true
    title: "Le local rénové"
    indice: "Des ciseaux tendus devant une porte repeinte, et ton nom peint au-dessus."
    epitaph: "Le local a été rénové, la date est restée à la craie, et le nom de {nom} est sur le mur au-dessus. Tu es parti{pg, select, f{e} other{}} le jour de l'inauguration."
    epitaph_plus:
      - { when: "flag('onze_du_virage')", text: "Le onze du virage est encadré à côté. Il ressemble beaucoup au tien." }
      - { when: "relation.gege >= 3",     text: "Gégé a fait le discours. Deux phrases, et il s'est arrêté au milieu de la deuxième." }

  # ────────────────────────────────────────── § 5.6 · les fins de monde
  - id: co_fuyard
    cause: chaine
    rarity: commune
    golden: false
    title: "La porte de sortie, la troisième fois"
    indice: "Trois démissions dans la même chemise, de la même main."
    epitaph: "Tu es parti{pg, select, f{e} other{}} avant la fin trois fois de suite. La quatrième, personne n'a proposé de porte à {nom}."
    epitaph_plus:
      - { when: "parole <= -3",            text: "Douze promesses en cours, aucune close, et un carnet d'adresses qui ne répond plus." }
      - { when: "flag('dossier_repris')",  text: "Josiane avait gardé les trois lettres de démission dans la même chemise. Seule la date change." }
