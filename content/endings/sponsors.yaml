# Les sponsors louches — la fin de la justice sportive, à côté de celle de la
# police (co_garde_a_vue, content/endings/police.yaml). Sa porte : « Je
# signe », au petit salon de l'hôtel de la Rive, sur les cartes de la
# commission (co.sp.commission_*, content/cards/common/sponsors_louches.yaml) :
# un match vendu (la dette de Gigi), un carton jaune à la minute (la table du
# jeudi), des ampoules sans notice (le laboratoire), ou les noms déjà donnés à
# l'inspecteur. Le joueur nommé une fois dans l'épitaphe ; les deux
# `epitaph_plus` ne le nomment pas.
endings:
  - id: co_radiation
    cause: chaine
    rarity: rare
    golden: false
    share: false
    title: "La radiation"
    epitaph: "Radié{pg, select, f{e} other{}} à vie par la commission de discipline, un mardi, au petit salon d'un hôtel. {prenom} {nom} a signé sans relire ; le tampon, lui, est tombé deux fois."
    epitaph_plus:
      - { when: "flag('sp_gigi_livre')",     text: "Gigi Vecchio a témoigné le dernier. Il n'a parlé que du remplacement de la 75e." }
      - { when: "flag('sp_tripot_service')", text: "Le carton jaune de la 31e est encadré quelque part, dans l'arrière-salle d'un casino." }
