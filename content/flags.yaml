# Drapeaux déclarés. Le lint avertit sur un drapeau écrit mais jamais lu.
flags:
  - genou            # blessure grave du joueur
  - interim          # entraîneur intérimaire
  - international    # a été appelé en sélection
  - capitaine        # porte le brassard
  - pepite           # a lancé un jeune
  - star_banc        # a mis la star sur le banc
  - special          # "le Spécial" en conf de presse
  - pisteur          # a parié
  - offshore         # société offshore
  - ami_ultras       # proche de la tribune
  - homme_president  # devenu la créature du président
  - galactique       # transfert record
  - diplome          # a passé le diplôme d'entraîneur
