# le nom complet) est remplacé par le nom tiré, avec le message « La
# Fédération a refusé l'inscription. Réessaie. ». Jamais affichée, jamais
# exportée.
#
# Périmètre : injures et insultes courantes du français (et leurs variantes
# d'orthographe usuelles), slurs, termes sexuels ou scatologiques que le
