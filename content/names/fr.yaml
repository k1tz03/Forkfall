# Pools de tirage du nom par défaut (spec variété §1.8). Le nom reste
# saisissable par le joueur ; ces listes ne servent qu'au défaut et aux
# entités tirées (capitaine, coach adverse).
# Époque : la chronologie du jeu démarre en 1990 et le protagoniste prend un
# banc ou une carrière à cette date — les prénoms sont donc ceux d'une
# génération née entre 1945 et 1965, pas ceux des années 2010.
# Aucun prénom ni nom de famille d'un personnage du jeu (Bréhaut, Camille,
# Léa, Vecchio…) : le moteur les filtre aussi à la construction, mais les
# listes ne doivent pas les contenir.
# Aucun patronyme d'un footballeur reconnaissable non plus : Cissé, Bassong,
# Meunier et Kanté ont été remplacés par Sannier, Betombo, Roussel et Barège
# (même registre, aucun écho). Le lint croise la liste avec le lexique
# `_patronymesEchoFoot` (packages/tools/bin/lint.dart).
prenoms_m: [Alain, Bernard, Christian, Daniel, Lucien, Michel, Patrick, Philippe, Serge, Marc, Pascal, Yves, Guy, René, Claude, Raymond, Roland, Gilbert, Francis, Bruno, Olivier, Farid, Saïd, Mustapha, Antonio, Manuel, Joël, Hervé, Jean-Claude, Gilles]
prenoms_f: [Martine, Nicole, Chantal, Françoise, Catherine, Sylvie, Isabelle, Christine, Véronique, Corinne, Brigitte, Monique, Danièle, Annick, Colette, Yvette, Michèle, Bernadette, Jacqueline, Fatima, Maria, Évelyne]
noms: [Ferrand, Bonnet, Rocher, Vasseur, Da Silva, Lemoine, Perrin, Guisard, Nkolo, Traoré, Vaquez, Marchetti, Delaunay, Fauvel, Sannier, Ricci, Ollier, Betombo, Roussel, Sabbah, Lourenço, Barège, Bianchi, Chastain, Peyrard, Vollaire, Nogaret, Estève]
club_prefixes: [US, AS, FC, Olympique, Racing, Stade, Sporting, Union, Étoile]
# Cinq entrées étaient des communes françaises réelles (Villefranche, Beaulieu,
# Fontaine, Valmont, Néville) : « Étoile Villefranche » tombait à une lettre
# d'un club existant. Remplacées par des composés du même moule que Valdorne ou
# Roquemont. Le reste de la liste est à la bonne distance (spec § 0).
# Seconde passe (« aucun nom réel, même à peine maquillé », la règle du dépôt :
# docs/brainstorm/08, nommage des clubs — jamais de calembour phonétiquement
# proche, jamais le couple ville + forme sociale d'un club réel) : quatre
# entrées, des calembours sur des villes de clubs existants, donnaient une fois
# préfixées un club réel à quelques lettres près, une cinquième n'était pas une
# ville mais une région, et une sixième tombait à deux lettres de la forme
# FRANÇAISE d'un club étranger (la liste de la première passe ne portait que les
# noms d'origine). Elles sont devenues Tissemont, Chauderne, Halvenne,
# Montelvane, Brévillac et Crevelaine, AUX MÊMES RANGS : le tirage
# (`rng.nextInt(villes.length)`) ne bouge pas, seul le mot servi change. Dans le
# contenu, deux noms de lieux calqués sur des communes réelles ont été renommés
# de même (Rochenoire, Torlenac), et le sixième partout où il était écrit. On ne
# réécrit pas ici les anciens mots : un nom à peine maquillé reste un nom réel.
# Vérifié sur près de quatre cents noms de clubs réels (France de la L1 au
# National, grands championnats d'Europe, chacun sous son nom d'origine ET sous
# sa forme française) : les 9 préfixes × les 15 villes (135 clubs) ne tombent
# plus à distance de Levenshtein ≤ 2 d'aucun d'eux ; ni les noms de clubs écrits
# en dur dans le contenu.
villes: [Valmorne, Chauderne, Tissemont, Valdorne, Portclair, Montelvane, Brévillac, Halvenne, Roquemont, Villebranle, Beaudieu, Castérac, Fontenaire, Aubérive, Crevelaine]
# Les nations du sélectionneur (bible ch. 14 et 00 § 1) : son classement est
# un classement de sélections. Toutes inventées ; « les Cobalts » est le surnom
# de la sélection du pays, qu'un postulat impose par `club:`.
nations: [Sylvanie, Ostrélie, Vestrie, Brumelande, Dalmarie, Cormandie, Boréalie, Îles Basses, Al-Dorado, Morlande, Aurélanie, Brévonie, Dorsavie, Fennaudie, Galmérie, Jorvanie, Kerlavie, Norvalie, Orsanie, Saventie, Tarvanie]
