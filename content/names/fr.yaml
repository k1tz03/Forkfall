# Pools de tirage du nom par défaut (spec variété §1.8). Le nom reste
# saisissable par le joueur ; ces listes ne servent qu'au défaut et aux
# entités tirées (capitaine, coach adverse).
# Époque : la chronologie du jeu démarre en 1990 et le protagoniste prend un
# banc ou une carrière à cette date — les prénoms sont donc ceux d'une
# génération née entre 1945 et 1965, pas ceux des années 2010.
# Aucun prénom ni nom de famille d'un personnage du jeu (Bréhaut, Camille,
# Léa, Vecchio…) : le moteur les filtre aussi à la construction, mais les
# listes ne doivent pas les contenir.
# Aucun patronyme d'un footballeur reconnaissable non plus : Cissé, Bassong,
# Meunier et Kanté ont été remplacés par Sannier, Betombo, Roussel et Barège
# (même registre, aucun écho). Le lint croise la liste avec le lexique
# `_patronymesEchoFoot` (packages/tools/bin/lint.dart).
prenoms_m: [Alain, Bernard, Christian, Daniel, Lucien, Michel, Patrick, Philippe, Serge, Marc, Pascal, Yves, Guy, René, Claude, Raymond, Roland, Gilbert, Francis, Bruno, Olivier, Farid, Saïd, Mustapha, Antonio, Manuel, Joël, Hervé, Jean-Claude, Gilles]
