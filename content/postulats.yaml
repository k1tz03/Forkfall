# Les postulats : les points de départ d'une carrière. L'ordre du fichier est
# l'index du Code de Carrière (ne jamais réordonner ; ajouter à la fin).
# `cast` : les visages que le metteur en scène doit faire revenir, avec le
# nombre d'apparitions par saison visé. `opening_arc`, `programme` (le
# réservoir d'intrigues tiré à chaque ouverture de saison, spec variété §1.2),
# `questions` (le fil rouge tiré), `objectifs` (cachés, évalués au Bilan et à
# la fin) et `alarm_overrides` viennent avec la bible de chaque postulat.
# `seeds` (semis à créneaux fixes) est déprécié : gardé pour les postulats en
# chantier et les tests. `chantier: true` = les lints de couture sont des
# avertissements.
postulats:
  - id: promu
    index: 0
    role: entraineur
    # HISTOIRE 1 — « Trois mille visages » (docs/histoires/00_les_dix_histoires.md).
    # L'id, l'index, l'année, la division, les jauges, la force et l'objectif
    # sont ceux du promu sans un sou (les Codes de Carrière en dépendent).
    # Ancien titre : « Le promu sans un sou ».
    title: "Trois mille visages"
    question: "Ce club est à qui : à la tribune qui porte ton visage, au président qui a payé sa place avec la finale, ou à l'argent du Quai qui parie depuis 1974 ?"
    division: 1
    year: 1990
    # Trente-huit ans en 1990 : tu avais vingt-trois ans quand ta mère a pris
    # le car de six heures (l'intermède de la saison 3 le dit). Le tirage d'âge
    # est consommé quand même (engine.dart) : le déterminisme ne bouge pas.
    age: 38
    ville: Aubérive
    club: Racing Aubérive
    gauges: { vestiaire: 50, tribunes: 80, direction: 52, caisse: 30 }
    # 52 → 55 (retune, étape 8) : le promu descendait assez souvent pour que la
    # facture du verdict fasse du SMS de 23h47 la fin de 42 % des carrières.
    force: 55
    objective: maintien
    flags: [promu, histoire_h1]
    president: aulard
    camille: true
    cast:
      # Le livre est porté par Gégé (l'amour et l'arme) et Vaubourg (la cible) ;
      # Gigi, Odette et Lhoste en tiennent chacun une intrigue sur deux ou trois
      # saisons. Le réservoir du promu reste au casting pour ses respirations
      # (le prodige, l'argent qui frappe, l'agent, le mentor), à cible basse :
      # le livre prend la plupart des créneaux.
      aulard:   { fonction: patron,      target: 1 }
      gege:     { fonction: creancier,   target: 2.5 }
      vecchio:  { fonction: coeur,       target: 1.5 }
      josiane:  { fonction: choeur,      target: 0.9 }
      vukic:    { fonction: messager,    target: 0.9 }
      meneche:  { fonction: chroniqueur, target: 1 }
      odette:   { fonction: temoin,      target: 0.9 }
      lhoste:   { fonction: instance,    target: 0.5 }   # visage de S1+ : il arrive avec la berline
      camille:  { fonction: jauge5,      target: 0.5 }
      mbako:    { fonction: horloge,     target: 0.5 }
      nassir:   { fonction: tentateur,   target: 0.5 }
      fardelli: { fonction: vautour,     target: 0.5 }
      clow:     { fonction: mentor,      target: 0.5 }
      brehaut:  { fonction: capitaine,   target: 0.5 }
    pitch: "Ils t'aiment. Ils feront ce que tu n'oses pas faire. Avec ton visage."
    chantier: false
    # Le script du livre (content/arcs/entraineur/h1_script.yaml) : ses ancres
    # ouvrent les intrigues du livre à leur page, saison après saison, jusqu'à
    # l'acte final de la saison 3 (la veille, la salle de presse) et ses fins.
    opening_arc: en.h1.visages
    # Le prologue : la photo grattée et les deux clés, le chant qui contient déjà
    # ton nom, le café de Vukić, la lettre de 1975, les quatre qui décident (dits
    # par Gigi), l'escalier condamné depuis 1977.
    prologue: en.h1.prologue
    questions:                        # fil rouge tiré à l'ouverture de saison (chemin `fil_rouge` dans `when`)
      - { id: tribune,   poids: 1.0 } # la tribune qui porte ton visage (la présentation de Gégé)
      - { id: president, poids: 1.0 } # le président qui a payé sa place (la berline et son 1977)
      - { id: argent,    poids: 1.0 } # l'argent du Quai (la facture de l'imprimeur, l'escalier à vendre)
    programme:
      # Le livre prend la saison par ses ancres et ses étapes (douze à quatorze
      # cartes par saison, pour treize créneaux libres de Nouvelles) : le
      # réservoir du promu attend l'épilogue. Dès la S1, de toute façon, les
      # intrigues du livre encore ouvertes comptent dans `carry` et le tirage
      # n'ouvre plus rien. Les intrigues du livre y sont aussi, en
      # secours d'épilogue seulement (`season >= 3`) : le tirage ne les ouvre
      # jamais avant l'acte final, le script les a déjà ouvertes à leur page.
      "0":
        prendre: 1
        fenetre: [2, 9]
        reserve: 0
        pool:
          # Pendant le livre, le réservoir du promu se tait : il attend
          # l'épilogue (`season >= 3`). Mesuré sur 80 carrières, une intrigue de
          # plus en S0 (l'espion de la haie, le vieux gardien, Ilyas) poussait
          # l'article de Massenet en S1 et les archives de L'Écho après la
          # passerelle, et faisait glisser les Rameaux en S2 (le marbrier se
          # perdait en S3). La tentation du livre est l'argent du Quai.
          - { arc: en.nassir_proprietaire, poids: 1.0, if: "season >= 3 && gauges.caisse < 45" }
          - { arc: en.prodige,             poids: 0.8, if: "season >= 3" }
          - { arc: en.salaires_retard,     poids: 0.9, if: "season >= 3 && gauges.caisse < 45" }
          - { arc: en.vieux_gardien,       poids: 0.4, if: "season >= 3" }
          - { arc: en.cote_du_promu,       poids: 0.4, if: "season >= 3" }
          - { arc: en.espion_haie,         poids: 0.4, if: "season >= 3" }
          - { arc: co.cartons_camille,     poids: 0.3, if: "season >= 3 && !flag('divorce')" }
      "1":
        prendre: 1
        fenetre: [2, 9]
        reserve: 0
        reprise: true
        pool:
          - { arc: en.mentor_clow,         poids: 1.5, if: "season >= 3" }
          - { arc: en.conf_presse,         poids: 1.0, if: "season >= 3" }
          - { arc: en.brassard_brehaut,    poids: 0.8, if: "season >= 3" }
          - { arc: en.adjoint_dine,        poids: 0.6, if: "season >= 3 && (relation.vukic <= 0 || relation.aulard >= 2)" }
          - { arc: en.gigi_staff,          poids: 4.0, if: "season >= 3 && (flag('gigi_staff') || flag('vecchio_promis') || flag('gardien_jeune'))" }
          # Les sponsors du promu (content/arcs/*/sponsors_louches.yaml), au même
          # régime que le réservoir : en épilogue, quand le livre est fermé.
          - { arc: en.sp.dornois,          poids: 0.5, if: "season >= 3 && gauges.caisse < 60" }
          - { arc: en.sp.terrain,          poids: 0.5, if: "season >= 3" }
          - { arc: co.sp.rideau,           poids: 0.45, if: "season >= 3 && gauges.tribunes >= 40" }
      "2+":
        prendre: 1
        fenetre: [1, 8]
        reserve: 0
        reprise: true
        pool:
          - { arc: co.clow_lundi,          poids: 1.5, if: "season >= 3 && relation.clow >= 0" }
          - { arc: en.fils_aulard,         poids: 1.0, if: "season >= 3 && relation.aulard >= -1" }
          - { arc: en.retour_mbako,        poids: 1.1, if: "season >= 3 && flag('mbako_vendu')" }
          - { arc: en.dossier_meneche,     poids: 1.0, if: "season >= 3" }
          # Les intrigues du livre, en secours d'épilogue (voir plus haut).
          - { arc: en.h1.masques,          poids: 0.1, signature: true, if: "season >= 3" }
          - { arc: en.h1.maillot,          poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.plaque,           poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.gigi,             poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.pellicule,        poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.lhoste,           poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.massenet,         poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.coffre,           poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.quai,             poids: 0.1, if: "season >= 3" }
    objectifs:                        # 3 objectifs cachés ; l'indice est le levier de relance
      # Les ids restent ceux du promu ; les objectifs changent d'habit (H1 § 9).
      - { id: promu_deux_maintiens, titre: "Deux maintiens de suite", when: "vars.saisons_tenues >= 2 || (vars.saisons_tenues >= 1 && season >= 2 && world.rang <= 8)", indice: "Tenir. Encore." }
      - { id: promu_a_lancienne,    titre: "Le club à l'ancienne",    when: "flag('h1_quai_refuse') && !flag('nassir_pret') && !flag('naming_signe') && !flag('club_actif')", indice: "Il y a de l'argent qui frappe à la porte depuis 1974." }
      - { id: promu_banc_gigi,      titre: "Le filet de Gigi",        when: "flag('h1_filet_rendu')", indice: "Un gardien de quarante et un ans a gardé autre chose que ses gants." }
    alarm_overrides:                  # candidats prioritaires (avant alarms.yaml) : les masques réclament
      tribunes.low:
        - { card: en.h1.alarme.tribunes_bas_masques, when: "flag('histoire_h1') && !seen('en.h1.alarme.tribunes_bas_masques')" }
        - { card: en.alarme.tribunes_bas_pacte, when: "flag('pacte_gege')" }
      tribunes.high:
        - { card: en.h1.alarme.tribunes_haut_masques, when: "flag('histoire_h1') && !seen('en.h1.alarme.tribunes_haut_masques')" }
        - { card: en.alarme.tribunes_haut_vukic, when: "arc('en.kop_qui_aime_trop') != 'done'" }
      direction.low:
        - { card: en.h1.alarme.direction_bas_vaubourg, when: "flag('histoire_h1') && !seen('en.h1.alarme.direction_bas_vaubourg')" }
        - { card: en.alarme.direction_bas_naming, when: "flag('naming_signe')" }
      vestiaire.low:
        - { card: en.h1.alarme.vestiaire_bas_masques, when: "flag('histoire_h1') && !seen('en.h1.alarme.vestiaire_bas_masques')" }
        - { card: en.alarme.vestiaire_bas_mbako_vendu, when: "flag('mbako_vendu')" }
      caisse.low:
        - { card: en.h1.alarme.caisse_bas_masques, when: "flag('histoire_h1') && !seen('en.h1.alarme.caisse_bas_masques')" }
        - { card: en.alarme.caisse_bas_salaires, when: "flag('salaires_retard')" }
        - { card: en.promu.alarme_nassir_offre, when: "relation.nassir >= 0 && vars.nassir_palier >= 1" }

  - id: interimaire
    index: 1
    role: entraineur
    # Histoire 2 — Le Sapin en carton (docs/histoires/00_les_dix_histoires.md).
    # L'ancien titre : « L'intérimaire ». Les ids, l'index, l'année, la
    # division, les jauges, la force, l'objectif et le drapeau `interim` ne
    # bougent pas (le Code de Carrière en dépend) ; le livre ajoute
    # `histoire_h2`, que lisent ses variantes, son décor, ses manchettes, ses
    # set-pieces et ses répliques de ville.
    title: "Le Sapin en carton"
    question: "Tu tiens le banc d'un homme qui n'est pas parti. Tu le cherches, ou tu le gardes absent ?"
    division: 2
    year: 1990
    gauges: { vestiaire: 45, tribunes: 50, direction: 40, caisse: 50 }
    force: 44
    objective: maintien
    flags: [interim, histoire_h2]
    president: aulard
    camille: true
    club: Racing Aubérive
    ville: Aubérive
    cast:                             # cibles d'apparition par saison
      aulard:   { fonction: patron,       target: 2.5 }
      vukic:    { fonction: rival,        target: 1.5 }   # l'adjoint de l'autre, qui te teste
      josiane:  { fonction: choeur,       target: 1.5 }   # la cafetière, le cabas, la clé
      brehaut:  { fonction: coeur,        target: 0.8 }
      monique:  { fonction: famille,      target: 1.5 }   # dix heures, chaque matin
      norbert:  { fonction: creancier,    target: 1.5 }   # le chauffeur, que tout le monde trouve normal
      meneche:  { fonction: chroniqueur,  target: 0.8 }
      achard:   { fonction: argent,       target: 0.9 }   # l'assureur : n'entre qu'en S1
      lea:      { fonction: messager,     target: 0.8 }
      vecchio:  { fonction: ancien,       target: 0.8 }
      gege:     { fonction: horloge,      target: 0.8 }
      fardelli: { fonction: tentateur,    target: 0.8 }
      legruet:  { fonction: instance,     target: 0.5 }
      clow:     { fonction: mentor,       target: 0.5 }
      camille:  { fonction: jauge5,       target: 0.5 }
      nassir:   { fonction: argent,       target: 0.5 }
      mbako:    { fonction: prodige,      target: 0.5 }
      aubert:   { fonction: mairie,       target: 0.5 }
    pitch: "Une berline grise sur la place d'un autre. Le lundi, son répondeur parle."
    chantier: false                   # lot livré : les budgets de réservoir sont bloquants
    # L'épine : le script à ancres (content/arcs/entraineur/h2_script.yaml),
    # qui ouvre lui-même les intrigues du livre (h2_intrigues.yaml).
    opening_arc: en.h2.script
    # Le prologue : la place peinte sous la pluie, le sifflet dans le tiroir, la
    # compo de l'autre au mur, la phrase que le groupe attend, le communiqué,
    # l'escalier. La première ancre (les cartons) commence là où il s'arrête.
    prologue: en.h2.prologue
    questions:                        # fil rouge tiré à l'ouverture de saison
      - { id: vestiaire, poids: 1.0 } # le vestiaire qui l'attend
      - { id: diplome,   poids: 1.0 } # le papier que tu n'as pas
      - { id: grand_nom, poids: 1.0 } # le grand nom qu'on attend pour le jour où il sera mort
    # Le réservoir. L'épine tient presque toute la saison (S0 : treize temps
    # d'histoire sur dix-sept créneaux ; S1 : quatorze) : le réservoir de
    # l'intérimaire respire autour d'elle — le diplôme, le grand nom, le kop qui
    # doute, le pari de Massenet, Gigi, Camille —, une ou deux intrigues par
    # saison. Les quatre intrigues de l'ancien titre qui racontaient un ancien
    # parti ailleurs (le vestiaire, le bureau, le banc d'en face, la lettre) et
    # l'adjoint qui dîne (Vukić rival) n'y sont plus : le livre les contredit.
    # Les intrigues du livre sont ouvertes par l'épine (100 % des carrières) ;
    # deux d'entre elles restent au réservoir comme filet, un bucket après la
    # saison où l'épine les ouvre — la berline (la femme de l'absent) et la
    # Prévoyance (l'assureur), pour que leurs porteurs, au casting, aient leurs
    # deux histoires. Elles sont `once` : jamais deux fois. Dans `--reservoir`,
    # leurs lignes sortent à 100 % (hors de la bande [10 %, 65 %]) : c'est
    # l'épine qu'on lit, pas le réservoir.
    programme:
      "0":
        # Une intrigue du réservoir en S0, ouverte tôt pour qu'elle se joue dans
        # la saison : celles qui débordaient sur la S1 passaient devant le
        # wagon, et la roue de secours arrivait après la Rive.
        prendre: 1
        fenetre: [2, 8]
        reserve: 0
        pool:
          - { arc: en.diplome,             poids: 0.9, signature: true, if: "season <= 1" }
          - { arc: en.grand_nom,           poids: 1.4, if: "season <= 1" }
          - { arc: en.kop_doute,           poids: 1.4, if: "gauges.tribunes <= 60 && season <= 1" }
          - { arc: en.cote_interim,        poids: 0.8, if: "season <= 1" }
          - { arc: en.vieux_gardien,       poids: 1.6 }
          - { arc: en.salaires_retard,     poids: 0.8, if: "gauges.caisse < 45" }
          - { arc: en.prodige,             poids: 0.8 }
          - { arc: co.cartons_camille,     poids: 0.3, if: "!flag('divorce')" }
      "1":
        # Une seule ouverture : l'arrière-salle, encore ouverte depuis la S0, la
        # consomme le plus souvent (k = prendre − en cours). La S1 est celle du
        # wagon : sept étapes avant la panne, et la Rive ne les attend pas.
        prendre: 1
        fenetre: [2, 12]
        reserve: 0
        reprise: true                 # les entrées de "0" non tirées restent candidates
        pool:
          # Le filet du livre (S0 → S1).
          - { arc: en.h2.berline,          poids: 1.0 }
          - { arc: en.mentor_clow,         poids: 1.0 }
          - { arc: en.nassir_proprietaire, poids: 0.9 }
          - { arc: en.brassard_brehaut,    poids: 1.0 }
          - { arc: en.espion_haie,         poids: 1.0 }
          - { arc: en.enveloppe,           poids: 0.6 }
          - { arc: en.vieux_gardien,       poids: 0.35 }  # rituel
          - { arc: co.cartons_camille,     poids: 0.35, if: "!flag('divorce')" }
          - { arc: en.mairie_d2,           poids: 0.7 }
          # Les sponsors (content/arcs/*/sponsors_louches.yaml), dès la S1 : le laboratoire
          # (Vukić), la dette de Gigi (le réseau de paris) et le Rideau Rouge. Pas les
          # biscuits ni la maquette : en.nassir_proprietaire est à 12 % de couverture ici.
          - { arc: en.sp.labo,             poids: 0.55 }
          - { arc: en.sp.gigi,             poids: 0.7 }
          - { arc: co.sp.rideau,           poids: 0.45, if: "gauges.tribunes >= 40" }
      "2+":
        prendre: 2
        fenetre: [1, 11]
        reserve: 0
        reprise: true
        pool:
          # Le filet du livre (S1 → S2).
          - { arc: en.h2.prevoyance,         poids: 1.0, if: "season == 2" }
          - { arc: en.aulard_rappelle,       poids: 1.8, if: "flag('bilan_manque') && relation.aulard >= 0" }
          - { arc: en.fils_aulard,           poids: 1.0, if: "relation.aulard >= -1" }
          - { arc: en.dossier_meneche,       poids: 1.6 }
          - { arc: en.gigi_staff,            poids: 5.4, if: "flag('gigi_staff')" }
          - { arc: en.commission_discipline, poids: 7.5, if: "flag('fede_dossier') || flag('lanceur_alerte') || flag('match_arrange_couvert') || flag('enveloppe_denoncee') || flag('enveloppe_promise') || flag('enveloppe_rival') || flag('enveloppe_niee')" }
          - { arc: en.retour_mbako,          poids: 11.0, if: "flag('mbako_vendu')" }
          - { arc: en.conf_presse,           poids: 1.4 }    # rituel (every_season)
          - { arc: co.clow_lundi,            poids: 1.5, if: "relation.clow >= 0" }
          - { arc: en.vieux_gardien,         poids: 0.45 }   # rituel (replay: ritual)
          - { arc: en.kop_qui_aime_trop,     poids: 1.2, if: "gauges.tribunes >= 65 && arc('en.kop_doute') != 'active'" }
          - { arc: en.espion_haie,           poids: 1.0 }
          - { arc: en.salaires_retard,       poids: 0.6, if: "gauges.caisse < 45" }
          - { arc: en.enveloppe,             poids: 0.6 }
    objectifs:                        # 3 objectifs cachés (ids de l'ancien titre)
      # Garder le banc : un contrat signé — confirmé en décembre, ou le
      # mercredi qui suit un mort sur le papier — et le dernier objectif tenu.
      - { id: interim_garder_poste,   titre: "Garder le banc", when: "!flag('dechu') && stats.saisons >= 2 && flag('cdi_signe') && flag('bilan_tenu')", indice: "Six semaines. Puis juin. Puis un mardi d'avril." }
      - { id: interim_sans_papier,    titre: "Sans papier",    when: "flag('derogation') && stats.saisons >= 2", indice: "Trois tampons sur quatre. Ça se voit à la longue." }
      # L'adjoint de l'autre devient le tien le soir où il te demande « s'il mange ».
      - { id: interim_adjoint_fidele, titre: "L'adjoint fidèle", when: "flag('h2_vukic_mange') && relation.vukic >= 3", indice: "Il ne te demande pas où tu étais. Il te demande s'il mange." }
    alarm_overrides:                  # candidats prioritaires (avant alarms.yaml)
      direction.low:
        - { card: en.h2.alarme.direction }
        - { card: en.interim.alarme_aulard_cv }
      tribunes.low:
        - { card: en.h2.alarme.tribunes }
        - { card: en.kop_doute.siffle_alarme, when: "flag('kop_hostile')" }
      vestiaire.low:
        - { card: en.h2.alarme.vestiaire }
        - { card: en.salaires.greve_entrainement, when: "flag('salaires_retard')" }

  - id: pepite
    index: 2
    role: joueur
    # HISTOIRE 3 — LA SIRÈNE (docs/histoires/00_les_dix_histoires.md ; ancien
    # titre « La pépite du club-usine »). L'id, l'index, l'année, la division,
    # l'âge, les jauges de départ, la force, le drapeau `pepite` et le président
    # narratif (Fardelli) ne bougent pas : les Codes de Carrière en dépendent.
    # Le livre : la descente aux enfers, l'argent (S0), la nuit (S1), le corps
    # (S2), l'épilogue (S3). Le script (jp.h3.script) porte la colonne
    # vertébrale et ouvre les intrigues qui ne doivent pas manquer (la maison,
    # le genou, l'ardoise, le coupé rouge, la ligne de touche, le journal,
    # l'arrière-salle si l'ardoise) ; le réservoir tire l'épilogue (S3) et, en
    # S0 puis en S3+, une intrigue du réservoir de la pépite.
    title: "La Sirène"
    question: "Qu'est-ce qui te tient debout : le prix qu'on t'a mis, le terrain, ou la maison de ta mère ?"
    division: 2
    year: 1990
    ville: Aubérive
    club: Racing Aubérive
    # Bible ch. 10 § 3 : « Âge : 19 ». Le tirage du rôle reste consommé (engine
    # §1.8) : « même code, même carrière » tient.
    age: 19
    gauges: { vestiaire: 50, tribunes: 80, direction: 50, caisse: 45 }
    force: 58
    flags: [pepite, histoire_h3]
    president: fardelli
    camille: true
    # Les visages du livre. Odile, Didier Vallin, Madame Irène et Steph sont
    # les visages nouveaux (content/characters.yaml) ; les cibles sont celles
    # que le script et les intrigues portent vraiment (Fardelli et Odile à
    # chaque saison ; Didier, Steph, Vaubourg et Léa à partir de la nuit ;
    # Josiane au prologue puis au corps).
    cast:
      fardelli:   { fonction: vautour,     target: 1.9 }
      odile:      { fonction: famille,     target: 1.5 }
      vallin:     { fonction: fantome,     target: 0.9 }
      josiane:    { fonction: choeur,      target: 0.9 }
      aulard:     { fonction: patron,      target: 0.8 }
      steph:      { fonction: tentateur,   target: 0.9 }
      irene:      { fonction: tentateur,   target: 0.9 }
      sabatier:   { fonction: horloge,     target: 1 }
      vecchio:    { fonction: coeur,       target: 1 }
      brehaut:    { fonction: capitaine,   target: 1 }
      gege:       { fonction: creancier,   target: 1.5 }
      lea:        { fonction: chroniqueur, target: 0.8 }
      mbako:      { fonction: horloge,     target: 0.6 }
      mere_mbako: { fonction: famille,     target: 0.5 }
      meneche:    { fonction: chroniqueur, target: 0.5 }
      vukic:      { fonction: messager,    target: 0.5 }
      camille:    { fonction: jauge5,      target: 0.5 }
    pitch: "Dix-neuf ans, l'usine ferme à Noël, et tu es la dernière chose que cette ville fabrique. Tout le monde veut te vendre ; la nuit, la sirène de l'usine morte hurle pour les gamins qui tombent."
    chantier: false
    opening_arc: jp.h3.script
    # Six scènes avant la carte Objectif : le crochet, les bouteilles, la place
    # de la porte, le grillage, la licence, la cuisine.
    prologue: jp.h3.prologue
    questions:                        # le fil rouge, tiré à chaque ouverture de saison
      - { id: prix,    poids: 1.0 }
      - { id: terrain, poids: 1.0 }
      - { id: maison,  poids: 1.0 }
    # LE RÉSERVOIR. Les intrigues ouvertes par une carte du script (la maison,
    # le genou, l'ardoise, le coupé rouge, la ligne de touche, le journal
    # étranger, l'arrière-salle) n'y sont pas : un tirage les ouvrirait une
    # deuxième fois. Les quatre postulats de 1990 gardent leurs réservoirs
    # partagés ; celui-ci n'en reprend que ce qui ne contredit pas le livre (ni
    # changement de club, ni `genou`, qui proposerait le banc d'entraîneur à
    # vingt ans).
    #   S0 : une intrigue du réservoir de la pépite, au poids — la saison est
    #        pleine d'ancres et d'étapes, une suffit.
    #   S1 : le derby, si une place se libère (la saison de la nuit est pleine).
    #   S2 : rien (l'acte final tient la saison).
    #   S3+ : l'épilogue (le crochet du fond), puis le réservoir de carrière.
    programme:
      "0":
        prendre: 1
        fenetre: [2, 12]
        reserve: 1
        pool:
          - { arc: jp.premiere_une,    poids: 0.5 }
          - { arc: jp.brassard_test,   poids: 0.5 }
          - { arc: co.mbako_rival,     poids: 0.4 }
          - { arc: jp.vestiaire_porte, poids: 0.4 }
          - { arc: jp.camille_bac,     poids: 0.3, if: "age <= 24" }
          - { arc: jp.conseils_gigi,   poids: 0.3 }
          # Gégé et ses vingt mètres de bâche : « il en a déjà plié trois ».
          - { arc: jp.tifo,            poids: 0.4, signature: true, if: "gauges.tribunes >= 65" }
      "1":
        prendre: 1
        fenetre: [1, 6]
        reserve: 1
        reprise: true
        pool:
          - { arc: co.derby,           poids: 0.4, if: "gauges.tribunes >= 50" }
      "2+":
        # Sans reprise : en S2, rien ne s'ouvre (l'acte final tient la saison) ;
        # l'épilogue et les intrigues de carrière attendent la S3.
        prendre: 2
        fenetre: [1, 6]
        reserve: 1
        pool:
          - { arc: jp.h3.crochet,      poids: 40 }
          - { arc: jp.brassard_20,     poids: 1.0, if: "season >= 3 && (relation.brehaut >= 2 || !flag('capitaine'))" }
          - { arc: jp.pari,            poids: 0.8, if: "season >= 3 && (gauges.caisse < 55 || relation.fardelli <= 0)" }
          # Le diplôme ne propose pas le banc (roles.yaml : âge ou `genou`) ; ses
          # deux portes de la pépite d'origine restent lues ici.
          - { arc: jp.diplome_joueur,  poids: 0.6, if: "season >= 3 && (age >= 26 || flag('genou') || flag('banc_bosse') || flag('diplome_reporte'))" }
          - { arc: co.derby,           poids: 0.6, if: "season >= 3 && gauges.tribunes >= 50" }
          - { arc: jp.conseils_gigi,   poids: 0.2, if: "season >= 3" }
          # Les sponsors (content/arcs/joueur/sponsors_louches.yaml), après le
          # livre : le garage du Pont et les crampons Bourrel. Ni le Rideau
          # Rouge du sponsor (son « patron » contredirait Madame Irène), ni la
          # table du jeudi (le livre a déjà son ardoise).
          - { arc: jp.sp.garage,       poids: 0.35, if: "season >= 3" }
          - { arc: jp.sp.bourrel,      poids: 0.35, if: "season >= 3" }
    objectifs:                        # 3 objectifs cachés (les ids restent)
      - { id: pepite_destination,    titre: "Choisir sa destination",      when: "flag('h3_fax_dechire') && (flag('h3_fini_debout') || flag('h3_sorti'))", indice: "Un fax, ça se déchire. L'autre papier, non." }
      - { id: pepite_enfant_du_club, titre: "L'enfant du club",            when: "stats.saisons >= 3 && stats.clubs <= 1 && (flag('h3_sirene_achetee') || (flag('enfant_du_pays') && flag('fidele')))", indice: "Vingt mètres de bâche, ça engage. Une sirène aussi." }
      - { id: pepite_brassard_22,    titre: "Le brassard avant vingt-deux ans", when: "flag('capitaine') && age <= 22", indice: "Bréhaut a un genou. Et un brassard." }
    alarm_overrides:                  # candidats prioritaires (avant alarms.yaml)
      # Les alarmes du livre d'abord, une fois chacune ; les alarmes de la
      # pépite restent derrière (et dans la liste : sans elle, leurs cartes
      # retomberaient dans le sac de tous les joueurs).
      tribunes.high:
        - { card: jp.h3.al.bache, when: "!seen('jp.h3.al.bache') && !seen('jp.tifo.bache')" }
        - { card: jp.pepite.alarme_local_gege, when: "!seen('jp.tifo.bache')" }
        - { card: jp.pepite.alarme_tifo_lea, when: "seen('jp.tifo.prix')" }
        - { card: jp.pepite.alarme_cote_lea }
      caisse.low:
        - { card: jp.h3.al.ardoise, when: "!seen('jp.h3.al.ardoise') && flag('h3_ardoise') && !flag('h3_ardoise_payee')" }
        - { card: jp.h3.al.chomage, when: "!seen('jp.h3.al.chomage') && flag('h3_usine_fermee')" }
        - { card: jp.pepite.alarme_fardelli_avance, when: "flag('agent_fardelli')" }
      direction.low:
        - { card: jp.h3.al.buvard, when: "!seen('jp.h3.al.buvard')" }
      vestiaire.low:
        - { card: jp.h3.al.sac_poubelle, when: "!seen('jp.h3.al.sac_poubelle') && (flag('h3_ardoise') || flag('h3_sirene_nuit'))" }

  - id: fin_de_contrat
    index: 3
    role: joueur
    # HISTOIRE 4 — « La Route de la Rive » (docs/histoires/00_les_dix_histoires.md,
    # Histoire 4 ; ancien titre : « Fin de contrat à 31 ans »). L'id, l'index,
    # l'année, les jauges, la force, le drapeau `genou` et le président ne
    # bougent pas. Le livre : content/arcs/joueur/fdc_script.yaml (les ancres),
    # h4_intrigues.yaml, h4_sombres.yaml, content/cards/joueur/h4_*.yaml,
    # content/endings/h4.yaml, content/unes/h4.yaml, content/setpieces/h4.yaml,
    # content/ville/*_h4.yaml.
    title: "La Route de la Rive"
    question: "Qui te tient encore : ton genou, ton agent, ou le vestiaire de 1984 ?"
    division: 1
    year: 1990
    # Le livre se passe à Aubérive, au Racing (la ville dessinée).
    ville: Aubérive
    club: Racing Aubérive
    gauges: { vestiaire: 50, tribunes: 50, direction: 45, caisse: 60 }
    force: 52
    # Le postulat s'appelle « Fin de contrat à 31 ans » : l'âge se déclare, il
    # ne se tire pas. Sans cette ligne, `Engine.start` prenait la bande du rôle
    # joueur ([19, 31]) et la barre d'état annonçait « 23 ans » sous une
    # pochette qui en promet 31 — et la porte `age >= 32 || flag('genou')` du
    # rôle ne tenait que par le drapeau. Mesuré à l'aperçu (capture
    # `40_p3_carte.png` de l'étape 8).
    age: 31
    flags: [genou, histoire_h4]
    # `president` nomme le président (`{president}` dans les manchettes et les
    # épitaphes) ; `patron` nomme celui qui te tient (l'Objectif et le Bilan du
    # contrat). Chez un joueur en fin de contrat, ce n'est pas le même homme :
    # le président est Vaubourg, le contrat se discute avec l'agent.
    president: aulard
    patron: fardelli
    camille: true
    # Casting de la bible ch. 10 § 4 : l'agent vend, le Doc compte les croix,
    # le capitaine a le même genou, l'adjoint garde un banc. Le président est
    # Vaubourg (`aulard`), le fonds est Ilyas (`nassir`).
    #
    # `target` a deux lectures : c'est le rythme d'apparition visé (moteur,
    # `faceFactor` : `expected = 17 / target` cartes entre deux apparitions) ET
    # le plancher de récurrence de la PREMIÈRE saison asserté par le budget
    # § 5.2 (`≥ 1` dans 80 % des S0 à partir de 1 ; `≥ 2` dans 90 % à partir de
    # 2 ; sous 1, le visage est compté mais pas exigé en S0 — même convention
    # que le cast de « La pépite »).
    # La S0 de ce postulat n'a que quatre créneaux garantis : l'ancre du slot 1
    # (Fardelli), l'offre d'hiver (Vaubourg / Ilyas / Camille / Josiane), la
    # quinzième (le Doc) et juin (Vaubourg / Josiane / Fardelli). Les autres
    # visages ne peuvent y arriver que par une intrigue tirée ou par le sac, et
    # 17 créneaux ne portent en moyenne que 10 visages distincts : exiger 80 %
    # de présence en S0 pour quatorze visages est arithmétiquement hors
    # d'atteinte. Les visages sans créneau garanti passent donc sous 1, avec le
    # relevé qui le motive (S0 / S1 / S2+, 1 500 carrières human_like) :
    #   brehaut 73 / 52 / 44 · vecchio 71 / 81 / 94 · vukic 66 / 93 / 89
    #   lea 80 / 56 / 58 · gege 13 / 51 / 67 · mbako 14 / 32 / 14
    # Gégé et Mbako n'ont pas d'intrigue de bucket "0" qui les porte (la tribune
    # et la relève entrent en S1 avec le derby, l'alarme « papy » et co.mbako_rival) ;
    # Vecchio et Vukić sont des visages de carrière, pas de première saison.
    # Fardelli et le Doc gardent leur cible haute : ils tiennent deux créneaux
    # garantis chacun (mesuré ≥ 2 dans 93 % et 100 % des S0).
    cast:
      fardelli: { fonction: patron,       target: 2.5 }
      sabatier: { fonction: horloge,      target: 2 }
      brehaut:  { fonction: coeur,        target: 0.9 }
      vecchio:  { fonction: coeur,        target: 0.9 }
      vukic:    { fonction: messager,     target: 0.9 }
      camille:  { fonction: maison,       target: 1 }
      josiane:  { fonction: choeur,       target: 0.9 }
      lea:      { fonction: chroniqueur,  target: 0.9 }
      meneche:  { fonction: chroniqueur,  target: 0.9 }
      gege:     { fonction: tribune,      target: 0.9 }
      mbako:    { fonction: releve,       target: 0.9 }
      aulard:   { fonction: direction,    target: 1 }
      nassir:   { fonction: tentateur,    target: 0.5 }
      legruet:  { fonction: instances,    target: 0.5 }
    pitch: "Chaque 14 mai, des chrysanthèmes sur une tombe de 1984. Cet automne, la photo de la montée arrive par morceaux."
    chantier: false                   # relu à l'intégration : les budgets de réservoir sont bloquants
    opening_arc: jp.fin.dernier_contrat
    # Le prologue amène jusqu'à la portière ; l'ancre F1 du script
    # (`jp.fin.f1_derniere_annee`, le restaurant) l'ouvre juste après.
    prologue: jp.fin.prologue
    questions:                        # fil rouge tiré à l'ouverture de saison
      - { id: genou,     poids: 1.0 }
      - { id: agent,     poids: 1.0 }
      - { id: vestiaire, poids: 1.0 }
    # HISTOIRE 4 : le livre occupe les trois premières saisons (son script et
    # ses sept intrigues sont ouverts par `schedule:`, hors réservoir). Le
    # réservoir existant reste, au plus juste :
    #   · trois saisons denses → on tire moins : une intrigue en S0 (3 → 1),
    #     aucune en S1 (« La tombe vide » remplit la saison : ses onze
    #     échéances et ses quatre Nouvelles), aucune en S2 (l'acte final). Les
    #     entrées de "1" et de « 2+ » attendent l'épilogue (`season >= 3`), la
    #     reprise des entrées de "0" aussi ; la réserve ne force plus (0) ;
    #   · ce qui changerait de club (la maison du pays, l'exil doré, le banc
    #     de janvier) attend l'épilogue (`season >= 3`) : le livre se passe à
    #     Aubérive, ses intrigues sont `same_club` (la « porte de sortie » de
    #     content/cards/common/fins_du_lot.yaml attend aussi) ;
    #   · ce qui raconte une autre fin de carrière au même moment (le jubilé de
    #     la Nord, l'adieu au calendrier) attend aussi l'épilogue : le jubilé du
    #     livre est celui de Vaubourg, le 15 mai 1993 ;
    #   · la pharmacie du club (un flacon sans étiquette) et la table du jeudi
    #     (un second sponsor louche) ne doublent pas les ampoules de Sérène.
    # Gardés tels quels, comme le veut le livre : le genou qui parle, le
    # brassard, la dernière sélection, les mémoires.
    programme:                        # le réservoir (bible ch. 10 § 4, « Programme »)
      "0":
        prendre: 1
        # [2,9] → [1,12] : le slot de première ouverture est le minimum de trois
        # tirages ; sur huit valeurs son écart-type tombait à 1,34 (budget § 5.1 :
        # ≥ 1,8) et 2 % des S0 ouvraient deux intrigues à moins de trois créneaux.
        # [2,11] ne le remonte qu'à 1,50 : c'est la borne basse qui compte, et
        # douze valeurs à partir de 1 (comme le promu et la pépite) rendent au
        # minimum de trois tirages la dispersion que le budget demande (1,84).
        fenetre: [1, 7]               # HISTOIRE 4 : l'intrigue du réservoir s'ouvre tôt et déborde moins sur la saison 1
        reserve: 0
        pool:
          - { arc: jp.vestiaire_porte,   poids: 0.35, signature: true, if: "gauges.vestiaire >= 50 && (season == 0 || season >= 3)" }
          - { arc: jp.derniere_selection, poids: 1.1, if: "(flag('international') || gauges.tribunes >= 45) && (season == 0 || season >= 3)" }
          - { arc: jp.maison_pays,       poids: 0.8, if: "season >= 3" }
          - { arc: jp.memoires,          poids: 1.0, if: "season == 0 || season >= 3" }
          - { arc: jp.contrat_image,     poids: 0.9, if: "season == 0 || season >= 3" }
          - { arc: jp.banc_hiver,        poids: 0.9, if: "season >= 3" }    # « le banc, à trente et un ans » (arc partagé ; son départ de janvier changerait de club)
          - { arc: jp.conseils_gigi,     poids: 0.8, if: "season == 0 || season >= 3" }
          - { arc: co.mbako_rival,       poids: 0.8, if: "season == 0 || season >= 3" }
      "1":
        # 2 → 4 (`k = prendre - carry`). Avec deux tirages, la S1 manquait de
        # matière : la cadence forcée y montait à 0,72 ouverture-forcée par
        # saison (budget ≤ 0,5) et sept intrigues du bucket devaient plus de
        # 15 % de leurs ouvertures au metteur en scène (le derby 18 %, la
        # pharmacie 19 %, le consultant 18 %, l'exil 19 %, le genou 21 %, le
        # jubilé 16 %, le pari 16 %). À quatre, la cadence forcée retombe à 0,39.
        prendre: 1                    # HISTOIRE 4 : entrées réservées à l'épilogue (voir plus haut)
        fenetre: [2, 12]              # fenêtre large : les ouvertures s'étalent
        reserve: 0
        reprise: true                 # les entrées de "0" non tirées restent candidates
        # `reserve: 0` en S1. La réserve est servie « premier id encore
        # éligible, sans aléa » (spec §1.2) : en S1, où la cadence forcée est
        # la plus fréquente, la tête de pool ramassait tous les forçages —
        # 16 % pour « Le genou qui parle », 21 % pour la pharmacie quand on
        # les échangeait, contre un seuil de 15 %. Sans réserve, `forceStory`
        # retombe sur le tirage pondéré du réservoir et le forçage se répartit.
        # Les buckets "0" et "2+" gardent leur réserve : la cadence y force moins.
        pool:
          - { arc: co.pharmacie,         poids: 1.1, if: "season >= 3" }
          # 1,2 → 1,9 : l'objectif caché « Debout » se joue au jubilé, et
          # l'intrigue ne s'ouvrait que dans 16 % des carrières — dont deux
          # tiers reportaient. Sous ce taux, l'objectif restait sous son
          # plancher de 5 % quelle que soit sa condition.
          - { arc: jp.jubile,            poids: 1.9, if: "gauges.tribunes >= 50 && season >= 3 && !flag('h4_jubile_annonce')" }
          - { arc: jp.genou_parle,       poids: 1.4, if: "season >= 3" }
          - { arc: jp.consultant,        poids: 1.1, if: "season >= 3" }
          - { arc: co.derby,             poids: 1.3, if: "season >= 3" }
          - { arc: jp.pari,              poids: 1.2, if: "gauges.caisse < 55 && season >= 3" }
          - { arc: jp.exil_dore,         poids: 1.3, if: "season >= 3" }   # 0,9 → 1,3 : 16 % de ses ouvertures venaient du forçage (plafond 15 %)
          - { arc: jp.vestiaire_porte,   poids: 0.9, if: "gauges.vestiaire >= 55 && season >= 3" }
          # Les sponsors (content/arcs/joueur/sponsors_louches.yaml) : la table du jeudi
          # seule, et en S1 seulement. C'est le réservoir le plus serré (jp.pari,
          # jp.diplome_joueur, jp.vecchio_exemple à 9-11 %) : ouverte en S2+, elle faisait
          # passer le diplôme et le rituel de Gigi sous le plancher (mesuré à 6 000 carrières).
          - { arc: jp.sp.tripot,           poids: 1.6, if: "season >= 3 && !flag('h4_sp_serene')" }
      "2+":
        # 5 → 4. Le passage à 5 visait l'écart de cadence des saisons tardives
        # (« max 6 pour un budget de 4 ») : mesuré à 2 000 et 5 000 carrières, il
        # ne l'a pas obtenu — l'écart maximal reste 6, sur une saison de 3 377 —
        # et il a coûté le backlog d'échéances de la S2+ (P99 = 3 pour un seuil
        # de 2, empilements `passe+passe+passe` ×31). Quatre prises rendent le
        # backlog à 2 sans rien changer à l'écart ; la couverture des deux
        # intrigues qui tombaient au plancher (le diplôme et le rituel de Gigi)
        # est rendue par leur poids, ci-dessous.
        prendre: 2
        fenetre: [1, 11]
        reserve: 0
        reprise: true
        pool:
          - { arc: jp.adieu,             poids: 2.4, if: "season >= 3 && (age >= 32 || stats.saisons >= 2)" }
          # 2,0 → 2,6 et 2,8 → 3,4 : avec quatre prises au lieu de cinq, le
          # rituel de Gigi et le diplôme retombaient à 10 % de couverture, le
          # plancher exact du budget § 5.1. Le poids leur rend leurs 12 %.
          - { arc: jp.vecchio_exemple,   poids: 2.6, if: "season >= 3" }    # rituel (replay: ritual)
          - { arc: jp.jubile,            poids: 2.4, if: "gauges.tribunes >= 50 && season >= 3 && !flag('h4_jubile_annonce')" }
          - { arc: jp.brassard_20,       poids: 1.5, if: "season >= 3 && (age >= 29 || stats.saisons >= 2)" }
          # 1,8 → 2,8 : le diplôme ne s'ouvrait que dans 10 % des carrières, à la
          # limite du plancher, et son échantillon d'issues n'était pas mesurable.
          - { arc: jp.diplome_joueur,    poids: 3.4, if: "season >= 3 && (age >= 32 || flag('genou') || flag('banc_regarde'))" }
          - { arc: co.derby,             poids: 0.9, if: "season >= 3" }    # replay after 1
          - { arc: jp.consultant,        poids: 0.9, if: "season >= 3" }
          - { arc: jp.pari,              poids: 0.8, if: "season >= 3" }
          - { arc: jp.genou_parle,       poids: 0.8, if: "season >= 3" }
          - { arc: jp.conseils_gigi,     poids: 0.7, if: "season >= 3" }    # rituel
    objectifs:                        # 3 objectifs cachés (ids gardés ; docs/histoires § Histoire 4, 9)
      # HISTOIRE 4. Les trois objectifs du livre : tenir la quinzième et savoir
      # qui dort sous la pierre ; lire le cahier de Vukić (« Titi au volant ») ;
      # monter au rond central du jubilé.
      - { id: fin_saison_entiere, titre: "Une saison de plus",  when: "flag('quinzieme_jouee') && flag('h4_pas_de_tombe')", indice: "Quinze matchs, et la bonne question à ton agent." }
      - { id: fin_passeur,        titre: "Le passeur",          when: "flag('h4_cahier_lu')", indice: "Quelqu'un tient un cahier depuis 1984. Il attend que tu ne cries plus." }
      - { id: fin_debout,         titre: "Debout",              when: "flag('h4_rond_central') && !flag('h4_accelere')", indice: "Freiner, la veille. Puis un micro au rond central." }
    alarm_overrides:                  # candidats prioritaires (avant alarms.yaml)
      tribunes.low:
        - { card: jp.fin.alarme_gege_papy }
      caisse.low:
        - { card: jp.fin.alarme_fardelli_aucune_offre }
      # La porte de la fin `jp_mouton` (« On ne t'a plus jamais fait de passe.
      # Même au toro. »), qu'aucune carrière de ce postulat n'atteignait sur
      # 5 000 : le capitaine compte les passes, le refus coûte deux crans de
      # vestiaire, et la marche suivante — servie quand on a déjà choisi de
      # jouer seul OU que le vestiaire est descendu sous 22 — en coûte trois.
      vestiaire.low:
        - { card: jp.fin.alarme_brehaut_toro_seul, when: "flag('joue_seul') || gauges.vestiaire <= 22" }
        - { card: jp.fin.alarme_brehaut_plus_de_passe }

  # ═══ LES SIX HISTOIRES NOUVELLES (docs/histoires/00_les_dix_histoires.md) ════
  # Squelettes posés avant l'écriture : chaque auteur complète SON bloc (cast,
  # pitch, prologue, opening_arc, questions, programme, objectifs,
  # alarm_overrides) et passe `chantier: false` quand l'histoire est livrée.
  # L'ordre est celui du livre (l'ordre du temps) ; ne jamais réordonner.
  # Histoire 5 — « La Maquette » (le complot), président, 1999-2002. Le Racing
  # au greffe, une maquette en vitrine où le stade rétrécit, une voix sans nom
  # le mardi à dix-huit heures. Arcs : content/arcs/president/h5_*.yaml ;
  # cartes : content/cards/president/h5_*.yaml ; fins : content/endings/h5.yaml ;
  # set-pieces, manchettes, ville : content/{setpieces,unes,ville}/*h5*.yaml.
  - id: geant_dechu
    index: 4
    role: president
    title: "La Maquette"
    question: "Qui décidera de la Rive : la Commission qui compte, le kop qui l'occupe, ou celui qui vend ?"
    division: 2
    year: 1999
    age: 54
    ville: Aubérive
    club: Racing Aubérive
    # La bible donne 45 / 90 / 50 / 10 : un club que la ville adore et qui n'a
    # plus un franc. À 90 et 10, deux alarmes tombaient dès les premières cartes
    # et la carrière pouvait finir au prologue (pr_mairie à 100 de tribunes,
    # pr_commission à 0 de trésorerie). Le Racing part toujours haut dans le
    # cœur de la ville et bas dans ses comptes, mais à deux crans des bords :
    # les alarmes viennent quand la saison les mérite, pas à la première carte.
    gauges: { vestiaire: 45, tribunes: 62, direction: 50, caisse: 26 }
    force: 46
    objective: maintien
    # Camille est avocate dans ce livre (le métier est forcé, pas tiré) : son
    # cabinet porte ton nom, c'est tout le livre.
    flags: [histoire_h5, camille_avocate]
    patron: aulard
    cast:
      tessandier: { fonction: tentatrice,  target: 1.2 }
      dorian:     { fonction: voix,        target: 0.8 }
      camille:    { fonction: jauge5,      target: 0.8 }
      vialat:     { fonction: horloge,     target: 1.0 }
      gege:       { fonction: creancier,   target: 1.2 }
      paulette:   { fonction: memoire,     target: 0.8 }
      josiane:    { fonction: choeur,      target: 1.2 }
      vukic:      { fonction: messager,    target: 0.6 }
      brehaut:    { fonction: traitre,     target: 0.4 }
      dembo:      { fonction: coeur,       target: 0.6 }
      malbec:     { fonction: tentateur,   target: 0.4 }
      nassir:     { fonction: vautour,     target: 0.3 }
      amsel:      { fonction: instance,    target: 0.6 }
      lea:        { fonction: chroniqueur, target: 0.4 }
      aulard:     { fonction: patron,      target: 0.4 }
      vallin:     { fonction: temoin,      target: 0.4 }
    pitch: "Deux titres au mur, un dépôt de bilan au greffe, et toi. Dans la vitrine de l'agence Tessandier, le stade rétrécit chaque mois ; chaque mardi à dix-huit heures, une voix sans nom : « Ici le Conseil. »"
    chantier: false
    opening_arc: pr.h5.script
    prologue: pr.h5.prologue
    questions:
      - { id: commission, poids: 1.0 }
      - { id: kop,        poids: 1.0 }
      - { id: vente,      poids: 1.0 }
    programme:
      # S0 : le script ouvre lui-même La 14B (au café) et Le Conseil (au premier
      # mardi). Le réservoir n'en tire qu'une de plus : la saison porte six
      # ancres, quatre Nouvelles et ces trois intrigues.
      "0":
        prendre: 1
        fenetre: [2, 11]
        reserve: 0
        pool:
          - { arc: pr.h5.mot_janvier,   poids: 1.2, signature: true, if: "season <= 1" }
          - { arc: pr.h5.maillot,       poids: 1.0, if: "season <= 1" }
          - { arc: pr.h5.vaubourg,      poids: 0.9, if: "season <= 1" }
          - { arc: pr.h5.bureau_dapres, poids: 0.9, if: "season <= 1" }
          - { arc: pr.h5.quatorze_b,    poids: 0.2 }
          - { arc: pr.h5.ordres,        poids: 0.2 }
      # S1 : la vase ouvre La SCI, la grille de Paulette ouvre Le témoin ; les
      # suites de S0 (le buffet, la bâche, la clause, la carte) arrivent par
      # leurs fusées. `prendre` compte ce qui continue : avec deux ou trois
      # intrigues de S0 encore ouvertes, trois laisse la place à une nouvelle
      # (la valise, le fonds ou la coupure), deux n'en laissait aucune.
      "1":
        prendre: 3
        fenetre: [2, 11]
        reserve: 0
        reprise: true
        pool:
          - { arc: pr.h5.vialat,  poids: 1.4 }
          - { arc: pr.h5.valise,  poids: 1.8 }
          - { arc: pr.h5.fonds,   poids: 1.2 }
          - { arc: pr.h5.vallin,  poids: 0.8, if: "flag('h5_tribune_est_brulee')" }
          - { arc: pr.h5.sci,     poids: 0.4 }
      # S2 : les tardives. Camille (C1) ouvre Lambert ; le réservoir tire le
      # dossier de la procureure, la vue, le cadastre, avant le conseil (15).
      # `prendre` compte les intrigues de S1 qui courent encore : quatre laisse
      # la place à une ou deux tardives quand deux ou trois suites sont en cours.
      "2+":
        prendre: 4
        fenetre: [2, 9]
        reserve: 0
        reprise: true
        pool:
          - { arc: pr.h5.cadastre, poids: 1.5 }
          - { arc: pr.h5.dossier,  poids: 1.4 }
          - { arc: pr.h5.vue,      poids: 1.2 }
          - { arc: pr.h5.lambert,  poids: 0.5 }
    objectifs:
      - { id: geant_sans_lettre,    titre: "Rien dans la marge",          when: "flag('h5_second_positif') && !flag('h5_solde_negatif')", indice: "Un solde négatif, elle le note dans la marge. Le second, elle l'écrit à l'encre. Deux positifs, elle ne dit rien." }
      - { id: geant_mot_tenu,       titre: "Le mot de janvier",           when: "flag('h5_mot_tenu') || (flag('h5_mot_donne') && !flag('h5_mot_rompu') && stats.saisons >= 1)", indice: "La craie sur la porte du local tient tant qu'on ne vend personne." }
      - { id: geant_remonte_propre, titre: "Remonter la pente, proprement", when: "stats.saisons >= 1 && world.rang <= 6 && !flag('h5_fonds_ilyas') && !flag('h5_valise_prise') && !flag('vl_valise') && !flag('h5_maillot_terrasses')", indice: "On peut remonter dans les six premiers sans rien vendre. Personne ne dit comment." }
    alarm_overrides:
      tribunes.high:
        - { card: pr.h5.alarme.tribunes_haut_gege, when: "relation.gege >= 1" }
        - { card: pr.h5.alarme.tribunes_haut_aubert }
      tribunes.low:
        - { card: pr.h5.alarme.tribunes_bas_gege }
      caisse.low:
        - { card: pr.h5.alarme.caisse_bas_dorian, when: "flag('h5_caution_signee') && !flag('h5_maison_saisie')" }
        - { card: pr.h5.alarme.caisse_bas_josiane }
      caisse.high:
        - { card: pr.h5.alarme.caisse_haut_vialat }
      vestiaire.low:
        - { card: pr.h5.alarme.vestiaire_bas_vukic }
      vestiaire.high:
        - { card: pr.h5.alarme.vestiaire_haut_dembo, when: "!flag('h5_valise_prise') || season <= 1" }
      direction.low:
        - { card: pr.h5.alarme.direction_bas_dorian }
      direction.high:
        - { card: pr.h5.alarme.direction_haut_tessandier }

  # Histoire 6 — « 23 h 58 » (docs/histoires/00_les_dix_histoires.md) : la
  # directrice sportive, 2003-2006. Le chantage par fax ; le coupable tape les
  # rapports des autres. Script : content/arcs/ds/h6_script.yaml ; trame (les
  # cinq intrigues que le script ouvre) : h6_trame.yaml ; réservoir :
  # h6_reservoir.yaml ; soirs : h6_sombres.yaml. L'acte final est une nuit,
  # le 31 janvier de la saison 2 (créneaux 10-12) : toutes ses branches
  # ferment la carrière sur une fin du livre (content/endings/h6.yaml).
  - id: vendre_trente
    index: 5
    role: ds
    title: "23 h 58"
    question: "À qui dois-tu les trente millions : au coach qui ne les a pas lus, aux scouts qui les trouvent, ou au président qui les a écrits — et qui t'écrit, la nuit, à 23 h 58 ?"
    division: 1
    year: 2003
    age: 42
    ville: Aubérive
    club: Racing Aubérive
    # Les jauges de la bible (ch. 12 § 2) : le staff, les tribunes, le
    # président, la masse salariale (fragile, elle s'use d'un point toutes les
    # trois cartes). Vendre au prix du fax la remplit : le chantage est aussi
    # une bouée, et c'est tout le piège.
    gauges: { vestiaire: 50, tribunes: 45, direction: 60, caisse: 35 }
    force: 58
    # Ignoré à l'index ≥ 2 : l'Objectif de Division 1 est tiré (Top 10 / Top 5).
    objective: maintien
    flags: [histoire_h6]
    president: arnaud_vaubourg     # le président sur le papier ; {president} le nomme
    patron: aulard                 # le père, à la Ligue, au téléphone : l'Objectif et le contrat
    cast:
      josiane:         { fonction: choeur,      target: 2 }
      arnaud_vaubourg: { fonction: president,   target: 1 }
      aulard:          { fonction: patron,      target: 0.8 }
      fardelli:        { fonction: vautour,     target: 1 }
      ferlac:          { fonction: ombre,       target: 1 }     # on le voit partout, on ne le regarde jamais
      barbier:         { fonction: oeil,        target: 0.8 }
      vialat:          { fonction: instance,    target: 0.6 }
      dembo:           { fonction: coeur,       target: 1 }
      klopf:           { fonction: coach,       target: 0.6 }     # parti pour la Vestrie à l'été 2004
      vukic:           { fonction: messager,    target: 1 }
      meneche:         { fonction: chroniqueur, target: 0.8 }
      lea:             { fonction: temoin,      target: 0.5 }
      solvang:         { fonction: rivale,      target: 0.6 }
      nassir:          { fonction: tentateur,   target: 0.5 }
      malbec:          { fonction: acheteur,    target: 0.6 }
      sabatier:        { fonction: medecin,     target: 0.4 }
      legruet:         { fonction: instance,    target: 0.3 }
    pitch: "Un fax sans en-tête, une photo de 1999, trente millions par an. Le papier blanchit en six mois."
    chantier: false
    opening_arc: ds.h6.script
    # Le prologue : la page deux, le bureau et son fax, le stagiaire qui tape,
    # le latéral gauche, la montre de Dembo, la première page de 23 h 58.
    prologue: ds.h6.prologue
    questions:                        # le fil rouge de la bible (ch. 12 § 2) : coach / scouts / président
      - { id: coach,     poids: 1.0 }
      - { id: scouts,    poids: 1.0 }
      - { id: president, poids: 1.0 }
    # Le réservoir ne porte que les intrigues de côté : la trame (la photo,
    # Barbier, le petit Rancé, Vialat, le sous-sol) est ouverte par les ancres
    # du script, à heure fixe, et remplit déjà les saisons 1 et 2. Ce qui
    # enjambe l'été compte dans le tirage de la saison suivante (`prendre`
    # moins ce qui continue) : en saison 1, une intrigue de côté au plus, et
    # aucune si celle de la saison 0 n'est pas finie ; en saison 2, le petit
    # Rancé (jusqu'au comptoir) en tient déjà une place. La saison 2 est la fin
    # de partie (l'audit, le sous-sol, la nuit du 31 janvier) : ses intrigues
    # s'ouvrent tôt (créneaux 1 à 3) ; celle que la nuit coupe reste en suspens.
    programme:
      "0":
        prendre: 2
        fenetre: [2, 6]
        reserve: 0
        pool:
          # `season == 0` : une intrigue de la saison 0 que le tirage n'a pas
          # prise ne revient pas en saison 1 prendre la place des siennes
          - { arc: ds.h6.mutuelle, poids: 1.2, signature: true, if: "season == 0" }
          - { arc: ds.h6.montres,  poids: 1.0, if: "season == 0" }
          - { arc: ds.h6.solvang,  poids: 1.0, if: "season == 0" }
          - { arc: ds.h6.canette,  poids: 0.9, if: "season == 0" }
          - { arc: ds.h6.lateral,  poids: 1.0, if: "season == 0" }
          - { arc: ds.h6.dimanche, poids: 0.9, if: "season == 0" }
          - { arc: ds.h6.doc,      poids: 0.7, if: "season == 0" }
          - { arc: ds.h6.gamins,   poids: 0.9, if: "season == 0" }
      "1":
        prendre: 1
        fenetre: [2, 9]
        reserve: 0
        pool:
          - { arc: ds.h6.fils,         poids: 1.2, if: "season == 1" }
          - { arc: ds.h6.lea,          poids: 1.0, if: "season == 1" }
          - { arc: ds.h6.vukic,        poids: 1.0, if: "season == 1" }
          - { arc: ds.h6.malbec,       poids: 1.0, if: "season == 1" }
      "2+":
        prendre: 3
        fenetre: [1, 2]
        reserve: 0
        pool:
          - { arc: ds.h6.dembo_retour, poids: 1.0, if: "flag('h6_dembo_vendu')" }
          - { arc: ds.h6.commission,   poids: 1.0 }
          - { arc: ds.h6.loge,         poids: 1.0 }
    objectifs:
      - { id: vendre_trente_deux_ans,       titre: "Trente millions, deux fois",   when: "vars.h6_saisons_trente >= 2", indice: "Trente millions, c'est la page deux. Deux fois, c'est une carrière." }
      - { id: vendre_trente_sans_fardelli,  titre: "Sans « mon ami »",             when: "vars.h6_saisons_trente >= 1 && !flag('h6_montres_gardees') && relation.fardelli <= -2", indice: "On peut vendre trente millions sans dire « mon ami »." }
      - { id: vendre_trente_le_petit_reste, titre: "Le petit reste",               when: "flag('h6_tibo_garde') && (flag('h6_ardoise_payee') || flag('h6_vl_ardoise_propre'))", indice: "Un gamin de dix-sept ans vaut plus que quatre millions. Son père, lui, doit de l'argent." }
    alarm_overrides:                  # avant celles du rôle ; chaque carte porte son seuil (25 / 75)
      vestiaire.low:
        - { card: ds.h6.alarme.vestiaire_bas_banc, when: "vars.h6_ventes >= 2" }
        - { card: ds.h6.alarme.vestiaire_bas_lettre }
      vestiaire.high:
        - { card: ds.h6.alarme.vestiaire_haut_table }
      tribunes.low:
        - { card: ds.h6.alarme.tribunes_bas_bache, when: "vars.h6_ventes >= 1" }
        - { card: ds.h6.alarme.tribunes_bas_kiosque }
      tribunes.high:
        - { card: ds.h6.alarme.tribunes_haut_echarpe }
      direction.low:
        - { card: ds.h6.alarme.direction_bas_appel, when: "vars.h6_fax_refus >= 1" }
        - { card: ds.h6.alarme.direction_bas_bureau }
      direction.high:
        - { card: ds.h6.alarme.direction_haut_titre }
      caisse.low:
        - { card: ds.h6.alarme.caisse_bas_paie }
      caisse.high:
        - { card: ds.h6.alarme.caisse_haut_vialat }

  # Histoire 7 · Chambre 12 (docs/histoires/00_les_dix_histoires.md) — le huis
  # clos de l'hôtel de la Rive, 2011-2013, le sélectionneur des Cobalts après le
  # bus de 2010. Le prologue et le script : content/arcs/selectionneur/h7_script.yaml ;
  # le réservoir : h7_intrigues.yaml ; les soirs : h7_sombres.yaml. Les quatre
  # fins (content/endings/h7.yaml) tombent à la conférence de 2013 ou au premier
  # créneau de 2014 : le livre tient en trois années civiles.
  - id: apres_fiasco
    index: 6
    role: selectionneur
    title: "Chambre 12"
    question: "À qui rends-tu les Cobalts : aux mutins qui ont tout cassé, aux nouveaux qui n'ont rien vu, ou à la presse qui filme la porte de la chambre 12 ?"
    division: 1
    year: 2011
    ville: Aubérive
    club: Cobalts
    rival: "Boréalie"
    age: 52
    # Les jauges de la bible (ch. 14 § 4) : le pays est à vingt. Aucune scène du
    # prologue ne le fait baisser ; les cartes du barrage et du deuil le relèvent.
    gauges: { vestiaire: 40, tribunes: 20, direction: 55, caisse: 50 }
    force: 56
    objective: maintien
    flags: [histoire_h7, bus_menace]
    president: aulard
    patron: aulard
    camille: false
    pitch: "En 2010, le bus n'est jamais descendu. À l'hôtel de la Rive, vingt-six doubles pendent au tableau des clés ; la troisième nuit, quelqu'un demande celui de la 12."
    chantier: false
    prologue: sl.h7.prologue
    opening_arc: sl.h7.chambre_douze
    cast:
      aulard:     { fonction: patron,     target: 1 }     # quatre heures du matin (A4), l'Objectif ; déposé par la tutelle en 2013
      sandrine:   { fonction: temoin,     target: 1.5 }   # le tableau du prologue, 2 h 10 (A3), le cahier (R2), le dernier tableau
      arzel:      { fonction: docteure,   target: 1 }     # la docteure du prologue, la liste de septembre (A2)
      benali:     { fonction: police,     target: 1 }     # les scellés (A5), la nuit du 14, la page
      josiane:    { fonction: choeur,     target: 0.9 }   # le bus et les visites du prologue, le trombone rouge
      escande:    { fonction: hotel,      target: 0.9 }   # la chambre du prologue, la plante (R1), le tarif de la chambre
      mbako:      { fonction: capitaine,  target: 0.9 }   # le brassard, le bus (R3), la porte de la 12
      ferrol:     { fonction: nouveau,    target: 0.9 }   # le brassard, le sachet, la main
      fardelli:   { fonction: agent,      target: 0.8 }   # « Passez-moi la 12 », l'agent du petit
      rouvier:    { fonction: kine,       target: 0.8 }   # six heures moins le quart, le footing, la copie (S2)
      dauzat:     { fonction: registre,   target: 0.6 }   # le procès-verbal ; il garde le registre après la tutelle
      lea:        { fonction: presse,     target: 0.6 }   # 1 h 47
      rance_mere: { fonction: mere,       target: 0.6 }   # le standard de trois heures, la porte de la 12 (S4)
      rossard:    { fonction: plateau,    target: 0.5 }   # deux heures vingt-cinq à l'antenne
      desforges:  { fonction: tentatrice, target: 0.5 }   # Fulgor, le sponsor louche
      fauvel:     { fonction: syndicat,   target: 0.5 }   # les mutins, puis la vérité, dans cet ordre
      aubert:     { fonction: ministre,   target: 0.5 }   # l'hymne, la prime gelée (ministre jusqu'en 2012)
    questions:
      - { id: mutins,   poids: 1.0 }
      - { id: nouveaux, poids: 1.0 }
      - { id: presse,   poids: 1.0 }
    programme:
      # 2011 : deux intrigues sur sept (la S0 porte déjà cinq ancres et quatre
      # Nouvelles). Toutes avant la nuit du 14 : les étapes qui montrent le
      # petit vivant ont leur variante d'après. La fenêtre [2, 4] : après le
      # brassard (créneau 1) et la Nouvelle du créneau 3, une intrigue doit
      # avoir commencé au 4, sinon le metteur en scène en force une ; la
      # seconde s'ouvre trois créneaux plus loin (`ouverture_ecart`).
      # Poids : la signature (le vingt-sixième) ×3 au tirage de la S0, d'où
      # 0,55 pour la tenir dans [50 %, 65 %] ; le brassard, que le metteur en
      # scène rouvre le plus souvent, est ramené à 0,9. Aucune ne s'ouvre après le 14.
      "0":
        prendre: 2
        fenetre: [2, 4]
        reserve: 0
        pool:
          - { arc: sl.h7.vingt_sixieme, poids: 0.6, signature: true, if: "season == 0 && !flag('h7_rance_mort')" }
          - { arc: sl.h7.capitaine,     poids: 0.9, if: "season == 0 && !flag('h7_rance_mort')" }
          - { arc: sl.h7.tableau,       poids: 0.8 }
          - { arc: sl.h7.hymne,         poids: 0.9, if: "season == 0 && !flag('h7_rance_mort')" }
          - { arc: sl.h7.agent,         poids: 0.9, if: "season == 0 && !flag('h7_rance_mort')" }
          - { arc: sl.h7.ecrit,         poids: 0.9, if: "season == 0 && !flag('h7_rance_mort')" }
          - { arc: sl.h7.linge,         poids: 0.9, if: "season == 0 && !flag('h7_rance_mort')" }
      # 2012 : les portes. La main de 1 h 47 n'est plus au réservoir : l'ancre
      # de mars (la plante devant la 12) ouvre sa trame (la photo, le sachet,
      # le jeudi de Léa), parce que le livre ne se lit pas sans savoir à qui
      # était la main. Le rêve du couloir est une ancre (9-10), le cahier aussi
      # (12-13) : il reste la place d'une intrigue tirée sur six, rituel
      # compris (plus celles que le metteur en scène rouvre quand une se ferme).
      "1":
        prendre: 1
        fenetre: [2, 6]
        reserve: 0
        reprise: false
        pool:
          - { arc: sl.h7.tableau,      poids: 0.5 }
          - { arc: sl.h7.plateau,      poids: 1.0, if: "season <= 1" }
          - { arc: sl.h7.nuit_du_14,   poids: 1.0, if: "season <= 1" }
          - { arc: sl.h7.fulgor,       poids: 0.9, if: "season <= 1" }
          - { arc: sl.h7.hotel,        poids: 0.9, if: "season <= 1" }
          - { arc: sl.h7.trombone,     poids: 0.9, if: "season <= 1" }
      # 2013 : les signatures. La mère n'est plus tirée : la 11 (créneau 1) ouvre
      # sa trame (le standard de trois heures, le rêve du standard, le double),
      # qui doit avoir parlé avant la porte de la 12 (créneau 15). Une des trois
      # tardives restantes, rituel compris, ouverte tôt : la docteure avant sa
      # valise (13), le vote avant la dernière nuit (16).
      "2+":
        prendre: 1
        fenetre: [2, 4]
        reserve: 0
        reprise: false
        pool:
          - { arc: sl.h7.tableau,       poids: 0.5 }
          - { arc: sl.h7.arzel,         poids: 1.0 }
          - { arc: sl.h7.proces_verbal, poids: 1.0 }
          - { arc: sl.h7.fauvel,        poids: 1.0 }
    objectifs:
      - { id: fiasco_pays_reconquis, titre: "Le pays reconquis", when: "gauges.tribunes >= 60 && stats.saisons >= 1", indice: "Le pays est à vingt. Il revient par le trottoir de l'hôtel, pas par la télévision." }
      - { id: fiasco_un_brassard, titre: "Le capitaine debout", when: "(flag('h7_capitaine_mbako') && flag('h7_mbako_temoignera') && !flag('h7_mbako_lache')) || (flag('h7_capitaine_ferrol') && flag('h7_ferrol_dira') && flag('h7_nom_confirme'))", indice: "Celui à qui tu as donné le brassard finira-t-il debout ?" }
      - { id: fiasco_le_bus_descend, titre: "Le bus descend", when: "flag('h7_mbako_temoignera') && flag('h7_ferrol_dira') && (flag('h7_arzel_ensemble') || flag('h7_vote_verite'))", indice: "En 2010, personne n'est descendu du bus. Ici, il s'agit que personne ne reste dans sa chambre." }
    alarm_overrides:
      vestiaire.low:
        - { card: sl.h7.alarme.vestiaire_bas_couloir, when: "flag('h7_rance_mort') && !seen('sl.h7.alarme.vestiaire_bas_couloir')" }
        - { card: sl.h7.alarme.vestiaire_bas_numeros, when: "flag('h7_rance_mort')" }
      tribunes.low:
        - { card: sl.h7.alarme.tribunes_bas_trottoir, when: "flag('h7_rance_mort') && !seen('sl.h7.alarme.tribunes_bas_trottoir')" }
        - { card: sl.h7.alarme.tribunes_bas_page }
      direction.low:
        - { card: sl.h7.alarme.direction_bas_minuit, when: "chars.aulard.statut != 'parti' && !seen('sl.h7.alarme.direction_bas_minuit')" }
        - { card: sl.h7.alarme.direction_bas_registre }
      caisse.low:
        - { card: sl.h7.alarme.caisse_bas_note }
      vestiaire.high:
        - { card: sl.h7.alarme.vestiaire_haut_rires, when: "flag('h7_rance_mort')" }
      tribunes.high:
        - { card: sl.h7.alarme.tribunes_haut_plateau }
      direction.high:
        - { card: sl.h7.alarme.direction_haut_stylo }
      caisse.high:
        - { card: sl.h7.alarme.caisse_haut_prime, when: "flag('h7_fulgor_signe')" }

  # « L'Oreillette » (docs/histoires/00_les_dix_histoires.md, Histoire 8) — la
  # folie. 2024-2027, directeur sportif du Racing Aubérive, propriété du fonds
  # Almadis ; dans l'oreille, le modèle, avec la voix de Joachim Ferlac, mort
  # en décembre 2023. Le patron du moteur est Cheikh Ilyas, qui ne parle
  # qu'une fois ; Jean-Marie Vaubourg, quatre-vingt-douze ans, est président
  # d'honneur. Arcs : content/arcs/ds/h8_*.yaml ; cartes : content/cards/ds/.
  - id: le_modele
    index: 7
    role: ds
    title: "L'Oreillette"
    question: "Qui décide, cette saison : le modèle, le vestiaire, ou toi ?"
    division: 1
    year: 2024
    age: 46
    ville: Aubérive
    club: Racing Aubérive
    rival: Olympique Lyonnet
    # Jauges de la fiche : le fonds tient (65), la tribune boude un directeur
    # sportif qui parle à son oreille (40), le staff attend de voir (45), la
    # masse salariale est saine (55) — c'est elle que le modèle surveille.
    gauges: { vestiaire: 45, tribunes: 40, direction: 65, caisse: 55 }
    force: 56
    objective: maintien
    flags: [histoire_h8, le_modele, club_actif]
    president: nassir
    patron: nassir
    camille: false
    cast:
      mbako:   { fonction: horloge,     target: 1.5 }   # Kerdal, la grève, le Kambara
      aulard:  { fonction: patron,      target: 1.0 }   # Vaubourg, ses six cent douze jours (meurt en fin de S1)
      josiane: { fonction: choeur,      target: 1.0 }   # les cartons, le classeur, la page quatorze
      gege:    { fonction: creancier,   target: 1.0 }   # Cadence, le compte du vieux, Milo
      ober:    { fonction: tentateur,   target: 1.0 }   # la boîte, les courbes, la juge
      lea:     { fonction: chroniqueur, target: 0.8 }   # la cote, la vidéo, les courbes, la ligne de 2017
      kerdal:  { fonction: coeur,       target: 0.6 }   # saison 1 seulement, s'il ne vit pas
      kara:    { fonction: messager,    target: 0.4 }   # la voix de nuit, à partir de la S1
      nassir:  { fonction: vautour,     target: 0.2 }   # une phrase dans le livre ; sa voix passe par le délégué
    pitch: "2024. Un club dans un tableur, et dans ton oreille, la voix d'un mort qui choisit qui vendre."
    chantier: false
    opening_arc: ds.h8.oreillette
    # Le premier jour, de six heures dix à deux heures dix (6 scènes) :
    # content/arcs/ds/h8_script.yaml, content/cards/ds/h8_prologue.yaml.
    prologue: ds.h8.prologue
    questions:
      - { id: modele,    poids: 1.0 }
      - { id: vestiaire, poids: 1.0 }
      - { id: toi,       poids: 1.0 }
    programme:
      # Trois intrigues sont ouvertes par le livre lui-même, au créneau voulu :
      # Kerdal (par Vollaire), De quoi dormir (par le casier de Kerdal), Le
      # petit de Nino (par la canne). Elles figurent au réservoir avec une
      # condition fausse au moment du tirage (leur première carte déjà vue) :
      # elles appartiennent au postulat, le tirage ne les ouvre jamais.
      # Saison 1 : la colonne (Kerdal, De quoi dormir) prend la moitié des
      # créneaux ; le tirage en ajoute deux sur cinq, ouvertes après les
      # premières marches de Kerdal. Six cent douze jours est la signature
      # (poids bas : le ×3 de la première saison suffit).
      "0":
        prendre: 2
        fenetre: [4, 9]
        reserve: 0
        pool:
          - { arc: ds.h8.kerdal,    poids: 1.0, if: "seen('ds.h8.kerdal.trois_fois')" }
          - { arc: ds.h8.comprimes, poids: 1.0, if: "seen('ds.h8.cp.un_demi') || seen('ds.h8.cp.un_demi_docile')" }
          - { arc: ds.h8.vaubourg,  poids: 0.5, signature: true }
          - { arc: ds.h8.cadence,   poids: 1.0 }
          - { arc: ds.h8.pari_rive, poids: 1.0 }
          - { arc: ds.h8.classeur,  poids: 0.9 }
          - { arc: ds.h8.fonds,     poids: 0.7 }
      # Saison 2 : le bruit. Pas de reprise : les intrigues de la première
      # saison ont eu leur chance, et leur seconde chance passe par le
      # maintien des arcs (jamais après le créneau 11, ni dans la saison de
      # l'acte final : leur `when`). Mbako peut partir pour le Kambara dès le
      # printemps 2026 ; la saison 3 n'en sera que plus silencieuse.
      "1":
        prendre: 3
        fenetre: [2, 11]
        reserve: 0
        reprise: false
        pool:
          - { arc: ds.h8.video,      poids: 1.0 }
          - { arc: ds.h8.vieux,      poids: 1.0 }
          - { arc: ds.h8.courbes,    poids: 1.0 }
          - { arc: ds.h8.operatrice, poids: 1.2 }
          - { arc: ds.h8.greve,      poids: 1.4 }
          - { arc: ds.h8.kambara,    poids: 1.0 }
          - { arc: ds.h8.classeur,   poids: 0.8 }
          - { arc: ds.h8.fonds,      poids: 0.7 }
      # Saison 3 : le silence et l'acte final. Les neuf ancres et Le petit de
      # Nino prennent presque tout : une intrigue tirée, au tout début (l'arc
      # qui court encore depuis la saison 2 compte dans le tirage). Ce qui n'a
      # pas eu le temps de finir avant 23 h 58 finit dans l'épilogue, où les
      # intrigues des deux premières saisons peuvent revenir (reprise ; leur
      # `when` les tient hors de la saison 3), avec La voix des autres.
      "2+":
        prendre: 1
        fenetre: [2, 3]
        reserve: 0
        reprise: true
        pool:
          - { arc: ds.h8.milo,    poids: 1.0, if: "seen('ds.h8.mi.grillage')" }
          - { arc: ds.h8.kambara, poids: 3.0 }
          - { arc: ds.h8.ober,    poids: 3.0 }
          - { arc: ds.h8.suivant, poids: 2.0 }
    objectifs:
      - { id: modele_kerdal_vit, titre: "Kerdal a dormi",          when: "flag('h8_kerdal_vit')", indice: "Une courbe rouge n'est pas une date." }
      - { id: modele_sans_voix,  titre: "Une saison sans la voix", when: "flag('h8_rentree_sans') && flag('h8_sans_oreillette')", indice: "On peut entendre un vestiaire sans machine." }
      - { id: modele_mbako,      titre: "Le car de six heures",    when: "flag('h8_mbako_embrasse')", indice: "Il préfère qu'on le regarde courir." }
    alarm_overrides:                  # passent devant les alarmes communes du directeur sportif
      vestiaire.low:
        - { card: ds.h8.alarme.vestiaire_bas_mbako, when: "!flag('h8_mbako_parti') && !flag('h8_mbako_embrasse')" }
        - { card: ds.h8.alarme.vestiaire_bas_staff }
      vestiaire.high:
        - { card: ds.h8.alarme.vestiaire_haut }
      tribunes.low:
        - { card: ds.h8.alarme.tribunes_bas }
      tribunes.high:
        - { card: ds.h8.alarme.tribunes_haut }
      direction.low:
        - { card: ds.h8.alarme.direction_bas }
      direction.high:
        - { card: ds.h8.alarme.direction_haut }
      caisse.low:
        - { card: ds.h8.alarme.caisse_bas_voix, when: "!flag('h8_sans_oreillette') && !flag('h8_voiture_rendue')" }
        - { card: ds.h8.alarme.caisse_bas }
      caisse.high:
        - { card: ds.h8.alarme.caisse_haut }

  - id: mondial_hiver
