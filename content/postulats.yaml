# Les postulats : les points de départ d'une carrière. L'ordre du fichier est
# l'index du Code de Carrière (ne jamais réordonner ; ajouter à la fin).
# `cast` : les visages que le metteur en scène doit faire revenir, avec le
# nombre d'apparitions par saison visé. `opening_arc`, `programme` (le
# réservoir d'intrigues tiré à chaque ouverture de saison, spec variété §1.2),
# `questions` (le fil rouge tiré), `objectifs` (cachés, évalués au Bilan et à
# la fin) et `alarm_overrides` viennent avec la bible de chaque postulat.
# `seeds` (semis à créneaux fixes) est déprécié : gardé pour les postulats en
# chantier et les tests. `chantier: true` = les lints de couture sont des
# avertissements.
postulats:
  - id: promu
    index: 0
    role: entraineur
    # HISTOIRE 1 — « Trois mille visages » (docs/histoires/00_les_dix_histoires.md).
    # L'id, l'index, l'année, la division, les jauges, la force et l'objectif
    # sont ceux du promu sans un sou (les Codes de Carrière en dépendent).
    # Ancien titre : « Le promu sans un sou ».
    title: "Trois mille visages"
    question: "Ce club est à qui : à la tribune qui porte ton visage, au président qui a payé sa place avec la finale, ou à l'argent du Quai qui parie depuis 1974 ?"
    division: 1
    year: 1990
    # Trente-huit ans en 1990 : tu avais vingt-trois ans quand ta mère a pris
    # le car de six heures (l'intermède de la saison 3 le dit). Le tirage d'âge
    # est consommé quand même (engine.dart) : le déterminisme ne bouge pas.
    age: 38
    ville: Aubérive
    club: Racing Aubérive
    gauges: { vestiaire: 50, tribunes: 80, direction: 52, caisse: 30 }
    # 52 → 55 (retune, étape 8) : le promu descendait assez souvent pour que la
    # facture du verdict fasse du SMS de 23h47 la fin de 42 % des carrières.
    force: 55
    objective: maintien
    flags: [promu, histoire_h1]
    president: aulard
    camille: true
    cast:
      # Le livre est porté par Gégé (l'amour et l'arme) et Vaubourg (la cible) ;
      # Gigi, Odette et Lhoste en tiennent chacun une intrigue sur deux ou trois
      # saisons. Le réservoir du promu reste au casting pour ses respirations
      # (le prodige, l'argent qui frappe, l'agent, le mentor), à cible basse :
      # le livre prend la plupart des créneaux.
      aulard:   { fonction: patron,      target: 1 }
      gege:     { fonction: creancier,   target: 2.5 }
      vecchio:  { fonction: coeur,       target: 1.5 }
      josiane:  { fonction: choeur,      target: 0.9 }
      vukic:    { fonction: messager,    target: 0.9 }
      meneche:  { fonction: chroniqueur, target: 1 }
      odette:   { fonction: temoin,      target: 0.9 }
      lhoste:   { fonction: instance,    target: 0.5 }   # visage de S1+ : il arrive avec la berline
      camille:  { fonction: jauge5,      target: 0.5 }
      mbako:    { fonction: horloge,     target: 0.5 }
      nassir:   { fonction: tentateur,   target: 0.5 }
      fardelli: { fonction: vautour,     target: 0.5 }
      clow:     { fonction: mentor,      target: 0.5 }
      brehaut:  { fonction: capitaine,   target: 0.5 }
    pitch: "Ils t'aiment. Ils feront ce que tu n'oses pas faire. Avec ton visage."
    chantier: false
    # Le script du livre (content/arcs/entraineur/h1_script.yaml) : ses ancres
    # ouvrent les intrigues du livre à leur page, saison après saison, jusqu'à
    # l'acte final de la saison 3 (la veille, la salle de presse) et ses fins.
    opening_arc: en.h1.visages
    # Le prologue : la photo grattée et les deux clés, le chant qui contient déjà
    # ton nom, le café de Vukić, la lettre de 1975, les quatre qui décident (dits
    # par Gigi), l'escalier condamné depuis 1977.
    prologue: en.h1.prologue
    questions:                        # fil rouge tiré à l'ouverture de saison (chemin `fil_rouge` dans `when`)
      - { id: tribune,   poids: 1.0 } # la tribune qui porte ton visage (la présentation de Gégé)
      - { id: president, poids: 1.0 } # le président qui a payé sa place (la berline et son 1977)
      - { id: argent,    poids: 1.0 } # l'argent du Quai (la facture de l'imprimeur, l'escalier à vendre)
    programme:
      # Le livre prend la saison par ses ancres et ses étapes (douze à quatorze
      # cartes par saison, pour treize créneaux libres de Nouvelles) : le
      # réservoir du promu attend l'épilogue. Dès la S1, de toute façon, les
      # intrigues du livre encore ouvertes comptent dans `carry` et le tirage
      # n'ouvre plus rien. Les intrigues du livre y sont aussi, en
      # secours d'épilogue seulement (`season >= 3`) : le tirage ne les ouvre
      # jamais avant l'acte final, le script les a déjà ouvertes à leur page.
      "0":
        prendre: 1
        fenetre: [2, 9]
        reserve: 0
        pool:
          # Pendant le livre, le réservoir du promu se tait : il attend
          # l'épilogue (`season >= 3`). Mesuré sur 80 carrières, une intrigue de
          # plus en S0 (l'espion de la haie, le vieux gardien, Ilyas) poussait
          # l'article de Massenet en S1 et les archives de L'Écho après la
          # passerelle, et faisait glisser les Rameaux en S2 (le marbrier se
          # perdait en S3). La tentation du livre est l'argent du Quai.
          - { arc: en.nassir_proprietaire, poids: 1.0, if: "season >= 3 && gauges.caisse < 45" }
          - { arc: en.prodige,             poids: 0.8, if: "season >= 3" }
          - { arc: en.salaires_retard,     poids: 0.9, if: "season >= 3 && gauges.caisse < 45" }
          - { arc: en.vieux_gardien,       poids: 0.4, if: "season >= 3" }
          - { arc: en.cote_du_promu,       poids: 0.4, if: "season >= 3" }
          - { arc: en.espion_haie,         poids: 0.4, if: "season >= 3" }
          - { arc: co.cartons_camille,     poids: 0.3, if: "season >= 3 && !flag('divorce')" }
      "1":
        prendre: 1
        fenetre: [2, 9]
        reserve: 0
        reprise: true
        pool:
          - { arc: en.mentor_clow,         poids: 1.5, if: "season >= 3" }
          - { arc: en.conf_presse,         poids: 1.0, if: "season >= 3" }
          - { arc: en.brassard_brehaut,    poids: 0.8, if: "season >= 3" }
          - { arc: en.adjoint_dine,        poids: 0.6, if: "season >= 3 && (relation.vukic <= 0 || relation.aulard >= 2)" }
          - { arc: en.gigi_staff,          poids: 4.0, if: "season >= 3 && (flag('gigi_staff') || flag('vecchio_promis') || flag('gardien_jeune'))" }
      "2+":
        prendre: 1
        fenetre: [1, 8]
        reserve: 0
        reprise: true
        pool:
          - { arc: co.clow_lundi,          poids: 1.5, if: "season >= 3 && relation.clow >= 0" }
          - { arc: en.fils_aulard,         poids: 1.0, if: "season >= 3 && relation.aulard >= -1" }
          - { arc: en.retour_mbako,        poids: 1.1, if: "season >= 3 && flag('mbako_vendu')" }
          - { arc: en.dossier_meneche,     poids: 1.0, if: "season >= 3" }
          # Les intrigues du livre, en secours d'épilogue (voir plus haut).
          - { arc: en.h1.masques,          poids: 0.1, signature: true, if: "season >= 3" }
          - { arc: en.h1.maillot,          poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.plaque,           poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.gigi,             poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.pellicule,        poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.lhoste,           poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.massenet,         poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.coffre,           poids: 0.1, if: "season >= 3" }
          - { arc: en.h1.quai,             poids: 0.1, if: "season >= 3" }
    objectifs:                        # 3 objectifs cachés ; l'indice est le levier de relance
      # Les ids restent ceux du promu ; les objectifs changent d'habit (H1 § 9).
      - { id: promu_deux_maintiens, titre: "Deux maintiens de suite", when: "vars.saisons_tenues >= 2 || (vars.saisons_tenues >= 1 && season >= 2 && world.rang <= 8)", indice: "Tenir. Encore." }
      - { id: promu_a_lancienne,    titre: "Le club à l'ancienne",    when: "flag('h1_quai_refuse') && !flag('nassir_pret') && !flag('naming_signe') && !flag('club_actif')", indice: "Il y a de l'argent qui frappe à la porte depuis 1974." }
      - { id: promu_banc_gigi,      titre: "Le filet de Gigi",        when: "flag('h1_filet_rendu')", indice: "Un gardien de quarante et un ans a gardé autre chose que ses gants." }
    alarm_overrides:                  # candidats prioritaires (avant alarms.yaml) : les masques réclament
      tribunes.low:
        - { card: en.h1.alarme.tribunes_bas_masques, when: "flag('histoire_h1') && !seen('en.h1.alarme.tribunes_bas_masques')" }
        - { card: en.alarme.tribunes_bas_pacte, when: "flag('pacte_gege')" }
      tribunes.high:
        - { card: en.h1.alarme.tribunes_haut_masques, when: "flag('histoire_h1') && !seen('en.h1.alarme.tribunes_haut_masques')" }
        - { card: en.alarme.tribunes_haut_vukic, when: "arc('en.kop_qui_aime_trop') != 'done'" }
      direction.low:
        - { card: en.h1.alarme.direction_bas_vaubourg, when: "flag('histoire_h1') && !seen('en.h1.alarme.direction_bas_vaubourg')" }
        - { card: en.alarme.direction_bas_naming, when: "flag('naming_signe')" }
      vestiaire.low:
        - { card: en.h1.alarme.vestiaire_bas_masques, when: "flag('histoire_h1') && !seen('en.h1.alarme.vestiaire_bas_masques')" }
        - { card: en.alarme.vestiaire_bas_mbako_vendu, when: "flag('mbako_vendu')" }
      caisse.low:
        - { card: en.h1.alarme.caisse_bas_masques, when: "flag('histoire_h1') && !seen('en.h1.alarme.caisse_bas_masques')" }
        - { card: en.alarme.caisse_bas_salaires, when: "flag('salaires_retard')" }
        - { card: en.promu.alarme_nassir_offre, when: "relation.nassir >= 0 && vars.nassir_palier >= 1" }

  - id: interimaire
    index: 1
    role: entraineur
    title: "L'intérimaire"
    question: "Tu as six semaines pour devenir indispensable, et personne ne te croit."
    division: 2
    year: 1990
    gauges: { vestiaire: 45, tribunes: 50, direction: 40, caisse: 50 }
    force: 44
    objective: maintien
    flags: [interim]
    president: aulard
    camille: true
    cast:                             # bible ch. 11 § 3.1 (cibles d'apparition par saison)
      aulard:   { fonction: patron,       target: 3 }
      vukic:    { fonction: rival,        target: 2.5 }   # il était l'adjoint de l'autre
      brehaut:  { fonction: coeur,        target: 2 }
      josiane:  { fonction: choeur,       target: 2 }
      meneche:  { fonction: chroniqueur,  target: 1.5 }
      fardelli: { fonction: tentateur,    target: 1 }
      gege:     { fonction: horloge,      target: 1 }
      vecchio:  { fonction: ancien,       target: 1 }
      legruet:  { fonction: instance,     target: 0.5 }
      clow:     { fonction: mentor,       target: 0.5 }
      camille:  { fonction: jauge5,       target: 0.5 }
      nassir:   { fonction: argent,       target: 0.5 }
      mbako:    { fonction: prodige,      target: 0.5 }
      aubert:   { fonction: mairie,       target: 0.5 }   # la D2 et la mairie (porteuse de en.mairie_d2)
    pitch: "Six semaines pour devenir indispensable, et personne ne te croit."
    chantier: false                   # lot livré : les budgets de réservoir sont bloquants
    opening_arc: en.interim.six_semaines
    # Le prologue s'arrête là où l'ancre I1 commence (le bureau, les cartons,
    # la plaque) : il prend le parking sous la pluie, le sifflet resté dans le
    # tiroir, la compo de l'autre au mur, la phrase que le groupe attend.
    prologue: en.interim.prologue
    questions:                        # fil rouge tiré à l'ouverture de saison
      - { id: vestiaire, poids: 1.0 } # le groupe de l'ancien
      - { id: diplome,   poids: 1.0 } # tu n'as pas le papier
      - { id: grand_nom, poids: 1.0 } # celui qu'on attend pour janvier
    programme:                        # le réservoir (bible ch. 11 § 3.1, « Programme »)
      "0":
        # 2 → 3. Le budget « rythme » (§ 5.1) restait rouge à deux tirages : le
        # slot de première ouverture est le minimum des tirages, et avec deux
        # points seulement la garde d'écartement n'a presque rien à espacer —
        # écart-type 1,52 pour un plancher de 1,8, et 9 % des S0 ouvraient deux
        # intrigues à moins de trois créneaux. Le vrai coupable était en aval :
        # deux intrigues ne remplissent pas la saison, la cadence forcée
        # ouvrait la troisième elle-même, au créneau courant et sans
        # écartement (18 % des ouvertures forcées, budget ≤ 15 %). Trois
        # tirages rendent cette ouverture au réservoir, qui l'écarte.
        prendre: 3
        # [2,9] → [1,12] : le slot de première ouverture est le minimum de trois
        # tirages ; sur huit valeurs son écart-type tombait à 1,32 (budget § 5.1 :
        # ≥ 1,8) et 3 % des S0 ouvraient deux intrigues à moins de trois créneaux.
        # Mesuré : [2,11] remonte l'écart-type à 1,85 mais laisse 7 % de S0 avec
        # deux ouvertures serrées, [1,12] 2,06 et 6 %. Plus la fenêtre monte
        # haut, plus les créneaux tirés couvrent la saison, et plus une
        # ouverture de cadence forcée — servie au créneau courant, sans
        # écartement — tombe à côté de l'une d'elles. [1,10] tient les deux :
        # écart-type 1,85, paires serrées ramenées de 3 % à 2 %.
        # [1,10] → [1,14] : la fenêtre avait été réglée pour trois tirages ;
        # avec `prendre: 2` elle serrait les deux ouvertures sur la première
        # moitié de saison. Le budget « rythme » du § 5.1 reste hors bande
        # (écart-type 1,5 pour un plancher de 1,8) : c'est le prix du passage
        # à deux ouvertures, qui rend leurs créneaux aux Nouvelles et aux
        # visages du casting. À reprendre avec le budget des Nouvelles.
        fenetre: [1, 14]
        # 1 → 0 : la réserve ouvrait une intrigue de plus au premier trou de
        # cadence de la S0. Avec deux ancres Bréhaut de plus dans la saison,
        # la file d'étapes débordait (36 % d'étapes échues, backlog P99 3) et
        # mangeait les créneaux réservés aux Nouvelles. `forceStory` retombe
        # sur le tirage pondéré du réservoir.
        reserve: 0
        pool:
          # 1,3 → 0,5 : `signature` multiplie déjà le poids par trois en S0 (et la
          # prime « thème neuf » par 1,5). À 1,3 le vestiaire de l'ancien s'ouvrait
          # dans 87 % des carrières, pour une bande de signature de [50 %, 65 %].
          # `season <= 1` : sans cette borne, la reprise des buckets "1" et "2+"
          # rouvrait indéfiniment les intrigues d'installation, et les six
          # premières du pool finissaient toutes entre 67 % et 87 % de couverture
          # (plafond 65 %). Elles racontent l'arrivée : elles se jouent la
          # première saison, la seconde au plus tard.
          # 0,42 → 0,62 : la signature du postulat plafonnait à 44 % de
          # couverture là où § 5.1 demande [50 %, 65 %]. Le poids avait été
          # baissé quand le bucket tirait trois intrigues ; il est remonté avec
          # le retour à `prendre: 3`.
          - { arc: en.vestiaire_ancien,    poids: 1.05, signature: true, if: "season <= 1" }
          # 1,2 → 1,0 : le diplôme (68 %) et le grand nom (70 %) passaient le
          # plafond de couverture (65 %).
          - { arc: en.diplome,             poids: 0.8, if: "season <= 1" }
          # 1,0 → 1,5 : Fardelli, le tentateur du postulat, n'apparaissait plus
          # que dans 63 % des premières saisons (plancher 80 %) ; c'est la seule
          # intrigue de la S0 qu'il porte.
          - { arc: en.grand_nom,           poids: 1.9, if: "season <= 1" }
          # 1,0 → 1,5 : même raison côté Gégé (69 % des S0, plancher 80 %) — le
          # kop qui doute est la seule intrigue de S0 qu'il porte.
          - { arc: en.kop_doute,           poids: 1.9, if: "gauges.tribunes <= 60 && season <= 1" }
          - { arc: en.bureau_ancien,       poids: 0.7, if: "season <= 1" }
          - { arc: en.cote_interim,        poids: 0.7, if: "season <= 1" }
          # 1,0 → 0,55 : l'adjoint qui dîne est désormais ouvrable dès la S0
          # (min_season 0, pour l'ancre « le dauphin ») et il est aussi aux
          # buckets "1" et "2+" — à 1,0 il montait à 67 % de couverture.
          # 0,55 → 0,95 : Vukić, le rival du postulat, doit apparaître deux fois
          # dans 90 % des premières saisons et plafonnait à 89 % ; l'adjoint qui
          # dîne est la seule intrigue de S0 qu'il porte.
          - { arc: en.adjoint_dine,        poids: 0.85 }
          # 0,5 → 1,2 : Gigi Vecchio, l'« ancien » du cast, tombait à 61 % des
          # premières saisons (plancher 80 %) — c'est la seule intrigue de S0
          # qu'il porte, et elle était diluée par les poids remontés au-dessus.
          - { arc: en.vieux_gardien,       poids: 2.4 }
          - { arc: en.salaires_retard,     poids: 0.8, if: "gauges.caisse < 45" }
          - { arc: en.prodige,             poids: 1.0 }
          # Bible ch. 11 § 3.1 : la variante « six semaines » de l'appel
          # (co.cartons.appel_interim, lue sur flag('interim')) est la seconde
          # intrigue légère de la S0 ; livrée par la salle du promu.
          - { arc: co.cartons_camille,     poids: 0.3, if: "!flag('divorce')" }
      "1":
        # 3 → 4. `k = prendre - carry` : avec trois tirages, la S1 de l'intérimaire
        # manquait de matière (0,69 ouverture forcée par saison, budget ≤ 0,5) et
        # une saison sur 262 dépassait l'écart de cadence. Quatre tirages ramènent
        # la cadence forcée à 0,33 et l'écart max à 3.
        # Écart mesuré et assumé : `prendre: 4` a été essayé (k = prendre − carry,
        # et depuis que le bucket "0" en tire trois, la S1 démarre souvent avec
        # k = 0). Il divise par trois la queue de l'écart de cadence — mais il
        # ramène les Nouvelles de la S1 de 99 % à 95 % de saisons dans la bande
        # 3-4, c'est-à-dire qu'il échange un budget rouge contre un autre.
        # Gardé à 3 : la queue est une saison sur quatre cents, la Nouvelle
        # manquante est toutes les vingt.
        prendre: 3
        # Écart mesuré et assumé : [2,14] a été essayé pour combler la fin de
        # saison (queue du budget § 5.2) — les ouvertures s'étalent bien, mais
        # leurs étapes arrivent après le Grand Match et l'écart max EMPIRE
        # (5 saisons sur 2 592 au-dessus de 4, contre 1 à [2,12]). Gardé tel quel.
        fenetre: [2, 12]              # même remède de rythme que le bucket "0"
        # `reserve: 1` → 0 : la réserve est servie « premier id encore éligible,
        # dans l'ordre du fichier » et `forceStory` la prend avant le tirage
        # pondéré. La D2 et la mairie, deuxième du pool, ramassait 40 % de ses
        # ouvertures par forçage (plafond 15 %) et montait à 74 % de couverture.
        reserve: 0
        reprise: true                 # les entrées de "0" non tirées restent candidates
        pool:
          - { arc: en.ancien_en_face,      poids: 2.1 }
          - { arc: en.lettre_anonyme,      poids: 1.7 }
          - { arc: en.mentor_clow,         poids: 1.0 }
          - { arc: en.nassir_proprietaire, poids: 0.9 }
          - { arc: en.brassard_brehaut,    poids: 1.0 }
          - { arc: en.enveloppe,           poids: 0.9 }
          - { arc: en.espion_haie,         poids: 1.2 }
          - { arc: en.vieux_gardien,       poids: 0.35 }  # rituel
          # La bible ne la met qu'au bucket "0" ; elle est reprise ici à poids
          # réduit parce que Camille est le seul visage de la S1 qui nomme
          # (son `adresse` rend « {prenom} » aux trois visages).
          - { arc: co.cartons_camille,     poids: 0.35, if: "!flag('divorce')" }
          # La D2 et la mairie en fin de liste : c'est la place, pas seulement le
          # poids, qui la faisait ouvrir (réserve et cadence forcée lisent
          # l'ordre du fichier).
          - { arc: en.mairie_d2,           poids: 0.7 }
          # Manquent encore au pool "1" de la bible : co.derby et co.pharmacie,
          # écrites côté joueur seulement (roles: [joueur], postulats:
          # [fin_de_contrat]) ; à remettre ici dès que leur versant banc existe.
      "2+":
        prendre: 3
        fenetre: [1, 11]
        # 2 → 0 : la réserve était servie « premier id encore éligible, dans
        # l'ordre du fichier » à chaque trou de cadence, et les têtes de pool
        # devaient au forçage 23 à 41 % de leurs ouvertures (plafond 15 %). Sans
        # réserve, `forceStory` retombe sur le tirage pondéré du réservoir.
        reserve: 0
        reprise: true
        pool:
          - { arc: en.aulard_rappelle,       poids: 1.8, if: "flag('bilan_manque') && relation.aulard >= 0" }
          - { arc: en.fils_aulard,           poids: 1.0, if: "relation.aulard >= -1" }
          - { arc: en.dossier_meneche,       poids: 1.6 }
          # 2,0 → 3,2 : avec `prendre: 3` au bucket "2+", Gigi au staff tombait
          # à 7 % de couverture (plancher 10 %) — sa trace d'entrée est déjà rare.
          # 3,2 → 5,4 : avec `prendre: 3` au bucket "0", l'intrigue est retombée
          # à 6 % de couverture (plancher 10 %) — sa trace d'entrée est rare.
          - { arc: en.gigi_staff,            poids: 5.4, if: "flag('gigi_staff')" }
          # 1,4 → 5,0 et l'enveloppe ajoutée aux traces d'entrée : la Commission
          # ne s'ouvrait que dans 7 % des carrières (plancher 10 %) — elle est
          # `min_season: 2` et son `if` demande une trace rare, il lui faut un
          # gros poids pour tenir le plancher.
          # Porte élargie plutôt que poids remonté : à 7,5 la Commission ne
          # s'ouvrait encore que dans 9 % des carrières (plancher 10 %) parce
          # que son `if` ne lisait que des traces rares et qu'elle est
          # `min_season: 2`. `match_arrange_couvert` (la lettre anonyme rangée
          # dans le tiroir) et `enveloppe_denoncee` (l'enveloppe portée à la
          # Fédération) sont deux traces fréquentes, et deux raisons parfaitement
          # lisibles d'être convoqué salle 3.
          - { arc: en.commission_discipline, poids: 7.5, if: "flag('fede_dossier') || flag('lanceur_alerte') || flag('match_arrange_couvert') || flag('enveloppe_denoncee') || flag('enveloppe_promise') || flag('enveloppe_rival') || flag('enveloppe_niee')" }
          # 1,0 → 3,6 : le retour du prodige ne s'ouvrait que dans 8 % des
          # carrières (plancher 10 %) — il lui faut `mbako_vendu` ET la S2.
          # 5,2 → 11 : ce n'est pas le poids qui le bride mais sa chaîne —
          # `en.prodige` doit s'ouvrir, la vente doit être choisie, et la
          # carrière doit atteindre la saison 2. Le poids est au plafond utile ;
          # c'est le poids de `en.prodige` au bucket "0" qui fait le reste.
          - { arc: en.retour_mbako,          poids: 11.0, if: "flag('mbako_vendu')" }
          - { arc: en.conf_presse,           poids: 1.4 }    # rituel (every_season)
          # La vie d'après du mentor (ch. 01 § 5.4 : partagée avec l'intérimaire).
          - { arc: co.clow_lundi,            poids: 1.5, if: "relation.clow >= 0" }
          - { arc: en.vieux_gardien,         poids: 0.45 }   # rituel (replay: ritual)
          # 0,7 → 1,2 : avec `prendre: 3` au bucket "2+", l'intrigue tombait à
          # 18 % de couverture (plancher 20 % de `--arc`) et ses quatre dernières
          # cartes n'étaient jamais servies.
          - { arc: en.kop_qui_aime_trop,     poids: 1.2, if: "gauges.tribunes >= 65 && arc('en.kop_doute') != 'active'" }
          - { arc: en.espion_haie,           poids: 1.0 }
          - { arc: en.salaires_retard,       poids: 0.6, if: "gauges.caisse < 45" }
          - { arc: en.adjoint_dine,          poids: 0.8 }
          - { arc: en.enveloppe,             poids: 0.8 }
    objectifs:                        # 3 objectifs cachés (bible ch. 11 § 3.1)
      # `stats.saisons >= 1` : quatre carrières sur cinq le décrochaient (bande
      # [5 %, 60 %]) — ce n'était pas un objectif caché, c'était le déroulement
      # normal d'une carrière qui survit à sa première saison. L'indice promet
      # trois marches (« six semaines, puis six mois, puis on verra ») : il faut
      # donc les trois, le papier signé compris, et n'avoir jamais été déchu.
      - { id: interim_garder_poste,   titre: "Garder le poste", when: "!flag('dechu') && stats.saisons >= 3 && flag('cdi_signe')", indice: "Six semaines. Puis six mois. Puis on verra." }
      - { id: interim_sans_papier,    titre: "Sans papier",     when: "flag('derogation') && stats.saisons >= 2", indice: "Le tampon manque une signature. Ça se voit à la longue." }
      - { id: interim_adjoint_fidele, titre: "L'adjoint fidèle", when: "relation.vukic >= 2 && stats.saisons >= 2", indice: "Il était l'adjoint de l'autre. Il peut être le tien." }
    alarm_overrides:                  # candidats prioritaires (avant alarms.yaml)
      direction.low:
        - { card: en.interim.alarme_aulard_cv }
      tribunes.low:                   # tant que la tribune chante l'ancien, c'est Gégé et sa bâche
        - { card: en.kop_doute.siffle_alarme, when: "flag('kop_hostile')" }
      vestiaire.low:                  # bible ch. 11 § 3.1 : quand la paie traîne, le rond central s'assoit
        - { card: en.salaires.greve_entrainement, when: "flag('salaires_retard')" }

  - id: pepite
    index: 2
    role: joueur
    title: "La pépite du club-usine"
    question: "Tout le monde veut te vendre. Toi, tu veux jouer."
    division: 2
    year: 1990
    # Bible ch. 10 § 3 : « Âge : 19 ». Sans ce champ le rôle joueur tirait à plat
    # 19-31, et 46 % des carrières démarraient la « pépite » entre 26 et 31 ans :
    # `p2b_dernier_bloc` disait « tu as 30 ans » à un joueur que le postulat
    # appelle « petit », l'objectif `pepite_brassard_22` (age <= 22) tombait à
    # 3 %, et la porte de transition `age >= 32` s'ouvrait dès la S0. Le tirage
    # du rôle reste consommé (engine §1.8) : « même code, même carrière » tient.
    age: 19
    gauges: { vestiaire: 50, tribunes: 80, direction: 50, caisse: 45 }
    force: 58
    flags: [pepite]
    president: fardelli
    camille: true
    # Casting de la bible ch. 10 § 3 : Fardelli vend, Vaubourg tient le prix
    # (le président de l'usine), Bréhaut teste, Mbako pousse derrière.
    # Cibles relues sur ce que la S0 porte vraiment (défaut « récurrence du
    # casting en S0 »). Le `target` n'est pas qu'un budget de contrôle : il
    # entre dans `faceFactor` (`expected = cardSlots / target`), donc une cible
    # au-dessus de ce que le contenu porte ne fait pas revenir le visage, elle
    # fait seulement échouer la mesure. Le réservoir tire 3 intrigues sur 10 :
    # un porteur ne peut pas dépasser ~30 % de S0, et les visages qui tiennent
    # 80 % ou plus sont ceux du script, des Nouvelles, des alarmes et des
    # réactions. D'où : Fardelli et Bréhaut passent d'une cible « deux fois par
    # saison » (75 % et 57 %, seuil 90 %) à « une fois » ; Mbako passe sous 1
    # (à dix-neuf ans, LE prodige c'est toi — « celui qui prend ta place » est
    # un visage de S1+, mesuré 19 % des S1 et 43 % des S2+) ; Gégé, Vecchio,
    # Vukić et Camille montent au contraire, pour que la dette de visage les
    # rappelle plus tôt dans le sac.
    cast:
      fardelli:   { fonction: vautour,      target: 1.9 }
      aulard:     { fonction: patron,       target: 2 }
      brehaut:    { fonction: capitaine,    target: 1.9 }
      mbako:      { fonction: horloge,      target: 0.9 }
      gege:       { fonction: creancier,    target: 1.9 }
      lea:        { fonction: chroniqueur,  target: 1.5 }
      # Gigi et Vukić sont des visages de carrière, pas de première saison : le
      # gardien qui conseille et l'adjoint qui « te le dit parce que personne ne
      # te le dira » entrent avec le banc, le diplôme et la retraite du gardien,
      # toutes des intrigues de S1+ (mesuré : Vecchio 62 % des S1 et 85 % des
      # S2+, Vukić 48 % et 70 %, contre 67 % et 52 % des S0). Sous 1, la mesure
      # de récurrence ne les exige plus en S0 — elle continue de les compter.
      vecchio:    { fonction: coeur,        target: 0.9 }
      vukic:      { fonction: messager,     target: 0.9 }
      sabatier:   { fonction: horloge,      target: 1 }
      josiane:    { fonction: choeur,       target: 1 }
      camille:    { fonction: jauge5,       target: 1.9 }
      meneche:    { fonction: chroniqueur,  target: 1 }
      nassir:     { fonction: tentateur,    target: 0.5 }
      mere_mbako: { fonction: famille,      target: 0.5 }
      legruet:    { fonction: instances,    target: 0.5 }
    pitch: "Tout le monde veut te vendre. Toi, tu veux jouer. Et le genou a un avis."
    chantier: false                   # relu à l'intégration : les budgets de réservoir sont bloquants
    opening_arc: jp.pepite.club_usine
    # Le prologue amène jusqu'à la portière de Fardelli ; l'ancre P1 du script
    # (`jp.pepite.p1_valeur`, les dix pour cent) l'ouvre juste après.
    prologue: jp.pepite.prologue
    questions:                        # fil rouge tiré à l'ouverture de saison
      - { id: prix,    poids: 1.0 }
      - { id: terrain, poids: 1.0 }
      - { id: maison,  poids: 1.0 }
    programme:                        # le réservoir (bible ch. 10 § 3, « Programme »)
      # SUBSTITUTIONS BIBLE → BASE (ch. 10 § 3, « Programme et Cast ») — voulues,
      # pas des oublis :
      #   jp.dembo_rival    → co.mbako_rival   (le prodige d'après tient le rôle
      #                       du coéquipier rival ; dembo n'a pas de visage)
      #   jp.genou_20       → jp.genou_parle   (même scène, écrite sans borne
      #                       d'âge : le genou parle quand il parle)
      #   jp.coach_qui_te_veut → non écrite ; abandon acté (ch. 10 § 3, note de
      #                       relecture) : le coach qui te veut est déjà dit par
      #                       jp.banc_hiver (le coach qui ne te veut PAS) et par
      #                       jp.clause. Rien à écrire de neuf pour le dire.
      # Rebranchées à la relecture (défaut « réservoir plus maigre que la
      # bible ») : co.pharmacie, co.derby et jp.pari étaient écrites et
      # n'étaient dans aucun bucket ; s'y ajoutent cinq intrigues que la bible
      # cite dans les variantes de la pépite et qui n'existaient que pour la fin
      # de contrat — jp.vestiaire_porte (le vestiaire signe pour qu'on te garde :
      # c'est LA scène du club-usine qui veut vendre), jp.consultant,
      # jp.memoires, jp.derniere_selection et jp.jubile. Le réservoir passe de
      # 15 à 23 intrigues ; chacune est arrivée avec une garde d'âge ou de
      # carrière, parce qu'elles ont été écrites pour un joueur de 31 ans.
      # Cast : la bible nomme dembo et rouvier, absents de characters.yaml (17
      # visages) ; leurs fonctions sont tenues par mbako et sabatier.
      # Poids relus sur le rapport de réservoir (spec § 5.1, bande
      # [10 %, 65 %], signature [50 %, 65 %]). Cinq intrigues débordaient :
      # jp.tifo 80 % (la prime `signature` ×3 en S0 sur un poids déjà à 1,2),
      # jp.genou_parle 90 % (seule intrigue de thème `corps` : jamais éteinte
      # par le voisin, et la prime « thème neuf » ×1,5 à chaque tirage),
      # co.mbako_rival, jp.conseils_gigi et jp.brassard_test entre 66 et 74 %.
      # Les poids des cinq baissent, ceux du bas de tableau (le banc, le bac,
      # le brassard, le diplôme, la clause, le retour) montent : c'est le même
      # nombre d'intrigues par saison, mieux réparti.
      # L'ORDRE DU `pool` compte autant que les poids : la réserve prend « les
      # premiers candidats restants dans l'ordre du fichier », et une réserve
      # s'arme sur le premier trou de cadence. jp.tifo en tête du bucket "0" et
      # jp.genou_parle en tête du bucket "1" étaient donc tirées ou repêchées
      # presque à chaque saison (80 % et 90 %), et repêchées tard — d'où le
      # slot moyen 13,8 du genou. Les deux passent en fin de liste ; les
      # intrigues du bas de tableau passent devant.
      "0":
        prendre: 3
        # [2,9] → [1,12] : le slot de première ouverture est le minimum de
        # trois tirages ; sur huit valeurs son écart-type tombait à 1,34
        # (budget § 5.1 : ≥ 1,8).
        fenetre: [1, 12]
        reserve: 1
        pool:
          # SUR-CORRECTION CORRIGÉE (défaut « réservoir de S0 déséquilibré ») :
          # la passe précédente avait remonté le banc à 2,3 et le bac à 3,8
          # pendant que les sept autres restaient entre 0,12 et 0,20. Pour trois
          # tirages sans remise, les deux étaient quasi certains — 96 % et 99 %
          # de couverture de carrière pour un plafond de 65 %, 23 ensembles S0
          # distincts pour un seuil de 25, et jp.tifo, l'intrigue signature,
          # vue dans 39 % des carrières au lieu des 50-65 % demandés. Les deux
          # redescendent, le bas de tableau remonte vers 0,4-0,6, et le pool
          # gagne jp.vestiaire_porte (le vestiaire qui signe pour qu'on te
          # garde : la scène du club-usine, et la deuxième intrigue de Bréhaut
          # en S0).
          - { arc: jp.banc_hiver,      poids: 0.5, if: "world.serie_defaites >= 1 || gauges.direction < 45 || flag('coach_critique') || age <= 21" }
          - { arc: jp.camille_bac,     poids: 0.45, if: "age <= 24" }
          - { arc: jp.premiere_une,    poids: 0.5 }
          - { arc: jp.selection,       poids: 0.5, if: "gauges.tribunes >= 55" }
          - { arc: jp.contrat_image,   poids: 0.45, if: "gauges.caisse >= 45" }
          - { arc: jp.brassard_test,   poids: 0.6 }
          - { arc: co.mbako_rival,     poids: 0.6 }
          - { arc: jp.vestiaire_porte, poids: 0.5 }
          - { arc: jp.conseils_gigi,   poids: 0.4 }
          # `signature: true` multiplie déjà le poids par trois en S0 (et la prime
          # « thème neuf » par 1,5) : 0,3 rend un poids effectif de 1,35.
          - { arc: jp.tifo,            poids: 0.34, signature: true, if: "gauges.tribunes >= 65" }
      "1":
        # 3 → 2 : avec la reprise du bucket "0", quinze intrigues et cinq
        # saisons de carrière, trois tirages par saison les ouvraient presque
        # toutes (couverture 66-90 %, plafond 65 %). Deux tirées plus une de
        # réserve suffisent : le temps d'histoire de S1 reste au-dessus du
        # budget (médiane 14 pour un seuil de 10).
        prendre: 2
        # [1,12] → [1,9] (défaut « échéances en S1 ») : le bucket "1" tire deux
        # intrigues NEUVES par-dessus la reprise du bucket "0", et une ouverture
        # au slot 11 ou 12 pousse ses trois étapes dans les cinq derniers
        # créneaux — 44 % des étapes de la S1 arrivaient à l'échéance (bande 6)
        # et le backlog P99 montait à 3. Ouvrir avant le slot 9 laisse la place
        # aux étapes ; le budget de fenêtre du bucket "0" ([1,12]) n'a pas ce
        # problème, il n'a rien à reprendre.
        fenetre: [1, 9]
        reserve: 1
        reprise: true
        pool:
          - { arc: jp.clause,        poids: 0.85, if: "gauges.tribunes >= 55" }
          # NB : `entriesUpTo` déduplique par arc et garde la PREMIÈRE entrée
          # rencontrée, buckets antérieurs d'abord — le poids réécrit ici pour
          # un arc déjà listé au bucket "0" est inerte. C'est le poids du
          # bucket "0" qui commande aussi la reprise en S1.
          - { arc: jp.camille_bac,   poids: 0.25, if: "age <= 24" }
          # Rebranchées (bible ch. 10 § 3) : la pharmacie du club et le derby.
          # La pharmacie est portée par la kiné et le flacon blanc, pas par
          # l'âge : la variante « à ton âge on ne demande pas » attend 28 ans,
          # la scène de base est écrite pour n'importe quel joueur.
          - { arc: co.pharmacie,     poids: 0.5, if: "relation.sabatier >= 0" }
          - { arc: co.derby,         poids: 0.55, if: "gauges.tribunes >= 50" }
          # Les intrigues de S0 restent au tirage en S1 (reprise) ; on les
          # remet explicitement pour que le bucket "1" ne soit pas si étroit
          # que tout s'ouvre la même saison.
          - { arc: jp.contrat_image, poids: 0.22, if: "gauges.caisse >= 45" }
          - { arc: jp.selection,     poids: 0.32, if: "gauges.tribunes >= 55" }
          - { arc: jp.brassard_test, poids: 0.28 }
          - { arc: co.mbako_rival,   poids: 0.35 }
          - { arc: jp.conseils_gigi, poids: 0.1 }
          # 0,28 → 0,18 et en fin de pool : troisième du bucket, la première Une
          # était la réserve dès que la clause et le bac étaient tirés (la
          # réserve lit l'ordre du fichier) — 32 % d'ouvertures en S1 et 74 % de
          # couverture, pour un plafond de 65 %.
          - { arc: jp.premiere_une,  poids: 0.18 }
          - { arc: jp.genou_parle,   poids: 0.22 }
          # 0,5 → 0,38 et en fin de pool : l'exil doré s'ouvrait dans 67 % des
          # carrières (plafond 65 %) et devait 16 % de ses ouvertures au forçage —
          # troisième du pool, il était la réserve du bucket dès que la clause et
          # le bac étaient tirés (la réserve lit l'ordre du fichier).
          - { arc: jp.exil_dore,     poids: 0.38, if: "relation.nassir >= 0 || year >= 1999" }
      "2+":
        # Mesuré : à `prendre: 3` la couverture moyenne descend bien (58 → 55 %),
        # mais le pool des saisons tardives se vide et la cadence forcée ouvre le
        # rituel de Gigi pour boucher les trous (68 % de couverture, 20 %
        # d'ouvertures forcées). Quatre tirages restent le bon compte ; c'est le
        # `weight` du rituel qui a été baissé (arcs/joueur/reservoir_b.yaml).
        prendre: 4
        fenetre: [1, 12]
        reserve: 2
        reprise: true
        pool:
          - { arc: jp.retour_usine,    poids: 2.2, if: "flag('vendu_d1')" }
          - { arc: jp.brassard_20,     poids: 2.1, if: "relation.brehaut >= 2 || !flag('capitaine')" }
          - { arc: jp.diplome_joueur,  poids: 2.6, if: "age >= 26 || flag('genou') || flag('banc_bosse') || flag('diplome_reporte')" }
          - { arc: jp.conseils_gigi,   poids: 0.08 }    # rituel
          - { arc: jp.contrat_image,   poids: 0.2 }     # replay after 2
          - { arc: jp.banc_hiver,      poids: 0.9 }     # replay after 2
          - { arc: jp.exil_dore,       poids: 0.45 }    # replay after 3
          - { arc: jp.clause,          poids: 0.6, if: "gauges.tribunes >= 55" }
          - { arc: jp.genou_parle,     poids: 0.4 }
          # LES CINQ INTRIGUES DE FIN DE CARRIÈRE, rebranchées (défaut
          # « réservoir plus maigre que la bible »). Elles ont été écrites pour
          # un joueur de 31 ans : chacune reçoit ici la garde qui lui manquait,
          # sinon on proposait des mémoires et un jubilé à quelqu'un de vingt
          # ans. Le pari et le derby n'ont pas d'âge : c'est le compte à sec et
          # la ville qui les ouvrent.
          - { arc: jp.pari,            poids: 1.6, if: "gauges.caisse < 55 || relation.fardelli <= 0" }
          - { arc: co.derby,           poids: 0.7, if: "gauges.tribunes >= 50" }
          - { arc: co.pharmacie,       poids: 0.6, if: "relation.sabatier >= 0" }
          - { arc: jp.consultant,      poids: 1.5, if: "age >= 23 && (relation.meneche >= 0 || relation.lea >= 1)" }
          - { arc: jp.memoires,        poids: 2.0, if: "age >= 23 || stats.saisons >= 4" }
          # « Je vous prends pour le vestiaire, plus pour les jambes » : il faut
          # avoir porté le cobalt, et des jambes qui commencent à parler.
          # Deux portes, sinon l'intrigue est sous le plancher de 10 % : le
          # cobalt déjà porté (jp.selection, issue `cobalts`, ~10 % des
          # carrières), ou la carrière longue avec l'homme de la Fédération —
          # « je vous prends pour le vestiaire, plus pour les jambes » se dit
          # aussi à quelqu'un qu'on rappelle une dernière fois.
          - { arc: jp.derniere_selection, poids: 2.2, if: "flag('international') || flag('capitaine') || (stats.saisons >= 5 && relation.legruet >= 1)" }
          # LA PORTE DE LA FIN `jubile` (défaut bloquant). La fin était posée par
          # le seul `s.role == 'joueur' && s.age >= 38` du passage de saison :
          # inatteignable pour une carrière qui commence à 19 ans et à qui la
          # transition entraîneur est proposée dès 32. Comme les autres fins de
          # destin (bible ch. 10 § 6), elle a maintenant sa porte de contenu :
          # `jp.jubile.jour*` la pose sur « Je raccroche ». La tribune haute et
          # six saisons au compteur en font une fin qu'on gagne, pas qu'on subit.
          - { arc: jp.jubile,          poids: 2.6, if: "stats.saisons >= 4 && gauges.tribunes >= 60" }
    objectifs:                        # 3 objectifs cachés (bible ch. 10 § 3)
      - { id: pepite_destination,    titre: "Choisir sa destination",      when: "flag('vendu_d1') && flag('sans_agent')", indice: "Un agent choisit pour toi. Sauf si tu n'en as pas." }
      - { id: pepite_enfant_du_club, titre: "L'enfant du club",            when: "flag('enfant_du_pays') && flag('fidele') && stats.saisons >= 3", indice: "Vingt mètres de bâche, ça engage." }
      - { id: pepite_brassard_22,    titre: "Le brassard avant vingt-deux ans", when: "flag('capitaine') && age <= 22", indice: "Bréhaut a un genou. Et un brassard." }
    alarm_overrides:                  # candidats prioritaires (avant alarms.yaml)
      tribunes.high:
        # Gégé d'abord (défaut « récurrence du casting en S0 ») : la pépite ouvre
        # à 80 de tribune, cette alarme est celle qui sonne le plus tôt, et elle
        # n'avait que Léa. Le capo est le seul visage du cast dont la présence en
        # S0 tenait à une seule intrigue (jp.tifo).
        - { card: jp.pepite.alarme_local_gege, when: "!seen('jp.tifo.bache')" }
        # La porte lit l'EXISTENCE de la scène, pas sa clôture : `!= 'done'` était
        # vrai aussi quand jp.tifo n'avait jamais été armée, et Léa demandait de
        # confirmer une bâche qui n'existait pas — ou doublait jp.tifo.bache trois
        # cartes plus loin. `seen('jp.tifo.prix')` garantit les deux moitiés de sa
        # phrase : les vingt mètres peints ET le prix peint dessous.
        - { card: jp.pepite.alarme_tifo_lea, when: "seen('jp.tifo.prix')" }
        # La pépite sans tifo : la tribune monte quand même, et Léa n'a que la
        # cote, la Une et le prix — pas de bâche à faire confirmer.
        - { card: jp.pepite.alarme_cote_lea }
      caisse.low:
        - { card: jp.pepite.alarme_fardelli_avance, when: "flag('agent_fardelli')" }

  - id: fin_de_contrat
    index: 3
    role: joueur
    title: "Fin de contrat à 31 ans"
    question: "Ton genou a un avis, ton agent en a un autre."
    division: 1
    year: 1990
    gauges: { vestiaire: 50, tribunes: 50, direction: 45, caisse: 60 }
    force: 52
    # Le postulat s'appelle « Fin de contrat à 31 ans » : l'âge se déclare, il
    # ne se tire pas. Sans cette ligne, `Engine.start` prenait la bande du rôle
    # joueur ([19, 31]) et la barre d'état annonçait « 23 ans » sous une
    # pochette qui en promet 31 — et la porte `age >= 32 || flag('genou')` du
    # rôle ne tenait que par le drapeau. Mesuré à l'aperçu (capture
    # `40_p3_carte.png` de l'étape 8).
    age: 31
    flags: [genou]
    # `president` nomme le président (`{president}` dans les manchettes et les
    # épitaphes) ; `patron` nomme celui qui te tient (l'Objectif et le Bilan du
    # contrat). Chez un joueur en fin de contrat, ce n'est pas le même homme :
    # le président est Vaubourg, le contrat se discute avec l'agent.
    president: aulard
    patron: fardelli
    camille: true
    # Casting de la bible ch. 10 § 4 : l'agent vend, le Doc compte les croix,
    # le capitaine a le même genou, l'adjoint garde un banc. Le président est
    # Vaubourg (`aulard`), le fonds est Ilyas (`nassir`).
    #
    # `target` a deux lectures : c'est le rythme d'apparition visé (moteur,
    # `faceFactor` : `expected = 17 / target` cartes entre deux apparitions) ET
    # le plancher de récurrence de la PREMIÈRE saison asserté par le budget
    # § 5.2 (`≥ 1` dans 80 % des S0 à partir de 1 ; `≥ 2` dans 90 % à partir de
    # 2 ; sous 1, le visage est compté mais pas exigé en S0 — même convention
    # que le cast de « La pépite »).
    # La S0 de ce postulat n'a que quatre créneaux garantis : l'ancre du slot 1
    # (Fardelli), l'offre d'hiver (Vaubourg / Ilyas / Camille / Josiane), la
    # quinzième (le Doc) et juin (Vaubourg / Josiane / Fardelli). Les autres
    # visages ne peuvent y arriver que par une intrigue tirée ou par le sac, et
    # 17 créneaux ne portent en moyenne que 10 visages distincts : exiger 80 %
    # de présence en S0 pour quatorze visages est arithmétiquement hors
    # d'atteinte. Les visages sans créneau garanti passent donc sous 1, avec le
    # relevé qui le motive (S0 / S1 / S2+, 1 500 carrières human_like) :
    #   brehaut 73 / 52 / 44 · vecchio 71 / 81 / 94 · vukic 66 / 93 / 89
    #   lea 80 / 56 / 58 · gege 13 / 51 / 67 · mbako 14 / 32 / 14
    # Gégé et Mbako n'ont pas d'intrigue de bucket "0" qui les porte (la tribune
    # et la relève entrent en S1 avec le derby, l'alarme « papy » et co.mbako_rival) ;
    # Vecchio et Vukić sont des visages de carrière, pas de première saison.
    # Fardelli et le Doc gardent leur cible haute : ils tiennent deux créneaux
    # garantis chacun (mesuré ≥ 2 dans 93 % et 100 % des S0).
    cast:
      fardelli: { fonction: patron,       target: 2.5 }
      sabatier: { fonction: horloge,      target: 2 }
      brehaut:  { fonction: coeur,        target: 0.9 }
      vecchio:  { fonction: coeur,        target: 0.9 }
      vukic:    { fonction: messager,     target: 0.9 }
      camille:  { fonction: maison,       target: 1 }
      josiane:  { fonction: choeur,       target: 1 }
      lea:      { fonction: chroniqueur,  target: 0.9 }
      meneche:  { fonction: chroniqueur,  target: 1 }
      gege:     { fonction: tribune,      target: 0.9 }
      mbako:    { fonction: releve,       target: 0.9 }
      aulard:   { fonction: direction,    target: 1 }
      nassir:   { fonction: tentateur,    target: 0.5 }
      legruet:  { fonction: instances,    target: 0.5 }
    pitch: "Ton genou a un avis, ton agent en a un autre. Le maintien, et le sas vers le banc."
    chantier: false                   # relu à l'intégration : les budgets de réservoir sont bloquants
    opening_arc: jp.fin.dernier_contrat
    # Le prologue amène jusqu'à la portière ; l'ancre F1 du script
    # (`jp.fin.f1_derniere_annee`, le restaurant) l'ouvre juste après.
    prologue: jp.fin.prologue
    questions:                        # fil rouge tiré à l'ouverture de saison
      - { id: genou,     poids: 1.0 }
      - { id: agent,     poids: 1.0 }
      - { id: vestiaire, poids: 1.0 }
    programme:                        # le réservoir (bible ch. 10 § 4, « Programme »)
      "0":
        prendre: 3
        # [2,9] → [1,12] : le slot de première ouverture est le minimum de trois
        # tirages ; sur huit valeurs son écart-type tombait à 1,34 (budget § 5.1 :
        # ≥ 1,8) et 2 % des S0 ouvraient deux intrigues à moins de trois créneaux.
        # [2,11] ne le remonte qu'à 1,50 : c'est la borne basse qui compte, et
        # douze valeurs à partir de 1 (comme le promu et la pépite) rendent au
        # minimum de trois tirages la dispersion que le budget demande (1,84).
        fenetre: [1, 12]
        reserve: 1
        pool:
          - { arc: jp.vestiaire_porte,   poids: 0.35, signature: true, if: "gauges.vestiaire >= 50" }
          - { arc: jp.derniere_selection, poids: 1.1, if: "flag('international') || gauges.tribunes >= 45" }
          - { arc: jp.maison_pays,       poids: 0.8 }
          - { arc: jp.memoires,          poids: 1.0 }
          - { arc: jp.contrat_image,     poids: 0.9 }
          - { arc: jp.banc_hiver,        poids: 0.9 }    # « le banc, à trente et un ans » (arc partagé)
          - { arc: jp.conseils_gigi,     poids: 0.8 }
          - { arc: co.mbako_rival,       poids: 0.8 }
      "1":
        # 2 → 4 (`k = prendre - carry`). Avec deux tirages, la S1 manquait de
        # matière : la cadence forcée y montait à 0,72 ouverture-forcée par
        # saison (budget ≤ 0,5) et sept intrigues du bucket devaient plus de
        # 15 % de leurs ouvertures au metteur en scène (le derby 18 %, la
        # pharmacie 19 %, le consultant 18 %, l'exil 19 %, le genou 21 %, le
        # jubilé 16 %, le pari 16 %). À quatre, la cadence forcée retombe à 0,39.
        prendre: 4
        fenetre: [2, 12]              # fenêtre large : les ouvertures s'étalent
        reserve: 0
        reprise: true                 # les entrées de "0" non tirées restent candidates
        # `reserve: 0` en S1. La réserve est servie « premier id encore
        # éligible, sans aléa » (spec §1.2) : en S1, où la cadence forcée est
        # la plus fréquente, la tête de pool ramassait tous les forçages —
        # 16 % pour « Le genou qui parle », 21 % pour la pharmacie quand on
        # les échangeait, contre un seuil de 15 %. Sans réserve, `forceStory`
        # retombe sur le tirage pondéré du réservoir et le forçage se répartit.
        # Les buckets "0" et "2+" gardent leur réserve : la cadence y force moins.
        pool:
          - { arc: co.pharmacie,         poids: 1.1 }
          # 1,2 → 1,9 : l'objectif caché « Debout » se joue au jubilé, et
          # l'intrigue ne s'ouvrait que dans 16 % des carrières — dont deux
          # tiers reportaient. Sous ce taux, l'objectif restait sous son
          # plancher de 5 % quelle que soit sa condition.
          - { arc: jp.jubile,            poids: 1.9, if: "gauges.tribunes >= 50" }
          - { arc: jp.genou_parle,       poids: 1.4 }
          - { arc: jp.consultant,        poids: 1.1 }
          - { arc: co.derby,             poids: 1.3 }
          - { arc: jp.pari,              poids: 1.2, if: "gauges.caisse < 55" }
          - { arc: jp.exil_dore,         poids: 1.3 }   # 0,9 → 1,3 : 16 % de ses ouvertures venaient du forçage (plafond 15 %)
          - { arc: jp.vestiaire_porte,   poids: 0.9, if: "gauges.vestiaire >= 55" }
      "2+":
        # 5 → 4. Le passage à 5 visait l'écart de cadence des saisons tardives
        # (« max 6 pour un budget de 4 ») : mesuré à 2 000 et 5 000 carrières, il
        # ne l'a pas obtenu — l'écart maximal reste 6, sur une saison de 3 377 —
        # et il a coûté le backlog d'échéances de la S2+ (P99 = 3 pour un seuil
        # de 2, empilements `passe+passe+passe` ×31). Quatre prises rendent le
        # backlog à 2 sans rien changer à l'écart ; la couverture des deux
        # intrigues qui tombaient au plancher (le diplôme et le rituel de Gigi)
        # est rendue par leur poids, ci-dessous.
        prendre: 4
        fenetre: [1, 11]
        reserve: 2
        reprise: true
        pool:
          - { arc: jp.adieu,             poids: 2.4, if: "age >= 32 || stats.saisons >= 2" }
          # 2,0 → 2,6 et 2,8 → 3,4 : avec quatre prises au lieu de cinq, le
          # rituel de Gigi et le diplôme retombaient à 10 % de couverture, le
          # plancher exact du budget § 5.1. Le poids leur rend leurs 12 %.
          - { arc: jp.vecchio_exemple,   poids: 2.6 }    # rituel (replay: ritual)
          - { arc: jp.jubile,            poids: 2.4, if: "gauges.tribunes >= 50" }
          - { arc: jp.brassard_20,       poids: 1.5, if: "age >= 29 || stats.saisons >= 2" }
          # 1,8 → 2,8 : le diplôme ne s'ouvrait que dans 10 % des carrières, à la
          # limite du plancher, et son échantillon d'issues n'était pas mesurable.
          - { arc: jp.diplome_joueur,    poids: 3.4, if: "age >= 32 || flag('genou') || flag('banc_regarde')" }
          - { arc: co.derby,             poids: 0.9 }    # replay after 1
          - { arc: jp.consultant,        poids: 0.9 }
          - { arc: jp.pari,              poids: 0.8 }
          - { arc: jp.genou_parle,       poids: 0.8 }
          - { arc: jp.conseils_gigi,     poids: 0.7 }    # rituel
    objectifs:                        # 3 objectifs cachés (bible ch. 10 § 4)
      # Budget § 5.3 : 30-60 % des carrières atteignent ≥ 1 objectif, et chaque
      # objectif ∈ [5 %, 60 %]. Les trois conditions transcrites de la bible
      # donnaient 80 % / 64 % / 50 % / 1 % : « rejouer une saison entière » était
      # la définition d'une carrière normale (deux saisons sans genou grave),
      # « le passeur » demandait un seul palier avec l'adjoint, et « debout »
      # exigeait la conjonction d'un jubilé JOUÉ (5 % des carrières) et du seul
      # drapeau `prolonge` (26 %).
      # — saison entière : quatre saisons de joueur, sans genou grave ET sans
      #   avoir reculé d'un cran (reculer, c'est justement ne plus la jouer
      #   entière). Mesuré 22 % (contre 64 % pour « deux saisons sans genou ») ;
      - { id: fin_saison_entiere, titre: "Rejouer une saison entière", when: "stats.saisons >= 4 && !flag('genou_grave') && !flag('recule_poste')", indice: "Le genou a toujours raison. Sauf si tu l'écoutes à temps." }
      # — le passeur : deux paliers avec Vukić, pas un, et la page lue ou le
      #   train du lundi — les notes partagées se ramassaient trop souvent en
      #   passant. Mesuré 32 % (contre 50 %) ;
      - { id: fin_passeur,        titre: "Le passeur",                 when: "relation.vukic >= 2 && (flag('page_lue_vukic') || flag('suit_vukic'))", indice: "Quelqu'un tient un cahier depuis ton premier jour. Demande à le lire." }
      # — debout : le jubilé joué OU seulement daté (l'affiche a une date en mars
      #   et on joue en avril : c'est l'image de la bible), et la carrière qui
      #   continue — soit une prolongation sous n'importe laquelle de ses trois
      #   formes, soit la dernière saison jamais annoncée (`dernier_annonce` est
      #   posé par les sorties qui referment la carrière). Mesuré 6 % (contre
      #   1 %), avec le poids de jp.jubile relevé dans les buckets "1" et "2+".
      #   Union des trois : 51 % des carrières, chacun ∈ [5 %, 60 %].
      - { id: fin_debout,         titre: "Debout",                     when: "(flag('jubile_fait') || flag('jubile_prevu')) && (!flag('dernier_annonce') || flag('prolonge') || flag('prolonge_rabais') || flag('prolonge_vestiaire'))", indice: "Un jubilé, c'est une fin. Sauf si tu rejoues le lendemain." }
    alarm_overrides:                  # candidats prioritaires (avant alarms.yaml)
      tribunes.low:
        - { card: jp.fin.alarme_gege_papy }
      caisse.low:
        - { card: jp.fin.alarme_fardelli_aucune_offre }
      # La porte de la fin `jp_mouton` (« On ne t'a plus jamais fait de passe.
      # Même au toro. »), qu'aucune carrière de ce postulat n'atteignait sur
      # 5 000 : le capitaine compte les passes, le refus coûte deux crans de
      # vestiaire, et la marche suivante — servie quand on a déjà choisi de
      # jouer seul OU que le vestiaire est descendu sous 22 — en coûte trois.
      vestiaire.low:
        - { card: jp.fin.alarme_brehaut_toro_seul, when: "flag('joue_seul') || gauges.vestiaire <= 22" }
        - { card: jp.fin.alarme_brehaut_plus_de_passe }

