# FUSIBLE — le texte des beats moteur (spec variété §1.12, §2.7)
#
# Les dix beats ci-dessous gardent leur **mécanique** en Dart (effets, match,
# verdict, transitions, Rng) et prennent leur **texte** ici. C'est ce qui
# empêche « la moitié des écrans d'une S2+ est la même qu'en S0 » : Vaubourg ne
# dit plus « cette saison, l'objectif c'est le maintien » de la même façon
# après une descente, un titre, ou quand Vukić dîne avec lui.
#
# ── Comment ça marche ────────────────────────────────────────────────────────
# Chaque beat porte une **liste ordonnée** de variantes. Le moteur sert la
# **première dont `roles` et `when` sont vrais** ; la **dernière**, sans `when`
# ni `roles`, est le **secours** (elle reprend le texte historique en dur) et
# elle est **obligatoire** dès qu'un beat est présent ici. Une variante placée
# après le secours est une erreur de build : elle ne serait jamais servie.
# **Coût Rng : zéro.** Le choix est un parcours de liste, jamais un tirage : la
# même graine et les mêmes swipes donnent le même texte.
#
# ── Une variante ─────────────────────────────────────────────────────────────
#   - roles: [entraineur]      # vide/absent = tous les rôles
#     when: "season >= 1 && flag('descente')"
#     speaker: aulard          # optionnel : le portrait et le `{toi}` de la carte
#     text: "…"                # ≤ 240 caractères, le ton de la bible
#     left: "…"                # optionnel : le libellé de gauche
#     right: "…"               # optionnel : celui de droite (beats à deux boutons)
#     answer_left: "…"         # optionnel : la conséquence (objective, aftermatch, bilan_contrat)
#     answer_right: "…"
#     transition: entraineur   # bilan_carrefour seulement (voir plus bas)
#
# `when` parle le langage des cartes : `flag('x')`, `relation.gege >= 1`,
# `season >= 2`, `plays('en.kop')`, `arc_outcome('en.prodige') == 'vendu'`,
# `chars.vecchio.age >= 44`, `chars.mbako.statut == 'vendu'`, `fil_rouge ==
# 'argent'`, `phase('retour')`, `vars.gm_won == 1`, `stats.titres >= 1`,
# `journal_has('descente')`, `objectif('deux_maintiens')`.
# `bilan.tenu` / `bilan.rang` / `bilan.outcome` ne valent qu'au beat
# `bilan_verdict` (le verdict y est calculé sans être appliqué) : ailleurs,
# c'est une erreur de build. Après le Verdict, on lit `flag('bilan_tenu')`.
#
# ── Les placeholders fournis par chaque beat ─────────────────────────────────
#   partout          {prenom} {nom} {NOM} {toi} {club} {ville} {rival} {annee}
#                    {saison} {age} {age_<id>} {division} {objectif} {rang}
#   objective        {patron} (le nom du patron du rôle) · {objectif_min}
#   classement       {rang} · {pts} · {journee} (la journée du championnat)
#   match            {adversite} (★★★☆☆) · {vestiaire_mot}
#   cup              {tour}
#   gm_te            {minute} · {score}
#   aftermatch       {gm_score} · {score}
#   bilan_verdict    {rang} · {objectif} · {tenu} · {TENU}
#   bilan_contrat    {patron} · {objectif}
# Un placeholder inconnu est une erreur de lint : le joueur ne doit jamais lire
# une accolade.
#
# ── Le budget d'écriture (spec variété §5) ───────────────────────────────────
# ≈ 60 lignes de variantes par rôle : trois à cinq variantes par beat, lues sur
# le fil rouge, les traces, les issues, les âges et les statuts. Le rapport de
# `simulate --narrative` affiche la **part des set-pieces servis en variante
# non-secours** : sous 50 %, la saison 2 ressemble encore trop à la saison 0.
#
# ── Le beat `classement` (nouveau) ───────────────────────────────────────────
# Servi deux fois par saison : à la fin du bloc aller, et au Bilan AVANT la Une
# (`content/calendar.yaml`). Une carte, **un seul bouton** : `left` suffit,
# `right` est ignoré. Le TABLEAU (six lignes autour de ta position, avec rang,
# club, points et différence de buts) est dessiné par l'interface depuis le
# `payload` — le texte de la variante est la phrase au-dessus du tableau, pas
# le tableau. `when` peut lire `phase('bilan')` pour distinguer le classement
# final de celui de la trêve, et `{rang}`/`{pts}`/`{journee}` disent où tu en es.
# Secours en dur si aucune variante n'est écrite : « CLASSEMENT · {journee}e
# journée. {club} est {rang}e avec {pts} points. »
#
# ── Le beat `prologue` (nouveau) n'est PAS ici ───────────────────────────────
# Le prologue de la saison 0 (quatre à six scènes avant la carte Objectif) est
# écrit comme une intrigue, pas comme un set-piece : un arc `kind: prologue`
# dans `content/arcs/`, désigné par `prologue:` dans `postulats.yaml`, dont les
# étapes sortent dans l'ordre du fichier. Il porte donc de vrais locuteurs, de
# vraies sorties et de vraies conséquences — ce qu'un set-piece ne sait pas
# faire. Ses cartes sont hors créneau, sans tirage : `rand`, `react`,
# `schedule`, `next`, `end`, `role` et `club` y sont refusés par le build, et
# une jauge n'y bouge que d'un cran moyen au plus.
#
# ── Ce que ce fichier ne fait pas ────────────────────────────────────────────
# Il ne change aucun effet, aucun libellé de jauge, aucune mécanique. `match` et
# `gm_te` restent un état de match : leur texte se commente, il ne se raconte
# pas. Les libellés de posture de `match` (« Offensif » / « Prudent ») viennent
# de roles.yaml : n'y touche que si la variante vise un rôle précis.

# ── Le texte des beats, transcrit de la bible ch. 30 § 1 ─────────────────────
# Deux rôles seulement existent aujourd'hui (content/roles.yaml) : la bible
# écrit huit rôles, on importe « Entraîneur » → `entraineur` et « Joueur pro »
# → `joueur`. Les six autres familles (amateur, DS, présidents, sélectionneur,
# instance) attendent leurs rôles.
# Ordre de lecture : les variantes de l'entraîneur, puis celles du joueur, puis
# le secours commun (sans `when` ni `roles`) qui reprend le texte historique.
setpieces:
  # ══ objective — l'objectif de saison (bible § 1.1) ═════════════════════════
  # Créneau 1, deux sorties ; s'engager pose la Parole au Bilan.
  objective:
    # ---- Entraîneur (patron : le président)
    - roles: [entraineur]
      when: "season >= 1 && flag('descente')"
      speaker: aulard
      text: "« On est descendus, {toi}. Cette saison l'objectif c'est {objectif_min}, et tu paies le chauffage. Tu t'engages ? »"
      left: "Je m'engage"
      right: "Je ne promets rien"
      answer_left: "Promesse publique : {objectif}. Il note la date en marge."
      answer_right: "Il repose le stylo sans le ranger."
    - roles: [entraineur]
      when: "flag('vukic_dauphin')"
      speaker: aulard
      text: "« Cette saison, {toi}, l'objectif c'est {objectif_min}. Zoran est d'accord ; il l'était avant toi. »"
      left: "Je m'engage"
      right: "Je ne promets rien"
      answer_left: "Il regarde le couloir en signant. Zoran y est encore."
      answer_right: "« Lui, il aurait dit oui. » Il le dit sans lever les yeux."
    - roles: [entraineur]
      when: "fil_rouge == 'argent'"
      speaker: aulard
      text: "Vaubourg couvre le combiné de la main : « L'objectif, c'est {objectif_min}, et un sponsor sur mon maillot avant septembre. Le contrat est sous ta tasse. Tu signes en bas, {toi} ? »"
      left: "Je signe en bas"
      right: "Le maillot ne se vend pas"
      answer_left: "Il plie la page avant que tu la relises."
      answer_right: "Il range le contrat. Il garde le nom du sponsor."
    - roles: [entraineur]
      when: "flag('pacte_gege')"
      speaker: aulard
      text: "« La tribune a écrit ton objectif à la craie avant moi, {toi}. Le mien est en dur : {objectif_min}. »"
      left: "Je m'engage"
      right: "Je ne promets rien"
      answer_left: "Deux objectifs, une craie et un contrat. Ils ne disent pas pareil."
      answer_right: "« Alors c'est la craie qui décide. » Il sourit mal."
    - roles: [entraineur]
      when: "flag('naming_signe')"
      speaker: nassir
      text: "Ilyas fait glisser une chemise orange sur la table : « Deux lignes cette saison, {toi} : {objectif_min}, et deux jeunes valorisés d'ici juin. Vous validez ? »"
      left: "Je valide le tableau"
      right: "Je ne vends pas de jeunes"
      answer_left: "La ligne devient verte devant toi. C'est tout ce qui change."
      answer_right: "Il note ton refus dans une case prévue pour."
    - roles: [entraineur]
      when: "stats.titres >= 1"
      speaker: aulard
      text: "« L'objectif, {toi}, c'est de recommencer. Personne ne m'a jamais dit que c'était plus facile. »"
      left: "Je recommence"
      right: "On ne recommence pas"
      answer_left: "Il fait encadrer la photo de l'an dernier. En grand."
      answer_right: "Il enlève la photo du couloir le lendemain."
    - roles: [entraineur]
      when: "relation.aulard <= -2"
      speaker: aulard
      text: "Vaubourg reste debout, le manteau sur le bras : « L'objectif est page quatre de votre contrat, {toi}. Vous savez lire. Moi, j'ai la banque à dix heures. »"
      left: "Je lis la page quatre"
      right: "Je m'engage quand même"
      answer_left: "Page quatre, quatre lignes, et une clause de sortie."
      answer_right: "Tu t'engages sur un texte que tu n'as pas lu."
    # La variante que la bible ch. 30 § 1.1 réclame pour `hotel_du_club` : le
    # café de Josiane à l'hôtel du club (posé par co.cartons_camille).
    - roles: [entraineur]
      when: "flag('hotel_du_club')"
      speaker: aulard
      text: "« Josiane me dit que vous prenez le café à l'hôtel du club, {toi}. Quelqu'un qui dort au stade doit bien viser {objectif_min}. Vous vous engagez ? »"
      left: "Je m'engage"
      right: "Je ne promets rien"
      answer_left: "Promesse publique : {objectif}. Josiane sert le café le lendemain sans rien dire."
      answer_right: "Il regarde la clé de la chambre 12 sur le bureau. Il ne la rend pas."
    # Le secours de l'entraîneur porte l'adresse du président : c'est la carte
    # servie à chaque présaison, et la spec § 1.8 la donne en premier exemple du
    # nom prononcé (« {Toi}, cette saison l'objectif c'est le maintien »).
    - roles: [entraineur]
      speaker: aulard
      text: "Vaubourg signe un autre papier en te parlant : « {Toi}, cette saison, l'objectif c'est {objectif_min}. Je l'ai déjà annoncé à la banque. Tu t'engages ? »"
      left: "Je m'engage"
      right: "Je ne promets rien"
      answer_left: "Promesse publique : {objectif}. Il la répète au téléphone avant que tu aies passé la porte."
      answer_right: "Tu gardes les mains libres. Il note la date au dos d'une enveloppe."
    # ---- Joueur pro (patron : l'agent)
    - roles: [joueur]
      when: "season == 0 && fil_rouge == 'prix'"
      speaker: fardelli
      text: "Fardelli fait tourner sa gourmette autour du poignet : « Cette année, {toi}, on construit ton prix. Vingt matchs titulaire, et un ami à moi vient voir en juin. Tu me donnes ta parole ? »"
      left: "Vingt, je m'y engage"
      right: "Je ne compte pas les matchs"
      answer_left: "Il écrit vingt dans son carnet, et souligne deux fois."
      answer_right: "Il écrit vingt quand même, au crayon, pour pouvoir effacer."
    - roles: [joueur]
      when: "flag('genou')"
      speaker: sabatier
      text: "Le Doc remonte ses lunettes sur son front et palpe le genou, longtemps : « Trente matchs cette saison sans une piqûre, {toi}. Tu me le promets à moi, pas au coach. »"
      left: "Trente sans piqûre"
      right: "Je jouerai ce qu'il faut"
      answer_left: "Il range l'aiguille dans le tiroir du haut. Il ne le ferme pas."
      answer_right: "Il note la date. Il note toujours les dates."
    - roles: [joueur]
      when: "flag('capitaine')"
      speaker: brehaut
      text: "Bréhaut tient le brassard jaune entre deux doigts : « Le groupe a voté {objectif_min}, {toi}. Il me l'a dit à moi, pas au président. Tu le portes avec le brassard ? »"
      left: "Je porte les deux"
      right: "Le brassard, pas l'objectif"
      answer_left: "Il te tend le brassard sans le lâcher tout de suite."
      answer_right: "Il garde le brassard une semaine de plus, pour voir."
    - roles: [joueur]
      when: "flag('international')"
      speaker: legruet
      text: "Berthomier, au téléphone, tourne des pages : « La liste des vingt-six se fait en mars, {toi}, en commission. D'ici là, combien de matchs comptez-vous jouer ? »"
      left: "Je les jouerai tous"
      right: "Je ne promets aucun chiffre"
      answer_left: "Il note un chiffre. En mars, il le relira."
      answer_right: "« La commission comptera pour vous. » Il raccroche."
    - roles: [joueur]
      when: "relation.fardelli <= -2"
      speaker: fardelli
      text: "Fardelli garde son manteau : « {Toi}, l'objectif, c'est qu'un club te veuille en juin. Pour ça, il me faut ta signature avant l'été, et ma commission avant ta prime. »"
      left: "Je signe avant l'été"
      right: "Je trouverai sans vous"
      answer_left: "Il rouvre le carnet à la bonne page. Elle était prête."
      answer_right: "Il referme le carnet. Il ne le range pas."
    - roles: [joueur]
      when: "season >= 2 && age >= 30"
      speaker: vecchio
      text: "Gigi lace ses gants jaunes sans les regarder : « Passé trente ans, l'objectif, c'est mai, debout, sur tes deux jambes. Moi, à ton âge, j'ai visé plus haut. Mon épaule s'en souvient. »"
      left: "Je finis debout, en mai"
      right: "Je vise plus haut"
      answer_left: "Il hoche la tête et retourne à ses gants."
      answer_right: "« D'accord. » Il le dit comme on range un dossier."
    - roles: [joueur]
      when: "flag('exil_dore')"
      speaker: nassir
      text: "Dans le bureau climatisé, Ilyas pose le doigt sur une colonne : « Ici, {toi}, vous êtes la ligne qui vend les maillots. Trente matchs, et votre visage sur l'affiche. Vous signez ? »"
      left: "Je signe le tableau"
      right: "Je ne suis pas une ligne"
      answer_left: "La ligne change de couleur. Toi, non."
      answer_right: "Il laisse la case vide. Il la garde ouverte."
    - roles: [joueur]
      speaker: fardelli
      text: "Fardelli pose son carnet sur la table, ouvert à ta page : « Ton club vise {objectif_min}, {toi}. Je l'ai promis pour toi à deux amis. Tu t'engages, ou je leur parle de quelqu'un d'autre ? »"
      left: "Je m'engage"
      right: "Je ne promets rien"
      answer_left: "Promesse publique : {objectif}. Il recopie la date dans le carnet, à l'encre."
      answer_right: "Tu gardes les mains libres. Lui aussi : il tourne la page devant toi."
    # ---- Secours commun
    - text: "{patron} : « Cette saison, l'objectif c'est {objectif_min}. Tu t'engages ? »"
      left: "Je m'engage"
      right: "Je ne promets rien"
      answer_left: "Promesse publique : {objectif}."
      answer_right: "Tu gardes les mains libres."

  # ══ classement — le tableau, deux fois par saison (retour joueur) ══════════
  # « parfois on parle de classement mais cela n'est indiqué nulle part » : le
  # beat sort à la fin du bloc aller et au Bilan, avant la Une. UN bouton
  # (`left` suffit) ; le TABLEAU est dessiné par l'interface depuis le payload.
  # La variante est la phrase AU-DESSUS du tableau : elle ne récite jamais les
  # chiffres — la colonne les dit mieux — elle dit ce qu'un visage en fait.
  # `world.rang` vaut 1 (tête), 4 (haut de tableau), 5-17 (le ventre), 18 (le
  # fond) : ce sont les seules valeurs que le moteur projette en cours de
  # saison, d'où les bornes ci-dessous. `phase('bilan')` distingue le tableau
  # de juin de celui de la trêve.
  classement:
    # ---- Juin, le tableau qui reste (phase bilan)
    - roles: [entraineur]
      when: "phase('bilan') && world.division >= 2 && world.rang == 1"
      speaker: gege
      text: "Gégé a punaisé la feuille à l'envers, pour la lire d'en bas : « J'ai commencé par la fin, par habitude. Cette année, la fin ne nous regarde pas. »"
      left: "Lire dans l'autre sens"
    - roles: [entraineur]
      when: "phase('bilan') && world.rang == 1"
      speaker: josiane
      text: "Josiane pose le tableau sur le bureau sans le lâcher : « Je range les feuilles de juin depuis 1987, par rang. Celle-là, je la photocopie avant qu'on la salisse. »"
      left: "La laisser photocopier"
    - roles: [entraineur]
      when: "phase('bilan') && world.rang >= 18"
      speaker: aulard
      text: "Vaubourg tient la feuille à bout de bras, la dernière ligne tournée vers toi : « Mon club, en bas de la page. Je suis descendu au vestiaire pour te le montrer moi-même. »"
      left: "Soutenir son regard"
    - roles: [entraineur]
      when: "phase('bilan') && world.rang >= 15"
      speaker: brehaut
      text: "Bréhaut plie la feuille en quatre avant de la rendre : « Deux lignes plus haut, le groupe touchait sa prime. Il le sait depuis février, et il a compté. »"
      left: "Reprendre la feuille"
    - roles: [entraineur]
      when: "phase('bilan') && objective == 'maintien' && world.rang <= 4"
      speaker: aulard
      text: "Vaubourg relit le haut du tableau, puis le contrat, puis le haut du tableau : « On avait dit autre chose en août. Je n'ai jamais aimé avoir tort si haut. »"
      left: "Le laisser relire"
    - roles: [joueur]
      when: "phase('bilan') && world.rang <= 4"
      speaker: fardelli
      text: "Fardelli a fait imprimer la feuille sur du papier épais : « Celle-là, je l'envoie à trois amis avant le dîner. Ils sauront lire ton nom sans que je l'entoure. »"
      left: "Lui laisser la page"
    - roles: [joueur]
      when: "phase('bilan') && world.rang >= 15"
      speaker: vecchio
      text: "Vecchio regarde le tableau sans s'asseoir, les gants sous le bras : « Celui-là s'est écrit un mardi de novembre, sous la pluie. Juin n'a fait que recopier. »"
      left: "Rester debout aussi"
    - when: "phase('bilan')"
      speaker: meneche
      text: "Massenet glisse la feuille dans son carnet à spirale sans la lire : « Je la garde pour août. Vous la relirez avec moi, en conférence, ligne par ligne. »"
      left: "Le laisser faire"
    # ---- La trêve, au bout du bloc aller
    - roles: [entraineur]
      when: "world.rang == 1 && objective == 'maintien'"
      speaker: aulard
      text: "Vaubourg tapote la première ligne avec deux doigts : « Premier, avec un objectif de maintien. J'ai déjà appelé la banque pour leur annoncer autre chose. »"
      left: "Ne rien changer"
    - roles: [entraineur]
      when: "world.rang == 1"
      speaker: gege
      text: "Gégé a recompté les points avant toi, deux fois, au stylo bille : « Le virage a déjà versé l'acompte du car pour la dernière journée. Ne nous fais pas perdre les arrhes. »"
      left: "Garder la tête froide"
    - roles: [entraineur]
      when: "world.rang >= 18"
      speaker: josiane
      text: "Josiane a affiché la feuille au vestiaire sans qu'on lui demande : « À hauteur des yeux. La dernière fois qu'on l'a cachée derrière la porte, on est descendus quand même. »"
      left: "La laisser affichée"
    - roles: [entraineur]
      when: "world.rang >= 15"
      speaker: vukic
      text: "Vukić a entouré trois lignes au crayon, et pas la tienne : « Ces trois-là, on les reçoit en mars. Si on ne les double pas là, ce sont eux qui nous doublent. »"
      left: "Regarder les trois"
    - roles: [entraineur]
      when: "world.rang <= 4"
      speaker: meneche
      text: "Massenet arrive avec la feuille déjà pliée à la bonne ligne : « Ma chronique de lundi tient sur le mot que vous me donnez, {toi} : le titre, ou la Continentale. Sinon, je choisis. »"
      left: "Ne pas répondre"
    - roles: [entraineur]
      speaker: aulard
      text: "Vaubourg regarde le tableau, pas les matchs : « Le milieu, c'est l'endroit où ni la banque ni la mairie ne m'appellent. Continue comme ça. »"
      left: "Continuer comme ça"
    - roles: [joueur]
      when: "world.rang == 1"
      speaker: brehaut
      text: "Bréhaut a scotché la feuille au-dessus du banc, à l'envers : « Le groupe la remet à l'endroit en mai, pas avant. Celui qui la retourne paie la tournée. »"
      left: "Ne pas y toucher"
    - roles: [joueur]
      when: "world.rang >= 15"
      speaker: sabatier
      text: "Le Doc a posé la feuille sur la table de soins, entre deux bandes : « Quand on est en bas, j'ai deux fois plus de dos le lundi. Les dos lisent le classement. »"
      left: "Se rasseoir"
    - roles: [joueur]
      when: "world.rang <= 4"
      speaker: vecchio
      text: "Vecchio montre la colonne de droite avec le dos du gant : « La différence de buts. En 1979, on était premiers à Noël avec une colonne comme ça. On a fini septièmes. »"
      left: "Regarder la colonne"
    - roles: [joueur]
      speaker: gege
      text: "Gégé a recompté au dos d'un ticket de caisse, à la buvette : « Le virage a fait le calcul, {toi}. Ton nom est dans les deux colonnes : les points pris, et ceux qu'on a laissés. »"
      left: "Reprendre le ticket"
    # ---- Secours commun
    - text: "La feuille du championnat est punaisée dans le couloir, à hauteur des yeux. Personne ne passe devant sans ralentir."
      left: "Regarder le tableau"

  # ══ match — le bloc de six journées ════════════════════════════════════════
  # La bible ne commente pas ce beat : il reste un état de match.
  match:
    - roles: [entraineur]
      when: "flag('salaires_retard')"
      text: "Bloc de six journées. Adversité : {adversite} · {vestiaire_mot}. La paie du cinq n'est pas tombée, et six journées, c'est six semaines."
    - roles: [entraineur]
      when: "flag('onze_du_virage') || flag('otage_kop')"
      text: "Bloc de six journées. Adversité : {adversite} · {vestiaire_mot}. Le local a affiché son onze mardi ; il te reste six matchs pour le contredire."
    - roles: [entraineur]
      when: "world.serie_defaites >= 2"
      text: "Bloc de six journées. Adversité : {adversite} · {vestiaire_mot}. On ne parle plus de jeu au club, on parle de série."
    - roles: [entraineur]
      when: "season >= 1"
      text: "Bloc de six journées. Adversité : {adversite} · {vestiaire_mot}. Le président a écrit le mot « bloc » sur son sous-main. Il compte."
    - roles: [entraineur]
      text: "Bloc de six journées. Adversité : {adversite} · {vestiaire_mot}. Six matchs pour savoir ce que vaut ce groupe-là."
    - roles: [joueur]
      when: "flag('genou')"
      text: "Bloc de six journées. Adversité : {adversite} · {vestiaire_mot}. Six matchs en dix-neuf jours, et un genou qui compte les jours."
    - roles: [joueur]
      when: "flag('capitaine')"
      text: "Bloc de six journées. Adversité : {adversite} · {vestiaire_mot}. Le brassard se voit surtout sur les blocs comme celui-là."
    - roles: [joueur]
      when: "world.serie_victoires >= 2"
      text: "Bloc de six journées. Adversité : {adversite} · {vestiaire_mot}. On te demande ton avis sur la série avant de te le demander sur toi."
    - roles: [joueur]
      when: "season >= 1"
      text: "Bloc de six journées. Adversité : {adversite} · {vestiaire_mot}. Six matchs, et quelqu'un dans une tribune qui note tes courses."
    - roles: [joueur]
      text: "Bloc de six journées. Adversité : {adversite} · {vestiaire_mot}. Six matchs pour se faire une place, ou la perdre."
    - text: "Bloc de six journées. Adversité : {adversite} · {vestiaire_mot}."

  # ══ cup — le tour de Coupe (bible § 1.5) ═══════════════════════════════════
  cup:
    # ---- Entraîneur
    - roles: [entraineur]
      when: "flag('vitamines') || flag('flacon_b')"
      text: "Tour de Coupe. Un contrôleur attend à l'accueil avec une mallette. Le tirage t'offre un adversaire surprise."
      left: "On y va"
    - roles: [entraineur]
      when: "flag('espion_retour')"
      text: "Tour de Coupe. L'adversaire a taillé sa haie. Il a laissé un mot dedans, à ton nom."
      left: "On y va"
    - roles: [entraineur]
      when: "flag('salaires_retard')"
      text: "Tour de Coupe. La prime de qualification tomberait avant la paie du cinq. Le vestiaire a fait le calcul avant toi."
      left: "On y va"
    - roles: [entraineur]
      when: "relation.aulard <= -1"
      text: "Tour de Coupe. Le président a dit à la radio que la Coupe n'est pas la priorité. Le vestiaire écoute la radio."
      left: "On y va quand même"
    - roles: [entraineur]
      when: "flag('mbako_lance')"
      text: "Tour de Coupe. Le gamin veut jouer ce match-là et l'a dit à sa mère. Sa mère l'a dit à un journaliste."
      left: "On y va"
    - roles: [entraineur]
      when: "flag('pacte_gege')"
      text: "Tour de Coupe. Le local a affrété deux cars pour un match à cinq heures de route. Personne ne leur a demandé."
      left: "On y va"
    - roles: [entraineur]
      when: "season >= 2 && stats.titres == 0"
      text: "Tour de Coupe. C'est la dernière chose que ce club peut encore gagner cette saison. Tout le monde le sait, personne ne le dit."
      left: "On y va"
    - roles: [entraineur]
      when: "world.division >= 2"
      text: "Tour de Coupe. Un car, cinq heures de route, un terrain gras et une main courante. Sur l'affiche du club adverse : « {CLUB} »."
      left: "On y va"
    - roles: [entraineur]
      # Le nom est SORTI de la Coupe (relecture des quatre postulats, budget
      # « nom » § 5.3 : « jamais deux cartes de nom direct de suite »). Le
      # créneau paraissait sûr — il suit un bloc de matchs — mais il est aussi
      # le seul écran nommé que le calendrier place JUSTE AVANT une carte
      # (`retour: … match, cup, card, …`) : les deux seules paires mesurées
      # étaient `cup → en.nassir.rachat`, où le fax de Josiane montre le nom
      # dans le logo. Un écran de beat ne peut pas savoir ce qui vient après,
      # et l'étape d'intrigue déjà armée ne peut pas se décaler : la garde ne
      # peut donc être posée QUE par l'écriture, en ne nommant pas sur ce
      # créneau-là. Le nom est repris au Bilan (`bilan_contrat`), qui est
      # entouré d'écrans de beat des deux côtés.
      # Le nom revient, mais par la VOIX : Madame Josiane nomme toujours le
      # coach (`adresse`, les trois expressions), donc `{toi}` fait de cet
      # écran une carte « nommée » au sens du § 5.3 sans en faire une carte de
      # nom DIRECT — et les paires `{toi}` sont hors budget, par construction
      # (« l'adresse d'un personnage est sa voix, pas le nom lâché par la
      # carte »). C'est ce qui rend le créneau sûr alors qu'il précède une
      # carte : on garde le nom à chaque Coupe, on perd la paire.
      speaker: josiane
      text: "Tour de Coupe. Madame Josiane apporte le tirage : « Un adversaire surprise, {toi}. J'ai réservé le car au crayon ; le vestiaire, lui, n'a pas envie d'y penser. »"
      left: "On y va"
    # ---- Joueur pro
    - roles: [joueur]
      when: "flag('vitamines') || flag('flacon_b')"
      text: "Tour de Coupe. Un contrôleur attend à l'accueil avec une mallette. Le tirage t'offre un adversaire surprise."
      left: "On y va"
    - roles: [joueur]
      when: "flag('genou')"
      text: "Tour de Coupe. Terrain gras, District, cinq degrés. Le staff te demande si tu veux vraiment jouer ça."
      left: "Je joue"
    - roles: [joueur]
      when: "world.division <= 1"
      text: "Tour de Coupe. Un stade municipal, huit cents personnes derrière une main courante, et ton maillot qui vaut leur budget."
      left: "On y va"
    - roles: [joueur]
      when: "flag('special')"
      text: "Tour de Coupe. Le président du petit club a fait afficher ta phrase sur la buvette. En grand."
      left: "On y va"
    - roles: [joueur]
      when: "flag('capitaine')"
      text: "Tour de Coupe. Le vestiaire a décidé que c'était un match de jeunes. Tu es sur la feuille quand même."
      left: "On y va"
    - roles: [joueur]
      when: "relation.fardelli >= 1"
      text: "Tour de Coupe. Ton agent trouve que c'est un match à risque pour rien. Il l'a dit à un journaliste avant de te le dire."
      left: "On y va"
    - roles: [joueur]
      when: "year >= 2016 && flag('monde_video')"
      text: "Tour de Coupe. Pas de vidéo à ce tour-là : l'arbitre est seul, et il le sait."
      left: "On y va"
    - roles: [joueur]
      when: "season >= 1"
      text: "Tour de Coupe. Un terrain gras, une main courante, et trois cents personnes qui connaissent ton nom mieux que ton club."
      left: "On y va"
    - roles: [joueur]
      text: "Tour de Coupe. Le tirage t'offre un adversaire surprise, et une pelouse qui n'a pas d'avis sur ton contrat."
      left: "On y va"
    # ---- Secours commun
    - text: "Tour de Coupe. Le tirage t'offre un adversaire surprise. On y va ?"
      left: "On joue le coup"

  # ══ gm_annonce — l'annonce du Grand Match (bible § 1.2) ════════════════════
  # Le texte ne dit jamais qui va gagner.
  gm_annonce:
    # ---- Entraîneur
    - roles: [entraineur]
      when: "arc('co.derby') == 'active'"
      text: "GRAND MATCH. Le derby de la vallée. Gégé a peint la ville, le président a invité la maire. Coup d'envoi."
      left: "Coup d'envoi"
    - roles: [entraineur]
      when: "flag('onze_du_virage')"
      text: "GRAND MATCH. Le onze est affiché au local depuis mardi. Il est le tien, à deux noms près."
      left: "Coup d'envoi"
    - roles: [entraineur]
      when: "flag('salaires_retard')"
      text: "GRAND MATCH. La paie du cinq n'est pas tombée. Le vestiaire a fait comme si, jusqu'à l'échauffement."
      left: "Coup d'envoi"
    - roles: [entraineur]
      when: "flag('mbako_lance')"
      text: "GRAND MATCH. Le gamin est titulaire, il a seize ans et il a demandé le ballon dans le couloir. Coup d'envoi."
      left: "Coup d'envoi"
    - roles: [entraineur]
      when: "relation.aulard <= -1"
      text: "GRAND MATCH. Le président est en loge avec deux invités que personne ne connaît. Ils regardent ton banc, pas le terrain."
      left: "Coup d'envoi"
    - roles: [entraineur]
      when: "year >= 2016 && flag('monde_video')"
      text: "GRAND MATCH. La vidéo est branchée, l'écran est au-dessus du kop. On verra tout, deux fois."
      left: "Coup d'envoi"
    - roles: [entraineur]
      when: "flag('derby_perdu')"
      text: "GRAND MATCH. Le derby de l'aller a laissé une trace de peinture sur le mur du local. Elle n'a pas été effacée."
      left: "Coup d'envoi"
    - roles: [entraineur]
      when: "flag('trois_valises')"
      text: "GRAND MATCH. L'adjoint est arrivé au stade avec le même sac que le jour des trois valises. Il n'a rien dit. Coup d'envoi."
      left: "Coup d'envoi"
    - roles: [entraineur]
      text: "GRAND MATCH. Le stade est plein, le banc est court, et tout se joue ici. Coup d'envoi."
      left: "Coup d'envoi"
    # ---- Joueur pro
    - roles: [joueur]
      when: "arc('co.derby') == 'active'"
      text: "GRAND MATCH. Le derby. Gégé a peint la ville, ta sœur habite du mauvais côté. Coup d'envoi."
      left: "Coup d'envoi"
    - roles: [joueur]
      when: "flag('genou')"
      text: "GRAND MATCH. Le genou a parlé toute la semaine. Le kiné a dit « respire », le coach a dit « tu joues »."
      left: "Coup d'envoi"
    - roles: [joueur]
      when: "flag('mbako_vendu') && chars.mbako.statut == 'vendu'"
      text: "GRAND MATCH. Il est en face, en jaune, et il a dix-neuf ans. Le stade connaît son prénom mieux que le tien."
      left: "Coup d'envoi"
    - roles: [joueur]
      when: "flag('special')"
      text: "GRAND MATCH. Tu as dit « le meilleur » en conférence. Quarante mille personnes sont venues vérifier."
      left: "Coup d'envoi"
    - roles: [joueur]
      when: "flag('international')"
      text: "GRAND MATCH. Le sélectionneur est dans la tribune de presse, deuxième rang. Il ne prend pas de notes, c'est pire."
      left: "Coup d'envoi"
    - roles: [joueur]
      when: "relation.gege <= -2"
      text: "GRAND MATCH. La tribune Nord a préparé quelque chose pour toi. Ce n'est pas un tifo."
      left: "Coup d'envoi"
    - roles: [joueur]
      when: "stats.titres >= 1 && season >= 2"
      text: "GRAND MATCH. On te siffle à l'échauffement dans un stade où tu as gagné. C'est la nouveauté de l'année."
      left: "Coup d'envoi"
    - roles: [joueur]
      text: "GRAND MATCH. Le stade est plein, ton nom est au dos, et tout se joue ici. Coup d'envoi."
      left: "Coup d'envoi"
    # ---- Secours commun
    - text: "GRAND MATCH. Le stade est plein, tout se joue ici. Coup d'envoi."
      left: "Coup d'envoi"

  # ══ gm_te — le cadre du temps fort (bible § 1.3) ═══════════════════════════
  # La bible écrit trois libellés de risque ; le moteur n'a que deux sorties :
  # SÛR et RISQUÉ. ÉQUILIBRÉ n'a pas de bouton (écart d'import).
  gm_te:
    # ── Ce que la relecture a trouvé, et ce qui manque encore ────────────────
    # Le Grand Match sert `gm_te` **trois fois de suite** (content/calendar.yaml,
    # phase sprint) et `_setpiece` reprend chaque fois la première variante vraie :
    # les trois temps forts d'une saison étaient identiques mot pour mot.
    # La bible ch. 30 § 1.3 règle ça avec `vars.gm_te_index` (1, 2, 3) : le
    # moteur le pose maintenant dans `_gmTempsFort`, et il **écarte en plus les
    # variantes déjà servies dans ce Grand Match** — sans quoi une variante de
    # trace, vraie les trois fois, gagnait les trois fois et l'index ne servait
    # à rien. Deux libellés identiques dans un même Grand Match sont refusés par
    # un test moteur (`packages/core/test/engine_test.dart`).
    # Écart d'ordre assumé avec la bible : elle place les variantes d'index
    # avant les variantes de trace, ce qui les rendrait toujours gagnantes et
    # ramènerait le même trio dans toutes les carrières. Ici les traces passent
    # d'abord (le genou, le vieux gardien, le dauphin, la loge…) et l'index sert
    # de secours différencié : une carrière qui n'a rien à dire voit quand même
    # trois écrans différents.
    # Ce que ce fichier peut faire seul, et qui est fait : quinze variantes de
    # plus, lues sur les traces des deux rôles (bible ch. 10 § 9 et ch. 11 § 9),
    # pour que le temps fort change au moins d'une saison et d'une carrière à
    # l'autre.
    - when: "flag('genou')"
      text: "{minute}e minute · {score}. Ton corps a une opinion sur la suite. Elle n'est pas dans le plan."
      left: "Je lève le pied"
      right: "Je force"
    # ---- Entraîneur, sur les traces du banc (bible ch. 11 § 9)
    - roles: [entraineur]
      when: "flag('finale_gigi')"
      text: "{minute}e minute · {score}. Le vieux gardien s'avance de trois mètres. Il n'a pas demandé la permission."
      left: "Je le laisse monter"
      right: "Je le rappelle"
    - roles: [entraineur]
      when: "flag('vecchio_promis')"
      text: "{minute}e minute · {score}. Gigi montre le corner, puis sa ligne, et attend ton signe. À son âge, il ne sort plus sans qu'on le lui dise."
      left: "Reste sur ta ligne"
      right: "Sors sur les corners"
    - roles: [entraineur]
      when: "flag('mbako_lance')"
      text: "{minute}e minute · {score}. Penalty. L'avant-centre tend la main, le gamin de seize ans a déjà le ballon sous le bras."
      left: "Le buteur tire"
      right: "Le petit tire"
    - roles: [entraineur]
      when: "flag('otage_kop')"
      text: "{minute}e minute · {score}. Le onze est celui du virage. Ce que tu changes maintenant, le local le saura avant la fin."
      left: "Je ne change rien"
      right: "Je change tout"
    - roles: [entraineur]
      when: "flag('vukic_dauphin')"
      text: "{minute}e minute · {score}. L'adjoint a un papier plié : trois lignes, un système, et sa signature en bas. Il ne l'a pas montré au président. Pas encore."
      left: "Son plan"
      right: "Le mien"
    - roles: [entraineur]
      when: "flag('salaires_retard')"
      text: "{minute}e minute · {score}. La paie du cinq n'est pas tombée, et onze hommes courent quand même. Personne n'en parlera avant le coup de sifflet."
      left: "Je ferme la boutique"
      right: "Je demande un effort"
    - roles: [entraineur]
      when: "flag('espion_retour')"
      text: "{minute}e minute · {score}. Leur onze est exactement celui de la feuille du café. Ou bien ils t'ont laissé la lire."
      left: "Je garde mon plan"
      right: "Je change tout de suite"
    - roles: [entraineur]
      when: "flag('fils_joueur')"
      text: "{minute}e minute · {score}. Dernier changement possible, et c'est le fils du président qui s'échauffe le long de la ligne, sans regarder le banc."
      left: "Il entre"
      right: "Il se rassoit"
    - roles: [entraineur]
      when: "relation.aulard <= -1"
      text: "{minute}e minute · {score}. La loge fait un signe qu'on voit du banc et des tribunes. Ce n'est pas un encouragement."
      left: "Je ferme le match"
      right: "Je fais l'inverse"
    - roles: [entraineur]
      when: "flag('derby_perdu')"
      text: "{minute}e minute · {score}. Le derby de l'aller a laissé une trace de peinture sur le mur du local. Personne ne l'a effacée, et tout le monde y pense."
      left: "On assure"
      right: "On y va"
    # ---- Joueur, sur les traces du terrain (bible ch. 10 § 9)
    - roles: [joueur]
      when: "flag('capitaine')"
      text: "{minute}e minute · {score}. Le brassard pèse une demi-seconde de plus. Deux façons de le porter, une seule qui te ressemble."
      left: "Je joue simple"
      right: "Je prends tout"
    - roles: [joueur]
      when: "flag('mbako_vendu')"
      text: "{minute}e minute · {score}. Le gamin qu'on a vendu arrive seul en face de toi, en jaune, et le stade connaît son prénom."
      left: "Je temporise"
      right: "Je tacle fort"
    - roles: [joueur]
      when: "relation.brehaut >= 1"
      text: "{minute}e minute · {score}. Penalty. Bréhaut tend la main sans un mot, paume ouverte. Il a tiré les six derniers ; il en a raté un."
      left: "Je le lui laisse"
      right: "Je le prends"
    - roles: [joueur]
      when: "chars.vecchio.statut == 'club'"
      text: "{minute}e minute · {score}. Le vieux gardien fait signe qu'il veut sortir maintenant, pour l'ovation. Le banc regarde ailleurs, exprès."
      left: "Je préviens le banc"
      right: "Je le retiens sur le terrain"
    - roles: [joueur]
      when: "flag('international')"
      text: "{minute}e minute · {score}. Le sélectionneur est au deuxième rang de la tribune de presse. Il ne prend pas de notes, ce qui est pire."
      left: "Je joue juste"
      right: "Je joue pour lui"
    - roles: [joueur]
      when: "flag('pari')"
      text: "{minute}e minute · {score}. Le corner est pour toi, et quelqu'un dans un bar compte les corners depuis la première minute."
      left: "Je tire normalement"
      right: "Je gagne du temps"
    - roles: [joueur]
      when: "flag('special')"
      text: "{minute}e minute · {score}. Tu as dit « le meilleur » en conférence. Quarante mille personnes sont venues vérifier, et elles ont de la mémoire."
      left: "Je fais simple"
      right: "Je fais le geste"
    - roles: [joueur]
      when: "year < 2016 && gauges.tribunes < 45"
      text: "{minute}e minute · {score}. Le ballon est là, le gardien aussi, et l'arbitre regarde de l'autre côté. Personne ne reverra l'image au ralenti."
      left: "Je la joue au pied"
      right: "Je la joue à la main"
    # ---- Les deux rôles
    - when: "season >= 2 && stats.titres >= 1"
      text: "{minute}e minute · {score}. On te regarde comme on regarde un champion : en attendant la faute. Dernier quart d'heure."
      left: "Comme un champion"
      right: "Comme avant"
    - when: "relation.gege >= 2"
      text: "{minute}e minute · {score}. Le virage chante depuis la vingtième et il ne s'arrêtera pas. Ce qu'on décide ici, on le racontera en juin."
      left: "Je joue le point"
      right: "Je joue le virage"
    # ---- Le secours différencié (bible ch. 30 § 1.3), lu sur `vars.gm_te_index`
    #      (1, 2, 3) posé par `_gmTempsFort`. `vars.gm_won` est rafraîchi avant
    #      le deuxième temps fort : la variante « on mène » est vivante.
    - when: "vars.gm_te_index == 1"
      text: "{minute}e minute · {score}. Le match bascule ici. Deux façons de faire, une seule qui te ressemble."
      left: "Le choix sûr"
      right: "Le choix risqué"
    - when: "vars.gm_te_index == 2 && vars.gm_won == 1"
      text: "{minute}e minute · {score}. On mène, il reste une heure, et tout le monde regarde le banc. C'est long, une heure."
      left: "Je tiens"
      right: "Je tue le match"
    - when: "vars.gm_te_index == 2"
      text: "{minute}e minute · {score}. Le stade s'est tu d'un coup, comme on ferme un robinet. Il reste une heure pour le rouvrir."
      left: "Je resserre"
      right: "Je monte tout le monde"
    - when: "vars.gm_te_index == 3"
      text: "{minute}e minute · {score}. Dernier quart d'heure. Ce que tu décides maintenant, on le racontera en juin, dans les deux sens."
      left: "On ferme"
      right: "On va chercher"
    # ---- Secours de rôle, puis secours commun
    - roles: [entraineur]
      text: "{minute}e minute · {score}. Le match bascule ici, et tout le monde regarde ton banc. Deux façons de faire."
      left: "Je gère"
      right: "Je tente"
    - roles: [joueur]
      text: "{minute}e minute · {score}. Le match bascule ici, et le ballon revient vers toi. Deux façons de le prendre."
      left: "Je la joue simple"
      right: "Je tente le geste"
    # ---- Secours commun
    - text: "{minute}e minute · {score}. Le match bascule ici. Deux façons de faire, une seule qui te ressemble."
      left: "On assure"
      right: "On y va"

  # ══ aftermatch — l'après-match (bible § 1.4) ═══════════════════════════════
  # Écart d'import : la bible lit `vars.gm_won == -1` (défaite) ; le moteur ne
  # pose que 1 (gagné) et 0 (pas gagné). Les variantes de défaite lisent 0.
  aftermatch:
    # ---- Entraîneur
    - roles: [entraineur]
      when: "vars.gm_won == 1 && flag('finale_gigi')"
      text: "Score final {gm_score}. Gigi a gardé le ballon du match sous le bras, avec ses gants. Il ne l'a pas lâché sous la douche."
      left: "Je le laisse le garder"
      right: "Le ballon est au club"
      answer_left: "Il le pose sur son casier. Il ne le rendra jamais."
      answer_right: "Il le rend. Il regarde ailleurs en le rendant."
    - roles: [entraineur]
      when: "vars.gm_won == 1 && flag('pacte_gege')"
      speaker: gege
      text: "Gégé, la voix cassée, l'écharpe enroulée autour du poing : « Ton nom, quatre fois ce soir, {toi}. Au local, le plafond goutte toujours. La date est encore à la craie. »"
      left: "Il sera rénové"
      right: "On verra en juin"
      answer_left: "Il regrave la date à la craie, un cran au-dessus."
      answer_right: "« En juin. » Il le répète pour que ça s'entende."
    - roles: [entraineur]
      when: "vars.gm_won == 0 && arc('co.derby') == 'active'"
      speaker: meneche
      text: "Massenet, carnet ouvert dans le couloir : « Un derby perdu, il faut un nom en titre, {toi}. Je prends celui d'un joueur, ou le vôtre ? »"
      left: "Prenez le mien"
      right: "Prenez le onze"
      answer_left: "Il note la phrase entière, sans la couper."
      answer_right: "Il note le onze. Il souligne deux noms."
    - roles: [entraineur]
      when: "vars.gm_won == 0 && flag('salaires_retard')"
      speaker: brehaut
      text: "Bréhaut, les bouteilles d'eau encore dans les bras : « Le groupe a perdu, et le groupe n'a pas été payé le cinq. Ça fait deux choses à dire ce soir. Tu les dis, {toi}, ou moi ? »"
      left: "Je leur parle ce soir"
      right: "Dis-le, toi"
      answer_left: "Tu parles onze minutes. Personne ne délace ses chaussures avant la fin."
      answer_right: "Il le dit à sa façon. Elle est meilleure que la tienne."
    - roles: [entraineur]
      when: "vars.gm_won == 1 && relation.aulard <= -1"
      speaker: aulard
      text: "Vaubourg te serre la main sans s'arrêter, déjà tourné vers sa voiture : « Bravo. Madame Aubert m'attend. Ton contrat, on en parlera en juin. Si on en parle. »"
      left: "Merci, président"
      right: "Vous avez deux minutes ?"
      answer_left: "Il est déjà dans sa voiture. La vitre remonte avant ta réponse."
      answer_right: "Il te donne deux minutes, portière ouverte, moteur allumé. Il en compte une sur sa montre."
    - roles: [entraineur]
      when: "vars.gm_won == 0 && flag('mbako_lance')"
      speaker: mere_mbako
      text: "La mère de Mbako, veste prune, carnet ouvert sur les genoux : « Soixantième minute. C'est écrit ici, avec l'heure. Mon fils joue pour finir les matchs, {toi}. Pas pour en sortir. »"
      left: "Il jouera les 90 minutes"
      right: "C'est moi qui décide"
      answer_left: "Elle écrit ta promesse dans le carnet, en trois exemplaires, et te tend le double."
      answer_right: "Elle referme le carnet. Le lundi, un club de Portclair demande le prix du petit."
    - roles: [entraineur]
      when: "vars.gm_won == 0 && flag('onze_du_virage')"
      speaker: vukic
      text: "Vukić essuie le tableau du vestiaire du plat de la main : « Ce onze-là, ils l'ont voté au local mardi. Tu l'as signé. On a perdu ensemble, mais ce n'était pas le tien. »"
      left: "Je reprends la compo"
      right: "C'est mon onze"
      answer_left: "Il te tend la craie, sans commentaire."
      answer_right: "Il n'insiste pas. Il note la date sur son cahier."
    # ---- Joueur pro
    - roles: [entraineur]
      when: "vars.gm_won == 1"
      speaker: vukic
      text: "Vukić, le cahier sous le bras, à la porte du vestiaire : « Deux poteaux pour eux, un hors-jeu qu'on n'a pas sifflé. On a gagné, et on a eu de la chance. Tu leur dis quoi ? »"
      left: "Je les félicite"
      right: "Je recadre quand même"
      answer_left: "Ils crient onze minutes. Il les laisse crier, en regardant l'heure."
      answer_right: "Le vestiaire se tait d'un coup. Vukić hoche la tête, une fois."
    - roles: [entraineur]
      speaker: vukic
      text: "Vukić referme le cahier : « Trois joueurs riaient à l'échauffement. Ce match, on l'a laissé filer avant le coup d'envoi. Tu parles au groupe ce soir, ou demain ? »"
      left: "Je parle maintenant"
      right: "Je parle demain"
      answer_left: "Quatre minutes, debout, sans notes. Deux joueurs regardent le sol."
      answer_right: "Le bus rentre en silence. Demain sera plus long que ce soir."
    - roles: [joueur]
      when: "vars.gm_won == 1 && flag('capitaine')"
      speaker: brehaut
      text: "Bréhaut délace ses chaussures sans se presser : « C'est ton brassard qui a gagné ce soir, {toi}. Le groupe attend un mot. Tu parles, ou tu les laisses crier ? »"
      left: "Je monte sur le banc"
      right: "Je les laisse crier"
      answer_left: "Trois phrases, debout sur un banc. La troisième est de trop."
      answer_right: "Ils crient vingt minutes. Tu écoutes depuis la douche."
    - roles: [joueur]
      when: "vars.gm_won == 1 && flag('special')"
      speaker: lea
      text: "Léa, en zone mixte, son carnet ouvert à la page d'août : « En août, vous avez dit « le meilleur », {toi}. Ce soir, on a gagné. J'écris que vous le maintenez ? »"
      left: "J'ai dit ça vite"
      right: "Je le maintiens"
      answer_left: "Elle garde la première version. Elle est meilleure."
      answer_right: "Le titre est déjà écrit. Il l'était avant la question."
    - roles: [joueur]
      when: "vars.gm_won == 0 && relation.gege <= -1"
      speaker: gege
      text: "Gégé attend au parking, l'écharpe autour du poing, trois types derrière lui : « On a compté tes courses ce soir, {toi}. Onze. Tu viens nous parler, ou tu montes dans ta voiture ? »"
      left: "Je vais leur parler"
      right: "Je monte en voiture"
      answer_left: "Vingt minutes debout au parking. Personne ne crie."
      answer_right: "La voiture démarre. Ils la regardent démarrer."
    - roles: [joueur]
      when: "vars.gm_won == 0 && flag('genou')"
      speaker: sabatier
      text: "Le Doc ferme la porte de la salle de soins et pose la main à plat sur ton genou : « À la soixantième, tu as boité trois foulées. Dis-moi ce que tu as senti, pas ce que tu veux que j'entende. »"
      left: "Je dis la vérité"
      right: "Je dis que ça va"
      answer_left: "Il écrit trois lignes. Il en garde deux pour lui."
      answer_right: "Il écrit une ligne. « Rien », avec la date."
    - roles: [joueur]
      when: "vars.gm_won == 1 && relation.fardelli >= 1"
      speaker: fardelli
      text: "Fardelli t'attend à la sortie du vestiaire, un cigare éteint entre les doigts : « Trois amis à moi étaient en tribune ce soir, {toi}. Je les appelle cette nuit, ou tu fêtes d'abord avec les autres ? »"
      left: "Je fête avec le groupe"
      right: "Appelle-les cette nuit"
      answer_left: "Il range son carnet. Les trois numéros attendront demain midi."
      answer_right: "Il appelle trois numéros depuis la cabine du parking, dans l'ordre."
    - roles: [joueur]
      when: "vars.gm_won == 0 && flag('mbako_vendu')"
      speaker: meneche
      text: "Massenet, dans le couloir, ferme son carnet pour une fois : « Le petit Mbako vous a pris le ballon deux fois ce soir, {toi}. Je ne note rien. Vous en pensez quoi, entre nous ? »"
      left: "Il est meilleur que moi"
      right: "Je ne commente pas"
      answer_left: "C'est le titre du lendemain, sans guillemets."
      answer_right: "Il rouvre le carnet et note le silence, avec l'heure."
    - roles: [joueur]
      when: "vars.gm_won == 0 && flag('international')"
      speaker: legruet
      text: "Berthomier traverse le couloir, le pardessus sur le bras, et s'arrête à peine : « La commission se réunit en mars, {toi}. Elle ne vous a pas vu ce soir. Moi, si. »"
      left: "Je ferai mieux en mars"
      right: "Faites votre liste"
      answer_left: "Il hoche la tête. Il ne note rien, ce qui est pire."
      answer_right: "Il sourit et s'en va. Le couloir est long."
    - roles: [joueur]
      speaker: vukic
      text: "Vukić tient une cassette marquée au feutre : « Tu as couru jusqu'à la quarantième, {toi}. Après, tu as regardé jouer les autres. Demain, sept heures, on la regarde ensemble ? »"
      left: "Je viens à sept heures"
      right: "Je ne viens pas"
      answer_left: "Quarante minutes de cassette. Tu comptes tes courses."
      answer_right: "Il garde la cassette. Il la ressortira en février."
    # ---- Secours commun
    - when: "vars.gm_won == 1"
      text: "Score final {gm_score}. Le vestiaire exulte."
    - text: "Le match est terminé. Il faut parler au groupe."

  # ══ bilan_verdict — le verdict (bible § 1.6) ═══════════════════════════════
  # Texte de narrateur, un bouton. Le seul beat où `bilan.*` est lisible.
  # Les cinq rôles de club partagent une liste : ici, entraîneur et joueur.
  #
  # C'est ici que le nom DIRECT du protagoniste est prononcé une fois par
  # saison close (budget « nom » § 5.3 : « ≥ 2 cartes portant le nom dans ≥ 95 %
  # des saisons » ET « jamais deux cartes de nom direct de suite »). Le Verdict
  # est le seul créneau du calendrier encadré par deux écrans de beat des deux
  # côtés — la Une (`bilan_une`, qui n'a pas de gabarit de set-piece et ne
  # compte donc jamais) avant, le Contrat (nommé, lui, par l'ADRESSE du
  # président, donc hors budget de paire) après. Un écran de beat ne sait pas
  # ce qui vient après lui : c'est la seule façon de tenir la clause « jamais
  # deux de suite » sans garde de moteur.
  bilan_verdict:
    - when: "bilan.tenu && bilan.rang <= 3"
      text: "Le verdict tombe : {rang}e. Le président a fait imprimer la photo de famille. Tu es dessus, au bord."
      left: "Voir le classement"
    - when: "bilan.tenu && objective.promised"
      text: "Le verdict tombe : {rang}e. {objectif} : tenu. La promesse d'août tient encore debout, à une semaine près."
      left: "Voir le classement"
    - when: "bilan.tenu"
      text: "Le verdict tombe : {rang}e. {objectif} : tenu. Josiane a déjà rangé le dossier {nom} sous les autres."
      left: "Voir le classement"
    - when: "!bilan.tenu && bilan.outcome == 'descente'"
      text: "Le verdict tombe : {rang}e. Le mot « descente » est écrit en petit, en bas de la lettre."
      left: "Voir le classement"
    - when: "!bilan.tenu && bilan.outcome == 'lanterne'"
      text: "Le verdict tombe : {rang}e. Dernier. Le classement tient sur une ligne, et c'est la dernière."
      left: "Voir le classement"
    - when: "!bilan.tenu && flag('salaires_retard')"
      text: "Le verdict tombe : {rang}e. Les salaires de mai ne sont pas tombés non plus. Deux lignes dans le même courrier."
      left: "Voir le classement"
    - when: "!bilan.tenu && objective.promised"
      text: "Le verdict tombe : {rang}e. La Gazette a ressorti la phrase d'août, avec la date."
      left: "Voir le classement"
    - when: "!bilan.tenu && bilan.rang <= 6"
      text: "Le verdict tombe : {rang}e. À un point de ce qu'on t'avait demandé. On a refait la photo sans toi."
      left: "Voir le classement"
    - when: "!bilan.tenu"
      text: "Le verdict tombe : {rang}e. {objectif} : manqué. Le dossier {nom} fait deux pages, et la deuxième est vide."
      left: "Voir le classement"
    # ---- Secours commun
    - text: "Le verdict de la saison tombe. Objectif : {objectif}. En haut du dossier, un nom : {nom}."
      left: "Voir le classement"

  # ══ bilan_contrat — on continue ou pas (bible § 1.7) ═══════════════════════
  # Après le Verdict on lit `flag('bilan_tenu')` / `flag('bilan_manque')`.
  bilan_contrat:
    # ---- Entraîneur
    - roles: [entraineur]
      when: "relation.aulard <= -1"
      speaker: aulard
      text: "« On continue, {toi}, ou je te fais un chèque ? Je ne le date pas. »"
      left: "On continue"
      right: "Faites le chèque"
      answer_left: "Il repose le carnet à souches sans l'ouvrir."
      answer_right: "Il signe, il ne date pas, et il te tend le stylo pour rien."
    - roles: [entraineur]
      when: "stats.titres >= 1"
      speaker: aulard
      text: "« Champion, {toi}. Je te prolonge sans lire ; tu signes où ? »"
      left: "Je signe"
      right: "Je lis d'abord"
      answer_left: "Deux signatures, un café, et personne n'a lu la page trois."
      answer_right: "Tu lis. Page trois, il y a une clause qui n'y était pas."
    - roles: [entraineur]
      when: "flag('vukic_dauphin')"
      speaker: aulard
      text: "« On continue un an, {toi}, avec Zoran comme adjoint. Il a déjà dit oui, lui. »"
      left: "D'accord pour un an"
      right: "Sans Zoran"
      answer_left: "Zoran attend dans le couloir. Il attendait déjà avant."
      answer_right: "« Alors c'est sans toi. » Il le dit calmement."
    - roles: [entraineur]
      when: "flag('otage_kop')"
      speaker: aulard
      text: "Vaubourg pose le contrat à côté du onze du local, recopié sur papier à en-tête : « Il y a deux entraîneurs dans mon club, {toi}. Un sur le banc, un en tribune Nord. Je prolonge lequel ? »"
      left: "Celui du banc"
      right: "Celui du virage"
      answer_left: "Il prolonge le banc. Le virage l'apprend par la radio."
      answer_right: "Il note. Il ne prolonge personne ce jour-là."
    - roles: [entraineur]
      when: "flag('bilan_manque') && objective.promised"
      speaker: meneche
      text: "Massenet ouvre son carnet à une page cornée en août : « Votre promesse est là, datée, {toi}. Le président vous prolonge. Il prolonge qui : la promesse, ou vous ? »"
      left: "C'est moi qu'il prolonge"
      right: "C'est la promesse"
      answer_left: "Il écrit ta réponse entre guillemets, et souligne « moi » deux fois."
      answer_right: "Il ressort la phrase d'août, datée, et la met en face."
    - roles: [entraineur]
      when: "relation.nassir >= 1"
      speaker: nassir
      text: "Ilyas déplie un tableau à trois colonnes, une par club du fonds : « Nous avons deux autres bancs à pourvoir, {toi}. Vous prolongez ici, ou vous regardez les autres colonnes ? »"
      left: "Je prolonge ici"
      right: "Je regarde les colonnes"
      answer_left: "Il replie le tableau. Il laisse un trombone sur ta ligne."
      answer_right: "Trois clubs, trois colonnes, et ton nom dans la troisième."
    - roles: [entraineur]
      when: "flag('clow_ingrat')"
      speaker: josiane
      text: "Josiane pose le contrat, puis une fiche bristol à côté : « Monsieur Corven a appelé en mars, {toi}. Il n'a pas eu de retour. Vous signez le contrat d'abord, ou la fiche ? »"
      left: "Je l'appelle ce soir"
      right: "Le contrat, madame"
      answer_left: "Elle te donne le numéro. Elle l'avait déjà écrit."
      answer_right: "Elle range le numéro dans le classeur vert."
    - roles: [entraineur]
      when: "flag('aulard_rappelle')"
      speaker: aulard
      text: "Vaubourg garde le stylo dans sa main : « Viré un lundi, rappelé un mercredi, {toi}. Je ne rappelle jamais deux fois. On continue, ou on arrête proprement ? »"
      left: "On continue"
      right: "On arrête proprement"
      answer_left: "Il signe sans lire. C'est sa façon de dire qu'il se souvient."
      answer_right: "Il range le stylo et ne te raccompagne pas. Josiane, si, jusqu'au parking."
    - roles: [entraineur]
      speaker: aulard
      text: "Vaubourg a sorti le carnet à souches et ne l'ouvre pas encore : « Un an de plus dans mon club, {toi}, aux mêmes conditions. Ou tu as une liste à me lire ? »"
      left: "Je reste"
      right: "Je réclame plus de moyens"
      answer_left: "Il repose le carnet à souches sans l'ouvrir. « Alors on ne change rien. »"
      answer_right: "Il ouvre le carnet à souches, regarde la première ligne, et le referme."
    # ---- Joueur pro
    - roles: [joueur]
      when: "flag('bilan_tenu') && relation.fardelli >= 1"
      speaker: fardelli
      text: "Fardelli te sert un café que tu n'as pas demandé : « Trois amis m'ont appelé cette semaine, {toi}. Ton président, pas encore. Je laisse sonner chez lui, ou je rappelle les amis ? »"
      left: "Je reste chez moi"
      right: "Rappelle les trois"
      answer_left: "Il range le carnet. Il rappellera les trois quand même."
      answer_right: "Il décroche devant toi. Le troisième numéro est le bon."
    - roles: [joueur]
      when: "flag('genou') && age >= 30"
      speaker: sabatier
      text: "Le Doc pose ta radio contre la vitre, à contre-jour : « Une saison de plus, {toi}, ça se paie en cartilage. Ton agent n'a pas vu cette radio. Tu signes quand même ? »"
      left: "Je signe"
      right: "J'attends juin"
      answer_left: "Il note la date. Il note aussi ce qu'il pense, ailleurs."
      answer_right: "Il referme le dossier. Il ne le range pas."
    - roles: [joueur]
      when: "flag('capitaine') && flag('bilan_tenu')"
      speaker: aulard
      text: "« Je prolonge le brassard, pas le salaire, {toi}. Tu signes où, comme d'habitude ? »"
      left: "Comme d'habitude"
      right: "Le salaire aussi"
      answer_left: "Le brassard est prolongé. Le reste tient sur une ligne."
      answer_right: "Il rit. Il ne dit pas non, il rit."
    - roles: [joueur]
      when: "flag('exil_dore')"
      speaker: nassir
      text: "Ilyas pose sur la table un billet d'avion en première, aller simple : « Vous vieillissez bien sur nos affiches, {toi}. Trois ans de plus, au soleil. Vous venez ? »"
      left: "Je reste au froid"
      right: "Je viens au soleil"
      answer_left: "Il laisse l'offre ouverte jusqu'en juin. Le billet reste sur ta table."
      answer_right: "Le contrat fait quatre pages. Trois sont des annexes."
    - roles: [joueur]
      when: "flag('bilan_manque') && relation.vukic <= -1"
      speaker: vukic
      text: "Vukić a rayé ton nom au crayon sur la compo de juillet, sans appuyer : « Tu n'es plus dans mes plans, {toi}. Tu cherches un club, ou tu attends que je change d'avis ? »"
      left: "Je cherche"
      right: "J'attends"
      answer_left: "Il te donne deux noms. Ils ne rappelleront pas."
      answer_right: "Il hoche la tête. Le tableau du vestiaire change mardi."
    - roles: [joueur]
      when: "flag('diplome')"
      speaker: vukic
      text: "« Tes jambes parlent, {toi}, et tu as le papier. Tu joues une saison de plus, ou tu prends la réserve ? »"
      left: "Une saison de plus"
      right: "Je prends la réserve"
      answer_left: "Il range le formulaire dans le tiroir. Pas à la poubelle."
      answer_right: "Tu changes de vestiaire sans changer de couloir."
    - roles: [joueur]
      when: "flag('petition_portee') || flag('lettre_du_vestiaire')"
      speaker: brehaut
      text: "« Le groupe a signé pour toi, {toi}, et le président l'a reçue par fax. Tu veux qu'on remette une couche ? »"
      left: "Remettez une couche"
      right: "Ça suffit comme ça"
      answer_left: "Vingt-deux noms, deuxième fois. Le fax chauffe."
      answer_right: "Il plie la feuille et la garde dans son casier."
    - roles: [joueur]
      speaker: fardelli
      text: "Fardelli regarde le parking par la fenêtre en parlant : « Ton club te reprend aux mêmes conditions, {toi}. Moi, j'ai un ami qui paie mieux. J'en parle à ton président ? »"
      left: "Je reste comme ça"
      right: "Qu'il me paie mieux"
      answer_left: "Il range le carnet sans noter de numéro. « On se rappelle l'été prochain, alors. »"
      answer_right: "Il note un chiffre, le barre, en note un autre. Il ne te le montre pas."
    # ---- Secours commun
    - text: "{patron} : « On continue l'aventure, ou tu tentes autre chose ? »"
      left: "Je reste"
      right: "Je réclame plus de moyens"
      answer_left: "Il repose le carnet à souches sans l'ouvrir. La saison suivante est déjà écrite."
      answer_right: "Il repose le carnet à souches et regarde par la fenêtre. « On verra en juin. »"

  # ══ bilan_carrefour — la porte (bible § 1.8) ═══════════════════════════════
  # Une variante `transition:` remplace le libellé de roles.yaml quand son
  # `when` est vrai et que la transition est éligible. Seule la porte
  # joueur → entraîneur existe aujourd'hui ; les sept autres arêtes de la
  # bible attendent leurs rôles.
  bilan_carrefour:
    - transition: entraineur
      when: "flag('diplome')"
      speaker: vukic
      text: "« Tu as le papier, {toi}. La réserve n'a pas d'entraîneur ; tu passes de l'autre côté ? »"
      left: "Pas encore"
      right: "Je passe de l'autre côté"
    - transition: entraineur
      when: "flag('genou') && age >= 30"
      speaker: sabatier
      text: "Le Doc a rangé l'aiguille et ne la ressort pas : « Ce genou ne fera pas deux saisons, {toi}. Le survêtement de la réserve, lui, ne s'use pas. »"
      left: "Je joue encore"
      right: "Je prends le survêtement"
    - transition: entraineur
      when: "flag('capitaine')"
      speaker: aulard
      text: "Vaubourg te reçoit la porte ouverte, ce qu'il ne fait jamais : « Reste, mais en survêtement, {toi}. Un capitaine qui connaît déjà mes défauts, je n'en retrouverai pas. »"
      left: "Je reste joueur"
      right: "J'accepte le banc"
    - transition: entraineur
      speaker: vukic
      text: "Vukić range le chronomètre sans rien dire, puis : « Tu as perdu un mètre depuis Noël, {toi}. Le banc d'en face l'a vu aussi. La réserve n'a pas d'entraîneur. Tu y vas ? »"
      left: "Pas cette année"
      right: "J'y vais"
    - when: "gauges.direction <= 25"
      speaker: camille
      text: "« Tu vois le mur arriver, et moi je le vois depuis mars. Tu pars avant, ou tu attends la lettre ? »"
      left: "J'attends la lettre"
      right: "Je pars avant"
    - when: "flag('vukic_dauphin') && relation.vukic <= -1"
      speaker: vukic
      text: "Vukić pose le cahier sur ton bureau, fermé : « Le président m'a proposé ta place mardi, au restaurant du port. Je n'ai pas encore répondu. »"
      left: "Réponds ce que tu veux"
      right: "Réponds non"
    - when: "age >= 55 && stats.titres >= 2"
      speaker: vecchio
      text: "Gigi fait tourner son verre d'eau sur le comptoir de la buvette : « J'ai pris cinq retraites, {toi}. Chaque fois, je suis revenu un an de trop. Toi, tu veux finir comment ? »"
      left: "Avant l'année de trop"
      right: "Avec l'année de trop"
    # ---- Le Carrefour du joueur qui vient d'être vendu. Sans ces trois-là, le
    # beat servait « On recommence ici » à quelqu'un qui a signé ailleurs deux
    # cartes plus tôt (l'ancre du slot 17 vend la pépite dans 76 % des carrières).
    - roles: [joueur]
      when: "flag('celebre_contre_usine')"
      speaker: gege
      text: "« Tu as célébré devant nous, on a brûlé vingt mètres, et l'été est quand même arrivé. Tu reviens un jour, ou c'est fini ? »"
      left: "Je reviendrai"
      right: "C'est fini"
    - roles: [joueur]
      when: "flag('vendu_d1') || flag('vendu_d2')"
      speaker: fardelli
      text: "« {Toi}, c'est signé, et l'été sert à savoir où on dort en août. Je te dis la ville maintenant, ou tu la lis dans le journal comme tout le monde ? »"
      left: "Dis-la-moi maintenant"
      right: "Je la lirai"
    - roles: [joueur]
      when: "flag('vente_janvier') || flag('vente_annulee')"
      speaker: josiane
      text: "« J'ai un carton et votre casier, et je ne sais pas si je vide ou si je range. Vous partez pour de bon, ou la visite médicale a tout arrêté ? »"
      left: "Videz le casier"
      right: "Rangez, je reste"
    - when: "season >= 1"
      speaker: josiane
      text: "Josiane range le classeur de la saison sur l'étagère, à côté des autres : « Le téléphone a sonné deux fois cet été pour vous. Je n'ai pas décroché. On repart ? »"
      left: "On repart"
      right: "Je regarde ailleurs"
    - roles: [joueur]
      speaker: fardelli
      text: "« {Toi}, l'été est long et mon carnet est court. On recommence ici, ou je fais deux appels ? »"
      left: "On recommence ici"
      right: "Fais tes deux appels"
    # ---- Secours commun
    - text: "L'été passe. Le téléphone sonne une fois, deux fois, puis plus. On repart."
      left: "Continuer"
