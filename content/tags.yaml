  # Les événements sombres (docs/bible/charte_histoire.md § 5) : ce qui arrive en ville
  # quand la tribune, l'argent ou la peur débordent.
  - sombre
  # Les dix histoires (docs/histoires/00_les_dix_histoires.md § 1.2) : les outils
  # de dérangement que la coquille rend à part. `intermede` : une carte à part,
  # au plus une par saison (un rêve, une nuit qu'on ne se rappelle pas : fond
  # plus sombre, italique, pas de locuteur). La ligne d'ordre — une carte sans
  # locuteur qui donne une heure, un nom, un prix — dit son support : `fax`,
  # `repondeur`, `portable`, `oreillette`, `telephone`.
  - intermede
  - fax
  - repondeur
  - portable
  - oreillette
  - telephone
  # Les décors d'ailleurs (une carte `lieu: ailleurs`, ville.yaml → `ailleurs`).
  - al_dorado

# Thèmes fermés des intrigues (spec variété §2.10) : le `theme:` d'un arc ;
# jamais deux intrigues du même thème tirées la même saison, et un thème jamais
# joué pèse ×1,5 au tirage du réservoir. Le lint rejette tout thème absent de
# cette liste, et le build exige un libellé pour chacun (`theme_labels`).
# Le libellé est ce que l'outillage affiche (rapports de `simulate`, écran
# « Ce qui s'est passé ») : un mot ou deux, sans majuscule initiale forcée.
themes:
  - argent
  - tribune
  - vestiaire
  - presse
  - corps
  - famille
  - mercato
  - instances
  - direction
  - absurde
  - president
  - agent
  - contrat
  - selection
  - formation

