# Thèmes fermés des intrigues (spec variété §2.10) : le `theme:` d'un arc ;
# jamais deux intrigues du même thème tirées la même saison, et un thème jamais
# joué pèse ×1,5 au tirage du réservoir. Le lint rejette tout thème absent de
# cette liste, et le build exige un libellé pour chacun (`theme_labels`).
# Le libellé est ce que l'outillage affiche (rapports de `simulate`, écran
# « Ce qui s'est passé ») : un mot ou deux, sans majuscule initiale forcée.
themes:
  - argent
  - tribune
  - vestiaire
  - presse
  - corps
  - famille
  - mercato
  - instances
  - direction
  - absurde
  - president
  - agent
  - contrat
  - selection
  - formation

theme_labels:
  argent: "L'argent du club"
  tribune: "La tribune"
  vestiaire: "Le vestiaire"
  presse: "La presse"
  corps: "Le corps"
  famille: "La maison"
  mercato: "Le mercato"
  instances: "Les instances"
  direction: "La direction"
  absurde: "L'absurde"
  president: "Le président"
