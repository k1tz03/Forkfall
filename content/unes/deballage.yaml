# Le grand déballage (content/arcs/common/deballage.yaml) : la Une du dimanche,
# quand tu as répondu aux douze pages. Toutes les histoires, tous les rôles.
unes:
  - id: une.co.deballage
    journal: echo
    priority: 4
    when: "flag('deballage_avoue') && journal_has('deballage_avoue')"
    titre: "LES DOUZE PAGES"
    sous: "Douze promesses, douze dates, et à côté de chacune la réponse de {nom}. À {VILLE}, on a lu les réponses avant les questions."
