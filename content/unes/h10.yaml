# « Les Deux Téléphones » — les manchettes du Bilan (schéma : en-tête de
# content/unes.yaml). Fraîcheur : une manchette de trace lit `flag('x') &&
# journal_has('x')` ; celles de la saison 2 (le Bilan de la dernière saison
# ouverte) lisent `bilan.outcome` dès qu'elles parlent de montée. Les secrets
# (la défaite promise, la bande du dictaphone, le contrat de siège) ne sont
# jamais en Une : un journal ne publie pas ce qu'un clapet a entendu.
unes:
  # ------------------------------------------------------- saison 0 (2037-2038)
  - id: une.h10.premiere_marche
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 2
    when: "season == 0 && flag('h10_escalier')"
    titre: "{VILLE} : TRENTE-TROIS MARCHES"
    sous: "À l'escalier nord, un maçon mure une marche par mois, « par sécurité ». La dernière tombera en mai 2040. Les écoliers comptent avec lui."
    sujet: pr.h10.script

  - id: une.h10.promesse
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 1
    when: "season == 0 && flag('h10_promesse_gege')"
    titre: "« AVANT QU'ILS FERMENT »"
    sous: "La phrase de Gégé, socio numéro 1, le soir de l'élection, est peinte sur le mur de la buvette. {prenom} {nom} passe devant tous les jeudis."

  - id: une.h10.voix_coupee
    postulats: [escalier_ferme]
    roles: [president]
    journal: quotidien
    priority: 3
    when: "flag('h10_voix_coupee') && journal_has('h10_voix_coupee')"
    titre: "{CLUB} FAIT TAIRE GIGI"
    sous: "La voix générée de l'ancien gardien ne commente plus les matchs de la Rive. La chaîne parle de pénalités ; la Nord, de décence."
    photo: pr.h10.a2_voix

  - id: une.h10.brac_vendu
    postulats: [escalier_ferme]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h10_brac_vendu') && journal_has('h10_brac_vendu')"
    titre: "{NOM} VEND LE PETIT BRAC"
    sous: "Dix-sept ans, né rue du Stade, parti à la capitale par le car de huit heures. Sa mère n'a rien dit ; on ne lui a pas demandé."

  - id: une.h10.brac_garde
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h10_brac_garde') && journal_has('h10_brac_garde')"
    titre: "BRAC RESTE À {VILLE}"
    sous: "La capitale a rappelé deux fois. Le club a dit non deux fois. Le gamin, lui, n'a rien dit : il a marqué samedi."

  - id: une.h10.maillot
    postulats: [escalier_ferme]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h10_maillot_terrasses') && journal_has('h10_maillot_terrasses')"
    titre: "{CLUB} : LA NORD À L'ENVERS"
    sous: "« Les Terrasses, troisième tranche » sur la poitrine des Aubes. Le virage porte le maillot retourné ; l'agence Tessandier compte ses ventes à l'endroit."
    sujet: pr.h10.maquette

  - id: une.h10.socios
    postulats: [escalier_ferme]
    roles: [president]
    journal: quotidien
    priority: 3
    when: "flag('h10_socios_compte') && journal_has('h10_socios_compte')"
    titre: "{VILLE} : À TROIS CARTES PRÈS"
    sous: "La motion du virage adoptée à main levée, cent quarante-neuf contre cent quarante-six. Le capo a compté. Personne n'a recompté."
    sujet: pr.h10.socios

  - id: une.h10.owen
    postulats: [escalier_ferme]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h10_owen_vire') && journal_has('h10_owen_vire')"
    titre: "{NOM} VIRE CORVEN UN LUNDI"
    sous: "Jour de congé des joueurs. L'entraîneur a vidé son casier dans un carton de bananes et laissé un verre d'eau sur le banc. Le club parle d'une transition."
    sujet: pr.h10.lundi

  - id: une.h10.centre_garde
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h10_centre_garde') && journal_has('h10_centre_garde')"
    titre: "LES DOUZE RESTENT À {VILLE}"
    sous: "La capitale avait envoyé un car pour les gamins du centre de formation. Il est reparti vide, un mardi, à huit heures. Les parents ont dit merci, sauf un."
    sujet: pr.h10.centre

  - id: une.h10.owen_garde
    postulats: [escalier_ferme]
    roles: [president]
    journal: quotidien
    priority: 2
    when: "flag('h10_owen_garde') && journal_has('h10_owen_garde')"
    titre: "{CLUB} GARDE SON VERRE D'EAU"
    sous: "Un CV venu de la capitale dormait dans un tiroir du club-house. Owen Corven reste sur le banc ; il a fêté ça à l'eau, comme le reste."
    sujet: pr.h10.lundi

  # ------------------------------------------------------- saison 1 (2038-2039)
  - id: une.h10.nino_federation
    postulats: [escalier_ferme]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h10_nino_federation') && journal_has('h10_nino_federation')"
    titre: "LE CAPO PLAIDE POUR {VILLE}"
    sous: "Huit minutes accordées, six prises : Nino, chef des socios, a plaidé en écharpe devant la Commission des franchises. Il est revenu avec une cravate."
    sujet: pr.h10.mbako

  - id: une.h10.lettre_signee
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h10_lettre_signee') && journal_has('h10_lettre_signee')"
    titre: "LA LETTRE DE LÉA FAIT LA UNE"
    sous: "Cinquante ans de lettres de lecteurs, et la première en Une. Elle est signée Léa, tout court, et elle parle d'un escalier."
    sujet: pr.h10.lea

  - id: une.h10.diner
    postulats: [escalier_ferme]
    roles: [president]
    journal: gazette
    priority: 2
    when: "flag('h10_diner_ilyas') && journal_has('h10_diner_ilyas')"
    titre: "{NOM} DÎNE AVEC LE CHEIKH"
    sous: "Huis clos à l'hôtel de la Rive avec Cheikh Ilyas, président de la Ligue. La Gazette a eu le menu : une poire, coupée en huit."
    sujet: pr.h10.siege

  - id: une.h10.chaise
    postulats: [escalier_ferme]
    roles: [president]
    journal: quotidien
    priority: 3
    when: "flag('h10_siege_debout') && journal_has('h10_siege_debout')"
    titre: "{NOM} REFUSE UNE CHAISE"
    sous: "Au quarantième étage de la Ligue, un carton à son nom attendait sur une chaise de cuir. Elle restera libre jusqu'en juin 2040, dit la Ligue."
    sujet: pr.h10.siege

  - id: une.h10.brac_revenu
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h10_brac_revenu') && journal_has('h10_brac_revenu')"
    titre: "LE PETIT BRAC EST REVENU"
    sous: "Un dimanche, en tribune Nord, le maillot de la capitale sous le blouson. Au vestiaire de {CLUB}, il a jonglé vingt fois sans enlever le blouson."
    sujet: pr.h10.brac

  - id: une.h10.brac_rappel
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h10_brac_rappel') && journal_has('h10_brac_rappel')"
    titre: "BRAC RÉPOND À LA CAPITALE"
    sous: "Une phrase, au téléphone, devant la présidence du club. Elle n'a pas été rendue publique : elle n'était pas polie."
    sujet: pr.h10.brac

  - id: une.h10.deux_telephones
    postulats: [escalier_ferme]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h10_photo_hotel') && journal_has('h10_photo_hotel')"
    titre: "DEUX TÉLÉPHONES"
    sous: "{NOM}, au bar de l'hôtel de la Rive, à minuit, face à une femme en manteau d'automne. Sur la photo, deux téléphones posés sur la table. Personne ne sait à qui est le second."
    photo: pr.h10.b1_photo

  - id: une.h10.helico_saisi
    postulats: [escalier_ferme]
    roles: [president]
    journal: quotidien
    priority: 4
    when: "flag('h10_helico_saisi') && journal_has('h10_helico_saisi')"
    titre: "L'HÉLICOPTÈRE REPART EN CAMION"
    sous: "Saisi sur la pelouse de la Rive, devant la Nord : la « donation » de Rive Capital était un prêt. Les pales repliées sur un plateau ; tout le monde a filmé."
    photo: pr.h10.b5_pales

  - id: une.h10.loi
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 2
    when: "season == 1"
    titre: "{VILLE} : L'ESCALIER FERMERA EN 2040"
    sous: "Votée à quatre voix, la loi des franchises close la première division à la fin de la saison prochaine. À la Rive, l'escalier nord a de l'avance : il est muré à moitié."

  - id: une.h10.plaidoirie
    postulats: [escalier_ferme]
    roles: [president]
    journal: quotidien
    priority: 3
    when: "flag('h10_plaidoirie') && journal_has('h10_plaidoirie')"
    titre: "HUIT MINUTES POUR {VILLE}"
    sous: "{prenom} {nom} devant la Commission des franchises : l'escalier nord, le maçon, les marches. À la septième minute, un commissaire a regardé sa montre."
    sujet: pr.h10.mbako

  - id: une.h10.lettre_virage
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h10_lettre_virage') && journal_has('h10_lettre_virage')"
    titre: "SIGNÉ : LE VIRAGE"
    sous: "La lettre de lecteur de dimanche a reçu trois mille signatures au stylo, dans la marge. L'Écho a dû la réimprimer, ce qui n'était pas arrivé depuis 1990."
    sujet: pr.h10.lea

  - id: une.h10.centre_stage
    postulats: [escalier_ferme]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h10_centre_stage') && journal_has('h10_centre_stage')"
    titre: "DOUZE PARTENT, DIX REVIENNENT"
    sous: "Le stage des gamins du centre à la capitale s'est fini sans deux d'entre eux. {CLUB} parle de formation ; la capitale, de recrutement."
    sujet: pr.h10.centre

  - id: une.h10.entrepot
    postulats: [escalier_ferme]
    roles: [president]
    journal: quotidien
    priority: 2
    when: "flag('h10_entrepot_vide') && journal_has('h10_entrepot_vide')"
    titre: "{NOM} QUITTE LA TRÉFILERIE"
    sous: "Les camions de l'entreprise de la présidence du Racing ont vidé en trois jours les entrepôts rachetés par Rive Capital. Quarante emplois sont partis avec."
    sujet: pr.h10.entrepot

  - id: une.h10.prime
    postulats: [escalier_ferme]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h10_prime_supprimee') && journal_has('h10_prime_supprimee')"
    titre: "{CLUB} : LA PRIME A SAUTÉ"
    sous: "Une note au tableau du vestiaire, signée de la présidence : plus de prime de victoire pour le dernier bloc. Les joueurs disent l'avoir lue deux fois."
    sujet: pr.h10.script

  - id: une.h10.recrue
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 2
    when: "flag('h10_recrue_janvier') && journal_has('h10_recrue_janvier')"
    titre: "{VILLE} RECRUTE EN JANVIER"
    sous: "Un milieu de vingt-six ans, solide, arrivé sans bruit. Le club ne donne pas le montant ; l'agent du joueur sourit quand on le lui demande."
    sujet: pr.h10.script

  # ------------------------------------------- saison 2 (2039-2040), la dernière
  - id: une.h10.derniere_montee
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 4
    poids: 1.4
    when: "season == 2 && bilan.outcome == 'montee'"
    titre: "LA DERNIÈRE MONTÉE"
    sous: "Le Racing est monté le dernier soir où l'on pouvait encore monter. Trois mille visages de Gégé sur la pelouse. Demain matin, l'assemblée vote l'accord."

  # Le barrage gagné : le livre en fait le dernier match ; le Verdict, lui,
  # applique `barrage` (pas de changement de division). La manchette dit le
  # match et la porte, jamais le mot que le Verdict n'écrira pas.
  - id: une.h10.barrage_gagne
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 4
    poids: 1.4
    when: "season == 2 && bilan.outcome == 'barrage' && vars.gm_won == 1"
    titre: "LE DERNIER BARRAGE EST POUR {VILLE}"
    sous: "Quatrième, puis le barrage gagné le dernier soir où la porte était encore ouverte. Trois mille visages de Gégé sur la pelouse. Demain matin, l'assemblée vote l'accord."

  - id: une.h10.escalier_ferme
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 4
    poids: 1.4
    when: "season == 2 && world.division == 2 && bilan.outcome != 'montee' && !(bilan.outcome == 'barrage' && vars.gm_won == 1)"
    titre: "L'ESCALIER EST FERMÉ"
    sous: "La première division est close pour toujours, sans le Racing. Ce soir, à la Rive, on regarde l'escalier nord ; demain, on vote à la buvette."

  - id: une.h10.dedans
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 4
    poids: 1.4
    when: "season == 2 && world.division == 1 && bilan.outcome != 'descente'"
    titre: "{VILLE} EST DEDANS QUAND ÇA FERME"
    sous: "La première division est close pour toujours, et le Racing est du bon côté de la porte. Trois mille visages de Gégé dans la Nord. Demain matin, l'assemblée vote l'accord."

  - id: une.h10.trois_mille
    postulats: [escalier_ferme]
    roles: [president]
    journal: quotidien
    priority: 4
    poids: 0.6
    when: "season == 2 && flag('h10_gege_mort') && journal_has('h10_gege_mort')"
    titre: "TROIS MILLE VISAGES DE GÉGÉ"
    sous: "Le match d'après sa mort, la Nord a porté trois mille masques en carton du socio numéro 1. La voix du stade a dit son nom, puis s'est tue une minute."

  - id: une.h10.fusion_refusee
    postulats: [escalier_ferme]
    roles: [president]
    journal: quotidien
    priority: 4
    poids: 0.5
    when: "season == 2 && flag('h10_fusion_refusee') && journal_has('h10_fusion_refusee')"
    titre: "{VILLE} NE FUSIONNERA PAS"
    sous: "Une franchise de la Rive pour deux clubs, sous un seul nom : le projet de {rival} a été déchiré au local du kop. Le capo en a gardé les morceaux."
    sujet: pr.h10.villebranle

  - id: une.h10.mur
    postulats: [escalier_ferme]
    roles: [president]
    journal: gazette
    priority: 4
    poids: 0.8
    when: "season == 2 && flag('h10_marche_muree') && journal_has('h10_marche_muree')"
    titre: "{VILLE} : MURÉ JUSQU'EN HAUT"
    sous: "L'escalier nord de la Rive a été muré dans la nuit, la veille du dernier match. Le maçon dit qu'on le lui a demandé. Il ne dit pas qui."

  - id: une.h10.marche_ouverte
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 4
    poids: 0.8
    when: "season == 2 && flag('h10_marche_ouverte') && journal_has('h10_marche_ouverte')"
    titre: "LA TRENTE-TROISIÈME MARCHE"
    sous: "Elle est restée ouverte. Le maçon a dormi dessus, assis sur un seau retourné. Au matin, des écharpes y étaient nouées, et un masque de Gégé."

  # ------------------------------------------- les issues hors du livre (S0, S1)
  # Montée avant la loi, descente, lanterne : les manchettes communes de ces
  # issues (priorité 4) posent des réactions écrites pour l'entraîneur, que la
  # présidente perd ; celles-ci les devancent au poids, dans la même bande.
  - id: une.h10.montee_tot
    postulats: [escalier_ferme]
    roles: [president]
    journal: quotidien
    priority: 4
    poids: 9.0
    when: "season <= 1 && bilan.outcome == 'montee'"
    titre: "{CLUB} MONTE AVANT LA LOI"
    sous: "Premier de deuxième division, et en haut avant que l'escalier ferme. Gégé s'est fait relire le classement trois fois. À la buvette, on ne parle déjà plus de monter : de rester."

  - id: une.h10.descente
    postulats: [escalier_ferme]
    roles: [president]
    journal: gazette
    priority: 4
    poids: 12.0
    when: "season <= 1 && bilan.outcome == 'descente'"
    titre: "{VILLE} : L'ESCALIER DANS L'AUTRE SENS"
    sous: "Retour à l'étage du dessous, un an avant que la porte se ferme. À l'escalier nord, le maçon n'a pas levé la tête : il avait sa marche du mois à finir."

  - id: une.h10.lanterne
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 4
    poids: 8.0
    when: "bilan.outcome == 'lanterne'"
    titre: "{VILLE} : DERNIERS, ET LA NORD CHANTE"
    sous: "Dix-huitièmes de deuxième division. Il n'y a pas d'étage en dessous, seulement la facture. Au dernier match, le virage a chanté plus fort que le stade ne pouvait le contenir."

  - id: une.h10.descente_fin
    postulats: [escalier_ferme]
    roles: [president]
    journal: echo
    priority: 4
    poids: 12.0
    when: "season == 2 && bilan.outcome == 'descente'"
    titre: "{VILLE} : LA PORTE SE FERME DERRIÈRE"
    sous: "Retour à l'étage du dessous la saison même où la première division se ferme pour toujours. Demain matin, à la buvette, l'assemblée vote l'accord."
