# Les manchettes de « La Maquette » (Histoire 5, postulat `geant_dechu`).
# Schéma : en-tête de content/unes.yaml. Deux Bilans seulement (fin de S0, fin
# de S1) : la troisième saison s'arrête au dernier match, sur une fin.
# Fraîcheur : chaque manchette de trace lit `flag('x') && journal_has('x')`.
# Aucune ne titre une montée, une descente ou un sacre : elles parlent d'un
# incendie, d'une épave, d'un téléphone, d'une maquette.
unes:
  # ============================================================ fin de S0
  - id: une.geant_dechu.feu
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 3
    poids: 3.0
    when: "flag('h5_tribune_est_brulee') && journal_has('h5_tribune_est_brulee') && !flag('h5_fonte')"
    titre: "LA TRIBUNE EST A BRÛLÉ"
    sous: "Du chêne de 1931, d'un seul bloc, une nuit de novembre. Au matin, la 14B n'existait plus. L'assurance non plus, depuis le 3."
    sujet: tribune
    photo: pr.h5.a4_feu

  - id: une.geant_dechu.feu_fonte
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 3
    poids: 3.0
    when: "flag('h5_tribune_est_brulee') && journal_has('h5_tribune_est_brulee') && flag('h5_fonte')"
    titre: "IL RESTE DEUX MOTS DE LA TRIBUNE EST"
    sous: "Du chêne de 1931, une nuit de novembre. Dans les cendres de la grille, un bout de fonte : ENFANTS DU. L'assurance avait expiré le 3."
    sujet: tribune
    photo: pr.h5.14b.grille

  - id: une.geant_dechu.oudart_garde
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h5_oudart_garde') && journal_has('h5_oudart_garde')"
    titre: "OUDART RESTE, LE FAX FINIT EN QUATRE"
    sous: "Cent mille francs de Valentienne pour le seul gardien sous contrat : refusé. Bréhaut aurait déchiré le fax lentement, devant témoin."
    sujet: president
    photo: pr.h5.ordres.jeudi

  - id: une.geant_dechu.plaque_restee
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h5_plaque_restee') && journal_has('h5_plaque_restee')"
    titre: "LA PLAQUE DE 1931 SOUS LES ÉCHARPES"
    sous: "On voulait la dévisser avant samedi, murmure la buvette. Samedi, la plaque de la grille Est était couverte d'écharpes nouées. Personne ne sait qui a commencé."
    sujet: tribune
    photo: pr.h5.ordres.plaque

  - id: une.geant_dechu.plainte_retiree
    postulats: [geant_dechu]
    roles: [president]
    journal: quotidien
    priority: 3
    when: "flag('h5_plainte_retiree') && journal_has('h5_plainte_retiree')"
    titre: "INCENDIE DE L'EST : LA PLAINTE RETIRÉE"
    sous: "Le Racing ne poursuit plus personne pour la tribune Est. Le lendemain, à neuf heures pile, la Banque Aubérivoise débloquait le compte du club."
    sujet: president

  - id: une.geant_dechu.piquets
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h5_cle_laissee') && journal_has('h5_cle_laissee')"
    titre: "DES PIQUETS ORANGE DANS LES CENDRES"
    sous: "Des géomètres sont entrés lundi dans l'Est en ruine, avec une clé. Mardi, Gégé a arraché les piquets un à un. Personne n'a porté plainte."
    sujet: tribune

  - id: une.geant_dechu.serrure
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h5_serrure_changee') && journal_has('h5_serrure_changee')"
    titre: "{NOM} CHANGE LA SERRURE DE L'EST"
    sous: "Les géomètres sont restés à la grille, lundi. Le serrurier a fait deux clés ; au club-house, on en compte trois, et personne ne dit d'où vient la troisième."
    sujet: tribune

  - id: une.geant_dechu.oudart
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h5_oudart_vendu') && journal_has('h5_oudart_vendu')"
    titre: "OUDART VENDU UN JEUDI. QUI A APPELÉ ?"
    sous: "Le seul gardien sous contrat, parti pour cent mille francs. La Gazette a une question, et pas le numéro du téléphone beige de {nom}."
    sujet: president
    photo: pr.h5.ordres.jeudi

  - id: une.geant_dechu.plaque
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h5_plaque_deposee') && journal_has('h5_plaque_deposee')"
    titre: "LA PLAQUE DE 1931 DÉVISSÉE"
    sous: "TERRAIN DONNÉ AUX ENFANTS DU QUARTIER : quatre vis, un mardi matin. Gégé a retrouvé les trous ; personne n'a retrouvé l'ordre."
    sujet: president

  - id: une.geant_dechu.caution
    postulats: [geant_dechu]
    roles: [president]
    journal: quotidien
    priority: 3
    when: "flag('h5_caution_signee') && journal_has('h5_caution_signee')"
    titre: "{NOM} MET SA MAISON SUR LA TABLE"
    sous: "La maison de {prenom} {nom} garantit le prêt du Racing. À la Banque Aubérivoise, on parle d'une formalité, en tournant sa cuillère."
    photo: pr.h5.a3_caution

  - id: une.geant_dechu.caution_refusee
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 2
    when: "flag('h5_caution_refusee') && journal_has('h5_caution_refusee')"
    titre: "{NOM} GARDE SA MAISON"
    sous: "Pas de caution, pas de prêt, et le club attend. À la Banque Aubérivoise, on dit qu'on est patient. On ne dit pas jusqu'à quand."
    photo: pr.h5.a3_caution

  - id: une.geant_dechu.mot
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h5_mot_tenu') && journal_has('h5_mot_tenu')"
    titre: "PERSONNE NE PART, ET PERSONNE N'EST PARTI"
    sous: "La craie a tenu tout l'hiver sur la porte du local. Huit cent mille francs pour le petit Tavernier : {nom} a dit non."
    sujet: mercato

  - id: une.geant_dechu.mot_rompu
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h5_mot_rompu') && journal_has('h5_mot_rompu')"
    titre: "TAVERNIER VENDU, LA CRAIE EFFACÉE"
    sous: "Le seul gamin du quartier dans le onze est parti à Valentienne. Au local du kop, il ne reste que la date, et le silence de {nom}."
    sujet: mercato

  - id: une.geant_dechu.maillot
    postulats: [geant_dechu]
    roles: [president]
    journal: quotidien
    priority: 2
    when: "flag('h5_maillot_terrasses') && journal_has('h5_maillot_terrasses')"
    titre: "LES TERRASSES SUR LA POITRINE"
    sous: "Six cent mille francs la saison, et une ligne au contrat. {prenom} {nom} n'a pas voulu dire laquelle."
    sujet: contrat

  - id: une.geant_dechu.maillot_refuse
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 2
    when: "flag('h5_maillot_refuse') && journal_has('h5_maillot_refuse')"
    titre: "LE MAILLOT DE {NOM} NE SE VEND PAS"
    sous: "Le sponsor des Terrasses a été refusé. Au virage, vingt maillots blancs, sans rien dessus, payés en liquide."
    sujet: contrat

  - id: une.geant_dechu.delai
    postulats: [geant_dechu]
    roles: [president]
    journal: quotidien
    priority: 2
    when: "flag('h5_comptes_enterres') && journal_has('h5_comptes_enterres')"
    titre: "LA LIGUE ACCORDE SIX MOIS AU RACING"
    sous: "Le délai est signé Vaubourg, daté de la veille. Personne n'a demandé à l'ancien président ce qu'il gardait à la cave du club-house."
    sujet: direction

  - id: une.geant_dechu.pret
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h5_pret_1998') && journal_has('h5_pret_1998')"
    titre: "17 H 55 : LE PRÊT REFUSÉ DE 1998"
    sous: "Un classeur sorti de la cave du club-house : la Banque Aubérivoise a dit non cinq minutes avant la fermeture. {NOM} a les copies."
    sujet: direction

  - id: une.geant_dechu.brehaut
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 2
    when: "flag('h5_brehaut_renvoye') && journal_has('h5_brehaut_renvoye')"
    titre: "BRÉHAUT VIDE SON BUREAU"
    sous: "Le directeur sportif est parti avec un carton de maillots. On lui avait promis, dit-on, un bureau dans le club d'après."
    sujet: vestiaire

  - id: une.geant_dechu.huissier
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 2
    when: "flag('h5_huissier_club') && journal_has('h5_huissier_club')"
    titre: "PASTILLES ROUGES AU SECRÉTARIAT"
    sous: "L'huissier a saisi le photocopieur et la machine à laver des maillots. Madame Josiane s'est mise devant l'escalier de {nom}."
    sujet: argent

  # ============================================================ fin de S1
  - id: une.geant_dechu.epave
    postulats: [geant_dechu]
    roles: [president]
    journal: quotidien
    priority: 3
    poids: 2.0
    when: "flag('h5_rive_voiture') && journal_has('h5_rive_voiture')"
    titre: "UNE ÉPAVE DANS LA RIVE"
    sous: "Les plongeurs des berges ont remonté une berline grise, vide, un sapin en carton au rétroviseur. Le chantier des Terrasses est gelé."
    photo: pr.h5.b1_vase

  - id: une.geant_dechu.nom_maquette
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h5_nom_laisse') && journal_has('h5_nom_laisse')"
    titre: "{NOM} BÂTIMENT SUR LA MAQUETTE"
    sous: "Dans la vitrine de l'agence Tessandier, sous le promoteur, l'entreprise {pg, select, f{de la présidente} other{du président}} du Racing. Le stade, lui, n'y est plus."
    photo: pr.h5.b2_maquette

  - id: une.geant_dechu.greve
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h5_greve_signee') && journal_has('h5_greve_signee')"
    titre: "{NOM} SIGNE LA FEUILLE DE GRÈVE"
    sous: "Vingt-quatre joueurs, trois mois sans paie, et une vingt-cinquième signature, plus grosse que les autres. On joue samedi."
    photo: pr.h5.b3_greve

  - id: une.geant_dechu.greve_payee
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 2
    when: "flag('h5_greve_payee') && journal_has('h5_greve_payee')"
    titre: "VINGT-QUATRE CHÈQUES SUR UN CAPOT"
    sous: "{prenom} {nom} a payé la grève de sa poche, un soir, sur le parking. Dembo a distribué les chèques en disant chaque nom."
    photo: pr.h5.b3_greve

  - id: une.geant_dechu.sci
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h5_sci_publiee') && journal_has('h5_sci_publiee')"
    titre: "SCI RIVE GAUCHE : DEUX NOMS ET UN TAMPON"
    sous: "La dette du Racing rachetée vingt centimes le franc. Bastide, Tessandier, et un troisième associé que L'Écho cherche encore."
    sujet: presse

  - id: une.geant_dechu.sci_deux
    postulats: [geant_dechu]
    roles: [president]
    journal: quotidien
    priority: 2
    when: "flag('h5_sci_deux') && journal_has('h5_sci_deux') && !flag('h5_sci_publiee')"
    titre: "QUI A RACHETÉ LA DETTE DE {NOM} ?"
    sous: "Une société civile, un notaire de Portclair, un mardi. Le Quotidien a deux noms et n'en publie aucun. Il attend le troisième."
    sujet: presse

  - id: une.geant_dechu.saisie
    postulats: [geant_dechu]
    roles: [president]
    journal: quotidien
    priority: 3
    poids: 2.0
    when: "flag('h5_maison_saisie') && journal_has('h5_maison_saisie')"
    titre: "L'HUISSIER CHEZ {NOM}"
    sous: "La caution de 1999 a suivi son cours. Les déménageurs ont commencé par un buffet. L'ordre portait l'en-tête d'un cabinet d'avocats."
    photo: pr.h5.b6_huissier_maison

  - id: une.geant_dechu.engins
    postulats: [geant_dechu]
    roles: [president]
    journal: quotidien
    priority: 3
    poids: 2.0
    when: "flag('h5_engins_saisis') && journal_has('h5_engins_saisis')"
    titre: "LES ENGINS DE {NOM} SAISIS"
    sous: "La Banque Aubérivoise a dénoncé les découverts de l'entreprise {pg, select, f{de la présidente} other{du président}} du Racing. Les plateaux sont partis à vingt heures."
    photo: pr.h5.b6_huissier_engins

  - id: une.geant_dechu.capot
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h5_capot') && journal_has('h5_capot')"
    titre: "VENDU SUR LE CAPOT DE {NOM}"
    sous: "Bombe rouge, lettres d'un mètre, au pochoir, au parking du stade. Au virage, on jure que ce n'est pas la Nord : « Nous, on écrit à la main. »"
    sujet: tribune
    photo: pr.h5.ev.capot

  - id: une.geant_dechu.ligne
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h5_vialat_sci') && journal_has('h5_vialat_sci')"
    titre: "LE CRÉANCIER DU RACING A UN PROJET"
    sous: "Une ligne du bilan, soulignée par la Commission des comptes : la société qui détient la dette du club a aussi des plans pour son terrain."
    sujet: instances

  - id: une.geant_dechu.clause_rompue
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h5_clause_rompue') && journal_has('h5_clause_rompue')"
    titre: "{NOM} DÉCHIRE L'ARTICLE 4"
    sous: "Le Racing n'accompagnera pas le projet des Terrasses. La pénalité coûte une saison de maillots ; au virage, la quête a payé les shorts."
    sujet: contrat
    photo: pr.h5.maillot.clause

  - id: une.geant_dechu.clause_acceptee
    postulats: [geant_dechu]
    roles: [president]
    journal: quotidien
    priority: 3
    when: "flag('h5_clause_acceptee') && journal_has('h5_clause_acceptee')"
    titre: "LE RACING ACCOMPAGNERA LES TERRASSES"
    sous: "Article 4 du contrat de maillot : le club soutient publiquement le projet urbain de la Rive. Au conseil municipal, on sait déjà comment il votera."
    sujet: contrat
    photo: pr.h5.maillot.clause

  - id: une.geant_dechu.fonds_refuse
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h5_fonds_refuse') && journal_has('h5_fonds_refuse')"
    titre: "{NOM} REFUSE VINGT MILLIONS"
    sous: "Trente pour cent du Racing et un siège au conseil : au bar de l'hôtel de la Rive, la réponse a été non. Le Cheikh Ilyas a payé les deux cafés."
    sujet: argent
    photo: pr.h5.fonds.offre

  - id: une.geant_dechu.fonds
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 3
    when: "flag('h5_fonds_ilyas') && journal_has('h5_fonds_ilyas')"
    titre: "ALMADIS ACHÈTE TRENTE POUR CENT"
    sous: "Vingt millions de francs pour un tiers du Racing, et un siège au conseil pour un homme que personne n'a jamais vu à la Rive."
    sujet: argent

  - id: une.geant_dechu.naming
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h5_naming') && journal_has('h5_naming')"
    titre: "LA RIVE S'APPELLERA ALMADIS RIVE"
    sous: "C'était page onze du contrat du fonds. Gégé l'a lue à voix haute au local, en se trompant exprès sur le nouveau nom."
    sujet: argent

  - id: une.geant_dechu.valise_refusee
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 2
    when: "flag('h5_valise_refusee') && journal_has('h5_valise_refusee')"
    titre: "TROIS MILLIONS, ET NON"
    sous: "Valentienne voulait Dembo, sous la table. {nom} a dit non, poliment, au bar de l'hôtel. Le vestiaire l'a répété en arrondissant."
    sujet: mercato

  - id: une.geant_dechu.bache
    postulats: [geant_dechu]
    roles: [president]
    journal: echo
    priority: 3
    when: "flag('h5_bache') && journal_has('h5_bache')"
    titre: "LE STADE AUX ENFANTS DU QUARTIER"
    sous: "Vingt mètres de drap, peinture bordeaux : le kop a recopié la plaque de 1931 sur une bâche, pour l'Est en ruine. {nom} a tenu un coin."
    sujet: tribune

  - id: une.geant_dechu.vallin
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 2
    when: "flag('h5_vallin_loge') && journal_has('h5_vallin_loge')"
    titre: "UNE CHAMBRE POUR DIDIER VALLIN"
    sous: "Chambre 9 de l'hôtel de la Rive, payée jusqu'en mars par {nom}. La friche dit qu'il a vu quelque chose, la nuit de l'Est."
    sujet: corps

  # ================================================ l'état du club (S0, S1)
  - id: une.geant_dechu.tient
    postulats: [geant_dechu]
    roles: [president]
    journal: quotidien
    priority: 1
    when: "bilan.tenu"
    titre: "{CLUB} TIENT, AU GREFFE"
    sous: "Rang {rang}. Objectif {tenu}. Le plan de continuation court encore, et le club avec. Le téléphone de {nom} aussi, le mardi."

  - id: une.geant_dechu.vitrine
    postulats: [geant_dechu]
    roles: [president]
    journal: gazette
    priority: 1
    when: "!bilan.tenu"
    titre: "{VILLE} REGARDE LA VITRINE"
    sous: "Rang {rang}, objectif {tenu}. À l'agence Tessandier, le stade de la maquette a encore rétréci. {nom} n'a pas commenté."
