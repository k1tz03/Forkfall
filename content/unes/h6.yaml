# Histoire 6 — « 23 h 58 » : les manchettes du Bilan (schéma : en-tête de
# content/unes.yaml). Fraîcheur : une manchette de trace lit
# `flag('x') && journal_has('x')` ; elle titre la saison où la trace est posée,
# pas trois ans plus tard. Aucune ne prétend à une montée, une descente ou un
# titre : elles parlent de ventes, de prix, de papier.
unes:
  # ---------------------------------------------------------------- Dembo
  - id: une.h6.dembo_six
    postulats: [vendre_trente]
    roles: [ds]
    journal: quotidien
    priority: 3
    when: "flag('h6_dembo_prix_fax') && journal_has('h6_dembo_prix_fax')"
    titre: "DEMBO À VALENTIENNE, SIX MILLIONS"
    sous: "À trente-sept ans, le capitaine des Aubes part au prix d'une doublure. {NOM} n'a pas commenté ; Malbec a parlé d'un « prix raisonnable », sans dire de qui il le tenait."
    photo: ds.h6.sc.valentienne

  - id: une.h6.dembo_neuf
    postulats: [vendre_trente]
    roles: [ds]
    journal: gazette
    priority: 3
    when: "flag('h6_dembo_prix_juste') && journal_has('h6_dembo_prix_juste')"
    titre: "DEMBO À VALENTIENNE, NEUF MILLIONS"
    sous: "Le capitaine vendu à son prix, après quarante minutes et deux cafés froids. À {VILLE}, on dit que {nom} a fait une soustraction que quelqu'un n'a pas aimée."

  - id: une.h6.dembo_reste
    postulats: [vendre_trente]
    roles: [ds]
    journal: echo
    priority: 3
    when: "flag('h6_dembo_reste') && journal_has('h6_dembo_reste')"
    titre: "DEMBO RESTE À LA RIVE"
    sous: "Neuf millions refusés pour un homme de trente-huit ans. Le virage a peint le chiffre sur une bâche, barré d'un trait, et {NOM} en dessous."
    react: { card: ds.h6.re.dembo_garde, if: "!seen('ds.h6.re.dembo_garde')" }

  # ---------------------------------------------------------- le petit Rancé
  - id: une.h6.tibo_vendu
    postulats: [vendre_trente]
    roles: [ds]
    journal: quotidien
    priority: 4
    when: "flag('h6_tibo_vendu') && journal_has('h6_tibo_vendu')"
    titre: "LE PETIT RANCÉ À QUATRE MILLIONS ?"
    sous: "Dix-huit ans, formé au centre, vendu à l'étranger un lundi. Massenet : « À ce prix-là, on ne vend pas, on se débarrasse. » {NOM} n'a pas rappelé."
    photo: ds.h6.sc.fax_petit

  - id: une.h6.tibo_garde
    postulats: [vendre_trente]
    roles: [ds]
    journal: echo
    priority: 3
    when: "flag('h6_tibo_garde') && journal_has('h6_tibo_garde')"
    titre: "LE PETIT RANCÉ RESTE AU CENTRE"
    sous: "Un club étranger proposait quatre millions, avant lundi. {CLUB} a laissé passer lundi. Au Terminus, on dit que le père a perdu, cette nuit-là, et qu'on a payé pour lui."

  # ------------------------------------------------------- les traces du réservoir
  - id: une.h6.mutuelle
    postulats: [vendre_trente]
    roles: [ds]
    journal: gazette
    priority: 3
    when: "flag('h6_primes_mutuelle') && journal_has('h6_primes_mutuelle')"
    titre: "LA MUTUELLE DES QUAIS PAIE EN LIQUIDE"
    sous: "Des « primes de performance » versées à la direction sportive de {CLUB}, sans déclaration. Arnaud Vaubourg : « Je ne savais pas. » La brigade financière, elle, sait lire."
    sujet: ds.h6.mutuelle

  - id: une.h6.mutuelle_refusee
    postulats: [vendre_trente]
    roles: [ds]
    journal: echo
    priority: 2
    when: "flag('h6_mutuelle_refusee') && journal_has('h6_mutuelle_refusee')"
    titre: "{NOM} RENVOIE L'ENVELOPPE"
    sous: "La Mutuelle des Quais confirme le renvoi d'une enveloppe « non ouverte ». Elle précise qu'elle reste « le sponsor fidèle des Aubes », au dos des maillots."
    sujet: ds.h6.mutuelle

  - id: une.h6.canette
    postulats: [vendre_trente]
    roles: [ds]
    journal: quotidien
    priority: 2
    when: "(flag('h6_canette_signee') && journal_has('h6_canette_signee')) || (flag('h6_canette_courte') && journal_has('h6_canette_courte'))"
    titre: "UNE CANETTE ORANGE SUR LA MANCHE"
    sous: "Le fonds de Cheikh Ilyas s'affiche sur le maillot bordeaux de {CLUB}. Au virage, on le porte à l'envers ; à la boutique, il est en rupture depuis Noël."
    sujet: ds.h6.canette

  - id: une.h6.gauche
    postulats: [vendre_trente]
    roles: [ds]
    journal: echo
    priority: 2
    when: "flag('h6_klopf_gauche') && journal_has('h6_klopf_gauche')"
    titre: "UN GAUCHE, UN VRAI"
    sous: "Vogler a eu son latéral, un pied gauche qui ne regarde pas où il va. L'entraîneur a couru jusqu'au poteau de corner pour fêter sa première passe décisive."
    sujet: ds.h6.lateral

  - id: une.h6.sans_gauche
    postulats: [vendre_trente]
    roles: [ds]
    journal: gazette
    priority: 2
    when: "flag('h6_klopf_sans_gauche') && journal_has('h6_klopf_sans_gauche')"
    titre: "VOGLER SOURIT, LE DROIT REGARDE SON PIED"
    sous: "Une saison sans latéral gauche à {VILLE}. Le vestiaire a compris le sourire de son entraîneur avant le président : ce n'était pas de la joie."
    sujet: ds.h6.lateral

  - id: une.h6.massenet
    postulats: [vendre_trente]
    roles: [ds]
    journal: gazette
    priority: 3
    when: "flag('h6_massenet_source') && journal_has('h6_massenet_source')"
    titre: "« LES PRIX SONT BAS », DIT {NOM}"
    sous: "Sur le plateau de Télé-Stade, à visage découvert, la direction sportive de {CLUB} a dit quatre mots. Massenet n'en a pas demandé un cinquième."
    sujet: ds.h6.dimanche

  - id: une.h6.montres
    postulats: [vendre_trente]
    roles: [ds]
    journal: quotidien
    priority: 2
    when: "flag('h6_montres_gardees') && journal_has('h6_montres_gardees')"
    titre: "LES MONTRES DU RECRUTEMENT"
    sous: "Un agent de joueurs offrirait une montre de plongée à chaque vente de {CLUB}. {NOM} : « Je ne plonge pas. » Le coffre du club, lui, n'a pas été ouvert."
    sujet: ds.h6.montres

  - id: une.h6.menisque
    postulats: [vendre_trente]
    roles: [ds]
    journal: echo
    priority: 2
    when: "flag('h6_doc_signe') && journal_has('h6_doc_signe')"
    titre: "UN MÉNISQUE VENDU SANS RADIO"
    sous: "Le milieu cédé cet hiver par {CLUB} ne jouera plus avant l'été. Son nouveau club « étudie ses recours ». Le Doc Sabatier a refusé de répondre."
    sujet: ds.h6.doc

  - id: une.h6.photo
    postulats: [vendre_trente]
    roles: [ds]
    journal: echo
    priority: 4
    when: "flag('h6_lea_publie') && journal_has('h6_lea_publie')"
    titre: "LA PHOTO DE 1999"
    sous: "Une enveloppe kraft, un agent, une table du Rideau Rouge, et la direction sportive de {CLUB}, quatre ans avant son contrat. Léa : « Il manque un nom. Je le cherche. »"
    sujet: ds.h6.lea

  # ------------------------------------------------------------- la saison
  - id: une.h6.fax_antenne
    postulats: [vendre_trente]
    roles: [ds]
    journal: gazette
    priority: 3
    when: "flag('h6_verite_dimanche') && journal_has('h6_verite_dimanche')"
    titre: "23 H 58"
    sous: "Massenet l'a dit à l'antenne : à {VILLE}, les ventes se décident par fax, à deux minutes de minuit, sur un papier qui ne tient pas un an. La Ligue « prend note »."

  - id: une.h6.trente
    postulats: [vendre_trente]
    roles: [ds]
    journal: quotidien
    priority: 2
    when: "vars.h6_millions >= 30"
    titre: "{CLUB} : TRENTE MILLIONS"
    sous: "La page deux du contrat de {nom} est tenue. {objectif} : {tenu}. À la Commission, Madame Vialat a demandé le détail, ligne par ligne, prix par prix."

  - id: une.h6.pas_trente
    postulats: [vendre_trente]
    roles: [ds]
    journal: gazette
    priority: 1
    when: "flag('histoire_h6')"
    titre: "ON VEND À {VILLE}"
    sous: "{CLUB} finit {rang}e. Le recrutement a vendu plus qu'il n'a acheté, et moins que ne le voulait la Ligue. {NOM} : « On ne vend pas. On équilibre. »"

  # ------------------------------------------- les traces du réservoir (suite)
  - id: une.h6.montres_rendues
    postulats: [vendre_trente]
    roles: [ds]
    journal: gazette
    priority: 2
    when: "flag('h6_montres_rendues') && journal_has('h6_montres_rendues')"
    titre: "FARDELLI REPREND SES MONTRES"
    sous: "Deux montres de plongée sont reparties dans leurs écrins, sans un mot. Rocco Fardelli jure n'avoir « rien offert » à {NOM}. Il a pourtant signé le reçu."
    sujet: ds.h6.montres

  - id: une.h6.fauteuil
    postulats: [vendre_trente]
    roles: [ds]
    journal: gazette
    priority: 2
    when: "flag('h6_massenet_muet') && journal_has('h6_massenet_muet')"
    titre: "LE FAUTEUIL VIDE DE {NOM}"
    sous: "Dimanche soir, dix secondes de gros plan sur un fauteuil : Massenet attendait {nom}, personne ne s'y est assis. Lundi, tout {ville} parlait du fauteuil."
    sujet: ds.h6.dimanche

  - id: une.h6.genou
    postulats: [vendre_trente]
    roles: [ds]
    journal: echo
    priority: 2
    when: "flag('h6_doc_refuse') && journal_has('h6_doc_refuse')"
    titre: "LE GENOU RESTE À {VILLE}"
    sous: "Le Doc Sabatier n'a pas signé ce qu'il n'avait pas vu, et la vente d'hiver est tombée. Le milieu fait sa rééducation au bord de la Rive ; {CLUB} paie."
    sujet: ds.h6.doc

  - id: une.h6.trebignac
    postulats: [vendre_trente]
    roles: [ds]
    journal: echo
    priority: 2
    when: "flag('h6_oeil_barbier') && journal_has('h6_oeil_barbier')"
    titre: "UN GAMIN DE TRÉBIGNAC AU CENTRE"
    sous: "Quinze ans, repéré un dimanche de district par Lucien Barbier, sans une colonne de chiffres. {NOM} a signé sur sa parole ; la mère était là, le père dans la voiture."
    sujet: ds.h6.gamins

  - id: une.h6.vogler_rien
    postulats: [vendre_trente]
    roles: [ds]
    journal: quotidien
    priority: 2
    when: "season == 0 && flag('h6_solvang_adverse') && journal_has('h6_solvang_adverse')"
    titre: "VOGLER PART POUR RIEN"
    sous: "Sélectionneur de la Vestrie en juin, l'entraîneur quitte {CLUB} sans un écu de dédommagement. Son agente, Ingrid Solvang : « Rien, c'est aussi un prix. »"
    sujet: ds.h6.solvang

  - id: une.h6.clause
    postulats: [vendre_trente]
    roles: [ds]
    journal: gazette
    priority: 2
    when: "season >= 1 && flag('h6_solvang_adverse') && journal_has('h6_solvang_adverse')"
    titre: "SOLVANG FAIT JOUER LA CLAUSE"
    sous: "L'agente réclame à {CLUB} ce qu'une clause lui doit, au centime. La lettre recommandée attendait {nom} sur sa chaise ; au club, on « étudie »."
    sujet: ds.h6.solvang

  - id: une.h6.fax_debranche
    postulats: [vendre_trente]
    roles: [ds]
    journal: gazette
    priority: 2
    when: "flag('h6_arnaud_allie') && journal_has('h6_arnaud_allie')"
    titre: "LE PRÉSIDENT DÉBRANCHE SON FAX"
    sous: "Arnaud Vaubourg a fait enrouler le câble de son fax, « pour qu'on cesse de me prêter des nuits ». Personne ne lui avait rien demandé. À {VILLE}, on demande maintenant."
    sujet: ds.h6.fils

  - id: une.h6.milieu
    postulats: [vendre_trente]
    roles: [ds]
    journal: echo
    priority: 2
    when: "flag('h6_vukic_soutenu') && journal_has('h6_vukic_soutenu')"
    titre: "{CLUB} : VUKIĆ A SON MILIEU"
    sous: "Un seul nom sur la liste de janvier, souligné deux fois. Le milieu est arrivé un mardi, avec un sac trop petit ; il court pour deux. Vukić ne parle toujours pas à la presse."
    sujet: ds.h6.vukic

  - id: une.h6.gamins_vukic
    postulats: [vendre_trente]
    roles: [ds]
    journal: gazette
    priority: 2
    when: "flag('h6_vukic_lache') && journal_has('h6_vukic_lache')"
    titre: "{VILLE} : VUKIĆ JOUE AVEC LES GAMINS"
    sous: "Pas de milieu en janvier : {NOM} a vendu, l'entraîneur a pioché au centre de formation. Il n'a rien dit à la presse. On dit qu'il tient une liste, au mur de son bureau."
    sujet: ds.h6.vukic

  - id: une.h6.gardien
    postulats: [vendre_trente]
    roles: [ds]
    journal: quotidien
    priority: 2
    when: "flag('h6_malbec_complice') && journal_has('h6_malbec_complice')"
    titre: "LE GARDIEN DU RACING À VALENTIENNE"
    sous: "Signé sur une nappe de l'hôtel de la Rive, avant le dessert, au prix exact que Valentienne avait en tête. Hubert Malbec salue {NOM}, « très raisonnable »."
    sujet: ds.h6.malbec

  - id: une.h6.plainte
    postulats: [vendre_trente]
    roles: [ds]
    journal: gazette
    priority: 2
    when: "flag('h6_malbec_brouille') && journal_has('h6_malbec_brouille')"
    titre: "MALBEC SE PLAINT DE {NOM}"
    sous: "Le président de Valentienne trouve la direction sportive de {CLUB} « difficile en affaires ». À la Ligue, le père Vaubourg a pris la plainte au téléphone, et l'a gardée."
    sujet: ds.h6.malbec
