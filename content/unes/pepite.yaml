# Manchettes du postulat « La pépite du club-usine » (bible ch. 10 § 8).
# Schéma et règles : en-tête de content/unes.yaml.
# Fraîcheur : chaque manchette de trace lit `flag('x') && journal_has('x')` —
# le drapeau reste vrai toute la carrière, la ligne d'Almanach, non : la Une
# ne titre pas trois ans plus tard sur une bâche oubliée.
# Aucune ne prétend à une montée, une descente ou un titre : elles parlent de
# transferts, de tribunes et de genoux, pas du classement.
unes:
  # ------------------------------------------------------------- la vente (4)
  - id: une.pepite.aller_simple
    postulats: [pepite]
    roles: [joueur]
    journal: quotidien
    priority: 4
    when: "flag('vendu_d1') && journal_has('vendu_d1')"
    titre: "{NOM}, UN ALLER SIMPLE"
    sous: "L'usine a vendu son jeune de l'année. Elle en a acheté un autre avec ; il a seize ans et une mère qui négocie."
    sujet: jp.pepite.club_usine
    photo: jp.pepite.p3_vente
    react: [ { card: co.re.josiane_a_lu, if: "relation.josiane >= 0 && !seen('co.re.josiane_a_lu')" }, { card: co.re.camille_journal } ]

  - id: une.pepite.rival
    postulats: [pepite]
    roles: [joueur]
    journal: gazette
    priority: 4
    when: "flag('parti_chez_rival') && journal_has('parti_chez_rival')"
    titre: "{NOM} CHEZ L'ENNEMI, AU CENTIME"
    sous: "La clause levée par {rival}. Gégé a décroché le nom du local ; il l'a gardé « pour le derby », roulé derrière le bar."
    sujet: jp.clause
    photo: jp.clause.rival
    react: [ { card: co.re.gege_decoupe_mur, if: "seen('co.re.gege_decoupe_1987')" }, { card: co.re.gege_decoupe_1987, if: "seen('co.re.gege_decoupe')" }, { card: co.re.gege_decoupe } ]

  # ------------------------------------------------------- la tribune (3 / 2)
  - id: une.pepite.enfant_reste
    postulats: [pepite]
    roles: [joueur]
    journal: echo
    priority: 3
    when: "flag('fidele') && flag('enfant_du_pays') && journal_has('fidele')"
    titre: "L'ENFANT DE {VILLE} RESTE AU PAYS"
    sous: "Vingt mètres de bâche, une promesse tenue. Gégé : « La tribune n'oublie rien. » Elle a repeint en doré, et souligné la phrase."
    sujet: jp.tifo
    photo: jp.tifo.bache
    react: [ { card: co.re.gege_decoupe_mur, if: "relation.gege >= 1 && seen('co.re.gege_decoupe_1987')" }, { card: co.re.gege_decoupe_1987, if: "relation.gege >= 1 && seen('co.re.gege_decoupe')" }, { card: co.re.gege_decoupe, if: "relation.gege >= 1" }, { card: co.re.camille_journal } ]

  - id: une.pepite.honnete
    postulats: [pepite]
    roles: [joueur]
    journal: echo
    priority: 2
    when: "flag('honnete_tribune') && journal_has('honnete_tribune')"
    titre: "IL N'A RIEN PROMIS. ON L'AIME QUAND MÊME"
    sous: "La Nord a gardé la bâche sans la phrase. Au micro du stade, {prenom} {nom} a dit « je ne sais pas » ; c'est rare, et ça s'entend."
    sujet: jp.tifo
    photo: jp.tifo.bache
    react: [ { card: co.re.vecchio_garde } ]

  - id: une.pepite.retour
    postulats: [pepite]
    roles: [joueur]
    journal: echo
    priority: 3
    when: "flag('retour_usine_signe') && journal_has('retour_usine_signe')"
    titre: "L'USINE LE RACHÈTE, MOINS CHER"
    sous: "Deux ans après le fax de juin, le nom revient sur la bâche. Gégé a repeint « POUR TOUJOURS », et ajouté « (BIS) » en dessous."
    sujet: jp.retour_usine
    photo: jp.retour.aulard
    react: [ { card: co.re.gege_decoupe_mur, if: "seen('co.re.gege_decoupe_1987')" }, { card: co.re.gege_decoupe_1987, if: "seen('co.re.gege_decoupe')" }, { card: co.re.gege_decoupe } ]

  - id: une.pepite.bache_pliee
    postulats: [pepite]
    roles: [joueur]
    journal: gazette
    priority: 3
    when: "flag('tifo_adieu') && journal_has('tifo_adieu')"
    titre: "{NOM} A MARQUÉ, PUIS S'EST TU"
    sous: "La Tribune Nord a applaudi un visiteur, et ça n'arrive qu'une fois. La bâche est restée pliée dans un sac, propre."
    sujet: jp.retour_usine
    photo: jp.retour.but
    react: [ { card: co.re.gege_decoupe_mur, if: "seen('co.re.gege_decoupe_1987')" }, { card: co.re.gege_decoupe_1987, if: "seen('co.re.gege_decoupe')" }, { card: co.re.gege_decoupe } ]

  # -------------------------------------------------------- le vestiaire (3)
  - id: une.pepite.plus_de_passe
    postulats: [pepite]
    roles: [joueur]
    journal: gazette
    priority: 3
    when: "flag('mouton_noir') && journal_has('mouton_noir')"
    titre: "PLUS PERSONNE NE LUI FAIT LA PASSE"
    sous: "Même au toro du mardi. Bréhaut : « Le groupe vit bien. » Sans lui, visiblement ; l'entraînement d'à côté est plus calme."
    sujet: jp.brassard_test
    photo: jp.brassard.toro
    react: [ { card: co.re.vecchio_garde } ]

  - id: une.pepite.brassard
    postulats: [pepite]
    roles: [joueur]
    journal: quotidien
    priority: 3
    when: "flag('capitaine') && journal_has('capitaine')"
    titre: "LE BRASSARD DE {VILLE} CHANGE DE BRAS"
    sous: "Le genou de Titi Bréhaut a dit stop ; lui, non. Il a serré l'épaule un peu trop fort en passant le brassard ; il l'a fait exprès."
    sujet: jp.brassard_test
    photo: jp.brassard.genou_de_titi
    react: [ { card: co.re.vecchio_garde } ]

  - id: une.pepite.deux_pepites
    postulats: [pepite]
    roles: [joueur]
    journal: echo
    priority: 2
    when: "flag('mentor_mbako') && journal_has('mentor_mbako')"
    titre: "DEUX PÉPITES À {VILLE}"
    sous: "Lian Mbako, seize ans, apprend le contrôle après l'entraînement. Sa mère « n'a besoin de personne » ; lui, si, une heure par semaine."
    sujet: co.mbako_rival
    photo: jp.mbako.mere
    react: [ { card: co.re.gege_decoupe_mur, if: "seen('co.re.gege_decoupe_1987')" }, { card: co.re.gege_decoupe_1987, if: "seen('co.re.gege_decoupe')" }, { card: co.re.gege_decoupe } ]

  # ------------------------------------------------------------ la presse (3)
  - id: une.pepite.le_meilleur
    postulats: [pepite]
    roles: [joueur]
    journal: gazette
    priority: 3
    when: "flag('special') && journal_has('special')"
    titre: "« LE MEILLEUR » : C'EST LUI QUI LE DIT"
    sous: "Première conférence, première phrase. Le vestiaire a découpé ; la phrase est en jaune, scotchée dans un casier, avec la date du but."
    sujet: jp.premiere_une
    photo: jp.une.conference
    react: [ { card: co.re.vecchio_garde } ]

  - id: une.pepite.boude
    postulats: [pepite]
    roles: [joueur]
    journal: gazette
    priority: 2
    when: "flag('banc_boude') && journal_has('banc_boude')"
    titre: "{NOM} BOUDE SUR LE BANC"
    sous: "Sur le banc, {prenom} {nom} a tapé à la porte du coach. Le coach a ouvert, écouté, refermé ; la porte est plus lourde en repartant."
    sujet: jp.banc_hiver
    photo: jp.banc.vukic
    react: [ { card: co.re.camille_journal } ]

  - id: une.pepite.loft
    postulats: [pepite]
    roles: [joueur]
    journal: echo
    priority: 2
    when: "flag('loft_tenu') && journal_has('loft_tenu')"
    titre: "{NOM} S'ENTRAÎNE AVEC LES U17"
    sous: "Le président montrait la porte des U17 sans se lever. Un gamin de dix-sept ans lui fait la passe ; il est le seul, et il ne le sait pas."
    sujet: jp.banc_hiver
    photo: jp.banc.loft
    react: [ { card: co.re.josiane_a_lu, if: "!seen('co.re.josiane_a_lu')" }, { card: co.re.camille_journal } ]

  # ------------------------------------------------------ la sélection (3 / 3)
  - id: une.pepite.bleu_cobalt
    postulats: [pepite]
    roles: [joueur]
    journal: quotidien
    priority: 3
    when: "flag('international') && journal_has('international')"
    titre: "{NOM} EN BLEU COBALT"
    sous: "Première sélection. Le club « a râlé pour la cheville » ; la Fédération, elle, « verra ça après le Congrès »."
    sujet: jp.selection
    photo: jp.selection.groupe
    react: [ { card: co.re.camille_journal } ]

  - id: une.pepite.forfait
    postulats: [pepite]
    roles: [joueur]
    journal: gazette
    priority: 3
    when: "flag('selection_refusee') && journal_has('selection_refusee')"
    titre: "FORFAIT, PUIS TITULAIRE DIMANCHE"
    sous: "La cheville allait très mal pour la Fédération et très bien pour le club. « On ne dit pas non deux fois », a noté quelqu'un, quelque part."
    sujet: jp.selection
    photo: jp.selection.retour_forfait
    react: [ { card: co.re.josiane_a_lu, if: "!seen('co.re.josiane_a_lu')" }, { card: co.re.camille_journal } ]

  # --------------------------------------------------------- l'argent (3 / 2)
  - id: une.pepite.or
    postulats: [pepite]
    roles: [joueur]
    journal: quotidien
    priority: 3
    when: "flag('exil_dore') && journal_has('exil_dore')"
    titre: "PARTI POUR L'OR"
    sous: "Le championnat du désert paie comme l'or, et le niveau reste entre eux. « Ce n'est pas un club, c'est un actif » : {NOM} en est une ligne."
    sujet: jp.exil_dore
    photo: jp.exil.nassir
    react: [ { card: co.re.camille_journal } ]

  - id: une.pepite.montre
    postulats: [pepite]
    roles: [joueur]
    journal: gazette
    priority: 2
    when: "flag('offshore') && journal_has('offshore')"
    titre: "LE COUSIN A UNE MONTRE NEUVE"
    sous: "Une société aux îles, une image à dix-neuf ans, un cousin sur le parking. Trois mois de salaire au poignet, et personne n'a rien demandé."
    sujet: jp.contrat_image
    photo: jp.image.cousin
    react: [ { card: co.re.camille_journal } ]

  - id: une.pepite.mercenaire
    postulats: [pepite]
    roles: [joueur]
    journal: gazette
    priority: 3
    when: "flag('mercenaire') && journal_has('mercenaire')"
    titre: "LE MERCENAIRE FIDÈLE DE {VILLE}"
    sous: "La page deux double la clause si le joueur reste. Le club a donc payé pour qu'il reste ; les deux mots du titre sont vrais."
    sujet: jp.clause
    photo: jp.clause.page_deux
    react: [ { card: co.re.josiane_a_lu, if: "!seen('co.re.josiane_a_lu')" }, { card: co.re.gege_decoupe_mur, if: "seen('co.re.gege_decoupe_1987')" }, { card: co.re.gege_decoupe_1987, if: "seen('co.re.gege_decoupe')" }, { card: co.re.gege_decoupe } ]

  - id: une.pepite.fax
    postulats: [pepite]
    roles: [joueur]
    journal: quotidien
    priority: 3
    when: "flag('fax_rate') && journal_has('fax_rate')"
    titre: "MORT DANS UN FAX À 23 H 59"
    sous: "La page trois s'est coincée. Josiane « en a vu passer, jamais un qui se coince ». Le fax, depuis, a été promu ; le transfert, non."
    sujet: jp.clause
    photo: jp.clause.fax
    react: [ { card: co.re.josiane_a_lu, if: "!seen('co.re.josiane_a_lu')" }, { card: co.re.camille_journal } ]

  # ------------------------------------------------------------- le corps (2)
  - id: une.pepite.genou
    postulats: [pepite]
    roles: [joueur]
    journal: echo
    priority: 2
    when: "flag('genou_opere') && journal_has('genou_opere')"
    titre: "LE GENOU DE {NOM} A PARLÉ"
    sous: "Six mois de tribune. On compte les flexions à voix haute dans la salle de kiné ; on les entend depuis la buvette, tous les matins."
    sujet: jp.genou_parle
    photo: jp.genou.plateaux
    react: [ { card: co.re.camille_journal } ]

  - id: une.pepite.dernier_mot
    postulats: [pepite]
    roles: [joueur]
    journal: quotidien
    priority: 3
    when: "flag('genou_grave') && journal_has('genou_grave')"
    titre: "LE GENOU A EU LE DERNIER MOT"
    sous: "Le Doc avait dit « tu ne sens plus rien ». C'était bien ça, le problème ; il l'a compris à l'échauffement, en courant, ce qu'il ne fait jamais."
    sujet: jp.genou_parle
    photo: jp.genou.rechute
    react: [ { card: co.re.vecchio_garde } ]

  # ------------------------------------------------------------ la maison (2)
  - id: une.pepite.bac
    postulats: [pepite]
    roles: [joueur]
    journal: echo
    priority: 2
    when: "flag('camille_bac_aidee') && journal_has('camille_bac_aidee')"
    titre: "ELLE A EU LE BAC, LUI LA D1"
    sous: "La table de la cuisine, des fiches, un ballon dessous. Il a fait réciter la philo ; l'agent a appelé, et n'a pas eu de réponse."
    sujet: jp.camille_bac
    photo: jp.bac.revision
    react: [ { card: co.re.camille_journal } ]

  - id: une.pepite.dernier_bloc
    postulats: [pepite]
    roles: [joueur]
    journal: echo
    priority: 2
    when: "flag('dernier_bloc_joue') && flag('vendu_d1') && journal_has('vendu_d1')"
    titre: "QUATRE-VINGT-DIX MINUTES, PUIS L'AVION"
    sous: "La veille de la vente, il a tout joué. Son agent regardait sa montre pendant le tour d'honneur ; il note toujours l'heure."
    sujet: jp.pepite.club_usine
    photo: jp.pepite.p2b_dernier_bloc
    react: [ { card: co.re.josiane_a_lu, if: "!seen('co.re.josiane_a_lu')" }, { card: co.re.camille_journal } ]

  # -------------------------------------------------------- vers le banc (4)
  - id: une.pepite.banc
    postulats: [pepite]
    roles: [joueur]
    journal: quotidien
    priority: 4
    when: "flag('vers_entraineur') && journal_has('vers_entraineur')"
    titre: "{NOM} PASSE SUR LE BANC"
    sous: "La réserve a un entraîneur. L'adjoint « le disait parce que personne ne le dirait » ; il l'a dit, et il avait le formulaire depuis mars."
    sujet: jp.diplome_joueur
    photo: jp.diplome.vukic
    react: [ { card: co.re.josiane_a_lu, if: "!seen('co.re.josiane_a_lu')" }, { card: co.re.vecchio_garde } ]

  # ------------------------------- les traces que rien d'autre ne relit encore
  - id: une.pepite.meme
    postulats: [pepite]
    roles: [joueur]
    journal: gazette
    priority: 2
    when: "flag('meme_assume') && journal_has('meme_assume')"
    titre: "LE POTEAU DE CORNER DE {VILLE}"
    sous: "Trois « je ne commente pas » en un mois, et une boucle qui tourne. Le club l'a imprimée sur un mug ; le mug se vend mieux que le maillot."
    sujet: jp.premiere_une
    photo: jp.une.meme
    react: [ { card: co.re.camille_journal } ]

  - id: une.pepite.image_propre
    postulats: [pepite]
    roles: [joueur]
    journal: echo
    priority: 2
    when: "flag('image_propre') && journal_has('image_propre')"
    titre: "IL A PAYÉ SES IMPÔTS, À {VILLE}"
    sous: "Le cousin est reparti aux îles avec son dossier bleu, et l'agent a gardé l'addition du restaurant, pour la déduire."
    sujet: jp.contrat_image
    photo: jp.image.cousin
    react: [ { card: co.re.camille_journal } ]

  - id: une.pepite.chambre
    postulats: [pepite]
    roles: [joueur]
    journal: echo
    priority: 2
    when: "flag('chambre_fauvel') && journal_has('chambre_fauvel')"
    titre: "LE NOUVEAU DORT AVEC LE PLUS VIEUX"
    sous: "Chez les Cobalts, la règle du groupe n'a pas bougé depuis 1971. Il a entendu le tir au but de 1990 à deux heures du matin, une fois."
    sujet: jp.selection
    photo: jp.selection.groupe
    react: [ { card: co.re.vecchio_garde } ]

  - id: une.pepite.certificat
    postulats: [pepite]
    roles: [joueur]
    journal: gazette
    priority: 3
    when: "flag('blessure_inventee') && journal_has('blessure_inventee')"
    titre: "« BLESSÉ » LE JOUR DES RECRUTEURS"
    sous: "Trois doudounes en tribune, un certificat signé sans lecture. Le Doc « ne commente pas » ; il a classé la copie dans le tiroir, pas dans le dossier."
    sujet: jp.banc_hiver
    photo: jp.banc.recruteurs
    react: [ { card: co.re.josiane_a_lu, if: "!seen('co.re.josiane_a_lu')" }, { card: co.re.camille_journal } ]

  - id: une.pepite.voiture
    postulats: [pepite]
    roles: [joueur]
    journal: echo
    priority: 2
    when: "flag('voiture_camille') && journal_has('voiture_camille')"
    titre: "LA VOITURE EST À SON NOM À ELLE"
    sous: "Une prime de transfert, une carte grise, et une fac à quatre cents kilomètres. Elle apprend à conduire dessus ; elle conduit mal six mois."
    sujet: jp.camille_bac
    photo: jp.bac.resultats
    react: [ { card: co.re.camille_journal } ]

  - id: une.pepite.bilan
    postulats: [pepite]
    roles: [joueur]
    journal: quotidien
    priority: 3
    when: "flag('bilan_arrondi') && journal_has('bilan_arrondi')"
    titre: "LE BILAN DE {NOM}, ARRONDI"
    sous: "Deux dossiers, un propre et un qui boite. Le club acheteur a reçu le propre ; son kiné a compris en six mois, tous les matins."
    sujet: jp.genou_parle
    photo: jp.genou.visite
    react: [ { card: co.re.josiane_a_lu, if: "!seen('co.re.josiane_a_lu')" }, { card: co.re.camille_journal } ]

  - id: une.pepite.desert
    postulats: [pepite]
    roles: [joueur]
    journal: gazette
    priority: 2
    when: "flag('camille_reste') && journal_has('camille_reste')"
    titre: "QUATRE HEURES DE DÉCALAGE"
    sous: "Deux billets d'avion, un seul rempli. On s'appelle à des heures qui ne sont les bonnes pour personne ; le téléphone sonne dans le vide, souvent."
    sujet: jp.exil_dore
    photo: jp.exil.camille
    react: [ { card: co.re.camille_journal } ]

  - id: une.pepite.deux_diplomes
    postulats: [pepite]
    roles: [joueur]
    journal: echo
    priority: 2
    when: "flag('brehaut_diplome') && journal_has('brehaut_diplome')"
    titre: "DEUX DIPLÔMÉS, UNE SEULE RÉSERVE"
    sous: "Titi Bréhaut a passé le même stage la même année. Adjoint, ou rival : le président choisira celui qui coûte le moins."
    sujet: jp.diplome_joueur
    photo: jp.diplome.brehaut
    react: [ { card: co.re.vecchio_garde } ]
