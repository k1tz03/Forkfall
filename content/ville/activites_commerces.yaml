    texte: "Tu paies les cafés des conseillers avant la séance du budget. Personne ne te remercie à voix haute ; l'adjoint aux sports lève sa tasse d'un centimètre."
    textes:
      - "Tu paies les cafés des conseillers avant la séance du budget. Personne ne te remercie à voix haute ; l'adjoint aux sports lève sa tasse d'un centimètre."
      - "Au comptoir, tu parles de la tribune qui fuit, sans rien demander. Le conseiller aux finances te répond par le prix de la cantine. C'est une réponse, aussi."
      - "Le garçon t'apporte l'addition d'office. Un conseiller de l'opposition paie quand même la sienne, pièce par pièce, devant tout le monde."
    tranches: 1
    francs: -40
    heures: [matin]
    jauges: {caisse: 1}

