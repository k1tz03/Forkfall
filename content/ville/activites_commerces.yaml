  # ═════════════════════════════════════════ LE CAFÉ DE LA MAIRIE (cafe_mairie)
  # Du matin au soir. Le comptoir (le café de ville.yaml s'y attache aussi), les
  # journaux, la télé, le flipper, la vitre sur la place.
  - id: cafe_conseillers
    lieu: cafe_mairie
    habitude: comptoir
    objet: comptoir
    label: "Écouter les conseillers"
    texte: "Au comptoir, trois conseillers municipaux boivent un crème avant la séance. Ils parlent du rond-point, puis du stade, puis du rond-point. Le stade coûte plus cher."
    textes:
      - "Au comptoir, trois conseillers municipaux boivent un crème avant la séance. Ils parlent du rond-point, puis du stade, puis du rond-point. Le stade coûte plus cher."
      - "Le garçon pose ta tasse à côté d'un dossier oublié, « Budget primitif ». Personne ne vient le reprendre. Tu ne l'ouvres pas ; le garçon le range sous le comptoir."
      - "Un adjoint au maire te serre la main au-dessus des tasses et dit : « Je ne vous ai pas vu ce matin. » Il le dit gentiment, comme on rend service."
      - "On parle de l'éclairage du stade : un projecteur sur quatre pendant le dernier match. Un conseiller accuse le budget ; un autre, un rat. Les deux ont raison."
    tranches: 1
    francs: -6
    heures: [matin]

  - id: cafe_cafes_conseil
    lieu: cafe_mairie
    habitude: travail
    objet: comptoir
