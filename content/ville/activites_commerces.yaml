      - "Un lycéen te cède sa partie gratuite d'un coup de menton et repart avec son cartable. Il te regardait jouer depuis la vitre."
      - "Le fronton a pâli au soleil de la place. On devine encore un gardien qui plonge, le ballon toujours un peu trop loin de ses mains."
