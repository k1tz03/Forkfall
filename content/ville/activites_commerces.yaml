    texte: "Un mariage sort de la mairie sous le riz. La mariée porte une écharpe du club par-dessus sa robe ; sa mère fait semblant de ne pas la voir."
    textes:
      - "Un mariage sort de la mairie sous le riz. La mariée porte une écharpe du club par-dessus sa robe ; sa mère fait semblant de ne pas la voir."
      - "Le photographe fait poser la noce devant la fontaine. Un oncle aperçoit la vitre, te reconnaît et réclame une photo avec toi. La mariée attend, le bouquet contre la hanche."
      - "Deux mariages se suivent à vingt minutes. Les familles se croisent sur les marches, chacune avec les écharpes de son club. Personne ne s'arrête ; tout le monde se retourne."
