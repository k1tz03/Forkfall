    textes:
      - "La Gazette Rose traîne sur une banquette, ouverte page trois. « Vu au parking » : une voiture, une plaque floutée, un club qu'on reconnaît quand même. Pas le tien, cette semaine."
      - "« Le Rosé » note les présidents sur vingt, comme à l'école. Celui du club a dix ; l'an dernier, douze. Un retraité a entouré la note au stylo et écrit : « bien fait »."
      - "Dans « Le carnet noir », ceux qui vont sauter avant Noël. Tu lis les noms trop vite, puis lentement. Au comptoir, on te regarde lire dans le miroir."
      - "Le café ne l'achète pas : un client la laisse chaque matin, toujours le même, qui la lit cachée derrière L'Écho."
