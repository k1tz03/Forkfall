# LA VIE DES COMMERCES — ce qu'on fait dans les cafés, les tabacs, les boutiques
# et les lieux de nuit d'Aubérive, objet par objet (docs/histoires/scenes_jouees.md § 5).
#
# « Les phases sans histoires sont trop vides ; dans Punch Club il y a plein de
# choses à faire partout. » (le porteur du projet)
#
# Douze pièces : le Corner, la brasserie du Pont, le café de la Mairie, le
# Terminus, l'arrière-salle (le tripot), le Rideau Rouge, le tabac du Quai, le
# tabac-presse du carrefour, la maison de la presse, la boulangerie, l'épicerie,
# Aux Immortelles. Chaque objet de chaque pièce porte au moins une activité.
#
# Ce qu'il faut savoir avant d'ajouter une ligne :
# - `francs` : en francs de 1990 (la ville applique l'inflation, puis l'écu).
#   Aucune somme n'est écrite dans un texte : l'affichage change d'époque.
# - `textes` : les variantes tournent sans regarder l'année ni le rôle. Une
#   activité sans `si` d'époque n'a que des textes intemporels ; un objet daté
#   (le quarante-cinq tours, l'ardoise des cotes, le flux) vit dans une activité
#   qui porte sa condition d'année. Aucun accord sur le héros (il peut être une
#   femme) ; aucune adresse genrée.
# - les jeux (`jeu`) : ville.js remplace le texte par la phrase du jeu ; les
#   variantes sont écrites comme une mise en place (qui est là, le geste, la
#   mise), pour pouvoir précéder le résultat. Le 421 et les cartes paient la
#   mise ; les autres jeux coûtent leur pièce. Les jauges d'un jeu ne bougent
#   que sur une victoire.
# - la télé (`tele`) et le journal (`journal`) ajoutent leur texte après la
#   variante : celle-ci pose le lieu et s'arrête sur un point.
# - `tranches: 1` est refusé la nuit (« Il est trop tard ») : au tripot et au
#   Rideau Rouge, ce qui se fait la nuit prend `tranches: 0`.
# - les petits boulots (`francs` positif, `max_jour: 1`) sont pour le joueur des
#   divisions d'en bas : une vedette ne livre pas le pain.
# - les jauges : rarement, ±1 ou ±2, là où le geste les bouge vraiment. Pour
#   chaque rôle, `direction` est celui à qui l'on rend des comptes (le
#   président, le club, les actionnaires, la Fédération) : ce qu'on fait au
#   tripot finit toujours par lui revenir.
activites:

  # ═════════════════════════════════════════════════════════ LE CORNER (bar)
  # Midi, après-midi, soir. Le comptoir, le flipper, la télé des résultats, la
  # cible, le juke-box, la piste de 421.
  - id: bar_demi
    lieu: bar
    habitude: comptoir
    objet: comptoir
    label: "Un demi au comptoir"
    texte: "Le patron tire le demi en penchant le verre, racle la mousse à la spatule et glisse une soucoupe dessous. Au bout du zinc, deux habitués refont la défense de samedi avec des sous-bocks."
    textes:
      - "Le patron tire le demi en penchant le verre, racle la mousse à la spatule et glisse une soucoupe dessous. Au bout du zinc, deux habitués refont la défense de samedi avec des sous-bocks."
      - "Au comptoir, on parle de la pelouse de la Rive qui jaunit dès septembre. Quand tu te retournes, on se tait ; quand tu bois, on reprend, un ton plus bas."
      - "Une table de livreurs déjeune vite, les clés des camions à côté des assiettes. L'un d'eux te reconnaît, lève son verre de loin, et ne vient pas plus près."
      - "Le patron pose le demi sans attendre la commande. Il essuie le zinc là où il n'y a rien et dit seulement : « Samedi, il faudra marquer les premiers. Derrière, ils ne savent pas courir. »"
    tranches: 1
    francs: -10

  - id: bar_defaite
    lieu: bar
    habitude: comptoir
    objet: comptoir
    si: "serie_d >= 2"
    label: "Un demi au fond de la salle"
    texte: "Tu prends la table du fond, dos au mur. Le patron apporte le demi lui-même, pour que personne n'ait à se lever. Au comptoir, on parle de la météo depuis trois semaines."
    textes:
      - "Tu prends la table du fond, dos au mur. Le patron apporte le demi lui-même, pour que personne n'ait à se lever. Au comptoir, on parle de la météo depuis trois semaines."
      - "Le calendrier des matchs a disparu du mur. À sa place, la réclame d'un garage. Le patron dit qu'il était tombé. Personne ne l'a vu tomber."
      - "Deux habitués de la Nord fixent la télé éteinte. Le troisième vient poser la main sur ton épaule, une seconde, sans un mot, et retourne à son verre."
      - "Le patron baisse le son de la télé à chaque résumé. « Ce n'est pas pour toi. C'est pour eux. Ils ont payé leur abonnement ; ils n'ont pas envie de payer deux fois. »"
    tranches: 1
    francs: -10

  - id: bar_victoire
    lieu: bar
    habitude: comptoir
    objet: comptoir
    si: "serie_v >= 2"
    label: "Trinquer avec le comptoir"
    texte: "Ton demi est payé avant que tu entres : le patron montre du menton trois hommes en écharpe. Ils lèvent leur verre en même temps, comme on le fait en tribune."
    textes:
      - "Ton demi est payé avant que tu entres : le patron montre du menton trois hommes en écharpe. Ils lèvent leur verre en même temps, comme on le fait en tribune."
      - "Le fanion du club est revenu au-dessus de la caisse, à côté de la licence. Il a passé l'hiver plié en quatre dans un tiroir ; on voit encore les plis."
      - "Un vieux de la Nord entonne le premier couplet, faux, et s'arrête au refrain : il ne se souvient plus de la suite. Tout le bar la lui souffle."
      - "Le patron sort la bouteille qu'il garde sous le comptoir pour les bonnes semaines. Il en verse un fond à chacun, à toi en dernier, et la range avant qu'on lui en redemande."
    tranches: 1
    francs: 0

  - id: bar_tournee_gars
    lieu: bar
    habitude: largesse
    objet: comptoir
    roles: [joueur]
    label: "Une tournée pour les gars"
    texte: "Six demis, deux diabolos pour ceux qui jouent samedi. Le plus ancien du groupe compte les verres, puis trinque le dernier, comme il l'a toujours fait."
    textes:
      - "Six demis, deux diabolos pour ceux qui jouent samedi. Le plus ancien du groupe compte les verres, puis trinque le dernier, comme il l'a toujours fait."
      - "Les gars arrivent par deux, les cheveux encore mouillés de la douche. Tu paies avant qu'ils commandent ; le plus jeune dit merci deux fois, pour être sûr."
      - "Le patron pousse deux tables l'une contre l'autre. À dix heures, on parle de tout sauf du match ; à onze, on ne parle plus que du match. Tu règles sans lire l'addition."
      - "Le gardien arrive le dernier, commande une eau gazeuse et la boit à petites gorgées, comme une bière. Il repart avant tout le monde : à son âge, dit-il, la nuit compte double."
    tranches: 1
    francs: -120
    heures: [soir]
    jauges: {vestiaire: 2}

  - id: bar_coach_soir
    lieu: bar
    habitude: comptoir
    objet: comptoir
    roles: [entraineur]
    label: "Passer voir tes joueurs"
    texte: "Tu entres au Corner un jeudi, sans prévenir. Au fond, quatre de tes joueurs reposent leurs verres ensemble, comme à l'entraînement. L'un d'eux trouve soudain sa montre très intéressante."
    textes:
      - "Tu entres au Corner un jeudi, sans prévenir. Au fond, quatre de tes joueurs reposent leurs verres ensemble, comme à l'entraînement. L'un d'eux trouve soudain sa montre très intéressante."
      - "Tu bois ton demi au comptoir, dos à la salle. Dans le miroir, entre les bouteilles, tu regardes les remplaçants se lever et partir par deux, sans bruit."
      - "Le patron te sert et montre la table du fond du menton : « Ils sont là depuis neuf heures. Le petit en est à son troisième. Je ne dis rien. Je compte. »"
      - "Ton capitaine vient s'accouder près de toi, son verre à la main. « Tu veux que je les renvoie ? Je peux. Mais demain, c'est toi qu'ils regarderont de travers, pas moi. »"
    tranches: 1
    francs: -10
    heures: [soir]
    jauges: {vestiaire: -1, direction: 1}

  - id: bar_service
    lieu: bar
    habitude: quartier
    objet: comptoir
    roles: [joueur]
    si: "division >= 2"
    label: "Un service derrière le bar"
    texte: "Le patron te noue son tablier dans le dos : « Les demis à gauche, le reste à droite, et pas de crédit. » À minuit, tes manches sentent le houblon et ta poche, le pourboire."
    textes:
      - "Le patron te noue son tablier dans le dos : « Les demis à gauche, le reste à droite, et pas de crédit. » À minuit, tes manches sentent le houblon et ta poche, le pourboire."
      - "Tu rinces les verres, tu remplis les ramequins de cacahuètes. Un client demande si c'est pour un pari ; tu réponds que c'est pour le loyer. Il laisse toute sa monnaie."
      - "Vendredi, le Corner est plein. Trois habitués de la Nord commentent ton dernier match devant toi, comme si le comptoir te rendait invisible. Tu remets leur tournée sans rien dire."
      - "À la fermeture, le patron compte la caisse, en sort quelques billets et les glisse sous la soucoupe de ton café : « Reviens jeudi. Le jeudi, je suis tout seul. »"
    tranches: 1
    francs: 150
    heures: [soir]
    max_jour: 1
    jauges: {tribunes: 1}

  - id: bar_flipper
    lieu: bar
    habitude: comptoir
    objet: flipper
    si: "!possede(flipper)"
    label: "Une partie de flipper"
    texte: "La pièce tombe, le compteur se remet à zéro dans un bruit de crécelle. Le patron, sans lever les yeux de son journal : « Le batteur gauche colle un peu. Tape-le. »"
    textes:
      - "La pièce tombe, le compteur se remet à zéro dans un bruit de crécelle. Le patron, sans lever les yeux de son journal : « Le batteur gauche colle un peu. Tape-le. »"
      - "Un gamin du quartier se poste derrière toi pour regarder. Il compte les billes perdues à voix basse, sur ses doigts, sans se moquer."
      - "La vitre est rayée à l'endroit où chacun pose la paume. Tu poses la tienne au même endroit, et tu attends la bille."
      - "Les lampes du fronton clignotent pour personne. Au comptoir, on parie un demi sur ta deuxième bille ; le patron prend les paris sans les noter."
    tranches: 0
    francs: -5
    jeu: flipper

  - id: bar_flipper_vendu
    lieu: bar
    habitude: comptoir
    objet: flipper
    si: "possede(flipper)"
    label: "Là où était le flipper"
    texte: "Quatre carrés plus clairs sur le carrelage, à l'endroit des pieds. Le patron y a posé une plante verte qui ne pousse pas, et qu'il arrose quand même."
    textes:
      - "Quatre carrés plus clairs sur le carrelage, à l'endroit des pieds. Le patron y a posé une plante verte qui ne pousse pas, et qu'il arrose quand même."
      - "Un habitué demande s'il tient le coup, chez toi. Tu réponds que oui. Il hoche la tête, comme on prend des nouvelles d'un vieil ami placé en maison de retraite."
      - "Au mur, le patron a punaisé le record du flipper, au feutre sur un papier jauni : le nom d'un garçon du quartier, parti au service militaire en 1979."
    tranches: 0
    francs: 0

  - id: bar_tele
    lieu: bar
    habitude: comptoir
    objet: tele
    label: "Les résultats à la télé"
    texte: "Un café, la télé du coin. Le patron monte le son avec le manche du balai quand les résultats arrivent, puis le baisse pour qu'on entende ceux qui commentent."
    textes:
      - "Un café, la télé du coin. Le patron monte le son avec le manche du balai quand les résultats arrivent, puis le baisse pour qu'on entende ceux qui commentent."
      - "Trois hommes au comptoir regardent l'écran comme on regarde partir un train qu'on a raté. Le patron garde la télécommande dans la poche de son tablier."
      - "L'image saute chaque fois que le frigo se met en route. Tout le bar se penche vers l'écran pour lire le bandeau du bas."
      - "Une étiquette est collée sur le poste : « Pas de feuilleton avant le dernier résultat. » La serveuse attend le sien, les bras croisés."
    tranches: 1
    francs: -6
    heures: [aprem, soir]
    special: tele

  - id: bar_dimanche_soir
    lieu: bar
    habitude: comptoir
    objet: tele
    si: "annee >= 1994 && annee < 2024"
    label: "Le match du dimanche soir"
    texte: "Le patron a pris l'abonnement de Télé-Stade pour les dimanches. Vingt personnes debout devant un écran fait pour quatre, et des demis qui passent de main en main au-dessus des têtes."
    textes:
      - "Le patron a pris l'abonnement de Télé-Stade pour les dimanches. Vingt personnes debout devant un écran fait pour quatre, et des demis qui passent de main en main au-dessus des têtes."
      - "Capitale FC joue à l'extérieur. Tout le bar est contre eux sans s'être concerté. Au premier but de la Capitale, quelqu'un éteint le poste ; le patron le rallume en soupirant."
      - "À la mi-temps, les réclames passent dans un silence d'église. Au fond, un homme calcule à voix haute ce que coûte une minute d'antenne, puis ce que gagne le club en un an."
      - "Le consultant de Télé-Stade parle d'un joueur croisé en août, ici, à la Rive. Le bar se tourne vers toi pour vérifier. Tu ne dis rien ; on le prend pour un oui."
    tranches: 1
    francs: -10
    jours: [dim]
    heures: [soir]

  - id: bar_flux
    lieu: bar
    habitude: comptoir
    objet: tele
    si: "annee >= 2024"
    label: "Le match du soir en flux"
    texte: "Le patron a branché son téléphone sur le grand écran. L'image arrive avec dix secondes de retard : le bar entend les klaxons de la rue avant de voir le but."
    textes:
      - "Le patron a branché son téléphone sur le grand écran. L'image arrive avec dix secondes de retard : le bar entend les klaxons de la rue avant de voir le but."
      - "Il faut un code pour regarder. Le patron le connaît par cœur, le tape avec deux doigts et cache le clavier de l'autre main, comme au distributeur."
      - "Sur l'écran, les statistiques défilent plus vite que le ballon. Un habitué demande qu'on les enlève ; personne au Corner ne sait comment."
      - "À la mi-temps, l'écran propose de parier sur le prochain corner. Le patron coupe le son. « Chez moi, on parie au comptoir, à l'ancienne, ou on ne parie pas. »"
    tranches: 1
    francs: -10
    jours: [dim]
    heures: [soir]

  - id: bar_flechettes
    lieu: bar
    habitude: comptoir
    objet: flechettes
    label: "Une partie de fléchettes"
    texte: "La cible est accrochée à côté du calendrier des pompiers. Autour, les trous dans le plâtre racontent les soirs de défaite."
    textes:
      - "La cible est accrochée à côté du calendrier des pompiers. Autour, les trous dans le plâtre racontent les soirs de défaite."
      - "Trois fléchettes aux ailettes recollées au ruban adhésif. Un habitué te les tend par la pointe, comme on tend des ciseaux à un enfant."
      - "Le patron tient les comptes à la craie, sur l'ardoise des sandwichs, juste sous le prix du jambon-beurre."
      - "Le plus vieux du bar lance sans viser, en parlant d'autre chose, et met dans le mille. Il te passe les fléchettes : « Doucement du poignet. Le reste suit. »"
    tranches: 0
    francs: -10
    jeu: flechettes

  - id: bar_flechettes_equipe
    lieu: bar
    habitude: comptoir
    objet: flechettes
    roles: [entraineur, joueur]
    label: "Une partie avec l'équipe"
    texte: "Le jeudi soir, les gars se retrouvent à la cible. On joue par lignes, la défense contre l'attaque ; le gardien compte les points, parce que personne d'autre ne sait."
    textes:
      - "Le jeudi soir, les gars se retrouvent à la cible. On joue par lignes, la défense contre l'attaque ; le gardien compte les points, parce que personne d'autre ne sait."
      - "Le perdant porte les plots à la séance de vendredi. C'est écrit à la craie sur le côté de la cible depuis trois saisons, et personne n'a jamais osé l'effacer."
      - "On te fait une place chez les défenseurs. Ils lancent comme ils taclent : tard, fort, et en s'excusant après."
    tranches: 0
    francs: -10
    heures: [soir]
    jeu: flechettes
    jauges: {vestiaire: 1}

  - id: bar_jukebox
    lieu: bar
    habitude: comptoir
    objet: jukebox
    si: "annee < 2000"
    label: "Mettre une chanson"
    texte: "Le juke-box avale la pièce et hésite. Le bras va chercher un quarante-cinq tours au fond : un slow de l'été 1984 que tout le bar connaît par cœur et que personne n'avoue."
    textes:
      - "Le juke-box avale la pièce et hésite. Le bras va chercher un quarante-cinq tours au fond : un slow de l'été 1984 que tout le bar connaît par cœur et que personne n'avoue."
      - "B12, au hasard. C'est l'air que la Nord chantait debout, avant les sièges. Au fond, deux vieux posent leurs verres et attendent la fin pour les reprendre."
      - "Une étiquette est collée sur la touche C7 : « Pas après minuit. » Tu appuies sur C6, par prudence. C'est un accordéon."
      - "Une chanson à texte, une voix qui traîne. La serveuse fredonne en essuyant les verres, et s'arrête net quand elle voit que tu la regardes."
    tranches: 0
    francs: -5

  - id: bar_jukebox_ecran
    lieu: bar
    habitude: comptoir
    objet: jukebox
    si: "annee >= 2000"
    label: "Choisir une chanson"
    texte: "Le vieux juke-box a été vidé de ses disques et rempli d'un écran. Il connaît des milliers de chansons ; le Corner en écoute toujours les quatre mêmes."
    textes:
      - "Le vieux juke-box a été vidé de ses disques et rempli d'un écran. Il connaît des milliers de chansons ; le Corner en écoute toujours les quatre mêmes."
      - "Tu fais défiler les titres du bout du doigt. Quelqu'un a déjà payé six chansons de la même chanteuse ; ton tour viendra après minuit."
      - "Le chant de la Nord est au catalogue, enregistré un soir de victoire. On entend le vent dans le micro, et un homme qui chante faux juste devant."
    tranches: 0
    francs: -5

  - id: bar_421
    lieu: bar
    habitude: jeu
    objet: des
    label: "Un 421 pour la tournée"
    texte: "Le patron sort la piste de feutre vert et le gobelet de cuir, usé à l'endroit du pouce. « La tournée, comme d'habitude ? »"
    textes:
      - "Le patron sort la piste de feutre vert et le gobelet de cuir, usé à l'endroit du pouce. « La tournée, comme d'habitude ? »"
      - "Trois dés d'os jauni. Au Corner, le perdant paie la tournée : c'est une loi plus vieille que le patron, et que le bar."
      - "Tu secoues le gobelet contre ton oreille, comme les habitués. Ça ne sert à rien. Ils le font tous quand même."
      - "Un livreur te défie entre deux tournées, les clés du camion posées sur la piste. Il joue vite, en regardant l'heure."
    tranches: 0
    francs: -20
    jeu: des

  - id: bar_421_nord
    lieu: bar
    habitude: jeu
    objet: des
    roles: [entraineur, joueur]
    label: "Le 421 contre la Nord"
    texte: "La table des anciens de la Nord t'invite d'un signe. Le gobelet circule ; on mise plus gros qu'au comptoir, parce qu'on joue contre quelqu'un du stade."
    textes:
      - "La table des anciens de la Nord t'invite d'un signe. Le gobelet circule ; on mise plus gros qu'au comptoir, parce qu'on joue contre quelqu'un du stade."
      - "Le doyen de la Nord glisse sa mise sous le cendrier et te tend le gobelet. « Si tu gagnes, on chante ton nom samedi. Si tu perds, on le chante quand même, mais moins bien. »"
      - "Ils jouent en silence, comme on joue aux cartes à une veillée. Entre deux lancers, un homme parle de la finale de 1974 sans que personne le lui ait demandé."
    tranches: 0
    francs: -50
    heures: [soir]
    jeu: des
    jauges: {tribunes: 1}

  # ═════════════════════════════════════════════ LA BRASSERIE DU PONT (brasserie)
  # Midi et soir. L'ardoise (le plat du jour de ville.yaml s'y attache aussi), la
  # caisse, la photo des champions de 1962, le passe-plat, les banquettes.
  - id: brasserie_dimanche
    lieu: brasserie
    habitude: luxe
    objet: ardoise
    label: "Le menu du dimanche"
    texte: "Poulet rôti, gratin, île flottante. Les familles sortent de la messe de Saint-Aubin ; un petit garçon en costume te regarde manger pendant tout le repas, la fourchette en l'air."
    textes:
      - "Poulet rôti, gratin, île flottante. Les familles sortent de la messe de Saint-Aubin ; un petit garçon en costume te regarde manger pendant tout le repas, la fourchette en l'air."
      - "Le dimanche, l'ardoise ne change pas. Selon le patron, c'est la seule chose de la ville qui n'ait jamais perdu un match."
      - "Une grand-mère paie pour toute la tablée et laisse la monnaie. En sortant, elle s'arrête à ta table : « Mon mari ne ratait pas un match. Il aurait eu un avis sur vous. »"
      - "La salle sent le beurre et le vin chaud. Au fond, quatre anciens de la réserve se partagent un baba au rhum et un match de 1971, but par but."
    tranches: 1
    francs: -90
    jours: [dim]
    heures: [midi]

  - id: brasserie_avant_match
    lieu: brasserie
    habitude: travail
    objet: ardoise
    roles: [entraineur]
    label: "Le repas d'avant-match"
    texte: "Pâtes, jambon blanc, eau plate. Tu as fait retirer le pain des tables ; le patron l'a remis à la tienne, par habitude. Au bout de la tablée, le plus jeune ne touche pas à son assiette."
    textes:
      - "Pâtes, jambon blanc, eau plate. Tu as fait retirer le pain des tables ; le patron l'a remis à la tienne, par habitude. Au bout de la tablée, le plus jeune ne touche pas à son assiette."
      - "Vingt couverts dans la salle du fond, le rideau tiré. Tu parles cinq minutes, debout, une main sur le dossier d'une chaise. Personne ne mange pendant que tu parles."
      - "Le patron pose la note du vendredi près de ton verre, retournée. « Le club, la semaine prochaine. » Il ne le dit pas comme un reproche ; il le dit comme une prière."
      - "Au dessert, interdit, le capitaine fait passer une seule part de tarte de main en main sous la table. Chacun en prend une bouchée. Tu regardes ailleurs."
    tranches: 1
    francs: 0
    jours: [ven]
    heures: [soir]
    jauges: {vestiaire: 1}

  - id: brasserie_avant_match_joueur
    lieu: brasserie
    habitude: travail
    objet: ardoise
    roles: [joueur]
    label: "Le repas d'avant-match"
    texte: "Pâtes, jambon blanc, eau plate. Le coach a fait retirer le pain des tables. Ton voisin en a caché un morceau dans sa serviette ; il le partage avec toi sous la nappe."
    textes:
      - "Pâtes, jambon blanc, eau plate. Le coach a fait retirer le pain des tables. Ton voisin en a caché un morceau dans sa serviette ; il le partage avec toi sous la nappe."
      - "Vingt couverts dans la salle du fond. Le coach parle cinq minutes, debout. Tu regardes ta fourchette, comme les autres, pour ne pas croiser ses yeux au mauvais moment."
      - "Le plus jeune du groupe ne mange rien. Tu lui racontes ton premier match, le ballon que tu as raté devant le but. Il finit son assiette sans s'en rendre compte."
      - "Au dessert, interdit, une seule part de tarte passe de main en main sous la table. Chacun en prend une bouchée. Le coach regarde ailleurs, exprès."
    tranches: 1
    francs: 0
    jours: [ven]
    heures: [soir]
    jauges: {vestiaire: 1}

  - id: brasserie_anciens
