    textes:
      - "Les journaux pendent à leurs baguettes de bois, près du portemanteau. Tu prends L'Écho avant le retraité qui l'attend depuis l'ouverture. Il te le laisse, avec un regard."
      - "Un café, les pages des sports froissées par ceux d'avant. Quelqu'un a fait les mots croisés au stylo et s'est trompé partout ; le reste se lit."
      - "Le garçon pose le journal plié près de ta tasse, à la page qui compte. Il l'a lue avant toi : il souligne toujours une phrase au crayon, pour qu'on la trouve."
      - "Tu déplies le journal sur le guéridon de marbre, entre deux ronds de tasse."
