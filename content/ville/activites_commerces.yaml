    textes:
      - "L'homme du bout du comptoir ne bouge pas de son tabouret. Tu lui paies un verre ; il le boit sans remercier, puis il dit l'heure du dernier car pour Valdorne. Tu ne lui as rien demandé."
      - "Le tabouret du bout est vide, pour une fois. Tu t'y assois. Le patron regarde la porte, puis toi : « Il revient dans dix minutes. Il revient toujours dans dix minutes. »"
      - "Il parle sans tourner la tête, à ton reflet dans la glace. « Il y a des enveloppes qui partent d'ici le vendredi soir. Pas pour moi. Je dis juste qu'elles partent. »"
      - "Il connaît le nom de tous les chauffeurs, de toutes les lignes, de tous les arrêts sans abri. Le tien, il ne le connaît pas, dit-il. Il le dit trop vite."
    tranches: 1
    francs: -12

  - id: terminus_horaires
    lieu: terminus
    habitude: quartier
    objet: horaires
    label: "Lire les horaires des cars"
    texte: "Les horaires sont punaisés près de la porte, cornés, raturés au stylo. Valdorne, six heures dix. Portclair, sept heures vingt-cinq. Le dernier pour Montbéliac a été barré et réécrit trois fois."
    textes:
      - "Les horaires sont punaisés près de la porte, cornés, raturés au stylo. Valdorne, six heures dix. Portclair, sept heures vingt-cinq. Le dernier pour Montbéliac a été barré et réécrit trois fois."
      - "Sous les horaires, quelqu'un a ajouté au feutre : « Car du club, samedi, départ quand ils sont prêts. » Personne n'a jamais su qui l'avait écrit."
      - "Un horaire est entouré en rouge : le car de nuit pour la capitale, le dimanche à vingt-trois heures. Le patron l'appelle le car des joueurs qu'on ne revoit pas."
      - "Une carte postale de Roquemont est punaisée au milieu des horaires, à l'envers. Au dos, trois mots : « Bien arrivé. Rien. »"
    tranches: 0
    francs: 0

  - id: terminus_soute
    lieu: terminus
    habitude: quartier
    objet: horaires
    roles: [joueur]
    si: "division >= 2"
    label: "Charger la soute du car"
    texte: "Six heures, la soute du car de Valdorne grande ouverte. Tu charges les colis, les valises, un vélo d'enfant. Le chauffeur te paie d'un billet roulé et d'un café au comptoir."
    textes:
      - "Six heures, la soute du car de Valdorne grande ouverte. Tu charges les colis, les valises, un vélo d'enfant. Le chauffeur te paie d'un billet roulé et d'un café au comptoir."
      - "Les sacs de courrier pèsent plus lourd que les valises. « C'est le poids des factures », dit le chauffeur. Il rit sans personne, et te tend ta part."
      - "Une vieille dame confie son panier à la soute comme on confie un enfant : « Les œufs dessus. » Tu mets les œufs dessus. Le chauffeur te regarde faire, et rajoute un billet."
    tranches: 1
    francs: 40
    heures: [matin]
    max_jour: 1

  - id: terminus_tele
    lieu: terminus
    habitude: comptoir
    objet: tele
    label: "La petite télé"
    texte: "La petite télé est posée sur le frigo, l'antenne redressée par un cintre. L'après-midi, elle passe les courses ; on la regarde quand même pour les résultats."
    textes:
      - "La petite télé est posée sur le frigo, l'antenne redressée par un cintre. L'après-midi, elle passe les courses ; on la regarde quand même pour les résultats."
      - "Le patron tape sur le côté du poste pour que l'image revienne. Elle revient. « Une question de main. Comme pour un gardien. »"
      - "Les chauffeurs regardent l'écran sans le son, en attendant leur départ. Ils lisent sur les lèvres du présentateur, et se trompent ensemble."
    tranches: 1
    francs: -5
    heures: [aprem, soir]
    special: tele

  - id: terminus_tierce
    lieu: terminus
    habitude: jeu
    objet: tele
    si: "annee < 2010"
    label: "Le tiercé des chauffeurs"
    texte: "Les chauffeurs jouent le tiercé en commun, une ligne chacun. On te donne la quatrième. Tu coches les numéros des titulaires de samedi ; les chevaux n'en tiennent aucun compte."
    textes:
      - "Les chauffeurs jouent le tiercé en commun, une ligne chacun. On te donne la quatrième. Tu coches les numéros des titulaires de samedi ; les chevaux n'en tiennent aucun compte."
      - "La course passe sur la petite télé, au galop silencieux. Le patron déchire le ticket commun en quatre au poteau, et le jette dans le cendrier, avec ceux des autres semaines."
      - "Un vieux chauffeur coche toujours le cheval le plus mal placé. « Les favoris, c'est comme les présidents : tout le monde les connaît, personne ne les aime. »"
      - "Le ticket reste sous le cendrier jusqu'à l'arrivée. Votre cheval finit quatrième. Le patron dit que quatrième, c'est une place honorable, et ramasse les tickets."
    tranches: 0
    francs: -20
    heures: [aprem]

  - id: terminus_porte
    lieu: terminus
    habitude: nuit
    objet: porte_service
    label: "La porte du fond"
    texte: "La porte de l'arrière-salle est fermée à clé. Derrière, une chaise racle le carrelage, puis plus rien. Le patron essuie un verre sans te quitter des yeux."
    textes:
      - "La porte de l'arrière-salle est fermée à clé. Derrière, une chaise racle le carrelage, puis plus rien. Le patron essuie un verre sans te quitter des yeux."
      - "Le patron te barre le passage d'un bras, poliment, comme un portier. « Pas par là. Et pour vous, ça n'ouvre pas avant dix heures du soir. »"
      - "Sous la porte du fond, une odeur de tabac froid et de feutre mouillé. Tu entends des jetons qu'on empile, quelqu'un qui compte, et ton nom, une fois, au milieu d'une phrase."
      - "Une ardoise d'écolier pend à la poignée, face contre la porte. Personne ne la retourne tant que tu es là."
    tranches: 0
    francs: 0

  # ═════════════════════════════════════════════════ L'ARRIÈRE-SALLE (tripot)
  # Le soir et la nuit. La table ronde, le cendrier aux billets, le bar de
  # fortune, la caisse du donneur. Les mises montent avec l'heure et le
  # portefeuille ; la nuit, tout se fait d'un geste (`tranches: 0`). Le crédit
  # sans papier et la table du fond sont des missions (content/ville/missions.yaml).
  - id: tripot_petite
    lieu: tripot
    habitude: jeu
    objet: table_jeu
    label: "Une petite main"
    texte: "Le donneur coupe le paquet d'une main, sans regarder. Autour du tapis vert, quatre hommes qui ne se présentent pas. On te fait une place à la petite mise."
    textes:
      - "Le donneur coupe le paquet d'une main, sans regarder. Autour du tapis vert, quatre hommes qui ne se présentent pas. On te fait une place à la petite mise."
      - "Un chauffeur de car joue en manches de chemise, sa casquette retournée à côté des jetons. Il dit bonsoir à tout le monde, sauf à toi, et te donne la première carte."
      - "La lampe au-dessus du tapis éclaire les mains, pas les visages. Tu poses ta mise. Le donneur dit seulement : « Plus haut que moi. »"
      - "Le tapis est brûlé à trois endroits, toujours devant la même chaise. Tu t'assois sur l'autre."
    tranches: 0
    francs: -100
    jeu: cartes

  - id: tripot_grande
    lieu: tripot
    habitude: jeu
    objet: table_jeu
    si: "francs >= 3000"
    label: "Monter à la grande table"
    texte: "La grande table est au fond, sous la fenêtre condamnée. On y joue sans parler. Quand tu t'assois, l'homme d'en face retire sa montre et la pose sur le tapis."
    textes:
      - "La grande table est au fond, sous la fenêtre condamnée. On y joue sans parler. Quand tu t'assois, l'homme d'en face retire sa montre et la pose sur le tapis."
      - "Un notaire de la ville joue là, la cravate dans la poche. Il te reconnaît et ne le montre pas. Demain, au café de la Mairie, il le dira peut-être."
      - "Les billets restent pliés en quatre sous les jetons, comme si personne ne voulait les voir. Le donneur pousse ta mise au milieu du dos de la main."
      - "À la grande table, on ne te demande pas ton nom ; on te demande d'où vient l'argent. Tu dis : de mon salaire. Autour de la table, on sourit, poliment."
    tranches: 0
    francs: -1000
    jeu: cartes
    jauges: {direction: -1}

  - id: tripot_tapis
    lieu: tripot
    habitude: jeu
    objet: table_jeu
    si: "francs >= 25000"
    label: "Tout mettre sur le tapis"
    texte: "Trois heures du matin. Il ne reste que deux joueurs et toi. Le patron de la table a fermé le volet et posé la clé à côté des cartes, bien en vue."
    textes:
      - "Trois heures du matin. Il ne reste que deux joueurs et toi. Le patron de la table a fermé le volet et posé la clé à côté des cartes, bien en vue."
      - "Tu pousses tout au milieu. Personne ne dit rien ; le donneur prend le temps d'allumer une cigarette avant de distribuer, comme on attend qu'un orage soit passé."
      - "Les nuits de grosses mises, on enlève les chaises vides. On entend le frigo du bar de fortune, et quelqu'un, derrière toi, qui retient sa respiration."
      - "L'homme d'en face te regarde pour la première fois de la nuit. « Ce que vous mettez là, c'est combien de matchs ? » Il ne veut pas de réponse. Il veut que tu y penses."
    tranches: 0
    francs: -10000
    heures: [nuit]
    jeu: cartes
    jauges: {direction: -2, tribunes: -1}

  - id: tripot_regarder
    lieu: tripot
    habitude: jeu
    objet: table_jeu
    label: "Regarder jouer"
    texte: "Tu restes debout, dos au mur, un verre à la main. On joue sans parler. Un joueur perd trois mains de suite et remercie le donneur chaque fois."
    textes:
      - "Tu restes debout, dos au mur, un verre à la main. On joue sans parler. Un joueur perd trois mains de suite et remercie le donneur chaque fois."
      - "Un homme en survêtement neuf joue de petites mises et regarde tout le monde, sauf ses cartes. Quand il te voit, il ramasse ses jetons et s'en va."
      - "Un employé de mairie, un boucher, un chauffeur, et un joueur d'un autre club qui devrait dormir avant son match. Il te voit, rentre le menton dans son col, et continue."
      - "Quelqu'un perd, se lève, revient avec une montre et la pose sur le tapis. Le patron de la table la soupèse et la rend. « Pas les montres. Les montres reviennent toujours réclamer. »"
    tranches: 1
    francs: 0
    heures: [soir]

  - id: tripot_cendrier
    lieu: tripot
    habitude: jeu
    objet: cendrier
    label: "La part du cendrier"
    texte: "Avant de partir, chacun glisse un billet plié en quatre sous le cendrier de cuivre : la part de la maison. Personne ne t'a dit le prix ; tu poses ce que les autres ont posé."
    textes:
      - "Avant de partir, chacun glisse un billet plié en quatre sous le cendrier de cuivre : la part de la maison. Personne ne t'a dit le prix ; tu poses ce que les autres ont posé."
      - "Le patron de la table soulève le cendrier, compte du pouce sans baisser les yeux, et le repose. « C'est pour la porte. La porte, elle ne voit personne. »"
      - "Le cendrier déborde de mégots et de billets, dans cet ordre. Tu glisses ta part par-dessous, là où les autres l'ont mise."
    tranches: 0
    francs: -200

  - id: tripot_bar
    lieu: tripot
    habitude: comptoir
    objet: bar
    label: "Un verre au bar de fortune"
    texte: "Deux planches sur des tréteaux, une bouteille sans étiquette, des verres à dents. Le neveu du patron sert avec une gravité de sommelier."
    textes:
      - "Deux planches sur des tréteaux, une bouteille sans étiquette, des verres à dents. Le neveu du patron sert avec une gravité de sommelier."
      - "Le bar de fortune n'a jamais qu'une bouteille ouverte. Quand elle est vide, la partie s'arrête cinq minutes, le temps d'en ouvrir une autre."
      - "Tu bois au comptoir de planches. Un joueur qui a tout perdu y boit aussi, sans payer, et regarde la table comme on regarde la mer."
      - "Les glaçons sortent d'un seau cabossé, gravé au nom d'un hôtel de la côte. Le patron dit qu'on le lui a laissé en paiement. Il ne dit pas de quoi."
    tranches: 0
    francs: -40

  - id: tripot_caisse
    lieu: tripot
    habitude: nuit
    objet: caisse
    roles: [joueur, entraineur]
    label: "Tenir la caisse une nuit"
    texte: "Le patron de la table te confie la boîte en fer : « Tu changes les billets, tu ne prêtes rien, tu ne joues pas. » Il revient à deux heures, compte deux fois, et te paie avec les billets du dessous."
    textes:
      - "Le patron de la table te confie la boîte en fer : « Tu changes les billets, tu ne prêtes rien, tu ne joues pas. » Il revient à deux heures, compte deux fois, et te paie avec les billets du dessous."
      - "Tu tiens la caisse du donneur derrière le bar de fortune. Des billets froissés entrent, des jetons sortent. Un joueur te reconnaît, puis décide de ne pas te reconnaître."
      - "La boîte en fer a un double fond que tu ne dois pas ouvrir. Tu ne l'ouvres pas. Au matin, le patron te paie un peu plus que prévu, pour ce que tu n'as pas ouvert."
      - "Vers une heure, un homme vient réclamer un crédit. Tu dis non, comme convenu. Il te regarde longtemps, puis il dit ton nom à voix haute, pour que la salle l'entende."
    tranches: 1
    francs: 800
    heures: [soir]
    max_jour: 1
    jauges: {direction: -1}

  - id: tripot_donneur
    lieu: tripot
    habitude: jeu
    objet: caisse
    label: "Un pourboire au donneur"
    texte: "Le donneur a été croupier dans un casino de la côte, dit-on, avant une histoire. Il prend ton pourboire du bout des doigts et tapote deux fois la caisse : c'est son merci."
    textes:
      - "Le donneur a été croupier dans un casino de la côte, dit-on, avant une histoire. Il prend ton pourboire du bout des doigts et tapote deux fois la caisse : c'est son merci."
      - "La caisse du donneur est une boîte à cigares au couvercle doublé de feutre. Tu y glisses quelques pièces. Il hoche la tête sans quitter le tapis des yeux."
      - "Le donneur range ton pourboire à part, dans la poche de son gilet. « Les pourboires, je ne les joue pas. C'est pour ma fille. » Il ne dit jamais rien d'autre de sa vie."
    tranches: 0
    francs: -50

  # ══════════════════════════════════════════════ LE RIDEAU ROUGE (club_prive)
  # Le soir et la nuit. Le bar, la piste, l'alcôve, le rideau rouge, le
  # vestiaire. Ici, personne n'a de nom ; on y gagne ce qu'on y laisse voir.
  - id: club_coupe
    lieu: club_prive
    habitude: nuit
    objet: bar
    label: "Une coupe au bar"
    texte: "Le barman essuie une coupe déjà propre et la remplit sans demander. Le velours des tabourets garde la forme des autres. La musique est si lente qu'on l'entend à peine."
    textes:
      - "Le barman essuie une coupe déjà propre et la remplit sans demander. Le velours des tabourets garde la forme des autres. La musique est si lente qu'on l'entend à peine."
      - "Au bout du bar, un adjoint au maire fait semblant de ne pas te voir. Tu fais semblant de ne pas le voir faire semblant. Le barman vous sert d'un seul geste."
      - "Ici, personne n'a de nom. Le barman dit « vous » à tout le monde ; dans sa bouche, ça ressemble à un nom."
      - "La coupe arrive sur une serviette brodée d'un rideau rouge. En la posant, le barman donne l'heure, pour rien. Il donne l'heure à tous ceux qui ont un match samedi."
    tranches: 0
    francs: -150

  - id: club_bouteille
    lieu: club_prive
    habitude: luxe
    objet: bar
    roles: [joueur]
    label: "Une bouteille pour la table"
    texte: "Tu offres une bouteille à la table où trois coéquipiers fêtent un anniversaire qui n'existe pas. Le barman l'apporte avec des cierges magiques ; tout le club le saura demain."
    textes:
      - "Tu offres une bouteille à la table où trois coéquipiers fêtent un anniversaire qui n'existe pas. Le barman l'apporte avec des cierges magiques ; tout le club le saura demain."
      - "La bouteille arrive dans un seau d'argent. On trinque à toi, à eux, au match de samedi. À deux heures, le plus jeune dort sur la banquette, son verre plein à la main."
      - "L'hôtesse note la bouteille dans un carnet, à ton nom, sans te demander comment tu t'appelles. Elle le sait. Elle sait aussi à quelle heure vous partirez."
    tranches: 0
    francs: -1500
    heures: [nuit]
    jauges: {vestiaire: 1, direction: -1}

  - id: club_piste
    lieu: club_prive
    habitude: nuit
    objet: piste
    label: "Aller sur la piste"
    texte: "La piste est vide jusqu'à minuit, puis pleine d'un coup, comme une tribune au coup d'envoi. Sous la boule à facettes, tout le monde a la même couleur."
    textes:
      - "La piste est vide jusqu'à minuit, puis pleine d'un coup, comme une tribune au coup d'envoi. Sous la boule à facettes, tout le monde a la même couleur."
      - "Une femme te prend la main sans demander ton nom, danse un slow en silence et retourne à sa table. Elle laisse dans ta paume un jeton de vestiaire qui n'est pas le tien."
      - "Tu danses mal, et on te laisse faire : ici, on regarde les gens qui ont un nom, pas leurs pieds."
      - "Sur la piste, un joueur d'un autre club danse avec la femme de son président. Il t'aperçoit, sourit, et continue. Lundi, personne n'aura rien vu."
    tranches: 0
    francs: 0

  - id: club_alcove
    lieu: club_prive
    habitude: nuit
    objet: alcove
    label: "S'asseoir dans l'alcôve"
    texte: "L'alcôve est tendue de velours, la table basse marquée de ronds de verre. On t'y installe sans que tu l'aies demandé. Quelqu'un, déjà, a commandé pour toi."
    textes:
      - "L'alcôve est tendue de velours, la table basse marquée de ronds de verre. On t'y installe sans que tu l'aies demandé. Quelqu'un, déjà, a commandé pour toi."
      - "De l'alcôve, on voit tout le Rideau Rouge sans être vu. Tu reconnais un arbitre, deux élus, et un agent qui écrit ton nom sur une boîte d'allumettes."
      - "Un homme s'assoit en face de toi, dit qu'il ne veut rien, parle une heure de chevaux, paie et s'en va. En partant : « On se reverra. » Tu ne l'avais jamais vu."
      - "L'hôtesse tire à moitié le rideau de l'alcôve. « Pour votre tranquillité. » La tranquillité dure le temps d'une coupe ; ensuite, elle rouvre le rideau pour quelqu'un d'autre."
    tranches: 1
    francs: 0
    heures: [soir]

  - id: club_jeudi
    lieu: club_prive
    habitude: luxe
    objet: alcove
    roles: [joueur, entraineur]
    label: "Le carré du jeudi"
    texte: "Le patron du Rideau Rouge paie les noms, le jeudi. Tu t'assois au carré, tu bois ce qu'on te sert, tu serres des mains. À minuit, une enveloppe épaisse t'attend au vestiaire."
    textes:
      - "Le patron du Rideau Rouge paie les noms, le jeudi. Tu t'assois au carré, tu bois ce qu'on te sert, tu serres des mains. À minuit, une enveloppe épaisse t'attend au vestiaire."
      - "Ton nom est écrit à la craie sur l'ardoise de l'entrée : « Ce jeudi, au carré ». Les clients paient plus cher pour s'asseoir à côté. Tu ne retiens aucun prénom."
      - "Un photographe passe de table en table avec un appareil à flash. Le patron te fait signe : la photo fait partie du prix. Elle finira encadrée près du bar, avec les autres."
      - "Le patron s'assoit une minute près de toi, la main sur ton épaule, et regarde sa salle comme un propriétaire. « Les gens viennent pour vous voir boire. Buvez. »"
    tranches: 1
    francs: 1500
    jours: [jeu]
    heures: [soir]
    max_jour: 1
    jauges: {tribunes: -1, direction: -1}

  - id: club_rideau
    lieu: club_prive
    habitude: nuit
    objet: rideau
    label: "Regarder derrière le rideau"
    texte: "Derrière le rideau rouge, un couloir, une porte capitonnée, et un homme en costume, muet. Il ne t'empêche pas d'entrer. Il te regarde comme s'il comptait jusqu'à dix."
    textes:
      - "Derrière le rideau rouge, un couloir, une porte capitonnée, et un homme en costume, muet. Il ne t'empêche pas d'entrer. Il te regarde comme s'il comptait jusqu'à dix."
      - "Le rideau s'écarte une seconde pour un serveur : une table de cartes, de la fumée, une cravate de la Fédération sur le dossier d'une chaise. Puis il retombe."
      - "L'hôtesse remet le rideau en place, sans hâte. « Derrière, c'est pour les habitués. Vous le deviendrez peut-être. Personne ne le devient exprès. »"
      - "Tu soulèves le bord du velours : un mur, un extincteur, le calendrier de l'an dernier. Le vrai passage est ailleurs. Tout le monde le sait, sauf toi."
    tranches: 0
    francs: 0

  - id: club_offre
    lieu: club_prive
    habitude: nuit
    objet: rideau
    roles: [president, ds]
    label: "Écouter une offre"
    texte: "Derrière le rideau, un homme sans carte de visite propose son nom sur les maillots, sans dire ce qu'il vend. Il paie d'avance. C'est toujours mauvais signe."
    textes:
      - "Derrière le rideau, un homme sans carte de visite propose son nom sur les maillots, sans dire ce qu'il vend. Il paie d'avance. C'est toujours mauvais signe."
      - "On te présente un ami du club qui n'est jamais venu au stade. Il veut une loge, une place de parking, une photo de son neveu avec l'équipe. Il paiera la saison des jeunes, en liquide."
      - "Le patron du Rideau Rouge t'offre son salon pour les invités du samedi. « Vous me rendrez un service un jour. Un petit. Je ne sais pas encore lequel. »"
    tranches: 1
    francs: 0
    heures: [soir]
    jauges: {caisse: 2, tribunes: -1}

  - id: club_vestiaire
    lieu: club_prive
    habitude: nuit
    objet: vestiaire
    label: "Laisser ton manteau"
    texte: "La dame du vestiaire prend ton manteau et te tend un jeton numéroté sans te regarder. Elle n'oublie jamais un manteau. Les visages, dit-elle, elle n'a pas la place."
    textes:
      - "La dame du vestiaire prend ton manteau et te tend un jeton numéroté sans te regarder. Elle n'oublie jamais un manteau. Les visages, dit-elle, elle n'a pas la place."
      - "Au fond du vestiaire pendent des manteaux que personne n'est venu reprendre. Au bout d'un an, elle les donne à la paroisse, qui ne demande pas d'où ils viennent."
      - "À la sortie, ton manteau est un peu plus lourd qu'à l'entrée : une carte noire dans la poche droite, un numéro au dos. Elle ne sait rien, dit-elle. Tu ne lui as rien demandé."
    tranches: 0
    francs: -20

  # ═════════════════════════════════════════════════ LE TABAC DU QUAI (tabac)
  # Du matin au soir. Le comptoir des mariniers, le tableau des paris, les
  # journaux, les cigarettes, la piste de 421. On y parie sur tout, y compris
  # sur toi.
  - id: tabac_cafe
    lieu: tabac
    habitude: comptoir
    objet: comptoir
    label: "Un café avec les mariniers"
    texte: "Les mariniers prennent leur café avant l'écluse et parlent du niveau de la Rive comme d'un malade. Le buraliste note les hauteurs d'eau sur une ardoise, à côté des cotes du samedi."
    textes:
      - "Les mariniers prennent leur café avant l'écluse et parlent du niveau de la Rive comme d'un malade. Le buraliste note les hauteurs d'eau sur une ardoise, à côté des cotes du samedi."
      - "Une péniche corne sur le quai ; tout le comptoir lève la tête, comme au coup de sifflet. Puis chacun retourne à son café."
      - "Un marinier de passage a vu ton visage dans un journal oublié dans sa cabine, trois écluses plus haut. Il ne sait plus si c'était un bon article. Il t'observe pour le deviner."
      - "Le buraliste rend la monnaie pièce par pièce, en comptant tout haut. Le marinier d'à côté recompte derrière lui, par principe."
    tranches: 1
    francs: -5
    heures: [matin]

  - id: tabac_soir
    lieu: tabac
    habitude: comptoir
    objet: comptoir
    label: "Le dernier verre du Quai"
    texte: "Le rideau de fer est à moitié baissé ; on entre en se courbant. Le buraliste sert le dernier verre aux mariniers qui dorment à bord, et te le sert aussi, sans demander."
    textes:
      - "Le rideau de fer est à moitié baissé ; on entre en se courbant. Le buraliste sert le dernier verre aux mariniers qui dorment à bord, et te le sert aussi, sans demander."
      - "Le soir, le tabac du Quai devient un café de bateliers : des cartes, du tabac roulé, une radio qui donne la météo des rivières. Ton nom revient deux fois, entre deux crues."
      - "Un vieux marinier raconte la crue d'avant la guerre, quand l'eau est montée jusqu'au comptoir. Il montre la marque au crayon sur le mur. Chacun la regarde, comme si l'eau allait revenir."
    tranches: 1
    francs: -10
    heures: [soir]

  - id: tabac_cote
    lieu: tabac
    habitude: jeu
    objet: paris
    si: "annee < 2010"
    label: "Lire ta cote"
    texte: "L'ardoise des paris est accrochée derrière la caisse, écrite à la craie. Ta ligne est au milieu, entre la crue de printemps et le prochain mariage du quartier."
    textes:
      - "L'ardoise des paris est accrochée derrière la caisse, écrite à la craie. Ta ligne est au milieu, entre la crue de printemps et le prochain mariage du quartier."
      - "Ta cote a bougé depuis lundi : quelqu'un a effacé un chiffre du doigt et en a écrit un autre. Le buraliste dit qu'il ne touche jamais aux cotes. Il a de la craie sur le pouce."
      - "Un marinier lit l'ardoise en même temps que toi, puis te regarde, puis l'ardoise. Il pose une pièce sur le comptoir : « Pour vous. Enfin, sur vous. »"
      - "On parie aussi sur les autres : le président, l'arbitre de samedi, le premier carton. Ton nom est écrit plus gros que le reste. Le buraliste dit que la craie était neuve."
    tranches: 0
    francs: 0

  - id: tabac_ecran
    lieu: tabac
    habitude: jeu
    objet: paris
    si: "annee >= 2010"
    label: "Lire les cotes à l'écran"
    texte: "L'ardoise a laissé la place à un écran qui fait défiler les cotes du monde entier. Le buraliste a gardé la craie pour une seule ligne, en bas : la tienne."
    textes:
      - "L'ardoise a laissé la place à un écran qui fait défiler les cotes du monde entier. Le buraliste a gardé la craie pour une seule ligne, en bas : la tienne."
      - "Sur l'écran, ton prochain match se joue en quarante paris : le premier corner, la première touche, le nombre de cartons. Le résultat, c'est la ligne la moins jouée."
      - "Un jeune homme mise depuis son téléphone, debout devant l'écran, et regarde ta cote baisser en direct. Il lève les yeux vers toi comme on regarde un cheval au paddock."
      - "Sous l'écran, une affiche officielle : interdiction de parier pour les gens du football. Le buraliste la tapote du doigt dès que tu lèves les yeux vers les cotes."
    tranches: 0
    francs: 0

  - id: tabac_crue
    lieu: tabac
    habitude: jeu
    objet: paris
    label: "Parier sur la crue"
    texte: "Les mariniers parient sur le niveau de la Rive au pont, dimanche à midi. Tu prends un centimètre au-dessus de la marque. Le buraliste écrit ton pari sous celui du curé."
    textes:
      - "Les mariniers parient sur le niveau de la Rive au pont, dimanche à midi. Tu prends un centimètre au-dessus de la marque. Le buraliste écrit ton pari sous celui du curé."
      - "On mise sur la crue à la craie, au dos du tableau. Le vieux marinier qui gagne toujours dit qu'il suffit de regarder les hirondelles. Tu ne vois pas d'hirondelles."
      - "Le dimanche, le buraliste descend au pont avec une règle graduée et deux témoins. L'eau s'arrête à quatre centimètres de ton chiffre. On te serre la main, pour le geste."
    tranches: 0
    francs: -10

  - id: tabac_journaux
    lieu: tabac
    habitude: culture
    objet: journaux
    si: "annee < 2025"
    label: "Le Quotidien du Ballon"
    texte: "Le buraliste pose Le Quotidien du Ballon sur le comptoir, encore froid de la camionnette. Les mariniers se le partagent par cahiers : les sports d'abord, la météo ensuite."
    textes:
      - "Le buraliste pose Le Quotidien du Ballon sur le comptoir, encore froid de la camionnette. Les mariniers se le partagent par cahiers : les sports d'abord, la météo ensuite."
      - "Tu lis le journal au comptoir, entre un marinier et une pile de cartes postales du pont."
      - "Le buraliste a corné la page des cotes pour les mariniers et celle de la météo pour lui. Tu déplies le reste."
    tranches: 1
    francs: -5
    special: journal

  - id: tabac_journaux_ecran
    lieu: tabac
    habitude: culture
    objet: journaux
    si: "annee >= 2025"
    label: "Le journal sur l'écran"
    texte: "Le Quotidien ne s'imprime plus. Le buraliste fait défiler ses pages sur l'écran des cotes, entre deux paris ; les mariniers attendent la météo en buvant leur café."
    textes:
      - "Le Quotidien ne s'imprime plus. Le buraliste fait défiler ses pages sur l'écran des cotes, entre deux paris ; les mariniers attendent la météo en buvant leur café."
      - "Le présentoir des journaux est resté au mur, vide, avec ses pinces à linge. Le buraliste y accroche les cartes postales du pont et lit les nouvelles sur sa tablette, à voix basse."
      - "Le buraliste tourne l'écran vers toi, au-dessus de la caisse. Un vieux marinier demande qu'on agrandisse les lettres ; on les agrandit pour tout le comptoir."
    tranches: 1
    francs: 0
    special: journal

  - id: tabac_paquet
    lieu: tabac
    habitude: largesse
    objet: cigarettes
    label: "Un paquet pour quelqu'un"
    texte: "Un paquet pour le chauffeur du car du club, qui ne fume que les jours de déplacement. Le buraliste le sait : il ajoute une boîte d'allumettes, sans la compter."
    textes:
      - "Un paquet pour le chauffeur du car du club, qui ne fume que les jours de déplacement. Le buraliste le sait : il ajoute une boîte d'allumettes, sans la compter."
      - "Les cigarettes de l'intendant, qui n'ose plus les acheter lui-même depuis qu'il a juré d'arrêter devant tout le vestiaire."
      - "« Pour qui ? » demande le buraliste, la main sur le présentoir. Tu dis un nom. Il prend le paquet d'à côté : il sait mieux que toi ce que fume chacun en ville."
      - "Le paquet est pour le vieux gardien de la grille Nord, qui t'a ouvert un soir d'orage. Tu le poses dans sa guérite. Il ne demandera pas d'où il vient."
    tranches: 0
    francs: -12

  - id: tabac_421
    lieu: tabac
    habitude: jeu
    objet: des
    label: "Un 421 avec les mariniers"
    texte: "Les mariniers jouent au 421 sur une piste de feutre râpée jusqu'à la trame. On joue le café, puis le verre, puis l'honneur du canal."
    textes:
      - "Les mariniers jouent au 421 sur une piste de feutre râpée jusqu'à la trame. On joue le café, puis le verre, puis l'honneur du canal."
      - "Un marinier secoue le gobelet contre son oreille, longtemps, comme on écoute un moteur. Il te le tend : « À vous. Le Quai porte chance aux nouveaux, la première fois. »"
      - "Le buraliste arbitre les coups contestés avec une loupe de philatéliste. Il n'a jamais donné tort à un marinier."
    tranches: 0
    francs: -10
    jeu: des

  - id: tabac_421_soir
    lieu: tabac
    habitude: jeu
    objet: des
    label: "Le 421 du soir"
    texte: "Le soir, les mises changent de main. Un homme en veste de cuir pose une liasse sous la piste et te fait signe. Les mariniers vont boire au bout du comptoir."
    textes:
      - "Le soir, les mises changent de main. Un homme en veste de cuir pose une liasse sous la piste et te fait signe. Les mariniers vont boire au bout du comptoir."
      - "Après dix heures, le buraliste ne voit plus rien : il compte sa caisse, le dos tourné. Sur la piste, on joue un mois de loyer en riant trop fort."
      - "Le gobelet du soir est en cuir noir, plus lourd que celui du matin. Personne ne dit pourquoi. On dit seulement qu'il connaît la musique."
    tranches: 0
    francs: -100
    heures: [soir]
    jeu: des

  # ═════════════════════════════════════ LE TABAC-PRESSE DU CARREFOUR (tabac_stade)
  # Matin, midi, après-midi. Le comptoir, les journaux, la grille du loto, le
  # présentoir, le flipper. Les grilles du stade sont en face.
  - id: tabac_stade_cafe
    lieu: tabac_stade
    habitude: comptoir
    objet: comptoir
    label: "Un café au carrefour"
    texte: "Le tabac-presse du carrefour a vue sur les grilles de la Rive. Le patron sait qui entre au stade avant le gardien : il le voit passer en achetant son journal."
    textes:
      - "Le tabac-presse du carrefour a vue sur les grilles de la Rive. Le patron sait qui entre au stade avant le gardien : il le voit passer en achetant son journal."
      - "Le jardinier du stade boit son café au comptoir, de la terre jusqu'aux genoux. Il parle de la pelouse comme d'une bête : elle a soif, elle boude, elle se venge en novembre."
      - "Le patron raconte qu'il a eu le score de samedi avant tout le monde, par le photographe de L'Écho, depuis la tribune de presse. Il en est plus fier que de ses grilles gagnantes."
      - "Deux livreurs de bière attendent que le gardien ouvre les grilles pour la buvette du stade. Ils parient un café sur l'heure à laquelle il viendra."
    tranches: 1
    francs: -5

  - id: tabac_stade_telephone
    lieu: tabac_stade
    habitude: comptoir
    objet: comptoir
    si: "annee < 2000"
    label: "Téléphoner du comptoir"
    texte: "Le patron pose son téléphone sur le comptoir, entre deux grilles de loto. La cabine de devant marche une fois sur deux ; ce n'est pas le bon jour."
    textes:
      - "Le patron pose son téléphone sur le comptoir, entre deux grilles de loto. La cabine de devant marche une fois sur deux ; ce n'est pas le bon jour."
      - "Tu téléphones du comptoir, dos à la salle. Le patron monte le son de la radio, par discrétion, et baisse la tête pour mieux entendre."
      - "Le compteur du téléphone tourne à côté de la caisse. Le patron te fait payer à la fin, au centime près, et t'offre la pastille."
    tranches: 0
    francs: -2
    special: telephone

  - id: tabac_stade_journal
    lieu: tabac_stade
    habitude: culture
    objet: journaux
    label: "Prendre le journal"
    texte: "Les journaux sont empilés sous un presse-papier en forme de ballon. Tu prends celui du dessus ; le patron a déjà lu la page des sports, et l'a repliée exprès."
    textes:
      - "Les journaux sont empilés sous un presse-papier en forme de ballon. Tu prends celui du dessus ; le patron a déjà lu la page des sports, et l'a repliée exprès."
      - "Le patron te tend le journal plié en quatre, la page qui compte en dessus, et attend, les mains à plat sur le comptoir, que tu aies fini."
      - "Tu lis le journal debout contre le présentoir, comme les gens qui n'ont pas le temps."
    tranches: 0
    francs: -4
    special: journal

  - id: tabac_stade_loto
    lieu: tabac_stade
    habitude: jeu
    objet: loto
    label: "Jouer une grille"
    texte: "Tu coches six cases avec le stylo attaché au comptoir par une ficelle : le numéro de ton maillot d'enfant, deux dates, et trois au hasard. Le hasard, c'est le plus dur."
    textes:
      - "Tu coches six cases avec le stylo attaché au comptoir par une ficelle : le numéro de ton maillot d'enfant, deux dates, et trois au hasard. Le hasard, c'est le plus dur."
      - "Le patron valide ta grille et la pose sur la pile des habitués. « Si vous gagnez, vous rachetez le club ? » Il n'attend pas la réponse ; il l'a déjà entendue."
      - "Une vieille dame joue les mêmes numéros depuis trente ans : la naissance de ses enfants et le score d'une finale. Elle te laisse regarder sa grille, pas la recopier."
      - "Le tirage passe le soir, à la télé. D'ici là, la grille dort dans ton portefeuille, pliée en deux, entre une photo et un ticket de parking."
    tranches: 0
    francs: -10

  - id: tabac_stade_grille_equipe
    lieu: tabac_stade
    habitude: jeu
    objet: loto
    roles: [joueur]
    label: "La grille du vestiaire"
    texte: "Les gars jouent une grille en commun : les numéros des titulaires de samedi. Tu poses ta part. Si elle tombe, personne ne viendra plus à l'entraînement ; on a juré."
    textes:
      - "Les gars jouent une grille en commun : les numéros des titulaires de samedi. Tu poses ta part. Si elle tombe, personne ne viendra plus à l'entraînement ; on a juré."
      - "Le capitaine collecte les pièces dans un gant de gardien et te fait signer la grille au dos. Le patron dit que les grilles d'équipe ne gagnent jamais. Il les valide quand même."
      - "Ton numéro est sur la grille, entre celui du gardien et celui du remplaçant qui ne joue jamais. Le patron range le reçu dans le tiroir du club, avec les autres."
    tranches: 0
    francs: -10

  - id: tabac_stade_pastilles
    lieu: tabac_stade
    habitude: comptoir
    objet: cigarettes
    label: "Des pastilles à la menthe"
    texte: "Une boîte de pastilles à la menthe près de la caisse : le patron les vend aux maris qui rentrent du stade par le carrefour, pour l'haleine. Il t'en glisse une, offerte."
    textes:
      - "Une boîte de pastilles à la menthe près de la caisse : le patron les vend aux maris qui rentrent du stade par le carrefour, pour l'haleine. Il t'en glisse une, offerte."
      - "Sur le présentoir, entre les briquets et les cartes postales, des montres et des boîtes de pastilles. Tu prends les pastilles. Le patron a l'air déçu pour les montres."
      - "Un gamin compte ses pièces pour une boîte de pastilles, et il en manque une. Le patron regarde ailleurs le temps que tu poses la tienne sur le comptoir."
    tranches: 0
    francs: -4

  - id: tabac_stade_jardinier
    lieu: tabac_stade
    habitude: largesse
    objet: cigarettes
    label: "Un paquet pour le jardinier"
    texte: "Le jardinier de la Rive fume des brunes qu'on ne trouve qu'ici. Tu lui en prends un paquet ; le patron le met de côté sous le comptoir, avec son nom dessus."
    textes:
      - "Le jardinier de la Rive fume des brunes qu'on ne trouve qu'ici. Tu lui en prends un paquet ; le patron le met de côté sous le comptoir, avec son nom dessus."
      - "Le patron te tend le paquet du jardinier. « Il a tondu en diagonale, samedi. Il ne fait ça que quand il est content. Ou quand il veut qu'on le croie. »"
      - "Tu déposes le paquet dans la cabane du jardinier, sur l'arrosoir. Le lendemain, la ligne de touche devant le banc est tracée plus droite que les autres."
    tranches: 0
    francs: -12

  - id: tabac_stade_flipper
    lieu: tabac_stade
    habitude: comptoir
    objet: flipper
    label: "Une partie de flipper"
    texte: "Le flipper du carrefour a un ballon peint sur le fronton et un gardien qui ne plonge plus : le moteur est mort. Le patron dit qu'il a pris sa retraite."
    textes:
      - "Le flipper du carrefour a un ballon peint sur le fronton et un gardien qui ne plonge plus : le moteur est mort. Le patron dit qu'il a pris sa retraite."
      - "Deux lycéens se disputent la machine jusqu'à ce qu'ils te voient. Ils te la laissent, et restent derrière toi pour commenter chaque bille comme un match."
      - "Le flipper penche du côté de la porte. Le patron a calé un pied avec un annuaire, puis avec deux. La bille sait quand même où elle va."
    tranches: 0
    francs: -5
    jeu: flipper

  # ════════════════════════════════════════ LA MAISON DE LA PRESSE (presse)
  # Matin, midi, après-midi. Le comptoir, les journaux, les magazines, les
  # vignettes à coller, le loto. Le monde y parle avant de parler de toi.
  - id: presse_paquets
    lieu: presse
    habitude: quartier
    objet: comptoir
    roles: [joueur]
    si: "division >= 2"
    label: "Porter les paquets du matin"
    texte: "Cinq heures et demie, la camionnette dépose les paquets de L'Écho cerclés de plastique. Tu les portes jusqu'au comptoir. La marchande te paie en monnaie et en journal."
    textes:
      - "Cinq heures et demie, la camionnette dépose les paquets de L'Écho cerclés de plastique. Tu les portes jusqu'au comptoir. La marchande te paie en monnaie et en journal."
      - "Tu coupes les liens avec le cutter de la marchande. Sur la pile du dessus, la une parle du club. Tu la retournes, pour ne pas la lire avant le quartier."
      - "La marchande te montre comment on plie les invendus pour le retour : en trois, l'en-tête dehors. « Le lundi après une victoire, il en revient peu. C'est comme ça que je tiens le classement. »"
    tranches: 1
    francs: 50
    heures: [matin]
    max_jour: 1

  - id: presse_etrangere
    lieu: presse
    habitude: culture
    objet: comptoir
    roles: [ds, selectionneur]
    si: "annee < 2008"
    label: "Les journaux étrangers"
    texte: "La marchande commande pour toi les journaux de Lusitanie et de Vestrie. Ils arrivent trois jours plus tard, en paquet, ton nom au feutre sur la ficelle."
    textes:
      - "La marchande commande pour toi les journaux de Lusitanie et de Vestrie. Ils arrivent trois jours plus tard, en paquet, ton nom au feutre sur la ficelle."
      - "Tu lis les notes d'un défenseur de Castellane dans une langue que tu ne parles pas. Les chiffres, eux, se comprennent. La marchande te prête un dictionnaire de poche."
      - "Le journal étranger sent l'encre d'une autre imprimerie. En page six, une photo floue du joueur que tu suis, et sa note, la meilleure de la journée."
    tranches: 0
    francs: -15

  - id: presse_echo
    lieu: presse
    habitude: culture
    objet: journaux
    si: "annee < 2025"
    label: "Acheter L'Écho"
    texte: "La marchande a mis L'Écho de côté sous le comptoir, plié en deux, ton nom au crayon dans la marge. Elle fait ça pour une dizaine de clients ; tu en fais partie."
    textes:
      - "La marchande a mis L'Écho de côté sous le comptoir, plié en deux, ton nom au crayon dans la marge. Elle fait ça pour une dizaine de clients ; tu en fais partie."
      - "L'Écho sent encore l'encre. Tu le lis debout près de la porte, entre une mère qui achète des cahiers et un retraité qui vient pour les avis de décès."
      - "La marchande rend la monnaie en regardant la une, puis toi. Elle ne fait jamais de commentaire. Ses sourcils, si."
    tranches: 0
    francs: -3
    special: journal

  - id: presse_echo_dernier
    lieu: presse
    habitude: culture
    objet: journaux
    si: "annee >= 2025"
    label: "L'Écho, le dernier papier"
    texte: "L'Écho est le dernier journal papier du pays. La marchande le vend comme on vend le pain, à des gens qui ne savent pas faire autrement."
    textes:
      - "L'Écho est le dernier journal papier du pays. La marchande le vend comme on vend le pain, à des gens qui ne savent pas faire autrement."
      - "La pile de L'Écho est basse ; la marchande ne commande plus que pour les fidèles. Il en reste six. Tu en prends un, et elle en remet un de côté, pour quelqu'un d'autre."
      - "Un adolescent photographie la une avec son téléphone, sans l'acheter. La marchande ne dit rien. Elle te rend la monnaie un peu plus fort que d'habitude."
    tranches: 0
    francs: -3
    special: journal

  - id: presse_trois
    lieu: presse
    habitude: culture
    objet: journaux
    si: "annee < 2015"
    label: "Acheter les trois journaux"
    texte: "L'Écho, Le Quotidien du Ballon et la Gazette Rose, sous le bras. La marchande dit qu'on reconnaît les gens du club à ça : ils lisent tout, pour savoir ce qu'on a lu d'eux."
    textes:
      - "L'Écho, Le Quotidien du Ballon et la Gazette Rose, sous le bras. La marchande dit qu'on reconnaît les gens du club à ça : ils lisent tout, pour savoir ce qu'on a lu d'eux."
      - "Tu lis les trois journaux sur le même match. Trois fois le même score, trois matchs différents. La Gazette Rose en a vu un que personne d'autre n'a vu."
      - "La marchande glisse la Gazette Rose entre les deux autres, comme on cache une revue. « Pour vous, je fais un paquet. Les gens regardent ce que vous achetez. »"
    tranches: 1
    francs: -11
    special: journal

  - id: presse_lundi
    lieu: presse
    habitude: culture
    objet: journaux
    si: "annee < 2040"
    label: "L'Écho du lundi"
    texte: "Le lundi, on fait la queue pour le compte rendu du match. Les gens lisent les notes avant de te dire bonjour, puis te disent bonjour selon les notes."
    textes:
      - "Le lundi, on fait la queue pour le compte rendu du match. Les gens lisent les notes avant de te dire bonjour, puis te disent bonjour selon les notes."
      - "La photo du match, en page huit : surtout le dos d'un défenseur, et la tribune, floue. Pour la marchande, c'est la plus belle de la saison."
      - "Un retraité découpe le compte rendu au comptoir avec des ciseaux qu'il apporte de chez lui. Il colle tout dans un cahier, depuis l'année où il a cessé d'aller au stade."
    tranches: 0
    francs: -3
    jours: [lun]
    special: journal

  - id: presse_magazines
    lieu: presse
    habitude: culture
    objet: magazines
    label: "Feuilleter les magazines"
    texte: "Les magazines de football sont rangés au fond, sous ceux des chevaux. En couverture, un joueur de la Capitale sourit comme un acteur. Le club n'y est pas, cette année non plus."
    textes:
      - "Les magazines de football sont rangés au fond, sous ceux des chevaux. En couverture, un joueur de la Capitale sourit comme un acteur. Le club n'y est pas, cette année non plus."
      - "Tu feuillettes le mensuel des transferts : des noms, des montants, des photos en pied. La marchande dit que les gens l'achètent pour rêver. Toi, tu le lis pour savoir."
      - "Un gamin lit un magazine debout sans l'acheter, depuis une demi-heure. La marchande le laisse faire. Elle faisait pareil, dit-elle, à la même place."
    tranches: 0
    francs: 0

  - id: presse_guide
    lieu: presse
    habitude: culture
    objet: magazines
    si: "phase == presaison"
    label: "Le guide de la saison"
    texte: "Le guide de la saison est arrivé : une page par club, les photos d'identité de tout l'effectif. Celle du club a été prise trop tôt ; la moitié des visages sont déjà partis."
    textes:
      - "Le guide de la saison est arrivé : une page par club, les photos d'identité de tout l'effectif. Celle du club a été prise trop tôt ; la moitié des visages sont déjà partis."
      - "Dans le guide, les pronostics de la rédaction mettent le club en bas du tableau. La marchande a corrigé sur son exemplaire, au stylo : trois places plus haut."
      - "Ta date de naissance est fausse dans le guide, d'un an exactement. La marchande dit que ce n'est rien. Au comptoir, quelqu'un te souhaite déjà ton anniversaire."
    tranches: 0
    francs: -35

  - id: presse_vignettes
    lieu: presse
    habitude: quartier
    objet: vignettes
    label: "Acheter des vignettes"
    texte: "La marchande garde les pochettes dans un bocal à bonbons, derrière le comptoir. Elle te laisse choisir la tienne, comme si ça changeait quelque chose."
    textes:
      - "La marchande garde les pochettes dans un bocal à bonbons, derrière le comptoir. Elle te laisse choisir la tienne, comme si ça changeait quelque chose."
      - "L'album de la saison est punaisé derrière la caisse, à moitié rempli. La marchande le complète avec les doubles des clients ; il lui manque toujours la même page."
      - "Un gamin attend que tu aies payé pour regarder la pochette par-dessus ton épaule. Elle est encore fermée. Il retient son souffle à ta place."
      - "La marchande fait glisser la pochette sur le comptoir, du bout de l'ongle, sans te regarder. Elle dit que ça porte chance, et qu'elle ne l'a jamais constaté."
    tranches: 0
    # l'album d'Aubérive (content/ville/album.yaml) : une pochette de quatre vignettes, tirée de ta graine et du
    # compteur de pochettes ; son prix est celui de `album.pochette.prix` (le build refuse l'écart)
    francs: -3
    max_jour: 3
    jeu: pochette

  - id: presse_gamins
    lieu: presse
    habitude: quartier
    objet: vignettes
    label: "Échanger avec les gamins"
    texte: "Sur la marche de la maison de la presse, trois gamins étalent leurs doubles. Ils échangent la vignette du club contre deux de la Capitale. Tu ne sais pas si c'est une insulte."
    textes:
      - "Sur la marche de la maison de la presse, trois gamins étalent leurs doubles. Ils échangent la vignette du club contre deux de la Capitale. Tu ne sais pas si c'est une insulte."
      - "« T'as la brillante ? » Un gamin te pose la question sans savoir qui tu es. Quand il comprend, il rougit, puis il demande si tu peux en avoir des gratuites."
      - "Tu donnes tes doubles contre rien, pour voir leurs têtes. Le plus petit serre sa pile contre lui jusqu'au coin de la rue, de peur que tu changes d'avis."
      - "Les gamins tiennent la liste des vignettes manquantes dans un carnet d'écolier. Le dernier numéro est souligné deux fois. Personne, dans le quartier, ne l'a jamais eu."
    tranches: 1
    francs: 0
    jours: [mer, sam]
    heures: [aprem]
    jauges: {tribunes: 1}

  - id: presse_vignette_toi
    lieu: presse
    habitude: quartier
    objet: vignettes
    roles: [joueur]
    label: "Chercher ta vignette"
    texte: "Tu ouvres des pochettes jusqu'à tomber sur ta propre vignette. La photo date de deux saisons, la coiffure aussi. Le nom est bien écrit. C'est déjà ça."
    textes:
      - "Tu ouvres des pochettes jusqu'à tomber sur ta propre vignette. La photo date de deux saisons, la coiffure aussi. Le nom est bien écrit. C'est déjà ça."
      - "Ta vignette ne vaut rien au marché, dit un gamin, sans méchanceté : tout le monde l'a en double. Il t'en donne une, pour que tu l'aies."
      - "La marchande colle ta vignette sur la caisse enregistreuse, à côté de celle de l'ancien capitaine. Elle dit qu'elle les décolle quand ils partent. Celle de l'ancien est toujours là."
    tranches: 0
    francs: -4

  - id: presse_grattage
    lieu: presse
    habitude: jeu
    objet: loto
    label: "Gratter un ticket"
    texte: "Tu grattes avec une pièce, au-dessus de la corbeille : trois cerises, deux trèfles, un fer à cheval à l'envers. La marchande balaie les paillettes d'argent du plat de la main."
    textes:
      - "Tu grattes avec une pièce, au-dessus de la corbeille : trois cerises, deux trèfles, un fer à cheval à l'envers. La marchande balaie les paillettes d'argent du plat de la main."
      - "Gagné : un ticket gratuit. Tu le grattes aussitôt. Perdu. La marchande dit que c'est le chemin le plus court qu'elle connaisse vers zéro."
      - "Un retraité gratte les siens chaque matin à la même heure et garde les perdants dans une boîte à chaussures. Il dit qu'un jour, il fera le compte. Il ne le fera pas."
      - "Le ticket promet une fortune en lettres d'or. Sous la couche grise, un chat qui dort. D'après la marchande, c'est le dessin qui sort le plus."
    tranches: 0
    francs: -10

  - id: presse_grille_commune
    lieu: presse
    habitude: jeu
    objet: loto
    label: "La grille du quartier"
    texte: "La marchande tient une grille commune : vingt habitués, une pièce chacun, chaque semaine. Si elle tombe, plus personne ne travaillera le lundi. Ton nom s'ajoute à la liste."
    textes:
      - "La marchande tient une grille commune : vingt habitués, une pièce chacun, chaque semaine. Si elle tombe, plus personne ne travaillera le lundi. Ton nom s'ajoute à la liste."
      - "Ton nom vient en bas de la liste, sous celui de la boulangère et celui du facteur. La marchande a choisi les numéros : les jours des finales gagnées par le club. Ça fait peu de numéros."
      - "La grille du quartier n'a gagné qu'une fois : trois bons numéros, de quoi offrir l'apéritif aux vingt. On en parle encore comme d'un tour de Coupe."
    tranches: 0
    francs: -10

  # ═══════════════════════════════════ LA BOULANGERIE (boulangerie_residentiel)
  # Matin et midi, du mardi au dimanche. Le comptoir, les pains, le four du
  # fond, le cadre au-dessus de la caisse, la caisse. Les boulangers changent
  # avec les années (le livre 9 a la sienne) : rien ici ne dit qui tient la boutique.
  - id: boul_baguette
    lieu: boulangerie_residentiel
    habitude: quartier
    objet: pains
    label: "Une baguette"
    texte: "La baguette est encore chaude au milieu. Tu en manges le croûton sur le trottoir avant d'avoir fait trois pas, comme tout le monde dans la rue des Lilas."
    textes:
      - "La baguette est encore chaude au milieu. Tu en manges le croûton sur le trottoir avant d'avoir fait trois pas, comme tout le monde dans la rue des Lilas."
      - "La file déborde sur le trottoir. Une petite fille compte les pièces de sa main pour la baguette de sa grand-mère ; elle se trompe, recommence, et toute la file attend."
      - "La boulangère pose la baguette sur le comptoir sans la lâcher. « Samedi, on vous entendait d'ici, le stade. Je sais le score à la façon dont ça crie. »"
      - "Le dimanche, la baguette se mérite : vingt minutes de queue entre les gens de la messe et ceux du marché. On y parle du club à voix basse, comme à l'église."
    tranches: 0
    francs: -4

  - id: boul_croissants
    lieu: boulangerie_residentiel
    habitude: largesse
    objet: comptoir
    roles: [entraineur, joueur]
    label: "Des croissants pour l'équipe"
    texte: "Deux douzaines de croissants dans une boîte en carton ficelée. La boulangère ajoute trois pains au chocolat : « Pour ceux qui ne jouent pas. Ça console. »"
    textes:
      - "Deux douzaines de croissants dans une boîte en carton ficelée. La boulangère ajoute trois pains au chocolat : « Pour ceux qui ne jouent pas. Ça console. »"
      - "La boîte arrive au vestiaire avant la séance. Le plus jeune en mange deux avant que tu aies posé ton sac ; le plus ancien n'en prend pas, puis en prend un pour plus tard."
      - "La boulangère écrit le nom du club sur le carton, au crayon gras, comme pour une commande de mariage. « Les lundis de défaite, je les fais plus beurrés. »"
    tranches: 0
    francs: -75
    heures: [matin]
    jauges: {vestiaire: 1}

  - id: boul_croissants_club
    lieu: boulangerie_residentiel
    habitude: largesse
    objet: comptoir
    roles: [president, ds]
    label: "Des croissants pour le club"
    texte: "Une boîte de croissants pour le secrétariat, la laverie et le jardinier. Tu la poses sur le bureau de l'accueil ; la secrétaire la range aussitôt, pour faire les parts elle-même."
    textes:
      - "Une boîte de croissants pour le secrétariat, la laverie et le jardinier. Tu la poses sur le bureau de l'accueil ; la secrétaire la range aussitôt, pour faire les parts elle-même."
      - "La boulangère compte les croissants deux fois. « Votre prédécesseur en commandait aussi. Les derniers mois, il les payait en retard. Je dis ça pour rien. »"
      - "Au club, la boîte fait le tour des bureaux. Le jardinier prend un croissant et le garde dans la poche de sa veste jusqu'à midi, comme une médaille."
    tranches: 0
    francs: -60
    heures: [matin]
    jauges: {vestiaire: 1}

  - id: boul_tournee
    lieu: boulangerie_residentiel
    habitude: quartier
    objet: four
    roles: [joueur]
    si: "division >= 2 && age <= 25"
    label: "La tournée de six heures"
    texte: "Six heures, le fournil sent le levain. Tu charges les baguettes dans le panier du vélo et tu livres la rue des Lilas, l'hôtel, la maison de retraite. Une vieille dame t'attend à sa fenêtre."
    textes:
      - "Six heures, le fournil sent le levain. Tu charges les baguettes dans le panier du vélo et tu livres la rue des Lilas, l'hôtel, la maison de retraite. Une vieille dame t'attend à sa fenêtre."
      - "Le boulanger sort du fournil en tricot de corps, farine jusqu'aux coudes. Il te tend les sacs de pain et ta paie du matin : « Les côtes, c'est bon pour les cuisses. »"
      - "À l'hôtel de la Rive, le veilleur de nuit prend les baguettes et te reconnaît. Pas un mot ; il t'offre un café dans une tasse de l'hôtel, sur le pas de la porte."
    tranches: 1
    francs: 60
    heures: [matin]
    max_jour: 1

  - id: boul_four
    lieu: boulangerie_residentiel
    habitude: quartier
    objet: four
    si: "!flag(vl_boulangere)"
    label: "Regarder le four"
    texte: "Au fond, la porte du four est entrouverte : une gueule de briques noires, et le boulanger qui enfourne à la pelle de bois, le dos courbé. Le four a l'âge de la boutique."
    textes:
      - "Au fond, la porte du four est entrouverte : une gueule de briques noires, et le boulanger qui enfourne à la pelle de bois, le dos courbé. Le four a l'âge de la boutique."
      - "Le vieux four tire mal par temps de pluie. Le boulanger le surveille comme un malade, la main sur la porte, et dit que la fournée de mardi a brûlé à cause du vent."
      - "Une fissure court le long de la voûte, rebouchée au plâtre. La boulangère dit que c'est une cicatrice, pas une fissure. Elle le répète trop pour y croire."
    tranches: 0
    francs: 0

  - id: boul_four_neuf
    lieu: boulangerie_residentiel
    habitude: quartier
    objet: four
    si: "flag(vl_boulangere)"
    label: "Le four neuf"
    texte: "Le four neuf brille au fond du fournil, en acier, avec un hublot. Le boulanger lui a donné un prénom de femme. Il ne te dit pas lequel ; il te regarde, et il rit."
    textes:
      - "Le four neuf brille au fond du fournil, en acier, avec un hublot. Le boulanger lui a donné un prénom de femme. Il ne te dit pas lequel ; il te regarde, et il rit."
      - "La boulangère te montre le four sans rien dire, puis la date du dernier versement, cochée sur le calendrier des pompiers. Personne d'autre n'est dans la confidence."
      - "Le pain sort plus régulier depuis le four neuf. Les vieux clients disent que c'était meilleur avant. La boulangère leur répond qu'avant, il brûlait le mardi."
    tranches: 0
    francs: 0

  - id: boul_cadre
    lieu: boulangerie_residentiel
    habitude: quartier
    objet: cadre
    label: "Regarder le cadre"
    texte: "Au-dessus de la caisse, sous verre, le premier billet encaissé par la boutique, l'année de l'ouverture. Les boulangers ont changé ; le billet est resté, et chacun l'époussette."
    textes:
      - "Au-dessus de la caisse, sous verre, le premier billet encaissé par la boutique, l'année de l'ouverture. Les boulangers ont changé ; le billet est resté, et chacun l'époussette."
      - "Glissée sous le billet, une page de L'Écho jaunie : la finale de 1974, la ville en photo sur le pont. La boulangère dit qu'on y voit sa rue. On y voit surtout du monde."
      - "Le verre du cadre est piqué de taches de farine qu'on n'arrive pas à enlever. « C'est la boutique qui signe », dit la boulangère."
    tranches: 0
    francs: 0

  - id: boul_cagnotte
    lieu: boulangerie_residentiel
    habitude: largesse
    objet: caisse
    label: "La cagnotte de la caisse"
    texte: "Sur la caisse, un bocal à cornichons percé d'une fente : la cagnotte des pupilles pour le tournoi de Pâques. Tu y laisses ta monnaie. La boulangère secoue le bocal, pour le bruit."
    textes:
      - "Sur la caisse, un bocal à cornichons percé d'une fente : la cagnotte des pupilles pour le tournoi de Pâques. Tu y laisses ta monnaie. La boulangère secoue le bocal, pour le bruit."
      - "Le bocal de la caisse change de cause selon les saisons : le car des pupilles, des filets pour le terrain annexe, la couronne d'un vieil abonné. Cette fois, c'est pour les filets."
      - "Tu glisses ta monnaie dans la cagnotte. Une cliente, derrière toi, en fait autant, puis une autre. La boulangère dit qu'il suffit que le premier soit quelqu'un."
    tranches: 0
    francs: -10
    jauges: {tribunes: 1}

  - id: boul_sachet
    lieu: boulangerie_residentiel
    habitude: quartier
    objet: caisse
    roles: [joueur]
    label: "Signer un sachet de pain"
    texte: "La boulangère te tend un sachet vide et un crayon de bois : « Pour mon petit-fils. Il dort avec vos photos. » Tu signes sur la marque du fournil ; elle repasse les lettres au stylo."
    textes:
      - "La boulangère te tend un sachet vide et un crayon de bois : « Pour mon petit-fils. Il dort avec vos photos. » Tu signes sur la marque du fournil ; elle repasse les lettres au stylo."
      - "Toute la file attend pendant que tu signes un sachet, puis deux, puis cinq. Personne ne se plaint. Un homme demande s'il peut avoir la baguette qui va avec."
      - "Elle punaise le sachet signé derrière la caisse, entre le calendrier et la licence. Le lendemain, un client demande combien elle le vend. Elle dit qu'il n'est pas à vendre."
    tranches: 0
    francs: 0
    jauges: {tribunes: 1}

  # ═════════════════════════════════════════════════════ L'ÉPICERIE (epicerie)
  # Matin, après-midi, soir. Le comptoir (le catalogue, puis le point relais),
  # les rayons, le frigo des bières, le cahier des ardoises.
  - id: epi_livraison
    lieu: epicerie
    habitude: quartier
    objet: comptoir
    roles: [joueur]
    si: "division >= 2"
    label: "Décharger la livraison"
    texte: "Le camion de Valdorne arrive à sept heures. Tu décharges les packs, les conserves, les sacs de farine pour la boulangerie d'à côté. L'épicier coche sa liste et te paie au fond de la boutique."
    textes:
      - "Le camion de Valdorne arrive à sept heures. Tu décharges les packs, les conserves, les sacs de farine pour la boulangerie d'à côté. L'épicier coche sa liste et te paie au fond de la boutique."
      - "L'épicier compte les cartons à voix haute, toi tu les portes. Au vingtième, il te tend une bouteille d'eau : « Mon fils, lui, trouvait toujours une raison de ne pas venir. »"
      - "Le chauffeur du camion te reconnaît et veut t'empêcher de porter le dernier carton. Tu le portes quand même. L'épicier ajoute un paquet de café à ta paie."
    tranches: 1
    francs: 80
    heures: [matin]
    max_jour: 1

  - id: epi_catalogue
    lieu: epicerie
    habitude: quartier
    objet: comptoir
    si: "annee < 2004"
    label: "Feuilleter le catalogue"
    texte: "L'épicier prête son catalogue de vente par correspondance, gros comme un annuaire. Il a corné les pages des télés et des vélos. « Les gens du club regardent toujours les mêmes. »"
    textes:
      - "L'épicier prête son catalogue de vente par correspondance, gros comme un annuaire. Il a corné les pages des télés et des vélos. « Les gens du club regardent toujours les mêmes. »"
      - "Dans le catalogue, une page entière de survêtements et de maillots sans écusson. L'épicier dit que les gamins du quartier les achètent et y cousent celui du club."
      - "L'épicier prend les commandes sur un carnet à souches et les envoie le lundi. Trois semaines plus tard, ça arrive, ou pas. Il dit que ça fait partie du plaisir."
    tranches: 0
    francs: 0

  - id: epi_point_relais
    lieu: epicerie
    habitude: quartier
    objet: comptoir
    si: "annee >= 2004"
    label: "Les colis du point relais"
    texte: "L'épicerie est devenue point relais. Les cartons montent jusqu'au plafond derrière le comptoir, chacun avec un nom du quartier. L'épicier connaît le quartier par ses colis."
    textes:
      - "L'épicerie est devenue point relais. Les cartons montent jusqu'au plafond derrière le comptoir, chacun avec un nom du quartier. L'épicier connaît le quartier par ses colis."
      - "Un carton au nom d'un joueur du club attend depuis trois semaines. L'épicier dit qu'il n'a pas le droit de dire ce qu'il y a dedans. Il a le droit de dire que c'est lourd."
      - "Une vieille dame vient chercher un colis qu'elle n'a pas commandé. Elle l'ouvre sur le comptoir : une écharpe du club, et pas de carte. Elle la met tout de suite."
    tranches: 0
    francs: 0

  - id: epi_courses
    lieu: epicerie
    habitude: quartier
    objet: rayons
    label: "Quelques courses"
    texte: "Des pâtes, du café, une boîte de sardines. L'épicier te suit dans le rayon pour parler du match ; il range les conserves que tu viens de prendre, pour avoir l'air occupé."
    textes:
      - "Des pâtes, du café, une boîte de sardines. L'épicier te suit dans le rayon pour parler du match ; il range les conserves que tu viens de prendre, pour avoir l'air occupé."
      - "Le rayon des conserves est rangé par couleur, pas par produit. L'épicier trouve ça plus joli. Tu cherches le café entre les petits pois et les haricots verts."
      - "Tu fais tes courses à l'heure où l'épicerie est vide. L'épicier en profite pour demander, à voix basse, si le club tiendra jusqu'en mai. Tu dis que oui. Il arrondit l'addition en dessous."
    tranches: 1
    francs: -40

  - id: epi_biere
    lieu: epicerie
    habitude: comptoir
    objet: frigo
    label: "Une bière fraîche"
    texte: "Le frigo des bières ronronne près de la porte. L'épicier décapsule la bouteille contre le bord du comptoir, d'un coup sec, sans regarder."
    textes:
      - "Le frigo des bières ronronne près de la porte. L'épicier décapsule la bouteille contre le bord du comptoir, d'un coup sec, sans regarder."
      - "Tu bois ta bière devant l'épicerie, sur la caisse retournée qui sert de banc. Les gamins du quartier passent à vélo et ralentissent pour te regarder boire."
      - "Le frigo a une étagère pour la bière de Valdorne et une pour celle d'ici. L'épicier te sert celle d'ici sans demander : « Les jours de match, je ne vends que celle-là. »"
    tranches: 0
    francs: -6

  - id: epi_pack
    lieu: epicerie
    habitude: largesse
    objet: frigo
    roles: [joueur]
    label: "Un pack pour les gars"
    texte: "Un pack de bières pour les gars, après la séance du jeudi. L'épicier l'emballe dans un journal, par habitude : « Pour que l'entraîneur ne voie pas l'étiquette. »"
    textes:
      - "Un pack de bières pour les gars, après la séance du jeudi. L'épicier l'emballe dans un journal, par habitude : « Pour que l'entraîneur ne voie pas l'étiquette. »"
      - "Tu poses le pack sur le capot d'une voiture, au parking du stade. Les gars arrivent un par un. Le plus jeune boit un soda, et personne ne se moque de lui."
      - "L'épicier ajoute un paquet de chips au pack, sans le compter. « Pour les remplaçants. Ce sont toujours eux qui ont faim. »"
    tranches: 0
    francs: -45
    heures: [soir]
    jauges: {vestiaire: 1}

  - id: epi_ardoise
    lieu: epicerie
    habitude: largesse
    objet: cahier
    label: "Payer une ardoise"
    texte: "L'épicier ouvre le cahier des ardoises à une page au hasard : un abonné de la Nord, quatorze lignes de lait et de bière. Tu paies. Il barre la page d'un trait, très droit."
    textes:
      - "L'épicier ouvre le cahier des ardoises à une page au hasard : un abonné de la Nord, quatorze lignes de lait et de bière. Tu paies. Il barre la page d'un trait, très droit."
      - "Tu demandes à payer l'ardoise de quelqu'un. L'épicier choisit lui-même : une veuve du quartier, des œufs, du café, du sucre. « Elle ne saura pas qui. Elle saura que quelqu'un. »"
      - "Le cahier sent le savon et la mine de crayon. L'épicier tourne les pages du pouce mouillé, trouve le nom d'un ancien du club, et le barre devant toi."
      - "Sous la couverture de cuir usée aux coins, plus de noms de la Nord que de la paroisse. Tu en effaces un ; l'épicier dit qu'il en reste quarante-deux, et que tu n'es pas obligé."
    tranches: 0
    francs: -150
    jauges: {tribunes: 1}

  # ═════════════════════════════════════════════ AUX IMMORTELLES (fleuriste)
  # Matin et après-midi. Le comptoir, les seaux de fleurs, les gerbes du club,
  # la chambre froide. Des chrysanthèmes toute l'année, et les jours de deuil.
  - id: fleur_bouquet
    lieu: fleuriste
    habitude: famille
    objet: fleurs
    label: "Un bouquet"
    texte: "Tu choisis dans les seaux ; la fleuriste refait le bouquet à sa façon. Elle demande pour qui. Tu dis un prénom. Elle retire deux fleurs jaunes, sans expliquer pourquoi."
    textes:
      - "Tu choisis dans les seaux ; la fleuriste refait le bouquet à sa façon. Elle demande pour qui. Tu dis un prénom. Elle retire deux fleurs jaunes, sans expliquer pourquoi."
      - "Un bouquet de saison dans du papier kraft. La fleuriste écrit la carte pour toi, d'une écriture penchée, et te la fait relire. Il n'y a rien à corriger. Elle corrige une virgule."
      - "Elle te demande si c'est pour s'excuser ou pour remercier : les deux ne se font pas pareil. Tu dis remercier. Elle n'a pas l'air de te croire, et fait un peu des deux."
      - "Les seaux débordent sur le trottoir. Tu prends des glaïeuls ; la fleuriste les coupe court, à l'oblique, d'un seul geste, comme on tranche un fil."
    tranches: 0
    francs: -100

  - id: fleur_blesse
    lieu: fleuriste
    habitude: largesse
    objet: comptoir
    label: "Des fleurs pour un blessé"
    texte: "Tu fais livrer des fleurs chez le joueur opéré du genou. La fleuriste demande quoi écrire sur la carte. Tu dictes trois mots. Elle en ajoute un, plus petit."
    textes:
      - "Tu fais livrer des fleurs chez le joueur opéré du genou. La fleuriste demande quoi écrire sur la carte. Tu dictes trois mots. Elle en ajoute un, plus petit."
      - "Le bouquet part pour la clinique dans la camionnette de la fleuriste. Elle connaît le numéro de la chambre : elle y a déjà livré, la saison dernière, pour un autre genou."
      - "La fleuriste refuse les fleurs blanches pour un blessé. « Les blanches, c'est pour mes autres clients. Pour lui, du rouge, du jaune. Il faut qu'il ait envie de sortir. »"
    tranches: 0
    francs: -150
    jauges: {vestiaire: 1}

  - id: fleur_gerbe
    lieu: fleuriste
    habitude: largesse
    objet: gerbes
    label: "Une gerbe pour un abonné"
    texte: "Un abonné de la Nord est mort mardi, quarante ans au même rang. Tu commandes la gerbe aux couleurs du club, une écharpe nouée sur la couronne. Ton nom ira sur le ruban."
    textes:
      - "Un abonné de la Nord est mort mardi, quarante ans au même rang. Tu commandes la gerbe aux couleurs du club, une écharpe nouée sur la couronne. Ton nom ira sur le ruban."
      - "La fleuriste monte la gerbe sur une armature de fil de fer, fleur après fleur. « La famille voulait la vôtre plus petite que celle de la tribune. C'est bien. C'est comme ça qu'il faut. »"
      - "Le lendemain, au cimetière, ta gerbe est posée au pied de la tombe, entre celle de la tribune et une écharpe nouée à la croix. Le fils te serre la main sans savoir qui tu es."
    tranches: 0
    francs: -450
    jauges: {tribunes: 2}

  - id: fleur_gerbe_tribune
    lieu: fleuriste
    habitude: largesse
    objet: gerbes
    si: "flag(sb_mort_tribune)"
    label: "Des fleurs pour la rangée H"
    texte: "Depuis le malaise en tribune, la fleuriste prépare des fleurs pour chaque match à domicile. Tu paies celles de samedi. Elles seront posées sur le siège vide de la rangée H."
    textes:
      - "Depuis le malaise en tribune, la fleuriste prépare des fleurs pour chaque match à domicile. Tu paies celles de samedi. Elles seront posées sur le siège vide de la rangée H."
      - "La fleuriste a déjà le ruban, brodé par des femmes de la Nord. « Le ruban, la tribune l'a payé. Les fleurs, personne. Je vous laisse faire, si vous voulez. »"
      - "Sur le plan du stade punaisé au mur, une croix au crayon : rangée H. « La famille ne voulait pas de minute de silence. Des fleurs, elle veut bien. »"
    tranches: 0
    francs: -300
    jauges: {tribunes: 1}

  - id: fleur_couronne
    lieu: fleuriste
    habitude: quartier
    objet: chambre_froide
    roles: [joueur]
    si: "division >= 2"
    label: "Livrer une couronne"
    texte: "La fleuriste te confie une couronne pour le funérarium de la route de Valdorne, calée sur la banquette arrière avec des journaux. « Doucement dans les virages. Il n'est plus pressé. »"
    textes:
      - "La fleuriste te confie une couronne pour le funérarium de la route de Valdorne, calée sur la banquette arrière avec des journaux. « Doucement dans les virages. Il n'est plus pressé. »"
      - "Trois bouquets et une couronne à livrer dans la matinée. À la maison de retraite, une dame te reconnaît, te retient un quart d'heure et te parle de son mari, qui jouait arrière."
      - "La couronne pèse plus lourd qu'elle n'en a l'air. La fleuriste te paie en liquide et en fleurs coupées : « Pour votre cuisine. Elles dureront plus que la saison. »"
    tranches: 1
    francs: 70
    heures: [matin, aprem]
    max_jour: 1

  - id: fleur_chambre_froide
    lieu: fleuriste
    habitude: quartier
    objet: chambre_froide
    label: "La chambre froide"
    texte: "La fleuriste ouvre la chambre froide pour te montrer les gerbes de samedi, alignées comme une équipe. Il y fait plus froid qu'au stade un soir de janvier. Elle referme vite."
    textes:
      - "La fleuriste ouvre la chambre froide pour te montrer les gerbes de samedi, alignées comme une équipe. Il y fait plus froid qu'au stade un soir de janvier. Elle referme vite."
      - "Dans la chambre froide, à côté des roses, un carton marqué au feutre : « Club — ne pas toucher ». La fleuriste dit que ce sont les fleurs de la loge. Elle ne l'ouvre pas devant toi."
      - "À la fermeture, la fleuriste range les seaux dans la chambre froide et te laisse porter les plus lourds. « Les gens du club, d'habitude, prennent les plus légers. »"
    tranches: 0
    francs: 0
