      - "Le garçon tourne la télé vers le comptoir, l'écran à moitié caché par les bouteilles. On écoute plus qu'on ne regarde."
      - "La présentatrice prononce le nom de la ville avec le mauvais accent. Toute la salle la corrige en chœur, comme à la messe."
      - "Au café de la Mairie, on regarde la télé debout, la tasse à la main, pour pouvoir partir avant la fin."
