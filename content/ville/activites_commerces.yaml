    texte: "Onze hommes en maillots de laine, les bras croisés, le gardien en casquette. Sous le cadre, une plaque de cuivre : « Champions, 1962 ». Le cuivre brille plus que le reste : on le frotte."
    textes:
      - "Onze hommes en maillots de laine, les bras croisés, le gardien en casquette. Sous le cadre, une plaque de cuivre : « Champions, 1962 ». Le cuivre brille plus que le reste : on le frotte."
