  - id: cafe_vitre_manif
    lieu: cafe_mairie
    habitude: comptoir
    objet: vitre
    si: "flag(sb_manif)"
    label: "La place, depuis la manif"
    texte: "Sur les pavés, devant les marches de la mairie, la trace noire d'un fumigène. Le cantonnier a frotté une semaine ; elle est devenue grise, et elle est restée."
    textes:
      - "Sur les pavés, devant les marches de la mairie, la trace noire d'un fumigène. Le cantonnier a frotté une semaine ; elle est devenue grise, et elle est restée."
      - "Un bout de banderole est encore noué à la grille de la mairie, effiloché par le vent. On n'y lit plus que deux lettres. Tout le monde sait lesquelles manquent."
      - "Le garçon montre la vitre, à hauteur d'homme : une étoile dans le verre, recollée au ruban adhésif. « Le jour de la manif. Une pièce de monnaie. Le patron l'a gardée. »"
    tranches: 0
    francs: 0

