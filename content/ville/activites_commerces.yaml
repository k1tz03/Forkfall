    texte: "Un café contre la vitre. Sur la place, le cantonnier balaie autour de la fontaine, dans le même sens depuis toujours. Les pigeons reviennent derrière lui, dans le même ordre."
    textes:
      - "Un café contre la vitre. Sur la place, le cantonnier balaie autour de la fontaine, dans le même sens depuis toujours. Les pigeons reviennent derrière lui, dans le même ordre."
      - "De la vitre, on voit l'escalier de la mairie. Un huissier y fume en cachette, la cigarette dans le creux de la main, comme au lycée."
      - "Il pleut sur la place. Un homme attend sous l'auvent de la mairie depuis une heure, une enveloppe à la main. Il la remet dans sa poche chaque fois que la porte s'ouvre."
      - "Les affiches électorales ont été recollées les unes sur les autres. Sur le panneau du milieu, il ne reste du candidat que le sourire."
