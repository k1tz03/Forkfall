      - "Tu règles l'addition des anciens à la caisse, sans le leur dire. Le patron pique la note sur le clou ; à la table du fond, on se dispute pour savoir lequel l'a payée."
      - "Le patron encaisse et rend la monnaie pièce par pièce. « Ils viennent ici depuis l'année du titre. Personne ne leur a jamais payé un café. Ils ne vont pas savoir quoi faire. »"
      - "Les anciens apprennent que c'est réglé au moment de sortir. Le plus vieux revient sur ses pas, ôte sa casquette, la tient contre sa poitrine une seconde, et la remet."
      - "Le patron note la date dans la marge de son cahier, avec ton nom, au crayon. « Pour quand ça ira mal. Ici, on se souvient de ceux qui ont payé. »"
