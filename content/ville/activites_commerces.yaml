      - "Un client demande lequel est le grand-père du patron. Le patron montre le soigneur, au bout du rang, une serviette sur l'épaule : le seul qui sourit."
      - "Au dos d'un menu glissé dans le cadre, quelqu'un a écrit les noms au crayon. Le troisième en partant de la gauche n'a pas de nom : juste un point d'interrogation."
