    texte: "Tu fais semblant de choisir des poireaux, et tu écoutes. Le marché sait tout avant le journal : les transferts, les divorces, les augmentations."
    textes:
      - "Tu fais semblant de choisir des poireaux, et tu écoutes. Le marché sait tout avant le journal : les transferts, les divorces, les augmentations."
      - "Au stand du boucher, on refait le match de samedi minute par minute. Ils ne sont d'accord sur rien, sauf sur l'arbitre."
      - "Deux femmes parlent d'un joueur qui « a une voiture trop grande pour sa rue ». Elles ne disent pas son nom ; elles n'en ont pas besoin."
      - "Le poissonnier annonce le prix des soles comme on annonce un but. La file applaudit, par habitude."
      - "On parle de toi au stand des fromages, puis on te voit, et on parle de la pluie, très fort."
