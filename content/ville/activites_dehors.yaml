# DEHORS — ce qu'on fait aux douze lieux sans pièce : le terrain annexe, le square, le
# cimetière, la friche, la fontaine, le marché, le monument, le kiosque, le lavoir, la voiture,
# le feu de palettes, le mur des plaques. Pas d'`objet` : elles s'affichent dans le panneau du
# lieu, qu'on ouvre en s'approchant de sa porte.
#
# Le format : docs/histoires/scenes_jouees.md § 5. Les variantes `textes` sont tirées tour à
# tour ; `texte` reste celle qu'on lit quand il n'y en a pas d'autre. Les francs sont ceux de
# 1990 (la ville les convertit selon l'époque, puis en écus) : de petites dépenses, de petits
# gains. Les jauges restent à la marge (± 1, une fois par semaine). Un petit jeu (`jeu`) dit
# sa propre phrase à la fin de la partie : son texte ne sert qu'à dire ce qu'on fait. La nuit,
# une activité qui prend une tranche n'est plus possible (« il est trop tard ») : celles du
# feu, qui se font la nuit, prennent le temps de rien. Un lieu qui a ses heures (le terrain
# annexe, le kiosque) ferme son panneau en dehors.
activites:

  # ─── le terrain annexe (il garde déjà la séance de l'entraîneur, l'entraînement du joueur
  #     et le joueur qu'on va voir derrière la haie, pour le sélectionneur)
  - id: dehors_terrain_tirs
    lieu: terrain
    habitude: sport
    label: "Tirs au but avec les gamins"
    texte: "Le gardien des moins de quinze ans tient le but avec des gants deux fois trop grands. Il plonge toujours du même côté, et c'est souvent le bon."
    textes:
      - "Le gardien des moins de quinze ans tient le but avec des gants deux fois trop grands. Il plonge toujours du même côté, et c'est souvent le bon."
      - "Cinq tirs, un plot pour point de penalty. Derrière la haie, deux pères comptent à voix haute."
      - "Le petit gardien crache dans ses gants comme il l'a vu faire à la télé. Il ne sait pas pourquoi on fait ça ; il le fait quand même."
    tranches: 0
    max_jour: 2
    heures: [aprem, soir]
    jeu: penalty

  - id: dehors_terrain_arbitrer
    lieu: terrain
    habitude: travail
    label: "Arbitrer les poussins"
    texte: "Un sifflet prêté par l'éducateur, deux équipes de six ans, et quarante minutes à expliquer que la main, c'est quand on le fait exprès."
    textes:
      - "Un sifflet prêté par l'éducateur, deux équipes de six ans, et quarante minutes à expliquer que la main, c'est quand on le fait exprès."
      - "Un gamin s'assoit au milieu du terrain pour refaire son lacet, et le match s'arrête de lui-même, poliment, autour de lui."
      - "Tu siffles un penalty. Le tireur pleure de peur ; le gardien pleure aussi. Tu fais retirer, sans savoir pourquoi."
      - "Score final : quatorze à onze. Personne n'est d'accord, et tout le monde va boire un sirop."
    tranches: 1
    jours: [mer]
    heures: [aprem]
    jauges: {tribunes: 1}

  - id: dehors_terrain_ballons
    lieu: terrain
    habitude: sport
    label: "Chercher les ballons perdus"
    texte: "Derrière la haie de thuyas, entre les racines : trois ballons, un protège-tibia, et une lettre d'amour pliée en huit, que tu ne lis pas."
    textes:
      - "Derrière la haie de thuyas, entre les racines : trois ballons, un protège-tibia, et une lettre d'amour pliée en huit, que tu ne lis pas."
      - "Un ballon dans les salades de la voisine. Elle te le rend par-dessus le grillage, en te faisant promettre que c'est le dernier."
      - "Quatre ballons, dont un si vieux qu'il a encore des lacets de cuir. Le jardinier le reconnaît : il date d'avant la pelouse."
      - "Sous les thuyas, un nid de ballons dégonflés, comme des œufs qui n'écloront pas. Tu les ramènes quand même au local."
    tranches: 1
    heures: [matin, aprem, soir]

  - id: dehors_terrain_haie
    lieu: terrain
    habitude: travail
    roles: [ds, president]
    label: "Regarder derrière la haie"
    texte: "Derrière les thuyas, on voit la réserve sans qu'elle vous voie. Un latéral qui ne parle à personne fait tout juste, deux fois de suite."
    textes:
      - "Derrière les thuyas, on voit la réserve sans qu'elle vous voie. Un latéral qui ne parle à personne fait tout juste, deux fois de suite."
      - "La réserve fait des toros. Le gamin qui perd le ballon le plus souvent est aussi celui qui le réclame le plus. Tu notes son numéro."
      - "Un joueur de l'équipe première s'entraîne avec la réserve, puni. Il est le meilleur sur le terrain, et le seul qui ne sourit pas."
      - "Un vieux est déjà là, derrière la haie, à ta place. Il te fait un signe de tête, comme entre collègues, et ne dit plus rien."
    tranches: 1
    heures: [matin, aprem]
    jauges: {vestiaire: 1}

  - id: dehors_terrain_lignes
    lieu: terrain
    habitude: travail
    roles: [entraineur, joueur]
    label: "Aider à tracer les lignes"
    texte: "Le jardinier pousse la traceuse, tu tiens le cordeau. Une ligne de touche droite, c'est quarante minutes et un dos en compote."
    textes:
      - "Le jardinier pousse la traceuse, tu tiens le cordeau. Une ligne de touche droite, c'est quarante minutes et un dos en compote."
      - "Il refait le point de penalty trois fois. « Onze mètres, pas un pas de plus. Les arbitres comptent, ici. »"
      - "La craie colle aux semelles jusqu'au soir. Tu laisses des empreintes blanches jusque sur le trottoir de la rue."
      - "Le rond central est un peu ovale. Le jardinier dit qu'il l'a toujours été, et que c'est pour ça qu'on gagne à domicile."
    tranches: 1
    jours: [jeu, ven]
    heures: [matin]
    jauges: {vestiaire: 1}

  # ─── le square des Lilas
  - id: dehors_square_jongles
    lieu: square
    habitude: sport
    label: "Jongler avec les gamins"
    texte: "Trois gamins te tendent un ballon qui a perdu ses couleurs. « Dix jongles, et on te croit. »"
    textes:
      - "Trois gamins te tendent un ballon qui a perdu ses couleurs. « Dix jongles, et on te croit. »"
      - "Les gamins comptent à voix haute, de plus en plus fort, comme si le ballon les entendait."
      - "Un vieux pose son journal sur le banc pour compter avec les gamins. Il triche pour toi."
    tranches: 0
    max_jour: 2
    heures: [aprem, soir]
    jeu: jongles

  - id: dehors_square_banc
    lieu: square
    habitude: soin
    label: "S'asseoir sur un banc"
    texte: "Le banc de gauche grince quand on s'assoit. Une demi-heure à regarder les pigeons, les poussettes, et la grille qui s'ouvre et se ferme."
    textes:
      - "Le banc de gauche grince quand on s'assoit. Une demi-heure à regarder les pigeons, les poussettes, et la grille qui s'ouvre et se ferme."
      - "Un gamin fait le tour du bac à sable en commentant son propre match, à voix basse : « Il dribble, il dribble encore… »"
      - "Une femme lit sur le banc d'en face. Elle tourne une page toutes les cinq minutes, et lève les yeux à chaque ballon."
      - "Deux vieux jouent aux échecs de mémoire, sans échiquier. L'un des deux triche, et l'autre le sait."
      - "Le soleil passe derrière le pignon, et tout le square change de couleur d'un coup, comme une tribune qui se tait."
    tranches: 1

  - id: dehors_square_pigeons
    lieu: square
    habitude: famille
    si: "annee < 2012"
    label: "Du pain pour les pigeons"
    texte: "Un quignon émietté sur le gravier. Les pigeons arrivent d'abord à trois, puis à trente, et le plus gros se sert le premier."
    textes:
      - "Un quignon émietté sur le gravier. Les pigeons arrivent d'abord à trois, puis à trente, et le plus gros se sert le premier."
      - "Un pigeon boiteux reste à l'écart. Tu vises pour lui ; un autre lui vole sa miette à chaque fois."
      - "Une vieille dame te regarde faire, contente. « Celui avec la tache blanche, c'est Gaston. Il a dix ans. Il ne rate jamais rien. »"
    tranches: 0
    francs: -2

  - id: dehors_square_journal
    lieu: square
    habitude: culture
    label: "L'Écho sur un banc"
    texte: "L'Écho acheté au coin de la rue, déplié sur le banc qui grince. On lit d'abord la page du club, puis la météo, puis la page du club encore."
    tranches: 1
    francs: -4
    special: journal

  - id: dehors_square_ballon
    lieu: square
    habitude: sport
    label: "Renvoyer le ballon"
    texte: "Un ballon roule jusqu'à tes pieds. Tu le renvoies du plat du pied ; trois gamins le regardent revenir comme un cadeau."
    textes:
      - "Un ballon roule jusqu'à tes pieds. Tu le renvoies du plat du pied ; trois gamins le regardent revenir comme un cadeau."
      - "Tu le renvoies un peu trop fort. Il passe par-dessus la grille, et les gamins te regardent comme on regarde un adulte."
      - "Le ballon revient vers toi, exprès. Puis encore. Au bout de dix minutes, tu fais partie de l'équipe des petits."
      - "Une gamine bloque le ballon sous sa semelle et te le rend d'une passe parfaite, sans un sourire, pour te montrer."
    tranches: 0
    max_jour: 3

  # ─── le cimetière d'Aubérive
  - id: dehors_cimetiere_caveau
    lieu: cimetiere
    habitude: foi
    label: "Fleurir le caveau du Racing"
    texte: "Un pot de bruyère au fond à gauche, devant les présidents, les deux capitaines et le soigneur. La terre est encore mouillée : quelqu'un est passé avant toi."
    textes:
      - "Un pot de bruyère au fond à gauche, devant les présidents, les deux capitaines et le soigneur. La terre est encore mouillée : quelqu'un est passé avant toi."
      - "Tu poses tes fleurs à côté d'une écharpe délavée et d'un ticket de match de 1974, coincé sous un caillou."
      - "Le gardien te regarde faire, de loin. Il note quelque chose dans son carnet, puis revient avec un arrosoir, sans rien dire."
      - "Sur la plaque du soigneur, quelqu'un a laissé un flacon d'huile camphrée, débouché. L'odeur des vestiaires flotte entre les tombes."
    tranches: 1
    francs: -30
    jauges: {tribunes: 1}

  - id: dehors_cimetiere_allees
    lieu: cimetiere
    habitude: foi
    label: "Marcher dans les allées"
    texte: "Les allées de gravier, les cyprès, le bruit de tes pas. Sur une tombe, des crampons gravés dans le marbre, la semelle tournée vers le ciel."
    textes:
      - "Les allées de gravier, les cyprès, le bruit de tes pas. Sur une tombe, des crampons gravés dans le marbre, la semelle tournée vers le ciel."
      - "Une stèle au nom d'un arbitre : « Il a sifflé juste. » Personne n'y a mis de fleurs depuis longtemps."
      - "Dans le carré des enfants, un ballon en plastique posé sur une tombe minuscule. Il a pâli au soleil ; il n'a pas bougé."
      - "Trois tombes de la même famille, trois générations d'abonnés, trois écharpes nouées aux croix. La plus récente est encore bordeaux."
      - "Un banc au bout de l'allée, face au mur. Quelqu'un y a gravé au couteau un score de 1962, et la date."
    tranches: 1

  - id: dehors_cimetiere_arrosoirs
    lieu: cimetiere
    habitude: foi
    label: "Porter les arrosoirs"
    texte: "Une veuve de quatre-vingts ans, deux arrosoirs pleins, et l'allée qui monte. Tu les portes ; elle marche devant et te présente ses voisins."
    textes:
      - "Une veuve de quatre-vingts ans, deux arrosoirs pleins, et l'allée qui monte. Tu les portes ; elle marche devant et te présente ses voisins."
      - "Elle arrose son mari, puis la tombe d'à côté. « Lui, plus personne ne vient. Il était de l'autre club, mais on ne laisse sécher personne. »"
      - "Au robinet, elle te raconte le match où son mari a pleuré, en 1974. Elle ne se souvient plus du score, seulement des larmes."
      - "Elle te remercie avec un bonbon à la menthe sorti de son sac, dans un papier qui a l'âge du bonbon."
    tranches: 1
    heures: [matin, aprem]

  - id: dehors_cimetiere_desherber
    lieu: cimetiere
    habitude: foi
    label: "Désherber une tombe oubliée"
    texte: "Une tombe que plus personne ne fleurit. Sous les herbes, un nom, deux dates, et un écusson du club à moitié effacé."
    textes:
      - "Une tombe que plus personne ne fleurit. Sous les herbes, un nom, deux dates, et un écusson du club à moitié effacé."
      - "Tu arraches le chiendent à mains nues. Le gardien passe, s'arrête, et te prête des gants sans un mot."
      - "Sous la mousse, une inscription : « Avant-centre, 1931-1939. » Rien d'autre. À l'époque, ça suffisait."
    tranches: 1

  # ─── la friche de la Tréfilerie
  - id: dehors_friche_explorer
    lieu: friche
    habitude: quartier
    label: "Explorer la friche"
    texte: "Des palettes, des câbles, des vitres cassées qui crissent sous les semelles. Au fond, une horloge d'atelier arrêtée sur cinq heures moins le quart."
    textes:
      - "Des palettes, des câbles, des vitres cassées qui crissent sous les semelles. Au fond, une horloge d'atelier arrêtée sur cinq heures moins le quart."
      - "Dans un bureau sans porte, un calendrier punaisé, ouvert sur un mois d'une année où l'usine tournait encore."
      - "Un pigeon s'envole d'un coup, puis cent. Le bruit d'ailes remplit la halle comme une tribune qui se lève."
      - "Sur un mur, à la peinture, les équipes du tournoi des ateliers : Tréfilage, Fours, Expédition. Les Fours avaient gagné."
      - "Un gamin te regarde depuis une fenêtre du premier étage, puis disparaît. Quand tu lèves la tête de nouveau, il est sur le toit."
    tranches: 1
    heures: [matin, aprem]

  - id: dehors_friche_tags
    lieu: friche
    habitude: culture
    label: "Lire les tags"
    texte: "Sur le mur du bâtiment des fours, des tags par couches, comme des pages : des prénoms, des cœurs, un score, et la Nord en lettres de deux mètres."
    textes:
      - "Sur le mur du bâtiment des fours, des tags par couches, comme des pages : des prénoms, des cœurs, un score, et la Nord en lettres de deux mètres."
      - "Un tag tout frais, la peinture coule encore : le nom du club, une date, et une promesse qu'il faudra tenir."
      - "« ICI ON A TRAVAILLÉ », en capitales, à la main, sous la fenêtre de l'ancien vestiaire des ouvriers."
      - "Quelqu'un a repeint en gris un tag qui t'insultait. On devine encore les lettres dessous, à contre-jour."
      - "Un pochoir de gardien plongeant, répété vingt fois sur toute la longueur du mur, comme un film image par image."
    tranches: 0

  - id: dehors_friche_ferraille
    lieu: friche
    habitude: quartier
    roles: [joueur]
    si: "annee < 2003"
    label: "Charger pour le ferrailleur"
    texte: "Le ferrailleur du quai paie à la tonne, et il lui faut des bras. Une heure à charger des poutrelles dans sa camionnette, contre un billet plié en quatre."
    textes:
      - "Le ferrailleur du quai paie à la tonne, et il lui faut des bras. Une heure à charger des poutrelles dans sa camionnette, contre un billet plié en quatre."
      - "Il te reconnaît à la troisième poutrelle. « Ça muscle mieux que leurs machines. Mais ne le dis pas à ton entraîneur. »"
      - "Ses mains sont noires jusqu'aux poignets. Les tiennes aussi, maintenant. Il te paie en t'expliquant le cours du cuivre."
      - "Il charge en chantant faux le refrain de la Nord. Il ne connaît que le refrain, alors il le chante en boucle."
    tranches: 1
    francs: 40
    max_jour: 1

  - id: dehors_friche_palettes
    lieu: friche
    habitude: quartier
    label: "Ramasser des palettes"
    texte: "Tu tires deux palettes de la pile pour le feu du soir. Elles sont plus lourdes qu'elles n'en ont l'air, et pleines d'échardes."
    textes:
      - "Tu tires deux palettes de la pile pour le feu du soir. Elles sont plus lourdes qu'elles n'en ont l'air, et pleines d'échardes."
      - "Sous une palette, une couverture roulée et une boîte de conserve. Tu reposes la palette exactement où elle était."
      - "Un homme t'aide à porter la deuxième sans rien demander. Au feu, il la pose et repart dans le noir."
    tranches: 1
    heures: [soir]

  # ─── la fontaine de la place
  - id: dehors_fontaine_piece
    lieu: fontaine
    habitude: foi
    label: "Jeter une pièce"
    texte: "La pièce tourne dans l'eau, brille une seconde et rejoint les autres au fond. Le vœu, tu le gardes pour toi : c'est la règle."
    textes:
      - "La pièce tourne dans l'eau, brille une seconde et rejoint les autres au fond. Le vœu, tu le gardes pour toi : c'est la règle."
      - "Elle tombe pile sur une autre pièce, avec un petit bruit clair. Un gamin dit que ça compte double."
      - "Un pigeon se pose sur la margelle et regarde la pièce couler, comme s'il connaissait le vœu."
      - "Une vieille dame jette la sienne en même temps que toi. Vous ne vous dites pas ce que vous avez demandé."
      - "Ta pièce rate le bassin et roule sur les pavés. Tu la ramasses et tu recommences, plus près. Ça compte, la deuxième fois ?"
    tranches: 0
    francs: -1
    max_jour: 1

  - id: dehors_fontaine_rendezvous
    lieu: fontaine
    habitude: quartier
    label: "Regarder les rendez-vous"
    texte: "Le soir, on se donne rendez-vous à la fontaine. Un garçon fait trois fois le tour du bassin avec un bouquet, puis s'assoit, puis se relève."
    textes:
      - "Le soir, on se donne rendez-vous à la fontaine. Un garçon fait trois fois le tour du bassin avec un bouquet, puis s'assoit, puis se relève."
      - "Deux vieux amants se retrouvent comme chaque soir, à heure fixe. Ils se serrent la main. Ils se sont toujours serré la main."
      - "Une fille attend en regardant l'horloge de la mairie. Quand il arrive enfin, elle fait semblant d'arriver aussi."
      - "Trois copains en écharpe attendent le quatrième pour aller à la buvette. Il n'arrive pas ; ils partent quand même, en se retournant."
    tranches: 1
    heures: [soir]

  - id: dehors_fontaine_pieds
    lieu: fontaine
    habitude: soin
    si: "phase == presaison"
    label: "Tremper les pieds"
    texte: "L'eau est froide à couper le souffle, puis non. Autour de la margelle, une rangée de chaussures et des orteils de toutes les tailles."
    textes:
      - "L'eau est froide à couper le souffle, puis non. Autour de la margelle, une rangée de chaussures et des orteils de toutes les tailles."
      - "Un gamin te regarde tremper les pieds, puis regarde ses parents, puis enlève ses sandales. Sa mère soupire."
      - "Une ampoule de la semaine te remercie. Pour une fois, personne ne te demande rien."
    tranches: 1

  - id: dehors_fontaine_musicien
    lieu: fontaine
    habitude: largesse
    label: "Une pièce au musicien"
    texte: "L'accordéoniste de la margelle te fait un signe de tête et enchaîne sur une valse plus lente, pour que ta pièce dure."
    textes:
      - "L'accordéoniste de la margelle te fait un signe de tête et enchaîne sur une valse plus lente, pour que ta pièce dure."
      - "Il joue le chant de la Nord dès que tu t'approches. Il le joue pour tout le monde, mais il te regarde en le jouant."
      - "Dans l'étui, à côté des pièces, une photo de lui jeune, en maillot, dans une équipe dont personne ne se souvient."
      - "Il refuse la pièce, puis la prend. « Revenez quand j'aurai mes doigts. Aujourd'hui, je joue faux. »"
    tranches: 0
    francs: -3
    heures: [aprem, soir]

  - id: dehors_fontaine_programme
    lieu: fontaine
    habitude: quartier
    roles: [president, ds]
    label: "Distribuer le programme"
    texte: "Une pile de programmes du match sous le bras, sur la place. Les gens le prennent poliment et le lisent en marchant, en commençant par la fin."
    textes:
      - "Une pile de programmes du match sous le bras, sur la place. Les gens le prennent poliment et le lisent en marchant, en commençant par la fin."
      - "Un vieux refuse le programme : « Je l'aurai au stade. C'est au stade que ça compte. » Il le prend quand même, pour sa femme."
      - "Une gamine en prend deux, un pour elle, un pour son frère qui n'aime pas le foot. « Il le lira, si c'est moi qui le donne. »"
      - "Un homme te demande si c'est payé, ce travail-là. Tu dis non. Il prend le programme avec plus d'égards."
    tranches: 1
    jours: [sam]
    heures: [matin]
    jauges: {tribunes: 1}

  # ─── la place du marché
  - id: dehors_marche_courses
    lieu: marche
    jours: [mer, sam, dim]
    habitude: quartier
    label: "Faire le marché"
    texte: "Des tomates, un fromage qu'on te fait goûter d'office, et le pain de la semaine. Trois fois, on te demande ce qui se passera samedi."
    textes:
      - "Des tomates, un fromage qu'on te fait goûter d'office, et le pain de la semaine. Trois fois, on te demande ce qui se passera samedi."
      - "La marchande pèse tes pommes, en enlève une, la remplace par une plus belle. « Celle-là, c'était pour ceux qui ne vont pas au stade. »"
      - "Au stand des œufs, une file. Personne ne te laisse passer devant, et c'est la première chose qui te fait du bien de la semaine."
      - "Le fromager te fait goûter un fromage qui pique. « C'est celui qu'on mange quand on a perdu. Ça fait oublier. »"
      - "Ton cabas pèse plus lourd que prévu : quelqu'un y a glissé un bouquet de persil, en cadeau, sans signer."
    tranches: 1
    francs: -40
    heures: [matin, midi]

  - id: dehors_marche_remballer
    lieu: marche
    jours: [mer, sam, dim]
    habitude: quartier
    roles: [joueur, entraineur]
    label: "Aider à remballer"
    texte: "À midi, le maraîcher replie ses tréteaux. Tu portes les cageots jusqu'à la camionnette ; il te glisse un billet et un sac de prunes."
    textes:
      - "À midi, le maraîcher replie ses tréteaux. Tu portes les cageots jusqu'à la camionnette ; il te glisse un billet et un sac de prunes."
      - "La bâche du boucher s'envole d'un coup de vent ; tu la rattrapes au vol. Il te paie moitié en saucisses, moitié en monnaie."
      - "La fleuriste refuse que tu portes ses cagettes. « Elles s'abîment quand on les porte trop vite. » Tu portes les tréteaux."
      - "Le maraîcher compte sa recette à voix haute, comme on commente un match. « Bonne journée. Si on gagne samedi, meilleure encore. »"
    tranches: 1
    francs: 30
    heures: [midi]
    max_jour: 1

  - id: dehors_marche_bouquet
    lieu: marche
    jours: [mer, sam, dim]
    habitude: famille
    label: "Un bouquet pour quelqu'un"
    texte: "La marchande compose le bouquet sans te demander pour qui. Elle met des fleurs blanches, puis en enlève une et ajoute une rouge."
    textes:
      - "La marchande compose le bouquet sans te demander pour qui. Elle met des fleurs blanches, puis en enlève une et ajoute une rouge."
      - "« Pour une femme, un homme, ou un mort ? » Tu ne réponds pas. Elle fait un bouquet qui marche pour les trois."
      - "Elle emballe les fleurs dans une page du journal, celle des sports, et plie le papier pour que ton nom ne se voie pas."
      - "Des pivoines, trop grosses pour la main. Dans la rue, les gens te regardent passer avec une curiosité tendre."
    tranches: 0
    francs: -25
    heures: [matin, midi]

  - id: dehors_marche_camion
