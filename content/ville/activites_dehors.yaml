    heures: [matin, midi]

  # ─── le monument aux morts, devant Saint-Aubin
  - id: dehors_monument_noms
    lieu: monument
    habitude: foi
    label: "Lire les noms"
    texte: "Les noms de 1914, ceux de 1940, gravés serrés. Tu en reconnais quatre : ce sont ceux des rues du quartier."
    textes:
      - "Les noms de 1914, ceux de 1940, gravés serrés. Tu en reconnais quatre : ce sont ceux des rues du quartier."
      - "Trois fois le même nom de famille, sur la même colonne. Un père et ses fils, ou trois cousins. La pierre ne le dit pas."
      - "Un nom a été regravé plus profond que les autres. Quelqu'un l'a retouché, récemment, avec soin."
      - "En bas de la liste, en petit : « et ceux dont on n'a pas retrouvé le nom ». C'est la ligne la plus longue."
    tranches: 1

  - id: dehors_monument_gerbe
    lieu: monument
    habitude: foi
    label: "Redresser la gerbe"
    texte: "La gerbe aux couleurs du club penche contre la grille. Tu la redresses ; un ruban bordeaux se détache, et tu le renoues comme tu peux."
    textes:
      - "La gerbe aux couleurs du club penche contre la grille. Tu la redresses ; un ruban bordeaux se détache, et tu le renoues comme tu peux."
      - "Les fleurs sont en plastique, maintenant. Elles ne fanent plus, elles pâlissent. Tu les époussettes du revers de la main."
      - "Quelqu'un a glissé un billet de match dans la gerbe, plié en quatre, à la date d'un derby gagné. Tu le laisses où il est."
    tranches: 0

  - id: dehors_monument_marches
    lieu: monument
    habitude: foi
    label: "S'asseoir sur les marches"
    texte: "Sur les marches du monument, au soleil. Les cloches de Saint-Aubin sonnent la demie ; les pigeons s'envolent, puis reviennent aux mêmes places."
    textes:
      - "Sur les marches du monument, au soleil. Les cloches de Saint-Aubin sonnent la demie ; les pigeons s'envolent, puis reviennent aux mêmes places."
      - "Une noce sort de l'église. Le marié a une écharpe du club sous sa veste ; elle dépasse sur la photo, et personne ne le lui dit."
      - "Un vieux vient s'asseoir deux marches plus bas. Au bout d'un quart d'heure, il dit : « Belle journée pour perdre. » Puis il s'en va."
      - "Les enfants du catéchisme sortent en courant, un ballon déjà au pied. Le curé crie quelque chose qui ressemble à « pas sur le parvis »."
    tranches: 1

  # ─── le kiosque du quai (ouvert le matin et à midi)
  - id: dehors_kiosque_echo
    lieu: kiosque
    habitude: culture
    label: "Acheter L'Écho"
    texte: "Le kiosquier te tend L'Écho avant que tu le demandes, la monnaie déjà comptée dans la paume."
    tranches: 0
    francs: -4
    special: journal

  - id: dehors_kiosque_cartes
    lieu: kiosque
    habitude: jeu
    si: "annee < 2035"
    label: "Une partie avec les anciens"
    texte: "Sur le banc du quai, trois anciens jouent aux cartes sur une boîte à chaussures. Ils te font une place sans lever les yeux."
    textes:
      - "Sur le banc du quai, trois anciens jouent aux cartes sur une boîte à chaussures. Ils te font une place sans lever les yeux."
      - "Le donneur bat les cartes comme on rebat un vieux souvenir. Il annonce la règle une fois, pas deux."
      - "Ils jouent de l'argent, mais personne ne sort de billet avant la fin. L'honneur se règle d'abord, la monnaie ensuite."
    tranches: 0
    francs: -10
    max_jour: 1
    jeu: cartes

  - id: dehors_kiosque_vignettes
    lieu: kiosque
    habitude: quartier
    si: "annee < 2030"
    label: "Un paquet de vignettes"
    texte: "Un paquet de vignettes de la saison, ouvert sur le trottoir comme un gamin. Deux doubles, un écusson brillant, et un joueur que personne ne connaît."
    textes:
      - "Un paquet de vignettes de la saison, ouvert sur le trottoir comme un gamin. Deux doubles, un écusson brillant, et un joueur que personne ne connaît."
      - "Un gamin regarde par-dessus ton épaule. « Le gardien ? T'as eu le gardien ? » Non. Personne n'a jamais le gardien."
      - "Tu tombes sur la vignette d'un joueur croisé ce matin au club. Sur la photo, il avait encore ses cheveux."
      - "Tu donnes les doubles aux gamins du banc. Ils les comptent devant toi, pour que tu voies que tu as été généreux."
    tranches: 0
    francs: -3

  - id: dehors_kiosque_pronostics
    lieu: kiosque
    habitude: jeu
    label: "Les pronostics du kiosquier"
    texte: "Le kiosquier a son pronostic pour samedi, écrit au feutre sur un coin de carton : un score, et la minute du but."
    textes:
      - "Le kiosquier a son pronostic pour samedi, écrit au feutre sur un coin de carton : un score, et la minute du but."
      - "« Deux à un, but à la quatre-vingt-septième. » Il a dit la même chose la semaine dernière. Il dit que ça finira par tomber."
      - "Il refuse de pronostiquer la semaine du derby. « Ça porte malheur, et je dois vivre ici. »"
      - "Il sort un cahier où il note ses pronostics depuis des années, et les vrais scores en rouge. Il y a beaucoup de rouge."
    tranches: 0

  - id: dehors_kiosque_gazette
    lieu: kiosque
    habitude: culture
    si: "annee < 2015"
    label: "La Gazette Rose, pliée"
    texte: "La Gazette Rose, glissée dans L'Écho pour ne pas la montrer. En page trois, « Le carnet noir » : ceux qui vont sauter. Tu cherches ton nom en premier."
    textes:
      - "La Gazette Rose, glissée dans L'Écho pour ne pas la montrer. En page trois, « Le carnet noir » : ceux qui vont sauter. Tu cherches ton nom en premier."
      - "« Vu au parking » : une photo floue, une voiture, deux silhouettes. Ce n'est pas toi. Cette fois."
      - "Le « Rosé » note les présidents sur vingt. Le Racing a onze ; la saison dernière, il avait neuf. Au club-house, on encadrera la page."
    tranches: 0
    francs: -3

  # ─── le vieux lavoir de la rue Haute
  - id: dehors_lavoir_ecouter
    lieu: lavoir
    habitude: quartier
    label: "Écouter la place"
    texte: "Sous le toit du lavoir, les voix de la place arrivent comme dans un coquillage. On n'entend pas tout ; on entend ce qu'il faut."
    textes:
      - "Sous le toit du lavoir, les voix de la place arrivent comme dans un coquillage. « … et il paraît que quelqu'un, au club, a vendu sa maison… »"
      - "Deux voix d'hommes, quelque part : « Samedi, s'ils perdent, je rends ma carte. » « Tu dis ça depuis 1986. »"
      - "Une voix de femme, très nette : « Je l'ai vu sortir de la banque avec deux cartons. » Puis une moto passe, et plus rien."
      - "Quelqu'un siffle le chant de la Nord en traversant la place. Le toit du lavoir le rend un ton plus bas, comme une marche lente."
      - "On parle de toi, sur la place. Le toit te rend chaque mot, sauf ton nom, qu'un camion couvre au bon moment."
    tranches: 1

  - id: dehors_lavoir_eau
    lieu: lavoir
    habitude: soin
    si: "annee < 2036"
    label: "Se passer de l'eau au visage"
    texte: "L'eau de la source est si froide qu'elle fait mal aux dents rien qu'à la regarder. Une main, deux, et la tête redevient claire."
    textes:
      - "L'eau de la source est si froide qu'elle fait mal aux dents rien qu'à la regarder. Une main, deux, et la tête redevient claire."
      - "Une vieille dame te regarde faire et hoche la tête : « Elle guérit tout, celle-là. Sauf le football. »"
      - "Tu restes un moment les mains dans le bassin, jusqu'à ne plus les sentir. Le bruit de la source couvre tout le reste."
    tranches: 0

  - id: dehors_lavoir_maillot
    lieu: lavoir
    habitude: quartier
    si: "annee < 2036"
    label: "Laver un maillot à la main"
    texte: "Un maillot frotté contre la pierre inclinée, comme on faisait. La boue du dernier match part en nuage brun, et la source l'emporte."
    textes:
      - "Un maillot frotté contre la pierre inclinée, comme on faisait. La boue du dernier match part en nuage brun, et la source l'emporte."
      - "Une ancienne laveuse passe et te reprend le geste : « Pas comme ça. Avec le poignet. Le linge, ça ne se gifle pas. »"
      - "Le numéro dans le dos commence à se décoller. Tu frottes plus doucement, comme on caresse une bête."
    tranches: 1

  - id: dehors_lavoir_sec
    lieu: lavoir
    habitude: quartier
    si: "annee >= 2036"
    label: "S'asseoir au lavoir sec"
    texte: "Le bassin est sec, la vase craquelée en écailles. Sous le toit, le silence a remplacé l'eau, et on entend la place encore mieux qu'avant."
    textes:
      - "Le bassin est sec, la vase craquelée en écailles. Sous le toit, le silence a remplacé l'eau, et on entend la place encore mieux qu'avant."
      - "Au fond du bassin, des pièces de toutes les époques, que personne ne ramasse. Un enfant les compte depuis la margelle, sans y toucher."
      - "Quelqu'un a posé une bouteille d'eau pleine sur la pierre, débouchée, au cas où. Elle s'évapore à moitié dans l'après-midi."
    tranches: 1

  # ─── ta voiture, rue des Lilas
  - id: dehors_voiture_laver
    lieu: voiture
    habitude: quartier
    label: "Laver la voiture"
    texte: "Un seau, une éponge, le trottoir mouillé jusqu'au caniveau. Deux gamins s'arrêtent pour regarder ; l'un d'eux propose de faire les jantes."
    textes:
      - "Un seau, une éponge, le trottoir mouillé jusqu'au caniveau. Deux gamins s'arrêtent pour regarder ; l'un d'eux propose de faire les jantes."
      - "Sous la poussière du capot, quelqu'un avait écrit le nom du club au doigt. Tu le laves en dernier."
      - "La voisine du deuxième te demande, par la fenêtre, si tu fais aussi les voitures des autres. Elle a l'air sérieuse."
      - "Sur la plage arrière, sous les journaux, un ticket de match de la saison dernière, et un score que tu avais oublié."
