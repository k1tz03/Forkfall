    francs: -8

  - id: dehors_columbarium_vitres
    lieu: columbarium
    habitude: foi
    label: "Essuyer les vitres"
    texte: "Du revers de la manche, la buée et la poussière sur les vitres des niches. Les visages reviennent un par un, comme au développement."
    textes:
      - "Du revers de la manche, la buée et la poussière sur les vitres des niches. Les visages reviennent un par un, comme au développement."
      - "Derrière une vitre, un maillot plié, le numéro dessus. Il a glissé contre le verre ; tu ne peux pas le redresser, alors tu essuies autour."
      - "Une photo d'équipe, la rangée du bas accroupie. Un visage a été entouré au stylo, il y a longtemps. Tu essuies doucement, autour du cercle."
    tranches: 0
