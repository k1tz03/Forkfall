  - id: dehors_voiture_parebrise
    lieu: voiture
    habitude: quartier
    label: "Vider le pare-brise"
    texte: "Sous l'essuie-glace, la pêche du jour : un prospectus de pizzeria, une contravention, et un mot plié en quatre, sans signature."
    textes:
      - "Sous l'essuie-glace, la pêche du jour : un prospectus de pizzeria, une contravention, et un mot plié en quatre, sans signature."
      - "Un dessin d'enfant, au feutre : un stade, un soleil, et toi, avec des bras plus longs que les jambes. « Gagne », en dessous."
      - "« Votre voiture est sur la place de mon père depuis trois semaines. Il ne conduit plus, mais c'est sa place. » Pas de nom."
      - "Une carte de visite d'agent, cornée exprès, avec un numéro écrit à la main au dos. « N'importe quand. »"
      - "Rien, pour une fois. Le pare-brise est propre, et c'est presque inquiétant."
