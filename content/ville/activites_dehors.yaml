    textes:
      - "Un café dans un gobelet en carton, servi par la vitre d'un camion repeint. Le patron a collé l'affiche du dernier match sur sa portière."
      - "Le café brûle les doigts. Le patron te le tend avec un sucre et un pronostic, dans cet ordre."
      - "Contre le camion, trois maraîchers boivent debout et se taisent quand tu arrives. Puis l'un d'eux demande la composition de samedi."
