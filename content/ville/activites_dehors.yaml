  - id: dehors_voiture_radio
    lieu: voiture
    habitude: culture
    si: "annee < 2031"
    label: "La radio, moteur coupé"
    texte: "Moteur coupé, la radio sur Radio Tribune. Des supporters appellent, l'un après l'autre, pour dire ce qu'ils feraient à ta place."
    textes:
      - "Moteur coupé, la radio sur Radio Tribune. Des supporters appellent, l'un après l'autre, pour dire ce qu'ils feraient à ta place."
      - "Un auditeur raconte le match de samedi comme s'il y avait joué. L'animateur le laisse finir, par respect, ou par fatigue."
      - "Une auditrice appelle pour dire qu'elle n'a pas d'avis, mais qu'elle voulait parler à quelqu'un. On la garde à l'antenne dix minutes."
      - "La buée monte sur les vitres. Dehors, la rue des Lilas s'éteint fenêtre par fenêtre, pendant qu'on parle de toi à l'antenne."
    tranches: 1
    heures: [soir]

  - id: dehors_voiture_tour
    lieu: voiture
    habitude: quartier
    label: "Un tour de la ville"
    texte: "Un tour sans but : le pont, le quai, la Rive éclairée, la friche, et retour rue des Lilas. Tu ralentis devant le stade, comme tout le monde."
    textes:
      - "Un tour sans but : le pont, le quai, la Rive éclairée, la friche, et retour rue des Lilas. Tu ralentis devant le stade, comme tout le monde."
      - "Au feu du pont, la voiture d'à côté te reconnaît et klaxonne deux fois, un coup long, un coup court. Tu ne sais pas si c'est gentil."
      - "Tu tournes trois fois autour du rond-point du stade sans savoir pourquoi, puis tu rentres. Ça suffit, parfois."
      - "Tu passes devant le centre de formation éteint. Une seule fenêtre allumée, au rez-de-chaussée : quelqu'un révise."
    tranches: 1
    francs: -10

  # ─── le feu de palettes, au fond de la friche (le soir et la nuit)
  - id: dehors_feu_mains
    lieu: feu
    habitude: nuit
    label: "Se chauffer les mains"
    texte: "Les mains tendues vers le feu, comme les autres. Personne ne te demande qui tu es ; ici, on regarde les flammes, pas les visages."
    textes:
      - "Les mains tendues vers le feu, comme les autres. Personne ne te demande qui tu es ; ici, on regarde les flammes, pas les visages."
      - "Un homme te fait de la place sans lever les yeux. Il porte des gants coupés au bout des doigts, comme un gardien d'avant."
      - "Le feu crache une étincelle sur ta manche. Ton voisin l'écrase du plat de la main, vite, sans y penser."
      - "Quelqu'un fredonne, très bas. Au bout d'un moment, tu reconnais l'air : c'est le chant de la Nord, en plus lent."
    tranches: 0
    heures: [soir, nuit]

  - id: dehors_feu_manger
    lieu: feu
    habitude: largesse
    label: "Apporter de quoi manger"
    texte: "Un sac de pain, du fromage, des pommes, posés sur une palette près du feu. Personne ne dit merci. Le sac est vide avant que tu repartes."
    textes:
      - "Un sac de pain, du fromage, des pommes, posés sur une palette près du feu. Personne ne dit merci. Le sac est vide avant que tu repartes."
      - "Le doyen partage tout en parts égales avec un canif, y compris la sienne, qu'il donne au plus jeune."
      - "Un homme garde sa part dans sa poche, « pour demain ». Les autres ne disent rien ; ils savent ce que vaut demain."
      - "On te tend une saucisse grillée en échange, piquée sur un fil de fer. Refuser serait une insulte ; tu ne refuses pas."
    tranches: 0
    francs: -20
    heures: [soir, nuit]
    max_jour: 1

  - id: dehors_feu_histoires
    lieu: feu
    habitude: nuit
    label: "Écouter les histoires"
    texte: "Autour du feu, chacun a son match. Celui de 1974, celui de la crue de quarante-huit, celui où un gardien a arrêté trois penalties avec un doigt cassé."
    textes:
      - "Autour du feu, chacun a son match. Celui de 1974, celui de la crue de quarante-huit, celui où un gardien a arrêté trois penalties avec un doigt cassé."
      - "Le doyen raconte la Tréfilerie : la sirène de seize heures, les fours, le tournoi des ateliers. Il ne parle jamais de la fermeture."
      - "Un homme raconte qu'il a joué en réserve. Personne ne le croit, et personne ne le dit. Il en a encore la démarche, pourtant."
      - "Une femme raconte l'hiver où les loups sont descendus jusqu'au pont. Elle n'était pas née. Elle le raconte mieux que ceux qui y étaient."
      - "On parle de toi, un peu, pour te faire plaisir. Puis on parle de la soupe de la bénévole, et c'est un sujet plus grave."
    tranches: 1
    heures: [soir]

  - id: dehors_feu_palette
    lieu: feu
    habitude: nuit
    label: "Remettre une palette"
    texte: "Tu poses une palette sur les braises. Le feu hésite, puis prend d'un coup ; les visages s'éclairent en orange, et quelqu'un dit merci, à voix basse."
    textes:
      - "Tu poses une palette sur les braises. Le feu hésite, puis prend d'un coup ; les visages s'éclairent en orange, et quelqu'un dit merci, à voix basse."
      - "La palette porte encore l'étiquette d'un magasin de la capitale. Elle brûle comme les autres."
      - "Trop d'un coup : les flammes montent à deux mètres. Tout le monde recule d'un pas, et rit, pour la première fois de la soirée."
    tranches: 0
    heures: [soir, nuit]

  # ─── le mur des plaques
  - id: dehors_columbarium_plaques
