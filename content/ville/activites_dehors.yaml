    habitude: foi
    label: "Lire les plaques"
    texte: "Des photos sous verre, des dates, des surnoms entre guillemets. Une plaque dit seulement : « Abonné. » Ça suffisait à tout dire."
    textes:
      - "Des photos sous verre, des dates, des surnoms entre guillemets. Une plaque dit seulement : « Abonné. » Ça suffisait à tout dire."
      - "Une niche porte une écharpe pliée en triangle, comme un drapeau sur un cercueil. La date est celle d'un samedi."
      - "Sur une photo, un homme en casquette au premier rang d'une tribune. Tu cherches le match ; la photo ne le dit pas."
      - "Une plaque toute neuve, encore sans photo. Juste un nom, et un numéro de maillot gravé à la place de la croix."
    tranches: 1

  - id: dehors_columbarium_fleur
    lieu: columbarium
    habitude: foi
    label: "Une fleur dans une niche"
    texte: "Une seule fleur, glissée dans le petit vase d'une niche qui n'en avait plus. Tu ne connais pas le nom ; ce n'est pas grave."
    textes:
      - "Une seule fleur, glissée dans le petit vase d'une niche qui n'en avait plus. Tu ne connais pas le nom ; ce n'est pas grave."
      - "La fleur tient mal dans le vase trop large. Tu la cales avec un caillou, comme on cale une porte."
      - "La gardienne te voit faire et te dit le prénom de la morte. « Elle aurait aimé. Elle aimait qu'on se trompe de niche. »"
