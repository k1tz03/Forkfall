# Quelques activités d'objets, pour éprouver les pièces (la vie de la ville les complétera).
activites:
  - id: buvette_cible
    lieu: buvette
    objet: flechettes
    label: "Une partie de cible"
    texte: "Trois fléchettes, dix francs la partie. Le capo tient le compte à la craie sur l'ardoise."
    tranches: 0
    francs: -10
    jeu: flechettes
  - id: buvette_babyfoot
    lieu: buvette
    objet: babyfoot
    label: "Un baby-foot"
    texte: "Deux supporters te font signe : il leur manque un goal."
    tranches: 0
    francs: -2
    jeu: babyfoot
  - id: appart_tele
    lieu: appartement
    objet: tele
    label: "Allumer la télé"
    texte: "La télé chauffe, l'image arrive avant le son."
    tranches: 1
    special: tele
  - id: appart_telephone
    lieu: appartement
    objet: telephone
    label: "Appeler quelqu'un"
    texte: "Le téléphone à cadran, sur sa tablette."
    tranches: 0
    special: telephone
