# LES SERVICES DE LA VILLE — ce qu'on fait dans les pièces de la mairie, de L'Écho, de
# la Banque Aubérivoise, du cabinet du Doc, de l'agence Tessandier, de l'hôtel de la
# Rive, de la pharmacie, de l'école, de Saint-Aubin, de L'Aurore, de la librairie et de
# la laverie (docs/histoires/scenes_jouees.md § 5). Chaque objet de ces pièces porte au
# moins une activité ; les plus riches en portent plusieurs, selon le rôle, l'époque,
# l'heure et le jour.
#
# Les conventions du lot :
#   · `textes` : les variantes, tirées tour à tour. Quand il y en a, la ville n'affiche
#     qu'elles : `texte` (exigé par le build) reprend la première. Un jeu (`jeu:`), le
#     téléphone (`special: telephone`) et le sommeil (`nuit: true`) ne montrent pas leur
#     texte : un `texte` seul leur suffit.
#   · les petits métiers (la chronique du lundi, le duplex du vendredi, la cérémonie du
#     vendredi, le séminaire et le ciné-club du jeudi, les dédicaces du mardi, le cycle
#     foot, le poster, la photo de l'agence, les résultats du samedi soir) paient à leur
#     jour, une fois (`max_jour: 1`). La banque ne crée pas d'argent : elle garde ce
#     qu'on lui confie, refuse les prêts, et explique la ruine telle que la ville la joue
#     (la lettre après la paie du dimanche, l'huissier qui vend le moins nécessaire à
#     moitié prix, le tribunal de commerce quand le trou dépasse une paie).
#   · les jauges à la marge (± 1, ± 2), là où le geste se voit : une apparition en
#     public qu'on ne paie pas, un groupe qu'on soigne, un nom qu'on lâche à la presse.
#   · l'époque : la machine à écrire puis l'écran à L'Écho, les francs puis les écus au
#     guichet, la cabine puis les livres, les clés puis les cartes à l'hôtel, la pellicule
#     puis la borne, la bobine puis le numérique, la messe pleine puis la nef clairsemée.
#     Le personnel des lieux n'a pas de nom (« le Doc », « la libraire », « le curé ») :
#     il traverse les époques ; Massenet n'est nommé que dans ses années à L'Écho.
activites:
  # ══════════════════════════════════════════════════════════════════════ LA MAIRIE
  # Le matin et l'après-midi, du lundi au vendredi. L'huissier à l'accueil, la maire
  # dans son bureau, le conseil le mardi après-midi.
  - id: mairie_listes
    lieu: mairie
    habitude: quartier
    objet: accueil
    label: "T'inscrire sur les listes"
    texte: "L'employée tourne le registre électoral vers toi sans lever les yeux. Au moment où tu signes, elle les lève : « Ah. Alors vous restez ? »"
    textes:
      - "L'employée tourne le registre électoral vers toi sans lever les yeux. Au moment où tu signes, elle les lève : « Ah. Alors vous restez ? »"
      - "Il faut un justificatif de domicile. Sur le tien, ton nom est mal orthographié ; l'employée le corrige au stylo bille et tamponne la correction, pour que ça tienne."
      - "Sur le banc du couloir, trois retraités attendent leur tour en refaisant le match de samedi. Quand tu passes devant eux pour signer, ils se taisent jusqu'à ce que la porte se referme."
      - "L'employée te donne ta carte d'électeur et l'adresse du bureau de vote : l'école publique, la classe des CM2. « Vous voterez sous les dessins des enfants. Ils ont tous dessiné le stade. »"
    tranches: 1

  - id: mairie_papiers
    lieu: mairie
    habitude: quartier
    objet: accueil
    label: "Refaire tes papiers"
    texte: "Deux photos d'identité, un formulaire en trois exemplaires, l'encre pour l'empreinte du pouce. L'employée lit ta date de naissance, puis te regarde : « On ne dirait pas, à la télé. »"
    textes:
      - "Deux photos d'identité, un formulaire en trois exemplaires, l'encre pour l'empreinte du pouce. L'employée lit ta date de naissance, puis te regarde : « On ne dirait pas, à la télé. »"
      - "À la ligne « profession », tu hésites. L'employée attend, le stylo levé. « Je mets ce qu'il y a sur le contrat, ou ce que vous faites vraiment ? »"
      - "L'huissier de la mairie te fait passer devant la file, et toute la file le voit. Une femme, un bébé sur la hanche, dit assez fort qu'elle attend depuis neuf heures."
      - "« Taille ? » Tu dis un chiffre. L'employée regarde par-dessus le comptoir, efface, et écrit deux centimètres de moins sans rien dire."
    tranches: 1

  - id: mairie_conseil
    lieu: mairie
    habitude: travail
    objet: conseil
    label: "Assister au conseil"
    texte: "Au conseil municipal, l'éclairage du stade passe au point six, après les poubelles de la rue haute. L'opposition demande ce que coûte un match. Personne n'a le chiffre ; on te regarde."
    textes:
      - "Au conseil municipal, l'éclairage du stade passe au point six, après les poubelles de la rue haute. L'opposition demande ce que coûte un match. Personne n'a le chiffre ; on te regarde."
      - "La subvention du club se vote à main levée. Onze mains, puis neuf, puis celle d'un adjoint, levée la dernière, lentement, pendant qu'il te cherche des yeux dans le public."
      - "Dans le public, les anciens du club d'un côté, les riverains du stade de l'autre, et entre eux une chaise vide que personne ne prend. Tu restes debout au fond."
      - "Un conseiller lit à voix haute la facture du gazon. La salle rit au prix du mètre carré. La maire ne rit pas : elle entoure un chiffre dans son dossier."
    tranches: 1
    jours: [mar]
    heures: [aprem]

  - id: mairie_registres
    lieu: mairie
    habitude: culture
    objet: registres
    label: "Feuilleter les registres"
    texte: "L'employé de l'état civil te laisse le registre de 1974 sur le coin du bureau. En juin, trois mariages dans la même semaine : trois joueurs du club, et les mêmes témoins."
    textes:
      - "L'employé de l'état civil te laisse le registre de 1974 sur le coin du bureau. En juin, trois mariages dans la même semaine : trois joueurs du club, et les mêmes témoins."
      - "Les décès de l'hiver 1956 : le gardien de but de l'époque, vingt-six ans, « accident à l'usine ». Dans la marge, quelqu'un a écrit au crayon : le dimanche d'avant, il jouait."
      - "Le registre des associations s'ouvre tout seul à la page du club, tant on l'a consultée. Les statuts ont été déposés un mardi, signés d'un boulanger, d'un curé et d'un cheminot."
      - "Les registres sentent la cave et le tampon. Entre deux pages de 1962, une coupure de L'Écho sert de marque-page : l'équipe sur les marches de la mairie, la coupe posée sur le perron."
    tranches: 1

  - id: mairie_ceremonie
    lieu: mairie
    habitude: quartier
    objet: drapeau
    label: "Une cérémonie à la mairie"
    texte: "Les noces d'or des Peyrard, sous le buste et le drapeau. On te place entre les mariés pour la photo. À la sortie, le comité des fêtes te glisse une enveloppe « pour le déplacement »."
    textes:
      - "Les noces d'or des Peyrard, sous le buste et le drapeau. On te place entre les mariés pour la photo. À la sortie, le comité des fêtes te glisse une enveloppe « pour le déplacement »."
      - "La remise des médailles du travail : vingt agents municipaux, trente ans de maison chacun. Tu serres vingt mains calleuses. L'enveloppe du comité des fêtes est plus épaisse que leur prime."
      - "Le concours des maisons fleuries. Tu lis les noms des lauréats sur une fiche qu'on t'a tendue au dernier moment. Le premier prix est le voisin qui klaxonne les soirs de défaite."
      - "L'accueil des nouveaux habitants : un livre sur Aubérive et un verre de mousseux. Une famille arrivée de loin te demande où l'on prend un abonnement, et si le stade est loin à pied."
      - "On inaugure le portrait d'un ancien maire dans la salle des mariages. Discours, drapeau, mousseux tiède. L'enveloppe du comité t'attend sur la desserte, ton nom mal écrit dessus."
    tranches: 1
    francs: 400
    jours: [ven]
    heures: [aprem]
    max_jour: 1

  - id: mairie_maire_joueur
    lieu: mairie
    habitude: travail
    objet: bureau_maire
    roles: [joueur]
    label: "Une photo avec la maire"
    texte: "La maire te fait asseoir dans son fauteuil pour la photo du bulletin municipal et reste debout derrière toi. « Comme ça, on voit qui travaille pour qui. » Le flash part avant que tu comprennes."
    textes:
      - "La maire te fait asseoir dans son fauteuil pour la photo du bulletin municipal et reste debout derrière toi. « Comme ça, on voit qui travaille pour qui. » Le flash part avant que tu comprennes."
      - "Elle sort d'un tiroir une écharpe du club encore sous plastique et te la passe au cou. « Les électeurs regardent les écharpes plus que les programmes. Souriez. »"
      - "La photographe de la mairie te demande de serrer la main de la maire « longtemps, comme pour un contrat ». Tu tiens quatre secondes. Elle en voulait six."
      - "Sur le bureau de la maire, le plan des travaux du stade, une tache de café sur la tribune nord. Pendant la photo, elle pose la main dessus, comme pour la cacher."
    tranches: 1
    jauges: {tribunes: 1}

  - id: mairie_maire_ds
    lieu: mairie
    habitude: travail
    objet: bureau_maire
    roles: [ds]
    label: "Demander un terrain"
    texte: "Tu demandes le terrain du quartier haut pour les moins de quinze ans, le mardi et le jeudi. La maire feuillette un cahier. « Le jeudi, c'est la police municipale. Ils jouent mal, mais ils votent. »"
    textes:
      - "Tu demandes le terrain du quartier haut pour les moins de quinze ans, le mardi et le jeudi. La maire feuillette un cahier. « Le jeudi, c'est la police municipale. Ils jouent mal, mais ils votent. »"
      - "Elle t'accorde le mardi, si le club tond lui-même. Dans le couloir, son adjoint te rattrape : « Et les vestiaires, vous les nettoyez aussi. C'était dans la phrase. »"
      - "La maire veut un gamin d'Aubérive dans l'équipe première avant les élections. « Un seul. Né ici, formé ici. Vous m'en donnez un, je vous donne un terrain. »"
      - "Sur le plan cadastral, elle suit du doigt un terrain vague derrière le cimetière. « Il est à vous pour une somme symbolique, si le club le clôture. Symbolique, mais payée. »"
    tranches: 1
    jauges: {vestiaire: 1}

  - id: mairie_maire_selection
    lieu: mairie
    habitude: travail
    objet: bureau_maire
    roles: [selectionneur]
    label: "Monter chez la maire"
    texte: "La maire veut un match de la sélection à la Rive. « Un seul, en semaine, même contre une petite nation. La Fédération dira non ; vous, vous pouvez dire peut-être. »"
    textes:
      - "La maire veut un match de la sélection à la Rive. « Un seul, en semaine, même contre une petite nation. La Fédération dira non ; vous, vous pouvez dire peut-être. »"
      - "Elle te montre une photo encadrée : la Rive pleine pour un match des espoirs, des drapeaux du pays jusque sur le toit de la buvette. « La dernière fois. Vous étiez où, cette année-là ? »"
      - "La maire veut que la sélection prépare son prochain match ici : l'hôtel de la Rive, le terrain annexe, la photo sur les marches. « La ville paie les chambres. Vous, vous payez en une de L'Écho. »"
      - "Sous le drapeau, elle a fait encadrer la une de L'Écho du jour de ta nomination. « Les gens croient que c'est moi qui vous ai {pg, select, f{choisie} other{choisi}}. Je laisse dire. »"
    tranches: 1
    jauges: {tribunes: 1, direction: -1}

  # ═══════════════════════════════════════════════════════════════ L'ÉCHO D'AUBÉRIVE
  # Du lundi au samedi, jusqu'au soir (la rotative tourne la nuit). La chronique du
  # lundi passe de la machine à écrire à l'écran ; le samedi soir, on prend les scores
  # des clubs amateurs au téléphone tant que le téléphone sert à ça.
  - id: echo_chronique_machine
    lieu: echo
    habitude: travail
    objet: machine
    si: "annee <= 1997"
    label: "Taper ta chronique"
    texte: "La machine de la rédaction a un « e » qui saute. Tu tapes ta chronique du lundi à deux doigts, quarante lignes sur le match. La secrétaire de rédaction en coupe douze et te paie les quarante."
    textes:
      - "La machine de la rédaction a un « e » qui saute. Tu tapes ta chronique du lundi à deux doigts, quarante lignes sur le match. La secrétaire de rédaction en coupe douze et te paie les quarante."
      - "Massenet relit ta chronique par-dessus ton épaule et barre un adjectif. « Les lecteurs pardonnent une défaite. Pas un adjectif. » Il signe ton bon de paiement sans le relire."
      - "Tu cherches le mot pour dire qu'un joueur a lâché. La machine attend, le ruban fatigué. Tu tapes « fatigué ». À l'impression, quelqu'un aura corrigé en « émoussé »."
      - "Ta chronique descend au marbre à dix-sept heures. Le typographe te la rend couverte de crayon bleu, avec un mot en bas : « Le 4 n'est pas un numéro, c'est un garçon. »"
    tranches: 1
    francs: 450
    jours: [lun]
    max_jour: 1

  - id: echo_chronique
    lieu: echo
    habitude: travail
    objet: machine
    si: "annee >= 1998"
    label: "Envoyer ta chronique"
    texte: "La machine à écrire dort sous sa housse au bout du bureau, comme un vieux chien. Tu écris ta chronique à l'écran d'à côté ; le correcteur ne connaît pas le nom de ton arrière gauche."
    textes:
      - "La machine à écrire dort sous sa housse au bout du bureau, comme un vieux chien. Tu écris ta chronique à l'écran d'à côté ; le correcteur ne connaît pas le nom de ton arrière gauche."
      - "La journaliste lit ta chronique à voix haute pour en vérifier le rythme, puis te demande de couper le passage sur l'arbitre. « Pas parce que c'est faux. Parce qu'il a un avocat. »"
      - "On te paie la chronique au feuillet, et le feuillet a rétréci : trente lignes au lieu de quarante, au même prix. « Les gens lisent moins », dit le rédacteur, qui lit tout."
      - "À ta chronique de la semaine dernière, les lecteurs ont répondu par courrier. La secrétaire de rédaction a punaisé les lettres près de la vieille machine. Une seule est aimable."
    tranches: 1
    francs: 450
    jours: [lun]
    max_jour: 1

  - id: echo_epreuves
    lieu: echo
    habitude: culture
    objet: epreuves
    label: "Relire les épreuves"
    special: journal
    texte: "Les épreuves du lendemain sont punaisées au mur, encore humides. Personne ne t'empêche de lire ; personne ne t'y invite non plus."
    textes:
      - "Les épreuves du lendemain sont punaisées au mur, encore humides. Personne ne t'empêche de lire ; personne ne t'y invite non plus."
      - "La secrétaire de rédaction te laisse lire la une à l'envers, sur son bureau, le temps de retrouver ses lunettes."
      - "Tu lis les épreuves debout, les mains dans le dos, comme au musée. Derrière toi, le rédacteur compte à voix basse."
      - "Sur l'épreuve de la page des sports, ton nom est entouré de rouge, avec un point d'interrogation dans la marge."
    tranches: 0
    heures: [aprem, soir]

  - id: echo_archives
    lieu: echo
    habitude: culture
    objet: archives
    label: "Fouiller les archives"
    texte: "Les reliures de 1962 sont plus usées que les autres : l'année du titre. Dans celle de mai, la page du dernier match a été découpée au cutter. Quelqu'un l'a encadrée quelque part, ou brûlée."
    textes:
      - "Les reliures de 1962 sont plus usées que les autres : l'année du titre. Dans celle de mai, la page du dernier match a été découpée au cutter. Quelqu'un l'a encadrée quelque part, ou brûlée."
      - "Tu retrouves le premier article qui parle de toi : six lignes, ton nom mal orthographié, un mot d'un entraîneur de l'époque. « {pg, select, f{Elle} other{Il}} a des jambes. On verra pour la tête. »"
      - "L'archiviste, un ancien typographe bénévole, te sort sans qu'on le lui demande le dossier de ton prédécesseur : coupures, photos, et la une du jour de son départ, pliée en quatre."
      - "Dans une reliure, entre deux pages, une photo jamais publiée : l'équipe de 1962 dans le car du retour, la coupe sur les genoux du chauffeur, et le président endormi contre la vitre."
      - "Tu lis des comptes rendus de matchs d'avant ta naissance. Les phrases sont les mêmes, seuls les noms changent : il y a toujours un arbitre « dépassé » et un public « admirable »."
    tranches: 1

  - id: echo_tirage
    lieu: echo
    habitude: culture
    objet: archives
    label: "Acheter un tirage photo"
    texte: "Le photographe de L'Écho te vend un tirage de samedi : toi au premier plan, flou, et derrière, net, un gamin du kop qui pleure. C'est la meilleure photo du match."
    textes:
      - "Le photographe de L'Écho te vend un tirage de samedi : toi au premier plan, flou, et derrière, net, un gamin du kop qui pleure. C'est la meilleure photo du match."
      - "Tu achètes la photo de la tribune nord sous l'averse, prise depuis la tribune Est. On y compte les parapluies : quarante. Au dos, au crayon, la date, le score, puis un mot rayé."
      - "Le tirage de ta première conférence de presse ici, en noir et blanc. Tu y as l'air plus jeune de dix ans ; ça ne fait pourtant qu'une saison."
      - "Le photographe glisse dans l'enveloppe une deuxième photo, que tu n'as pas demandée : toi, sur le parking, avec un homme qu'on ne voit que de dos. « Je n'en ai pas d'autre tirage. »"
    tranches: 0
    francs: -60

  - id: echo_radio
    lieu: echo
    habitude: travail
    objet: telephone
    label: "Un duplex pour la radio"
    texte: "La radio du département t'appelle sur le téléphone de la rédaction pour l'avant-match. Le combiné sent le tabac froid. Trois questions, trois réponses ; la quatrième, tu la gardes."
    textes:
      - "La radio du département t'appelle sur le téléphone de la rédaction pour l'avant-match. Le combiné sent le tabac froid. Trois questions, trois réponses ; la quatrième, tu la gardes."
      - "En direct, l'animateur te passe un auditeur : un abonné de la tribune ouest qui veut savoir pourquoi le 7 ne joue jamais à domicile. Tu réponds. Il raccroche avant la fin de ta phrase."
      - "Dix minutes de duplex entre la météo et la pharmacie de garde. Tu parles de samedi ; on te coupe pour un accident sur la nationale. Le cachet arrivera entier, promet la radio."
      - "Le journaliste de la radio te demande de dire bonjour à sa mère, qui écoute à l'hôpital. Tu le fais. Le lendemain, tout Aubérive t'en parle, plus que du match."
    tranches: 1
    francs: 250
    jours: [ven]
    heures: [soir]
    max_jour: 1
    jauges: {tribunes: 1}

  - id: echo_standard
    lieu: echo
    habitude: travail
    objet: telephone
    roles: [joueur]
    si: "annee <= 2009"
    label: "Prendre les résultats"
    texte: "Le samedi soir, les correspondants des clubs amateurs appellent leurs scores. Tu les notes sur des fiches roses. Un dirigeant de Beaudieu dicte un 4 à 2 d'une voix qui tremble."
    textes:
      - "Le samedi soir, les correspondants des clubs amateurs appellent leurs scores. Tu les notes sur des fiches roses. Un dirigeant de Beaudieu dicte un 4 à 2 d'une voix qui tremble."
      - "Le téléphone ne s'arrête pas de dix-neuf à vingt et une heures : les buteurs de vingt matchs de district. Un arbitre appelle pour dire qu'on l'a suivi jusqu'à sa voiture."
      - "Un correspondant te reconnaît à la voix et en oublie son score. « C'est toi ? Ici ? » Tu notes 1 à 1. Il dit 2 à 1, finalement, et demande un autographe pour son buteur."
      - "La rédaction paie à la fiche. Tu en remplis quarante-trois. À vingt-deux heures, le rédacteur les compte du pouce et laisse les billets sous le combiné, puis redescend à la rotative."
    tranches: 1
    francs: 150
    jours: [sam]
    heures: [soir]
    max_jour: 1

  - id: echo_publicite
    lieu: echo
    habitude: travail
    objet: bureau_redacteur
    roles: [president]
    label: "Acheter une page de pub"
    texte: "Une page entière pour la campagne d'abonnements. Le chef de la publicité te montre la maquette : ta photo en haut, le stade en bas, et au milieu un slogan que tu n'as pas écrit."
    textes:
      - "Une page entière pour la campagne d'abonnements. Le chef de la publicité te montre la maquette : ta photo en haut, le stade en bas, et au milieu un slogan que tu n'as pas écrit."
      - "Le rédacteur te prévient en signant le bon : « La publicité, c'est la page de gauche. Ce que j'écris sur vous, c'est la page de droite. On ne les lit pas dans le même ordre. »"
      - "Tu paies la page de ta poche : la trésorerie ne le peut plus. Personne à la rédaction ne le sait. Le comptable de L'Écho, lui, reconnaît ton nom sur le règlement."
      - "La page paraît un jeudi, face à la nécrologie. Un abonné depuis quarante ans te la renvoie découpée, avec un mot : « Je reviendrai quand vous aurez un avant-centre. »"
    tranches: 1
    francs: -800
    jauges: {tribunes: 1}

  - id: echo_rumeur
    lieu: echo
    habitude: travail
    objet: bureau_redacteur
    roles: [ds]
    label: "Glisser un nom"
    texte: "Tu laisses entendre qu'un club de la Capitale s'intéresse à ton milieu droit. Le journaliste note sans lever la tête. Demain, le prix du joueur aura doublé ; son père t'appellera avant midi."
    textes:
      - "Tu laisses entendre qu'un club de la Capitale s'intéresse à ton milieu droit. Le journaliste note sans lever la tête. Demain, le prix du joueur aura doublé ; son père t'appellera avant midi."
      - "« Deux clubs, ou un seul ? » Tu dis deux. Il en écrira trois. Samedi, la tribune nord sifflera le nom du joueur comme celui d'un traître, pour une offre qui n'existe pas."
      - "Tu donnes un nom de Valentienne, pour qu'ils baissent leur prix en le lisant. Le rédacteur te regarde par-dessus son carnet. « Vous savez que je sais. Je l'écris quand même : ça se vend. »"
      - "Il demande une source. Tu dis « proche du dossier ». Il sourit : à Aubérive, ça désigne trois personnes, et deux d'entre elles sont dans cette pièce."
    tranches: 1
    jauges: {caisse: 1, tribunes: -1}

  - id: echo_poster
    lieu: echo
    habitude: travail
    objet: bureau_redacteur
    roles: [joueur]
    label: "Poser pour le poster"
    texte: "Le poster central du mercredi : toi, le pied sur un ballon, devant un drap bleu tendu entre deux armoires. Le photographe te demande de sourire « comme si on avait gagné »."
    textes:
      - "Le poster central du mercredi : toi, le pied sur un ballon, devant un drap bleu tendu entre deux armoires. Le photographe te demande de sourire « comme si on avait gagné »."
      - "On te fait porter le maillot de la saison prochaine, pas encore en vente. La couture du nouvel écusson gratte. La photo paraîtra avant que tu aies le droit d'en parler."
      - "Le photographe veut une photo « vraie » : toi sur le coin du bureau du rédacteur, une tasse à la main. Il en prend trente. Sur celle qu'ils choisissent, tu as les yeux fermés."
      - "La fille de la secrétaire de rédaction attend, un feutre à la main, que tu signes le premier tirage. Elle le fera encadrer, dit sa mère. Elle le revendra à vingt ans, dit le photographe."
    tranches: 1
    francs: 300
    jours: [mer]
    heures: [aprem]
    max_jour: 1

  # ════════════════════════════════════════════════════════════ LA BANQUE AUBÉRIVOISE
  # Le matin et l'après-midi, du lundi au vendredi. Les visites au banquier par rôle
  # sont dans ville.yaml ; ici, le reste du métier d'avoir de l'argent, ou de ne plus
  # en avoir.
  - id: banque_mandat
    lieu: banque
    habitude: famille
    objet: guichet
    label: "Envoyer un mandat"
    texte: "Un mandat pour ta mère, comme chaque mois. Le guichetier recopie l'adresse en capitales et demande si c'est toujours le même escalier. Il connaît l'escalier."
    textes:
      - "Un mandat pour ta mère, comme chaque mois. Le guichetier recopie l'adresse en capitales et demande si c'est toujours le même escalier. Il connaît l'escalier."
      - "Tu envoies de l'argent à un ancien coéquipier qui ne t'a rien demandé. Au motif, le guichetier attend. Tu dis « remboursement ». Il ne t'a jamais rien prêté."
      - "Un mandat pour la famille d'un gamin du centre, renvoyé chez lui en juin. Tu ne mets pas ton nom à l'expéditeur. Le guichetier, lui, connaît ton écriture."
      - "Le guichetier compte deux fois les billets du mandat, puis une troisième en te regardant. « À l'étranger, encore ? Vous avez beaucoup de famille, à l'étranger. »"
    tranches: 1
    francs: -300

  - id: banque_avance
    lieu: banque
    habitude: travail
    objet: guichet
    roles: [president]
    label: "Avancer les salaires"
    texte: "Les salaires du mois ne passeront pas. Tu vires la somme de ton compte sur celui du club et demandes au guichetier de ne rien écrire en commentaire. Il écrit « avance », en lettres minuscules."
    textes:
      - "Les salaires du mois ne passeront pas. Tu vires la somme de ton compte sur celui du club et demandes au guichetier de ne rien écrire en commentaire. Il écrit « avance », en lettres minuscules."
      - "Le guichetier vérifie trois fois le montant. « Après ça, c'est le club qui vous doit, ou vous qui lui devez ? » Tu ne sais pas. Lundi, l'intendant sera payé."
      - "Tu signes l'ordre de virement debout, sans ôter ton manteau. Derrière toi, un joueur de la réserve attend pour retirer sa paie. Il ne sait pas que c'est la tienne."
      - "« Le directeur voudra vous voir, pour ça », dit le guichetier en baissant la voix. Tu n'as pas le temps. Il tamponne l'ordre, et pose le tampon comme on pose une arme."
    tranches: 1
    francs: -5000
    max_jour: 1
    jauges: {vestiaire: 2}

  - id: banque_ecus
    lieu: banque
    habitude: quartier
    objet: guichet
    si: "annee >= 2002 && annee <= 2003"
    label: "Changer tes francs"
    texte: "Le guichetier te tend un sachet de premiers écus, des pièces si neuves qu'elles collent entre elles. Il convertit sur une calculette, puis de tête ; c'est la calculette qui avait tort."
    textes:
      - "Le guichetier te tend un sachet de premiers écus, des pièces si neuves qu'elles collent entre elles. Il convertit sur une calculette, puis de tête ; c'est la calculette qui avait tort."
      - "Tu vides sur le comptoir une boîte à chaussures de vieux francs. Le guichetier compte en soupirant. Dans le lot, une pièce de 1974 ; il te la rend. « Celle-là, gardez-la. »"
      - "Sur la vitre du guichet, une affiche : « 1 écu = 6,56 francs ». Quelqu'un a ajouté au feutre : « Et une place en tribune ? » Le guichetier fait semblant de ne pas l'avoir vue."
      - "Devant toi, une ancienne abonnée veut savoir combien d'écus vaudrait sa place de tribune de 1980. Le guichetier calcule, se trompe, recommence. Elle dit que même les erreurs étaient mieux avant."
    tranches: 1

  - id: banque_decouvert
    lieu: banque
    habitude: travail
    objet: bureau_banquier
    si: "francs < 0"
    label: "Plaider ton découvert"
    texte: "Le banquier tourne ton relevé vers toi, le chiffre souligné en rouge. « La paie de dimanche le comblera, ou pas. Si elle ne le comble pas, je vous écris. Je déteste écrire. »"
    textes:
      - "Le banquier tourne ton relevé vers toi, le chiffre souligné en rouge. « La paie de dimanche le comblera, ou pas. Si elle ne le comble pas, je vous écris. Je déteste écrire. »"
      - "« Après la lettre, il y a l'huissier. Il commence par ce dont vous avez le moins besoin, et il vend à moitié prix. Il n'est pas méchant : il est pressé. » Il te ressert du café."
      - "Il ne t'avancera rien sur la paie. Il te donne un conseil : vendre toi-même avant que d'autres vendent pour toi. « Vous en tirerez plus que l'huissier. Pas beaucoup plus. »"
      - "« Quand l'huissier ne trouve plus rien et que le trou dépasse une paie, ce n'est plus moi : c'est le tribunal de commerce. » Il referme ton dossier doucement, comme un livre qu'on a fini."
    tranches: 1

  - id: banque_cafe
    lieu: banque
    habitude: travail
    objet: bureau_banquier
    si: "francs >= 100000"
    label: "Le café du directeur"
    texte: "Il te reçoit avant l'heure et fait apporter le café dans des tasses à liseré doré. Il ne parle pas d'argent pendant dix minutes, puis il ne parle plus que de ça."
    textes:
      - "Il te reçoit avant l'heure et fait apporter le café dans des tasses à liseré doré. Il ne parle pas d'argent pendant dix minutes, puis il ne parle plus que de ça."
      - "Le banquier te propose « un produit » : ton argent placé dans un fonds qu'il ne nomme pas, dans un pays qu'il nomme à voix basse. Tu reposes la brochure. Il la glisse dans ta poche."
      - "Il sait ce que tu as acheté ce mois-ci, et dans quel ordre. « Vous avez du goût. Le goût, c'est ce qui coûte le plus cher à entretenir. » Il sourit, et note quelque chose."
      - "Au mur, une photo de lui serrant la main de ton prédécesseur, sous un trophée. « Il avait plus que vous. Il a fini avec moins. Un sucre ? »"
    tranches: 1

  - id: banque_pret
    lieu: banque
    habitude: travail
    objet: bureau_banquier
    roles: [entraineur, joueur, ds, selectionneur]
    label: "Parler d'un prêt"
    texte: "Tu parles d'un prêt pour un appartement. Le banquier sort une calculette et une feuille quadrillée. « Votre contrat court jusqu'à quand ? » La question vaut un refus ; il la pose par politesse."
    textes:
      - "Tu parles d'un prêt pour un appartement. Le banquier sort une calculette et une feuille quadrillée. « Votre contrat court jusqu'à quand ? » La question vaut un refus ; il la pose par politesse."
      - "« Un prêt sur vingt ans, à quelqu'un dont le métier se compte en saisons ? » Il te tend un formulaire de caution. « Trouvez quelqu'un qui reste. Un notaire, un boulanger, une maire. »"
      - "Il veut bien étudier le dossier si quelqu'un se porte garant. Tu cites le club. Il sourit sans ouvrir la bouche : le relevé du club est sous son coude."
      - "Le banquier fait glisser vers toi une brochure de l'agence Tessandier, déjà ouverte à la bonne page. « Je ne vous dis pas d'acheter. Je vous dis qu'ils financent chez nous. »"
    tranches: 1

  - id: banque_coffre
    lieu: banque
    habitude: luxe
    objet: coffre
    label: "Descendre à ton coffre"
    texte: "Le gardien ouvre la grille, puis la porte, puis te laisse avec ta boîte et sort. Dedans : ton premier contrat, une montre arrêtée, et une enveloppe que tu n'as jamais ouverte."
    textes:
      - "Le gardien ouvre la grille, puis la porte, puis te laisse avec ta boîte et sort. Dedans : ton premier contrat, une montre arrêtée, et une enveloppe que tu n'as jamais ouverte."
      - "Tu ranges dans ton coffre une lettre que tu ne veux ni garder chez toi ni jeter. Le gardien regarde ailleurs, par métier. La salle est froide comme une église."
      - "Deux boîtes plus loin, une veuve vide le coffre de son mari : des billets d'une autre époque, une alliance, un programme de match de 1962. Elle te le tend. « Il aurait voulu qu'on le lise. »"
      - "La porte du coffre ne s'ouvre qu'à heure fixe. Tu attends avec le gardien, qui te raconte qu'un ancien président descendait ici tous les lundis, et remontait les mains vides."
    tranches: 0

  - id: banque_lingot
    lieu: banque
    habitude: luxe
    objet: coffre
    si: "possede(lingot)"
    label: "Voir ton lingot"
    texte: "Ton lingot est là, sous son papier de soie. Le gardien ne regarde pas. Tu le soulèves : il pèse plus lourd que sur le reçu, comme tout ce qui ne bouge pas."
    textes:
      - "Ton lingot est là, sous son papier de soie. Le gardien ne regarde pas. Tu le soulèves : il pèse plus lourd que sur le reçu, comme tout ce qui ne bouge pas."
      - "Tu poses deux doigts sur le lingot, comme sur un front. Il est froid. Dehors, il fait doux ; ici, ça ne compte pas."
      - "Le gardien te dit en refermant : « Il y en a qui viennent voir le leur tous les lundis. Ceux-là, en général, ont des ennuis le mardi. »"
    tranches: 0

  - id: banque_brochures
    lieu: banque
    habitude: quartier
    objet: brochures
    label: "Lire les brochures"
    texte: "L'épargne logement, le livret des jeunes, l'assurance décès « pour les métiers à risque ». Sur la photo, un couple sourit devant un pavillon qui ressemble à ceux des Lilas."
    textes:
      - "L'épargne logement, le livret des jeunes, l'assurance décès « pour les métiers à risque ». Sur la photo, un couple sourit devant un pavillon qui ressemble à ceux des Lilas."
      - "Une brochure promet « un crédit en quarante-huit heures, sans justificatif ». Quelqu'un a écrit au stylo sur le présentoir : ET APRÈS ?"
      - "La brochure de l'année : la banque est « partenaire du sport aubérivois ». La photo de l'équipe date de deux saisons ; trois joueurs sont partis depuis, et un ne joue plus nulle part."
      - "Une brochure sur les placements des sportifs. Page deux : « Votre carrière est courte. Votre retraite sera longue. » Le guichetier attend que tu la plies en quatre pour sourire."
    tranches: 0

  - id: banque_attente
    lieu: banque
    habitude: quartier
    objet: plante
    label: "Attendre près de la plante"
    texte: "La plante verte est en plastique ; quelqu'un y verse pourtant un fond de café chaque matin. Au guichet, une retraitée compte sa pension pièce à pièce, à voix haute."
    textes:
      - "La plante verte est en plastique ; quelqu'un y verse pourtant un fond de café chaque matin. Au guichet, une retraitée compte sa pension pièce à pièce, à voix haute."
      - "Un assureur, son cartable sur les genoux, lit par-dessus l'épaule d'un client un relevé qui n'est pas le sien. Il te voit le voir, et sourit comme un homme pris en train de travailler."
      - "Un gamin du centre ouvre son premier compte avec sa mère. Il a mis le survêtement du club pour l'occasion. La mère signe ; lui regarde la porte du coffre comme une porte de vestiaire."
      - "Le guichetier répond au téléphone : « Non, madame, je ne peux pas vous dire si le virement du club est passé. » Il raccroche, te voit, et rougit jusqu'aux oreilles."
    tranches: 0

  # ══════════════════════════════════════════════════════════════ LE CABINET DU DOC
  # Le matin et l'après-midi, du lundi au samedi. « Le Doc » est le médecin du club,
  # quelle que soit l'année : doux, précis sur le corps, ambigu sur le reste ; il
  # vouvoie l'entraîneur, il tutoie le joueur.
  - id: cabinet_soins
    lieu: cabinet
    habitude: soin
    objet: table_examen
    roles: [joueur]
    label: "Te faire soigner"
    texte: "Le Doc palpe ta cuisse du bout des doigts, les yeux au plafond, comme on écoute à une porte. « Là. Tu as couru dessus samedi. Tu courras dessus samedi prochain, mais moins vite. »"
    textes:
      - "Le Doc palpe ta cuisse du bout des doigts, les yeux au plafond, comme on écoute à une porte. « Là. Tu as couru dessus samedi. Tu courras dessus samedi prochain, mais moins vite. »"
      - "De la glace, une bande, et un mot pour le préparateur : pas de sprint avant jeudi. Tu le plies dans ta poche. « Il le lira, dit le Doc. Je lui en ai envoyé un double. »"
      - "Il nettoie ton tibia ouvert sur six centimètres et recoud en parlant de la pluie. Au quatrième point, tu ne sens plus rien ; au cinquième, il est passé au beau temps."
      - "Le papier crisse sous ton dos. Le Doc écoute ton cœur longtemps, trop longtemps, puis retire le stéthoscope en souriant. « Rien. Je voulais juste l'entendre. »"
    tranches: 1
    jauges: {direction: 1}

  - id: cabinet_examen
    lieu: cabinet
    habitude: soin
    objet: table_examen
    roles: [entraineur, president, ds, selectionneur]
    label: "Te faire examiner"
    texte: "Le Doc te prend la tension deux fois, sur les deux bras. « Quatorze. Vous criez beaucoup, le samedi ? Criez moins, ou criez mieux. » Il note le chiffre, et dessine une flèche qui monte."
    textes:
      - "Le Doc te prend la tension deux fois, sur les deux bras. « Quatorze. Vous criez beaucoup, le samedi ? Criez moins, ou criez mieux. » Il note le chiffre, et dessine une flèche qui monte."
      - "Il appuie sous tes côtes, à droite. « Ça, c'est le café. Ça, c'est le reste. » Il ne dit pas ce qu'est le reste, et tu ne le demandes pas."
      - "Une prise de sang entre deux joueurs. L'infirmière cherche la veine en parlant du derby. Elle trouve ton sang « plutôt calme pour quelqu'un comme vous », sans préciser comme qui."
      - "Le Doc te pèse sur la balance des joueurs, réglée pour des corps de vingt ans. Il recule le curseur sans commentaire, écrit le chiffre, puis le souligne."
    tranches: 1

  - id: cabinet_kine
    lieu: cabinet
    habitude: soin
    objet: table_examen
    label: "Une séance de kiné"
    texte: "La kiné travaille ton dos en silence, les pouces dans les nœuds. À la fin, elle te dit de quel côté tu dors et sur quelle épaule tu portes ton sac. Elle a raison deux fois."
    textes:
      - "La kiné travaille ton dos en silence, les pouces dans les nœuds. À la fin, elle te dit de quel côté tu dors et sur quelle épaule tu portes ton sac. Elle a raison deux fois."
      - "En dehors des heures du club, la séance se paie. La kiné encaisse en liquide, rend la monnaie d'une main, et de l'autre appuie sur ton mollet jusqu'à ce que tu dises un chiffre."
      - "Sous la lampe chauffante, tu t'endors dix minutes. Quand tu rouvres les yeux, la kiné écrit sur une fiche. « Vous avez parlé. Rien d'important. Un prénom, toujours le même. »"
      - "Elle fait craquer ta nuque d'un geste, sans prévenir. Dans la salle d'attente, quelqu'un sursaute. « C'est le samedi qui sort, dit-elle. Il était coincé là depuis le match. »"
    tranches: 1
    francs: -120

  - id: cabinet_armoire
    lieu: cabinet
    habitude: soin
    objet: armoire
    label: "Regarder l'armoire"
    texte: "L'armoire est fermée à clé ; la clé pend au cou du Doc, sur un lacet de chaussure de foot. À travers la vitre dépolie, on devine des boîtes alignées par couleur."
    textes:
      - "L'armoire est fermée à clé ; la clé pend au cou du Doc, sur un lacet de chaussure de foot. À travers la vitre dépolie, on devine des boîtes alignées par couleur."
      - "Sur la porte de l'armoire, un registre accroché à une ficelle : chaque ampoule a sa ligne, sa date, un nom. Certaines lignes n'ont pas de nom, seulement un numéro de maillot."
      - "Le Doc t'aperçoit devant l'armoire et vient s'y adosser, sans rien dire, comme à un comptoir. Il te demande des nouvelles de ta famille. Il ne bouge pas avant que tu t'en ailles."
      - "Au pied de l'armoire, un carton sans étiquette, livré au nom du club. L'adhésif a été ouvert, puis refermé avec un autre, d'une autre couleur."
    tranches: 0

  - id: cabinet_infiltration
    lieu: cabinet
    habitude: soin
    objet: armoire
    roles: [entraineur]
    label: "Parler d'une infiltration"
    texte: "Tu demandes si ton milieu peut jouer samedi « avec quelque chose ». Le Doc range un flacon sans le regarder. « Avec quelque chose, il jouera. Après, il boitera avec quelque chose aussi. »"
    textes:
      - "Tu demandes si ton milieu peut jouer samedi « avec quelque chose ». Le Doc range un flacon sans le regarder. « Avec quelque chose, il jouera. Après, il boitera avec quelque chose aussi. »"
      - "« Une infiltration, c'est un prêt. Le genou rembourse plus tard, avec les intérêts. » Il te tend un formulaire : ton nom, celui du joueur, et une case « à la demande de »."
      - "Il refuse, cette fois. « Pas lui. Je l'ai piqué il y a douze jours. Si je recommence, je le vois à quarante ans avec une canne. Vous, vous ne le verrez pas. »"
      - "Il accepte sans discuter, et c'est ce qui t'inquiète. En sortant, tu croises le joueur dans la salle d'attente. Il te demande ce que le Doc a dit. Tu dis : « Rien. »"
    tranches: 1

  - id: cabinet_recrue
    lieu: cabinet
    habitude: travail
    objet: bureau_doc
    roles: [ds]
    label: "La visite d'une recrue"
    texte: "Le Doc lit le dossier médical de ta recrue et te le rend ouvert. « Ce qui est dedans, je le crois. Ce qui n'y est pas, je le cherche. » Il demande une radio du genou gauche."
    textes:
      - "Le Doc lit le dossier médical de ta recrue et te le rend ouvert. « Ce qui est dedans, je le crois. Ce qui n'y est pas, je le cherche. » Il demande une radio du genou gauche."
      - "La recrue tousse en montant l'escalier. Le Doc le note avant de l'ausculter. « Il fume, ou il a peur. On saura lundi. » L'après-midi, tu fais baisser le prix de dix pour cent."
      - "« Le cœur est bon. Les chevilles ont vécu. » Il retire ses lunettes : « Vous le prenez pour combien d'années ? Dites un chiffre, je vous dis si ses chevilles sont d'accord. »"
      - "Sur le bureau, deux dossiers au même nom : celui que l'agent a envoyé, et celui que le Doc a fait venir de l'ancien club. Ils ne racontent pas la même saison."
    tranches: 1
    jauges: {caisse: 1}

  - id: cabinet_arrets
    lieu: cabinet
    habitude: travail
    objet: bureau_doc
    roles: [president]
    label: "Lire les arrêts de travail"
    texte: "Le Doc te montre la pile des arrêts du mois : six joueurs, deux salariés, un jardinier. L'assurance du club en paiera quatre. Les autres, c'est la trésorerie."
    textes:
      - "Le Doc te montre la pile des arrêts du mois : six joueurs, deux salariés, un jardinier. L'assurance du club en paiera quatre. Les autres, c'est la trésorerie."
      - "« Votre assureur m'a appelé pour savoir si votre défenseur est vraiment blessé. Je lui ai dit que je ne parlais pas de mes patients. Il m'a dit qu'il ne paierait pas pour eux. »"
      - "Trois semaines d'arrêt pour un joueur qu'on a vu danser samedi au Rideau Rouge. Le Doc a signé sans hésiter. « Il a mal. Pas là où il danse. »"
      - "Tu demandes s'il pourrait écrire « reprise possible » plutôt que « reprise conseillée ». Il te regarde longtemps. « Je peux. Vous voulez que je le fasse, ou vous vouliez savoir si je pouvais ? »"
    tranches: 1
    jauges: {caisse: 1}

  - id: cabinet_selection
    lieu: cabinet
    habitude: travail
    objet: bureau_doc
    roles: [selectionneur]
    label: "Le dossier d'un joueur"
    texte: "Le Doc te reçoit poliment et ne te dit rien. « Il est apte. » Pour combien de minutes ? « Il est apte. » Tu ressors avec un nom et pas une minute."
    textes:
      - "Le Doc te reçoit poliment et ne te dit rien. « Il est apte. » Pour combien de minutes ? « Il est apte. » Tu ressors avec un nom et pas une minute."
      - "« S'il part dix jours chez vous, il revient sans genou. S'il ne part pas, le président me le fait payer. » Il te montre la radio, puis la retourne. « Vous n'avez rien vu. Moi non plus. »"
      - "Il te donne le chiffre que personne ne donne : les minutes jouées sous infiltration depuis la rentrée. Tu notes le chiffre dans ton carnet. Tu ne notes pas d'où il vient."
      - "Le Doc et toi parlez du même joueur comme de deux personnes. Il voit un genou, tu vois un match. À la fin, vous tombez d'accord sur une date, pas sur une jambe."
    tranches: 1
    jauges: {vestiaire: 1}

  - id: cabinet_dossier
    lieu: cabinet
    habitude: soin
    objet: bureau_doc
    roles: [joueur]
    label: "Lire ton dossier"
    texte: "Le Doc ouvre ton dossier : tes blessures depuis tes quinze ans, de son écriture penchée. À la dernière page, souligné : « à surveiller ». Il referme le dossier avant que tu demandes quoi."
    textes:
      - "Le Doc ouvre ton dossier : tes blessures depuis tes quinze ans, de son écriture penchée. À la dernière page, souligné : « à surveiller ». Il referme le dossier avant que tu demandes quoi."
      - "Ton dossier est plus épais que celui du capitaine. Le Doc le soupèse. « Ce n'est pas grave : tu viens plus souvent. Lui, il ne vient jamais. C'est ça qui est grave. »"
      - "Il te montre le tampon « apte » sur chaque visite, et une visite sans tampon, l'an dernier. « Ce jour-là, le président a signé à ma place. Je l'ai laissé dans le dossier. »"
      - "Il manque une page ; les agrafes ont été défaites, puis remises. Le Doc dit qu'il ne sait pas. Puis il dit que ton agent est passé lundi, pendant qu'il était au stade."
    tranches: 0

  - id: cabinet_attente
    lieu: cabinet
    habitude: soin
    objet: attente
    label: "Patienter avec les autres"
    texte: "En salle d'attente, la mère d'un gamin du centre tient la radio de son fils sur ses genoux, comme un bulletin de notes. Elle te demande si on peut jouer avec deux vis dans la cheville."
    textes:
      - "En salle d'attente, la mère d'un gamin du centre tient la radio de son fils sur ses genoux, comme un bulletin de notes. Elle te demande si on peut jouer avec deux vis dans la cheville."
      - "Un vieil abonné de la tribune nord attend pour son genou. Il te raconte un match de 1962 où un joueur a fini sur une jambe, parce qu'on ne remplaçait pas. « Et on a gagné. »"
      - "Les magazines ont trois ans. Dans l'un d'eux, une photo de toi, plus jeune, avec une coupe de cheveux que tu avais oubliée. Quelqu'un a dessiné une moustache, puis l'a gommée."
      - "Un joueur de l'équipe que le club reçoit samedi attend son tour, la cheville sous glace. Vous vous regardez. Il demande si le Doc est bon. Tu dis que non, par réflexe."
      - "La secrétaire appelle les patients par leur prénom, sauf toi. Quand vient ton tour, elle dit ton nom de famille en entier, et toute la salle lève la tête."
    tranches: 1

  - id: cabinet_radios
    lieu: cabinet
    habitude: soin
    objet: radios
    label: "Regarder les radios"
    texte: "Au négatoscope, un genou du club, de face et de profil. Le Doc pose son stylo sur une ombre grise. « Ça, il l'a depuis l'âge de quatorze ans. Personne ne le lui a dit. »"
    textes:
      - "Au négatoscope, un genou du club, de face et de profil. Le Doc pose son stylo sur une ombre grise. « Ça, il l'a depuis l'âge de quatorze ans. Personne ne le lui a dit. »"
      - "Une radio de thorax, à part, sans nom. Le Doc éteint la lampe quand tu approches. « Pas un joueur. Quelqu'un de la maison. Il ne veut pas qu'on le sache avant la fin de la saison. »"
      - "Deux chevilles côte à côte : le même joueur, à douze ans d'écart. « Regardez l'os, dit le Doc. Il s'est épaissi partout où il a eu peur. »"
      - "Une main, cinq doigts, et une bague qui fait une tache blanche. « Le gardien a joué avec. Je lui avais dit de l'enlever. Maintenant, on ne peut plus l'enlever. »"
    tranches: 0

  # ══════════════════════════════════════════════════════════ IMMOBILIER TESSANDIER
  # Le matin et l'après-midi, du lundi au samedi. L'agence vend ce que la boutique
  # vend (le quai, les Lilas, la villa, le manoir) ; ici, ce qui se dit autour.
  - id: agence_loger
    lieu: agence
    habitude: travail
    objet: bureau
    roles: [entraineur, president, ds]
    label: "Loger une recrue"
    texte: "Tu cherches un deux-pièces pour une recrue qui arrive lundi avec sa femme et un chien. La patronne barre trois adresses : « Pas de chien. Pas de footballeur. Surtout pas de chien de footballeur. »"
    textes:
      - "Tu cherches un deux-pièces pour une recrue qui arrive lundi avec sa femme et un chien. La patronne barre trois adresses : « Pas de chien. Pas de footballeur. Surtout pas de chien de footballeur. »"
      - "On te propose un meublé au-dessus de la boulangerie des Lilas. « Il se lèvera à quatre heures avec le four. Pour un sportif, c'est un avantage. » La recrue signe sans visiter."
      - "Le propriétaire veut un garant pour un joueur de dix-neuf ans. Tu signes toi-même, sur le coin du bureau, et l'agente glisse le stylo dans ta poche avant que tu le lui rendes."
      - "Pour la recrue venue de loin, l'agente trouve un appartement près de la gare routière. « Il entendra les cars partir. Ça aide, les premiers mois : on se dit qu'on peut repartir. »"
    tranches: 1
    jauges: {vestiaire: 1}

  - id: agence_visiter
    lieu: agence
    habitude: luxe
    objet: bureau
    label: "Visiter un bien"
    texte: "Le trois-pièces du quai : du parquet, une fenêtre sur la Rive, et l'odeur du fleuve les jours de crue. L'agente ouvre les volets un par un, comme on retourne des cartes."
    textes:
      - "Le trois-pièces du quai : du parquet, une fenêtre sur la Rive, et l'odeur du fleuve les jours de crue. L'agente ouvre les volets un par un, comme on retourne des cartes."
      - "Le pavillon des Lilas, ses rosiers, son garage. La propriétaire, veuve d'un ancien du club, reste dans la cuisine pendant la visite et te regarde marcher dans son couloir."
      - "La villa des hauteurs : une piscine vide, un salon où tiendrait un vestiaire entier. L'agente dit que l'ancien propriétaire « a dû partir vite ». Elle ne dit pas où."
      - "Le manoir et son parc, au-dessus de la ville. De la terrasse, on voit toute la Rive, et le stade comme une boîte d'allumettes. « D'ici, dit l'agente, on ne vous entend plus siffler. »"
    tranches: 1

  - id: agence_maquette
    lieu: agence
    habitude: quartier
    objet: maquette
    label: "Regarder la maquette"
    texte: "Sous sa cloche de verre, la résidence de la Rive en carton blanc, des arbres en lichen, des personnages qui promènent des chiens. À la place du stade, sur la maquette, un parking."
    textes:
      - "Sous sa cloche de verre, la résidence de la Rive en carton blanc, des arbres en lichen, des personnages qui promènent des chiens. À la place du stade, sur la maquette, un parking."
      - "Près de la berge, quelqu'un a glissé sous la cloche un minuscule joueur au maillot du club, pris dans une boîte de figurines. Il est tombé sur le dos, au bord de l'eau en carton."
      - "Sur le socle, une plaque : « Résidence de la Rive, livraison », et une date grattée, repeinte, grattée encore. La troisième est écrite au feutre."
      - "Un enfant colle son nez contre le verre et cherche sa maison. Sa mère lui dit qu'elle n'y est pas. Il demande où on a mis le stade. Personne ne lui répond."
    tranches: 0

  - id: agence_terrain
    lieu: agence
    habitude: travail
    objet: maquette
    roles: [president]
    label: "Parler du terrain du stade"
    texte: "La patronne pose le doigt sur la cloche, là où devrait être le stade. « Je ne vous demande rien. Je vous montre ce que vaudrait le terrain, si un jour vous n'aviez plus besoin de jouer dessus. »"
    textes:
      - "La patronne pose le doigt sur la cloche, là où devrait être le stade. « Je ne vous demande rien. Je vous montre ce que vaudrait le terrain, si un jour vous n'aviez plus besoin de jouer dessus. »"
      - "On te propose de vendre le parking des visiteurs « pour commencer ». Personne ne s'y gare le samedi, dit-elle. Tu penses aux cars adverses ; elle pense déjà aux balcons."
      - "Une promesse de vente traîne sur le bureau, ton nom tapé à la machine, la somme en blanc. La patronne la range quand tu entres, sans se presser, pour que tu la voies."
      - "On te propose un dîner « pour en parler », à l'hôtel de la Rive, avec quelqu'un de la banque. Tu dis peut-être. Le soir même, la tribune nord sait que tu as dit peut-être."
    tranches: 1
    jauges: {caisse: 1, tribunes: -1}

  - id: agence_annonces
    lieu: agence
    habitude: quartier
    objet: annonces
    label: "Lire les annonces"
    texte: "À vendre : maison de maître, ancien président du club, vendue meublée, « départ précipité ». Sur la photo du salon, un trophée posé sur la cheminée. Il est compris dans le prix."
    textes:
      - "À vendre : maison de maître, ancien président du club, vendue meublée, « départ précipité ». Sur la photo du salon, un trophée posé sur la cheminée. Il est compris dans le prix."
      - "À louer : studio rue du Stade, « idéal joueur en prêt ». Quelqu'un a ajouté au stylo : « ou entraîneur en sursis ». L'annonce est restée : l'agente n'a pas vu, ou elle a ri."
      - "Pavillon, quatre pièces, « vue sur le stade, ambiance assurée les soirs de match ». En dessous, en plus petit : « double vitrage à prévoir »."
      - "Une annonce écrite à la main, collée de travers dans la vitrine : un ancien joueur vend sa maison pour payer ses dettes. Le numéro à appeler est celui du Corner."
    tranches: 0

  - id: agence_photo
    lieu: agence
    habitude: travail
    objet: annonces
    roles: [joueur, entraineur, selectionneur]
    label: "Poser pour l'agence"
    texte: "Le photographe de l'agence te fait poser devant la maquette, la main sur le verre, comme un propriétaire. La brochure dira « Ils ont choisi la Rive ». Tu n'as rien choisi ; tu as signé un reçu."
    textes:
      - "Le photographe de l'agence te fait poser devant la maquette, la main sur le verre, comme un propriétaire. La brochure dira « Ils ont choisi la Rive ». Tu n'as rien choisi ; tu as signé un reçu."
      - "Ta photo sur le panneau du chantier, au bord de la nationale, trois mètres sur deux. Le premier soir, quelqu'un te dessine des cornes. Le lendemain, l'agence fait repeindre."
      - "On te demande de sourire « comme un voisin ». Tu ne sais pas comment sourit un voisin. Le photographe en prend vingt et garde celle où tu regardes ta montre."
      - "La patronne te fait signer le droit d'utiliser ton image « pour toute la durée de la commercialisation ». Tu demandes combien de temps ça dure. « Ça dépend un peu de vous. »"
    tranches: 1
    francs: 600
    jours: [ven]
    heures: [matin]
    max_jour: 1
    jauges: {tribunes: -1}

  - id: agence_cafe
    lieu: agence
    habitude: quartier
    objet: cafe
    label: "Un café à l'agence"
    texte: "La machine à café est réservée aux clients. On te le fait comprendre en te laissant chercher une pièce. Elle avale la pièce et rend un café trop long."
    textes:
      - "La machine à café est réservée aux clients. On te le fait comprendre en te laissant chercher une pièce. Elle avale la pièce et rend un café trop long."
      - "La secrétaire te tend le gobelet du bout des doigts. Dans un coin, un couple attend sa signature en se tenant la main au-dessus d'un dossier de prêt. Le café sent le carton."
      - "Tu bois ton café debout devant la vitrine. Dehors, deux supporters lisent les prix des pavillons, te voient, puis relisent les prix, plus lentement."
      - "Le café s'arrête à mi-gobelet. La patronne ouvre un tiroir plein de pièces étrangères, en glisse une dans la fente, et le gobelet se remplit. « Elle a ses préférées. »"
    tranches: 0
    francs: -3

  # ══════════════════════════════════════════════════════════════ L'HÔTEL DE LA RIVE
  # Ouvert jour et nuit. Le sélectionneur y loge (ville.yaml `domiciles`) : sa veillée,
  # son déjeuner du sponsor et son lit sont dans ville.yaml ; les autres rôles peuvent
  # y prendre une chambre. Le courtier de la Capitale tient la chambre 7.
  - id: hotel_chambre
    lieu: hotel
    habitude: luxe
    objet: reception
    roles: [entraineur, joueur, president, ds]
    label: "Prendre une chambre"
    texte: "Le veilleur de nuit te donne la clé de la 4 sans poser de question et note l'heure au tableau. La chambre sent la lavande et le tabac d'un autre."
    nuit: true
    heures: [soir, nuit]
    francs: -280

  - id: hotel_journal
    lieu: hotel
    habitude: culture
    objet: reception
    label: "Le journal du hall"
    special: journal
    texte: "Sur le comptoir de la réception, les journaux du matin attendent les clients, pliés en deux. Tu prends L'Écho."
    textes:
      - "Sur le comptoir de la réception, les journaux du matin attendent les clients, pliés en deux. Tu prends L'Écho."
      - "Le directeur te tend L'Écho repassé, encore tiède : on repasse les journaux pour les clients de la Capitale."
      - "Un représentant a laissé L'Écho ouvert sur le comptoir, à la page des sports, ton nom souligné au stylo."
      - "Tu lis L'Écho debout dans le hall, entre les valises d'un car de supporters adverses."
    tranches: 0
    heures: [matin, midi]

  - id: hotel_cles
    lieu: hotel
    habitude: quartier
    objet: tableau_cles
    si: "annee <= 2013"
    label: "Lire le tableau des clés"
    texte: "Il manque la clé de la 7 : le courtier de la Capitale est en ville. Il manque aussi celle de la 14, qui n'est jamais louée, d'après le directeur."
    textes:
      - "Il manque la clé de la 7 : le courtier de la Capitale est en ville. Il manque aussi celle de la 14, qui n'est jamais louée, d'après le directeur."
      - "À côté de chaque crochet vide, le veilleur a noté une heure au crayon. Il sait qui est rentré, et quand. Il ne te dit pas ce qu'il sait ; il te montre qu'il pourrait."
      - "La clé de la 2 est accrochée à l'envers. Le veilleur dit que c'est un signal entre lui et la femme de chambre, sourit, et la remet dans le bon sens."
      - "Un porte-clés en forme de ballon pend au crochet de la 11, oublié par un joueur en mise au vert. « C'est devenu sa chambre, dit le directeur. Il ne le sait pas. »"
    tranches: 0

  # les serrures à carte (2014) : le tableau est descendu à la cave, il reste sa trace
  - id: hotel_casiers
    lieu: hotel
    habitude: quartier
    objet: tableau_cles
    si: "annee >= 2014"
    label: "Regarder le mur des clés"
    texte: "Le tableau des clés a disparu : il reste sur le papier peint un rectangle plus clair, criblé de trous de crochets. Les chambres s'ouvrent à la carte, et la carte ne dit pas l'heure."
    textes:
      - "Le tableau des clés a disparu : il reste sur le papier peint un rectangle plus clair, criblé de trous de crochets. Les chambres s'ouvrent à la carte, et la carte ne dit pas l'heure."
      - "Le réceptionniste programme une carte en dix secondes, puis la reprogramme : il s'était trompé de chambre. « Celle-là, dit-il, il valait mieux pas. »"
      - "Sur le comptoir, un écran tourné vers le réceptionniste liste les chambres occupées. Il le fait pivoter d'un centimètre vers toi, comme par mégarde, puis le remet en place."
      - "Au milieu du rectangle clair, une seule vieille clé pend à un clou, celle de la 11. Un ancien joueur la réclame à chaque mise au vert, dit le veilleur ; par superstition."
    tranches: 0

  - id: hotel_messages
    lieu: hotel
    habitude: travail
    objet: tableau_cles
    roles: [selectionneur]
    si: "!flag(histoire_h9)"
    label: "Prendre tes messages"
    texte: "Dans ton casier de la réception, trois messages de la Fédération, d'une écriture ronde. Le troisième dit : « Rappeler avant que la presse appelle. » La presse a appelé."
    textes:
      - "Dans ton casier de la réception, trois messages de la Fédération, d'une écriture ronde. Le troisième dit : « Rappeler avant que la presse appelle. » La presse a appelé."
      - "Un message d'un président de club, un autre d'un agent, et un troisième sans nom : « Il ment sur son genou. » La standardiste jure qu'elle a écrit ce qu'on lui a dicté, mot pour mot."
      - "Ton casier est vide, pour une fois. Le veilleur te tend pourtant un papier plié : quelqu'un de chez toi a appelé, pour savoir si tu existais encore. « Ne pas rappeler. »"
      - "Un message du capitaine des Cobalts, laissé à minuit : « On peut parler sans les autres ? » La standardiste a souligné « sans » sans qu'on le lui demande."
    tranches: 0

  - id: hotel_tele
    lieu: hotel
    habitude: culture
    objet: salon
    label: "La télé du salon"
    special: tele
    texte: "Dans le salon, la télé reste allumée sans le son pour les représentants qui mangent. Tu montes le volume d'un cran ; personne ne proteste."
    textes:
      - "Dans le salon, la télé reste allumée sans le son pour les représentants qui mangent. Tu montes le volume d'un cran ; personne ne proteste."
      - "Le pianiste s'interrompt pour les résultats. Tout le salon se tourne vers l'écran, même les clients de passage."
      - "Tu regardes la télé du salon dans un fauteuil trop profond. Le barman vient se placer derrière toi, le torchon sur l'épaule."
      - "Un car de supporters adverses a réservé le salon. Ils regardent avec toi, en silence, poliment, en attendant le moment de chanter."
    tranches: 1
    heures: [midi, aprem, soir]

  - id: hotel_cartes
    lieu: hotel
    habitude: jeu
    objet: salon
    roles: [entraineur, joueur, president, ds]
    label: "Une partie au salon"
    texte: "Trois représentants de commerce jouent après le dîner, sous la lampe du salon. Ils te font une place et poussent le cendrier au milieu de la table."
    jeu: cartes
    tranches: 0
    francs: -50
    heures: [soir, nuit]

  - id: hotel_seminaire
    lieu: hotel
    habitude: travail
    objet: salon
    roles: [entraineur, selectionneur, president, ds]
    label: "Parler à un séminaire"
    texte: "Les cadres d'une coopérative agricole, en séminaire dans le salon, veulent savoir comment on motive un groupe. Tu parles de vestiaire. Ils prennent des notes sur des blocs à leur nom."
    textes:
      - "Les cadres d'une coopérative agricole, en séminaire dans le salon, veulent savoir comment on motive un groupe. Tu parles de vestiaire. Ils prennent des notes sur des blocs à leur nom."
      - "Le séminaire d'une compagnie d'assurances. Une question, au fond : « Comment on se sépare de quelqu'un qu'on aime bien ? » Le salon se tait. On te paie pour la réponse ; tu la donnes."
      - "Tu parles quarante minutes devant un tableau de papier où quelqu'un a écrit LA GAGNE en lettres rouges. À la pause, le directeur commercial te demande des places pour le derby."
      - "Ils t'applaudissent avant que tu commences, pendant, puis à la fin, au même volume. L'organisatrice te tend l'enveloppe : les vendeurs ont adoré « l'histoire du car »."
    tranches: 1
    francs: 600
    jours: [jeu]
    heures: [aprem]
    max_jour: 1

  - id: hotel_ronde
    lieu: hotel
    habitude: travail
    objet: escalier
    roles: [entraineur]
    label: "Faire la ronde des chambres"
    texte: "Mise au vert, vingt-deux heures. Derrière la porte de la 3, une radio ; derrière la 5, quelqu'un pleure doucement au téléphone. Tu frappes à la 3 seulement."
    textes:
      - "Mise au vert, vingt-deux heures. Derrière la porte de la 3, une radio ; derrière la 5, quelqu'un pleure doucement au téléphone. Tu frappes à la 3 seulement."
      - "La porte de la 8 est entrouverte, la chambre vide, le lit fait. Le veilleur jure que personne n'est sorti. À minuit, le joueur redescend de la 11, où dorment les remplaçants."
      - "Dans la chambre du capitaine, quatre joueurs jouent aux cartes pour des allumettes. Ils se lèvent quand tu entres. Tu retournes une carte : un as. « Au lit. »"
      - "Tu fais la ronde en chaussettes pour ne réveiller personne. Au bout du couloir, ton adjoint fait la même chose dans l'autre sens. Vous vous croisez en vous faisant signe de vous taire."
    tranches: 1
    jours: [ven]
    heures: [soir]
    jauges: {direction: 1}

  - id: hotel_courtier
    lieu: hotel
    habitude: travail
    objet: escalier
    label: "Frapper à la chambre 7"
    texte: "Le courtier de la Capitale entrouvre la porte de la 7, en peignoir, une loupe d'horloger au cou. « Sur rendez-vous. Mais pour vous, demain, onze heures. »"
    textes:
      - "Le courtier de la Capitale entrouvre la porte de la 7, en peignoir, une loupe d'horloger au cou. « Sur rendez-vous. Mais pour vous, demain, onze heures. »"
      - "Dans la 7, des écrins ouverts sur le lit, une toile appuyée contre l'armoire, une maquette de bateau sur la table de nuit. Le courtier referme les écrins un par un en parlant."
      - "Le courtier ne t'ouvre pas. À travers la porte, il te demande ton nom, puis ton club, puis ton salaire, et annonce qu'il descend. Il ne descend pas."
      - "Il te montre une montre en or « qui a appartenu à un président de club ». Lequel, ce sera dans le prix. Au dos, quelqu'un a gratté la gravure avec un tournevis."
    tranches: 0
    heures: [aprem, soir]

  - id: hotel_cabine
    lieu: hotel
    habitude: quartier
    objet: cabine
    si: "annee <= 2009"
    label: "Appeler de la cabine"
    texte: "La cabine du hall, sa porte en accordéon qui ne ferme plus tout à fait, l'annuaire attaché par une chaîne."
    special: telephone
    tranches: 0
    francs: -3

  - id: hotel_cabine_livres
    lieu: hotel
    habitude: culture
    objet: cabine
    si: "annee >= 2010"
    label: "Prendre un livre"
    texte: "La cabine du hall n'a plus de téléphone. Le directeur y a mis des étagères : on prend un livre, on en laisse un. Sur le dessus, la vie d'un ancien gardien, jamais ouverte."
    textes:
      - "La cabine du hall n'a plus de téléphone. Le directeur y a mis des étagères : on prend un livre, on en laisse un. Sur le dessus, la vie d'un ancien gardien, jamais ouverte."
      - "Quelqu'un a laissé dans la cabine un guide de voyage plein de notes dans les marges. Les pages du retour sont cornées ; celles de l'aller, intactes."
      - "Tu prends un roman policier qui se passe à Portclair. Sur la page de garde, un tampon : « Bibliothèque du car des supporters ». Le car n'existe plus depuis longtemps."
      - "Le combiné est resté accroché au mur de la cabine, sans fil, pour le décor. Un enfant le décroche, écoute longtemps, et raccroche en disant que personne ne répond."
    tranches: 0

  - id: hotel_registre
    lieu: hotel
    habitude: quartier
    objet: registre
    label: "Lire le registre"
    texte: "Le registre est ouvert sur le comptoir. Hier soir : un recruteur de Valentienne, un couple « Bonnet » qui a payé en liquide, et un nom que tu connais, barré, réécrit plus bas."
    textes:
      - "Le registre est ouvert sur le comptoir. Hier soir : un recruteur de Valentienne, un couple « Bonnet » qui a payé en liquide, et un nom que tu connais, barré, réécrit plus bas."
      - "Le directeur tourne le registre vers lui quand tu approches, sans hâte. « Les clients nous confient leur nom. Pas le droit de le prêter. »"
      - "À la date de vendredi, le nom de l'arbitre de samedi, chambre réglée par « l'organisation ». L'organisation n'a pas de nom ; elle a une écriture que tu crois reconnaître."
      - "Les pages de 1962 sont exposées sous la vitrine du hall : les noms de l'équipe, la veille du titre, et une tache de vin sur la signature du capitaine."
    tranches: 0

  # ══════════════════════════════════════════════════════════════════ LA PHARMACIE
  # Le matin et l'après-midi, tous les jours. Le pharmacien lit les visages avant les
  # ordonnances ; le tiroir des ordonnances ferme à clé.
  - id: pharmacie_conseil
    lieu: pharmacie
    habitude: soin
    objet: comptoir
    label: "Un conseil au comptoir"
    texte: "Tu as perdu ta voix à force de crier samedi. Le pharmacien te vend des pastilles et un conseil : « Faites des gestes. Le terrain comprend mieux les mains que la voix. »"
    textes:
      - "Tu as perdu ta voix à force de crier samedi. Le pharmacien te vend des pastilles et un conseil : « Faites des gestes. Le terrain comprend mieux les mains que la voix. »"
      - "Il pose une boîte pour l'estomac sur le comptoir avant que tu aies ouvert la bouche. « Les lendemains de défaite, j'en vends douze. Vous ouvrez la liste, aujourd'hui. »"
      - "Une crème qui chauffe, pour le dos. Le pharmacien mime le geste sur sa propre épaule, sous le regard d'une cliente qui attend son sirop et qui commente."
      - "Tu demandes quelque chose contre le mal de tête. Il te tend un comprimé et un verre d'eau, et attend que tu l'avales devant lui. « Comme ça, je sais que vous le prenez. »"
    tranches: 0
    francs: -35

  - id: pharmacie_trousse
    lieu: pharmacie
    habitude: travail
    objet: comptoir
    roles: [entraineur, selectionneur]
    label: "Remplir la trousse du banc"
    texte: "Strap, bombe de froid, compresses, une pince pour les échardes du banc. Le pharmacien prépare la trousse comme un sac de voyage, en vérifiant chaque fermeture."
    textes:
      - "Strap, bombe de froid, compresses, une pince pour les échardes du banc. Le pharmacien prépare la trousse comme un sac de voyage, en vérifiant chaque fermeture."
      - "Le soigneur a vidé la trousse en trois matchs. Tu la fais remplir de ta poche. Le pharmacien ajoute un tube d'arnica sans le compter : « Pas pour les joueurs. Pour vous. »"
      - "Il glisse dans la trousse une petite lampe. « Pour les pupilles, après un choc à la tête. Si elles ne bougent pas, vous le sortez. Même s'il pleure. Surtout s'il pleure. »"
      - "Il te fait les bombes de froid au prix coûtant et te demande seulement deux places pour son fils, en virage. « Le virage, pas la tribune. Il veut entendre, pas voir. »"
    tranches: 1
    francs: -120
    jauges: {vestiaire: 1}

  - id: pharmacie_sommeil
    lieu: pharmacie
    habitude: soin
    objet: comptoir
    si: "eveil >= 5"
    label: "Quelque chose pour dormir"
    texte: "Le pharmacien regarde tes yeux avant ta main tendue. « Combien de nuits ? » Tu dis deux. Il entend quatre, et te vend la plus petite boîte."
    textes:
      - "Le pharmacien regarde tes yeux avant ta main tendue. « Combien de nuits ? » Tu dis deux. Il entend quatre, et te vend la plus petite boîte."
      - "« Une tisane, d'abord. Les comprimés, c'est quand la tisane a perdu. Elle n'a pas encore joué. » Il te la vend avec le mode d'emploi, comme une ordonnance."
      - "Il te vend les comprimés et écrit au feutre, sur la boîte, le nombre maximum : un. Puis il souligne le un."
      - "« Vous n'êtes pas seul{pg, select, f{e} other{}} cette semaine. » À côté de la caisse attend une boîte identique, un nom écrit dessus, qu'il couvre de la main."
    tranches: 0
    francs: -45

  - id: pharmacie_rayons
    lieu: pharmacie
    habitude: soin
    objet: rayons
    label: "Faire le tour des rayons"
    texte: "Les rayons sentent l'éther et le savon. Entre les crèmes solaires et les pansements, des pastilles aux couleurs du club, « édition limitée ». Il en reste beaucoup."
    textes:
      - "Les rayons sentent l'éther et le savon. Entre les crèmes solaires et les pansements, des pastilles aux couleurs du club, « édition limitée ». Il en reste beaucoup."
      - "Au rayon des fortifiants, une boîte promet « l'énergie des champions ». Sur la photo, un sportif qui ne ressemble à personne. Le préparateur du club en prend par cartons, dit la vendeuse."
      - "Une mère achète des pansements pour toute une équipe de poussins et demande s'il existe des genouillères qui ne se voient pas. « Il a honte de tomber », explique-t-elle."
      - "Au fond, la porte de l'arrière-boutique est entrouverte : un homme en survêtement neuf compte des boîtes avec le préparateur. Elle se ferme doucement quand tu passes."
    tranches: 0

  - id: pharmacie_vitamines
    lieu: pharmacie
    habitude: soin
    objet: rayons
    roles: [joueur]
    label: "Acheter des vitamines"
    texte: "Une cure de vitamines en ampoules à casser au-dessus d'un verre. Le pharmacien lit l'étiquette à voix haute en te les vendant, comme pour qu'on l'entende de la rue."
    textes:
      - "Une cure de vitamines en ampoules à casser au-dessus d'un verre. Le pharmacien lit l'étiquette à voix haute en te les vendant, comme pour qu'on l'entende de la rue."
      - "Il te déconseille les fortifiants que le club a recommandés, sans dire pourquoi, et t'en vend d'autres, moins chers, avec la liste des composants soulignée."
      - "« Rien qui soit sur la liste », dit-il en posant la boîte. Tu demandes quelle liste. Il te regarde comme on regarde quelqu'un qui devrait la connaître."
      - "Tu achètes du magnésium contre les crampes. Il ajoute un conseil gratuit : dormir. Il le dit en articulant, comme une posologie."
    tranches: 0
    francs: -60

  - id: pharmacie_balance
    lieu: pharmacie
    habitude: soin
    objet: balance
    label: "Te peser"
    texte: "Une pièce dans la vieille balance : elle claque, hésite, et imprime un ticket avec ton poids et un horoscope. L'horoscope dit : « Méfiez-vous des promesses du samedi. »"
    textes:
      - "Une pièce dans la vieille balance : elle claque, hésite, et imprime un ticket avec ton poids et un horoscope. L'horoscope dit : « Méfiez-vous des promesses du samedi. »"
      - "Deux kilos de plus que sur la balance du club. Le pharmacien dit que la sienne est juste, et celle du club « arrangeante ». Il dit ça de toutes les balances de la ville."
      - "Une gamine monte sur la balance avant toi, avec son cartable, pour savoir combien pèse l'école. Elle te laisse la place en disant qu'à deux, ce serait trop."
      - "Le ticket donne ton poids, ta taille, et un poids idéal que tu n'as jamais pesé. Tu le glisses dans ton portefeuille, derrière une photo."
    tranches: 0
    francs: -3

  - id: pharmacie_ordonnance
    lieu: pharmacie
    habitude: soin
    objet: ordonnances
    label: "Faire une ordonnance"
    texte: "Le pharmacien lit l'ordonnance du Doc en plissant les yeux, déchiffre un mot, puis un autre, et décroche le téléphone pour vérifier le troisième."
    textes:
      - "Le pharmacien lit l'ordonnance du Doc en plissant les yeux, déchiffre un mot, puis un autre, et décroche le téléphone pour vérifier le troisième."
      - "Il range ton ordonnance dans le tiroir, avec celles du club, sous un élastique. « Je les garde. On ne sait jamais qui viendra me demander ce que vous avez pris. »"
      - "Sur l'ordonnance, un produit qu'il n'a pas. Il peut le commander pour demain, ou te donner « l'équivalent ». Il insiste sur les guillemets en le disant."
      - "Le tiroir des ordonnances ferme à clé, comme l'armoire du cabinet. Le pharmacien dit que c'est le même serrurier, et qu'il a fait un prix pour les deux."
    tranches: 0
    francs: -40

  # ═════════════════════════════════════════════════════════════════ L'ÉCOLE PUBLIQUE
  # On entre dans la cour à toute heure ; la classe, c'est les lundis, mardis, jeudis
  # et vendredis. Le cycle foot du jeudi est payé par la mairie (un intervenant
  # sportif) ; la kermesse tombe au bilan de la saison, en juin.
  - id: ecole_cycle_foot
    lieu: ecole
    habitude: travail
    objet: tableau
    roles: [entraineur, joueur]
    label: "Le cycle foot des CM1"
    texte: "Au tableau noir, tu dessines un terrain à la craie, puis onze ronds. Une élève demande pourquoi il n'y a pas de fille dans les ronds. Tu en effaces un, et tu lui donnes son prénom."
    textes:
      - "Au tableau noir, tu dessines un terrain à la craie, puis onze ronds. Une élève demande pourquoi il n'y a pas de fille dans les ronds. Tu en effaces un, et tu lui donnes son prénom."
      - "La mairie te paie la séance comme intervenant sportif. Vingt-huit CM1 dans la cour, quatorze ballons, un seul qui rebondit. Au bout d'une heure, ils jouent à vingt-huit contre toi."
      - "Un gamin porte sous son pull le maillot de l'équipe rivale. Il te le montre exprès, à la fin. Tu lui serres la main comme aux autres ; il en est si déçu qu'il remet son pull."
      - "Le maître te demande d'expliquer le hors-jeu « avec des mots de CM1 ». Tu essaies avec des billes. À la fin, c'est un élève qui l'explique aux autres, mieux que toi."
    tranches: 1
    francs: 250
    jours: [jeu]
    heures: [aprem]
    max_jour: 1

  - id: ecole_parler
    lieu: ecole
    habitude: famille
    objet: tableau
    roles: [president, ds, selectionneur]
    label: "Parler aux CM2"
    texte: "Les CM2 ont préparé leurs questions sur des fiches. La première : « Pourquoi on perd plus souvent à l'extérieur ? » Tu cherches. Un élève au fond a la réponse : « Parce que c'est loin. »"
    textes:
      - "Les CM2 ont préparé leurs questions sur des fiches. La première : « Pourquoi on perd plus souvent à l'extérieur ? » Tu cherches. Un élève au fond a la réponse : « Parce que c'est loin. »"
      - "Tu expliques ton métier au tableau, avec des flèches. Un élève lève la main : son père a perdu son travail, il voudrait savoir si on peut être licencié dans le football. Tu dis oui."
      - "On t'a demandé de parler de ton métier. Les élèves veulent seulement savoir si tu connais le gardien. Tu dis oui. Un élève demande s'il est gentil. Tu réfléchis trop longtemps."
      - "Un élève te remet un dessin : le stade, la tribune pleine, et toi, minuscule, en bas à gauche, dans un costume trop grand. La maîtresse dit qu'il y a passé trois jours."
    tranches: 1
    jours: [lun, mar, jeu, ven]
    heures: [matin, aprem]
    jauges: {tribunes: 1}

  - id: ecole_pupitres
    lieu: ecole
    habitude: famille
    objet: pupitres
    label: "T'asseoir à un pupitre"
    texte: "Le pupitre est trop petit. Sous le couvercle, gravés au compas, un nom et une date : 1961. Tu connais le nom ; il a joué arrière gauche pendant dix ans, à la Rive."
    textes:
      - "Le pupitre est trop petit. Sous le couvercle, gravés au compas, un nom et une date : 1961. Tu connais le nom ; il a joué arrière gauche pendant dix ans, à la Rive."
      - "Dans le trou de l'encrier, quelqu'un a glissé une capsule aux couleurs du club. Le maître dit qu'elle y est depuis la finale de 1974 ; personne n'a osé l'enlever."
      - "Tu t'assois au dernier rang, près du radiateur. Par la fenêtre, on voit le haut des projecteurs du stade. Tu comprends pourquoi on regarde dehors, à cet âge-là."
      - "Sur un pupitre, un cahier oublié, ouvert à une rédaction : « Mon métier plus tard ». On y lit footballeur, barré, puis pharmacien, barré, puis footballeur encore, au feutre."
    tranches: 0

  - id: ecole_autographes
    lieu: ecole
    habitude: famille
    objet: pupitres
    roles: [joueur, entraineur]
    label: "Signer des cahiers"
    texte: "À la récréation, une file se forme devant toi, des cahiers de textes ouverts à la date du jour. Tu signes entre une dictée et un problème de robinets."
    textes:
      - "À la récréation, une file se forme devant toi, des cahiers de textes ouverts à la date du jour. Tu signes entre une dictée et un problème de robinets."
      - "Un garçon te tend son bras à la place du cahier. Tu signes au stylo bille. Le maître dit qu'il ne se lavera plus ; la mère, demain, dira autre chose."
      - "Une élève ne veut pas d'autographe : elle veut savoir pourquoi le 9 est sorti à l'heure de jeu samedi. Tu signes sous sa question."
      - "Le dernier cahier est un vieux carnet que le maître te tend en baissant la voix : « Pour mon frère. Il dit que vous ne durerez pas. Signez quand même. »"
    tranches: 0
    jours: [lun, mar, jeu, ven]
    heures: [matin, aprem]
    jauges: {tribunes: 1}

  - id: ecole_maitre
    lieu: ecole
    habitude: famille
    objet: bureau_maitre
    label: "Parler au maître"
    texte: "Le maître te montre un élève par la fenêtre : il sèche l'école les jours d'entraînement pour regarder derrière la haie du terrain annexe. « Dites-lui de revenir. Vous, il vous écoutera. »"
    textes:
      - "Le maître te montre un élève par la fenêtre : il sèche l'école les jours d'entraînement pour regarder derrière la haie du terrain annexe. « Dites-lui de revenir. Vous, il vous écoutera. »"
      - "« Un élève a écrit dans une rédaction que vous étiez {pg, select, f{sa mère} other{son père}}. Ce n'est pas vrai, je le sais. Je n'ai pas eu le courage de le corriger. »"
      - "Le maître est abonné en tribune ouest depuis vingt ans. Il juge ton équipe avec les mots du bulletin : « Peut mieux faire. Bavarde. Manque de régularité. »"
      - "Il parle d'un gamin de la classe dont le père a été licencié de l'entrepôt. Il ne vient plus avec son écharpe. « Donnez-en une à tout le monde. Comme ça, il en aura une aussi. »"
    tranches: 1
    jours: [lun, mar, jeu, ven]
    heures: [matin, aprem]

  - id: ecole_kermesse
    lieu: ecole
    habitude: famille
    objet: bureau_maitre
    roles: [entraineur, joueur, president, ds]
    si: "phase == bilan"
    label: "Tenir un stand de kermesse"
    texte: "Au chamboule-tout de la kermesse, les boîtes de conserve portent les visages de l'équipe rivale, découpés dans L'Écho. Tu tiens le stand ; les enfants visent plus fort que prévu."
    textes:
      - "Au chamboule-tout de la kermesse, les boîtes de conserve portent les visages de l'équipe rivale, découpés dans L'Écho. Tu tiens le stand ; les enfants visent plus fort que prévu."
      - "Tu achètes un carnet de tickets de tombola pour faire bonne figure, et tu gagnes le gros lot, un jambon, devant tout le monde. Tu le remets en jeu. On te soupçonne jusqu'au soir."
      - "Au stand des tirs au but, contre un gardien de CM2, tu rates exprès. Il le voit et ne te le pardonne pas. Il exige que tu recommences pour de vrai. Il arrête le deuxième."
      - "La fanfare de l'école joue l'air de la tribune nord, faux mais en entier. Les parents applaudissent ; un grand-père pleure en tenant son gobelet de mousseux à deux mains."
    tranches: 1
    francs: -50
    heures: [matin, aprem]
    jauges: {tribunes: 1}

  - id: ecole_jongles
    lieu: ecole
    habitude: sport
    objet: ballon
    label: "Jongler avec le ballon"
    texte: "Le ballon dégonflé du préau. Le maître sort une pompe de son tiroir et le regonfle à moitié ; les élèves comptent avec toi."
    jeu: jongles
    tranches: 0

  - id: ecole_ballon_neuf
    lieu: ecole
    habitude: largesse
    objet: ballon
    label: "Offrir un ballon neuf"
    texte: "Tu poses un ballon neuf sur le bureau du maître. Les élèves le regardent comme un objet sacré, sans y toucher. À la récréation, ils jouent encore avec le vieux, le dégonflé."
    textes:
      - "Tu poses un ballon neuf sur le bureau du maître. Les élèves le regardent comme un objet sacré, sans y toucher. À la récréation, ils jouent encore avec le vieux, le dégonflé."
      - "Le maître range le ballon neuf dans l'armoire, « pour les grandes occasions ». Tu demandes lesquelles. « Quand vous gagnerez. » Il ferme l'armoire à clé."
      - "Les CM1 signent le ballon neuf au feutre pour te remercier, chacun son prénom. Ils sont vingt-six. Il ne servira jamais : il ira sous verre, dans le hall, à côté des coupes de cross."
      - "Un élève demande s'il peut garder le vieux ballon, puisqu'il y en a un neuf. Le maître dit non. À la sortie, l'élève l'emporte sous son manteau. Tu ne dis rien."
    tranches: 0
    francs: -90
    jauges: {tribunes: 1}

  - id: ecole_portemanteaux
    lieu: ecole
    habitude: famille
    objet: portemanteaux
    label: "Regarder les portemanteaux"
    texte: "Au-dessus de chaque crochet, une étiquette et un prénom. À l'un d'eux pend une écharpe du club, trop longue pour un enfant ; elle traîne par terre comme une traîne de mariée."
    textes:
      - "Au-dessus de chaque crochet, une étiquette et un prénom. À l'un d'eux pend une écharpe du club, trop longue pour un enfant ; elle traîne par terre comme une traîne de mariée."
      - "Un anorak oublié depuis la rentrée, avec dans la poche une photo de toi découpée dans L'Écho, pliée, dépliée, repliée. Personne ne l'a réclamé ; le maître le garde pour quelqu'un."
      - "Deux crochets plus loin, l'écharpe de l'équipe rivale, bien en vue. Le maître dit que l'enfant l'accroche là exprès, chaque matin, pour voir qui osera la décrocher."
      - "Les portemanteaux sont à hauteur d'enfant. Tu y accroches ton manteau par réflexe, et tu dois te mettre à genoux pour le reprendre, sous le regard d'un élève qui attend sa mère."
    tranches: 0

  # ═══════════════════════════════════════════════════════════════ L'ÉGLISE SAINT-AUBIN
  # Toujours ouverte. La messe le dimanche matin (pleine, puis clairsemée), les
  # obsèques en semaine, la confession le mercredi et le samedi.
  - id: eglise_cierge
    lieu: eglise
    habitude: foi
    objet: cierges
    label: "Allumer un cierge"
    texte: "Tu glisses une pièce dans la fente et tu allumes ton cierge à la flamme d'un autre. Celui du club brûle déjà au premier rang, plus haut que les autres."
    textes:
      - "Tu glisses une pièce dans la fente et tu allumes ton cierge à la flamme d'un autre. Celui du club brûle déjà au premier rang, plus haut que les autres."
      - "Un cierge pour samedi. Tu te sens bête, puis non. À côté de toi, une vieille dame en allume trois : un par mi-temps, t'explique-t-elle, et un pour l'arbitre."
      - "La flamme vacille quand la porte s'ouvre. C'est le gardien du stade, en bleu de travail, qui vient faire comme toi. Vous ne vous saluez pas ; ici, ce serait déplacé."
      - "Tu allumes un cierge pour quelqu'un qui n'est pas mort, et tu te demandes si ça compte. Le curé passe, regarde la flamme, et dit que ça compte."
    tranches: 0
    francs: -5

  - id: eglise_messe
    lieu: eglise
    habitude: foi
    objet: autel
    si: "annee <= 2009"
    label: "Aller à la messe"
    texte: "La messe de dix heures. À la quête, le panier passe devant toi plus lentement que devant les autres. Tu mets un billet ; trois rangs derrière, on le commente."
    textes:
      - "La messe de dix heures. À la quête, le panier passe devant toi plus lentement que devant les autres. Tu mets un billet ; trois rangs derrière, on le commente."
      - "Le curé glisse le résultat de samedi dans son homélie, entre une parabole et l'annonce d'un baptême. Personne ne rit. Au mot « défaite », toute la nef se tourne vers toi."
      - "À la sortie, sur le parvis, on te serre la main plus qu'au curé. Une femme te dit qu'elle prie pour ton avant-centre. Tu ne sais pas si c'est pour son genou ou contre lui."
      - "La chorale chante faux, sauf un homme au deuxième rang, le capo de la tribune nord, qui chante juste et fort, les yeux fermés. Il ne te regarde pas une seule fois."
    tranches: 1
    francs: -10
    jours: [dim]
    heures: [matin]
    jauges: {tribunes: 1}

  - id: eglise_messe_tard
    lieu: eglise
    habitude: foi
    objet: autel
    si: "annee >= 2010"
    label: "Aller à la messe"
    texte: "Une vingtaine de fidèles dans la nef, dont trois enfants de chœur qui tenaient le chamboule-tout à la kermesse. Le curé dessert six villages ; il te salue d'un signe, ses clés déjà à la main."
    textes:
      - "Une vingtaine de fidèles dans la nef, dont trois enfants de chœur qui tenaient le chamboule-tout à la kermesse. Le curé dessert six villages ; il te salue d'un signe, ses clés déjà à la main."
      - "L'orgue est en panne depuis des années. Une enceinte posée sur une chaise joue l'enregistrement d'un orgue. Le curé s'en excuse avant l'entrée, comme on s'excuse d'un remplaçant."
      - "À la quête, le panier a maintenant un lecteur de carte. Une paroissienne en manteau du dimanche le regarde longtemps, puis pose une pièce à côté, avec dignité."
      - "Le curé lit les intentions de prière. Entre « pour les malades » et « pour les défunts de la paroisse », une intention « pour l'équipe ». Quelqu'un a donné pour celle-là aussi."
    tranches: 1
    francs: -10
    jours: [dim]
    heures: [matin]

  - id: eglise_bancs
    lieu: eglise
    habitude: foi
    objet: bancs
    label: "T'asseoir dans la nef"
    texte: "La nef est froide et vide. Tu t'assois au troisième banc. Au bout d'un moment, tu n'entends plus que le radiateur électrique et ta propre respiration, qui ralentit."
    textes:
      - "La nef est froide et vide. Tu t'assois au troisième banc. Au bout d'un moment, tu n'entends plus que le radiateur électrique et ta propre respiration, qui ralentit."
      - "Un vieil homme dort au dernier banc, une écharpe du club sur les genoux. Le sacristain passe sans le réveiller. « Il vient depuis que sa femme ne le reconnaît plus. Ici, on l'attend. »"
      - "Un vitrail pose une tache rouge sur ta main. Tu restes immobile jusqu'à ce qu'elle glisse sur le bois du banc. Il te fallait ça : une chose qui bouge sans toi."
      - "La chorale répète à mi-voix la même phrase, encore et encore. Au bout d'une heure, elle est juste. Tu te lèves au moment où le chant s'arrête."
    tranches: 1
    heures: [matin, midi, aprem, soir]

  - id: eglise_obseques
    lieu: eglise
    habitude: foi
    objet: bancs
    label: "Assister à des obsèques"
    texte: "On enterre un abonné de la tribune ouest, soixante saisons sans manquer un match. Sur le cercueil, sa dernière carte d'abonnement, avec le trou du poinçon."
    textes:
      - "On enterre un abonné de la tribune ouest, soixante saisons sans manquer un match. Sur le cercueil, sa dernière carte d'abonnement, avec le trou du poinçon."
      - "Les obsèques de l'ancien jardinier du stade. Ses fils ont posé sur le cercueil une motte de gazon de la Rive, découpée au carré. La terre tombe sur les dalles quand on le porte."
      - "Une jeune femme morte sur la nationale ; elle vendait les programmes le samedi. Tu ne te souvenais pas de son visage, seulement de sa voix qui criait le prix. La tribune nord est là."
      - "On enterre un arbitre de district, sifflé toute sa vie. Au premier rang, trois capitaines de clubs amateurs, en cravate. À la sortie, l'un d'eux dit : « Il ne s'est jamais trompé contre nous. »"
    tranches: 1
    jours: [mar, jeu]
    heures: [matin]
    jauges: {tribunes: 1}

  - id: eglise_confesse
    lieu: eglise
    habitude: foi
    objet: confessionnal
    label: "Te confesser"
    texte: "Derrière la grille, la voix du curé, lente. Tu parles de ce que tu n'as pas fait. Il attend. Tu parles de ce que tu as fait. Il demande s'il y a un rapport avec samedi."
    textes:
      - "Derrière la grille, la voix du curé, lente. Tu parles de ce que tu n'as pas fait. Il attend. Tu parles de ce que tu as fait. Il demande s'il y a un rapport avec samedi."
      - "Tu dis une chose que tu n'as dite à personne. Un long silence. Puis, à voix basse : « Vous l'avez dit à celui que ça concerne ? » Non. « Alors vous ne l'avez dit à personne. »"
      - "Le curé te donne pour pénitence d'aller voir quelqu'un que tu évites. Il ne dit pas qui. En sortant, tu fais la liste dans ta tête ; elle est plus longue que prévu."
      - "Dans la loge voisine, quelqu'un attend son tour et t'entend sûrement. Tu baisses la voix ; le curé aussi. À la fin, la porte d'à côté s'ouvre et se referme, sans que personne sorte."
    tranches: 1
    jours: [mer, sam]
    heures: [matin, aprem]

  - id: eglise_tronc
    lieu: eglise
    habitude: largesse
    objet: tronc
    label: "Glisser un billet au tronc"
    texte: "Le tronc des pauvres de la paroisse, en fer noir, cadenassé. Ton billet ne passe pas du premier coup. Tu le plies en deux, puis en quatre, et il tombe sans bruit."
    textes:
      - "Le tronc des pauvres de la paroisse, en fer noir, cadenassé. Ton billet ne passe pas du premier coup. Tu le plies en deux, puis en quatre, et il tombe sans bruit."
      - "Le sacristain te voit faire et inscrit quelque chose dans un carnet. « Pour la paroisse, je note les gestes, pas les sommes. » Il range le carnet dans sa poche de poitrine."
      - "Sous le tronc, une pancarte écrite à la main : « Pour le chauffage ». En dessous, d'une autre écriture : « Et pour le stade ? » Puis d'une troisième : « Le stade a sa quête. Le samedi. »"
      - "Ton billet tombe sur d'autres billets, et sur un papier plié. Tu ne le lis pas. Tu y penses tout l'après-midi."
    tranches: 0
    francs: -50

  - id: eglise_toiture
    lieu: eglise
    habitude: largesse
    objet: tronc
    roles: [president]
    label: "Payer la toiture"
    texte: "Le curé te montre le seau sous la fuite, dans le transept. Tu signes la promesse de don. Il demande si le club veut une plaque. Tu dis non ; il en fera une, petite, près du bénitier."
    textes:
      - "Le curé te montre le seau sous la fuite, dans le transept. Tu signes la promesse de don. Il demande si le club veut une plaque. Tu dis non ; il en fera une, petite, près du bénitier."
      - "« La toiture de Saint-Aubin coûtera moins cher que votre avant-centre, et elle tiendra plus longtemps. » Le curé encaisse ton don en souriant de sa propre phrase."
      - "Ton don est annoncé en chaire, dimanche, sans ton nom : « un généreux paroissien du stade ». Toute la nef sait qui. Le sacristain en parle comme d'un transfert."
      - "Le couvreur qui fera le travail est un ancien de la réserve. En montant à l'échelle, il te demande si tu cherches un arrière droit pour la saison prochaine. Il a cinquante ans."
    tranches: 0
    francs: -1500
    max_jour: 1
    jauges: {tribunes: 1}

  # ═══════════════════════════════════════════════════════════════ LE CINÉMA L'AURORE
  # Le soir seulement. La bobine et le projectionniste jusqu'en 2011, le numérique
  # ensuite ; le ciné-club le jeudi. Les films sont du monde du jeu, jamais d'ailleurs.
  - id: cinema_seance
    lieu: cinema
    habitude: culture
    objet: salle
    si: "annee <= 2011"
    label: "Voir le film"
    texte: "« Les Brumes de Castérac », un polar en noir et blanc. Le projecteur claque à chaque changement de bobine. Au fond de la salle, un couple ne regarde pas l'écran."
    textes:
      - "« Les Brumes de Castérac », un polar en noir et blanc. Le projecteur claque à chaque changement de bobine. Au fond de la salle, un couple ne regarde pas l'écran."
      - "Une comédie de l'été, en novembre. La salle rit à contretemps. Au troisième rang, un joueur du club rit avant les autres, comme s'il avait déjà vu le film."
      - "La pellicule casse au milieu du film. Lumière. Toute la salle te regarde, comme si c'était à toi de faire quelque chose. Le projectionniste répare en sifflant l'air de la tribune nord."
      - "« Un dimanche à Roquemont », trois heures, sous-titré. Tu t'endors à la deuxième. Tu te réveilles sur le générique, le projectionniste debout à côté de toi, une lampe de poche à la main."
    tranches: 1
    francs: -35

  - id: cinema_numerique
    lieu: cinema
    habitude: culture
    objet: salle
    si: "annee >= 2012"
    label: "Voir le film"
    texte: "Plus de projectionniste : la caissière lance le film depuis un ordinateur, dans la cabine, avant de redescendre vendre les bonbons. L'image est parfaite ; le son a un léger retard."
    textes:
      - "Plus de projectionniste : la caissière lance le film depuis un ordinateur, dans la cabine, avant de redescendre vendre les bonbons. L'image est parfaite ; le son a un léger retard."
      - "Un film d'action sur un écran trop petit pour lui. Des lycéens regardent leur téléphone pendant tout le début. À l'explosion, ils lèvent tous la tête en même temps."
      - "La séance du mardi : un film d'auteur venu de Valdorne, six spectateurs, dont toi. À la fin, la caissière demande à chacun ce qu'il en a pensé et note les réponses dans un cahier."
      - "Le documentaire restauré sur la finale de 1974, en couleur. À l'écran, la tribune nord de l'époque applaudit. Dans la salle, quelques anciens applaudissent avec elle, au même moment."
    tranches: 1
    francs: -35

  - id: cinema_cineclub
    lieu: cinema
    habitude: culture
    objet: salle
    label: "Présenter le film du jeudi"
    texte: "Le ciné-club passe un film sur un gardien de but qui vieillit. On te demande de le présenter. Tu dis trois phrases. Après la séance, le débat dure une heure, et ne parle que du club."
    textes:
      - "Le ciné-club passe un film sur un gardien de but qui vieillit. On te demande de le présenter. Tu dis trois phrases. Après la séance, le débat dure une heure, et ne parle que du club."
      - "La présidente du ciné-club te paie dans une enveloppe kraft, comme un indicateur. « C'est le cachet. Pas de quoi acheter un joueur, mais de quoi en inviter un à dîner. »"
      - "Tu présentes un vieux film sur une grève de mineurs, parce qu'il y a un match de football à la fin. Au générique, un ancien de l'usine se lève et sort sans un mot."
      - "Au débat, quelqu'un demande si le football est encore un sport populaire. Tu réponds oui. Il demande combien coûte une place en tribune. Le débat s'arrête là."
    tranches: 1
    francs: 300
    jours: [jeu]
    max_jour: 1

  - id: cinema_equipe
    lieu: cinema
    habitude: largesse
    objet: caisse
    roles: [entraineur, selectionneur, president]
    label: "Inviter le groupe au cinéma"
    texte: "Vingt places à la caisse, payées de ta poche. Dans le noir, les joueurs se tiennent comme des gamins en sortie scolaire. À la fin, le capitaine te remercie au nom de tous, très sérieusement."
    textes:
      - "Vingt places à la caisse, payées de ta poche. Dans le noir, les joueurs se tiennent comme des gamins en sortie scolaire. À la fin, le capitaine te remercie au nom de tous, très sérieusement."
      - "Ils choisissent un film de guerre. Pendant la charge finale, le plus jeune se cache les yeux ; les autres ne se moquent pas de lui. Ils s'en souviendront dans le car, plus tard."
      - "La caissière compte les billets en annonçant chaque nom à voix haute, comme une feuille de match. Elle en oublie un. Il y pense pendant tout le film."
      - "À l'entracte, les joueurs dévalisent la confiserie. Tu paies aussi les bonbons. Le préparateur physique te regarde faire, avec la tête de quelqu'un qui comptera les calories lundi."
    tranches: 1
    francs: -450
    max_jour: 1
    jauges: {vestiaire: 2}

  - id: cinema_gamin
    lieu: cinema
    habitude: largesse
    objet: caisse
    label: "Payer la place d'un gamin"
    texte: "Devant la caisse, un gamin compte ses pièces ; il lui en manque trois. Tu les poses sur le comptoir. Il entre sans dire merci, revient le dire, et repart en courant."
    textes:
      - "Devant la caisse, un gamin compte ses pièces ; il lui en manque trois. Tu les poses sur le comptoir. Il entre sans dire merci, revient le dire, et repart en courant."
      - "Deux sœurs n'ont qu'un billet pour deux. Tu en paies un second. La plus grande te demande si tu es quelqu'un de connu. Tu dis non. La caissière dit oui."
      - "Un gamin du centre de formation attend devant l'affiche sans entrer. Il dit qu'il n'aime pas ce film. Tu paies sa place ; il entre, et il l'aime."
      - "La caissière refuse ton argent pour le petit : « Il entre sans payer, sa mère fait le ménage de la salle. Il ne le sait pas. » Tu laisses les pièces. Elle les range dans une boîte à part."
    tranches: 0
    francs: -30

  - id: cinema_affiches
    lieu: cinema
    habitude: culture
    objet: affiches
    label: "Regarder les affiches"
    texte: "Cette semaine, « Les Brumes de Castérac ». La semaine prochaine, « Trois hivers à Nerville ». L'affiche du film d'avant pâlit dans la vitrine depuis l'été."
    textes:
      - "Cette semaine, « Les Brumes de Castérac ». La semaine prochaine, « Trois hivers à Nerville ». L'affiche du film d'avant pâlit dans la vitrine depuis l'été."
      - "Sur l'affiche, une actrice regarde au loin, vers la Rive. Quelqu'un a collé dans le coin un autocollant de la tribune nord. La caissière dit qu'elle l'enlèvera après le derby."
      - "Dans le hall, une vieille affiche encadrée : un film tourné à Aubérive en 1962, l'équipe de l'époque en figurants dans la scène du bal. On reconnaît le gardien ; il ne savait pas danser."
      - "Le bas de l'affiche est déchiré, là où était le prix. Le nouveau prix est collé par-dessus, écrit au feutre, plus grand que le titre."
    tranches: 0

  - id: cinema_confiserie
    lieu: cinema
    habitude: culture
    objet: confiserie
    label: "Un cornet de bonbons"
    texte: "La caissière sert les bonbons au poids, à la pelle, dans un cornet de papier. Après la pesée, elle en rajoute toujours trois sans les compter, pour tout le monde."
    textes:
      - "La caissière sert les bonbons au poids, à la pelle, dans un cornet de papier. Après la pesée, elle en rajoute toujours trois sans les compter, pour tout le monde."
      - "Une glace achetée à la confiserie. La vendeuse te reconnaît et te rend la monnaie en disant : « Celle-là, vous l'avez méritée. » Tu ne sais pas pour quoi."
      - "La machine à pop-corn fait un bruit d'averse sur un toit. Tu en prends un petit ; il en reste au fond quand le film finit, et un gamin te demande s'il peut terminer."
      - "Les bonbons préférés du club sont ceux en forme de crocodile, d'après la caissière : les joueurs en achètent avant chaque déplacement. Ce soir, le bocal est vide."
    tranches: 0
    francs: -12

  # ════════════════════════════════════════════════════════════ LA LIBRAIRIE-PAPETERIE
  # Le matin et l'après-midi, ruelle des Tanneurs. Les dédicaces du mardi, le livre de
  # l'ancien capitaine près de la caisse, la pellicule puis la borne à photos.
  - id: librairie_dedicaces
    lieu: librairie
    habitude: culture
    objet: comptoir
    roles: [entraineur, joueur, selectionneur]
    label: "Une séance de dédicaces"
    texte: "L'album de la saison, ta photo en page quatre. Tu signes pour une file de vingt personnes, dont un monsieur qui en prend six « pour les petits-enfants, qui ne lisent pas »."
    textes:
      - "L'album de la saison, ta photo en page quatre. Tu signes pour une file de vingt personnes, dont un monsieur qui en prend six « pour les petits-enfants, qui ne lisent pas »."
      - "La libraire t'installe au comptoir avec un feutre et un verre d'eau. Pendant une heure, personne. Puis un car de retraités s'arrête, et tu signes quarante calendriers du club."
      - "Un homme te demande de dédicacer l'album « à mon fils, qui ne viendra plus au stade ». Tu demandes pourquoi. Il dit que ça ne te regarde pas, et te remercie pour la dédicace."
      - "La libraire te paie ta part des ventes de l'après-midi, en liquide, billet par billet. « Les dédicaces des défaites se vendent mieux. Les gens veulent un souvenir de quelque chose. »"
    tranches: 1
    francs: 350
    jours: [mar]
    heures: [aprem]
    max_jour: 1

  - id: librairie_carnet
    lieu: librairie
    habitude: culture
    objet: comptoir
    label: "Acheter un carnet"
    texte: "Un carnet à spirale, petits carreaux, couverture noire. La libraire demande si c'est pour les comptes ou pour les noms. Tu dis les noms. Elle t'en vend un second, « pour les comptes »."
    textes:
      - "Un carnet à spirale, petits carreaux, couverture noire. La libraire demande si c'est pour les comptes ou pour les noms. Tu dis les noms. Elle t'en vend un second, « pour les comptes »."
      - "Tu choisis un carnet qui tient dans la poche intérieure. La libraire dit que ton prédécesseur prenait le même, et qu'il en remplissait un par mois. « Il écrivait gros. »"
      - "Un carnet relié de toile. Tu y écris la date sur la première page, et rien d'autre. Le reste viendra, ou ne viendra pas."
      - "La libraire te vend le carnet avec une gomme. « Pour les compositions d'équipe. Vous les écrivez au crayon, j'espère ? » Elle a vu des entraîneurs les écrire au stylo, et partir."
    tranches: 0
    francs: -15

  - id: librairie_livre
    lieu: librairie
    habitude: culture
    objet: rayons
    label: "Acheter un livre"
    texte: "Un roman policier qui se passe à Portclair, avec un commissaire qui ne dort jamais. La libraire dit qu'il se lit en une nuit. Tu le sais : c'est bien ce qui t'inquiète."
    textes:
      - "Un roman policier qui se passe à Portclair, avec un commissaire qui ne dort jamais. La libraire dit qu'il se lit en une nuit. Tu le sais : c'est bien ce qui t'inquiète."
      - "Un livre de tactique traduit d'une langue que tu ne lis pas, plein de schémas fléchés. La libraire l'avait commandé pour toi sans qu'on le lui demande. Elle était sûre que tu le voulais."
      - "Un dictionnaire bilingue pour une recrue qui ne parle pas encore la langue. La libraire glisse dedans un marque-page où elle a écrit à la main les mots du football."
      - "Un recueil de poèmes d'un auteur de Valdorne, qui a écrit sur le stade de la Rive en 1951. La libraire t'en lit le premier vers au comptoir. Il est meilleur que l'équipe de 1951."
    tranches: 0
    francs: -90

  - id: librairie_carte
    lieu: librairie
    habitude: culture
    objet: cartes_postales
    label: "Envoyer une carte postale"
    texte: "Une carte du pont de la Rive au coucher du soleil, coloriée à la main dans les années soixante. Tu l'envoies à ta mère, avec la date et rien d'autre. Elle comprendra."
    textes:
      - "Une carte du pont de la Rive au coucher du soleil, coloriée à la main dans les années soixante. Tu l'envoies à ta mère, avec la date et rien d'autre. Elle comprendra."
      - "La carte du stade de la Rive vu du ciel, avec une tribune qui n'existe plus. Tu l'envoies à un ancien qui y a joué. Tu écris : « Ils l'ont démolie. » Il le sait déjà."
      - "« Aubérive, sa Rive, son stade. » Tu l'envoies à quelqu'un de Valdorne, pour l'agacer. La libraire te vend le timbre et dit que ça marche à tous les coups."
      - "Tu écris une carte, et tu la gardes : tu ne sais pas à qui l'envoyer. La libraire la range dans un tiroir avec ton nom dessus, « pour quand vous saurez »."
    tranches: 0
    francs: -8

  - id: librairie_feuilleter
    lieu: librairie
    habitude: culture
    objet: livre_joueur
    label: "Feuilleter le livre"
    texte: "Le livre de l'ancien capitaine, en pile près de la caisse : « Mes années Rive ». Le chapitre sur la finale de 1974 fait quarante pages ; celui sur son départ du club, deux."
    textes:
      - "Le livre de l'ancien capitaine, en pile près de la caisse : « Mes années Rive ». Le chapitre sur la finale de 1974 fait quarante pages ; celui sur son départ du club, deux."
      - "Il y raconte un vestiaire de 1971, la veille d'un derby : qui a parlé, qui s'est tu. Les noms sont changés. Les numéros, non."
      - "La libraire te montre la dédicace du premier exemplaire : « À ceux qui viendront après et qui croiront avoir inventé quelque chose. » Elle le prête ; elle ne le vend pas."
      - "Tu lis une page au hasard. Il y décrit un entraîneur pareil à tous les autres, sauf un détail : il saluait le gardien du stade avant le président. Tu refermes le livre."
    tranches: 0

  - id: librairie_pellicule
    lieu: librairie
    habitude: culture
    objet: tiroir
    si: "annee <= 2007"
    label: "Développer une pellicule"
    texte: "Tu déposes ta pellicule dans le tiroir, ton nom sur l'enveloppe. Les photos reviennent : la mer, un anniversaire, et une photo du vestiaire que tu ne te souviens pas d'avoir prise."
    textes:
      - "Tu déposes ta pellicule dans le tiroir, ton nom sur l'enveloppe. Les photos reviennent : la mer, un anniversaire, et une photo du vestiaire que tu ne te souviens pas d'avoir prise."
      - "La libraire te rend tes tirages en les regardant un par un, sans gêne. Sur l'un, l'entraîneur adjoint dort dans le car, la bouche ouverte. « Celle-là, gardez-la pour une négociation. »"
      - "Les photos de la fête de fin de saison sont floues, toutes, sauf une : deux joueurs qui se disputent dans un coin, nets comme sur un constat. La libraire te la tend face cachée."
      - "Le tiroir déborde d'enveloppes jamais réclamées, certaines depuis 1979. La libraire ne jette rien. « Un jour, quelqu'un revient. Ou quelqu'un meurt, et la famille revient. »"
    tranches: 0
    francs: -60

  - id: librairie_tirages
    lieu: librairie
    habitude: culture
    objet: tiroir
    si: "annee >= 2008"
    label: "Faire tirer des photos"
    texte: "La libraire branche ton téléphone sur une borne qui imprime les photos en trente secondes. Plus personne ne fait tirer les siennes, dit-elle, sauf ceux qui ont peur de les perdre."
    textes:
      - "La libraire branche ton téléphone sur une borne qui imprime les photos en trente secondes. Plus personne ne fait tirer les siennes, dit-elle, sauf ceux qui ont peur de les perdre."
      - "Tu fais tirer une seule photo, le vestiaire après la victoire. La borne la sort plus jaune que sur l'écran. La libraire dit que c'est mieux : « Ça fait vrai. »"
      - "Sous la borne, l'ancien tiroir des pellicules, plein d'enveloppes jamais réclamées. La libraire t'en montre une, avec un nom de joueur dessus. « Je n'ose pas l'ouvrir. »"
      - "Tu fais imprimer une photo à glisser dans ton portefeuille. La borne demande si tu veux « améliorer le visage ». Tu dis non, deux fois."
    tranches: 0
    francs: -40

  # ══════════════════════════════════════════════════════════════════════ LA LAVERIE
  # Du matin au soir (les maillots du club : ville.yaml). Cinq machines, trois qui
  # tournent, un néon qui clignote : on y attend, et on y entend.
  - id: laverie_machine
    lieu: laverie
    habitude: quartier
    objet: machines
    label: "Faire une machine"
    texte: "Ta machine tourne à côté d'une autre, pleine de maillots de la réserve. Le hublot fait défiler les numéros dans la mousse : 4, 11, 4 encore, 7. Tu les regardes comme un tirage du loto."
    textes:
      - "Ta machine tourne à côté d'une autre, pleine de maillots de la réserve. Le hublot fait défiler les numéros dans la mousse : 4, 11, 4 encore, 7. Tu les regardes comme un tirage du loto."
      - "La machine 3 avale ta pièce et ne démarre pas. Une habituée donne un coup sec sur le couvercle, à un endroit précis, sans lever les yeux de son magazine. La machine démarre."
      - "Tu laves une chemise blanche qui sent la loge et le cigare d'un autre. Une femme près de la vitrine suit ta main sur la boîte de lessive et dit que tu en mets trop. Elle a raison."
      - "Pendant le cycle, une étudiante révise son droit à mi-voix sur la chaise d'à côté. Au bout d'un moment, tu connais les conditions d'un contrat valable. Tu en vérifies un, de tête."
    tranches: 1
    francs: -20

  - id: laverie_sechoir
    lieu: laverie
    habitude: quartier
    objet: sechoirs
    label: "Lancer un séchoir"
    texte: "Le séchoir tourne avec un bruit de car sur une route de campagne. Tu poses la main sur la vitre chaude. Sous le néon qui clignote, ton linge monte et retombe comme des pigeons."
    textes:
      - "Le séchoir tourne avec un bruit de car sur une route de campagne. Tu poses la main sur la vitre chaude. Sous le néon qui clignote, ton linge monte et retombe comme des pigeons."
      - "Dans le séchoir voisin tourne un seul maillot, un numéro 10 d'une autre époque, en laine. Son propriétaire, un vieil homme, le surveille, les mains sur les genoux, comme au chevet de quelqu'un."
      - "Le séchoir s'arrête avant que ton linge soit sec. Tu remets une pièce. Une gamine qui fait ses devoirs sur la table de pliage te dit qu'il en faut toujours deux, et que tout le monde le sait."
      - "Il ne reste que toi et un chauffeur de car qui fait sécher son uniforme. Il a conduit l'équipe adverse ce matin. « Ils dormaient tous. Sauf leur gardien. »"
    tranches: 0
    francs: -10

  - id: laverie_monnayeur
    lieu: laverie
    habitude: quartier
    objet: monnayeur
    label: "Faire de la monnaie"
    texte: "Le monnayeur avale ton billet, réfléchit longtemps, et rend une cascade de pièces dans un bruit de machine à sous. La femme qui attend son séchage te regarde comme si tu avais gagné quelque chose."
    textes:
      - "Le monnayeur avale ton billet, réfléchit longtemps, et rend une cascade de pièces dans un bruit de machine à sous. La femme qui attend son séchage te regarde comme si tu avais gagné quelque chose."
      - "Le monnayeur refuse trois fois ton billet, trop froissé. Un homme te l'échange contre des pièces, en le lissant entre ses doigts. « Il ne prend que les billets propres. Comme la banque. »"
      - "Sur le monnayeur, un autocollant : « En panne, demandez au café d'en face. » Le café d'en face a fermé l'an dernier. Le monnayeur, lui, marche."
      - "Quelqu'un a écrit au marqueur, sur le flanc du monnayeur, le score d'un derby, une date, et « on n'oublie pas ». La date est d'avant ta naissance."
    tranches: 0

  - id: laverie_annonces
    lieu: laverie
    habitude: quartier
    objet: annonces
    label: "Lire les petites annonces"
    texte: "« Vends crampons pointure 43, portés une fois (blessure). » « Donne chatons. » « Cherche joueurs pour le jeudi soir, niveau bas, ambiance haute. » Tu notes le dernier numéro sans savoir pourquoi."
    textes:
      - "« Vends crampons pointure 43, portés une fois (blessure). » « Donne chatons. » « Cherche joueurs pour le jeudi soir, niveau bas, ambiance haute. » Tu notes le dernier numéro sans savoir pourquoi."
      - "Une annonce en capitales : « CHERCHE TÉMOIN ACCIDENT SAMEDI 17 H, PARKING DU STADE, VOITURE GRISE. » Quelqu'un a déjà arraché trois languettes du numéro."
      - "« Étudiante donne cours de maths, tous niveaux, adultes compris. » En dessous, d'une autre écriture : « Même les présidents de club ? » Toutes les languettes ont été arrachées."
      - "« Perdu écharpe du club, tricotée main, valeur sentimentale. Récompense. » Le numéro est celui de la buvette. L'écharpe pend juste au-dessus, à un clou, depuis une semaine."
    tranches: 0

  - id: laverie_pliage
    lieu: laverie
    habitude: quartier
    objet: pliage
    label: "Plier ton linge"
    texte: "À côté de toi, une femme plie des chemises d'homme avec un soin particulier, une à une. Elle te dit qu'elle les donne à la paroisse demain. Il est mort en mars."
    textes:
      - "À côté de toi, une femme plie des chemises d'homme avec un soin particulier, une à une. Elle te dit qu'elle les donne à la paroisse demain. Il est mort en mars."
      - "La table de pliage est occupée par un gamin qui fait ses devoirs. Il te laisse un coin. Tu plies tes chaussettes pendant qu'il récite la table de sept."
      - "L'intendant du club plie les shorts de l'équipe en carrés parfaits et te montre comment faire. « Trois fois, pas quatre. Quatre, ça marque, et la marque, on la voit à la télé. »"
      - "Une paire de chaussettes ne t'appartient pas : elle est aux couleurs du club rival. Tu la poses au milieu de la table. À ton retour, quelqu'un l'a pliée avec les tiennes."
    tranches: 0
