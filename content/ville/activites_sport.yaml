    habitude: travail
    objet: devoirs
    label: "Aider aux devoirs"
    tranches: 1
    texte: "Des fractions, et un gamin de quatorze ans qui compte sur ses doigts sous la table. Tu expliques avec un terrain : un quart, c'est la moitié d'une moitié."
    textes:
      - "Des fractions, et un gamin de quatorze ans qui compte sur ses doigts sous la table. Tu expliques avec un terrain : un quart, c'est la moitié d'une moitié."
      - "Une rédaction à rendre : « Mon héros ». Le gamin a écrit trois lignes sur toi, puis les a barrées pour écrire sur son grand-père. C'est mieux."
      - "La table des devoirs, une lampe qui clignote, des cartables ouverts. Un gamin récite sa leçon de géographie en jonglant avec une gomme."
      - "Une dictée sur les saisons. Tu dictes lentement ; au mot « automne », le gamin lève la tête : « C'est quand on redescend ? »"

  # ════════════════════════════════════════ la salle de muscu (le garage Mazurier)
  # (le banc porte aussi `fonte` : ville.yaml)
  - id: muscu_parer
    lieu: muscu
    habitude: sport
    objet: banc
    label: "Parer quelqu'un"
    tranches: 0
    texte: "Un gars du quartier te fait signe de venir derrière la barre. Tu poses les mains dessous sans la toucher. À la huitième, tu la touches."
    textes:
      - "Un gars du quartier te fait signe de venir derrière la barre. Tu poses les mains dessous sans la toucher. À la huitième, tu la touches."
      - "Le préparateur charge la barre pour un défenseur et te demande de parer. Le défenseur grimace, pousse, serre les dents ; toi aussi."
      - "Tu pares un vieux du quartier qui soulève plus que toi, en silence, depuis trente ans. Il se relève, tapote la barre : « Elle est fidèle. »"
      - "Le banc colle de sueur. Tu passes la serviette avant de te placer derrière ; le gars allongé rit : « Toi, t'as des manières. »"

  - id: muscu_halteres
    lieu: muscu
    habitude: sport
    objet: halteres
    label: "Une série d'haltères"
    tranches: 1
    francs: -10
    texte: "Les haltères sont rangés du plus léger au plus lourd, sauf la paire de douze, toujours ailleurs. Tu fais tes séries avec la paire de dix."
    textes:
      - "Les haltères sont rangés du plus léger au plus lourd, sauf la paire de douze, toujours ailleurs. Tu fais tes séries avec la paire de dix."
      - "Curl, rowing, épaules. Dans le miroir, un gamin te copie geste pour geste, en plus léger, sans savoir que tu le vois."
      - "Les haltères de rééducation, peints en jaune. Tu fais tes rotations d'épaule à côté d'une dame de soixante-dix ans qui en fait plus que toi."
      - "Le patron de la salle a soudé lui-même les haltères de vingt-cinq, avec des disques de camion. Ils ne sont pas droits ; ils sont lourds."

  - id: muscu_sac
    lieu: muscu
    habitude: sport
    objet: sac
    label: "Taper dans le sac"
    tranches: 1
    francs: -10
    texte: "Le sac de frappe pend à une chaîne de garage, rapiécé au ruban isolant. Tu frappes jusqu'à ne plus penser à samedi. Ça prend vingt minutes."
    textes:
      - "Le sac de frappe pend à une chaîne de garage, rapiécé au ruban isolant. Tu frappes jusqu'à ne plus penser à samedi. Ça prend vingt minutes."
      - "Tu frappes sans gants ; la peau des jointures s'ouvre à la troisième série. Le patron te lance des bandes de l'autre bout de la salle."
      - "Un ancien boxeur te corrige la garde, deux doigts sur ton coude. « Tu frappes avec la colère. La colère, ça fatigue. Frappe avec les pieds. »"
      - "Le sac revient sur toi à chaque coup, comme une marée. Tu t'arrêtes quand il ne bouge plus, et toi non plus."

  - id: muscu_tapis
    lieu: muscu
    habitude: sport
    objet: tapis
    label: "Courir sur le tapis"
    tranches: 1
    francs: -10
    texte: "Le tapis de course vient d'une clinique de Montelvane ; il a gardé son étiquette d'inventaire. Tu cours quarante minutes face au mur de parpaings."
    textes:
      - "Le tapis de course vient d'une clinique de Montelvane ; il a gardé son étiquette d'inventaire. Tu cours quarante minutes face au mur de parpaings."
      - "Tu cours en regardant la rue par la vitre sale de l'ancien garage. Un bus passe deux fois ; entre les deux, cinq kilomètres."
      - "Le tapis grince à chaque foulée gauche. Le patron dit que c'est le tapis ; le Doc, l'autre jour, a dit que c'était ton genou."
      - "Le compteur s'arrête à neuf kilomètres et revient à zéro. Tu continues sans savoir combien, ce qui est la seule façon de courir longtemps."

  - id: muscu_radio
    lieu: muscu
    habitude: sport
    objet: radio
    label: "Changer de station"
    tranches: 0
    texte: "La radio crache les infos régionales entre deux grésillements. Tu tournes le bouton ; toute la salle proteste, alors tu le remets."
    textes:
      - "La radio crache les infos régionales entre deux grésillements. Tu tournes le bouton ; toute la salle proteste, alors tu le remets."
      - "Une chanson de ta jeunesse. Tu ne la chantes pas. Le gars du banc d'à côté la chante, faux, et soulève mieux."
      - "La radio locale parle du club. Le patron monte le son et te regarde dans le miroir, pour voir ta tête."
      - "Le bouton du volume est cassé ; on règle le son à la pince. Aujourd'hui, la pince a disparu, et la salle s'entraîne au son des publicités."

  - id: muscu_miroir
    lieu: muscu
    habitude: sport
    objet: miroir
    label: "Se regarder dans le miroir"
    tranches: 0
    texte: "Le miroir de la salle est taché de chaux. Tu y vois un corps qui a ton âge, ce qui n'arrive pas tous les jours."
    textes:
      - "Le miroir de la salle est taché de chaux. Tu y vois un corps qui a ton âge, ce qui n'arrive pas tous les jours."
      - "Tu regardes la vieille cicatrice au-dessus du sourcil, de profil, comme celle d'un autre. Elle a blanchi. Le reste, pas encore."
      - "Un gamin s'admire dans le miroir entre deux séries, de face, de dos. Il te voit le voir, rougit, et refait une série pour se donner une contenance."
      - "Dans le miroir, derrière toi, la porte s'ouvre : un photographe de L'Écho prend la salle en photo, puis toi, sans le dire."

  # ═══════════════════════════════════════════════════════ la boutique du club
  # (la caisse porte aussi `dedicaces` : ville.yaml)
