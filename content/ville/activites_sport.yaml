    heures: [matin, aprem]
    tranches: 1
    texte: "Tu tires sur le lanceur. La tondeuse tousse, crache une fumée bleue et se tait. L'intendant : « Elle fait ça depuis le printemps. Elle boude. »"
    textes:
      - "Tu tires sur le lanceur. La tondeuse tousse, crache une fumée bleue et se tait. L'intendant : « Elle fait ça depuis le printemps. Elle boude. »"
      - "Bougie, filtre, essence fraîche. Tu démontes la tondeuse sur un carton, pièce par pièce. Au remontage, il te reste une vis ; elle démarre mieux qu'avant."
