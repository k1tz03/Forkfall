    textes:
      - "Le maillot de la finale de 1974 sous verre, la boue encore sur le numéro. Un ancien te dit qu'il était à la buvette, ce jour-là, et qu'il a tout entendu."
      - "Le col est déchiré à gauche, là où l'arrière adverse l'a tenu sur le dernier corner. On l'a encadré déchiré : c'est ce qui le rend vrai."
      - "Un père soulève son fils devant la vitrine. « C'est le maillot. » Le gamin demande s'ils ont gagné. Le père met du temps à répondre."
      - "Ton visage se pose dans le reflet, sur le numéro 5. La vendeuse dépoussière le cadre tous les mercredis, avec un plumeau plus vieux qu'elle."

  - id: boutique_vitrine_vide
