    textes:
      - "Ton nom en lettres d'un mètre, et un mot à côté. Un pot de blanc, un rouleau : le soir, le mot a disparu, et ton nom est resté, plus propre."
      - "Tu repeins le mur au rouleau. Un gamin te regarde faire, puis te montre un endroit que tu as oublié, plus bas, écrit plus petit."
      - "Le blanc ne couvre pas le noir : il faut trois couches. À la deuxième, quelqu'un te prend en photo depuis l'entrée de la halle."
      - "Tu recouvres l'insulte. Le lendemain, elle est réécrite à côté, plus haut, avec ta peinture, qu'on t'a empruntée dans la nuit."

  # ═══════════════════════════════════════════════════════ le wagon abandonné
  - id: wagon_matelas
