# CE QU'ON FAIT DANS LES PIÈCES DU SPORT — la buvette, l'appartement, le club-house,
# le vestiaire, le centre, la salle de muscu, la boutique, Brunel, le garage du Pont,
# la loge du gardien, la grande halle, le wagon, le caveau, le local du matériel, la
# gare routière. Le porteur du projet : « les phases sans histoires sont trop vides ;
# dans Punch Club, il y a plein de choses à faire partout ».
#
# Le format : docs/histoires/scenes_jouees.md § 5 ; les limites : build_content
# (`_compileVille`). La charte d'écriture (docs/bible/charte_histoire.md) fait loi :
# un lieu, un geste, quelqu'un, une phrase entendue ; aucun nom réel.
#
# Ce qu'il faut savoir avant d'ajouter une ligne :
# - `objet` : un id de la pièce (packages/tools/web/interieurs/interieurs.json).
# - `texte` reprend la première variante ; la ville tire les `textes` tour à tour.
#   Pour un jeu (`jeu:`) et pour les gestes `telephone` et `dormir`, la ville montre
#   la phrase du jeu ou son propre écran : la variante sert d'entrée en scène.
# - Sans `si`, une variante tient de 1990 à 2050, pour tous les rôles, à toute heure
#   de ses `heures`. Le héros peut être une femme : aucun accord sur lui ou elle.
#   Pas de somme dans les textes (la ville convertit : francs, inflation, écus).
# - Les petits boulots (`francs` positif, une tranche, une fois par jour) : pour le
#   joueur des divisions du bas (`division >= 2`), et pour tout le monde quand le
#   compte est vide (`francs < 0`, ou bas : `francs < 2000`). Une vedette ne passe
#   pas la serpillière ; quelqu'un qui doit de l'argent à la banque, si.
# - `jauges` : ±1 (le plombier du président : +2), une fois par semaine ; pour un
#   jeu, seulement s'il est gagné.
activites:

  # ═══════════════════════════════════════════════════════════ la buvette du kop
  # (le zinc porte aussi `tournee`, `verre_kop` et `buvette_president` : ville.yaml)
  - id: buvette_421
    lieu: buvette
    habitude: jeu
    objet: comptoir
    label: "Un 421 sur le zinc"
    jeu: des
    tranches: 0
    francs: -10
    max_jour: 3
    texte: "Le patron sort la piste de feutre de sous la caisse. Trois dés, une mise sous le cendrier, et la moitié du comptoir qui se penche pour voir."
    textes:
      - "Le patron sort la piste de feutre de sous la caisse. Trois dés, une mise sous le cendrier, et la moitié du comptoir qui se penche pour voir."
      - "Le capo pose sa mise à côté de la tienne et souffle dans ses mains. « Un 421, pour savoir si la chance tourne avant samedi. »"
      - "La piste de feutre est usée au milieu, là où les dés retombent depuis trente ans. Le patron note les mises à la craie, au dos de l'ardoise."

  - id: buvette_coup_de_main
    lieu: buvette
    habitude: quartier
    objet: comptoir
    label: "Un coup de main au zinc"
    roles: [joueur]
    si: "division >= 2"
    heures: [soir]
    jours: [lun, mar, mer, jeu, ven, dim]
    tranches: 1
    francs: 120
    max_jour: 1
    jauges: {tribunes: 1, direction: -1}
    texte: "Le patron te jette un torchon : les verres du loto, quatre caisses. Tu essuies jusqu'à la fermeture ; il te paie en liquide, plié en quatre, sans compter devant toi."
    textes:
      - "Le patron te jette un torchon : les verres du loto, quatre caisses. Tu essuies jusqu'à la fermeture ; il te paie en liquide, plié en quatre, sans compter devant toi."
      - "Tu tiens la tireuse pendant que le patron monte au local. Un supporter te reconnaît, hésite, et commande sans dire ton nom."
      - "Réunion de la Nord dans la salle du fond. Tu remplis les pichets ; au troisième, on te fait signe de les poser et de sortir."
      - "Tu ranges les fûts vides dans la cour. Le patron compte ta paie sur le zinc, ajoute un billet : « Pour les mollets. Pas pour le comptoir. »"

  - id: buvette_plonge
    lieu: buvette
    habitude: quartier
    objet: comptoir
    label: "Faire la plonge"
    si: "francs < 0"
    heures: [soir]
    tranches: 1
    francs: 100
    max_jour: 1
    texte: "Le patron ne demande rien. Il pousse vers toi un tablier et un bac d'eau grise. À la fermeture, les billets sont sous le tablier, pliés."
    textes:
      - "Le patron ne demande rien. Il pousse vers toi un tablier et un bac d'eau grise. À la fermeture, les billets sont sous le tablier, pliés."
      - "Des verres, des chopes, les assiettes des merguez. Derrière la porte de la plonge, personne ne te voit ; c'est le seul service qu'on te rend."
      - "Un habitué passe la tête par la porte de la plonge, te reconnaît et ressort sans commander. Le patron hausse les épaules et te paie, sans rien retenir."
      - "Tu laves jusqu'à la fermeture. Le patron compte sa caisse, puis ta paie, à part, dans une enveloppe de la banque : « On ne mélange pas. »"

  - id: buvette_tele
    lieu: buvette
    habitude: comptoir
    objet: tele
    label: "Les résultats à la télé"
    special: tele
    tranches: 0
    texte: "La télé est accrochée au-dessus des écharpes, le son coupé. Le patron monte le volume pour les résultats ; tout le comptoir se tourne en même temps."
    textes:
      - "La télé est accrochée au-dessus des écharpes, le son coupé. Le patron monte le volume pour les résultats ; tout le comptoir se tourne en même temps."
      - "Quelqu'un réclame le silence en tapant sur un verre avec une cuillère. Sous la télé, les conversations meurent une à une."
      - "Le patron change de chaîne du bout d'un manche à balai. Au comptoir, on siffle chaque fois qu'il passe sur un autre sport."

  - id: buvette_tele_match
    lieu: buvette
    habitude: comptoir
    objet: tele
    label: "Un match à la télé"
    heures: [soir]
    tranches: 1
    francs: -12
    texte: "Une demi-pression, le match du soir sur la télé du coin. On commente les tribunes plus que le jeu, et les coiffures des joueurs plus que les tribunes."
    textes:
      - "Une demi-pression, le match du soir sur la télé du coin. On commente les tribunes plus que le jeu, et les coiffures des joueurs plus que les tribunes."
      - "Tu regardes un match qui ne te concerne pas, pour une fois. Au bout du zinc, un ancien explique le hors-jeu à son petit-fils avec deux allumettes."
      - "Le patron a tiré les rideaux contre le reflet. Dans la pénombre, vingt visages bleuis par l'écran, et pas un mot avant la mi-temps."
      - "À la mi-temps, le patron coupe le son et passe le disque des chants de la Nord. Personne ne regarde plus l'écran jusqu'à la reprise."
      - "Le match de la capitale. Quand leur avant-centre rate le cadre, la buvette applaudit plus fort que pour un but de chez nous."

  - id: buvette_ardoise
    lieu: buvette
    habitude: largesse
    objet: ardoise
    label: "Effacer une ardoise"
    tranches: 0
    francs: -60
    max_jour: 1
    jauges: {tribunes: 1}
    texte: "Tu montres une ligne au patron : un prénom, une somme, trois semaines. Il l'efface du pouce. L'ancien, au bout du zinc, ne saura pas qui."
    textes:
      - "Tu montres une ligne au patron : un prénom, une somme, trois semaines. Il l'efface du pouce. L'ancien, au bout du zinc, ne saura pas qui."
      - "Le patron hésite, la craie en l'air : « Il va le prendre mal, s'il sait. » Il efface quand même, et trace à la place un petit trait."
      - "À droite des matchs, l'ardoise des comptes : des prénoms et des sommes. Tu paies celle d'un chômeur ; le patron range les billets à part, dans la boîte à cigares."
      - "Tu paies la ligne d'un gamin de la Nord. Le lendemain, il t'attend à la sortie, furieux : « Mes verres, je les paie moi-même. »"

  - id: buvette_cible
    lieu: buvette
    habitude: comptoir
    objet: flechettes
    label: "Une partie de cible"
    jeu: flechettes
    tranches: 0
    francs: -5
    max_jour: 3
    texte: "La cible est au fond, sous l'écharpe de soixante et onze. Trois fléchettes aux plumes rognées ; on tire derrière une ligne de ruban adhésif."
    textes:
      - "La cible est au fond, sous l'écharpe de soixante et onze. Trois fléchettes aux plumes rognées ; on tire derrière une ligne de ruban adhésif."
      - "Le meilleur tireur de la Nord te tend ses fléchettes, celles qu'il ne prête jamais. « Fais pas le malin. Vise le milieu. »"
      - "L'enjeu va dans la boîte à cigares : la caisse de la banderole. Le capo tient le compte à la craie, sur le bord de l'ardoise."

  - id: buvette_babyfoot
    lieu: buvette
    habitude: comptoir
    objet: babyfoot
    label: "Un baby-foot"
    jeu: babyfoot
    tranches: 0
    francs: -2
    max_jour: 3
    texte: "Deux supporters te font signe : il leur manque un goal. Le baby-foot penche vers la porte ; tout le monde le sait, et on joue avec."
    textes:
      - "Deux supporters te font signe : il leur manque un goal. Le baby-foot penche vers la porte ; tout le monde le sait, et on joue avec."
      - "Les poignées collent, la balle de liège est fendue. Le gamin d'en face fait des pissettes, ce qui est interdit, et rit quand tu le dis."
      - "La revanche. Le perdant de la dernière fois a collé un sous-bock sous la barre de son gardien, avec son propre nom dessus, pour ne pas oublier."

  - id: buvette_flipper
    lieu: buvette
    habitude: comptoir
    objet: flipper
    label: "Une partie de flipper"
    jeu: flipper
    tranches: 0
    francs: -5
    max_jour: 3
    texte: "Le flipper du fond clignote pour lui-même. Une bande du plateau est réparée au sparadrap ; le patron jure qu'elle rebondit mieux comme ça."
    textes:
      - "Le flipper du fond clignote pour lui-même. Une bande du plateau est réparée au sparadrap ; le patron jure qu'elle rebondit mieux comme ça."
      - "Sur le fronton, les meilleurs scores écrits au feutre : des initiales de la Nord, et tout en haut celles d'un gardien des années soixante-dix."
      - "Tu poses ta monnaie sur la vitre, comme les autres, pour dire que c'est ton tour. Le gamin qui joue ne lève pas les yeux de la bille."

  # ═══════════════════════════════════════════════════════════════ l'appartement
  # (le lit porte `dormir`, la télé `cassettes` : ville.yaml)
  - id: appartement_manger
    lieu: appartement
    habitude: soin
    objet: cuisine
    label: "Faire à manger"
    heures: [midi, soir]
    tranches: 1
    francs: -15
    max_jour: 2
    texte: "Des pâtes, du beurre, le reste du fromage râpé. Tu manges devant la plaque, la casserole à la main, pendant que la chaudière cogne."
    textes:
      - "Des pâtes, du beurre, le reste du fromage râpé. Tu manges devant la plaque, la casserole à la main, pendant que la chaudière cogne."
      - "Une omelette à quatre œufs, ratée au milieu. La voisine du dessous frappe au plafond avec un manche : la poêle t'a échappé."
      - "Le frigo est à moitié vide, comme toujours. Tu fais avec : une boîte de raviolis, un yaourt, une pomme coupée en quartiers sur la planche."
      - "Tu cuisines pour deux par habitude, et tu manges pour un. Le reste part au frigo sous une assiette retournée, pour le lendemain soir."
      - "Un poulet du marché, au four. L'appartement sent le thym jusqu'au palier ; quelqu'un, dans l'escalier, dit tout haut que ça sent bon."

  - id: appartement_fenetre
    lieu: appartement
    habitude: quartier
    objet: fenetre
    label: "Regarder la rue"
    heures: [matin, midi, aprem]
    tranches: 0
    texte: "La rue des Lilas à l'heure du pain : la boulangère, deux poussettes, un camion de livraison en double file, moteur en marche."
    textes:
      - "La rue des Lilas à l'heure du pain : la boulangère, deux poussettes, un camion de livraison en double file, moteur en marche."
      - "En bas, un gamin tape un ballon contre le mur de l'école, toujours au même endroit. Le crépi a pris la forme du ballon."
      - "Le facteur s'arrête devant l'immeuble, fouille sa sacoche, repart. Rien pour toi, ou rien qu'il ait envie de monter."
      - "Une voiture du club passe au ralenti, l'écusson sur la portière. Elle ne s'arrête pas. Tu la suis des yeux jusqu'au carrefour."

  - id: appartement_fenetre_nuit
    lieu: appartement
    habitude: nuit
    objet: fenetre
    label: "La rue, la nuit"
    heures: [soir, nuit]
    tranches: 0
    texte: "La rue est vide. Sous le lampadaire, un chat traverse, s'arrête au milieu, repart. En face, une fenêtre s'éteint, puis une autre."
    textes:
      - "La rue est vide. Sous le lampadaire, un chat traverse, s'arrête au milieu, repart. En face, une fenêtre s'éteint, puis une autre."
      - "Au bout de la rue, une seule lumière au premier étage du club-house. Quelqu'un travaille tard, ou a oublié d'éteindre ; les deux arrivent."
      - "Une voiture ralentit sous ta fenêtre, phares coupés. Elle repart au bout d'une minute. Tu notes la couleur, pas la plaque."
      - "Des chants montent du bas de la rue, cinq ou six voix et des écharpes. Ils passent sans lever la tête. Cette fois."

  - id: appartement_causerie
    lieu: appartement
    habitude: travail
    objet: table
    label: "Préparer la causerie"
    roles: [entraineur]
    heures: [soir]
    tranches: 1
    jauges: {vestiaire: 1}
    texte: "Trois pages pour la causerie de samedi. Tu barres la deuxième : ils n'écoutent plus après une minute. Tu gardes une phrase, et le nom du 9 d'en face."
    textes:
      - "Trois pages pour la causerie de samedi. Tu barres la deuxième : ils n'écoutent plus après une minute. Tu gardes une phrase, et le nom du 9 d'en face."
      - "Tu écris les onze noms sur une feuille, puis les remplaçants, puis tu recommences dans l'autre sens, en partant de ceux qui resteront sur le banc."
      - "La causerie tient sur un ticket de caisse : trois mots, un chiffre. Tu le glisses dans la poche du survêtement pour ne pas l'oublier."
      - "Tu répètes à voix basse devant la table vide. À la troisième phrase, la voisine tape au mur : il est onze heures."

  - id: appartement_contrat
    lieu: appartement
    habitude: travail
    objet: table
    label: "Relire ton contrat"
    roles: [joueur]
    tranches: 0
    texte: "Le contrat dort dans la pochette du club, avec les photos de la signature. Article 7, la prime de maintien. Tu relis le chiffre deux fois, du doigt."
    textes:
      - "Le contrat dort dans la pochette du club, avec les photos de la signature. Article 7, la prime de maintien. Tu relis le chiffre deux fois, du doigt."
      - "Une clause en petits caractères sur le droit à l'image. Tu ne l'avais pas lue : le club vend ton visage au calendrier de la boulangerie."
      - "Tu comptes au crayon, dans la marge, les mois qui restent. Le crayon s'arrête en juin ; après, la page est blanche."
      - "Le contrat sent encore le bureau du président : tabac froid et encre. Tu le ranges sous les autres papiers, à l'envers."

  - id: appartement_parapheur
    lieu: appartement
    habitude: travail
    objet: table
    label: "Le parapheur du soir"
    roles: [president]
    heures: [soir]
    tranches: 1
    jauges: {direction: 1}
    texte: "Le parapheur rapporté du club : des virements à valider, un contrat de buvette, la facture des projecteurs. Tu signes tout, sauf la facture."
    textes:
      - "Le parapheur rapporté du club : des virements à valider, un contrat de buvette, la facture des projecteurs. Tu signes tout, sauf la facture."
      - "Le bilan de l'exercice, deux colonnes. Tu refais l'addition à la main sur la nappe ; le comptable ne s'est pas trompé, malheureusement."
      - "Une lettre de la mairie sur le loyer du stade. Tu la relis en cherchant le mot qui fâche ; il est à la troisième ligne : « réévaluation »."
      - "Trois devis pour la toiture de la tribune nord. Le moins cher porte le nom d'un conseiller municipal. Tu le poses au-dessus de la pile, puis en dessous."

  - id: appartement_fiches
    lieu: appartement
    habitude: travail
    objet: table
    label: "Trier les fiches"
    roles: [ds]
    heures: [soir]
    tranches: 1
    jauges: {direction: 1}
    texte: "L'ordinateur ouvert sur la table, trois cents fiches de joueurs. Tu tries par âge, puis par salaire, puis par instinct, ce qui ne se trie pas."
    textes:
      - "L'ordinateur ouvert sur la table, trois cents fiches de joueurs. Tu tries par âge, puis par salaire, puis par instinct, ce qui ne se trie pas."
      - "Un latéral gauche de Valdorne, vingt-deux ans, un genou opéré. Tu regardes ses vidéos jusqu'à minuit, sans regarder autre chose que le genou."
      - "Tu écris trois noms sur un carnet pour le président, et un quatrième que tu ne lui montreras pas : celui que tu prendrais, toi."
      - "Les chiffres d'un milieu de Crevelaine : kilomètres, duels, passes. Tu fermes l'écran et tu repenses à sa façon de marcher, à l'échauffement."

  - id: appartement_liste
    lieu: appartement
    habitude: travail
    objet: table
    label: "Préparer la liste"
    roles: [selectionneur]
    heures: [soir]
    tranches: 1
    jauges: {vestiaire: 1}
    texte: "{Groupe} noms à trouver. Tu en écris trente sur des bouts de papier étalés sur la table ; à minuit, il en reste vingt-neuf, et un dans ta poche."
    textes:
      - "{Groupe} noms à trouver. Tu en écris trente sur des bouts de papier étalés sur la table ; à minuit, il en reste vingt-neuf, et un dans ta poche."
      - "La liste tient sur une feuille. Le troisième gardien est le plus dur à choisir : celui qui ne jouera pas, et qu'il faut quand même vouloir."
      - "Tu barres un nom, tu le réécris, tu le barres encore. Le stylo a traversé la feuille ; le nom est maintenant gravé dans la toile cirée."
      - "Le téléphone posé à côté de la liste. Chaque nom que tu enlèves, c'est un appel avant la conférence. Tu commences par le plus facile."

  - id: appartement_journal
    lieu: appartement
    habitude: culture
    objet: table
    label: "Lire le journal"
    special: journal
    heures: [matin, midi]
    tranches: 0
    texte: "Le journal sur la toile cirée, à côté du bol. Tu commences par la dernière page, comme tout le monde ici."
    textes:
      - "Le journal sur la toile cirée, à côté du bol. Tu commences par la dernière page, comme tout le monde ici."
      - "Tu étales le journal sur la table, les pages sportives d'abord. Une tache de café s'élargit lentement sur la photo du stade."
      - "Le journal est arrivé plié en quatre dans la boîte aux lettres, humide de pluie. Tu le défroisses du plat de la main."

  - id: appartement_tele
    lieu: appartement
    habitude: culture
    objet: tele
    label: "Allumer la télé"
    special: tele
    tranches: 0
    texte: "Tu allumes la télé pour avoir du bruit. Une publicité pour une lessive, puis le générique des sports, que tu connais par cœur."
    textes:
      - "Tu allumes la télé pour avoir du bruit. Une publicité pour une lessive, puis le générique des sports, que tu connais par cœur."
      - "Le journal régional, après la météo. Le présentateur prononce mal le nom du stade, comme chaque semaine."
      - "Tu passes les chaînes jusqu'aux résultats. Chez le voisin, la même émission arrive avec une seconde d'avance, à travers le mur."
      - "Le salon dans le noir, la télé pour seule lumière. Tu regardes sans le son, en lisant les chiffres qui défilent en bas de l'écran."

  - id: appartement_telephone
    lieu: appartement
    habitude: famille
    objet: telephone
    label: "Appeler quelqu'un"
    special: telephone
    tranches: 0
    texte: "Le téléphone, dans l'entrée. Tu cherches le numéro dans le carnet, puis tu le composes de mémoire."
    textes:
      - "Le téléphone, dans l'entrée. Tu cherches le numéro dans le carnet, puis tu le composes de mémoire."
      - "Tu décroches et tu écoutes la tonalité un moment avant de composer, comme pour vérifier que la ville est encore là."
      - "Le carnet ouvert à la bonne lettre. À la deuxième sonnerie, tu voudrais déjà raccrocher."

  - id: appartement_messages
    lieu: appartement
    habitude: famille
    objet: telephone
    label: "Écouter les messages"
    tranches: 0
    texte: "Trois messages. Ta mère, qui demande si tu manges. Vingt secondes de silence. Le pressing, pour une veste oubliée depuis mars."
    textes:
      - "Trois messages. Ta mère, qui demande si tu manges. Vingt secondes de silence. Le pressing, pour une veste oubliée depuis mars."
      - "Un supporter a trouvé ton numéro. Il ne dit pas son nom, seulement le score de samedi, deux fois, plus fort la deuxième. Tu effaces."
      - "Un journaliste de L'Écho, poli, qui rappellera. Puis le même, moins poli, qui ne rappellera pas."
      - "Une voix d'enfant qui a eu ton numéro par un cousin : « C'est vrai que c'est vous ? » Des rires derrière, puis la tonalité."
      - "Aucun message. Tu réécoutes l'annonce d'accueil, ta propre voix, qui a l'air de quelqu'un de plus sûr."

  - id: appartement_armoire
    lieu: appartement
    habitude: famille
    objet: armoire
    label: "Ranger l'armoire"
    heures: [matin, midi, aprem, soir]
    tranches: 1
    texte: "Au fond de l'armoire, une boîte à chaussures : des coupures de journaux, une vieille licence, une photo d'équipe où tu as un genou à terre."
    textes:
      - "Au fond de l'armoire, une boîte à chaussures : des coupures de journaux, une vieille licence, une photo d'équipe où tu as un genou à terre."
      - "Tu plies les survêtements par couleur, puis par saison. Le costume du mariage d'un ami pend au milieu, dans sa housse, depuis trois ans."
      - "Une écharpe que tu ne mets plus, offerte un soir de victoire par quelqu'un dont tu as oublié le visage. Tu la remets sur le dessus de la pile."
      - "Un maillot de tes débuts, trop petit, l'écusson décousu d'un côté. Tu le tiens à bout de bras, comme pour le présenter à quelqu'un."
      - "La porte de l'armoire ne ferme plus depuis l'hiver. Tu la cales avec un fanion plié en quatre, comme on cale une table de bistrot."

  # ══════════════════════════════════════════════════════════════ le club-house
  # (le secrétariat porte `papiers`, `fax_de_nuit`, `federation_appel` ; le bureau
  # du président `rapport_president` ; la table du conseil `conseil_administration`)
  - id: clubhouse_courrier
    lieu: clubhouse
    habitude: travail
    objet: bureau_president
    label: "Le courrier du matin"
    roles: [president]
    heures: [matin]
    tranches: 1
    texte: "La secrétaire a trié le courrier en trois piles : les factures, les supporters, les avocats. Tu commences par les supporters ; c'est la plus haute."
    textes:
      - "La secrétaire a trié le courrier en trois piles : les factures, les supporters, les avocats. Tu commences par les supporters ; c'est la plus haute."
      - "Une lettre d'un abonné depuis quarante ans, à la plume : il ne renouvellera pas. Il joint son ancienne carte, coupée en deux, proprement."
      - "Le courrier d'un sponsor, deux pages de remerciements et une ligne qui compte : « sous réserve du maintien ». Tu la soulignes au crayon."
      - "Un dessin d'enfant : le stade, des tribunes trop hautes, un soleil sur la pelouse. Tu le punaises au mur, à côté des bilans."

  - id: clubhouse_frapper
    lieu: clubhouse
    habitude: travail
    objet: bureau_president
    label: "Frapper chez le président"
    roles: [entraineur, joueur]
    heures: [matin, aprem]
    jours: [lun, mar, mer, jeu, ven]
    tranches: 1
    max_jour: 1
    jauges: {direction: 1}
    texte: "Le président te fait attendre dix minutes, porte entrouverte, au téléphone. Quand tu entres, il raccroche : « J'allais vous appeler. »"
    textes:
      - "Le président te fait attendre dix minutes, porte entrouverte, au téléphone. Quand tu entres, il raccroche : « J'allais vous appeler. »"
      - "Il t'écoute en signant des papiers, sans lever la tête. À la fin, il te demande de répéter la dernière phrase. Tu la répètes, plus courte."
      - "Sur son bureau, un cendrier en forme de ballon et ton dossier, ouvert. Il le referme en te voyant entrer, sans se presser."
      - "Il te sert un fond de whisky que tu ne bois pas. « Vous voulez quoi, exactement ? » Tu le savais en montant l'escalier. Plus maintenant."

  - id: clubhouse_vitrine
    lieu: clubhouse
    habitude: culture
    objet: trophees
    label: "Regarder la vitrine"
    tranches: 0
    texte: "Au milieu de la vitrine, le fanion de la finale de 1974, brodé d'or, sans le score. À côté, celui d'un club qui n'existe plus, offert un soir d'amical."
    textes:
      - "Au milieu de la vitrine, le fanion de la finale de 1974, brodé d'or, sans le score. À côté, celui d'un club qui n'existe plus, offert un soir d'amical."
      - "Une étiquette jaunie sous chaque trophée, tapée à la machine. Celle du tournoi des cadets de 1968 est à l'envers depuis toujours."
      - "Dans la vitre, ton reflet se pose sur les médailles. Sur l'étagère du bas, une place vide ; la poussière en garde la forme."
      - "Un ballon signé par l'équipe de 1962, dégonflé, les signatures pâlies. On n'en lit plus que trois ; la secrétaire connaît les autres par cœur."

  - id: clubhouse_telephone
    lieu: clubhouse
    habitude: travail
    objet: secretariat
    label: "Téléphoner du secrétariat"
    special: telephone
    tranches: 0
    texte: "Le téléphone du secrétariat, à côté de la pile de licences. La secrétaire pousse l'appareil vers toi, son stylo toujours sur le registre."
    textes:
      - "Le téléphone du secrétariat, à côté de la pile de licences. La secrétaire pousse l'appareil vers toi, son stylo toujours sur le registre."
      - "Tu composes le numéro debout, le combiné coincé contre l'épaule. Sur le bureau, une pile de licences attend son tampon."
      - "Le club a deux lignes ; la deuxième grésille. Tu prends la première, en surveillant le voyant de l'autre."

  - id: clubhouse_lettres
    lieu: clubhouse
    habitude: travail
    objet: secretariat
    label: "Répondre au courrier"
    roles: [joueur]
    heures: [aprem]
    tranches: 1
    jauges: {tribunes: 1}
    texte: "La secrétaire te tend une boîte à chaussures pleine de lettres. Des écoliers, des grands-mères, un détenu de Valdorne qui écrit très bien."
    textes:
      - "La secrétaire te tend une boîte à chaussures pleine de lettres. Des écoliers, des grands-mères, un détenu de Valdorne qui écrit très bien."
      - "Tu signes des photos à la chaîne, au feutre du club. À la vingtième, ta signature ressemble à celle de quelqu'un d'autre."
      - "Un gamin qui a perdu son père demande ton maillot de samedi, rien d'autre. Tu le mets de côté, sans savoir encore comment l'envoyer."
      - "Une lettre d'insultes, soignée, sans une faute. La secrétaire la retire de la boîte avant toi ; tu n'en vois que la marge, très propre."

  - id: clubhouse_affichage
    lieu: clubhouse
    habitude: travail
    objet: affichage
    label: "Le tableau d'affichage"
    tranches: 0
    texte: "Les convocations de samedi, la liste des amendes, une petite annonce : « Vends chiots, parents bergers, la mère a vu tous les matchs. »"
    textes:
      - "Les convocations de samedi, la liste des amendes, une petite annonce : « Vends chiots, parents bergers, la mère a vu tous les matchs. »"
      - "Le planning du terrain annexe, raturé trois fois. Les vétérans ont gardé leur dimanche matin ; la réserve, non."
      - "Une note de la direction, en majuscules : LES CRAMPONS SE RETIRENT AVANT L'ESCALIER. Dessous, au stylo : « Et les présidents ? »"
      - "L'affiche du loto du vendredi. Lots : un jambon, un téléviseur, un week-end à Portclair. Quelqu'un a entouré le jambon."
      - "La feuille des anniversaires du club, tenue par la secrétaire. Ton prénom y est, avec la date, et un petit cœur que personne ne revendique."

  - id: clubhouse_amende
    lieu: clubhouse
    habitude: travail
    objet: affichage
    label: "Payer ton amende"
    roles: [joueur]
    tranches: 0
    francs: -50
    max_jour: 1
    jauges: {vestiaire: 1}
    texte: "Ton nom est sur la liste des amendes : retard, mardi, quatre minutes. Les billets vont dans la boîte en fer ; le capitaine raie la ligne."
    textes:
      - "Ton nom est sur la liste des amendes : retard, mardi, quatre minutes. Les billets vont dans la boîte en fer ; le capitaine raie la ligne."
      - "Amende pour un fou rire pendant la causerie. Tu paies sans discuter ; la boîte servira au repas de fin de saison."
      - "La boîte des amendes est presque pleine. Le capitaine compte devant toi : de quoi payer le car du repas, et la moitié du vin."
      - "Tu paies aussi l'amende d'un jeune qui n'a pas de quoi, sans le dire. Le capitaine fait semblant de ne rien voir, et raie les deux lignes."

  - id: clubhouse_machine
    lieu: clubhouse
    habitude: comptoir
    objet: cafe
    label: "Un café à la machine"
    tranches: 0
    francs: -2
    max_jour: 3
    texte: "La machine rend le gobelet avant le café. Le temps qu'il coule, l'intendant et le jardinier parlent de toi, puis de la pluie, sur le même ton."
    textes:
      - "La machine rend le gobelet avant le café. Le temps qu'il coule, l'intendant et le jardinier parlent de toi, puis de la pluie, sur le même ton."
      - "Gobelet brûlant, touillette en plastique. Deux administrateurs arrivent, se taisent, prennent un chocolat chacun et repartent ensemble."
      - "La machine avale ta monnaie et ne rend rien. La secrétaire, sans se retourner : « Un coup sur le côté, à gauche. » Le café tombe."
      - "Tu bois ton café à la fenêtre de l'escalier, celle qui donne sur le parking. La voiture du président n'est pas à sa place."

  - id: clubhouse_loto
    lieu: clubhouse
    habitude: jeu
    objet: conseil
    label: "Le loto du vendredi"
    jours: [ven]
    heures: [soir]
    tranches: 1
    francs: -20
    jauges: {tribunes: 1}
    texte: "Le loto dans la salle du conseil. Tu achètes trois cartons ; à côté de toi, une retraitée en coche six à la fois, sans regarder les numéros."
    textes:
      - "Le loto dans la salle du conseil. Tu achètes trois cartons ; à côté de toi, une retraitée en coche six à la fois, sans regarder les numéros."
      - "« Le 22, les deux cocottes ! » Le crieur est un ancien arrière gauche ; il annonce les numéros comme il réclamait les touches, la main en porte-voix."
      - "Tu gagnes au troisième tour : un panier garni. Tu le donnes au gamin d'à côté, qui le donne à sa mère, qui te remercie à peine."
      - "Personne n'a gagné le gros lot depuis trois vendredis. On commence à dire que les boules sont truquées. C'est faux, presque."

  # ═══════════════════════════════════════════════════ le vestiaire de la Rive
  # (`loge_president`, `vestiaire_president`, `tournee_clubs` et `seance_selection`
  # restent sans objet : la loge et la tribune ne sont pas dans le vestiaire)
  - id: stade_casier
    lieu: stade
    habitude: travail
    objet: casier
    label: "Ranger ton casier"
    roles: [joueur]
    heures: [matin, midi, aprem, soir]
    tranches: 0
    texte: "Dans ton casier : des crampons de rechange, un gel pour le dos, et la photo d'un gamin du square, punaisée de travers."
    textes:
      - "Dans ton casier : des crampons de rechange, un gel pour le dos, et la photo d'un gamin du square, punaisée de travers."
      - "Le casier du voisin déborde sur le tien. Tu repousses une serviette, un magazine plié, une boîte de pastilles : la vie d'un autre."
      - "Tu raccroches la médaille de ta mère au crochet, où elle t'attend pendant les matchs. Elle ne l'a jamais portée ; toi, tous les autres jours."
      - "Le nom sur ton casier est écrit sur du sparadrap. Celui d'avant est encore dessous, à moitié arraché : un ailier, parti l'été dernier."

  - id: stade_tableau_coach
    lieu: stade
    habitude: travail
    objet: tableau
    label: "Dessiner au tableau"
    roles: [entraineur]
    heures: [matin, aprem]
    tranches: 1
    jauges: {vestiaire: 1}
    texte: "Onze croix, onze ronds, des flèches qui se croisent. Au fond, le gardien lève la main : « Et moi, je vais où ? » Tu lui dessines une flèche à lui aussi."
    textes:
      - "Onze croix, onze ronds, des flèches qui se croisent. Au fond, le gardien lève la main : « Et moi, je vais où ? » Tu lui dessines une flèche à lui aussi."
      - "Tu effaces la séance de la veille avec la manche. Il reste le fantôme d'une flèche vers le second poteau ; tu la gardes, elle était juste."
      - "Le coup franc de samedi, en trois temps. Au troisième, la craie casse ; le vestiaire rit, et c'est ce qu'ils retiendront le mieux."
      - "Tu écris un seul mot au tableau, en capitales, et tu sors sans l'expliquer. À ton retour, quelqu'un l'a souligné."

  - id: stade_tableau_compo
    lieu: stade
    habitude: travail
    objet: tableau
    label: "Lire la compo"
    roles: [joueur]
    heures: [matin, midi, aprem, soir]
    tranches: 0
    texte: "La compo est au tableau, à la craie. Ton nom est à sa place, au milieu à droite. Tu le lis quand même deux fois."
    textes:
      - "La compo est au tableau, à la craie. Ton nom est à sa place, au milieu à droite. Tu le lis quand même deux fois."
      - "Ton nom est en bas, avec les remplaçants, écrit plus petit. Ou c'est toi qui le lis plus petit. Le coach ne s'est pas retourné."
      - "Le nom de l'attaquant adverse, entouré trois fois, et ton numéro relié à lui par une flèche. Tu sais ce que tu fais samedi."
      - "Dans un coin du tableau, quelqu'un a dessiné le coach avec son sifflet, d'un trait sûr. Le coach l'a vu ; il a ajouté le chronomètre."

  - id: stade_tableau_causerie
    lieu: stade
    habitude: travail
    objet: tableau
    label: "La causerie au tableau"
    roles: [selectionneur]
    heures: [matin, aprem]
    tranches: 1
    jauges: {vestiaire: 1}
    texte: "{Groupe} visages venus de {groupe} vestiaires. Au tableau, tu écris le nom du pays d'en face, et rien d'autre. Ils comprennent."
    textes:
      - "{Groupe} visages venus de {groupe} vestiaires. Au tableau, tu écris le nom du pays d'en face, et rien d'autre. Ils comprennent."
      - "Tu dessines le bloc adverse au feutre, sur le tableau du club. Le capitaine prend des notes dans un carnet ; personne ne le lui a demandé."
      - "Le tableau de la Rive garde les flèches de l'entraîneur du club. Tu ne les effaces pas tout de suite : tu les lis d'abord."
      - "Tu fais les binômes au tableau, un ancien et un nouveau. Deux joueurs du même club se retrouvent ensemble ; tu les sépares d'un trait de craie."

  - id: stade_tableau_lire
    lieu: stade
    habitude: travail
    objet: tableau
    label: "Lire le tableau noir"
    roles: [ds, president]
    heures: [matin, midi, aprem, soir]
    tranches: 0
    texte: "Au tableau, un schéma du coach, et un trou à gauche, entouré. Tu comprends ce qu'il ne t'a pas demandé au téléphone."
    textes:
      - "Au tableau, un schéma du coach, et un trou à gauche, entouré. Tu comprends ce qu'il ne t'a pas demandé au téléphone."
      - "Le coach a écrit un nom au tableau, puis l'a barré : celui de la recrue de l'été. Il n'a pas effacé ; il a barré."
      - "Des flèches, des chiffres, et en bas, plus petit : « Et le budget ? », avec un point d'interrogation appuyé à en casser la craie."
      - "Tu lis le tableau comme on lit un bilan. Tu ne comprends pas les flèches ; tu comprends très bien les noms rayés."

  - id: stade_massage
    lieu: stade
    habitude: soin
    objet: massage
    label: "Passer sur la table"
    roles: [joueur]
    heures: [matin, aprem]
    tranches: 1
    texte: "La table du Doc sent le camphre. Il pétrit ta cuisse sans parler, puis s'arrête sur un point : « Là. Depuis quand ? » Tu dis : depuis rien."
    textes:
      - "La table du Doc sent le camphre. Il pétrit ta cuisse sans parler, puis s'arrête sur un point : « Là. Depuis quand ? » Tu dis : depuis rien."
      - "Le Doc masse en écoutant la météo marine à la radio. Tu t'endors à la deuxième zone ; c'est la troisième qui te réveille."
      - "Il travaille ton mollet avec les pouces. « Tu cours avec les épaules. Le mollet paie pour le reste. » Il ne dit pas qui paie pour le mollet."
      - "Huile tiède, serviette rêche. Sur l'étagère, au-dessus de la table, des boîtes sans étiquette. Tu regardes le plafond."

  - id: stade_soigneur
    lieu: stade
    habitude: soin
    objet: massage
    label: "Le point avec le soigneur"
    roles: [entraineur, ds, selectionneur, president]
    heures: [matin, aprem]
    tranches: 1
    texte: "Le soigneur strappe une cheville sur la table, la bande entre les dents. « Celui-là jouera. Celui-là aussi, s'il ne court pas. »"
    textes:
      - "Le soigneur strappe une cheville sur la table, la bande entre les dents. « Celui-là jouera. Celui-là aussi, s'il ne court pas. »"
      - "Un défenseur à plat ventre, un sac de glace sur la cuisse. Il te regarde arriver dans le miroir de l'armoire à pharmacie, et ferme les yeux."
      - "Le soigneur te montre une liste au crayon : trois noms, trois flèches. « Lundi, mardi, peut-être. » Tu demandes pour samedi ; il hausse les épaules."
      - "La table est vide, la serviette pliée en carré. Dans le cahier des soins, la même cheville revient quatre fois ce mois-ci."

  - id: stade_douche
    lieu: stade
    habitude: soin
    objet: douches
    label: "Une douche longue"
    roles: [joueur]
    heures: [matin, midi, aprem, soir]
    tranches: 0
    texte: "L'eau chaude tient trois minutes, puis les tuyaux cognent. Ceux qui traînent se lavent à l'eau froide ; aujourd'hui, c'est toi."
    textes:
      - "L'eau chaude tient trois minutes, puis les tuyaux cognent. Ceux qui traînent se lavent à l'eau froide ; aujourd'hui, c'est toi."
      - "Sous la douche d'à côté, l'avant-centre chante faux un chant de la Nord. Les autres reprennent le refrain ; toi aussi, sans y penser."
      - "Tu restes sous l'eau jusqu'à ce que le vestiaire se vide. La vapeur efface les carreaux, le banc, les maillots jetés en tas."
      - "Une flaque grise sous la grille, depuis des mois. Tu y vois ton reflet en te séchant, et un carreau fendu juste au-dessus de ta tête."

  - id: stade_nettoyer
    lieu: stade
    habitude: travail
    objet: douches
    label: "Nettoyer le vestiaire"
    roles: [joueur]
    si: "division >= 2 && age <= 24"
    heures: [aprem, soir]
    tranches: 1
    francs: 60
    max_jour: 1
    jauges: {vestiaire: 1}
    texte: "La raclette, le seau, le produit qui pique. Tu pousses l'eau vers la grille des douches pendant que les autres se rhabillent ; l'intendant te paie à la porte."
    textes:
      - "La raclette, le seau, le produit qui pique. Tu pousses l'eau vers la grille des douches pendant que les autres se rhabillent ; l'intendant te paie à la porte."
      - "Tu ramasses les bandes de strap, les chaussettes orphelines, une bague. La bague, tu la poses sur le banc du capitaine ; le lendemain, elle n'y est plus."
      - "Les anciens te regardent passer la serpillière. L'un d'eux soulève ses pieds sans lâcher son journal, comme chez lui."
      - "Le vestiaire vide sent l'embrocation et le chlore. Tu finis par les douches, en chantant, puisque personne n'écoute."

  - id: stade_plombier
    lieu: stade
    habitude: largesse
    objet: douches
    label: "Payer le plombier"
    roles: [president]
    heures: [matin, aprem]
    jours: [lun, mar, mer, jeu, ven]
    tranches: 1
    francs: -800
    max_jour: 1
    jauges: {vestiaire: 2}
    texte: "Le plombier ouvre le mur et montre, à la lampe, des tuyaux d'avant-guerre. « Je peux réparer. Ou je peux vous dire la vérité. » Tu paies pour réparer."
    textes:
      - "Le plombier ouvre le mur et montre, à la lampe, des tuyaux d'avant-guerre. « Je peux réparer. Ou je peux vous dire la vérité. » Tu paies pour réparer."
      - "Encore la vanne du fond. Tu règles la facture de ta poche ; le capitaine l'apprend par le plombier, pas par toi, et c'est mieux comme ça."
      - "Deux jours de travaux, l'eau coupée. Les joueurs se douchent au centre de formation ; le troisième jour, l'eau chaude tient tout l'entraînement."
      - "Le plombier facture au club, puis se ravise : « À vous, en personne. Le club, je connais ses délais. » Tu le règles sur le capot de sa camionnette."

  - id: stade_frappes
    lieu: stade
    habitude: sport
    objet: ballons
    label: "Des frappes en plus"
    roles: [joueur]
    heures: [matin, aprem]
    tranches: 1
    jauges: {direction: 1}
    texte: "Tu restes après la séance avec le sac de ballons. Trente frappes du pied faible. À la vingtième, il commence à obéir."
    textes:
      - "Tu restes après la séance avec le sac de ballons. Trente frappes du pied faible. À la vingtième, il commence à obéir."
      - "Le gardien remplaçant reste avec toi, pour rien, parce que personne ne reste jamais avec lui. Il arrête une frappe sur trois et te remercie."
      - "Des coups francs contre un mur de mannequins en bois. Celui du milieu a pris tant de ballons qu'il penche vers la droite."
      - "Tu frappes jusqu'à ce que le jardinier lance l'arrosage. Le dernier ballon roule dans l'eau ; tu le laisses là, et tu rentres."

  # ══════════════════════════════════════════════════ le centre de formation
  # (`jeunes`, `gamins`, `centre_formation_ds` restent sans objet : on regarde
  # les gamins jouer dehors, sur le synthétique)
  - id: centre_lits
    lieu: centre
    habitude: travail
    objet: lits
    label: "Le tour des chambres"
    tranches: 0
    texte: "Douze lits au carré, sauf un, défait, avec un ballon sous l'oreiller. L'éducateur le refait au carré ; le ballon reste dessous."
    textes:
      - "Douze lits au carré, sauf un, défait, avec un ballon sous l'oreiller. L'éducateur le refait au carré ; le ballon reste dessous."
      - "Au-dessus d'un lit, une carte du pays et une punaise sur un village que tu ne connais pas. Le gamin a écrit à côté : « 340 km »."
      - "Une photo coincée dans le cadre d'un lit : une mère, trois sœurs, un chien. Le gamin te la montre, et dit le nom du chien en premier."
      - "Les deux lits du fond sont vides depuis la Toussaint : deux gamins renvoyés chez eux. Les draps sont pliés dessus, prêts pour les suivants."

  - id: centre_penalty
    lieu: centre
    habitude: sport
    objet: crampons
    label: "Des tirs au but"
    jeu: penalty
    tranches: 0
    max_jour: 2
    texte: "Tu empruntes une paire de crampons dans le couloir, une pointure de moins. Le gardien des moins de quinze ans t'attend déjà dans le but."
    textes:
      - "Tu empruntes une paire de crampons dans le couloir, une pointure de moins. Le gardien des moins de quinze ans t'attend déjà dans le but."
      - "Les gamins se mettent en rang derrière toi pour voir. Le petit gardien crache dans ses gants, comme il l'a vu faire à la télé."
      - "Cinq tirs, et le gamin dans le but qui annonce ton côté avant chaque course. Il se trompe une fois sur deux ; il continue d'annoncer."

  - id: centre_crampons
    lieu: centre
    habitude: travail
    objet: crampons
    label: "Brosser les crampons"
    tranches: 1
    texte: "Une brosse, un seau d'eau, douze paires couvertes de boue. Les gamins frottent avec toi, en silence, puis en concours."
    textes:
      - "Une brosse, un seau d'eau, douze paires couvertes de boue. Les gamins frottent avec toi, en silence, puis en concours."
      - "Une paire a les crampons usés jusqu'aux vis. Tu les changes avec la clé du couloir ; le gamin te suit des yeux comme un mécanicien."
      - "Tu alignes les paires par pointure, de la plus petite à la plus grande. Les gamins disent que c'est l'ordre dans lequel ils partiront."
      - "Une paire neuve, la boîte encore dessous, le prix sur l'étiquette. Le gamin la porte à la main, en chaussettes, pour ne pas l'abîmer."

  - id: centre_resultats
    lieu: centre
    habitude: travail
    objet: resultats
    label: "Lire les résultats"
    tranches: 0
    texte: "Le tableau des jeunes, au feutre : les moins de quinze ans ont perdu 7-0 à Crevelaine. Quelqu'un a ajouté, d'une écriture d'enfant : « Et alors ? »"
    textes:
      - "Le tableau des jeunes, au feutre : les moins de quinze ans ont perdu 7-0 à Crevelaine. Quelqu'un a ajouté, d'une écriture d'enfant : « Et alors ? »"
      - "Les buteurs de la saison, en colonne. Le même prénom revient neuf fois chez les moins de treize ans ; à côté, un dessin de couronne."
      - "Une ligne barrée en rouge : un match perdu sur tapis vert, un gamin sans licence. L'éducateur a écrit la date du rappel en dessous."
      - "En haut du tableau, les anciens du centre passés pros, cinq noms en vingt ans. Le dernier est encore à l'encre fraîche."

  - id: centre_video
    lieu: centre
    habitude: travail
    objet: video
    label: "Une cassette aux gamins"
    tranches: 1
    texte: "Le magnétoscope avale la cassette avec un bruit de dents. Un vieux match du club, sans le son. Les gamins rient des shorts, puis se taisent."
