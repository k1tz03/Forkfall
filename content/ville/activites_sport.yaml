    max_jour: 1
    texte: "La vendeuse te laisse la caisse le temps d'aller chez le dentiste. Tu vends deux fanions et une écharpe, et tu offres un porte-clés sans le dire."
    textes:
      - "La vendeuse te laisse la caisse le temps d'aller chez le dentiste. Tu vends deux fanions et une écharpe, et tu offres un porte-clés sans le dire."
      - "Un client te reconnaît en payant et compte sa monnaie lentement, pour faire durer. Il repart avec le ticket, plié dans son portefeuille."
      - "Le tiroir-caisse coince. Au troisième client, tu as compris le coup de genou qu'il faut donner au meuble, et la vendeuse t'appelle « collègue »."
      - "Mercredi après-midi, les gamins du centre aéré. Ils touchent tout, n'achètent rien, et te demandent de signer leurs avant-bras."

  - id: boutique_fanions
    lieu: boutique
    habitude: quartier
    objet: fanions
