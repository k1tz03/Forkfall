      - "Le matelas, la couverture militaire, le vent par la vitre cassée. Tu dors en manteau, les mains sous les bras."
      - "Tu t'allonges dans le wagon pour ne pas rentrer. Les rails grincent toute la nuit ; aucun train ne vient."
      - "L'occupant du wagon te laisse le matelas et prend le plancher. Au matin, il est parti, la couverture pliée sur toi."

  - id: wagon_vitre
    lieu: wagon
    habitude: nuit
    objet: vitre
    label: "Regarder par la vitre"
    tranches: 0
    texte: "Par la vitre cassée, la voie qui s'en va dans les ronces, et au bout, les toits de la ville. Le vent passe par le trou en sifflant toujours la même note."
    textes:
      - "Par la vitre cassée, la voie qui s'en va dans les ronces, et au bout, les toits de la ville. Le vent passe par le trou en sifflant toujours la même note."
      - "Le soir, par la vitre, les projecteurs du stade font une lueur jaune au-dessus de la friche, comme une ville plus loin."
      - "Une étoile de verre autour d'un trou de la taille d'un caillou. Le caillou est encore là, dans le wagon, posé sur le rebord avec les allumettes."
      - "Dehors, sur le ballast, un renard s'arrête, te regarde par la vitre et repart. Ici, c'est lui qui a l'air d'être chez lui."

  - id: wagon_sac
    lieu: wagon
    habitude: largesse
    objet: sac
    label: "Glisser quelque chose"
    tranches: 0
    francs: -50
    max_jour: 1
    texte: "Tu glisses des billets dans la poche extérieure du sac, sous le rabat. La semaine suivante, ils y sont toujours, pliés autrement."
    textes:
      - "Tu glisses des billets dans la poche extérieure du sac, sous le rabat. La semaine suivante, ils y sont toujours, pliés autrement."
      - "Un sandwich, une bouteille d'eau, l'argent dans le papier. Tu poses le tout sur le sac, en évidence ; le soir, il n'y a plus rien."
      - "Tu laisses l'argent sous la bougie, pas dans le sac. Le sac, c'est chez lui. Il n'y a pas de porte au wagon ; il y a le sac."
      - "Sur le sac, un mot au crayon de menuisier : « Pas besoin. Merci. » L'argent de la dernière fois est dessous, au complet. Tu le laisses où il est."

  - id: wagon_bougie
    lieu: wagon
    habitude: nuit
    objet: bougie
    label: "Allumer la bougie"
    heures: [soir, nuit]
    tranches: 0
    texte: "Tu rallumes la bougie avec une allumette de la boîte posée à côté. La flamme se couche, se relève ; le wagon devient une pièce, avec des murs."
    textes:
      - "Tu rallumes la bougie avec une allumette de la boîte posée à côté. La flamme se couche, se relève ; le wagon devient une pièce, avec des murs."
      - "La bougie est plantée dans une bouteille, la cire en coulées jusqu'au fond. Quelqu'un la change tous les soirs ; toujours la même, la moins chère."
      - "À la lueur de la bougie, des mots gravés au couteau dans la paroi : un prénom, un score, et « ici c'est chez moi »."
      - "Tu regardes la flamme jusqu'à ce qu'elle te brûle les yeux. Au loin, un train de marchandises passe sur la grande ligne, sans s'arrêter."

  # ═══════════════════════════════════════════════════════ le caveau du Racing
