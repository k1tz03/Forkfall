    textes:
      - "Un bouton de veste à recoudre. Brunel le recoud devant toi, sans lunettes, le fil entre les dents, et te le compte comme une retouche entière."
      - "Un ourlet défait. Brunel le mesure à l'épingle sur ta jambe, debout sur une marche, et note un chiffre dans un carnet à spirale."
      - "Tu poses ta veste sur le comptoir. Brunel trouve le trou de la poche avant toi, puis une tache que tu n'avais pas vue, puis une autre."
      - "Brunel prend ta veste du bout des doigts, la retourne, renifle la doublure : « Une nuit de match. Je vous la rends jeudi, propre. »"

