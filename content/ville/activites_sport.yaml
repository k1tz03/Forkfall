      - "Les maillots de la saison dernière, à moitié prix, sur un portant qui grince. Un numéro revient souvent : celui d'un joueur parti fâché."
      - "Un maillot taille enfant au numéro d'un ancien capitaine, oublié au fond du bac. La vendeuse dit qu'il est réservé depuis trois ans."
      - "Une mère cherche un maillot pour son fils, « celui qui a marqué samedi ». La vendeuse sort trois numéros ; aucun n'a marqué."
      - "Les soldes sentent le carton et le plastique neuf. Une étiquette a été recollée trois fois, chaque fois plus bas."

  - id: boutique_vitrine
