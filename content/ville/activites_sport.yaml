    texte: "Brunel te fait passer une veste du portant, gris anthracite. Les épaules tombent juste ; les manches, non. Il le savait avant que tu l'enfiles."
    textes:
      - "Brunel te fait passer une veste du portant, gris anthracite. Les épaules tombent juste ; les manches, non. Il le savait avant que tu l'enfiles."
      - "Un costume croisé bleu nuit, « pour les enterrements et les finales ». Tu le gardes un moment, puis tu le rends : ni l'un ni l'autre cette semaine."
      - "Le costume d'un client qui n'est jamais venu le chercher. Il te va. « Il est mort, ou parti. Prenez-le à moitié prix. » Tu ne le prends pas."
      - "Un smoking pour le gala de la Ligue, pris à la taille au crayon. Brunel tourne trois fois autour de toi et reprend tout."

  - id: tailleur_miroir
    lieu: tailleur
    habitude: luxe
    objet: miroir
    label: "Le miroir à trois faces"
    tranches: 0
    texte: "Le miroir à trois faces te montre ton dos, que tu n'avais pas vu depuis longtemps. Il est plus voûté que dans ton souvenir."
    textes:
      - "Le miroir à trois faces te montre ton dos, que tu n'avais pas vu depuis longtemps. Il est plus voûté que dans ton souvenir."
      - "Trois reflets dans le miroir, et aucun ne se tient droit. Brunel pose deux doigts entre tes omoplates : « Là. Pensez à là. »"
      - "Dans le miroir de gauche, la vitrine, et dans la vitrine, deux supporters qui te regardent essayer une veste. Ils s'éloignent quand tu te retournes."
      - "Ton profil, que tu n'avais pas vu depuis des mois. Tu as le nez de ton père ; ça arrive maintenant, à cet âge-là."

  - id: tailleur_cirer
    lieu: tailleur
    habitude: luxe
    objet: chaussures
    label: "Faire cirer tes chaussures"
    tranches: 0
    francs: -20
    max_jour: 1
    texte: "Brunel cire tes souliers sur un pied de fonte, à la brosse, au chiffon, puis du plat de la main. Ils brillent comme une voiture de mariage."
    textes:
      - "Brunel cire tes souliers sur un pied de fonte, à la brosse, au chiffon, puis du plat de la main. Ils brillent comme une voiture de mariage."
      - "Il retourne ta chaussure et lit la semelle comme un dossier : « Vous marchez sur l'extérieur. Et vite. Vous êtes en retard partout. »"
      - "Tu attends sur la chaise basse, en chaussettes, pendant qu'il cire. Une cliente entre, te voit en chaussettes, et ressort."
      - "La cire noire, la brune, et une boîte sans couleur, « pour les souliers des enterrements ». Il ne précise pas lesquels."

  - id: tailleur_cabine
    lieu: tailleur
    habitude: luxe
    objet: cabine
    label: "Un essayage"
    tranches: 1
    texte: "Derrière le rideau de la cabine, Brunel sert un conseiller municipal. Ils parlent du stade, puis de toi, à voix basse, puis du prix d'un gilet."
    textes:
      - "Derrière le rideau de la cabine, Brunel sert un conseiller municipal. Ils parlent du stade, puis de toi, à voix basse, puis du prix d'un gilet."
      - "La cabine sent la naphtaline et la craie de tailleur. Une épingle oubliée te pique au deuxième bouton ; tu la plantes dans le rideau."
      - "Tu ressors de la cabine. Brunel est à genoux, les épingles aux lèvres, et marque l'ourlet sans dire bonjour à la cliente qui attend."
      - "Le rideau ne ferme jamais tout à fait. Par la fente, un gamin colle son nez à la vitrine pour regarder la montre en acier."

  # ═════════════════════════════════════════════════════════ le garage du Pont
  - id: garage_revision
