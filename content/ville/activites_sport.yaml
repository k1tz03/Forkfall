      - "Tu passes au ralenti l'action de samedi des moins de dix-sept ans. Le défenseur fautif regarde ses pieds ; tu arrêtes l'image sur son bon geste d'avant."
      - "La bande saute à chaque but, usée d'être rembobinée. Le plus beau but du club a été vu tant de fois qu'il ne passe plus que dans la neige."
      - "Les gamins réclament la cassette des buts de la saison, encore. Tu la mets ; ils annoncent chaque but avant qu'il arrive, en chœur."

  - id: centre_devoirs
