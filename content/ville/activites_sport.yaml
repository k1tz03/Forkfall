    tranches: 0
    texte: "Sous la bâche, une voiture neuve qui sent la colle et le plastique. Le garagiste rabat le tissu avant que tu voies le prix : « Pas encore. »"
    textes:
      - "Sous la bâche, une voiture neuve qui sent la colle et le plastique. Le garagiste rabat le tissu avant que tu voies le prix : « Pas encore. »"
      - "Tu soulèves un coin de la bâche : une calandre chromée, de la boue séchée sur le pare-chocs, une plaque qui n'est pas d'ici. Derrière toi, le garagiste tousse."
      - "Le garagiste relève la bâche jusqu'aux phares, pas plus. « Celle-là, on la regarde par morceaux. Le prix aussi. »"
      - "Sous la bâche, rien : des cartons et un vélo d'enfant. La voiture qui était là est partie dans la nuit. « Vendue », dit le garagiste, et il retourne sous son capot."

  - id: garage_velo
