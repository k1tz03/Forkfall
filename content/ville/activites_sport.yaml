      - "La vitrine du maillot de 1974 est vide. À la place, un carton : « Acquis par un particulier ». Les anciens disent ton nom en passant devant."
      - "Le crochet est resté, et la trace plus claire du cadre sur le velours. La vendeuse n'a pas eu le cœur de mettre autre chose."
      - "Un enfant demande où est le maillot. La vendeuse te regarde avant de répondre : « Chez quelqu'un qui en prend soin. »"

