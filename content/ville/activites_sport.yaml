    tranches: 0
    texte: "Tu t'assois sur une pile de palettes, à l'abri de la pluie. Au fond de la halle, des voix se taisent quand tu tousses, et reprennent plus bas."
    textes:
      - "Tu t'assois sur une pile de palettes, à l'abri de la pluie. Au fond de la halle, des voix se taisent quand tu tousses, et reprennent plus bas."
      - "Quelqu'un a fait un canapé de palettes et de sièges de voiture. Sur l'accoudoir, un cendrier en boîte de thon, plein, et une écharpe du club."
      - "Les palettes portent encore le tampon de la Tréfilerie. Un vieux du quartier passe et pose la main sur une, longtemps : il les clouait, à l'époque."
      - "Tu regardes les pigeons entrer par le toit et ressortir par les fenêtres sans vitres."

  - id: halle_decharger
