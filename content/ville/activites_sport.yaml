    texte: "Les présidents en lettres d'or, les capitaines en noir. Tu cherches le soigneur ; il est en bas, à gauche, en lettres plus petites, sans titre."
    textes:
      - "Les présidents en lettres d'or, les capitaines en noir. Tu cherches le soigneur ; il est en bas, à gauche, en lettres plus petites, sans titre."
      - "Un capitaine de 1962, mort en 1963. Tu fais le calcul deux fois. Quelqu'un a gratté la pierre autour de l'année, comme pour l'effacer."
      - "Tu lis les noms à voix basse, comme une composition d'équipe. Il en manque un pour faire onze ; il en manque toujours un."
      - "Un nom du quartier : le grand-père d'un gamin du centre. Il était dans les buts en 1948, et plus personne ne le savait."

  - id: caveau_echarpes
    lieu: caveau
    habitude: foi
    objet: echarpes
    label: "Changer les écharpes"
    heures: [matin, midi, aprem, soir]
    tranches: 1
    francs: -120
    max_jour: 1
    jauges: {tribunes: 1}
    texte: "Tu dénoues les écharpes délavées, grises de pluie, et tu en noues trois neuves à la grille du caveau. Les vieilles, tu ne sais pas où les mettre."
    textes:
      - "Tu dénoues les écharpes délavées, grises de pluie, et tu en noues trois neuves à la grille du caveau. Les vieilles, tu ne sais pas où les mettre."
      - "Une écharpe délavée tombe en morceaux quand tu la dénoues. Tu ramasses les bouts de laine un par un ; le vent en emporte un vers l'allée."
      - "Tu noues une écharpe neuve. Le lendemain, une vieille dame en a noué une autre à côté, plus ancienne encore, qu'elle gardait chez elle."
      - "Le gardien te voit de loin. Il vient t'aider à démêler les nœuds de l'hiver, et garde pour lui une écharpe de soixante et onze, « pour la loge »."

  - id: caveau_cierge
    lieu: caveau
    habitude: foi
    objet: cierge
    label: "Allumer un cierge"
    tranches: 0
    francs: -5
    max_jour: 1
    texte: "Le cierge du caveau est presque fini. Tu en allumes un neuf à sa flamme avant qu'elle s'éteigne, pour que ce soit la même."
    textes:
      - "Le cierge du caveau est presque fini. Tu en allumes un neuf à sa flamme avant qu'elle s'éteigne, pour que ce soit la même."
      - "Le vent souffle le cierge deux fois. À la troisième, tu fais un abri de tes mains ; la flamme tient, et tes doigts sentent la cire jusqu'au soir."
      - "Les cierges attendent dans une boîte en fer, sous la grille. On paie dans une tirelire en forme de ballon, cabossée, que personne n'a jamais volée."
      - "Tu allumes le cierge sans savoir pour qui. Pour tous : ceux qui ont joué ici, et celui qui n'a pas encore de nom."

  # ═══════════════════════════════════════════════════════ le local du matériel
  - id: materiel_filets
