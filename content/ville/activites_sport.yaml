      - "Le vieux fanion brodé, celui des années soixante, n'est pas à vendre. La vendeuse le décroche pour te le montrer, et le raccroche aussitôt."
      - "Un fanion pour l'échange des capitaines, samedi. La vendeuse le roule dans du papier kraft pour qu'il ne se froisse pas dans le sac."
      - "Une guirlande de fanions pour l'anniversaire d'un gamin du quartier. La vendeuse en ajoute un, gratuit : celui de la saison ratée."

  # ═══════════════════════════════════════════ Brunel, tailleur et chausseur
