    habitude: foi
    objet: plaque
    label: "Toucher la plaque neuve"
    tranches: 0
    texte: "La plaque neuve brille plus que les autres, le marbre sans une rayure. Les escargots du caveau la contournent ; ils ne l'ont pas encore apprise."
    textes:
      - "La plaque neuve brille plus que les autres, le marbre sans une rayure. Les escargots du caveau la contournent ; ils ne l'ont pas encore apprise."
      - "Tu poses la main à plat sur la plaque neuve. Elle est froide au milieu, tiède sur les bords, là où le soleil de l'après-midi l'a prise."
      - "Le marbrier a laissé un trait de crayon sous la plaque neuve, pour l'alignement. Personne ne l'a effacé ; il fait partie du caveau, maintenant."
      - "Une vieille dame te demande pour qui est la plaque neuve. Tu dis que tu ne sais pas. Elle dit : « Moi non plus. Mais je la salue. »"

  - id: caveau_noms
    lieu: caveau
    habitude: foi
    objet: noms
    label: "Chercher un nom"
