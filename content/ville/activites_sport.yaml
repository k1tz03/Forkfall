    max_jour: 1
    texte: "Quarante chasubles, quatre couleurs, une pile. Tu les tries par couleur puis par taille ; l'intendant ajoute une pièce « pour les jaunes », qui sentent."
    textes:
      - "Quarante chasubles, quatre couleurs, une pile. Tu les tries par couleur puis par taille ; l'intendant ajoute une pièce « pour les jaunes », qui sentent."
      - "Les rouges ont déteint sur les jaunes au dernier lavage. L'intendant les appelle maintenant « les orange », et tu les ranges à part."
      - "Tu comptes les chasubles. Il en manque trois, comme chaque mois. L'intendant les inscrit au registre, à ton nom, puis barre ton nom."
      - "Tu plies les chasubles en carré, « comme à l'armée », dit l'intendant, qui n'a pas fait l'armée. Il te paie en monnaie, sortie d'une boîte à sucre."

  - id: materiel_equipes
