    textes:
      - "Le matelas sent la pluie et le tabac froid. Tu t'assois au bord, les coudes sur les genoux ; d'ici, les soirs de match, on entend le kop, très loin."
      - "Une couverture militaire pliée en quatre, un oreiller fait d'un blouson roulé. Quelqu'un dort ici, et range avant de partir."
      - "Sous le matelas dépasse un vieux programme de match, plié. L'occupant du wagon revient, te voit le regarder, et le remet en place du pied."
      - "L'occupant te tend une boîte de biscuits. Tu en prends un, il en prend un, et c'est toute la conversation."

  - id: wagon_dormir
