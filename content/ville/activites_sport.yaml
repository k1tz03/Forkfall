    max_jour: 1
    texte: "Ta voiture monte sur le pont, les roues dans le vide. Le garagiste passe dessous avec sa baladeuse et sifflote ; il s'arrête de siffler une fois."
    textes:
      - "Ta voiture monte sur le pont, les roues dans le vide. Le garagiste passe dessous avec sa baladeuse et sifflote ; il s'arrête de siffler une fois."
      - "« Vous roulez beaucoup la nuit, vous. » Le garagiste le dit en lisant le compteur, pas en te regardant. Tu ne réponds pas."
      - "Il te montre le dessous de la voiture : un coup sous la caisse, récent. « Un trottoir, ou un supporter ? » Il rit, toi non."
      - "Pendant la révision, la radio du garage donne le classement. Le garagiste baisse le son quand on arrive au club, par délicatesse, ou l'inverse."

  - id: garage_graisser
