    jauges: {tribunes: 1}
    texte: "Un gamin du square pousse son vélo dans la cour, la chaîne sautée. Le garagiste te tend la clé ; tu remets la chaîne, les doigts noirs jusqu'au poignet."
    textes:
      - "Un gamin du square pousse son vélo dans la cour, la chaîne sautée. Le garagiste te tend la clé ; tu remets la chaîne, les doigts noirs jusqu'au poignet."
      - "Une roue voilée sur l'établi. Tu la redresses à la clé à rayons, un quart de tour à la fois ; le gamin compte les tours avec toi."
      - "L'apprenti du garage te regarde réparer un vélo avec l'air de celui qui ferait mieux. Il a raison ; il te prend l'outil à la fin."
      - "Une pièce de caoutchouc, de la colle, une bassine d'eau pour trouver la fuite. Les bulles montent ; le gamin applaudit comme pour un but."

  - id: garage_vendeur
    lieu: garage
    habitude: quartier
    objet: bureau
    label: "Le café du vendeur"
    tranches: 1
    texte: "Le vendeur te sert un café dans un gobelet du club et pose sa calculette entre vous. Il ne la touche pas. Elle reste là, comme un chien qui attend."
    textes:
      - "Le vendeur te sert un café dans un gobelet du club et pose sa calculette entre vous. Il ne la touche pas. Elle reste là, comme un chien qui attend."
      - "Il connaît ton salaire à la centaine près, et le dit en souriant, comme une politesse. Puis il te parle du crédit, pour les gens comme toi."
      - "Sur son bureau, la photo d'un ancien du club au volant d'un coupé, dédicacée. « Il me doit encore deux traites. Mais quel joueur. »"
      - "Il feuillette le catalogue de l'année devant toi, page par page, en mouillant son doigt. Tu repars avec la brochure et une migraine."

  - id: garage_pneus_car
    lieu: garage
    habitude: largesse
    objet: pneus
    label: "Payer les pneus du car"
    roles: [president, entraineur]
    tranches: 0
    francs: -1200
    max_jour: 1
    jauges: {vestiaire: 1}
    texte: "Quatre pneus neufs pour le car du club, payés de ta poche. Le garagiste écrit « don » sur la facture, puis le barre : « Avec le fisc, on ne sait jamais. »"
    textes:
      - "Quatre pneus neufs pour le car du club, payés de ta poche. Le garagiste écrit « don » sur la facture, puis le barre : « Avec le fisc, on ne sait jamais. »"
      - "Le chauffeur du car vient voir monter les pneus, les mains dans les poches, et tape du pied sur chacun, comme sur un cheval."
      - "Le garagiste montre le vieux pneu au chauffeur, du pouce : on voit la toile. Le chauffeur se gratte la nuque."
      - "Les pneus du car empilés dans la cour, ton nom à la craie sur le premier. Le garagiste l'efface avant qu'un journaliste passe."

  # ═══════════════════════════════════════════ la loge du gardien du cimetière
  - id: loge_registre
    lieu: loge
    habitude: foi
    objet: registre
    label: "Signer le registre"
    heures: [matin, aprem]
    tranches: 0
    texte: "Le gardien tourne le registre vers toi. Tu écris ton nom, l'heure, « caveau du Racing » ; il corrige l'heure de cinq minutes, à sa montre."
    textes:
      - "Le gardien tourne le registre vers toi. Tu écris ton nom, l'heure, « caveau du Racing » ; il corrige l'heure de cinq minutes, à sa montre."
      - "Au-dessus de ta ligne, une écriture que tu connais, de la veille au soir. Le gardien referme le registre avant que tu lises le nom en entier."
      - "Le registre a une colonne « motif ». Les gens écrivent « visite ». Toi aussi. Le gardien lit, et ça lui suffit."
      - "Un registre neuf cette année ; les anciens sont empilés sous la fenêtre, ficelés par décennie. Il dit qu'il les relit l'hiver, quand il n'y a personne."

  - id: loge_poele
    lieu: loge
    habitude: foi
    objet: poele
    label: "Se réchauffer au poêle"
    heures: [matin, aprem]
    tranches: 1
    texte: "Le gardien t'ouvre la loge sans rien demander et pousse une chaise vers le poêle. Le café de la cafetière émaillée a le goût du fer."
    textes:
      - "Le gardien t'ouvre la loge sans rien demander et pousse une chaise vers le poêle. Le café de la cafetière émaillée a le goût du fer."
      - "Le poêle ronfle, la vitre est jaune de suie. Le gardien parle des tombes comme d'un quartier : les calmes, les bruyantes, celles qu'on ne visite plus."
      - "Tu tends les mains vers la fonte chaude. Sur le poêle, une casserole d'eau contre l'air sec, et une paire de gants qui sèche, raide comme du carton."
      - "Il te raconte l'enterrement d'un ancien président du club : trois cents personnes, et la fanfare qui s'est trompée de morceau. Il en rit encore."

  - id: loge_cles
    lieu: loge
    habitude: foi
    objet: cles
    label: "La clé du caveau"
    heures: [matin, aprem]
    tranches: 0
    texte: "Le trousseau pend à un clou, une clé par allée, étiquetées au sparadrap. Le gardien décroche celle du Racing sans chercher ; elle est plus usée que les autres."
    textes:
      - "Le trousseau pend à un clou, une clé par allée, étiquetées au sparadrap. Le gardien décroche celle du Racing sans chercher ; elle est plus usée que les autres."
      - "« Le caveau du Racing ? » Il te tend la clé, puis la retient une seconde : « Vous la rapportez. Les gens du club la gardent, des fois. »"
      - "Le gardien compte ses clés tous les soirs, en les faisant sonner. Il en manque une depuis des années ; il la compte quand même, après un silence."

  - id: loge_fenetre
    lieu: loge
    habitude: foi
    objet: fenetre
    label: "Regarder les allées"
    heures: [matin, aprem, soir]
    tranches: 0
    texte: "Par la fenêtre de la loge, l'allée principale, les cyprès, et une femme qui change l'eau d'un vase avec la lenteur de quelqu'un qui a le temps."
    textes:
      - "Par la fenêtre de la loge, l'allée principale, les cyprès, et une femme qui change l'eau d'un vase avec la lenteur de quelqu'un qui a le temps."
      - "Le gardien te montre du menton un homme en blouson, au fond de l'allée des anciens. « Tous les jeudis. Il ne s'arrête jamais à la même tombe. »"
      - "Des gamins escaladent le mur du fond pour récupérer un ballon. Le gardien les regarde faire sans bouger : « Ils le rendront. Ils le rendent toujours. »"
      - "La pluie sur les allées, les tombes qui brillent. Le gardien aime ce temps-là : personne ne vient, et ceux qui viennent ont une raison."

  # ═══════════════════════════════════════════════════════════ la grande halle
  - id: halle_jongles
