    textes:
      - "Un trou dans le filet, à la lucarne gauche, là où le 9 frappe tout. Tu le recouds à la ficelle de jardin pendant que l'intendant tient l'autre bout."
      - "Les filets sentent la terre et l'herbe coupée. Tu cherches les trous à la lampe, en les tendant sur le dossier d'une chaise ; il y en a plus que de mailles."
      - "L'intendant te montre son nœud, celui des marins : trois tours et une boucle. Le tien tient aussi, dit-il, mais pas pour les mêmes raisons."
      - "Un filet neuf coûte ce que le club n'a pas. Alors on recoud l'ancien chaque année, et chaque année il ressemble un peu plus à une carte routière."

