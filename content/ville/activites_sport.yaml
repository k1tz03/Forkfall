    textes:
      - "Un camion sans nom sur la bâche entre dans la halle à la tombée du jour. Un homme te paie d'avance pour décharger, et ne dit pas quoi. Tu ne demandes pas."
      - "Des cartons collés au ruban, lourds, qui tintent. Tu les empiles sur les palettes avec deux types qui ne parlent pas ta langue, ni aucune autre ce soir."
      - "Le chauffeur te paie en billets neufs, qui se suivent. « On ne s'est pas vus. » Tu dis non. C'est la seule chose vraie de la soirée."
      - "Une heure de cartons sous le toit troué. Quand le camion repart, quelqu'un balaie les traces de pneus dans la poussière, soigneusement."

  - id: halle_toit
    lieu: halle
    habitude: quartier
    objet: toit
    label: "Regarder le toit"
    tranches: 0
    texte: "Par le trou du toit, un carré de ciel de la taille d'une surface de réparation. La pluie tombe dedans, et seulement dedans."
    textes:
      - "Par le trou du toit, un carré de ciel de la taille d'une surface de réparation. La pluie tombe dedans, et seulement dedans."
      - "Les pigeons se battent sur une poutre. Une plume descend en tournant pendant longtemps ; un gamin essaie de la reprendre de volée."
      - "Par le toit, la nuit, on voit les projecteurs du stade quand ils s'allument. Ici, on sait qu'il y a match avant d'entendre le kop."
      - "Une tôle bat au vent, à intervalles réguliers. Les gens de la halle n'y font plus attention ; toi, tu comptes."

  - id: halle_tags
    lieu: halle
    habitude: culture
    objet: tags
    label: "Lire les tags"
    tranches: 0
    texte: "Sur le mur nord, les chants du kop écrits à la bombe, avec les fautes d'origine. Personne ne les corrige : ce serait les trahir."
    textes:
      - "Sur le mur nord, les chants du kop écrits à la bombe, avec les fautes d'origine. Personne ne les corrige : ce serait les trahir."
      - "Un tag frais, au-dessus des autres, à hauteur d'échelle : un numéro de maillot barré d'une croix. La peinture a coulé jusqu'au sol."
      - "Des prénoms, des dates, des cœurs, le nom du club rival barré, et tout petit, à hauteur d'enfant, ton nom, sans faute."
      - "Le plus vieux tag date de 1974 : la date de la finale, et un mot que la pluie a mangé. Les anciens ne sont pas d'accord sur ce qu'il disait."

  - id: halle_couvrir
