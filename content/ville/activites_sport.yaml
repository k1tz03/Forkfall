    textes:
      - "Tu choisis une écharpe au mur, la plus simple, tricotée serré. La vendeuse l'enroule dans du papier de soie : « C'est pour vous ? Vraiment ? »"
      - "Le mur des écharpes, du sol au plafond, toutes les saisons. Tu prends celle de l'année de la montée ; la vendeuse sourit, comme à un examen réussi."
      - "La vendeuse te tend une écharpe neuve et en décroche une vieille, délavée, qu'elle garde contre elle : « Celle-là, non. C'était celle de mon frère. »"
      - "Tu noues l'écharpe devant la glace. Deux gamins collés à la vitrine te regardent faire, puis refont le nœud sur leurs propres cous."

  - id: boutique_soldes
