    texte: "Le garagiste te tend une combinaison trop grande et la pompe à graisse. Tu fais les vérins un par un ; il paie à l'heure, en liquide, sans facture."
    textes:
      - "Le garagiste te tend une combinaison trop grande et la pompe à graisse. Tu fais les vérins un par un ; il paie à l'heure, en liquide, sans facture."
      - "Tu laves les occasions de la cour au jet. Les passants te reconnaissent derrière la mousse ; le garagiste dit que c'est bon pour la vente."
      - "Il ne pose pas de question sur tes comptes. Il te montre le pont, la burette, la pile de chiffons. Le soir, il te paie et te dit : « Mardi. »"
      - "Tu passes l'après-midi sous une citadine, à genoux sur un carton. Le garagiste te tend une bière et ta paie : « Les genoux, c'est en plus. »"

  - id: garage_bache
