    heures: [matin, aprem]
    tranches: 0
    texte: "Tu fais les équipes de la séance avec les chasubles, sur le banc du local. Les jaunes, les titulaires ; tu glisses un jaune chez les rouges, pour voir."
    textes:
      - "Tu fais les équipes de la séance avec les chasubles, sur le banc du local. Les jaunes, les titulaires ; tu glisses un jaune chez les rouges, pour voir."
      - "Une chasuble par nom, posée en tas. L'intendant regarde par-dessus ton épaule et dit seulement : « Ils vont comprendre, avec les couleurs. »"
      - "Tu inverses deux chasubles au dernier moment. C'est la seule décision de la journée qui fera parler le vestiaire, et tu le sais en la prenant."

  - id: materiel_tondeuse
