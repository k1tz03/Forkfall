      - "Il te montre l'armoire aux patrons : les mesures de tous les présidents du club, en papier kraft. Les morts sont rangés à droite."
      - "« Quelqu'un du club est venu hier. Un costume pour un mariage, a-t-il dit. Il n'avait pas une tête de mariage. » Brunel coupe un fil."
      - "Brunel ne parle pas de football. Il parle des laines de 1960, qui grattaient, et des épaules qu'on mettait aux hommes pour qu'ils aient l'air de quelque chose."

  - id: tailleur_costumes
