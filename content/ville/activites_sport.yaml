    textes:
      - "Un ballon dégonflé traîne au milieu du terrain à la craie. Tu le relèves du pied ; trois gamins sortent de derrière un pilier pour compter."
      - "Sous le toit troué, le béton est sec au milieu, mouillé sur les bords. Tu jongles au sec, en visant le rond central tracé à la craie."
      - "Deux boîtes de conserve font les buts ; un pilier, le poteau de corner. Ici, avant le match, on jongle : c'est comme ça qu'on choisit les équipes."

  - id: halle_palettes
