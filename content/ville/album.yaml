  # ═══════════════════════════════════════════════════════════════ AVEC QUI L'ON ÉCHANGE
  # Un échange : deux doubles contre une vignette qui te manque et que l'autre a (son stock vient du
  # tirage de la semaine, graine de la carrière). Chaque échange est un geste avec la personne : un
  # point de lien (l'activité cachée `album_echange_<gens>`, `avec:` et `habitude: quartier`), au plus un
  # par jour. `affinite` : les pages qu'elle a en double de préférence ; `brillante` : la chance qu'elle
  # ait une brillante cette semaine. Un successeur (Nino, Aram, Telma) reprend la place quand l'époque
  # change : une personne qui n'est pas là ne propose rien.
  echanges:
    - gens: gege
      affinite: [club_90, club_apres, comptoirs]
      brillante: 0.12
      stock: 12
      scene: "Gégé étale ses doubles sur le zinc, tenus par un élastique de bureau, et les compte à voix haute sans te regarder."
      fin:
        - "Gégé reprend tes deux doubles, les range dans la poche intérieure de la veste, et pousse la vignette vers toi du dos de la main."
        - "« Deux pour une, c'est le tarif de la Nord. » Il compte tes doubles en tapant du pouce sur le zinc, puis te rend l'élastique."
        - "Il regarde ta vignette à contre-jour, au néon. « Celle-là, je la cherche depuis qu'il n'y a plus de carton dans les paquets. »"
    - gens: nino
      affinite: [club_apres, vestiaire_apres, comptoirs]
      brillante: 0.12
      stock: 12
      scene: "Nino sort un classeur de sa veste, des pochettes plastique rangées par numéro, et les feuillette sans te laisser toucher."
      fin:
        - "Nino glisse tes deux doubles dans la pochette du fond, retire la vignette de la sienne avec des pincettes, et te la tend par le bord."
        - "« Mon oncle échangeait à la gueule. Moi, je tiens un cahier. » Il note ton nom en face du numéro, au crayon."
        - "Il compte tes doubles deux fois, change un mot de sa liste, et te rend ta vignette dans un sachet. Pour le soin."
    - gens: hagop
      affinite: [tilleuls, quartier_90, notables_90]
      brillante: 0.15
      stock: 12
      scene: "Hagop pose sa pile de doubles à côté de la friteuse, sur un papier journal. Il en retire un, le remet, et attend que tu dises oui."
      fin:
        - "Hagop prend tes deux doubles du bout des doigts, loin du gras, et te tend la vignette dans une serviette en papier. « Ça ne tache pas. »"
        - "Il emballe ta vignette comme un cornet, avec le papier des sports à l'extérieur. Tu paies en doubles, il ne te rend rien."
        - "« Deux pour une, ce n'est pas un prix, c'est une façon de se dire bonne journée. » Il remet la pile derrière la caisse."
    - gens: aram
      affinite: [tilleuls, quartier_apres, notables_apres]
      brillante: 0.15
      stock: 12
      scene: "Aram a collé ses doubles sur le carreau du snack, de l'intérieur, comme son père collait les résultats. Il les décolle un à un."
      fin:
        - "Aram décolle la vignette du carreau avec l'ongle, te la tend, et colle tes deux doubles à sa place, de l'intérieur."
        - "« Mon père disait : on n'échange jamais sans manger. » Il pose une frite sur ta vignette, pour la forme, et la retire."
        - "Il vérifie le numéro au dos, deux fois, comme un billet de loto. Puis il te sourit, ce qu'il ne fait jamais le samedi."
    - gens: haddouche
      affinite: [tilleuls, comptoirs, vestiaire_90]
      brillante: 0.1
      stock: 12
      scene: "Les gamins étalent leurs doubles sur le capot d'une voiture, contre le grillage. Le plus grand les garde du plat de la main."
      fin:
        - "Les gamins se concertent à voix basse, puis le plus petit te tend la vignette, les deux mains en coupe, comme un oiseau."
        - "« Deux doubles, pas un de moins. Pas de crédit. » Le grand compte les tiens, un par un, avant qu'on te la donne."
        - "Le plus jeune rit quand tu reprends ta vignette, sans que personne sache pourquoi. Le grillage tremble, quelqu'un a lancé un ballon."
    - gens: cazal
      affinite: [tilleuls, comptoirs, vestiaire_apres]
      brillante: 0.1
      stock: 12
      scene: "Les gamins du city-stade étalent leurs doubles sur le banc, et leur éducatrice fait semblant de ne pas regarder le prix."
      fin:
        - "Telma Cazal hoche la tête quand les gamins comptent tes doubles à voix haute. Elle n'intervient que si le compte est faux."
        - "« Chacun son tour, et on n'embrouille pas le petit. » Les gamins te tendent ta vignette à la file, comme un seau d'eau."
        - "Ils notent l'échange dans un carnet d'écolier. Le dernier numéro de la page est souligné deux fois ; personne ne l'a jamais eu."

  # ═══════════════════════════════════════════════════════════════ LES ACTIVITÉS CACHÉES
# Les gestes d'échange, comptés par le moteur comme n'importe quel geste avec quelqu'un (un point de lien,
# au plus un entre deux cartes ; une habitude). Aucun bouton : la ville ne les montre pas dans la liste
# d'un lieu (`cache: true`), c'est l'action « Échanger des vignettes » du panneau de la personne qui les joue.
activites:
  - id: album_echange_gege
    lieu: buvette
    avec: gege
    habitude: quartier
    cache: true
    label: "Échanger des vignettes"
    texte: "Deux doubles contre une vignette qui te manque : le tarif de la buvette, qu'on ne discute pas."
    tranches: 0
    max_jour: 1
  - id: album_echange_nino
    lieu: buvette
    avec: nino
    habitude: quartier
    cache: true
    label: "Échanger des vignettes"
    texte: "Nino tient ses doubles dans un classeur, par numéro. Deux des tiens contre une des siennes, et son crayon note le reste."
    tranches: 0
    max_jour: 1
  - id: album_echange_hagop
    lieu: snack_tilleuls
    avec: hagop
    habitude: quartier
    cache: true
    label: "Échanger des vignettes"
    texte: "Hagop échange ses doubles au comptoir, entre deux commandes. Deux des tiens, une des siennes, et pas de monnaie."
    tranches: 0
    max_jour: 1
  - id: album_echange_aram
    lieu: snack_tilleuls
    avec: aram
    habitude: quartier
    cache: true
    label: "Échanger des vignettes"
    texte: "Aram échange ses doubles comme son père, au carreau du snack. Deux des tiens, une des siennes, sans monnaie."
    tranches: 0
    max_jour: 1
  - id: album_echange_haddouche
    lieu: city_stade
    avec: haddouche
    habitude: quartier
    cache: true
    label: "Échanger des vignettes"
    texte: "Les gamins du grillage échangent leurs doubles sur un capot. Deux des tiens, une des leurs, pas de crédit."
    tranches: 0
    max_jour: 1
  - id: album_echange_cazal
    lieu: city_stade
    avec: cazal
    habitude: quartier
    cache: true
    label: "Échanger des vignettes"
    texte: "Les gamins du city-stade échangent sur le banc. Deux des tiens, une des leurs, et un carnet pour les comptes."
    tranches: 0
    max_jour: 1
