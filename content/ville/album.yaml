# L'ALBUM D'AUBÉRIVE — les pochettes de vignettes du tabac-presse deviennent un album
# qui se garde d'une carrière à l'autre (localStorage `fusible.album.v1`, jamais dans la
# partie sauvée). Le lot dit tout ce qui est de l'ordre du contenu : les pages, ce qu'elles
# contiennent, ce que coûte et ce que contient une pochette, avec qui l'on échange, ce que
# rapporte une page complète. Le code (preview_album.js, ville_album.js) ne contient aucun
# texte de jeu.
#
# Ce que `build_content` en fait : une section `album` sous `ville` (la ville la lit comme le
# reste), les activités cachées de l'échange (`activites:` plus bas, `cache: true`), et une
# mission d'une étape par page qui rapporte quelque chose au moteur (`album.page.<id>` :
# l'argent passe par le pont de la ville, le quartier par son drapeau `quartier_<clé>`).
#
# LES PAGES. Deux familles :
#   · les légendes, écrites à la main (`vignettes:`) : les équipes de chaque époque, les
#     champions de 1962, la finale de 1974, les Unes (une par histoire, gagnée en jouant) ;
#   · les visages, TIRÉS des personnages (characters.yaml et les gens d'Aubérive) : un
#     sélecteur dit qui entre dans la page. `camp` (le camp du personnage), `lot` (le fichier
#     de `gens:` où il vit : gens_club, gens_comptoirs…), `hors_lots` (aucun lot), `debut: [a, b]`
#     (l'année où il apparaît : le début de son époque en ville, sinon sa première histoire).
#     Un personnage entre dans la PREMIÈRE page dont le sélecteur le prend ; `build_content`
#     refuse un visage laissé sans page. Une page tient 24 vignettes au plus.
#
# L'ÉPOQUE. Une vignette d'un visage de la ville porte l'époque où il est là (`annees`) :
# dans une carrière, les vignettes de l'année en cours sortent plus souvent des pochettes
# (`pochette.epoque`). Une page peut aussi aimer une histoire (`livres: {promu: 4}`) : ses
# vignettes y sortent quatre fois plus souvent. C'est ce qui donne une raison de rejouer un
# autre livre : on ne complète pas l'album d'une seule époque.
#
# LES BRILLANTES. Une pochette sur six (`brillante_sur`) porte une vignette brillante, tirée
# des pages `rarete: brillante`. Celles des Unes ne sortent jamais d'une pochette : on les gagne.
# La plus attendue est le cinquième joueur de 1974 : son visage est intact, son nom a bavé à
# l'impression, et le livre 1 ne dit pas qui c'est (aucun nom ici, personne ne le devine).
# Quand on la tient, le jeu envoie `fusible:album` {type: 'brillante', id: '1974_cinquieme'}.
#
# Tous les noms de cette page sont inventés. Aucun club, joueur, dirigeant ou marque réels.

album:
  pochette:
    vignettes: 4           # par pochette
    prix: 3                # en francs de 1990 (une pochette coûtait alors deux ou trois francs) : c'est le
                           # `francs` des activités à `jeu: pochette` (la ville
                           # applique l'inflation, puis l'écu, comme pour tout l'argent de la ville)
    neuves: 0.45           # la part des vignettes tirées d'abord parmi celles qui manquent ; le reste est tiré au
                           # hasard dans tout l'album : c'est là que naissent les doubles
    brillante_sur: 6       # une pochette sur six porte une brillante
    epoque: 2.5            # le poids d'une vignette de l'année en cours, contre 1
  # les pochettes offertes en jouant : au plus tant par carrière
  cadeaux:
    lien: 8                # quand un lien monte d'un cran
    service: 5             # quand quelqu'un te rend un service
  echange:
    donne: 2               # deux doubles
    recoit: 1              # contre une vignette qui manque

  pages:
    # ═══════════════════════════════════════════════════════════════ LES LÉGENDES
    - id: equipes
      section: legendes
      titre: "Les équipes"
      sous: "Le Racing tous les cinq ans, les Cobalts les années de Mondial. Le maillot change, la photo reste de travers."
      fond: "#7B1E34"
      bande: "#F2E8CE"
      recompense:
        texte: "Quinze équipes, toutes collées. Le photographe du club te rend les cadres, et deux pochettes oubliées au fond du carton."
        pochettes: 2
        francs: 1200
      vignettes:
        - {id: equipe_1990, nom: "Racing Aubérive", label: "ÉQUIPE 1990", annee: 1990, epoque: [1990, 1994],
           maillot: {motif: rayures, c1: "#7B1E34", c2: "#F2E8CE", col: polo, manches: courtes},
           dos: "Coton lourd, col boutonné. Sous la pluie, le maillot pèse deux kilos de plus à la mi-temps."}
        - {id: equipe_1995, nom: "Racing Aubérive", label: "ÉQUIPE 1995", annee: 1995, epoque: [1995, 1999],
           maillot: {motif: rayures, c1: "#7B1E34", c2: "#F2E8CE", col: polo, manches: courtes},
           dos: "Le nom dans le dos, au-dessus du numéro. L'intendant a cousu les lettres de travers, une seule fois."}
        - {id: equipe_2000, nom: "Racing Aubérive", label: "ÉQUIPE 2000", annee: 2000, epoque: [2000, 2004],
           maillot: {motif: cerceaux, c1: "#7B1E34", c2: "#F2E8CE", col: ronde, manches: courtes},
           dos: "Un carré blanc sur la poitrine, pour le sponsor. Personne ne sait lire ce qu'il vend, tout le monde le porte."}
        - {id: equipe_2005, nom: "Racing Aubérive", label: "ÉQUIPE 2005", annee: 2005, epoque: [2005, 2009],
           maillot: {motif: rayures, c1: "#5E1527", c2: "#E9DCC0", col: v, manches: courtes},
           dos: "Fibres synthétiques : le maillot ne pèse plus rien, et il ne garde plus la sueur du virage."}
        - {id: equipe_2010, nom: "Racing Aubérive", label: "ÉQUIPE 2010", annee: 2010, epoque: [2010, 2014],
           maillot: {motif: unie, c1: "#7B1E34", c2: "#F2E8CE", col: v, manches: courtes},
           dos: "Coupe ajustée, col en V. Les remplaçants le portent plus longtemps que les titulaires."}
        - {id: equipe_2015, nom: "Racing Aubérive", label: "ÉQUIPE 2015", annee: 2015, epoque: [2015, 2019],
           maillot: {motif: chevrons, c1: "#7B1E34", c2: "#F2E8CE", col: ronde, manches: courtes},
           dos: "Le maillot de l'année se vend avant d'être porté. Sur la photo, personne n'a encore sali le blanc."}
        - {id: equipe_2020, nom: "Racing Aubérive", label: "ÉQUIPE 2020", annee: 2020, epoque: [2020, 2024],
           maillot: {motif: bande, c1: "#7B1E34", c2: "#F2E8CE", col: aucun, manches: courtes},
           dos: "Sans col, sans bouton, une étiquette lisible au scanner. Il y a des soirs où personne ne scanne."}
        - {id: equipe_2025, nom: "Racing Aubérive", label: "ÉQUIPE 2025", annee: 2025, epoque: [2025, 2029],
           maillot: {motif: bande, c1: "#2A2A30", c2: "#C9A24A", col: aucun, manches: longues},
           dos: "Une seule bande, du col au short. L'ancien capitaine dit qu'on dirait un maillot de gardien."}
        - {id: equipe_2030, nom: "Racing Aubérive", label: "ÉQUIPE 2030", annee: 2030, epoque: [2030, 2034],
           maillot: {motif: unie, c1: "#2F4F3A", c2: "#F2E8CE", col: ronde, manches: courtes},
           dos: "Fibres recyclées, étiquette verte. Le club le dit trois fois dans le communiqué, et une fois sur le maillot."}
        - {id: equipe_2035, nom: "Racing Aubérive", label: "ÉQUIPE 2035", annee: 2035, epoque: [2035, 2039],
           maillot: {motif: rayures, c1: "#7B1E34", c2: "#1C1C22", col: v, manches: courtes},
           dos: "Le numéro est une lumière : on le règle à la mi-temps. Le club a un partenaire pour ça."}
        - {id: equipe_2040, nom: "Racing Aubérive", label: "ÉQUIPE 2040", annee: 2040, epoque: [2040, 2044],
           maillot: {motif: damier, c1: "#7B1E34", c2: "#F2E8CE", col: aucun, manches: courtes},
           dos: "La brochure vante le tissu : il garde un peu de la chaleur du joueur d'avant. C'est écrit comme un avantage."}
        - {id: equipe_2045, nom: "Racing Aubérive", label: "ÉQUIPE 2045", annee: 2045, epoque: [2045, 2050],
           maillot: {motif: unie, c1: "#F2E8CE", c2: "#7B1E34", col: ronde, manches: courtes},
           dos: "Imprimé à ta taille, à la commande, avec ton nom. Le club préférerait qu'on y lise celui du joueur."}
        - {id: equipe_2050, nom: "Racing Aubérive", label: "ÉQUIPE 2050", annee: 2050, epoque: [2050, 2050],
           maillot: {motif: unie, c1: "#1C1C22", c2: "#F2E8CE", col: aucun, manches: courtes},
           dos: "Le maillot n'est plus qu'un cadre pour la photo. Tout se joue dans la tribune, qui n'est plus en carton."}
        - {id: equipe_cobalts_2010, nom: "Les Cobalts", label: "SÉLECTION 2010", annee: 2010, epoque: [2010, 2012],
           maillot: {motif: unie, c1: "#1F4FB8", c2: "#F2F2F2", col: v, manches: courtes},
           dos: "La photo de groupe de la dernière qualification. Personne n'a voulu la légender."}
        - {id: equipe_cobalts_2029, nom: "Les Cobalts", label: "SÉLECTION 2029", annee: 2029, epoque: [2028, 2030],
           maillot: {motif: unie, c1: "#1F4FB8", c2: "#F2F2F2", col: ronde, manches: longues},
           dos: "Manches longues : le tournoi se joue en hiver, sous un toit. On a refait les photos trois fois."}

    - id: champions_1962
      section: legendes
      titre: "Les champions de 1962"
      sous: "Onze hommes en maillots de laine, les bras croisés, le gardien en casquette. Le cuivre de la plaque brille plus que le reste."
      fond: "#6B5230"
      bande: "#F0E4C4"
      rarete: brillante
      livres: {geant_dechu: 4, fin_de_contrat: 3}
      recompense:
        texte: "Onze visages au complet. À la brasserie, un ancien te paie un demi sans rien dire, puis te confie une chose du vestiaire de 1962."
        francs: 2500
        tuyau:
          texte: "Le gardien de 1962 ne savait pas danser, mais il savait parler aux hommes en noir. Si on te siffle un jour, demande-toi comment il disait non."
      vignettes:
        - {id: 1962_n01, nom: "Eugène Lascombes", label: "GARDIEN", annee: 1962,
           portrait: {teint: clair, corpulence: large, age: mur, coiffure: casquette, cheveux: brun, pilosite: moustache, lunettes: aucune, tenue: gardien, couleur: gris, couleur2: jaune, accessoire: aucun, coiffe: gris},
           dos: "Joue en casquette par tous les temps. Sur la photo, il tient le ballon comme on tient un chapeau."}
        - {id: 1962_n02, nom: "Julien Mauffrey", label: "ARRIÈRE DROIT", annee: 1962,
           portrait: {teint: clair, corpulence: moyen, age: jeune, coiffure: court, cheveux: chatain, pilosite: rase, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
           dos: "Pas une faute dans la surface en trois saisons. Ce n'est pas de la sagesse : il ne courait pas assez vite pour la faire."}
        - {id: 1962_n03, nom: "Raoul Tessonnier", label: "ARRIÈRE GAUCHE", annee: 1962,
           portrait: {teint: porcelaine, corpulence: large, age: jeune, coiffure: brosse, cheveux: blond, pilosite: rase, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
           dos: "Boulanger le matin, arrière gauche l'après-midi. Le vendredi, il livrait le pain de l'équipe en maillot."}
        - {id: 1962_n04, nom: "Augustin Pelletan", label: "CAPITAINE", annee: 1962,
           portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: court, cheveux: brun, pilosite: rase, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: brassard, couleur_accessoire: blanc},
           dos: "Le brassard est cousu sur la manche gauche. Il le gardait sous la douche, pour qu'on ne le lui prenne pas."}
        - {id: 1962_n05, nom: "Marcel Brandicourt", label: "STOPPEUR", annee: 1962,
           portrait: {teint: olive, corpulence: large, age: mur, coiffure: brosse, cheveux: noir, pilosite: moustache, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
           dos: "Stoppeur. Le seul de l'équipe qui se coupait les ongles de pied avant le match, assis sur le banc, avec un couteau."}
        - {id: 1962_n06, nom: "Lucien Escoffier", label: "DEMI", annee: 1962,
           portrait: {teint: clair, corpulence: fin, age: jeune, coiffure: meche, cheveux: chatain, pilosite: rase, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
           dos: "Ses chaussettes tombaient à la mi-temps. On les remontait avec des élastiques de la poste."}
        - {id: 1962_n07, nom: "Armand Chavroux", label: "AILIER DROIT", annee: 1962,
           portrait: {teint: dore, corpulence: fin, age: jeune, coiffure: court, cheveux: noir, pilosite: rase, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
           dos: "Le plus rapide de la ville, et le seul à ne pas le savoir. Il courait comme on rentre chez soi sous l'orage."}
        - {id: 1962_n08, nom: "Désiré Vauquelin", label: "INTÉRIEUR DROIT", annee: 1962,
           portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: degarni, cheveux: gris, pilosite: moustache, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
           dos: "Il passait la balle sans regarder, par principe. Sur la photo, il regarde l'appareil par erreur."}
        - {id: 1962_n09, nom: "Ernest Barrault", label: "AVANT-CENTRE", annee: 1962,
           portrait: {teint: brun, corpulence: large, age: jeune, coiffure: brosse, cheveux: noir, pilosite: rase, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
           dos: "Il marquait de la tête, du genou, du ventre. Le règlement de l'époque ne précisait pas où l'on devait marquer."}
        - {id: 1962_n10, nom: "Paul Sauveterre", label: "INTÉRIEUR GAUCHE", annee: 1962,
           portrait: {teint: porcelaine, corpulence: fin, age: jeune, coiffure: carre, cheveux: roux, pilosite: rase, lunettes: rondes, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
           dos: "Seul joueur à lunettes de la finale. Il les ôtait au coup de sifflet et les retrouvait au coup de sifflet final."}
        - {id: 1962_n11, nom: "Honoré Quinsac", label: "AILIER GAUCHE", annee: 1962,
           portrait: {teint: olive, corpulence: moyen, age: jeune, coiffure: court, cheveux: brun, pilosite: moustache, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
           dos: "Il portait sa médaille au cou jusque dans le car. Il a fallu lui dire que ce n'était plus la peine."}

    - id: finale_1974
      section: legendes
      titre: "La finale de 1974"
      sous: "Planche d'avril 1974, imprimée avant le match. Onze visages que la ville connaît par cœur ; sur les photos de l'escalier, il en manque un."
      fond: "#7A4B2A"
      bande: "#F0E4C4"
      rarete: brillante
      livres: {promu: 4}
      recompense:
        texte: "La planche est complète, de la première à la dernière. Le buraliste ne veut pas être payé : il te remet trois pochettes, sans un mot."
        pochettes: 3
      vignettes:
        - {id: 1974_n01, nom: "Joseph Lanfrey", label: "GARDIEN", annee: 1974,
           portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: court, cheveux: brun, pilosite: moustache, lunettes: aucune, tenue: gardien, couleur: marine, couleur2: jaune, accessoire: aucun},
           dos: "Planche d'avril 1974. Il a les gants du magasin de sport, jamais ceux du club : ils étaient trop petits."}
        - {id: 1974_n02, nom: "Victor Marsaguet", label: "ARRIÈRE DROIT", annee: 1974,
           portrait: {teint: dore, corpulence: moyen, age: jeune, coiffure: mulet, cheveux: noir, pilosite: moustache, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
           dos: "Planche d'avril 1974. Une tache d'encre sur le short, que l'imprimeur a vendue comme une ombre."}
        - {id: 1974_n03, nom: "Roland Desfontaines", label: "ARRIÈRE GAUCHE", annee: 1974,
           portrait: {teint: clair, corpulence: large, age: jeune, coiffure: long, cheveux: chatain, pilosite: barbe, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
           dos: "Planche d'avril 1974. Il a laissé pousser ses cheveux pour la photo ; le coiffeur du club a pris cela pour une insulte."}
        - {id: 1974_n04, nom: "Michel Hautbois", label: "DEMI", annee: 1974,
           portrait: {teint: olive, corpulence: moyen, age: jeune, coiffure: boucle, cheveux: noir, pilosite: rase, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
           dos: "Planche d'avril 1974. Il sourit parce qu'on lui a promis la photo avec sa fiancée, après. Elle n'y est pas."}
        - {id: 1974_cinquieme, nom: null, secret: true, label: "NUMÉRO 5", annee: 1974, echangeable: false, livres: {promu: 4},
