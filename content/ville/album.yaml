           dos: "Planche d'avril 1974, avant la finale. L'encre du nom a bavé à l'impression ; l'imprimeur a vendu la planche quand même."}
        - {id: 1974_n06, nom: "Serge Montbazon", label: "DEMI", annee: 1974,
           portrait: {teint: brun, corpulence: moyen, age: jeune, coiffure: brosse, cheveux: noir, pilosite: rase, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
           dos: "Planche d'avril 1974. On l'a collé dans le coin de la planche : c'était la seule place où son épaule tenait."}
        - {id: 1974_n07, nom: "Gilbert Ferrandou", label: "AILIER DROIT", annee: 1974,
           portrait: {teint: porcelaine, corpulence: fin, age: jeune, coiffure: meche, cheveux: blond, pilosite: rase, lunettes: aucune, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
