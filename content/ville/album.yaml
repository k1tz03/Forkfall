        - {id: 1974_n08, nom: "Claude Pastoureau", label: "INTÉRIEUR DROIT", annee: 1974,
           portrait: {teint: clair, corpulence: moyen, age: jeune, coiffure: court, cheveux: chatain, pilosite: moustache, lunettes: carrees, tenue: maillot, couleur: bordeaux, couleur2: creme, accessoire: aucun},
