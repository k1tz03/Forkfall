           dos: "Planche d'avril 1974. Le photographe lui a demandé de ne pas bouger ; il a bougé, et c'est la seule vignette nette."}

    - id: unes
      section: legendes
      titre: "Les Unes"
      sous: "Ton visage, le jour où le journal titre sur ta saison. On ne les achète pas : une par histoire, la première fois que tu fais la Une."
      fond: "#1B1B20"
      bande: "#F2E8CE"
      rarete: brillante
      unes: true
      recompense:
        texte: "Dix Unes, dix jours où l'on t'a lu. Le kiosquier colle ton portrait sur sa vitrine, et te remet ce qu'il lui reste de pochettes."
        pochettes: 3
        francs: 3000

