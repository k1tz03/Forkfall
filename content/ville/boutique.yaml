    texte: "Brunel prend tes mesures avec un ruban jauni, sans rien noter. Trois essayages, une doublure aux couleurs du club : « Celui-là, on le remarque depuis la loge. »"
    effets: {jauges: {direction: 2}, set: [bn_costume_sur_mesure]}
    revente: 0

  - id: manteau_cachemire
    nom: "Un manteau en cachemire"
    categorie: vetement
    lieu: tailleur
    prix: 11000
    annees: [1990, 2050]
    texte: "Le cachemire pèse moins que ton imperméable. Brunel relève le col sur ta nuque : « Au bord du terrain, en février, vous penserez à moi. »"
    effets: {jauges: {direction: 1}}
