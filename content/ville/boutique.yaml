# LA BOUTIQUE ET LES BIENS — ce qu'on achète en ville avec ses francs (puis ses
# écus), et ce qu'on peut perdre.
#
# Les prix sont en FRANCS DE 1990 : la ville applique l'inflation de l'année et
# le passage à l'écu (drapeau `monde_ecus`). Repères : un entraîneur de
# deuxième division gagne 25 000 F par mois, un joueur de première division
# 60 000 F. La villa vaut onze ans du premier, quatre ans et demi du second.
#
# Où l'on achète : Brunel, tailleur et chausseur (`tailleur`) ; le garage du
# Pont (`garage`) ; Immobilier Tessandier (`agence`) ; un courtier de la Capitale,
# chambre 7 de l'hôtel de la Rive (`hotel`) — les montres, les bijoux, les
# toiles, le bateau, l'hélicoptère ; le tabac-presse du carrefour
# (`tabac_stade`) — les montres simples et les téléphones ; l'épicerie, qui
# prête son catalogue de vente par correspondance puis devient point relais
# (`epicerie`) ; la papeterie (`librairie`), la pharmacie, la salle de muscu,
# la banque (le coffre), la boutique du club et le Corner (`bar`).
#
# Ce qu'un objet fait :
#   · `usage` : en ville — `vitesse` (la marche multipliée, pour un véhicule),
#     `repos` (+énergie à chaque nuit), `faim` (+faim au réveil),
#     `deplacement: libre` (l'hélicoptère : partout d'un coup).
#   · `logement` : il remplace le deux-pièces loué de la rue des Lilas.
#   · `effets` : ce que le moteur applique à l'achat (`Engine.biens`) — de
#     petites touches aux jauges (±5 au plus) et des drapeaux `bn_*`, retirés
#     quand l'objet est perdu (saisi, volé, revendu). Un achat voyant coûte :
#     le coupé fâche la tribune, la montre le vestiaire, la villa le président,
#     l'hélicoptère tout le monde. Un achat utile aide : les crampons, le
#     costume de la loge, le magnétoscope de montage, la berline qui ouvre la
#     barrière des officiels.
#   · `luxe: true` : saisi par `saisie_luxe` (l'huissier, la brigade) ; un
#     véhicule tombe aussi par `saisie_vehicules`, un logement par
#     `saisie_logement`, et `saisie_tout` prend tout. Le cambrioleur (`vol_luxe`)
#     n'emporte que ce qui est chez toi et tient dans un sac : les objets
#     `luxe: true` de catégorie montre, vetement ou luxe, sauf le lingot (au
#     coffre), le bateau (au port) et la part du trotteur.
#   · `revente` : la part du prix que le vendeur rend (0 : invendable).
#
# Les suites — ce que les drapeaux `bn_*` réveillent — sont des événements du
# moteur : content/arcs/entraineur/biens.yaml et content/arcs/joueur/biens.yaml
# (la photo du coupé, l'huissier, le contrôle fiscal, la maison visitée,
# l'hélicoptère, le voisin, la brigade financière, et quelques autres).
#
# Les époques : pas de téléphone portable avant 1995, pas de smartphone avant
# 2008 (le Flux arrive avec lui), pas d'hélicoptère avant 1995, le 4x4 des
# années de l'argent facile à partir de 1995, l'écran plat en 2004, le duplex de
# la Tréfilerie quand l'usine devient des logements (2005), la berline
# électrique en 2015, la voiture sans volant en 2036. Aucune marque : on dit ce
# que c'est.
objets:
  # ================================================================ VÊTEMENTS
  - id: survetement_club
    nom: "Le survêtement du club"
    categorie: vetement
    lieu: boutique
    prix: 650
    annees: [1990, 2050]
    texte: "La vendeuse de la boutique plie la veste aux couleurs du club, l'écusson bien au milieu : « En ville, les gens aiment voir ça. Les jours de défaite, un peu moins. »"
    effets: {jauges: {tribunes: 1}}
    revente: 0.2

  - id: blouson_cuir
    nom: "Un blouson de cuir"
    categorie: vetement
    lieu: tailleur
    prix: 3800
    annees: [1990, 2050]
    texte: "Brunel te fait tourner devant la psyché, une épingle entre les lèvres : « Le cuir prend la forme de qui le porte. Il lui faut un hiver, pas plus. »"
    revente: 0.3

  - id: costume_confection
    nom: "Un costume de confection"
    categorie: vetement
    lieu: tailleur
    prix: 2900
    annees: [1990, 2050]
    texte: "Un costume gris sur un cintre, retouché en vingt minutes. Brunel tire sur l'ourlet : « Pour la mairie, ça ira. Pour la loge du président, revenez me voir. »"
    effets: {jauges: {direction: 1}}
