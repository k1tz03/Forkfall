# Histoire 1 — « Trois mille visages » : les scènes jouées et les conversations surprises
# (format : docs/histoires/scenes_jouees.md). Une scène jouée ne se joue pas, on la regarde ;
# une conversation s'entend en passant près de ceux qui parlent.
cinematiques:
  - id: h1.ci.intro
    quand: debut
    roles: [entraineur]
    si: "flag(histoire_h1)"
    titre: "Trois mille visages"
    sous: "Aubérive, juillet 1990"
    lieu: buvette
    tranche: soir
    suite: h1.ci.intro_2
    acteurs:
      - {qui: toi, place: porte}
      - {qui: gege, place: fond}
      - {qui: vecchio, place: zinc_1}
      - {id: patron, qui: commercant2, nom: "Le patron", place: barman}
    etapes:
      - {narration: "Quinze ans sans prendre le car pour Aubérive. La Rive sent toujours le gasoil et la vase."}
      - {qui: toi, va: table_1}
      - {qui: vecchio, dit: "Le nouveau coach arrive lundi. Personne ne l'a vu. Même pas Vaubourg, qui l'a signé au téléphone."}
      - {qui: patron, geste: boit}
      - {qui: gege, emote: "..."}
      - {qui: gege, regarde: toi}
      - {qui: gege, dit: "Moi, je l'ai vu."}
      - {pause: 700}
      - {qui: gege, va: table_2}
      - {qui: gege, dit: "Une bière, monsieur ? Elle est tiède, mais elle est à nous.", ton: sourire}
      - {qui: toi, pense: "Il me regarde comme on regarde une photo qu'on connaît par cœur."}
      - {narration: "Au mur, entre deux écharpes, un rectangle plus clair : un cadre qu'on a décroché."}
      - {qui: vecchio, geste: tete_basse}
      - {qui: gege, dit: "Madame Josiane vous attend demain au club-house. Elle a deux clés. Prenez les deux."}
      - {fondu: "Le lendemain matin."}

  - id: h1.ci.intro_2
    quand: suite
    lieu: clubhouse
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {qui: josiane, place: secretaire}
    etapes:
      - {narration: "Le club-house sent la cire et le café réchauffé. Une machine à écrire, un calendrier de 1989 qu'on n'a pas changé."}
      - {qui: toi, va: guichet}
      - {qui: josiane, regarde: toi}
      - {qui: josiane, dit: "Vous êtes {pg, select, f{arrivée} other{arrivé}} en avance. Les autres arrivaient en retard, au début.", ton: sourire}
      - {qui: josiane, geste: ecrit}
      - {qui: josiane, dit: "Monsieur Aulard est en rendez-vous. Montez, je vous apporte les clés.", geste: pointe}
      - {qui: toi, pense: "Dans l'escalier, des photos. Une seule n'a plus tous ses visages."}

conversations:
  - id: h1.cv.le_filet
    roles: [entraineur]
    si: "flag(histoire_h1) && annee == 1990"
    lieu: buvette
    tranches: [soir, nuit]
    qui:
      - {qui: gege, place: fond}
      - {qui: vecchio, place: zinc_1}
    repliques:
      - {qui: vecchio, dit: "Tu lui as dit, pour le placard ?"}
      - {qui: gege, dit: "Le filet ? Il le verra bien assez tôt."}
      - {qui: vecchio, dit: "Seize ans que je le plie. Je ne sais plus pourquoi je le garde."}
      - {qui: gege, dit: "Moi je sais. Remets-nous deux demis."}
