# Histoire 5 — « La Maquette » : les scènes jouées et les conversations surprises
# (format : docs/histoires/scenes_jouees.md). Le président, 1999-2002 ; le livre est écrit au
# neutre, et ces textes aussi : le héros peut être une présidente (`{pg, select, …}`).
#
# L'introduction passe par trois lieux, la nuit du dépôt de bilan et le matin d'après : la
# buvette du kop (la ville choisit un nom, à la craie, à la place du prix du demi), le feu de
# palettes de la friche (le terrain du « stade neuf », où les géomètres de juin ont visé
# autre chose), le club-house du 2 juillet (quelqu'un attend en haut, debout, et n'a pas
# touché à son café). Elle mène à la première carte (pr.h5.pro1_titres) sans la raconter.
#
# Douze scènes ensuite, sur les trois saisons :
#   · avant une carte, le doute : la caution (S0, 7), le petit salon (S1, 12), la séance du
#     conseil (S2, 15), le second solde (S2, 16), le dernier match (S2, 17) ;
#   · après, l'écho : les cendres de l'Est (S0, 9), la table qui reste rue Haute (S1, 17) ;
#   · un drapeau : la caution signée, que Camille range au cabinet (graine de l'huissier) ;
#   · l'entrée dans un lieu : le feu de palettes après l'incendie, l'agence après la seconde
#     maquette, le café de la Mairie la saison du vote ;
#   · un jour sans carte : le mardi où le téléphone beige ne sonne pas.
# Onze conversations, que la ville tient sans toi, du nom sur l'ardoise aux sacs de couchage
# du siège.
# Rien n'y décide : les décisions restent dans les cartes. Aucune ne dit qui est le Conseil
# avant que les cartes ne le disent (la cuillère, le stylo qui tape deux fois, l'en-tête du
# cabinet sont des graines, pas des aveux).
cinematiques:
  # ===================================================================== L'INTRODUCTION
  - id: h5.ci.intro
    quand: debut
    roles: [president]
    si: "flag(histoire_h5)"
    titre: "La Maquette"
    sous: "Aubérive, juillet 1999"
    lieu: buvette
    tranche: nuit
    suite: h5.ci.intro_2
    acteurs:
      - {qui: toi, place: porte}
      - {qui: gege, place: fond}
      - {id: ancien, qui: ancien, nom: "Un ancien de la Nord", place: zinc_1}
      - {id: abonne, qui: fan, nom: "Un abonné", place: table_2}
      - {id: patron, qui: commercant2, nom: "Le patron", place: barman}
    etapes:
      - {narration: "Premier juillet 1999, une heure du matin. La veille, à dix-sept heures, le Racing a déposé son bilan au greffe. À la buvette du kop, personne n'est rentré se coucher."}
      - {qui: toi, va: zinc_2}
      - {qui: ancien, dit: "Le tribunal veut un président demain avant midi, sinon il liquide. Deux titres au mur, et on liquide."}
      - {qui: patron, geste: dos}
      - {qui: abonne, dit: "Ils ont appelé quatre noms, cet après-midi. Les quatre ont raccroché avant la fin de la phrase."}
      - {qui: gege, regarde: toi}
      - {qui: gege, dit: "Il faudrait quelqu'un du virage. Quelqu'un qui a des grues, et une raison de s'en servir."}
      - {qui: ancien, emote: "..."}
      - {qui: gege, va: zinc_3}
      - {qui: gege, dit: "Ton père te portait sur ses épaules, dans la Nord, en 1953. Tu as pleuré au premier but. J'étais à côté ; j'avais dix ans."}
      - {qui: toi, pense: "Une lettre datée du 12 juin dort dans un tiroir de l'agence Tessandier. Le chantier pour l'entreprise, un stade neuf pour le club. Je peux tenir les deux."}
      - {narration: "Gégé efface du revers de la manche le prix du demi, sur l'ardoise. À la place, à la craie, il écrit ton nom."}
      - {qui: patron, dit: "Et le demi, je le vends combien, maintenant ?"}
      - {qui: gege, dit: "Le prix qu'il faudra.", ton: noir}
      - {narration: "Personne n'efface l'ardoise. Le patron sert la tournée suivante sans la marquer nulle part."}

  - id: h5.ci.intro_2
    quand: suite
    lieu: feu
    tranche: nuit
    suite: h5.ci.intro_3
    acteurs:
      - {qui: toi, place: porte}
      - {qui: vallin, place: [2, 1]}
      - {id: ombre, qui: passant, nom: "Une silhouette", place: [3, 3]}
    etapes:
      - {musique: sombre}
      - {narration: "Trois heures. La friche de l'usine, là où l'agence dessine un stade neuf. Des palettes brûlent dans un fût ; autour, des silhouettes qui se taisent quand tu approches."}
      - {qui: toi, va: [1, 2]}
      - {qui: ombre, dit: "Regarde, Didier : {pg, select, f{la patronne} other{le patron}} des grues vient voir son terrain."}
      - {qui: vallin, regarde: toi}
      - {qui: vallin, dit: "Les géomètres sont venus en juin. Ils ont posé leur trépied ici, contre le wagon. Et ils ont visé le stade, pas la friche."}
      - {qui: toi, pense: "Sur les plans de l'agence, le stade neuf a déjà ses projecteurs. Ils sont dessinés ici. Exactement ici."}
      - {narration: "Vallin pousse une palette dans le fût, du bout du pied. Les étincelles montent vers les lumières du pont."}
      - {qui: vallin, dit: "Ici, on ne construira rien. Les beaux terrains sont au bord de l'eau. Le tien, par exemple."}
      - {qui: vallin, geste: dos}
      - {pause: 1200}
      - {narration: "De l'autre côté de la Rive, la tribune Est découpe le ciel : du chêne de 1931, noir et sec. Il n'a pas plu depuis trois semaines."}
      - {fondu: "Le deux juillet, onze heures. Le tribunal de commerce n'a retenu qu'un nom."}

  - id: h5.ci.intro_3
    quand: suite
    lieu: clubhouse
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {qui: josiane, place: secretaire}
    etapes:
      - {musique: ville_jour}
      - {narration: "Le club-house, onze heures et demie. Sous verre, près de l'escalier : 1962, 1966. Sur le comptoir du secrétariat, une pile d'enveloppes rouges, rangées par date."}
      - {qui: toi, va: vitrine}
      - {qui: josiane, regarde: toi}
      - {qui: josiane, dit: "Bonjour, {toi}. Pardon : je ne l'avais jamais dit à quelqu'un du virage. Ça fait drôle dans la bouche.", ton: sourire}
      - {qui: josiane, geste: ecrit}
      - {qui: josiane, dit: "J'ai fait deux cafés. Le vôtre, et celui de la dame qui attend en haut depuis neuf heures. Elle n'a pas touché au sien."}
      - {narration: "Au plafond, un pas va de la fenêtre à la porte, et revient. Toujours le même nombre de pas."}
      - {qui: josiane, dit: "Elle a demandé les comptes de 1998. Je lui ai dit qu'ils étaient à la cave. Elle a répondu : je sais."}
      - {qui: toi, va: guichet}
      - {qui: josiane, dit: "Montez-lui quand même le café. Elle le refusera. Mais elle saura que vous l'avez monté."}
      - {narration: "Tu prends la tasse. Dans l'escalier, à chaque marche, le café tremble un peu plus."}

  # ===================================================================== SAISON 1 (1999-2000)
  # La caution (S0, 7) : le doute, à la banque, avant que Dorian fasse glisser la feuille.
  # La cuillère qu'on entend derrière la porte est celle du mardi (pr.h5.a2_mardi).
  - id: h5.ci.caution
    quand: carte
    cartes: [pr.h5.a3_caution]
    moment: avant
    roles: [president]
    si: "flag(histoire_h5)"
    lieu: banque
    tranche: matin
    acteurs:
      - {qui: toi, place: visiteur}
      - {id: guichetier, qui: commercant, nom: "Le guichetier", place: guichetier}
      - {id: boulangere, qui: passante, nom: "La boulangère", place: client_1}
    etapes:
      - {narration: "Banque Aubérivoise, neuf heures. Une plante verte, un guichet, et au fond une porte en verre dépoli : le bureau du directeur. On n'y voit que des ombres."}
      - {qui: toi, geste: assis}
      - {qui: guichetier, dit: "Monsieur Dorian finit son café. Il vous reçoit dans une minute. Il dit toujours une minute."}
      - {qui: boulangere, dit: "Les présidents à neuf heures, les boulangères à onze. Il a de l'ordre, le directeur."}
      - {qui: boulangere, regarde: toi}
      - {qui: boulangere, dit: "Vous êtes {pg, select, f{la fille} other{le fils}} de l'entrepreneur ? Votre père nous avait refait le toit pour rien, après la grêle de 1970."}
      - {qui: toi, pense: "La maison de la rue Haute. Il l'a payée en 1962, l'année du titre, avec l'argent de l'école qu'il venait de construire."}
      - {qui: guichetier, geste: ecrit}
      - {narration: "Derrière la porte en verre, une cuillère tinte contre une tasse, trois fois, puis s'arrête. Une chaise recule."}

  # La caution signée : le soir même, Camille la range au cabinet. L'huissier de la maison
  # (pr.h5.b6_huissier_maison) apportera l'en-tête de ce cabinet, une saison plus tard.
  - id: h5.ci.caution_classee
    quand: drapeau
    drapeau: h5_caution_signee
    roles: [president]
    si: "flag(histoire_h5)"
    lieu: appartement
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: camille, place: fauteuil}
    etapes:
      - {narration: "Le soir, rue Haute. La cuisine sent la soupe et le papier carbone. Sur la toile cirée, près du sel, la copie de la caution."}
      - {qui: toi, va: table_1}
      - {qui: camille, dit: "Tu as signé à quelle page ?"}
      - {qui: toi, pense: "Elle ne demande pas si j'ai signé. Elle demande où."}
      - {qui: camille, geste: lit}
      - {qui: camille, dit: "Celle-là, je la garde au cabinet. Ici, les papiers se perdent dans les factures du club."}
      - {narration: "Elle tapote deux fois la feuille avec son stylo, comme pour la réveiller, puis la glisse dans sa serviette de cuir, entre deux dossiers à d'autres noms."}
      - {qui: camille, dit: "Mange. Tu vas signer beaucoup de choses, cette année. Il faut des forces pour ça."}
      - {narration: "Elle ferme la serviette. Les deux fermoirs claquent l'un après l'autre, comme deux portes."}

  # Le feu (S0, 9) : le matin d'après, vu du terrain annexe. Ni le feu ni la main : la fumée,
  # les mots du lieutenant, et la place 14B qui n'existe plus (Paulette, à la grille, suit).
  - id: h5.ci.cendres
    quand: carte
    cartes: [pr.h5.a4_feu, pr.h5.a4_feu_plaque]
    moment: apres
    roles: [president]
    si: "flag(histoire_h5)"
    lieu: terrain
    tranche: matin
    meteo: pluie
    acteurs:
      - {qui: toi, place: porte}
      - {qui: vukic, place: [2, 1]}
      - {id: lieutenant, qui: passant, nom: "Le lieutenant des pompiers", place: [3, 3]}
      - {qui: gege, place: [0, 4], cache: true}
    etapes:
      - {musique: sombre}
      - {narration: "Six heures et demie. Derrière la haie de thuyas du terrain annexe, l'Est fume encore sous la pluie. Une odeur de chêne mouillé, de goudron, de laine brûlée."}
      - {qui: toi, va: [1, 2]}
      - {qui: lieutenant, dit: "Trois départs de feu, à trois bouts de la tribune. Le chêne de 1931 ne prend pas tout seul en trois endroits."}
      - {qui: vukic, geste: ecrit}
      - {qui: vukic, dit: "Trois heures dix, le premier camion. Trois heures quarante, le toit. Je l'ai noté au dos d'une feuille de match."}
      - {qui: lieutenant, dit: "Votre assureur passera dans la matinée. Dites-lui de venir en bottes."}
      - {qui: gege, entre: [1, 3]}
      - {narration: "Gégé arrive par le parking, noir de suie jusqu'aux sourcils. Il a passé la nuit à arroser la Nord avec les pompiers, pour qu'elle ne prenne pas."}
      - {qui: gege, dit: "Samedi, Paulette viendra à onze heures, avec son thermos, comme depuis 1951. La 14B, c'était du chêne aussi. Qui le lui dit ?"}
      - {qui: vukic, regarde: gege}
      - {qui: gege, geste: assis}
      - {narration: "Personne ne répond. Gégé s'est assis sur le banc des remplaçants, face à la fumée, comme on attend un train."}

  # Un mardi sans carte (S0) : dix-huit heures, et le téléphone beige ne sonne pas.
  - id: h5.ci.mardi_muet
    quand: semaine
    roles: [president]
    si: "flag(histoire_h5) && flag(h5_conseil_entendu) && jour == mar && saison == 1"
    titre: "Mardi, dix-huit heures"
    sous: "Le club-house"
    lieu: clubhouse
    tranches: [soir]
    tranche: soir
    acteurs:
      - {qui: toi, place: president}
      - {qui: josiane, place: secretaire}
      - {qui: vukic, place: visiteur_1, cache: true}
    etapes:
      - {narration: "Dix-sept heures cinquante-huit. Au club-house, personne ne fait semblant de travailler. Le téléphone beige attend sur le bureau, le fil enroulé trois fois."}
      - {qui: toi, geste: assis}
      - {qui: vukic, entre: visiteur_1}
      - {qui: vukic, dit: "Je suis venu pour l'heure, pas pour le téléphone. L'heure, je peux l'écrire."}
      - {qui: josiane, dit: "J'ai mis mon manteau. Si ça sonne, je pars. Si ça ne sonne pas, je pars aussi. Mais pas pareil."}
      - {pause: 2500}
      - {narration: "Dix-huit heures. La pendule du secrétariat frappe six coups. Le téléphone beige ne sonne pas."}
      - {pause: 2000}
      - {qui: vukic, geste: ecrit}
      - {qui: vukic, dit: "Dix-huit heures deux. Rien. Je l'écris quand même : rien, c'est une heure aussi."}
      - {qui: toi, pense: "Quelque part, une cuillère tourne dans une tasse. Le silence aussi, ça se commande."}
      - {narration: "Madame Josiane enlève son manteau, le plie sur le dossier de sa chaise, et se rassoit. Personne ne rentre avant sept heures."}

  # ===================================================================== SAISON 2 (2000-2001)
  # Le feu de palettes, la première fois qu'on y revient après l'Est, tant que Didier Vallin
  # n'a dit à personne ce qu'il a vu (son intrigue, pr.h5.vallin, et la mission du témoin).
  - id: h5.ci.palettes
    quand: lieu
    roles: [president]
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee) && !flag(h5_vallin_loge) && !flag(h5_vallin_dehors) && !flag(h5_temoin) && !mission(h5_temoin_feu)"
    lieu: feu
    tranche: nuit
    acteurs:
      - {qui: toi, place: porte}
      - {qui: vallin, place: [2, 1]}
      - {id: ombre, qui: passant, nom: "Une silhouette", place: [3, 3]}
      - {id: ombre2, qui: passante, nom: "Une autre silhouette", place: [0, 3]}
    etapes:
      - {narration: "Le feu de palettes, au milieu de la friche. Depuis l'Est, les silhouettes ont rapproché leurs caisses du fût. On y parle moins fort qu'en été."}
      - {qui: toi, va: [1, 2]}
      - {qui: ombre, dit: "Raconte ta nuit, Didier. La nuit de la tribune. Raconte-la, puisqu'on a du monde."}
      - {qui: vallin, geste: dos}
      - {qui: vallin, dit: "Ce que j'ai vu tient chaud. Je le garde pour l'hiver."}
      - {qui: ombre2, geste: rit}
      - {qui: ombre2, dit: "Il était dehors, cette nuit-là. Il est toujours dehors. C'est son métier, dehors."}
      - {qui: vallin, regarde: toi}
      - {qui: vallin, dit: "En juillet, tu cherchais un stade, ici. Il y en avait déjà un, au bord de l'eau. Il en reste les trois quarts."}
      - {narration: "Il jette une palette sur le feu. Les flammes montent d'un coup ; tout le monde recule d'un pas, sauf lui."}

  # Le petit salon (S1, 12) : vingt et une heures moins cinq, le hall de l'hôtel de la Rive.
  # La clé reste au tableau : c'est Sandrine qui la donnera, dans la carte.
  - id: h5.ci.salon
    quand: carte
    cartes: [pr.h5.b4_salon]
    moment: avant
    roles: [president]
    si: "flag(histoire_h5)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: sandrine, place: standard}
      - {qui: escande, place: reception}
      - {id: gris, qui: inconnu, nom: "Un homme en gris", place: bagages}
    etapes:
      - {narration: "Hôtel de la Rive, vingt et une heures moins cinq. Le hall sent la cire et le chauffage poussé trop fort. Au fond du couloir, sous la porte du petit salon, un trait de lumière."}
      - {narration: "Un homme en gris sort du couloir, le chapeau à la main. Il traverse le hall sans un regard pour personne."}
      - {qui: gris, sort: true}
      - {qui: toi, va: bagages}
      - {qui: escande, dit: "Le petit salon a été réservé lundi, par téléphone, au nom du club. Payé d'avance, en liquide, par coursier."}
      - {qui: sandrine, dit: "Le monsieur en gris en sort à l'instant. Il a demandé qu'on ne touche à rien, et qu'on laisse le chauffage."}
      - {qui: toi, pense: "Le mardi, une voix. Ce soir, une salle chauffée. Jamais un visage."}
      - {qui: escande, geste: dos}
      - {qui: escande, dit: "La clé, c'est Sandrine qui la tient. Le soir, personne d'autre ne touche au tableau."}
      - {narration: "Au fond du couloir, derrière la porte du petit salon, un déclic. Puis le souffle régulier d'une bande qui tourne, pour personne."}

  # La seconde maquette, vue de l'intérieur : la première fois qu'on pousse la porte de
  # l'agence après que le parc a mangé les tribunes (pr.h5.b2_maquette, S1, 4-5).
  - id: h5.ci.vitrine_parc
    quand: lieu
    roles: [president]
    si: "flag(histoire_h5) && flag(h5_maquette_change) && !flag(h5_tessandier_silence) && !flag(h5_tessandier_aveu)"
    lieu: agence
    tranche: aprem
    acteurs:
      - {qui: toi, place: porte}
      - {qui: tessandier, place: tessandier}
      - {id: acheteur, qui: passant, nom: "Un acheteur", place: client_1}
      - {id: acheteuse, qui: passante, nom: "Sa femme", place: visiteur}
    etapes:
      - {narration: "L'agence Tessandier, un après-midi. Un couple de Portclair penché sur la maquette : la seconde tranche, et à la place des tribunes, un parc en mousse, des bancs, un petit lac."}
      - {qui: acheteuse, dit: "Et le samedi, le bruit ? Mon mari a le sommeil léger, même l'après-midi."}
      - {qui: tessandier, dit: "Il n'y aura plus de samedi, madame. Il y aura des dimanches.", ton: sourire}
      - {qui: acheteur, geste: pointe}
      - {qui: acheteur, dit: "Le petit lac, là. C'est là qu'est le terrain, aujourd'hui ?"}
      - {qui: tessandier, regarde: toi}
      - {qui: tessandier, dit: "Aujourd'hui, oui. Demandez à {toi}, qui vient d'entrer : son entreprise connaît ce terrain mieux que nous."}
      - {qui: acheteur, emote: "?"}
      - {qui: toi, pense: "Ils me regardent comme on regarde {pg, select, f{une vendeuse} other{un vendeur}}. Devant cette vitrine, c'est peut-être ce que je suis."}
      - {narration: "La femme pose le doigt sur le petit lac en résine, là où devrait être le rond central. Sa trace reste sur le plexiglas, ronde, comme une buée."}

  # L'huissier de la maison (S1, 17) : la nuit d'après, rue Haute. Ce qui reste, et à qui.
  - id: h5.ci.table
    quand: carte
    cartes: [pr.h5.b6_huissier_maison]
    moment: apres
    roles: [president]
    si: "flag(histoire_h5)"
    lieu: appartement
    tranche: nuit
    acteurs:
      - {qui: toi, place: milieu}
      - {qui: camille, place: table_1}
    etapes:
      - {narration: "Minuit, rue Haute. Les déménageurs ont emporté le buffet, les fauteuils, la pendule du couloir. Il reste la table de la cuisine, deux chaises, et le téléphone."}
      - {qui: camille, dit: "Ils ont laissé la table. Elle était à moi avant la maison. C'est écrit quelque part, dans leur inventaire."}
      - {qui: toi, va: table_2}
      - {qui: camille, geste: boit}
      - {qui: toi, pense: "Elle sait ce qui est écrit, et où. Elle a toujours su où c'était écrit."}
      - {qui: camille, dit: "Le buffet de ta mère passe aux enchères jeudi. Je peux le faire racheter. Personne ne saura que c'est nous."}
      - {qui: toi, emote: "..."}
      - {qui: camille, dit: "Ne réponds pas ce soir. Réponds quand tu auras dormi."}
      - {narration: "Elle éteint le plafonnier. Il ne reste que la petite lumière verte du répondeur, sur le mur nu où pendait la pendule."}

  # ===================================================================== SAISON 3 (2001-2002)
  # Le café de la Mairie, la saison du vote, avant la séance : on y compte les voix sur une
  # serviette en papier, et Lambert ne se laisse pas compter.
  - id: h5.ci.serviette
    quand: lieu
    roles: [president]
    si: "flag(histoire_h5) && saison == 3 && !flag(h5_acte_lu) && !flag(h5_projet_soutenu) && !flag(h5_sursis) && !flag(h5_une_voix)"
    lieu: cafe_mairie
    tranche: midi
    acteurs:
      - {qui: toi, place: porte}
      - {id: conseiller, qui: passant, nom: "Un conseiller municipal", place: comptoir_1}
      - {id: lambert, qui: ancien, nom: "Lambert", place: table_1}
      - {id: patron, qui: commercant2, nom: "Le patron", place: patron}
    etapes:
      - {narration: "Le café de la Mairie, midi. Au comptoir, les conseillers municipaux boivent debout. Sur une serviette en papier, quelqu'un a tiré deux colonnes au stylo."}
      - {qui: conseiller, dit: "Dix-sept pour la révision, seize contre. Lambert fait dix-sept ou seize, selon le temps qu'il fait."}
      - {qui: patron, geste: rit}
      - {qui: lambert, dit: "Ma voix ne tient pas sur une serviette. Elle tient dans une urne, le jour dit, et pas avant."}
      - {qui: conseiller, regarde: toi}
      - {qui: conseiller, dit: "Tiens, le Racing. On parlait de la pluie."}
      - {narration: "Le patron ramasse la serviette aux deux colonnes, la plie en quatre, et la glisse dans la poche de son tablier."}
      - {qui: lambert, regarde: toi}
      - {narration: "Lambert finit son café sans te quitter des yeux, lentement, comme on finit une phrase qu'on ne dira pas."}

  # Le conseil municipal (S2, 15) : dix minutes avant le point six. Rien n'y présume de ce
  # qu'on a en poche (l'acte de 1931, la promesse de Lambert, ou rien).
  - id: h5.ci.seance
    quand: carte
    cartes: [pr.h5.c3_conseil_acte, pr.h5.c3_conseil_lambert, pr.h5.c3_conseil_libre, pr.h5.c3_conseil]
    moment: avant
    roles: [president]
    si: "flag(histoire_h5)"
    titre: "Point six"
    sous: "Mairie d'Aubérive, la salle du conseil"
    lieu: mairie
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {id: huissier, qui: portier, nom: "L'huissier de la mairie", place: huissier}
      - {qui: tessandier, place: visiteur}
      - {qui: gege, place: couloir, cache: true}
    etapes:
      - {narration: "Dix-neuf heures quarante. Point six de l'ordre du jour : révision du terrain de la Rive. En bas des marches, la Nord attend sous les réverbères, sans un chant."}
      - {qui: toi, va: couloir}
      - {qui: huissier, dit: "Le point six passe après la pause. Le maire fait dire qu'il ne veut pas de chants, ni dedans ni dehors."}
      - {qui: tessandier, regarde: toi}
      - {qui: tessandier, dit: "Votre virage est bien élevé, ce soir. On l'entend respirer d'ici.", ton: sourire}
      - {qui: gege, entre: centre}
      - {qui: gege, dit: "Trois cents, en bas. On a voté de se taire. Si tu parles, ils t'entendront. Si tu te tais, ils t'entendront aussi.", ton: noir}
      - {qui: tessandier, geste: lit}
      - {qui: toi, pense: "Dans ma poche, j'ai ce que j'ai. Ni plus, ni moins. Ils voteront dans dix minutes."}
      - {qui: gege, sort: true}
      - {narration: "L'huissier agite une clochette de cuivre. La salle se lève pour le maire ; Madame Tessandier la dernière, sans hâte."}

  # Le second solde (S2, 16) : le lendemain du conseil, Madame Josiane range les chemises
  # dans l'ordre. Ce qu'on a, et ce qu'on n'a pas : la carte dira ce que Vialat en compte.
  - id: h5.ci.chemises
    quand: carte
    cartes: [pr.h5.c4_solde_tout, pr.h5.c4_solde_lettre, pr.h5.c4_solde_un, pr.h5.c4_solde]
    moment: avant
    roles: [president]
    si: "flag(histoire_h5)"
    lieu: clubhouse
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {qui: josiane, place: secretaire}
    etapes:
      - {narration: "Le lendemain du conseil, neuf heures et demie. Madame Josiane a vidé la table de réunion. Elle y aligne des chemises de couleur, au cordeau, comme des marches."}
      - {qui: toi, va: conseil_1}
      - {qui: josiane, dit: "Elle a dit : dans l'ordre. Je les ai rangées par dates. C'est le seul ordre qui ne se discute pas."}
      - {qui: josiane, geste: ecrit}
      - {qui: josiane, dit: "Il y a ce que nous avons, {toi}. Il n'y a pas ce que nous n'avons pas. Elle comptera les deux."}
      - {qui: toi, pense: "Elle dit « nous ». Comme on le dit au virage."}
      - {narration: "Par la fenêtre, une femme remonte la rue du Stade, un sac à l'épaule. Elle ne regarde pas les vitrines. Elle compte ses pas."}
      - {qui: josiane, dit: "Dix heures moins trois. Je monte deux cafés. Le sien, elle ne le boira pas : ça fait trois ans."}
      - {qui: josiane, va: cafe}

  # Le dernier match (S2, 17) : midi, à la buvette. Paulette ira dans la Nord ; rien ne dit
  # encore ce qu'on lira sur la bâche de Gégé.
  - id: h5.ci.thermos
    quand: carte
    cartes: [pr.h5.c5_match_stade, pr.h5.c5_match_terrasses, pr.h5.c5_match_sursis, pr.h5.c5_match]
    moment: avant
    roles: [president]
    si: "flag(histoire_h5)"
    titre: "Le dernier match"
    sous: "La buvette du kop, midi"
    lieu: buvette
    tranche: midi
    acteurs:
      - {qui: toi, place: porte}
      - {qui: gege, place: fond}
      - {qui: paulette, place: zinc_1}
      - {id: patron, qui: commercant2, nom: "Le patron", place: barman}
    etapes:
      - {narration: "Le jour du dernier match. La buvette ouvre à midi ; Paulette est là depuis onze heures, son thermos vide posé sur le zinc."}
      - {qui: toi, va: table_1}
      - {qui: patron, dit: "Je remplis son thermos pour rien depuis le feu. Elle me paie en dates : 1951, 1962, 1966. Ça me suffit."}
      - {qui: paulette, regarde: toi}
      - {qui: paulette, dit: "Aujourd'hui, je m'assieds dans la Nord. On m'a dit qu'à quatre-vingt-trois ans, on avait le droit.", ton: sourire}
      - {qui: gege, va: zinc_2}
      - {qui: gege, dit: "Je vous ai gardé la marche à côté de la mienne. Elle est froide ; j'ai mis un coussin."}
      - {qui: paulette, dit: "Pas à côté. Devant. Je veux voir l'Est en entier, ce qu'il en reste."}
      - {qui: gege, geste: tete_basse}
      - {qui: gege, dit: "Devant, alors. Personne ne s'est jamais mis devant vous depuis 1951. On ne va pas commencer aujourd'hui."}
      - {narration: "Gégé prend le thermos sous un bras, le coussin sous l'autre. Paulette prend son bras à lui. Ils sortent sans attendre personne."}
      - {qui: paulette, sort: true}
      - {qui: gege, sort: true}

# ===================================================================== LES CONVERSATIONS
# Ce qu'on surprend en passant : la ville parle du club, du feu, de la vase, de l'argent, sans
# jamais s'adresser au héros. Les voix sont des gens sans nom, ou les visages du livre.
conversations:
  # La première saison, avant le feu : le nom sur l'ardoise de la buvette.
  - id: h5.cv.ardoise
    roles: [president]
    si: "flag(histoire_h5) && saison == 1 && !flag(h5_tribune_est_brulee)"
    lieu: buvette
    tranches: [soir, nuit]
    qui:
      - {id: abonne, qui: fan, nom: "Un abonné", place: zinc_1}
      - {id: ancien, qui: ancien, nom: "Un ancien", place: zinc_2}
    repliques:
      - {qui: abonne, dit: "Gégé n'a pas effacé le nom sur l'ardoise. Le patron écrit le prix du demi en dessous, en plus petit."}
      - {qui: ancien, dit: "Quelqu'un du virage à la présidence. Avec des grues. Les grues, ça construit ou ça démolit."}
      - {qui: abonne, dit: "Ça dépend de qui tient la manette."}
      - {qui: ancien, dit: "Ça dépend surtout de qui paie le grutier. Remets-nous deux demis ; on verra au printemps."}

  # Le téléphone beige, après le premier mardi (pr.h5.a2_mardi).
  - id: h5.cv.beige
    roles: [president]
    si: "flag(histoire_h5) && flag(h5_conseil_entendu)"
    lieu: clubhouse
    tranches: [aprem]
    qui:
      - {qui: josiane, place: secretaire}
      - {qui: vukic, place: cafe}
    repliques:
      - {qui: vukic, dit: "La porte du bureau s'est fermée à six heures moins cinq. Rouverte à six heures deux. Personne n'a parlé fort."}
      - {qui: josiane, dit: "Le téléphone beige n'est pas au standard. Je l'ai fait vérifier en 1993 ; le technicien a dit qu'il n'existait pas."}
      - {qui: vukic, dit: "Un téléphone qui n'existe pas, et qui sonne à l'heure. Je l'écris comment, dans le cahier ?"}
      - {qui: josiane, dit: "Écrivez l'heure, seulement. Les heures, on peut toujours les montrer à un juge."}

  # Après le feu : la buvette parle de l'Est et de Paulette.
  - id: h5.cv.suie
    roles: [president]
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee) && saison == 1"
    lieu: buvette
    tranches: [soir]
    qui:
      - {id: ancien, qui: ancien, nom: "Un ancien", place: zinc_1}
      - {id: abonne, qui: fan, nom: "Un abonné", place: zinc_2}
    repliques:
      - {qui: ancien, dit: "Les pompiers ont arrosé la Nord toute la nuit. Pas l'Est. L'Est, ils l'ont regardée."}
      - {qui: abonne, dit: "Mon beau-frère est pompier. Trois départs de feu, il dit. Le chêne ne prend jamais en trois endroits sans aide."}
      - {qui: ancien, dit: "Le chêne, non. Les gens, oui."}
      - {qui: abonne, dit: "Paulette est venue samedi, à onze heures, comme avant. Elle s'est assise sur une barrière de chantier."}
      - {qui: ancien, dit: "Ne lui dis pas qu'on l'a vue. Elle voulait être seule à le savoir."}

  # La vase (pr.h5.b1_vase) : le quai en parle le lendemain.
  - id: h5.cv.berline
    roles: [president]
    si: "flag(histoire_h5) && flag(h5_rive_voiture)"
    lieu: kiosque
    tranches: [matin]
    qui:
      - {id: kiosquier, qui: commercant, nom: "Le kiosquier", place: porte}
      - {id: plongeur, qui: passant, nom: "Un plongeur des berges", place: [2, 1]}
    repliques:
      - {qui: kiosquier, dit: "Dix ans au fond, sous mon kiosque, et pas un poisson dedans. Même les poissons n'en voulaient pas."}
      - {qui: plongeur, dit: "On cherchait le fond pour les berges. On a trouvé un sapin en carton. La procureure l'a mis dans un sac, avec des gants."}
      - {qui: kiosquier, dit: "Un entraîneur de 1990, il paraît. Parti un soir d'hiver. Sa voiture, elle, n'était pas partie bien loin."}
      - {qui: plongeur, dit: "Le chantier est gelé jusqu'à nouvel ordre. On est payés quand même : c'est la première épave qui paie mes heures."}

  # Le capot (pr.h5.ev.capot) : VENDU, au pochoir.
  - id: h5.cv.pochoir
    roles: [president]
    si: "flag(histoire_h5) && flag(h5_capot) && !flag(h5_engins_saisis)"
    lieu: voiture
    tranches: [matin, aprem]
    qui:
      - {id: garagiste, qui: garagiste, nom: "Le garagiste du Pont", place: [1, 1]}
      - {id: gamin, qui: enfant, nom: "Un gamin", place: [2, 2]}
    repliques:
      - {qui: gamin, dit: "Les lettres sont toutes pareilles. Mon cousin dit que la Nord n'a pas de pochoir."}
      - {qui: garagiste, dit: "La Nord écrit à la main, et elle fait des fautes. Ça, c'est propre comme une enseigne de magasin."}
      - {qui: gamin, dit: "Vendu quoi ?"}
      - {qui: garagiste, dit: "Ça, petit, c'est justement ce qu'ils n'ont pas écrit."}

  # L'huissier du club (pr.h5.ev.huissier_club) : les pastilles rouges.
  - id: h5.cv.pastilles
    roles: [president]
    si: "flag(histoire_h5) && flag(h5_huissier_club)"
    lieu: clubhouse
    tranches: [matin]
    qui:
      - {qui: josiane, place: secretaire}
      - {id: intendant, qui: passant, nom: "L'intendant", place: guichet}
    repliques:
      - {qui: intendant, dit: "La pastille rouge du photocopieur, je peux la décoller ? Elle gêne pour appuyer sur le bouton vert."}
      - {qui: josiane, dit: "Laissez-la. Une pastille décollée, c'est un délit. Une pastille qui gêne, c'est une habitude à prendre."}
      - {qui: intendant, dit: "Et les maillots de samedi ? Ils sont dans la machine."}
      - {qui: josiane, dit: "La loi dit qu'on ne vend pas. Elle ne dit pas qu'on ne lave pas. Lavez, et pliez bien."}

  # La grève payée de sa poche (pr.h5.b3_greve) : les chèques signés sur un capot.
  - id: h5.cv.cheques
    roles: [president]
    si: "flag(histoire_h5) && flag(h5_greve_payee)"
    lieu: terrain
    tranches: [matin]
    qui:
      - {qui: dembo, place: [1, 1]}
      - {id: defenseur, qui: passant, nom: "Un défenseur", place: [3, 2]}
    repliques:
      - {qui: defenseur, dit: "Mon chèque a été signé sur un capot. La signature saute, là où passe la nervure de la tôle."}
      - {qui: dembo, dit: "J'ai joué pour des présidents qui signaient sur des notes de frais. Jamais sur le capot de leur voiture, dans un parking."}
      - {qui: defenseur, dit: "Ce n'est pas l'argent du club, c'est le sien. Ça se voit au chèque : pas d'écusson, juste un nom."}
      - {qui: dembo, dit: "Alors samedi, on court pour le nom."}

  # Le petit salon (pr.h5.b4_salon), la cassette emportée : l'hôtel en parle à mi-voix.
  - id: h5.cv.pourboire
    roles: [president]
    si: "flag(histoire_h5) && flag(h5_cassette)"
    lieu: hotel
    tranches: [soir]
    qui:
      - {qui: escande, place: reception}
      - {qui: sandrine, place: standard}
    repliques:
      - {qui: escande, dit: "Le magnétophone du petit salon est revenu sans sa bande. Le monsieur ne la réclamera pas ; il ne réclame jamais rien."}
      - {qui: sandrine, dit: "Il m'a laissé un pourboire, le soir du salon. Il savait mon prénom. Je ne le lui avais pas dit."}
      - {qui: escande, dit: "Tout le monde sait votre prénom, Sandrine. Vous le dites au téléphone deux cents fois par jour."}
      - {qui: sandrine, dit: "Je dis « Hôtel de la Rive, bonsoir ». Je ne dis jamais mon prénom. Jamais."}

  # La SCI Rive Gauche (pr.h5.sci) : deux noms, et un tampon.
  - id: h5.cv.tampon
    roles: [president]
    si: "flag(histoire_h5) && flag(h5_sci_deux) && !flag(h5_sci_trois)"
    lieu: echo
    tranches: [aprem, soir]
    qui:
      - {qui: lea, place: journaliste}
      - {id: redac, qui: passant, nom: "Le rédacteur en chef", place: redacteur}
    repliques:
      - {qui: redac, dit: "Deux noms et un point d'interrogation, c'est un titre. Trois noms, c'est un procès. Tu as le troisième ?"}
      - {qui: lea, dit: "J'ai un mot souligné sur une photocopie du registre : tampon. Il me manque ce qu'il y a sous l'encre."}
      - {qui: redac, dit: "Ne cherche pas trop près du club. Le club, c'est la moitié de nos lecteurs, et l'autre moitié le déteste."}
      - {qui: lea, dit: "Je cherche où le tampon me mène. S'il mène au club, je changerai de moitié."}

  # Six heures du matin (pr.h5.ev.six_heures) : le palais en parle au comptoir.
  - id: h5.cv.douze_juin
    roles: [president]
    si: "flag(histoire_h5) && flag(h5_perquisition)"
    lieu: cafe_mairie
    tranches: [midi]
    qui:
      - {id: greffier, qui: passant, nom: "Un greffier du palais", place: comptoir_1}
      - {id: patron, qui: commercant2, nom: "Le patron", place: patron}
    repliques:
      - {qui: greffier, dit: "La procureure était devant le dépôt à six heures moins deux. Elle a attendu dans sa voiture que la minute tombe."}
      - {qui: patron, dit: "Comme tous les matins sous l'horloge de la place. Elle attend toujours l'heure exacte."}
      - {qui: greffier, dit: "Le contrat des Terrasses était daté du 12 juin. Elle a lu la date à voix haute, deux fois."}
      - {qui: patron, dit: "Le 12 juin ? Le Racing n'avait pas encore de président, le 12 juin."}
      - {qui: greffier, dit: "C'est ce qu'elle a dit. Puis elle a demandé un café, et elle ne l'a pas bu."}

  # Le siège (pr.h5.ev.siege) : le kop dort au club-house jusqu'au vote.
  - id: h5.cv.sacs
    roles: [president]
    si: "flag(histoire_h5) && flag(h5_siege)"
    lieu: clubhouse
    tranches: [soir]
    qui:
      - {id: gamin, qui: fan, nom: "Un gamin du kop", place: conseil_1}
      - {id: supportrice, qui: passante, nom: "Une supportrice", place: conseil_2}
    repliques:
      - {qui: gamin, dit: "Josiane a compté les sacs de couchage ce matin. Quarante. Elle a écrit trente-neuf dans le registre."}
      - {qui: supportrice, dit: "Pourquoi trente-neuf ?"}
      - {qui: gamin, dit: "Pour qu'on ne puisse pas dire qu'elle nous a comptés."}
      - {qui: supportrice, dit: "Gégé dort sous le clou de la photo. Il dit que de là, on entend sonner le téléphone beige, le mardi."}
      - {qui: gamin, dit: "Il ne sonne plus depuis qu'on est là. Même les fantômes ont des horaires de bureau."}
