# Histoire 6 — « 23 h 58 » : les scènes jouées et les conversations surprises
# (format : docs/histoires/scenes_jouees.md). Une scène jouée ne se joue pas, on
# la regarde ; une conversation s'entend en passant près de ceux qui parlent.
# La directrice sportive (ou le directeur : la carrière choisit, les textes
# accordent), 2003-2006.
#
# Ce que ces scènes font du livre, sans rien y décider :
#   · l'introduction (la veille de la page deux : la gare routière, le
#     club-house la nuit, la première nuit rue des Lilas) plante trois graines
#     que les cartes paient plus tard : le trousseau de Josiane auquel il manque
#     une clé depuis juin (la ligne de la buanderie, saison 3), la petite
#     voiture grise garée en marche arrière (le soir du 31 janvier), le fax du
#     salon dont tu n'as donné le numéro à personne (la page blanche, saison 2).
#     Le stagiaire y passe, poli, sans nom, avec son visage (on le reconnaîtra
#     à la carte du stagiaire) : on le voit partout, on ne le regarde jamais ;
#   · avant une carte, le doute : le café de la Mairie avant la gourmette, la
#     pluie avant les lacets, le hall avant Valentienne, la dictée avant la
#     doudoune, le crayon de Vialat, la tasse de trop avant le fax du petit
#     Rancé, le tapis vert, la rampe tiède avant 23 h 57, le café froid avant
#     une heure du matin ;
#   · après, ce que les autres en disent : le casier du petit Rancé, le carton
#     scellé de l'audit ;
#   · aucune ne dit qui écrit les fax. Elles montrent ce que les cartes
#     prouveront.
# Les acteurs `sans_*` (cachés, sans aucune étape) vident la pièce : la ville y
# laisse sinon les habitués et les clients de l'heure qu'il est en ville (pas de
# celle de la scène), et Josiane serait au secrétariat à minuit. Un habitué ne
# quitte sa place que si un acteur de la scène porte le même `qui` ; le
# personnel parle par la bouche `commercant`.
# `saison` est celle de la ville : 1 = 2003-2004, 2 = 2004-2005, 3 = 2005-2006.
cinematiques:
  # ══════════════════════════════════════════════════════ l'introduction
  - id: h6.ci.intro
    quand: debut
    roles: [ds]
    si: "flag(histoire_h6)"
    titre: "23 h 58"
    sous: "Aubérive, août 2003"
    lieu: gareRoutiere
    tranche: nuit
    suite: h6.ci.intro_2
    acteurs:
      - {qui: toi, place: quai}
      - {qui: barbier, place: banc_2}
      - {id: guichetier, qui: commercant, nom: "Le guichetier", place: guichetier}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {musique: ville_nuit}
      - {narration: "Le dernier car de la Capitale entre en gare à 22 h 50. Un abri, un distributeur qui ronronne et, sur un banc, un vieil homme en doudoune, au mois d'août."}
      - {qui: barbier, dit: "Bonsoir, {toi}.", ton: sourire}
      - {qui: toi, pense: "Il y a dix ans, il m'appelait {pg, select, f{« la petite »} other{« le petit »}} et m'envoyait voir les matchs de district sous la grêle."}
      - {qui: toi, va: banc_3}
      - {qui: barbier, dit: "Ils ont vendu le car du club en mai. Le gardien remplaçant, le minibus du centre. Ici, on vend tout ce qui roule, et tout ce qui court."}
      - {qui: guichetier, dit: "Je ferme. Le prochain car, c'est demain, six heures vingt."}
      - {qui: guichetier, sort: true}
      - {qui: barbier, dit: "Trente millions de ventes par an : c'est écrit dans ton contrat. Je ne l'ai pas lu. On me l'a lu."}
      - {qui: barbier, dit: "Demain, le fils Vaubourg te fait signer. Prends ton temps. Chez eux, c'est toujours la page d'après qui coûte."}
      - {qui: toi, pense: "Le Rideau Rouge est à deux rues. Quatre ans que je n'en ai pas poussé la porte. Ce soir encore, on fera le tour par le quai."}
      - {qui: barbier, va: quai}
      - {qui: barbier, dit: "Je prends la petite valise. La grande, tu la portes : c'est toi {pg, select, f{la patronne} other{le patron}}, maintenant.", ton: sourire}
      - {qui: barbier, sort: true}

  - id: h6.ci.intro_2
    quand: suite
    lieu: clubhouse
    tranche: nuit
    suite: h6.ci.intro_3
    acteurs:
      - {qui: toi, place: porte}
      - {qui: barbier, place: vitrine, cache: true}
      - {id: garcon, qui: ferlac, nom: "Un garçon en pull", place: secretaire, pose: assis}
      - {id: sans_josiane, qui: josiane, cache: true}
      - {id: sans_arnaud_vaubourg, qui: arnaud_vaubourg, cache: true}
      - {id: sans_aulard, qui: aulard, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
      - {id: sans_commercant, qui: commercant, cache: true}
    etapes:
      - {narration: "Le club-house, onze heures moins le quart. Une seule lampe au rez-de-chaussée, celle du secrétariat. Quelqu'un y tape à la machine, régulier comme une pendule."}
      - {qui: barbier, entre: vitrine}
      - {qui: toi, va: centre}
      - {qui: barbier, dit: "Deux titres et une coupe. Tout ce qu'on n'a jamais réussi à vendre est derrière cette vitre."}
      - {qui: garcon, geste: debout}
      - {qui: garcon, va: guichet}
      - {qui: garcon, dit: "Bonsoir, monsieur Barbier. Bonsoir, {pg, select, f{madame la directrice} other{monsieur le directeur}}. Laissez la lumière : je repasse l'éteindre.", ton: sourire}
      - {qui: garcon, sort: true}
      - {qui: toi, pense: "Il connaît mon titre. Je ne l'ai pas encore signé."}
      - {qui: barbier, dit: "L'Écho a passé ta photo jeudi, en page sport. Ici, ta photo, tout le monde l'a déjà vue."}
      - {qui: barbier, regarde: toi}
      - {qui: barbier, dit: "Josiane m'a prêté son trousseau pour la visite. Elle compte ses clés tous les soirs. Il lui en manque une depuis juin. Elle n'a jamais rien perdu."}
      - {narration: "Dehors, sur le parking, une seule voiture : une petite grise, garée en marche arrière, prête à partir. Personne dedans."}

  - id: h6.ci.intro_3
    quand: suite
    lieu: appartement
    tranche: nuit
    acteurs:
      - {qui: toi, place: porte}
      - {qui: aulard, cache: true}
    etapes:
      - {narration: "Rue des Lilas, deux pièces au troisième. Des cartons qu'on ouvrira plus tard, un fax sur la commode que l'ancien locataire a laissé branché, un réveil qui clignote sur 00:00."}
      - {qui: toi, va: table_1}
      - {son: alarme}
      - {narration: "Le téléphone. 23 h 47. Ce numéro-là, tu ne l'as donné qu'à la Ligue."}
      - {qui: toi, va: telephone}
      - {qui: toi, geste: telephone}
      - {qui: aulard, dit: "Jean-Marie Vaubourg. Je vous appelle de la Ligue : à cette heure-ci, le standard dort, et moi je travaille."}
      - {qui: aulard, dit: "Mon fils vous fera signer demain. Il signe toujours où je lui dis. Vous, vous vendrez où je vous dis ?"}
      - {qui: toi, pense: "Il n'attend pas de réponse. Il écoute si je respire."}
      - {qui: aulard, dit: "Le Racing ne fabrique plus que des joueurs. Vendez-les bien, {toi}. Bonne nuit."}
      - {qui: toi, geste: debout}
      - {musique: sombre}
      - {narration: "Il a raccroché le premier. Tu règles le réveil sur la pendule de la cuisine. Les chiffres cessent de clignoter : 23:58."}
      - {pause: 1800}
      - {narration: "Sur la commode, le voyant du fax reste vert. Ce numéro-là, tu ne l'as donné à personne."}

  # ═══════════════════════════════════════════ saison 1 (2003-2004) — le premier nom
  # Avant la gourmette (scène 5) : la photo a sonné à 23 h 58, et midi arrive.
  # Les deux variantes tiennent : Fardelli entre et s'assied à ta table, qu'on
  # se soit donné rendez-vous ou non.
  - id: h6.ci.cafe
    quand: carte
    cartes: [ds.h6.photo.gourmette, ds.h6.photo.gourmette_malbec]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h6)"
    lieu: cafe_mairie
    tranche: midi
    acteurs:
      - {qui: toi, place: porte}
      - {id: patron, qui: commercant, nom: "Le patron", place: patron}
      - {id: conseiller, qui: ancien, nom: "Un conseiller municipal", place: comptoir_1}
      - {id: adjoint, qui: passant, nom: "Un autre conseiller", place: comptoir_2}
      - {qui: fardelli, place: fardelli, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Le café de la Mairie, midi. Les conseillers municipaux prennent l'apéritif au comptoir. La télé, sans le son, montre des joueurs qui posent avec un maillot neuf."}
      - {qui: toi, va: table_1}
      - {qui: conseiller, dit: "Vingt et un millions de ventes en juin, sans personne au recrutement. Avec {pg, select, f{une directrice} other{un directeur}}, ils finiront par vendre les projecteurs."}
      - {qui: adjoint, dit: "Moins fort. {pg, select, f{Elle est assise} other{Il est assis}} sous la photo du maire."}
      - {qui: conseiller, regarde: toi}
      - {qui: fardelli, entre: table_2}
      - {qui: conseiller, emote: "..."}
      - {qui: fardelli, dit: "Deux cafés, Marcel. Et la tournée de ces deux-là : ils ont assez travaillé pour la ville, aujourd'hui.", ton: sourire}
      - {qui: conseiller, geste: dos}
      - {qui: patron, dit: "Tout de suite, monsieur Fardelli."}
      - {narration: "Sa gourmette tinte contre la soucoupe. Le patron baisse le son de la télé, qui n'en avait pas."}

  # Un matin sans carte : le rite de Josiane, et le stagiaire qui propose de
  # l'aider. Elle range la seconde copie dans la poche de son gilet (le fax du
  # petit Rancé, la saison d'après, et le second classeur, la dernière).
  - id: h6.ci.photocopies
    quand: semaine
    roles: [ds]
    si: "flag(histoire_h6) && flag(h6_photocopies) && saison <= 2"
    lieu: clubhouse
    tranches: [matin]
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {qui: josiane, place: secretaire}
      - {qui: ferlac, place: cafe, cache: true}
      - {id: sans_arnaud_vaubourg, qui: arnaud_vaubourg, cache: true}
      - {id: sans_aulard, qui: aulard, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Le secrétariat, sept heures. La photocopieuse chauffe depuis six heures et demie. Madame Josiane pose la page de la nuit sous le capot, la tient à plat d'une main, appuie."}
      - {qui: toi, va: guichet}
      - {qui: josiane, geste: ecrit}
      - {qui: ferlac, entre: cafe}
      - {qui: ferlac, dit: "Bonjour, madame Josiane. Laissez, je vous les fais : vous avez les licences à finir avant midi.", ton: sourire}
      - {qui: josiane, dit: "C'est gentil, Joachim. Ce papier-là, je le fais moi-même. Il est fragile ; il n'aime pas les mains qu'il ne connaît pas."}
      - {qui: ferlac, dit: "Comme vous voudrez. Bonjour, {toi}. Votre café est sur votre bureau ; il refroidit."}
      - {qui: ferlac, sort: true}
      - {qui: josiane, regarde: toi}
      - {qui: josiane, dit: "Il sait comment vous prenez votre café. Moi, je ne le sais pas encore."}
      - {narration: "Elle range une copie au classeur, plie l'autre en quatre et la glisse dans la poche de son gilet."}

  # Avant les lacets (scène 6) : janvier, la pluie, la rumeur de Valentienne.
  # Vogler est encore là ; il part pour la Vestrie à l'été.
  - id: h6.ci.lacets
    quand: carte
    cartes: [ds.h6.sc.lacets, ds.h6.sc.lacets_signe]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h6)"
    lieu: terrain
    tranche: matin
    meteo: pluie
    acteurs:
      - {qui: toi, place: porte}
      - {qui: klopf, place: [3, 1]}
      - {qui: vukic, place: [1, 2]}
      - {qui: dembo, place: [3, 3], cache: true}
    etapes:
      - {narration: "Le terrain annexe, un matin de janvier. Il pleut depuis la veille ; les plots flottent dans les flaques. Vogler court quand même, la casquette à l'envers."}
      - {qui: toi, va: [1, 1]}
      - {qui: vukic, dit: "Le chauffeur de Malbec a déjeuné hier à la brasserie du Pont. Il a demandé l'adresse du capitaine. Pas celle du club : la sienne."}
      - {qui: klopf, dit: "Si on me prend Dembo en janvier, je finis la saison avec des gamins et un droitier qui joue à gauche.", geste: poing}
      - {qui: vukic, regarde: toi}
      - {qui: vukic, dit: "Il est arrivé avant moi, ce matin. Il n'arrive jamais avant moi."}
      - {qui: dembo, entre: [3, 3]}
      - {qui: klopf, dit: "Je te laisse lui parler, {toi}. Moi, je lui dirais tout, et ce n'est pas à moi de le dire."}
      - {qui: klopf, sort: true}
      - {qui: vukic, sort: true}
      - {qui: toi, pense: "Vingt ans qu'on se connaît. Il n'a jamais mis si longtemps à faire un nœud."}

  # Avant Valentienne (fin de saison) : le hall de l'hôtel, deux feuilles à
  # l'envers, un sac de sport. Malbec ne sait pas qui lui souffle les prix.
  - id: h6.ci.hall
    quand: carte
    cartes: [ds.h6.sc.valentienne, ds.h6.sc.valentienne_signe, ds.h6.sc.valentienne_reste]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h6)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: malbec, place: salon_1}
      - {qui: dembo, place: bagages}
      - {id: receptionniste, qui: portier, nom: "Le réceptionniste", place: reception}
      - {id: sans_solvang, qui: solvang, cache: true}
      - {id: sans_nassir, qui: nassir, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
      - {id: sans_commercant, qui: commercant, cache: true}
    etapes:
      - {narration: "L'hôtel de la Rive, un soir de juin. Au bar du salon, deux feuilles posées à l'envers. Dans le hall, un sac de sport, et un journal plié à la page des transferts."}
      - {qui: dembo, dit: "Vous avez l'heure ?"}
      - {qui: receptionniste, dit: "Huit heures moins dix, monsieur Dembo. Je vous appelle un taxi ?"}
      - {qui: dembo, dit: "Non. Je n'ai jamais de montre, les jours qui comptent. Je la confie."}
      - {qui: dembo, regarde: toi}
      - {qui: toi, va: salon_2}
      - {qui: malbec, geste: telephone}
      - {qui: malbec, dit: "Oui, j'ai les deux feuilles. Non, je ne sais pas qui m'a soufflé le chiffre. Je ne le saurai jamais, et c'est très bien comme ça."}
      - {qui: malbec, geste: assis}
      - {qui: dembo, geste: lit}
      - {qui: toi, pense: "Il tient son journal à l'envers. Il n'a jamais su faire semblant."}

  # ══════════════════════════════════════════ saison 2 (2004-2005) — les suspects
  # Avant la doudoune (scène 8) : Barbier ne lit plus les chiffres. Celui qui
  # a tapé « sous la pluie » n'est pas lui ; la scène le montre, la carte le dit.
  - id: h6.ci.dictee
    quand: carte
    cartes: [ds.h6.barbier.doudoune]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h6)"
    lieu: centre
    tranche: aprem
    acteurs:
      - {qui: toi, place: porte}
      - {qui: barbier, place: brac}
      - {id: gamin, qui: enfant, nom: "Un gamin du centre", place: gamin_2}
      - {id: sans_tibo_rance, qui: tibo_rance, cache: true}
      - {id: sans_mbako, qui: mbako, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Le centre de formation, après l'entraînement. Les crampons des gamins sèchent dans le couloir. Barbier se tient devant le tableau des résultats, le nez presque dessus."}
      - {qui: barbier, dit: "Petit. Viens me lire ça. Les chiffres de la course, ils les écrivent trop serré, maintenant."}
      - {qui: gamin, va: mbako}
      - {qui: gamin, dit: "Douze secondes quatre, Rancé. Treize deux, moi. Bastien, quatorze, mais il avait mal au pied."}
      - {qui: barbier, dit: "Treize deux, toi. Je l'aurais juré. Je vois mieux ce qui court que ce qui est écrit."}
      - {qui: toi, pense: "Le rapport de mai était tapé à la machine. Pas une rature, pas un accent oublié."}
      - {qui: barbier, regarde: toi}
      - {qui: barbier, dit: "Tu restes sur le pas de la porte depuis tout à l'heure, {toi}. Ça, je le vois encore. Approche."}
      - {qui: gamin, sort: true}
      - {narration: "Il descend la fermeture de sa doudoune, dent par dent, sans te quitter des yeux."}

  # Avant « Trente pour cent » (scène 16) : deux femmes qui gardent tout.
  # Josiane ne parle que des licences : ce qu'elle fait des fax ne regarde
  # personne (tant que tu ne le sais pas, la Commission non plus).
  - id: h6.ci.vendredi
    quand: carte
    cartes: [ds.h6.vialat.trente]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h6)"
    lieu: clubhouse
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {qui: josiane, place: secretaire}
      - {qui: vialat, place: guichet}
      - {id: sans_ferlac, qui: ferlac, cache: true}
      - {id: sans_arnaud_vaubourg, qui: arnaud_vaubourg, cache: true}
      - {id: sans_aulard, qui: aulard, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Neuf heures. Madame Vialat attend au guichet du secrétariat, sa calculatrice à bande sous le bras, un crayon derrière l'oreille."}
      - {qui: vialat, dit: "Votre photocopieuse chauffe depuis sept heures, madame Josiane."}
      - {qui: josiane, dit: "Les licences. Je les photocopie toutes, chaque saison, au cas où."}
      - {qui: vialat, dit: "Au cas où quoi ?"}
      - {qui: josiane, dit: "Au cas où il faudrait prouver, un jour, qu'elles ont existé.", geste: ecrit}
      - {qui: vialat, dit: "Moi, je recopie tout au crayon. Le crayon ne blanchit pas, et il ne fait pas de bruit."}
      - {qui: vialat, regarde: toi}
      - {qui: vialat, dit: "Bonjour, {toi}. J'ai refait vos ventes à la main, cette nuit. Vous avez un quart d'heure, ou une heure ?"}
      - {qui: toi, va: conseil_1}
      - {narration: "Elle taille son crayon au-dessus de la corbeille jusqu'à ce que la pointe casse. Puis elle recommence, sans s'énerver."}

  # La première fois qu'on pousse la porte du Terminus pendant l'intrigue du
  # petit Rancé : le père, son ardoise, et celle du fond, qui n'est pas au patron.
  - id: h6.ci.terminus
    quand: lieu
    roles: [ds]
    si: "flag(histoire_h6) && arc(ds.h6.tibo) && tranche == soir"
    lieu: terminus
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: bertrand_rance, place: bertrand}
      - {id: patron, qui: commercant, nom: "Le patron du Terminus", place: patron}
      - {id: chauffeur, qui: passant, nom: "Un chauffeur de car", place: comptoir_1}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Le Terminus, le soir. Les chauffeurs boivent debout, la casquette posée sur le comptoir. Au bout du zinc, Bertrand Rancé a gardé sa veste de livreur et compte des pièces."}
      - {qui: chauffeur, dit: "Ton gamin, il paraît qu'un club de l'étranger le veut. Ils paient en quoi, là-bas ?"}
      - {qui: bertrand_rance, dit: "Ils effacent."}
      - {qui: patron, dit: "Bertrand. L'ardoise du fond, ce n'est pas moi qui la tiens. Je te le redis, et c'est la dernière fois."}
      - {qui: bertrand_rance, regarde: toi}
      - {qui: bertrand_rance, dit: "Tiens. {pg, select, f{La directrice} other{Le directeur}} des ventes. Vous venez voir combien vaut le père ?", ton: noir}
      - {qui: chauffeur, geste: boit}
      - {narration: "Il pousse ses pièces vers le patron, une à une. Il en manque deux pour le café. Le patron ne dit rien et le sert quand même."}

  # Avant le fax du petit (scène 12) : minuit moins le quart, une tasse de trop.
  # Le stagiaire « descend fermer la porte de service ». Josiane avertit par un
  # geste, jamais par une phrase.
  - id: h6.ci.tasse
    quand: carte
    cartes: [ds.h6.sc.fax_petit, ds.h6.sc.fax_petit_sans_copie]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h6)"
    lieu: clubhouse
    tranche: nuit
    acteurs:
      - {qui: toi, place: porte}
      - {qui: josiane, place: secretaire}
      - {qui: ferlac, place: cafe, cache: true}
      - {id: sans_arnaud_vaubourg, qui: arnaud_vaubourg, cache: true}
      - {id: sans_aulard, qui: aulard, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Le club-house, minuit moins le quart. Madame Josiane n'est pas rentrée. Elle tricote sous la lampe du secrétariat, à côté de la photocopieuse allumée."}
      - {qui: toi, va: guichet}
      - {qui: josiane, dit: "J'ai fait du café. Il y a une tasse de trop ; je ne sais jamais pour qui je la fais."}
      - {qui: ferlac, entre: cafe}
      - {qui: ferlac, dit: "Bonsoir, madame Josiane. Bonsoir, {toi}. Je descends fermer la porte de service, et je rentre.", ton: sourire}
      - {qui: ferlac, sort: true}
      - {qui: josiane, regarde: toi}
      - {qui: josiane, dit: "Il dit toujours où il va, ce garçon. Personne ne le lui demande."}
      - {musique: sombre}
      - {narration: "Elle pousse la deuxième tasse vers toi. Au premier, dans le bureau du recrutement, le voyant du fax est vert. 23 h 56."}

  # Juste après la vente du petit Rancé : ce que le centre en dit, le lendemain.
  # Il signe lundi (le tapis vert) ; il vide son casier avant.
  - id: h6.ci.casier
    quand: drapeau
    drapeau: h6_tibo_vendu
    roles: [ds]
    si: "flag(histoire_h6)"
    lieu: centre
    tranche: aprem
    acteurs:
      - {qui: toi, place: porte}
      - {qui: tibo_rance, place: tibo}
      - {qui: barbier, place: educateur}
      - {id: gamin, qui: enfant, nom: "Un gamin du centre", place: gamin_2}
      - {id: sans_mbako, qui: mbako, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Le lendemain, au centre de formation. Tibo Rancé vide son casier dans le sac du club, qu'on lui laisse. Les autres font semblant de lacer leurs chaussures."}
      - {qui: gamin, dit: "Tu pars où, alors ?"}
      - {qui: tibo_rance, dit: "Je sais pas. Mon père a le nom du club écrit sur un papier. Il le garde dans son portefeuille."}
      - {qui: barbier, dit: "Laisse les crampons, petit. Ceux-là sont au club. Là-bas, ils t'en donneront des neufs, et personne pour te les graisser."}
      - {qui: tibo_rance, geste: tete_basse}
      - {qui: tibo_rance, regarde: toi}
      - {qui: tibo_rance, dit: "Mon père m'a dit de vous dire merci. Je vous le dis."}
      - {qui: barbier, geste: dos}
      - {qui: tibo_rance, sort: true}
      - {narration: "Sur le banc, il a laissé les chaussettes du club, roulées en boule, les deux ensemble."}

  # Avant le tapis vert (scène 14) : deux heures du matin. « Sur lundi » tient
  # dans les deux variantes : l'ardoise effacée si le fils signe, ou déjà.
  - id: h6.ci.tapis
    quand: carte
    cartes: [ds.h6.sc.tapis, ds.h6.sc.tapis_vendu]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h6)"
    lieu: tripot
    tranche: nuit
    acteurs:
      - {qui: toi, place: porte}
      - {id: donneur, qui: inconnu, nom: "Le donneur", place: donneur}
      - {qui: bertrand_rance, place: joueur_1}
      - {id: joueur, qui: passant, nom: "Un joueur", place: joueur_2}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
      - {id: sans_commercant, qui: commercant, cache: true}
    etapes:
      - {musique: sombre}
      - {narration: "L'arrière-salle du Terminus, deux heures du matin. La fumée tient sous la lampe comme un second plafond. Personne n'a ouvert la fenêtre depuis l'hiver."}
      - {qui: donneur, dit: "Rancé. Tu joues sur l'ardoise, ou sur lundi ?"}
      - {qui: bertrand_rance, dit: "Sur lundi.", ton: noir}
      - {qui: joueur, dit: "Lundi, c'est ton gamin qui paie. Moi, je jouerais pas sur mon fils."}
      - {qui: bertrand_rance, dit: "Toi, t'as pas de fils. T'as un chien qui t'attend dans la voiture. Distribue."}
      - {qui: joueur, geste: fume}
      - {qui: donneur, regarde: toi}
      - {qui: donneur, dit: "Il y a quelqu'un du club, à la porte. On continue ?"}
      - {qui: bertrand_rance, dit: "On continue. Le club, ça fait longtemps qu'il sait tout de moi."}
      - {narration: "Il ne se retourne pas. Il recompte ses jetons, deux fois, du bout de l'index."}

  # La première fois qu'on entre au Rideau Rouge après le carton noir (les
  # négatifs à vendre). La maison se souvient ; elle photographie, et elle
  # développe elle-même.
  - id: h6.ci.rideau
    quand: lieu
    roles: [ds]
    si: "flag(histoire_h6) && flag(h6_negatifs_offerts)"
    lieu: club_prive
    tranche: nuit
    acteurs:
      - {qui: toi, place: porte}
      - {id: costume, qui: portier, nom: "L'homme en costume", place: piste_1}
      - {id: barmaid, qui: passante, nom: "La barmaid", place: barmaid}
      - {id: client, qui: inconnu, nom: "Un client", place: alcove_2}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
      - {id: sans_commercant, qui: commercant, cache: true}
      - {id: sans_irene, qui: irene, cache: true}
    etapes:
      - {musique: sombre}
      - {narration: "Le Rideau Rouge. On a changé le velours, pas l'odeur. Au fond, la banquette sous la lampe de gauche n'a pas bougé depuis 1999."}
      - {qui: costume, dit: "Bonsoir. Votre table est libre. Elle l'est toujours, pour les gens qui reviennent.", ton: sourire}
      - {qui: barmaid, dit: "Comme d'habitude ?"}
      - {qui: toi, emote: "..."}
      - {qui: toi, pense: "La même banquette. J'avais posé l'enveloppe sur mes genoux, pour qu'on ne la voie pas. On l'a vue. On l'a gardée."}
      - {flash: blanc}
      - {qui: client, emote: "!"}
      - {qui: costume, dit: "Ne faites pas attention. Ici, on photographie les anniversaires. Et on développe nous-mêmes."}
      - {narration: "La barmaid pose quand même le verre sur le comptoir. Le même qu'en 1999. Personne ne le boira."}

  # ══════════════════════════════════════════ saison 3 (2005-2006) — le sous-sol
  # Juste après l'audit (la saisie) : ce que les autres en disent. Le stagiaire
  # propose de porter le carton ; Josiane note le numéro du scellé.
  - id: h6.ci.scelle
    quand: carte
    cartes: [ds.h6.sc.audit, ds.h6.sc.audit_trente]
    moment: apres
    roles: [ds]
    si: "flag(histoire_h6)"
    lieu: clubhouse
    tranche: matin
    acteurs:
      - {qui: toi, place: centre}
      - {qui: arnaud_vaubourg, place: president}
      - {qui: josiane, place: secretaire}
      - {id: agent, qui: inconnu, nom: "Un agent de la Commission", place: guichet}
      - {qui: ferlac, place: cafe, cache: true}
      - {id: sans_aulard, qui: aulard, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "L'audit est fini. Sur la table du conseil, un agent de la Commission ferme le carton au ruban rouge et le scelle à la cire. Il a des gestes de pâtissier."}
      - {qui: agent, dit: "Il me faut la signature du président pour le transport. La vôtre, monsieur Vaubourg."}
      - {qui: arnaud_vaubourg, dit: "Je ne savais pas. Je le dirai à qui voudra l'entendre. Je ne savais pas.", ton: noir}
      - {qui: arnaud_vaubourg, geste: ecrit}
      - {qui: ferlac, entre: cafe}
      - {qui: ferlac, dit: "Je peux le porter jusqu'à votre voiture, si vous voulez. Il a l'air lourd.", ton: sourire}
      - {qui: agent, dit: "Personne ne touche au carton, jeune homme. Pas même vous."}
      - {qui: ferlac, dit: "Bien sûr. Pardon. Merci."}
      - {qui: josiane, dit: "Scellé numéro 4417. Je le note, monsieur : les numéros se perdent plus vite que les cartons."}
      - {qui: agent, sort: true}
      - {qui: arnaud_vaubourg, dit: "Mon père l'apprendra par la Ligue avant que j'aie raccroché. Comme toujours."}
      - {qui: arnaud_vaubourg, geste: tete_basse}

  # Avant 23 h 57 (scène 18) : le 31 janvier, le gardien de nuit, la petite
  # grise. Les trois variantes de la carte tiennent : on n'a encore rien vu.
  - id: h6.ci.trente_et_un
    quand: carte
    cartes: [ds.h6.sc.sous_sol_piege, ds.h6.sc.sous_sol_indices, ds.h6.sc.sous_sol]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h6)"
    lieu: clubhouse
    tranche: nuit
    acteurs:
      - {qui: toi, place: porte}
      - {id: gardien, qui: ancien, nom: "Le gardien de nuit", place: guichet}
      - {id: sans_ferlac, qui: ferlac, cache: true}
      - {id: sans_josiane, qui: josiane, cache: true}
      - {id: sans_arnaud_vaubourg, qui: arnaud_vaubourg, cache: true}
      - {id: sans_aulard, qui: aulard, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
      - {id: sans_commercant, qui: commercant, cache: true}
    etapes:
      - {musique: sombre}
      - {narration: "Le 31 janvier, 23 h 50, la dernière nuit du mercato d'hiver. Le club-house est éteint, sauf le couloir, où le gardien de nuit range sa radio dans sa poche."}
      - {qui: gardien, dit: "Vous restez tard. Comme tout le monde, ce soir : les fax du mercato, c'est jusqu'à minuit."}
      - {qui: toi, va: centre}
      - {qui: gardien, dit: "Moi, je fais le parking. Il reste deux voitures : la vôtre, et la petite grise en marche arrière. Elle est là tous les soirs jusqu'à minuit dix."}
      - {qui: toi, pense: "La petite grise. Le premier soir, en août 2003, elle était déjà garée comme ça. Prête à partir."}
      - {qui: gardien, dit: "Tenez, ma lampe. Les piles sont neuves."}
      - {qui: toi, dit: "Vous n'en aurez pas besoin ?"}
      - {qui: gardien, dit: "Dehors, j'ai la lune."}
      - {qui: gardien, sort: true}
      - {pause: 1400}
      - {narration: "Au bout du couloir, la rampe de l'escalier du sous-sol est encore tiède sous ta main."}

  # Avant « Une heure » (scène 20) : le Terminus après la fermeture, deux
  # hommes au fond. Les trois variantes tiennent : le père n'a pas encore parlé.
  - id: h6.ci.une_heure
    quand: carte
    cartes: [ds.h6.sc.heure_petit_reste, ds.h6.sc.heure_classeur, ds.h6.sc.heure]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h6)"
    lieu: tripot
    tranche: nuit
    acteurs:
      - {qui: toi, place: porte}
      - {qui: bertrand_rance, place: mur}
      - {id: donneur, qui: inconnu, nom: "Le donneur", place: donneur}
      - {id: homme1, qui: passant, nom: "Un homme du fond", place: joueur_2}
      - {id: homme2, qui: inconnu, nom: "Un autre homme", place: joueur_3}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
      - {id: sans_commercant, qui: commercant, cache: true}
    etapes:
      - {narration: "Une heure du matin, le 1er février. Les chaises sont retournées sur les tables, sauf deux, au fond. Deux hommes y boivent sans parler, leurs manteaux sur le dos."}
      - {qui: donneur, dit: "Rancé, tu ne joues pas, ce soir ?"}
      - {qui: bertrand_rance, dit: "Un café. Je ne joue plus. J'attends quelqu'un du club."}
      - {qui: donneur, dit: "Le café est froid depuis minuit."}
      - {qui: bertrand_rance, dit: "Je le bois froid. J'ai le temps, maintenant."}
      - {qui: homme1, regarde: toi}
      - {qui: homme2, geste: fume}
      - {qui: toi, va: [1, 1]}
      - {narration: "Au fond, les deux hommes ne finissent pas leurs verres. Ils attendent qu'on leur dise s'ils peuvent."}

conversations:
  # Le prix de Dembo, vu du virage.
  - id: h6.cv.six_millions
    roles: [ds]
    si: "flag(histoire_h6) && flag(h6_dembo_vendu)"
    lieu: buvette
    tranches: [midi, soir]
    qui:
      - {id: fan1, qui: fan, nom: "Un supporter", place: zinc_1}
      - {id: fan2, qui: ancien, nom: "Un vieux du virage", place: zinc_2}
    repliques:
      - {qui: fan1, dit: "Dembo à Valentienne. Trente-sept ans, et on le vend comme un frigo d'occasion."}
      - {qui: fan2, dit: "Au tabac du Quai, ils avaient son prix depuis la Toussaint. Le prix exact."}
      - {qui: fan1, dit: "Qui le leur a donné ?"}
      - {qui: fan2, dit: "Personne. Au Quai, les chiffres arrivent tout seuls, la nuit, comme les péniches."}

  # Les rames de Josiane, vues de la papeterie.
  - id: h6.cv.rames
    roles: [ds]
    si: "flag(histoire_h6) && flag(h6_photocopies)"
    lieu: librairie
    tranches: [matin, aprem]
    qui:
      - {id: libraire, qui: commercant, nom: "La papetière", place: libraire}
      - {id: cliente, qui: passante, nom: "Une cliente", place: client_1}
    repliques:
      - {qui: cliente, dit: "Elle vous prend encore une rame, la dame du Racing ?"}
      - {qui: libraire, dit: "Chaque lundi. Du papier ordinaire, jamais du thermique. Le thermique, elle dit que c'est pour ceux qui veulent oublier."}
      - {qui: cliente, dit: "Elle écrit ses mémoires ?"}
      - {qui: libraire, dit: "Elle photocopie celles des autres."}

  # Le tabac du Quai parie sur les ventes, plus sur les matchs.
  - id: h6.cv.cote
    roles: [ds]
    si: "flag(histoire_h6) && arc(ds.h6.tibo) && saison >= 2"
    lieu: tabac
    tranches: [matin, midi, aprem]
    qui:
      - {id: buraliste, qui: commercant, nom: "Le buraliste", place: patron}
      - {id: marinier1, qui: passant, nom: "Un marinier", place: marinier_1}
      - {id: marinier2, qui: ancien, nom: "Un vieux marinier", place: marinier_2}
    repliques:
      - {qui: marinier1, dit: "Le petit Rancé, je le prends sous les cinq millions. Tu me fais combien ?"}
      - {qui: buraliste, dit: "Trois contre un. Et je ne prends plus rien sur {pg, select, f{la directrice} other{le directeur}}."}
      - {qui: marinier2, dit: "Pourquoi ?"}
      - {qui: buraliste, dit: "Parce que quelqu'un gagne à chaque fois. Et ce n'est jamais un client."}

  # Au Rideau Rouge, après « un garçon poli » : ceux qui achètent ne reviennent pas.
  - id: h6.cv.velours
    roles: [ds]
    si: "flag(histoire_h6) && flag(h6_garcon_poli)"
    lieu: club_prive
    tranches: [soir, nuit]
    qui:
      - {id: barmaid, qui: passante, nom: "La barmaid", place: barmaid}
      - {id: costume, qui: commercant, nom: "L'homme en costume", place: piste_2}
    repliques:
      - {qui: barmaid, dit: "Le garçon poli, l'été 2003. Il n'est jamais revenu ?"}
      - {qui: costume, dit: "Ceux qui achètent une photo ne reviennent jamais. Ils ont ce qu'ils voulaient."}
      - {qui: barmaid, dit: "Et ceux qui sont dessus ?"}
      - {qui: costume, dit: "Eux, ils reviennent. Tous. Mets un verre de côté."}

  # Le parking du club-house, la nuit : la petite grise et ses horaires.
  - id: h6.cv.petite_grise
    roles: [ds]
    si: "flag(histoire_h6) && saison >= 2"
    lieu: voiture
    tranches: [soir, nuit]
    qui:
      - {id: gardien, qui: ancien, nom: "Le gardien de nuit", place: [1, 2]}
      - {id: menage, qui: passante, nom: "La femme de ménage", place: [2, 1]}
    repliques:
      - {qui: menage, dit: "La petite grise est encore là. Il est minuit."}
      - {qui: gardien, dit: "Elle part à minuit dix. Tous les soirs. Je pourrais régler ma montre dessus."}
      - {qui: menage, dit: "Il fait quoi, jusqu'à minuit dix ?"}
      - {qui: gardien, dit: "Il dit bonsoir en partant. C'est tout ce que je sais de lui. Par ici, c'est déjà beaucoup."}

  # Le vestiaire compte les départs.
  - id: h6.cv.vestiaire
    roles: [ds]
    si: "flag(histoire_h6) && flag(h6_dembo_vendu) && saison >= 2"
    lieu: stade
    tranches: [matin, aprem]
    qui:
      - {id: milieu, qui: passant, nom: "Un milieu", place: banc_1}
      - {qui: vukic, place: coach}
    repliques:
      - {qui: milieu, dit: "Trois départs depuis août. Le prochain, c'est qui ?"}
      - {qui: vukic, dit: "Celui qui marque le plus. Ici, on vend ce qui marche."}
      - {qui: milieu, dit: "Alors je ne risque rien."}
      - {qui: vukic, dit: "Non. Lace tes chaussures."}

  # Les gamins du centre et le club de l'étranger.
  - id: h6.cv.centre
    roles: [ds]
    si: "flag(histoire_h6) && arc(ds.h6.tibo)"
    lieu: centre
    tranches: [aprem]
    qui:
      - {id: gamin1, qui: enfant, nom: "Un gamin", place: gamin_2}
      - {id: gamin2, qui: passant, nom: "Un grand du centre", place: visiteur}
    repliques:
      - {qui: gamin1, dit: "Tibo, il dit qu'un club de l'étranger veut le prendre."}
      - {qui: gamin2, dit: "Moi, si on me veut, je signe. Tout de suite."}
      - {qui: gamin1, dit: "Toi, personne te veut. Tu cours comme une chaise."}
      - {qui: gamin2, dit: "Barbier dit que je cours comme une chaise qui a du cœur."}

  # Après l'audit, deux hommes de la Commission au salon de l'hôtel.
  - id: h6.cv.commission
    roles: [ds]
    si: "flag(histoire_h6) && saison == 3"
    lieu: hotel
    tranches: [midi, soir]
    qui:
      - {id: inspecteur, qui: inconnu, nom: "Un homme de la Commission", place: salon_1}
      - {id: collegue, qui: passant, nom: "Son collègue", place: salon_2}
    repliques:
      - {qui: inspecteur, dit: "Trente pour cent sous le prix, sur toutes les ventes. Deux saisons de suite."}
      - {qui: collegue, dit: "{pg, select, f{Elle} other{Il}} s'est {pg, select, f{enrichie} other{enrichi}} ?"}
      - {qui: inspecteur, dit: "Pas un écu de trop sur ses comptes. C'est ça qui m'empêche de dormir."}
      - {qui: collegue, dit: "Alors qui encaisse la différence ?"}
      - {qui: inspecteur, dit: "Quelqu'un qui n'a pas de compte à son nom. Ou pas encore."}

  # Au café de la Mairie, la première saison : Fardelli et la photo.
  - id: h6.cv.fardelli
    roles: [ds]
    si: "flag(histoire_h6) && saison == 1"
    lieu: cafe_mairie
    tranches: [midi]
    qui:
      - {qui: fardelli, place: fardelli}
      - {id: patron, qui: commercant, nom: "Le patron", place: patron}
    repliques:
      - {qui: patron, dit: "On dit en ville que vous avez une photo {pg, select, f{de la nouvelle directrice} other{du nouveau directeur}}."}
      - {qui: fardelli, dit: "J'ai des photos de tout le monde, Marcel. Celle-là, je ne l'ai pas."}
      - {qui: patron, dit: "Mais vous savez qui l'a."}
      - {qui: fardelli, dit: "Je sais qui l'a prise. Ce n'est pas la même chose, et c'est pour ça que je bois mon café tranquille."}

  # La laverie de la rue du Stade, le soir : le jeune du club et ses pulls.
  - id: h6.cv.pulls
    roles: [ds]
    si: "flag(histoire_h6) && saison >= 2"
    lieu: laverie
    tranches: [soir]
    qui:
      - {id: habituee, qui: passante, nom: "Une habituée", place: attente_1}
      - {id: gerant, qui: commercant, nom: "Le gérant", place: pliage}
    repliques:
      - {qui: habituee, dit: "Le jeune du club vient laver ses pulls ici, le dimanche soir. Tous gris, tous pareils."}
      - {qui: gerant, dit: "Il dit bonsoir ?"}
      - {qui: habituee, dit: "Il dit bonsoir, il dit merci, il dit pardon. Et il plie mieux que moi."}
      - {qui: gerant, dit: "Méfiez-vous des hommes qui plient mieux que vous. Ma femme le disait."}
