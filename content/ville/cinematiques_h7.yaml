# Histoire 7 — « Chambre 12 » : les scènes jouées et les conversations surprises
# (format : docs/histoires/scenes_jouees.md ; la fiche : docs/histoires/00_les_dix_histoires.md,
# « Histoire 7 » ; le livre : content/cards/selectionneur/h7_*.yaml). Une scène jouée ne se
# joue pas, on la regarde ; une conversation s'entend en passant près de ceux qui parlent.
#
# Le sélectionneur loge à l'hôtel de la Rive : le hall (la réception, le standard de Sandrine
# Lavergne, le tableau des clés, le salon, l'escalier des chambres, la cabine) est le décor du
# livre, comme le deuxième étage en est le hors-champ. On ne monte jamais à la 12 : on voit
# l'avant (le carnet, la soupe, le double qu'on tend) et l'après (la cire, la pierre, le
# registre), jamais la nuit elle-même.
#
# Le héros peut être une femme : tout ce qui le nomme ou l'accorde passe par {pg, select}.
#
# La mise en scène. Une pièce garde ses occupants du moment (le patron, les habitués, les
# clients, celui qui t'attend), quelle que soit l'heure que dit la scène : un acteur
# `cache: true` qui n'entre jamais les en retire le temps de la scène. On s'en sert pour vider
# le hall la nuit, pour libérer les fauteuils du salon, et pour qu'aucun visage n'y soit avant
# son heure (la commandante Benali n'arrive qu'au matin du 14 novembre 2011). Les décalages
# `[dx, dy]` d'une pièce visent l'accès de ses objets (l'escalier des chambres est à [-9, -8]
# du centre du hall, la cabine à [-9, -3], le salon à [6, -9]) ; dans une conversation, une
# voix nouvelle se tient sur le plancher, jamais sur une place qu'un client peut occuper. Le
# hall de nuit prend la lumière du soir : il reste éclairé, l'heure est dans le texte.
cinematiques:
  # ═══════════════════════════════════════════ l'introduction (mars 2011)
  # La nuit avant les autres : le tableau des clés, plein, et une femme qui ne dort pas ;
  # puis, à l'aube, le terrain annexe où le petit Rancé fait ses tours. Elle mène au parking
  # de l'hôtel (la première carte : le bus de 2010) sans le montrer.
  - id: h7.ci.intro
    quand: debut
    roles: [selectionneur]
    si: "flag(histoire_h7)"
    titre: "Chambre 12"
    sous: "Aubérive, mars 2011"
    lieu: hotel
    tranche: soir
    suite: h7.ci.intro_2
    acteurs:
      - {qui: toi, place: porte}
      - {qui: sandrine, place: standard}
      # une heure du matin : ceux du jour ne sont pas là, ni celle qui t'attend au parking
      - {qui: escande, cache: true}
      - {qui: josiane, cache: true}
      - {qui: arzel, cache: true}
      - {qui: benali, cache: true}
      - {qui: dauzat, cache: true}
      - {qui: tibo_rance, cache: true}
      - {qui: passant, cache: true}
      - {qui: passante, cache: true}
      - {qui: ancien, cache: true}
      - {qui: fan, cache: true}
    etapes:
      - {musique: ville_nuit}
      - {narration: "Une heure du matin. Dans le hall de l'hôtel de la Rive, une seule lampe, au comptoir. Derrière, vingt-six crochets de laiton, vingt-six doubles, et une femme qui ne dort pas."}
      - {qui: toi, va: bagages}
      - {qui: sandrine, regarde: toi}
      - {qui: sandrine, dit: "Vous êtes {pg, select, f{la sélectionneuse} other{le sélectionneur}}. On vous attendait jeudi, avec les autres."}
      - {qui: toi, pense: "Quatre noms rayés avant le mien. Après le bus de 2010, personne ne voulait de ce banc-là."}
      - {qui: sandrine, geste: ecrit}
      - {narration: "Elle écrit l'heure dans un cahier à petits carreaux, à l'encre bleue : « 1 h 12, {pg, select, f{la sélectionneuse} other{le sélectionneur}}. Pas de double. »"}
      - {qui: sandrine, dit: "Les chambres, c'est M. Escande, à sept heures. Moi, je n'ai que les doubles. Ce soir, ils sont tous là."}
      - {narration: "Elle ne se retourne pas vers le tableau. Elle connaît chaque clé à son bruit sur le crochet."}
      - {qui: sandrine, dit: "Le 12, c'est le petit Rancé. Il a écrit en janvier pour l'avoir, à la main, sur du papier à carreaux. Il voulait la fenêtre."}
      - {qui: sandrine, dit: "Le salon est chauffé. Les fauteuils sont durs, mais d'ici on entend la porte.", geste: pointe}
      - {qui: toi, va: salon_1}
      - {pause: 900}
      - {qui: sandrine, dit: "Dormez. Je compte."}
      - {fondu: "Six heures. Le terrain annexe du Racing."}

  - id: h7.ci.intro_2
    quand: suite
    lieu: terrain
    tranche: matin
    meteo: brume
    acteurs:
      - {qui: toi, place: porte}
      - {id: jardinier, qui: ancien, nom: "Le jardinier", place: [-2, 2]}
      - {qui: tibo_rance, place: [5, 1]}
      # au bout du fil
      - {qui: josiane, cache: true}
    etapes:
      - {narration: "Le terrain annexe du Racing. La brume au ras de l'herbe, du givre sur les plots, deux buts sans filet. Un garçon en survêtement bleu fait le tour du terrain, seul."}
      - {qui: tibo_rance, va: [6, 5]}
      - {qui: jardinier, dit: "Le petit Rancé. Il venait ici à huit ans, avec un ballon trop grand. Chaque fois qu'il revient, il refait ses tours avant que j'ouvre la grille."}
      - {qui: tibo_rance, va: [2, 6]}
      - {qui: jardinier, dit: "Il s'arrête toujours au même piquet, celui du coin. Il dit que c'est le vent."}
      - {musique: sombre}
      - {qui: tibo_rance, geste: tete_basse}
      - {narration: "Au piquet du coin, il s'arrête, une main à plat sur la poitrine. Il rit tout seul."}
      - {qui: toi, pense: "Le petit Rancé. Pour moi, ce n'est encore qu'un numéro de chambre."}
      - {qui: tibo_rance, geste: debout}
      - {qui: tibo_rance, va: [5, 1], attendre: false}
      - {qui: toi, geste: telephone}
      - {qui: josiane, dit: "Madame Josiane, au secrétariat de la Fédération. Je vous attends sur le parking, derrière l'hôtel. Venez avant que les autres arrivent."}
      - {qui: toi, geste: debout}
      - {qui: tibo_rance, regarde: toi}
      - {narration: "Un tour de plus. Au coin, la même halte, la même main à plat, le même rire. Puis il repart."}

  # ═══════════════════════════════════════════════════════════ 2011 · la nuit
  # Le brassard (créneau 1) : la veille, au salon. Le mutin de 2010 et le nouveau de
  # Valdorne ; le syndicat entre les deux. Le doute avant le choix.
  - id: h7.ci.brassard
    quand: carte
    prefixe: "sl.h7.a1_brassard"
    moment: avant
    roles: [selectionneur]
    si: "flag(histoire_h7)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: mbako, place: salon_2}
      - {qui: fauvel, place: salon_3}
      - {qui: ferrol, place: porte, cache: true}
      # Escande et Sandrine restent à leurs places s'ils y sont ; personne d'autre au salon
      - {qui: arzel, cache: true}
      - {qui: benali, cache: true}
      - {qui: dauzat, cache: true}
      - {qui: tibo_rance, cache: true}
      - {qui: josiane, cache: true}
      - {qui: passant, cache: true}
      - {qui: passante, cache: true}
      - {qui: ancien, cache: true}
      - {qui: fan, cache: true}
    etapes:
      - {narration: "La veille du premier entraînement. Au salon, Lian Mbako et Karim Fauvel, du syndicat des joueurs, parlent bas, penchés sur la même tasse de café."}
      - {qui: fauvel, dit: "Ils vont te le reprendre, Lian. Le pays veut des visages qu'il n'a pas vus derrière les vitres du bus."}
      - {qui: mbako, dit: "Depuis le bus, il ne quitte plus cette poche. Il a pris la forme de ma main."}
      - {qui: mbako, geste: tete_basse}
      - {qui: toi, va: bagages}
      - {qui: ferrol, entre: [6, -8]}
      - {narration: "Yanis Ferrol traverse le hall dans un survêtement des Cobalts encore marqué au pli, un bracelet tressé rouge et noir au poignet. Il s'arrête près de la fenêtre et ne salue personne."}
      - {qui: fauvel, regarde: ferrol}
      - {qui: fauvel, dit: "Lui, il est arrivé avec l'étiquette au col. Il n'a rien à rendre, et il le sait."}
      - {qui: toi, pense: "Un brassard plié depuis 2010, un bracelet de Valdorne. Demain matin, l'un des deux sortira de sa poche."}
      - {qui: mbako, regarde: toi}
      - {qui: mbako, dit: "Bonne nuit, coach. Prenez votre temps. Nous, on a appris à attendre, dans le bus."}
      - {qui: mbako, va: [-9, -8]}
      - {narration: "Ferrol attend que Mbako ait disparu dans l'escalier. Puis il fait tourner son bracelet autour du poignet, lentement, comme on remonte une montre."}

  # 2 h 10 (créneau 15, le seul soir de 2011) : la dernière veille. Le petit vivant, son
  # carnet à élastique rouge, et le tableau complet à minuit. On ne monte pas.
  - id: h7.ci.derniere_veille
    quand: carte
    prefixe: "sl.h7.a3_deux_heures_dix"
    moment: avant
    roles: [selectionneur]
    si: "flag(histoire_h7)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: tibo_rance, place: salon_3}
      - {qui: mbako, place: salon_2}
      - {qui: sandrine, place: standard}
      # le hall : personne d'autre ce soir-là (ni les habitués du moment, ni les clients)
      - {qui: escande, cache: true}
      - {qui: arzel, cache: true}
      - {qui: benali, cache: true}
      - {qui: dauzat, cache: true}
      - {qui: josiane, cache: true}
      - {qui: passant, cache: true}
      - {qui: passante, cache: true}
      - {qui: ancien, cache: true}
      - {qui: fan, cache: true}
    etapes:
      - {narration: "Novembre, la troisième nuit de la fenêtre. Onze heures. Les Cobalts sont montés ; au salon, il en reste deux, et la télévision sans le son."}
      - {qui: tibo_rance, geste: ecrit}
      - {narration: "Le petit Rancé écrit dans un carnet d'écolier tenu par un élastique rouge. Une ligne, pas plus. Il souffle sur l'encre."}
      - {qui: mbako, dit: "Tu écris quoi, là-dedans, tous les soirs ?"}
      - {qui: tibo_rance, dit: "Une liste. Samedi, si tout va bien, je coche une ligne."}
      - {qui: mbako, emote: "..."}
      - {qui: toi, va: bagages}
      - {qui: tibo_rance, regarde: toi}
      - {qui: tibo_rance, dit: "Bonne nuit, coach. Demain, si je ne descends pas, frappez fort. Je dors comme une pierre.", geste: rit}
      - {qui: tibo_rance, va: [-9, -8]}
      - {qui: mbako, geste: boit}
      - {pause: 1200}
      - {qui: sandrine, geste: ecrit}
      - {narration: "Minuit. Sandrine Lavergne compte les doubles à voix basse, jusqu'à vingt-six. Elle écrit le chiffre et l'heure. Au salon, Mbako n'a pas bougé."}

  # Quatre heures (créneau 16) : le hall tout allumé, la docteure les mains vides, le
  # secrétaire général et son registre. Le café pour quatre.
  - id: h7.ci.quatre_heures
    quand: carte
    prefixe: "sl.h7.a4_quatre_heures"
    moment: avant
    roles: [selectionneur]
    si: "flag(histoire_h7) && flag(h7_rance_mort)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: [-9, -8]}
      - {qui: sandrine, place: standard}
      - {qui: arzel, place: salon_2}
      - {qui: dauzat, place: porte, cache: true}
      # le hall : personne d'autre ce soir-là (ni les habitués du moment, ni les clients)
      - {qui: escande, cache: true}
      - {qui: benali, cache: true}
      - {qui: aulard, cache: true}
      - {qui: josiane, cache: true}
      - {qui: passant, cache: true}
      - {qui: passante, cache: true}
      - {qui: ancien, cache: true}
      - {qui: fan, cache: true}
    etapes:
      - {narration: "Quatre heures moins dix. Toutes les lampes du hall sont allumées, comme pour un mariage. La docteure Arzel est assise sur la banquette, en manteau, les mains vides sur les genoux."}
      - {qui: toi, va: bagages}
      - {qui: sandrine, dit: "M. Vaubourg est au petit salon. Il a demandé du café pour quatre, et qu'on ne passe aucun appel."}
      - {qui: arzel, geste: tete_basse}
      - {qui: dauzat, entre: [2, 1]}
      - {narration: "Aurélien Dauzat, le secrétaire général, entre par la porte du quai, un manteau sur son pyjama, son bloc sous le bras."}
      - {qui: dauzat, dit: "Personne n'a appelé personne, madame Lavergne ? Bien. Ça nous laisse la nuit."}
      - {qui: dauzat, va: [6, -9]}
      - {qui: dauzat, regarde: toi}
      - {qui: dauzat, dit: "Venez, {toi}. On ne commence pas sans vous. On ne finit pas sans vous non plus."}
      - {qui: arzel, va: [6, -8]}
      - {qui: sandrine, geste: ecrit}
      - {narration: "Sandrine écrit l'heure : 3 h 52. Au tableau, derrière elle, les vingt-six doubles sont à leur place. Le 12 aussi."}

  # Le caveau du Racing, après l'enterrement (le Carrefour de décembre 2011) : la mère et
  # l'agent du petit, qui ne se parlent pas. Une première visite.
  - id: h7.ci.caveau
    quand: lieu
    roles: [selectionneur]
    si: "flag(histoire_h7) && flag(h7_rance_mort) && annee >= 2012"
    lieu: caveau
    tranche: aprem
    acteurs:
      - {qui: toi, place: porte}
      - {qui: rance_mere, place: rance_mere}
      - {qui: fardelli, place: porte, cache: true}
      - {qui: passant, cache: true}
      - {qui: passante, cache: true}
      - {qui: ancien, cache: true}
      - {qui: fan, cache: true}
    etapes:
      - {narration: "Le caveau du Racing. Des noms gravés, des écharpes délavées, et sur la plaque neuve, un prénom que la pierre n'a pas encore eu le temps de salir."}
      - {qui: rance_mere, geste: genou}
      - {narration: "La mère de Tibo change l'eau d'un vase. Elle ne se retourne pas quand la porte grince."}
      - {qui: fardelli, entre: visiteur}
      - {qui: fardelli, dit: "Je repasserai. Je ne savais pas que vous veniez à cette heure-ci."}
      - {qui: rance_mere, dit: "Je viens à toutes les heures, monsieur Fardelli. Vous, vous ne veniez que pour les contrats."}
      - {qui: fardelli, geste: tete_basse}
      - {qui: fardelli, dit: "Je l'ai connu à douze ans. Il riait en courant ; les autres trouvaient ça insolent. Moi, je trouvais ça vendable."}
      - {qui: rance_mere, geste: debout}
      - {qui: rance_mere, dit: "Posez vos fleurs avec les autres. Elles faneront le même jour."}
      - {qui: fardelli, geste: genou}
      - {qui: fardelli, sort: true}
      - {narration: "Quand la porte se referme, elle pousse le bouquet de l'agent d'un doigt, à l'écart des autres, et rajoute de l'eau dans tous les vases sauf le sien."}

  # ═══════════════════════════════════════════════════════════ 2012 · les portes
  # Les bougies et la pierre : le même soir, dans le hall. Gégé comprend quelle fenêtre.
  - id: h7.ci.pierre
    quand: drapeau
    drapeau: h7_bougies
    roles: [selectionneur]
    si: "flag(histoire_h7)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: bagages}
      - {qui: sandrine, place: standard}
      - {qui: escande, place: reception}
      - {qui: gege, place: porte, cache: true}
      # le hall : personne d'autre ce soir-là (ni les habitués du moment, ni les clients)
      - {qui: arzel, cache: true}
      - {qui: benali, cache: true}
      - {qui: dauzat, cache: true}
      - {qui: josiane, cache: true}
      - {qui: passant, cache: true}
      - {qui: passante, cache: true}
      - {qui: ancien, cache: true}
      - {qui: fan, cache: true}
    etapes:
      - {narration: "Dans le hall, l'odeur de la cire et celle des bougies qu'on a ramenées du trottoir. Au deuxième, quelqu'un balaie du verre."}
      - {qui: escande, geste: telephone}
      - {qui: escande, dit: "Un carreau du deuxième, côté quai. Demain à la première heure, avant que les journalistes se lèvent. Je paierai la nuit."}
      - {qui: gege, entre: [1, 1]}
      - {narration: "Gégé entre du trottoir, une bougie encore allumée dans la main, la flamme protégée par ses doigts."}
      - {qui: gege, dit: "Les bougies, c'est le virage. On les a allumées pour le petit, parce qu'il était d'ici."}
      - {qui: sandrine, dit: "La vitre, c'est le 14."}
      - {qui: gege, emote: "..."}
      - {qui: gege, dit: "Le 14. Alors la pierre, ce n'était pas pour le petit."}
      - {qui: gege, geste: tete_basse}
      - {qui: gege, dit: "Dans le virage, on se connaît tous. Ce soir, il y avait des bras que je ne connais pas."}
      - {qui: gege, sort: true}
      - {narration: "Il a laissé sa bougie sur le comptoir, à côté du tableau. Sandrine la regarde brûler jusqu'au bout, et note l'heure où elle s'éteint."}

  # Le plateau (« deux heures vingt-cinq » à l'antenne) : la nuit du dimanche. Le standard
  # qui ne s'arrête plus, la presse au salon, et le capitaine qui descend pieds nus.
  - id: h7.ci.plateau
    quand: drapeau
    drapeau: h7_rossard_plateau
    roles: [selectionneur]
    si: "flag(histoire_h7)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: sandrine, place: standard}
      - {qui: lea, place: salon_1}
      - {qui: mbako, place: [-9, -8]}
      # le hall : personne d'autre ce soir-là (ni les habitués du moment, ni les clients)
      - {qui: escande, cache: true}
      - {qui: arzel, cache: true}
      - {qui: benali, cache: true}
      - {qui: dauzat, cache: true}
      - {qui: josiane, cache: true}
      - {qui: passant, cache: true}
      - {qui: passante, cache: true}
      - {qui: ancien, cache: true}
      - {qui: fan, cache: true}
    etapes:
      - {narration: "Minuit passé. Depuis la fin de l'émission, le standard ne s'arrête plus. Sandrine décroche, dit « Hôtel de la Rive, bonsoir », et raccroche."}
      - {qui: sandrine, geste: telephone}
      - {qui: sandrine, dit: "Le Quotidien, deux radios, et un monsieur qui ne dit pas son nom. Ils demandent tous le 14."}
      - {qui: lea, dit: "Deux heures vingt-cinq. Rossard n'a pas inventé l'heure. Quelqu'un la lui a donnée."}
      - {qui: mbako, va: [-1, -6]}
      - {narration: "Mbako descend l'escalier en survêtement, pieds nus. Le hall se tait. Même le standard."}
      - {qui: mbako, dit: "Madame Lavergne. C'est vous qui l'avez donnée, l'heure ?"}
      - {qui: sandrine, dit: "Moi, je l'écris. Je ne la donne à personne. On ne me l'a jamais demandée."}
      - {qui: lea, dit: "Monsieur Mbako. Une phrase, une seule, et je n'en écris pas d'autre."}
      - {qui: mbako, regarde: lea}
      - {pause: 1500}
      - {qui: mbako, va: [-9, -8]}
      - {narration: "Il remonte sans répondre. Léa n'écrit rien. Elle regarde l'escalier jusqu'à ce que la minuterie du palier s'éteigne."}

  # Le cahier de nuit (créneaux 12-13), quand la page est lue : le père de Sandrine, l'ancien
  # buraliste du Quai, apporte sa soupe à deux heures du matin.
  - id: h7.ci.lavergne
    quand: carte
    cartes: [sl.h7.r2_cahier, sl.h7.r2_cahier_premier_soir]
    moment: apres
    roles: [selectionneur]
    si: "flag(histoire_h7) && flag(h7_cahier_lu)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: bagages}
      - {qui: sandrine, place: standard}
      - {qui: lavergne, place: porte, cache: true}
      # le hall : personne d'autre ce soir-là (ni les habitués du moment, ni les clients)
      - {qui: escande, cache: true}
      - {qui: arzel, cache: true}
      - {qui: benali, cache: true}
      - {qui: dauzat, cache: true}
      - {qui: josiane, cache: true}
      - {qui: passant, cache: true}
      - {qui: passante, cache: true}
      - {qui: ancien, cache: true}
      - {qui: fan, cache: true}
    etapes:
      - {narration: "Deux heures du matin. La porte du quai s'ouvre sur un vieil homme en pardessus, une gamelle enveloppée dans un torchon à carreaux."}
      - {qui: lavergne, entre: [-3, -4]}
      - {qui: lavergne, dit: "Ta soupe. Elle était trop chaude, je l'ai portée lentement."}
      - {qui: sandrine, dit: "Papa. Il est deux heures."}
      - {qui: lavergne, dit: "Je sais. Je ne dors pas mieux que toi."}
      - {qui: lavergne, regarde: toi}
      - {qui: lavergne, dit: "Ma fille vous a ouvert son cahier. Elle ne l'ouvre pour personne. Pas même pour moi."}
      - {qui: lavergne, dit: "Depuis 1984, elle compte ce qui revient. Les clés, au moins, reviennent."}
      - {qui: sandrine, geste: tete_basse}
      - {qui: lavergne, dit: "Ne lui faites pas regretter."}
      - {qui: lavergne, sort: true}
      - {narration: "Sandrine boit sa soupe à même la gamelle, les yeux sur le tableau. Dans le cahier, elle n'écrit pas l'heure de son père. Il ne demande jamais de double."}

  # Un matin de 2012, sans carte : le petit-déjeuner en deux tables, et la table du milieu.
  - id: h7.ci.deux_tables
    quand: semaine
    roles: [selectionneur]
    si: "flag(histoire_h7) && flag(h7_rance_mort) && annee == 2012"
    lieu: hotel
    tranches: [matin]
    poids: 1
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {qui: mbako, place: salon_2}
      - {qui: ferrol, place: salon_1}
      - {qui: rouvier, place: porte, cache: true}
      # Escande et Sandrine restent à leurs places s'ils y sont ; les salons sont aux joueurs
      - {qui: arzel, cache: true}
      - {qui: benali, cache: true}
      - {qui: dauzat, cache: true}
      - {qui: josiane, cache: true}
      - {qui: passant, cache: true}
      - {qui: passante, cache: true}
      - {qui: ancien, cache: true}
      - {qui: fan, cache: true}
    etapes:
      - {narration: "Sept heures, un matin de rassemblement. Les Cobalts déjeunent en deux tables : ceux du bus de 2010 près de l'escalier, les nouveaux près de la fenêtre. Entre les deux, une table mise pour personne."}
      - {qui: rouvier, entre: [0, 1]}
      - {qui: rouvier, dit: "Il reste des croissants à la table du milieu. Personne ? Ils vont sécher."}
      - {qui: mbako, geste: boit}
      - {qui: ferrol, regarde: mbako}
      - {qui: mbako, dit: "La table du milieu, c'est pour les journalistes. Ils déjeunent avec nous, maintenant."}
      - {qui: toi, va: [0, 2]}
      - {qui: rouvier, regarde: toi}
      - {qui: rouvier, dit: "Vous vous asseyez où, ce matin, {toi} ?"}
      - {qui: toi, pense: "Une table pour ceux qui sont restés dans le bus, une pour ceux qui n'y étaient pas. La mienne n'existe pas encore."}
      - {narration: "Personne ne s'assoit à la table du milieu. À huit heures, la serveuse débarrasse les croissants intacts, un par un, dans une corbeille."}

  # ═══════════════════════════════════════════════════════ 2013 · les signatures
  # La copie (créneau 10) : au cabinet, la docteure vient chercher ses ampoules. Rouvier
  # ferme la porte à clé avant d'ouvrir sa boîte à couture.
  - id: h7.ci.copie
    quand: carte
    prefixe: "sl.h7.s2_copie"
    moment: avant
    roles: [selectionneur]
    si: "flag(histoire_h7)"
    lieu: cabinet
    tranche: aprem
    acteurs:
      - {qui: toi, place: porte}
      - {qui: rouvier, place: kine}
      - {qui: ferrol, place: patient}
      - {qui: arzel, place: porte, cache: true}
      - {qui: passant, cache: true}
      - {qui: passante, cache: true}
      - {qui: ancien, cache: true}
      - {qui: fan, cache: true}
    etapes:
      - {narration: "Le cabinet, l'après-midi. Ferrol, assis sur la table de massage, tend la cheville ; Nadia Rouvier lui refait son strapping."}
      - {qui: rouvier, dit: "Ne bouge pas. Quatre bandes, pas trois. Le jour où on en met trois, on se tord."}
      - {qui: arzel, entre: medecin}
      - {narration: "La docteure Arzel entre sans frapper, sa mallette à la main, fermée à deux tours, même pour traverser un couloir."}
      - {qui: arzel, dit: "Mes ampoules, Nadia. J'en avais laissé une boîte dans l'armoire."}
      - {qui: rouvier, dit: "L'armoire est fermée. Vous avez la clé, docteure. Vous avez toutes les clés."}
      - {qui: arzel, regarde: rouvier}
      - {qui: arzel, sort: true}
      - {qui: ferrol, dit: "Elle ne me regarde jamais. Depuis la nuit, elle regarde tout le monde, sauf moi."}
      - {qui: rouvier, dit: "Va, Yanis. Quatre bandes. Ne les enlève pas avant ce soir."}
      - {qui: ferrol, sort: true}
      - {qui: rouvier, regarde: toi}
      - {qui: rouvier, dit: "Fermez la porte, {toi}. À clé. J'ai quelque chose à vous montrer, et ce n'est pas une cheville."}
      - {narration: "Elle ouvre sa boîte à couture. Sous les bobines, une enveloppe kraft, pliée en deux depuis longtemps."}

  # La 12 et la mère (créneau 15) : le double qu'on n'a plus demandé depuis deux ans. Sauf
  # quand Sandrine l'a déjà donné à la mère (la carte le dit alors elle-même).
  - id: h7.ci.double
    quand: carte
    prefixe: "sl.h7.s4_douze"
    moment: avant
    roles: [selectionneur]
    si: "flag(histoire_h7) && !flag(h7_double_mere)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: sandrine, place: standard}
      # le hall : personne d'autre ce soir-là (ni les habitués du moment, ni les clients)
      - {qui: escande, cache: true}
      - {qui: arzel, cache: true}
      - {qui: benali, cache: true}
      - {qui: dauzat, cache: true}
      - {qui: rance_mere, cache: true}
      - {qui: josiane, cache: true}
      - {qui: passant, cache: true}
      - {qui: passante, cache: true}
      - {qui: ancien, cache: true}
      - {qui: fan, cache: true}
    etapes:
      - {narration: "La dernière fenêtre de 2013. Minuit passé, le hall est vide. Au tableau, entre le 11 et le 13, un trou de cheville à la place d'un crochet."}
      - {qui: toi, va: bagages}
      - {qui: toi, dit: "Le double de la 12, Sandrine."}
      - {qui: sandrine, regarde: toi}
      - {pause: 1200}
      - {qui: sandrine, dit: "La police l'a rendu en juin, dans une enveloppe, avec un reçu. Depuis, il dort au tiroir."}
      - {narration: "Elle ouvre le tiroir. Le double du 12 y est couché sur le crochet de laiton qu'on a dévissé du tableau."}
      - {qui: sandrine, dit: "Je vous le donne. Mais j'écris l'heure, et votre nom en entier."}
      - {qui: sandrine, geste: ecrit}
      - {narration: "« 0 h 40, double du 12, {prenom} {nom}. » Elle pose la clé sur le comptoir. Le crochet, elle le remet au tiroir."}
      - {qui: sandrine, dit: "Vous me direz l'heure en redescendant. Je l'écrirai aussi."}
      - {qui: toi, va: [-9, -8]}

  # La conférence (créneau 17) : la veille du match, le vestiaire. La fiche de Dauzat, la
  # directrice de l'information, et la commandante sur le seuil.
  - id: h7.ci.fiche
    quand: carte
    prefixe: "sl.h7.s6_conference"
    moment: avant
    roles: [selectionneur]
    si: "flag(histoire_h7)"
    lieu: stade
    tranche: aprem
    acteurs:
      - {qui: toi, place: coach}
      - {qui: dauzat, place: porte, cache: true}
      - {qui: vence, place: porte, cache: true}
      - {qui: benali, place: porte, cache: true}
      - {qui: passant, cache: true}
      - {qui: passante, cache: true}
      - {qui: ancien, cache: true}
      - {qui: fan, cache: true}
    etapes:
      - {narration: "Le vestiaire de la Rive, la veille du match. Au bout du couloir, on entend la salle de presse se remplir : des chaises qu'on tire, un micro qu'on essaie."}
      - {qui: dauzat, entre: tableau}
      - {qui: dauzat, dit: "Votre fiche, {toi}. Je l'ai écrite à la main : à la télévision, une écriture, ça rassure."}
      - {narration: "Une fiche bristol, quelques mots à l'encre bleue, de son écriture penchée. Il a souligné le dernier."}
      - {qui: vence, entre: [2, 2]}
      - {qui: vence, dit: "On commence dans dix minutes. Vous parlez avant les questions, ou après ?"}
      - {qui: dauzat, dit: "Avant. Ensuite, il n'y aura pas de questions."}
      - {qui: vence, dit: "J'ai lu la fiche par-dessus son épaule, dans le couloir. Elle passera partout."}
      - {qui: vence, sort: true}
      - {qui: benali, entre: [4, 3]}
      - {narration: "La commandante Benali s'arrête sur le seuil, en imperméable. Elle regarde l'heure à sa montre, puis la fiche dans ta main."}
      - {qui: benali, dit: "Je serai près de la porte. J'aime entendre les phrases à l'heure où on les dit."}
      - {qui: dauzat, va: porte}
      - {narration: "Dauzat te tient la porte. Au bout du couloir, le micro siffle, une fois."}

conversations:
  # 2011, avant la nuit : le bus derrière la Rive, et le père du petit au comptoir.
  - id: h7.cv.terminus_bus
    roles: [selectionneur]
    si: "flag(histoire_h7) && !flag(h7_rance_mort)"
    lieu: terminus
    tranches: [midi, aprem, soir]
    qui:
      - {qui: norbert, place: norbert}
      - {id: patron, qui: commercant, nom: "Le patron", place: patron}
      - {qui: bertrand_rance, place: bertrand}
    repliques:
      - {qui: norbert, dit: "Ils ont laissé leur bus de 2010 derrière l'hôtel de la Rive. Le loueur n'en veut plus, et aucun chauffeur ne veut le conduire."}
      - {qui: patron, dit: "Un bus que personne ne conduit, ça finit en pigeonnier."}
      - {qui: norbert, dit: "{pg, select, f{La sélectionneuse dort} other{Le sélectionneur dort}} à la Rive, paraît-il. Pas à la capitale. À la Rive, sous les pigeons."}
      - {qui: bertrand_rance, dit: "Mon fils aussi, il dort à la Rive."}
      - {qui: patron, dit: "Tu lui as dit, que tu regardais ses matchs d'ici ?"}
      - {qui: bertrand_rance, dit: "Il le saura. On a le temps."}

  # Les jours d'après le 14 : la presse dans le hall, et l'hôtelier qui offre le café.
  - id: h7.cv.hall_presse
    roles: [selectionneur]
    si: "flag(histoire_h7) && flag(h7_rance_mort) && annee == 2011"
    lieu: hotel
    tranches: [matin, midi, aprem]
    qui:
      - {id: journaliste, qui: passant, nom: "Un journaliste", place: [3, 2]}
      - {id: journaliste_2, qui: passante, nom: "Une journaliste", place: [4, 4]}
      - {qui: escande, place: reception}
    repliques:
      - {qui: journaliste, dit: "Malaise cardiaque, à vingt-cinq ans, constaté à six heures. Personne ne constate rien à six heures, dans un hôtel."}
      - {qui: journaliste_2, dit: "C'est la kiné qui l'a trouvé. La kiné, pas le réveil. Note ça."}
      - {qui: journaliste, dit: "Et {pg, select, f{la sélectionneuse, elle descend} other{le sélectionneur, il descend}} quand ?"}
      - {qui: journaliste_2, dit: "Le livreur des journaux dit que toutes les lampes du hall étaient allumées à quatre heures."}
      - {qui: escande, dit: "Un café pour la presse ? La maison l'offre, tant que vous restez dans le salon."}

  # Après la nuit : la buvette du kop, avant les bougies.
  - id: h7.cv.buvette_poussin
    roles: [selectionneur]
    si: "flag(histoire_h7) && flag(h7_rance_mort) && !flag(h7_bougies)"
    lieu: buvette
    tranches: [soir, nuit]
    qui:
      - {qui: gege, place: fond}
      - {qui: vecchio, place: zinc_1}
      - {qui: fan, place: zinc_2}
    repliques:
      - {qui: fan, dit: "Le petit Rancé, je l'ai eu en poussins. Il pleurait quand on perdait. Quand on gagnait aussi."}
      - {qui: vecchio, dit: "Le Racing l'a vendu gamin. On a dit que c'était une chance pour lui. On dit toujours ça."}
      - {qui: gege, dit: "Le virage ira devant l'hôtel. Avec des bougies. Pas de chants, pas de fumigènes."}
      - {qui: fan, dit: "Et {pg, select, f{la sélectionneuse} other{le sélectionneur}} ?"}
      - {qui: gege, dit: "On ne lui demandera rien. {pg, select, f{Si elle descend, elle descend} other{S'il descend, il descend}}."}

  # La fleuriste des Immortelles : les gerbes sans carte.
  - id: h7.cv.immortelles
    roles: [selectionneur]
    si: "flag(histoire_h7) && flag(h7_rance_mort)"
    lieu: fleuriste
    tranches: [matin, aprem]
    qui:
      - {qui: huguette, place: huguette}
      - {qui: passante, place: [1, 2]}
    repliques:
      - {qui: passante, dit: "Une gerbe pour le petit Rancé. Bordeaux et gris. Pas de carte."}
      - {qui: huguette, dit: "C'est la troisième sans carte cette semaine. Il y a ceux qui ont honte, et ceux qui ont peur."}
      - {qui: passante, dit: "Et vous les reconnaissez comment ?"}
      - {qui: huguette, dit: "Ceux qui ont peur paient en liquide."}

  # 2012 : la main de 1 h 47, à L'Écho.
  - id: h7.cv.echo_main
    roles: [selectionneur]
    si: "flag(histoire_h7) && flag(h7_main_vue)"
    lieu: echo
    tranches: [matin, aprem, soir]
    qui:
      - {qui: lea, place: journaliste}
      - {id: chef, qui: inconnu, nom: "Le chef d'édition", place: redacteur}
    repliques:
      - {qui: chef, dit: "Ta main, sur la photo. On ne publie pas un poignet sans un nom."}
      - {qui: lea, dit: "J'ai un bracelet. Tressé, rouge et noir. Il n'y en a pas cinquante dans la sélection."}
      - {qui: chef, dit: "Un bracelet, c'est une rumeur. Deux sources, c'est un titre."}
      - {qui: lea, dit: "La deuxième dort au deuxième étage de la Rive. Elle ne répond pas encore."}

  # Le lendemain du plateau : le tabac du Quai, la radio, l'heure.
  - id: h7.cv.tabac_heure
    roles: [selectionneur]
    si: "flag(histoire_h7) && flag(h7_rossard_plateau)"
    lieu: tabac
    tranches: [matin, midi]
    qui:
      - {id: buraliste, qui: commercant, nom: "Le buraliste", place: patron}
      - {id: marinier, qui: passant, nom: "Un marinier", place: [1, 2]}
      - {qui: ancien, place: [-1, 3]}
    repliques:
      - {qui: marinier, dit: "Deux heures vingt-cinq. Il l'a dit deux fois, Rossard, pour qu'on retienne."}
      - {qui: ancien, dit: "En 1990, il avait la larme facile, sur ce plateau-là. Il a séché, depuis."}
      - {qui: buraliste, dit: "Une heure à la minute près, ça ne s'invente pas au comptoir. Quelqu'un l'a lue sur un papier."}
      - {qui: marinier, dit: "Le capitaine, il dort encore au 14 ?"}
      - {qui: buraliste, dit: "Il ne dort plus nulle part, à ce qu'on raconte au quai."}

  # La plante devant la 12 : deux femmes de chambre, l'escalier de service.
  - id: h7.cv.plante
    roles: [selectionneur]
    si: "flag(histoire_h7) && flag(h7_plante)"
    lieu: hotel
    tranches: [matin, aprem]
    qui:
      - {id: chambre, qui: passante, nom: "Une femme de chambre", place: [-8, -6]}
      - {id: veilleur, qui: portier, nom: "Le veilleur de jour", place: [-6, -5]}
    repliques:
      - {qui: chambre, dit: "Tu l'arroses, toi, la plante du deuxième ?"}
      - {qui: veilleur, dit: "Jamais. Monsieur Escande a dit qu'on n'y touche pas."}
      - {qui: chambre, dit: "Moi non plus. Elle a pris dix centimètres depuis mars."}
      - {qui: veilleur, dit: "L'après-midi, quand je fais l'étage, j'entends couler de l'eau derrière la porte. Je ne m'arrête pas."}
      - {qui: chambre, dit: "Le midi, tu bois, aussi."}

  # La capture de 1 h 47, au square, tant que l'adolescent ne te l'a pas montrée.
  - id: h7.cv.square_capture
    roles: [selectionneur]
    si: "flag(histoire_h7) && flag(h7_main_vue) && !mission(h7_photo_effacee)"
    lieu: square
    tranches: [aprem, soir]
    qui:
      - {id: ado, qui: enfant, nom: "Un adolescent"}
      - {id: copain, qui: fan, nom: "Son copain"}
    repliques:
      - {qui: ado, dit: "Je l'ai encore, la photo de 1 h 47. Effacée à deux heures ; moi, j'avais fait la capture."}
      - {qui: copain, dit: "Tu la montres à personne ?"}
      - {qui: ado, dit: "À ceux qui paient. L'Écho, la télé, et {pg, select, f{la sélectionneuse} other{le sélectionneur}}, si ça passe par ici."}
      - {qui: copain, dit: "Tu vas la vendre deux fois ?"}
      - {qui: ado, dit: "Une photo, ça ne s'use pas."}

  # 2013 : au café de la Mairie, le registre et la chambre 11.
  - id: h7.cv.cafe_registre
    roles: [selectionneur]
    si: "flag(histoire_h7) && flag(h7_appartement_repris)"
    lieu: cafe_mairie
    tranches: [matin, midi]
    qui:
      - {qui: dauzat, place: sauvan}
      - {id: ministere, qui: inconnu, nom: "Un homme du ministère", place: [2, 2]}
    repliques:
      - {qui: ministere, dit: "Le comité provisoire veut les procès-verbaux de 2011. Tous."}
      - {qui: dauzat, dit: "Il les aura. Dans l'ordre, et sans une rature."}
      - {qui: ministere, dit: "Et {pg, select, f{la sélectionneuse} other{le sélectionneur}} ? On dit que ça pose des questions."}
      - {qui: dauzat, dit: "On a repris l'appartement du quai. Ça dort à la 11, contre le mur de la 12. Ça calme, un mur."}
      - {qui: ministere, dit: "Et si ça continue ?"}
      - {qui: dauzat, dit: "Il reste des chambres."}

  # 2013 : au Terminus, l'ardoise du père, réglée par un homme en manteau.
  - id: h7.cv.terminus_ardoise
    roles: [selectionneur]
    si: "flag(histoire_h7) && flag(h7_pere_vu)"
    lieu: terminus
    tranches: [aprem, soir]
    qui:
      - {qui: norbert, place: norbert}
      - {id: patron, qui: commercant, nom: "Le patron", place: patron}
      - {qui: bertrand_rance, place: bertrand}
    repliques:
      - {qui: norbert, dit: "Bertrand, ton ardoise a disparu du tableau."}
      - {qui: bertrand_rance, dit: "Un monsieur l'a payée. Il ne m'a pas regardé."}
      - {qui: patron, dit: "Il a laissé un billet de plus. Pour toi, il a dit."}
      - {qui: bertrand_rance, dit: "Je ne le boirai pas. Mets-le dans le tronc de Saint-Aubin."}
      - {qui: norbert, dit: "Et {pg, select, f{la sélectionneuse, elle est revenue} other{le sélectionneur, il est revenu}} jouer aux cartes ?"}
      - {qui: bertrand_rance, dit: "{pg, select, f{Elle} other{Il}} ne joue pas. {pg, select, f{Elle} other{Il}} signe."}
