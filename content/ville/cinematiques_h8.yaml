# Histoire 8 — « L'Oreillette » : les scènes jouées et les conversations
# surprises (format : docs/histoires/scenes_jouees.md). Une scène jouée ne se
# joue pas, on la regarde ; une conversation s'entend en passant près de ceux
# qui parlent. Le directeur sportif (ou la directrice : la carrière choisit,
# les textes accordent), 2024-2027.
#
# Ce que ces scènes font du livre, sans rien y décider :
#   · l'introduction (quatre répliques, à six heures dix, au club-house) plante
#     l'oreillette sans la montrer : le délégué du fonds écoute quelqu'un
#     d'autre pendant qu'il te parle, une main à l'oreille ; elle plante aussi
#     Joachim Ferlac, que le héros a connu. Le soir du premier jour reprend le
#     reste : la buvette du kop et la friche de la Tréfilerie (après le délégué
#     et sa berline), la machine 4 de la laverie, où l'on se réveillera (après
#     le pont roulant) ;
#   · la voix ne parle jamais dans une scène : elle est dans les cartes. Ici,
#     on ne l'entend que dans ce que les autres en disent ;
#   · avant une carte, le doute : la salle d'attente du docteur Ober, la
#     feuille de match de Mbako, la voix d'Inès entendue avant son visage, le
#     journal de Vaubourg la veille, la gare routière avant le car du Kambara,
#     la voisine du dessous avant deux heures du matin, la minute que Josiane
#     te laisse avant 23 h 58, les quatre piles de Léa ;
#   · après, ce que les autres en disent : le casier 4 le lendemain du lundi,
#     le clubhouse le matin de six heures trente et une, la caisse grise de la
#     saisie ;
#   · aucune ne dit qui parle dans l'oreillette.
# Les acteurs `sans_*` (cachés, sans aucune étape) vident la pièce : la ville y
# laisse sinon les habitués et les clients de l'heure qu'il est en ville (pas
# de celle de la scène). Un habitué ne quitte sa place que si un acteur de la
# scène porte le même `qui` ; le personnel parle par la bouche `commercant`.
# `saison` est celle de la ville : 1 = 2024-2025, 2 = 2025-2026, 3 = 2026-2027.
cinematiques:
  # ══════════════════════════════════════════════════════ l'introduction
  # Quatre répliques à six heures dix, au pied de l'escalier du club-house, et la première carte
  # (l'oreillette posée dans la main) se joue sur place. Le reste de l'ancienne introduction
  # (la buvette du kop, la friche, la laverie) est distillé sur le premier jour : la buvette et la
  # friche le soir, après le délégué et sa berline (h8.ci.buvette, qui enchaîne h8.ci.friche), la
  # laverie à trois heures, après le pont roulant (h8.ci.laverie). Les graines plantées sont
  # toujours là : les soixante-douze matchs et le nom d'Almadis sur la tribune, la voiture de
  # Joachim à la friche, la chemise de la machine 4.
  - id: h8.ci.intro
    quand: debut
    roles: [ds]
    si: "flag(histoire_h8)"
    titre: "L'Oreillette"
    sous: "Aubérive, 2024"
    lieu: clubhouse
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {id: delegue, qui: inconnu, nom: "Le délégué du fonds", place: vitrine}
      # six heures dix : la secrétaire n'est pas là, Vaubourg ne monte qu'à six heures et demie
      - {id: sans_aulard, qui: aulard, cache: true}
      - {id: sans_josiane, qui: josiane, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {musique: livre}
      - {narration: "Six heures dix, au club-house. Sous la vitrine des trophées, le délégué du fonds t'attend, une main sur l'oreille. Il te parle les yeux sur la porte, et c'est quelqu'un d'autre qu'il écoute."}
      - {qui: delegue, dit: "Six heures dix. Ni six heures, ni six heures et quart. Vous n'avez pas dormi ? Il l'avait prévu.", geste: telephone}
      - {qui: toi, pense: "Celui d'avant n'avait pas de visage. Je l'ai vu naître sur un tableau blanc, chez Joachim, en 2016. On riait, ce jour-là."}
      - {qui: delegue, dit: "Cinq ans chez lui, puis une porte qui claque. Le fonds aime les gens qui reviennent pour avoir raison. Tendez la main.", geste: pointe}

  # Le soir du premier jour, après le délégué et sa berline : la buvette du kop, onze heures.
  # Gégé et Nino ne demandent pas ce que tu fais, mais pour qui.
  - id: h8.ci.buvette
    quand: carte
    cartes: [ds.h8.pro5_delegue_toi, ds.h8.pro5_delegue]
    moment: apres
    roles: [ds]
    si: "flag(histoire_h8)"
    lieu: buvette
    tranche: soir
    suite: h8.ci.friche
    acteurs:
      - {qui: toi, place: porte}
      - {qui: gege, place: fond}
      - {qui: nino, place: zinc_3}
      - {id: barman, qui: commercant, nom: "Le barman", place: barman}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {musique: ville_nuit}
      - {narration: "La buvette du kop, onze heures du soir. Au-dessus du zinc, un écran fait défiler le calendrier de la saison, soixante-douze matchs en petites lignes blanches."}
      - {qui: toi, va: zinc_2}
      - {qui: barman, dit: "On ferme. Sauf pour ceux qui ont une tête à pas dormir. Vous, vous en avez une belle."}
      - {qui: nino, dit: "C'est {pg, select, f{la nouvelle} other{le nouveau}}, mon oncle. Le fonds l'a fait venir de la capitale pour parler à ses ordinateurs."}
      - {qui: gege, regarde: toi}
      - {qui: gege, dit: "Celui d'avant, on l'a jamais vu ici. Il signait la nuit. Le matin, on apprenait qui était parti."}
      - {qui: gege, dit: "Tu fais quoi, je m'en moque. Tu travailles pour qui, toi ?"}
      - {qui: nino, dit: "Pour Almadis. Comme la pelouse, le car, les maillots, et le nom écrit sur la tribune."}
      - {qui: gege, geste: boit}
      - {qui: gege, dit: "Alors la bière, c'est moi. Mon porte-monnaie, le fonds l'a pas encore racheté.", ton: sourire}
      - {narration: "Le barman éteint l'écran. Dans le noir, les soixante-douze lignes blanches restent un moment sur la vitre, puis s'effacent."}

  # En rentrant au duplex, par la friche de la Tréfilerie : l'endroit où l'on a retrouvé la
  # voiture de Joachim Ferlac. (Le délégué n'y est plus : sa phrase est dans l'introduction.)
  - id: h8.ci.friche
    quand: suite
    lieu: friche
    tranche: nuit
    meteo: brume
    acteurs:
      - {qui: toi, place: porte}
    etapes:
      - {narration: "La friche de la Tréfilerie, une heure du matin, sur le chemin du duplex. La brume monte de la Rive. Un feu de palettes que personne ne surveille ; contre la palissade, huit bougies électriques qui ne vacillent pas."}
      - {qui: toi, va: [2, 1]}
      - {qui: toi, pense: "C'est ici qu'on a retrouvé la voiture de Joachim, en décembre. Il aimait les endroits où personne ne passe. Il disait qu'on y entendait mieux."}
      - {narration: "Une des bougies clignote, puis s'éteint. Les sept autres continuent sans elle."}

  # Après le pont roulant : tu ne dors pas, la voix tutoie, et tu marches jusqu'à la seule vitrine
  # allumée de la rue du Stade. La machine 4 est celle de « La laverie » (saison 2).
  - id: h8.ci.laverie
    quand: carte
    cartes: [ds.h8.pro6_pont_roulant]
    moment: apres
    roles: [ds]
    si: "flag(histoire_h8)"
    lieu: laverie
    tranche: nuit
    acteurs:
      - {qui: toi, place: porte}
      - {id: gerant, qui: commercant, nom: "Le gérant", place: pliage}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Trois heures, rue du Stade. Tu as renoncé à dormir. Une seule vitrine est allumée, celle de la laverie, où le néon clignote au-dessus des séchoirs et où une machine tourne, la 4."}
      - {qui: gerant, dit: "On est fermés depuis minuit. Je reste pour la 4. Quelqu'un l'a lancée à onze heures, et il est pas revenu."}
      - {qui: toi, va: attente_1}
      - {qui: toi, pense: "Une chemise blanche, seule dans le tambour. Une chemise de bureau, comme la mienne. Comme celle que je remettrai demain à six heures dix."}
      - {qui: gerant, dit: "Vous pouvez attendre, si vous dormez pas. Ici, personne dort. C'est pour ça, les chaises."}
      - {qui: gerant, regarde: toi}
      - {qui: gerant, dit: "Vous êtes d'ici ?"}
      - {qui: toi, dit: "Depuis ce matin."}
      - {pause: 1200}
      - {musique: sombre}
      - {narration: "La 4 s'arrête d'un coup. Personne ne vient la vider. Contre le hublot, la chemise reste collée, les bras ouverts."}

  # ═════════════════════════════════════════ saison 1 (2024-2025) — la voix
  # Avant la boîte du docteur (la première prédiction de la voix) : la salle
  # d'attente, où l'on compare ses nuits comme des notes.
  - id: h8.ci.salle_attente
    quand: carte
    cartes: [ds.h8.cp.un_demi, ds.h8.cp.un_demi_docile]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h8)"
    lieu: cabinet
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {id: milieu, qui: passant, nom: "Un milieu", place: attente_1}
      - {id: lateral, qui: passant, nom: "Un latéral", place: attente_2}
      - {qui: ober, place: medecin, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
      - {id: sans_sabatier, qui: sabatier, cache: true}
      - {id: sans_rouvier, qui: rouvier, cache: true}
    etapes:
      - {narration: "Le cabinet, neuf heures moins le quart du soir. Dans la salle d'attente, deux joueurs en survêtement se montrent l'écran de leur montre."}
      - {qui: milieu, dit: "Trois heures six, cette nuit. Et toi ?"}
      - {qui: lateral, dit: "Deux heures quarante. Il va me donner la grande boîte."}
      - {qui: milieu, dit: "La grande, elle fait dormir, mais le matin t'as les jambes en coton. Moi, je préfère pas dormir."}
      - {qui: toi, va: [1, 1]}
      - {qui: lateral, regarde: toi}
      - {qui: lateral, dit: "Vous aussi, vous venez pour dormir ? Faites voir votre montre."}
      - {qui: ober, entre: medecin}
      - {qui: ober, dit: "{pg, select, f{La directrice sportive} other{Le directeur sportif}} d'abord. Vous deux, vous dormirez après."}
      - {qui: milieu, geste: tete_basse}
      - {narration: "Sur la table d'examen, une boîte blanche attend déjà, sans étiquette, à côté d'un gobelet d'eau."}

  # Un après-midi sans carte, avant la saison de Milo : les gamins du centre
  # tendent le poignet pour connaître leur couleur (la ligne de 2017 les classe).
  - id: h8.ci.mercredi
    quand: semaine
    roles: [ds]
    si: "flag(histoire_h8) && saison <= 2"
    lieu: centre
    tranches: [aprem]
    tranche: aprem
    acteurs:
      - {qui: toi, place: porte}
      - {id: educateur, qui: passant, nom: "L'éducateur", place: educateur}
      - {id: gamin, qui: enfant, nom: "Un gamin de quatorze ans", place: gamin_2}
      - {id: copain, qui: enfant, nom: "Son copain", place: mere}
      - {id: sans_mbako, qui: mbako, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Le préfabriqué du centre, après la séance des moins de quinze ans. Les gamins tendent le poignet à l'éducateur, un par un, la manche relevée."}
      - {qui: gamin, dit: "Monsieur, je suis quoi ? Vert ou rouge ?"}
      - {qui: educateur, dit: "Orange. Recours.", geste: lit}
      - {qui: copain, dit: "Moi, j'étais rouge la semaine dernière, et j'ai marqué deux buts."}
      - {qui: educateur, dit: "Les buts, la tablette s'en fiche. Elle regarde le reste."}
      - {qui: gamin, regarde: toi}
      - {qui: gamin, dit: "C'est vous qui choisissez les couleurs ?"}
      - {qui: toi, pense: "Orange, rouge, vert. À quatorze ans, on m'aurait mis orange, et j'aurais couru plus vite pour rien."}
      - {qui: educateur, dit: "Allez, encore un. Et cette fois, vous regardez pas votre poignet en courant."}
      - {qui: gamin, sort: true}
      - {narration: "Le copain sort le dernier, le bras gauche serré contre lui, la manche tirée sur le bracelet."}

  # La première fois qu'on entre au vestiaire, la première saison, tant que
  # Kerdal est là : vingt-cinq bracelets qui chargent, et une place vide au 4.
  - id: h8.ci.vestiaire
    quand: lieu
    roles: [ds]
    si: "flag(histoire_h8) && saison == 1 && !flag(h8_kerdal_mort) && !flag(h8_kerdal_vendu)"
    lieu: stade
    acteurs:
      - {qui: toi, place: porte}
      - {id: intendant, qui: ancien, nom: "L'intendant", place: tableau}
      - {qui: kerdal, place: banc_5}
      - {id: jeune, qui: passant, nom: "Le plus jeune", place: banc_2}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Le vestiaire de la Rive. Au mur, là où il y avait le tableau noir, vingt-cinq bracelets noirs chargent sur un râtelier, chacun sous son numéro, en clignotant."}
      - {qui: intendant, dit: "Avant, je ramassais les maillots. Maintenant, c'est des bracelets. Le lundi, il en manque toujours un."}
      - {qui: jeune, dit: "Le 4, il le rend jamais. Il dort avec."}
      - {qui: kerdal, dit: "Je dors pas avec. Je dors pas, c'est tout. Il dit ça parce qu'il est gentil."}
      - {qui: kerdal, regarde: toi}
      - {qui: toi, va: [1, 1]}
      - {qui: intendant, dit: "Le fonds veut qu'on les rebranche à minuit. Moi, à minuit, je dors. Enfin, j'essaie."}
      - {qui: kerdal, geste: tete_basse}
      - {narration: "Sous le numéro 4, l'emplacement est vide, et le chargeur clignote quand même."}

  # Juste après le lundi, quand Kerdal est mort : le vestiaire du lendemain.
  # Mbako refuse la séance ; le plus jeune pose le premier caillou blanc.
  - id: h8.ci.casier_quatre
    quand: drapeau
    drapeau: h8_kerdal_mort
    roles: [ds]
    si: "flag(histoire_h8)"
    lieu: stade
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {qui: mbako, place: coach}
      - {qui: ober, place: doc}
      - {id: capitaine, qui: passant, nom: "Peyrard, le capitaine", place: banc_1}
      - {id: jeune, qui: passant, nom: "Le plus jeune", place: banc_3}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {musique: sombre}
      - {narration: "Le lendemain, huit heures. Le vestiaire est plein, et personne ne parle. Le casier 4 est resté ouvert, ses affaires dedans."}
      - {qui: capitaine, dit: "On s'entraîne, coach ?"}
      - {qui: mbako, dit: "Non. Ce matin, on s'assoit. Une heure. C'est moi qui l'écris sur la feuille du fonds, à la place de la séance."}
      - {qui: ober, dit: "Je suis là, si quelqu'un veut parler. Ou dormir."}
      - {qui: capitaine, regarde: ober}
      - {qui: capitaine, dit: "Dormir. Avec vos boîtes ?", ton: noir}
      - {qui: ober, geste: ecrit}
      - {qui: mbako, regarde: toi}
      - {qui: mbako, emote: "..."}
      - {narration: "Le plus jeune se lève, pose un caillou blanc au fond du casier 4, et retourne s'asseoir en s'essuyant les doigts sur son short."}

  # Avant la composition demandée par Pari-Rive : la feuille de Mbako, écrite au
  # stylo, une seule, comme à seize ans. Le choix reste dans la carte.
  - id: h8.ci.compo
    quand: carte
    cartes: [ds.h8.pr.compo]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h8)"
    lieu: clubhouse
    tranche: midi
    acteurs:
      - {qui: toi, place: porte}
      - {qui: mbako, place: guichet}
      - {qui: josiane, place: secretaire}
      - {id: sans_aulard, qui: aulard, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Samedi, une heure et demie. Mbako est descendu du vestiaire avec sa feuille de match, écrite au stylo, pliée en deux."}
      - {qui: toi, va: centre}
      - {qui: mbako, dit: "Voilà les onze. Personne la voit avant trois heures moins deux, {toi}. Même pas ta machine.", geste: pointe}
      - {qui: josiane, dit: "Je vous la photocopie, monsieur Mbako ?"}
      - {qui: mbako, dit: "Non, madame Josiane. Une seule feuille. Comme quand j'avais seize ans."}
      - {qui: josiane, geste: ecrit}
      - {qui: mbako, sort: true}
      - {narration: "La feuille est encore tiède de sa poche. Dans ta veste, ton téléphone vibre une fois. Il est 13 h 57."}

  # ══════════════════════════════════════════ saison 2 (2025-2026) — le bruit
  # Avant le hall de l'hôtel : on entend la voix d'Inès avant de voir son
  # visage. La carte dira qui elle est ; la scène ne le dit pas.
  - id: h8.ci.hall
    quand: carte
    cartes: [ds.h8.op.hall, ds.h8.op.hall_lea]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h8)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: kara, place: salon_3}
      - {id: veilleur, qui: portier, nom: "Le veilleur de nuit", place: reception}
      - {id: sans_nassir, qui: nassir, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
      - {id: sans_commercant, qui: commercant, cache: true}
    etapes:
      - {narration: "L'hôtel de la Rive, le soir. Le hall sent la cire et le café de distributeur. Une jeune femme en parka verte attend, un gobelet entre les mains."}
      - {qui: kara, dit: "Il est quelle heure, ici ?"}
      - {qui: veilleur, dit: "Neuf heures dix. La même qu'à la capitale, mademoiselle."}
      - {qui: kara, dit: "Je sais. Je voulais l'entendre de quelqu'un d'ici."}
      - {qui: toi, emote: "!"}
      - {qui: toi, pense: "Cette voix. Je l'ai entendue cette nuit, à trois heures, tout près de mon oreille. Elle disait tu."}
      - {qui: veilleur, regarde: toi}
      - {qui: kara, geste: boit}
      - {narration: "Elle pose son gobelet sur l'accoudoir et se lève d'un coup, sa parka sur le bras."}

  # Avant la veille (la variante rare comprise) : dix-huit heures quarante,
  # Josiane monte, le journal du lendemain, une erreur page six.
  - id: h8.ci.veille
    quand: carte
    cartes: [ds.h8.b3_veille, ds.h8.b3_veille_chaise]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h8)"
    lieu: clubhouse
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: aulard, place: president}
      - {qui: josiane, place: visiteur_1}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Dix-huit heures quarante. À l'étage, la porte de l'ancien bureau est ouverte. Ce soir, Madame Josiane a monté l'escalier, une marche après l'autre, avec la rampe."}
      - {qui: josiane, dit: "Je vous ai apporté le journal de demain. Le livreur me le laisse la veille au soir."}
      - {qui: aulard, dit: "Vous êtes montée, Josiane. Vous montez plus, pourtant."}
      - {qui: josiane, dit: "Ce soir, si."}
      - {qui: aulard, geste: lit}
      - {qui: aulard, dit: "Page six, ils ont mis 1975 pour la finale. Vous leur écrirez ?"}
      - {qui: josiane, dit: "Demain matin, à la première heure."}
      - {qui: josiane, sort: true}
      - {qui: aulard, regarde: toi}
      - {narration: "Il plie le journal en quatre, exactement, et le pose sur le coin du bureau, là où on le trouvera."}

  # Juste après six heures trente et une : le matin au club-house. Le délégué
  # a une phrase qui glace ; Josiane redescend avec la canne (au clou, en août,
  # « personne ne dit qui »).
  - id: h8.ci.six_trente_et_une
    quand: drapeau
    drapeau: h8_vaubourg_mort
    roles: [ds]
    si: "flag(histoire_h8)"
    lieu: clubhouse
    tranche: matin
    acteurs:
      - {qui: toi, place: centre}
      - {id: delegue, qui: inconnu, nom: "Le délégué du fonds", place: cafe}
      - {qui: josiane, place: guichet, cache: true}
      - {qui: gege, place: vitrine, cache: true}
      - {id: sans_aulard, qui: aulard, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Sept heures et quart. Le médecin est redescendu. Quelqu'un a ouvert la fenêtre du palier ; l'air de la Rive monte l'escalier jusqu'au clou."}
      - {qui: delegue, dit: "Le fonds présente ses condoléances. Il faudra libérer le bureau avant lundi : les machines manquent de place."}
      - {qui: josiane, entre: guichet}
      - {qui: josiane, dit: "Il avait laissé son café sur la troisième marche. Il le buvait toujours en redescendant."}
      - {qui: gege, entre: vitrine}
      - {qui: gege, dit: "Samedi, le virage chantera. Il aimait pas qu'on chante pour lui. Il est plus là pour l'empêcher."}
      - {qui: delegue, dit: "Le modèle avait prévu une baisse de l'affluence, ce mois-ci. On pourra comparer."}
      - {qui: gege, regarde: delegue}
      - {qui: gege, emote: colere}
      - {qui: josiane, sort: true}
      - {narration: "Josiane monte à l'étage. Elle redescend avec la canne, qu'elle tient par le milieu, à l'horizontale, loin d'elle."}

  # Avant le car de six heures pour l'aéroport (Mbako part sélectionner le
  # Kambara) : les deux anciens du club se disent au revoir avant toi.
  - id: h8.ci.car
    quand: carte
    cartes: [ds.h8.kb.car, ds.h8.kb.car_bras]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h8)"
    lieu: gareRoutiere
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {qui: mbako, place: banc_1}
      - {qui: gege, place: banc_2}
      - {id: chauffeur, qui: passant, nom: "Le chauffeur", place: quai}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
      - {id: sans_commercant, qui: commercant, cache: true}
    etapes:
      - {narration: "La gare routière, six heures moins dix. Le car de l'aéroport chauffe au quai. Lian Mbako n'a qu'une valise, et Gégé est venu avec un thermos."}
      - {qui: gege, dit: "T'avais seize ans. Ta première licence, tu l'as signée sur le comptoir de la buvette. Le bureau était fermé."}
      - {qui: mbako, dit: "Et tu m'as payé un diabolo pour fêter ça. Tu me l'as fait rembourser le samedi suivant."}
      - {qui: gege, dit: "Fallait bien que t'apprennes, au Racing."}
      - {qui: gege, geste: boit}
      - {qui: chauffeur, dit: "On part à six heures pile. J'attends personne."}
      - {qui: mbako, regarde: toi}
      - {qui: gege, dit: "{pg, select, f{La voilà} other{Le voilà}}. Je vous laisse. Les adieux, à mon âge, je les fais de loin."}
      - {qui: gege, va: banc_3}
      - {narration: "Mbako prend sa valise, la repose. Il regarde le car, puis le quai, puis toi."}

  # ══════════════════════════════════════ saison 3 (2026-2027) — le silence
  # Juste après la saisie : la caisse grise, la liste. Josiane fait la liste en
  # double, comme elle a toujours tout fait.
  - id: h8.ci.saisie
    quand: carte
    cartes: [ds.h8.c2_propriete, ds.h8.c2_propriete_pari]
    moment: apres
    roles: [ds]
    si: "flag(histoire_h8)"
    lieu: clubhouse
    tranche: soir
    acteurs:
      - {qui: toi, place: centre}
      - {id: delegue, qui: inconnu, nom: "Le délégué du fonds", place: cafe}
      - {qui: josiane, place: secretaire}
      - {id: technicien, qui: garagiste, nom: "Un technicien du fonds", place: guichet}
      - {id: sans_aulard, qui: aulard, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "Le soir de la saisie. Sur la table du conseil, une caisse grise se remplit : un téléphone, un ordinateur, une carte de démarrage, des câbles roulés en huit."}
      - {qui: technicien, dit: "Il me manque le code de l'ordinateur. Le code personnel, pas celui du club."}
      - {qui: delegue, dit: "{pg, select, f{La directrice sportive} other{Le directeur sportif}} vous le donnera. Ce soir, on donne tout."}
      - {qui: technicien, geste: ecrit}
      - {qui: josiane, dit: "Je fais la liste en double, monsieur. Une pour vous, une pour nous. Si quelque chose se perd, on saura qui."}
      - {qui: delegue, emote: "..."}
      - {qui: delegue, dit: "Le fonds ne perd rien, madame. Il reprend."}
      - {qui: technicien, sort: true}
      - {narration: "Le délégué referme la caisse grise. Josiane plie sa copie de la liste en quatre et la range dans son sac, avec les autres."}

  # Avant « Deux heures » (la troisième prédiction ; la porte de la clinique si
  # l'oreillette est gardée) : la voisine du dessous entend quelqu'un parler, la
  # nuit. Les deux variantes tiennent : personne ne dit qui répond.
  - id: h8.ci.mur
    quand: carte
    cartes: [ds.h8.c3_deux_heures, ds.h8.c3_deux_heures_gardee]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h8)"
    lieu: appartement
    tranche: nuit
    acteurs:
      - {qui: toi, place: fenetre}
      - {id: voisine, qui: passante, nom: "La voisine du dessous", place: porte, cache: true}
    etapes:
      - {narration: "Deux heures moins dix. Plus rien ne clignote dans l'appartement : ni écran, ni montre, ni voyant. Le frigo s'arrête, puis repart."}
      - {qui: voisine, entre: milieu}
      - {qui: voisine, dit: "Pardon, il est tard. J'habite en dessous. Vous parlez à quelqu'un, la nuit ? On entend tout, par la gaine du chauffage."}
      - {qui: toi, dit: "Je ne parle à personne."}
      - {qui: voisine, dit: "Alors c'est quelqu'un qui vous répond. Ma fille dit qu'il a une voix gentille. Elle dort plus sans."}
      - {qui: voisine, sort: true}
      - {qui: toi, pense: "Deux heures moins cinq. Il n'y a personne dans cette pièce. Je l'ai vérifié deux fois."}
      - {musique: sombre}
      - {pause: 1500}
      - {narration: "Par la gaine du chauffage, en dessous, une petite fille chuchote : « Bonne nuit. » Tu ne sais pas à qui."}

  # Avant 23 h 58, le dernier mercato : Josiane reste, comme les soirs de
  # mercato depuis toujours, et te laisse la minute. Les trois variantes de la
  # carte tiennent.
  - id: h8.ci.minute
    quand: carte
    cartes: [ds.h8.c4_23h58, ds.h8.c4_23h58_moi, ds.h8.c4_23h58_regle]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h8)"
    lieu: clubhouse
    tranche: nuit
    acteurs:
      - {qui: toi, place: porte}
      - {qui: josiane, place: secretaire}
      - {id: sans_aulard, qui: aulard, cache: true}
      - {id: sans_passant, qui: passant, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {musique: sombre}
      - {narration: "Le dernier soir du dernier mercato. Le club-house est éteint, sauf le secrétariat, où Madame Josiane tricote sous la lampe, à côté du vieux fax du club."}
      - {qui: toi, va: guichet}
      - {qui: josiane, dit: "Les soirs de mercato, je reste. Depuis toujours. Ça me regarde."}
      - {qui: josiane, dit: "En 2003, il y avait un stagiaire, ici. Il attendait minuit moins deux pour envoyer ses pages. À cette heure-là, on signe sans relire."}
      - {qui: toi, pense: "Personne ne me dira l'heure, ce soir. Je la regarde quand même."}
      - {qui: toi, dit: "Restez, Josiane."}
      - {qui: josiane, dit: "Non. Cette minute-là, on la passe seul. J'en ai passé quelques-unes."}
      - {qui: josiane, sort: true}
      - {narration: "Elle éteint la lampe du secrétariat en sortant. Il ne reste que la lueur de l'écran, à l'étage, et ta respiration."}

  # Le lendemain, avant Léa (on n'y arrive qu'en n'ayant pas signé) : les
  # quatre piles, dont une vide.
  - id: h8.ci.lendemain
    quand: carte
    cartes: [ds.h8.c4b_lea]
    moment: avant
    roles: [ds]
    si: "flag(histoire_h8)"
    lieu: echo
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {qui: lea, place: journaliste}
      - {id: pigiste, qui: passant, nom: "Un pigiste", place: pigiste}
      - {id: sans_meneche, qui: meneche, cache: true}
      - {id: sans_rossard, qui: rossard, cache: true}
      - {id: sans_passante, qui: passante, cache: true}
      - {id: sans_ancien, qui: ancien, cache: true}
      - {id: sans_fan, qui: fan, cache: true}
    etapes:
      - {narration: "L'Écho, huit heures. Les fenêtres sont restées ouvertes toute la nuit. Sur le grand bureau, quatre piles de feuilles : des courbes, une voix, un nom, et une pile vide."}
      - {qui: pigiste, dit: "La courbe de Kerdal, la nuit d'avant le lundi : cent dix au repos jusqu'à trois heures. Je la passe en grand ?"}
      - {qui: lea, dit: "En petit, en bas de page. Qu'on se penche pour la lire."}
      - {qui: pigiste, dit: "Et la quatrième pile ?"}
      - {qui: lea, dit: "C'est une signature. Elle vient à pied, de l'autre bout de la ville."}
      - {qui: lea, regarde: toi}
      - {qui: pigiste, sort: true}
      - {narration: "Léa pousse la pile vide vers la chaise d'en face, du bout des doigts."}

conversations:
  # Les bracelets de Cadence au virage.
  - id: h8.cv.bracelets
    roles: [ds]
    si: "flag(histoire_h8) && arc(ds.h8.cadence)"
    lieu: buvette
    tranches: [midi, soir]
    qui:
      - {id: ancien1, qui: ancien, nom: "Un ancien du virage", place: zinc_1}
      - {id: ancien2, qui: fan, nom: "Un autre ancien", place: zinc_2}
    repliques:
      - {qui: ancien1, dit: "Le mien dit que je dors sept heures. Je dors pas sept heures. Il est poli."}
      - {qui: ancien2, dit: "Le mien m'a dit hier que j'étais en arrêt cardiaque. Je regardais le match."}
      - {qui: ancien1, dit: "Contre qui ?"}
      - {qui: ancien2, dit: "Contre nous. C'est pour ça."}

  # La machine 4, après les nuits de la laverie.
  - id: h8.cv.machine_4
    roles: [ds]
    si: "flag(histoire_h8) && flag(h8_laverie)"
    lieu: laverie
    tranches: [matin, midi, aprem, soir]
    qui:
      - {id: gerant, qui: commercant, nom: "Le gérant", place: pliage}
      - {id: cliente, qui: passante, nom: "Une cliente", place: attente_2}
    repliques:
      - {qui: gerant, dit: "{pg, select, f{La directrice du Racing est revenue} other{Le directeur du Racing est revenu}} cette nuit. La 4. Trois fois la même chemise."}
      - {qui: cliente, dit: "Ça vous rapporte, au moins ?"}
      - {qui: gerant, dit: "Trois lavages. Je rends la monnaie, personne la prend."}
      - {qui: cliente, dit: "Alors laissez laver. Y a pire, comme insomnie."}

  # Le quai, le matin, la première saison.
  - id: h8.cv.quai
    roles: [ds]
    si: "flag(histoire_h8) && saison == 1"
    lieu: kiosque
    tranches: [matin]
    qui:
      - {id: passant, qui: passant, nom: "Un passant", place: [1, 2]}
      - {id: passante, qui: passante, nom: "Une passante", place: [2, 1]}
    repliques:
      - {qui: passant, dit: "{pg, select, f{La directrice} other{Le directeur}} du Racing parle {pg, select, f{toute seule} other{tout seul}} sur le quai, le matin."}
      - {qui: passante, dit: "Tout le monde parle tout seul, maintenant. Ils ont des écouteurs."}
      - {qui: passant, dit: "{pg, select, f{Elle} other{Lui}}, on lui répond. Je l'ai {pg, select, f{vue} other{vu}} attendre la réponse."}

  # Le compte du vieux : qui a donné l'adresse ?
  - id: h8.cv.adresse
    roles: [ds]
    si: "flag(histoire_h8) && flag(h8_compte_vieux)"
    lieu: buvette
    tranches: [midi, soir]
    qui:
      - {qui: nino, place: zinc_3}
      - {qui: gege, place: fond}
    repliques:
      - {qui: nino, dit: "Les gars veulent aller sous ses fenêtres, à la Tréfilerie."}
      - {qui: gege, dit: "Les gars, ils ont jamais eu son adresse. On la leur a donnée à trois heures du matin. Avec mon nom."}
      - {qui: nino, dit: "Ton nom, mon oncle. Et ton mot de passe."}
      - {qui: gege, dit: "Je l'ai effacé du frigo. Il est dans ma tête, maintenant. Je sais pas si c'est mieux."}

  # La salle de muscu, après le lundi.
  - id: h8.cv.caillou
    roles: [ds]
    si: "flag(histoire_h8) && flag(h8_kerdal_mort)"
    lieu: muscu
    tranches: [midi, aprem, soir]
    qui:
      - {id: agent, qui: ancien, nom: "L'agent d'entretien", place: client_2}
      - {id: joueur, qui: passant, nom: "Un joueur", place: client_1}
    repliques:
      - {qui: agent, dit: "Je passe la serpillière autour. Le caillou, j'y touche pas."}
      - {qui: joueur, dit: "Le fonds veut rouvrir la salle la nuit. Pour les récupérations."}
      - {qui: agent, dit: "La nuit, ici, je laisse la radio allumée. Qu'il y ait quelqu'un qui parle."}

  # Les nuits des joueurs, publiées.
  - id: h8.cv.nuits
    roles: [ds]
    si: "flag(histoire_h8) && flag(h8_courbes_publiees)"
    lieu: cabinet
    tranches: [matin, aprem]
    qui:
      - {id: joueur, qui: passant, nom: "Un latéral", place: attente_1}
      - {id: mere, qui: passante, nom: "La mère d'un joueur", place: attente_2}
    repliques:
      - {qui: mere, dit: "J'ai acheté trois exemplaires du Quotidien. Mon fils dort comme quand il avait six ans. C'est imprimé."}
      - {qui: joueur, dit: "Et la mienne, vous l'avez regardée ?"}
      - {qui: mere, dit: "Oui."}
      - {qui: joueur, dit: "Et alors ?"}
      - {qui: mere, dit: "J'ai fait le signe de croix."}

  # La grève de tous les joueurs du monde, vue du tabac du Quai.
  - id: h8.cv.greve
    roles: [ds]
    si: "flag(histoire_h8) && arc(ds.h8.greve)"
    lieu: tabac
    tranches: [matin, midi, aprem]
    qui:
      - {id: buraliste, qui: commercant, nom: "Le buraliste", place: patron}
      - {id: marinier1, qui: passant, nom: "Un marinier", place: marinier_1}
      - {id: marinier2, qui: ancien, nom: "Un vieux marinier", place: marinier_2}
    repliques:
      - {qui: marinier1, dit: "Les joueurs du monde entier s'arrêtent vendredi. Même ceux d'ici."}
      - {qui: buraliste, dit: "Je prends les paris sur le match qui aura pas lieu. Un contre un."}
      - {qui: marinier2, dit: "Et si le Racing joue quand même ?"}
      - {qui: buraliste, dit: "Alors il jouera contre personne, et il trouvera le moyen de perdre."}

  # Vaubourg prend l'escalier, tant qu'il le prend.
  - id: h8.cv.escalier
    roles: [ds]
    si: "flag(histoire_h8) && !flag(h8_vaubourg_mort)"
    lieu: clubhouse
    tranches: [matin]
    qui:
      - {id: technicien, qui: passant, nom: "Un technicien du fonds", place: cafe}
      - {id: collegue, qui: inconnu, nom: "Son collègue", place: vitrine}
    repliques:
      - {qui: technicien, dit: "Le président d'honneur a encore pris l'escalier. Vingt-deux marches, avec la canne. Il a refusé l'ascenseur."}
      - {qui: collegue, dit: "Son bracelet a sonné trois fois. Le modèle voudrait qu'on lui condamne l'escalier."}
      - {qui: technicien, dit: "Condamner un escalier ?"}
      - {qui: collegue, dit: "Le fonds trouvera bien comment."}

  # La canne au clou, en août.
  - id: h8.cv.canne
    roles: [ds]
    si: "flag(histoire_h8) && flag(h8_canne_clou)"
    lieu: clubhouse
    tranches: [matin, aprem]
    qui:
      - {id: stagiaire, qui: passante, nom: "Une stagiaire du fonds", place: guichet}
      - {qui: josiane, place: secretaire}
    repliques:
      - {qui: stagiaire, dit: "Qui a pendu cette canne au clou ? Faut l'enlever, elle est pas à l'inventaire."}
      - {qui: josiane, dit: "Personne ne l'a pendue. Le matin, elle était là."}
      - {qui: stagiaire, dit: "Une canne, ça se pend pas toute seule, madame."}
      - {qui: josiane, dit: "Ici, si. Vous verrez, avec le temps."}

  # Le petit de Nino, au grillage des moins de dix-sept ans.
  - id: h8.cv.grillage
    roles: [ds]
    si: "flag(histoire_h8) && arc(ds.h8.milo)"
    lieu: terrain
    tranches: [aprem]
    qui:
      - {id: pere, qui: passant, nom: "Un père", place: [1, 2]}
      - {id: grandpere, qui: ancien, nom: "Un grand-père", place: [2, 1]}
    repliques:
      - {qui: pere, dit: "Le petit de Nino, il est rouge sur l'écran du club, il paraît."}
      - {qui: grandpere, dit: "Rouge, ça veut dire quoi ?"}
      - {qui: pere, dit: "Que la machine le vendra avant qu'il coûte cher."}
      - {qui: grandpere, dit: "De mon temps, on les vendait après. C'était plus long, mais on les voyait jouer."}

  # La jeune femme en parka, vue du hall : la nuit, quand elle est repartie
  # (le soir, elle est encore là, dans le hall).
  - id: h8.cv.parka
    roles: [ds]
    si: "flag(histoire_h8) && flag(h8_ines)"
    lieu: hotel
    tranches: [nuit]
    qui:
      - {id: veilleur, qui: portier, nom: "Le veilleur de nuit", place: reception}
      - {id: taxi, qui: passant, nom: "Un chauffeur de taxi", place: salon_2}
    repliques:
      - {qui: veilleur, dit: "La petite en parka est repassée. Elle a demandé l'heure, et elle est repartie."}
      - {qui: taxi, dit: "Elle prend toujours le dernier train. Elle dort dedans, je crois."}
      - {qui: veilleur, dit: "Elle dit qu'elle travaille la nuit. À parler aux gens."}
      - {qui: taxi, dit: "Comme moi, alors. Sauf qu'à moi, ils répondent."}
