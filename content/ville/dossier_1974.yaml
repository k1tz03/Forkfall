# LE DOSSIER 1974 (docs/histoires/dossier_1974.md) — la finale de 1974 et son cinquième visage,
# « gratté au couteau jusqu'au carton », deviennent un dossier qui se garde d'une carrière à
# l'autre (localStorage, packages/tools/web/preview_dossier.js). Chaque livre peut en livrer une
# pièce ; certaines dorment en ville (un tiroir, une conversation qu'on surprend, le dos d'une
# vignette). Le dossier complet ouvre l'épilogue de 2050, qu'on regarde depuis l'accueil.
#
# La vérité que le dossier rassemble (le document la tient en entier) : le 29 juin 1974, le soir
# de la Fédération, un homme de la Nord est entré au club-house avec la clé des bénévoles et a
# gratté le visage du capitaine. Il l'aimait ; il l'a cru avant de le connaître ; il a payé
# soixante ans. Les pièces le disent par morceaux, sans nom. Aucune pièce d'un autre livre ne dit
# ce que révèle « Trois mille visages » (qui a vendu, qui a laissé passer, qui a pris
# l'enveloppe) : seule la pièce du livre 1, donnée à la fin d'une carrière du livre 1, et
# l'épilogue, qui demande le dossier complet, le disent.
#
# Comment une pièce se trouve (`trouve`) :
#   · drapeau       un drapeau `dossier_<pièce>` posé par une scène ou une activité de ce lot ;
#   · conversation  une conversation surprise de ce lot, entendue jusqu'au bout ;
#   · cinematique   une scène jouée de ce lot, regardée ;
#   · fin           une carrière du livre finie sur une de ses fins (`fins`) : le livre lu jusqu'au bout ;
#   · album         la vignette brillante de l'album (l'événement `fusible:album`).
# Une pièce déjà au dossier entre dans les carrières suivantes comme un drapeau `dossier_<pièce>`
# (Engine.heritage) : la scène qui la donne se tait, et Madame Josiane, en 2037, parle à qui a le
# carnet de 1990. Aucun texte n'accorde le héros.
dossier:
  titre: "Le dossier 1974"
  pieces:
    - id: bache
      titre: "La bâche de 1973"
      date: "1973"
      ordre: 10
      livres: [h3]
      ou: "Au fond de la buvette, dans une carrière de 1990."
      texte: "Sous les bâches pliées de Gégé, la plus vieille : LE 5 EST À NOUS, 1973. Les cordes coupées net. « On l'a décrochée un soir de juin 74. Ceux qui l'ont décrochée ne l'ont jamais remontée. »"
      trouve: {drapeau: dossier_bache}

    - id: brillante
      titre: "La vignette brillante"
      date: "1974"
      ordre: 15
      requise: false
      ou: "Dans l'album : la brillante de 1974."
      texte: "La brillante de 1974 : le cinquième visage, intact. Henri Ravenel ne regarde pas l'objectif. Il regarde vers la Nord, en haut à gauche, comme on cherche quelqu'un."
      trouve: {album: "1974_cinquieme"}

    - id: presse_papier
      titre: "Le presse-papier"
      date: "Mai 1974"
      ordre: 20
      livres: [h6]
      ou: "Sur un bureau du club-house, vers 2004."
      texte: "Sous le presse-papier de verre au fanion de 1974, gravé à la pointe : « Au 5, de la Nord. Mai 1974. » Un cadeau d'avant la finale. Personne n'est jamais venu le reprendre."
      trouve: {drapeau: dossier_presse_papier}

    - id: ardoise
      titre: "L'ardoise et le ticket"
      date: "Mai 1974"
      ordre: 25
      livres: [h1]
      ou: "Au bout de Trois mille visages : une carrière qui finit le livre."
      texte: "L'ardoise de Gigi : TON PÈRE A PRIS L'ENVELOPPE. J'AI LAISSÉ PASSER LES TROIS. Le ticket du Quai, de la main d'Henri. Et le trésorier de 1974, président en 1977, qui gardait ses aveux."
      trouve: {fin: h1, fins: [promu_plaque, promu_vengeance, promu_brasero, promu_visage, promu_car]}

    - id: temoins
      titre: "Les témoins de juin"
      date: "Juin 1974"
      ordre: 30
      livres: [h5]
      ou: "Aux archives de la mairie, vers 2000."
      texte: "État civil, juin 1974 : trois joueurs du Racing mariés la même semaine. Les mêmes témoins aux trois : Henri Ravenel, et un homme de la Nord qui signe d'un prénom et d'une écharpe dessinée."
      trouve: {drapeau: dossier_temoins}

    - id: cahier_nuit
      titre: "Le cahier de nuit"
      date: "29 juin 1974"
      ordre: 40
      livres: [h7]
      ou: "Dans la cave de l'hôtel de la Rive, avant le pilon."
      texte: "Cahier de nuit de l'hôtel de la Rive, 29 juin 1974, minuit : « Au bar, un gars de la Nord, l'écharpe au cou. Un couteau à cordes sur le zinc. Il demande l'heure deux fois. »"
      trouve: {drapeau: dossier_cahier_nuit}

    - id: carnet
      titre: "Le carnet de la demoiselle Aymard"
      date: "30 juin 1974"
      ordre: 50
      livres: [h1, h2, h3, h4]
      ou: "Au fond d'un tiroir du club-house, en 1990, un soir."
      texte: "« 30 juin 1974. Le cadre de l'escalier : le cinquième visage, au couteau, jusqu'au carton. La clé du local à ballons manquait au tableau. Rendue à sept heures. On ne touche à rien. »"
      trouve: {drapeau: dossier_carnet}

    - id: cle
      titre: "La vieille clé"
      date: "1987"
      ordre: 55
      livres: [h2]
      ou: "À la laverie, un soir de 1990, pour qui passe près."
      texte: "Josiane, à la laverie : « La vieille clé du local à ballons, la demoiselle Aymard me l'a laissée en 1987. Ne la prête jamais, elle a dit. Elle a ouvert quelque chose, une nuit de juin 1974. »"
      trouve: {conversation: do.cv.la_cle}

    - id: registre
      titre: "Le registre de la loge"
      date: "Mars 1975"
      ordre: 60
      livres: [h4]
      ou: "Dans la loge du cimetière, quand on y lit les registres."
      texte: "Registre de la loge, mars 1975 : « Ravenel, Henri. Pas au caveau. Sa femme, leur enfant de vingt-trois ans, le curé. Un homme en écharpe, resté à la grille sous la pluie. Reparti avant la terre. »"
      trouve: {drapeau: dossier_registre}

    - id: scan
      titre: "Le visage du fonds"
      date: "2024"
      ordre: 70
      livres: [h8]
      ou: "Sur un écran, une nuit de 2025, si la voix est encore là."
      texte: "Le fonds a fait « restaurer » la photo de 1974. Le modèle a complété le cinquième visage : pas avec celui du capitaine, avec celui qu'il voit le plus souvent à côté. Un homme en écharpe."
      trouve: {drapeau: dossier_scan}

    - id: couteau
      titre: "Le couteau à cordes"
      date: "2030"
      ordre: 80
      livres: [h9]
      ou: "À la buvette, quand deux vieux du club parlent entre eux."
      texte: "Buvette, 2030. Gigi à Gégé : « Ton couteau à cordes, tu l'as sorti une fois de trop. » Gégé : « Une fois. En juin. Et toi, tu étais où, en juin ? »"
      trouve: {conversation: do.cv.le_couteau}

    - id: josiane
      titre: "Ce que savait la demoiselle Aymard"
      date: "2037"
      ordre: 90
      livres: [h10]
      ou: "Madame Josiane le dira en 2037, à qui a le carnet de 1990."
      texte: "Madame Josiane, en 2037 : « La clé, c'était celle des bénévoles de la Nord. Celui qui l'a rendue pleurait. On ne répare pas ce qu'un homme a fait par amour. Il monte encore l'escalier. »"
      trouve: {cinematique: do.ci.josiane}

    - id: pardon
      titre: "Vingt minutes sur le palier"
      date: "2037"
      ordre: 95
      livres: [h10]
      ou: "Sur le palier du club-house, quand la photo est revenue au clou."
      texte: "Mireille, au secrétariat : Gégé a parlé vingt minutes à la photo de 1974. Elle n'a entendu qu'une phrase : « Soixante ans que je te demande pardon dans cet escalier. Tu ne réponds jamais. »"
      trouve: {cinematique: do.ci.pardon}

  epilogue:
    cinematique: do.ci.epilogue
    # la vignette brillante au dossier : l'image d'avant le noir
    brillante: "Nino glisse la vignette brillante sous le verre, dans le coin du cadre. Le cinquième visage, intact, regarde vers la Nord, en haut à gauche."
    generique: "Ce dossier, ils l'ont rassemblé"

# ═══════════════════════════════════════════════════════════════════════ 1990 : le tiroir
# Le carnet de la demoiselle Aymard (secrétaire du club de 1958 à 1987) dort au fond du tiroir du
# bas du secrétariat, sous les quittances : Josiane ne jette rien (Le Sapin en carton), et son
# tiroir du bas « ne ferme pas à clé » (la ville vivante). Le soir, le secrétariat est vide. Les
# quatre livres de 1990 peuvent l'ouvrir ; ce qu'il dit ne nomme personne.
activites:
  - id: do_tiroir_aymard
    lieu: clubhouse
    objet: secretariat
    label: "Le tiroir du bas"
    habitude: travail
    tranches: 0
    heures: [soir]
    si: "annee <= 1991 && !flag(dossier_carnet)"
    texte: "Le secrétariat est vide, la lampe de Josiane éteinte. Au fond du tiroir du bas, sous les quittances, un carnet noir : « M. Aymard, secrétariat, 1958-1987 ». Une page est cornée, en juin 1974."
    effets: {set: [dossier_carnet]}

# ═══════════════════════════════════════════════════════════════════════ les scènes de la semaine
scenes:
  # La Sirène (1990-1993) : au local de la Nord, les bâches des gamins d'avant ; dessous, une plus
  # vieille. Gégé plie bien ; celle-là, il ne la déplie plus.
  - id: do.sc.bache
    titre: "La plus vieille"
    roles: [joueur]
    lieu: buvette
    tranches: [soir]
    qui: gege
    poids: 3
    si: "flag(histoire_h3) && saison >= 2 && !flag(dossier_bache)"
    texte: "Au fond de la buvette, Gégé range ses bâches pliées sur l'étagère. Sous celles des gamins d'avant, une plus vieille, jaunie : LE 5 EST À NOUS, 1973. Les cordes sont coupées net."
    choix:
      - label: "Qui a coupé les cordes ?"
        reponse: "« Un soir de juin 74, on l'a décrochée vite. Ceux qui l'ont décrochée ne l'ont jamais remontée. » Il remet la tienne par-dessus, bien au carré."
        effets: {set: [dossier_bache]}
      - label: "Je l'aide à ranger"
        reponse: "Vous rangez à deux. Il ne touche pas à la vieille : il la contourne des deux mains, comme on évite une marche qui craque."
        effets: {set: [dossier_bache]}

  # La Route de la Rive (1990-1993) : on a lu les registres de Monsieur Abel pour un 14 mai.
  # Il en sort un plus vieux, pour une tombe que personne ne visite.
  - id: do.sc.registre
    titre: "Le registre d'avant"
    roles: [joueur]
    lieu: loge
    tranches: [matin, aprem]
    qui: abel
    poids: 3
    si: "flag(histoire_h4) && flag(h4_registre) && !flag(dossier_registre)"
    texte: "Monsieur Abel tire de sous le poêle un registre plus vieux que les autres, la toile mangée. « Puisque vous lisez les registres, maintenant. Mars 1975 : un capitaine, et pas au caveau. »"
    choix:
      - label: "Lisez-moi la page"
        reponse: "« Ravenel, Henri. Sa femme, leur enfant de vingt-trois ans, le curé. Un homme en écharpe, resté à la grille sous la pluie, reparti avant la terre. » Il referme sur son crayon."
        effets: {set: [dossier_registre]}
      - label: "Refermez-le"
        reponse: "Il le referme sur son crayon, pour garder la page. « Les registres, c'est fait pour attendre. Les gens aussi, d'habitude. »"

  # La Maquette (1999-2002) : Mireille, la sœur de Josiane, aux archives de la mairie depuis 1971.
  # Le registre de l'état civil de 1974 (« trois mariages dans la même semaine… et les mêmes
  # témoins » : la ville le disait déjà) ; elle montre qui.
  - id: do.sc.temoins
    titre: "Les témoins de juin"
    roles: [president]
    lieu: mairie
    tranches: [matin, aprem]
    poids: 3
    si: "flag(histoire_h5) && flag(h5_mireille) && !flag(dossier_temoins)"
    texte: "Aux archives de la mairie, Mireille, la sœur de Josiane, ouvre l'état civil de juin 1974 sur ta pile. « Trois mariages la même semaine. Regardez les témoins. Ma sœur dit que vous regardez tout. »"
    choix:
      - label: "Je regarde les témoins"
        reponse: "Les deux mêmes aux trois mariages : Henri Ravenel, d'une écriture penchée, et un homme de la Nord qui a signé d'un prénom et d'une écharpe dessinée."
        effets: {set: [dossier_temoins]}
      - label: "Pas aujourd'hui"
        reponse: "Elle referme le registre sur un ruban rouge. « Il ne bougera pas. Ici, rien ne bouge depuis 1971, à part moi. »"

  # 23 h 58 (2003-2006) : le presse-papier de verre au fanion de 1974, sur lequel la directrice
  # sportive cale les fax de la nuit depuis le premier jour. Josiane le retourne.
  - id: do.sc.presse_papier
    titre: "Le socle"
    roles: [ds]
    lieu: clubhouse
    tranches: [matin, aprem]
    qui: josiane
    poids: 3
    si: "flag(histoire_h6) && saison >= 2 && !flag(dossier_presse_papier)"
    texte: "Josiane pose la pile de fax de la nuit sur ton bureau et cale le presse-papier de verre dessus. « Vous ne l'avez jamais retourné. Personne ne le retourne. Il y a une gravure, dessous. »"
    choix:
      - label: "Je le retourne"
        reponse: "Sur le socle, à la pointe : « Au 5, de la Nord. Mai 1974. » Josiane : « Un cadeau d'avant la finale. Personne n'est jamais venu le reprendre. »"
        effets: {set: [dossier_presse_papier]}
      - label: "Laissez-le où il est"
        reponse: "« C'est ce que tout le monde dit. » Elle le repose sur les fax, bien au milieu, comme on cale une porte."

  # Chambre 12 (2011-2013) : les cahiers de nuit partent au pilon en janvier. Sandrine remonte le
  # plus vieux de la cave ; une page y est cornée depuis 1974.
  - id: do.sc.cahier_nuit
    titre: "Le plus vieux cahier"
    roles: [selectionneur]
    lieu: hotel
    tranches: [nuit]
    qui: sandrine
    poids: 3
    si: "flag(histoire_h7) && saison >= 2 && !flag(dossier_cahier_nuit)"
    texte: "Minuit, à la réception. Sandrine a remonté de la cave le plus vieux cahier de nuit, 1974, avant le pilon de janvier. « Une page est cornée depuis 1974. Fin juin. Vous la voulez ? »"
    choix:
      - label: "Lisez-la-moi"
        reponse: "« 29 juin, minuit. Au bar, un gars de la Nord, l'écharpe au cou. Un couteau à cordes sur le zinc. Il demande l'heure deux fois. Je lui dis de rentrer. »"
        effets: {set: [dossier_cahier_nuit]}
      - label: "Au pilon"
        reponse: "Elle remet le cahier dans le carton, sans le refermer. « Le pilon ne lit pas. C'est ce qui le rend si pratique. »"

  # L'Oreillette (2024-2027) : le fonds a numérisé la photo de 1974 (« elle est partout,
  # maintenant, paraît-il ») et l'a fait « restaurer » par le modèle. La voix a complété le trou.
  - id: do.sc.scan
    titre: "La restauration"
    roles: [ds]
    lieu: domicile
    tranches: [nuit]
    poids: 3
    si: "flag(histoire_h8) && saison >= 2 && !flag(h8_sans_oreillette) && !flag(dossier_scan)"
    texte: "Une heure du matin. Sur ton écran, le fonds a mis en ligne la photo de 1974, « restaurée ». Dans ton oreille, la voix : « Le cinquième visage était illisible. Je l'ai complété. »"
    choix:
      - label: "Montre-le-moi"
        reponse: "Le modèle n'a pas mis le capitaine. Il a mis le visage qu'on voit le plus souvent à côté du sien, sur les photos du club : un homme en écharpe, au grillage de la Nord."
        effets: {set: [dossier_scan]}
      - label: "Éteins l'écran"
        reponse: "L'écran s'éteint. Dans ton oreille, la voix finit sa phrase quand même : « … sur les photos du club, on ne le voit jamais seul. »"

# ═══════════════════════════════════════════════════════════════════════ ce qu'on surprend
conversations:
  # Le Sapin en carton (1990-1993) : on lave les maillots du club à la laverie depuis que
  # l'huissier a pris la machine. Gisèle Delmotte garde ceux de 1974 ; Josiane garde une clé.
  - id: do.cv.la_cle
    roles: [entraineur]
    si: "flag(histoire_h2) && !flag(dossier_cle)"
    lieu: laverie
    tranches: [aprem, soir]
    qui:
      - {qui: delmotte, place: pliage}
      - {qui: josiane, place: machines}
    repliques:
      - {qui: delmotte, dit: "Les maillots de 1974 sont toujours dans mon placard, en laine. Le 5 n'y est pas. On ne me l'a jamais apporté."}
      - {qui: josiane, dit: "Moi, j'ai la vieille clé du local à ballons. La demoiselle Aymard me l'a laissée en 1987, avec son carnet."}
      - {qui: delmotte, dit: "Elle ouvre encore quelque chose ?"}
      - {qui: josiane, dit: "Plus rien. Ne la prête jamais, elle a dit. Elle a ouvert quelque chose, une nuit de juin 1974."}
      - {qui: delmotte, dit: "Et tu ne lui as pas demandé quoi ?"}
      - {qui: josiane, dit: "On ne demandait rien à la demoiselle Aymard. On attendait qu'elle le dise. Elle l'a dit une fois."}

  # Vingt degrés dedans (2029-2031) : deux vieux du club à la buvette, avant la dernière nuit de
  # Gigi. Chacun garde quelque chose de juin 1974 ; ni l'un ni l'autre ne dit quoi.
  - id: do.cv.le_couteau
    roles: [selectionneur]
    si: "flag(histoire_h9) && !flag(h9_vecchio_mort) && !flag(dossier_couteau)"
    lieu: buvette
    tranches: [aprem, soir]
    qui:
      - {qui: gege, place: fond}
      - {qui: vecchio, place: zinc_1}
    repliques:
      - {qui: vecchio, dit: "Ton couteau à cordes, tu l'as toujours ?"}
      - {qui: gege, dit: "Il coupe encore. Les bâches ne se décrochent pas toutes seules."}
      - {qui: vecchio, dit: "Jette-le dans la Rive. À nos âges, on ne garde que ce qu'on peut expliquer."}
      - {qui: gege, dit: "Le jour où tu jetteras ton filet, Gigi."}
      - {qui: vecchio, dit: "Mon filet, je ne l'ai jamais sorti du placard. Ton couteau, tu l'as sorti une fois de trop."}
      - {qui: gege, dit: "Une fois. En juin. Et toi, tu étais où, en juin ?"}

# ═══════════════════════════════════════════════════════════════════════ les scènes jouées
cinematiques:
  # Les Deux Téléphones (2037) : Madame Josiane s'est fait monter au club-house en fauteuil, la
  # photo de 1974 sur les genoux (pr.h10.ph.visite). Si le dossier contient le carnet trouvé en
  # 1990, elle raconte la suite, après la carte. Sinon, elle se tait : la carte suffit.
  - id: do.ci.josiane
    quand: carte
    cartes: [pr.h10.ph.visite, pr.h10.ph.visite_cadre]
    moment: apres
    roles: [president]
    si: "flag(histoire_h10) && flag(dossier_carnet)"
    lieu: clubhouse
    tranche: aprem
    vide: true
    acteurs:
      - {qui: toi, place: guichet}
      - {qui: josiane, place: secretaire, pose: assis}
      - {qui: mireille, place: cafe}
    etapes:
      - {narration: "Le club-house, après. Madame Josiane a demandé qu'on roule son fauteuil jusqu'à son ancien bureau. Mireille a poussé ses dossiers à elle, sans un mot."}
      - {qui: josiane, dit: "Le carnet de la demoiselle Aymard est passé par vos mains : ça se voit, à votre façon de regarder la photo. Il était dans mon tiroir, en 1990."}
      - {qui: toi, pense: "Le carnet noir, la page cornée de juin 1974. Je ne l'ai pas sorti de ma poche. Elle le voit quand même."}
      - {qui: mireille, va: conseil_2}
      - {qui: josiane, dit: "Elle me l'a dit en 1987, en me donnant les clés. Une seule fois. En 1974, la clé du local à ballons, c'était celle des bénévoles de la Nord."}
      - {qui: josiane, dit: "Celui qui l'a rendue à sept heures pleurait. Elle lui a fait un café, ici, à ce bureau. Il n'a rien dit. Elle n'a rien demandé."}
      - {qui: mireille, emote: "..."}
      - {qui: josiane, dit: "Le conseil voulait changer la photo. Elle a dit non : on ne répare pas ce qu'un homme a fait par amour. On le laisse au mur, pour qu'il le voie en montant."}
      - {qui: josiane, regarde: toi}
      - {qui: josiane, dit: "Il monte encore cet escalier, marche par marche. Ne lui demandez rien. Il a assez payé. Pas assez, peut-être, mais assez pour lui."}
      - {narration: "Mireille rallume la radio, très bas. Madame Josiane pose deux doigts sur le cadre, à l'endroit du cinquième visage, et demande à redescendre."}

  # Les Deux Téléphones (2037) : Gégé a monté l'escalier marche par marche et parlé vingt minutes
  # à la photo raccrochée (pr.h10.ph.gege). Mireille, au secrétariat, avait monté sa radio.
  - id: do.ci.pardon
    quand: carte
    carte: pr.h10.ph.gege
    moment: apres
    roles: [president]
    si: "flag(histoire_h10)"
    lieu: clubhouse
    tranche: aprem
    vide: true
    acteurs:
      - {qui: toi, place: visiteur_2}
      - {qui: mireille, place: secretaire, pose: assis}
    etapes:
      - {narration: "Le club-house. Gégé est redescendu une main sur la rampe, l'autre sur l'épaule de Nino. Au secrétariat, Mireille baisse sa radio."}
      - {qui: mireille, dit: "Vingt minutes, il a parlé. J'avais monté le son pour ne pas entendre. J'ai entendu quand même. Une phrase."}
      - {qui: toi, va: guichet}
      - {qui: mireille, dit: "« Soixante ans que je te demande pardon dans cet escalier. Tu ne réponds jamais. » Après, il a dit au revoir à la photo. Comme à quelqu'un."}
      - {qui: mireille, regarde: toi}
      - {qui: mireille, dit: "Ma tante dit qu'il ne faut rien lui demander. Ma tante dit beaucoup de choses, depuis qu'elle va sur ses cent ans."}
      - {narration: "Dans l'escalier, le cadre de 1974 penche un peu vers la Nord. Personne ne le redresse."}

  # L'ÉPILOGUE, mars 2050 : le dossier complet. On le regarde depuis l'accueil (preview_dossier.js
  # le joue sans carrière) ; dans une carrière, seul `dossier_epilogue` l'ouvrirait, et aucune ne
  # le pose : il ne se joue jamais en ville. Nino a soixante-six ans, Mbako soixante-seize ;
  # Mireille garde ce que sa tante a laissé. Gégé est mort en février 2040 ; Nino était là.
  - id: do.ci.epilogue
    quand: lieu
    lieu: clubhouse
    si: "flag(dossier_epilogue) && annee >= 2050"
    titre: "Le dossier 1974"
    sous: "Aubérive, mars 2050"
    tranche: soir
    vide: true
    acteurs:
      - {qui: toi, place: guichet}
      - {qui: nino, place: vitrine}
      - {qui: mbako, place: conseil_1, pose: assis}
      - {qui: mireille, place: secretaire, pose: assis}
    etapes:
      - {musique: fin}
      - {narration: "Mars 2050. Soixante-quinze ans, presque jour pour jour, après la passerelle. Sur la table du conseil, une boîte à chaussures : ce que soixante ans ont laissé de 1974."}
      - {qui: nino, dit: "Mon oncle disait qu'on ne rassemble jamais tout. Il se trompait rarement. Montre."}
      - {qui: toi, va: conseil_2}
      - {narration: "Un carnet noir, une vieille clé, un registre de mariages photocopié, un presse-papier, une page de cahier de nuit, un tirage d'ordinateur avec un visage qui n'est pas le bon."}
      - {qui: mbako, dit: "Ce visage-là, je l'ai vu en 2024, sur l'écran du fonds. Je n'ai rien dit. On ne contredit pas une machine qui a raison."}
      - {qui: nino, geste: tete_basse}
      - {qui: nino, dit: "La nuit de février 2040, il m'a dit deux choses. Imprimer, je l'ai dit à tout le monde. L'autre, je l'ai gardée dix ans."}
      - {qui: mireille, regarde: nino}
      - {qui: nino, dit: "« Le cinquième visage, c'est moi, en juin 74. Le couteau des cordes, la clé des bénévoles. J'avais trente et un ans et je croyais tout ce qui était imprimé. »"}
      - {qui: nino, dit: "« Après, j'ai payé : la plaque, le buis des Rameaux, trois mille masques. On ne rend pas un visage. On le réimprime, et ça ne suffit pas. »"}
      - {qui: mbako, dit: "Et le capitaine ? Qu'est-ce qu'il avait fait, vraiment ?"}
      - {qui: mireille, dit: "C'est dans la boîte. Le trésorier avait vendu la finale au Quai. Le gardien a laissé passer les trois. Et Henri a pris l'enveloppe. Pour sa femme."}
      - {qui: nino, dit: "Ils sont tous sur la photo, ceux qui ont vendu et ceux qui ne savaient pas. Le seul qui n'y est pas, c'est celui qui l'a grattée."}
      - {qui: nino, va: vitrine}
      - {narration: "Mireille éteint la lumière du palier. Dans le noir, le clou tient."}
