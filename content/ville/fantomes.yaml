# TES FANTÔMES (docs/histoires/fantomes.md) — « une ville qui se souvient de tes carrières
# précédentes ». À la fin de chaque carrière, la page garde quelques faits (preview_dossier.js,
# localStorage) : ton nom, ton livre, tes années, ta fin, et trois faits au plus, pris dans la
# liste du livre ci-dessous, dans son ordre (les fins d'abord, puis les choix). Un fait est
# retenu si la carrière a fini sur une de ses `fins`, OU posé un de ses `drapeaux`, OU répondu
# à une de ses `cartes` du côté `cote` (la page le note au moment du choix).
#
# Au début d'une carrière plus tardive, Engine.heritage pose, sans rien tirer :
#   · `fantome_<livre>`          une carrière de ce livre a eu lieu avant (la plus récente) ;
#   · `fantome_<fait>`           les faits qu'elle a laissés (`fantome_h4_mbako_cote`…) ;
#   · `{fantome_<livre>}`        son nom de famille (ou son prénom), seize lettres au plus ;
#   · `{fantome_<livre>_annees}` ses années (« 1990-1993 »).
# Le passé seulement : un livre ne se souvient que des livres qui commencent avant lui, jamais
# l'inverse, et il n'est pas le passé de lui-même. Les quatre livres de 1990 sont quatre fois le
# même été : aucun n'est le passé d'un autre.
#
# Les textes ne disent pas le genre du fantôme (son nom, jamais « il » ni « elle ») ; le vieux du
# Corner se trompe exprès (une année, un pied, une chambre) : c'est comme ça que la ville se
# souvient. Ils ne disent rien qu'un livre révèle et que le joueur n'aurait pas vu : un fantôme ne
# vient que d'une carrière jouée, et il ne raconte que ce qu'elle a laissé.
fantomes:
  livres:
    h1:
      faits:
        - {id: h1_plaque, fins: [promu_plaque], drapeaux: [h1_nom_grave], texte: "Tu as fait graver le nom de ton père au caveau du Racing, et ce qu'il avait fait."}
        - {id: h1_brasero, fins: [promu_brasero], texte: "La veille du dernier match, tu as brûlé les masques avec Gégé, à la friche."}
        - {id: h1_hauts, fins: [promu_vengeance, promu_visage], texte: "Les masques sont montés aux Hauts-de-Rive, avec ton visage."}
        - {id: h1_car, fins: [promu_car], texte: "Tu as repris le car de six heures, le négatif dans la poche."}
        - {id: h1_salut, drapeaux: [h1_salut_virage], texte: "Le premier jour, tu as salué la Nord avant de regarder le terrain."}
        - {id: h1_filet, drapeaux: [h1_filet_rendu], texte: "Gigi Vecchio t'a donné le filet de la finale."}
    h2:
      faits:
        - {id: h2_revenant, fins: [interim_revenant], texte: "Tu as ramené Roland Mercadier du wagon jusqu'au tribunal."}
        - {id: h2_place, fins: [interim_place], texte: "Tu as signé ton contrat le lendemain du jour où Mercadier est mort sur le papier."}
        - {id: h2_deux_bancs, fins: [interim_deux_bancs], texte: "Le dernier match s'est joué avec deux entraîneurs, et le sifflet à ton cou."}
        - {id: h2_cassette, drapeaux: [h2_cassette], texte: "Tu as gardé la cassette du répondeur, celle de janvier."}
        - {id: h2_mange, drapeaux: [h2_vukic_mange], texte: "Vukić t'a demandé s'il mangeait, et tu as répondu."}
    h3:
      faits:
        - {id: h3_sirene, fins: [pepite_sirene], texte: "Tu as raconté la machine à L'Écho, avec le nom de Didier Vallin en entier."}
        - {id: h3_petit_club, fins: [pepite_petit_club], texte: "Tu as signé pour le petit club au grand avenir."}
        - {id: h3_seize_heures, fins: [pepite_seize_heures], texte: "À seize heures, la sirène a sonné pour toi, en plein match."}
        - {id: h3_halle, fins: [pepite_halle], texte: "On t'a vu repasser à la craie la ligne d'un terrain, dans la grande halle."}
        - {id: h3_cle, drapeaux: [h3_cle_sirene], texte: "Tu as décroché pour Didier Vallin la clé de la tour de la sirène."}
    h4:
      faits:
        - {id: h4_micro, fins: [fdc_micro], texte: "Au micro de ton jubilé, tu as dit qui conduisait le 14 mai 1984."}
        - {id: h4_tour, fins: [fdc_tour_honneur], texte: "Tu as poussé un fauteuil autour du terrain de la Rive."}
        - {id: h4_chrysanthemes, fins: [fdc_chrysanthemes], texte: "Tu t'es tu, et chaque mois un chèque est parti au tabac du Quai."}
        - {id: h4_route, fins: [fdc_route], texte: "On t'a arrêté au bout de la route de la Rive, à deux heures du matin."}
        - {id: h4_mbako_cote, cartes: [jp.fin.pro3_place, jp.fin.pro3_place_genou], cote: droite, texte: "Le premier matin, Lian Mbako était assis à ta place : tu t'es mis à côté."}
        - {id: h4_mbako_leve, cartes: [jp.fin.pro3_place, jp.fin.pro3_place_genou], cote: gauche, texte: "Le premier matin, tu as fait lever Lian Mbako de ta place."}
    h5:
      faits:
        - {id: h5_stade, fins: [geant_stade_reste], texte: "Tu as lu l'acte de 1931 au conseil, et le terrain de la Rive est resté aux enfants."}
        - {id: h5_une_voix, fins: [geant_une_voix], texte: "La révision du terrain est passée à une voix, après tes dix minutes sans papier."}
        - {id: h5_terrasses, fins: [geant_terrasses], texte: "Tu as soutenu la révision du terrain de la Rive."}
        - {id: h5_siege, drapeaux: [h5_siege_dormi], texte: "Tu as dormi avec le kop, sous le clou de l'escalier."}
        - {id: h5_valise, drapeaux: [h5_valise_prise], texte: "Tu as pris la valise de Malbec, sous la table du bar de l'hôtel."}
    h6:
      faits:
        - {id: h6_classeur, fins: [trente_classeur], texte: "Tu as posé le classeur de Josiane sur le bureau d'un juge."}
        - {id: h6_associe, fins: [trente_associe], texte: "Tu as vendu tous les noms que le fax imprimait à 23 h 58."}
        - {id: h6_tibo_garde, fins: [trente_petit_reste], drapeaux: [h6_tibo_garde], texte: "Tu n'as pas vendu Tibo Rancé."}
        - {id: h6_tibo_vendu, drapeaux: [h6_tibo_vendu], texte: "Tu as vendu Tibo Rancé, au prix que le fax avait écrit."}
        - {id: h6_lea, drapeaux: [h6_lea_mensonge], texte: "Tu as dit à Léa que la photo de 1999 était un montage."}
    h7:
      faits:
        - {id: h7_laisse, fins: [fiasco_laisse], texte: "Devant les caméras, tu as dit : « On l'a laissé. »"}
        - {id: h7_malaise, fins: [fiasco_malaise], texte: "Tu n'as jamais dit autre chose que « malaise cardiaque »."}
        - {id: h7_tableau, fins: [fiasco_tableau], texte: "Les vingt-six doubles sont restés au tableau des clés jusqu'au matin."}
        - {id: h7_bouc, fins: [fiasco_bouc], texte: "Tu as lu la fiche de 2 h 10, et le capitaine a rendu son brassard."}
        - {id: h7_mbako_temoin, drapeaux: [h7_mbako_temoignera], texte: "Dans le bus, une nuit, tu as dit à Lian Mbako qu'il témoignerait."}
    h8:
      faits:
        - {id: h8_silence, fins: [modele_silence], texte: "Tu as enlevé l'oreillette pour de bon."}
        - {id: h8_voix, fins: [modele_voix], texte: "Tu as gardé la voix jusqu'au bout ; elle a gardé la tienne."}
        - {id: h8_six_heures, fins: [modele_six_heures], texte: "Le matin de Vaubourg, à six heures et demie, tu étais en face de lui."}
        - {id: h8_clinique, fins: [modele_clinique], texte: "À la clinique des Hauts-de-Rive, tu demandes chaque soir qu'on éteigne la voix."}
        - {id: h8_kerdal, drapeaux: [h8_kerdal_vit], texte: "Kerdal est vivant."}
    h9:
      faits:
        - {id: h9_brassard, fins: [mondial_brassard], texte: "Le brassard noir est entré sur la pelouse du Dôme."}
        - {id: h9_vingt, fins: [mondial_vingt_degres], texte: "Sous le Dôme, à vingt degrés, tu n'as rien dit d'autre que le score."}
        - {id: h9_dos, fins: [mondial_dos], texte: "Champions du monde ; sur la photo officielle, on ne te voit que de dos."}
        - {id: h9_ministre, fins: [mondial_ministre], texte: "On t'a confié le ministère des Sports, dans le bureau de Madame Aubert."}
        - {id: h9_tiroir, fins: [mondial_tiroir], texte: "À la minute pour Gigi Vecchio, tu n'as pas bougé."}
    h10:
      faits:
        - {id: h10_clapets, fins: [escalier_clapets], texte: "À l'assemblée, tu as sorti les deux téléphones de ta veste."}
        - {id: h10_montee, fins: [escalier_montee], texte: "Le Racing est monté le dernier soir où l'on pouvait encore monter."}
        - {id: h10_franchise, fins: [escalier_franchise], texte: "Le nom du Racing est parti à la capitale ; toi, à la Ligue des franchises."}
        - {id: h10_aveu, fins: [escalier_aveu], texte: "Tu as posé ton clapet sur la table et raconté le pacte de la Rive."}
        - {id: h10_photo, drapeaux: [h10_photo_raccrochee], texte: "Tu as raccroché la photo de 1974 au clou de l'escalier."}

# ═══════════════════════════════════════════════════════════════════════ ce que dit la ville
paroles:
  # ─── le vieux du Corner : il raconte tes matchs, et il se trompe (une année, un pied, une
  # chambre). Au Corner, ou devant.
  - qui: ancien
    sujet: epoque
    si: "flag(fantome_h1) && lieu == bar"
    texte: "{fantome_h1} ? Les masques de la Nord, trois mille, en 91. Ou en 92. Ça saluait le virage avec un chapeau. Il y avait un chapeau, je crois."
  - qui: ancien
    sujet: epoque
    si: "flag(fantome_h2) && lieu == bar"
    texte: "{fantome_h2} ? Pris pour six semaines en 90, à la place d'un mort. Ou d'un vivant, je confonds. Le café debout au comptoir, ça, j'en suis sûr."
  - qui: ancien
    sujet: epoque
    si: "flag(fantome_h3) && lieu == bar"
    texte: "{fantome_h3}, la pépite de l'usine ! Un but de la tête sous la sirène, un soir de Noël. Ou du pied. La sirène, je suis formel."
  - qui: ancien
    sujet: epoque
    si: "flag(fantome_h4) && lieu == bar"
    texte: "{fantome_h4} ? La tête dans la lucarne, en 83. Ou en 84. Contre Portclair, ou contre Valdorne. La lucarne, je la vois encore."
  - qui: ancien
    sujet: epoque
    si: "flag(fantome_h5) && lieu == bar"
    texte: "{fantome_h5} ? La présidence de 99. Ou de 2000. Ça payait les fûts de sa poche, ou ça les devait. On saluait quand même."
  - qui: ancien
    sujet: epoque
    si: "flag(fantome_h6) && lieu == bar"
    texte: "{fantome_h6} ? Le fax de minuit moins deux. Trente joueurs vendus, ou trente millions, ou les deux. Je mélange les chiffres. Pas l'heure."
  - qui: ancien
    sujet: epoque
    si: "flag(fantome_h7) && lieu == bar"
    texte: "{fantome_h7} ? Les Cobalts à l'hôtel de la Rive, en 2011. Ou 2012. La chambre 12, ou la 21. Je mélange les chambres, pas les visages."
  - qui: ancien
    sujet: epoque
    si: "flag(fantome_h8) && lieu == bar"
    texte: "{fantome_h8} ? L'oreillette. Ça parlait tout seul dans la tribune, en 2025. Ou en 26. Moi, je n'ai jamais su qui parlait."
  - qui: ancien
    sujet: epoque
    si: "flag(fantome_h9) && lieu == bar"
    texte: "{fantome_h9} ? Le Mondial d'hiver. Les Cobalts ont gagné, en 2030. Ou perdu, on a fait la fête pareil. Ça devait être gagné."

  # ─── Trois mille visages, dans les livres d'après : les cartons du local, le brasero
  - qui: gege
    sujet: epoque
    si: "flag(fantome_h1) && !flag(fantome_h1_brasero) && !flag(fantome_h1_hauts) && annee >= 1999 && annee <= 2036"
    texte: "Les cartons de 1990 sont toujours au local. Trois mille masques, et c'est {fantome_h1} sur chacun. On n'a jamais su les jeter. On ne sait pas jeter, ici."
  - qui: gege
    sujet: epoque
    si: "flag(fantome_h1_brasero) && annee >= 1999 && annee <= 2036"
    texte: "La veille du dernier match de 93, {fantome_h1} et moi, on a brûlé deux mille huit cents visages à la friche. J'en ai gardé un. Je ne dis pas lequel."

  # ─── Le Sapin en carton : Josiane ne jette rien
  - qui: josiane
    sujet: club
    si: "flag(fantome_h2) && annee >= 1999 && annee <= 2031"
    texte: "Dans mon tiroir du milieu, deux plaques de bureau : Mercadier, et {fantome_h2}. On ne jette pas une plaque. On attend qu'on vienne la chercher."

  # ─── La Sirène : Didier Vallin, à la halle (La Maquette, 1999)
  - qui: vallin
    sujet: quartier
    si: "flag(fantome_h3_cle) && annee >= 1999"
    texte: "La clé de la tour, c'est {fantome_h3} qui me l'a décrochée, une nuit sans lune. Depuis, je ne tire plus pour rien. Je ne tire plus du tout."
  - qui: vallin
    sujet: quartier
    si: "flag(fantome_h3_sirene) && annee >= 1999"
    texte: "Mon nom en entier dans L'Écho, en 93 : c'est {fantome_h3} qui l'a fait écrire. Depuis, les gamins de la halle le disent. Pas toujours bien."

  # ─── La Route de la Rive : Lian Mbako, seize ans, assis à ta place, un matin de 1990 ;
  # capitaine en 2011, entraîneur en 2024, président de la Fédération en 2037
  - qui: mbako
    sujet: toi
    si: "flag(histoire_h7) && flag(fantome_h4_mbako_cote)"
    texte: "En 1990, mon premier matin, j'étais à la place d'un ancien : {fantome_h4}. Pas un mot pour me lever, une place à côté. Je fais pareil avec les petits."
  - qui: mbako
    sujet: toi
    si: "flag(histoire_h7) && flag(fantome_h4_mbako_leve)"
    texte: "En 1990, {fantome_h4} m'a fait lever de sa place, devant tout le vestiaire. J'ai attendu vingt ans d'en avoir une. Je la laisse aux petits."
  - qui: mbako
    sujet: club
    si: "flag(histoire_h8) && flag(fantome_h4_mbako_cote)"
    texte: "Je mets les gamins à côté des anciens, sur le banc. Le modèle dit que ça ne sert à rien. {fantome_h4} me l'a appris en 1990, en se poussant."
  - qui: mbako
    sujet: club
    si: "flag(histoire_h10) && flag(fantome_h4_mbako_cote)"
    texte: "En 1990, un ancien m'a laissé sa place au vestiaire : {fantome_h4}. J'ai fermé l'escalier quand même. On me demande si je vois le rapport. Je le vois."
  - qui: mbako
    sujet: club
    si: "flag(histoire_h10) && flag(fantome_h4_mbako_leve)"
    texte: "En 1990, {fantome_h4} m'a fait lever d'une place qui n'était pas la mienne. J'ai écrit la loi comme ça : chacun sa place. Les gamins, eux, attendent."

  # ─── La Route de la Rive : Sandrine Lavergne, à l'hôtel de la Rive, en 2011
  - qui: sandrine
    sujet: toi
    si: "flag(histoire_h7) && flag(fantome_h4_micro)"
    texte: "Au jubilé, {fantome_h4} a dit au micro qui conduisait, le 14 mai 1984. Je n'ai pas pardonné. J'ai écouté jusqu'au bout : c'est tout ce que je devais."
  - qui: sandrine
    sujet: toi
    si: "flag(histoire_h7) && flag(fantome_h4_tour)"
    texte: "Au jubilé, on m'a poussée autour du terrain de la Rive. {fantome_h4} ne disait rien, et c'était bien. Le stade debout, je l'entends encore la nuit."
  - qui: sandrine
    sujet: toi
    si: "flag(histoire_h7) && flag(fantome_h4_chrysanthemes)"
    texte: "Chaque mois, le chèque arrivait au tabac du Quai, signé {fantome_h4}, et chaque mois mon père le renvoyait. Il n'en a pas encaissé un. Moi, j'aurais hésité."

  # ─── La Maquette : le terrain des enfants, le club-house des sacs de couchage
  - qui: ancien
    sujet: quartier
    si: "flag(fantome_h5_stade) && annee >= 2003"
    texte: "Le terrain de la Rive est aux gamins depuis qu'on a lu au conseil un acte de 1931. C'était {fantome_h5}. Les gamins ne savent pas qui c'est."
  - qui: gege
    sujet: club
    si: "flag(fantome_h5_siege) && annee >= 2003 && annee <= 2036"
    texte: "Une présidence sur un sac de couchage, sous le clou de l'escalier, avec quarante gars du kop : je n'en ai vu qu'une. {fantome_h5}. Jusqu'au vote."

  # ─── 23 h 58 : Tibo Rancé, en 2011 ; sa mère, après la chambre 12
  - qui: rance_mere
    sujet: sombre
    si: "flag(histoire_h7) && flag(h7_rance_mort) && flag(fantome_h6_tibo_garde)"
    texte: "En 2003, on ne l'a pas vendu : {fantome_h6} l'a gardé ici. Il a eu trois ans de plus à la Rive. C'est tout ce qu'on a eu, et je le compte."
  - qui: rance_mere
    sujet: sombre
    si: "flag(histoire_h7) && flag(h7_rance_mort) && flag(fantome_h6_tibo_vendu)"
    texte: "En 2003, on l'a vendu au prix qu'un fax avait écrit. Je ne dis pas que {fantome_h6} l'a mis dans cette chambre. Je dis qu'on l'a vendu."

  # ─── Chambre 12 : ce que Mbako a dit ; la gerbe de novembre
  - qui: mbako
    sujet: sombre
    si: "flag(histoire_h8) && flag(fantome_h7_mbako_temoin)"
    texte: "Une nuit, dans le bus de 2010, {fantome_h7} m'a dit : tu vas témoigner. J'ai témoigné. Depuis, je regarde dormir mes joueurs. Ton modèle aussi."
  - qui: commercant
    sujet: sombre
    si: "flag(fantome_h7_malaise) && lieu == fleuriste && annee >= 2014"
    texte: "La gerbe de novembre pour le caveau, bordeaux et grise, sans carte : {fantome_h7} la paie d'avance, chaque année. Je ne pose pas de question."

  # ─── L'Oreillette : la voix qu'on a gardée, la fenêtre qu'on a éteinte
  - qui: fan
    sujet: club
    si: "flag(fantome_h8_voix) && annee >= 2027"
    texte: "On dit que le modèle a pris une voix, maintenant : celle de {fantome_h8}. « On commence par les ventes ? » Moi, je n'écoute pas."
  - qui: ancien
    sujet: quartier
    si: "flag(fantome_h8_silence) && annee >= 2027"
    texte: "Là-haut, à la Tréfilerie, une fenêtre s'éteint avant minuit, maintenant. On dit que {fantome_h8} a débranché une voix. Moi, je dors mieux."

  # ─── Vingt degrés dedans : le ministère de 2032
  - qui: mbako
    sujet: club
    si: "flag(histoire_h10) && flag(fantome_h9_ministre)"
    texte: "Au ministère, en 2032, c'était {fantome_h9}. Le dossier de 2010 est resté dans le premier tiroir. Je l'ai vérifié, en arrivant à la Fédération."

# ═══════════════════════════════════════════════════════════════════════ les plaques, les murs
# Ce qu'on lit en ville d'une carrière d'avant : une plaque, une feuille punaisée, une photo. Un
# geste d'un instant, au lieu et à l'objet qui conviennent au rôle du fantôme.
activites:
  - id: fa_plaque_h1
    lieu: clubhouse
    objet: trophees
    label: "Une plaque de 1990"
    habitude: culture
    tranches: 0
    si: "flag(fantome_h1)"
    texte: "Dans le couloir du premier, les entraîneurs en plaques de cuivre. Entre deux noms que personne ne lit plus : {fantome_h1}, {fantome_h1_annees}. Quelqu'un en fait briller les lettres."
  - id: fa_plaque_h2
    lieu: clubhouse
    objet: trophees
    label: "La plaque de l'intérimaire"
    habitude: culture
    tranches: 0
    si: "flag(fantome_h2)"
    texte: "Une plaque de cuivre plus petite que les autres, vissée de travers : {fantome_h2}, « par intérim », {fantome_h2_annees}. On n'a jamais fait graver le mot titulaire."
  - id: fa_plaque_h3
    lieu: stade
    objet: casier
    label: "Le crochet du fond"
    habitude: culture
    tranches: 0
    si: "flag(fantome_h3)"
    texte: "Au vestiaire, le crochet du fond garde ses couches de sparadrap. Sous les noms d'après, on lit encore {fantome_h3}, et dessous, trois lettres : DID."
  - id: fa_plaque_h4
    lieu: stade
    objet: casier
    label: "Le casier du vétéran"
    habitude: culture
    tranches: 0
    si: "flag(fantome_h4)"
    texte: "Le casier près de la porte a une plaque vissée : {fantome_h4}, {fantome_h4_annees}. Les nouveaux y posent leur sac sans la lire. Le gardien, lui, la cire."
  - id: fa_plaque_h5
    lieu: clubhouse
    objet: bureau_president
    label: "Les présidents au mur"
    habitude: culture
    tranches: 0
    si: "flag(fantome_h5)"
    texte: "Au mur du bureau, les présidents en photo, un par cadre. {fantome_h5}, {fantome_h5_annees}, n'y sourit pas. C'est le seul cadre qu'on n'a jamais redressé."
  - id: fa_plaque_h6
    lieu: clubhouse
    objet: affichage
    label: "La feuille de 2003"
    habitude: culture
    tranches: 0
    si: "flag(fantome_h6)"
    texte: "Sous les affiches, une feuille jaunie que personne n'ose décrocher : la liste des ventes de 2003, signée {fantome_h6}. L'encre de la signature n'a pas pâli."
  - id: fa_plaque_h7
    lieu: hotel
    objet: salon
    label: "La photo de 2011"
    habitude: culture
    tranches: 0
    si: "flag(fantome_h7)"
    texte: "Au salon, la photo des Cobalts de 2011 sur le perron, {fantome_h7} au bout du rang. Tibo Rancé sourit au milieu. À l'étage, devant la 12, une grande plante."
  - id: fa_plaque_h8
    lieu: clubhouse
    objet: affichage
    label: "Les recommandations"
    habitude: culture
    tranches: 0
    si: "flag(fantome_h8)"
    texte: "Punaisée sous les autres, une feuille de 2025 : « Recommandations du modèle ». En bas, un paraphe à la main : {fantome_h8}. Une ligne est barrée, une seule."
  - id: fa_plaque_h9
    lieu: hotel
    objet: salon
    label: "Le départ de 2030"
    habitude: culture
    tranches: 0
    si: "flag(fantome_h9)"
    texte: "Au salon, la photo des Cobalts au départ pour Al-Dorado, décembre 2030. Au bout du rang, {fantome_h9}, une main dans la poche, sur quelque chose qu'on ne voit pas."

  # le fait, pas seulement le nom
  - id: fa_ravenel_grave
    lieu: caveau
    objet: plaque
    label: "La plaque gravée"
    habitude: foi
    tranches: 0
    si: "flag(fantome_h1_plaque)"
    texte: "La plaque neuve de 1989 porte un nom, maintenant : HENRI RAVENEL, et dessous, ce qu'il a fait. Le gardien dit que {fantome_h1} a signé chez le marbrier, à la place du club."
  - id: fa_livre_lea
    lieu: librairie
    objet: livre_joueur
    label: "Le livre de Léa"
    habitude: culture
    tranches: 0
    si: "flag(fantome_h6_lea) && annee >= 2008"
    texte: "Sur la pile, un livre de Léa : « Un bon montage ». Le chapitre sur {fantome_h6} s'ouvre sur une gourmette, dans une photo de 1999. Il finit sans conclure."
  - id: fa_photo_dos
    lieu: clubhouse
    objet: trophees
    label: "La photo de 2030"
    habitude: culture
    tranches: 0
    si: "flag(fantome_h9_dos)"
    texte: "Punaisée sans cadre au-dessus des trophées : les Cobalts champions du monde, 2030. À côté du chef d'État, {fantome_h9}, de dos. Personne ne l'a jamais encadrée."

# ═══════════════════════════════════════════════════════════════════════ les scènes de la semaine
# L'Oreillette (2024) : Mbako, entraîneur, et le matin de 1990. Le livre est dense, le sac n'y
# sert parfois aucune carte : la ville tient le même souvenir en scène de la semaine, au centre,
# l'après-midi. La carte (content/cards/common/fantomes.yaml) et la scène se taisent l'une
# l'autre : `fantome_h8_mbako_dit`.
scenes:
  - id: fa.sc.h8_mbako_cote
    titre: "Une place à côté"
    roles: [ds]
    lieu: centre
    tranches: [aprem]
    qui: mbako
    poids: 4
    si: "flag(histoire_h8) && flag(fantome_h4_mbako_cote) && !flag(fantome_h8_mbako_dit)"
    texte: "Au centre, Mbako pousse un gamin de dix-sept ans sur le banc, à côté d'un ancien. « En 1990, {fantome_h4} m'a fait une place comme ça, il s'est juste poussé. Ton modèle dit que ça ne sert à rien. »"
    choix:
      - label: "Le modèle a ses chiffres"
        reponse: "Mbako renvoie le gamin au bout du banc, une main sur l'épaule. « En 1990, personne n'avait de chiffres. On avait des places. »"
        effets: {jauges: {direction: 1}, set: [fantome_h8_mbako_dit]}
      - label: "Laisse-le à côté"
        reponse: "Le gamin reste à côté de l'ancien jusqu'à la fin de la séance. Mbako regarde la place, pas l'écran. Il ne dit pas merci ; il n'a jamais su."
        effets: {jauges: {vestiaire: 1}, relation: {mbako: 1}, set: [fantome_h8_mbako_dit]}

  - id: fa.sc.h8_mbako_leve
    titre: "Chacun sa place"
    roles: [ds]
    lieu: centre
    tranches: [aprem]
    qui: mbako
    poids: 4
    si: "flag(histoire_h8) && flag(fantome_h4_mbako_leve) && !flag(fantome_h8_mbako_dit)"
    texte: "Au centre, un gamin se lève devant un ancien sans qu'on le lui demande. Mbako, à côté de toi : « En 1990, {fantome_h4} m'a fait lever de sa place. J'ai mis vingt ans à m'asseoir. »"
    choix:
      - label: "Chacun sa place"
        reponse: "Mbako lève une main, paume ouverte, et laisse faire. Le gamin reste debout jusqu'à l'échauffement, les mains dans les manches."
        effets: {jauges: {direction: 1}, set: [fantome_h8_mbako_dit]}
      - label: "Rassieds-le"
        reponse: "Mbako rassied le gamin d'une main sur l'épaule ; l'ancien se pousse pour lui faire de la place. Personne ne parle de 1990."
        effets: {jauges: {vestiaire: 1}, relation: {mbako: 1}, set: [fantome_h8_mbako_dit]}
