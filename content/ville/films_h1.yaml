# Histoire 1 — « Trois mille visages » : le film (docs/design/cinematiques.md).
#
# Un film est une cinématique en 3D, plein écran, qui se joue une fois par carrière. Ce
# fichier dit seulement QUAND il se joue ; le film lui-même est un module de la coquille,
# packages/tools/web/cinema/films/<module>.js (ses plans, ses décors, sa musique, ses
# textes). `livre:` range le film dans son livre : build_content pose la porte
# `flag(histoire_h1)` devant son `si`.
#
# « Trois mille masques » : la veille du premier match à la Rive. La presse des Cartonnages
# de la Rive (la scène de la semaine « la presse de minuit », scenes_h1.yaml) imprime ton
# visage par quatre ; les masques sèchent dans la cour ; la Nord s'allume, un tifo se
# déroule, trois mille masques se lèvent (comme en rêve : personne ne les a encore vus) ;
# l'escalier du club-house, la photo de 1974, le cinquième visage gratté. Il passe avant la
# carte de la présentation, et donc avant la scène jouée du vestiaire (cinematiques_h1.yaml,
# h1.ci.vestiaire) : la veille, puis le jour. Il ne devance rien : le vestiaire ne sait pas
# ce qu'il y a sous les cartons, le joueur le sait depuis la presse de minuit.
films:
  - id: h1.film.masques
    livre: promu
    module: trois_mille_masques
    titre: Trois mille masques
    quand: carte
    prefixe: en.h1.a1_presentation
    moment: avant
    roles: [entraineur]

  # « L'homme sous la fenêtre » : la fin de la première saison (créneau 17), la nuit de la
  # carte en.h1.a5_fenetre. Un seul masque sorti du stade, porté sous ta fenêtre : de la rue
  # puis de la pièce, le radio-réveil qui passe minuit, l'homme de dos (les mains jointes
  # dans le dos, ta façon de te tenir sur le banc), ton visage imprimé sous la pluie, la main
  # de Camille qui éteint la lampe, une voiture dont les phares le prennent. Il passe avant la
  # carte, qui dit la suite (descendre ou appeler la police) ; rien n'y dit qui il est. Pas
  # devant la variante `_seul` (Camille partie, flag('divorce')) : elle n'a personne pour
  # éteindre la lampe ni pour la ligne du film. Portée mesurée : 100 % des carrières du livre
  # (300 carrières, politique humaine).
  - id: h1.film.fenetre
    livre: promu
    module: sous_la_fenetre
    titre: L'homme sous la fenêtre
    quand: carte
    carte: en.h1.a5_fenetre
    moment: avant
    roles: [entraineur]
    si: "!flag(divorce)"
