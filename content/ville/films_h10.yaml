# Histoire 10 — « Les Deux Téléphones » : les films (docs/design/cinematiques.md).
#
# Un film est une cinématique en 3D, plein écran, qui se joue une fois par carrière. Ce
# fichier dit seulement QUAND il se joue ; le film lui-même est un module de la coquille,
# packages/tools/web/cinema/films/<module>.js (ses plans, ses décors, sa musique, ses
# textes). `livre:` range le film dans son livre : build_content pose la porte
# `flag(histoire_h10)` devant son `si`.
#
# « La première marche » : septembre 2037. Minuit au club-house, deux téléphones sur le
# sous-main, le clapet qui vibre puis le fixe, et personne ne décroche ; le matin, derrière
# la Nord, un maçon en bleu de travail pose le dernier parpaing dans le creux de la première
# marche, l'arrêté de la Ligue sur la rampe, la fenêtre de Gégé allumée en haut du mur
# (« Bonjour, Gégé. Elle est creusée au milieu, celle-là. Je la mure quand même. ») ; on
# monte les trente-trois marches. Il passe avant la carte du maçon (pr.h10.a1_marche, et
# ses variantes _ville, _consortium : toutes les carrières, au premier créneau de la
# première saison). Il ne devance rien : le compte des marches, la loi, la dernière nuit
# restent à la carte et au livre.
films:
  - id: h10.film.marche
    livre: escalier_ferme
    module: premiere_marche
    titre: La première marche
    quand: carte
    prefixe: pr.h10.a1_marche
    moment: avant
    roles: [president]
