# Histoire 2 — « Le Sapin en carton » : les films (docs/design/cinematiques.md).
#
# Un film est une cinématique en 3D, plein écran, qui se joue une fois par carrière. Ce
# fichier dit seulement QUAND il se joue ; le film lui-même est un module de la coquille,
# packages/tools/web/cinema/films/<module>.js (ses plans, ses décors, sa musique, ses
# textes). `livre:` range le film dans son livre : build_content pose la porte
# `flag(histoire_h2)` devant son `si`.
#
# Le livre filme ce que les gens laissent, pas les gens : une berline sur une place peinte,
# un sapin en carton, un répondeur dans un bureau vide. Les deux films n'ont pas de visage.
films:
  # « Lundi, sept heures » : l'heure qui précède la carte de la diode (le premier lundi, juste
  # après les cartons). Le parking du stade à 6 h 40 sous la pluie, la place peinte ENTRAÎNEUR
  # et la berline grise (le sapin au rétroviseur, le ticket sous l'essuie-glace, l'imperméable
  # plié : le prologue) ; un téléphone sonne dans le stade vide ; dans le bureau noir, le
  # répondeur décroche, son annonce (la voix de l'absent), la bande tourne, s'arrête ; la
  # diode rouge clignote ; sept heures, la lumière du couloir derrière la porte vitrée. Il ne
  # dit pas le message (la carte le fait écouter, ou effacer), ni qui l'a laissé, ni d'où.
  # Portée mesurée : 100 % des carrières du livre (300 carrières, politique humaine).
  - id: h2.film.lundi
    livre: interimaire
    module: lundi_sept_heures
    titre: Lundi, sept heures
    quand: carte
    carte: en.h2.rep.diode
    moment: avant
    roles: [entraineur]
