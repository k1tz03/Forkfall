# Histoire 3 — « La Sirène » : les films (docs/design/cinematiques.md).
#
# Un film est une cinématique en 3D, plein écran, qui se joue une fois par carrière. Ce
# fichier dit seulement QUAND il se joue ; le film lui-même est un module de la coquille,
# packages/tools/web/cinema/films/<module>.js (ses plans, ses décors, sa musique, ses
# textes). `livre:` range le film dans son livre : build_content pose la porte
# `flag(histoire_h3)` devant son `si`.
#
# « La dernière sirène » : le 24 décembre 1990, seize heures, la Tréfilerie ferme. Il passe
# APRÈS la carte de la sirène (jp.h3.s0_sirene et ses deux variantes, la saison 0, créneaux
# 10-11 ; atteinte dans toutes les carrières mesurées) : la carte a dit la foule au grillage,
# la sirène, ta mère qui cherche ton visage, et ta réponse ; le film montre ce que la sirène
# emporte — la dernière note, les lampes du bâtiment C qui s'éteignent, la pointeuse et la
# carte de ta mère, les mains qui lâchent le treillis, le portail qu'on enchaîne. Il ne
# devance rien (ni la tour la nuit, ni la clé, ni la vente) et ne dit pas ce que tu as
# répondu : il vaut pour les deux réponses et les trois variantes.
#
# « Trois heures » : une nuit d'hiver, la sirène de l'usine morte se remet à hurler. Il
# passe AVANT la carte « Trois heures » (jp.h3.s1_trois_heures et ses deux variantes, la
# saison 1, créneau 12 ; atteinte dans toutes les carrières mesurées) : la cité qui se
# réveille fenêtre par fenêtre (« Rendors-toi. L'usine est fermée. »), la sirène dans la
# pluie en haut de sa tour, la grande halle au toit troué, le terrain tracé à la craie, et
# quelqu'un couché dans le rond central ; puis des yeux qui s'ouvrent sous le trou du
# toit. La carte dit le reste. On ne voit pas qui tire la poignée ni qui a tracé le
# terrain ; ni la boîte ni le masque (il vaut pour les trois variantes).
films:
  - id: h3.film.derniere_sirene
    livre: pepite
    module: derniere_sirene
    titre: La dernière sirène
    quand: carte
    prefixe: jp.h3.s0_sirene
    moment: apres
    roles: [joueur]
  - id: h3.film.trois_heures
    livre: pepite
    module: sirene_trois_heures
    titre: Trois heures
    quand: carte
    prefixe: jp.h3.s1_trois_heures
    moment: avant
    roles: [joueur]
