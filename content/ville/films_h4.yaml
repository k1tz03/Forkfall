# Histoire 4 — « La Route de la Rive » : les films (docs/design/cinematiques.md).
#
# Un film est une cinématique en 3D, plein écran, qui se joue une fois par carrière. Ce
# fichier dit seulement QUAND il se joue ; le film lui-même est un module de la coquille,
# packages/tools/web/cinema/films/<module>.js (ses plans, ses décors, sa musique, ses
# textes). `livre:` range le film dans son livre : build_content pose la porte
# `flag(histoire_h4)` devant son `si`.
#
# « Deux heures » : le premier rêve de la route. Il passe AVANT la carte du premier rêve
# (jp.h4.route.premier_reve, l'intermède qui suit la première infiltration, la première saison ;
# atteinte dans toutes les carrières mesurées) : la pendule du tableau de bord qui passe
# à deux heures, la chanson de 1984 à la radio, les mains sur le volant, le quai, le
# virage, le pont, et au bout la lumière d'une mobylette. La carte demande à gauche ou à
# droite ; le film s'arrête avant. Il ne montre aucun détail des rêves d'après (la voix
# qui dit « freine », la chevalière, les mains « à dix heures dix », les mains sur les
# genoux), ni la place du passager.
#
# « Le carré ancien » : le 14 mai 1991, dix-huit heures. Il passe APRÈS la carte du
# 14 mai (jp.h4.a4_quatorze_mai et sa variante _seul, la fin de la première saison ; atteinte
# dans toutes les carrières mesurées) : la pierre enfin lue (JULES BERTIN, 1902-1983), le
# médaillon d'un vieil homme, les deux pots de chrysanthèmes, les six ronds des années
# d'avant sur la dalle, le gardien qui ferme la grille. Il vaut pour les quatre
# réponses (ni Camille, ni ce qui a été dit) et ne devance ni le registre ni la suite.
films:
  - id: h4.film.deux_heures
    livre: fin_de_contrat
    module: route_deux_heures
    titre: Deux heures
    quand: carte
    prefixe: jp.h4.route.premier_reve
    moment: avant
    roles: [joueur]
  - id: h4.film.carre_ancien
    livre: fin_de_contrat
    module: carre_ancien
    titre: Le carré ancien
    quand: carte
    prefixe: jp.h4.a4_quatorze_mai
    moment: apres
    roles: [joueur]
