# Histoire 5 — « La Maquette » : les films (docs/design/cinematiques.md).
#
# Un film est une cinématique en 3D, plein écran, qui se joue une fois par carrière. Ce
# fichier dit seulement QUAND il se joue ; le film lui-même est un module de la coquille,
# packages/tools/web/cinema/films/<module>.js (ses plans, ses décors, sa musique, ses
# textes). `livre:` range le film dans son livre : build_content pose la porte
# `flag(histoire_h5)` devant son `si`.
#
# « La seconde tranche » : avant le café de l'agence (pr.h5.a1_cafe, ou sa variante de la
# vente), la première ancre du livre, que toutes les carrières jouent. Le prologue a montré
# la vitrine en une phrase (« Sur la maquette, à sa place, trois arbres en lichen ») ; le
# film la fait voir de près : les Terrasses au 1/200, le lac de résine, les trois arbres à
# la place de l'Est ; puis la vraie tribune, la 14B, la plaque de la grille ; et, la vitrine
# éteinte à minuit par son minuteur, la tribune dans le reflet. Il ne devance rien : ni le
# Conseil, ni le feu, ni qui y gagne. Aucune scène jouée n'occupe ce moment.
#
# « Chêne de 1931 » : avant la carte du feu (pr.h5.a4_feu, ou sa variante de la plaque
# déposée), l'ancre de nuit de la première saison (créneau 9). La tribune Est brûle sous la
# pluie, d'un seul bloc ; les pompiers arrosent la Nord ; la 14B ; le toit tombe à 3 h 40 ;
# de l'autre côté de l'eau, la maquette dans la vitrine éteinte, et le feu dans le verre.
# Ni la main ni le bidon (la mission du témoin), ni la plaque de la grille (la variante l'a
# déposée). La scène jouée du matin (h5.ci.cendres) vient après la carte : elle dit les
# heures et montre Gégé noir de suie ; le film montre la nuit.
films:
  - id: h5.film.tranche
    livre: geant_dechu
    module: seconde_tranche
    titre: La seconde tranche
    quand: carte
    prefixe: pr.h5.a1_cafe
    moment: avant
    roles: [president]

  - id: h5.film.chene
    livre: geant_dechu
    module: chene_1931
    titre: Chêne de 1931
    quand: carte
    prefixe: pr.h5.a4_feu
    moment: avant
    roles: [president]
