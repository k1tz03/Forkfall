# Histoire 6 — « 23 h 58 » : les films (docs/design/cinematiques.md).
#
# Un film est une cinématique en 3D, plein écran, qui se joue une fois par carrière. Ce
# fichier dit seulement QUAND il se joue ; le film lui-même est un module de la coquille,
# packages/tools/web/cinema/films/<module>.js (ses plans, ses décors, sa musique, ses
# textes). `livre:` range le film dans son livre : build_content pose la porte
# `flag(histoire_h6)` devant son `si`. Le livre est écrit au neutre : le héros n'est ni
# nommé ni montré.
#
# « Papier thermique » : avant la carte de la photo (ds.h6.sc.photo, ou sa variante de la
# page jetée), la première ancre du livre, que toutes les carrières jouent. La nuit
# d'après la première page, en temps réel, de 23 h 57 à 23 h 58 : le club-house éteint,
# le bureau, l'horloge, le fax qui sonne et sort le haut d'une photo granuleuse (un
# rideau, une lampe, deux têtes à contre-jour). Il coupe avant les visages et le mot du
# bas : la carte les dit. Aucune scène jouée n'occupe ce moment.
films:
  - id: h6.film.papier
    livre: vendre_trente
    module: papier_thermique
    titre: Papier thermique
    quand: carte
    prefixe: ds.h6.sc.photo
    moment: avant
    roles: [ds]
