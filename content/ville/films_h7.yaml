# Histoire 7 — « Chambre 12 » : les films (docs/design/cinematiques.md).
#
# Un film est une cinématique en 3D, plein écran, qui se joue une fois par carrière. Ce
# fichier dit seulement QUAND il se joue ; le film lui-même est un module de la coquille,
# packages/tools/web/cinema/films/<module>.js (ses plans, ses décors, sa musique, ses
# textes). `livre:` range le film dans son livre : build_content pose la porte
# `flag(histoire_h7)` devant son `si`.
#
# « Vingt-six doubles » : mars 2011, la veille du premier entraînement. Le bus de 2010 garé
# de travers sur le parking de l'hôtel de la Rive, la banderole MONDIAL au pare-brise ; dedans,
# un nom au sparadrap sur chaque appui-tête, et RANCÉ seul au dernier rang ; les Cobalts qui
# arrivent sous la pluie, un sac à la main ; le tableau des vingt-six doubles et le cahier de
# nuit (« minuit — 26 ») ; la 12 qui s'allume au deuxième, et Tibo Rancé à sa fenêtre, qui
# regarde le terrain annexe où il a appris. Il passe avant la carte du brassard (ses trois
# variantes : 2011, créneau 1, toutes les carrières du livre), et donc avant la scène jouée du
# salon (cinematiques_h7.yaml, h7.ci.brassard) : l'arrivée, puis le salon. Il ne devance
# rien : la nuit du 14 novembre n'y est pas, le petit est vivant, personne ne prend de double.
films:
  - id: h7.film.doubles
    livre: apres_fiasco
    module: vingt_six_doubles
    titre: Vingt-six doubles
    quand: carte
    prefixe: sl.h7.a1_brassard
    moment: avant
    roles: [selectionneur]
