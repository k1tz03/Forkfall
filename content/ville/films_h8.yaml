# Histoire 8 — « L'Oreillette » : les films (docs/design/cinematiques.md).
#
# Un film est une cinématique en 3D, plein écran, qui se joue une fois par carrière. Ce
# fichier dit seulement QUAND il se joue ; le film lui-même est un module de la coquille,
# packages/tools/web/cinema/films/<module>.js (ses plans, ses décors, sa musique, ses
# textes). `livre:` range le film dans son livre : build_content pose la porte
# `flag(histoire_h8)` devant son `si`.
#
# « Six heures dix » : le premier jour, et le premier ordre. L'oreillette couleur peau dans
# son étui, sa diode qui bat avec la voix (« Bonjour. On commence par les ventes ? ») ; le
# club dans un tableur, le curseur sur VOLLAIRE ; Vaubourg dans l'escalier du club-house, la
# canne, le clou de la photo de 1974 (« Il lui reste six cent douze jours. ») ; par la fenêtre,
# le stade à l'aube, ALMADIS sur le toit de la Nord ; la bâche de vingt mètres, VOLLAIRE,
# L'ENFANT DU QUAI. Il passe avant la carte de Vollaire (2024, créneau 1 : toutes les carrières
# du livre), donc après le prologue et ses scènes jouées ; il ne dit que ce que le prologue a
# dit, et l'image de la carte qui suit. On ne voit jamais le héros.
#
# « Trois heures » : les projecteurs. Le duplex de la Tréfilerie dans le noir, le pont roulant
# au-dessus du lit vide ; l'oreillette sur la table de nuit, la montre de Cadence qui passe à
# 3 h 00 ; par la baie, le stade au loin qui s'allume, les quatre pylônes d'un coup ; sur la
# pelouse vide, quelqu'un court seul le long de la touche, quatre ombres autour de lui. Il
# passe avant la carte des projecteurs (ses deux variantes, selon que Kerdal vit ou non :
# 2024, créneau 16, toutes les carrières du livre) et vaut pour les deux : la silhouette n'a
# ni nom ni visage, et le film ne dit pas pourquoi le stade s'allume.
films:
  - id: h8.film.six_heures_dix
    livre: le_modele
    module: six_heures_dix
    titre: Six heures dix
    quand: carte
    carte: ds.h8.a1_vollaire
    moment: avant
    roles: [ds]
  - id: h8.film.trois_heures
    livre: le_modele
    module: trois_heures
    titre: Trois heures
    quand: carte
    prefixe: ds.h8.a3_projecteurs
    moment: avant
    roles: [ds]
