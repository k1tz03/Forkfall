# Histoire 9 — « Vingt degrés dedans » : les films (docs/design/cinematiques.md).
#
# Un film est une cinématique en 3D, plein écran, qui se joue une fois par carrière. Ce
# fichier dit seulement QUAND il se joue ; le film lui-même est un module de la coquille,
# packages/tools/web/cinema/films/<module>.js (ses plans, ses décors, sa musique, ses
# textes). `livre:` range le film dans son livre : build_content pose la porte
# `flag(histoire_h9)` devant son `si`.
#
# « La seconde manche » : la veille du barrage aller, cinq heures du matin, rue des Lilas.
# La neige, la seule vitrine allumée ; le fournil, le four ouvert ; sur le marbre, la
# chemise de Kévin, à qui il reste une manche, les ciseaux dans la couture ; sa photo
# au-dessus de la caisse, le sac à pain mis de côté ; à la télévision sans le son, le Dôme,
# vingt degrés dedans. Il passe avant la carte où Marie-Jo glisse le second brassard dans
# le sac (sl.h9.a4_manche, et sa variante _attente : toutes les carrières y passent, en
# première saison). Il ne devance rien : la manche n'est pas encore coupée, le sac n'a que
# sa baguette, et le film ne dit pas à qui elle ira — la carte le demande.
#
# « La baie vitrée » : Al-Dorado, décembre 2030, le Mondial d'hiver ; la première fois qu'on
# voit le Dôme. Dehors, trente-neuf degrés, le panneau de la pharmacie qui passe à 14:10, la
# tour qu'on finit ; dedans, vingt degrés, la pelouse, la brume froide, les haut-parleurs ; le
# banc climatisé ; le couloir vitré, et au téléobjectif, en haut de l'échafaudage, un homme en
# gilet orange qui marche le long d'une planche. Il passe avant la carte du couloir
# (sl.h9.b4_couloir, et sa variante _frere : 91 % des carrières ; les autres finissent en
# garde à vue, à la douane de l'aéroport). Il ne montre pas la chute : l'homme est debout ;
# la carte dit ce qu'on voit.
films:
  - id: h9.film.manche
    livre: mondial_hiver
    module: seconde_manche
    titre: La seconde manche
    quand: carte
    prefixe: sl.h9.a4_manche
    moment: avant
    roles: [selectionneur]

  - id: h9.film.baie
    livre: mondial_hiver
    module: baie_vitree
    titre: La baie vitrée
    quand: carte
    prefixe: sl.h9.b4_couloir
    moment: avant
    roles: [selectionneur]
