# Histoire 9 — « Vingt degrés dedans » : les films (docs/design/cinematiques.md).
#
# Un film est une cinématique en 3D, plein écran, qui se joue une fois par carrière. Ce
# fichier dit seulement QUAND il se joue ; le film lui-même est un module de la coquille,
# packages/tools/web/cinema/films/<module>.js (ses plans, ses décors, sa musique, ses
# textes). `livre:` range le film dans son livre : build_content pose la porte
# `flag(histoire_h9)` devant son `si`.
#
# « La seconde manche » : la veille du barrage aller, cinq heures du matin, rue des Lilas.
# La neige, la seule vitrine allumée ; le fournil, le four ouvert ; sur le marbre, la
# chemise de Kévin, à qui il reste une manche, les ciseaux dans la couture ; sa photo
# au-dessus de la caisse, le sac à pain mis de côté ; à la télévision sans le son, le Dôme,
# vingt degrés dedans. Il passe avant la carte où Marie-Jo glisse le second brassard dans
# le sac (sl.h9.a4_manche, et sa variante _attente : toutes les carrières y passent, en
# première saison). Il ne devance rien : la manche n'est pas encore coupée, le sac est vide,
# et le film ne dit pas à qui elle ira — la carte le demande.
films:
  - id: h9.film.manche
    livre: mondial_hiver
    module: seconde_manche
    titre: La seconde manche
    quand: carte
    prefixe: sl.h9.a4_manche
    moment: avant
    roles: [selectionneur]
