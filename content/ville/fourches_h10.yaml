# Histoire 10 · Les Deux Téléphones — ce que la ville dit des fourches : les choix de
# content/cards/president/h10_fourches.yaml (et de leurs cartes d'origine) qui ne se jouaient que
# sur des jauges cachées posent maintenant un drapeau. Une réplique ne fait pas avancer
# l'intrigue : elle prouve que le choix a été vu. La présidente peut être un président : aucun
# accord, aucune adresse genrée. Gégé et Owen ne parlent plus quand ils sont morts ou partis.
paroles:
  - qui: gege
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_cafe_monte) && !flag(h10_gege_mort)"
    texte: "Tu m'as monté le café, en novembre. Trop clair, comme toujours. Je l'ai bu quand même : à mon âge, on boit ce qu'on vous monte."
  - qui: nino
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_cafe_nino)"
    texte: "J'ai monté le café à mon oncle, en novembre. Tu avais dit « monte-le, toi ». Je l'ai fait. Je ne te le reproche pas : je le compte."
  - qui: nino
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_nino_salue)"
    texte: "Tu m'as dit bonsoir, dans l'escalier du local. Personne ne me le dit, bonsoir, depuis que mon oncle ne descend plus."
  - qui: nino
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_nino_passe)"
    texte: "Dans l'escalier du local, tu es passé sans un mot. Je comptais les marches. Depuis, il y en a une que je ne monte plus."
  - qui: nino
    sujet: club
    si: "flag(histoire_h10) && flag(h10_motion_soir)"
    texte: "On a voté ce soir-là, debout, cartes en l'air. Le conseil aurait traîné. Moi, j'aime les votes qui se comptent tout de suite."
  - qui: nino
    sujet: club
    si: "flag(histoire_h10) && flag(h10_motion_conseil)"
    texte: "Tu as renvoyé la motion au conseil. Le conseil, c'est nous, tu sais. On a voté quand même, un jeudi plus tard. C'était long."
  - qui: owen
    sujet: club
    si: "flag(histoire_h10) && flag(h10_banderole_decrochee) && !flag(h10_owen_vire)"
    texte: "Nino a décroché la banderole avant que je passe dessous. Je ne lui ai pas dit merci. Je lui ai laissé mon verre sur le banc : c'est pareil."
  - qui: owen
    sujet: club
    si: "flag(histoire_h10) && flag(h10_banderole_seche) && !flag(h10_owen_vire)"
    texte: "La banderole a séché jusqu'au mardi. Je suis passé dessous tous les jours, le verre à la main. Un verre d'eau, c'est tenable."
  - qui: nino
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_derby_descendu)"
    texte: "Mon oncle t'a parlé à l'oreille, à la mi-temps du derby. Il m'a dit : « Il n'a rien promis. » C'est le plus gros compliment de sa vie."
  - qui: nino
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_derby_loge)"
    texte: "Mon oncle t'a fait signe, à la mi-temps du derby, et tu es resté en loge. Il s'est assis sur une marche. Il n'a pas dit ton nom de la soirée."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_oncle_occupe) && !flag(h10_gege_mort)"
    texte: "Tu t'occupes des dettes du petit, tu m'as dit. Tu le regardes s'en occuper, c'est plus dur. Je l'ai appris tard, moi aussi."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_oncle_affaires) && !flag(h10_gege_mort)"
    texte: "Les dettes du petit, tu m'as dit que c'étaient ses affaires. Tout est ses affaires, depuis que je ne descends plus. Je range les écharpes."
  - qui: tazi
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_feuille_decrochee)"
    texte: "Ta feuille aux trente-trois cases est sous ma casquette. Je la garde pour le jour de la dernière. Ce jour-là, on comptera à deux."
  - qui: tazi
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_feuille_laissee)"
    texte: "La feuille est toujours au mur, avec les noms au feutre noir. Le tien est dans la dernière case. Je ne l'ai pas écrit : je te le jure sur la truelle."
