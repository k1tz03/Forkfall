# Histoire 6 — « 23 h 58 » : ce que la ville dit des fourches, c'est-à-dire des choix de
# content/cards/ds/h6_fourches.yaml qui ne se jouaient que sur des jauges cachées et posent
# maintenant un drapeau. Une réplique ne fait pas avancer l'intrigue : elle prouve que le
# choix a été vu. Le protagoniste peut être une femme : aucun accord, aucune adresse genrée.
paroles:
  - qui: vukic
    sujet: club
    si: "flag(histoire_h6) && flag(h6_casquette_crochet)"
    texte: "La casquette est toujours au dernier crochet. Les gamins du centre l'essaient quand je ne regarde pas. Je regarde ailleurs : c'est mon travail."
  - qui: vukic
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_casquette_renvoyee)"
    texte: "J'ai renvoyé la casquette à Vestrie, comme vous disiez. Elle est revenue avec une dédicace. Je ne sais pas à qui elle s'adressait."
  - qui: barbier
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_rapport_main_tiroir)"
    texte: "Mon rapport, celui à la main, est dans ton tiroir. Je ne demande pas si tu l'as lu. Je regarde seulement si le tiroir s'ouvre."
  - qui: barbier
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_rapport_main_lu)"
    texte: "Tu as lu ma page jusqu'au bout. Depuis mai, tu es le seul. Les autres lisent la tapée : elle est plus lisible, c'est son défaut."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tas)"
    texte: "Vous avez voulu le tas sur votre bureau. Je le trie quand même, à sept heures, avant vous. Ce que vous lirez, je l'aurai lu en premier."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tri_josiane)"
    texte: "Trois piles : les agents, les clubs, les inconnus. La plus mince, je la cale sous le presse-papier de verre. C'est celle qui compte."
  - qui: fan
    sujet: sponsor
    si: "flag(histoire_h6) && flag(h6_recrue_joue)"
    texte: "La recrue de la canette entre à la quatre-vingt-cinquième, touche deux ballons et salue la loge. On compte ses ballons, comme on compte les fax."
  - qui: fan
    sujet: sponsor
    si: "flag(histoire_h6) && flag(h6_recrue_banc)"
    texte: "La recrue de la canette regarde le match en tribune, derrière le photographe. Elle est sur la photo du lundi quand même."
  - qui: enfant
    sujet: club
    si: "flag(histoire_h6) && flag(h6_maillot_chaise)"
    texte: "Il y a un maillot de réserve sur le dossier de votre chaise, au club-house. C'est celui de Tibo. Il sent la lessive de la buanderie municipale."
  - qui: enfant
    sujet: club
    si: "flag(histoire_h6) && flag(h6_maillot_promesse)"
    texte: "Tibo dit qu'il aura d'autres maillots. Il le dit même à l'école. Les copains font semblant de le croire."
  - qui: vukic
    sujet: club
    si: "flag(histoire_h6) && flag(h6_gauche_promis) && saison >= 1"
    texte: "Vogler vous a demandé un gaucher en août. Vous avez dit « vous l'aurez ». Il a compté les mois jusqu'à son départ, sans le redire."
  - qui: fan
    sujet: club
    si: "flag(histoire_h6) && flag(h6_adieu_public)"
    texte: "On a annoncé Dembo au micro, à la dernière, devant tout le stade. Il a salué la Nord, main ouverte. On n'a pas pleuré. Presque."
  - qui: fan
    sujet: club
    si: "flag(histoire_h6) && flag(h6_adieu_cache)"
    texte: "Dembo est parti sans passer au micro. On l'a su par L'Écho. Le virage a gardé son chant pour plus tard, au cas où."
