# Histoire 7 · Chambre 12 — ce que l'hôtel et la ville disent des fourches : les choix de
# content/cards/selectionneur/h7_fourches.yaml (et de leurs cartes d'origine) qui ne se
# jouaient que sur des jauges cachées posent maintenant un drapeau. Une réplique ne fait pas
# avancer l'intrigue : elle prouve que le choix a été vu. Le héros peut être une femme :
# aucun accord, aucune adresse genrée.
paroles:
  - qui: sandrine
    sujet: toi
    si: "flag(histoire_h7) && flag(h7_page_prise)"
    texte: "Vous avez pris la page sans la lire devant lui. Prendre, ce n'est pas lire. Mais je ne reprends jamais ce que j'ai détaché."
  - qui: sandrine
    sujet: toi
    si: "flag(histoire_h7) && flag(h7_page_lue)"
    texte: "Vous avez lu ma page jusqu'au bout, debout dans le hall. Le cahier s'en souvient moins que vous : il n'a que l'heure."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h7) && flag(h7_fiche_rendue)"
    texte: "J'ai rendu sa fiche à monsieur Mbako. Il l'a mise dans la poche où il garde le brassard. Je n'ai pas demandé pourquoi cette poche."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h7) && flag(h7_fiche_laissee)"
    texte: "La fiche de monsieur Mbako est à la lettre M. Il est venu la chercher une fois, l'a lue debout, et me l'a rendue. Il lit comme on prête serment."
  - qui: desforges
    sujet: sponsor
    si: "flag(histoire_h7) && flag(h7_canettes_essai)"
    texte: "Vos canettes sont scotchées par le fond : de la logistique. Les photographes aiment les détails, et Fulgor aime les photographes."
  - qui: desforges
    sujet: sponsor
    si: "flag(histoire_h7) && flag(h7_canettes_restent)"
    texte: "Fulgor note ceux qui laissent les canettes sur la table. Ce n'est pas un compliment, c'est un classement."
  - qui: dauzat
    sujet: toi
    si: "flag(histoire_h7) && flag(h7_berline_heure)"
    texte: "Le président m'a dit pourquoi six heures, sur le quai, vitre baissée. Je l'ai noté en marge, au crayon. Le crayon s'efface, le registre non."
  - qui: dauzat
    sujet: toi
    si: "flag(histoire_h7) && flag(h7_berline_chez_lui)"
    texte: "Le président est rentré chez lui, comme vous disiez. Sa berline s'est arrêtée longtemps devant le fleuriste. Je me demande pour qui."
  - qui: fauvel
    sujet: toi
    si: "flag(histoire_h7) && flag(h7_mbako_defendu)"
    texte: "Mbako a levé la main le premier. Vous l'aviez défendu, il me l'a dit. Il ne dit pas merci ; il lève la main."
  - qui: fauvel
    sujet: toi
    si: "flag(histoire_h7) && flag(h7_verite_dabord)"
    texte: "Vous m'avez dit la vérité d'abord. Moi, mes joueurs d'abord. On s'est retrouvés au même endroit, dans l'autre sens."
  - qui: rouvier
    sujet: toi
    si: "flag(histoire_h7) && flag(h7_frappe_une)"
    texte: "Une fois, j'ai frappé. Au registre, c'est trois. Un registre veut toujours trois coups : c'est comme au théâtre."
  - qui: rouvier
    sujet: toi
    si: "flag(histoire_h7) && flag(h7_frappe_pas)"
    texte: "Je n'ai pas frappé : j'ai ouvert avec le double. Au registre, c'est trois coups. On n'ouvre pas avec un double, dans les registres."
