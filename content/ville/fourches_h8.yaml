# Histoire 8 · L'Oreillette — ce que la ville dit des fourches : les choix de
# content/cards/ds/h8_fourches.yaml (et de leurs cartes d'origine) qui ne se jouaient que sur
# des jauges cachées posent maintenant un drapeau. Une réplique ne fait pas avancer
# l'intrigue : elle prouve que le choix a été vu. Le directeur sportif peut être une
# directrice : aucun accord, aucune adresse genrée. Kerdal ne parle plus quand il est mort.
paroles:
  - qui: mbako
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_rampe_machine)"
    texte: "À la rampe, tu m'as répondu comme ta machine. Je n'ai rien dit. Je note ceux qui répondent pour quelqu'un d'autre."
  - qui: mbako
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_rampe_moi)"
    texte: "À la rampe, tu as compté comme moi. Ça n'engage à rien. Mais je me rappelle le jour où tu as répondu pour toi."
  - qui: kerdal
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_tribune_dormir) && !flag(h8_kerdal_mort)"
    texte: "Tu m'as dit que je dormirais. Je dors mal, mais je me rappelle que tu l'as dit. C'est déjà une nuit, ça."
  - qui: kerdal
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_tribune_mercredi) && !flag(h8_kerdal_mort)"
    texte: "Mercredi, tu as dit. J'ai écrit la date sur mon poignet, au stylo. Pas sur la montre : elle ne connaît pas les mercredis."
  - qui: mbako
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_refus_ici)"
    texte: "« Il dormira ici », tu m'as dit. J'ai gardé la phrase. Je la relis quand je ne sais plus à qui parler dans ce club."
  - qui: mbako
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_refus_porte)"
    texte: "La machine voulait le vendre et c'est toi qui l'as porté. Ce n'est pas un compliment. C'est un poids, et il est pour toi."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_mere_toi)"
    texte: "Sa mère m'a dit : « Il n'a pas menti, ce monsieur. » Je l'ai écrit sur un papier. Je le garde pour vous, dans le classeur."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_mere_docteur)"
    texte: "La mère d'Erwan a rappelé deux fois le secrétariat. Elle demande qui, ici, lui parlera. Je lui ai dit qu'on se renseignait."
  - qui: ober
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_montre_perdue)"
    texte: "Perdue, la montre : c'est écrit, signé, classé. Les dossiers de ce club sont pleins de choses perdues qui dorment dans un tiroir."
  - qui: ober
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_montre_refus)"
    texte: "J'ai écrit refus. Le fonds n'a pas de case pour ce mot : ils l'ont rangé dans « divers ». Vous êtes dans « divers », maintenant."
  - qui: gege
    sujet: sponsor
    si: "flag(histoire_h8) && flag(h8_stand_ferme)"
    texte: "Le stand, tu l'as fait fermer. Les bracelets, eux, sont restés aux poignets. On est trente à clignoter pendant les chants."
  - qui: gege
    sujet: sponsor
    si: "flag(histoire_h8) && flag(h8_stand_laisse)"
    texte: "Cadence est resté à la buvette. Les anciens sont grands, tu as dit. Ils sont grands, oui, et ils portent ce qu'on leur donne."
  - qui: gege
    sujet: club
    si: "flag(histoire_h8) && flag(h8_bache_gardee)"
    texte: "La bâche de Vollaire est dans mon coffre, entre le thermos et la roue de secours. Tu me l'as laissée. On changera le nom un jour."
  - qui: gege
    sujet: club
    si: "flag(histoire_h8) && flag(h8_bache_pliee)"
    texte: "Tu voulais la brûler, la bâche. Je l'ai pliée en huit. Un nom, ça se plie, ça ne brûle pas. Elle attend dans mon armoire."
