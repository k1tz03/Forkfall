# Histoire 9 · Vingt degrés dedans — ce que la ville dit des fourches : les choix de
# content/cards/selectionneur/h9_fourches.yaml (et de leurs cartes d'origine) qui ne se jouaient
# que sur des jauges cachées posent maintenant un drapeau. Une réplique ne fait pas avancer
# l'intrigue : elle prouve que le choix a été vu. La sélectionneuse peut être un homme : aucun
# accord, aucune adresse genrée. Gigi Vecchio ne parle plus quand il est mort.
paroles:
  - qui: mariejo
    sujet: toi
    si: "flag(histoire_h9) && flag(h9_lettre_aide)"
    texte: "Vous avez proposé d'aider, pour le four. Personne n'aide un four, je vous l'ai dit. Mais je n'ai pas oublié que vous aviez proposé."
  - qui: mariejo
    sujet: toi
    si: "flag(histoire_h9) && flag(h9_lettre_baguette)"
    texte: "Vous avez pris votre baguette, c'est tout. C'est déjà beaucoup, ici. Les autres me demandent des nouvelles. Vous, vous payez."
  - qui: gege
    sujet: club
    si: "flag(histoire_h9) && flag(h9_greve_comprise)"
    texte: "Tu as compris, pour le toit, et tu l'as dit. Ça ne se dit pas, d'habitude : ça se boit. On t'a gardé un demi au bout du zinc."
  - qui: gege
    sujet: club
    si: "flag(histoire_h9) && flag(h9_greve_venez)"
    texte: "« Venez nous voir jouer », tu as dit. Sous un toit, non. Mais on t'a entendu. C'est déjà plus que ce que la Fédération a fait."
  - qui: mariejo
    sujet: sombre
    si: "flag(histoire_h9) && flag(h9_rapport_saurai)"
    texte: "Vous avez dit que vous sauriez là-bas ce que veut dire « à l'intérieur ». Le rapport reste dans mon tablier, contre la monnaie."
  - qui: mariejo
    sujet: sombre
    si: "flag(histoire_h9) && flag(h9_rapport_doute)"
    texte: "Vous ne savez pas si vous saurez. Moi non plus. C'est la première fois qu'on me répond ça, et que ça me fait du bien."
  - qui: nassir
    sujet: sponsor
    si: "flag(histoire_h9) && flag(h9_ligne_lie_pas)"
    texte: "Ma ligne de 2010 ne vous lie pas, dites-vous. Je l'ai relue hier. Elle ne lie personne, vous avez raison. C'est le tournoi qui lie."
  - qui: nassir
    sujet: sponsor
    si: "flag(histoire_h9) && flag(h9_ligne_comme_vous)"
    texte: "Vous lisez ma ligne comme moi : image positive. Je n'ai jamais eu de lecteur aussi fidèle. Cela m'inquiète un peu, pour vous."
  - qui: brehaut
    sujet: toi
    si: "flag(histoire_h9) && flag(h9_bre_ministere)"
    texte: "J'ai demandé qui avait écrit « fatigué » : le ministère, m'avez-vous dit. J'ai noté. Un ministère, ça ne signe jamais."
  - qui: brehaut
    sujet: toi
    si: "flag(histoire_h9) && flag(h9_bre_erreur)"
    texte: "Une erreur, m'avez-vous dit, pour Noa. Je vous ai tendu un crayon avec une gomme. Vous l'avez toujours ? La gomme, c'est ce qui reste d'une erreur."
  - qui: vandel
    sujet: toi
    si: "flag(histoire_h9) && flag(h9_noa_dicte)"
    texte: "« On me l'a dicté », vous avez dit. Je ne sais pas par qui. Mais vous ne m'avez pas menti, et ça, un fatigué s'en souvient."
  - qui: vandel
    sujet: toi
    si: "flag(histoire_h9) && flag(h9_noa_signe)"
    texte: "« Je l'ai signé », vous avez dit. Merci de ne pas mentir. Mais un nom signé, ça ne part pas à la gomme."
  - qui: vecchio
    sujet: toi
    si: "flag(histoire_h9) && flag(h9_pluie_raconte) && !flag(h9_vecchio_mort)"
    texte: "Tu me racontes les plongeons du petit mieux qu'il ne les plonge. Je les garde, ceux-là. Je n'ai pas besoin de les voir."
  - qui: vecchio
    sujet: toi
    si: "flag(histoire_h9) && flag(h9_pluie_pres) && !flag(h9_vecchio_mort)"
    texte: "Trois pas dans l'herbe mouillée, pour voir de près. Ça mouille, c'est vrai. J'ai senti l'herbe jusqu'à la hanche."
