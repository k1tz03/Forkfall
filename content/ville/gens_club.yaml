# LA VILLE VIVANTE — LE LOT « CLUB » : les gens du club et de ses abords.
#
# Le contrat : docs/histoires/ville_vivante.md (§ 8 pour les formats). La charte
# d'écriture (docs/bible/charte_histoire.md) fait loi ici comme dans les cartes : une
# réplique dit cette situation-là, un geste, un objet, une heure ; aucune formule ne
# revient ; personne ne recopie la phrase-signature (`tic`) de sa fiche.
#
# Dix lieux, un visage par époque, sans trou ni chevauchement (le premier de chaque
# lieu est le gardien du lieu ; Gégé et Nino sont des habitués) :
#   club-house     Madame Josiane (1990-2031)   → Mireille, sa nièce (2032-2050)         direction
#   buvette        Firmin Pujade (1990-2013)    → Jo Pujade, son fils (2014-2050)        argent
#                  Gégé (1990-2040) ; Nino, son neveu, capo (2020-2050)                  tribunes
#   matériel       Hector Plassard (1990-2008)  → Gaëtan Rouquette, son apprenti (2009-2050)  vestiaire
#   stade          Lulu Gendreau (1990-2006)    → Rémi Gendreau, son fils (2007-2050)    tribunes
#   centre         Maurice Thévenot (1990-2012) → Nadège Fournel (2013-2050)             vestiaire
#   terrain        Germain Vidalie (1990-2012)  → Thomas Vidalie, son fils (2013-2050)   vestiaire
#   muscu          Steph (1990-2014)            → Teddy Rivoire (2015-2050)              vestiaire
#   gare routière  Norbert (1990-2010)          → Karine Duclou (2011-2050)              rue
#   boutique       Arlette Combaz (1990-2014)   → Lou Arnal (2015-2050)                  tribunes
#   brasserie      Léon Brétaud (1990-2016)     → Raoul Pélissou, son chef (2017-2050)   direction
#
# Ce que les livres ont déjà fixé et qu'on tient : Lulu est le gardien du stade (la loge,
# le registre des clés, le chien Corner : livres 2 et 3, mission `corner`) ; la buvette a un
# patron, pas une patronne (ses activités, les conversations, les livres 5 et 10) ; Josiane,
# retraitée, passe encore au secrétariat et tape encore des listes jusqu'au Mondial d'hiver
# (livres 7 à 9) ; Mireille, sa nièce, y est « depuis 2022 » (livre 10) — on la montre en
# ville à partir de 2032 ; le car du club est vendu en mai 2003 (livre 6) ; le gardien du
# stade de 2024 est un homme marié, qui range sa radio (livre 8) ; Steph quitte la salle
# après la douche de Momo (livre 3) ; Gégé meurt en février 2040 (livre 10).
#
# Les activités déjà écrites qu'on fait avec quelqu'un (`activites:` d'une personne) ne
# sont que celles qui nomment la personne, ou que seuls l'entraîneur et le joueur vivent
# (leurs livres sont tous des années 1990) : le moteur donne le point de lien à la personne
# de l'activité quelle que soit l'année, et une activité de tous les rôles ferait monter le
# lien du visage de 1990 dans une carrière de 2037. Les autres gestes partagés sont écrits
# ici, bornés à l'époque de chacun (`si: annee ...`).
#
# Les tuyaux qui nourrissent un livre (en plus de leur drapeau `tuyau_<id>`) :
#   h5_mireille (Josiane, livre 5 : la sœur aux archives ouvre l'étape du cadastre) ;
#   vars.h6_indices +1 (Josiane, Hector, Lulu, Norbert, livre 6 : la nuit du sous-sol en lit 3) ;
#   vars.clow_conseils +1 (Léon, l'entraîneur des années 1990 : l'hôpital de Corven en lit 2) ;
#   h8_cycle_trois_heures (Rémi, livre 8 : les projecteurs) ;
#   vars.h8_nuits (Teddy : son service rend une nuit, sa scène en coûte une).
# Un service a un prix caché : celui de Steph pose `vl_dopant` (la première boîte ; le
# contrôle du joueur, jp.vl.controle, peut tomber).
# Les liens eux-mêmes ouvrent des portes : relation.gege >= 2 (le brasero du livre 1, la
# dernière montée du livre 10), relation.josiane >= 2 ou 3 (les deux bancs et la poursuite
# du livre 2, le nom de la laverie), relation.gege <= -1 (le cercueil, ceux qui t'attendent).
#
# Le lot ne pose aucun drapeau à lui : seulement ceux que le moteur écrit pour la ville
# vivante (`tuyau_<id>`, `service_<id>`, `dette_<id>`), et ceux des livres cités plus haut.

gens:

  # ═════════════════════════════════════════════════════════════════ LE CLUB-HOUSE
  # Le secrétariat, le matin et l'après-midi. Madame Josiane : le vouvoiement, les dates,
  # les papiers ; elle avertit par un geste (une tasse en plus, une chemise sans nom),
  # jamais par un commérage.
  - id: josiane
    lieu: clubhouse
    tranches: [matin, aprem]
    annees: [1990, 2031]
    reseau: direction
    trace: "Madame Josiane a noté l'heure de ton passage au crayon, dans la marge de son registre."
    paliers: ["te garde une tasse sur le radiateur", "te laisse lire par-dessus son épaule", "taperait une copie de trop pour toi"]
    froid: ["te fait attendre au guichet", "ne te monte plus le courrier", "range ton dossier sous les autres"]
    activites: [papiers, clubhouse_lettres]
    climat:
      bas:
        - {si: "role == joueur", texte: "Votre nom est revenu au conseil, mardi. Personne ne l'a défendu. Au procès-verbal, j'ai écrit « Divers » ; c'est moi qui ai choisi le mot."}
        - {si: "role == president", texte: "Trois administrateurs ont demandé le procès-verbal avant la séance. D'habitude, ils le lisent après, quand ils le lisent. Ils comptent leurs voix."}
        - {si: "role == selectionneur", texte: "La Fédération a rappelé deux fois ce matin sans laisser de message. Quand ils ne laissent pas de message, c'est qu'une lettre est déjà tapée."}
        - "Le président a fait monter le classeur des contrats et il a gardé le stylo. Quand il garde le stylo, il signe quelque chose qu'il ne me fait pas taper."
      moyen:
        - {si: "role == joueur", texte: "Le club a renouvelé votre assurance sans discuter la prime. On ne vous aime pas plus qu'avant. On ne vous aime pas moins non plus."}
        - {si: "role == president", texte: "Le conseil de jeudi tient sur une page. Ils ont des questions ; ils les gardent pour juin. C'est leur façon de vous laisser l'hiver."}
        - {si: "role == selectionneur", texte: "La Fédération a renvoyé votre convention de stage sans corriger une virgule. Ils attendent de voir. Moi aussi, je l'avoue."}
        - "Le président m'a demandé deux fois l'heure ce matin. Il attend un coup de fil ; il ne m'a pas dit de qui. Il n'a pas parlé de vous."
      haut:
        - {si: "role == joueur", texte: "Le club a fait encadrer votre photo du dernier match pour le couloir du premier. On ne le fait pas pour tout le monde. J'ai choisi le cadre."}
        - {si: "role == president", texte: "Ils ont voté vos comptes à main levée, sans ouvrir l'annexe. Un conseil qui n'ouvre pas l'annexe vous fait confiance. Ou il dort."}
        - {si: "role == selectionneur", texte: "La Fédération me fait taper vos courriers sur le papier à en-tête doré. Ils le gardent pour ceux qu'on montre aux ministres."}
        - "Le président a signé les notes de frais sans les lire, et il chantonne dans l'escalier. Profitez-en : chez lui, ça tient rarement jusqu'au printemps."
    repliques:
      - {lien: 0, texte: "Le courrier arrive à neuf heures dix, le second à seize heures. Entre les deux, je ne réponds pas aux questions qu'on peut poser par écrit."}
      - {lien: 0, si: "annee < 1998", texte: "Le fax a avalé deux pages ce matin et n'en a rendu qu'une. Celle qui manque venait de la Fédération. Je l'attends encore, debout à côté."}
      - {lien: 0, si: "annee >= 2014", texte: "Je ne travaille plus ici, je viens arroser la plante du palier. Personne ne l'arrose. Ne me demandez pas depuis quand on ne me paie plus pour ça."}
      - {lien: 1, si: "serie_d >= 1", texte: "J'ai rangé les lettres d'insultes dans une chemise à part ; elles sont mieux écrites que les autres. Vous ne les lirez pas. Je vous dis seulement qu'elles existent."}
      - {lien: 1, si: "tranche == matin", texte: "Votre café est sur le radiateur depuis huit heures et demie. S'il est froid, vous êtes en retard. S'il est chaud, c'est que je l'ai refait."}
      - {lien: 2, si: "role != president", texte: "Le président ne lit jamais la deuxième page. Mettez ce qui compte sur la première, ou ne le mettez nulle part. Je ne vous ai rien appris."}
      - {lien: 2, si: "phase == hiver", texte: "Les étrennes des salariés sont dans l'enveloppe kraft, sous le sous-main. Le jardinier compte la sienne devant moi, chaque année. Je regarde la fenêtre."}
      - {lien: 3, texte: "Le tiroir du bas de mon bureau ne ferme pas à clé. Si un jour vous y trouvez une chemise sans nom, c'est qu'elle est pour vous."}
      - {lien: -1, texte: "Votre courrier est au casier. Je ne monte plus rien au premier ; on m'a dit que vous préfériez vous servir."}
      - {lien: -2, si: "role != president", texte: "J'ai noté votre arrivée de mardi au registre. L'heure vraie. Le président lit le registre, lui, quand ça l'arrange."}
      - {lien: -3, texte: "Vos clés sont dans cette enveloppe, avec un reçu en deux exemplaires. Gardez le vôtre. Ici, plus personne ne gardera rien pour vous."}
    tuyaux:
      - id: josiane_registre
        si: "annee < 2003 && role != president"
        texte: "Le président descend au secrétariat le dimanche, à six heures, quand personne n'y est. Il ne prend rien. Il lit le registre des appels. Le lundi, il y manque des lignes."
      - id: josiane_soeur
        si: "flag(histoire_h5) && saison >= 2 && !flag(h5_mireille)"
        texte: "Ma sœur Mireille est aux archives de la mairie depuis 1971. Si une copie de 1931 s'est « perdue » en 1976, elle sait sous quelle lettre on l'a rangée."
        effets: {set: [h5_mireille]}
      - id: josiane_carbone
        si: "flag(histoire_h6) && saison >= 2"
        texte: "Le petit stagiaire photocopie les rapports de Barbier deux fois. Une copie pour le classeur, l'autre pour sa sacoche. Je l'ai vu plier la seconde en quatre."
        effets: {var: {h6_indices: "+1"}}
      - id: josiane_bordereau
        si: "flag(histoire_h7) && flag(h7_rance_mort)"
        texte: "En 2010, le dossier du petit Rancé est revenu signé « apte » en deux heures. Les autres ont mis trois semaines. J'avais noté l'heure sur ma copie du bordereau. Je l'ai encore."
      - id: josiane_voeux
        si: "flag(histoire_h8)"
        texte: "Le petit Ferlac m'envoyait une carte de vœux chaque janvier, tapée à la machine, jamais signée. Il en est encore arrivé une le 3 janvier 2024. On l'avait retrouvé en décembre."
    service:
      lien: 3
      si: "!flag(dette_josiane)"
      label: "Une copie de trop"
      texte: "Josiane retape un courrier confidentiel avant qu'il parte, et en tape un exemplaire de plus, qu'elle te tend dans une chemise sans nom. Tu sais ce qui se prépare, et quand."
      effets: {jauges: {direction: 3}}
      dette: true

  - id: mireille
    name: "Mireille"
    label: "SECRÉTAIRE DEPUIS 2022"
    genre: f
    portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: carre, cheveux: chatain, pilosite: rase, lunettes: rondes, tenue: pull, couleur: prune, accessoire: carnet}
    on_relation: {3: vi.mireille.faveur}
    lieu: clubhouse
    tranches: [matin, aprem]
    annees: [2032, 2050]
    roles: [president, ds]
    reseau: direction
    trace: "Mireille a écrit ton prénom dans son cahier à spirale, à l'encre verte. Le vert, chez elle, c'est pour les gens."
    paliers: ["te passe les appels sans demander qui", "te lit les pages qu'elle n'a pas tapées", "décrocherait pour toi à trois heures"]
    froid: ["te répond à la troisième sonnerie", "ne te passe plus que les huissiers", "a rayé ton prénom au vert"]
    climat:
      bas:
        - {si: "role == president", texte: "Trois membres du conseil ont demandé la liste des présents de la dernière séance, avec les heures d'arrivée. Je l'ai classée au rouge. Le rouge, c'est quand on compte contre vous."}
        - "Le président a fait poser un second téléphone sur son bureau et il le décroche porte fermée. Le premier, il ne le décroche plus pour personne d'ici."
      moyen:
        - {si: "role == president", texte: "Le conseil a reporté deux questions à la prochaine séance, sans dire lesquelles. Je les ai notées au crayon. Le crayon, chez moi, veut dire : pas encore."}
        - "Le président a demandé votre agenda de la semaine, sans un mot. Je le lui ai donné tel quel. Il n'a rien rayé. Il n'a rien ajouté non plus."
      haut:
        - {si: "role == president", texte: "Le conseil a voté le budget sans lever la tête. Deux membres m'ont demandé votre numéro personnel. Je ne l'ai pas donné ; ils l'ont trouvé seuls."}
        - "Le président a écrit votre nom sur la liste de la loge au stylo, pas au crayon. Il ne revient jamais sur ce qu'il écrit au stylo."
    repliques:
      - {lien: 0, texte: "Je réponds au téléphone à la deuxième sonnerie, jamais à la première. À la première, on croit qu'on attendait. À la troisième, qu'on ne veut pas."}
      - {lien: 0, si: "tranche == matin", texte: "Ma mère s'appelait Mireille aussi, et elle tenait les archives de la mairie. Elle classait par lettre ; moi, par couleur. Ma tante dit que c'est une façon élégante de tout perdre."}
      - {lien: 1, texte: "Je note tout ce qui sonne : l'heure, la voix, et si on a raccroché avant moi. Ceux qui raccrochent avant moi, je les mets en bleu."}
      - {lien: 2, si: "role == president && flag(histoire_h10)", texte: "Quand votre veste sonne pendant le conseil, je fais tomber mon stylo. Tout le monde regarde le stylo. Vous l'aviez remarqué ?"}
      - {lien: 3, texte: "J'ai un double du registre des appels chez moi, dans la boîte à chaussures de ma mère. Si un jour on vous demande où vous étiez, je saurai."}
      - {lien: -1, texte: "Votre courrier est trié, au gris. Le gris, c'est quand je n'ai pas d'avis. Je n'en ai plus, sur vous."}
      - {lien: -2, si: "annee <= 2041", texte: "Ma tante m'a demandé de vos nouvelles. J'ai dit que vous alliez bien. Je mens mal ; elle n'a pas insisté, et ça m'a fait plus peur que si elle l'avait fait."}
    tuyaux:
      - id: mireille_cadre
        si: "flag(histoire_h10) && !flag(h10_photo_confiee) && !flag(h10_photo_raccrochee) && !flag(h10_photo_tiroir)"
        texte: "Ma tante garde la photo de 1974 à la maison de retraite, derrière Saint-Aubin, emballée dans un vieux journal. Le clou de l'escalier attend. Passez la voir un matin."
      - id: mireille_liste
        si: "flag(histoire_h10) && saison >= 2"
        texte: "Nino m'a demandé la liste des socios en janvier, avec les adresses, « pour les convocations ». Les convocations, c'est moi qui les envoie, par la poste. Il le sait."
    service:
      lien: 3
      label: "Filtrer le standard"
      texte: "Pendant une semaine, Mireille filtre tes appels : la ville passe, les autres attendent en bleu dans son cahier. Tu travailles sans qu'on te sonne."
      effets: {jauges: {direction: 2, vestiaire: 1}}

  # ════════════════════════════════════════════════════════════════════ LA BUVETTE
  # Le zinc, les écharpes au plafond, la table du fond. Le patron tient la caisse et
  # l'ardoise : il sait ce que chacun peut payer, le club compris (réseau `argent`).
  # Gégé tient la Nord ; Nino, son neveu, la tient après lui.
  - id: pujade
    name: "Firmin Pujade"
    label: "LE PATRON DE LA BUVETTE"
    genre: m
    portrait: {teint: clair, corpulence: large, age: age, coiffure: degarni, cheveux: gris, pilosite: moustache, lunettes: aucune, tenue: chemise, couleur: blanc, couleur2: bordeaux, accessoire: aucun}
    on_relation: {3: vi.pujade.faveur, -3: vi.pujade.rideau}
    lieu: buvette
    tranches: [midi, aprem, soir]
    annees: [1990, 2013]
    reseau: argent
    trace: "Firmin a passé deux fois le torchon sur le zinc à ta place. Chez lui, c'est une signature."
    paliers: ["te sert sans que tu lèves la main", "te sort la bouteille de sous le zinc", "te ferait crédit sans craie"]
    froid: ["te fait payer d'avance", "te sert le fond du fût", "a écrit ton nom à la craie, en haut"]
    activites: [tournee, buvette_coup_de_main]
    climat:
      bas:
        - {si: "role == joueur", texte: "Tu paies tes demis en pièces depuis deux semaines, et tu comptes avant de poser. Je ne dis rien. Je compte avec toi."}
        - {si: "role == president", texte: "Le club ne m'a pas payé les fûts de la Coupe. Le livreur veut du liquide, maintenant, et il compte devant moi. Quand un livreur compte devant toi, c'est la ville qui compte."}
        - {si: "role == ds", texte: "Tes joueurs ne paient plus leurs tournées. Ils boivent à l'ardoise et parlent de primes qui ne tombent pas. Je les entends, je sers, je note."}
        - {si: "role == selectionneur", texte: "La Fédération a payé la note du dernier stage en trois chèques, à trois semaines d'écart. Le troisième est revenu. Je l'ai punaisé sous la télé."}
        - "Le club me doit les sandwichs des trois derniers matchs. Les bénévoles le disent tout haut au comptoir. Ton budget, on le lit sur ma craie."
      moyen:
        - {si: "role == joueur", texte: "Tu paies tes tournées au billet et tu ramasses la monnaie. Ni riche ni à sec. C'est la meilleure façon de durer, au comptoir comme ailleurs."}
        - {si: "role == president", texte: "Le club a payé les fûts à trente jours, pile. Les livreurs ont arrêté de compter devant moi ; ils comptent encore, mais dans le camion."}
        - {si: "role == ds", texte: "Les joueurs paient leurs tournées un samedi sur deux. L'autre samedi, ils attendent la prime. On sait qu'elle tombera ; on ne sait pas quand."}
        - {si: "role == selectionneur", texte: "La Fédération a commandé les repas du stage au prix de l'an dernier, sans le dessert. On mange. On ne fête rien."}
        - "Le trésorier passe régler les sandwichs le lundi, en liquide, et il demande un reçu. Ça veut dire qu'on vit, et qu'on vérifie."
      haut:
        - {si: "role == joueur", texte: "Tu as payé la tournée de la Nord sans regarder l'addition. Ils t'aiment pour ça. Moi, je la regarde à ta place : c'est mon métier."}
        - {si: "role == president", texte: "Le club m'a payé d'avance les fûts du derby. D'avance. Mon père aurait fait encadrer le chèque. Moi, je l'ai encaissé vite, au cas où."}
        - {si: "role == ds", texte: "Tes joueurs paient leurs tournées et celles des autres. Un vestiaire qui régale, c'est un vestiaire dont la prime est tombée avant le match."}
        - {si: "role == selectionneur", texte: "La Fédération a retenu ma salle du fond pour trois soirs, boissons comprises. Quand ils comprennent les boissons, c'est qu'il y a de l'argent quelque part."}
        - "Le club a commandé deux fûts de plus pour samedi et les a payés comptant. Ton budget a de la marge : ça se voit à la mousse."
    repliques:
      - {lien: 0, texte: "La pression ou la bouteille ? La pression, c'est le fût du jour. La bouteille, c'est pour ceux qui ne font confiance à personne."}
      - {lien: 0, si: "jour == sam && tranche == midi", texte: "Le samedi, j'ouvre à onze heures et je ferme quand le dernier chant s'arrête. Une fois, c'était trois heures du matin. On avait perdu."}
      - {lien: 0, si: "serie_d >= 1", texte: "On boit moins quand on perd ? Non. On boit pareil, mais à l'ardoise. Ma craie s'use plus vite que mes fûts, ces temps-ci."}
      - {lien: 1, texte: "La boîte à cigares, sous la caisse, c'est l'argent de l'ardoise. Je n'y touche pas. Le jour où je mourrai, mon fils fera les comptes."}
      - {lien: 1, si: "annee < 2000", texte: "Mon fils dort sous le zinc les soirs de match depuis qu'il a quatre ans. Il connaît tous les chants. Il ne sait pas encore ce qu'ils veulent dire."}
      - {lien: 2, texte: "Je sers le kop depuis 1970. Onze présidents ont bu au bout de ce zinc. Les bons payaient leur demi ; les autres le mettaient sur le compte du club."}
      - {lien: 3, texte: "Le placard du fond n'est pas à moi. Gigi Vecchio en porte la clé à son cou depuis 1974. Je n'ai jamais demandé ce qu'il y range. Toi non plus, si tu m'écoutes."}
      - {lien: -1, texte: "D'avance, s'il te plaît. Depuis l'autre soir, je fais payer d'avance ceux qui partent sans dire au revoir."}
      - {lien: -2, texte: "Ton verre est servi, tu peux le boire. Mais au fond, la Nord te regarde, et mon zinc n'est pas un bouclier."}
      - {lien: -3, texte: "Je ne te sers plus. Ce n'est pas la loi, c'est ma buvette. Il y a un tabac au carrefour, et du café au distributeur de la gare."}
    tuyaux:
      - id: pujade_sauvat
        si: "flag(histoire_h1) && !flag(h1_quai_paye) && !flag(h1_quai_refuse)"
        texte: "Le fils Sauvat, des Courses du Quai, m'a demandé à quelle heure tu prends ton café au Corner. Son père posait la même question en 1974. Pour ton père."
      - id: pujade_paie
        si: "role != selectionneur"
        texte: "Le 6 du mois, regarde comment les joueurs paient leur demi. En billets neufs, la paie est tombée. En pièces, le club a du retard, et ils ne te le diront pas."
      - id: pujade_billets_plies
        si: "flag(histoire_h2)"
        texte: "Dembo a soldé son ardoise chez moi avec des billets pliés en long. Au Terminus, à l'arrière-salle, on plie les billets en long. Ici, on les plie en quatre."
      - id: pujade_pere_rance
        si: "flag(histoire_h6) && !flag(h6_pere_rance)"
        texte: "Le père Rancé boit son café ici le dimanche, avant la route. Il ne parle pas de son fils. Il parle de ce qu'il doit, à qui, et combien avant lundi."
    service:
      lien: 3
      si: "!flag(dette_pujade)"
      label: "Une avance sur l'ardoise"
      texte: "Firmin ouvre la boîte à cigares sous la caisse et compte sans parler. « L'argent de l'ardoise. Tu le rendras à l'ardoise, pas à moi. »"
      effets: {var: {ville_francs: "+300"}}
      dette: true

  - id: pujade_fils
    name: "Jo Pujade"
    label: "LE PATRON DE LA BUVETTE"
    genre: m
    portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: court, cheveux: brun, pilosite: barbe, lunettes: aucune, tenue: chemise, couleur: anthracite, accessoire: echarpe, couleur_accessoire: bordeaux}
    on_relation: {3: vi.pujade_fils.faveur}
    lieu: buvette
    tranches: [midi, aprem, soir]
    annees: [2014, 2050]
    roles: [president, ds, selectionneur]
    reseau: argent
    trace: "Jo a noté ta tournée au dos d'un sous-bock, sans le prix. Chez lui, c'est une dette d'amitié."
    paliers: ["te tend la tasse avant que tu demandes", "te garde le tabouret du bout", "fermerait la buvette pour toi"]
    froid: ["te sert après tout le monde", "ne te garde plus de tabouret", "te sert dans un gobelet en plastique"]
    climat:
      bas:
        - {si: "role == president", texte: "La moitié du conseil paie ses consommations à crédit, depuis l'automne. Le club aussi : trois mois de fûts sur l'ardoise de mon père, que j'ai gardée exprès."}
        - {si: "role == selectionneur", texte: "La Fédération ne commande plus de plateaux pour ses journalistes. Ils viennent boire ici à leurs frais, et ils se plaignent des frais."}
        - "Tes joueurs paient avec leur téléphone, et le téléphone dit non une fois sur trois. Ils rient, ils repaient avec une autre carte. La troisième, c'est celle de leur mère."
      moyen:
        - {si: "role == president", texte: "Le club a réglé les fûts de l'hiver, en retard d'un mois, sans discuter. Ni dette ni avance : on est quittes, et personne ne trinque."}
        - {si: "role == selectionneur", texte: "La Fédération a payé la salle du fond pour le point presse, sans pourboire. Pas de pourboire, pas de dette. On est quittes."}
        - "Les primes tombent avec une semaine de retard. Le lundi d'après, les joueurs viennent solder leurs ardoises d'un coup, sans regarder le total."
      haut:
        - {si: "role == president", texte: "Le club a payé d'avance l'écran de la salle pour toute la saison. Les anciens trouvent ça suspect. Ici, l'argent d'avance a toujours eu une odeur."}
        - {si: "role == selectionneur", texte: "La Fédération a réservé la buvette entière pour le tirage au sort, champagne compris. Le champagne, ici, on ne le sert qu'aux mariages et aux erreurs."}
        - "Tes joueurs laissent des pourboires que mon père aurait refusés. La prime est tombée avant le match, et ça se voit dans la soucoupe."
    repliques:
      - {lien: 0, texte: "La boîte à cigares est toujours sous la caisse. Mon père y mettait l'argent de l'ardoise ; moi, les cartes de membre qu'on oublie au comptoir. On en oublie beaucoup."}
      - {lien: 0, si: "annee >= 2034", texte: "Les socios votent ici, à main levée, sous les écharpes. Je ferme le robinet pendant le vote. Personne ne vote bien avec un verre plein."}
      - {lien: 1, si: "tranche == soir", texte: "Mon père servait la Nord ; je sers les enfants de la Nord. Ils boivent moins et ils filment plus. Je ne sais pas ce qui est pire."}
      - {lien: 2, texte: "J'ai grandi sous ce zinc. Je connais chaque tache du plafond. Celle en forme de botte, c'est la mousse du derby de quatre-vingt-quatorze."}
      - {lien: 3, texte: "Si un jour tu dois parler à quelqu'un sans que la ville le sache, la salle du fond a une porte sur la cour. Elle ferme de l'intérieur."}
      - {lien: -1, texte: "Je te sers, je ne parle pas. La conversation, ici, c'est pour ceux qui reviennent le lendemain d'une défaite."}
      - {lien: -2, texte: "On m'a demandé si tu buvais ici. J'ai dit oui. On m'a demandé avec qui. J'ai dit : avec personne. On a noté."}
    tuyaux:
      - id: pujade_fils_credit
        si: "flag(histoire_h10) && !flag(h10_clapet_nino)"
        texte: "Nino paie ses demis chez moi rubis sur l'ongle. C'est au Terminus qu'on lui fait crédit. Ceux qui font crédit à un capo veulent toujours autre chose qu'une bière."
      - id: pujade_fils_banderoles
        si: "flag(histoire_h9) && !flag(h9_depart)"
        texte: "Un homme du ministère est venu demander qui imprime les banderoles de la Nord. J'ai dit que je ne savais pas. Il a laissé sa carte sous la soucoupe, pour le jour où je saurai."
    service:
      lien: 3
      label: "La salle du fond"
      texte: "Jo te prête la salle du fond, porte sur la cour, rideau tiré. Tu y reçois qui tu veux, et la ville n'en saura rien avant L'Écho du dimanche."
      effets: {jauges: {direction: 2, tribunes: 1}}

  - id: gege
    lieu: buvette
    tranches: [midi, soir]
    annees: [1990, 2040]
    reseau: tribunes
    trace: "Gégé a choqué son verre contre le tien sans le boire. À la Nord, c'est une date qu'on retient."
    paliers: ["te garde une place sous la bâche", "te dit « nous » en parlant du virage", "lèverait la Nord pour toi"]
    froid: ["regarde ailleurs quand tu entres", "a rangé ton nom avec les promesses", "a peint une bâche sans te la montrer"]
    activites: [verre_kop, buvette_president]
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Au comptoir, on a éteint la télé pendant ton point presse. Pas par colère : par fatigue. Le pays fait pareil. Ici, on le fait en premier."}
        - {si: "annee >= 2020", texte: "Le petit compte les cartes qui ne reviennent pas ; moi, les sièges vides de la Nord. On tombe sur le même chiffre, et ça ne nous rassure ni l'un ni l'autre."}
        - "Samedi, au local, on a plié les drapeaux avant la fin du match. Personne ne l'a décidé. Quand ça se plie tout seul, c'est que la Nord a fini de croire."
      moyen:
        - {si: "role == selectionneur", texte: "Les gars regardent tes matchs ici, la bière posée, sans chanter. Le pays attend de voir. Nous aussi, mais nous, on attend debout."}
        - "La Nord chante à la vingtième, comme toujours, et s'assoit à la mi-temps, comme pas toujours. Elle te donne le temps d'un match. Pas d'une saison."
      haut:
        - {si: "role == selectionneur", texte: "On a ressorti du placard la bâche des Cobalts, celle d'avant le fiasco. Si le pays ressemble au comptoir, tu as de l'avance. Ne la gaspille pas."}
        - "Au local, on a commandé de la toile pour une bâche à ton nom. Personne n'a demandé combien. Quand on ne demande pas, c'est qu'on t'aime."
    repliques:
      - {lien: 0, texte: "Mon tabouret, au bout du zinc, je l'ai depuis soixante et onze, l'année de la bâche. Celui d'à côté, on le prête. Pas à tout le monde."}
      - {lien: 0, si: "jour == ven && tranche == soir", texte: "Le vendredi, on prépare samedi : les tambours, les drapeaux, les mots. Les mots, c'est le plus long. Un mot de travers, et la ville le chante dix ans."}
      - {lien: 1, si: "serie_v >= 1", texte: "La Nord commence à se lever avant le coup d'envoi. Quand elle se lève trop tôt, elle se rassoit trop vite. Je les retiens par la manche."}
      - {lien: 1, si: "annee >= 2020", texte: "Le petit a pris le mégaphone en vingt. Il le tient bien. Il parle plus que moi, et il compte mieux. Je ne sais pas si c'est un progrès."}
      - {lien: 2, texte: "Tu veux savoir ce que pense la Nord ? Regarde les mains, pas les bouches. Les mains dans les poches, c'est qu'on garde quelque chose pour plus tard."}
      - {lien: 2, si: "annee >= 2028", texte: "Le docteur m'a interdit le tambour. Je le tiens quand même, sans taper, pour que les petits voient où est la mesure. Ils regardent mes mains, pas le docteur."}
      - {lien: 3, texte: "Si un samedi ça tourne mal, lève la main gauche à hauteur d'épaule, comme ça. Je saurai. Et la Nord saura que je sais."}
      - {lien: -1, texte: "Tu passes devant le local sans t'arrêter. Tu as le droit. Nous aussi, on a un droit : celui de remarquer."}
      - {lien: -2, texte: "Au local, on a sorti ta photo de L'Écho du classeur des amis. Elle est dans l'autre, maintenant. Il est plus mince, mais on le relit plus souvent."}
      - {lien: -3, texte: "Ne viens plus à la buvette les soirs de match. Ce n'est pas une menace. C'est un conseil d'ami qu'on n'est plus."}
    tuyaux:
      - id: gege_plaques
        si: "flag(histoire_h1) && flag(h1_masques_tifo)"
        texte: "Les Cartonnages de la Rive ont gardé les plaques des masques. Avec les plaques, on en refait trois mille en une nuit. Si tu veux que ça s'arrête un jour, ce sont les plaques qu'il faut."
      - id: gege_piquets
        si: "flag(histoire_h5) && flag(h5_cle_laissee)"
        texte: "Les piquets que j'ai arrachés dans les cendres de l'Est, un géomètre les avait plantés à l'aube, au cordeau. Sa voiture était garée à la résidence. J'ai noté la plaque sur un sous-bock."
      - id: gege_veste
        si: "flag(histoire_h10) && saison >= 2 && !flag(h10_clapet_nino)"
        texte: "Le petit ne quitte plus sa veste de cuir, même près du poêle. Une poche plus lourde que l'autre. J'ai porté des drapeaux toute ma vie : je sais ce que pèse un secret."
    service:
      lien: 3
      si: "!flag(dette_gege)"
      label: "Calmer la Nord"
      texte: "Gégé monte sur la marche du local, lève une main et attend. Les sifflets s'arrêtent un par un. « On te donne un samedi. Après, tu te débrouilles avec ton score. »"
      effets: {jauges: {tribunes: 4}}
      dette: true

  - id: nino
    lieu: buvette
    tranches: [aprem, soir]
    annees: [2020, 2050]
    roles: [ds, selectionneur, president]
    reseau: tribunes
    trace: "Nino a enregistré ton numéro sans te demander comment l'écrire. Il l'avait déjà."
    paliers: ["te fait signe depuis le fond", "te passe le mégaphone éteint", "ferait taire les tambours pour toi"]
    froid: ["ne te voit plus entrer", "fait chanter ton nom à l'envers", "a sorti ta photo du local"]
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Le virage regardera le match sur la place, dos à l'écran, exprès. Dans le pays, ils ne savent pas encore tourner le dos ensemble. Nous, on répète."}
        - {si: "annee >= 2034", texte: "Trois cents cartes de socio pas renouvelées depuis janvier. Je les ai comptées deux fois. La deuxième fois, il en manquait une de plus."}
        - "Les abonnements de la Nord ont fondu d'un tiers depuis l'été. Je l'ai dit à mon oncle. Il a répondu qu'en 1977 c'était pire. En 1977, il était jeune."
      moyen:
        - {si: "role == selectionneur", texte: "Le virage regardera, mais sans écharpe. Le pays fait pareil, je crois : on regarde, on ne s'habille pas."}
        - {si: "annee >= 2034", texte: "Les socios renouvellent à moitié, en traînant. Ils viennent voter, ils ne viennent pas chanter. Je fais avec ceux qui chantent."}
        - "La Nord est pleine aux deux tiers. Les tambours tiennent, les voix fatiguent à l'heure de jeu. Un public qui attend le but pour savoir quoi penser."
      haut:
        - {si: "role == selectionneur", texte: "Le virage a commandé des drapeaux des Cobalts, en vrai tissu. On n'avait pas fait ça depuis avant ma naissance. Le pays suit, paraît-il. Nous, on précède."}
        - {si: "annee >= 2034", texte: "Trois mille quatre cents cartes de socio, un record. Ils veulent tous voter, chanter et avoir raison. Le samedi, ça fait un bruit qu'on entend du pont."}
        - "La Nord est pleine une heure avant. On a dû refuser des gamins à la grille ; ils ont chanté sur le parking, et on les entendait mieux que nous."
    repliques:
      - {lien: 0, texte: "À six ans, je revendais des masques au square. Mon oncle m'a giflé, puis il a rangé l'argent dans la boîte des drapeaux. J'ai appris le métier ce jour-là."}
      - {lien: 0, si: "annee < 2034", texte: "Le fonds a mis des caméras à l'entrée de la Nord. On a mis des capuches. Ils ont mis des caméras qui voient sous les capuches. On cherche encore."}
      - {lien: 1, si: "annee < 2040", texte: "Mon oncle passe au local tous les soirs à sept heures, même quand il n'y a personne. Il vérifie que les drapeaux sont roulés dans le bon sens. Ils le sont toujours."}
      - {lien: 2, si: "annee >= 2024 && annee <= 2027", texte: "Mon fils dort avec ses crampons au pied du lit, lacés. Je ne veux pas qu'il finisse capo. Je ne veux pas non plus qu'il finisse vendu."}
      - {lien: 2, si: "annee >= 2028", texte: "Un capo, c'est un carnet d'adresses, un mégaphone et des dettes. Le mégaphone est le seul des trois qu'on entend."}
      - {lien: 3, si: "flag(histoire_h10)", texte: "Mon oncle dit que je mens mal. Il a raison. C'est pour ça que je parle fort et beaucoup : dans le bruit, personne n'entend les mensonges."}
      - {lien: -1, texte: "Je te salue parce que mon oncle te salue. Le jour où il ne le fera plus, ce sera plus simple pour tout le monde."}
      - {lien: -2, texte: "On a fait une chanson sur toi. Elle n'est pas méchante. Elle est juste assez longue pour durer tout un match."}
    tuyaux:
      - id: nino_sonnerie
        si: "flag(histoire_h10) && saison >= 2 && !flag(h10_clapet_nino)"
        texte: "La voix du clapet n'appelle pas que toi. Je ne dis pas qui d'autre. Je dis qu'une sonnerie de 1995, dans une buvette pleine, tout le monde la reconnaît, sauf celui qui la porte."
      - id: nino_cagnotte
        si: "flag(histoire_h8)"
        texte: "Les gamins de la Nord ont une cagnotte pour les déplacements, sur mon compte. Le fonds a proposé de la remplir, contre la liste des noms. J'ai dit non. Quelqu'un dira oui."
    service:
      lien: 3
      si: "!flag(dette_nino)"
      label: "Faire taire les tambours"
      texte: "Nino fait passer la consigne : ni sifflets ni banderole contre toi samedi. La Nord chante pour l'équipe et tourne le dos à ta loge, sans un mot."
      effets: {jauges: {tribunes: 3}}
      dette: true

  # ═════════════════════════════════════════════════════════════════ LE MATÉRIEL
  # Le local sous la tribune : les filets, les chasubles, la tondeuse, le cadenas
  # 1-9-7-4. L'intendant compte tout, et ce qu'il compte dit l'humeur du vestiaire.
  - id: plassard
    name: "Hector Plassard"
    label: "L'INTENDANT DU CLUB"
    genre: m
    portrait: {teint: clair, corpulence: fin, age: age, coiffure: degarni, cheveux: blanc, pilosite: moustache, lunettes: carrees, tenue: blouse, couleur: gris, couleur2: bordeaux, accessoire: carnet}
    on_relation: {3: vi.plassard.faveur}
    lieu: materiel
    tranches: [matin, aprem, soir]
    annees: [1990, 2008]
    roles: [entraineur, joueur, president, ds]
    reseau: vestiaire
    trace: "Hector a écrit ton nom au crayon sur l'étiquette d'un filet. Il ne prête un filet qu'à ceux qu'il reverra."
    paliers: ["te laisse entrer sans frapper", "te confie la boîte à sucre", "sortirait du matériel du registre pour toi"]
    froid: ["te fait signer le registre deux fois", "a changé le code du cadenas", "te recompte les ballons sous le nez"]
    activites: [materiel_chasubles]
    climat:
      bas:
        - {si: "role == president", texte: "Les employés ne rendent plus leurs clés le soir. Ils les gardent, au cas où on les mettrait dehors. J'ai fait refaire trois doubles cette semaine ; personne ne me les a demandés."}
        - {si: "role == ds", texte: "Le staff garde les chronomètres dans ses poches depuis lundi, comme des pièces à conviction. Ils notent tout, et ils ne me disent pas pour qui."}
        - "Les gars rendent leurs chasubles en boule, mouillées, à l'envers. Une chasuble en boule, c'est un vestiaire qui ne se parle plus. Je les déplie une par une."
      moyen:
        - {si: "role == president", texte: "Les employés rendent leurs clés à six heures, pas avant, pas après. Ils ne demandent rien. Ils attendent de voir si la paie tombe le 5."}
        - {si: "role == ds", texte: "Le staff rend le matériel à l'heure, compté, sans un ballon de plus. Il fait son travail. Il ne fait pas encore celui des autres."}
        - "Les chasubles reviennent pliées, pas toutes. Les jaunes, oui. Les rouges, jamais : c'est l'équipe B, elle boude un peu, comme chaque automne."
      haut:
        - {si: "role == president", texte: "Les employés ont repeint la loge du gardien un dimanche, sans être payés, et ils ont signé le registre pour que ça se sache. Ça se sait."}
        - {si: "role == ds", texte: "Le staff reste après la séance pour ranger avec moi. Un staff qui range les plots, c'est un staff qui compte être encore là pour les sortir."}
        - "Les gars ont recousu eux-mêmes le filet de la cage d'entraînement, à six, en riant. Des nœuds de marin, faux du premier au dernier. J'ai laissé les nœuds."
    repliques:
      - {lien: 0, texte: "Lulu compte les ballons à la sortie, moi à l'entrée. Quand on ne tombe pas sur le même chiffre, c'est qu'un gamin du square a gagné un ballon."}
      - {lien: 0, si: "jour == lun", texte: "Le lundi, je compte : les plots, les chasubles, les sifflets. Il manque un sifflet chaque lundi depuis 1971. Je n'ai jamais su où vont les sifflets."}
      - {lien: 1, si: "serie_d >= 1", texte: "Après une défaite, les crampons reviennent pleins de boue sèche. Après une victoire aussi. Mais après une défaite, personne ne les cogne contre le mur avant d'entrer."}
      - {lien: 1, texte: "La boîte à sucre, sur l'étagère, c'est la paie des gamins qui m'aident. Personne n'y touche. Même les dirigeants, quand ils passent, regardent ailleurs."}
      - {lien: 2, si: "annee >= 2003 && annee <= 2005", texte: "Le club a vendu le car. J'ai gardé les housses des sièges, les quarante-quatre, pliées au fond. On revend toujours un car ; on finit toujours par en racheter un."}
      - {lien: 2, texte: "Le capitaine vient chercher les brassards lui-même. Les autres envoyaient un gamin. Celui-là, je lui donne le meilleur, et je ne le lui dis pas."}
      - {lien: 3, texte: "J'ai la clé de toutes les portes du sous-sol, même de celles qu'on a murées. Une porte murée garde sa serrure ; c'est le mur qui ne sert à rien."}
      - {lien: -1, texte: "Signe là, et là, avec la date. Depuis l'autre jour, je fais signer tout le monde, même les amis. Surtout les amis."}
      - {lien: -2, texte: "On m'a demandé ce que tu sortais du local. Je lui ai montré le registre. Tout y était, ligne par ligne. Je n'ai rien à cacher pour toi."}
      - {lien: -3, texte: "Le code du cadenas a changé. Le nouveau est au secrétariat, contre signature. Tu sais où est le secrétariat."}
    tuyaux:
      - id: plassard_disjoncteur
        si: "flag(histoire_h2) && flag(h2_place_vide)"
        texte: "Le réverbère du parking se coupe au disjoncteur, dans mon local, derrière les filets. Il y a trois clés : la mienne, celle de Lulu, et celle qu'on a donnée au chauffeur du car en 1986."
      - id: plassard_momo
        si: "flag(histoire_h3) && flag(h3_momo_steph) && !flag(h3_douche)"
        texte: "Le petit Momo a oublié son sac au local, ouvert. Dedans, une boîte sans étiquette, la même que celles de la salle de Steph. J'ai refermé le sac. Je n'ai rien vu."
      - id: plassard_buanderie
        si: "flag(histoire_h6) && saison >= 2"
        texte: "La buanderie du sous-sol avait sa ligne de téléphone, pour commander le linge. On l'a oubliée en 1987, pas coupée. Je paie encore l'abonnement sur le budget du matériel."
        effets: {var: {h6_indices: "+1"}}
      - id: plassard_casiers
        si: "role != selectionneur"
        texte: "Ceux qui vont partir vident leur casier un objet par jour, pour qu'on ne voie rien. Regarde les casiers le vendredi : ceux qui sont trop bien rangés."
    service:
      lien: 3
      label: "Des ballons neufs, en douce"
      texte: "Hector sort du fond du local un carton de ballons neufs que le registre ne connaît pas. « La colonne divers. Ils les sentiront avant de les toucher, tu verras. »"
      effets: {jauges: {vestiaire: 3}}

  - id: rouquette
    name: "Gaëtan Rouquette"
    label: "L'INTENDANT DU CLUB"
    genre: m
    portrait: {teint: olive, corpulence: moyen, age: mur, coiffure: brosse, cheveux: brun, pilosite: bouc, lunettes: aucune, tenue: survetement, couleur: anthracite, couleur2: bordeaux, accessoire: badge}
    on_relation: {3: vi.rouquette.faveur}
    lieu: materiel
    tranches: [matin, aprem, soir]
    annees: [2009, 2050]
    roles: [ds, president, selectionneur]
    reseau: vestiaire
    trace: "Gaëtan a scotché ton prénom sur une étagère vide du local. Chez lui, une étagère, c'est une promesse."
    paliers: ["te tend le café de son thermos", "te montre l'étagère du fond", "cacherait un sac pour toi"]
    froid: ["te fait attendre derrière le comptoir", "ne te prête plus rien sans badge", "a mis ton nom au registre des retards"]
    climat:
      bas:
        - {si: "role == president", texte: "Les employés emportent leurs affaires personnelles le vendredi et les rapportent le lundi. Ils ne savent pas s'ils reviendront ; ils préfèrent ne rien laisser."}
        - {si: "role == selectionneur", texte: "Le groupe a rendu les survêtements de la sélection fourrés dans le sac, avec les chaussettes. Ça ne s'était jamais vu ici, même avec les pires listes."}
        - "Le staff a sorti de ses casiers ce qui compte : les photos, les clés de voiture. Il reste le matériel du club. Un staff qui s'en va commence par là."
      moyen:
        - {si: "role == president", texte: "Les employés badgent à l'arrivée et au départ, à la même minute chaque jour. Ils font leurs heures, pas une de plus. On dirait des horloges."}
        - {si: "role == selectionneur", texte: "Le groupe rend ses affaires propres, chacun les siennes. Personne ne ramasse celles du voisin. Ça viendra, ou pas."}
        - "Le staff rend le matériel compté, à l'heure, sans un mot sur la séance. Il fait son travail. On verra le reste en mars."
      haut:
        - {si: "role == president", texte: "Les employés ont fait un barbecue sur le parking, le dernier vendredi, sans demander. Ils ont invité les jardiniers. Quand on invite les jardiniers, c'est qu'on est bien."}
        - {si: "role == selectionneur", texte: "Le groupe a réclamé les vieux survêtements pour l'entraînement, ceux d'avant. Ils disent qu'ils portent chance. Ils portent surtout le même mot dans le dos."}
        - "Le staff reste après les séances et range avec moi en parlant des gamins. Quand le staff parle des gamins, c'est qu'il a fini de parler de lui."
    repliques:
      - {lien: 0, si: "annee < 2020", texte: "Hector m'a appris à numéroter les ballons au feutre. Je numérote encore. Le club voudrait des codes-barres ; un code-barres, ça ne se lit pas à la main, dans le noir."}
      - {lien: 0, si: "annee >= 2020", texte: "Le fonds a fait coudre des puces dans les ballons. Je les numérote quand même au feutre, comme Hector. Les puces ne savent pas qui a perdu le 31."}
      - {lien: 1, texte: "Le meilleur moment, c'est le lundi à sept heures. Les maillots sèchent, tout sent la lessive, et personne ne parle encore du samedi."}
      - {lien: 2, si: "annee >= 2024 && annee <= 2027", texte: "Certains joueurs me confient leur bracelet le soir, pour dormir sans. Je le remets en charge à six heures, au poignet d'un mannequin, pour que la courbe ne voie rien."}
      - {lien: 2, texte: "Je garde dans un carton les crampons de ceux qui sont partis. Pas pour les rendre : pour savoir combien de pointures ont tenu sur ce terrain."}
      - {lien: 3, texte: "La porte du fond du local donne sur le tunnel des vestiaires. Elle n'a pas de poignée de ce côté-ci. J'en garde une dans ma poche."}
      - {lien: -1, texte: "Votre badge ne passe plus au local. Ce n'est pas moi, c'est le système. Le système, c'est moi qui le remplis."}
      - {lien: -2, texte: "On m'a demandé l'inventaire de ce que vous avez emprunté depuis votre arrivée. Il tient sur une page. Ils l'ont trouvé trop court."}
    tuyaux:
      - id: rouquette_kerdal
        si: "flag(histoire_h8) && !flag(h8_kerdal_vit) && !flag(h8_kerdal_mort)"
        texte: "Kerdal m'a demandé un second casier, au fond, sans nom dessus. Je lui ai donné la clé, je ne l'ouvre pas. Quand il le referme, ça tinte comme une pharmacie."
      - id: rouquette_crampons
        si: "flag(histoire_h10) && !flag(h10_brac_garde) && !flag(h10_brac_vendu)"
        texte: "Le petit Brac a reçu des crampons sur mesure, livrés ici à son nom. Pas par notre équipementier. Le bon de livraison vient d'une société de la capitale que je ne connais pas."
    service:
      lien: 3
      label: "Cacher un joueur"
      texte: "Gaëtan fait passer ton joueur par la porte du fond et le tunnel, capuche baissée, jusqu'à une voiture. La presse attendait à la grande porte. Personne ne l'a vu sortir."
      effets: {jauges: {vestiaire: 3}}

  # ═══════════════════════════════════════════════════════════════════ LE STADE
  # La Rive : la loge du gardien, le registre des clés, les rondes. Lulu ne dort
  # jamais (livre 2) ; son fils Rémi a gardé sa radio, et sa femme ne sort plus la
  # nuit côté stade (livre 8).
  - id: lulu_gardien
    name: "Lulu Gendreau"
    label: "LE GARDIEN DU STADE"
    genre: m
    portrait: {teint: clair, corpulence: moyen, age: age, coiffure: casquette, coiffe: marine, cheveux: gris, pilosite: barbe, lunettes: aucune, tenue: veste, couleur: bleu, accessoire: carnet}
    on_relation: {3: vi.lulu_gardien.faveur, -3: vi.lulu_gardien.registre}
    lieu: stade
    tranches: [matin, soir, nuit]
    annees: [1990, 2006]
    roles: [entraineur, joueur, president, ds]
    reseau: tribunes
    trace: "Lulu a écrit ton passage au registre de la loge, avec l'heure, et un petit trait dessous : les amis."
    paliers: ["te laisse la grille entrouverte", "te prête la lampe de la loge", "te cacherait une nuit dans le stade"]
    froid: ["te fait signer le registre à la grille", "rappelle son chien quand tu passes", "a donné tes heures à qui les voulait"]
    climat:
      bas:
        - "Les abonnés ne me disent plus bonjour à la grille. Ils montrent leur carte sans lever la tête. Samedi, j'ai ramassé six cartes déchirées devant la Nord."
      moyen:
        - "Les abonnés me demandent le score du match d'avant en passant la grille, pour savoir s'ils ont bien fait de venir. Ils viennent. Mais ils se le demandent."
      haut:
        - "Samedi, il y avait du monde à la grille deux heures avant. J'ai ouvert plus tôt sans demander à personne. Personne ne m'a rien reproché : tout le monde était dans la file."
    repliques:
      - {lien: 0, texte: "La loge est ouverte quand la lampe est allumée. Quand elle est éteinte, je suis là quand même, mais je ne veux voir personne."}
      - {lien: 0, si: "tranche == nuit", texte: "Trois rondes : onze heures, deux heures, cinq heures. Entre les rondes, j'écoute. Un stade vide, ça craque comme un bateau à quai."}
      - {lien: 0, si: "tranche == matin", texte: "Le matin, je passe le jet sur les marches de la Nord. On trouve de tout : des clés, un dentier, une fois une alliance. L'alliance, personne ne l'a réclamée."}
      - {lien: 1, texte: "Mon chien reconnaît les gens à la démarche. Toi, il te laisse passer sans lever la tête. Ne le prends pas mal : chez lui, c'est un compliment."}
      - {lien: 1, si: "jour == sam", texte: "Le samedi, je compte les entrées au cliquet, une par une, et je donne mon chiffre au trésorier. Le sien est toujours plus petit. Je n'ai jamais su où passait la différence."}
      - {lien: 2, texte: "Le thermos, c'est du café. Le soir, c'est autre chose, et ce n'est pas tes affaires. Mais si tu as froid à la ronde de deux heures, je partage."}
      - {lien: 2, si: "annee >= 2000", texte: "Mon fils fera ce métier après moi, il le dit. Je lui ai appris les rondes, pas le thermos. Il a déjà la radio, il la tient comme un enfant."}
      - {lien: 3, texte: "La grille du fond, côté friche, n'a jamais eu de cadenas qui ferme. Le club le sait, il ne l'a jamais fait changer. Si un soir tu dois entrer sans qu'on te voie, c'est celle-là."}
      - {lien: -1, texte: "Signe le registre, comme tout le monde. Nom, heure, motif. Le motif, tu peux mettre ce que tu veux ; moi, je lis entre les lignes."}
      - {lien: -2, texte: "On m'a demandé à quelle heure tu partais le soir. Je lui ai donné l'heure du registre. Il ne m'a pas demandé si c'était la vraie."}
      - {lien: -3, texte: "Ton nom est au registre comme les autres, ni plus ni moins. La grille ferme à vingt-deux heures pour toi aussi, maintenant."}
    tuyaux:
      - id: lulu_local
        si: "flag(histoire_h1) && flag(h1_incendie)"
        texte: "La nuit du feu au local, j'avais fermé la grille de la Nord à onze heures. À ma ronde de deux heures, le cadenas était ouvert. Pas cassé : ouvert, avec la clé."
      - id: lulu_car
        si: "flag(histoire_h2) && flag(h2_trois_metres) && !flag(h2_place_vide)"
        texte: "La nuit des trois mètres, le car du club dormait au fond du parking, tous rideaux tirés. Norbert y dort les soirs de match. Ce n'était pas un soir de match."
      - id: lulu_vallin
        si: "flag(histoire_h3) && flag(h3_sirene_nuit) && !flag(h3_halle_vue)"
        texte: "Le petit Vallin dormait dans ma loge, en 1989, quand il ratait le dernier car. Il a gardé la clé de la grille sud. Je ne l'ai jamais fait changer. Elle a servi, l'hiver dernier."
      - id: lulu_est
        si: "flag(histoire_h5) && flag(h5_tribune_est_brulee) && !flag(h5_temoin) && !mission(h5_temoin_feu)"
        texte: "La nuit de l'Est, avant les pompiers, quelqu'un regardait le feu depuis les gravats de la friche. Il ne s'est pas sauvé. Il regardait comme on retient. Le petit Vallin, je crois."
      - id: lulu_cle
        si: "flag(histoire_h6) && saison >= 2"
        texte: "En septembre, quelqu'un du club m'a emprunté la clé de la buanderie « pour le séchoir ». Il l'a rendue le lendemain, polie, essuyée. Une clé qu'on essuie, on l'a fait copier."
        effets: {var: {h6_indices: "+1"}}
    service:
      lien: 3
      label: "Le stade, une nuit"
      texte: "Lulu t'ouvre la grille du fond et allume deux projecteurs sur quatre. « Jusqu'à cinq heures. Après, la ronde. » Une séance sur la Rive, de nuit, sans témoin ni journal."
      effets: {jauges: {vestiaire: 3}}

  - id: remi_gendreau
    name: "Rémi Gendreau"
    label: "LE GARDIEN DU STADE"
    genre: m
    portrait: {teint: clair, corpulence: large, age: mur, coiffure: court, cheveux: chatain, pilosite: rase, lunettes: aucune, tenue: veste, couleur: marine, accessoire: badge}
    on_relation: {3: vi.remi_gendreau.faveur}
    lieu: stade
    tranches: [matin, soir, nuit]
    annees: [2007, 2050]
    roles: [ds, president, selectionneur]
    reseau: tribunes
    trace: "Rémi a posé la radio de son père entre vous deux sur le muret, le son coupé. Chez les Gendreau, c'est une invitation."
    paliers: ["te laisse passer sans badge", "te prête la radio des rondes", "éteindrait une caméra pour toi"]
    froid: ["te demande ton badge", "ne te dit plus bonsoir à la ronde", "a donné tes heures à la sécurité"]
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Les gens du pays qui viennent voir la sélection ici tournent autour du stade sans entrer. Ils regardent les affiches. Ils ne prennent pas de billet."}
        - {si: "role == president && annee >= 2034", texte: "Les socios ont rendu leurs badges d'entrée à la loge, trois cents d'un coup, dans un carton. Ils ne les ont pas jetés. Ils voulaient que quelqu'un les compte."}
        - "Les abonnés passent les tourniquets sans un mot, la carte tendue, les yeux ailleurs. Samedi, une main a tagué « ASSEZ » sur la vitre de la loge. Je n'ai pas effacé."
      moyen:
        - {si: "role == selectionneur", texte: "Les gens du pays viennent, ils paient, ils s'assoient. Ils applaudissent les noms qu'ils connaissent. Les autres, ils attendent de voir."}
        - {si: "role == president && annee >= 2034", texte: "Les socios passent à la loge pour se plaindre du parking, pas de vous. Tant qu'on se plaint du parking, le reste tient."}
        - "Les abonnés passent les tourniquets à l'heure, sans traîner, sans s'attarder après. Ils viennent pour le match, et c'est tout ce qu'ils promettent."
      haut:
        - {si: "role == selectionneur", texte: "On fait la queue au guichet depuis six heures, pour un match amical. Des gens qui n'étaient pas venus ici depuis vingt ans. Ils demandent où est la buvette."}
        - {si: "role == president && annee >= 2034", texte: "Les socios m'ont demandé de laisser la loge ouverte après le match, pour voir les tribunes vides encore un peu. Ils restent assis, ils parlent de vous."}
        - "Samedi, les tourniquets ont bloqué tant ils tournaient. J'ai ouvert les grilles à la main, comme mon père. Personne ne s'est plaint du retard."
    repliques:
      - {lien: 0, texte: "La radio était à mon père. Elle ne capte plus que la fréquence des stadiers et une station de variété. Je laisse la variété la nuit, pour les chats."}
      - {lien: 0, si: "tranche == nuit", texte: "Les caméras voient tout le stade, sauf le coin entre la buvette et la grille du fond. Mon père l'appelait l'angle mort. Moi aussi, maintenant."}
      - {lien: 1, texte: "Ma femme m'attend avec la lampe du palier allumée. Tant que la lampe est allumée, elle ne dort pas. Je rentre à six heures ; elle s'endort à six heures cinq."}
      - {lien: 2, texte: "Mon père écrivait les heures au registre, à la main. Moi, je les tape. Mais je garde son registre à la loge, ouvert à la dernière page qu'il a remplie."}
      - {lien: 3, texte: "Si un soir il vous faut sortir du stade sans passer devant les caméras, prenez le tunnel jusqu'au local du matériel, et ensuite l'angle mort. J'aurai la radio coupée."}
      - {lien: -1, texte: "Votre badge, s'il vous plaît. Je le demande à tout le monde, même à ceux qui ont payé les tourniquets."}
      - {lien: -2, texte: "La sécurité du club m'a demandé les heures où vous passez la grille, le soir. Je les ai données. Elles étaient justes, c'est tout ce que je peux dire."}
    tuyaux:
      - id: remi_cycle
        si: "flag(histoire_h8) && flag(h8_projecteurs) && !flag(h8_cycle_trois_heures)"
        texte: "Les projecteurs de trois heures, c'est le cycle d'entretien du fonds : une heure pile, toutes les nuits. Ce que le fonds n'a pas programmé, c'est le garçon qui attend l'allumage au poteau de corner."
        effets: {set: [h8_cycle_trois_heures]}
      - id: remi_marche
        si: "flag(histoire_h10) && flag(h10_escalier)"
        texte: "Le maçon de l'escalier nord revient le soir, après sa journée, compter ses marches. Il s'assoit dans l'angle mort, sous la caméra. Pour lui parler sans témoin, c'est là."
    service:
      lien: 3
      label: "Couper les caméras"
      texte: "Rémi coupe les caméras du parking pour une heure, « une panne de la nuit ». Ta voiture entre, ton rendez-vous aussi. Le registre de la loge dit qu'il pleuvait."
      effets: {jauges: {direction: 2, vestiaire: 1}}

  # ══════════════════════════════════════════════════════════════════ LE CENTRE
  # Le centre de formation : les lits, le tableau des résultats, la cassette, les
  # devoirs. Maurice Thévenot a élevé deux générations de gamins, dont le petit
  # Rancé (livres 6 et 7) ; Nadège Fournel dirige le centre après lui.
  - id: thevenot
    name: "Maurice Thévenot"
    label: "L'ÉDUCATEUR DU CENTRE"
    genre: m
    portrait: {teint: brun, corpulence: moyen, age: age, coiffure: court, cheveux: gris, pilosite: moustache, lunettes: rondes, tenue: survetement, couleur: bordeaux, couleur2: gris, accessoire: sifflet}
    on_relation: {3: vi.thevenot.faveur, -3: vi.thevenot.porte}
    lieu: centre
    tranches: [aprem]
    annees: [1990, 2012]
    reseau: vestiaire
    trace: "Maurice a ajouté ton prénom au feutre vert sur la liste des parrains, une liste de 1977 qui n'a plus de place."
    paliers: ["te garde une chaise au bord du terrain", "te laisse lire les bulletins", "t'ouvrirait le centre la nuit"]
    froid: ["te fait attendre à l'accueil", "ne t'invite plus aux matchs des petits", "a dit aux gamins de se méfier de toi"]
    activites: [jeunes, gamins]
    climat:
      bas:
        - {si: "role == president", texte: "Les éducateurs ont demandé leurs certificats de travail, pour leur dossier. Personne ne part. Tout le monde se prépare à partir. Au centre, ça s'entend dans les sifflets."}
        - {si: "role == selectionneur", texte: "Mes anciens gamins de ta liste m'appellent le dimanche, et ils ne parlent pas du groupe. Quand ils ne parlent pas du groupe, c'est que le groupe ne leur parle plus."}
        - {si: "role == ds", texte: "Le staff de l'équipe première ne descend plus voir les gamins. Il a ses soucis. Les gamins le voient, et ils comprennent avant moi ce qui se passe en haut."}
        - "Les grands de l'équipe première ne passent plus voir les petits. Ils passaient le jeudi, avec des crampons usés à donner. Les crampons restent en haut."
      moyen:
        - {si: "role == president", texte: "Les éducateurs font leurs séances, ils remplissent leurs fiches. Ils ne se plaignent pas de leurs salaires, ce mois-ci. C'est déjà une saison."}
        - {si: "role == selectionneur", texte: "Mes anciens gamins de ta liste disent que ça se passe. Pas bien, pas mal : ça se passe. À dix-huit ans, ils auraient dit « on verra »."}
        - {si: "role == ds", texte: "Le staff descend une fois par mois regarder un match des moins de dix-sept ans. Il prend des notes. Il ne dit à personne ce qu'il a noté."}
        - "Les grands passent voir les petits un jeudi sur deux. Ils signent des autographes sur les cahiers de textes. Ça fait plaisir aux gamins, moins aux parents."
      haut:
        - {si: "role == president", texte: "Les éducateurs ont repeint le vestiaire des petits sur leur samedi, et ils ont collé le blason sur la porte. Ils n'ont rien demandé. Profites-en."}
        - {si: "role == selectionneur", texte: "Mes anciens gamins de ta liste m'ont envoyé une photo du groupe, tous en survêtement, au même hôtel. Ils sourient tous. Même ceux qui ne sourient jamais."}
        - {si: "role == ds", texte: "Le staff vient au centre le mercredi sans qu'on le demande. Il connaît les prénoms des gamins. Un staff qui connaît les prénoms est un staff qui va rester."}
        - "Les grands viennent jouer avec les petits le jeudi, à cinq contre cinq, en chaussettes. Les petits gagnent. Les grands perdent exprès, et ils ne le cachent même pas."
    repliques:
      - {lien: 0, texte: "Les gamins m'appellent Monsieur Maurice, sauf le dernier jour. Le dernier jour, ils m'appellent par mon nom de famille, comme s'ils étaient déjà grands."}
      - {lien: 0, si: "jour == mer", texte: "Le mercredi, c'est les mères. Elles viennent voir jouer, elles ne regardent pas le ballon. Elles regardent qui on fait asseoir sur le banc."}
      - {lien: 1, texte: "Chaque gamin a sa fiche : la taille, le poids, le pied, et une ligne pour moi. La ligne pour moi, c'est la seule qui compte, et c'est la seule qu'on ne lit pas."}
      - {lien: 1, si: "phase == bilan", texte: "En juin, je fais la liste de ceux qu'on garde. Je l'écris au crayon, et je la gomme trois fois. La quatrième, je l'écris au stylo et je ne dors pas."}
      - {lien: 2, texte: "Un gamin qui pleure après une défaite, je le garde. Un gamin qui rit, je le garde aussi. Celui qui range ses affaires sans rien dire, je le surveille."}
      - {lien: 2, si: "annee >= 2003 && annee <= 2010", texte: "Le petit Rancé me demande l'heure trois fois par séance. Pas parce qu'il s'ennuie. Parce qu'il compte les minutes qui lui restent avant de rentrer chez lui."}
      - {lien: 3, texte: "J'ai les clés du centre, de jour comme de nuit. Un gamin qui fugue revient toujours par la porte de la cuisine. Je la laisse ouverte, et je l'attends."}
      - {lien: -1, texte: "Les gamins te disent bonjour. Moi aussi, par politesse. La politesse, ici, on l'apprend avant le contrôle orienté."}
      - {lien: -2, texte: "J'ai dit aux gamins de ne pas te parler de leurs contrats. Ils ne savent pas encore ce que c'est. Je voudrais que ce soit moi qui le leur apprenne."}
      - {lien: -3, texte: "Tu n'entres plus au centre sans rendez-vous. Le rendez-vous se prend chez Madame Josiane. Elle a des consignes."}
    tuyaux:
      - id: thevenot_valise
        si: "flag(histoire_h3) && !flag(h3_halle_vue)"
        texte: "Le petit Vallin n'a jamais emporté sa valise. Elle est encore sous le lit 4, avec son nom sur l'étiquette. Un garçon qui part à l'étranger emporte sa valise."
      - id: thevenot_ardoise
        si: "flag(histoire_h6) && saison >= 2"
        texte: "Le petit Rancé m'a demandé combien on touche quand on signe à dix-sept ans. Pas pour lui : pour une ardoise. Il a dit « l'ardoise » comme on dit « la maison »."
      - id: thevenot_fiche
        si: "flag(histoire_h7) && flag(h7_rance_mort)"
        texte: "En 2001, sur la fiche du petit Rancé, j'avais écrit « essoufflement à surveiller ». Le médecin du centre l'a lue et l'a signée. La fiche est partie avec lui à la Fédération."
    service:
      lien: 3
      label: "Les mères en tribune"
      texte: "Maurice fait venir les mères des gamins au match de samedi, avec les petits frères et des drapeaux de papier. Toute la tribune les a vues chanter ; la ville en parle lundi."
      effets: {jauges: {tribunes: 3}}

  - id: fournel
    name: "Nadège Fournel"
    label: "DIRECTRICE DU CENTRE"
    genre: f
    portrait: {teint: dore, corpulence: fin, age: mur, coiffure: queue, cheveux: noir, pilosite: rase, lunettes: aucune, tenue: survetement, couleur: anthracite, couleur2: bordeaux, accessoire: sifflet}
    on_relation: {3: vi.fournel.faveur}
    lieu: centre
    tranches: [aprem]
    annees: [2013, 2050]
    roles: [ds, president, selectionneur]
    reseau: vestiaire
    trace: "Nadège a sifflé deux fois entre ses doigts à ton arrivée. Les gamins ont levé la tête : chez elle, on présente ainsi."
    paliers: ["te fait asseoir sur le banc des petits", "te laisse lire le cahier des soirs", "te confierait un gamin pour samedi"]
    froid: ["te répond entre deux exercices", "ne te montre plus les fiches", "a demandé un rendez-vous écrit"]
    climat:
      bas:
        - {si: "role == president", texte: "Mes éducateurs ont reçu des offres de Portclair et de la capitale. Ils ne les ont pas signées. Ils les ont épinglées au tableau de liège, pour que je les voie."}
        - {si: "role == selectionneur", texte: "Les gamins de seize ans m'ont demandé si ça valait encore la peine de rêver de la sélection. J'ai dit oui. Ils ne m'ont pas crue."}
        - "Le staff de l'équipe première ne descend plus au centre. Les gamins le savent : ils ne regardent plus le grillage pendant les séances."
      moyen:
        - {si: "role == president", texte: "Mes éducateurs font leur travail et réclament des ballons, comme chaque année. Ils ne réclament que des ballons. C'est bon signe, en général."}
        - {si: "role == selectionneur", texte: "Les gamins regardent vos matchs ici, sur l'écran du réfectoire. Ils commentent les remplacements. Ils ne chantent pas l'hymne. Ils l'écoutent."}
        - "Le staff passe au centre une fois par mois, regarde un match, prend deux noms. On ne sait jamais lesquels. Les gamins jouent pour les deux noms."
      haut:
        - {si: "role == president", texte: "Mes éducateurs ont refusé des offres de la capitale. Ils m'ont dit pourquoi : le projet. Je ne savais pas qu'on en avait un. Il paraît que c'est vous."}
        - {si: "role == selectionneur", texte: "Les gamins ont tracé à la craie, sur le mur du réfectoire, la composition de votre dernier match. Ils l'ont apprise par cœur. Ils l'ont même corrigée."}
        - "Le staff descend au centre le mercredi sans qu'on le demande et fait jouer les grands avec les petits. Les petits rentrent chez eux en racontant ça toute la semaine."
    repliques:
      - {lien: 0, texte: "J'ai joué ici, derrière, dans la section féminine. On s'entraînait sur le terrain annexe quand les garçons avaient fini. Il faisait nuit en novembre à cinq heures."}
      - {lien: 0, si: "jour == mer", texte: "Le mercredi, les parents restent derrière le grillage. Je leur ai interdit le banc. Ceux qui crient le plus fort ont les enfants qui jouent le moins bien."}
      - {lien: 1, texte: "Monsieur Maurice m'a laissé son sifflet et une consigne : jamais un gamin seul dans le couloir après neuf heures. Je n'ai rien changé à la consigne."}
      - {lien: 2, si: "annee >= 2024 && annee <= 2027", texte: "Les gamins dorment avec le bracelet du fonds et un réveil à cinq heures cinquante, pour le remettre avant la mesure. J'ai confisqué les réveils. Pas les bracelets."}
      - {lien: 2, texte: "Une fois par an, un gamin me demande pourquoi il n'est pas gardé. Je lui dis la vérité. C'est la seule chose que le centre lui doit, et la seule que je peux donner."}
      - {lien: 3, texte: "Si un jour un gamin doit disparaître une semaine, pour sa tête, il y a une chambre au fond du couloir qui n'est sur aucun plan. Ne me demandez pas qui l'a déjà utilisée."}
      - {lien: -1, texte: "Vous avez longé le grillage du centre sans entrer. Les gamins l'ont vu. Ils voient tout, et ils le racontent à leurs parents le soir."}
      - {lien: -2, texte: "Je ne vous laisserai plus parler aux gamins sans moi. Ce n'est pas de la méchanceté. Vous ne savez pas ce que vos phrases deviennent, à seize ans."}
    tuyaux:
      - id: fournel_liste
        si: "flag(histoire_h8)"
        texte: "La liste « fin de cycle » du centre tombe le premier lundi du mois, à six heures. Les gamins qui y sont ne sont plus convoqués à rien. Je l'affiche à midi, quand ils ont mangé."
      - id: fournel_maquette
        si: "flag(histoire_h10) && saison >= 2"
        texte: "Sur la maquette de la vitrine, mon centre s'appelle « Racing Capitale ». En juin, un homme a mesuré mes chambres, « pour l'assurance ». Il portait un badge de Rive Capital."
    service:
      lien: 3
      label: "Un gamin pour samedi"
      texte: "Nadège te prête son meilleur gamin pour le match de samedi, avec sa mère dans la tribune et une consigne : vingt minutes, pas une de plus. La tribune se lève pour lui."
      effets: {jauges: {vestiaire: 2, tribunes: 2}}

  # ═════════════════════════════════════════════════════════════════ LE TERRAIN
  # Le terrain annexe et la pelouse de la Rive : la rosée, la craie, la tondeuse.
  # Le jardinier lit l'herbe comme d'autres lisent le journal.
  - id: vidalie
    name: "Germain Vidalie"
    label: "LE JARDINIER DE LA RIVE"
    genre: m
    portrait: {teint: olive, corpulence: large, age: age, coiffure: casquette, coiffe: bouteille, cheveux: blanc, pilosite: moustache, lunettes: aucune, tenue: blouse, couleur: bouteille, accessoire: aucun}
    on_relation: {3: vi.vidalie.faveur}
    lieu: terrain
    tranches: [matin, aprem]
    annees: [1990, 2012]
    reseau: vestiaire
    trace: "Germain t'a montré comment on sent la pelouse, la paume à plat. Il ne le montre qu'à ceux qui reviendront."
    paliers: ["te laisse marcher sur la pelouse", "te dit quand la pelouse sera lourde", "laisserait l'herbe haute pour toi"]
    froid: ["te fait le tour par la piste", "arrose quand tu passes", "a tondu ton nom sur la pelouse, à l'envers"]
    activites: [dehors_terrain_lignes]
    climat:
      bas:
        - {si: "role == president", texte: "Les employés ne viennent plus manger leur casse-croûte au bord du terrain, le midi. Ils mangent dans leur voiture, sur le parking, vitres fermées."}
        - {si: "role == selectionneur", texte: "Ton groupe s'est entraîné ici mardi. Ils ne se sont pas parlé entre les ateliers. Sur une pelouse, le silence se voit : personne ne tape dans le ballon des autres."}
        - {si: "role == ds", texte: "Le staff piétine toujours le même carré, devant le banc, en parlant bas. Ça fait un rond jaune dans l'herbe. Un rond comme ça, c'est des messes basses."}
        - "Les joueurs arrivent à l'entraînement chacun par un bout du terrain. Avant, ils arrivaient en bande, par le parking. On voit les clans aux traces dans la rosée."
      moyen:
        - {si: "role == president", texte: "Les employés mangent au bord du terrain les jours de soleil, et ils rentrent quand le nuage arrive. Le temps, c'est tout ce qu'ils surveillent, pour l'instant."}
        - {si: "role == selectionneur", texte: "Ton groupe s'est entraîné ici mardi, poliment. Ils se sont passé le ballon comme on se passe le sel chez des gens qu'on connaît mal."}
        - {si: "role == ds", texte: "Le staff marche sur la pelouse à pas comptés, au milieu, sans s'arrêter. Il fait son travail. Ni rond jaune ni pas de danse."}
        - "Les joueurs arrivent par deux ou trois, comme d'habitude. Ils ne s'attendent pas, ils ne s'évitent pas. L'herbe garde des traces de gens qui se supportent."
      haut:
        - {si: "role == president", texte: "Les employés ont fait un match, le midi, sur l'annexe, les bureaux contre l'atelier. Ils ont abîmé ma pelouse. Je ne leur en veux pas."}
        - {si: "role == selectionneur", texte: "Ton groupe est resté jouer ici après la séance, à dix contre dix, sans arbitre, jusqu'à la nuit. Ils ont labouré le rond central. Je les aurais embrassés."}
        - {si: "role == ds", texte: "Le staff est resté sur la pelouse après la séance, à faire des petits ponts aux gamins. Le staff qui joue, c'est le staff qui se sent chez lui."}
        - "Les joueurs restent après la séance, à tirer des coups francs en riant. Ils piétinent ma surface de réparation. Je ne dis rien : une pelouse, c'est fait pour ça."
    repliques:
      - {lien: 0, texte: "Ne marche pas sur le rond central le lundi : il a pris les crampons du samedi, il se repose. Le reste du terrain, tu fais comme tu veux."}
      - {lien: 0, si: "tranche == matin", texte: "Le matin, la rosée garde les pas de la nuit. Je lis la pelouse avant de la tondre. Après, il ne reste rien à lire."}
      - {lien: 1, texte: "Mon père tondait la Rive à la faux, en 1950. Moi, j'ai eu la tondeuse en 1961. Mon fils voudra un robot. Il aura un robot, et il le surveillera à la faux."}
      - {lien: 1, si: "phase == hiver", texte: "Quand il gèle, je bâche la surface de réparation et je laisse le milieu dehors. Le milieu, il a l'habitude de souffrir. Les surfaces, c'est là qu'on gagne."}
      - {lien: 2, texte: "Je peux te dire comment sera la pelouse samedi rien qu'au ciel du jeudi. Les entraîneurs d'en face ne me le demandent jamais. Ils ont tort."}
      - {lien: 3, texte: "Je sais où passent les conduites de 1938 sous la pelouse. Si un jour on veut creuser la Rive pour autre chose qu'un terrain, il faudra passer par moi. On ne passera pas."}
      - {lien: -1, texte: "Passe par la piste, s'il te plaît. Ma pelouse se souvient de qui marche dessus, et pour l'instant elle préfère ne pas se souvenir de toi."}
      - {lien: -2, texte: "On m'a demandé si tu venais voir le terrain la nuit. J'ai dit que non. C'était vrai. Je n'aurais pas menti si ça ne l'était pas."}
    tuyaux:
      - id: vidalie_rosee
        si: "flag(histoire_h2) && saison >= 2 && !flag(h2_wagon_vu)"
        texte: "Le lundi, à six heures, la rosée garde les pas. Depuis l'hiver, une trace vient de la friche, traverse la pelouse jusqu'au banc de touche, et repart. Toujours la même pointure."
      - id: vidalie_jubile
        si: "flag(histoire_h4) && flag(h4_jubile_annonce) && !flag(h4_rond_central)"
        texte: "Pour le jubilé, on m'a fait tasser une allée de gravier jusqu'au premier rang de l'Est, assez large pour un fauteuil. La demande est signée Lavergne."
      - id: vidalie_tracteur
        si: "flag(histoire_h5) && flag(h5_tribune_est_brulee)"
        texte: "Le promoteur m'a demandé de ne pas réensemencer le coin de l'Est cette année. « Ce n'est pas la peine. » Il n'a pas dit pourquoi. Il l'a dit comme un homme qui a vu les plans."
    service:
      lien: 3
      label: "Une pelouse lourde"
      texte: "Germain arrose la Rive toute la nuit de vendredi, sans le dire. Samedi, le ballon colle et l'équipe d'en face, venue pour jouer vite, s'enlise dès le premier quart d'heure."
      effets: {jauges: {vestiaire: 2, tribunes: 1}}

  - id: vidalie_fils
    name: "Thomas Vidalie"
    label: "LE JARDINIER DE LA RIVE"
    genre: m
    portrait: {teint: olive, corpulence: moyen, age: mur, coiffure: degarni, cheveux: chatain, pilosite: barbe, lunettes: aucune, tenue: doudoune, couleur: bouteille, accessoire: aucun}
    on_relation: {3: vi.vidalie_fils.faveur}
    lieu: terrain
    tranches: [matin, aprem]
    annees: [2013, 2050]
    roles: [ds, president, selectionneur]
    reseau: vestiaire
    trace: "Thomas a noté ton passage dans le carnet de pelouse de son père, entre la hauteur de coupe et la pluie."
    paliers: ["te laisse marcher sur le rond central", "te montre les carnets de son père", "tracerait les lignes la nuit pour toi"]
    froid: ["te fait le tour par la piste", "ne te dit plus le temps qu'il fera", "a déplacé ta place de parking sur le gravier"]
    climat:
      bas:
        - {si: "role == president", texte: "Les employés ne viennent plus manger au bord du terrain. Mon père disait que c'était le premier signe. Le deuxième, c'est quand ils ne saluent plus le jardinier."}
        - {si: "role == selectionneur", texte: "Votre groupe s'est entraîné ici sans un cri. Mon père disait qu'une séance sans cri, c'est une équipe qui garde ses forces pour se disputer."}
        - "Le staff piétine le même carré devant le banc en parlant bas. Ça jaunit l'herbe en rond. Mon père appelait ça les ronds de messe basse."
      moyen:
        - {si: "role == president", texte: "Les employés mangent dehors quand il fait beau, rentrent quand il pleut. Ni fête ni grève : la météo, rien que la météo."}
        - {si: "role == selectionneur", texte: "Votre groupe s'est entraîné ici proprement. Ils ont ramassé les plots sans qu'on le leur dise, chacun les siens. Personne ceux des autres."}
        - "Le staff traverse la pelouse au milieu, sans s'arrêter, sans s'attarder. L'herbe se relève derrière eux en une heure. C'est une bonne heure."
      haut:
        - {si: "role == president", texte: "Les employés ont fait un match sur l'annexe à midi, la comptabilité contre la sécurité. Ils ont labouré ma pelouse. Mon père aurait applaudi."}
        - {si: "role == selectionneur", texte: "Votre groupe est resté après la séance à jongler par deux, jusqu'à la nuit. Ils ont ri tout le temps. Les rires, ça ne laisse pas de traces sur l'herbe, malheureusement."}
        - "Le staff a joué à la balle au prisonnier avec les gamins du centre, au bord du terrain. Ils se sont roulés dans l'herbe. Un staff qui se roule dans l'herbe, ça reste."
    repliques:
      - {lien: 0, texte: "Mon père lisait la pelouse avec la paume. Moi, j'ai une sonde, un capteur et une appli. Je pose quand même la paume après, pour vérifier la sonde."}
      - {lien: 0, si: "annee >= 2024", texte: "Le fonds a planté des capteurs sous la pelouse, tous les cinq mètres. Ils mesurent l'appui des joueurs. Ils mesurent aussi le mien. Je tonds en zigzag, pour voir."}
      - {lien: 1, texte: "Je garde les carnets de mon père dans le local de la tondeuse : quarante ans de hauteurs de coupe et de pluies. Il y a des matchs gagnés qu'on lit dans la pluie de la veille."}
      - {lien: 2, si: "phase == hiver", texte: "En hiver, je bâche les surfaces et je laisse souffrir le milieu, comme mon père. Les gens de la Ligue voulaient une pelouse chauffée. On a gardé les bâches."}
      - {lien: 3, texte: "Si un samedi vous voulez une pelouse qui ralentit tout, dites-le-moi le jeudi. Si vous la voulez rapide, dites-le-moi le mercredi : il faut tondre deux fois."}
      - {lien: -1, texte: "La piste, s'il vous plaît. Je viens de passer le rouleau, et on voit tout sur une pelouse roulée, même les gens qui passent vite."}
      - {lien: -2, texte: "On m'a demandé ce que vous veniez faire sur le terrain le soir. J'ai dit : regarder. On m'a demandé quoi. J'ai dit que je n'étais pas dans votre tête."}
    tuyaux:
      - id: vidalie_fils_courbes
        si: "flag(histoire_h8)"
        texte: "Les capteurs de la pelouse disent qui court la nuit sous les projecteurs, et à quelle heure. Le fonds lit ces courbes avec les autres. Le garçon qui court le sait-il ?"
      - id: vidalie_fils_pales
        si: "flag(histoire_h10) && flag(h10_helico_renvoye)"
        texte: "Les pales de l'hélicoptère ont arraché trois mètres carrés au rond central. J'ai gardé une motte dans un sac, au frais. Ce genre de cadeau, on en reparle un jour devant un juge."
    service:
      lien: 3
      label: "Les lignes, la nuit"
      texte: "Thomas retrace les lignes de l'annexe à la lampe frontale, la nuit d'avant la séance, à la largeur que tu as demandée. Le matin, les joueurs croient que le terrain a rétréci."
      effets: {jauges: {vestiaire: 2}}

  # ═══════════════════════════════════════════════════════════════ LA MUSCU
  # La salle du garage Mazurier : les bancs, le miroir, le sac, la radio. Steph
  # (livre 3 : il vend la boîte, il porte les enveloppes du Terminus) la tient
  # jusqu'en 2014 ; Teddy Rivoire la rachète, et vide l'armoire du fond.
  - id: steph
    lieu: muscu
    tranches: [matin, aprem, soir]
    annees: [1990, 2014]
    roles: [entraineur, joueur, president, ds]
    reseau: vestiaire
    trace: "Steph a réglé le banc à ta hauteur et noté le cran au feutre sur le montant. Un cran à ton nom, ici, c'est une place."
    paliers: ["te garde le banc du fond", "te dit ce que ton corps ne dit pas", "te trouverait ce que la pharmacie n'a pas"]
    froid: ["te fait payer la séance d'avance", "a effacé ton cran au feutre", "ne te pare plus au développé"]
    activites: [fonte]
    climat:
      bas:
        - {si: "role == president", texte: "Tes employés viennent soulever ici le soir et parlent de la paie entre deux séries. Ils comptent les mois de retard sur leurs doigts, entre les barres."}
        - {si: "role == ds", texte: "Le staff vient ici le soir, chacun dans son coin. Ils ne se parent plus entre eux. Un staff qui ne se pare plus attend que l'autre lâche la barre."}
        - "Les gars du club viennent le soir, chacun son tour, jamais ensemble. Ils évitent de se croiser dans le miroir. Un vestiaire qui s'évite, je le vois avant le score."
      moyen:
        - {si: "role == president", texte: "Tes employés soulèvent, boivent leur eau, rentrent. Ils parlent de leurs gamins, pas de la paie. Ni bien ni mal."}
        - {si: "role == ds", texte: "Le staff vient soulever deux par deux, comme d'habitude. Ils parlent du week-end, pas de toi, pas du président. Tant qu'ils parlent du week-end."}
        - "Les gars du club viennent par deux et repartent seuls. Ils se parent quand on le leur demande. Ils ne le proposent pas encore."
      haut:
        - {si: "role == president", texte: "Tes employés ont fait une cagnotte pour m'acheter un banc neuf. Ils ont mis ton nom sur la carte, à côté des leurs, sans te demander."}
        - {si: "role == ds", texte: "Le staff est venu à six un dimanche matin, et ça a fini en concours de pompes. Le kiné a gagné. Personne ne l'avait vu venir, lui le premier."}
        - "Les gars du club sont venus ensemble samedi soir, après le match, pour la musique. Ils ont soulevé en chantant faux. Je n'ai pas eu le cœur de les mettre dehors."
    repliques:
      - {lien: 0, texte: "On paie la séance à la porte et on range sa barre. Ce qu'on se dit entre deux séries reste entre les murs. Les murs sont épais : c'était un garage."}
      - {lien: 0, si: "tranche == soir", texte: "Le soir, la radio donne les résultats de la deuxième division. Les gars soulèvent au rythme des buts. Un but d'en face, et la barre redescend plus vite."}
      - {lien: 1, texte: "J'ai joué au Racing, avant. Un genou, deux opérations, une salle de muscu. C'est l'ordre normal des choses, quand on a un genou."}
      - {lien: 1, si: "serie_d >= 1", texte: "Après une mauvaise série, les gars chargent plus lourd. Ils croient que ça se rattrape avec les bras. Je retire des disques sans le leur dire."}
      - {lien: 2, texte: "Ton dos te ment depuis trois semaines. Tu le tiens droit pour qu'on ne voie rien. Moi, je vois. Allonge-toi, je te montre où ça tient."}
      - {lien: 3, texte: "Il y a une armoire au fond, fermée à clé. Ce qu'il y a dedans n'est pas pour les gamins. Pour toi, peut-être, un jour, si tu demandes bien."}
      - {lien: -1, texte: "La séance, c'est d'avance pour toi, maintenant. Ne le prends pas mal. C'est la règle pour ceux qui oublient de revenir."}
      - {lien: -2, texte: "On m'a demandé si tu venais ici, et pour quoi. J'ai dit : pour le dos. On m'a dit de mieux regarder. Je regarde mieux, maintenant."}
      - {lien: -3, texte: "Tous les bancs sont pris, pour toi. Va courir au bord de la Rive : c'est gratuit, et la Rive ne pose pas de questions."}
    tuyaux:
      - id: steph_gants
        si: "flag(histoire_h3) && !flag(h3_halle_vue) && !flag(h3_douche)"
        texte: "Le petit Vallin s'entraînait ici la nuit, en 1989. Ses gants de boxe pendaient au clou du fond depuis. Il y a trois semaines, ils ont disparu, et la porte n'a pas été forcée."
      - id: steph_velo
        si: "flag(histoire_h4) && !flag(h4_capot)"
        texte: "Après mai 1984, Bréhaut a vendu sa voiture et il est venu à l'entraînement à vélo pendant deux ans. Il disait que c'était pour les jambes. Il avait déjà de très bonnes jambes."
    service:
      lien: 3
      si: "!flag(dette_steph)"
      label: "Une boîte pour le genou"
      texte: "Steph pose sur le banc une boîte sans étiquette. « Pour le genou. Le tien, ou celui d'un autre : je ne demande pas. Deux le matin. » Samedi, personne ne boite."
      effets: {jauges: {vestiaire: 2}, set: [vl_dopant]}
      dette: true

  - id: rivoire
    name: "Teddy Rivoire"
    label: "LE PATRON DE LA SALLE"
    genre: m
    portrait: {teint: ebene, corpulence: large, age: mur, coiffure: chauve, cheveux: noir, pilosite: bouc, lunettes: aucune, tenue: survetement, couleur: noir, couleur2: rouge, accessoire: aucun}
    on_relation: {3: vi.rivoire.faveur}
    lieu: muscu
    tranches: [matin, aprem, soir]
    annees: [2015, 2050]
    roles: [ds, president, selectionneur]
    reseau: vestiaire
    trace: "Teddy a tapé ton poing avec le sien, une fois, sans un mot. À la salle, ça vaut une carte de membre."
    paliers: ["te prête ses gants", "te dit qui vient la nuit", "t'ouvrirait la salle à trois heures"]
    froid: ["te fait payer la séance au comptoir", "baisse la musique quand tu entres", "a changé le code de la porte"]
    climat:
      bas:
        - {si: "role == president", texte: "Tes employés soulèvent ici après le travail, chacun avec ses écouteurs. Ils ne se parlent plus. Ils comptent leurs séries comme on compte des jours."}
        - {si: "role == selectionneur", texte: "Les joueurs de ta liste qui sont du coin passent ici pendant les vacances. Ils ne parlent pas de la sélection. Ils parlent de leurs clubs, longtemps."}
        - "Le staff vient la nuit, chacun son créneau, pour ne pas se croiser. Mon planning ressemble à un plan de table de divorce."
      moyen:
        - {si: "role == president", texte: "Tes employés viennent par deux, pour la forme et pour râler. Ils râlent contre le parking, pas contre toi. C'est déjà ça."}
        - {si: "role == selectionneur", texte: "Les joueurs de ta liste passent ici, polis. Ils demandent des nouvelles du groupe sans en donner."}
        - "Le staff vient à ses heures, s'entraîne, repart. Ils parlent des séances, pas des gens. Ça tient."
      haut:
        - {si: "role == president", texte: "Tes employés ont lancé un défi : cent pompes chacun pour la cagnotte des gamins du centre. Ils ont mis ton nom sur la liste. Tu en dois cent."}
        - {si: "role == selectionneur", texte: "Les joueurs de ta liste qui sont du coin s'entraînent ici ensemble, pendant leurs vacances. Ensemble. Personne ne le leur a demandé."}
        - "Le staff a fait un tournoi de bras de fer, un soir. Le préparateur a perdu contre le kiné. Ils en rient encore au petit-déjeuner."
    repliques:
      - {lien: 0, texte: "J'ai racheté la salle à Steph en 2015, avec les bancs et le nom. Il m'a laissé une consigne : ne jamais ouvrir l'armoire du fond. Je l'ai vidée le premier jour."}
      - {lien: 0, si: "tranche == soir", texte: "Le soir, c'est les infirmières, les livreurs, deux flics. Les joueurs, c'est le matin. Personne ne se croise. C'est ce qui fait tenir une salle."}
      - {lien: 1, texte: "Je boxais, avant. Douze combats, onze victoires. Le douzième m'a appris à ouvrir une salle."}
      - {lien: 2, texte: "Le sac du fond a été recousu onze fois. Chaque fois, c'était quelqu'un qui avait quelque chose à dire à quelqu'un d'autre. Le sac n'a jamais rien répété."}
      - {lien: 3, texte: "Le code de la porte change chaque mois. Le tien ne changera pas. Si un soir il te faut un endroit où personne ne te cherche, c'est ici."}
      - {lien: -1, texte: "La séance, c'est au comptoir, comme tout le monde. Je fais des prix aux amis. Pour l'instant, je te fais le prix."}
      - {lien: -2, texte: "On m'a demandé à quelle heure tu venais. J'ai dit que tu ne venais plus. C'est presque vrai."}
    tuyaux:
      - id: rivoire_kerdal
        si: "flag(histoire_h8) && !flag(h8_kerdal_vit) && !flag(h8_kerdal_mort)"
        texte: "Kerdal vient le lundi soir, quand tout le monde est parti. Il soulève jusqu'à avoir mal ailleurs que dans la tête. Je lui ai dit de rentrer. Il m'a montré sa montre : « Elle dit que je peux. »"
      - id: rivoire_coffre
        si: "role != selectionneur"
        texte: "Les sachets qu'on vend sur le parking de la salle ne viennent pas de chez moi. Ils sortent d'un coffre de voiture, le jeudi, à vingt heures. Regarde qui de tes joueurs sort fumer à vingt heures."
    service:
      lien: 3
      label: "Une nuit de sommeil"
      texte: "Teddy te fait dormir une nuit entière sur le tapis du fond, la porte fermée, ton téléphone dans son casier. Au réveil, il y a du café. Tu ne te rappelles aucun rêve."
      effets: {jauges: {vestiaire: 1}, var: {h8_nuits: "-1"}}

  # ═════════════════════════════════════════════════════════ LA GARE ROUTIÈRE
  # Les quais, le guichet, le distributeur, les bancs. Norbert (livre 2 : il tient
  # l'arrière-salle du Terminus, et il a le ticket de 1987) conduit le car du club
  # jusqu'à sa vente en 2003, puis les lignes de la ville ; Karine Duclou après lui.
  - id: norbert
    lieu: gareRoutiere
    tranches: [matin, soir]
    annees: [1990, 2010]
    roles: [entraineur, joueur, president, ds]
    reseau: rue
    trace: "Norbert a posé son journal plié sur le siège derrière lui, pour toi. On ne s'assoit pas sur le journal de Norbert."
    paliers: ["te garde le siège derrière lui", "te dit qui a pris le car de nuit", "ferait un détour pour toi"]
    froid: ["te vend ton billet sans un mot", "te laisse sur le quai sous la pluie", "a raconté ton trajet au Terminus"]
    repliques:
      - {lien: 0, texte: "Le car de six heures part à six heures, pas à six heures deux. Ceux qui courent derrière, je les vois dans le rétroviseur. Je les regarde courir."}
      - {lien: 0, si: "annee >= 2003", texte: "Le club a vendu le car. On m'a gardé pour les lignes de la ville. Je conduis des gens qui ne chantent pas. C'est reposant, et c'est triste."}
      - {lien: 1, texte: "On dort mieux dans un car que dans un lit. Un lit ne vous emmène nulle part."}
      - {lien: 1, si: "jour == ven && tranche == soir", texte: "Le vendredi, au Terminus, on joue aux cartes dans l'arrière-salle. Je fais la caisse. Je ne joue jamais : celui qui tient la caisse ne perd pas."}
      - {lien: 2, texte: "Dans un car, les gens se disent ce qu'ils ne diraient pas dans une voiture. Ils croient que le chauffeur n'écoute pas. Le chauffeur n'a que ça à faire."}
      - {lien: 3, texte: "S'il vous faut un jour quitter la ville sans qu'on le sache, le car de quatre heures dix pour Portclair ne s'arrête qu'au bout du département. Je connais le chauffeur."}
      - {lien: -1, texte: "Votre billet. Quai trois. Le car est à l'heure ; vous, je ne sais pas."}
      - {lien: -2, texte: "Au Terminus, on m'a demandé où vous alliez le lundi matin. J'ai dit que je ne savais pas. Ils ont ri. Ils savent que je sais toujours."}
      - {lien: -3, texte: "Je ne vous prends plus. Prenez le train, un taxi ou vos jambes. Pour vous, mon car est complet jusqu'à la fin de la saison."}
    tuyaux:
      - id: norbert_cabine
        si: "flag(histoire_h2) && saison >= 2 && !flag(h2_cabine_vue)"
        texte: "Le lundi, à six heures quarante, un homme en casquette téléphone de la cabine du quai deux. Toujours la même casquette, toujours trois minutes. Vous devriez prendre le car, un lundi."
      - id: norbert_greffe
        si: "flag(histoire_h6) && saison >= 2"
        texte: "Le stagiaire du club prend le car de sept heures dix pour Portclair, un lundi sur deux. Il descend devant le greffe du tribunal de commerce, une chemise cartonnée sous le bras."
        effets: {var: {h6_indices: "+1"}}
    service:
      lien: 3
      si: "!flag(dette_norbert)"
      label: "Rentrer sans être vu"
      texte: "Norbert te ramène de Portclair par les petites routes, phares éteints sur le pont, et te dépose derrière chez toi. Personne en ville ne saura où tu as passé la nuit."
      effets: {jauges: {direction: 2, tribunes: 1}}
      dette: true

  - id: duclou
    name: "Karine Duclou"
    label: "CHAUFFEUSE DE CAR"
    genre: f
    portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: queue, cheveux: roux, pilosite: rase, lunettes: aviateur, tenue: veste, couleur: marine, accessoire: badge}
    on_relation: {3: vi.duclou.faveur}
    lieu: gareRoutiere
    tranches: [matin, soir, nuit]
    annees: [2011, 2050]
    roles: [ds, president, selectionneur]
    reseau: rue
    trace: "Karine t'a salué de deux doigts levés sur le volant, en passant. Les chauffeurs ne saluent comme ça que les leurs."
    paliers: ["te garde le siège du fond", "te dit qui descend où", "te sortirait de la ville de nuit"]
    froid: ["te vend ton billet sans lever les yeux", "démarre quand tu arrives au quai", "a dit à quelqu'un où tu descends"]
    repliques:
      - {lien: 0, texte: "Ligne 4 : la Rive, le Pont, la Tréfilerie, la gare. Trente-deux minutes quand ça roule. Vingt-huit quand c'est moi."}
      - {lien: 0, si: "tranche == nuit", texte: "Le dernier car, c'est les infirmières, les plongeurs et ceux qui ne veulent pas rentrer. Je les connais tous de dos."}
      - {lien: 1, texte: "J'ai appris à conduire sur le parking de la Tréfilerie, le dimanche, avec mon oncle. Il disait : regarde loin, freine tôt. Je n'ai rien trouvé de mieux à dire à quelqu'un."}
      - {lien: 2, texte: "Dans un car, les gens regardent par la fenêtre pour ne pas se regarder. Dans le rétroviseur, je les vois se regarder quand même."}
      - {lien: 3, texte: "Le dépôt a une sortie sur la nationale, par l'arrière, sans caméra. Un soir, s'il le faut, je fais le dernier car à vide jusqu'au dépôt, avec vous dedans."}
      - {lien: -1, texte: "Votre billet, c'est au distributeur. Je ne rends plus la monnaie, ni à vous ni aux autres."}
      - {lien: -2, texte: "On m'a demandé où vous descendiez, le mardi. J'ai dit : au Pont. C'était vrai. Je ne mens pas pour ceux qui ne me disent pas bonjour."}
    tuyaux:
      - id: duclou_boulangere
        si: "flag(histoire_h9) && !flag(h9_loin)"
        texte: "La boulangère de la rue des Lilas prend le car de la capitale le mardi, pour l'association de votre fille. Elle revient avec des papiers, et elle pose la main dessus quand quelqu'un s'assoit."
      - id: duclou_brac
        si: "flag(histoire_h10) && !flag(h10_brac_garde) && !flag(h10_brac_vendu)"
        texte: "Le petit Brac a pris mon car de la capitale deux lundis de suite, avec un sac trop neuf. Il revient le soir par le dernier. Quelqu'un lui a payé un abonnement de trois mois."
    service:
      lien: 3
      label: "Sortir de la ville"
      texte: "Karine te fait monter dans le dernier car, à vide, jusqu'au dépôt, et te laisse sur la nationale où une voiture t'attend. Le registre de la ligne dit : aucun passager."
      effets: {jauges: {direction: 2}}

  # ═══════════════════════════════════════════════════════════════ LA BOUTIQUE
  # Les écharpes, les fanions, la vitrine de 1974, la caisse. Ouverte le mercredi
  # et le samedi après-midi. Ce qui se vend dit ce que pense la tribune.
  - id: combaz
    name: "Arlette Combaz"
    label: "LA BOUTIQUE DU CLUB"
    genre: f
    portrait: {teint: porcelaine, corpulence: fin, age: age, coiffure: chignon, cheveux: blanc, pilosite: rase, lunettes: rondes, tenue: blouse, couleur: bordeaux, couleur2: creme, accessoire: echarpe, couleur_accessoire: gris}
    on_relation: {3: vi.combaz.faveur}
    lieu: boutique
    tranches: [aprem]
    annees: [1990, 2014]
    roles: [entraineur, joueur, president, ds]
    reseau: tribunes
    trace: "Arlette a plié ton écharpe dans du papier de soie, comme un cadeau. Tu l'avais payée. Chez elle, c'est une adoption."
    paliers: ["te met de côté la dernière taille", "te montre le cahier des ventes", "rouvrirait la boutique pour toi"]
    froid: ["te rend la monnaie sans un mot", "a rangé ta photo sous le comptoir", "ne te met plus rien de côté"]
    activites: [dedicaces, boutique_caisse]
    climat:
      bas:
        - "Les écharpes ne partent plus. On vient même me les rendre, pliées, avec le ticket. Je n'ai pas le droit de les reprendre. Je les reprends."
      moyen:
        - "On m'achète des fanions, des porte-clés, des choses qui ne se portent pas. Les gens soutiennent le club dans leur poche, pas encore autour du cou."
      haut:
        - "J'ai vendu tout le stock d'écharpes, et on me commande celles de l'an prochain. Une dame m'a demandé si on faisait des tailles pour les chiens."
    repliques:
      - {lien: 0, texte: "Le mercredi après-midi et le samedi, rien d'autre. Le reste de la semaine, je tricote à la maison les écharpes qu'on ne trouve pas ailleurs."}
      - {lien: 0, si: "jour == sam", texte: "Le samedi, je vends plus d'écharpes avant le match qu'après. Après, ce sont les bonnets qui partent : on cache ses oreilles, les jours de défaite."}
      - {lien: 1, texte: "Mon frère tenait la boutique avant moi, depuis 1962. Il notait chaque vente dans un cahier, avec le temps qu'il faisait. Je fais pareil. Il ne pleut jamais les soirs de derby."}
      - {lien: 1, texte: "Le maillot de 1974 dort dans la vitrine, la boue encore sur le numéro. On ne l'a jamais lavé : on aurait lavé la finale."}
      - {lien: 2, texte: "Les joueurs viennent acheter leur propre maillot pour leur mère. Ils paient plein tarif. Ils ne veulent pas qu'on sache que le club ne leur en donne qu'un."}
      - {lien: 3, texte: "La caisse a un double fond. Mon frère y mettait les billets des enchères. Moi, j'y garde ce qu'on me confie. Il reste de la place."}
      - {lien: -1, texte: "Votre écharpe, vous l'avez payée ; je n'ai pas à la plier. Je la plie quand même. Je plie tout ce qui sort d'ici."}
      - {lien: -2, texte: "On m'a rapporté trois écharpes, brûlées au bout, posées sur le comptoir sans un mot. Je les ai reprises. Je ne savais pas quoi en faire d'autre."}
      - {lien: -3, texte: "J'ai retiré vos photos de la vitrine. Elles sont dans un carton, sous le comptoir, si quelqu'un les demande un jour. Personne ne demande."}
    tuyaux:
      - id: combaz_enchere
        si: "flag(histoire_h1) && !flag(h1_maillot) && !flag(h1_maillot_gigi) && !possede(maillot_1974)"
        texte: "Le maillot de 1974 passe aux enchères un mercredi. Gigi Vecchio a mis de côté de quoi monter très haut, et il ne le dit à personne. Si vous le voulez, ne levez pas la main en premier."
      - id: combaz_fanions
        si: "flag(histoire_h5) && !flag(h5_14b_ecoutee)"
        texte: "Mamie Paulette m'achète le même fanion chaque saison depuis 1951, pour la 14B. Les vieux, elle les range dans son buffet, avec les papiers de son père. Elle aime qu'on lui demande."
      - id: combaz_terrasses
        si: "flag(histoire_h5) && !flag(h5_maillot_terrasses) && !flag(h5_maillot_refuse)"
        texte: "Les Terrasses ont déjà fait imprimer deux cents maillots à leur nom, avant votre signature. Ils attendent en carton au dépôt de l'agence. Ils savent ce que vous signerez, ou ils le croient."
      - id: combaz_lundi
        texte: "Les gens de la Nord achètent leur écharpe neuve le lundi d'après une défaite, pas d'une victoire. Une défaite, ça se porte. Regardez ma caisse du lundi : c'est la vraie tribune."
    service:
      lien: 3
      label: "Deux cents écharpes"
      texte: "Arlette ressort de la réserve deux cents écharpes de l'ancien modèle et les fait distribuer à la grille, gratuites. Samedi, la Nord est bordeaux jusqu'au toit."
      effets: {jauges: {tribunes: 3, caisse: -1}}

  - id: arnal
    name: "Lou Arnal"
    label: "LA BOUTIQUE DU CLUB"
    genre: f
    portrait: {teint: brun, corpulence: fin, age: jeune, coiffure: boucle, cheveux: noir, pilosite: rase, lunettes: aucune, tenue: pull, couleur: bordeaux, accessoire: telephone}
    on_relation: {3: vi.arnal.faveur}
    lieu: boutique
    tranches: [aprem]
    annees: [2015, 2050]
    roles: [ds, president]
    reseau: tribunes
    trace: "Lou a pris une photo de toi pour la boutique, puis l'a effacée devant toi. Chez elle, c'est de l'amitié."
    paliers: ["te prévient des ruptures de stock", "te montre les ventes en ligne", "ferait imprimer ce que tu veux"]
    froid: ["te vend au prix de l'étiquette", "ne te répond plus en ligne", "a retiré ton visage de la vitrine"]
    climat:
      bas:
        - "Les retours ont doublé ce mois-ci. On me renvoie le maillot avec un mot dans le carton. Je garde les mots dans une boîte. Ils sont tous polis. C'est le pire."
      moyen:
        - "On vend ce qui se vend toujours : les bonnets d'hiver, les mugs, les maillots des petits. Personne ne s'engage ; tout le monde achète un peu."
      haut:
        - "Rupture sur le maillot domicile, toutes tailles. La liste d'attente fait trois pages. Il y a des adresses de la capitale dessus."
    repliques:
      - {lien: 0, texte: "Arlette Combaz m'a laissé la boutique, son cahier des ventes et un conseil : ne jamais vendre le maillot de 1974. J'ai gardé le conseil. Le cahier, je le tape."}
      - {lien: 1, texte: "La moitié de mes ventes partent la nuit, en ligne, chez des gens qui ne sont jamais venus à la Rive. Je leur glisse un brin d'herbe dans le carton. Ils écrivent pour dire merci."}
      - {lien: 2, texte: "Les joueurs me demandent combien de maillots à leur nom on a vendus. Ceux qui demandent souvent vont partir : ils veulent un chiffre pour leur agent."}
      - {lien: 3, texte: "J'ai la main sur la machine à floquer. En une nuit, je peux sortir trois cents t-shirts avec n'importe quelle phrase dessus. Choisis-la bien."}
      - {lien: -1, texte: "Le prix, c'est celui de l'étiquette. Les réductions, c'est pour les socios et les amis."}
      - {lien: -2, texte: "On m'a demandé de retirer ta photo de la vitrine. Je l'ai rangée dans le carton des anciens. Il est grand, le carton des anciens."}
    tuyaux:
      - id: arnal_capitale
        si: "flag(histoire_h10) && !flag(h10_clapet_nino)"
        texte: "Un fournisseur m'a demandé combien d'écharpes « Racing Capitale » je vendrais la saison prochaine. Il avait déjà le logo. Il dit qu'un de nos socios le lui a envoyé."
      - id: arnal_fichier
        si: "role == president"
        texte: "Le contrat de la boutique en ligne, page six : le club revend la liste de nos acheteurs à un site de paris. Un gamin qui achète un maillot reçoit une cote le lendemain."
    service:
      lien: 3
      label: "Le maillot de la ville"
      texte: "Lou dessine en une nuit un maillot avec le nom des rues d'Aubérive brodé dans le col. Il part en trois jours, et la Nord le porte à l'envers pour qu'on voie les rues."
      effets: {jauges: {tribunes: 2, caisse: 2}}

  # ═══════════════════════════════════════════════════════════════ LA BRASSERIE
  # La brasserie du Pont : les banquettes, le passe-plat, l'ardoise, la caisse, la
  # photo de 1962 au-dessus de la banquette. Les dirigeants y déjeunent comme si le
  # serveur était un meuble.
  - id: bretaud
    name: "Léon Brétaud"
    label: "LA BRASSERIE DU PONT"
    genre: m
    portrait: {teint: clair, corpulence: large, age: mur, coiffure: degarni, cheveux: brun, pilosite: moustache, lunettes: aucune, tenue: chemise, couleur: blanc, couleur2: noir, accessoire: carnet}
    on_relation: {3: vi.bretaud.faveur, -3: vi.bretaud.cahier}
    lieu: brasserie
    tranches: [midi, soir]
    annees: [1990, 2016]
    reseau: direction
    trace: "Léon a reposé ta tasse sur la soucoupe sans un bruit, d'un geste de serveur. Il ne le fait que pour les habitués."
    paliers: ["te garde la table sous la photo", "te dit qui déjeune avec qui", "te prêterait la table du fond"]
    froid: ["te place près des cuisines", "te sert après les autres", "a dit ton menu à qui voulait l'entendre"]
    activites: [brasserie_avant_match, brasserie_plonge, brasserie_recruteur]
    climat:
      bas:
        - {si: "role == joueur", texte: "Les dirigeants ont parlé de votre contrat jeudi, entre la poire et le fromage. Pas en bien. Ils ont repris un café pour finir d'en parler."}
        - {si: "role == president", texte: "Trois de vos actionnaires ont déjeuné ensemble mardi, sans vous, à la table du fond. Chacun a payé sa part. Quand ils paient chacun leur part, c'est qu'ils ne se doivent plus rien."}
        - {si: "role == selectionneur", texte: "Les gens de la Fédération ont dîné ici avec un entraîneur de première division. Ils ont demandé la table du fond et la discrétion. Ils ont eu la table."}
        - "Le président a déjeuné ici avec un homme que je ne connais pas, et il a pris trois plats. Il ne prend trois plats que pour convaincre. L'homme parlait de vous."
      moyen:
        - {si: "role == joueur", texte: "Les dirigeants ont parlé de vous pendant deux minutes, à la table du fond, entre deux autres sujets. Ni bien ni mal. On vous range avec les affaires courantes."}
        - {si: "role == president", texte: "Vos actionnaires déjeunent ici le premier jeudi, comme d'habitude. Ils parlent des taux et de leurs petits-enfants. Pas de vous, ce mois-ci."}
        - {si: "role == selectionneur", texte: "Les gens de la Fédération ont dîné ici et pris le menu du jour. Le menu du jour, c'est ce qu'on prend quand on ne veut rien fêter, ni rien enterrer."}
        - "Le président déjeune seul, le journal plié à la page des sports. Il finit son assiette. Quand il est inquiet, il en laisse la moitié."
      haut:
        - {si: "role == joueur", texte: "Les dirigeants ont trinqué à votre santé jeudi, et le président a laissé un pourboire. Il ne laisse jamais de pourboire. C'était pour vous, je pense."}
        - {si: "role == president", texte: "Vos actionnaires ont réservé la grande table pour le premier jeudi et commandé le vin de 1982. Le 82, ils ne l'ouvrent que pour les présidents qu'ils gardent."}
        - {si: "role == selectionneur", texte: "Le président de la Fédération a dîné ici avec sa femme, et il a parlé de vous au dessert. Sa femme a dit : « Enfin. » J'ai entendu : je servais le café."}
        - "Le président a commandé le champagne un mardi midi, sans rien fêter de précis. Il a dit votre nom en levant son verre. Le serveur s'en souvient : c'était moi."
    repliques:
      - {lien: 0, texte: "La photo de 1962, au-dessus de la banquette, c'est mon père qui l'a accrochée. Les gens s'assoient dessous pour signer des choses. Ils ne lèvent jamais la tête."}
      - {lien: 0, si: "tranche == midi && role != president", texte: "Le midi, la table du fond est au président du club. Personne ne s'y assoit, même quand il n'est pas là. Surtout quand il n'est pas là."}
      - {lien: 1, texte: "Je sers les dirigeants depuis 1968. Ils parlent comme si le serveur était un meuble. Un meuble qui se souvient de tout, on appelle ça un serveur."}
      - {lien: 1, si: "jour == ven", texte: "Le vendredi, mon cuisinier rêve de faire autre chose que des pâtes pour vingt. Il rêve depuis 1995. Un jour, il aura la brasserie, et il fera encore des pâtes."}
      - {lien: 2, texte: "Les gens importants commandent le plat du jour pour faire simple ; les autres commandent à la carte pour faire important. Regardez les assiettes, pas les cravates."}
      - {lien: 3, texte: "J'ai un cahier, sous la caisse, où je note qui déjeune avec qui, depuis 1968. Je ne l'ai jamais montré. Si un jour il vous en faut une page, une seule, demandez-la."}
      - {lien: -1, texte: "Votre table habituelle est prise. Il reste de la place près des cuisines. On y mange aussi bien ; on y entend moins."}
      - {lien: -2, si: "role != president", texte: "Le président m'a demandé avec qui vous déjeuniez. Je lui ai dit. Je ne mens pas aux gens qui paient leur addition à l'heure."}
      - {lien: -3, texte: "Je vous sers parce que je sers tout le monde. Mais le cahier sous la caisse a une page à votre nom, maintenant, et elle est longue."}
    tuyaux:
      - id: bretaud_corven
        si: "role == entraineur && annee < 1999"
        texte: "Dan Corven a laissé pour vous, à la caisse, une page de carnet pliée : votre dernier match, minute par minute, et en bas, souligné deux fois : « Vos changements arrivent dix minutes trop tard. »"
        effets: {var: {clow_conseils: "+1"}, relation: {clow: 1}}
      - id: bretaud_1975
        si: "flag(histoire_h1) && saison >= 2"
        texte: "En 1975, votre père a déjeuné ici avec le président, une seule fois. Ils n'ont pas mangé. Le président a payé en billets neufs, et votre père a plié sa serviette comme un homme qui ne reviendra pas."
      - id: bretaud_mardi
        si: "flag(histoire_h5) && flag(h5_conseil_entendu)"
        texte: "Le mardi, à six heures moins dix, le directeur de la Banque Aubérivoise quitte sa table sans finir son café. Il revient à six heures vingt et commande un cognac. Tous les mardis."
    service:
      lien: 3
      si: "!flag(dette_bretaud)"
      label: "La table du fond"
      texte: "Léon te donne la table du fond, sous la photo de 1962, et sert lui-même. Ton invité comprend qui tient la ville. Le club l'apprend le soir même, et ne dit rien."
      effets: {jauges: {direction: 3}}
      dette: true

  - id: pelissou
    name: "Raoul Pélissou"
    label: "LA BRASSERIE DU PONT"
    genre: m
    portrait: {teint: clair, corpulence: large, age: mur, coiffure: brosse, cheveux: gris, pilosite: rase, lunettes: aucune, tenue: blouse, couleur: blanc, accessoire: aucun}
    on_relation: {3: vi.pelissou.faveur}
    lieu: brasserie
    tranches: [midi, soir]
    annees: [2017, 2050]
    roles: [ds, president, selectionneur]
    reseau: direction
    trace: "Raoul est sorti de sa cuisine pour te serrer la main. Il n'en sort que pour les gens et pour les incendies."
    paliers: ["te garde la banquette sous la photo", "te fait goûter l'essai du jeudi", "fermerait la salle pour toi"]
    froid: ["te fait attendre au bar", "ne sort plus de la cuisine pour toi", "a donné ta table à quelqu'un d'autre"]
    climat:
      bas:
        - {si: "role == president && annee >= 2037", texte: "Les socios se sont réunis ici sans vous, dans la petite salle. Ils ont commandé des cafés et rien d'autre. Des gens qui ne mangent pas préparent un vote."}
        - {si: "role == president", texte: "Vos actionnaires ont déjeuné ici avec un avocat. Ils ont parlé bas et laissé le dessert. On ne laisse pas mon dessert pour rien."}
        - {si: "role == selectionneur", texte: "Deux hommes de la Fédération ont dîné ici avec un sélectionneur étranger. Ils ont parlé de contrats, de dates, et de vous. Pas en mal. Au passé."}
        - "Le président a déjeuné avec le directeur sportif d'un autre club, ici, à la vue de tous. Il voulait qu'on le voie. Je crois que c'est vous qui deviez le voir."
      moyen:
        - {si: "role == president && annee >= 2037", texte: "Les socios déjeunent ici le dimanche, en famille. Ils parlent du parking, des prix, du temps. Pas de vous. C'est une forme de paix."}
        - {si: "role == president", texte: "Vos actionnaires viennent le premier jeudi, comme toujours. Ils prennent le plat du jour et ne demandent pas la carte des vins."}
        - {si: "role == selectionneur", texte: "Les gens de la Fédération dînent ici les soirs de match et commandent ce que commande leur président. Ils attendent ses goûts pour avoir les leurs."}
        - "Le président mange vite, ces temps-ci, sans regarder son assiette. Il n'est ni content ni fâché. Il est pressé."
      haut:
        - {si: "role == president && annee >= 2037", texte: "Les socios ont réservé toute la salle pour fêter le classement, à leurs frais. Ils ont levé leur verre à la présidence. Le mot exact, c'était : « à la nôtre »."}
        - {si: "role == president", texte: "Vos actionnaires ont pris mon menu en sept plats et parlé de l'avenir jusqu'à minuit. Vous étiez dedans, à chaque plat."}
        - {si: "role == selectionneur", texte: "Le président de la Fédération a dîné ici et m'a demandé la recette du gratin, pour sa femme. Il ne la demande que les soirs où tout va bien."}
        - "Le président a reçu ici un banquier et il a dit votre nom deux fois, en souriant. Je le sais : je découpais le gigot à côté."
    repliques:
      - {lien: 0, texte: "J'ai été le chef de Léon pendant vingt-deux ans. Quand il a vendu, je n'ai pas changé la carte. J'ai changé le sel. Personne ne l'a vu ; tout le monde l'a dit."}
      - {lien: 1, texte: "La photo de 1962 est restée au-dessus de la banquette. Léon l'a laissée avec les murs. Je l'époussette le lundi. Les joueurs dessus ont l'âge de mes clients."}
      - {lien: 2, texte: "Les dirigeants mangent comme ils négocient : ceux qui coupent tout avant de commencer, ceux qui piquent dans l'assiette des autres. Je sais qui signe rien qu'aux couverts."}
      - {lien: 2, si: "annee >= 2024 && annee <= 2027", texte: "Le docteur du club dîne ici le mardi, seul, une tablette à côté de l'assiette. Il prend des notes entre deux bouchées. Je crois qu'il note ce que mangent les autres tables."}
      - {lien: 3, texte: "La cuisine a une porte sur la ruelle, pour les livraisons. Si quelqu'un doit dîner avec vous sans passer par la salle, il passe par les cuisines. On a l'habitude."}
      - {lien: -1, texte: "Vous pouvez attendre au bar. La salle est pleine. Elle se videra pour vous plus tard."}
      - {lien: -2, texte: "On m'a demandé ce que vous aviez commandé, et avec qui. J'ai donné le menu. Le reste, je l'ai oublié : c'est mon métier d'oublier, sauf quand on me fâche."}
    tuyaux:
      - id: pelissou_ober
        si: "flag(histoire_h8)"
        texte: "Le docteur Ober dîne ici le mardi avec un homme du fonds. Ils ne parlent pas de médecine. Ils parlent de courbes, surtout de la vôtre. Le docteur a dit : « Trois heures par nuit, et ça baisse. »"
      - id: pelissou_douze
        si: "flag(histoire_h10) && saison >= 3"
        texte: "La petite salle est réservée pour le soir de l'assemblée : douze couverts, au nom de Nino, payés d'avance par une société de la capitale. On ne réserve pas douze couverts pour perdre un vote."
    service:
      lien: 3
      label: "Dîner à l'office"
      texte: "Raoul te fait dîner à l'office, derrière la cuisine, avec ton invité, entre les sacs de farine. Personne ne vous voit ; le lendemain, tout le monde parle du gratin."
      effets: {jauges: {direction: 2, vestiaire: 1}}


# Où les nouveaux visages attendent quand une carte les fait parler sans dire de lieu
# (leurs cartes de palier, content/cards/common/paliers_ville_club.yaml).
rencontres:
  mireille: clubhouse
  pujade: buvette
  pujade_fils: buvette
  plassard: materiel
  rouquette: materiel
  lulu_gardien: stade
  remi_gendreau: stade
  thevenot: centre
  fournel: centre
  vidalie: terrain
  vidalie_fils: terrain
  rivoire: muscu
  duclou: gareRoutiere
  combaz: boutique
  arnal: boutique
  bretaud: brasserie
  pelissou: brasserie

# Les gestes qu'on fait avec quelqu'un, bornés à son époque : un point de lien (au plus
# un entre deux cartes) et une habitude. Les activités déjà écrites que seuls
# l'entraîneur et le joueur font sont rattachées plus haut (`activites:` de chacun).
activites:
  - id: josiane_courrier
    lieu: clubhouse
    objet: secretariat
    roles: [ds, president, selectionneur]
    si: "annee <= 2031"
    avec: josiane
    habitude: travail
    label: "Le courrier avec Josiane"
    texte: "Madame Josiane ouvre les enveloppes au coupe-papier ; toi, tu tries. La Ligue, les factures, les supporters. Elle lit toujours les supporters en premier."
    tranches: 1
    jauges: {direction: 2}
    heures: [matin, aprem]
    jours: [lun, mar, mer, jeu, ven]
  - id: mireille_cahier
    lieu: clubhouse
    objet: secretariat
    roles: [president, ds]
    si: "annee >= 2032"
    avec: mireille
    habitude: travail
    label: "Le cahier de Mireille"
    texte: "Mireille relit la semaine avec toi, page à page, crayons de couleur en main. Le vert, le rouge, le bleu. Elle ne te dit pas ce que veut dire le bleu."
    tranches: 1
    jauges: {direction: 2}
    heures: [matin, aprem]
    jours: [lun, mar, mer, jeu, ven]
  - id: pujade_demi
    lieu: buvette
    objet: comptoir
    roles: [president, ds, selectionneur]
    si: "annee <= 2013"
    avec: pujade
    habitude: comptoir
    label: "Un demi chez Firmin"
    texte: "Firmin tire le demi en deux fois et racle la mousse au couteau. Il le pose sur un sous-bock du derby de 1977, le dernier qui lui reste. « Celui-là, tu me le rends. »"
    tranches: 1
    francs: -8
    jauges: {tribunes: 1}
    heures: [midi, aprem, soir]
  - id: pujade_fils_demi
    lieu: buvette
    objet: comptoir
    roles: [president, ds, selectionneur]
    si: "annee >= 2014"
    avec: pujade_fils
    habitude: comptoir
    label: "Un café chez Jo"
    texte: "Jo te sert un café serré au bout du zinc, sous les écharpes. Il parle de la pluie, du fût de la veille, de son père. Jamais du club. C'est toi qui finis par en parler."
    tranches: 1
    francs: -4
    jauges: {tribunes: 1}
    heures: [midi, aprem, soir]
  - id: gege_table
    lieu: buvette
    roles: [entraineur, ds, selectionneur]
    si: "annee <= 2040"
    avec: gege
    habitude: comptoir
    label: "La table de Gégé"
    texte: "Gégé te fait asseoir à sa table, dos au mur, face à la porte. Au premier demi, il ne dit rien. Au second, il te raconte la Nord comme on annonce le temps qu'il fera."
    tranches: 1
    francs: -8
    jauges: {tribunes: 2}
    heures: [midi, soir]
  - id: nino_comptes
    lieu: buvette
    roles: [ds, president, selectionneur]
    si: "annee >= 2020"
    avec: nino
    habitude: quartier
    label: "Les comptes de Nino"
    texte: "Nino étale sur le zinc les reçus des déplacements de la Nord et te fait compter avec lui. Il compte vite, toi lentement. Vous ne tombez jamais sur le même chiffre."
    tranches: 1
    jauges: {tribunes: 1}
    heures: [aprem, soir]
  - id: plassard_atelier
    lieu: materiel
    objet: filets
    roles: [entraineur, president, ds]
    si: "annee <= 2008"
    avec: plassard
    habitude: travail
    label: "Recoudre avec Hector"
    texte: "Hector te fait recoudre la lucarne gauche à l'aiguille de bois. Il compte tes nœuds à voix basse, défait le troisième, et te rend l'aiguille : « Encore. »"
    tranches: 1
    jauges: {vestiaire: 1}
    heures: [matin, aprem, soir]
  - id: rouquette_chasubles
    lieu: materiel
    objet: chasubles
    roles: [ds, president, selectionneur]
    si: "annee >= 2009"
    avec: rouquette
    habitude: travail
    label: "Les chasubles avec Gaëtan"
    texte: "Gaëtan plie les chasubles en triangle, comme des drapeaux, et t'en fait plier vingt. La vingt et unième est enfin droite. Il la met sur le dessus de la pile."
    tranches: 1
    jauges: {vestiaire: 1}
    heures: [matin, aprem, soir]
  - id: lulu_gardien_loge
    lieu: stade
    roles: [entraineur, joueur, president, ds]
    si: "annee <= 2006"
    avec: lulu_gardien
    habitude: quartier
    label: "Un café à la loge"
    texte: "Lulu te sert le café du thermos dans le capuchon, le seul gobelet de la loge. Le chien pose la tête sur ta chaussure. Au mur, le registre est ouvert à la page du jour."
    tranches: 1
    jauges: {tribunes: 1}
    heures: [matin, soir]
  - id: remi_gendreau_ronde
    lieu: stade
    roles: [ds, president, selectionneur]
    si: "annee >= 2007"
    avec: remi_gendreau
    habitude: nuit
    label: "La ronde avec Rémi"
    texte: "La ronde de onze heures avec Rémi, lampe éteinte pour ménager les piles. La radio de son père grésille sur la fréquence des stadiers. Vous ne parlez pas. C'est bien."
    tranches: 1
    jauges: {tribunes: 1}
    heures: [soir, nuit]
  - id: thevenot_redactions
    lieu: centre
    objet: devoirs
    roles: [president, ds, selectionneur]
    si: "annee <= 2012"
    avec: thevenot
    habitude: famille
    label: "Les rédactions du centre"
    texte: "Maurice te donne une pile de rédactions à corriger : « Mon club et moi ». Une sur deux parle de la Nord. Une sur trois, d'un père qui ne vient pas aux matchs."
    tranches: 1
    jauges: {vestiaire: 1}
    heures: [aprem]
    jours: [mer, sam]
  - id: fournel_seance
    lieu: centre
    roles: [ds, president, selectionneur]
    si: "annee >= 2013"
    avec: fournel
    habitude: sport
    label: "La séance de Nadège"
    texte: "Nadège te met un sifflet dans la main et t'envoie arbitrer les moins de treize ans. Au deuxième coup de sifflet raté, elle siffle à ta place, deux doigts dans la bouche."
    tranches: 1
    jauges: {vestiaire: 1}
    heures: [aprem]
    jours: [mer, sam]
  - id: vidalie_tonte
    lieu: terrain
    roles: [president, ds, selectionneur]
    si: "annee <= 2012"
    avec: vidalie
    habitude: travail
    label: "La tonte avec Germain"
    texte: "Germain te laisse pousser la tondeuse sur une bande, une seule, et marche derrière en corrigeant la ligne du pied. « Droit, ce n'est pas tout droit. C'est sans hésiter. »"
    tranches: 1
    jauges: {vestiaire: 1}
    heures: [matin, aprem]
  - id: vidalie_fils_mesures
    lieu: terrain
    roles: [ds, president, selectionneur]
    si: "annee >= 2013"
    avec: vidalie_fils
    habitude: travail
    label: "Les mesures de Thomas"
    texte: "Thomas plante sa sonde tous les dix pas et lit les chiffres à voix haute ; tu les tapes. À la fin, il pose la paume à plat sur le rond central, et hoche la tête."
    tranches: 1
    jauges: {vestiaire: 1}
    heures: [matin, aprem]
  - id: steph_series
    lieu: muscu
    objet: banc
    roles: [entraineur, president, ds]
    si: "annee <= 2014"
    avec: steph
    habitude: sport
    label: "Une série avec Steph"
    texte: "Steph te pare au développé couché, deux doigts sous la barre, sans jamais la toucher. À la dernière répétition, il souffle : « Tu l'as. » Tu l'avais, de justesse."
    tranches: 1
    francs: -10
    jauges: {vestiaire: 1}
    heures: [matin, aprem, soir]
  - id: rivoire_sac
    lieu: muscu
    objet: sac
    roles: [ds, president, selectionneur]
    si: "annee >= 2015"
    avec: rivoire
    habitude: sport
    label: "Le sac avec Teddy"
    texte: "Teddy te bande les mains, serré, en croisant entre les doigts, puis tient le sac. « Pas fort. Juste. » Au dixième coup, le sac bouge enfin comme il veut."
    tranches: 1
    francs: -10
    jauges: {vestiaire: 1}
    heures: [matin, aprem, soir]
  - id: norbert_quai
    lieu: gareRoutiere
    objet: bancs
    roles: [entraineur, joueur, president, ds]
    si: "annee <= 2010"
    avec: norbert
    habitude: quartier
    label: "Le quai avec Norbert"
    texte: "Norbert t'offre un café du distributeur et vous regardez partir le car de Portclair. Il connaît les passagers à leurs bagages. Il ne dit jamais leurs noms."
    tranches: 1
    heures: [matin, soir]
  - id: duclou_ligne
    lieu: gareRoutiere
    roles: [ds, president, selectionneur]
    si: "annee >= 2011"
    avec: duclou
    habitude: quartier
    label: "Un tour de ligne"
    texte: "Tu fais la ligne 4 en entier, sur le siège derrière Karine : la Rive, le Pont, la Tréfilerie. Elle te montre la ville à ce que les gens portent quand ils montent."
    tranches: 2
    heures: [matin, soir]
  - id: combaz_pliage
    lieu: boutique
    objet: maillots
    roles: [entraineur, president, ds]
    si: "annee <= 2014"
    avec: combaz
    habitude: quartier
    label: "Plier avec Arlette"
    texte: "Arlette te montre comment on plie un maillot pour la vitrine : les manches dans le dos, le numéro en face. Elle refait les tiens sans un mot, puis te tend la pile suivante."
    tranches: 1
    jauges: {tribunes: 1}
    heures: [aprem]
    jours: [mer, sam]
  - id: arnal_commandes
    lieu: boutique
    objet: caisse
    roles: [ds, president]
    si: "annee >= 2015"
    avec: arnal
    habitude: quartier
    label: "Les colis avec Lou"
    texte: "Lou te fait coller les étiquettes des commandes en ligne. La capitale, l'étranger, et une adresse rue des Lilas, à trois cents mètres. Celle-là, elle la livre à pied."
    tranches: 1
    jauges: {tribunes: 1}
    heures: [aprem]
    jours: [mer, sam]
  - id: bretaud_cafe
    lieu: brasserie
    objet: caisse
    roles: [president, ds, selectionneur]
    si: "annee <= 2016"
    avec: bretaud
    habitude: comptoir
    label: "Un café chez Léon"
    texte: "Léon te sert le café au comptoir, pas en salle : « Au comptoir, on entend mieux. » Derrière toi, à la table du fond, deux hommes parlent d'argent sans dire un chiffre."
    tranches: 1
    francs: -4
    jauges: {direction: 1}
    heures: [midi, soir]
  - id: pelissou_essai
    lieu: brasserie
    objet: passe
    roles: [ds, president, selectionneur]
    si: "annee >= 2017"
    avec: pelissou
    habitude: comptoir
    label: "L'essai du jeudi"
    texte: "Raoul pose sur le passe-plat deux cuillères d'un plat sans nom. « Le jeudi, c'est l'essai. Dites-moi si c'est trop salé : je saurai que c'est juste. »"
    tranches: 1
    jauges: {direction: 1}
    heures: [midi, soir]
    jours: [jeu]

# Les scènes de leur vie (format : en-tête de content/ville/scenes_communes.yaml) : quand
# le lien a monté, quand il a gelé, et la dette qu'on vient réclamer (`dette_<id>`,
# rejouable jusqu'à ce qu'on y réponde : les deux choix l'effacent).
scenes:
  # ───────────────────────────────────────────────────────────── Madame Josiane
  - id: club.josiane.machine
    titre: "La touche e"
    roles: [entraineur, joueur]
    lieu: clubhouse
    tranches: [matin, aprem]
    qui: josiane
    si: "relation.josiane >= 2 && annee < 2000"
    texte: "La touche e de la machine à écrire reste enfoncée. Madame Josiane te tend un crayon : « Tenez-la relevée pendant que je tape la lettre du président. Elle a beaucoup de e. »"
    choix:
      - label: "Je tiens la touche"
        reponse: "Quarante lignes, le crayon sous la touche, ton coude contre son épaule. Elle tape sans une faute. À la fin, elle dit : « Vous avez la main sûre. » Venant d'elle, c'est énorme."
        effets: {jauges: {direction: 1}}
      - label: "Je vous en offre une"
        francs: -400
        reponse: "Elle accepte le carton et le range sous son bureau, sans l'ouvrir. La vieille machine continue de taper, avec un crayon coincé dessous. La neuve attend son tour."
        effets: {jauges: {direction: 2}}
  - id: club.josiane.plante
    titre: "La plante du palier"
    lieu: clubhouse
    tranches: [matin]
    qui: josiane
    si: "relation.josiane >= 1 && annee >= 2014 && annee <= 2031"
    texte: "Madame Josiane arrose la plante du palier avec une carafe du secrétariat. « Je l'ai rempotée en 1987. Je viendrai tant qu'elle vivra. Elle le sait, je crois. »"
    choix:
      - label: "Je l'arroserai aussi"
        reponse: "Elle te tend la carafe et te regarde verser. « Pas trop. Elle est comme les présidents : trop d'eau, ça pourrit par le pied. » Elle reprend la carafe. Tu as compris."
        effets: {jauges: {direction: 1}}
      - label: "Elle vous survivra"
        reponse: "« C'est tout ce que je lui demande. » Elle remet la carafe à sa place, essuie le cercle d'eau sur le palier avec son mouchoir, et redescend sans se tenir à la rampe."
  - id: club.josiane.froid
    titre: "Le reçu en deux exemplaires"
    lieu: clubhouse
    tranches: [matin, aprem]
    qui: josiane
    si: "relation.josiane <= -2 && annee <= 2031"
    texte: "Madame Josiane pose ton courrier sur le guichet avec un reçu en deux exemplaires. « Signez ici. Et là. » Elle ne lève pas les yeux. La tasse du radiateur a disparu."
    choix:
      - label: "Je signe"
        reponse: "Tu signes deux fois. Elle détache ton exemplaire au millimètre et te le tend du bout des doigts. Le guichet se referme avant que tu aies tourné le dos."
        effets: {jauges: {direction: -1}}
      - label: "Je vous dois des excuses"
        reponse: "« Lesquelles ? » Elle attend. Tu les dis toutes, mal. Elle range le reçu sans le faire signer. Le lendemain, il y a de nouveau une tasse sur le radiateur. Vide."
        effets: {relation: {josiane: 1}}
  - id: club.josiane.dette
    titre: "Trois jours"
    lieu: clubhouse
    tranches: [matin, aprem]
    qui: josiane
    si: "flag(dette_josiane)"
    rejouable: true
    texte: "Madame Josiane ferme la porte du secrétariat. « Je dois trois jours à ma sœur, à l'hôpital de Portclair. Personne au premier ne doit savoir que ce bureau est vide. Vous tiendrez le téléphone ? »"
    choix:
      - label: "Je tiendrai le téléphone"
        reponse: "Trois jours au standard. Tu dis « Madame Josiane est en rendez-vous » quarante fois. Au premier, on finit par demander quel rendez-vous dure trois jours. Tu ne sais pas mentir mieux."
        effets: {jauges: {direction: -2}, clear: [dette_josiane]}
      - label: "Je ne peux pas"
        reponse: "Elle hoche la tête et rouvre la porte. Le lendemain, elle est à son bureau, les yeux rouges, et elle tape plus fort que d'habitude. Elle ne t'a rien demandé, dira-t-elle."
        effets: {relation: {josiane: -2}, clear: [dette_josiane]}

  # ─────────────────────────────────────────────────────────────────── Mireille
  - id: club.mireille.dimanche
    titre: "Un dimanche à Saint-Aubin"
    roles: [president, ds]
    lieu: clubhouse
    tranches: [aprem]
    jours: [ven]
    qui: mireille
    si: "relation.mireille >= 2 && annee <= 2040"
    texte: "Mireille range ses crayons par couleur. « Ma tante a demandé de vos nouvelles. Elle demande rarement. Je vais la voir dimanche, à la maison de retraite. Vous viendriez ? »"
    choix:
      - label: "J'irai dimanche"
        reponse: "Dimanche, Madame Josiane te reconnaît à la porte, avant Mireille. Elle te demande l'heure du premier courrier. Tu dis neuf heures dix. Elle sourit, et ne dit plus rien."
        effets: {relation: {josiane: 1}}
      - label: "Pas ce dimanche"
        reponse: "Mireille note « pas ce dimanche » au crayon, dans la marge. Chez elle, le crayon veut dire : pas encore. Elle ne te reposera pas la question. Elle attendra que tu la poses."

  # ───────────────────────────────────────────────────────────── Firmin Pujade
  - id: club.pujade.fisc
    titre: "La lettre de mars"
    lieu: buvette
    tranches: [aprem]
    qui: pujade
    si: "relation.pujade >= 2 && annee <= 2013"
    texte: "Firmin pose une lettre à en-tête sur le zinc, entre deux verres. « Le fisc. Un contrôle, en mars. Ils veulent mes cahiers depuis 1985. Mes cahiers, c'est l'ardoise. L'ardoise, c'est la Nord. »"
    choix:
      - label: "Je vous prête de quoi"
        francs: -400
        reponse: "Il compte les billets sans les regarder et les range sous la caisse, pas dans la boîte à cigares. « Pas avec l'ardoise. Ça, c'est entre nous. » Il te sert sans te faire payer jusqu'en mars."
        effets: {jauges: {tribunes: 2}}
      - label: "Prenez un comptable"
        reponse: "« Un comptable, c'est quelqu'un qui compte devant moi. » Il range la lettre sous le zinc. Il servira la Nord avec ce pli entre les sourcils jusqu'en mars, et la Nord le verra."
        effets: {jauges: {tribunes: -1}}
  - id: club.pujade.fils
    titre: "Le fils sous le zinc"
    lieu: buvette
    tranches: [aprem]
    qui: pujade
    si: "relation.pujade >= 1 && annee >= 1999 && annee <= 2006"
    texte: "Le fils de Firmin fait ses devoirs au bout du zinc, entre les sous-bocks. Firmin, à voix basse : « Il veut arrêter l'école pour la buvette. Dis-lui, toi. Moi, il ne m'écoute plus. »"
    choix:
      - label: "Je lui parle"
        reponse: "Jo t'écoute en essuyant un verre, exactement comme son père. À la fin, il te demande seulement : « Et vous, vous l'avez finie, l'école ? » Firmin rit pour la première fois du mois."
        effets: {jauges: {tribunes: 1}}
      - label: "C'est à vous de le dire"
        reponse: "Firmin hoche la tête et retourne à la tireuse. Ce soir-là, il ferme plus tôt. On voit de la lumière dans l'arrière-salle jusqu'à minuit, et deux voix, l'une plus haute que l'autre."
  - id: club.pujade.dette
    titre: "Rendre à l'ardoise"
    lieu: buvette
    tranches: [aprem, soir]
    qui: pujade
    si: "flag(dette_pujade)"
    rejouable: true
    texte: "Firmin essuie le zinc devant toi, longtemps. « L'avance, tu la rends à l'ardoise, pas à moi. Samedi, la tournée de la Nord, toute la Nord. Tu la paies devant eux. »"
    choix:
      - label: "Je paierai la tournée"
        francs: -400
        reponse: "Samedi, Firmin crie ton nom à la cantonade et tire les demis à la chaîne. La Nord trinque sans savoir pourquoi. Firmin efface une ligne de l'ardoise, la plus vieille."
        effets: {jauges: {tribunes: 1}, clear: [dette_pujade]}
      - label: "Pas ce samedi"
        reponse: "« Pas ce samedi. » Il le répète en hochant la tête, et écrit ton nom à la craie, en haut de l'ardoise, au-dessus de tous les autres. Tout le monde peut le lire."
        effets: {relation: {pujade: -2}, clear: [dette_pujade]}

  # ──────────────────────────────────────────────────────────────── Jo Pujade
  - id: club.pujade_fils.boite
    titre: "La boîte à cigares"
    roles: [president, ds, selectionneur]
    lieu: buvette
    tranches: [aprem, soir]
    qui: pujade_fils
    si: "relation.pujade_fils >= 2"
    texte: "Jo ouvre devant toi la boîte à cigares de son père. Des bouts de papier pliés, des dettes de quarante ans : « Bon pour un fût, Gégé, 1977. » « Il m'a dit d'en faire ce que je voudrais. »"
    choix:
      - label: "Brûlez les vieilles dettes"
        reponse: "Jo les brûle une à une dans le cendrier du zinc. Celle de Gégé, il la garde : « Celle-là, il voudra la payer lui-même. » La buvette sent le papier brûlé jusqu'au soir."
        effets: {jauges: {tribunes: 2}}
      - label: "Gardez-les"
        reponse: "Il referme la boîte. « Mon père disait qu'une dette, c'est une adresse. » Il la remet sous la caisse, à sa place, et sert les trois clients qui attendaient sans rien dire."
        effets: {jauges: {direction: 1}}

  # ────────────────────────────────────────────────────────────────────── Gégé
  - id: club.gege.bache
    titre: "La bâche à recoudre"
    lieu: buvette
    tranches: [midi, soir]
    qui: gege
    si: "relation.gege >= 2 && annee < 2036"
    texte: "Gégé a étalé la bâche de 1971 sur trois tables de la buvette. Une déchirure longue comme un bras, au milieu du R. Il te tend une aiguille à voile : « Mes doigts ne passent plus. »"
    choix:
      - label: "Je couds"
        reponse: "Deux heures, à points serrés, sous l'œil de la Nord accoudée au zinc. Ta couture est laide et elle tient. Gégé passe la main dessus. « Comme mon père. Lui aussi cousait mal. »"
        effets: {jauges: {tribunes: 2}}
      - label: "Je tiens la bâche"
        reponse: "Tu tends la toile pendant qu'un gamin de la Nord coud, à grands points. Gégé compte à voix haute. À la fin, il te fait signer au feutre, au dos, dans un coin. « Pour qu'on sache qui tenait. »"
        effets: {jauges: {tribunes: 1}}
  - id: club.gege.hanche
    titre: "Six heures, l'hôpital"
    lieu: buvette
    tranches: [soir]
    qui: gege
    si: "relation.gege >= 2 && annee >= 2024 && annee <= 2036"
    texte: "Gégé, à voix basse, le dos à la salle : « Lundi, six heures, l'hôpital de Portclair. La hanche. Le petit travaille. Personne ne doit savoir, sinon ils viendront tous avec des drapeaux. »"
    choix:
      - label: "Je vous emmène"
        reponse: "À six heures, il t'attend devant le local, la bâche pliée sous le bras, « pour l'hôpital ». Il ne la déplie pas. Il la garde sur ses genoux jusqu'au bloc."
        effets: {jauges: {tribunes: 2}}
      - label: "Nino peut le faire"
        reponse: "« Nino a son travail. » Il prend le car de six heures, seul. Au retour, la Nord apprend l'opération par une infirmière, et elle se demande où tu étais."
        effets: {jauges: {tribunes: -1}}
  - id: club.gege.froid
    titre: "Le classeur des autres"
    lieu: buvette
    tranches: [midi, soir]
    qui: gege
    si: "relation.gege <= -2 && annee < 2040"
    texte: "Gégé ne lève pas les yeux. Sur le zinc, le classeur des autres, ouvert à ta page. « Assieds-toi si tu veux. On parlera de 1977. Pas de toi. »"
    choix:
      - label: "Parlons de 1977"
        reponse: "Il parle une heure : la descente, la bâche déchirée, son père. À la fin, il referme le classeur sans y penser, ta page dedans, et pousse un demi vers toi."
        effets: {relation: {gege: 1}}
      - label: "Je ne reste pas"
        reponse: "Il tourne la page, une seule. Au local, ce soir, on raconte que tu n'as même pas voulu entendre 1977. Ça se raconte plus vite qu'une victoire."
        effets: {jauges: {tribunes: -2}}
  - id: club.gege.dette
    titre: "Dix minutes au local"
    lieu: buvette
    tranches: [midi, soir]
    qui: gege
    si: "flag(dette_gege)"
    rejouable: true
    texte: "Gégé pose son verre. « On s'est calmés pour toi. Samedi, avant le match, tu descends au local et tu parles à la Nord. Dix minutes, sans micro, debout. »"
    choix:
      - label: "J'y descendrai"
        reponse: "Dix minutes debout sur un banc du local. Tu parles mal ; ils écoutent bien. Le lendemain, L'Écho en fait un titre, et en haut, au club, on n'aime pas du tout ce titre."
        effets: {jauges: {direction: -2, tribunes: 1}, clear: [dette_gege]}
      - label: "Ce n'est pas ma place"
        reponse: "Gégé hoche la tête, une fois. « On s'est calmés pour toi. On ne se calmera plus pour rien. » Ta place sous la bâche, il la donne à quelqu'un d'autre le samedi suivant."
        effets: {relation: {gege: -2}, clear: [dette_gege]}

  # ────────────────────────────────────────────────────────────────────── Nino
  - id: club.nino.tambour
    titre: "Le tambour crevé"
    roles: [ds, president, selectionneur]
    lieu: buvette
    tranches: [aprem, soir]
    qui: nino
    si: "relation.nino >= 2"
    texte: "Nino pose sur le zinc le grand tambour de la Nord, la peau fendue d'un bord à l'autre. « Celui de 1971. Le luthier de Portclair veut le double de ce que j'ai. Tu mets la moitié ? »"
    choix:
      - label: "Je mets la moitié"
        francs: -200
        reponse: "Nino recompte devant toi, deux fois, et écrit ta part au feutre à l'intérieur du fût, là où personne ne regarde. « Pour que mon oncle le sache. Lui, il regarde partout. »"
        effets: {jauges: {tribunes: 2}}
      - label: "Ce n'est pas mon tambour"
        reponse: "« Personne ne dit que c'est le tien. » Il repart avec le fût sous le bras. Samedi, la Nord chante sans tambour, et pour une fois on entend tout ce qu'elle dit."
        effets: {jauges: {tribunes: -1}}
  - id: club.nino.dette
    titre: "L'enveloppe du Terminus"
    roles: [ds, president, selectionneur]
    lieu: buvette
    tranches: [soir]
    qui: nino
    si: "flag(dette_nino)"
    rejouable: true
    texte: "Nino glisse une enveloppe épaisse sous ta soucoupe. « L'arrière-salle du Terminus, ce soir, à l'homme au gilet. Moi, on m'y attend trop. Toi, on ne te connaît pas encore. »"
    choix:
      - label: "Je la porte"
        reponse: "L'homme au gilet compte devant toi, sans se presser. « Il en manque. Dites-lui que ça ira pour ce mois-ci. » En sortant, quelqu'un te reconnaît sous l'enseigne, et le dit."
        effets: {jauges: {direction: -2}, clear: [dette_nino]}
      - label: "Porte-la toi-même"
        reponse: "Nino reprend l'enveloppe et la glisse dans sa veste. « Je m'en souviendrai. » Il le dit sans colère, et c'est pire. Samedi, la Nord chante pour l'équipe et pas un mot pour toi."
        effets: {relation: {nino: -2}, clear: [dette_nino]}

  # ──────────────────────────────────────────────────────────── Hector Plassard
  - id: club.plassard.inventaire
    titre: "L'inventaire de juin"
    lieu: materiel
    tranches: [matin, aprem]
    qui: plassard
    si: "relation.plassard >= 1 && phase == bilan && annee <= 2008"
    texte: "Juin, l'inventaire. Hector recompte les maillots une troisième fois. Il en manque un, le 14 de la réserve. « Un gamin. Je sais lequel. Je le note au registre, ou je ne sais rien ? »"
    choix:
      - label: "Vous ne savez rien"
        francs: -60
        reponse: "Hector écrit « usure normale » et te tend la facture du maillot, à ton nom. « Il faut bien un nom. » Le gamin ne saura jamais que tu as payé pour qu'il garde le 14."
        effets: {jauges: {vestiaire: 2}}
      - label: "Notez-le"
        reponse: "Il le note, nom et prénom. En septembre, le gamin n'est pas reconduit, pour d'autres raisons, dit le club. Hector efface la ligne au crayon, trop tard."
        effets: {jauges: {direction: 1, vestiaire: -1}}
  - id: club.plassard.retraite
    titre: "La dernière clé"
    lieu: materiel
    tranches: [matin, aprem]
    qui: plassard
    si: "relation.plassard >= 2 && annee >= 2007 && annee <= 2008"
    texte: "Hector part à la retraite vendredi. Il passe ses clés au petit Rouquette une par une, en disant à quoi chacune sert. « Viens, toi aussi. Il faut un témoin, pour les clés. »"
    choix:
      - label: "Je serai le témoin"
        reponse: "Vingt-trois clés. La dernière, Hector la garde : « Celle-là n'ouvre plus rien. C'est la mienne. » Gaëtan note tout au registre. Hector signe en bas, d'une main qui ne tremble pas."
        effets: {jauges: {vestiaire: 2}}
      - label: "Je n'aime pas les adieux"
        reponse: "« Moi non plus. » Il fait l'inventaire seul avec Gaëtan et part sans pot. Sur le registre, la dernière ligne est de sa main : « Rien ne manque. »"

  # ─────────────────────────────────────────────────────────── Gaëtan Rouquette
  - id: club.rouquette.sac
    titre: "Le sac oublié"
    roles: [ds, president, selectionneur]
    lieu: materiel
    tranches: [matin, aprem]
    qui: rouquette
    si: "relation.rouquette >= 2"
    texte: "Gaëtan referme un sac de sport oublié au local. « Dans la poche du devant, une lettre d'agent. Une offre, pour un de vos joueurs, datée d'hier. Je la remets où elle était ? »"
    choix:
      - label: "Remettez-la"
        reponse: "Il la glisse dans la poche, la fermeture à moitié tirée, comme il l'avait trouvée. Le joueur reprend son sac le soir. Il ne saura jamais qu'on a lu, ni que tu as choisi de ne pas savoir."
        effets: {jauges: {vestiaire: 2}}
      - label: "Donnez-la-moi"
        reponse: "Tu la lis au local, debout. Un club de la capitale, un chiffre, une date. Tu sais avant ton joueur ce que vaut ton joueur. Il le sentira à ta poignée de main, demain."
        effets: {jauges: {direction: 1, vestiaire: -1}}

  # ───────────────────────────────────────────────────────────── Lulu Gendreau
  - id: club.lulu.chien
    titre: "Le chien de la loge"
    lieu: stade
    tranches: [soir, nuit]
    qui: lulu_gardien
    si: "relation.lulu_gardien >= 2 && annee <= 2006"
    texte: "Lulu à genoux dans la loge, le chien couché sur la couverture, qui respire mal. « Je ne conduis pas, et le vétérinaire de garde est à Portclair. Tu as une voiture, toi. »"
    choix:
      - label: "Je vous emmène"
        reponse: "Le vétérinaire de garde ouvre en pyjama. Le chien tiendra encore un hiver. Lulu ne dit pas merci ; toute la semaine, il te garde le capuchon du thermos plein."
        effets: {jauges: {tribunes: 1}}
      - label: "Demain matin"
        reponse: "Le chien passe la nuit sur la couverture, Lulu assis à côté, sans dormir, comme toujours. Au matin, le chien mange. Lulu, lui, ne te regarde plus tout à fait pareil."
        effets: {relation: {lulu_gardien: -1}}
  - id: club.lulu.registre
    titre: "Le registre d'honneur"
    lieu: stade
    tranches: [matin]
    qui: lulu_gardien
    si: "relation.lulu_gardien >= 1 && annee <= 2006"
    texte: "Lulu ouvre sur le comptoir de la loge un registre relié de cuir, plus vieux que lui. « Le registre d'honneur. Un ministre de 1977, un chanteur, un évêque. Signe à la page du jour. »"
    choix:
      - label: "Je signe"
        reponse: "Tu signes sous un ministre et un chanteur dont plus personne ne se souvient. Lulu sèche l'encre de son souffle. « Dans cinquante ans, ils se demanderont qui tu étais. »"
        effets: {jauges: {tribunes: 1}}
      - label: "Je ne suis personne"
        reponse: "« Justement. » Il referme le registre. Sur la tranche, au crayon, il écrit quand même la date du jour, et un petit trait dessous."
  - id: club.lulu.grille
    titre: "La grille fermée"
    lieu: stade
    tranches: [soir, nuit]
    qui: lulu_gardien
    si: "relation.lulu_gardien <= -2 && annee <= 2006"
    texte: "La grille du stade est fermée. Derrière, Lulu, sa lampe à la main, ne bouge pas. « Vingt-deux heures. Le règlement, c'est pour tout le monde, maintenant. Toi compris. »"
    choix:
      - label: "J'attends qu'il ouvre"
        reponse: "Il ouvre au bout d'un quart d'heure, sans un mot, et note l'heure au registre, l'heure exacte. La ligne sera lue, et toi, tu sais par qui."
        effets: {jauges: {direction: -1}}
      - label: "Je lui parle"
        reponse: "« Parle. » Tu parles. Il écoute jusqu'au bout, la main sur le cadenas. Puis il ouvre. Au registre, il laisse la ligne vide, et c'est sa façon de répondre."
        effets: {relation: {lulu_gardien: 1}}

  # ───────────────────────────────────────────────────────────── Rémi Gendreau
  - id: club.remi.registre
    titre: "Le registre de mon père"
    roles: [ds, president, selectionneur]
    lieu: stade
    tranches: [soir]
    qui: remi_gendreau
    si: "relation.remi_gendreau >= 2 && annee >= 2020"
    texte: "Rémi pose sur le muret le registre de son père, 1971-2006. « L'Écho veut le publier pour l'anniversaire du club. Il y a des heures dedans que certains ne veulent pas relire. Je le donne ? »"
    choix:
      - label: "Gardez-le à la loge"
        reponse: "« C'est ce que je voulais entendre. » Il le remet sur l'étagère, ouvert à la dernière page de son père, et pose la radio dessus, comme un presse-papier."
        effets: {jauges: {tribunes: 1}}
      - label: "Donnez-le à L'Écho"
        reponse: "L'Écho publie six pages du registre, un dimanche. Trois anciens présidents appellent le club le lundi. Rémi ne décroche pour aucun. Les tribunes, elles, ont tout lu."
        effets: {jauges: {tribunes: 2, direction: -2}}

  # ────────────────────────────────────────────────────────── Maurice Thévenot
  - id: club.thevenot.cuisine
    titre: "La porte de la cuisine"
    lieu: centre
    tranches: [aprem]
    qui: thevenot
    si: "relation.thevenot >= 2 && annee <= 2012"
    texte: "Mercredi, quatre heures. Un gamin du centre n'est pas revenu du déjeuner. Maurice ne téléphone à personne : il s'assoit sur la marche de la cuisine. « Il revient toujours par là. »"
    choix:
      - label: "J'attends avec lui"
        reponse: "À sept heures, le gamin revient par la cuisine, trempé. Maurice lui tend une serviette sans une question. Le gamin te regarde : tu n'en poses pas non plus."
        effets: {jauges: {vestiaire: 1}}
      - label: "Appelons les gendarmes"
        reponse: "Les gendarmes trouvent le gamin à la gare routière, à minuit. Il ne revient pas au centre. Le lendemain, Maurice défait son lit, seul, et plie les draps en quatre."
        effets: {jauges: {vestiaire: -1, direction: 1}}
  - id: club.thevenot.maillot
    titre: "Le premier maillot de Tibo"
    roles: [selectionneur]
    lieu: centre
    tranches: [aprem]
    qui: thevenot
    si: "flag(histoire_h7) && flag(h7_rance_mort) && relation.thevenot >= 1"
    texte: "Maurice tient un petit maillot bordeaux, numéro 8, taille douze ans. « Son premier, au centre. Sa mère vient s'asseoir la nuit dans le hall de l'hôtel. Moi, je n'ose pas. Toi, tu y dors. »"
    choix:
      - label: "Je le lui porterai"
        reponse: "La mère de Tibo prend le maillot plié, le déplie, le replie autrement, à sa façon. « Il le pliait comme ça. » Elle ne pleure pas devant toi. Elle attend que tu aies quitté le hall."
        effets: {relation: {rance_mere: 1}}
      - label: "Gardez-le au centre"
        reponse: "Maurice l'épingle au tableau des résultats, entre deux classements de 2003. Les gamins passent devant sans savoir. Lui sait, et il ne l'enlève pas."

  # ──────────────────────────────────────────────────────────── Nadège Fournel
  - id: club.fournel.lits
    titre: "Six lits"
    roles: [ds, president]
    lieu: centre
    tranches: [aprem]
    qui: fournel
    si: "relation.fournel >= 2"
    texte: "Nadège te montre un couloir de six lits faits au carré. « Le budget ferme ce dortoir en septembre. Six gamins rentrent chez eux, sauf si quelqu'un trouve l'argent. Vous, par exemple. »"
    choix:
      - label: "Je trouve l'argent"
        reponse: "Les six lits restent. Nadège colle une étiquette au pied de chacun, avec le prénom du gamin et l'année. « Pour qu'on sache qui on a gardé, et grâce à qui. »"
        effets: {jauges: {vestiaire: 2, caisse: -2}}
      - label: "On fera avec moins"
        reponse: "En septembre, six gamins rentrent chez eux. Nadège les accompagne au car un par un, et ne reprend sa séance qu'après le dernier. Elle ne t'en parle plus."
        effets: {jauges: {vestiaire: -1, caisse: 1}}

  # ──────────────────────────────────────────────────────────── Germain Vidalie
  - id: club.vidalie.riverains
    titre: "Les riverains"
    lieu: terrain
    tranches: [matin]
    qui: vidalie
    si: "relation.vidalie >= 2 && annee <= 2012"
    texte: "Germain te tend une lettre des riverains : la tondeuse à six heures, ils n'en peuvent plus. « J'ai écrit une réponse. Elle pèse plus lourd avec deux signatures. »"
    choix:
      - label: "Je signe"
        reponse: "Ta signature sous la sienne. Les riverains retirent leur plainte en voyant ton nom. Germain tond à six heures, comme avant, et te salue de la casquette chaque matin."
        effets: {jauges: {vestiaire: 1}}
      - label: "Tondez plus tard"
        reponse: "Germain tond à neuf heures. La pelouse est moins belle d'un rien que personne ne voit, sauf lui. Les riverains, eux, te disent bonjour, pour la première fois."
        effets: {jauges: {tribunes: 1}}
  - id: club.vidalie.gel
    titre: "Nuit de gel"
    lieu: terrain
    tranches: [soir]
    qui: vidalie
    si: "relation.vidalie >= 1 && phase == hiver && annee <= 2012"
    texte: "Moins six annoncé. Germain, seul sur la Rive à la nuit tombée, tire les bâches sur la surface de réparation, à genoux. Il ne t'appelle pas. Il te regarde arriver."
    choix:
      - label: "Je l'aide"
        reponse: "Deux heures à tirer des bâches dans le froid. À la fin, il te tend sa flasque. Tu bois : c'est du thé. Il rit de ta tête pour la première fois depuis que tu le connais."
        effets: {jauges: {vestiaire: 2}}
      - label: "Rentrez, Germain"
        reponse: "Il ne rentre pas. De ta voiture, tu le vois seul, une bâche sur le dos comme une cape. Samedi, le match se joue, et la surface de réparation est parfaite."

  # ──────────────────────────────────────────────────────────── Thomas Vidalie
  - id: club.vidalie_fils.carnets
    titre: "Les carnets de pelouse"
    roles: [ds, president, selectionneur]
    lieu: terrain
    tranches: [matin, aprem]
    qui: vidalie_fils
    si: "relation.vidalie_fils >= 2"
    texte: "Thomas a trouvé dans un carnet de son père, à une date de 1987 : « arrosé la nuit, sur ordre, pelouse lourde pour le derby ». « L'Écho cherche des souvenirs pour l'anniversaire. Je leur donne ? »"
    choix:
      - label: "Laissez dormir"
        reponse: "Thomas range le carnet avec les autres, dans le local de la tondeuse. « Mon père aurait dit la même chose. Il ne racontait que ce qui poussait. »"
        effets: {jauges: {direction: 1}}
      - label: "Racontez-le"
        reponse: "L'Écho publie la page du carnet. Les anciens rient, la Ligue n'appelle pas. Thomas encadre la page dans le local de la tondeuse, à côté de la photo de son père."
        effets: {jauges: {tribunes: 1, direction: -1}}

  # ────────────────────────────────────────────────────────────────────── Steph
  - id: club.steph.licence
    titre: "La licence de 1981"
    lieu: muscu
    tranches: [soir]
    qui: steph
    si: "relation.steph >= 2 && annee <= 2014 && !flag(h3_douche)"
    texte: "Steph sort d'un tiroir sa licence de 1981, la photo collée de travers. « Le genou a lâché à Portclair, à la soixantième. Le Doc a dit : six semaines. Je les compte encore. »"
    choix:
      - label: "Montrez-moi le genou"
        reponse: "Il remonte la jambe du survêtement : deux cicatrices en croix. « Le Doc a fait la première. La deuxième, c'est un autre, en ville, qui posait moins de questions. »"
        effets: {jauges: {vestiaire: 1}}
      - label: "Vous auriez pu revenir"
        reponse: "« Avec ce qu'il y a dans l'armoire, peut-être. » Il range la licence et ferme le tiroir à clé. Il ne parle plus de genou de la soirée, ni de la semaine."
  - id: club.steph.miroir
    titre: "Le miroir fendu"
    roles: [entraineur, president, ds]
    lieu: muscu
    tranches: [matin, aprem]
    qui: steph
    si: "relation.steph >= 1 && annee <= 2014 && !flag(h3_douche)"
    texte: "Le grand miroir de la salle est fendu d'un coup de poing, en étoile. Steph : « Un de tes gars, hier soir, après la séance. Je ne dis pas lequel. Le miroir, c'est le club qui paie, ou toi ? »"
    choix:
      - label: "Je paie"
        francs: -150
        reponse: "Steph range les billets dans la caisse sans les compter. « Ton gars ne saura jamais. C'est ça, une bonne affaire. » Le miroir neuf reflète tout le monde un peu plus grand."
        effets: {jauges: {vestiaire: 2}}
      - label: "Le club paiera"
        reponse: "La facture part au club, avec le nom du joueur. Le lendemain, tout le vestiaire sait qui, et surtout comment on l'a su. Personne ne te le reproche en face."
        effets: {jauges: {vestiaire: -1, direction: 1}}
  - id: club.steph.dette
    titre: "Vitamines"
    lieu: muscu
    tranches: [aprem, soir]
    qui: steph
    si: "flag(dette_steph)"
    rejouable: true
    texte: "Steph pose une feuille tapée sur le banc. « Deux inspecteurs sont passés. Ça dit que mes boîtes sont des vitamines. Signé par quelqu'un comme toi, ça pèse. Tu me dois une boîte. »"
    choix:
      - label: "Je signe"
        reponse: "Steph plie la feuille en quatre et la range dans l'armoire du fond, avec le reste. « Vitamines. C'est presque vrai. » Ta signature dort désormais à côté des boîtes."
        effets: {jauges: {direction: -2}, clear: [dette_steph]}
      - label: "Je ne signe pas ça"
        reponse: "Il reprend la feuille sans insister. « Alors cette salle ne te connaît pas. » Le lendemain, ton cran au feutre a disparu du montant du banc, gratté au couteau."
        effets: {relation: {steph: -2}, clear: [dette_steph]}

  # ───────────────────────────────────────────────────────────── Teddy Rivoire
  - id: club.rivoire.tapis
    titre: "Deux heures du matin"
    roles: [ds, president, selectionneur]
    lieu: domicile
    tranches: [nuit]
    qui: rivoire
    si: "relation.rivoire >= 2"
    texte: "Deux heures du matin, on frappe. Teddy, sur ton palier, en survêtement : « Viens à la salle. Un de tes joueurs dort sur le tapis du fond. Il ne veut pas rentrer, ni que je vienne te chercher. »"
    choix:
      - label: "J'arrive"
        reponse: "Ton joueur dort sur le tapis, ses chaussures alignées à côté. Teddy et toi le regardez dormir jusqu'à cinq heures sans le réveiller. Toi, tu ne dormiras pas cette nuit."
        effets: {jauges: {vestiaire: 2}, var: {h8_nuits: "+1"}}
      - label: "Ramène-le chez lui"
        reponse: "Teddy le ramène en voiture. Le lendemain, ton joueur arrive à l'heure, rasé de près, et ne te regarde pas une seule fois de toute la séance."
        effets: {jauges: {vestiaire: -1}}

  # ──────────────────────────────────────────────────────────────────── Norbert
  - id: club.norbert.permis
    titre: "Le permis de Norbert"
    lieu: gareRoutiere
    tranches: [matin, soir]
    qui: norbert
    si: "relation.norbert >= 2 && annee < 2002"
    texte: "Norbert, au quai trois, plie et replie une convocation de la gendarmerie. « Un contrôle au pont, un verre de trop. Trois mois de permis, et le car de samedi part sans moi. »"
    choix:
      - label: "Je paie l'amende"
        reponse: "Tu paies au guichet de la gendarmerie, à ton nom. Norbert garde son permis et le car du samedi. Il ne dit pas merci ; il te garde le siège derrière lui jusqu'en juin."
        effets: {var: {ville_amende: "+300"}, jauges: {tribunes: 1}}
      - label: "C'est votre affaire"
        reponse: "Trois mois sans permis. Le car du club part avec un chauffeur de Portclair qui se trompe deux fois de route. Les joueurs arrivent au stade d'en face, fatigués et en retard."
        effets: {jauges: {vestiaire: -1}}
  - id: club.norbert.dernier_car
    titre: "Le dernier voyage"
    lieu: gareRoutiere
    tranches: [matin]
    qui: norbert
    si: "relation.norbert >= 1 && annee == 2002 && phase == bilan"
    texte: "Le club a vendu le car. Norbert le conduit une dernière fois jusqu'au dépôt de l'acheteur, à Portclair, à vide. Il t'ouvre la porte avant, d'un geste. « Il reste une place. »"
    choix:
      - label: "Je monte"
        reponse: "Deux heures de route, personne d'autre que toi derrière lui. Il ne parle pas. Au dépôt, il dévisse le rétroviseur intérieur et le met dans sa poche. Personne ne le lui reproche."
        effets: {jauges: {tribunes: 1}}
      - label: "Je n'aime pas les adieux"
        reponse: "Le car part à six heures pile. Au coin de la rue, il klaxonne deux fois, longtemps. Tout le quartier se met à la fenêtre, et toi aussi, finalement."
  - id: club.norbert.dette
    titre: "Un ami sur la liste"
    lieu: gareRoutiere
    tranches: [matin, soir]
    qui: norbert
    si: "flag(dette_norbert)"
    rejouable: true
    texte: "Norbert, au quai trois, sans te regarder : « Un ami doit voyager avec le club samedi. Sur la liste, comme accompagnateur. Il ne parlera à personne, et il paiera sa place. »"
    choix:
      - label: "Je l'inscris"
        francs: 150
        sale: true
        reponse: "L'homme monte avec une sacoche, ne dit pas un mot et descend avant le stade d'en face. Au retour, Norbert te tend une enveloppe, les billets pliés en long. Tu ne l'ouvres pas devant lui."
        effets: {jauges: {direction: -1}, clear: [dette_norbert]}
      - label: "Pas sur ma liste"
        reponse: "« Comme vous voudrez. » Il rabat la porte du car. Le samedi suivant, ton sac voyage dans la soute, sous les autres, et il arrive mouillé."
        effets: {relation: {norbert: -2}, clear: [dette_norbert]}

  # ───────────────────────────────────────────────────────────── Karine Duclou
  - id: club.duclou.dernier_car
    titre: "Le gamin du dernier car"
    roles: [ds, president]
    lieu: gareRoutiere
    tranches: [nuit]
    qui: duclou
    si: "relation.duclou >= 2 && annee >= 2013"
    texte: "Quai du dernier car, onze heures. Karine, moteur tournant, la portière ouverte : « Un gamin de votre centre est assis au fond, avec un sac, pour la capitale. Je peux annoncer une panne. »"
    choix:
      - label: "Annoncez la panne"
        reponse: "Le car s'arrête au dépôt, « panne ». Le gamin redescend, furieux, et marche jusqu'au centre. Nadège l'attend sur la marche de la cuisine, comme Monsieur Maurice avant elle."
        effets: {jauges: {vestiaire: 1}}
      - label: "Laissez-le partir"
        reponse: "Le gamin descend à la capitale à trois heures du matin. Il signe dans un grand club au printemps. Il ne revient jamais à la Rive, même pour jouer contre."
        effets: {jauges: {vestiaire: -1}}

  # ──────────────────────────────────────────────────────────── Arlette Combaz
  - id: club.combaz.cahier
    titre: "Le cahier de mon frère"
    lieu: boutique
    tranches: [aprem]
    qui: combaz
    si: "relation.combaz >= 2 && annee <= 2014"
    texte: "Arlette pose sur la caisse un cahier d'écolier, 1962-1989 : chaque vente de son frère, et le temps qu'il faisait. « L'Écho le voudrait pour une page. Je n'ose pas. Vous, vous oseriez ? »"
    choix:
      - label: "Je le porte à L'Écho"
        reponse: "L'Écho publie une page entière : trente ans de ventes et de météo. Les anciens découpent l'article. Arlette en fait encadrer un, qu'elle accroche derrière la caisse."
        effets: {jauges: {tribunes: 2}}
      - label: "Gardez-le pour vous"
        reponse: "Elle le range dans le double fond de la caisse, avec ce qu'on lui confie. « C'est ce qu'il aurait dit, lui aussi. » Elle te fait un prix sur l'écharpe que tu n'achetais pas."
  - id: club.combaz.rendues
    titre: "Les écharpes rendues"
    lieu: boutique
    tranches: [aprem]
    jours: [sam]
    qui: combaz
    si: "relation.combaz >= 1 && serie_d >= 1 && annee <= 2014"
    texte: "Onze écharpes sur le comptoir, pliées, avec leur ticket. Rendues après la défaite. Arlette : « Je les rembourse, ou je les garde pour quand ça ira mieux ? Le règlement, c'est vous. »"
    choix:
      - label: "Remboursez-les"
        reponse: "Onze remboursements. Le samedi suivant, sept de ces écharpes reviennent à la boutique, rachetées par les mêmes, qui ne parlent pas du ticket."
        effets: {jauges: {tribunes: 1, caisse: -1}}
      - label: "Gardez-les"
        reponse: "Elle les range dans un carton marqué « pour plus tard », sous le comptoir. Le carton reste là, et chaque défaite y ajoute une écharpe."
        effets: {jauges: {tribunes: -1}}

  # ──────────────────────────────────────────────────────────────── Lou Arnal
  - id: club.arnal.faux
    titre: "Les faux maillots"
    roles: [ds, president]
    lieu: boutique
    tranches: [aprem]
    qui: arnal
    si: "relation.arnal >= 2"
    texte: "Lou pose sur la caisse un maillot du club, le blason mal brodé. « Le marché du dimanche en vend trois cartons. C'est un gamin de la Nord qui les fait venir. Je préviens qui, moi ? »"
    choix:
      - label: "Laissez les gamins"
        reponse: "Lou rachète au gamin son dernier carton, au prix coûtant, et lui donne un vrai maillot en échange. Au marché, les faux continuent ; ils ont maintenant le bon blason."
        effets: {jauges: {tribunes: 2, caisse: -1}}
      - label: "Prévenez la police"
        reponse: "Les gendarmes saisissent trois cartons au marché. Le gamin était le petit-fils d'un abonné de la Nord. La Nord le sait le soir même, et elle sait aussi qui a prévenu."
        effets: {jauges: {caisse: 1, tribunes: -2}}

  # ────────────────────────────────────────────────────────────── Léon Brétaud
  - id: club.bretaud.photo
    titre: "Derrière la photo"
    lieu: brasserie
    tranches: [midi]
    qui: bretaud
    si: "relation.bretaud >= 1 && annee <= 2016"
    texte: "La photo de 1962 est tombée pendant le service. Léon tient le cadre fendu à deux mains. « Il faut la raccrocher avant le dîner. Tenez l'escabeau. Ou faites-la encadrer à neuf. »"
    choix:
      - label: "Je tiens l'escabeau"
        reponse: "Derrière le cadre, au crayon, de la main de son père : la date, le score, et « tournée générale ». Léon raccroche la photo, un peu plus droite qu'avant."
        effets: {jauges: {direction: 1}}
      - label: "Un cadre neuf"
        francs: -200
        reponse: "Le cadre neuf brille trop. Léon le regarde une semaine, puis remet l'ancien, avec le neuf par-dessus, pour ne vexer personne. Ça fait deux cadres. Ça tient."
        effets: {jauges: {tribunes: 1}}
  - id: club.bretaud.chef
    titre: "Le chef s'en va"
    lieu: brasserie
    tranches: [soir]
    qui: bretaud
    si: "relation.bretaud >= 2 && annee >= 2010 && annee <= 2016"
    texte: "Léon, la serviette sur le bras : « Raoul veut partir. Un restaurant à Portclair, avec une étoile au-dessus de la porte. Vingt ans qu'il est dans ma cuisine. Parlez-lui, vous. »"
    choix:
      - label: "Je lui parle"
        reponse: "Raoul t'écoute en épluchant ses échalotes. À la fin, il dit seulement : « Si je reste, je veux la brasserie, un jour. » Derrière la porte, Léon a entendu. Il ne dit pas non."
        effets: {jauges: {direction: 1}}
      - label: "Qu'il parte"
        reponse: "Raoul part trois mois à Portclair. Il revient en mai, sans un mot, et reprend son tablier au clou. Léon ne lui demande rien. Le plat du jour a pris du goût."
  - id: club.bretaud.dette
    titre: "La plonge du jeudi"
    lieu: brasserie
    tranches: [midi]
    qui: bretaud
    si: "flag(dette_bretaud)"
    rejouable: true
    texte: "Léon, à voix basse : « Jeudi midi, la Ligue déjeune ici, douze couverts. Mon plongeur est malade. Il me faut quelqu'un en cuisine, que personne ne regarde. Vous me devez une table. »"
    choix:
      - label: "Je ferai la plonge"
        reponse: "Trois heures de plonge, un tablier trop grand. Par le passe-plat, tu entends la Ligue parler de ton club comme d'un dossier. Au dessert, un délégué te reconnaît et sourit."
        effets: {jauges: {direction: -2}, clear: [dette_bretaud]}
      - label: "Trouvez quelqu'un d'autre"
        reponse: "« Je trouverai. » Il trouve. Mais la table du fond, désormais, est prise les jours où tu viens, et Léon ne s'en excuse pas."
        effets: {relation: {bretaud: -2}, clear: [dette_bretaud]}

  # ───────────────────────────────────────────────────────────── Raoul Pélissou
  - id: club.pelissou.traiteur
    titre: "Le traiteur du stade"
    roles: [ds, president, selectionneur]
    lieu: brasserie
    tranches: [soir]
    qui: pelissou
    si: "relation.pelissou >= 2"
    texte: "Raoul pose un contrat sur le passe-plat. « Le traiteur du stade, toutes les buvettes, cinq ans. Il faut baisser mes prix et servir sous plastique. Vous feriez quoi, à ma place ? »"
    choix:
      - label: "Prenez le contrat"
        reponse: "Raoul signe. Les sandwichs du stade montent de prix, et ils deviennent bons. La Nord râle à l'entrée et en redemande à la mi-temps."
        effets: {jauges: {direction: 1, tribunes: -1}}
      - label: "Restez ici"
        reponse: "Raoul refuse. Le contrat part à une chaîne de la capitale. Sous plastique, les sandwichs du stade ; la Nord vient manger chez Raoul après le match."
        effets: {jauges: {tribunes: 1}}

  # ─────────────────────────────────────────────── ce que la ville dit de toi : le sport
  - id: club.rep.sport.chrono
    titre: "Un tour de piste"
    lieu: terrain
    tranches: [matin]
    si: "flag(rep_sport)"
    texte: "Six heures et demie, la piste autour de la Rive. Le jardinier t'attend avec un chronomètre de 1970. « On dit en ville que tu cours tous les matins. Un tour. Je veux voir. »"
    choix:
      - label: "Je cours"
        reponse: "Un tour à fond, les poumons en feu. Il arrête le chrono et le range sans te montrer le chiffre. « Bien. Demain, je cours avec toi. » Il ne court pas. Il est là quand même."
        effets: {jauges: {vestiaire: 1}}
      - label: "Un autre jour"
        reponse: "« Les autres jours, tu cours sans moi. » Il repart vers la tondeuse. Le lendemain, à six heures et demie, il est sur la piste, avec le chrono, et il n'en parle pas."
  - id: club.rep.sport.photographe
    titre: "La page trois"
    lieu: muscu
    tranches: [matin, soir]
    si: "flag(rep_sport)"
    texte: "À la salle, un photographe de L'Écho t'attend entre deux bancs. « On dit que vous venez tous les jours. Une photo à la barre, pour dimanche ? La ville aime ceux qui transpirent. »"
    choix:
      - label: "Une seule photo"
        reponse: "Dimanche, ta photo en page trois, la barre au-dessus de la tête. Légende : « Au moins quelqu'un pousse, cette saison. » Au club, en haut, on n'aime pas du tout la légende."
        effets: {jauges: {tribunes: 2, direction: -1}}
      - label: "Pas de photo"
        reponse: "Il range son appareil. Dimanche, la page trois montre la salle vide, à six heures, une serviette sur un banc. Tout le monde reconnaît la serviette."
        effets: {jauges: {tribunes: 1}}
  - id: club.rep.sport.course
    titre: "Jusqu'au pont"
    lieu: rue
    tranches: [aprem]
    qui: enfant
    si: "flag(rep_sport)"
    texte: "Trois gamins du square te barrent le trottoir, un ballon sous le bras. « On dit que tu cours tous les matins. Une course jusqu'au pont. Si tu perds, tu paies les glaces. »"
    choix:
      - label: "Je cours"
        francs: -20
        reponse: "Tu perds d'une longueur, exprès ou pas, tu ne sais plus. Les glaces coûtent ce qu'elles coûtent. Le soir, tout le square sait que tu as perdu, et que tu as payé."
        effets: {jauges: {tribunes: 1}}
      - label: "Pas en ville"
        reponse: "« Trouillard ! » Ils le crient jusqu'au pont. Le lendemain, le mot est écrit à la craie sur le mur de la boulangerie, avec une flèche vers ta rue."
        effets: {jauges: {tribunes: -1}}

  # ──────────────────────────────────────────────── ce que la ville dit de toi : le travail
  - id: club.rep.travail.soupe
    titre: "La lumière du premier"
    roles: [entraineur, president, ds, selectionneur]
    lieu: clubhouse
    tranches: [soir]
    si: "flag(rep_travail)"
    texte: "Dix heures du soir, ton bureau. La femme de ménage frappe avec son chariot. « On dit en ville que vous dormez ici. J'ai fait trop de soupe. » Elle pose un thermos sur le coin du bureau."
    choix:
      - label: "Merci, madame"
        reponse: "La soupe est aux poireaux, trop salée, parfaite. Le thermos reste sur ton bureau une semaine ; elle ne le réclame pas. Le lundi suivant, il est de nouveau plein."
        effets: {jauges: {vestiaire: 1}}
      - label: "Je rentre bientôt"
        reponse: "« C'est ce qu'ils disent tous. » Elle passe la serpillière autour de tes pieds. À minuit, la lumière du premier est encore allumée, et la ville le sait déjà."
        effets: {jauges: {direction: 1}}
  - id: club.rep.travail.voisine
    titre: "Le dimanche existe"
    roles: [entraineur, president, ds, selectionneur]
    lieu: domicile
    tranches: [nuit]
    qui: passante
    si: "flag(rep_travail)"
    texte: "Minuit, l'escalier de ton immeuble. La voisine du dessus, en robe de chambre : « Je vous entends rentrer à cette heure-là depuis un mois. Vous savez que le dimanche existe ? »"
    choix:
      - label: "Je prendrai mon dimanche"
        reponse: "Dimanche, tu dors jusqu'à dix heures. Le lundi, il y a trois dossiers de plus sur ton bureau, et personne ne te demande comment était ton dimanche."
        effets: {jauges: {direction: -1}}
      - label: "Le dimanche, c'est demain"
        reponse: "Elle soupire et remonte. Tu travailles le dimanche. Le lundi, un de tes joueurs t'appelle « patron » sur un ton que tu n'aimes pas, et que tu as mérité."
        effets: {jauges: {direction: 1, vestiaire: -1}}
  - id: club.rep.travail.cle
    titre: "La clé au bout d'une ficelle"
    roles: [entraineur, president, ds, selectionneur]
    lieu: clubhouse
    tranches: [soir]
    qui: ancien
    si: "flag(rep_travail)"
    texte: "Le gardien de nuit du club-house te tend une clé au bout d'une ficelle. « C'est toujours vous qui partez après tout le monde. Je préfère que vous fermiez vous-même. »"
    choix:
      - label: "Je la prends"
        reponse: "La clé pèse plus lourd qu'une clé. Désormais, c'est toi qui éteins le club-house, et c'est toi qu'on appelle quand l'alarme sonne à trois heures."
        effets: {jauges: {direction: 1}}
      - label: "Je partirai plus tôt"
        reponse: "« On verra. » Il garde la clé. À onze heures, à sa ronde, la lumière du premier est encore allumée. Il frappe deux coups au plafond avec sa lampe, et sourit."

# Ce que les gens disent de toi quand l'habitude est devenue une réputation.
paroles:
  - qui: ancien
    sujet: toi
    si: "flag(rep_sport)"
    texte: "Je promène le chien à six heures, et vous courez déjà le long de la Rive. Le chien vous connaît mieux que moi, maintenant. Il tire vers vous."
  - qui: enfant
    sujet: toi
    si: "flag(rep_sport)"
    texte: "Mon grand frère dit que tu fais cent pompes avant le café. Moi, j'en fais dix. Il dit que c'est pareil, à mon âge."
  - qui: passante
    sujet: toi
    si: "flag(rep_sport)"
    texte: "Vous passez en survêtement sous mes fenêtres tous les matins, à la même minute. J'ai réglé mon réveil sur vous. Ne tombez pas malade."
  - qui: passant
    sujet: toi
    si: "flag(rep_travail)"
    texte: "La lumière du premier, au club-house, s'éteint à minuit, ces temps-ci. On dit que c'est vous. On dit aussi que ça ne sert à rien. On verra."
  - qui: ancien
    sujet: toi
    si: "flag(rep_travail)"
    texte: "Quelqu'un qui dort au club, on en a eu un, en soixante-dix. Il a fait monter l'équipe, et il est mort à cinquante ans. Mangez, au moins."
  - qui: passant
    sujet: toi
    si: "flag(rep_travail)"
    texte: "Ma femme fait le ménage au club-house. Le matin, elle vous trouve la tête sur un dossier, la lampe allumée. Elle éteint sans vous réveiller."
