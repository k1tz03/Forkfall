    textes:
      - "Kader pose ton demi sur le sous-bock du club, un vieux, ramolli aux coins. Il te parle du club de son père, à Portclair, puis du tien, plus bas, quand quelqu'un entre."
      - "Kader essuie le zinc avec le torchon de Marcel, celui qui a un trou au milieu. « Il me l'a laissé avec le fonds. Je n'ose pas le jeter. Il essuie mal, mais il essuie pareil. »"
