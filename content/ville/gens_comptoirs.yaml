    textes:
      - "Lavergne sert les mariniers d'abord, toi ensuite. Il note le niveau de la Rive sur l'ardoise, sous les cotes du samedi, d'une écriture de comptable, les chiffres bien alignés."
      - "Une péniche corne sur le quai. Lavergne ne lève pas la tête ; il dit seulement le nom du bateau, et l'heure à laquelle il passera l'écluse. Il ne se trompe jamais de plus de cinq minutes."
