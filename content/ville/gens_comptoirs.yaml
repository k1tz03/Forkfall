    habitude: jeu
    tranches: 0
    francs: -5
  - id: vi_leon_auvent
    lieu: kiosque
    label: "L'Écho sous l'auvent"
    texte: "Tu lis L'Écho sous l'auvent du kiosque, à l'abri de la pluie. Léon range ses paquets autour de toi sans te demander de bouger, comme on contourne un meuble qu'on aime bien."
    si: "annee <= 2014"
    avec: leon
    habitude: culture
    tranches: 0
    francs: -4

  # — Le kiosque du quai, Samir (2015-2044)
  - id: vi_samir_journal
    lieu: kiosque
    label: "Le journal chez Samir"
    texte: "Samir te tend le journal plié dans un sachet, ton nom au feutre. Il te dit ce que le quai en pense avant que tu l'aies lu, pour que la page ne te prenne pas de court."
    si: "annee >= 2015 && annee <= 2044"
    avec: samir
    habitude: culture
    tranches: 0
    francs: -4
  - id: vi_samir_toit
    lieu: kiosque
    label: "Les nouvelles du toit"
    texte: "Le cousin de Samir appelle du toit de la tribune pendant que tu attends ta monnaie : un projecteur grillé, un jardinier en retard, un joueur qui s'entraîne seul. Samir répète tout."
    si: "annee >= 2015 && annee <= 2044"
    avec: samir
    habitude: quartier
    tranches: 0
    francs: 0

  # — La maison de la presse, Simone (1990-2019)
  - id: vi_simone_mots_croises
    lieu: presse
    objet: comptoir
    label: "Les mots croisés de Simone"
    texte: "Simone fait les mots croisés de L'Écho au stylo. Elle te demande un mot en sept lettres pour « ce qu'on perd le samedi ». Tu en trouves un ; ce n'est pas le bon. Elle l'écrit quand même."
    si: "annee <= 2019"
    avec: simone
    habitude: culture
    tranches: 0
    francs: 0

  # — La maison de la presse, Delphine (2020-2050)
  - id: vi_delphine_journal
    lieu: presse
    objet: journaux
    label: "Le journal de Delphine"
    texte: "Delphine te garde un journal dans le sachet de sa mère, celui à l'ancien logo. Elle te lit les gros titres pendant que tu cherches ta monnaie, sur le ton de la météo marine."
    si: "annee >= 2020"
    avec: delphine
    habitude: culture
    tranches: 0
    francs: -3
  - id: vi_delphine_cartes
    lieu: presse
    objet: vignettes
    label: "Les cartes des gamins"
    texte: "Tu achètes une pochette de cartes pour les gamins assis sur la marche. Delphine te regarde la leur donner. « Ma mère faisait pareil. Elle disait que ça achète le quartier. »"
    si: "annee >= 2020"
    avec: delphine
    habitude: quartier
    tranches: 0
    francs: -4

  # — L'Écho, Pierre Massenet (1990-1999)
  - id: vi_massenet_cafe
    lieu: echo
    objet: bureau_redacteur
    label: "Un café chez Massenet"
    texte: "Massenet te sert un café de la machine qui fait un bruit de rotative. Il ouvre son carnet, le referme, le rouvre. « Donnez-moi quelque chose, je vous donnerai quelque chose. »"
    si: "annee <= 1999"
    avec: meneche
    habitude: culture
    tranches: 1
    francs: 0
    heures: [matin, aprem]
  - id: vi_massenet_archives
    lieu: echo
    objet: archives
    label: "Les archives avec Massenet"
    texte: "Massenet descend avec toi aux archives et ouvre une reliure au hasard, une année de défaites. « 1983. Même mois, même classement. Lisez la suite, vous gagnerez du temps. »"
    si: "annee <= 1999"
    avec: meneche
    habitude: culture
    tranches: 1
    francs: 0

  # — L'Écho, Étienne (2000-2050)
  - id: vi_etienne_epreuves
    lieu: echo
    objet: epreuves
    label: "Les épreuves avec Étienne"
    texte: "Étienne te laisse lire les épreuves de demain, debout près de la machine. Il ne t'empêche de rien ; il regarde seulement où s'arrêtent tes yeux, et il le note."
    si: "annee >= 2000"
    avec: etienne
    habitude: culture
    tranches: 0
    francs: 0
    heures: [aprem, soir]
  - id: vi_etienne_bouclage
    lieu: echo
    objet: bureau_redacteur
    label: "Le bouclage du soir"
    texte: "Dix heures du soir, le bouclage. Étienne coupe trois lignes à un article sur le club et t'en lit une, pour savoir si elle tient. Tu dis oui. Il la coupe quand même."
    si: "annee >= 2000"
    avec: etienne
    habitude: travail
    tranches: 1
    francs: 0
    heures: [soir]

# ═══════════════════════════════════════════════════════════════ LES SCÈNES
# La vie des gens (gardée par le lien), les dettes qu'on vient réclamer (une
# première fois, puis la suivante, rejouable), et les réputations du lot :
# comptoir, jeu, nuit, largesse (une douce, une amère chacune).
scenes:

  # ─────────────────────────────────────────────── Marcel, le Corner
  - id: vi.sc.marcel_murs
    titre: "Les murs du Corner"
    lieu: bar
    tranches: [aprem]
    qui: marcel
    si: "relation.marcel >= 2 && annee <= 2010"
    texte: "Marcel lit une lettre recommandée à bout de bras : « Le propriétaire des murs vend. Une brasserie de Portclair offre le double. Il me manque deux mois de recettes. »"
    choix:
      - label: "Je vous avance l'argent"
        francs: -500
        reponse: "Il compte les billets deux fois et les range sous la caisse, avec la licence. Le lundi, il appelle le propriétaire. La brasserie de Portclair n'a jamais su pourquoi."
        effets: {relation: {marcel: 1}, jauges: {tribunes: 2}}
      - label: "Vendez, Marcel"
        reponse: "« Vendre quoi ? Les murs ne sont pas à moi ; le comptoir, si. » Il replie la lettre en quatre et sert le demi suivant."
        effets: {relation: {marcel: -1}}

  - id: vi.sc.marcel_bagarre
    titre: "La bagarre du flipper"
    lieu: bar
    tranches: [midi, aprem]
    qui: marcel
    si: "relation.marcel >= 1 && annee <= 2016"
    texte: "Deux gars de la Nord se sont battus près du flipper ; la police veut fermer le Corner un mois. Marcel, une poche de glace sur la main : « Ils écoutent les gens connus. Dis-leur : une bousculade. »"
    choix:
      - label: "Je témoigne pour lui"
        reponse: "Le commissaire t'écoute, écrit « bousculade » et range le dossier. Le Corner rouvre le lendemain. Là-haut, on raconte que tu fréquentes les commissariats."
        effets: {relation: {marcel: 1}, jauges: {tribunes: 2, direction: -2}}
      - label: "Je n'ai rien vu"
        reponse: "Le Corner reste fermé trois semaines. La Nord boit à la buvette et parle de toi entre deux tournées. Marcel repeint sa porte, seul, en bordeaux."
        effets: {relation: {marcel: -1}, jauges: {tribunes: -2}}

  - id: vi.sc.marcel_vend
    titre: "Fonds à vendre"
    lieu: bar
    tranches: [aprem, soir]
    qui: marcel
    si: "relation.marcel >= 2 && annee >= 2014 && annee <= 2016"
    texte: "Sur la vitrine, une pancarte écrite à la main : FONDS À VENDRE. Marcel range les verres du fond. « Mes genoux. Le fils du petit Benhamou veut reprendre. Il lui manque la banque. »"
    choix:
      - label: "Je parle au banquier"
        reponse: "Le banquier t'écoute, ouvre le dossier du fils Benhamou et le referme plus lentement. En juin, la pancarte disparaît de la vitrine. Le papier du flipper, lui, reste."
        effets: {relation: {marcel: 1}, jauges: {tribunes: 2, direction: -1}}
      - label: "Ce n'est pas mon affaire"
        reponse: "« Non », dit Marcel. La pancarte reste six mois. Le fils Benhamou reprend quand même, en empruntant à sa famille, et il te sert après tout le monde."
        effets: {relation: {marcel: -1}}

  - id: vi.sc.marcel_froid
    titre: "Le verre retourné"
    lieu: bar
    tranches: [soir]
    qui: marcel
    si: "relation.marcel <= -2 && annee <= 2016"
    texte: "Sur le zinc, à ta place, un verre retourné, le fond en l'air. Les anciens de la Nord le regardent, puis te regardent. Marcel essuie la machine à café, le dos tourné."
    choix:
      - label: "Je retourne le verre"
        reponse: "Marcel le reprend et le pose dans l'évier. Personne ne te sert. Le lendemain, la Nord raconte la scène comme une victoire à l'extérieur."
        effets: {jauges: {tribunes: -2}}
      - label: "Je ressors"
        reponse: "La porte se referme doucement derrière toi. Marcel n'a jamais claqué une porte. Il n'en a pas besoin."
        effets: {jauges: {tribunes: -1}}

  - id: vi.sc.marcel_dette
    titre: "Le tablier de Marcel"
    lieu: bar
    tranches: [soir]
    qui: marcel
    si: "flag(dette_marcel)"
    texte: "Marcel te tend un tablier plié : « Samedi soir, je suis seul au comptoir. Mes genoux tiendront pas jusqu'à deux heures. Tu me dois une soirée ; c'est celle-là. »"
    choix:
      - label: "Je mets le tablier"
        reponse: "Tu sers jusqu'à deux heures. La Nord te regarde rincer les verres, puis te laisse un pourboire qu'elle n'a jamais laissé à Marcel. Là-haut, on l'apprend le lundi."
        effets: {jauges: {tribunes: 2, direction: -2}, clear: [dette_marcel]}
      - label: "Pas ce samedi"
        reponse: "Il reprend le tablier sans le déplier. « Pas ce samedi », répète-t-il, comme on note une date. Il sert seul, et il boite le lundi."
        effets: {relation: {marcel: -2}, clear: [dette_marcel]}

  - id: vi.sc.marcel_dette_bis
    titre: "La licence de nuit"
    lieu: bar
    tranches: [aprem]
    qui: marcel
    si: "flag(dette_marcel) && mission(vi.sc.marcel_dette)"
    rejouable: true
    texte: "Une lettre de la mairie sur le zinc : le Corner fermera à minuit, plus à deux heures. Marcel la pousse vers toi : « Ils t'écoutent, là-bas. Un mot de toi, et je garde mes deux heures. »"
    choix:
      - label: "J'écris à la mairie"
        reponse: "Ta lettre part le lundi ; la réponse revient le jeudi : deux heures, à l'essai. Marcel la punaise à côté de la licence, ton nom souligné au feutre."
        effets: {jauges: {direction: -1, tribunes: 1}, clear: [dette_marcel]}
      - label: "Ça, je ne peux pas"
        reponse: "« Tu pouvais. » Il range la lettre sous la caisse. À minuit pile, il éteint le néon pendant que la Nord a encore son verre à la main."
        effets: {relation: {marcel: -2}, jauges: {tribunes: -1}, clear: [dette_marcel]}

  # ─────────────────────────────────────────────── Kader, le Corner
  - id: vi.sc.kader_pere
    titre: "Le record de 1979"
    lieu: bar
    tranches: [aprem]
    qui: kader
    si: "relation.kader >= 2 && annee >= 2017"
    texte: "Un vieil homme pousse la porte du Corner, qu'il n'a pas passée depuis quarante ans, et regarde le papier jauni au-dessus du flipper. Kader, très bas : « C'est mon père. Il ose pas jouer. »"
    choix:
      - label: "Je lui offre une partie"
        francs: -5
        reponse: "Tu glisses une pièce. Le vieil homme joue sans enlever son manteau. Il ne bat pas son record ; il le regarde longtemps, puis il serre la main de son fils."
        effets: {relation: {kader: 1}, jauges: {tribunes: 1}}
      - label: "Je les laisse seuls"
        reponse: "Tu sors fumer dans la cour. Par la vitre, tu vois le père et le fils côte à côte devant la machine éteinte. Personne ne met de pièce."

  - id: vi.sc.kader_borne
    titre: "La borne de paris"
    lieu: bar
    tranches: [midi, aprem]
    qui: kader
    si: "relation.kader >= 1 && annee >= 2024"
    texte: "Une société de paris a laissé un contrat sur le zinc : une borne lumineuse à côté du flipper, trois cents écus par mois. Kader le fait glisser vers toi : « Toi, tu signerais ? »"
    choix:
      - label: "Signe, c'est de l'argent"
        reponse: "La borne arrive le lundi, bleue. Le jeudi, deux habitués de la Nord ne viennent plus ; le samedi, trois inconnus y misent sur ta défaite, debout devant le flipper."
        effets: {relation: {kader: -1}, jauges: {tribunes: -2}}
      - label: "Ne signe rien"
        reponse: "Il déchire le contrat en quatre et le jette dans le seau à glace. « Le flipper fait assez de lumière comme ça. »"
        effets: {relation: {kader: 1}, jauges: {tribunes: 2}}

  # ─────────────────────────────────────────────── Émile, le Terminus
  - id: vi.sc.emile_permis
    titre: "Le permis de car"
    lieu: terminus
    tranches: [matin]
    qui: emile
    si: "relation.emile >= 2 && annee <= 2009"
    texte: "Émile pose une lettre de la préfecture sur le zinc : son permis de car n'est pas renouvelé, à cause des yeux. « Plus jamais de car. Je voulais juste le conduire une dernière fois. »"
    choix:
      - label: "Je monte à côté de vous"
        reponse: "Un dimanche à l'aube, tu t'assois à côté de lui. Il fait trois tours de la cour au pas, phares allumés, puis il coupe le moteur et pose les deux mains sur le volant."
        effets: {relation: {emile: 1}}
      - label: "Il faut respecter ça"
        reponse: "« Je le respecte. » Il range la lettre sous la caisse. Le premier dimanche du mois, il démarre quand même le moteur, et le laisse tourner une heure, à l'arrêt."

  - id: vi.sc.emile_compteur
    titre: "Le compteur du téléphone"
    lieu: terminus
    tranches: [matin, aprem]
    qui: emile
    si: "relation.emile >= 1 && annee < 2000"
    texte: "Un jeune chauffeur a appelé sa mère au pays une heure entière du téléphone du comptoir, et n'a pas de quoi payer. Émile tient le compteur : « Il conduit le car de la Nord samedi. On fait quoi ? »"
    choix:
      - label: "Je paie l'appel"
        francs: -80
        reponse: "Tu poses les billets sur le compteur. Le jeune chauffeur ne sait pas quoi dire. Samedi, il conduit la Nord sans un à-coup, comme on porte quelque chose de fragile."
        effets: {relation: {emile: 1}, jauges: {tribunes: 1}}
      - label: "Sa compagnie paiera"
        reponse: "Émile appelle la compagnie. Le jeune chauffeur est retiré de la ligne du samedi ; son remplaçant se perd, et la Nord rate le coup d'envoi."
        effets: {jauges: {tribunes: -1}}

  - id: vi.sc.emile_vend
    titre: "Le Terminus à céder"
    lieu: terminus
    tranches: [aprem]
    qui: emile
    si: "relation.emile >= 2 && annee >= 2007 && annee <= 2009"
    texte: "Émile range ses verres dans un carton. « Le petit Mazet reprend, l'ancien chauffeur du car de la Nord. Il me paie en douze fois. Il me faut un témoin chez le notaire, quelqu'un qu'on croit. »"
    choix:
      - label: "Je serai votre témoin"
        reponse: "Chez le notaire, tu signes sous Émile. Il tient le stylo comme un volant, à deux mains. En sortant, il te sert un café dans un verre, le dernier qu'il sert."
        effets: {relation: {emile: 1, johnny: 1}, jauges: {tribunes: 1}}
      - label: "Prenez quelqu'un du quartier"
        reponse: "Il prend le boulanger. Le notaire lit lentement ; Émile regarde passer par la fenêtre le car de onze heures, sans toi."
        effets: {relation: {emile: -1}}

  # ─────────────────────────────────────────────── Johnny, le Terminus
  - id: vi.sc.johnny_moteur
    titre: "Le moteur du premier dimanche"
    lieu: terminus
    tranches: [matin]
    qui: johnny
    si: "relation.johnny >= 1 && annee >= 2019 && annee <= 2030"
    texte: "Premier dimanche du mois. Le vieux car d'Émile ne démarre plus. Johnny, les mains noires : « Émile l'a démarré quarante ans. Si le car meurt, la cour est vide. Tu pousses avec moi ? »"
    choix:
      - label: "Je pousse avec toi"
        reponse: "Vous poussez le car dans la pente de la cour. En bas, le moteur tousse, et prend. Johnny le laisse tourner une heure, les portes ouvertes, comme on aère une chambre."
        effets: {relation: {johnny: 1}}
      - label: "Vends-le à la ferraille"
        reponse: "« La ferraille paie au kilo. Émile payait au souvenir. » Le car reste dans la cour, muet ; Johnny n'y touche plus, et toi, il te sert sans parler."
        effets: {relation: {johnny: -1}}

  - id: vi.sc.johnny_ligne
    titre: "La ligne sans chauffeur"
    lieu: terminus
    tranches: [matin, midi]
    qui: johnny
    si: "relation.johnny >= 2 && annee >= 2038"
    texte: "Johnny tient une pétition contre le car sans chauffeur de la ligne de Valdorne : trois cents signatures, des chauffeurs, des vieux, une maîtresse d'école. « Il manque un nom qu'on connaît. »"
    choix:
      - label: "Je signe en haut"
        reponse: "Tu signes en haut de la première page. La pétition part à la mairie. Le car roule toujours sans chauffeur, mais on remet un homme à bord, le soir."
        effets: {relation: {johnny: 1}, jauges: {tribunes: 2, direction: -1}}
      - label: "Le progrès, c'est ça"
        reponse: "« Le progrès, c'est un car qui ne s'arrête plus pour les vieux. » Il range la pétition sous la caisse, à côté des horaires corrigés d'Émile."
        effets: {relation: {johnny: -1}}

  - id: vi.sc.johnny_dette
    titre: "Le dépôt de Valdorne"
    lieu: terminus
    tranches: [matin]
    qui: johnny
    si: "flag(dette_johnny)"
    texte: "Johnny essuie le même verre depuis cinq minutes : « Mon chauffeur de nuit a été suspendu. Ils disent qu'il avait bu. Il avait pas bu : il te ramenait. Dis-le-leur ; ils t'écouteront. »"
    choix:
      - label: "J'appelle la compagnie"
        reponse: "Le chef de dépôt t'écoute, puis rappelle Johnny. Le chauffeur reprend la ligne lundi. Là-haut, on te demande depuis quand tu défends les chauffeurs de nuit."
        effets: {jauges: {direction: -2}, relation: {johnny: 1}, clear: [dette_johnny]}
      - label: "Je ne m'en mêle pas"
        reponse: "Johnny pose le verre. « C'est lui qui te ramenait, l'autre nuit. » Le chauffeur perd sa ligne. Johnny ne t'en parle plus ; il te sert en silence."
        effets: {relation: {johnny: -2}, clear: [dette_johnny]}

  - id: vi.sc.johnny_dette_bis
    titre: "Les douze places"
    roles: [entraineur, joueur, ds, president]
    lieu: terminus
    tranches: [soir]
    qui: johnny
    si: "flag(dette_johnny) && mission(vi.sc.johnny_dette)"
    rejouable: true
    texte: "Johnny pose une liste sur le zinc : douze chauffeurs à la retraite, jamais allés voir un match à la Rive. « Ils te ramenaient, et ils ont jamais rien demandé. Douze places, samedi. C'est le prix. »"
    choix:
      - label: "Douze places, d'accord"
        francs: -120
        reponse: "Samedi, douze vieux chauffeurs en blouson occupent une rangée entière. Ils ne chantent pas ; ils commentent les trajectoires comme des virages."
        effets: {jauges: {tribunes: 1}, clear: [dette_johnny]}
      - label: "C'est beaucoup"
        reponse: "Johnny déchire la liste en deux et garde une moitié. « Six, alors. Je paierai les six autres. » Il ne te dit plus bonjour le premier."
        effets: {relation: {johnny: -2}, clear: [dette_johnny]}

  # ─────────────────────────────────────────────── Ange, l'arrière-salle
  - id: vi.sc.ange_donneur
    titre: "La fille du donneur"
    lieu: tripot
    tranches: [soir]
    qui: ange
    si: "relation.ange >= 2 && annee <= 2007"
    texte: "Le donneur n'est pas venu : sa fille passe un concours à Portclair et il l'accompagne. Ange regarde le jeu neuf sur le tapis : « Faut quelqu'un qui triche pas. Tu distribues ? »"
    choix:
      - label: "Je distribue"
        reponse: "Tu distribues trois heures, de la main droite. Personne ne gagne trop. À l'aube, Ange te glisse le pourboire du donneur : « Pour sa fille. Tu le lui donneras toi-même. »"
        effets: {relation: {ange: 1}, jauges: {direction: -1}}
      - label: "Je ne touche pas aux cartes"
        reponse: "Ange distribue lui-même, ce qu'il ne faisait plus depuis des années. Ses mains tremblent un peu ; autour du tapis, personne ne le lui fait remarquer."

  - id: vi.sc.ange_descente
    titre: "La descente de minuit"
    lieu: tripot
    tranches: [nuit]
    qui: ange
    si: "relation.ange >= 1 && annee <= 2007"
    texte: "Des phares s'arrêtent devant le Terminus. Ange éteint la lampe au-dessus du tapis et ouvre la porte de la cour : « Par là. Si on te demande, t'as jamais su où était la table. »"
    choix:
      - label: "Je sors par la cour"
        reponse: "Tu passes entre les poubelles et le vieux car d'Émile. Derrière toi, la police compte les chaises. Le lendemain, la ville parle d'une descente ; personne ne dit ton nom."
        effets: {relation: {ange: 1}}
      - label: "Je reste, je n'ai rien fait"
        reponse: "L'inspecteur écrit ton nom en premier, avec soin. Ange ne te regarde pas ; il te remercie, sans le dire, d'avoir occupé le policier."
        effets: {jauges: {direction: -3}, var: {ville_amende: "+300"}}

  - id: vi.sc.ange_froid
    titre: "Une vieille page"
    lieu: rue
    tranches: [soir, nuit]
    qui: passant
    si: "relation.ange <= -2 && annee <= 2007"
    texte: "Deux hommes en blouson t'attendent sous le réverbère, au coin du Terminus. L'un tient un carnet d'écolier ouvert : « Monsieur Ange a une question sur une vieille page. Une seule. »"
    choix:
      - label: "Je paie et je pars"
        francs: -300
        reponse: "Ils comptent, déchirent la page du carnet et te la tendent. Elle porte une date, une somme et tes initiales, au crayon."
      - label: "Je ne dois rien"
        reponse: "L'un d'eux referme le carnet et te serre la main, longtemps, très fort. Le lendemain, ta portière est rayée d'un bout à l'autre, à hauteur de poignée."
        effets: {jauges: {direction: -1}}

  - id: vi.sc.ange_dette
    titre: "Ce que ça coûte"
    lieu: tripot
    tranches: [soir]
    qui: ange
    si: "flag(dette_ange)"
    texte: "Ange fait glisser une feuille de match vierge sous le cendrier : « Je veux pas l'argent. Je veux la composition de samedi, vendredi soir, avant tout le monde. »"
    choix:
      - label: "Vendredi, vous l'aurez"
        reponse: "Vendredi, à onze heures, tu dictes onze noms au téléphone du Terminus. Samedi, la cote bouge une heure avant le match, et le vestiaire le sent sans savoir pourquoi."
        effets: {jauges: {vestiaire: -3}, clear: [dette_ange]}
      - label: "Je vous rends l'argent"
        francs: -2500
        reponse: "Tu poses les billets sur le tapis. Ange les recompte sans hâte, en sort deux et te les rend. « Les intérêts, je les prends sur l'amitié. »"
        effets: {relation: {ange: -2}, clear: [dette_ange]}

  - id: vi.sc.ange_dette_bis
    titre: "La boîte en fer"
    lieu: tripot
    tranches: [nuit]
    qui: ange
    si: "flag(dette_ange) && mission(vi.sc.ange_dette)"
    rejouable: true
    texte: "La police tourne autour du Terminus depuis mardi. Ange pose la boîte en fer sur tes genoux : « Garde-la chez toi trois nuits. Tu l'ouvres pas. C'est comme ça qu'on solde. »"
    choix:
      - label: "Je la garde trois nuits"
        reponse: "La boîte dort sous ton lit trois nuits. Le voisin du dessous l'a vue passer dans l'escalier. Le quatrième soir, Ange la reprend sans l'ouvrir devant toi."
        effets: {jauges: {direction: -2}, clear: [dette_ange]}
      - label: "Pas chez moi"
        reponse: "Ange reprend la boîte et la serre contre lui comme un enfant malade. « Pas chez toi. » Il ne te fait plus asseoir à sa droite."
        effets: {relation: {ange: -2}, clear: [dette_ange]}

  # ─────────────────────────────────────────────── Toussaint, l'arrière-salle
  - id: vi.sc.toussaint_gamin
    titre: "Le gamin de la porte"
    roles: [entraineur, joueur, ds, president]
    lieu: tripot
    tranches: [nuit]
    qui: toussaint
    si: "relation.toussaint >= 1 && annee >= 2008"
    texte: "Un gamin du centre de formation, dix-sept ans, attend à la porte avec une liasse de billets roulés. Toussaint, sans le regarder : « Il est de chez toi. Il veut jouer. Je le laisse entrer ? »"
    choix:
      - label: "Je le ramène chez lui"
        reponse: "Tu le ramènes en voiture. Il regarde la vitre jusqu'au pont, puis il pleure, sans bruit. Lundi, à l'entraînement, il court plus vite que les autres."
        effets: {relation: {toussaint: 1}, jauges: {vestiaire: 2}}
      - label: "Ce n'est pas mon affaire"
        reponse: "Toussaint le fait entrer. À l'aube, le gamin ressort sans sa liasse et sans sa montre. Mardi, tout le centre de formation le sait, sauf toi."
        effets: {jauges: {vestiaire: -2}}

  - id: vi.sc.toussaint_appli
    titre: "L'offre en baskets blanches"
    lieu: tripot
    tranches: [soir]
    qui: toussaint
    si: "relation.toussaint >= 2 && annee >= 2024"
    texte: "Un homme en baskets blanches veut racheter la table : des écrans, une application, la salle rénovée. Toussaint te regarde : « Mon oncle aurait dit non. Toi, tu dirais quoi ? »"
    choix:
      - label: "Garde ta table"
        reponse: "Toussaint raccompagne l'homme jusqu'à la cour, poliment, une main dans le dos. Le volet se referme. La table tient encore un hiver, avec ses chaises qui grincent."
        effets: {relation: {toussaint: 1}}
      - label: "Vends, c'est l'avenir"
        reponse: "Il ne vend pas. Mais il te sert désormais au prix des inconnus. « L'avenir, c'est toi qui me l'as conseillé. Je préfère le passé : il paie comptant. »"
        effets: {relation: {toussaint: -1}}

  # ─────────────────────────────────────────────── Jean Lavergne, le tabac du Quai
  - id: vi.sc.lavergne_crue
    titre: "La crue du Quai"
    lieu: tabac
    tranches: [matin]
    qui: lavergne
    si: "relation.lavergne >= 2 && annee <= 2009 && !flag(histoire_h4)"
    texte: "La Rive a passé la marque de 1955 dans la nuit ; l'eau lèche la porte du tabac. Lavergne monte les cartouches à l'étage, seul : « Les mariniers sont sur leurs bateaux. Vous avez des bras ? »"
    choix:
      - label: "Je monte les cartons"
        reponse: "Deux heures de cartons, l'eau aux chevilles. À la fin, Lavergne trace au crayon, sur le mur, la marque de cette crue-là, et tes initiales à côté, plus petites."
        effets: {relation: {lavergne: 1}, jauges: {tribunes: 1}}
      - label: "J'appelle les pompiers"
        reponse: "Les pompiers arrivent à midi, quand l'eau redescend. Lavergne a tout monté seul ; il a mal au dos tout l'hiver, et il ne t'en parle pas."

  - id: vi.sc.lavergne_licence
    titre: "La licence du fils"
    lieu: tabac
    tranches: [aprem]
    qui: lavergne
    si: "relation.lavergne >= 2 && annee >= 2007 && annee <= 2009 && !flag(histoire_h4)"
    texte: "Lavergne tend un formulaire de la régie : le transfert de la licence à son fils. « Faut un répondant, quelqu'un d'honorable. Le notaire dit que vous feriez l'affaire. Moi, j'ai pas d'avis. »"
    choix:
      - label: "Je signe pour votre fils"
        reponse: "Tu signes sous son nom. Il relit ta signature longuement, comme un billet suspect, puis la range dans le tiroir de la caisse. Son fils te sert le lendemain sans faire payer."
        effets: {relation: {lavergne: 1, fabrice: 1}}
      - label: "Ce n'est pas mon rôle"
        reponse: "« Non. » Il range le formulaire sous la boîte à cigares. La licence passe quand même, six mois plus tard, avec la signature du curé."
        effets: {relation: {lavergne: -1}}

  - id: vi.sc.lavergne_froid
    titre: "La monnaie posée loin"
    lieu: tabac
    tranches: [matin]
    qui: lavergne
    si: "relation.lavergne <= -2 && annee <= 2009 && !flag(histoire_h4)"
    texte: "Lavergne pose ta monnaie sur le comptoir, loin de ta main, et attend que tu la ramasses. Derrière toi, trois mariniers ont cessé de parler."
    choix:
      - label: "Je ramasse et je pars"
        reponse: "Les pièces sont froides. Dehors, sur l'ardoise des cotes, quelqu'un a effacé ta ligne au doigt, proprement."
        effets: {jauges: {tribunes: -1}}
      - label: "Qu'est-ce que j'ai fait ?"
        reponse: "« Rien. » Il passe au client suivant. Ta monnaie reste sur le comptoir jusqu'à la fermeture ; il ne la touche pas."

  # ─────────────────────────────────────────────── Fabrice, le tabac du Quai
  - id: vi.sc.fabrice_mobylette
    titre: "La mobylette bleue"
    lieu: tabac
    tranches: [aprem]
    qui: fabrice
    si: "relation.fabrice >= 2 && annee >= 2010"
    texte: "Dans la cour du tabac, Fabrice a enlevé la bâche de la mobylette bleue. « Un collectionneur de Portclair en offre mille écus. Ma sœur dit que c'est à moi de décider. J'ai jamais rien décidé. »"
    choix:
      - label: "Garde-la"
        reponse: "Il remet la bâche, lentement, comme on borde quelqu'un. Le soir, sa sœur passe, soulève un coin de la bâche, et le laisse retomber."
        effets: {relation: {fabrice: 1}}
      - label: "Vends-la"
        reponse: "Le collectionneur la charge dans une camionnette. Fabrice met les billets dans une enveloppe pour sa sœur. Elle la lui rend le lendemain, cachetée."

  - id: vi.sc.fabrice_caisse
    titre: "La caisse du soir"
    lieu: tabac
    tranches: [soir]
    qui: fabrice
    si: "relation.fabrice >= 1 && annee >= 2010"
    texte: "Deux casques de moto sont entrés au tabac à la fermeture ; Fabrice a donné la caisse. Sa femme tremble encore derrière le comptoir. « Tu passes sur le quai tous les soirs. T'as vu une moto ? »"
    choix:
      - label: "Je l'ai vue partir"
        reponse: "Tu décris une moto rouge vers le pont. La police note ; la moto est retrouvée le lendemain, brûlée à la friche. La caisse, non. Fabrice t'offre un café, puis deux."
        effets: {relation: {fabrice: 1}, jauges: {tribunes: 1}}
      - label: "Je n'ai rien vu"
        reponse: "Fabrice referme le tiroir-caisse. « Personne n'a rien vu. » Sa femme, elle, te regarde jusqu'à la porte, et encore après."
        effets: {relation: {fabrice: -1}}

  # ─────────────────────────────────────────────── Firmin, le tabac du carrefour
  - id: vi.sc.firmin_oreille
    titre: "La fenêtre du fond"
    lieu: tabac_stade
    tranches: [aprem]
    qui: firmin
    si: "relation.firmin >= 2 && annee >= 2003 && annee <= 2012"
    texte: "Firmin tient une ordonnance d'appareil auditif. « Le médecin dit que j'entendrai bientôt plus le stade. Nadège veut reprendre. Je lui laisse la fenêtre du fond, ou je m'accroche ? »"
    choix:
      - label: "Laissez-lui la fenêtre"
        reponse: "Il lui montre où se mettre, l'oreille contre le montant, les yeux fermés. Samedi, elle annonce le premier but avant lui. Il lui tape sur l'épaule."
        effets: {relation: {firmin: 1, nadege: 1}}
      - label: "Gardez-la encore"
        reponse: "Il garde la fenêtre un an de plus, l'appareil au maximum. Il se trompe deux fois sur les petits cris ; tout le carrefour fait semblant de ne pas l'avoir remarqué."

  - id: vi.sc.firmin_braquage
    titre: "Le braquage du carrefour"
    lieu: tabac_stade
    tranches: [matin]
    qui: firmin
    si: "relation.firmin >= 1 && annee <= 2012"
    texte: "Ils ont braqué le tabac du carrefour à l'ouverture et pris la caisse, les cartouches, la cagnotte du loto. Firmin, assis sur le marchepied : « La grille des gars de la Nord était dedans. Trois mois. »"
    choix:
      - label: "Je rembourse la Nord"
        francs: -300
        reponse: "Tu rembourses la cagnotte de la Nord dans une enveloppe au nom de Firmin. Samedi, le virage chante pour le carrefour ; Firmin l'entend, de sa fenêtre."
        effets: {relation: {firmin: 1}, jauges: {tribunes: 3}}
      - label: "L'assurance paiera"
        reponse: "L'assurance paie les cartouches, pas la grille de la Nord. Firmin rembourse de sa poche, sur six mois, et n'en parle à personne. Toi non plus."
        effets: {jauges: {tribunes: -1}}

  # ─────────────────────────────────────────────── Nadège, le tabac du carrefour
  - id: vi.sc.nadege_stock
    titre: "L'arrière-boutique du père"
    lieu: tabac_stade
    tranches: [matin]
    qui: nadege
    si: "relation.nadege >= 2 && annee >= 2014"
    texte: "Nadège vide l'arrière-boutique de son père : des cartouches de brunes, des grilles de 1978, une radio collée au montant de la fenêtre. « Je jette tout, ou je garde la fenêtre comme il l'a laissée ? »"
    choix:
      - label: "Garde la fenêtre"
        reponse: "Elle remet la radio contre le montant. Samedi, elle l'allume au coup d'envoi, sans le son, comme lui. Au comptoir, les habitués se taisent au même moment."
        effets: {relation: {nadege: 1}, jauges: {tribunes: 1}}
      - label: "Fais de la place"
        reponse: "Elle range la radio dans un carton marqué PAPA. À la place, elle installe un présentoir de téléphones. Il se vend bien. Elle le regarde de travers."

  - id: vi.sc.nadege_pieces
    titre: "Les pièces des vieux"
    lieu: tabac_stade
    tranches: [midi]
    qui: nadege
    si: "relation.nadege >= 1 && annee >= 2035"
    texte: "La banque ne prend plus les sacs de pièces de Nadège. « Si je les refuse moi aussi, les vieux, ils passeront plus. Tu pourrais m'en changer un sac par semaine, toi ? »"
    choix:
      - label: "Un sac par semaine"
        reponse: "Chaque lundi, tu repars avec un sac lourd comme un ballon mouillé. Les vieux du carrefour te saluent sans savoir pourquoi ; Nadège, elle, le sait."
        effets: {relation: {nadege: 1}, jauges: {tribunes: 1}}
      - label: "Passe aux cartes"
        reponse: "Elle accroche un panneau : « Cartes acceptées. » Deux vieux ne reviennent plus. Elle apprend leurs noms dans L'Écho du dimanche, aux avis de décès."
        effets: {relation: {nadege: -1}}

  # ─────────────────────────────────────────────── Léon, le kiosque
  - id: vi.sc.leon_recul
    titre: "Le kiosque recule"
    lieu: kiosque
    tranches: [matin]
    qui: leon
    si: "relation.leon >= 2 && annee <= 2014"
    texte: "Scotché sur le volet, un arrêté de la mairie fait reculer le kiosque de vingt mètres, loin du banc des anciens. Léon tapote le papier. « Vingt mètres. Les vieux viendront plus jusque-là. »"
    choix:
      - label: "J'écris à la mairie"
        reponse: "Ta lettre arrive avec une pétition des joueurs de cartes du banc. Le kiosque ne recule que de cinq mètres. Léon trace la nouvelle limite lui-même, à la craie."
        effets: {relation: {leon: 1}, jauges: {direction: -1, tribunes: 1}}
      - label: "Vingt mètres, ce n'est rien"
        reponse: "Le kiosque recule de vingt mètres. Les anciens restent sur leur banc, et Léon leur porte le journal à la main chaque matin, en boitant un peu plus."
        effets: {relation: {leon: -1}}

  - id: vi.sc.leon_derby
    titre: "Le pronostic du derby"
    roles: [entraineur, joueur, ds, president]
    lieu: kiosque
    tranches: [midi]
    qui: leon
    si: "relation.leon >= 1 && annee <= 2014"
    texte: "Léon te tend son cahier de pronostics et un feutre. « Samedi, c'est le derby. Le derby, moi, je le pronostique jamais. Écris le score, toi. Si tu te trompes, ce sera en rouge. »"
    choix:
      - label: "J'écris une victoire"
        reponse: "Tu écris deux à un. Lundi, Léon recopie le vrai score dessous, en noir ou en rouge, et ne te dit pas lequel. Il te montre seulement que la page est remplie."
        effets: {relation: {leon: 1}, jauges: {tribunes: 1}}
      - label: "Je laisse la page blanche"
        reponse: "« Comme moi. » Il referme le cahier sur la page blanche. Samedi soir, il y écrit quelque chose ; il ne te montre jamais quoi."

  # ─────────────────────────────────────────────── Samir, le kiosque
  - id: vi.sc.samir_vignette
    titre: "Le numéro qui manquait"
    lieu: kiosque
    tranches: [matin, midi]
    qui: samir
    si: "relation.samir >= 2"
    texte: "Samir sort d'une enveloppe la vignette de 1997 que tout le quartier cherchait. « Un gamin du square finit l'album de son père. Il lui manque plus qu'elle. Je la lui donne, ou je la vends ? »"
    choix:
      - label: "Donne-la au gamin"
        reponse: "Le gamin la colle sur place, sur le comptoir du kiosque, en tirant la langue. Le lendemain, il revient avec son père pour te serrer la main ; il ne sait pas pourquoi."
        effets: {relation: {samir: 1}, jauges: {tribunes: 1}}
      - label: "Vends-la, elle vaut cher"
        reponse: "Un collectionneur de Portclair la paie le prix d'un mois de journaux. Samir compte les billets, puis offre au gamin un album neuf, vide."
        effets: {relation: {samir: -1}}

  - id: vi.sc.samir_dette
    titre: "La pétition du volet"
    lieu: kiosque
    tranches: [matin]
    qui: samir
    si: "flag(dette_samir)"
    texte: "Samir a scotché une pétition sur le volet, parce que la mairie veut une borne à la place du kiosque. « Le paquet de journaux mouillés, tu te rappelles ? Signe en premier. En grand, que ça se voie. »"
    choix:
      - label: "Je signe en premier"
        reponse: "Ton nom en haut de la feuille, au feutre noir. Le conseil municipal repousse la borne d'un an. À la mairie, on note que tu signes des pétitions."
        effets: {jauges: {direction: -2, tribunes: 1}, clear: [dette_samir]}
      - label: "Je ne signe jamais rien"
        reponse: "« Rien, sauf les autographes. » Il décolle la pétition, la plie et la range sous les journaux. Il ne te met plus rien de côté."
        effets: {relation: {samir: -2}, clear: [dette_samir]}

  - id: vi.sc.samir_dette_bis
    titre: "Le cousin du toit"
    lieu: kiosque
    tranches: [matin, midi]
    qui: samir
    si: "flag(dette_samir) && mission(vi.sc.samir_dette)"
    rejouable: true
    texte: "Le cousin de Samir a perdu sa place aux projecteurs du stade. « Il a vu un type trafiquer un câble, il l'a dit, on l'a viré. Un mot de toi au stade, et il remonte sur le toit. »"
    choix:
      - label: "J'appelle le stade"
        reponse: "Le cousin remonte sur le toit le lundi. Du câble, personne ne parle plus. Là-haut, on te demande pourquoi tu défends un électricien que tu ne connais pas."
        effets: {jauges: {direction: -2}, relation: {samir: 1}, clear: [dette_samir]}
      - label: "Ce n'est pas à moi"
        reponse: "Samir range son téléphone. Le samedi suivant, il annonce les buts au quai avec dix minutes de retard, comme tout le monde."
        effets: {relation: {samir: -2}, clear: [dette_samir]}

  # ─────────────────────────────────────────────── Simone, la maison de la presse
  - id: vi.sc.simone_vitre
    titre: "La vitrine étoilée"
    lieu: presse
    tranches: [matin]
    qui: simone
    si: "relation.simone >= 2 && annee <= 2019"
    texte: "Un pavé a étoilé la vitrine de la maison de la presse, pile sur la Une qui parlait de toi. Simone balaie le verre. « C'est le journal qu'ils visaient. Bon, t'étais en première page. »"
    choix:
      - label: "Je paie la vitre"
        francs: -400
        reponse: "Le vitrier passe le jeudi. Simone remet la Une derrière la vitre neuve, un peu plus bas, à moitié cachée par les guides de la saison."
        effets: {relation: {simone: 1}, jauges: {tribunes: 1}}
      - label: "L'assurance s'en charge"
        reponse: "L'assurance met trois semaines. Pendant trois semaines, une planche ferme la vitrine, et les gamins y écrivent ton nom au feutre, avec des fautes."
        effets: {jauges: {tribunes: -1}}

  - id: vi.sc.simone_cession
    titre: "La lettre pour la banque"
    lieu: presse
    tranches: [aprem]
    qui: simone
    si: "relation.simone >= 1 && annee >= 2017 && annee <= 2019"
    texte: "Simone remplit un dossier de cession, les lunettes sur le front, parce que sa fille reprend le magasin. « La banque veut un nom connu en bas d'une lettre de soutien. Toi, t'en as un. »"
    choix:
      - label: "Je signe la lettre"
        reponse: "La banque accepte en dix jours. Simone accroche ta lettre derrière la caisse, à côté de la photo de son mari à l'imprimerie. Sa fille la décroche, puis la remet."
        effets: {relation: {simone: 1, delphine: 1}}
      - label: "Pas pour une banque"
        reponse: "La banque accepte quand même, en trois mois, avec la caution d'un oncle. Simone te sert comme avant, avec un peu plus de monnaie dans la soucoupe, et moins de mots."
        effets: {relation: {simone: -1}}

  # ─────────────────────────────────────────────── Delphine, la maison de la presse
  - id: vi.sc.delphine_tournee
    titre: "La dernière tournée du camion"
    lieu: presse
    tranches: [matin]
    qui: delphine
    si: "relation.delphine >= 2 && annee >= 2025"
    texte: "Le distributeur arrête la tournée d'Aubérive, faute de journaux pour remplir un camion. Delphine : « Faut aller chercher L'Écho à Portclair, à cinq heures. Et ma voiture est morte. »"
    choix:
      - label: "Je te prête ma voiture"
        reponse: "Pendant un mois, Delphine fait Portclair à l'aube avec ta voiture. Elle te la rend lavée, le plein fait, et un exemplaire de chaque dimanche sur le siège."
        effets: {relation: {delphine: 1}, jauges: {tribunes: 1}}
      - label: "Fais-le livrer"
        reponse: "Elle trouve un livreur à vélo, plus cher que le journal. Elle augmente L'Écho de trente centimes. Les vieux paient sans discuter ; elle, elle le raconte à tout le monde."

  # ─────────────────────────────────────────────── Massenet, L'Écho
  - id: vi.sc.massenet_rotative
    titre: "La nuit de la rotative"
    lieu: echo
    tranches: [soir]
    jours: [lun, mar, mer, jeu, ven, sam]
    qui: meneche
    si: "relation.meneche >= 1 && annee <= 1999"
    texte: "La rotative de L'Écho est en panne, le soir du bouclage. Massenet, en manches de chemise : « Si le journal sort pas demain, il sortira plus. Il me faut le mécanicien de Portclair. Ce soir. »"
    choix:
      - label: "Je paie le mécanicien"
        francs: -300
        reponse: "Le mécanicien arrive à minuit et repart à quatre heures. L'Écho sort à huit heures, avec une coquille en page une. Massenet dit qu'il la fera encadrer, comme une dette."
        effets: {relation: {meneche: 1}, jauges: {tribunes: 1}}
      - label: "Ce n'est pas mon journal"
        reponse: "« Non. » L'Écho ne sort pas le lendemain, ce qui n'était pas arrivé depuis la guerre. Le surlendemain, il sort, et il parle de toi en page trois."
        effets: {jauges: {direction: -1}}

  - id: vi.sc.massenet_carton
    titre: "Le carton de Massenet"
    lieu: echo
    tranches: [soir]
    jours: [lun, mar, mer, jeu, ven, sam]
    qui: meneche
    si: "relation.meneche >= 2 && annee >= 1998 && annee <= 1999"
    texte: "Massenet vide son bureau dans un carton avant de partir au plateau de Télé-Stade. Il tient une chemise jaunie avec ton nom dessus. « Je la jette, ou je la laisse au suivant ? »"
    choix:
      - label: "Donnez-la-moi"
        reponse: "Il te tend la chemise sans l'ouvrir. Dedans, des coupures, tes déclarations soulignées, et une seule note de sa main dans la marge : « Tient parole, pour l'instant. »"
        effets: {relation: {meneche: 1}, jauges: {direction: 1}}
      - label: "Laissez-la au journal"
        reponse: "Il la pose sur le bureau de son successeur, sous la lampe. Le lendemain, Étienne Rabier la lit avant le courrier, et il prend des notes."
        effets: {relation: {etienne: -1}}

  - id: vi.sc.massenet_dette
    titre: "La suite"
    lieu: echo
    tranches: [aprem]
    jours: [lun, mar, mer, jeu, ven, sam]
    qui: meneche
    si: "flag(dette_meneche) && annee <= 1999"
    texte: "Massenet ouvre son carnet à une page blanche et pose son stylo en travers. « La neuvième ligne, l'autre jour. Maintenant, la suite. Un nom que personne a encore. »"
    choix:
      - label: "Je vous donne un nom"
        reponse: "Tu lui donnes le nom d'un joueur qui partira en juin. Samedi, il est en page trois. Au vestiaire, on cherche qui a parlé, et on regarde de ton côté."
        effets: {jauges: {vestiaire: -2}, clear: [dette_meneche]}
      - label: "Je n'ai rien pour vous"
        reponse: "Il referme le carnet sur le stylo, comme on écrase un insecte. « Rien, c'est une information aussi. Je la publierai. »"
        effets: {relation: {meneche: -2}, clear: [dette_meneche]}

  - id: vi.sc.massenet_dette_bis
    titre: "La photo du soir"
    lieu: echo
    tranches: [soir]
    jours: [lun, mar, mer, jeu, ven, sam]
    qui: meneche
    si: "flag(dette_meneche) && mission(vi.sc.massenet_dette) && annee <= 1999"
    rejouable: true
    texte: "Massenet veut une photo de toi au travail, le soir, le téléphone à la main. « Une vraie, pas posée. Le photographe attend dans la voiture. Vous me la devez. »"
    choix:
      - label: "Qu'il monte"
        reponse: "Le photographe prend trente clichés. Celui qui paraît te montre de dos, devant la fenêtre éclairée. On y lit quelque chose de grave que tu ne pensais pas."
        effets: {jauges: {direction: -1, tribunes: 1}, clear: [dette_meneche]}
      - label: "Pas de photo"
        reponse: "« Alors je prendrai celle des archives. » Celle des archives date de ta pire semaine. Il le sait ; il la choisit avec soin."
        effets: {relation: {meneche: -2}, clear: [dette_meneche]}

  # ─────────────────────────────────────────────── Étienne, L'Écho
  - id: vi.sc.etienne_rotative
    titre: "La rotative au poids"
    lieu: echo
    tranches: [soir]
    jours: [lun, mar, mer, jeu, ven, sam]
    qui: etienne
    si: "relation.etienne >= 2 && annee >= 2024"
    texte: "Un ferrailleur veut racheter la rotative de L'Écho au poids. Étienne a fait le calcul au dos d'une épreuve. « Sans elle, on imprime à Portclair. L'Écho d'Aubérive, tiré à Portclair. Ça te va, toi ? »"
    choix:
      - label: "Garde ta rotative"
        francs: -500
        reponse: "Ta part paie un an d'entretien. La rotative tourne encore le samedi soir, avec un bruit de vieux car. Étienne t'envoie le premier exemplaire, chaque dimanche, encore chaud."
        effets: {relation: {etienne: 1}, jauges: {tribunes: 1}}
      - label: "Imprime à Portclair"
        reponse: "La rotative part sur un camion, en morceaux. L'Écho arrive désormais en camionnette, avec une heure de retard. Étienne ne parle plus de bruit."
        effets: {relation: {etienne: -1}}

  - id: vi.sc.etienne_questions
    titre: "Les questions du dimanche"
    lieu: echo
    tranches: [aprem]
    jours: [lun, mar, mer, jeu, ven, sam]
    qui: etienne
    si: "relation.etienne >= 1 && annee >= 2040"
    texte: "Étienne est le dernier journaliste de L'Écho, celui qui écrit, photographie et plie. Il te tend une feuille. « Mes questions pour dimanche. J'ai plus personne pour me relire. Tu relis ? »"
    choix:
      - label: "Je relis honnêtement"
        reponse: "Tu corriges deux fautes et ne touches à rien d'autre. Dimanche, la troisième question te fait mal ; elle est bien écrite."
        effets: {relation: {etienne: 1}, jauges: {tribunes: 1}}
      - label: "J'en raye une"
        reponse: "Il regarde longtemps la question rayée, puis la recopie en tête de page. « Merci. Maintenant, je sais laquelle compte. »"
        effets: {relation: {etienne: -1}, jauges: {direction: -1}}

  - id: vi.sc.etienne_dette
    titre: "Le premier à le dire"
    lieu: echo
    tranches: [aprem]
    jours: [lun, mar, mer, jeu, ven, sam]
    qui: etienne
    si: "flag(dette_etienne)"
    texte: "Étienne t'attend près de la machine, une épreuve vierge à la main. « Je t'ai gardé un papier. Tu pars, tu restes, je m'en fiche. Mais c'est L'Écho qui le dit en premier. »"
    choix:
      - label: "Tu l'auras en premier"
        reponse: "Il note la promesse dans le coin de l'épreuve, la date, ton nom, et l'épingle au mur. Là-haut, on apprend que tu as promis quelque chose à L'Écho."
        effets: {jauges: {direction: -2}, clear: [dette_etienne]}
      - label: "Je ne promets rien"
        reponse: "« Tout le monde promet, à quelqu'un. » Il déchire l'épreuve en deux et ne la jette pas : il garde les deux moitiés, chacune dans un tiroir."
        effets: {relation: {etienne: -2}, clear: [dette_etienne]}

  - id: vi.sc.etienne_dette_bis
    titre: "L'entretien du dimanche"
    lieu: echo
    tranches: [soir]
    jours: [lun, mar, mer, jeu, ven, sam]
    qui: etienne
    si: "flag(dette_etienne) && mission(vi.sc.etienne_dette)"
    rejouable: true
    texte: "Étienne veut un entretien chez toi, sans témoin, sur ta première saison ici. « Tu me dois une semaine de silence. Je te la rends contre deux heures, et c'est pas toi qui choisis les questions. »"
    choix:
      - label: "Viens dimanche"
        reponse: "Il reste trois heures et ne note presque rien. L'entretien paraît sur deux pages, sans un adjectif. Là-haut, on y trouve trois phrases de trop."
        effets: {jauges: {tribunes: 2, direction: -2}, clear: [dette_etienne]}
      - label: "Ça, non"
        reponse: "Il prend note, comme on coche une case. Dimanche, L'Écho publie une page blanche avec ton nom en haut, et une seule ligne : « Ce qu'on ne nous a pas dit. »"
        effets: {relation: {etienne: -2}, jauges: {direction: -1}, clear: [dette_etienne]}

  # ─────────────────────────────────────────────── Les réputations du lot
  # rep_comptoir : « un pilier du Corner »
  - id: vi.sc.rep_comptoir_tabouret
    titre: "Le tabouret gravé"
    lieu: bar
    tranches: [soir]
    qui: ancien
    si: "flag(rep_comptoir)"
    texte: "Au Corner, le tabouret du bout porte tes initiales, gravées au couteau sous l'assise par les anciens de la Nord. « Faut être un pilier, hein. Le dernier, c'était en 1981. »"
    choix:
      - label: "Je paie ma tournée"
        francs: -60
        reponse: "Les anciens trinquent tous ensemble, comme en tribune. Le plus vieux te dit le nom du pilier de 1981 : il est mort, et son tabouret est toujours là."
        effets: {jauges: {tribunes: 2}}
      - label: "Je ne suis pas un pilier"
        reponse: "« Personne ne l'est, au début. » Ils retournent le tabouret, tes initiales vers le mur. Elles y resteront jusqu'à ce que tu reviennes."
        effets: {jauges: {tribunes: 1}}

  - id: vi.sc.rep_comptoir_photo
    titre: "La photo du pilier"
    lieu: domicile
    tranches: [matin]
    si: "flag(rep_comptoir)"
    texte: "L'Écho de ce matin, page trois. Toi au zinc du Corner, le coude sur le comptoir, un jeudi à vingt-trois heures, et en légende « Un pilier. » Là-haut, le téléphone sonne déjà."
    choix:
      - label: "J'appelle là-haut"
        reponse: "Tu expliques le jeudi, le verre, les anciens de la Nord. On t'écoute poliment. On te demande si tu comptes y retourner. Tu dis non ; personne ne te croit."
        effets: {jauges: {direction: -2}}
      - label: "J'encadre la page"
        reponse: "Tu encadres la page et tu la poses au Corner, derrière la caisse. La Nord adore. Là-haut, quelqu'un découpe la même page et la range dans un dossier à ton nom."
        effets: {jauges: {tribunes: 2, direction: -3}}

  # rep_jeu : « un joueur »
  - id: vi.sc.rep_jeu_carnet
    titre: "L'homme au carnet"
    lieu: rue
    tranches: [soir]
    qui: passant
    si: "flag(rep_jeu)"
    texte: "Sur le quai, un homme en manteau t'emboîte le pas, un carnet d'écolier à la main. « Vous jouez, on sait. Samedi, un nul. Ça fait de mal à personne, sauf à ceux qui parient. »"
    choix:
      - label: "Combien ?"
        reponse: "Il dit un chiffre, puis le divise par deux en voyant ton visage. Il glisse une enveloppe épaisse dans ta poche et disparaît dans la rue des Lilas."
        effets: {var: {ville_francs_sales: "+1000"}, jauges: {vestiaire: -2}}
      - label: "Je ne joue plus"
        reponse: "« Tout le monde rejoue. » Il range le carnet. Samedi, tu le vois en tribune, debout, sans écharpe. Il ne regarde pas le match ; il te regarde."

  - id: vi.sc.rep_jeu_cagnotte
    titre: "Le lancer du petit Gaudry"
    lieu: tabac
    tranches: [soir]
    qui: ancien
    si: "flag(rep_jeu)"
    texte: "Au tabac du Quai, les mariniers jouent la cagnotte du petit Gaudry, opéré à Portclair. Ils te tendent le gobelet de cuir. « T'as la main, toi. Un lancer, pour le petit. »"
    choix:
      - label: "Je lance pour le petit"
        francs: -50
        reponse: "Quatre, deux, un, du premier coup. Le Quai hurle comme un stade. La cagnotte double ; ils la portent le soir même à Portclair, ton nom sur l'enveloppe."
        effets: {jauges: {tribunes: 2}}
      - label: "Lancez sans moi"
        reponse: "Le vieux marinier lance, fait deux-un-un, et rit quand même. La cagnotte reste ce qu'elle est. Personne ne te le reproche ; personne ne t'en reparle."

  # rep_nuit : « un oiseau de nuit »
  - id: vi.sc.rep_nuit_photo
    titre: "Trois heures dix"
    lieu: domicile
    tranches: [matin]
    si: "flag(rep_nuit)"
    texte: "Dans ta boîte aux lettres, une enveloppe sans timbre, avec une photo de toi sous le néon du Terminus, trois heures dix à l'horloge derrière ton épaule. Au dos : « La prochaine part à L'Écho. »"
    choix:
      - label: "Je la montre là-haut"
        reponse: "Tu poses la photo sur le bureau, là-haut, avant que quelqu'un d'autre le fasse. On te remercie de ta franchise, et on te prie, très poliment, de rentrer avant minuit."
        effets: {jauges: {direction: -1}}
      - label: "Je la brûle"
        reponse: "La photo brûle mal ; le papier est glacé. Une semaine plus tard, un double arrive là-haut, par la poste, sous enveloppe kraft. On ne t'en parle pas. On t'observe."
        effets: {jauges: {direction: -3}}

  - id: vi.sc.rep_nuit_mitron
    titre: "Ceux de quatre heures"
    lieu: rue
    tranches: [nuit]
    qui: passant
    si: "flag(rep_nuit)"
    texte: "Quatre heures, rue des Lilas. Le mitron de la boulangerie fume sur le pas de la porte et te tend une baguette encore trop chaude. « Tiens. À cette heure-ci, on est collègues. »"
    choix:
      - label: "Je reste un moment"
        reponse: "Vous parlez du four, du match, du froid. À cinq heures, il te dit que deux des tiens rentrent chaque nuit à la même heure que toi. Tu sais lesquels, maintenant."
        effets: {jauges: {vestiaire: 1}}
      - label: "Je rentre dormir"
        reponse: "Tu manges la baguette en marchant, jusqu'au quignon. Au réveil, il n'en reste rien, et tu as dormi quatre heures. C'est déjà ça."

  # rep_largesse : « généreux »
  - id: vi.sc.rep_largesse_couronne
    titre: "La couronne de la Nord"
    lieu: bar
    tranches: [soir]
    qui: fan
    si: "flag(rep_largesse)"
    texte: "Au Corner, une liste circule pour la couronne d'un vieux de la Nord, mort sans famille. Ton nom est déjà en haut, à côté d'une somme que tu n'as pas écrite. « On s'est dit que t'allais dire oui. »"
    choix:
      - label: "Je paie ce qui est écrit"
        francs: -200
        reponse: "L'enterrement a lieu un mardi, sous la pluie. La Nord est venue en écharpe, et ton nom est sur le ruban de la couronne, sans que tu l'aies demandé."
        effets: {jauges: {tribunes: 3}}
      - label: "J'écris ma somme à moi"
        francs: -80
        reponse: "Tu barres, tu écris moins. Personne ne commente. Sur le ruban de la couronne, il y a d'autres noms ; le tien est en bas, plus petit."
        effets: {jauges: {tribunes: 1}}

  - id: vi.sc.rep_largesse_palier
    titre: "On a dit que tu donnais"
    lieu: domicile
    tranches: [soir]
    qui: passant
    si: "flag(rep_largesse)"
    texte: "Un homme attend sur ton palier, sa casquette dans les mains. « Au Corner, on m'a dit que vous donniez. C'est pour le loyer. Juste ce mois-ci. » Derrière lui, l'escalier est plein de voix."
    choix:
      - label: "Je lui donne"
        francs: -150
        reponse: "Il compte à peine et descend. Dans l'escalier, les voix se taisent, puis remontent. Le lendemain, il y a trois lettres sous ta porte, chacune avec un loyer."
        effets: {jauges: {tribunes: 1}}
      - label: "Pas cette fois"
        reponse: "Il remet sa casquette et te tourne le dos. Le soir, au Corner, on dit que tu as changé, que c'est l'argent. Ceux qui le disent ne t'ont jamais rien demandé."
        effets: {jauges: {tribunes: -2}}

# ═══════════════════════════════════════════════════════════════ LES PAROLES
# Ce que la ville dit de toi quand une réputation du lot est née (`rep_<habitude>`).
# Aucun accord sur le héros ; la nuit, seuls passants et passantes parlent.
paroles:

  # — « un pilier du Corner »
  - qui: ancien
    sujet: toi
    si: "flag(rep_comptoir)"
    texte: "Paraît qu'on te voit plus au Corner qu'au stade. Nous, ça nous va. Au club, faudrait leur demander."
  - qui: fan
    sujet: toi
    si: "flag(rep_comptoir) && tribunes >= 50"
    texte: "Les gars de la Nord disent qu'on peut te causer au Corner, entre deux demis, sans rendez-vous. De quelqu'un d'en haut, ils avaient jamais dit ça."
  - qui: passant
    sujet: toi
    si: "flag(rep_comptoir) && direction < 50"
    texte: "Mon beau-frère, il conduit les gens d'en haut. À l'arrière de la voiture, il a entendu ton nom et « Corner » dans la même phrase."

  # — « un joueur »
  - qui: passant
    sujet: toi
    si: "flag(rep_jeu)"
    texte: "Au tabac du Quai, y en a qui misent sur tes dés plutôt que sur ton équipe. Ça rapporte plus, qu'ils disent. Et ça dure plus longtemps."
  - qui: ancien
    sujet: toi
    si: "flag(rep_jeu)"
    texte: "De mon temps, un gars qui jouait aux cartes la veille d'un match, il finissait en tribune. Toi, on te regarde jouer. On attend que tu perdes."
  - qui: passante
    sujet: toi
    si: "flag(rep_jeu) && role != selectionneur"
    texte: "Mon fils joue en réserve, chez vous. Au vestiaire, ils parient sur qui vous verra le premier dans l'arrière-salle du Terminus. Il a gagné deux fois."

  # — « un oiseau de nuit »
  - qui: passant
    sujet: toi
    si: "flag(rep_nuit)"
    texte: "Le chauffeur du dernier car, il dit qu'il te ramène plus souvent que sa femme. C'est pas méchant. Mais il le dit à tout le monde."
  - qui: passante
    sujet: toi
    si: "flag(rep_nuit) && tranche == nuit"
    texte: "Je sors de douze heures de garde à l'hôpital. Vous, paraît que vous sortez du Terminus. On se croise toujours à cette heure-là, nous deux."
  - qui: ancien
    sujet: toi
    si: "flag(rep_nuit) && tranche == matin"
    texte: "Ce matin, tu rentrais pendant que j'ouvrais mes volets. Moi, je me levais. Faudra bien qu'un de nous deux ait tort."

  # — « généreux »
  - qui: enfant
    sujet: toi
    si: "flag(rep_largesse)"
    texte: "C'est toi qui paies les tournées au Corner ? Papa dit que si je te demande un ballon, tu diras oui. Tu dis oui ?"
  - qui: ancien
    sujet: toi
    si: "flag(rep_largesse)"
    texte: "Au Corner, ils boivent à ta santé avec tes sous. Ça s'est toujours fait. Pas une tournée de plus que ce que t'as payé, remarque."
  - qui: passante
    sujet: toi
    si: "flag(rep_largesse)"
    texte: "Tout le quartier sait que vous donnez. Ma voisine vous a mis sur sa liste de Noël, entre le facteur et les pompiers. Et elle rigole pas."

# ═══════════════════════════════════════════════════════════════ OÙ ILS T'ATTENDENT
# Une carte dont ils sont le locuteur (leurs paliers : cards/common/paliers_ville_comptoirs.yaml)
# se joue à leur comptoir.
rencontres:
  marcel: bar
  kader: bar
  emile: terminus
  johnny: terminus
  ange: tripot
  toussaint: tripot
  fabrice: tabac
  firmin: tabac_stade
  nadege: tabac_stade
  leon: kiosque
  samir: kiosque
  simone: presse
  delphine: presse
  etienne: echo
