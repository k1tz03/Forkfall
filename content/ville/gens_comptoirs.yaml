  # — Le Terminus, Émile (1990-2009)
  - id: vi_emile_cafe
    lieu: terminus
    objet: comptoir
    label: "Un café dans un verre"
    texte: "Émile sert ton café dans un verre, comme aux chauffeurs, sans soucoupe. « Les chauffeurs ont pas le temps d'attendre que ça refroidisse. » Dehors, le premier car de Valdorne chauffe, phares allumés."
    textes:
      - "Émile sert ton café dans un verre, comme aux chauffeurs, sans soucoupe. « Les chauffeurs ont pas le temps d'attendre que ça refroidisse. » Dehors, le premier car de Valdorne chauffe, phares allumés."
      - "Un chauffeur de nuit raconte la côte verglacée, le car qui a glissé sans tomber. Émile l'écoute en hochant la tête, puis te ressert sans te demander, d'un geste de volant."
      - "Émile pose deux sucres à côté de ton verre et les reprend aussitôt. « Les chauffeurs n'en prennent pas. Vous voulez qu'on vous prenne pour quelqu'un qui attend le car ? »"
    si: "annee <= 2009"
    avec: emile
    habitude: comptoir
    tranches: 1
    francs: -5
    heures: [matin]
  - id: vi_emile_horaires
    lieu: terminus
    objet: horaires
    label: "Les horaires avec Émile"
    texte: "Émile corrige les horaires au stylo, sur le papier punaisé près de la porte. Il te dit qui est parti par quel car cette semaine, sans que tu le demandes, et qui n'est pas revenu."
    si: "annee <= 2009"
    avec: emile
    habitude: quartier
    tranches: 0
    francs: 0
  - id: vi_emile_ardoise
    lieu: terminus
    objet: comptoir
    label: "L'ardoise d'un chauffeur"
    texte: "Sur l'ardoise d'Émile, la ligne d'un jeune chauffeur s'allonge depuis l'hiver. Tu la règles sans le dire. Émile l'efface au torchon et ne te remercie pas : il te ressert."
    si: "annee <= 2009"
    avec: emile
    habitude: largesse
    tranches: 0
    francs: -30
    heures: [matin, midi, aprem]

