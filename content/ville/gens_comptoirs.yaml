# LA VILLE VIVANTE — lot « comptoirs » : les gens des comptoirs et des journaux
# (docs/histoires/ville_vivante.md ; le format : § 8).
#
# Huit lieux, deux gardiens chacun, l'un après l'autre, sans trou ni chevauchement :
#
#   bar          Le Corner             Marcel Lambrot      1990-2016   tribunes
#                                      Kader Benhamou      2017-2050   tribunes
#   terminus     Le Terminus           Émile Darnaud       1990-2009   rue
#                                      Johnny Mazet        2010-2050   rue
#   tripot       l'arrière-salle       Ange Santucci       1990-2007   milieu
#                                      Toussaint Santucci  2008-2050   milieu
#   tabac        le tabac du Quai      Jean Lavergne       1990-2009   rue      (le personnage du livre 4)
#                                      Fabrice Lavergne    2010-2050   milieu   (son fils, le frère de Sandrine)
#   tabac_stade  le tabac du carrefour Firmin Coudray      1990-2012   tribunes
#                                      Nadège Coudray      2013-2050   tribunes (sa fille)
#   kiosque      le kiosque du quai    Léon Mauduit        1990-2014   presse
#                                      Samir Belkacem      2015-2044   presse   (le kiosque ferme en 2045)
#   presse       la maison de la presse Simone Arnoux      1990-2019   presse
#                                      Delphine Arnoux     2020-2050   presse   (sa fille)
#   echo         L'Écho d'Aubérive     Pierre Massenet     1990-1999   presse   (le journaliste ; consultant en 2000)
#                                      Étienne Rabier      2000-2050   presse   (le rédacteur en chef d'après)
#
# Ce que les livres disent de ces lieux, et que la ville tient : Lhoste au fond du
# Corner (1), la poire de 1984 sur l'étagère du haut (4) ; Norbert qui ferme
# l'arrière-salle derrière la façade du « patron de la table » (2) ; la mère qui
# loue en haut du Terminus (3) ; le père Rancé, son ardoise et ses tournées payées
# par JF Conseil (6) ; le registre de 1974 dans la cave du tabac du Quai (1), le
# buraliste et sa fille au standard (4, 7), le fils et la mobylette de la cour (4) ;
# le kiosque, le local au-dessus (9) et la dame du dimanche (10) ; le chef de
# L'Écho et sa rubrique « Ils étaient au stade » (2024-2040), puis le dernier
# journaliste qui écrit, photographie et plie (2045).
#
# Les activités qu'on fait avec quelqu'un portent une borne d'année (`si`) : un
# point de lien ne va jamais à un gardien qui n'est plus derrière son comptoir.
# Jean Lavergne ne se lie pas en ville pendant le livre 4 (`!flag(histoire_h4)`) :
# le livre compte son lien lui-même (la fin rare demande +1, gagné sous un réverbère).
# Les textes n'accordent rien au personnage joué ; les objets datés ont leur année.
gens:

  # ═══════════════════════════════════════════════════════════ LE CORNER (bar)

  - id: marcel
    name: "Marcel Lambrot"
    label: "LE PATRON DU CORNER"
    genre: m
    portrait: {teint: clair, corpulence: large, age: age, coiffure: degarni, cheveux: gris, pilosite: moustache, lunettes: aucune, tenue: chemise, couleur: creme, couleur2: bordeaux, accessoire: aucun}
    lieu: bar
    tranches: [midi, aprem, soir]
    annees: [1990, 2016]
    reseau: tribunes
    trace: "Marcel a sorti ton verre de sous le comptoir, celui qu'il ne lave pas devant les autres."
    paliers: ["te sert sans attendre la commande", "te garde un verre sous le comptoir", "fermerait le Corner pour toi"]
    froid: ["essuie le zinc quand tu entres", "te sert en dernier, et tiède", "ne te sert plus"]
    activites: [bar_jukebox]
    on_relation: {3: vi.marcel.cle, -3: vi.marcel.porte}
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Les Cobalts jouaient hier soir. J'ai laissé la télé éteinte, et personne me l'a demandée. Ils ont joué au 421 jusqu'à la fermeture."}
        - "Le calendrier des matchs est tombé derrière le frigo, et je ne l'ai pas ramassé. Ceux de la Nord parlent de rendre leurs cartes. Samedi, ils viendront, mais pour siffler."
      moyen:
        - {si: "role == selectionneur", texte: "Pour les Cobalts, on allume, on regarde la première mi-temps, et à la seconde on parle d'autre chose. Personne en veut à personne. On verra au prochain."}
        - "La Nord boit son demi, paie et rentre. Personne ne chante au comptoir, personne ne crache sur le club. Un mois comme ça, c'est un mois où tout peut tourner."
      haut:
        - {si: "role == selectionneur", texte: "Le soir des Cobalts, j'ai remonté des chaises de la cave. Des gens qui savaient pas le nom du gardien le gueulaient au comptoir. J'ai plus un verre propre."}
        - "J'ai ressorti le fanion du tiroir. Les gars de la Nord chantent en payant leurs tournées ; j'ai dû leur demander de baisser, pour les voisins. Ça ne m'était pas arrivé depuis 1984."
    repliques:
      - {lien: 0, si: "annee < 2002", texte: "Le demi est à dix francs depuis la Coupe de 1966. À onze, la Nord me ferait une banderole, et elle aurait raison."}
      - {lien: 0, si: "annee >= 2002", texte: "Les écus, je les range à part, dans la boîte à cigares. J'arrive pas à croire que c'est de l'argent. Les vieux non plus : ils me paient en comptant tout haut."}
      - {lien: 0, si: "serie_d >= 2", texte: "Trois samedis que le calendrier des matchs est derrière le frigo. Je le ramasserai quand y aura une raison de le relire."}
      - {lien: 0, si: "tranche == soir", texte: "La table du fond est aux anciens de la Nord. Le bout, si tu veux. Le milieu, c'est la chaise de Fernand ; personne s'y assoit depuis qu'on l'a enterré."}
      - {lien: 0, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "Le petit Rancé dormait sur cette banquette, y a pas trois semaines, pendant que son capitaine buvait. J'arrive pas à enlever le coussin."}
      - {lien: 1, texte: "Ton verre est sous le comptoir, à gauche, derrière la poire. Je le lave pas devant les autres : ils voudraient le même."}
      - {lien: 1, si: "flag(histoire_h1) && flag(h1_masques_tifo)", texte: "Ils ont punaisé ton visage en carton au-dessus de la caisse, à côté de la licence. J'ai rien dit. Le décrocher, moi ? Pour avoir la Nord sur le dos ?"}
      - {lien: 2, texte: "En 1966, le soir de la Coupe, j'ai servi jusqu'à six heures sans faire payer personne. C'est comme ça que j'ai eu le Corner : tout le quartier me devait une tournée."}
      - {lien: 2, si: "serie_v >= 2", texte: "La bouteille des bonnes semaines est presque vide. Si ça dure, je vais devoir en racheter une. Ça m'est pas arrivé depuis la montée."}
      - {lien: 3, texte: "Le papier jauni au-dessus du flipper, le record : le petit Benhamou, 1979. Parti au service, jamais revenu. Si je vends, ce sera à quelqu'un de chez lui."}
      - {lien: -1, texte: "Y a des tables. Le comptoir, c'est pour ceux qui viennent tous les jours."}
      - {lien: -2, texte: "La pression est coupée. Y a des bouteilles au frigo ; servez-vous et laissez la monnaie sur le coin."}
      - {lien: -3, texte: "Le Corner est fermé. Pour vous, il l'est à toutes les heures. La porte est derrière vous."}
    tuyaux:
      - id: marcel_banderole
        si: "tribunes < 40 && annee <= 2016 && role != selectionneur"
        texte: "« Jeudi, les anciens de la Nord ont fait passer une feuille au fond de la salle. Ils veulent une banderole contre toi samedi. Ils l'ont pas encore payée ; va les voir avant. »"
        effets: {jauges: {tribunes: 2}}
      - id: marcel_costumes
        si: "direction < 40 && annee <= 2016"
        texte: "« Mardi, à la table du fond, deux costumes de chez toi ont dîné avec un troisième qui payait en liquide. Ils ont parlé de toi au passé composé. »"
        effets: {jauges: {direction: 2}}
      - id: marcel_lhoste
        si: "flag(histoire_h1) && flag(h1_berline_brulee) && !flag(h1_lhoste_1974)"
        texte: "« L'inspecteur prend son café à la chaise de Fernand. En 1974, il était dans la Nord, contre la rambarde. Il a pleuré au coup de sifflet. Je l'ai servi le soir même. »"
      - id: marcel_cles_1984
        si: "flag(histoire_h4) && flag(h4_photo_entiere) && !flag(h4_capot)"
        texte: "« Le 14 mai 1984, à une heure et demie, le capitaine a pris les clés de la voiture du club sur mon zinc. Toi, tu dormais sur la banquette. Je l'ai dit aux gendarmes. Ils ont rien noté. »"
      - id: marcel_deux_crochets
        si: "flag(histoire_h7) && !flag(h7_rance_mort)"
        texte: "« Deux des tiens viennent ici après minuit, par la porte de la cour. Le capitaine boit de la poire ; le petit Rancé boit de l'eau et s'endort sur la banquette. Je lui mets une couverture. »"
    service:
      lien: 3
      label: "Calmer la Nord"
      texte: "Marcel monte sur une chaise, au fond de la salle, et parle dix minutes aux anciens de la Nord. Il ne dit pas ton nom une seule fois. Samedi, la banderole reste roulée."
      effets: {jauges: {tribunes: 4}}
      dette: true

  - id: kader
    name: "Kader Benhamou"
    label: "LE PATRON DU CORNER"
    genre: m
    portrait: {teint: olive, corpulence: moyen, age: mur, coiffure: court, cheveux: noir, pilosite: barbe, lunettes: aucune, tenue: chemise, couleur: marine, accessoire: montre}
    lieu: bar
    tranches: [midi, aprem, soir]
    annees: [2017, 2050]
    reseau: tribunes
    trace: "Kader a posé ton demi sur le sous-bock du club, celui qu'il garde pour ceux qui reviennent."
    paliers: ["te sert ton demi sans demander", "te garde le tabouret du bout", "baisserait le rideau pour toi"]
    froid: ["te fait attendre au comptoir", "te sert au tarif des passants", "ne te sert plus"]
    activites: [bar_flux]
    on_relation: {3: vi.kader.record, -3: vi.kader.ecran}
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Les Cobalts sont passés sur l'écran du fond, sans le son. Un client a demandé les courses à la place. J'ai mis les courses."}
        - {si: "role == president && annee >= 2034", texte: "Les socios boivent ici avant de voter. Hier, sur un sous-bock, ils ont fait la liste des mains qui se lèveraient contre toi. Il en manquait trois."}
        - "La Nord vient d'habitude regarder les matchs à l'extérieur ici. Samedi, la salle était vide à la mi-temps. Ils préfèrent ne pas voir. Ce n'est jamais bon signe."
      moyen:
        - {si: "role == selectionneur", texte: "Le soir des Cobalts, la moitié de la salle regarde l'écran, l'autre son téléphone. Quarante demis, comme un mardi."}
        - "On parle du club au comptoir comme de la météo : ça peut tourner. Personne ne siffle, personne n'achète d'écharpe. La Nord garde son avis pour plus tard."
      haut:
        - {si: "role == selectionneur", texte: "Pour les Cobalts, j'ai loué un deuxième écran et il a fallu ouvrir la cour. Des gamins ont peint le nom du gardien sur la vitrine. Je l'ai laissé."}
        - "Les gars de la Nord ont réservé toute la salle pour samedi soir, avant même le match. Ils ont payé d'avance. Même du temps de Marcel, on n'avait pas vu ça."
    repliques:
      - {lien: 0, texte: "Le papier jauni, au-dessus du flipper, c'est mon père. Le record de 1979. Marcel l'a laissé en partant ; il a dit que ça faisait partie du fonds."}
      - {lien: 0, si: "annee >= 2024", texte: "On me propose une borne de paris à côté du flipper. Trois cents écus par mois, et j'aurais rien à faire. C'est ça qui me gêne."}
      - {lien: 0, si: "serie_d >= 2", texte: "Quand ça perd, je mets la musique avant la fin du résumé, fort, pour couvrir le commentateur."}
      - {lien: 1, si: "annee <= 2025", texte: "Marcel passe le jeudi, à quatre heures, quand c'est vide. Il prend un café, il vérifie que la poire est toujours sur l'étagère du haut, et il repart."}
      - {lien: 1, si: "tranche == soir", texte: "Le soir, j'ouvre la cour aux fumeurs. Ceux de la Nord y parlent plus franchement qu'au comptoir. La fenêtre de la réserve donne sur la cour."}
      - {lien: 2, si: "!mission(vi.sc.kader_pere)", texte: "Mon père est jamais revenu ici. Il passait en voiture, il ralentissait devant la vitrine, et il accélérait. J'ai jamais su s'il regardait le flipper ou le comptoir."}
      - {lien: 2, si: "annee >= 2034", texte: "Le petit Nino boit son café ici avant les assemblées. Il compte ses voix sur ses doigts, et il recommence quand il se trompe. Il se trompe souvent, ces temps-ci."}
      - {lien: 3, texte: "Si un soir t'as besoin que le Corner se souvienne pas de toi, dis-le-moi avant de commander. Après, y a toujours quelqu'un qui a vu le reçu."}
      - {lien: -1, texte: "Tabouret ou table ? Les tabourets sont aux habitués. Les tables, à tout le monde."}
      - {lien: -2, texte: "Pour vous, c'est le prix affiché. Les habitués ont un autre prix ; vous êtes plus sur la liste."}
      - {lien: -3, texte: "Je sers pas. Ni vous, ni ceux qui viennent de votre part. Le Corner choisit ses clients, ça date de Marcel."}
    tuyaux:
      - id: kader_cour
        si: "tribunes < 40 && annee >= 2017 && role != selectionneur"
        texte: "« Jeudi, dans la cour, ceux de la Nord ont voté à main levée : samedi, à la vingtième minute, ils tournent le dos au terrain. T'as deux jours pour leur parler. »"
        effets: {jauges: {tribunes: 2}}
      - id: kader_cote_milieu
        si: "flag(histoire_h8) && annee >= 2024"
        texte: "« Le dimanche, sur mon écran, la cote de ton milieu de terrain tombe une heure avant la composition. Un client joue avant tout le monde, toujours le même, et il connaît rien au foot. »"
      - id: kader_ecran_dome
        si: "flag(histoire_h9) && annee >= 2030"
        texte: "« La Fédération a appelé pour réserver le Corner pour le Mondial : un écran géant, des drapeaux fournis, un photographe. Ils veulent des visages contents. J'ai dit que je réfléchissais. »"
      - id: kader_second_clapet
        si: "flag(histoire_h10) && saison >= 2 && !flag(h10_clapet_nino)"
        texte: "« Nino a deux téléphones. Le second sonne comme en 1995. Quand il sonne, il sort dans la cour, il écoute, la main sur l'autre oreille, et il revient payer sa tournée. »"
        effets: {set: [h10_clapet_nino]}
    service:
      lien: 3
      label: "La salle du fond"
      texte: "Kader tire le rideau de la salle du fond et décroche le téléphone du comptoir. Ceux de la Nord t'écoutent une heure, sans écran, sans témoin. Samedi, ils chantent."
      effets: {jauges: {tribunes: 4, direction: -1}}

  # ═══════════════════════════════════════════════════════ LE TERMINUS (terminus)

  - id: emile
    name: "Émile Darnaud"
    label: "LE PATRON DU TERMINUS"
    genre: m
    portrait: {teint: clair, corpulence: large, age: age, coiffure: casquette, coiffe: marine, cheveux: blanc, pilosite: moustache, lunettes: aucune, tenue: pull, couleur: gris, accessoire: aucun}
    lieu: terminus
    tranches: [matin, midi, aprem, soir]
    annees: [1990, 2009]
    reseau: rue
    trace: "Émile a rempli ton verre de café à ras bord, comme pour un chauffeur qui part de nuit."
    paliers: ["te fait une place au zinc", "te sert ton café dans un verre", "sortirait le vieux car pour toi"]
    froid: ["te laisse debout près de la porte", "te sert dans une tasse", "ne te sert plus"]
    activites: [terminus_telephone, terminus_tierce]
    on_relation: {3: vi.emile.car, -3: vi.emile.horaires}
    repliques:
      - {lien: 0, si: "tranche == matin", texte: "Le six heures dix pour Valdorne part à six heures douze. Depuis vingt ans. Le chauffeur dit que c'est le temps de finir son verre. Je le contredis pas."}
      - {lien: 0, texte: "On boit debout, ici. Les chaises, c'est pour ceux qui attendent quelqu'un. Vous attendez quelqu'un ?"}
      - {lien: 0, si: "serie_d >= 2", texte: "Samedi, le car des supporters est parti à moitié vide. Le chauffeur a tiré les rideaux pour pas voir les sièges dans son rétroviseur."}
      - {lien: 1, texte: "J'ai conduit le Valdorne-Portclair vingt-cinq ans avant d'acheter ici. Trois accidents, pas un mort. Au comptoir, j'en ai déjà perdu deux."}
      - {lien: 1, si: "tranche == soir", texte: "Après dix heures, la porte du fond s'ouvre pour d'autres que moi. Je loue la pièce, je regarde pas dedans. Le loyer tombe le vendredi."}
      - {lien: 2, texte: "Le vieux car de la cour, je l'ai racheté à la compagnie quand ils l'ont réformé. Il emmenait la Nord en déplacement. Il demande qu'à repartir."}
      - {lien: 2, si: "flag(histoire_h2)", texte: "Le chauffeur du club boit son café au bout du zinc, toujours dans le même verre. Il écoute les autres chauffeurs. C'est le seul qui a jamais d'accident à raconter."}
      - {lien: 3, texte: "Le car de cinq heures pour Portclair, il s'arrête où je lui dis. Pour partir sans qu'on te voie, y a pas mieux. Le chauffeur demande jamais le nom."}
      - {lien: -1, texte: "Le zinc est plein. Y a de la place près de la porte, à côté des horaires."}
      - {lien: -2, texte: "Pour vous, ce sera une tasse. Les verres, c'est pour les gens qui travaillent tôt."}
      - {lien: -3, texte: "Le Terminus ouvre à cinq heures pour les chauffeurs. Pour vous, il ouvre plus. Prenez le car ; il en passe un toutes les heures."}
    tuyaux:
      - id: emile_cartable
        si: "direction < 45 && annee <= 2009"
        texte: "« Un de chez toi prend le car de sept heures vingt-cinq pour la capitale, le mardi, sans le dire à personne. Il revient par le dernier, avec un cartable qu'il avait pas le matin. »"
        effets: {jauges: {direction: 2}}
      - id: emile_berline
        si: "flag(histoire_h2) && flag(h2_wagon_vu) && !flag(h2_carnet) && !flag(h2_rive)"
        texte: "« La berline grise de l'ancien a jamais quitté la ville. Le chauffeur du club la conduit la nuit jusqu'à la cour du garage du Pont, sous une bâche. Il y retourne le jeudi. »"
        effets: {set: [h2_cherche_voiture]}
      - id: emile_loyer
        si: "flag(histoire_h3) && flag(h3_studio_fardelli)"
        texte: "« Le loyer de ta mère, là-haut, c'est pas elle qui le paie. Un monsieur en voiture le pose sur le zinc le premier du mois, en liquide. Il prend jamais de café. »"
      - id: emile_minuit
        si: "flag(histoire_h6) && saison >= 2"
        texte: "« Le petit stagiaire du club prend le car de minuit vingt pour Portclair. Il arrive toujours en courant, à minuit, du côté du club-house, son ordinateur sous le bras. »"
        effets: {var: {h6_indices: "+1"}}
    service:
      lien: 3
      label: "Sortir le vieux car"
      si: "role != selectionneur"
      texte: "Émile essuie le pare-brise du vieux car avec sa manche et emmène la Nord au déplacement de samedi. Tu paies le gasoil ; il refuse le reste. Au retour, ils chantent ton nom."
      effets: {jauges: {tribunes: 4}, var: {ville_francs: "-150"}}

  - id: johnny
    name: "Johnny Mazet"
    label: "LE PATRON DU TERMINUS"
    genre: m
    portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: brosse, cheveux: chatain, pilosite: rase, lunettes: aucune, tenue: veste, couleur: marine, accessoire: aucun}
    lieu: terminus
    tranches: [matin, midi, soir]
    annees: [2010, 2050]
    reseau: rue
    trace: "Johnny a servi ton café avant celui du chauffeur de six heures douze, ce qu'il ne fait pour personne."
    paliers: ["te réserve un coin du zinc", "te prévient des cars en retard", "te ramènerait de nuit sans poser de question"]
    froid: ["te fait attendre le café", "ne te répond plus", "ne te sert plus"]
    on_relation: {3: vi.johnny.carte, -3: vi.johnny.depot}
    repliques:
      - {lien: 0, si: "annee <= 2018", texte: "Émile vient encore me vendre des conseils, le matin, avec son café. Je lui dois douze mensualités pour le fonds, et il se paie en conseils, je crois bien."}
      - {lien: 0, si: "tranche == matin", texte: "Le premier car part à six heures douze. J'ai gardé l'horaire d'Émile : le chauffeur finit son verre. On a jamais perdu un passager pour deux minutes."}
      - {lien: 0, si: "annee >= 2040", texte: "La ligne de Valdorne roule sans chauffeur. Les gens descendent ici entre deux cars, juste pour qu'on leur réponde. Je réponds. Ils reprennent un café."}
      - {lien: 1, texte: "J'ai conduit le car des supporters cinq saisons, à la fin des années quatre-vingt-dix. On m'avait dit de pas écouter ce qui se disait au fond. J'ai écouté quand même."}
      - {lien: 1, si: "tranche == soir", texte: "La porte du fond s'ouvre à dix heures. Le neveu Santucci a ses clés, moi les miennes. On s'en sert jamais en même temps."}
      - {lien: 2, texte: "Le vieux car d'Émile est toujours dans la cour. Je fais tourner le moteur le premier dimanche du mois, comme lui. S'il démarre plus, je ferme."}
      - {lien: 2, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "Le père Rancé boit au bout du zinc depuis l'enterrement. Il paie chaque verre en pièces, une par une, pour que ça dure plus longtemps."}
      - {lien: 3, texte: "Si un soir t'as besoin de rentrer sans croiser personne, y a le car de service de vingt-trois heures. Il s'arrête nulle part. Pour toi, il s'arrêtera."}
      - {lien: -1, texte: "On boit au fond. Le zinc, ce matin, est aux chauffeurs."}
      - {lien: -2, texte: "J'ai plus de café. J'en aurai pour le car de six heures douze, pas avant."}
      - {lien: -3, texte: "On vous sert plus, ici. Les chauffeurs l'ont demandé. Eux qui demandent jamais rien."}
    tuyaux:
      - id: johnny_dossier
        si: "direction < 45 && annee >= 2010"
        texte: "« Un homme de la capitale descend du car de onze heures chaque jeudi, un dossier sous le bras. Il va qu'à ton club, et il demande l'arrêt en disant ton nom. »"
        effets: {jauges: {direction: 2}}
      - id: johnny_bus
        si: "flag(histoire_h7) && flag(h7_rance_mort) && annee <= 2012"
        texte: "« Le bus de la Fédération, derrière l'hôtel : la nuit, ton capitaine y monte avec une bouteille et s'assoit à la place du fond. Mes chauffeurs le voient en rentrant du dépôt. »"
      - id: johnny_voix
        si: "flag(histoire_h8) && flag(h8_voix_ferlac) && saison >= 2 && !flag(h8_ines) && !flag(h8_nom_voix)"
        texte: "« Le grand maigre du bout du zinc vendait un nom, deux cents écus. Je les ai avancés ; tu me les rendras. Elle s'appelle Inès, elle lit l'écran la nuit et rentre par le train du samedi. »"
        effets: {set: [h8_nom_voix], var: {ville_amende: "+1300"}}
      - id: johnny_capo
        si: "flag(histoire_h10) && saison >= 2"
        texte: "« Ton capo passe par ma cour pour aller au fond, à minuit, sans prendre de verre. Il en ressort plus pâle. Le neveu Santucci lui fait crédit, et ça lui ressemble pas. »"
    service:
      lien: 3
      label: "Le car de vingt-trois heures"
      texte: "À vingt-trois heures, le car de service s'arrête au coin de ta rue, tous feux éteints. Le chauffeur te dépose côté cour et repart en seconde, au ralenti. Dans la rue, personne n'a rien vu."
      effets: {jauges: {direction: 2, vestiaire: 1}}
      dette: true

  # ═════════════════════════════════════════════ L'ARRIÈRE-SALLE DU TERMINUS (tripot)

  - id: ange
    name: "Ange Santucci"
    label: "LE PATRON DE LA TABLE"
    genre: m
    portrait: {teint: olive, corpulence: fin, age: age, coiffure: court, cheveux: blanc, pilosite: rase, lunettes: carrees, tenue: costume, couleur: noir, couleur2: blanc, accessoire: montre}
    lieu: tripot
    tranches: [soir, nuit]
    annees: [1990, 2007]
    reseau: milieu
    trace: "Ange a écrit tes initiales dans son carnet d'écolier, au crayon, pas à l'encre."
    paliers: ["te fait asseoir à la table", "te montre ses cotes avant samedi", "effacerait une ardoise pour toi"]
    froid: ["te fait attendre à la porte", "fait recompter tes jetons", "te ferme la table"]
    on_relation: {3: vi.ange.page, -3: vi.ange.cote}
    repliques:
      - {lien: 0, texte: "On joue l'argent de ce soir, sous le cendrier. Celui de la semaine prochaine, tu le gardes dans ta poche, ou tu vas en parler à la porte."}
      - {lien: 0, si: "tranche == nuit", texte: "Après deux heures, on enlève les chaises vides. Ça évite aux gens de croire qu'ils attendent quelqu'un."}
      - {lien: 0, si: "annee < 2002", texte: "Les billets, chez moi, on les plie en long. Celui qui les plie en quatre, il cache quelque chose. Je lui prête pas."}
      - {lien: 1, texte: "Le donneur a été croupier sur la côte. Il a eu une histoire, on dit pas laquelle. Depuis, il touche plus une carte de la main gauche."}
      - {lien: 1, si: "serie_v >= 2", texte: "Ton club gagne, et je perds de l'argent : tout le monde mise dessus. Je préfère quand ça hésite. Un nul, et ils restent jusqu'à trois heures."}
      - {lien: 1, si: "flag(histoire_h2)", texte: "Le chauffeur du club joue jamais. Il vient voir qui perd. Moi, je préfère les clients qui jouent."}
      - {lien: 2, texte: "Quarante ans que je tiens une table, et pas une main jouée. Celui qui tient la table joue pas."}
      - {lien: 3, texte: "Un score, on te le proposera. Viens me voir avant de répondre : je te dirai combien il vaut, et qui l'a déjà acheté."}
      - {lien: -1, texte: "La table est complète. Elle l'est souvent quand vous entrez."}
      - {lien: -2, texte: "Ce soir, vos jetons, on les recompte deux fois. Par politesse."}
      - {lien: -3, texte: "La table vous est fermée, et le Terminus aussi après dix heures. Le donneur a la mémoire des visages ; c'était son métier."}
    tuyaux:
      - id: ange_cafe
        lien: 1
        si: "flag(histoire_h2) && !flag(h2_cafe_norbert) && !flag(h2_questions_norbert)"
        texte: "« Le chauffeur du club m'a chargé de vous dire qu'il vous doit un café. Chez lui, un café se boit à minuit, ici, entre le tapis et le cendrier. »"
        effets: {set: [h2_cafe_norbert]}
      - id: ange_volet
        si: "flag(histoire_h2)"
        texte: "« La table, c'est moi qui la tiens. La clé du volet, la boîte et le carnet des dettes, c'est le chauffeur du club. Moi, je fais jouer ; lui, il ferme. Demain, je te l'aurai pas dit. »"
      - id: ange_ardoise
        si: "flag(histoire_h3) && flag(h3_ardoise)"
        texte: "« Ta page du Rideau a été vendue jeudi, avec deux autres. Celui qui l'a achetée veut pas ton argent, il veut un samedi. Méfie-toi du survêtement neuf. »"
      - id: ange_poli
        lien: 3
        si: "flag(histoire_h6) && saison >= 2"
        texte: "« L'ardoise du père Rancé ? Y a aucun club étranger qui a appelé ici. C'est un jeune homme poli qui a demandé le chiffre exact, avec une machine qui tapait pendant qu'il parlait. »"
        effets: {var: {h6_indices: "+1"}}
      - id: ange_portclair
        si: "annee <= 2007"
        texte: "« Samedi, quelqu'un a misé gros sur une défaite de deux buts. Pas ici : à Portclair, par téléphone. J'aime pas les paris qu'on fait de loin. Regarde qui, chez toi, a un téléphone neuf. »"
        effets: {jauges: {vestiaire: 2}}
    service:
      lien: 3
      label: "Un prêt sans papier"
      texte: "Ange ouvre la boîte en fer et compte des billets usés, de toutes les couleurs. « Pas d'intérêt, pas de papier. Je te dirai un jour ce que ça coûte. » L'argent sent le tabac froid."
      effets: {var: {ville_francs_sales: "+2000"}}
      dette: true

  - id: toussaint
    name: "Toussaint Santucci"
    label: "LE PATRON DE LA TABLE"
    genre: m
    portrait: {teint: olive, corpulence: moyen, age: mur, coiffure: meche, cheveux: noir, pilosite: bouc, lunettes: aucune, tenue: chemise, couleur: noir, accessoire: aucun}
    lieu: tripot
    tranches: [soir, nuit]
    annees: [2008, 2050]
    reseau: milieu
    trace: "Toussaint a essuyé ta chaise avant que tu t'assoies, comme son oncle le faisait pour les habitués."
    paliers: ["te garde une chaise à la table", "te parle de son oncle", "fermerait la table pour toi"]
    froid: ["te fait payer la porte", "fait recompter tes jetons", "te ferme la table"]
    on_relation: {3: vi.toussaint.boite, -3: vi.toussaint.mise}
    repliques:
      - {lien: 0, texte: "Mon oncle disait : celui qui tient la table joue pas. Je l'ai cru vingt ans. Et puis j'ai pris sa place, et le premier soir, c'est moi qui ai perdu le plus."}
      - {lien: 0, si: "annee >= 2024", texte: "Les gamins parient sur leur téléphone, contre une machine qui les regarde pas. Ici, y a au moins quelqu'un pour voir leur tête quand ils perdent."}
      - {lien: 0, si: "tranche == nuit", texte: "À trois heures, je ferme le volet et je pose la clé sur le tapis. Les gens jouent mieux quand ils voient la clé. Ils savent qu'ils peuvent partir."}
      - {lien: 1, texte: "Au bar de fortune, je servais à seize ans, un torchon sur le bras. Lentement, sans regarder les mains des joueurs. On m'avait dit : comme à un enterrement."}
      - {lien: 1, si: "serie_d >= 2", texte: "Quand ton club perd, la table se remplit. Les gens viennent perdre ailleurs que dans leur tête. Ça me fait pas plaisir. Je ramasse quand même."}
      - {lien: 2, texte: "Mon oncle est enterré avec un jeu de cartes neuf dans la poche, jamais ouvert. Il disait qu'on sait pas, là-bas, qui tient la table."}
      - {lien: 2, si: "flag(histoire_h10)", texte: "Le capo des socios joue ici depuis l'hiver. Il perd pas, il gagne pas : il attend un coup de fil entre deux mains. Ça se fait pas, à une table."}
      - {lien: 3, texte: "Si quelqu'un te propose de perdre un samedi, donne-moi son nom. Ma table, je veux pas qu'on la salisse avec ça."}
      - {lien: -1, texte: "La table est pleine ce soir. Revenez quand vous saurez ce que vous venez y chercher."}
      - {lien: -2, texte: "On recomptera vos jetons. On le fait pour tous ceux qui parlent trop, ailleurs."}
      - {lien: -3, texte: "La table vous est fermée. Ce soir, et les autres soirs. Inutile de frapper au volet."}
    tuyaux:
      - id: toussaint_carton
        si: "annee >= 2008"
        texte: "« Un homme de Portclair a misé ici sur un carton rouge à l'un des tiens, samedi, dans le premier quart d'heure. Il sait quelque chose, ou il a quelque chose à vendre. »"
        effets: {jauges: {vestiaire: 2}}
      - id: toussaint_gage
        si: "annee >= 2008 && vestiaire < 45"
        texte: "« Un gars de chez toi a voulu laisser sa montre en gage, mardi. On refuse les montres. Il est revenu le lendemain avec une enveloppe à la place. J'ai pas demandé d'où. »"
        effets: {jauges: {vestiaire: 1, direction: 1}}
      - id: toussaint_dame
        si: "flag(histoire_h10) && saison >= 2"
        texte: "« Le capo doit quarante mille écus à la table. Une dame a proposé de tout régler, par téléphone, d'une voix très polie. J'ai pas dit oui. J'aime pas les dettes qu'on paie par téléphone. »"
    service:
      lien: 3
      label: "Fermer les paris"
      texte: "Toussaint efface à l'éponge toutes les cotes qui te concernent et fait passer le mot jusqu'à Portclair : pour un mois, plus personne ne prend de pari sur ton club."
      effets: {jauges: {vestiaire: 3, direction: 1}}

  # ═════════════════════════════════════════════════════ LE TABAC DU QUAI (tabac)

  # Jean Lavergne, le buraliste du livre 4 : on n'écrit que sa vie en ville. Il sert
  # les mariniers, tient la craie des cotes, garde dans sa cave le registre des paris
  # de 1974 (livre 1) ; sa fille passe les appels de la ville au standard de l'hôtel,
  # son fils reprend le tabac en 2010. Pendant le livre 4, il ne se lie pas en ville.
  - id: lavergne
    lieu: tabac
    tranches: [matin, midi, aprem]
    annees: [1990, 2009]
    reseau: rue
    trace: "Lavergne t'a rendu la monnaie pièce par pièce, en comptant tout haut, comme à un marinier."
    paliers: ["te rend la monnaie sans compter tout haut", "te garde L'Écho plié sous le comptoir", "descendrait à la cave pour toi"]
    froid: ["recompte ta monnaie devant toi", "te tend le journal à l'envers", "ne te vend plus rien"]
    repliques:
      - {lien: 0, si: "tranche == matin", texte: "La Rive est à quatre-vingts sous la marque. Les mariniers disent que l'hiver sera sec. Ils disent ça tous les ans, et en mars ils remontent les sacs de sable."}
      - {lien: 0, texte: "Le Quotidien arrive à six heures dix, L'Écho à six heures et demie. Entre les deux, les mariniers lisent la météo des rivières sur mon ardoise. Ils me croient plus que la radio."}
      - {lien: 0, si: "annee < 2010", texte: "Votre ligne est sur l'ardoise, entre la crue de printemps et le mariage de la fille de l'éclusier. Les cotes, c'est pas moi qui les fixe. Moi, je tiens la craie."}
      - {lien: 1, si: "!flag(histoire_h4)", texte: "Le mardi et le jeudi, c'est ma femme qui tient le comptoir. Ces jours-là, les mariniers restent plus longtemps. Elle fait pas crédit, mais elle écoute."}
      - {lien: 1, si: "!flag(histoire_h4) && tranche == aprem", texte: "La marque au crayon, sur le mur, c'est la crue de 1955. L'eau s'est arrêtée au bord du comptoir. J'ai servi les pompiers les pieds dans l'eau."}
      - {lien: 1, si: "flag(histoire_h4) && flag(h4_lavergne_fenetre)", texte: "Sous le réverbère, vous êtes {pg, select, f{descendue} other{descendu}}. En six ans, personne était descendu. Je dis pas que ça change quelque chose."}
      - {lien: 2, si: "!flag(histoire_h4)", texte: "Ma fille passe les appels de toute la ville, au standard de l'hôtel. Elle sait qui appelle qui, à quelle heure. Elle en dit rien, même pas à son père."}
      - {lien: 2, si: "!flag(histoire_h4) && annee >= 2004", texte: "Mon fils reprendra le tabac. Il veut un écran pour les cotes, à la place de l'ardoise. Je lui ai dit d'attendre que je sois mort. Il attendra moins longtemps que ça."}
      - {lien: 3, si: "!flag(histoire_h4)", texte: "Je descends à la cave qu'avec la lampe de mon père. Y a des registres que personne a ouverts depuis 1974. S'il faut cacher quelque chose un jour, elle est là."}
      - {lien: -1, texte: "Votre journal. Le compte est juste ; vous pouvez vérifier."}
      - {lien: -2, texte: "J'ai plus de L'Écho. Il en reste au kiosque du quai, à deux cents mètres."}
      - {lien: -3, texte: "Le tabac vous est fermé. La cave aussi, et la cour. Vous prendrez vos cigarettes ailleurs, et vos nouvelles avec."}
    tuyaux:
      - id: lavergne_sauvat
        si: "flag(histoire_h1) && flag(h1_masques_tifo)"
        texte: "« Le fils Sauvat passe le lundi relever ses paris du Quai. Il a demandé votre adresse, et celle de votre président. Il veut savoir lequel des deux lui coûtera le moins cher. »"
      - id: lavergne_micro
        lien: 1
        si: "flag(histoire_h4) && flag(h4_lavergne_fenetre) && flag(h4_standard_vu)"
        texte: "« Ma fille veut ni chèque ni excuses. Elle veut une voix, devant tout le monde, et le nom de celui qui tenait le volant. Le reste, elle le jette à la Rive. »"
      - id: lavergne_jeune_homme
        si: "flag(histoire_h6) && saison >= 2"
        texte: "« Un jeune homme poli mise ici sur vos ventes, la veille, jamais sur les matchs. Il annonce le prix à cent mille près, et il gagne. Je prends plus ses paris. »"
        effets: {var: {h6_indices: "+1"}}
    service:
      lien: 3
      label: "La cave du tabac"
      si: "!flag(histoire_h4)"
      texte: "Lavergne prend la lampe de son père et descend devant toi. Ce que tu lui confies dort derrière les registres de 1974. « La police descend jamais ici. Elle a peur de l'eau. »"
      effets: {clear: [h1_vl_carton], jauges: {direction: 1}}

  - id: fabrice
    name: "Fabrice Lavergne"
    label: "LE BURALISTE DU QUAI"
    genre: m
    portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: court, cheveux: chatain, pilosite: bouc, lunettes: aucune, tenue: pull, couleur: bleu, accessoire: telephone}
    lieu: tabac
    tranches: [matin, aprem, soir]
    annees: [2010, 2050]
    reseau: milieu
    trace: "Fabrice a écrit ton nom à la craie en bas de l'écran des cotes, la seule ligne qu'il garde à la main."
    paliers: ["te garde la craie de ta ligne", "te dit qui mise sur toi", "fermerait les paris pour toi"]
    froid: ["annonce ta cote à tout le comptoir", "ne prend plus tes pièces", "ne te vend plus rien"]
    activites: [tabac_ecran, tabac_journaux_ecran]
    on_relation: {3: vi.fabrice.ticket, -3: vi.fabrice.affichette}
    repliques:
      - {lien: 0, texte: "L'ardoise est partie avec mon père. L'écran affiche les cotes du monde entier. J'ai gardé la craie que pour une ligne, en bas. On la lit en premier."}
      - {lien: 0, si: "tranche == matin", texte: "Le matin, c'est ma femme au comptoir. Elle prend pas de pari avant dix heures : elle dit que les mariniers parient mieux après leur café."}
      - {lien: 0, si: "serie_d >= 2", texte: "Ta cote a doublé en trois semaines. L'écran, il connaît personne, il calcule. Moi, j'aurais pas osé."}
      - {lien: 1, si: "annee <= 2020", texte: "Mon père vient encore le jeudi, à six heures, ouvrir le rideau. À son âge. Il dit que le rideau monte pas pareil pour moi."}
      - {lien: 1, si: "tranche == soir", texte: "Le soir, ma sœur passe prendre ses cigarettes avant son service de nuit, à l'hôtel. Elle fume pas. Elle les donne au veilleur."}
      - {lien: 2, texte: "La mobylette bleue est toujours dans la cour, sous une bâche. Je la démarre une fois par an, en mai. Ma sœur le sait. On en parle pas, ni elle ni moi."}
      - {lien: 2, si: "annee >= 2024", texte: "Les applications prennent des paris sur des corners, des touches, des minutes. Moi, je prends que des scores entiers. Les jeunes me trouvent lent."}
      - {lien: 3, texte: "Si quelqu'un mise gros contre toi, ici ou ailleurs, je le saurai le soir même. Je te le dirai le lendemain. C'est le plus vite que je puisse faire sans risque."}
      - {lien: -1, texte: "Les cotes sont à l'écran. Lisez-les vous-même ; je sers."}
      - {lien: -2, texte: "On prend plus les pièces, ici. Y a un distributeur sur le pont."}
      - {lien: -3, texte: "Ma femme m'a dit de plus vous servir. Je discute jamais avec ma femme le matin. Ni l'après-midi."}
    tuyaux:
      - id: fabrice_cartons
        si: "annee >= 2010 && vestiaire < 45"
        texte: "« Un de chez toi mise sur ses propres matchs, ailleurs que chez moi. Il gagne petit, souvent, sur des cartons jaunes. Le jaune, il le prend quand il veut. »"
        effets: {jauges: {vestiaire: 2}}
      - id: fabrice_cahier
        si: "flag(histoire_h7) && flag(h7_rance_mort)"
        texte: "« Ma sœur tient un cahier, la nuit, au standard : qui demande quelle clé, et à quelle heure. Personne lui a rien demandé, cette nuit-là. Elle attend qu'on le lui demande. »"
      - id: fabrice_bracelets
        si: "flag(histoire_h8)"
        texte: "« Les courbes de nuit de tes joueurs se revendent à Portclair, à ceux qui parient. Un défenseur qui a dormi trois heures, ça vaut une cote. Les bracelets mentent pas, eux. »"
      - id: fabrice_loyer
        si: "flag(histoire_h10) && saison >= 2"
        texte: "« Contre la montée, quelqu'un mise gros par un intermédiaire du Quai. Toujours le premier mardi du mois, toujours la même somme. On dirait un loyer. »"
    service:
      lien: 3
      label: "Fermer ta cote"
      texte: "Fabrice efface ta ligne à la craie, puis il éteint la colonne de ton club sur l'écran, avec un ruban adhésif noir. « Un mois sans cote. Ici, personne jouera contre toi. »"
      effets: {jauges: {vestiaire: 2, direction: 2}}

  # ═════════════════════════════════════════ LE TABAC DU CARREFOUR (tabac_stade)

  - id: firmin
    name: "Firmin Coudray"
    label: "LE TABAC DU CARREFOUR"
    genre: m
    portrait: {teint: clair, corpulence: fin, age: age, coiffure: degarni, cheveux: blanc, pilosite: moustache, lunettes: rondes, tenue: blouse, couleur: gris, couleur2: bordeaux, accessoire: journal}
    lieu: tabac_stade
    tranches: [matin, midi, aprem]
    annees: [1990, 2012]
    reseau: tribunes
    trace: "Firmin a replié pour toi la page des sports, le pli posé exactement sur le score."
    paliers: ["te replie la page des sports", "t'ouvre l'arrière-boutique", "te dirait le score avant tout le monde"]
    froid: ["te tend le journal du dessous", "te rend la monnaie en petites pièces", "baisse le rideau quand tu passes"]
    activites: [tabac_stade_telephone]
    on_relation: {3: vi.firmin.fenetre, -3: vi.firmin.rideau}
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Les lendemains des Cobalts, je vendais trente journaux de plus. Cette semaine, j'en ai renvoyé quarante, encore ficelés."}
        - "Samedi, de la fenêtre du fond, je n'ai entendu que des sifflets, et un long silence à la soixante-dixième. Les grilles d'abonnement restent sur le comptoir. Personne n'y touche."
      moyen:
        - {si: "role == selectionneur", texte: "Pour les Cobalts, les gens achètent le journal et commentent pas. Ils lisent le score, ils plient la page, et ils passent à la météo."}
        - "Samedi, j'ai entendu des cris, mais pas les grands. Les supporters passent au carrefour sans s'arrêter, ni pressés ni en colère. Ils attendent de voir, comme moi."
      haut:
        - {si: "role == selectionneur", texte: "Le lendemain des Cobalts, à huit heures, j'avais plus un journal. Des gens qui ont jamais acheté un sportif m'en ont pris deux. Un pour eux, un pour le beau-frère."}
        - "Samedi, le stade m'a fait trembler les vitres trois fois. Au carrefour, les gars de la Nord achètent les pastilles par boîtes entières, pour la gorge. Ils chantent trop."
    repliques:
      - {lien: 0, si: "jour == sam", texte: "Le samedi après-midi, je vends moins et j'écoute plus. La fenêtre du fond donne sur la Rive. Je vais jamais au stade : d'ici, je l'entends mieux."}
      - {lien: 0, texte: "Le jardinier du stade fume des brunes qu'on trouve plus qu'ici. Je les mets de côté sous le comptoir, avec son nom dessus. C'est mon dernier client pour cette marque."}
      - {lien: 0, si: "annee < 2000", texte: "Les journalistes de Portclair dictent leur papier à la mi-temps sur le téléphone de mon comptoir. La cabine d'en face marche qu'une fois sur deux. Ils me paient en pastilles."}
      - {lien: 1, texte: "Le photographe de L'Écho me fait signe depuis la tribune de presse après chaque but : un doigt pour nous, le poing pour eux. J'ai le score avant la radio."}
      - {lien: 1, si: "serie_d >= 2", texte: "Les maris qui rentrent du stade par le carrefour m'achètent plus de pastilles. Ils veulent pas que leur femme sache qu'ils ont crié. Ils ont pas crié."}
      - {lien: 2, texte: "J'ai ouvert en 1960, la semaine où on a refait les grilles. Depuis, je vois qui entre par la porte des joueurs. Elle grince toujours, celle-là, je l'entends d'ici."}
      - {lien: 2, si: "annee >= 2005", texte: "Mon oreille droite vaut plus rien. Ma fille vient écouter avec moi, le samedi, à la fenêtre du fond. Elle se trompe sur les petits cris. Elle apprendra."}
      - {lien: 3, texte: "Je connais le gardien des grilles depuis l'école. Si un soir tu dois entrer à la Rive sans qu'on le sache, frappe trois coups à la porte du jardinier."}
      - {lien: -1, texte: "Le journal du dessus est réservé. Prenez celui du dessous ; il dit la même chose."}
      - {lien: -2, texte: "J'ai plus de pastilles. Ni de journal. Revenez demain, peut-être."}
      - {lien: -3, texte: "Je baisse le rideau. C'est pas l'heure, je sais. C'est la vôtre."}
    tuyaux:
      - id: firmin_tonte
        si: "annee <= 2012 && role != president && role != selectionneur"
        texte: "« Le jardinier m'a dit qu'on lui a fait tondre la pelouse plus court pour samedi, sur ordre d'en haut, sans te le dire. Plus court, plus rapide. Ça arrange ceux d'en face. »"
        effets: {jauges: {vestiaire: 2}}
      - id: firmin_maigre
        si: "flag(histoire_h3) && saison >= 2 && !flag(h3_halle_vue)"
        texte: "« Le dimanche matin, un grand brun maigre m'achète deux cigarettes à l'unité, avec des pièces de la cité. Il regarde l'affiche de votre match comme on regarde une vitrine. »"
      - id: firmin_camionnette
        si: "flag(histoire_h5) && flag(h5_tribune_est_brulee) && !flag(h5_temoin)"
        texte: "« La nuit de l'Est, j'ai fermé tard. À une heure, une camionnette blanche des Terrasses est passée au carrefour tous feux éteints. Le gamin de la friche était à la grille. Il a tout vu. »"
    service:
      lien: 3
      label: "Parler au jardinier"
      texte: "Firmin glisse un paquet de brunes de plus dans la poche du jardinier. Samedi, la pelouse de la Rive est tondue à ta mesure et arrosée à midi. Personne ne saura pourquoi."
      effets: {jauges: {vestiaire: 3}}

  - id: nadege
    name: "Nadège Coudray"
    label: "LA BURALISTE DU CARREFOUR"
    genre: f
    portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: queue, cheveux: chatain, pilosite: rase, lunettes: carrees, tenue: blouse, couleur: bleu, accessoire: aucun}
    lieu: tabac_stade
    tranches: [matin, midi, aprem]
    annees: [2013, 2050]
    reseau: tribunes
    trace: "Nadège a écrit ton passage dans le cahier des habitués de son père, d'une écriture plus ronde."
    paliers: ["te garde les journaux du jour", "te laisse la fenêtre du fond", "remplirait la tribune pour toi"]
    froid: ["te fait payer par carte", "te rend la monnaie en pièces jaunes", "ne te sert plus"]
    on_relation: {3: vi.nadege.cahier}
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Les maillots des Cobalts sont soldés dans le bac du fond depuis un mois. Personne y touche, même à moitié prix. Je vais les mettre à trois écus."}
        - {si: "role == president && annee >= 2034", texte: "Des socios rendent leur carte à mon comptoir, pour que je la renvoie au club. J'en ai douze dans une boîte à chaussures. Ça m'était jamais arrivé."}
        - "Samedi, à la fenêtre du fond, j'ai entendu siffler dès la quinzième minute. Mon père disait qu'un stade qui siffle avant la mi-temps a déjà décidé quelque chose."
      moyen:
        - {si: "role == selectionneur", texte: "Les lendemains des Cobalts, on me demande le score. Personne a regardé le match, mais tout le monde veut le score."}
        - "Les gars de la Nord prennent leurs grilles, parlent du club une minute et changent de sujet. Ni contents ni fâchés. Mon père appelait ça la Rive en veille."
      haut:
        - {si: "role == selectionneur", texte: "Les maillots des Cobalts partent plus vite que les journaux. Des grand-mères m'en commandent pour leurs petits-enfants, en taille huit ans."}
        - "Samedi, à la fenêtre, j'ai cru que les vitres allaient tomber. Les supporters ont acheté toutes mes pastilles, et la vieille écharpe du présentoir. Il n'en reste plus une."
    repliques:
      - {lien: 0, texte: "Mon père écoutait le stade par la fenêtre du fond. Moi, c'est les clients que j'écoute. Les petits cris, je les entends mieux que lui."}
      - {lien: 0, si: "serie_d >= 2", texte: "On me rend des écharpes au comptoir, pour que je les revende. Je les range dans un carton, avec l'année au feutre. Le carton de l'an dernier est déjà vide."}
      - {lien: 0, si: "annee >= 2038", texte: "L'oreillette qui répond toute seule se vend mieux que les cigarettes. Les gens veulent être au téléphone sans y être. J'en ai jamais porté une."}
      - {lien: 1, texte: "Le jardinier du stade est à la retraite, mais il vient encore chercher ses brunes. On les fabrique plus ; mon père avait fait un stock. Il en reste pour deux ans."}
      - {lien: 1, si: "tranche == matin", texte: "À sept heures, ceux qui montent au club s'arrêtent plus pour le journal. Ils lisent sur leur téléphone en marchant. Je les regarde éviter les poteaux."}
      - {lien: 2, si: "annee >= 2014", texte: "Mon père est mort un samedi, à la mi-temps, la fenêtre ouverte. On a dit le cœur. Moi, je crois qu'il a entendu un petit cri de trop."}
      - {lien: 3, texte: "Si un samedi tu veux savoir comment la Nord va te recevoir, passe à midi. Je sais ce que les gars ont acheté le matin. Pastilles, c'est pour chanter. Le reste, c'est pour lancer."}
      - {lien: -1, texte: "La carte, c'est au-dessus de vingt écus. En dessous, faut des pièces. Vous en avez pas ? Dommage."}
      - {lien: -2, texte: "Votre journal. La monnaie est dans la soucoupe."}
      - {lien: -3, texte: "Je vous sers plus. Mon père disait qu'on refuse personne au carrefour. Il vous connaissait pas."}
    tuyaux:
      - id: nadege_oeufs
        si: "annee >= 2013 && tribunes < 40 && role != selectionneur"
        texte: "« Ce matin, les gars de la Nord ont pris tous mes rouleaux de papier et deux cartons d'œufs. C'est pas pour un pique-nique. Samedi, à la sortie, évite le côté de la tribune. »"
        effets: {jauges: {tribunes: 1, direction: 1}}
      - id: nadege_brassard
        si: "flag(histoire_h9)"
        texte: "« Les maillots avec le brassard noir cousu, je les vends sous le comptoir. Un monsieur poli du ministère est passé demander qui les achetait. Je lui ai vendu des pastilles. »"
      - id: nadege_oreillettes
        si: "flag(histoire_h10)"
        texte: "« Ton capo m'a acheté deux oreillettes qui répondent seules. Deux. Je lui ai demandé pourquoi ; il a dit qu'il avait deux oreilles. Il a pas ri. »"
    service:
      lien: 3
      label: "Remplir la tribune"
      texte: "Nadège affiche au carrefour, à la main, le prix des places de samedi et l'heure du car des supporters. Elle en parle à chaque client toute la semaine. Samedi, la tribune est pleine."
      effets: {jauges: {tribunes: 3, caisse: 1}}

  # ═══════════════════════════════════════════════════ LE KIOSQUE DU QUAI (kiosque)

  - id: leon
    name: "Léon Mauduit"
    label: "LE KIOSQUIER DU QUAI"
    genre: m
    portrait: {teint: clair, corpulence: fin, age: age, coiffure: casquette, coiffe: gris, cheveux: gris, pilosite: barbe, lunettes: rondes, tenue: veste, couleur: camel, accessoire: journal}
    lieu: kiosque
    tranches: [matin, midi]
    annees: [1990, 2014]
    reseau: presse
    trace: "Léon a plié ton journal à la page des sports, un coin corné là où il a écrit son pronostic."
    paliers: ["te tend le journal avant que tu le demandes", "te dit ses pronostics", "te montrerait la Une de demain"]
    froid: ["te fait attendre derrière les autres", "te tend la Gazette à la place", "ferme son volet quand tu passes"]
    activites: [dehors_kiosque_gazette]
    on_relation: {3: vi.leon.cahier, -3: vi.leon.vitre}
    repliques:
      - {lien: 0, texte: "Les camions de journaux passent à cinq heures, quand le quai est encore à moi. Je lis toutes les Unes avant tout le monde. Après, je fais semblant de les découvrir avec vous."}
      - {lien: 0, si: "jour == lun", texte: "Le lundi, je vends le journal à ceux qui ont perdu leur pari. Ils veulent voir le score écrit, pour y croire. Les autres l'ont déjà vu à la télé."}
      - {lien: 0, si: "serie_d >= 2", texte: "Mon cahier de pronostics est tout rouge depuis un mois. Rouge, je me suis trompé. Dans le bon sens : je vous voyais gagner."}
      - {lien: 1, texte: "Le banc à côté du kiosque, c'est celui des joueurs de cartes. Si l'un d'eux manque deux matins, je vais sonner chez lui. Personne d'autre le fait."}
      - {lien: 1, si: "annee < 2015", texte: "La Gazette Rose, je la glisse dans L'Écho pour ceux qui veulent pas qu'on les voie l'acheter. C'est-à-dire tout le monde. Elle se vend mieux que les deux autres."}
      - {lien: 2, texte: "Mon cahier commence en 1958. Des scores en rouge et en noir. Une seule saison presque sans rouge : 1966, l'année de la Coupe. J'osais plus rien pronostiquer."}
      - {lien: 2, si: "annee >= 2008", texte: "Les jeunes lisent les journaux sur leur téléphone, debout sous mon auvent, à l'abri de la pluie. Je les laisse. Ils me demandent l'heure ; c'est déjà ça."}
      - {lien: 3, texte: "Si un matin la Une parle de toi, je le saurai à cinq heures. Je te garderai le premier paquet. Tu auras deux heures d'avance sur la ville ; c'est tout ce que j'ai."}
      - {lien: -1, texte: "Attendez votre tour. Les habitués d'abord : ils sont là depuis 1958, eux."}
      - {lien: -2, texte: "L'Écho ? Il en reste plus. Y a la Gazette, si vous voulez lire sur vous."}
      - {lien: -3, texte: "Je ferme le volet. Pour vous, le kiosque ouvre plus. Vous apprendrez les nouvelles par les autres."}
    tuyaux:
      - id: leon_photographe
        si: "annee <= 2014"
        texte: "« Le photographe de la Gazette est passé me demander à quelle heure tu prends ton journal. Je lui ai dit midi. Passe à onze heures, par le quai du bas. »"
        effets: {jauges: {direction: 1}}
      - id: leon_mars_1975
        si: "flag(histoire_h1) && flag(h1_archives)"
        texte: "« Les archives de L'Écho, on les a vidées. Moi, j'ai encore dix exemplaires de mars 1975, celui de la passerelle, sous le kiosque. Personne me l'a jamais demandé. »"
      - id: leon_cutter
        si: "flag(histoire_h6)"
        texte: "« Le petit stagiaire de ton club m'achète tous les journaux étrangers le lundi. Il découpe les transferts au cutter sur mon comptoir et les tape dans son ordinateur, debout, le nez sur l'écran. »"
    service:
      lien: 3
      label: "La Une de demain"
      texte: "À cinq heures, sous l'auvent, Léon ouvre devant toi le premier paquet de L'Écho, puis le referme. Tu as lu la Une deux heures avant la ville. Il a déjà oublié que tu étais là."
      effets: {jauges: {direction: 2, tribunes: 1}}

  - id: samir
    name: "Samir Belkacem"
    label: "LE VENDEUR DU KIOSQUE"
    genre: m
    portrait: {teint: dore, corpulence: moyen, age: jeune, coiffure: court, cheveux: noir, pilosite: barbe, lunettes: aucune, tenue: doudoune, couleur: marine, accessoire: telephone}
    lieu: kiosque
    tranches: [matin, midi]
    annees: [2015, 2044]
    reseau: presse
    trace: "Samir a mis ton journal de côté, plié dans un sachet, ton nom au feutre sur le coin."
    paliers: ["te met le journal de côté", "te dit ce que la ville va lire", "noierait un journal pour toi"]
    froid: ["te fait payer d'avance", "ne te garde plus rien", "ferme le volet quand tu passes"]
    on_relation: {3: vi.samir.toit, -3: vi.samir.journaliste}
    repliques:
      - {lien: 0, si: "!mission(vi.sc.samir_vignette)", texte: "J'échangeais des vignettes sur la marche de la maison de la presse, gamin. Le numéro qui manquait à tout le quartier, je l'ai toujours. Je l'ai jamais collé."}
      - {lien: 0, si: "jour == dim && annee >= 2035", texte: "Le dimanche, L'Écho sort encore. J'en reçois quarante. À dix heures, il m'en reste douze, et une vieille dame qui attend le sien en lisant les autres."}
      - {lien: 0, si: "serie_d >= 2", texte: "Les gens me demandent le classement avant le journal. Je leur donne la météo. Ils me remercient ; ça leur suffit, en ce moment."}
      - {lien: 1, texte: "Mon cousin travaille sur le toit de la tribune, aux projecteurs. Il m'appelle à chaque but, et je l'annonce au quai avant la radio. C'est mon seul luxe."}
      - {lien: 1, si: "annee >= 2029", texte: "Le local au-dessus du kiosque, je le loue à une association, pour pas cher. Ils comptent des noms toute la nuit. La lumière est encore allumée quand j'ouvre."}
      - {lien: 2, texte: "Léon m'a vendu le kiosque avec son cahier de pronostics. J'ai continué en rouge et en noir. Je me trompe moins que lui. Il me manque son courage, pour le derby."}
      - {lien: 2, si: "annee >= 2040", texte: "La mairie veut mettre une borne à la place du kiosque, en 2045. Une borne qui imprime le journal à la demande. Je me demande qui lui dira bonjour."}
      - {lien: 3, texte: "Si un matin y a une photo de toi qui devrait pas exister, j'en vendrai pas une. Les paquets peuvent tomber dans la Rive. Ça arrive, avec le vent."}
      - {lien: -1, texte: "Vous payez d'avance, si ça vous fait rien. Y en a un qui est parti avec trois magazines, la semaine dernière."}
      - {lien: -2, texte: "J'ai plus rien de côté pour vous. Le présentoir, c'est pour tout le monde."}
      - {lien: -3, texte: "Le volet reste baissé. Allez lire ailleurs, il paraît que ça se fait."}
    tuyaux:
      - id: samir_livre
        si: "annee >= 2015 && annee <= 2044 && direction < 45"
        texte: "« Un journaliste de la capitale m'achète tous les journaux qui parlent de toi, depuis trois mois. Il les découpe sur le banc du quai. Il prépare un livre, ou un procès. »"
        effets: {jauges: {direction: 1}}
      - id: samir_lumiere
        si: "flag(histoire_h8) && flag(h8_video)"
        texte: "« Ta vidéo : on y voit ton bureau éclairé par la fenêtre de l'ouest. Ton bureau donne à l'est. Mon cousin fait les lumières du stade ; il l'a vu tout de suite. »"
      - id: samir_cles
        si: "flag(histoire_h9) && flag(h9_local_force)"
        texte: "« La nuit du local, ils sont entrés avec une clé. Ils ont forcé la porte après, pour faire propre. Y a que trois clés : la mienne, celle de ta fille, et celle de la mairie. »"
      - id: samir_marches
        si: "flag(histoire_h10)"
        texte: "« Le maçon de l'escalier nord achète L'Écho le dimanche et découpe la page des chantiers. Il m'a demandé combien il restait de marches. Il le sait. Il voulait l'entendre dire. »"
    service:
      lien: 3
      label: "Noyer le journal"
      texte: "Ce matin-là, le paquet du Quotidien n'arrive pas au kiosque du quai. Samir raconte à tout le monde que le vent l'a poussé dans la Rive. À six heures, il n'y avait pas un souffle."
      effets: {jauges: {direction: 2, tribunes: 1}}
      dette: true

  # ═════════════════════════════════════════════ LA MAISON DE LA PRESSE (presse)

  - id: simone
    name: "Simone Arnoux"
    label: "LA MAISON DE LA PRESSE"
    genre: f
    portrait: {teint: clair, corpulence: moyen, age: age, coiffure: chignon, cheveux: gris, pilosite: rase, lunettes: rondes, tenue: blouse, couleur: bleu, couleur2: creme, accessoire: stylo}
    lieu: presse
    tranches: [matin, midi, aprem]
    annees: [1990, 2019]
    reseau: presse
    trace: "Simone a écrit ton nom au crayon dans la marge de L'Écho, à côté de ceux des dix qu'elle sert d'avance."
    paliers: ["te met L'Écho de côté", "lève les sourcils rien que pour toi", "cacherait un journal pour toi"]
    froid: ["te rend la monnaie sans un regard", "ne te garde plus rien", "ne te vend plus rien"]
    activites: [presse_etrangere, presse_trois]
    on_relation: {3: vi.simone.plomb, -3: vi.simone.annonces}
    repliques:
      - {lien: 0, texte: "Le lundi, je lis la page des sports avant d'ouvrir, pour savoir quelle tête faire. Les clients regardent mon visage avant le journal."}
      - {lien: 0, si: "jour == lun", texte: "Le lundi, j'ai deux fois plus de monde. Ils lisent le match avant de m'en parler, pour être sûrs d'être d'accord avec le journal."}
      - {lien: 0, si: "serie_d >= 2", texte: "Il me reste trente guides de la saison. En août, on se les arrachait. Je vais finir par les vendre au poids, avec les annuaires."}
      - {lien: 1, texte: "Mon mari composait L'Écho au plomb, à l'imprimerie de la rue Haute. Il rentrait avec de l'encre jusqu'aux coudes. Je vends ce qu'il fabriquait ; je l'ai jamais lu en entier."}
      - {lien: 1, si: "annee < 2015", texte: "Ceux qui achètent la Gazette Rose demandent L'Écho avec, pour cacher l'autre dedans. Je les reconnais tous, même ceux qui changent de manteau."}
      - {lien: 2, si: "annee >= 2005", texte: "Ma fille veut reprendre le magasin. Je lui dis que le papier, c'est fini. Elle me répond que c'est pour ça qu'il faut quelqu'un. Allez discuter, avec ça."}
      - {lien: 2, si: "annee >= 2008", texte: "On me vole moins de magazines depuis que les gamins lisent sur leur téléphone. Avant, je les voyais grandir en les surveillant, du coin de l'œil, derrière la caisse."}
      - {lien: 3, texte: "Un journal qui te fait du mal, je peux le laisser au fond, sous les annuaires. Je l'ai jamais fait. Je le ferais une fois."}
      - {lien: -1, texte: "L'Écho est sur le présentoir. Servez-vous. La monnaie, sur la soucoupe."}
      - {lien: -2, texte: "J'ai plus d'exemplaire de côté. Mes dix clients sont servis, et vous en êtes plus."}
      - {lien: -3, texte: "J'aimerais que vous achetiez vos journaux au kiosque. Le kiosquier a moins de mémoire que moi."}
    tuyaux:
      - id: simone_valentienne
        si: "annee <= 2019 && vestiaire < 45"
        texte: "« Un gars de chez toi lit le journal de Halvenne au comptoir, depuis un mois, à la page des transferts. Il repart sans l'acheter. Il cherche son nom dedans. »"
        effets: {jauges: {vestiaire: 1}}
      - id: simone_trente
        si: "flag(histoire_h3) && flag(h3_ardoise)"
        texte: "« Une dame de la cité m'a commandé trente Gazette Rose pour mardi, payées d'avance, en pièces de dix francs. Elle sait ce qu'il y aura dedans. Elle veut tout acheter avant les autres. »"
      - id: simone_notaires
        si: "flag(histoire_h5) && flag(h5_maquette_vue)"
        texte: "« Madame Tessandier m'achète dix exemplaires de L'Écho chaque fois qu'il parle de la Rive. Et elle commande le journal de Portclair, seulement le mardi : la page des notaires. »"
    service:
      lien: 3
      label: "Cacher le journal"
      texte: "Ce matin-là, le journal qui parle de toi reste ficelé sous les annuaires, au fond de la réserve. Simone dit au livreur qu'elle n'en a pas reçu. Elle ment très mal, et il la croit."
      effets: {jauges: {direction: 2, tribunes: 2}}

  - id: delphine
    name: "Delphine Arnoux"
    label: "LA MAISON DE LA PRESSE"
    genre: f
    portrait: {teint: clair, corpulence: fin, age: mur, coiffure: carre, cheveux: brun, pilosite: rase, lunettes: carrees, tenue: pull, couleur: bordeaux, accessoire: aucun}
    lieu: presse
    tranches: [matin, aprem]
    annees: [2020, 2050]
    reseau: presse
    trace: "Delphine a glissé ton journal dans un sachet en papier de sa mère, celui à l'ancien logo."
    paliers: ["te garde ton journal", "te raconte ce qui se vend", "afficherait ta lettre en vitrine"]
    froid: ["te fait payer par carte", "ne te garde plus rien", "ne te vend plus rien"]
    activites: [presse_echo_dernier]
    on_relation: {3: vi.delphine.reserve}
    repliques:
      - {lien: 0, texte: "Le classement, je le lis à ce qu'on me vole. Les mauvaises semaines, on me vole même plus le journal."}
      - {lien: 0, si: "annee >= 2025", texte: "Je commande quarante Écho le dimanche. Trente-deux partent avant midi ; les huit autres vont aux vieux qui descendent plus. Je les porte moi-même, le soir."}
      - {lien: 0, si: "serie_d >= 2", texte: "Les cartes à collectionner du club partent plus. Les gamins préfèrent celles d'un club de la capitale. Je leur en veux pas ; j'en commande plus."}
      - {lien: 1, texte: "Ma mère me payait en vignettes, le samedi. J'ai encore l'album de 1986, complet sauf une page. Je l'ouvre pas devant les clients."}
      - {lien: 1, si: "tranche == matin", texte: "À sept heures, un ancien du virage vient lire les avis de décès debout. Il cherche les noms de la Nord. Quand il en trouve un, il achète le journal."}
      - {lien: 2, texte: "Le papier coûte trois fois plus cher qu'à mes débuts. Je vends moins, plus cher, à des gens plus vieux. Un jour, y aura plus qu'un lecteur. Je le servirai."}
      - {lien: 2, si: "annee >= 2037", texte: "La dame du dimanche, l'ancienne de L'Écho, m'achète des cassettes vierges. Je savais pas qu'on en fabriquait encore. On en fabrique plus : elle prend mon stock."}
      - {lien: 3, texte: "Un tirage qui te fait du tort, je peux le laisser dans son plastique. Le distributeur vérifie plus rien. Y a plus que moi pour vérifier, de toute façon."}
      - {lien: -1, texte: "Carte ou espèces ? J'ai plus de monnaie ce matin."}
      - {lien: -2, texte: "Votre journal, je l'ai vendu à neuf heures. S'il en reste, c'est sur le présentoir."}
      - {lien: -3, texte: "Ma mère vous aurait servi quand même. Elle servait tout le monde. Je suis pas ma mère."}
    tuyaux:
      - id: delphine_grenier
        si: "annee >= 2020 && direction < 45"
        texte: "« Un monsieur de la capitale m'a racheté tous les vieux Écho de ta première saison, au grenier. Il a payé le double, et il m'a demandé si tu lisais ce qu'on écrit sur toi. »"
        effets: {jauges: {direction: 1}}
      - id: delphine_pochettes
        si: "flag(histoire_h8)"
        texte: "« Madame Josiane m'a commandé cent pochettes plastiques, pour un vieux classeur. Elle dit que les papiers de 2003 se défont, et qu'ils ne doivent pas se défaire avant d'avoir servi. »"
      - id: delphine_cassettes
        si: "flag(histoire_h10)"
        texte: "« La dame du dimanche a pris mes six dernières cassettes. Elle a dit : pour un appareil qui garde ce que les téléphones ne gardent pas. Elle avait l'air pressée. »"
    service:
      lien: 3
      label: "Une lettre en vitrine"
      texte: "Delphine tire ta lettre aux supporters sur la vieille photocopieuse de sa mère et la colle en vitrine, à côté des Unes. Le dimanche, les gens la lisent en attendant L'Écho."
      effets: {jauges: {tribunes: 3}}

  # ═══════════════════════════════════════════════════ L'ÉCHO D'AUBÉRIVE (echo)

  # Pierre Massenet : on n'écrit que sa vie en ville, à la rédaction, jusqu'à son départ
  # pour le plateau de Télé-Stade (2000). Il échange une information contre une autre.
  - id: meneche
    lieu: echo
    tranches: [matin, aprem, soir]
    annees: [1990, 1999]
    reseau: presse
    trace: "Massenet a ouvert son carnet, noté l'heure de ta visite, et l'a refermé sans rien écrire d'autre."
    paliers: ["t'offre un café de la machine", "ferme son carnet quand tu parles", "adoucirait un papier pour toi"]
    froid: ["ouvre son carnet quand tu entres", "te cite sans te prévenir", "n'écrit plus que sur toi"]
    activites: [echo_chronique_machine]
    repliques:
      - {lien: 0, texte: "Une information contre une autre, c'est le seul commerce honnête de cette ville. Vous apportez quelque chose, ou vous venez lire les épreuves ?"}
      - {lien: 0, si: "serie_d >= 2", texte: "Ma page des sports s'écrit toute seule, ces temps-ci. C'est mauvais signe : plus personne m'appelle pour la faire changer."}
      - {lien: 0, si: "tranche == soir", texte: "Le bouclage est à vingt-deux heures. Avant, je ne parle qu'aux gens qui ont un titre à me donner. Après, à ceux qui veulent en retirer un."}
      - {lien: 1, texte: "La machine à café est plus vieille que le journal. Elle fait un bruit de rotative. Je lui dois mes meilleures phrases ; elle ne m'a jamais demandé de les signer."}
      - {lien: 1, si: "annee >= 1997", texte: "Télé-Stade m'offre un fauteuil, le dimanche soir. On y dit ce qu'on pense, à condition de penser vite. Je réfléchis. C'est déjà trop lent pour eux."}
      - {lien: 2, texte: "Mon premier papier, en 1968, parlait d'un chien qui avait traversé le terrain pendant un derby. Je me rappelle le nom du chien. Le score, je l'ai oublié."}
      - {lien: 2, si: "flag(histoire_h1) && flag(h1_article_1974)", texte: "Je relis ce papier de 1974 chaque année, en mars. Je cherche la phrase où je me suis trompé. Je la trouve toujours pas. Elle y est, pourtant."}
      - {lien: 3, texte: "Qu'on m'apporte un dossier sur toi, et tu le sauras la veille. En échange, tu me donnes la suite."}
      - {lien: -1, texte: "Je n'ai pas le temps ce matin. Laissez un mot à la secrétaire de rédaction ; elle le lira avant moi, c'est son métier."}
      - {lien: -2, texte: "Je vous cite demain, en page trois. Vous ne m'avez rien dit ; c'est ce que je cite."}
      - {lien: -3, texte: "Ne vous asseyez pas. Ce que vous direz ici sera dans le journal. Ce que vous ne direz pas aussi."}
    tuyaux:
      - id: massenet_mise
        si: "flag(histoire_h2)"
        texte: "« J'ai misé sur vous au tabac du Quai : dix contre un que vous tenez jusqu'à Noël. Le chauffeur du club a misé contre, le même jour, plus gros. Je me demande ce qu'il sait. »"
      - id: massenet_photos
        si: "flag(histoire_h3) && flag(h3_ardoise)"
        texte: "« On m'a proposé des photos de toi, à trois heures du matin, devant une porte sans poignée. J'ai pas acheté. La Gazette, elle, achètera. T'as jusqu'à lundi pour savoir quoi dire. »"
        effets: {jauges: {direction: 1}}
      - id: massenet_mardi
        si: "flag(histoire_h5) && flag(h5_conseil_entendu) && annee <= 1999"
        texte: "« Le directeur de la Banque Aubérivoise dîne le mardi avec un notaire de Portclair et une dame de l'immobilier. Le mardi à dix-huit heures, il n'est jamais chez lui. »"
      - id: massenet_dossier
        si: "annee <= 1999"
        texte: "« Y a un type qui fait le tour des rédactions avec un dossier sur toi. Des dates, des promesses, deux photos. Jeudi, il est passé chez nous. Je l'ai fait attendre une heure. Il est reparti avec. »"
        effets: {jauges: {direction: 1}}
    service:
      lien: 3
      label: "Adoucir un papier"
      texte: "Massenet relit l'épreuve de demain, raye un adjectif, en ajoute un autre, et descend ton nom de la troisième ligne à la neuvième. « Personne ne lit la neuvième ligne. Sauf vous. »"
      effets: {jauges: {direction: 2, tribunes: 2}}
      dette: true

  - id: etienne
    name: "Étienne Rabier"
    label: "RÉDACTEUR EN CHEF, L'ÉCHO"
    genre: m
    portrait: {teint: clair, corpulence: fin, age: mur, coiffure: meche, cheveux: gris, pilosite: barbe, lunettes: carrees, tenue: veste, couleur: anthracite, accessoire: carnet}
    lieu: echo
    tranches: [matin, aprem, soir]
    annees: [2000, 2050]
    reseau: presse
    trace: "Étienne a noté ta visite dans la marge de l'épreuve, à côté d'une coquille qu'il n'a pas corrigée."
    paliers: ["te laisse lire les épreuves", "te prévient de la Une du lendemain", "retiendrait un papier une semaine"]
    froid: ["te fait attendre dans le couloir", "te cite sans t'appeler", "fait de toi son feuilleton"]
    on_relation: {3: vi.etienne.une, -3: vi.etienne.feuilleton}
    repliques:
      - {lien: 0, texte: "J'ai hérité du bureau de Massenet, de sa machine à café, et d'une règle : jamais un adjectif qu'on ne peut pas prouver. La machine est morte. La règle tient toujours."}
      - {lien: 0, si: "annee >= 2025", texte: "Nous sommes le dernier journal papier du pays. Le dimanche, des gens viennent photographier la rotative, comme une vache dans un pré. Ils n'achètent pas le journal."}
      - {lien: 0, si: "serie_d >= 2", texte: "Trois défaites, et le courrier des lecteurs déborde. Les gens écrivent plus quand ça perd. Les lettres des bonnes semaines tiennent sur une carte postale."}
      - {lien: 1, texte: "J'ai commencé en 1988, aux chiens écrasés et aux crues. Massenet me laissait les matchs de district. J'ai appris à écrire un score sans adjectif. C'est le plus dur."}
      - {lien: 1, si: "annee >= 2024 && annee < 2040", texte: "On ouvre une rubrique : « Ils étaient au stade ». Les abonnés morts dans l'année, avec leur place : tribune, rangée, numéro. C'est la page la plus lue."}
      - {lien: 2, texte: "Je garde un exemplaire de chaque numéro à la cave, depuis 2000. Si L'Écho s'arrête, il restera la cave. Il faudra quelqu'un pour descendre la lire."}
      - {lien: 2, si: "annee >= 2037", texte: "L'Écho ne sort plus que le dimanche. Les autres jours, je fais l'enquête que je n'avais jamais le temps de faire. Je la publierai un dimanche où tout le monde dort."}
      - {lien: 3, texte: "Un papier qui te tue, si j'en ai un, tu l'auras la veille. Tu pourras pas l'arrêter. Tu le liras avant les autres, debout, à côté de la machine."}
      - {lien: -1, texte: "Je suis au bouclage. Attendez dans le couloir ; il y a une chaise. Elle est là depuis Massenet."}
      - {lien: -2, texte: "Vous serez dans le journal de dimanche. Je ne vous appellerai pas : vous ne répondez qu'à ceux qui vous plaisent."}
      - {lien: -3, texte: "Je n'ai plus de questions pour vous. J'ai des réponses, et je les publie dans l'ordre où elles arrivent."}
    tuyaux:
      - id: etienne_lettre
        si: "annee >= 2000 && tribunes < 45"
        texte: "« Dimanche, en page trois, il y a une lettre de lecteur sur toi, signée d'un ancien de la Nord. Je l'ai coupée de moitié. Il reste la moitié polie. L'autre, je la garde. »"
        effets: {jauges: {tribunes: 1}}
      - id: etienne_rossard
        si: "flag(histoire_h7) && flag(h7_rance_mort) && !flag(h7_rossard_plateau)"
        texte: "« Rossard a appelé trois fois cette semaine pour l'heure exacte où ton capitaine est sorti de la 12. J'ai rien donné. Dimanche soir, il dira un nom à l'antenne. »"
      - id: etienne_initiales
        si: "flag(histoire_h8)"
        texte: "« Léa a demandé nos archives de 2003 : le stagiaire du Racing, sa société aux deux initiales. Elle tire un fil qui mène jusqu'à ton oreille. Elle t'appellera en dernier. »"
      - id: etienne_minuit
        si: "flag(histoire_h9) && !flag(h9_cave_vue)"
        texte: "« En décembre 2010, le communiqué de la Fédération sur le vote est arrivé ici à minuit et une. Le procès-verbal, jamais. Celle qui l'a tapé vit à deux rues de chez toi. »"
      - id: etienne_liste
        si: "flag(histoire_h10) && saison >= 2"
        texte: "« Dimanche, L'Écho publie la liste des socios qui demandent ton départ. Elle m'a été dictée par un numéro masqué, une femme très polie. Je la publie quand même. »"
    service:
      lien: 3
      label: "Retenir un papier"
      texte: "Étienne sort ton article de la maquette à dix heures du soir et met la crue de la Rive à la place. « Une semaine. Après, il sort, avec ta réponse à côté, ou sans. »"
      effets: {jauges: {direction: 3}}
      dette: true

# ═══════════════════════════════════════════════════════════════ LES ACTIVITÉS
# Ce qu'on fait avec eux, à leur comptoir : un point de lien (au plus un par
# personne entre deux cartes) et une habitude. La borne d'année (`si`) suit
# l'époque de la personne ; l'objet est celui de la pièce (pieces/_plan.js).
activites:

  # — Le Corner, Marcel (1990-2016)
  - id: vi_marcel_demi
    lieu: bar
    objet: comptoir
    label: "Un demi avec Marcel"
    texte: "Marcel tire le demi en penchant le verre et le pose sur une soucoupe ébréchée, toujours la même. Il parle de la pelouse de la Rive sans te regarder, puis du kop, en te regardant."
    textes:
      - "Marcel tire le demi en penchant le verre et le pose sur une soucoupe ébréchée, toujours la même. Il parle de la pelouse de la Rive sans te regarder, puis du kop, en te regardant."
      - "Marcel essuie le zinc là où tu vas poser le coude, avant que tu le poses. « Samedi, ils seront deux cents de plus que la semaine dernière. Je le sais aux commandes de pastis. »"
      - "Le demi arrive sans que tu l'aies demandé. Marcel montre du menton la télé éteinte : « Je la rallume après le résumé. Ils ont besoin de parler avant de voir. »"
    si: "annee <= 2016"
    avec: marcel
    habitude: comptoir
    tranches: 1
    francs: -10
    heures: [midi, aprem, soir]
  - id: vi_marcel_tournee
    lieu: bar
    objet: comptoir
    label: "Payer la tournée du zinc"
    texte: "Tu paies la tournée du zinc. Marcel la sert dans l'ordre d'ancienneté, les anciens de la Nord d'abord, toi en dernier. Personne ne te remercie ; tout le monde lève son verre."
    si: "annee <= 2016"
    avec: marcel
    habitude: largesse
    tranches: 1
    francs: -60
    jauges: {tribunes: 1}
    heures: [soir]
  - id: vi_marcel_421
    lieu: bar
    objet: des
    jeu: des
    label: "Le 421 contre Marcel"
    texte: "Marcel sort la piste de feutre et le gobelet de cuir usé à l'endroit du pouce. Il joue sans regarder les dés, en essuyant un verre de l'autre main. Il gagne une fois sur deux, exactement."
    si: "annee <= 2016"
    avec: marcel
    habitude: jeu
    tranches: 0
    francs: -20
    heures: [aprem, soir]
  - id: vi_marcel_fermeture
    lieu: bar
    objet: comptoir
    label: "Rester à la fermeture"
    texte: "Marcel retourne les chaises sur les tables et te laisse finir ton verre, le néon éteint. Il compte la caisse à voix basse, et te raconte 1966 pendant que la rue se vide."
    si: "annee <= 2016"
    avec: marcel
    habitude: nuit
    tranches: 1
    francs: -10
    heures: [soir]

