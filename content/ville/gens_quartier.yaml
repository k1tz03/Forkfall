# La ville vivante (docs/histoires/ville_vivante.md) — LE QUARTIER : l'épicerie,
# la boulangerie de la rue des Lilas, le garage du Pont, la laverie de la rue du Stade,
# le marché, les Immortelles, Brunel, la librairie-papeterie, L'Aurore et l'école des
# Lilas. Un visage par lieu et par époque, de 1990 à 2050, sans trou ni chevauchement
# (le premier de la liste est celui de 1990) ; ce qu'on fait avec eux, ce qu'ils savent,
# ce qu'ils peuvent, ce qui leur arrive ; et ce que la ville fait des réputations
# « quartier », « famille » et « culture ».
# Deux visages viennent des livres : Marie-Jo Marçais (9) et Madame Huguette (4, 7) ;
# on n'écrit ici que leur vie en ville. Les cartes de palier des nouveaux :
# content/cards/common/paliers_ville_quartier.yaml.
#
# Les livres que la ville nourrit (un tuyau pose leur drapeau, dont la trace d'Almanach
# reste vraie) : 1 (la photo de 1977, par la papetière), 5 (Maître Larrieu, par le
# mécano), 6 (un indice du sous-sol, par la papetière), 7 (le cardiologue, par
# Huguette), 10 (le clapet de Nino, par la caissière de L'Aurore) ; les scènes, le 3
# (Odile, le jeudi) et le 8 (Vaubourg chez le tailleur). Marie-Jo, au livre 7, dit la
# côte du petit Rancé sans poser de drapeau : la trace de la côte raconte le Corner.
gens:
  # ═══════════════════════════════════════════════════════════════ L'ÉPICERIE
  # 1990-2003 : Ginette Coulomb et le cahier des ardoises (le bleu pour la cité,
  # le rouge pour la Tréfilerie, que la vie de la ville raconte déjà) ; son mari,
  # « l'épicier » des activités, porte les cartons. 2004-2050 : Yacine Kessar,
  # son petit-fils, le point relais, et le même cahier sous le comptoir.
  - id: coulomb
    name: "Ginette Coulomb"
    label: "L'ÉPICIÈRE DE LA CITÉ"
    genre: f
    tic: "Au crayon, ça s'efface."
    on_relation: {3: vi.coulomb.page_du_club, -3: vi.coulomb.rideau}
    portrait: {teint: clair, corpulence: large, age: age, coiffure: chignon, cheveux: gris, pilosite: rase, lunettes: rondes, tenue: blouse, couleur: bleu, accessoire: stylo, couleur_accessoire: violet}
    lieu: epicerie
    tranches: [matin, aprem, soir]
    annees: [1990, 2003]
    reseau: familles
    trace: "Ginette Coulomb s'en souviendra. Elle n'oublie que ce qui est payé."
    paliers: ["te reconnaît au comptoir", "te met ton lait de côté", "t'ouvrirait une page de son cahier"]
    froid: ["te rend la monnaie sans un mot", "te sert après tout le monde", "ne te sert plus"]
    repliques:
      - {lien: 0, texte: "Vous êtes du club, vous. Ça se voit aux chaussures. Ici, les gens du club paient comptant ; le cahier, c'est pour la cité."}
      - {lien: 0, si: "tranche == soir", texte: "Je ferme à huit heures, mais je ne baisse le rideau qu'à moitié. Il y a toujours quelqu'un qui a oublié le lait d'un gamin."}
      - {lien: 1, texte: "Mon mari dit que je fais la banque. La banque ne connaît pas le prénom des gamins. Moi, je les connais tous, avec leur pointure."}
      - {lien: 1, si: "serie_d >= 3", texte: "Les bières se vendent à l'unité depuis trois samedis, et le cahier se remplit plus vite. Je vous dis ça, moi. Je ne vous dis rien."}
      - {lien: 1, si: "flag(rep_quartier)", texte: "On dit que vous êtes d'ici, maintenant. Ici, ça se gagne en vingt ans. Vous avez triché. Ça ne me déplaît pas."}
      - {lien: 2, texte: "J'ai une page au nom du club, vous savez. Les packs du car, l'année de la montée. Je ne la réclame pas. Je la garde, au cas où."}
      - {lien: 2, si: "flag(histoire_h3)", texte: "Ta mère attend que la boutique soit vide pour ouvrir son porte-monnaie. Je range les conserves, le dos tourné, le temps qu'elle compte."}
      - {lien: 3, texte: "Votre page est prête, vous savez. Une page blanche, tout en bas du cahier, au crayon. Elle attend que vous en ayez besoin."}
      - {lien: -1, texte: "Le lait est au fond. Vous connaissez le chemin."}
      - {lien: -2, texte: "Il y a des gens qui me doivent depuis 1979 et qui me regardent en face. Vous, vous regardez les conserves."}
    tuyaux:
      - id: coulomb_page
        lien: 2
        si: "role != selectionneur && annee <= 2003"
        texte: "« La femme d'un joueur du club a une page chez moi depuis septembre. Du lait, des couches, rien pour elle. Je ne dis pas laquelle. Elle vient tard, après la fermeture. »"
      - id: coulomb_oeufs
        lien: 2
        si: "role != selectionneur && tribunes < 40 && annee <= 2003"
        texte: "« Les gars de la Nord ont pris leurs bières ici avant le match, comme toujours. Et quatre boîtes d'œufs. Des œufs, un samedi, des garçons qui ne font jamais la cuisine. »"
    service:
      lien: 3
      label: "Une page à votre nom"
      texte: "Elle ouvre le cahier à une page neuve et écrit ton nom au crayon, en haut à droite, avec une somme. « La paie tombera bien. Si elle ne tombe pas, je viendrai la chercher. »"
      effets: {var: {ville_francs: "+1500"}}
      dette: true

  - id: kessar
    name: "Yacine Kessar"
    label: "L'ÉPICIER DU POINT RELAIS"
    genre: m
    tic: "Tout le monde reçoit un carton, un jour."
    on_relation: {3: vi.kessar.sans_signature}
    portrait: {teint: olive, corpulence: moyen, age: mur, coiffure: court, cheveux: noir, pilosite: barbe, lunettes: aucune, tenue: pull, couleur: bordeaux, accessoire: telephone, couleur_accessoire: noir}
    lieu: epicerie
    tranches: [matin, aprem, soir]
    annees: [2004, 2050]
    reseau: rue
    trace: "Yacine s'en souviendra. Il retient les gens comme les colis : par leur nom."
    paliers: ["te reconnaît", "te garde tes colis derrière le comptoir", "ferait beaucoup pour toi"]
    froid: ["te fait signer deux fois", "égare tes colis", "ne te sert plus"]
    activites: [epi_point_relais]
    repliques:
      - {lien: 0, texte: "Un colis ? Une pièce d'identité. Même vous. Ma grand-mère connaissait tout le monde sans papiers ; moi, j'ai un lecteur de codes."}
      - {lien: 1, texte: "Je sais qui déménage, qui part en vacances, qui commande des crampons pointure trente-huit pour un gamin qui n'en a pas les moyens. Les cartons parlent."}
      - {lien: 1, si: "serie_v >= 3", texte: "Quand on gagne, on me commande des écharpes. Quand on perd, des valises. Ça ne rate jamais. Ce mois-ci, ce sont des écharpes."}
      - {lien: 2, texte: "Ma grand-mère m'a laissé le cahier en me disant : ne relis jamais les vieilles pages. Je ne les relis pas. Je les connais par cœur."}
      - {lien: 2, si: "annee >= 2030", texte: "Les gens paient avec leur montre, maintenant. Certains me demandent quand même d'écrire au crayon, dans le cahier de ma grand-mère. Pour que ça existe."}
      - {lien: 3, texte: "Un carton peut se perdre, chez moi. Une fois. Je l'ai fait pour ma grand-mère, l'année où j'ai repris. Je le referai pour vous, une fois."}
      - {lien: -1, texte: "Votre colis. Signez là. Et là."}
      - {lien: -2, texte: "Votre colis est reparti. Délai dépassé. Je n'y peux rien. Enfin, si. Mais je n'y peux rien."}
      - {lien: 2, si: "flag(tuyau_kessar_huissier) && francs >= 0", texte: "L'huissier est repassé. Je lui ai dit que vous aviez payé. Il avait l'air déçu. Les huissiers aiment revenir."}
    tuyaux:
      - id: kessar_cartons
        lien: 2
        si: "role != selectionneur"
        texte: "« Un joueur du club reçoit des cartons d'une agence de Valdorne, toutes les semaines. Des maillots d'un autre club, à sa taille. Il ne vient jamais les chercher lui-même. »"
      - id: kessar_huissier
        lien: 1
        si: "francs < 0"
        texte: "« Un huissier m'a demandé votre adresse, ce matin, en achetant des chewing-gums. Je lui ai dit que je ne vous connaissais pas. Il a payé en pièces. Il reviendra. »"
    service:
      lien: 3
      label: "Un colis sans signature"
      texte: "Le carton qui ne devait pas porter ton nom n'en porte aucun. Sur le registre du point relais, à la date du jour, une ligne vide. Yacine ne te regarde pas en te le tendant."
      effets: {jauges: {direction: 2}}

  # ════════════════════════════════════════════════════════════ LA BOULANGERIE
  # Rue des Lilas. 1990-2007 : Lucette Pichon (son mari, le boulanger, est au four
  # et à la buvette du stade le samedi). Marie-Jo Marçais y est vendeuse depuis le
  # milieu des années quatre-vingt-dix ; elle reprend en 2008 (son livre, le 9,
  # est en 2029-2031). 2035-2050 : Malo Guérand, l'apprenti qu'elle a formé.
  # Le réseau est celui des tribunes : le dimanche, on vend le samedi.
  - id: pichon_lucette
    name: "Lucette Pichon"
    label: "BOULANGERIE PICHON, RUE DES LILAS"
    genre: f
    tic: "Le samedi se lit dans les tartes."
    on_relation: {3: vi.pichon_lucette.gateau, -3: vi.pichon_lucette.file}
    portrait: {teint: clair, corpulence: moyen, age: age, coiffure: boucle, cheveux: blanc, pilosite: rase, lunettes: carrees, tenue: blouse, couleur: rose, accessoire: aucun}
    lieu: boulangerie_residentiel
    tranches: [matin, midi]
    annees: [1990, 2007]
    reseau: tribunes
    trace: "Lucette Pichon s'en souviendra, entre deux fournées."
    paliers: ["te reconnaît dans la file", "te passe avant les autres", "te ferait un gâteau de fête"]
    froid: ["te rend la monnaie en pièces jaunes", "te sert le pain de la veille", "ne te sert plus"]
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Dans la file, on n'écoute plus les matchs de la sélection. On les met à la radio, pour pouvoir éteindre."}
        - "Le dimanche matin, personne ne prend de tarte. Quand le stade perd, Aubérive mange du pain sec, et elle le dit en payant."
      moyen:
        - {si: "role == selectionneur", texte: "On parle de la sélection entre deux baguettes, sans s'échauffer. Pas de tarte, pas de pain sec. On attend de voir."}
        - "La file est partagée. Les anciens défendent, les jeunes sifflent. Mon mari dit que c'est bon signe : tant que ça parle, ça vient."
      haut:
        - {si: "role == selectionneur", texte: "Les fenêtres de la rue des Lilas ont sorti les drapeaux de la sélection. J'en ai mis un en vitrine, entre les éclairs."}
        - "Dimanche, trois fournées de tartes. Les gens de la Nord en ont pris pour leurs voisins. Ça ne m'était pas arrivé depuis longtemps."
    repliques:
      - {lien: 0, texte: "C'est la première fois que vous venez ? Ici, on dit bonjour à toute la file, même à ceux de devant."}
      - {lien: 1, texte: "Mon mari tient la buvette du stade le samedi. Il rentre avec le score et la tête de chacun. Moi, le dimanche, je cuis en fonction."}
      - {lien: 1, si: "serie_d >= 3", texte: "Ce matin, un monsieur m'a demandé du pain d'hier, exprès. Il a dit que depuis trois samedis, c'était le pain qui allait avec."}
      - {lien: 1, si: "flag(vl_boulangere)", texte: "Pour le four, je ne vous ai jamais dit merci comme il faut. Si : tous les matins. C'est la plus cuite, là, celle du dessus."}
      - {lien: 2, si: "annee >= 1996", texte: "Ma vendeuse, Marie-Jo, compte la monnaie deux fois. Je la garde quand même. Elle connaît le prénom de tous les gamins de la rue."}
      - {lien: 2, si: "serie_v >= 3", texte: "On m'a commandé une pièce montée pour dimanche, sans mariage, pour fêter la série. Je l'ai faite. Personne ne l'a coupée avant le coup de sifflet."}
      - {lien: 3, texte: "Le jour où vous partirez, je ferai un pain à votre nom. Un pain, ça ne se garde pas. C'est fait pour ça."}
      - {lien: -1, texte: "Une baguette. Pas cuite : il n'y a plus que ça."}
      - {lien: -2, texte: "Mon mari dit qu'on ne refuse pas le pain. Alors je vous le vends. Je ne vous le donne plus."}
    tuyaux:
      - id: pichon_mardi
        lien: 2
        si: "role == entraineur && direction < 50 && annee <= 2007"
        texte: "« Mon mari a entendu les anciens, à la buvette : le président a déjeuné avec un autre entraîneur, au café de la Mairie. Un mardi. Il y retourne mardi prochain. »"
      - id: pichon_quatre_heures
        lien: 2
        si: "role != selectionneur && annee <= 2007"
        texte: "« À quatre heures du matin, je vois qui rentre. Deux joueurs du club, jeudi, en chantant. Je leur ai dit que vous passiez par là, vous aussi. Le jeudi d'après, ils dormaient. »"
        effets: {jauges: {vestiaire: 1}}
    service:
      lien: 3
      si: "role != selectionneur"
      label: "Une fournée pour le club"
      texte: "Le lundi, à six heures, Lucette fait porter au vestiaire deux paniers de croissants encore chauds, et un mot au crayon : « Ça console. » Personne ne sait qui les envoie. Tout le monde le sait."
      effets: {jauges: {vestiaire: 3}}
      dette: true

  # Marie-Jo Marçais (characters.yaml ; son livre : le 9, 2029-2031). La ville
  # ne lui écrit que sa vie de boulangère ; tant que Kévin est vivant (avant
  # 2028), elle parle de lui comme on parle d'un fils qui reprendra la boutique.
  - id: mariejo
    lieu: boulangerie_residentiel
    tranches: [matin, midi]
    annees: [2008, 2034]
    reseau: tribunes
    trace: "Marie-Jo te gardera la plus cuite."
    paliers: ["te garde une baguette", "te fait entrer par le fournil", "ferait une fournée pour toi"]
    froid: ["compte ta monnaie trois fois", "te sert la moins cuite", "ne te garde plus rien"]
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Dans la file, on dit « leur » sélection, plus « la nôtre ». Ça commence toujours par un mot. Vous l'avez remarqué ?"}
        - "Dimanche, j'ai vendu du pain sec et pas une tarte. Dans la file, on ne disait pas votre nom. On disait « l'autre ». Vous saviez ?"
      moyen:
        - {si: "role == selectionneur", texte: "On parle de la sélection comme de la météo. Ni pour, ni contre. On regarde le ciel. Il va faire quoi, d'après vous ?"}
        - "Une tarte sur deux, dimanche. La moitié de la file veut votre tête, l'autre moitié veut du pain. Laquelle vous préférez ?"
      haut:
        - {si: "role == selectionneur", texte: "Les gamins de la file font votre liste sur les sachets de pain, au crayon. Ils mettent toujours un gardien de trop. Ça vous dérange ?"}
        - "Dimanche, la file chantait. Dans une boulangerie, à sept heures du matin. Vous imaginez ? J'ai vendu les tartes avant qu'elles refroidissent."
    repliques:
      - {lien: 0, texte: "Une baguette ? Je vous la mets bien cuite, ou comme tout le monde ?"}
      - {lien: 0, si: "annee >= 2016 && annee <= 2021", texte: "Kévin livre l'après-midi, à vélo, quand il n'a pas école. Il dit qu'il s'entraîne. Vous le prendriez, vous, un garçon qui pédale comme ça ?"}
      - {lien: 1, texte: "Le samedi soir, je sais le score avant la radio : à la tête des gens qui rentrent du stade par la rue des Lilas. Vous, vous rentrez par où ?"}
      - {lien: 1, si: "serie_v >= 3", texte: "Ce matin, un monsieur a payé les croissants de toute la file. Il ne connaissait personne. Ça gagne, en ce moment. Vous croyez qu'il recommencera ?"}
      - {lien: 2, si: "annee >= 2022 && annee <= 2027", texte: "Kévin veut partir sur un chantier, là-bas, au soleil. Ils paient trois fois plus. Je lui ai dit d'y aller. Vous lui auriez dit quoi, vous ?"}
      - {lien: 2, si: "annee <= 2027", texte: "Madame Pichon trouvait que je comptais la monnaie trop lentement. Je la compte toujours deux fois. Le reste, je ne le compte jamais."}
      - {lien: 3, texte: "La file vous siffle ? Je ferme la boutique dix minutes. On ne siffle pas quelqu'un qui a sa baguette de côté. Ça vous va ?"}
      - {lien: -1, texte: "Votre baguette. La monnaie, comptez-la : je l'ai comptée."}
      - {lien: -2, texte: "Je ne vous garde plus rien. La plus cuite part à sept heures, comme pour tout le monde. Ce n'est pas juste, ça ?"}
      - {lien: 2, si: "flag(histoire_h7) && flag(tuyau_mariejo_rance) && flag(h7_rance_mort)", texte: "Je vous l'avais dit, pour la côte. Je ne vous le reproche pas. Je me le reproche, à cinq heures, sous le fournil. Et vous ?"}
    tuyaux:
      - id: mariejo_rance
        lien: 2
        si: "flag(histoire_h7) && !flag(h7_rance_mort) && !flag(h7_corner_ramenes)"
        texte: "« À cinq heures, je vois passer le petit Rancé sous le fournil : il rentre à l'hôtel. Dans la côte, il s'arrête, la main à plat sur la poitrine. Deux fois. C'est normal, à son âge ? »"
      - id: mariejo_sifflets
        lien: 2
        si: "role != selectionneur && tribunes < 50 && annee <= 2034"
        texte: "« Ce matin, trois garçons de la Nord ont payé leurs croissants avec la cagnotte des sifflets. Samedi, à la vingtième minute, ils siffleront. Pourquoi la vingtième, vous savez ? »"
    service:
      lien: 3
      label: "Le mot dans la file"
      texte: "Pendant une semaine, Marie-Jo rend la monnaie avec une phrase : « Il faut laisser du temps, vous ne croyez pas ? » La file finit par la répéter, au tabac, au marché, au stade."
      effets: {jauges: {tribunes: 3}}

  - id: guerand
    name: "Malo Guérand"
    label: "BOULANGER, RUE DES LILAS"
    genre: m
    tic: "Le levain, ça se transmet."
    on_relation: {3: vi.guerand.levain}
    portrait: {teint: dore, corpulence: fin, age: jeune, coiffure: queue, cheveux: chatain, pilosite: bouc, lunettes: aucune, tenue: blouse, couleur: blanc, accessoire: montre, couleur_accessoire: noir}
    lieu: boulangerie_residentiel
    tranches: [matin, midi]
    annees: [2035, 2050]
    reseau: tribunes
    trace: "Malo s'en souviendra. Il retient les gens à leur façon de choisir le pain."
    paliers: ["te reconnaît", "te met de côté le pain du four à bois", "ferait une fournée pour toi"]
    froid: ["te sert sans lever les yeux", "te dit qu'il n'y en a plus", "ne te sert plus"]
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Les clients regardent la sélection sur leur montre, pendant que je pèse. Ils ne lèvent même plus la tête au but."}
        - "Dimanche, pas une tarte. Les gens prennent du pain complet, le pain des jours où l'on fait attention. Ça ne trompe pas."
      moyen:
        - {si: "role == selectionneur", texte: "La sélection, ici, c'est comme le temps qu'il fera. On en parle pour ne rien dire, et on paie."}
        - "Une tarte sur deux. La file hésite. Madame Marçais dit que c'est comme ça qu'on sait que tout est encore possible."
      haut:
        - {si: "role == selectionneur", texte: "J'ai fait des fougasses aux couleurs de la sélection. Elles partent avant huit heures. Je n'en fais pas assez exprès."}
        - "Dimanche, on m'a vidé la vitrine avant neuf heures. Les gens de la Nord ont même acheté le pain de seigle. Ils détestent le seigle."
    repliques:
      - {lien: 0, texte: "Bonjour. Du four à bois ou du four électrique ? Le four à bois, c'est le mardi et le vendredi. Les autres jours, je mens un peu."}
      - {lien: 1, texte: "Madame Marçais passe le mardi. Elle goûte une baguette, elle ne dit rien, et elle repart. La veille, je ne dors pas."}
      - {lien: 1, si: "flag(histoire_h9) && flag(h9_four_paye)", texte: "Madame Marçais m'a laissé le four payé, et une punaise au-dessus de la caisse. Je n'ai rien accroché à la punaise. Elle a dit merci."}
      - {lien: 2, texte: "Le levain vient de chez elle, et le sien de chez Madame Pichon. Ça fait cinquante ans que le même pain lève dans cette rue. Moi, je le nourris."}
      - {lien: 3, texte: "Le four à bois ne pose pas de questions. Le jour où plus personne ne voudra donner de pain au club, frappez au fournil, la nuit."}
      - {lien: -1, texte: "Il n'y a plus de tradition. Il y a du pain de mie."}
      - {lien: 2, si: "flag(tuyau_guerand_jeunes) && !flag(service_guerand)", texte: "Les gamins du centre viennent toujours à six heures, avec leurs pièces comptées. Je leur donne la plus grosse baguette. Ça ne suffit pas."}
    tuyaux:
      - id: guerand_jeunes
        lien: 2
        si: "role != selectionneur"
        texte: "« Les gamins de votre centre viennent à six heures, avant l'école. Ils n'ont pas mangé depuis la veille : la cantine du club ferme le mercredi soir. Ils paient en pièces. »"
    service:
      lien: 3
      si: "role != selectionneur"
      label: "Le pain du centre"
      texte: "Chaque matin de la semaine, à six heures, un sac de pain et de croissants attend les gamins du centre derrière la porte du fournil, sans facture et sans mot."
      effets: {jauges: {vestiaire: 2}}

  # ═════════════════════════════════════════════════════════════════ LE GARAGE
  # Le garage du Pont, au fond de la cour. 1990-2018 : Albert Quintane, le mécano
  # et le patron (le vendeur des activités est son employé ; la voiture neuve sous
  # la bâche est la sienne, achetée pour le jour où l'on serait champions). Le
  # café se fait sur le réchaud de l'établi. 2019-2050 : Jérémy Saulnier, son
  # ancien apprenti, quand les voitures se mettent à se souvenir de tout.
  - id: quintane
    name: "Albert Quintane"
    label: "LE MÉCANO DU PONT"
    genre: m
    tic: "La tôle garde tout."
    on_relation: {3: vi.quintane.cafe_noir, -3: vi.quintane.carnet}
    portrait: {teint: clair, corpulence: large, age: age, coiffure: degarni, cheveux: gris, pilosite: moustache, lunettes: aucune, tenue: veste, couleur: marine, accessoire: carnet, couleur_accessoire: noir}
    lieu: garage
    tranches: [matin, aprem]
    annees: [1990, 2018]
    reseau: rue
    trace: "Quintane s'en souviendra. Il reconnaît les gens au bruit de leur moteur."
    paliers: ["te reconnaît à ton moteur", "te sert le café de l'établi", "ferait disparaître une voiture pour toi"]
    froid: ["te fait attendre dans la cour", "te facture chaque minute", "ne touche plus à ta voiture"]
    repliques:
      - {lien: 0, texte: "Laissez tourner. Non, ne dites rien. Le moteur parle d'abord, vous parlerez après."}
      - {lien: 0, texte: "Le café est sur le réchaud de l'établi depuis six heures. Il a le goût de l'établi. On s'y fait, ou on boit celui du vendeur."}
      - {lien: 1, texte: "Le vendeur connaît votre salaire. Moi, je connais votre voiture. Des deux, c'est lui qui se trompe le plus souvent."}
      - {lien: 1, si: "serie_d >= 3", texte: "Le car du club est revenu de Valdorne avec un rétroviseur en moins. Trois samedis qu'il rentre de mauvaise humeur. Je ne pose pas de questions : je commande la pièce."}
      - {lien: 1, si: "flag(histoire_h2) && flag(h2_wagon_vu)", texte: "La berline grise sous la bâche ? Gardiennage, payé d'avance, en liquide. Je ne demande pas les noms. Je demande l'avance."}
      - {lien: 2, texte: "La voiture sous la bâche est à moi. Achetée neuve pour le jour où l'on serait champions. Elle a le temps. Moi, un peu moins."}
      - {lien: 2, si: "flag(histoire_h1) && flag(h1_berline_brulee)", texte: "La berline du président, je la garde pour l'expert. L'expert ne vient pas. Les experts ne viennent jamais quand ça a bien brûlé."}
      - {lien: 3, texte: "Une voiture qui ne doit plus exister, ça se démonte. Amenez-la de nuit, par la cour. Je ne demande rien. Je démonte."}
      - {lien: -1, texte: "Garez-la dans la cour. Je verrai."}
      - {lien: -2, texte: "Votre moteur fait un bruit. Je ne sais pas lequel. Allez à Valdorne : ils ont des valises qui savent tout."}
    tuyaux:
      - id: quintane_larrieu
        lien: 2
        si: "flag(histoire_h5) && !flag(h5_larrieu)"
        texte: "« Madame Tessandier téléphonait en me laissant ses clés : “C'est là qu'on a signé, un mardi.” Dans le vide-poche, la carte d'un notaire de Portclair, Maître Larrieu. Je ne fouille pas : je vide. »"
        effets: {set: [h5_larrieu]}
      - id: quintane_parechoc
        lien: 2
        si: "role != selectionneur && annee <= 2018"
        texte: "« Un joueur du club m'a amené sa voiture dimanche à sept heures, le pare-chocs enfoncé. Payé comptant pour que ce soit fini lundi. Ce n'est pas un poteau qu'il a pris. Un poteau, ça ne saigne pas. »"
    service:
      lien: 3
      label: "Faire disparaître la voiture"
      texte: "La voiture entre de nuit par la cour. Au matin, il reste un châssis sans numéro, quatre roues dépareillées, et Quintane qui boit son café sans te regarder."
      effets: {jauges: {direction: 2}}
      dette: true

  - id: saulnier
    name: "Jérémy Saulnier"
    label: "GARAGISTE DU PONT"
    genre: m
    tic: "Les voitures parlent, maintenant."
    on_relation: {3: vi.saulnier.boitier, -3: vi.saulnier.trajets}
    portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: brosse, cheveux: brun, pilosite: rase, lunettes: aucune, tenue: veste, couleur: marine, accessoire: montre, couleur_accessoire: noir}
    lieu: garage
    tranches: [matin, aprem]
    annees: [2019, 2050]
    reseau: rue
    trace: "Jérémy s'en souviendra. Quintane le lui a appris : on n'oublie pas un moteur."
    paliers: ["te reconnaît", "te passe avant les autres au diagnostic", "effacerait une route pour toi"]
    froid: ["te donne un rendez-vous dans trois semaines", "te facture la valise", "ne touche plus à ta voiture"]
    repliques:
      - {lien: 0, texte: "La valise dit que tout va bien. Je vais l'écouter quand même, trente secondes, sans rien dire. C'est Quintane qui m'a appris."}
      - {lien: 1, texte: "Les voitures d'aujourd'hui retiennent tout : où, quand, combien de temps à l'arrêt. Je les répare. Elles, elles se souviennent."}
      - {lien: 1, si: "serie_v >= 3", texte: "Depuis qu'on gagne, on m'apporte des voitures à laver avant le match. Pas à réparer : à laver. Les gens veulent briller sur le parking."}
      - {lien: 2, texte: "Quintane passe le samedi vers cinq heures. Il ne dit rien. Il écoute les moteurs. Le samedi où il ne viendra pas, je fermerai."}
      - {lien: 3, texte: "Une route, ça s'efface d'un boîtier. Je sais faire. Une fois. Après, la voiture ne me fait plus confiance."}
      - {lien: -1, texte: "Laissez les clés dans la boîte. Je verrai."}
    tuyaux:
      - id: saulnier_boitier
        lien: 2
        si: "role != selectionneur"
        texte: "« Une voiture du staff est allée trois nuits de suite à Valdorne, ce mois-ci. Le boîtier garde tout. Elle s'est garée devant le siège de {rival}, chaque fois une heure et quart. »"
    service:
      lien: 3
      label: "Effacer les trajets"
      texte: "Jérémy branche ta voiture sur sa valise, le dos tourné, et tape longtemps. Quand il débranche, tes trajets du mois n'ont jamais eu lieu. « La prochaine fois, prenez le car. »"
      effets: {jauges: {direction: 2}}
      dette: true

  # ════════════════════════════════════════════════════════════════ LA LAVERIE
  # Rue du Stade. La 4 est la machine du club. 1990-2012 : Gisèle Delmotte,
  # repasseuse à façon, qui tient la laverie depuis la table de pliage.
  # 2013-2050 : Gabriel Montel, « le gérant » (le livre 8 : le papier PAS APRÈS
  # MINUIT scotché sur la 4, c'est lui).
  - id: delmotte
    name: "Gisèle Delmotte"
    label: "LA LAVERIE DE LA RUE DU STADE"
    genre: f
    tic: "Le linge, ça se lit."
    on_relation:
      3:
        - {id: vi.delmotte.maillots_1974, if: "flag('tuyau_delmotte_1974')"}
        - {id: vi.delmotte.chemise}
      -3: vi.delmotte.col
    portrait: {teint: dore, corpulence: moyen, age: mur, coiffure: carre, cheveux: roux, pilosite: rase, lunettes: aucune, tenue: blouse, couleur: ciel, accessoire: aucun}
    lieu: laverie
    tranches: [matin, midi, aprem]
    annees: [1990, 2012]
    reseau: familles
    trace: "Gisèle s'en souviendra. Elle se souvient de chaque chemise qu'elle a pliée."
    paliers: ["te reconnaît", "plie ton linge avec le sien", "ferait n'importe quelle lessive pour toi"]
    froid: ["te laisse la machine qui fuit", "plie ton linge de travers", "ne te parle plus"]
    repliques:
      - {lien: 0, texte: "La 4, c'est celle du club. Les autres, prenez celle que vous voulez. Sauf la 2 : elle mange les chaussettes, et elle ne les rend pas."}
      - {lien: 0, si: "tranche == matin", texte: "Le matin, ce sont les mères. À midi, les infirmières de nuit. Le soir, les hommes seuls. Vous êtes en avance, ou vous êtes en retard ?"}
      - {lien: 1, texte: "Je repasse à façon. Le président m'apporte six chemises par semaine. Il ne sait pas qu'un col, ça se lit comme une page."}
      - {lien: 1, si: "serie_d >= 3", texte: "Les maillots reviennent moins sales, ces temps-ci. Ils ne se roulent plus par terre. Je le vois à l'eau avant de le lire dans le journal."}
      - {lien: 2, texte: "Mon fils est à la maison d'arrêt de Valdorne. Je lave son linge le jeudi, je le porte le vendredi. Ils le fouillent ; ils le replient mal."}
      - {lien: 3, texte: "Une chemise à laver sans que personne la voie, apportez-la-moi le matin. Avant les mères."}
      - {lien: -1, texte: "Les machines sont libres. Toutes."}
      - {lien: -2, texte: "Je ne plie plus que pour les gens qui disent bonjour. Vous dites bonjour à la machine."}
    tuyaux:
      - id: delmotte_rose
        lien: 2
        si: "role != selectionneur && annee <= 2012"
        texte: "« Depuis trois semaines, les maillots du club rendent l'eau rose. Pas toujours le même : le 6, le 8, le 2. On se bat dans votre vestiaire, et ce n'est pas sur le terrain. »"
      - id: delmotte_1974
        lien: 2
        si: "annee <= 2012"
        texte: "« La lingère du club voulait jeter les maillots de 1974, les vrais, en laine. Je les ai repris et lavés à la main, un par un. Ils sont dans mon placard. Le jour où il le faudra. »"
    service:
      lien: 3
      label: "Une lessive sans questions"
      texte: "Gisèle prend le sac sans l'ouvrir, le vide dans la 4 à quatre-vingt-dix degrés et s'assoit devant le hublot jusqu'au bout. Ce qui était sur le tissu n'y est plus."
      effets: {jauges: {direction: 2}}
      dette: true

  - id: montel
    name: "Gabriel Montel"
    label: "LE GÉRANT DE LA LAVERIE"
    genre: m
    tic: "Pas après minuit."
    on_relation: {3: vi.montel.lit_de_camp}
    portrait: {teint: ebene, corpulence: large, age: mur, coiffure: chauve, cheveux: noir, pilosite: barbe, lunettes: carrees, tenue: pull, couleur: gris, accessoire: montre, couleur_accessoire: bordeaux}
    lieu: laverie
    tranches: [midi, aprem, soir]
    annees: [2013, 2050]
    reseau: familles
    trace: "Gabriel s'en souviendra. Il compte les gens comme les tours de tambour."
    paliers: ["te reconnaît", "te garde une machine", "te laisserait dormir dans l'arrière-boutique"]
    froid: ["te rend la monnaie en jetons", "te dit que tout est pris", "ferme quand tu arrives"]
    repliques:
      - {lien: 0, texte: "Les machines démarrent avec la carte, ou avec le téléphone. Les pièces, je les prends encore, pour les anciens. Ils aiment le bruit."}
      - {lien: 0, si: "tranche == soir", texte: "Je ferme à une heure. Après une heure, ce n'est plus du linge qu'on vient laver. C'est autre chose."}
      - {lien: 1, texte: "Madame Delmotte m'a laissé la 4 avec une consigne : celle-là, on ne la loue pas, on la prête. Je ne sais toujours pas à qui."}
      - {lien: 1, si: "serie_d >= 3", texte: "La mère de votre gardien est venue laver ses rideaux à vingt-trois heures. Depuis la série, elle ne veut plus croiser personne."}
      - {lien: 2, texte: "Il y a des gens qui viennent la nuit sans rien à laver. Ils regardent tourner la machine des autres. Je ne les mets pas dehors avant une heure."}
      - {lien: 2, si: "flag(histoire_h8) && flag(h8_laverie)", texte: "Le papier sur la 4, c'est moi qui l'ai écrit. Pas après minuit. Pour quelqu'un qui ne dort pas. Ce quelqu'un le sait."}
      - {lien: 3, texte: "La clé est sous le monnayeur, et le lit de camp derrière, pour les soirs où vous ne dormez pas. Personne ne le saura. Moi, si."}
      - {lien: -1, texte: "Tout est pris. Revenez demain."}
    tuyaux:
      - id: montel_nuit
        lien: 2
        si: "role != selectionneur && annee >= 2013"
        texte: "« Un joueur du club vient laver son linge à minuit, trois fois par semaine. Il ne dort plus. Il dit que c'est le genou. Le genou, ça ne vous fait pas surveiller la porte. »"
    service:
      lien: 3
      label: "Le lit de camp"
      texte: "Gabriel te laisse l'arrière-boutique : un lit de camp, une couverture de l'armée, la 2 qui tourne en berceuse. Tu dors six heures d'affilée. Au matin, ton linge est plié sur la chaise."
      effets: {jauges: {vestiaire: 2}, var: {h8_nuits: "-1"}}

  # ═════════════════════════════════════════════════════════════════ LE MARCHÉ
  # La place, le dimanche. 1990-2011 : Achille Ducros, maraîcher, la monnaie
  # dans une boîte à chaussures. 2012-2037 : Laure, sa fille (socio, ancienne
  # arrière gauche de la section féminine). 2038-2050 : Côme Dartigue, le
  # maraîcher de vingt ans des trois étals.
  - id: ducros_achille
    name: "Achille Ducros"
    label: "MARAÎCHER, PLACE DU MARCHÉ"
    genre: m
    tic: "Une pomme de plus, ça ne se pèse pas."
    on_relation: {3: vi.ducros_achille.cageots, -3: vi.ducros_achille.place}
    portrait: {teint: olive, corpulence: large, age: age, coiffure: casquette, cheveux: gris, pilosite: moustache, lunettes: aucune, tenue: pull, couleur: bouteille, coiffe: bleu, accessoire: aucun}
    lieu: marche
    tranches: [matin, midi]
    annees: [1990, 2011]
    reseau: rue
    trace: "Achille Ducros s'en souviendra. Il a la mémoire des visages et des prix."
    paliers: ["te reconnaît", "te met une pomme de plus", "remuerait le marché pour toi"]
    froid: ["pèse au gramme près", "te sert les fruits du fond du cageot", "ne te sert plus"]
    repliques:
      - {lien: 0, texte: "Goûtez. Non : goûtez d'abord, vous paierez après. Ceux qui paient avant de goûter, je ne leur fais pas confiance."}
      - {lien: 1, texte: "Ma boîte à chaussures a vu passer trois gouvernements et quatre présidents du club. Elle est plus solide qu'eux tous, et elle rend mieux la monnaie."}
      - {lien: 1, si: "serie_d >= 3", texte: "Les tomates restent dans les cageots, ces dimanches-ci. Les gens n'ont pas faim : ils ont soif. C'est le Corner qui gagne."}
      - {lien: 1, si: "serie_v >= 3", texte: "Quand on gagne, les gens achètent des fraises en mars. Je leur dis qu'elles n'ont pas de goût. Ils s'en moquent : elles sont rouges."}
      - {lien: 2, texte: "On veut mon champ, derrière la Tréfilerie, pour un parking. Un parking pour le stade, qu'ils disent. Le stade en a déjà un. Il est vide la semaine."}
      - {lien: 2, si: "annee >= 2005", texte: "Ma fille tient l'étal avec moi, maintenant. Elle rend la monnaie plus vite, et elle se trompe moins. Ça me vexe tous les dimanches."}
      - {lien: 3, texte: "Dites-moi le samedi ce que le marché doit penser. Le dimanche à midi, toute la ville le pensera."}
      - {lien: -1, texte: "Un kilo, c'est un kilo. Pas un gramme de plus."}
      - {lien: -2, texte: "Allez à l'hypermarché. Là-bas, on ne vous connaît pas, et on ne vous regarde pas."}
      - {lien: 2, si: "flag(tuyau_ducros_maison)", texte: "La maison du président s'est vendue, à un monsieur de Portclair qui n'y vient jamais. Le président, lui, vient moins souvent au marché."}
    tuyaux:
      - id: ducros_parking
        lien: 2
        si: "annee <= 2011"
        texte: "« Un monsieur de l'agence est venu mesurer mon champ, derrière la Tréfilerie, avec un pied à coulisse. Il a parlé du stade. Personne du club ne m'a rien demandé. Vous savez quelque chose ? »"
      - id: ducros_maison
        lien: 2
        si: "role != president && annee <= 2011"
        texte: "« Le président vend sa maison de campagne, au bord de la Rive. Un président qui vend sa maison paie quelque chose qu'on ne voit pas encore. Regardez les comptes avant qu'il vous les montre. »"
    service:
      lien: 3
      si: "role != selectionneur"
      label: "Des cageots pour le centre"
      texte: "Chaque lundi, deux cageots attendent au centre de formation : des pommes, des carottes avec leur terre, et un mot au crayon, « Pour les jambes ». La cantine économise ; les gamins mangent."
      effets: {jauges: {vestiaire: 2, caisse: 1}}

  - id: ducros_laure
    name: "Laure Ducros"
    label: "MARAÎCHÈRE, PLACE DU MARCHÉ"
    genre: f
    tic: "Mon père pesait large."
    on_relation: {3: vi.ducros_laure.section}
    portrait: {teint: olive, corpulence: fin, age: mur, coiffure: queue, cheveux: brun, pilosite: rase, lunettes: aucune, tenue: doudoune, couleur: orange, accessoire: aucun}
    lieu: marche
    tranches: [matin, midi]
    annees: [2012, 2037]
    reseau: rue
    trace: "Laure s'en souviendra. Au marché, on se souvient de qui revient."
    paliers: ["te reconnaît", "te met une pomme de plus, comme son père", "remuerait la place pour toi"]
    froid: ["pèse au gramme près", "te sert en dernier", "ne te sert plus"]
    repliques:
      - {lien: 0, texte: "Mon père tenait cet étal. Il pesait large. Moi aussi, mais je ne le dis pas : ça finirait par se savoir."}
      - {lien: 1, texte: "Le dimanche, je vends ce que la ville a pensé du samedi. Une défaite, des poireaux pour la soupe. Une victoire, des fraises, même en mars."}
      - {lien: 2, texte: "J'ai joué arrière gauche dans la section féminine, avant qu'on la ferme. Les crampons sont restés dans la camionnette. On ne sait jamais."}
      - {lien: 3, texte: "Je suis la seule à crier les prix, sur la place. Quand je crie autre chose, ils me suivent. Un dimanche, ça peut vous servir."}
      - {lien: -1, texte: "Un kilo. Ce sera tout ?"}
    tuyaux:
      - id: ducros_laure_jeudi
        lien: 2
        si: "annee <= 2037"
        texte: "« Les filles de l'ancienne section s'entraînent encore, le jeudi soir, sur le terrain annexe, sans lumière. Elles ont gardé une clé du portail. Personne au club ne le sait. »"
    service:
      lien: 3
      label: "La cagnotte du marché"
      texte: "Un dimanche, de stand en stand, Laure fait passer une boîte à chaussures, celle de son père. À midi, elle est pleine, pour le déplacement des jeunes. Elle la pose sur ton bureau, sans un mot."
      effets: {jauges: {vestiaire: 1, tribunes: 1}}

  - id: dartigue
    name: "Côme Dartigue"
    label: "MARAÎCHER, LES TROIS ÉTALS"
    genre: m
    tic: "Des carottes avec leur terre."
    on_relation: {3: vi.dartigue.semences}
    portrait: {teint: clair, corpulence: fin, age: jeune, coiffure: meche, cheveux: blond, pilosite: rase, lunettes: aucune, tenue: doudoune, couleur: pelouse, accessoire: aucun}
    lieu: marche
    tranches: [matin, midi]
    annees: [2038, 2050]
    reseau: rue
    trace: "Côme s'en souviendra. Il connaît ses clients par leur prénom ; il n'en a pas beaucoup."
    paliers: ["te reconnaît", "te garde les légumes biscornus", "ferait revenir le marché pour toi"]
    froid: ["te fait payer avec la montre", "te sert sans un mot", "ne te sert plus"]
    repliques:
      - {lien: 0, texte: "Des carottes avec leur terre. Les gens les veulent sales, maintenant. Ça prouve qu'elles sortent de quelque part."}
      - {lien: 1, texte: "Madame Ducros m'a laissé son coin de place et une consigne : peser large. Je pèse large. Je suis bien le seul à peser, d'ailleurs."}
      - {lien: 2, texte: "Le mercredi, on n'est plus que trois. La poissonnière compte les têtes qu'elle connaît ; moi, je compte les nouvelles. Vous en êtes une."}
      - {lien: 3, texte: "Les fermiers de la vallée me doivent des semences. Un mot de moi, et la place se remplit pour vous, un dimanche."}
      - {lien: -1, texte: "Ce sera tout ?"}
      - {lien: 2, si: "flag(tuyau_dartigue_paves)", texte: "La mairie a reporté la vente de la place. Ou elle a oublié. À la mairie, c'est souvent la même chose. On garde nos pavés un an de plus."}
    tuyaux:
      - id: dartigue_paves
        lien: 2
        si: "annee >= 2038"
        texte: "« La mairie veut vendre la place, le mercredi, pour les livraisons des drones, et le samedi pour un parking du stade. Tout le monde veut nos pavés. Personne ne veut nos légumes. »"
    service:
      lien: 3
      label: "Les fermiers de la vallée"
      texte: "Un dimanche, Côme fait descendre douze fermiers de la vallée. La place est pleine comme dans les photos d'avant. Entre deux cageots, ils parlent de toi, et de la Rive."
      effets: {jauges: {tribunes: 2}}

  # ════════════════════════════════════════════════════════════════ LE FLEURISTE
  # Aux Immortelles. 1990-2016 : Madame Huguette (characters.yaml ; les livres 4
  # et 7). Son livreur depuis 1990, Corentin Mévellec, reprend la boutique en 2017,
  # et la tournée du 14 mai au carré ancien que plus personne ne paie.
  - id: huguette
    lieu: fleuriste
    tranches: [matin, aprem]
    annees: [1990, 2016]
    reseau: familles
    trace: "Madame Huguette s'en souviendra. Elle écrit tout dans son cahier de commandes."
    paliers: ["te reconnaît", "fait tes bouquets elle-même", "ferait une gerbe pour toi"]
    froid: ["te fait attendre derrière les gerbes", "te vend les fleurs de la veille", "ne te sert plus"]
    repliques:
      - {lien: 0, texte: "Pour qui, les fleurs ? Je ne demande pas par curiosité. Les fleurs, ça dépend toujours de pour qui."}
      - {lien: 1, texte: "J'ai un cahier pour les mariages et un pour les deuils. Le second est plus épais. Dans une ville de football, on meurt le dimanche soir."}
      - {lien: 1, si: "serie_d >= 3", texte: "Depuis que vous perdez, les hommes ne m'achètent plus de bouquets pour leur femme. Des plantes vertes. Ça dure plus longtemps qu'une excuse."}
      - {lien: 2, si: "!flag(histoire_h4) && annee <= 1995", texte: "Au carré ancien, il y a une tombe que je fleuris chaque printemps pour quelqu'un qui a payé d'avance. Je ne dis pas qui. Les fleurs non plus."}
      - {lien: 2, si: "annee >= 2005", texte: "Mon livreur, Corentin, monte au carré ancien chaque 14 mai. Plus personne ne paie depuis longtemps. Il y va quand même. Il dit que c'est sur sa tournée."}
      - {lien: 3, texte: "Une gerbe à un nom que personne ne doit lire, ça se fait : j'écris le ruban à l'envers. Les morts lisent dans tous les sens."}
      - {lien: -1, texte: "Ce sera un bouquet, ou vous regardez ?"}
      - {lien: -2, texte: "Je ne fais plus vos fleurs. Allez au marché : la marchande ne demande jamais pour qui."}
    tuyaux:
      - id: huguette_cardiologue
        lien: 2
        si: "flag(histoire_h7) && flag(h7_rance_mort) && !flag(h7_cardiologue)"
        texte: "« Une couronne pour le petit Rancé, d'un cabinet de cardiologie de Valdorne. Au dos, au crayon, la note de sa consultation manquée du 16, à faire suivre. Ils n'ont pas peur. Ils comptent. »"
        effets: {set: [h7_cardiologue]}
      - id: huguette_pere
        lien: 2
        si: "role != selectionneur && annee <= 2016"
        texte: "« Le père de votre capitaine est passé commander ses propres fleurs. Il a choisi les couleurs du club. Il ne veut pas déranger son fils avant les matchs. Son fils ne sait rien. »"
    service:
      lien: 3
      label: "Une gerbe à votre nom"
      texte: "Aux obsèques d'un ancien du kop, la plus belle gerbe porte ton nom sur le ruban, aux couleurs du club. Madame Huguette l'a posée elle-même, au premier rang, et elle est restée."
      effets: {jauges: {tribunes: 3}}

  - id: mevellec
    name: "Corentin Mévellec"
    label: "FLEURISTE, AUX IMMORTELLES"
    genre: m
    tic: "Le 14 mai, c'est sur ma tournée."
    on_relation: {3: vi.mevellec.tournee}
    portrait: {teint: clair, corpulence: fin, age: mur, coiffure: court, cheveux: gris, pilosite: barbe, lunettes: rondes, tenue: veste, couleur: bouteille, accessoire: carnet, couleur_accessoire: creme}
    lieu: fleuriste
    tranches: [matin, aprem]
    annees: [2017, 2050]
    reseau: familles
    trace: "Corentin s'en souviendra. Il retient les gens aux fleurs qu'ils n'achètent pas."
    paliers: ["te reconnaît", "te dit pour qui sont les gerbes", "ferait une tournée pour toi"]
    froid: ["te fait payer la livraison", "oublie ta commande", "ne te sert plus"]
    repliques:
      - {lien: 0, texte: "Madame Huguette m'a laissé la boutique et ses cahiers. Les mariages au crayon, les deuils à l'encre. Elle disait : un deuil, ça ne s'annule pas."}
      - {lien: 1, texte: "Je livrais pour elle depuis 1990, dans la camionnette verte. Je connais l'adresse de tout le monde, et la tombe de la moitié."}
      - {lien: 2, texte: "Chaque 14 mai, je monte au carré ancien, sur la tombe d'un Monsieur Bertin. Plus personne ne paie depuis trente ans. C'est sur ma tournée, c'est tout."}
      - {lien: 3, texte: "Qui pleure qui, dans cette ville, je le sais avant le curé. On n'achète jamais des fleurs pour rien. Demandez-moi."}
      - {lien: -1, texte: "Une gerbe ou un bouquet ? Décidez-vous, j'ai une livraison."}
      - {lien: 2, si: "flag(tuyau_mevellec_funerarium)", texte: "La gerbe sans couleurs est partie samedi. La famille m'a demandé qui avait prévenu le club. J'ai dit : personne. C'était presque vrai."}
    tuyaux:
      - id: mevellec_funerarium
        lien: 2
        si: "role != selectionneur && annee >= 2017"
        texte: "« Samedi, au funérarium de la route de Valdorne : un ancien gardien du club. La famille ne veut personne du club. Ils ont commandé une gerbe sans couleurs. Je livre à dix heures. »"
    service:
      lien: 3
      label: "Les tombes des anciens"
      texte: "À la Toussaint, sur chaque tombe d'un ancien du club, un pot de chrysanthèmes porte une carte à ton nom. Les familles le remarquent. Les anciens encore vivants aussi."
      effets: {jauges: {tribunes: 2}}

  # ════════════════════════════════════════════════════════════════ LE TAILLEUR
  # Brunel, tailleur et chausseur. 1990-2004 : Auguste, qui a posé à vingt ans la
  # doublure bordeaux du président de 1962 (son père avait coupé le costume).
  # 2005-2034 : Clément, son fils, revenu de la capitale quand les mains du père
  # ont lâché. 2035-2050 : Gaspard, le petit-fils des baskets de collection, qui
  # a fini par prendre le ruban. Le réseau : la direction, qui parle les bras levés.
  - id: brunel_auguste
    name: "Auguste Brunel"
    label: "BRUNEL, TAILLEUR ET CHAUSSEUR"
    genre: m
    tic: "Trois essayages. Jamais moins."
    on_relation: {3: vi.brunel_auguste.doublure, -3: vi.brunel_auguste.patron}
    portrait: {teint: clair, corpulence: fin, age: age, coiffure: degarni, cheveux: blanc, pilosite: moustache, lunettes: rondes, tenue: costume, couleur: anthracite, accessoire: echarpe, couleur_accessoire: jaune}
    lieu: tailleur
    tranches: [matin, aprem]
    annees: [1990, 2004]
    reseau: direction
    trace: "Auguste Brunel s'en souviendra. Il garde les mesures de tout le monde, et le reste."
    paliers: ["te reconnaît à ta carrure", "prend tes mesures sans rien noter", "glisserait un mot pour toi au président"]
    froid: ["te fait attendre sur la chaise", "te pique en épinglant", "ne prend plus tes mesures"]
    climat:
      bas:
        - {si: "role == president", texte: "Vos actionnaires se font faire des costumes de voyage. Ils parlent d'un autre club dans la cabine. La doublure n'est pas à vos couleurs."}
        - {si: "role == selectionneur", texte: "Les gens de la Fédération sont venus pour des retouches. Ils parlaient de vous au passé, comme d'un pli qu'on défait."}
        - {si: "role == joueur", texte: "Les dirigeants ont parlé de votre contrat dans la cabine. Pas en bien. Un costume, ça entend tout. Moi aussi."}
        - "Le président a fait reprendre sa veste : il a maigri. Un président maigrit quand il pense à remplacer quelqu'un. Vous voyez qui."
      moyen:
        - {si: "role == president", texte: "Vos actionnaires ont pris des costumes gris. Ni sombres, ni clairs. Ils attendent de voir avant de choisir une couleur."}
        - {si: "role == selectionneur", texte: "La Fédération a commandé les costumes du prochain tournoi. Le vôtre n'est pas dans la commande. Il n'est pas annulé non plus."}
        - {si: "role == joueur", texte: "Au club, on parle de vous sans élever la voix. Ni augmentation, ni départ. Un costume d'attente, si vous voulez."}
        - "Le président n'a rien fait retoucher depuis un mois. Il ne grossit pas, il ne maigrit pas. Il vous regarde, c'est tout."
      haut:
        - {si: "role == president", texte: "Vos actionnaires m'ont demandé une doublure à vos couleurs. Ils ne l'avaient jamais fait. Ils veulent qu'on les voie avec vous."}
        - {si: "role == selectionneur", texte: "À la Fédération, ils veulent tous la même coupe que vous. Je leur dis que ça ne se commande pas, une allure."}
        - {si: "role == joueur", texte: "Les dirigeants parlent de vous dans la cabine comme d'un costume réussi. Ils veulent vous faire durer."}
        - "Le président a commandé un costume neuf pour la fin de saison. Pour une photo, a-t-il dit. Avec vous à côté, je suppose."
    repliques:
      - {lien: 0, texte: "Levez les bras. Plus haut. Voilà. On ne coupe pas un costume pour quelqu'un qui garde les bras le long du corps."}
      - {lien: 1, texte: "Mon père a coupé le costume du président de 1962. La doublure bordeaux, c'est moi qui l'ai posée. J'avais vingt ans et les mains qui tremblaient."}
      - {lien: 1, si: "serie_d >= 3", texte: "Le président m'a apporté un pantalon à élargir. Il mange la nuit, depuis la série. On le voit aux coutures avant de le voir dans ses yeux."}
      - {lien: 2, texte: "Mon fils travaille dans la capitale, chez un grand couturier. Il revient à Noël et il regarde mes ciseaux comme des outils de musée. Il a raison."}
      - {lien: 2, si: "annee >= 2000", texte: "Mes mains me lâchent. Le matin, je ne ferme plus le poing avant dix heures. Je coupe l'après-midi. Ne le dites pas au président."}
      - {lien: 3, texte: "Le président écoute mieux les bras levés. Un mot de vous dans son oreille, pendant l'essayage : je sais où le placer."}
      - {lien: -1, texte: "Asseyez-vous. J'ai un client."}
      - {lien: -2, texte: "Je ne prends plus vos mesures. Elles changent trop. Allez chez le confectionneur de Valdorne."}
      - {lien: 2, si: "flag(tuyau_brunel_auguste_permis)", texte: "Le permis du stade est signé. Le derby est perdu. Le président m'a quand même commandé un gilet neuf, pour la photo à la mairie."}
      - {lien: 2, si: "flag(tuyau_brunel_auguste_deuil) && direction < 35", texte: "Toujours pas de costume sombre commandé à votre nom. Je regarde le carnet tous les matins. Vous devriez en faire autant."}
    tuyaux:
      - id: brunel_auguste_permis
        lien: 2
        si: "role != president && annee <= 2004"
        texte: "« Dans la cabine, hier, le président disait au conseiller municipal qu'il préférait perdre le derby que le permis du stade. Je recousais une boutonnière. Il croit que les tailleurs sont sourds. »"
      - id: brunel_auguste_deuil
        lien: 2
        si: "annee <= 2004"
        texte: "« Votre prédécesseur m'a commandé un costume sombre la veille de son départ. Il savait. Ils savent toujours une semaine avant. Le jour où l'on vous en commande un, venez me voir. »"
    service:
      lien: 3
      label: "Un mot pendant l'essayage"
      texte: "Toute la semaine, ceux qui décident de ton sort passent chez Brunel. Les bras levés, entre deux épingles, ils entendent Auguste dire du bien de toi, à voix basse."
      effets: {jauges: {direction: 3}}

  - id: brunel_clement
    name: "Clément Brunel"
    label: "BRUNEL FILS, TAILLEUR"
    genre: m
    tic: "Une couture se défait. Un mot, non."
    on_relation: {3: vi.brunel_clement.carnet, -3: vi.brunel_clement.carnet_ouvert}
    portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: court, cheveux: chatain, pilosite: rase, lunettes: carrees, tenue: chemise, couleur: ciel, accessoire: echarpe, couleur_accessoire: jaune}
    lieu: tailleur
    tranches: [matin, aprem]
    annees: [2005, 2034]
    reseau: direction
    trace: "Clément Brunel s'en souviendra. Il a la mémoire de son père, en plus poli."
    paliers: ["te reconnaît", "te fait passer avant les mariés", "dirait un mot pour toi à qui décide"]
    froid: ["te confie à l'apprenti", "te fait payer chaque essayage", "ne te reçoit plus"]
    climat:
      bas:
        - {si: "role == president", texte: "Vos actionnaires ont annulé leurs essayages de la semaine. Tous les trois, le même jour. Chez un tailleur, ça veut dire qu'ils se sont parlé avant."}
        - {si: "role == selectionneur", texte: "À la Fédération, on m'a demandé de ne pas finir votre costume de tournoi. De le laisser bâti, au cas où."}
        - {si: "role == joueur", texte: "Au club, ils parlent de vous comme d'un costume qui tombe mal. Ce n'est jamais le costume, je leur dis. Ils ne m'écoutent pas."}
        - "Le président m'a demandé si j'avais gardé les mesures de votre prédécesseur. Au cas où, a-t-il dit. Je préfère vous le dire."
      moyen:
        - {si: "role == president", texte: "Vos actionnaires arrivent en retard aux essayages et repartent en avance. Ils ne sont pas pressés de décider."}
        - {si: "role == selectionneur", texte: "La Fédération a commandé les costumes de la saison, le vôtre compris. Sans la broderie. On verra, ont-ils dit."}
        - {si: "role == joueur", texte: "On parle de vous au club entre deux sujets, ni en bien, ni en mal. C'est la saison des costumes gris."}
        - "Le président ne fait reprendre que ses ourlets. Un homme qui ne change que ses ourlets attend quelque chose."
      haut:
        - {si: "role == president", texte: "Vos actionnaires ont commandé des boutons de manchette à vos initiales. Pour vous les offrir. Faites semblant de ne pas le savoir."}
        - {si: "role == selectionneur", texte: "À la Fédération, ils veulent tous savoir où vous faites faire vos costumes. Je dis : à Aubérive. Ils ne me croient pas."}
        - {si: "role == joueur", texte: "Au club, ils m'ont commandé une veste à votre taille, pour la photo de la prolongation. Je ne devrais pas vous le dire."}
        - "Le président a fait faire une veste pour le banquet de fin de saison. Il a dit : pour être à la hauteur, cette année."
    repliques:
      - {lien: 0, texte: "Mon père disait trois essayages. Je dis trois aussi, mais je vous laisse croire que deux suffiront."}
      - {lien: 1, texte: "Je suis revenu de la capitale quand les mains de mon père ont lâché. Là-bas, je cousais pour des gens que je ne voyais jamais. Ici, je les vois trop."}
      - {lien: 1, si: "serie_v >= 3", texte: "Les mariés du mois veulent tous des boutonnières aux couleurs du club, tant que ça gagne. Je leur dis que ça porte malheur. Ils insistent."}
      - {lien: 2, si: "annee >= 2010", texte: "Mon fils Gaspard vend des baskets de collection sous la vitrine. Mon père en aurait fait une maladie. Moi, je lui ai donné le tiroir du bas."}
      - {lien: 2, si: "flag(histoire_h9) && mission(h9.sc.poche_usee)", texte: "J'ai renforcé votre poche intérieure, sans vous demander. Ce que vous y mettez ne pèse rien, je sais. Ça use quand même."}
      - {lien: 3, texte: "Mon père appelait l'essayage la meilleure heure : on écoute mieux les bras levés. Dites-moi ce qu'il faut qu'on entende."}
      - {lien: -1, texte: "L'apprenti va prendre vos mesures."}
      - {lien: 2, si: "flag(tuyau_brunel_clement_deuil)", texte: "Le costume de deuil du président est prêt depuis un mois. Il ne vient pas le chercher. Un homme qui ne vient pas chercher son deuil n'a pas encore vendu."}
    tuyaux:
      - id: brunel_clement_deuil
        lien: 2
        si: "role != president && annee >= 2005 && annee <= 2034"
        texte: "« Le président s'est fait prendre les mesures d'un costume de deuil. Il n'y a pas d'enterrement prévu. Chez lui, le deuil, c'est quand il vend. Comptez les visiteurs du club ce mois-ci. »"
    service:
      lien: 3
      label: "Le carnet des essayages"
      texte: "Pendant une semaine, Clément te laisse lire le carnet des essayages : qui vient, avec qui, et ce qu'on y dit les bras levés. Tu entres en réunion en sachant déjà."
      effets: {jauges: {direction: 2}}
      dette: true

  - id: brunel_gaspard
    name: "Gaspard Brunel"
    label: "LE PETIT-FILS BRUNEL"
    genre: m
    tic: "Quatorze mesures, une heure."
    on_relation: {3: vi.brunel_gaspard.ruban}
    portrait: {teint: clair, corpulence: fin, age: mur, coiffure: meche, cheveux: chatain, pilosite: bouc, lunettes: aucune, tenue: chemise, couleur: noir, accessoire: echarpe, couleur_accessoire: jaune}
    lieu: tailleur
    tranches: [matin, aprem]
    annees: [2035, 2050]
    reseau: direction
    trace: "Gaspard Brunel s'en souviendra. Il prend les mesures au ruban, comme son grand-père."
    paliers: ["te reconnaît", "te mesure au ruban, pas à la cabine", "dirait un mot pour toi à qui décide"]
    froid: ["t'envoie à la cabine à scanner", "te fait payer l'heure", "ne te reçoit plus"]
    climat:
      bas:
        - {si: "role == president", texte: "Vos actionnaires ont fait scanner leurs mesures à la cabine de Valdorne. Ils ne viennent plus ici. On ne quitte pas un tailleur sans quitter autre chose."}
        - {si: "role == selectionneur", texte: "La Fédération a commandé ses costumes de tournoi ailleurs. Le vôtre aussi, à vos mesures de l'an dernier. Elles ont changé, non ?"}
        - {si: "role == joueur", texte: "Au club, ils parlent de vous à l'imparfait. C'est le temps des départs, l'imparfait. Je l'entends à chaque deuil, dans la cabine."}
        - "Le président a commandé un costume pour une conférence de presse, dans quinze jours. Il n'a pas dit sur quoi. Il a dit : quelque chose de sombre."
      moyen:
        - {si: "role == president", texte: "Vos actionnaires viennent pour des retouches, pas pour des costumes. Ils ne s'engagent pas. Ils raccourcissent."}
        - {si: "role == selectionneur", texte: "La Fédération attend la fin du tournoi pour décider de ses costumes. Comme pour vous, je crois."}
        - {si: "role == joueur", texte: "Au club, on parle de vous entre deux ourlets. Ni bien, ni mal. Ils attendent la fin de la saison."}
        - "Le président fait reprendre ses manches. Il veut avoir l'air de travailler. Ça veut dire qu'il n'a encore rien décidé."
      haut:
        - {si: "role == president", texte: "Vos actionnaires m'ont commandé une écharpe aux couleurs du club, en cachemire. Pour le virage. Ils veulent qu'on les voie avec vous."}
        - {si: "role == selectionneur", texte: "À la Fédération, on veut votre coupe pour la photo officielle. Toute la délégation habillée comme vous. C'est flatteur, ou c'est inquiétant."}
        - {si: "role == joueur", texte: "Au club, ils m'ont demandé vos mesures pour une veste de cérémonie. On ne fait pas ça pour quelqu'un qu'on va vendre."}
        - "Le président a fait broder votre nom à l'intérieur d'une veste du club. Pour un cadeau. Ne me trahissez pas."
    repliques:
      - {lien: 0, texte: "J'ai vendu des baskets sous cette vitrine pendant vingt ans. Un jour, j'ai pris le ruban de mon grand-père pour voir. Je ne l'ai plus lâché."}
      - {lien: 1, texte: "Les baskets de collection sont toujours sous la vitrine, six cents paires. Les jeunes de la réserve viennent les regarder comme on va voir des reliques."}
      - {lien: 2, texte: "Mon grand-père a posé la doublure bordeaux de 1962. Mon père s'est battu pour la poche du cœur. Moi, je ne me suis encore battu pour rien. J'attends."}
      - {lien: 3, texte: "On ne ment pas avec un ruban autour du cou. Ce que je dis en mesurant un tour de cou, on le croit. Je peux parler de vous."}
      - {lien: -1, texte: "Prenez rendez-vous sur la montre. Je ne reçois plus personne à l'improviste."}
      - {lien: 2, si: "flag(tuyau_brunel_gaspard_puce)", texte: "La puce est cousue. Si un jour vous voulez savoir où est le président, demandez à son assistant. Ou à moi : je sais dans quelle poche."}
    tuyaux:
      - id: brunel_gaspard_puce
        lien: 2
        si: "role != president && annee >= 2035"
        texte: "« Le président m'a demandé de coudre une puce dans la doublure de son costume, pour que son assistant sache toujours où il est. Il veut savoir si ça se voit. Ça se sent. »"
    service:
      lien: 3
      label: "Le tour de cou"
      texte: "Gaspard prend les mesures de ceux qui décident, au ruban, une heure chacun. Pendant l'heure, il parle de toi. Personne n'ose l'interrompre, avec un ruban autour du cou."
      effets: {jauges: {direction: 2}}

  # ════════════════════════════════════════════════════════════════ LA LIBRAIRIE
  # La librairie-papeterie d'Odette Marsal (le livre 1 ; c'est elle qui l'a payée,
  # en 1977). Agathe Arlaud y tient le comptoir depuis 1977, la papetière du
  # livre 6, jusqu'en 2007. Céline Vautrin la rachète en 2008, avec le tiroir des
  # pellicules jamais réclamées. Odette, qui s'y assoit, n'en est pas la gardienne.
  - id: arlaud
    name: "Agathe Arlaud"
    label: "LA PAPETIÈRE DE CHEZ MARSAL"
    genre: f
    tic: "Les journaux, je les lis avant vous."
    on_relation: {3: vi.arlaud.cigarettes, -3: vi.arlaud.chronique}
    portrait: {teint: clair, corpulence: fin, age: mur, coiffure: carre, cheveux: brun, pilosite: rase, lunettes: carrees, tenue: pull, couleur: prune, accessoire: journal}
    lieu: librairie
    tranches: [matin, aprem]
    annees: [1990, 2007]
    reseau: presse
    trace: "Agathe Arlaud s'en souviendra. Elle classe les gens comme les journaux : par date."
    paliers: ["te reconnaît", "te garde L'Écho sous le comptoir", "ferait passer un mot au journal pour toi"]
    froid: ["te vend le journal de la veille", "oublie ta commande", "ne te garde plus rien"]
    activites: [librairie_pellicule]
    repliques:
      - {lien: 0, texte: "L'Écho arrive à six heures et demie. Je le lis avant de le vendre. Quand quelque chose ne va pas, je le vends quand même, mais je le sais."}
      - {lien: 1, texte: "Madame Marsal est arrivée en 1977 avec un bail et une boîte à chaussures. Moi, la même année, avec un certificat de vendeuse. On a tenu."}
      - {lien: 1, si: "serie_d >= 3", texte: "On achète L'Écho pour le déchirer devant moi, page des sports. Depuis la série, j'en vends plus qu'après une victoire. C'est triste, le commerce."}
      - {lien: 2, texte: "Le chroniqueur de L'Écho vient ici le lundi, pour ses cigarettes et le courrier des lecteurs. Il dit qu'il y trouve ses idées. C'est vrai."}
      - {lien: 2, si: "flag(histoire_h1)", texte: "Madame Marsal garde une boîte sous le comptoir. Je ne l'ai jamais ouverte. Treize ans à côté d'elle, et je ne l'ai jamais ouverte."}
      - {lien: 3, texte: "Le chroniqueur ouvre toujours son paquet de cigarettes devant moi. Un mot glissé dedans arrive au journal avant le bouclage."}
      - {lien: -1, texte: "L'Écho ? Il n'y en a plus. Il y en a un, mais il est réservé."}
      - {lien: -2, texte: "Je ne vous garde plus le journal. Lisez-le au café, comme tout le monde : avec des taches."}
    tuyaux:
      - id: arlaud_photo
        lien: 2
        si: "flag(histoire_h1) && arc(en.h1.pellicule) && !flag(h1_photo_1977)"
        texte: "« Le bail de 1977, Madame Marsal l'a payé avec une photo, une seule, vendue au président de l'époque. Vaubourg. Le chèque, c'est moi qui l'ai porté à la banque. »"
        effets: {set: [h1_photo_1977]}
      - id: arlaud_fax
        lien: 2
        si: "flag(histoire_h6) && saison >= 2"
        texte: "« Des rouleaux pour un fax de 1987, je n'en commande plus que pour une machine en ville : celle du club-house, au sous-sol. Quelqu'un m'en prend un par mois, depuis l'automne. En pièces. »"
        effets: {var: {h6_indices: "+1"}}
      - id: arlaud_chroniqueur
        lien: 2
        si: "annee <= 2007"
        texte: "« Le chroniqueur de L'Écho m'a acheté trois carnets et un dictionnaire des synonymes. Quand il prend le dictionnaire, c'est qu'il prépare une série. Sur vous, je pense. »"
    service:
      lien: 3
      label: "Un mot au journal"
      texte: "Le mot d'Agathe arrive au chroniqueur avec son paquet de cigarettes. Le lundi, pour la première fois, sa chronique parle de toi sans méchanceté. Elle parle même du match."
      effets: {jauges: {tribunes: 2, direction: 1}}

  - id: vautrin
    name: "Céline Vautrin"
    label: "LIBRAIRE-PAPETIÈRE"
    genre: f
    tic: "Ceux qui comptent lisent encore."
    on_relation: {3: vi.vautrin.livre}
    portrait: {teint: brun, corpulence: moyen, age: mur, coiffure: boucle, cheveux: noir, pilosite: rase, lunettes: aviateur, tenue: veste, couleur: camel, accessoire: carnet, couleur_accessoire: rouge}
    lieu: librairie
    tranches: [matin, aprem]
    annees: [2008, 2050]
    reseau: presse
    trace: "Céline Vautrin s'en souviendra. Elle note les titres que les gens n'osent pas acheter."
    paliers: ["te reconnaît", "te commande des livres sans qu'on lui demande", "ferait patienter un journaliste pour toi"]
    froid: ["te fait attendre la borne", "perd ta commande", "ne te vend plus rien"]
    activites: [librairie_tirages]
    repliques:
      - {lien: 0, texte: "Vous cherchez un livre, ou vous voulez qu'on vous voie chercher un livre ? Les deux se vendent très bien."}
      - {lien: 1, texte: "J'ai racheté la boutique à Madame Arlaud avec le tiroir des pellicules jamais réclamées. Je n'en ai ouvert aucune. Elle m'a fait promettre."}
      - {lien: 1, si: "serie_d >= 3", texte: "On m'a commandé deux biographies de vos prédécesseurs, cette semaine. Les gens préparent des comparaisons."}
      - {lien: 2, si: "annee >= 2020", texte: "Le Flux dit tout avant L'Écho. Les gens de L'Écho viennent m'acheter des carnets pour écrire ce que le Flux a déjà dit. Moi, je vends les carnets."}
      - {lien: 2, texte: "La borne imprime en trente secondes. On fait tirer les photos qu'on a peur de perdre. J'ai vu tirer des joueurs morts, et des joueurs vendus. Les mêmes visages."}
      - {lien: 3, texte: "Je sais quel livre offrir à un journaliste pour qu'il regarde ailleurs. Ça a déjà marché deux fois. Un bon livre, ça occupe."}
      - {lien: -1, texte: "Je n'ai pas ce titre. Ni celui-là."}
      - {lien: 2, si: "flag(tuyau_vautrin_comptes)", texte: "La journaliste m'a commandé un troisième livre sur les comptes des clubs. Celui sur le vôtre n'existe pas encore. Elle est en train de l'écrire."}
    tuyaux:
      - id: vautrin_comptes
        lien: 2
        si: "annee >= 2008"
        texte: "« La journaliste de L'Écho a commandé tous les livres sur les comptes des clubs. Livrés chez elle, pas au journal. Elle prépare quelque chose qu'elle ne veut pas qu'on voie arriver. »"
    service:
      lien: 3
      label: "Un livre pour la journaliste"
      texte: "Céline offre à la journaliste de L'Écho un livre qu'elle cherchait depuis dix ans, avec ta carte glissée dedans. Le papier sur toi paraît une semaine plus tard, et moins dur."
      effets: {jauges: {tribunes: 2}}

  # ══════════════════════════════════════════════════════════════════ LE CINÉMA
  # L'Aurore. 1990-2011 : Ernest Vigouroux, le projectionniste (la dernière bobine
  # de la vie de la ville, c'est sa signature). 2012-2050 : Ghislaine Viard, la
  # caissière, qui lance le film depuis l'ordinateur et note les avis dans un cahier.
  - id: vigouroux
    name: "Ernest Vigouroux"
    label: "PROJECTIONNISTE DE L'AURORE"
    genre: m
    tic: "Une bobine, ça se réchauffe."
    on_relation: {3: vi.vigouroux.seance}
    portrait: {teint: clair, corpulence: large, age: age, coiffure: degarni, cheveux: gris, pilosite: barbe, lunettes: carrees, tenue: pull, couleur: noir, accessoire: aucun}
    lieu: cinema
    tranches: [soir]
    annees: [1990, 2011]
    reseau: rue
    trace: "Ernest s'en souviendra. Il retient les gens à leur place dans la salle."
    paliers: ["te reconnaît dans le noir", "te laisse monter en cabine", "passerait n'importe quel film pour toi"]
    froid: ["te place au premier rang", "lance le film avant que tu sois à ta place", "ne te laisse plus entrer"]
    activites: [cinema_seance]
    repliques:
      - {lien: 0, texte: "Le film commence quand je le décide. Le panneau dit vingt et une heures ; la bobine dit quand elle est prête."}
      - {lien: 1, texte: "D'en haut, je vois toute la salle : les couples du fond, les gamins du centre, votre capitaine seul le mardi. Je ne dis rien. C'est la cabine qui voit."}
      - {lien: 1, si: "serie_d >= 3", texte: "Quand le stade perd, les gens viennent voir des comédies. Ils ne rient pas, mais ils viennent. C'est pour le noir, je crois."}
      - {lien: 2, texte: "J'ai à la cave les actualités de toutes les finales depuis 1951. Le club n'en veut pas, la mairie non plus. Elles fondent, doucement, comme du sucre."}
      - {lien: 2, si: "annee >= 2008", texte: "Ils vont mettre une machine : un disque dur, un bouton. J'ai demandé qui réchaufferait la bobine. Ils m'ont regardé comme on regarde une bobine."}
      - {lien: 3, texte: "La salle, un dimanche matin, avec un film à vous : je vous la donne quand vous voulez. Personne ne vient le dimanche matin."}
      - {lien: -1, texte: "Il reste des places au premier rang."}
      - {lien: -2, texte: "La séance est complète. Elle est vide, mais elle est complète."}
      - {lien: 2, si: "flag(tuyau_vigouroux_cle)", texte: "Vous avez essayé la clé ? Elle marche toujours. J'ai vérifié, une nuit de derby. Je n'ai rien pris. J'ai écouté le local chanter."}
    tuyaux:
      - id: vigouroux_dernier_rang
        lien: 2
        si: "role != president && role != selectionneur && annee <= 2011"
        texte: "« Le vendredi, au dernier rang, côté mur : le président, et la femme d'un joueur du club. Ils arrivent après la lumière et partent avant. La cabine voit tout. Moi, je n'ai rien vu. »"
      - id: vigouroux_cle
        lien: 2
        si: "annee <= 2011"
        texte: "« La clé de la sortie de secours de L'Aurore ouvre aussi la porte de derrière du local du kop. Même serrurier, même année. Personne ne s'en est jamais aperçu. Maintenant, vous. »"
    service:
      lien: 3
      label: "La salle rien qu'à vous"
      texte: "Un dimanche matin, L'Aurore est à toi : la salle, le film de ton choix, la confiserie ouverte. Tu y emmènes ton groupe. Pendant deux heures, personne ne sait où vous êtes."
      effets: {jauges: {vestiaire: 3}}

  - id: viard
    name: "Ghislaine Viard"
    label: "CAISSIÈRE DE L'AURORE"
    genre: f
    tic: "Trois bonbons de plus, pour tous."
    on_relation: {3: vi.viard.cahier, -3: vi.viard.lumiere}
    portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: chignon, cheveux: roux, pilosite: rase, lunettes: aucune, tenue: veste, couleur: rouge, accessoire: badge, couleur_accessoire: creme}
    lieu: cinema
    tranches: [soir]
    annees: [2012, 2050]
    reseau: rue
    trace: "Ghislaine s'en souviendra. Elle note dans un cahier ce que les gens disent des films."
    paliers: ["te reconnaît", "te garde ta place au fond", "t'ouvrirait la salle après minuit"]
    froid: ["te fait payer plein tarif", "ne te rajoute plus de bonbons", "ne te vend plus de place"]
    activites: [cinema_numerique]
    repliques:
      - {lien: 0, texte: "Une place, un cornet ? Le film démarre tout seul à vingt et une heures. Je monte quand même appuyer sur le bouton à moins une. Par principe."}
      - {lien: 1, texte: "Ernest m'a laissé la clé de la cabine et une boîte de bouts de pellicule. Je ne sais pas quoi en faire. Je les regarde contre la lumière, le soir."}
      - {lien: 1, si: "serie_v >= 3", texte: "Ces semaines-ci, les gens choisissent les films longs. Quand on gagne, on n'est pas pressé de rentrer chez soi."}
      - {lien: 2, texte: "J'écris dans un cahier ce que les gens pensent des films. Le vôtre, je le relis. Vous ne dites jamais ce que vous avez pensé. Vous dites ce que vous avez vu."}
      - {lien: 2, si: "flag(histoire_h10) && mission(h10.sc.aurore_sonnerie)", texte: "Je vous ai dit que la sonnerie était dans le film. Je dis beaucoup de choses aux gens qui sortent. Ça les aide à rentrer."}
      - {lien: 3, texte: "La porte du fond reste ouverte après minuit, les soirs où il vous faut une salle que personne ne surveille. Rendez la clé avant six heures."}
      - {lien: -1, texte: "Plein tarif. Et pas de bonbons."}
      - {lien: 2, si: "flag(tuyau_viard_vente)", texte: "Le dossier de L'Aurore est toujours sur le bureau du président. Sa secrétaire vient voir les films du mardi. Elle pleure aux fins heureuses."}
    tuyaux:
      - id: viard_sonnerie
        lien: 2
        si: "flag(histoire_h10) && mission(h10.sc.aurore_sonnerie) && !flag(h10_clapet_nino)"
        texte: "« La sonnerie n'était pas dans le film. C'était le petit Nino, du kop. Il a répondu dans le hall, tout bas : “Oui, madame.” Puis il m'a demandé de dire le contraire, si on me demandait. »"
        effets: {set: [h10_clapet_nino]}
      - id: viard_vente
        lien: 2
        si: "role != president && annee >= 2012"
        texte: "« La mairie veut vendre L'Aurore. Le dossier est sur le bureau de votre président : il en ferait une salle de réception pour les partenaires du club. Il ne vous l'a pas dit ? »"
    service:
      lien: 3
      label: "La salle après minuit"
      texte: "Ghislaine te laisse L'Aurore après minuit : la porte du fond, la salle éteinte, une rencontre que personne ne verra. Tu rends la clé à cinq heures cinquante, sous le paillasson."
      effets: {jauges: {direction: 2}}
      dette: true

  # ═══════════════════════════════════════════════════════════════════ L'ÉCOLE
  # L'école des Lilas. 1990-2012 : Armand Bellocq, directeur et maître des CM2.
  # 2013-2050 : Mathilde Chabanel, la maîtresse des CM2 (le livre 9 : les brassards
  # en feutrine, « le directeur a dit non » ; elle a eu Kévin en classe).
  - id: bellocq
    name: "Armand Bellocq"
    label: "DIRECTEUR DE L'ÉCOLE DES LILAS"
    genre: m
    tic: "Un enfant, ça se compte à la grille."
    on_relation: {3: vi.bellocq.reunion, -3: vi.bellocq.dictee}
    portrait: {teint: clair, corpulence: fin, age: age, coiffure: degarni, cheveux: blanc, pilosite: moustache, lunettes: rondes, tenue: blouse, couleur: gris, accessoire: stylo, couleur_accessoire: rouge}
    lieu: ecole
    tranches: [matin, aprem]
    annees: [1990, 2012]
    reseau: familles
    trace: "Monsieur Bellocq s'en souviendra. Il n'a jamais oublié un élève, même ceux qu'il aurait voulu."
    paliers: ["te reconnaît à la grille", "te fait entrer dans la cour", "ferait parler les parents pour toi"]
    froid: ["te laisse derrière la grille", "parle de toi en classe", "ne t'ouvre plus la grille"]
    repliques:
      - {lien: 0, texte: "Vous attendez quelqu'un ? À la grille, on attend un enfant. Si c'est un enfant, je vous laisse. Sinon, je vous regarde."}
      - {lien: 1, texte: "J'ai eu la moitié de votre tribune Nord en CM2. Je sais qui recopiait, qui pleurait à la dictée, qui se battait à la récréation. Ça n'a pas changé."}
      - {lien: 1, si: "serie_d >= 3", texte: "À la récréation, plus personne ne veut être le gardien du club. Ils veulent tous être celui d'en face. Ça me dit le classement mieux que L'Écho."}
      - {lien: 2, texte: "On veut fermer une classe à la rentrée. Vingt-deux élèves ; il en faudrait vingt-cinq. Trois enfants, c'est trois familles. Vous en avez, des familles, au club ?"}
      - {lien: 2, si: "flag(histoire_h4) && annee <= 1993", texte: "La petite Sacha dessine des voitures rouges sur des ponts. La maîtresse s'inquiète. Moi, je trouve que c'est bon signe, une voiture qui arrive au bout."}
      - {lien: 3, texte: "À la réunion du jeudi, les parents croient tout ce que dit le directeur. C'est terrible. Je peux dire du bien de vous."}
      - {lien: -1, texte: "La grille reste fermée pendant les heures de classe."}
      - {lien: -2, texte: "J'ai parlé de vous en instruction civique. Comme exemple. Pas comme bon exemple."}
      - {lien: 2, si: "flag(tuyau_bellocq_parents) && tribunes >= 50", texte: "Les parents sont revenus au match avec les enfants. Ils n'ont pas sifflé. Ils leur ont appris autre chose, finalement."}
    tuyaux:
      - id: bellocq_classe
        lien: 2
        si: "role != selectionneur && annee <= 2012"
        texte: "« L'inspecteur ferme une classe s'il manque trois inscrits. Les familles de vos jeunes joueurs logent à Valdorne. S'ils habitaient ici, la classe resterait ouverte. »"
      - id: bellocq_parents
        lien: 2
        si: "tribunes < 40 && annee <= 2012"
        texte: "« À la réunion de jeudi, les parents ont parlé de vous plus que des devoirs. Samedi, ils viendront au match avec les enfants. Pour leur apprendre à siffler, ont-ils dit. »"
    service:
      lien: 3
      label: "La réunion du jeudi"
      texte: "À la réunion des parents d'élèves, Monsieur Bellocq parle de toi entre la cantine et la kermesse. Le samedi suivant, cent familles regardent le club autrement."
      effets: {jauges: {tribunes: 2}}

  - id: chabanel
    name: "Mathilde Chabanel"
    label: "INSTITUTRICE, CLASSE DE CM2"
    genre: f
    tic: "Un cahier, ça ne ment pas."
    on_relation: {3: vi.chabanel.redaction}
    portrait: {teint: dore, corpulence: moyen, age: mur, coiffure: queue, cheveux: chatain, pilosite: rase, lunettes: rondes, tenue: pull, couleur: jaune, accessoire: stylo, couleur_accessoire: pelouse}
    lieu: ecole
    tranches: [matin, aprem]
    annees: [2013, 2050]
    reseau: familles
    trace: "Madame Chabanel s'en souviendra. Elle se souvient de tous les parents, surtout des absents."
    paliers: ["te reconnaît à la sortie", "te fait entrer dans la classe", "ferait parler l'école pour toi"]
    froid: ["te rappelle l'heure de la sortie", "te fait attendre derrière la grille", "ne te parle plus"]
    repliques:
      - {lien: 0, texte: "Vous êtes parent ? Non ? Alors vous êtes du club. Les enfants vont vous demander votre salaire. Ne répondez pas : ils le répéteraient à table."}
      - {lien: 1, si: "annee >= 2016", texte: "J'ai eu Kévin en CM2, le fils de la boulangère. Il dessinait des grues. Toujours des grues, avec un petit bonhomme tout en haut."}
      - {lien: 1, si: "serie_d >= 3", texte: "Les écharpes du club sont au fond des cartables, ces temps-ci. Elles ressortiront. Les enfants sont fidèles plus longtemps que les adultes."}
      - {lien: 2, texte: "Le directeur dit non à tout ce qui ressemble au football en classe. Alors je fais des mathématiques avec les classements. Il n'a pas encore compris."}
      - {lien: 2, si: "flag(histoire_h9) && flag(h9_brassard_photo)", texte: "Les brassards en feutrine, c'était en arts plastiques. Le directeur les a confisqués. Le lendemain, ils étaient sur les cartables. Je n'ai rien fait. Rien du tout."}
      - {lien: 3, texte: "Je peux donner une rédaction : « Un adulte que j'admire. » Les enfants écrivent ce qu'ils entendent à table. Et l'inverse."}
      - {lien: -1, texte: "La sortie, c'est seize heures trente. Pas avant."}
    tuyaux:
      - id: chabanel_redactions
        lien: 2
        si: "role != selectionneur && annee >= 2013"
        texte: "« Rédaction de la semaine, « Ma famille » : trois élèves ont écrit que leurs parents allaient perdre leur travail au club. Le jardinier, le chauffeur, la lingère. Vous le saviez ? »"
    service:
      lien: 3
      label: "Une rédaction"
      texte: "Madame Chabanel donne à ses CM2 une rédaction : « Un adulte que j'admire ». Le soir, dans cent cuisines, les parents entendent ton nom entre la soupe et le dessert."
      effets: {jauges: {tribunes: 2}}

# ═════════════════════════════════════════════════════════════════════ LES GESTES
# Les activités qu'on fait avec quelqu'un (`avec`, un point de lien au plus entre
# deux cartes) et ce que la ville en dit (`habitude`). Chacune tient l'époque de sa
# personne par son `si` : le moteur crédite le lien sans regarder l'année.
activites:
  # ── l'épicerie
  - id: qr_epi_tenir
    lieu: epicerie
    objet: comptoir
    label: "Tenir la boutique"
    texte: "Ginette te passe son tablier : « Cinq minutes, le temps de la banque. » Une dame demande du crédit. Tu ne sais pas où est le cahier. Elle, si : elle te le montre du menton."
    textes:
      - "Ginette te passe son tablier : « Cinq minutes, le temps de la banque. » Une dame demande du crédit. Tu ne sais pas où est le cahier. Elle, si : elle te le montre du menton."
      - "Un gamin pose trois pièces sur le comptoir pour un paquet de biscuits qui en coûte cinq. Tu regardes Ginette, au fond. Elle hoche la tête. Le gamin repart avec les biscuits et un regard."
      - "Tu tiens la caisse un quart d'heure. Personne n'achète rien : on vient voir qui tient la caisse. Ginette revient de la banque et compte tes visiteurs, pas tes ventes."
    avec: coulomb
    habitude: quartier
    si: "annee <= 2003"
    heures: [matin, aprem]
    tranches: 1
  - id: qr_epi_liste
    lieu: epicerie
    objet: rayons
    label: "Tes courses, à sa façon"
    texte: "Tu dictes ta liste à Ginette. Elle la refait à sa manière : moins de bière, une soupe, du savon. « Vous mangez comme quelqu'un qui rentre trop tard. Ça se voit au teint. »"
    textes:
      - "Tu dictes ta liste à Ginette. Elle la refait à sa manière : moins de bière, une soupe, du savon. « Vous mangez comme quelqu'un qui rentre trop tard. Ça se voit au teint. »"
      - "Ginette remplit ton cabas en parlant de la cité : un mariage samedi, un licenciement lundi, un bébé qui ne dort pas. Elle ajoute des bouchons d'oreilles, pour la voisine du bébé."
    avec: coulomb
    habitude: quartier
    si: "annee <= 2003"
    francs: -35
    tranches: 1
  - id: qr_epi_colis
    lieu: epicerie
    objet: comptoir
    label: "Trier les colis du soir"
    texte: "Yacine te tend une pile de cartons et un feutre : par rue, puis par étage. Tu apprends qui commande quoi. Lui ne lève pas les yeux de son écran : il le savait déjà."
    textes:
      - "Yacine te tend une pile de cartons et un feutre : par rue, puis par étage. Tu apprends qui commande quoi. Lui ne lève pas les yeux de son écran : il le savait déjà."
      - "Un carton très lourd pour une vieille dame du quatrième. Yacine te le fait monter. Ce sont des livres de poche, cent vingt. Elle te dit qu'elle relit tout depuis le début."
    avec: kessar
    habitude: quartier
    si: "annee >= 2004"
    heures: [aprem, soir]
    tranches: 1
  # ── la boulangerie
  - id: qr_boul_fournee
    lieu: boulangerie_residentiel
    objet: pains
    label: "Attendre la fournée"
    texte: "À onze heures, la file attend la deuxième fournée. Lucette distribue les nouvelles du quartier avec la monnaie : un mariage, une naissance, un abonné de la Nord qui ne viendra plus."
    textes:
      - "À onze heures, la file attend la deuxième fournée. Lucette distribue les nouvelles du quartier avec la monnaie : un mariage, une naissance, un abonné de la Nord qui ne viendra plus."
      - "La fournée a dix minutes de retard. Personne ne s'en va. Lucette fait goûter des chouquettes de la veille et demande à chacun le score de samedi, pour comparer."
    avec: pichon_lucette
    habitude: quartier
    si: "annee <= 2007"
    heures: [matin, midi]
    tranches: 1
  - id: qr_boul_fournil
    lieu: boulangerie_residentiel
    objet: four
    label: "Le fournil à cinq heures"
    texte: "Cinq heures, la porte du fournil entrouverte. Marie-Jo te met les mains dans la pâte : « Pas comme ça. Comme on borde quelqu'un. » Tu repars avec une baguette de travers, la tienne."
    textes:
      - "Cinq heures, la porte du fournil entrouverte. Marie-Jo te met les mains dans la pâte : « Pas comme ça. Comme on borde quelqu'un. » Tu repars avec une baguette de travers, la tienne."
      - "Marie-Jo enfourne sans un mot. La radio donne les résultats de la veille. Au tien, elle monte le son, puis le baisse, selon. Ce matin, elle le monte."
    avec: mariejo
    habitude: quartier
    si: "annee >= 2008 && annee <= 2034"
    heures: [matin]
    tranches: 1
  - id: qr_boul_invendus
    lieu: boulangerie_residentiel
    objet: comptoir
    label: "Porter les invendus"
    texte: "À midi, Malo remplit deux cabas d'invendus pour le foyer de la rue Haute. Tu les portes. Au foyer, on te demande le score avant de te demander ton nom."
    avec: guerand
    habitude: largesse
    si: "annee >= 2035"
    heures: [midi]
    tranches: 1
  # ── le garage
  - id: qr_garage_cafe
    lieu: garage
    objet: etabli
    label: "Un café avec Quintane"
    texte: "Quintane fait le café dans une casserole cabossée, sur le réchaud de l'établi, et le sert dans deux tasses de 1962, ébréchées au même endroit. Il ne dit rien. Le café non plus."
    textes:
      - "Quintane fait le café dans une casserole cabossée, sur le réchaud de l'établi, et le sert dans deux tasses de 1962, ébréchées au même endroit. Il ne dit rien. Le café non plus."
      - "Le café a le goût de l'huile et de la chicorée. Quintane boit le sien en écoutant un moteur au ralenti, les yeux fermés. « Une bougie. Elle tousse. Comme mon père, le matin. »"
      - "Il pose sa tasse sur l'aile d'une voiture et te raconte 1966 : le car de la Coupe, la caution signée par son père, la maison vendue. Sans colère, comme on lit une facture."
      - "Le réchaud s'éteint. Il le rallume avec une allumette, du premier coup. « Quarante ans que je le rallume. Le jour où je rate, j'arrête. » Il ne rate pas."
      - "« Du sucre ? » Il n'en a pas. Il te tend la boîte de vis à la place, et rit, pour la première fois depuis que tu le connais. Le café est meilleur, après."
    avec: quintane
    habitude: quartier
    si: "annee <= 2018"
    heures: [matin, aprem]
    tranches: 1
  - id: qr_garage_moteur
    lieu: garage
    objet: pont
    label: "Écouter un moteur"
    texte: "Quintane te met devant un moteur qui tourne : « Qu'est-ce qui cloche ? » Tu ne sais pas. Au bout de trente secondes, tu entends : un petit claquement, à gauche. Il hoche la tête."
    textes:
      - "Quintane te met devant un moteur qui tourne : « Qu'est-ce qui cloche ? » Tu ne sais pas. Au bout de trente secondes, tu entends : un petit claquement, à gauche. Il hoche la tête."
      - "Une voiture du club, sur le pont. Quintane écoute, la main à plat sur le capot. « Elle a fait Valdorne à fond, cette nuit, et elle a freiné tard. » Il ne dit pas qui conduisait."
    avec: quintane
    habitude: quartier
    si: "annee <= 2018"
    heures: [matin, aprem]
    tranches: 1
  - id: qr_garage_valise
    lieu: garage
    objet: bureau
    label: "La valise de diagnostic"
    texte: "Jérémy branche la valise sur ta voiture et tourne l'écran vers toi : tes trajets du mois, heure par heure. « Elle sait où vous dormez. Moi, je n'ai rien vu. » Il débranche."
    textes:
      - "Jérémy branche la valise sur ta voiture et tourne l'écran vers toi : tes trajets du mois, heure par heure. « Elle sait où vous dormez. Moi, je n'ai rien vu. » Il débranche."
      - "La valise dit que tout va bien. Jérémy coupe le moteur, attend, le relance, et écoute trente secondes, les yeux fermés, comme on le lui a appris. « Le roulement. À gauche. »"
    avec: saulnier
    habitude: quartier
    si: "annee >= 2019"
    heures: [matin, aprem]
    tranches: 1
  # ── la laverie
  - id: qr_laverie_repasser
    lieu: laverie
    objet: pliage
    label: "Donner ton linge à repasser"
    texte: "Gisèle prend tes chemises une à une et regarde les cols, les poignets, rien d'autre. « Vous travaillez trop de la main droite. » Elle te les rend le lendemain, pliées, encore tièdes."
    textes:
      - "Gisèle prend tes chemises une à une et regarde les cols, les poignets, rien d'autre. « Vous travaillez trop de la main droite. » Elle te les rend le lendemain, pliées, encore tièdes."
      - "Elle trouve dans ta poche un ticket de parking de Valdorne et le pose sur la pile, sans commentaire. Elle ne commente jamais. Elle pose."
    avec: delmotte
    habitude: quartier
    si: "annee <= 2012"
    heures: [matin, midi, aprem]
    francs: -30
    tranches: 0
    max_jour: 1
  - id: qr_laverie_attendre
    lieu: laverie
    objet: machines
    label: "Attendre avec Gisèle"
    texte: "Ta machine tourne. Gisèle te raconte le linge des autres sans dire un nom : la chemise du marié, la nappe d'une communion, un maillot qu'on lave à part. Le tambour s'arrête trop tôt."
    textes:
      - "Ta machine tourne. Gisèle te raconte le linge des autres sans dire un nom : la chemise du marié, la nappe d'une communion, un maillot qu'on lave à part. Le tambour s'arrête trop tôt."
      - "Gisèle te montre comment plier un drap sans aide, contre le mur, avec le menton. « Mon mari est parti en 1979. Le drap, je l'ai gardé. » Elle rit. Tu ne sais pas si c'est une blague."
    avec: delmotte
    habitude: quartier
    si: "annee <= 2012"
    heures: [matin, midi, aprem]
    tranches: 1
  - id: qr_laverie_quatre
    lieu: laverie
    objet: machines
    label: "Regarder tourner la 4"
    texte: "Le soir, Gabriel éteint la moitié des néons. Vous regardez tourner la 4 sans rien dire. Il te tend un gobelet du distributeur. « Elle tourne mieux quand on la regarde. »"
    textes:
      - "Le soir, Gabriel éteint la moitié des néons. Vous regardez tourner la 4 sans rien dire. Il te tend un gobelet du distributeur. « Elle tourne mieux quand on la regarde. »"
      - "Gabriel compte les tours du tambour à voix basse, comme on compte des moutons. Il s'arrête à deux cents. « Au-delà, je m'endors. Et je ferme à une heure. »"
    avec: montel
    habitude: quartier
    si: "annee >= 2013"
    heures: [soir]
    tranches: 1
  # ── le marché
  - id: qr_marche_etal
    lieu: marche
    label: "Tenir l'étal une heure"
    texte: "Achille te met son tablier et sa boîte à chaussures dans les mains : « Je reviens. » Il ne revient pas avant une heure. Tu pèses large ; il le voit de loin, et ne dit rien."
    textes:
      - "Achille te met son tablier et sa boîte à chaussures dans les mains : « Je reviens. » Il ne revient pas avant une heure. Tu pèses large ; il le voit de loin, et ne dit rien."
      - "Une cliente te demande si les tomates sont d'ici. Tu ne sais pas. Achille, du café d'en face, lève trois doigts : trois kilomètres. Tu répètes. Elle en prend deux kilos."
    avec: ducros_achille
    habitude: quartier
    si: "annee <= 2011"
    heures: [matin]
    tranches: 1
  - id: qr_marche_camionnette
    lieu: marche
    label: "Décharger la camionnette"
    texte: "Six heures, la camionnette de Laure. Tu portes les cageots pendant qu'elle monte les tréteaux. Elle te paie en légumes et en nouvelles : qui s'est marié, qui a vendu, qui est revenu."
    avec: ducros_laure
    habitude: quartier
    si: "annee >= 2012 && annee <= 2037"
    heures: [matin]
    tranches: 1
  - id: qr_marche_etals_vides
    lieu: marche
    label: "Monter les étals vides"
    texte: "La mairie monte les étals même vides. Côme et toi y posez des cageots retournés, pour que la place ait l'air de quelque chose. Une vieille dame vient acheter à un étal où il n'y a rien."
    avec: dartigue
    habitude: quartier
    si: "annee >= 2038"
    heures: [matin]
    tranches: 1
  # ── le fleuriste
  - id: qr_fleur_rubans
    lieu: fleuriste
    objet: gerbes
    label: "Nouer les rubans"
    texte: "Madame Huguette te fait nouer les rubans des gerbes du samedi. Tu écris les noms à l'encre dorée, lettre par lettre. Elle relit derrière toi, et corrige un accent."
    textes:
      - "Madame Huguette te fait nouer les rubans des gerbes du samedi. Tu écris les noms à l'encre dorée, lettre par lettre. Elle relit derrière toi, et corrige un accent."
      - "Une couronne pour un mariage, une gerbe pour un deuil, le même jour, sur la même table. Huguette change de ruban sans changer de visage. « Les fleurs ne font pas la différence. »"
    avec: huguette
    habitude: famille
    si: "annee <= 2016"
    heures: [matin, aprem]
    tranches: 1
  - id: qr_fleur_tournee
    lieu: fleuriste
    objet: fleurs
    label: "La tournée de Corentin"
    texte: "Dans la camionnette verte, Corentin livre la ville : un mariage, une maternité, deux funérariums. Entre deux arrêts, il te dit qui pleure qui. Il ne se trompe jamais."
    avec: mevellec
    habitude: famille
    si: "annee >= 2017"
    heures: [matin, aprem]
    tranches: 1
  # ── le tailleur
  - id: qr_tailleur_ruban
    lieu: tailleur
    objet: miroir
    label: "Tenir le ruban"
    texte: "Auguste te fait tenir le bout du ruban pendant qu'il mesure un client. « Ne tirez pas. Un ruban qui tire ment. » Le client parle du club ; Auguste ne note rien. Il retient."
    avec: brunel_auguste
    habitude: quartier
    si: "annee <= 2004"
    heures: [matin, aprem]
    tranches: 1
  - id: qr_tailleur_ourlet
    lieu: tailleur
    objet: comptoir
    label: "Un ourlet, en chaussettes"
    texte: "Clément fait l'ourlet de ton pantalon pendant que tu attends en chaussettes, sur la chaise. Il raconte la capitale : les défilés, les épingles dans la bouche, les clients qu'on ne voit jamais."
    avec: brunel_clement
    habitude: quartier
    si: "annee >= 2005 && annee <= 2034"
    heures: [matin, aprem]
    francs: -25
    tranches: 1
  - id: qr_tailleur_vitrine
    lieu: tailleur
    objet: chaussures
    label: "La vitrine du bas"
    texte: "Gaspard ouvre la vitrine du bas avec des gants blancs. Il te raconte chaque paire : qui l'a portée, en quelle année, contre qui. Il ne vend jamais les plus belles."
    avec: brunel_gaspard
    habitude: quartier
    si: "annee >= 2035"
    heures: [matin, aprem]
    tranches: 1
  # ── la librairie
  - id: qr_librairie_echo
    lieu: librairie
    objet: comptoir
    label: "L'Écho à six heures et demie"
    texte: "Agathe t'ouvre avant l'heure. Vous lisez L'Écho à deux, debout derrière le comptoir, avant que la ville le lise. Elle souligne au crayon ce qui va faire parler."
    textes:
      - "Agathe t'ouvre avant l'heure. Vous lisez L'Écho à deux, debout derrière le comptoir, avant que la ville le lise. Elle souligne au crayon ce qui va faire parler."
      - "Page des sports, une photo de toi, de profil. Agathe la regarde longtemps. « Ils ont pris le mauvais côté. Odette disait qu'une photo choisit toujours un côté. »"
    avec: arlaud
    habitude: culture
    si: "annee <= 2007"
    heures: [matin]
    tranches: 1
  - id: qr_librairie_introuvable
    lieu: librairie
    objet: rayons
    label: "Un livre introuvable"
    texte: "Tu demandes un livre épuisé depuis vingt ans. Céline le note dans son carnet rouge, sans rien promettre. Trois semaines plus tard, il est là, avec une dédicace à quelqu'un d'autre."
    avec: vautrin
    habitude: culture
    si: "annee >= 2008"
    francs: -60
    tranches: 1
  # ── le cinéma
  - id: qr_cinema_cabine
    lieu: cinema
    objet: salle
    label: "Monter en cabine"
    texte: "Ernest te fait monter en cabine pendant la séance : la chaleur, le cliquetis du projecteur, la salle en bas comme une mer. Il change la bobine sans regarder, à la seconde près."
    textes:
      - "Ernest te fait monter en cabine pendant la séance : la chaleur, le cliquetis du projecteur, la salle en bas comme une mer. Il change la bobine sans regarder, à la seconde près."
      - "Par la lucarne de la cabine, Ernest te montre les têtes : les amoureux du fond, un abonné de la Nord qui pleure à chaque film, ton capitaine, seul, au troisième rang."
    avec: vigouroux
    habitude: culture
    si: "annee <= 2011"
    heures: [soir]
    tranches: 1
  - id: qr_cinema_avis
    lieu: cinema
    objet: caisse
    label: "Dire ce que tu as pensé"
    texte: "À la sortie, Ghislaine ouvre son cahier : « Alors ? » Tu dis ce que tu as pensé du film. Elle l'écrit mot pour mot, avec la date, sous l'avis d'un autre, de la veille."
    avec: viard
    habitude: culture
    si: "annee >= 2012"
    heures: [soir]
    tranches: 0
    max_jour: 1
  # ── l'école
  - id: qr_ecole_etude
    lieu: ecole
    objet: pupitres
    label: "L'étude du soir"
    texte: "Monsieur Bellocq te confie l'étude du soir : douze enfants, des devoirs, un problème de trains qui se croisent. Tu ne sais pas le résoudre. Une gamine du premier rang, si. Elle t'explique."
    avec: bellocq
    habitude: famille
    si: "annee <= 2012"
    heures: [aprem]
    jours: [lun, mar, jeu, ven]
    tranches: 1
  - id: qr_ecole_lecture
    lieu: ecole
    objet: pupitres
    label: "Lire une histoire aux CM2"
    texte: "Madame Chabanel te laisse la classe un quart d'heure. Tu lis une histoire à voix haute. Au fond, un garçon fait semblant de dormir ; à la fin, c'est lui qui demande la suite."
    avec: chabanel
    habitude: famille
    si: "annee >= 2013"
    heures: [aprem]
    jours: [lun, mar, jeu, ven]
