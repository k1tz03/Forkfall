# ═════════════════════════════════════════════════════════════════════ LES SCÈNES
# La vie des gens (gardée par le lien et par leur époque), ce que leurs tuyaux
# rendent (`flag(tuyau_…)`), leurs dettes (`flag(dette_…)`, réclamées une fois :
# refuser coûte le lien, et la dette s'efface dans les deux cas), et ce que la
# ville fait de tes réputations de quartier, de famille et de liseur.
scenes:
  # ──────────────────────────────────────────────────────────────── l'épicerie
  - id: vi.qr.coulomb_page
    titre: "La page du soir"
    lieu: epicerie
    tranches: [soir]
    qui: coulomb
    si: "flag(tuyau_coulomb_page) && role != selectionneur && annee <= 2003"
    texte: "Vingt heures passées. Une jeune femme attend que la boutique se vide, un gamin endormi sur l'épaule. Ginette ouvre le cahier à sa page, puis te regarde, toi."
    choix:
      - label: "Je paie la page"
        francs: -400
        reponse: "Ginette barre la page d'un trait très droit. La jeune femme ne saura pas qui. Le lundi, son mari court comme un garçon qui n'a plus de dette."
        effets: {jauges: {vestiaire: 2}, relation: {coulomb: 1}}
      - label: "Ce n'est pas mon affaire"
        reponse: "Ginette écrit la ligne du jour : du lait, des couches. La jeune femme repart sous la pluie. Au club, son mari ne demande jamais rien. Il le paie autrement."
        effets: {jauges: {vestiaire: -1}}

  - id: vi.qr.coulomb_oeufs
    titre: "Quatre boîtes d'œufs"
    lieu: stade
    tranches: [midi]
    jours: [sam]
    qui: fan
    si: "flag(tuyau_coulomb_oeufs) && role != selectionneur && annee <= 2003"
    texte: "Samedi, une heure avant le match, derrière la tribune Nord : six garçons et un sac de l'épicerie Coulomb. Ils se taisent en te voyant. Le plus jeune cache le sac dans son dos."
    choix:
      - label: "Je leur parle"
        reponse: "Tu restes dix minutes. Tu parles du match, de leur virage, de rien. Ils te laissent repartir avec le sac. Ce jour-là, ils chantent jusqu'au coup de sifflet final."
        effets: {jauges: {tribunes: 2}}
      - label: "Je préviens les stewards"
        reponse: "Les stewards confisquent le sac à l'entrée. Les œufs finissent au poste de sécurité. Les garçons, eux, sifflent toute la seconde mi-temps."
        effets: {jauges: {tribunes: -2, direction: 1}}

  - id: vi.qr.coulomb_dette
    titre: "La page au crayon"
    lieu: epicerie
    qui: coulomb
    si: "flag(dette_coulomb)"
    texte: "Ginette pose le cahier ouvert devant toi, à ta page au crayon. « Le mois est passé. Mon mari fait les comptes le dimanche soir. Je ne veux pas qu'il compte votre page. »"
    choix:
      - label: "Je solde la page"
        francs: -1800
        reponse: "Elle range les billets dans la boîte à biscuits, gomme ton nom et souffle sur la page. « Voilà. Vous n'existez plus. Chez moi, c'est un compliment. »"
        effets: {clear: [dette_coulomb], relation: {coulomb: 1}}
      - label: "Encore un mois"
        reponse: "Elle referme le cahier sans un mot. Le lendemain, ta page a changé de cahier : elle est dans le rouge, celui qu'elle ne relit jamais."
        effets: {clear: [dette_coulomb], relation: {coulomb: -2}}

  - id: vi.qr.coulomb_cahier
    titre: "Le cahier bleu"
    lieu: epicerie
    tranches: [matin]
    qui: coulomb
    si: "relation.coulomb >= 2 && annee <= 2001"
    texte: "Ginette, blanche comme la farine, devant le comptoir ouvert : on a volé le cahier bleu dans la nuit. Rien d'autre. Ni la caisse, ni les bières. Le cahier de la cité."
    choix:
      - label: "Refaites-le de mémoire"
        reponse: "Elle le recopie toute la nuit sur un cahier neuf. Au matin, il manque onze pages : celles des familles qui n'auraient jamais pu payer. Elle dit qu'elle a oublié."
        effets: {jauges: {tribunes: 1}, relation: {coulomb: 1}}
      - label: "Portez plainte"
        reponse: "Le gendarme écrit « cahier d'écolier, bleu » et lève les yeux. Ginette reprend son sac sans rien dire. Il rit encore quand vous sortez."
        effets: {jauges: {direction: 1}, relation: {coulomb: -1}}

  - id: vi.qr.coulomb_odile
    titre: "Le jeudi d'Odile"
    roles: [joueur]
    lieu: epicerie
    tranches: [matin]
    jours: [jeu]
    qui: coulomb
    si: "flag(histoire_h3) && relation.coulomb >= 2"
    texte: "Jeudi, onze heures. Ginette te retient au comptoir : « Ta mère va entrer pour sa page. Reste. Ou va-t'en. Je ne sais pas ce qui lui ferait le plus de bien. »"
    choix:
      - label: "Je reste"
        reponse: "Odile entre, te voit, s'arrête. Puis elle pose ses pièces une à une sur le comptoir, sans se presser, devant toi. En sortant, elle te prend le bras."
        effets: {relation: {odile: 1}}
      - label: "Je sors par la réserve"
        reponse: "Tu sors entre les cartons de lait. Par la vitrine, tu vois Odile payer, puis regarder la porte longtemps, comme si quelqu'un venait d'en sortir."
        effets: {relation: {coulomb: 1}}

  - id: vi.qr.coulomb_vieilles_pages
    titre: "Les vieilles pages"
    lieu: epicerie
    qui: coulomb
    si: "relation.coulomb >= 1 && annee >= 2002 && annee <= 2003"
    texte: "Ginette vend à son petit-fils. Sur le comptoir, le cahier bleu et le rouge. « Yacine veut tout garder. Moi, je brûlerais les vieilles pages. Vous, vous feriez quoi ? »"
    choix:
      - label: "Brûlez-les"
        reponse: "Elle les brûle dans la cour, une à une, en lisant les noms à voix basse. Le lendemain, la cité respire. Yacine, lui, la regarde faire sans comprendre."
        effets: {jauges: {tribunes: 2}, relation: {coulomb: 1, kessar: -1}}
      - label: "Laissez-lui tout"
        reponse: "Elle lui tend les deux cahiers sans un mot. Yacine les range sous le comptoir, à la même place. « Je ne les relirai pas. » Il les connaît déjà par cœur."
        effets: {relation: {kessar: 1}}

  - id: vi.qr.kessar_carton
    titre: "Le carton pas réclamé"
    lieu: epicerie
    qui: kessar
    si: "flag(tuyau_kessar_cartons) && role != selectionneur"
    texte: "Yacine pose un carton sur le comptoir : le joueur n'est jamais venu le chercher. Délai dépassé. « Je le renvoie à l'agence, ou vous le lui portez ? »"
    choix:
      - label: "Je le lui porte"
        reponse: "Il ouvre le carton devant toi : un maillot d'un autre club, son nom floqué dans le dos. « Je n'ai rien signé. » Il le dit trop vite. Le club, prévenu, ferme la porte à temps."
        effets: {jauges: {vestiaire: -1, direction: 2}}
      - label: "Renvoyez-le"
        reponse: "Le carton repart à Valdorne. Le joueur ne demande jamais où est son colis. Au match suivant, il court comme quelqu'un qui n'a pas reçu de nouvelles."
        effets: {jauges: {vestiaire: 1}}

  - id: vi.qr.kessar_vitrine
    titre: "La vitrine du lundi"
    lieu: epicerie
    tranches: [matin]
    jours: [lun]
    qui: kessar
    si: "relation.kessar >= 2 && annee >= 2010"
    texte: "Lundi, la vitrine de l'épicerie est étoilée d'un coup de pied. Sur le rideau, à la bombe, le nom du club, barré. Yacine balaie les éclats. « C'est vous qu'ils visaient. »"
    choix:
      - label: "Je paie la vitrine"
        francs: -900
        reponse: "Yacine refuse deux fois, puis accepte. La vitre neuve arrive mercredi. L'inscription, il la laisse une semaine sur le rideau, « pour qu'ils voient qu'on s'en moque »."
        effets: {jauges: {tribunes: 1}, relation: {kessar: 1}}
      - label: "Je porte plainte avec lui"
        reponse: "Au commissariat, on prend sa plainte, puis la tienne, puis on vous offre un café. Les auteurs ne seront jamais trouvés. Le quartier, lui, sait leurs prénoms."
        effets: {jauges: {direction: 1, tribunes: -1}}

  # ───────────────────────────────────────────────────────────── la boulangerie
  - id: vi.qr.pichon_mardi
    titre: "Le mardi du président"
    roles: [entraineur]
    lieu: cafe_mairie
    tranches: [midi]
    jours: [mar]
    si: "flag(tuyau_pichon_mardi) && annee <= 2007"
    texte: "Café de la Mairie, mardi, midi. Au fond, le président déjeune avec un homme en blazer qui prend des notes sur la nappe. Il te voit dans la vitrine. Il pose sa fourchette."
    choix:
      - label: "J'entre et je m'assois"
        reponse: "Tu t'assois à leur table sans qu'on t'invite. L'homme en blazer range son stylo, paie son café et s'en va. Le président finit son assiette en parlant de la pluie."
        effets: {jauges: {direction: 2}}
      - label: "Je passe mon chemin"
        reponse: "Le lendemain, L'Écho parle d'un « entraîneur expérimenté vu à Aubérive ». Le président ne dément pas. Il ne confirme pas non plus."
        effets: {jauges: {direction: -2}}

  - id: vi.qr.pichon_dette
    titre: "Le petit-fils de Lucette"
    lieu: boulangerie_residentiel
    qui: pichon_lucette
    si: "flag(dette_pichon_lucette)"
    texte: "Lucette te tend ta baguette et une photo : un gamin de douze ans, un ballon sous le bras. « Mon petit-fils. Les essais du centre, c'est samedi. Un mot de vous, et il les passe. »"
    choix:
      - label: "Je dirai un mot"
        reponse: "Le gamin passe les essais. Il n'est pas le meilleur. Il est pris. Dans le vestiaire des jeunes, tout le monde sait pourquoi, et lui aussi."
        effets: {clear: [dette_pichon_lucette], jauges: {vestiaire: -1}, relation: {pichon_lucette: 1}}
      - label: "Il passera comme les autres"
        reponse: "Il passe comme les autres, et il n'est pas pris. Lucette te sert le lundi suivant sans te regarder. La monnaie, elle la pose sur le comptoir."
        effets: {clear: [dette_pichon_lucette], relation: {pichon_lucette: -2}}

  - id: vi.qr.pichon_four
    titre: "Quatre heures au fournil"
    lieu: boulangerie_residentiel
    tranches: [matin]
    qui: pichon_lucette
    si: "relation.pichon_lucette >= 2 && annee <= 2007"
    texte: "Pichon s'est brûlé le bras au four ; il est à l'hôpital de Valdorne. Quatre heures du matin : Lucette est seule au fournil, la pelle trop lourde. « Vous savez tenir une porte ? »"
    choix:
      - label: "Je tiens la porte"
        reponse: "Tu tiens la porte du four pendant qu'elle enfourne, jusqu'à six heures. Les mains te brûlent à travers les gants. À sept heures, la file a son pain, et ne sait rien."
        effets: {jauges: {tribunes: 1}, relation: {pichon_lucette: 1}}
      - label: "Je paie un remplaçant"
        francs: -300
        reponse: "Un étudiant tient la porte toute la semaine, se brûle aussi, et ne revient pas le vendredi. Lucette te remercie poliment, comme on remercie une cliente."

  - id: vi.qr.pichon_vendeuse
    titre: "La vendeuse"
    lieu: boulangerie_residentiel
    qui: pichon_lucette
    si: "relation.pichon_lucette >= 1 && annee >= 1995 && annee <= 1997"
    texte: "Lucette cherche une vendeuse. Deux candidates : une jeune qui rend la monnaie à toute vitesse, et Marie-Jo, qui la compte deux fois et connaît le prénom de chaque gamin. « Laquelle ? »"
    choix:
      - label: "Marie-Jo"
        reponse: "Lucette embauche Marie-Jo le lundi. Elle compte la monnaie deux fois, la file râle, puis s'y fait. Le samedi, les gamins lui racontent leurs matchs."
        effets: {relation: {mariejo: 1}}
      - label: "Celle qui va vite"
        reponse: "La jeune tient trois mois et part à l'hypermarché. Lucette prend Marie-Jo en septembre. Marie-Jo sait qu'elle n'était pas le premier choix, et par qui."
        effets: {relation: {mariejo: -1}}

  - id: vi.qr.pichon_premier_client
    titre: "Le premier client"
    lieu: boulangerie_residentiel
    qui: pichon_lucette
    si: "relation.pichon_lucette >= 2 && annee >= 2006 && annee <= 2007"
    texte: "Lucette range sa blouse : Marie-Jo reprend la boutique lundi. « Il faut un premier client, le premier jour, à six heures. Quelqu'un qui porte chance. Vous ? »"
    choix:
      - label: "Je serai là à six heures"
        reponse: "Lundi, six heures, il n'y a que toi devant le rideau. Marie-Jo te sert la première baguette de sa vie de patronne, et se trompe dans la monnaie, dans le bon sens."
        effets: {relation: {mariejo: 1, pichon_lucette: 1}}
      - label: "Je dormirai"
        reponse: "Le premier client, ce lundi-là, est le facteur. Lucette dit que ça porte chance aussi, les facteurs. Elle ne le pense pas."
        effets: {relation: {pichon_lucette: -1}}

  - id: vi.qr.mariejo_vingtieme
    titre: "La vingtième minute"
    lieu: stade
    tranches: [midi]
    jours: [sam]
    qui: fan
    si: "flag(tuyau_mariejo_sifflets) && role != selectionneur && annee <= 2034"
    texte: "Samedi, devant la buvette, les trois garçons de la boulangerie comptent leurs sifflets. Le plus grand te voit : « Vingt minutes, c'est ce qu'a duré notre dernière réunion avec le club. »"
    choix:
      - label: "Je vous donne une heure"
        reponse: "Tu leur donnes rendez-vous lundi, une heure entière, au club-house. À la vingtième minute, ils sifflent quand même. Une fois, pour la forme, et ils rangent les sifflets."
        effets: {jauges: {tribunes: 2}}
      - label: "Sifflez, c'est votre droit"
        reponse: "À la vingtième minute, la Nord siffle jusqu'à la mi-temps. Les joueurs regardent le banc. L'Écho titre sur la vingtième minute, pas sur le score."
        effets: {jauges: {tribunes: -1, vestiaire: -1}}

  - id: vi.qr.mariejo_four_neuf
    titre: "Le four neuf"
    lieu: boulangerie_residentiel
    qui: mariejo
    si: "relation.mariejo >= 2 && annee >= 2024 && annee <= 2027 && !flag(histoire_h9)"
    texte: "Marie-Jo a un dossier de la Banque Aubérivoise sous le bras. « Le four neuf. Kévin signe avec moi : il reprendra la boutique. Il faut un témoin qui ne soit pas de la famille. Vous ? »"
    choix:
      - label: "Je signe comme témoin"
        reponse: "À la banque, tu signes en dessous de Kévin, qui signe en dessous de sa mère. Il a des mains d'électricien et un rire d'enfant. « Dans deux ans, je l'ai payé. »"
        effets: {relation: {mariejo: 1}}
      - label: "Je ne signe jamais rien"
        reponse: "Elle prend le facteur pour témoin. Le four arrive en mars. Marie-Jo te sert la première fournée comme à tout le monde, ni plus cuite, ni moins."
        effets: {relation: {mariejo: -1}}

  - id: vi.qr.mariejo_car
    titre: "Le car de Kévin"
    lieu: rue
    tranches: [soir]
    qui: mariejo
    si: "relation.mariejo >= 2 && annee >= 2026 && annee <= 2027 && !flag(histoire_h9)"
    texte: "Marie-Jo t'arrête dans la rue, un sac de voyage à la main. « Kévin part ce soir pour le chantier, là-bas. Ma camionnette ne démarre plus. Vous l'emmèneriez à la gare routière ? »"
    choix:
      - label: "Je l'emmène"
        reponse: "Dans la voiture, Kévin parle du salaire, du soleil, du four. Sur le quai, il te serre la main comme un homme. Marie-Jo ne pleure pas. Elle attend que le car ait tourné."
        effets: {relation: {mariejo: 1}}
      - label: "Je ne peux pas ce soir"
        reponse: "Il part en taxi. Marie-Jo paie le taxi en pièces, sur le trottoir. Le lendemain, elle te sert sans te demander le score."
        effets: {relation: {mariejo: -1}}

  - id: vi.qr.guerand_mardi
    titre: "Le mardi de Madame Marçais"
    lieu: boulangerie_residentiel
    tranches: [matin]
    jours: [mar]
    qui: guerand
    si: "relation.guerand >= 2 && annee >= 2035"
    texte: "Mardi. Madame Marçais goûte une baguette au comptoir, sans rien dire, comme chaque semaine. Malo te glisse à l'oreille : « Dites-lui quelque chose. Moi, je n'ose pas. »"
    choix:
      - label: "Je dis qu'elle est bonne"
        reponse: "Marie-Jo te regarde, puis regarde Malo. « Elle est bonne. Trop cuite, mais bonne. » Malo ne dort pas de la nuit, de bonheur, et la fournée du lendemain est trop cuite."
        effets: {relation: {guerand: 1, mariejo: 1}}
      - label: "Je me tais"
        reponse: "Elle repart sans un mot, comme chaque mardi. Malo reste debout derrière la caisse jusqu'à midi, à regarder la porte."
        effets: {relation: {guerand: -1}}

  # ───────────────────────────────────────────────────────────────── le garage
  - id: vi.qr.quintane_parechoc
    titre: "Ce n'était pas un poteau"
    lieu: rue
    tranches: [soir]
    qui: passant
    si: "flag(tuyau_quintane_parechoc) && role != selectionneur && annee <= 2018"
    texte: "Le soir, un joueur du club t'attend devant chez toi, les mains dans les poches. « Quintane vous a parlé, je le vois à votre tête. C'était un chien. Je vous jure que c'était un chien. »"
    choix:
      - label: "Je te crois"
        reponse: "Il respire. Le samedi, il joue comme quelqu'un qui doit quelque chose à quelqu'un. Tu ne cherches pas à savoir quel chien, ni sur quelle route."
        effets: {jauges: {vestiaire: 2}}
      - label: "Va le dire aux gendarmes"
        reponse: "Il y va le lendemain, avec un avocat du club. On parle d'un chien, d'une route mouillée. Il ne te parle plus. Le club te remercie, sans dire de quoi."
        effets: {jauges: {vestiaire: -2, direction: 2}}

  - id: vi.qr.quintane_dette
    titre: "Le fils de Quintane"
    lieu: garage
    qui: quintane
    si: "flag(dette_quintane)"
    texte: "Quintane ferme la porte du bureau. « Mon fils s'est fait prendre avec des pièces volées dans sa camionnette. Le juge veut des témoins de moralité. Des gens qu'on connaît. »"
    choix:
      - label: "Je témoignerai"
        reponse: "Au tribunal de Valdorne, tu dis ce que tu sais du père, et rien du fils. Le juge écoute. L'Écho met ta photo en page trois, à côté de celle du garage."
        effets: {clear: [dette_quintane], jauges: {direction: -2}, relation: {quintane: 1}}
      - label: "Je ne peux pas"
        reponse: "Il hoche la tête et rouvre la porte. Le fils prend six mois avec sursis. Ta voiture attend désormais dans la cour, et le café ne t'est plus proposé."
        effets: {clear: [dette_quintane], relation: {quintane: -2}}

  - id: vi.qr.quintane_bache
    titre: "La voiture sous la bâche"
    lieu: garage
    qui: quintane
    si: "relation.quintane >= 2 && annee <= 2018"
    texte: "Quintane soulève la bâche jusqu'au pare-brise : la voiture neuve, achetée pour le jour où l'on serait champions. « Je la démarre une fois par mois, pour la batterie. Ce mois-ci, c'est vous. »"
    choix:
      - label: "Je la démarre"
        reponse: "Elle démarre au premier tour. Quintane écoute, les yeux fermés, puis coupe le contact. « Elle attendra. Elle a l'habitude. » Il rabat la bâche, coin par coin."
        effets: {relation: {quintane: 1}}
      - label: "Gardez-la pour le titre"
        reponse: "Il remet la bâche sans l'avoir démarrée. « Vous avez raison. » Le soir, au Corner, il raconte que tu crois au titre. Le Corner rit, puis le répète."
        effets: {jauges: {tribunes: 1}}

  - id: vi.qr.quintane_1966
    titre: "La facture de 1966"
    lieu: garage
    qui: quintane
    si: "relation.quintane >= 2 && annee <= 2018"
    texte: "Quintane sort de son bureau une facture jaunie : le car de la Coupe, 1966, signé par son père, jamais remboursé par le club. « On a vendu la maison. Je voudrais qu'elle soit accrochée quelque part. »"
    choix:
      - label: "Au club-house, au mur"
        reponse: "Tu l'accroches au club-house, sous verre, entre deux fanions. Les anciens viennent la lire. Le club, gêné, envoie une lettre d'excuses, avec des décennies de retard."
        effets: {jauges: {tribunes: 2, direction: -1}, relation: {quintane: 1}}
      - label: "C'est votre histoire"
        reponse: "Il la replie en quatre et la range dans le tiroir de l'établi, sous les clés de douze. « Vous avez raison. Personne ne la lira. » Il ne t'en reparle jamais."
        effets: {relation: {quintane: -1}}

  - id: vi.qr.quintane_carnet
    titre: "Le carnet des voitures"
    lieu: garage
    qui: quintane
    si: "relation.quintane >= 2 && annee >= 2017 && annee <= 2018"
    texte: "Quintane prend sa retraite. Il te tend un carnet noir : toutes les voitures de la ville depuis 1961, leurs pannes, leurs propriétaires, leurs secrets. « Pour vous, ou pour Jérémy ? »"
    choix:
      - label: "Pour moi"
        reponse: "Tu l'emportes. Le soir, tu lis la voiture de chaque président depuis 1961. Jérémy, lui, ne te dit plus bonjour pendant un mois."
        effets: {jauges: {direction: 1}, relation: {quintane: 1, saulnier: -1}}
      - label: "Pour Jérémy"
        reponse: "Jérémy le prend à deux mains, comme un missel, et le range dans le tiroir de l'établi. « Je ne l'ouvrirai qu'en cas de panne. » Il l'ouvre le soir même."
        effets: {relation: {saulnier: 1}}

  - id: vi.qr.saulnier_boitier
    titre: "Trois nuits à Valdorne"
    lieu: garage
    qui: saulnier
    si: "flag(tuyau_saulnier_boitier) && role != selectionneur"
    texte: "Jérémy pose sur le comptoir une feuille imprimée : trois nuits, la même adresse, la même heure et quart. La voiture du staff. « Je l'imprime une fois. Après, je l'efface. »"
    choix:
      - label: "Je la garde"
        reponse: "Tu la poses lundi sur le bureau de celui qui conduisait. Il pâlit, puis parle, beaucoup. Le club a fermé une fuite ; le vestiaire a perdu un ami."
        effets: {jauges: {direction: 2, vestiaire: -1}}
      - label: "Effacez-la"
        reponse: "Jérémy l'efface devant toi. Tu ne sauras jamais qui. Ton staff ne saura jamais que tu as failli savoir. C'est peut-être mieux comme ça."
        effets: {jauges: {vestiaire: 1}}

  - id: vi.qr.saulnier_dette
    titre: "Les voitures du club"
    lieu: garage
    qui: saulnier
    si: "flag(dette_saulnier)"
    texte: "Jérémy a un dossier sous le bras. « Les voitures du club vont chez le concessionnaire de Valdorne. Je voudrais l'entretien, juste l'entretien. Un mot de vous suffirait. »"
    choix:
      - label: "Je dirai le mot"
        reponse: "Le club change de garage. Le concessionnaire de Valdorne appelle pour se plaindre. Les voitures du club reviennent propres, avec un café dans le porte-gobelet."
        effets: {clear: [dette_saulnier], jauges: {direction: -1}, relation: {saulnier: 1}}
      - label: "Ce n'est pas mon rôle"
        reponse: "Il range le dossier. « Je comprends. » Il comprend. La fois suivante, ta voiture attend trois semaines, et la valise te facture tout."
        effets: {clear: [dette_saulnier], relation: {saulnier: -2}}

  - id: vi.qr.saulnier_samedi
    titre: "Samedi, cinq heures"
    lieu: garage
    tranches: [aprem]
    jours: [sam]
    qui: saulnier
    si: "relation.saulnier >= 2 && annee >= 2019 && annee <= 2030"
    texte: "Samedi, cinq heures : Quintane n'est pas venu écouter les moteurs. Jérémy tourne dans la cour, les clés de la camionnette à la main. « Vous venez avec moi chez lui ? »"
    choix:
      - label: "Je viens"
        reponse: "Quintane est dans son jardin, penché sur une tondeuse qui cale. « Elle cale à droite. » Il n'était pas venu, c'est tout. Jérémy rit pour la première fois de la journée."
        effets: {relation: {saulnier: 1, quintane: 1}}
      - label: "Allez-y sans moi"
        reponse: "Jérémy y va seul. Le lundi, il ne raconte rien. Le samedi suivant, Quintane est là, à cinq heures, et ne te dit pas bonjour."
        effets: {relation: {saulnier: -1}}

  # ──────────────────────────────────────────────────────────────── la laverie
  - id: vi.qr.delmotte_rose
    titre: "Le maillot du 6"
    lieu: laverie
    qui: delmotte
    si: "flag(tuyau_delmotte_rose) && role != selectionneur && annee <= 2012"
    texte: "Gisèle ouvre la 4 devant toi et tend un maillot au bout des doigts : le 6, l'encolure déchirée, une tache brune dans le dos. « Il n'est pas tombé. On l'a tenu. »"
    choix:
      - label: "Je parle au 6 en privé"
        reponse: "Le 6 parle longtemps, les yeux sur ses chaussures : deux noms, une dette de cartes, un vestiaire coupé en deux. Tu n'en dis rien à personne ; les deux noms le savent."
        effets: {jauges: {vestiaire: 2}}
      - label: "Je ne veux pas savoir"
        reponse: "Gisèle replie le maillot et le remet dans la machine. Trois semaines plus tard, l'eau de la 4 est encore rose. Le 6 joue moins bien, et seul."
        effets: {jauges: {vestiaire: -2}, relation: {delmotte: -1}}

  - id: vi.qr.delmotte_dette
    titre: "Le fils de Gisèle"
    lieu: laverie
    qui: delmotte
    si: "flag(dette_delmotte)"
    texte: "Gisèle plie tes chemises plus lentement que d'habitude. « Mon fils sort de Valdorne le mois prochain. Il lui faut un travail pour la conditionnelle. Vous connaissez du monde. »"
    choix:
      - label: "Je lui trouve un travail"
        reponse: "Il entre au stade de la Rive comme aide-jardinier. Il tond en lignes parfaites et ne parle à personne. On te demande qui c'est ; tu dis : le fils de quelqu'un."
        effets: {clear: [dette_delmotte], jauges: {direction: -1}, relation: {delmotte: 1}}
      - label: "Je ne peux rien pour lui"
        reponse: "Elle hoche la tête et termine le pliage. Le lendemain, tes chemises sont pliées comme celles de n'importe qui. Elle ne repasse plus les tiennes."
        effets: {clear: [dette_delmotte], relation: {delmotte: -2}}

  - id: vi.qr.delmotte_parloir
    titre: "Le linge du vendredi"
    lieu: laverie
    tranches: [matin]
    jours: [ven]
    qui: delmotte
    si: "relation.delmotte >= 2 && annee <= 2012"
    texte: "Vendredi. Gisèle a la jambe dans le plâtre et un sac de linge propre sur les genoux. « La maison d'arrêt, à Valdorne. Le parloir est à onze heures. Je ne peux pas y aller. »"
    choix:
      - label: "J'y vais"
        reponse: "Au parloir, son fils prend le sac sans te regarder, puis te regarde. « C'est elle qui vous envoie ? » Tu dis oui. « Dites-lui que c'est plié comme il faut. »"
        effets: {relation: {delmotte: 1}}
      - label: "Je ne peux pas"
        reponse: "Elle y va en taxi, la jambe tendue sur la banquette. Le lundi, elle plie tes chemises sans un mot, et sans te demander le score."
        effets: {relation: {delmotte: -1}}

  - id: vi.qr.montel_minuit
    titre: "Le joueur de minuit"
    lieu: laverie
    tranches: [soir]
    qui: montel
    si: "flag(tuyau_montel_nuit) && role != selectionneur && annee >= 2013"
    texte: "Minuit moins le quart. Sur la chaise en plastique, un joueur du club regarde tourner son linge sans le voir. Gabriel te fait un signe de tête : c'est lui. Il ne t'a pas entendu entrer."
    choix:
      - label: "Je m'assois à côté"
        reponse: "Vous regardez tourner la machine jusqu'au bout. Au moment de plier, il parle : sa mère, l'hôpital, l'argent. Tu écoutes. Gabriel éteint un néon, puis un autre."
        effets: {jauges: {vestiaire: 2}}
      - label: "Va dormir"
        reponse: "Il se lève d'un coup, ramasse son linge humide et sort sans un mot. Le samedi, il joue les yeux rouges. Gabriel te rend la monnaie en jetons, toute la semaine."
        effets: {jauges: {vestiaire: -1}, relation: {montel: -1}}

  - id: vi.qr.montel_rachat
    titre: "La laverie à vendre"
    lieu: laverie
    tranches: [aprem]
    qui: montel
    si: "relation.montel >= 2 && annee >= 2020"
    texte: "Gabriel n'est que le gérant. Le propriétaire vend à une chaîne qui veut des machines sans personne autour. « Il me manque de quoi racheter. Pas tout. Une part. »"
    choix:
      - label: "Je prends une part"
        francs: -6000
        reponse: "Chez le notaire, tu signes pour un quart de laverie. Gabriel garde la clé, la 4 et la chaise en plastique. Chaque année, une lettre : « Rien à signaler. Merci. »"
        effets: {relation: {montel: 2}}
      - label: "Je n'ai pas les moyens"
        reponse: "La chaîne rachète. Gabriel reste, gérant salarié, avec un écran à la place du monnayeur. Il le débranche la nuit. En haut lieu, personne ne le sait."
        effets: {relation: {montel: -1}}

  # ───────────────────────────────────────────────────────────────── le marché
  - id: vi.qr.ducros_champ
    titre: "Le champ derrière la Tréfilerie"
    lieu: marche
    tranches: [matin]
    qui: ducros_achille
    si: "flag(tuyau_ducros_parking) && annee <= 2011"
    texte: "Achille te tend une lettre de l'agence : une offre pour son champ, « en vue d'un aménagement lié au stade ». « Si c'est le club, je veux le savoir par vous. Pas par le notaire. »"
    choix:
      - label: "Je me renseigne"
        reponse: "Tu poses la question au club. On te répond trop vite que non. Tu le dis à Achille, qui refuse l'offre. Au club, quelqu'un a noté que tu posais des questions."
        effets: {jauges: {direction: -1}, relation: {ducros_achille: 1}}
      - label: "Vendez, c'est un bon prix"
        reponse: "Il vend en mars. Un parking pousse en octobre, vide toute la semaine. Le dimanche, Achille pèse au gramme près et ne te regarde plus en rendant la monnaie."
        effets: {jauges: {direction: 1}, relation: {ducros_achille: -2}}

  - id: vi.qr.ducros_hypermarche
    titre: "Le dimanche de l'hypermarché"
    roles: [entraineur, joueur, president, ds]
    lieu: marche
    tranches: [matin]
    qui: ducros_achille
    si: "relation.ducros_achille >= 2 && annee >= 1996 && annee <= 1999"
    texte: "L'hypermarché ouvre dimanche, ballons et maillot du club en promotion : il est sponsor. Achille : « Ce jour-là, venez au marché, avec des gens du club. Qu'on vous voie ici. »"
    choix:
      - label: "Je viens avec du monde"
        reponse: "Dimanche, tu remplis des cabas au marché avec trois joueurs. Le photographe de L'Écho est là. Le sponsor appelle le club le lundi, pas content du tout."
        effets: {jauges: {tribunes: 2, direction: -1}}
      - label: "Je ne peux pas"
        reponse: "Dimanche, le parking de l'hypermarché déborde. Au marché, Achille vend la moitié de ses tomates. La semaine suivante, pas de pomme en plus."
        effets: {relation: {ducros_achille: -1}}

  - id: vi.qr.ducros_laure_jeudi
    titre: "Le jeudi sans lumière"
    lieu: terrain
    tranches: [soir]
    jours: [jeu]
    qui: ducros_laure
    si: "flag(tuyau_ducros_laure_jeudi) && annee <= 2037"
    texte: "Jeudi soir, le terrain annexe sans lumière. Une dizaine de femmes jouent à la lampe frontale, Laure en arrière gauche. Elle te voit au portail. « Vous allez le dire ? »"
    choix:
      - label: "J'allume les projecteurs"
        reponse: "Tu trouves l'interrupteur dans le local. Les projecteurs s'allument d'un coup ; le match s'arrête, puis reprend, plus fort. Le club veut savoir qui paie l'électricité."
        effets: {jauges: {tribunes: 2, direction: -1}, relation: {ducros_laure: 1}}
      - label: "Je dois le signaler"
        reponse: "Le portail a un cadenas neuf le jeudi suivant. Le dimanche, Laure te pèse tes poireaux au gramme près, et te rend la monnaie sans un mot."
        effets: {jauges: {direction: 1}, relation: {ducros_laure: -2}}

  - id: vi.qr.dartigue_maire
    titre: "Le maire au marché"
    lieu: marche
    tranches: [matin]
    qui: dartigue
    si: "relation.dartigue >= 2 && annee >= 2038"
    texte: "Le maire vient au marché mercredi, avec un photographe. Côme te demande de tenir un étal vide une heure, derrière des cageots retournés, « pour qu'on ait l'air d'être quatre »."
    choix:
      - label: "Je tiens l'étal"
        reponse: "Sur la photo, la place a l'air vivante. Le maire te serre la main devant ton étal vide. Le lendemain, deux maraîchers de la vallée demandent à Côme s'il reste de la place."
        effets: {jauges: {tribunes: 1}, relation: {dartigue: 1}}
      - label: "Je ne joue pas la comédie"
        reponse: "La photo montre trois étals et des pavés. Le maire parle de « recomposition ». Côme replie ses tréteaux à onze heures, sans te dire au revoir."
        effets: {relation: {dartigue: -1}}

  # ─────────────────────────────────────────────────────────────── le fleuriste
  - id: vi.qr.huguette_pere
    titre: "Les fleurs du père"
    lieu: fleuriste
    qui: huguette
    si: "flag(tuyau_huguette_pere) && role != selectionneur && annee <= 2016"
    texte: "Madame Huguette te montre le cahier des commandes : une gerbe aux couleurs du club, payée d'avance par le père de ton capitaine, pour lui-même. « Il a dit : pas avant la fin de la saison. »"
    choix:
      - label: "Je préviens le capitaine"
        reponse: "Le capitaine part le soir même pour l'hôpital. Il manque le match du samedi. Il revient le lundi, et te serre la main plus longtemps que d'habitude."
        effets: {jauges: {vestiaire: 2}, relation: {huguette: 1}}
      - label: "Ce n'est pas à moi"
        reponse: "La gerbe est livrée en avril. Au funérarium, le capitaine apprend que tu savais. Il ne dit rien. Il ne dit plus grand-chose, après."
        effets: {jauges: {vestiaire: -2}}

  - id: vi.qr.huguette_cahiers
    titre: "Les cahiers d'Huguette"
    lieu: fleuriste
    qui: huguette
    si: "relation.huguette >= 2 && annee >= 2015 && annee <= 2016"
    texte: "Madame Huguette vend les Immortelles à Corentin, son livreur. Elle hésite pour les cahiers de commandes : des décennies de mariages et de deuils. « Je les lui laisse, ou je les brûle ? »"
    choix:
      - label: "Laissez-les à Corentin"
        reponse: "Corentin les range sous le comptoir. Le premier 14 mai, il ouvre le cahier de 1985 à la bonne page, sans chercher. Il te fait un signe de tête."
        effets: {relation: {mevellec: 1}}
      - label: "Gardez-les pour vous"
        reponse: "Elle les emporte dans un carton à chaussures. Corentin recommence sur un cahier neuf. Il dit que c'est mieux. Il cherche quand même des adresses que plus personne ne sait."
        effets: {relation: {huguette: 1}}

  - id: vi.qr.mevellec_quatorze_mai
    titre: "Le 14 mai"
    lieu: cimetiere
    tranches: [matin]
    qui: mevellec
    si: "relation.mevellec >= 2 && annee >= 2017 && phase == sprint"
    texte: "Le 14 mai, Corentin t'attend à la grille du cimetière avec un pot de chrysanthèmes. « Le carré ancien, Monsieur Bertin. Plus personne ne paie depuis trente ans. Vous portez ? »"
    choix:
      - label: "Je porte le pot"
        reponse: "Vous montez au carré ancien. Il pose le pot, l'arrose avec une bouteille d'eau, retire une feuille morte. Il ne dit pas qui c'était. Tu ne demandes pas."
        effets: {relation: {mevellec: 1}}
      - label: "Pas cette année"
        reponse: "Il monte seul, sans se retourner. La semaine suivante, ta commande arrive en retard, sans le petit mot habituel."
        effets: {relation: {mevellec: -1}}

  # ──────────────────────────────────────────────────────────────── le tailleur
  - id: vi.qr.brunel_auguste_mains
    titre: "Les mains d'Auguste"
    lieu: tailleur
    qui: brunel_auguste
    si: "relation.brunel_auguste >= 2 && annee >= 2000 && annee <= 2004"
    texte: "Auguste n'arrive plus à fermer les ciseaux. Il te tend un numéro de téléphone, dans la capitale. « Mon fils. Dites-lui de revenir. Moi, je ne saurai pas le lui demander. »"
    choix:
      - label: "J'appelle son fils"
        reponse: "Clément ne dit rien pendant longtemps, au téléphone. Puis : « Je viens samedi. » Il vient samedi, avec une valise, et ne repart pas."
        effets: {relation: {brunel_auguste: 1, brunel_clement: 1}}
      - label: "C'est à vous de le faire"
        reponse: "Auguste range le numéro dans le tiroir des boutons. Il appellera lui-même, trois mois plus tard, quand il ne pourra plus tenir l'aiguille."
        effets: {relation: {brunel_auguste: -1}}

  - id: vi.qr.brunel_auguste_rideau
    titre: "Derrière le rideau"
    roles: [entraineur, joueur, ds]
    lieu: tailleur
    qui: brunel_auguste
    si: "relation.brunel_auguste >= 2 && annee <= 2004"
    texte: "Auguste te fait signe d'attendre dans l'arrière-boutique : le président est en cabine. À travers le rideau, tu l'entends parler de toi, les bras levés. Auguste te voit dans le miroir."
    choix:
      - label: "J'écoute jusqu'au bout"
        reponse: "Tu entends tout : ce qu'il pense de toi, de ton salaire, de ta fin. Auguste continue d'épingler sans te regarder. Il ne te refera jamais ce cadeau."
        effets: {jauges: {direction: 2}, relation: {brunel_auguste: -1}}
      - label: "Je sors par la cour"
        reponse: "Tu sors par la cour, entre les poubelles et les cartons de patrons. Le lendemain, Auguste prend tes mesures en silence, puis dit : « Merci. »"
        effets: {relation: {brunel_auguste: 1}}

  - id: vi.qr.brunel_clement_dette
    titre: "Le logo sur le cœur"
    lieu: tailleur
    qui: brunel_clement
    si: "flag(dette_brunel_clement)"
    texte: "Clément te montre deux vestes du club : l'une de chez lui, l'autre du sponsor, le logo brodé sur la poche du cœur. « Ils changent de tailleur l'an prochain. Sauf si quelqu'un dit non. »"
    choix:
      - label: "Je dirai non"
        reponse: "Tu dis non en réunion, trois fois. Les costumes restent chez Brunel, sans logo sur le cœur. Le sponsor met son nom ailleurs, plus gros, et te le fait payer."
        effets: {clear: [dette_brunel_clement], jauges: {direction: -2}, relation: {brunel_clement: 1}}
      - label: "Ce n'est pas mon combat"
        reponse: "Le club change de tailleur. Les costumes arrivent sous plastique, le logo sur le cœur. Clément ne prend plus tes mesures : l'apprenti s'en charge."
        effets: {clear: [dette_brunel_clement], relation: {brunel_clement: -2}}

  - id: vi.qr.brunel_clement_miroir
    titre: "Le dernier costume"
    roles: [ds]
    lieu: tailleur
    qui: brunel_clement
    si: "flag(histoire_h8) && !flag(h8_vaubourg_mort) && relation.brunel_clement >= 2"
    texte: "Monsieur Vaubourg, sur sa canne, commande un costume sombre, prêt pour une date qu'il a écrite sur un papier plié. Clément te tend le miroir : « Tenez-le. Il ne veut pas que ce soit moi. »"
    choix:
      - label: "Je tiens le miroir"
        reponse: "Vaubourg se regarde longtemps dans le miroir que tu tiens. « Vous me trouvez comment ? » Tu dis : droit. Il sourit, pour la première fois depuis longtemps."
        effets: {relation: {aulard: 1, brunel_clement: 1}}
      - label: "Je le pose et je sors"
        reponse: "Tu poses le miroir contre le mur et tu sors. Par la vitrine, tu vois Vaubourg se regarder seul, de très près, comme on relit une date."
        effets: {relation: {brunel_clement: -1}}

  - id: vi.qr.brunel_gaspard_vitrine
    titre: "Le ruban en vitrine"
    lieu: tailleur
    qui: brunel_gaspard
    si: "relation.brunel_gaspard >= 2 && annee >= 2035"
    texte: "Gaspard veut prendre tes mesures au ruban, dans la vitrine, face à la rue. « Les gens ne croient plus qu'on peut mesurer quelqu'un sans machine. Montrez-leur. Une heure. »"
    choix:
      - label: "Une heure en vitrine"
        reponse: "Une heure debout dans la vitrine, les bras levés. Des gamins s'arrêtent, puis des parents. Le lendemain, Gaspard a six rendez-vous, et le club une photo."
        effets: {jauges: {tribunes: 1}, relation: {brunel_gaspard: 1}}
      - label: "Prenez la cabine"
        reponse: "Dix secondes dans la cabine à scanner de Valdorne. Le costume tombe juste. Gaspard le livre sans un mot, et sans la doublure qu'il t'avait promise."
        effets: {relation: {brunel_gaspard: -1}}

  # ─────────────────────────────────────────────────────────────── la librairie
  - id: vi.qr.arlaud_synonymes
    titre: "Le dictionnaire des synonymes"
    lieu: librairie
    qui: arlaud
    si: "flag(tuyau_arlaud_chroniqueur) && annee <= 2007"
    texte: "Le chroniqueur de L'Écho est au comptoir, ses cigarettes à la main. Agathe te fait un signe : c'est lui. Il ne t'a pas encore vu. Il feuillette un dictionnaire des synonymes."
    choix:
      - label: "Je l'invite à déjeuner"
        francs: -150
        reponse: "Il accepte, par curiosité. Il mange beaucoup et ne prend aucune note. La série paraît quand même, en trois épisodes. Le troisième est presque gentil."
        effets: {jauges: {tribunes: 1}}
      - label: "Je le laisse chercher"
        reponse: "Il trouve. Trois chroniques, trois synonymes de « médiocre » par chronique. Le Corner les découpe et les punaise derrière le comptoir."
        effets: {jauges: {tribunes: -2}}

  - id: vi.qr.arlaud_enveloppe
    titre: "L'enveloppe jamais réclamée"
    roles: [entraineur, president, ds, selectionneur]
    lieu: librairie
    qui: arlaud
    si: "relation.arlaud >= 2 && annee <= 2007"
    texte: "Dans le tiroir des pellicules jamais réclamées, Agathe sort une enveloppe au nom de ton prédécesseur, déposée la veille de son départ. « Elle attend depuis. Je la développe ? »"
    choix:
      - label: "Développez-la"
        francs: -60
        reponse: "Douze photos de la nuit avant son départ : des visages fermés, une chaise vide, quelqu'un dans l'encadrement d'une porte. Tu sais maintenant qui était là."
        effets: {jauges: {vestiaire: 1}}
      - label: "Rendez-la à sa famille"
        reponse: "Agathe l'envoie à la famille, sans un mot. Une carte revient trois semaines plus tard : « Merci. Nous ne l'ouvrirons pas non plus. »"
        effets: {relation: {arlaud: 1}}

  - id: vi.qr.arlaud_photos
    titre: "Les photos de Madame Marsal"
    lieu: librairie
    qui: arlaud
    si: "relation.arlaud >= 2 && annee >= 2000 && annee <= 2007 && !flag(histoire_h1)"
    texte: "Madame Marsal est partie en maison de retraite. Agathe a trouvé sous le comptoir quatre cents photos du stade, de 1951 à 1990. « Le club, ou L'Écho ? Elle a dit : celui qui les regardera. »"
    choix:
      - label: "Au club"
        reponse: "Les photos partent au club-house dans des cartons. Le président en choisit trois pour son bureau. Les autres descendent à la cave, dans le noir qu'elles connaissent."
        effets: {jauges: {direction: 1}}
      - label: "À L'Écho"
        reponse: "L'Écho en publie une par semaine pendant des années. Le samedi, les anciens découpent la page et s'y reconnaissent, ou reconnaissent un mort."
        effets: {jauges: {tribunes: 2}, relation: {arlaud: 1}}

  - id: vi.qr.vautrin_enveloppe
    titre: "Une enveloppe de 1984"
    lieu: librairie
    qui: vautrin
    si: "relation.vautrin >= 2 && annee >= 2008"
    texte: "Une femme demande l'enveloppe de son père, déposée en 1984. Céline la retrouve au fond du tiroir : le nom d'un ancien gardien du club. La femme n'a pas de quoi payer le tirage."
    choix:
      - label: "Je paie le tirage"
        francs: -60
        reponse: "Les photos sortent de la borne : un vestiaire de 1984, un gardien qui rit, une coupe en carton. La femme les serre contre elle. Le samedi, elle est en tribune."
        effets: {jauges: {tribunes: 1}, relation: {vautrin: 1}}
      - label: "Je m'en vais"
        reponse: "Céline lui fait crédit et note la dette dans son carnet rouge, à ton nom, en souriant. Tu ne sauras jamais si c'était une blague."
        effets: {relation: {vautrin: -1}}

  # ───────────────────────────────────────────────────────────────── le cinéma
  - id: vi.qr.vigouroux_dernier_rang
    titre: "Le dernier rang"
    lieu: cinema
    tranches: [soir]
    jours: [ven]
    qui: vigouroux
    si: "flag(tuyau_vigouroux_dernier_rang) && role != president && role != selectionneur && annee <= 2011"
    texte: "Vendredi, de la cabine, Ernest te montre le dernier rang côté mur : deux silhouettes arrivées après la lumière. « Je vous l'ai dit pour que vous le sachiez. Pas pour vous en servir. »"
    choix:
      - label: "Je m'en servirai"
        reponse: "Lundi, dans le bureau du président, tu parles du dernier rang de L'Aurore, sans un nom. Il pâlit, puis devient très aimable. Ernest ne te fait plus monter en cabine."
        effets: {jauges: {direction: 2}, relation: {vigouroux: -1}}
      - label: "Je n'ai rien vu"
        reponse: "Tu redescends dans la salle avant la fin. La semaine suivante, Ernest te garde la meilleure place du fond, celle qu'on ne voit pas de l'écran."
        effets: {relation: {vigouroux: 1}}

  - id: vi.qr.vigouroux_derniere_bobine
    titre: "La dernière séance en bobine"
    lieu: cinema
    tranches: [soir]
    qui: vigouroux
    si: "relation.vigouroux >= 2 && annee >= 2010 && annee <= 2011"
    texte: "Dernière semaine du projecteur. Ernest te laisse choisir le film de la dernière séance en bobine, dimanche. « Il y aura vous, ou vous et moi. Ça dépend du film. »"
    choix:
      - label: "Un vieux film du club"
        reponse: "Il passe les actualités de la finale de 1974, puis un western. Vous êtes deux dans la salle. À la fin, il te donne trois images de la tribune Nord, découpées aux ciseaux."
        effets: {jauges: {tribunes: 1}, relation: {vigouroux: 1}}
      - label: "Choisissez, vous"
        reponse: "Il choisit un film d'amour en noir et blanc et ne descend pas de la cabine. Tu le regardes dans la salle vide. Tu ne sauras jamais pourquoi celui-là."
        effets: {relation: {vigouroux: 1}}

  - id: vi.qr.viard_dette
    titre: "Dernières séances"
    lieu: cinema
    tranches: [soir]
    qui: viard
    si: "flag(dette_viard)"
    texte: "Ghislaine a collé « Dernières séances » sur la vitrine de L'Aurore. « Si la salle est pleine dimanche, la mairie attend un an avant de vendre. Amenez votre monde. »"
    choix:
      - label: "J'amène tout le monde"
        reponse: "Dimanche, trois cents places, trois cents personnes : ton groupe, leurs familles, le kop. La mairie attend un an. Au club, on te demande de quel droit."
        effets: {clear: [dette_viard], jauges: {tribunes: 1, direction: -1}, relation: {viard: 1}}
      - label: "Je ne peux pas"
        reponse: "Dimanche, cent douze spectateurs. La mairie signe en juin. Ghislaine reste caissière pour le nouveau propriétaire, et ne te met plus de bonbons en plus."
        effets: {clear: [dette_viard], relation: {viard: -2}}

  - id: vi.qr.viard_ecran
    titre: "Le match sur l'écran"
    lieu: cinema
    tranches: [soir]
    qui: viard
    si: "relation.viard >= 2 && annee >= 2024"
    texte: "Ce soir, pas de film : le match à l'extérieur, en grand sur l'écran de L'Aurore. Ghislaine te tend le micro de la caisse : « Trois mots avant le coup d'envoi ? Ils sont venus pour ça aussi. »"
    choix:
      - label: "Trois mots"
        reponse: "Tu dis trois mots, puis un quatrième. La salle chante comme à la Rive ; le plafond tient. Ghislaine note dans son cahier : « Quatre mots. »"
        effets: {jauges: {tribunes: 2}}
      - label: "Je regarde du fond"
        reponse: "Tu restes au fond, debout, près de la porte. La salle chante sans toi. Ghislaine note dans son cahier : « Pas un mot. »"
        effets: {relation: {viard: -1}}

  # ─────────────────────────────────────────────────────────────────── l'école
  - id: vi.qr.bellocq_inscrits
    titre: "Trois inscrits"
    lieu: ecole
    qui: bellocq
    si: "flag(tuyau_bellocq_classe) && role != selectionneur && annee <= 2012"
    texte: "Monsieur Bellocq te montre la liste de la rentrée, trois lignes vides en bas. « Trois familles de vos jeunes logées ici plutôt qu'à Valdorne, et la classe reste. Le club paierait ? »"
    choix:
      - label: "Le club les logera ici"
        reponse: "Trois familles emménagent rue des Lilas en août. La classe reste ouverte. Le club paie trois loyers de plus, et le trésorier te le rappelle à chaque réunion."
        effets: {jauges: {tribunes: 2, caisse: -1}, relation: {bellocq: 1}}
      - label: "Le club n'y peut rien"
        reponse: "La classe ferme en septembre. Vingt-deux enfants se partagent deux salles. Monsieur Bellocq ne t'ouvre plus la grille avant la sortie."
        effets: {relation: {bellocq: -1}}

  - id: vi.qr.bellocq_depart
    titre: "Le pot de départ"
    lieu: ecole
    qui: bellocq
    si: "relation.bellocq >= 2 && annee >= 2011 && annee <= 2012"
    texte: "Monsieur Bellocq part en retraite après quarante ans à l'école des Lilas. Les CM2 ont préparé une chanson. Il te demande un mot, « pour qu'il y ait un adulte qui ne pleure pas »."
    choix:
      - label: "Je dis un mot"
        reponse: "Tu dis trois phrases. La dernière fait rire. Il te serre la main et ne la lâche pas pendant toute la chanson. En sortant, les parents te regardent autrement."
        effets: {jauges: {tribunes: 1}, relation: {bellocq: 1}}
      - label: "Je n'ai rien à dire"
        reponse: "C'est la cantinière qui parle. Elle pleure dès la première phrase, et Monsieur Bellocq aussi. Il te salue de loin, à la fin, sans traverser la cour."
        effets: {relation: {bellocq: -1}}

  - id: vi.qr.chabanel_copies
    titre: "Trois rédactions"
    lieu: ecole
    qui: chabanel
    si: "flag(tuyau_chabanel_redactions) && role != selectionneur && annee >= 2013"
    texte: "Madame Chabanel te tend trois copies. Une écriture ronde : « Mon papa fait la pelouse du stade. Il dit qu'on va le remplacer par une machine. » Elle te regarde. « Vous y pouvez quelque chose ? »"
    choix:
      - label: "Je me battrai pour eux"
        reponse: "Tu t'y opposes en réunion, deux fois. Le jardinier, le chauffeur et la lingère restent jusqu'à la fin de la saison. Le club t'en veut ; les trois familles, non."
        effets: {jauges: {direction: -2, vestiaire: 1}, relation: {chabanel: 1}}
      - label: "Ce n'est pas de mon ressort"
        reponse: "Elle range les copies dans sa sacoche et les note, dix-huit, quinze, douze. Elle ne te les montre plus."
        effets: {relation: {chabanel: -1}}

  - id: vi.qr.chabanel_preau
    titre: "Seize heures quarante"
    lieu: ecole
    tranches: [aprem]
    jours: [lun, mar, jeu, ven]
    qui: chabanel
    si: "relation.chabanel >= 2 && annee >= 2013"
    texte: "Seize heures quarante. Un garçon attend seul sous le préau, son cartable sur les genoux : personne n'est venu. Madame Chabanel a une réunion. « Vous pouvez rester avec lui un quart d'heure ? »"
    choix:
      - label: "Je reste avec lui"
        reponse: "Vous jonglez avec le ballon dégonflé du préau. Sa mère arrive à dix-sept heures dix, en courant, en blouse d'aide-soignante. Elle ne sait pas qui tu es. Lui, si."
        effets: {jauges: {tribunes: 1}, relation: {chabanel: 1}}
      - label: "J'ai un rendez-vous"
        reponse: "Madame Chabanel annule sa réunion. Elle s'assoit à côté du garçon et sort une copie à corriger. Elle ne te dit pas au revoir."
        effets: {relation: {chabanel: -1}}

  # ─────────────────────────────────────────── d'autres jours, et quand le lien a tourné
  - id: vi.qr.quintane_froid
    titre: "Pas avant jeudi"
    lieu: garage
    qui: quintane
    si: "relation.quintane <= -2 && annee <= 2018"
    texte: "Ta voiture refuse de démarrer, la veille d'un déplacement. Au garage du Pont, Quintane ne lève pas la tête de son moteur. « Pas avant jeudi. » On est lundi."
    choix:
      - label: "Je paie le double"
        francs: -400
        reponse: "Il la répare dans l'après-midi, sans un mot, et te fait payer le double. Il ne te propose pas de café. Mais il a écouté ton moteur trente secondes, les yeux fermés."
        effets: {relation: {quintane: 1}}
      - label: "J'irai à Valdorne"
        francs: -600
        reponse: "Le garage de Valdorne te la rend en trois jours, avec une facture de concessionnaire et une valise qui dit que tout va bien. Quintane le sait le soir même."
        effets: {relation: {quintane: -1}}

  - id: vi.qr.delmotte_col_rouge
    titre: "Le col du mardi"
    roles: [entraineur, joueur, ds]
    lieu: laverie
    qui: delmotte
    si: "relation.delmotte >= 2 && annee <= 2012"
    texte: "Gisèle te tend une chemise du président, le col tourné vers toi : du rouge, un mardi, et ce n'est pas celui de sa femme. « Je la lave, ou je la plie telle quelle ? »"
    choix:
      - label: "Lavez-la"
        reponse: "Elle la lave à part, à la main, et la plie avec les autres. Le président ne saura jamais qu'une laverie a eu son mariage entre les doigts. Toi, si."
        effets: {relation: {delmotte: 1}}
      - label: "Pliez-la telle quelle"
        reponse: "Elle la plie le col en dessus, sans un mot. Le jeudi, le président arrive au club avec une valise. Il dort au club-house un mois, et signe tout ce qu'on lui tend."
        effets: {jauges: {direction: 1}, relation: {delmotte: -1}}

  - id: vi.qr.delmotte_froid
    titre: "Le linge sur la chaise"
    lieu: laverie
    qui: delmotte
    si: "relation.delmotte <= -2 && annee <= 2012"
    texte: "Ton linge t'attend dehors, sur une chaise devant la laverie, mouillé, avec un mot épinglé dessus : « Les machines sont libres. » Gisèle plie, derrière la vitre."
    choix:
      - label: "Je vais lui parler"
        reponse: "Elle t'écoute en pliant. À la fin, elle prend ton linge et le met dans la 2. « Pas la 4. La 4, ça se mérite. » C'est mieux que rien."
        effets: {relation: {delmotte: 1}}
      - label: "Je reprends mon linge"
        reponse: "Tu remontes la rue du Stade, le linge mouillé dans les bras. Au Corner, devant la vitre, on te regarde passer. Le soir, tout le comptoir le raconte."
        effets: {jauges: {tribunes: -1}, relation: {delmotte: -1}}

  - id: vi.qr.ducros_boite
    titre: "La boîte à chaussures"
    lieu: marche
    tranches: [midi]
    qui: ducros_achille
    si: "relation.ducros_achille >= 2 && annee <= 2011"
    texte: "Achille te confie sa boîte à chaussures pour la nuit : un examen à l'hôpital, demain matin. « Si je ne reviens pas, donnez-la à ma fille. Si je reviens, ne l'ouvrez pas. »"
    choix:
      - label: "Je la garde fermée"
        reponse: "Elle passe la nuit sur ta table, fermée par un élastique. Achille revient le surlendemain, plus maigre. Il reprend la boîte et te met trois pommes de plus. Sans les peser."
        effets: {relation: {ducros_achille: 1}}
      - label: "Je l'ouvre"
        reponse: "Dedans, de la monnaie, et dessous un carnet : trente ans de crédits faits à des supporters, jamais réclamés. Tu refermes. Il revient, regarde l'élastique, et sait."
        effets: {jauges: {tribunes: 1}, relation: {ducros_achille: -1}}

  - id: vi.qr.huguette_derby
    titre: "Les fleurs du derby"
    lieu: fleuriste
    qui: huguette
    si: "relation.huguette >= 2 && annee <= 2016"
    texte: "Madame Huguette te tend un petit bouquet bordeaux. « Mon mari jouait arrière, en 1962. Il est au carré du fond. Le jour du derby, je n'ai plus les jambes. Vous les poserez ? »"
    choix:
      - label: "Je les poserai"
        reponse: "Le matin du derby, tu poses le bouquet sur une tombe au nom effacé, à côté d'un ballon en céramique. Un ancien, deux tombes plus loin, te fait un signe de casquette."
        effets: {jauges: {tribunes: 1}, relation: {huguette: 1}}
      - label: "Je n'aurai pas le temps"
        reponse: "Elle range le bouquet dans la chambre froide. « Il attendra le match d'après. Il a l'habitude d'attendre. » Elle ne te le redemande pas."
        effets: {relation: {huguette: -1}}

  - id: vi.qr.vigouroux_bobines
    titre: "Les bobines qui fondent"
    lieu: cinema
    tranches: [soir]
    qui: vigouroux
    si: "relation.vigouroux >= 2 && annee <= 2011"
    texte: "À la cave de L'Aurore, Ernest soulève un couvercle : la finale de 1974 colle à sa boîte, comme du sucre. « À Valdorne, un laboratoire sauve les bobines. C'est cher. Le club refuse. »"
    choix:
      - label: "Je paie le laboratoire"
        francs: -2000
        reponse: "Trois mois plus tard, la finale revient sur une cassette et une bobine neuve. Ernest la projette un dimanche matin. La salle est pleine d'anciens qui se reconnaissent."
        effets: {jauges: {tribunes: 2}, relation: {vigouroux: 1}}
      - label: "Le club a raison"
        reponse: "Il referme le couvercle doucement, comme sur un cercueil. L'hiver suivant, la finale de 1974 n'est plus qu'une galette brune. Il la garde quand même."
        effets: {relation: {vigouroux: -1}}

  - id: vi.qr.bellocq_cahier
    titre: "Le cahier de 1979"
    lieu: ecole
    tranches: [aprem]
    qui: bellocq
    si: "relation.bellocq >= 2 && role != selectionneur && annee <= 2004"
    texte: "Monsieur Bellocq sort d'une armoire un cahier de CM2, 1979 : celui de ton capitaine. Rédaction, « Plus tard, je serai » : « gardien du stade, pour dormir dans les tribunes »."
    choix:
      - label: "Je le lui montre"
        reponse: "Le capitaine lit sa rédaction dans le vestiaire, à voix haute, sans qu'on lui demande. Tout le monde rit. Lui aussi, mais un peu après les autres."
        effets: {jauges: {vestiaire: 1}}
      - label: "Rangez-le"
        reponse: "Il le range avec les autres, par année. « Un jour, il viendra le chercher lui-même. Ils viennent tous, quand ils ont des enfants. »"
        effets: {relation: {bellocq: 1}}

  # ───────────────────────────────────────────────────────────── les réputations
  # « Un enfant du pays » (rep_quartier), « présent pour les siens » (rep_famille),
  # « un liseur » (rep_culture) : une scène douce, une scène amère chacune.
  - id: vi.qr.rep_quartier_cours
    titre: "Par la cour de la laverie"
    lieu: rue
    tranches: [soir]
    qui: commercant
    si: "flag(rep_quartier)"
    texte: "Un photographe t'attend devant chez toi, l'objectif levé. Au coin de la rue, l'épicier te fait signe : par la cour de la laverie, puis la porte du fournil, tu rentres sans qu'il te voie."
    choix:
      - label: "Je passe par les cours"
        reponse: "La laverie, une cour, un portail, le fournil encore chaud. On t'ouvre sans un mot. Le photographe attend jusqu'à minuit, puis s'en va. Le lendemain, pas de photo."
        effets: {jauges: {direction: 1}}
      - label: "Je vais lui parler"
        reponse: "Tu lui parles cinq minutes, sous la pluie. Il range son appareil. Le lendemain, la seule photo est celle de quelqu'un qui tient un parapluie au-dessus d'un photographe."
        effets: {jauges: {tribunes: 1}}

  - id: vi.qr.rep_quartier_lettre
    titre: "Puisque vous êtes d'ici"
    lieu: rue
    tranches: [matin, midi]
    qui: commercant
    si: "flag(rep_quartier)"
    texte: "Les commerçants t'attendent à la sortie du marché avec une lettre : le club veut ouvrir sa propre buvette dans la rue, les jours de match. « Vous êtes d'ici. Vous signez en premier. »"
    choix:
      - label: "Je signe en premier"
        reponse: "Ton nom est en haut de la lettre, au-dessus de celui de l'épicier. Le club recule. Au bureau, on te demande pour qui tu travailles, au juste."
        effets: {jauges: {tribunes: 2, direction: -2}}
      - label: "Je ne peux pas signer"
        reponse: "Ils plient la lettre sans un mot. La buvette du club ouvre en septembre. Dans la rue, on te sert encore ; on ne t'appelle plus par ton prénom."
        effets: {jauges: {tribunes: -2, direction: 1}}

  - id: vi.qr.rep_famille_car
    titre: "Un adulte par car"
    lieu: ecole
    tranches: [aprem]
    jours: [lun, mar, jeu, ven]
    qui: passante
    si: "flag(rep_famille)"
    texte: "À la grille de l'école, des parents t'attendent avec une liste : pour la sortie de fin d'année, il manque un adulte par car. « Vous êtes toujours là le mercredi. Alors on a pensé à vous. »"
    choix:
      - label: "Je monte dans le car"
        reponse: "Une journée au bord du lac de Valdorne, trente enfants et une glacière. Le soir, ils chantent l'hymne du club dans le car, faux, et en entier."
        effets: {jauges: {tribunes: 2}}
      - label: "Pas ce jour-là"
        reponse: "Un autre parent monte à ta place. Les enfants demandent où tu es. On leur dit : au travail. Ils trouvent que c'est une drôle de réponse, un mercredi."
        effets: {jauges: {direction: 1}}

  - id: vi.qr.rep_famille_bureau
    titre: "Le mercredi après-midi"
    lieu: domicile
    tranches: [soir]
    si: "flag(rep_famille)"
    texte: "Un appel du bureau, le soir, sans bonjour : « Mercredi, pendant la réunion, on vous a vu à la sortie de l'école. Quelqu'un l'a noté. Ce n'est pas un reproche. C'est une information. »"
    choix:
      - label: "Je garde mes mercredis"
        reponse: "Tu dis que le mercredi est à toi. Un silence, puis : « Très bien. » Les réunions sont déplacées au mercredi, seize heures, désormais."
        effets: {jauges: {direction: -2}}
      - label: "Je serai là mercredi"
        reponse: "Mercredi, tu es à la réunion. À seize heures trente, quelqu'un attend à la grille et ne te voit pas venir. Le soir, on ne te dit rien. On te le dira plus tard."
        effets: {jauges: {direction: 1}, relation: {camille: -1}}

  - id: vi.qr.rep_culture_archives
    titre: "Les archives de L'Écho"
    lieu: echo
    tranches: [aprem]
    qui: ancien
    si: "flag(rep_culture)"
    texte: "À L'Écho, l'archiviste te reconnaît : « Vous êtes {pg, select, f{celle} other{celui}} qui lit. » Il descend avec toi au sous-sol : les comptes rendus des conseils du club, de 1962 à hier."
    choix:
      - label: "Je lis toute la nuit"
        reponse: "Au matin, tu connais les statuts du club mieux que le conseil : une clause de 1971 que tout le monde a oubliée. Sauf toi, désormais."
        effets: {jauges: {direction: 2}}
      - label: "Une photocopie suffira"
        francs: -20
        reponse: "Il te photocopie dix pages au hasard, en souriant. Sur la dixième, un nom que tu connais, en 1974, au bas d'un vote. Tu ne sais pas encore quoi en faire."
        effets: {jauges: {direction: 1}}

  - id: vi.qr.rep_culture_professeur
    titre: "Le professeur"
    lieu: rue
    tranches: [matin, midi]
    qui: passant
    si: "flag(rep_culture)"
    texte: "Dans L'Écho de lundi, le chroniqueur te surnomme « le Professeur » : « Moins de romans, plus de victoires. » Au tabac, on te salue d'un « Bonjour, professeur ». Pas gentiment."
    choix:
      - label: "Je réponds par une lettre"
        reponse: "Ta lettre paraît jeudi, en page courrier : courte, précise, sans un mot de trop. Le Corner la trouve bien écrite, ce qui est pire. Le club aurait préféré le silence."
        effets: {jauges: {tribunes: 1, direction: -1}}
      - label: "Je laisse dire"
        reponse: "Le surnom reste. Au virage, on te salue d'un « Professeur ! » à chaque apparition, et on rit. Ça finira par passer. Pas cette saison."
        effets: {jauges: {tribunes: -2}}

# ═══════════════════════════════════════════════════════════════════ LES PAROLES
# Ce que la rue dit de toi quand une réputation est née.
paroles:
  # « un enfant du pays »
  - {qui: commercant, sujet: toi, si: "flag(rep_quartier)", texte: "Vous, on vous sert sans demander ce que vous voulez. Ici, ça veut dire qu'on a arrêté de vous regarder comme quelqu'un de passage."}
  - {qui: ancien, sujet: toi, si: "flag(rep_quartier)", texte: "Ma femme dit que vous faites vos courses ici, comme nous. Elle le dit comme on dit de quelqu'un qu'il a été baptisé à Saint-Aubin."}
  - {qui: enfant, sujet: toi, si: "flag(rep_quartier)", texte: "Tu habites la cité ? Ma mère dit que presque. Elle dit que tu prends ton pain chez nous, et que tu dis bonjour à tout le monde."}
  # « présent pour les siens »
  - {qui: passante, sujet: toi, si: "flag(rep_famille)", texte: "Mon petit dit qu'il vous a vu au spectacle de l'école, au troisième rang, avec un appareil photo. Il ne vous croyait pas capable de ça."}
  - {qui: enfant, sujet: toi, si: "flag(rep_famille)", texte: "T'étais à la kermesse ! T'as perdu au chamboule-tout. La maîtresse dit que c'est bien, de perdre devant les enfants."}
  - {qui: commercant, sujet: toi, si: "flag(rep_famille)", texte: "On dit que vous rentrez dîner chez vous tous les soirs. Dans votre métier ? Ma femme ne me croit pas. Moi non plus, remarquez."}
  # « un liseur »
  - {qui: ancien, sujet: toi, si: "flag(rep_culture)", texte: "Vous lisez au café, maintenant. Avant, les gens du club lisaient L'Écho, page des sports. Vous, des livres sans images."}
  - {qui: commercant, sujet: toi, si: "flag(rep_culture)", texte: "La libraire dit que vous lui avez commandé un livre qu'elle a dû chercher dans trois catalogues. Elle en parle comme d'un exploit."}
  - {qui: fan, sujet: toi, si: "flag(rep_culture)", texte: "Au virage, on t'appelle le professeur. C'est gentil, chez nous. Enfin, ça dépend du score."}

