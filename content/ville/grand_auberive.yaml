# LE GRAND AUBÉRIVE — les lieux des quatre quartiers autour de la ville
# (docs/histoires/grand_auberive.md). Le plan du monde, les portes et les noms viennent des
# quartiers modelés (docs/design/pixel_iso/district_<clé>.js) ; ici, ce qu'on voit en arrivant et
# les heures où l'on entre. Un lieu sans porte (le parvis, le city-stade, les docks, l'étang, le
# stade du village) est toujours ouvert.
#
# Les quartiers s'ouvrent au fil de la carrière (ville_quartiers.js) : les Tilleuls à la 4ᵉ semaine,
# le port à la 8ᵉ, les Hauts à la 2ᵉ saison, la campagne avec une voiture ou à la 12ᵉ semaine, ou
# plus tôt par un drapeau d'histoire `quartier_<clé>`.
#
# Les textes n'accordent rien au protagoniste, et ne nomment ni marque ni objet d'une seule époque.
lieux:
  # ═════════════════════════════════════════════ LES HAUTS — le quartier d'affaires, au nord
  - key: tour_ecran
    texte: "La tour Écran, siège de la chaîne. Au rez-de-chaussée, un vigile, un portique et l'écran du hall qui repasse le but de samedi, au ralenti, sans le son."
    heures: [matin, midi, aprem, soir]
  - key: tour_dalmene
    texte: "La tour Dalmène, l'assureur qui met son nom sur les maillots. Le hall sent le parquet ciré ; l'ascenseur monte au trente-deuxième sans un bruit, comme l'argent."
    heures: [matin, midi, aprem]
  - key: hotel_imperial
    texte: "L'Impérial. Une porte à tambour, un tapis rouge, des taxis qui attendent. C'est ici qu'on signe les transferts : au bar, dans les fauteuils où l'on ne se lève pas."
  - key: galerie_hauts
    texte: "La galerie des Hauts : une verrière, des vitrines éclairées comme des écrins, un vigile par boutique. On y paie sans regarder les étiquettes, ou on n'y entre pas."
    heures: [matin, midi, aprem, soir]
  - key: cabinet_verdier
    texte: "Le cabinet Verdier, avocats. Une plaque de laiton, une salle d'attente où personne ne lit les revues, et des dossiers qui portent des noms de joueurs."
    heures: [matin, midi, aprem]
  - key: table_hauts
    texte: "La Table des Hauts, tout en haut de la tour de verre. L'ascenseur panoramique monte au-dessus de la ville ; de là-haut, le stade de la Rive tient dans une assiette."
    heures: [midi, soir]
  - key: parvis
    texte: "Le parvis des tours : une dalle venteuse, des jets d'eau, des drapeaux qui claquent. Des gens pressés le traversent sans lever la tête vers la sculpture rouge."

  # ═════════════════════════════════════════════ LES TILLEULS — la cité, à l'ouest
  - key: city_stade
    texte: "Le city-stade, derrière son grillage. Le gazon synthétique pelé aux deux buts, un banc sans dossier, et des gamins qui jouent jusqu'à ce que la lumière s'éteigne."
  - key: maison_quartier
    texte: "La maison de quartier. Des dessins d'enfants collés sur la vitre, un baby-foot, une permanence pour les papiers, et une animatrice qui connaît tout le monde par son prénom."
    heures: [matin, midi, aprem, soir]
  - key: snack_tilleuls
    texte: "Le Snack des Tilleuls : un comptoir, quatre tabourets, la friteuse qui chante. Le patron passe le match de samedi en boucle sur un petit poste au-dessus de la caisse."
    heures: [midi, aprem, soir, nuit]
  - key: superette
    texte: "La supérette, au pied des barres. Des rayons serrés, le pain de la veille à moitié prix, et le cahier des dépannages sous la caisse, où l'on note ce qu'on paiera plus tard."
    heures: [matin, midi, aprem, soir]
  - key: club_boxe
    texte: "Le club de boxe, sous un auvent de tôle. Un ring aux cordes rafistolées, des sacs qui pendent, et l'odeur du cuir. Au mur, la photo d'un champion qui a grandi tour B."
    heures: [aprem, soir]
  - key: salon_tilleuls
    texte: "Le salon des Tilleuls. Trois fauteuils, un néon, et un coiffeur qui sait qui a signé où avant les journaux. On vient pour la coupe ; on reste pour la conversation."
    heures: [matin, midi, aprem]
  - key: tour_c
    texte: "Le hall de la tour C. Les boîtes aux lettres cabossées, l'ascenseur en panne un jour sur deux, et des noms à toutes les sonnettes, sauf au neuvième."

  # ═════════════════════════════════════════════ LE PORT DE LA RIVE — à l'est
  - key: docks
    texte: "Les docks : le bord du quai, entre la grue et la tour du silo. Une péniche décharge du sable ; un homme compte les sacs, un autre compte l'homme qui compte."
  - key: entrepot_7
    texte: "L'entrepôt 7, en tôle, un grand chiffre peint sur la voûte. Une porte de service, une lampe, et un gardien qui ne demande pas ce qu'on vient chercher, seulement pour qui."
    heures: [matin, aprem, soir, nuit]
  - key: relais_routiers
    texte: "Le Relais des routiers, ouvert toute la nuit. Le néon a perdu deux lettres. Au comptoir, des hommes qui ont roulé douze heures parlent football comme on parle de la pluie."
  - key: casse
    texte: "La casse : des carcasses empilées, une pelle à grappin, un chien attaché. Ce qui entre ici en voiture en ressort en pièces, et personne ne relève les numéros."
    heures: [matin, midi, aprem]
  - key: capitainerie
    texte: "La capitainerie, à la pointe du bassin. Une plaque bleue, une vigie éclairée, et un registre où chaque péniche signe son arrivée. Presque chaque péniche."
    heures: [matin, midi, aprem, soir]
  - key: guinguette
    texte: "La guinguette, une péniche-bar amarrée au quai nord. Des guirlandes, des tables de bois, un accordéon le samedi soir, et la Rive qui clapote contre la coque."
    heures: [aprem, soir, nuit]

  # ═════════════════════════════════════════════ LA CAMPAGNE — au sud, après le boulevard
  - key: ferme
    texte: "La ferme Lacombe. Un portail ouvert, une cour où picorent des poules, un banc contre le mur du logis. Le fermier ne lit pas les journaux ; il écoute le match à la radio."
  - key: centre_vert
    texte: "Le centre du Bois-Joli, où le club se met au vert avant les grands matchs. Des terrains tondus ras, des chambres simples, et un silence que la ville n'a jamais."
    heures: [matin, midi, aprem, soir]
  - key: manoir
    texte: "Le manoir de la Motte, derrière ses grilles. Un perron de deux marches, deux lanternes, des volets clos sur la moitié des fenêtres. On dit qu'un ancien président y vit seul."
  - key: etang
    texte: "L'étang, au bout du sentier. Un ponton de planches, des roseaux, un pêcheur qui ne parle pas. L'eau ne bouge pas ; c'est la seule chose d'Aubérive qui ne bouge pas."
  - key: stade_village
    texte: "Le stade du village, la main courante peinte en blanc, une tribune de bois. Le dimanche, l'U.S. La Motte y joue devant quarante personnes qui connaissent chaque joueur."
  - key: auberge
    texte: "L'auberge du Relais. Une salle basse, une cheminée, le plat du jour à la craie. Le patron reconnaît les gens de la ville à leurs chaussures, et ne le leur reproche pas."
    heures: [midi, aprem, soir]
