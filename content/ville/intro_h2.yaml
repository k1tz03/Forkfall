# HISTOIRE 2 — « LE SAPIN EN CARTON » : l'introduction distillée, et ce que la ville dit des choix
# du prologue et du livre (format : docs/histoires/scenes_jouees.md ; la charte :
# docs/bible/charte_histoire.md).
#
# L'introduction jouée tient en quatre répliques (cinematiques_h2.yaml, h2.ci.intro) : Vukić sur
# le parking, puis la première carte. Ce qu'elle disait avant vient ici, après les premiers
# choix : le communiqué que le président dicte, les gamins du terrain annexe, le Terminus où
# Norbert sait déjà. Plus bas, les échos des choix : ce que le président, Massenet, Achard, Léa et
# les autres ont retenu de ce que tu as dit ou fait.
cinematiques:
  # Avant la carte de Massenet : dimanche soir, le communiqué est tapé à deux doigts. Le parking,
  # c'est le président ; les deux tasses, c'est Josiane.
  - id: h2.ci.communique
    quand: carte
    carte: en.h2.pro.communique
    moment: avant
    roles: [entraineur]
    si: "flag(histoire_h2)"
    lieu: clubhouse
    tranche: nuit
    acteurs:
      - {qui: toi, place: porte}
      - {qui: aulard, place: president}
      - {qui: josiane, place: secretaire}
    etapes:
      - {fondu: "Dimanche soir, dix heures. Le club-house."}
      - {narration: "Tout est éteint, sauf la lampe du secrétariat et celle du premier. Ça sent le café réchauffé. Madame Josiane tape à deux doigts ce que le président lui dicte."}
      - {qui: aulard, dit: "Une ligne. « Le Racing remercie Roland Mercadier. » Pas de date, pas de raison. L'Écho l'aura demain matin.", geste: telephone}
      - {qui: toi, va: visiteur_1}
      - {qui: aulard, dit: "Les gars vont te demander où il est. Tu diras ce que dit le communiqué : remercié. C'est un mot qui se suffit."}
      - {qui: aulard, dit: "Et ne t'occupe pas du parking. Le parking, c'est moi.", ton: noir}
      - {narration: "Vaubourg éteint sa lampe. En bas, Madame Josiane sort deux tasses du placard, en regarde une longtemps, et la range."}

  # Après la phrase de Bréhaut : les gamins du terrain annexe, la rumeur du collège, un plot oublié.
  - id: h2.ci.gamins
    quand: carte
    carte: en.h2.pro.phrase
    moment: apres
    roles: [entraineur]
    si: "flag(histoire_h2)"
    lieu: terrain
    tranche: soir
    acteurs:
      - {qui: toi, place: [0, 3]}
      - {id: gamin, qui: enfant, nom: "Un gamin des moins de dix-sept", place: [2, 4]}
      - {id: gamin2, qui: enfant, nom: "Un autre gamin", place: [-2, 4]}
    etapes:
      - {fondu: "Fin d'après-midi. Le terrain annexe."}
      - {narration: "La pluie a cessé. Les moins de dix-sept ans ramassent les plots dans la boue ; trois ans que tu les entraînes sous ce projecteur-là."}
      - {qui: gamin, dit: "Coach, c'est vrai qu'ils ont viré Mercadier ? Au collège, il y en a qui disent qu'il est mort."}
      - {qui: gamin2, dit: "N'importe quoi. Il est parti en train. C'est mon père qui l'a dit."}
      - {qui: toi, pense: "Parti en train, remercié, mort : trois versions avant la nuit. Aucune ne dit ce que sa voiture fait encore là."}
      - {qui: gamin2, dit: "C'est pour son banc ? Coach, c'est pour son banc ?"}
      - {qui: toi, dit: "Ramassez les plots."}
      - {narration: "Les gamins se taisent. L'un d'eux a laissé un plot au milieu du terrain, sous le projecteur, et personne ne va le chercher."}

  # Après la première carte du livre : le soir, au Terminus, Norbert sait déjà.
  - id: h2.ci.terminus
    quand: carte
    prefixe: "en.h2.s0.cartons"
    moment: apres
    roles: [entraineur]
    si: "flag(histoire_h2)"
    lieu: terminus
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: norbert, place: norbert}
      - {id: patron, qui: commercant2, nom: "Le patron", place: patron}
      - {id: chauffeur, qui: passant, nom: "Un chauffeur de car", place: comptoir_1}
    etapes:
      - {fondu: "Le soir, au Terminus."}
      - {narration: "Le bar des chauffeurs de car : on y boit debout, sous les horaires punaisés. La pluie coule sur la vitre."}
      - {qui: toi, va: comptoir_2}
      - {qui: chauffeur, dit: "L'intérimaire, il paraît : quelqu'un des moins de dix-sept. Pour six semaines."}
      - {qui: patron, dit: "Six semaines. Après, on verra bien qui revient."}
      - {qui: norbert, regarde: toi}
      - {qui: norbert, dit: "Félicitations, coach. Ça s'est su avant la fin de la réunion. Ici, les nouvelles prennent le car.", ton: sourire}
      - {qui: toi, pense: "Norbert. Le chauffeur du club. Il dort dans le car pendant les matchs, et tout le monde le trouve normal."}
      - {qui: norbert, dit: "Trois jours de pluie. Les parkings n'ont jamais été aussi propres."}
      - {narration: "Il accroche les clés du car au clou, derrière le comptoir. Le trousseau se balance longtemps, puis s'arrête."}

  # Avant le samedi : la compo de l'autre est dans le cahier de Vukić, ou encore au mur.
  - id: h2.ci.compo_cahier
    quand: carte
    prefixe: "en.h2.rep.samedi"
    moment: avant
    roles: [entraineur]
    si: "flag(histoire_h2) && flag(h2_compo_cahier)"
    lieu: stade
    tranche: aprem
    acteurs:
      - {qui: toi, place: milieu}
      - {qui: vukic, place: coach}
      - {qui: brehaut, place: banc_2}
    etapes:
      - {narration: "Le vestiaire, samedi, quatorze heures trente. Au mur, à la place de la compo de l'autre, quatre punaises vides en carré."}
      - {qui: brehaut, dit: "Elle est où, sa compo ? Les gars se changent devant quatre trous."}
      - {qui: vukic, dit: "Dans mon cahier, entre deux pages blanches. Vendredi, vingt-deux heures, de sa main. Je ne la jette pas."}
      - {qui: brehaut, dit: "Tu la gardes pour qui ?"}
      - {qui: vukic, geste: ecrit}
      - {qui: vukic, dit: "Pour le jour où quelqu'un me demandera à quelle heure il a cessé d'écrire."}
      - {narration: "Bréhaut ne dit rien. Il lace ses chaussures, deux nœuds, comme s'il voulait que ça tienne."}

  - id: h2.ci.compo_mur
    quand: carte
    prefixe: "en.h2.rep.samedi"
    moment: avant
    roles: [entraineur]
    si: "flag(histoire_h2) && !flag(h2_compo_cahier)"
    lieu: stade
    tranche: aprem
    acteurs:
      - {qui: toi, place: milieu}
      - {qui: vukic, place: coach}
      - {qui: brehaut, place: banc_2}
    etapes:
      - {narration: "Le vestiaire, samedi, quatorze heures trente. La compo de l'autre est toujours au mur, ses quatre punaises rouillées aux coins. Les gars se changent devant elle sans la regarder."}
      - {qui: brehaut, dit: "Il y a trois noms dessus que tu ne mettras pas, coach. Ils le savent. Ils la lisent quand même."}
      - {qui: vukic, dit: "Dimanche, je la décroche. Pas avant. Ils ont besoin que quelqu'un ait écrit quelque chose."}
      - {qui: vukic, geste: ecrit}
      - {narration: "Bréhaut passe le doigt sur le 4, que l'autre faisait toujours fermé. Il lace ses chaussures, deux nœuds, comme s'il voulait que ça tienne."}

  # Avant le verdict : le président a eu Massenet au téléphone. Il sait ce que tu as dit devant le
  # communiqué, ou ce que tu n'as pas dit.
  - id: h2.ci.massenet_a_appele
    quand: carte
    prefixe: "en.h2.s0.verdict"
    moment: avant
    roles: [entraineur]
    si: "flag(histoire_h2) && flag(h2_accuse_president)"
    lieu: clubhouse
    tranche: aprem
    acteurs:
      - {qui: toi, place: porte}
      - {qui: josiane, place: secretaire}
      - {qui: aulard, place: president}
    etapes:
      - {narration: "Le club-house, un mercredi. La porte du premier est ouverte, ce qui n'arrive que lorsque le président attend quelqu'un."}
      - {qui: toi, va: guichet}
      - {qui: josiane, dit: "Il a eu Massenet au téléphone, ce matin. Longtemps. Il a dit « mon club » quatre fois."}
      - {qui: aulard, dit: "Monte ! Massenet m'a répété ce que tu lui as dit devant le communiqué. Le président l'a lâché, c'est ça ? Monte, que je t'explique le président."}
      - {qui: toi, pense: "Massenet échange une information contre une autre. Je lui ai donné la mienne pour rien."}
      - {qui: josiane, dit: "Je vous ai gardé une tasse. Prenez-la avant de monter."}

  - id: h2.ci.massenet_a_dit
    quand: carte
    prefixe: "en.h2.s0.verdict"
    moment: avant
    roles: [entraineur]
    si: "flag(histoire_h2) && !flag(h2_accuse_president)"
    lieu: clubhouse
    tranche: aprem
    acteurs:
      - {qui: toi, place: porte}
      - {qui: josiane, place: secretaire}
      - {qui: aulard, place: president}
    etapes:
      - {narration: "Le club-house, un mercredi. La porte du premier est ouverte, ce qui n'arrive que lorsque le président attend quelqu'un."}
      - {qui: toi, va: guichet}
      - {qui: josiane, dit: "Il a eu Massenet au téléphone, ce matin. Massenet lui a dit que vous ne saviez rien. Il l'a répété à l'étage, de très bonne humeur."}
      - {qui: aulard, dit: "Monte ! On me dit que tu ne sais rien. C'est ce que je préfère, chez un entraîneur."}
      - {qui: toi, pense: "Massenet ne donne jamais rien pour rien. Il a dû vendre ma phrase quelque part, même vide."}
      - {qui: josiane, dit: "Je vous ai gardé une tasse. Prenez-la avant de monter."}

  # Après l'assureur : l'article de Léa sur le réverbère, sur le bureau du président.
  - id: h2.ci.fusible_lea
    quand: carte
    prefixe: "en.h2.s1.assureur"
    moment: apres
    roles: [entraineur]
    si: "flag(histoire_h2) && flag(h2_lea_fusible)"
    lieu: clubhouse
    tranche: matin
    acteurs:
      - {qui: toi, place: guichet}
      - {qui: achard, place: visiteur_1}
      - {qui: aulard, place: president}
    etapes:
      - {narration: "Sur le bureau du président, entre la police et le téléphone, un article découpé dans L'Écho : un réverbère, une voiture, un électricien qui n'a rien changé."}
      - {qui: achard, dit: "Je ne crois pas aux fusibles qui sautent exactement quand une voiture disparaît. Votre journaliste non plus, apparemment."}
      - {qui: aulard, dit: "C'est elle qui écrit. Moi, je paie le papier, pas les points de suspension."}
      - {qui: achard, regarde: toi}
      - {qui: achard, dit: "Elle a un électricien, un réverbère et une heure. À ma place, vous demanderiez quoi, à un homme qui a une place de parking vide ?", ton: noir}

  - id: h2.ci.fusible_mairie
    quand: carte
    prefixe: "en.h2.s1.assureur"
    moment: apres
    roles: [entraineur]
    si: "flag(histoire_h2) && flag(h2_fusible_ecrit)"
    lieu: clubhouse
    tranche: matin
    acteurs:
      - {qui: toi, place: guichet}
      - {qui: achard, place: visiteur_1}
      - {qui: aulard, place: president}
    etapes:
      - {narration: "Sur le bureau du président, entre la police et le téléphone, un article de quatre lignes découpé dans L'Écho : un fusible, un réverbère éteint deux heures."}
      - {qui: achard, dit: "Un fusible. La mairie le dit, le journal le dit, et vous le dites. Je n'ai personne à qui opposer un électricien."}
      - {qui: aulard, dit: "Voilà. Un fusible."}
      - {qui: achard, dit: "Je note que tout le monde est d'accord. C'est rare, dans un dossier de deux millions.", ton: noir}

  # Après le feu du wagon : Roland s'est rasé, avec le rasoir que Monique a fait passer par Josiane.
  - id: h2.ci.rasoir_neuf
    quand: carte
    prefixe: "en.h2.s2.wagon_brule"
    moment: apres
    roles: [entraineur]
    si: "flag(histoire_h2) && flag(h2_rasoir_neuf)"
    lieu: friche
    tranche: nuit
    acteurs:
      - {qui: toi, place: [-1, -6]}
      - {qui: josiane, place: [-3, -5]}
      - {qui: mercadier, place: [-4, -4], pose: assis}
    etapes:
      - {narration: "Le wagon n'est plus qu'une charpente rouge. Roland, une couverture de pompier sur les épaules, a le menton rasé de frais, un bout de papier collé sur une coupure."}
      - {qui: josiane, dit: "Il s'est rasé ce soir, avec le rasoir neuf. Je lui ai demandé pour qui. Il a dit : au cas où."}
      - {qui: mercadier, dit: "On ne se laisse pas trouver avec cette tête-là, coach. Dites à Monique que le rasoir coupe bien."}
      - {narration: "Josiane lui remonte la couverture jusqu'au menton, sans un mot, comme on ferme un livre."}

paroles:
  # La compo du vendredi, gardée au sec.
  - qui: vukic
    sujet: toi
    si: "flag(histoire_h2) && flag(h2_compo_cahier)"
    texte: "Sa compo du vendredi, je la garde au sec. Vingt-deux heures, de sa main. Si un jour on me demande l'heure où il a cessé d'écrire."
  # « Le président, sûrement » : Massenet note tout, et ne publie pas.
  - qui: meneche
    sujet: toi
    si: "flag(histoire_h2) && flag(h2_accuse_president)"
    texte: "Vous m'avez dit : le président. Je le note, je ne le publie pas. Une phrase qu'on garde vaut plus qu'une phrase qu'on imprime."
  # « Demandez au président » : Achard y est allé.
  - qui: achard
    sujet: toi
    si: "flag(histoire_h2) && flag(h2_achard_president)"
    texte: "Vous m'avez envoyé chez le président. Il m'a reçu une heure, et il n'a pas dit un mot sur Mercadier. Je n'ai jamais autant appris."
  # Le rasoir neuf dans le cabas.
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h2) && flag(h2_rasoir_neuf)"
    texte: "Madame Mercadier m'a donné un rasoir neuf, dans sa boîte. Je l'ai mis dans le cabas, avec les sardines. On ne demande pas pour qui."
  # « Qu'il est vivant » : le président n'a pas demandé comment.
  - qui: aulard
    sujet: toi
    si: "flag(histoire_h2) && flag(h2_dit_vivant_au_president)"
    texte: "Josiane m'a dit « vivant ». Je n'ai pas demandé où. Dans un club, on ne demande jamais où : on demande combien."
  # La cigarette de la panne.
  - qui: norbert
    sujet: toi
    si: "flag(histoire_h2) && flag(h2_cigarette_norbert)"
    texte: "Vous avez fumé avec moi, dans la neige. Moi, je n'oublie pas qui a pris ma cigarette. Ça crée un lien, coach."
  # Le réverbère : deux versions, deux articles.
  - qui: lea
    sujet: toi
    si: "flag(histoire_h2) && flag(h2_lea_fusible)"
    texte: "Mon article sur le réverbère a fait quatre jours de bruit. Le président l'a découpé. D'habitude, il ne découpe jamais rien."
  - qui: lea
    sujet: toi
    si: "flag(histoire_h2) && flag(h2_fusible_ecrit)"
    texte: "Vous m'avez dit d'écrire « un fusible ». J'ai écrit un fusible. Je garde l'électricien dans un tiroir, au cas où."
