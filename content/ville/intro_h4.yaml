# HISTOIRE 4 — « LA ROUTE DE LA RIVE » : l'introduction distillée, et ce que la ville dit des choix
# du prologue et du livre (format : docs/histoires/scenes_jouees.md ; la charte :
# docs/bible/charte_histoire.md).
#
# L'introduction jouée tient en quatre répliques (cinematiques_h4.yaml, h4.ci.intro) : le
# club-house à sept heures, puis la première carte. Ce qu'elle disait avant — le Corner, le
# tabac du Quai, la rue des Lilas — vient ici, après les premiers choix : le Corner après la
# photo du carton (avec le cadre sous le bras, ou sans), le tabac après la radio du Doc, la rue
# des Lilas après la portière de Fardelli.
#
# Plus bas, ce que la ville dit des choix de la première semaine et du livre : une réplique ne fait
# pas avancer l'intrigue, elle prouve que le choix a été vu.
cinematiques:
  # Après la photo, quand tu as gardé le cadre : le Corner, la poire refusée, la chevalière.
  - id: h4.ci.corner_cadre
    quand: carte
    prefixe: "jp.fin.pro1_couloir"
    moment: apres
    roles: [joueur]
    si: "flag(histoire_h4) && flag(h4_photo_gardee)"
    lieu: bar
    tranche: soir
    acteurs:
      - {qui: toi, place: comptoir_1}
      - {qui: brehaut, place: comptoir_2}
      - {id: patron, qui: commercant, nom: "Le patron du Corner", place: patron}
    etapes:
      - {fondu: "Le soir. Le Corner."}
      - {narration: "Un flipper qui clignote pour personne. Le cadre de 1984 est sur le tabouret d'à côté, face au mur. Bréhaut, trente-trois ans, capitaine ; à son annulaire, une chevalière accroche le néon."}
      - {qui: patron, dit: "Une poire, pour les anciens de 84 ? La maison offre, comme à chaque reprise."}
      - {qui: brehaut, dit: "Deux bières. Pas de poire."}
      - {narration: "Le patron remonte la bouteille sur l'étagère du haut, l'étiquette tournée contre le mur. Il ne discute pas. Il a l'habitude."}
      - {qui: brehaut, dit: "Tu as gardé la photo. On y est tous les deux ; moi, je ne la regarde plus. Ta dernière année, alors : Fardelli me l'a dit avant toi."}
      - {qui: toi, pense: "Je dors bien. J'ai toujours bien dormi. C'est le matin, le problème."}
      - {qui: brehaut, dit: "Je te ramène ? J'ai la voiture devant."}
      - {qui: toi, dit: "Je rentre à pied."}
      - {narration: "Sur le zinc, sous son verre vide, un billet plié en quatre. La chevalière a laissé un rond dans la buée."}

  # Après la photo : le Corner, la poire refusée, la chevalière.
  - id: h4.ci.corner
    quand: carte
    prefixe: "jp.fin.pro1_couloir"
    moment: apres
    roles: [joueur]
    si: "flag(histoire_h4)"
    lieu: bar
    tranche: soir
    acteurs:
      - {qui: toi, place: comptoir_1}
      - {qui: brehaut, place: comptoir_2}
      - {id: patron, qui: commercant, nom: "Le patron du Corner", place: patron}
    etapes:
      - {fondu: "Le soir. Le Corner."}
      - {narration: "Un flipper qui clignote pour personne, la télé sur les résultats d'hier. Titi Bréhaut, trente-trois ans, capitaine ; à son annulaire, une chevalière accroche le néon de la vitrine chaque fois qu'il lève son verre."}
      - {qui: patron, dit: "Une poire, pour les anciens de 84 ? La maison offre, comme à chaque reprise."}
      - {qui: brehaut, dit: "Deux bières. Pas de poire."}
      - {narration: "Le patron remonte la bouteille sur l'étagère du haut, l'étiquette tournée contre le mur. Il ne discute pas. Il a l'habitude."}
      - {qui: brehaut, dit: "Ta dernière année, alors. Fardelli me l'a dit avant toi. Il me dit souvent les choses avant toi. Et le genou ? Tu dors, en ce moment ?"}
      - {qui: toi, pense: "Je dors bien. J'ai toujours bien dormi. C'est le matin, le problème."}
      - {qui: brehaut, dit: "Je te ramène ? J'ai la voiture devant."}
      - {qui: toi, dit: "Je rentre à pied."}
      - {narration: "Sur le zinc, sous son verre vide, un billet plié en quatre. La chevalière a laissé un rond dans la buée."}

  # Après la radio du Doc : le tabac du Quai, les paris, la mobylette dans la cour.
  - id: h4.ci.tabac_quai
    quand: carte
    prefixe: "jp.fin.pro2_table"
    moment: apres
    roles: [joueur]
    si: "flag(histoire_h4)"
    lieu: tabac
    tranche: soir
    acteurs:
      - {qui: toi, place: visiteur}
      - {qui: lavergne, place: patron}
      - {id: marinier, qui: ancien, nom: "Un marinier", place: marinier_1}
      - {id: autre, qui: passant, nom: "Un autre marinier", place: marinier_2}
    etapes:
      - {fondu: "Le soir. Le tabac du Quai."}
      - {narration: "À l'heure où l'on baisse le rideau, deux mariniers finissent une partie de dés sur le comptoir. Ici, on parie sur tout."}
      - {qui: marinier, dit: "Quinze matchs, c'est la clause, à ce qu'on dit. {pg, select, f{Elle} other{Il}} les fait, cette année ?"}
      - {qui: autre, dit: "Avec ce genou ? Cinquante francs qu'{pg, select, f{elle} other{il}} s'arrête avant Noël.", geste: pointe}
      - {son: argent}
      - {qui: lavergne, regarde: toi}
      - {qui: lavergne, dit: "Bonsoir, {toi}. Vous pariez sur vous, ce soir ?"}
      - {qui: toi, pense: "Jean Lavergne. Il me vend L'Écho tous les matins depuis 1985. Il ne m'a jamais rien demandé d'autre que le prix."}
      - {narration: "Par la porte de la cour, un moteur de mobylette tourne au ralenti. Personne ne va voir."}
      - {narration: "Lavergne tire le rideau de fer à mi-hauteur, et attend que tu te baisses pour passer dessous."}

  # Après la portière de Fardelli : la rue des Lilas, la montre qui retarde, la mobylette sans phare.
  - id: h4.ci.lilas
    quand: carte
    prefixe: "jp.fin.pro5_quatre"
    moment: apres
    roles: [joueur]
    si: "flag(histoire_h4)"
    lieu: appartement
    tranche: nuit
    acteurs:
      - {qui: toi, place: porte}
      - {qui: camille, place: fauteuil, pose: assis}
      - {qui: sacha, place: fenetre}
    etapes:
      - {fondu: "Minuit passé. Rue des Lilas."}
      - {narration: "Sur la table, la montre de la montée, gravée au dos : « Montée — merci ». Elle retarde de deux minutes. Tu ne l'as jamais fait régler."}
      - {qui: camille, dit: "Tu sens le quai. Tu es {pg, select, f{rentrée} other{rentré}} par le pont ? Fardelli a appelé deux fois : il t'emmène au restaurant."}
      - {qui: camille, dit: "Il dit qu'une dernière année, ça se soigne comme une première."}
      - {qui: toi, pense: "Camille ne sait rien de 1984. Elle sait seulement qu'un jour par an, je pars avec des fleurs, et que je rentre sans rien dire."}
      - {qui: sacha, dit: "Il y a une mobylette, en bas. Elle n'a pas de lumière. Elle attend."}
      - {qui: toi, va: fenetre}
      - {narration: "La rue des Lilas est vide. Le réverbère grésille au-dessus d'un trottoir où il n'y a personne. Plus loin, un moteur s'éloigne vers le quai."}
      - {qui: sacha, dit: "Demain, tu m'emmènes en voiture ? C'est moi qui dis où on tourne."}

  # Avant la plaquette, quand tu as laissé Mbako à côté de toi (h4_mbako_a_cote).
  - id: h4.ci.place_cedee
    quand: carte
    prefixe: "jp.fin.pro4_plaquette"
    moment: avant
    roles: [joueur]
    si: "flag(histoire_h4) && flag(h4_mbako_a_cote)"
    lieu: stade
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {qui: mbako, place: banc_2, pose: assis}
      - {qui: brehaut, place: banc_5, pose: assis}
    etapes:
      - {narration: "Le vestiaire, avant l'échauffement. À côté de ta place, un crochet que personne ne prenait : un sac de gamin y pend, ficelé à deux nœuds. Lian Mbako est assis dessous, les mains dans les manches."}
      - {qui: toi, va: banc_1}
      - {qui: brehaut, dit: "Le petit s'est collé à toi, tu as vu ? À son âge, on prend les vétérans pour des exemples. C'est un tort."}
      - {qui: mbako, dit: "Il paraît qu'ils veulent me mettre en couverture. J'ai dit que je préférais le crochet. Personne n'a rien noté."}
      - {qui: toi, pense: "Il m'a demandé comment on fait pour durer. Je n'avais pas de réponse qui tienne. Il s'en est contenté."}

  # Avant la plaquette : Mbako deux crochets plus loin, le regard sur ta place.
  - id: h4.ci.place_reprise
    quand: carte
    prefixe: "jp.fin.pro4_plaquette"
    moment: avant
    roles: [joueur]
    si: "flag(histoire_h4)"
    lieu: stade
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {qui: mbako, place: banc_3, pose: assis}
      - {qui: brehaut, place: banc_5, pose: assis}
    etapes:
      - {narration: "Le vestiaire, avant l'échauffement. Lian Mbako s'est assis deux crochets plus loin. Entre vous, ta place, et le regard du gamin, qui ne la lâche pas."}
      - {qui: toi, va: banc_1}
      - {qui: brehaut, dit: "Tu as bien fait de la lui reprendre. Ici, la place, c'est tout ce qu'on a. Le reste, on te le retire un jour sans prévenir."}
      - {qui: mbako, dit: "Il paraît qu'ils veulent me mettre en couverture. J'ai dit : demandez au coach d'abord. C'est sa place."}
      - {qui: toi, pense: "Il parle de la couverture comme d'un siège qu'on lui prêterait."}

  # Avant la commande de Sandrine, quand tu es entré en disant « j'étais au volant » (h4_dit_au_volant).
  - id: h4.ci.commande_volant
    quand: carte
    prefixe: "jp.h4.standard.commande"
    moment: avant
    roles: [joueur]
    si: "flag(histoire_h4) && flag(h4_dit_au_volant)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: sandrine, place: standard, pose: assis}
      - {id: veilleur, qui: passant, nom: "Le veilleur de nuit", place: reception}
    etapes:
      - {narration: "L'hôtel de la Rive, vingt heures. Le tableau du standard clignote de tous ses voyants ; Sandrine répond sans regarder les fiches."}
      - {qui: veilleur, dit: "Elle vous a vu entrer. Elle m'a dit : « C'est celui qui disait qu'il était au volant. » Elle n'a rien ajouté. Chez elle, ça suffit."}
      - {qui: sandrine, dit: "Hôtel de la Rive, bonsoir. Je vous passe la douze.", geste: telephone}
      - {qui: toi, pense: "Je lui ai dit que j'étais au volant. C'est ce qu'on me répète depuis six ans. Elle, elle sait la différence."}
      - {narration: "Elle ôte son casque et fait pivoter le fauteuil. Pour la première fois, elle te regarde en face."}

  # Avant la commande de Sandrine : celui qui demandait qui conduisait.
  - id: h4.ci.commande_qui
    quand: carte
    prefixe: "jp.h4.standard.commande"
    moment: avant
    roles: [joueur]
    si: "flag(histoire_h4)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: sandrine, place: standard, pose: assis}
      - {id: veilleur, qui: passant, nom: "Le veilleur de nuit", place: reception}
    etapes:
      - {narration: "L'hôtel de la Rive, vingt heures. Le tableau du standard clignote de tous ses voyants ; Sandrine répond sans regarder les fiches."}
      - {qui: veilleur, dit: "Elle vous a vu entrer. Elle m'a dit : « C'est celui qui demandait qui conduisait. » Elle n'a rien ajouté. Chez elle, ça suffit."}
      - {qui: sandrine, dit: "Hôtel de la Rive, bonsoir. Je vous passe la douze.", geste: telephone}
      - {qui: toi, pense: "Je lui ai demandé qui conduisait. C'était la bonne question. Elle attendait que je la pose à quelqu'un d'autre."}
      - {narration: "Elle ôte son casque et fait pivoter le fauteuil. Pour la première fois, elle te regarde en face."}

paroles:
  # La place de Mbako : il n'a pas bougé.
  - qui: brehaut
    sujet: toi
    si: "flag(histoire_h4) && flag(h4_mbako_a_cote) && saison == 1"
    texte: "Le petit mange à ta table, maintenant. Ne lui apprends pas à durer : lui apprendre, c'est lui apprendre à rester. Il a le temps de partir."
  # « Quelqu'un de 1984 » : Camille compte les visages de la photo.
  - qui: camille
    sujet: toi
    si: "flag(histoire_h4) && flag(h4_camille_1984) && !flag(divorce) && lieu == appartement"
    texte: "Tu m'as dit : quelqu'un de 1984. J'ai compté, sur la photo : vingt-deux visages, et un trou. Ça fait vingt-trois personnes à qui tu pourrais en vouloir."
  # Massenet : celui qui a appelé à minuit.
  - qui: meneche
    sujet: rumeur
    si: "flag(histoire_h4) && flag(h4_massenet_appel)"
    texte: "Il a appelé à minuit, en 1984. Je ne dis pas qui : tu le sais. Une voix qui ne dort pas, ça se reconnaît dans un téléphone."
  # « J'étais au volant » : Sandrine sait la différence.
  - qui: sandrine
    sujet: toi
    si: "flag(histoire_h4) && flag(h4_dit_au_volant)"
    texte: "Vous êtes entré en disant « j'étais au volant ». Vous mentiez bien : on vous l'a appris. Au micro, il faudra mentir moins bien."
  # « Laisse ma maison » : Bréhaut s'en souvient.
  - qui: brehaut
    sujet: toi
    si: "flag(histoire_h4) && flag(h4_maison_epargnee)"
    texte: "Je t'ai laissé ta maison. Je ne le dis pas pour me vanter. Je le dis parce que je n'ai pas grand-chose d'autre à te laisser."
  # « Depuis 1984 » : la date de Vukić.
  - qui: vukic
    sujet: toi
    si: "flag(histoire_h4) && flag(h4_vukic_date) && !flag(h4_cahier_lu)"
    texte: "Je t'ai dit que je te lirais ma date. Elle est dans le cahier. Elle attend la nuit où tu ne crieras pas dans le car."
  # « Qu'est-ce que je dis ? » : Rouvier garde le reste.
  - qui: rouvier
    sujet: toi
    si: "flag(histoire_h4) && flag(h4_rouvier_freine) && !flag(h4_fiche_hopital)"
    texte: "Vous m'avez demandé ce que vous disiez. Je vous ai répondu un mot. Je garde le reste : c'est mon métier de ne pas tout dire."
  # Le discours : Léa garde ses colonnes blanches.
  - qui: lea
    sujet: club
    si: "flag(histoire_h4) && flag(h4_discours_a_moi)"
    texte: "Deux colonnes blanches, lundi, si vous lisez votre papier. J'ai déjà le titre. Je ne vous le dis pas : un titre dit trop tôt, ça porte malheur."
