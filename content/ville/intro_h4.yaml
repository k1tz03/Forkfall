# HISTOIRE 4 — « LA ROUTE DE LA RIVE » : l'introduction distillée, et ce que la ville dit des choix
# du prologue et du livre (format : docs/histoires/scenes_jouees.md ; la charte :
# docs/bible/charte_histoire.md).
#
# L'introduction jouée tient en quatre répliques (cinematiques_h4.yaml, h4.ci.intro) : le
# club-house à sept heures, puis la première carte. Ce qu'elle disait avant — le Corner, le
# tabac du Quai, la rue des Lilas — vient ici, après les premiers choix : le Corner après la
# photo du carton (avec le cadre sous le bras, ou sans), le tabac après la radio du Doc, la rue
# des Lilas après la portière de Fardelli.
#
# Plus bas, ce que la ville dit des choix de la première semaine et du livre : une réplique ne fait
# pas avancer l'intrigue, elle prouve que le choix a été vu.
cinematiques:
  # Après la photo, quand tu as gardé le cadre : le Corner, la poire refusée, la chevalière.
  - id: h4.ci.corner_cadre
    quand: carte
    prefixe: "jp.fin.pro1_couloir"
    moment: apres
    roles: [joueur]
    si: "flag(histoire_h4) && flag(h4_photo_gardee)"
    lieu: bar
    tranche: soir
    acteurs:
      - {qui: toi, place: comptoir_1}
      - {qui: brehaut, place: comptoir_2}
      - {id: patron, qui: commercant, nom: "Le patron du Corner", place: patron}
    etapes:
      - {fondu: "Le soir. Le Corner."}
      - {narration: "Le flipper clignote, personne n'y joue. Le cadre de 1984 est posé sur le tabouret d'à côté, face au mur. Bréhaut, trente-trois ans, capitaine, a une chevalière à l'annulaire qui accroche le néon."}
      - {qui: patron, dit: "Une poire, pour les anciens de 84 ? La maison offre, comme à chaque reprise."}
      - {qui: brehaut, dit: "Deux bières. Pas de poire."}
      - {narration: "Le patron remonte la bouteille sur l'étagère du haut et la tourne, l'étiquette contre le mur, sans discuter."}
      - {qui: brehaut, dit: "T'as gardé la photo. On y est tous les deux, moi je la regarde plus. Ta dernière année, alors ? Fardelli me l'a dit avant toi."}
      - {qui: toi, pense: "Je dors bien. J'ai toujours bien dormi. C'est le matin, le problème."}
      - {qui: brehaut, dit: "Je te ramène ? J'ai la voiture devant."}
      - {qui: toi, dit: "Je rentre à pied."}
      - {narration: "Sur le zinc, sous son verre vide, un billet plié en quatre. La chevalière a laissé un rond dans la buée."}

  # Après la photo : le Corner, la poire refusée, la chevalière.
  - id: h4.ci.corner
    quand: carte
    prefixe: "jp.fin.pro1_couloir"
    moment: apres
    roles: [joueur]
    si: "flag(histoire_h4)"
    lieu: bar
    tranche: soir
    acteurs:
      - {qui: toi, place: comptoir_1}
      - {qui: brehaut, place: comptoir_2}
      - {id: patron, qui: commercant, nom: "Le patron du Corner", place: patron}
    etapes:
      - {fondu: "Le soir. Le Corner."}
      - {narration: "Le flipper clignote, personne n'y joue ; la télé repasse les résultats d'hier. Titi Bréhaut, trente-trois ans, capitaine, porte une chevalière qui accroche le néon de la vitrine chaque fois qu'il lève son verre."}
      - {qui: patron, dit: "Une poire, pour les anciens de 84 ? La maison offre, comme à chaque reprise."}
      - {qui: brehaut, dit: "Deux bières. Pas de poire."}
      - {narration: "Le patron remonte la bouteille sur l'étagère du haut et la tourne, l'étiquette contre le mur, sans discuter."}
      - {qui: brehaut, dit: "Ta dernière année, alors. Fardelli me l'a dit avant toi, comme d'habitude. Et le genou ? Tu dors, en ce moment ?"}
      - {qui: toi, pense: "Je dors bien. J'ai toujours bien dormi. C'est le matin, le problème."}
      - {qui: brehaut, dit: "Je te ramène ? J'ai la voiture devant."}
      - {qui: toi, dit: "Je rentre à pied."}
      - {narration: "Sur le zinc, sous son verre vide, un billet plié en quatre. La chevalière a laissé un rond dans la buée."}

  # Après la radio du Doc : le tabac du Quai, les paris, la mobylette dans la cour.
  - id: h4.ci.tabac_quai
    quand: carte
    prefixe: "jp.fin.pro2_table"
    moment: apres
    roles: [joueur]
    si: "flag(histoire_h4)"
    lieu: tabac
    tranche: soir
    acteurs:
      - {qui: toi, place: visiteur}
      - {qui: lavergne, place: patron}
      - {id: marinier, qui: ancien, nom: "Un marinier", place: marinier_1}
      - {id: autre, qui: passant, nom: "Un autre marinier", place: marinier_2}
    etapes:
      - {fondu: "Le soir. Le tabac du Quai."}
      - {narration: "À l'heure où l'on baisse le rideau, deux mariniers finissent une partie de dés sur le comptoir, un billet de dix francs sous le gobelet."}
      - {qui: marinier, dit: "Quinze matchs, c'est la clause, à ce qu'on dit. {pg, select, f{Elle} other{Il}} les fait, cette année ?"}
      - {qui: autre, dit: "Avec ce genou ? Cinquante francs qu'{pg, select, f{elle} other{il}} s'arrête avant Noël.", geste: pointe}
      - {son: argent}
      - {qui: lavergne, regarde: toi}
      - {qui: lavergne, dit: "Bonsoir, {toi}. Vous pariez sur vous, ce soir ?"}
      - {qui: toi, pense: "Jean Lavergne. Il me vend L'Écho tous les matins depuis 1985, et il m'a jamais rien demandé d'autre que le prix."}
      - {narration: "Par la porte de la cour, un moteur de mobylette tourne au ralenti. Personne ne va voir."}
      - {narration: "Lavergne tire le rideau de fer à mi-hauteur, et attend que tu te baisses pour passer dessous."}

  # Après la portière de Fardelli : la rue des Lilas, la montre qui retarde, la mobylette sans phare.
  - id: h4.ci.lilas
    quand: carte
    prefixe: "jp.fin.pro5_quatre"
    moment: apres
    roles: [joueur]
    si: "flag(histoire_h4)"
    lieu: appartement
    tranche: nuit
    acteurs:
      - {qui: toi, place: porte}
      - {qui: camille, place: fauteuil, pose: assis}
      - {qui: sacha, place: fenetre}
    etapes:
      - {fondu: "Minuit passé. Rue des Lilas."}
      - {narration: "Sur la table, la montre de la montée, gravée au dos : « Montée — merci ». Elle retarde de deux minutes. Tu ne l'as jamais fait régler."}
      - {qui: camille, dit: "Tu sens le quai. T'es {pg, select, f{rentrée} other{rentré}} par le pont ? Fardelli a appelé deux fois, il t'emmène au restaurant."}
      - {qui: camille, dit: "Il dit qu'une dernière année, ça se soigne comme une première."}
      - {qui: toi, pense: "Camille sait rien de 1984. Elle sait seulement qu'un jour par an, je pars avec des fleurs et que je rentre tard."}
      - {qui: sacha, dit: "Y a une mobylette, en bas. Elle a pas de lumière. Elle attend quoi ?"}
      - {qui: toi, va: fenetre}
      - {narration: "La rue des Lilas est vide. Le réverbère grésille au-dessus d'un trottoir où il n'y a personne. Plus loin, un moteur s'éloigne vers le quai."}
      - {qui: sacha, dit: "Demain, tu m'emmènes en voiture ? C'est moi qui dis à gauche ou à droite."}

  # Avant la plaquette, quand tu as laissé Mbako à côté de toi (h4_mbako_a_cote).
  - id: h4.ci.place_cedee
    quand: carte
    prefixe: "jp.fin.pro4_plaquette"
    moment: avant
    roles: [joueur]
    si: "flag(histoire_h4) && flag(h4_mbako_a_cote)"
    lieu: stade
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {qui: mbako, place: banc_2, pose: assis}
      - {qui: brehaut, place: banc_5, pose: assis}
    etapes:
      - {narration: "Le vestiaire, avant l'échauffement. Au crochet d'à côté, que personne ne prenait, pend un sac de gamin ficelé à deux nœuds. Lian Mbako est assis dessous, les mains dans les manches."}
      - {qui: toi, va: banc_1}
      - {qui: brehaut, dit: "Le petit s'est collé à toi, t'as vu ? Il croit que tu vas lui apprendre quelque chose."}
      - {qui: mbako, dit: "Ils veulent me mettre en couverture, il paraît. J'ai dit que je préférais le crochet. Personne a noté."}
      - {qui: toi, pense: "Il m'a demandé comment on fait pour durer. J'avais rien de bien à lui dire. Ça lui a suffi."}

  # Avant la plaquette : Mbako deux crochets plus loin, le regard sur ta place.
  - id: h4.ci.place_reprise
    quand: carte
    prefixe: "jp.fin.pro4_plaquette"
    moment: avant
    roles: [joueur]
    si: "flag(histoire_h4)"
    lieu: stade
    tranche: matin
    acteurs:
      - {qui: toi, place: porte}
      - {qui: mbako, place: banc_3, pose: assis}
      - {qui: brehaut, place: banc_5, pose: assis}
    etapes:
      - {narration: "Le vestiaire, avant l'échauffement. Lian Mbako s'est assis deux crochets plus loin, et il garde les yeux sur ta place."}
      - {qui: toi, va: banc_1}
      - {qui: brehaut, dit: "T'as bien fait de la reprendre. Le petit, il en trouvera une autre."}
      - {qui: mbako, dit: "Ils veulent me mettre en couverture, il paraît. J'ai dit de demander au coach d'abord. C'est sa place."}
      - {qui: toi, pense: "La couverture, pour lui, c'est un crochet de plus. Il attend qu'on lui dise lequel."}

  # Avant la commande de Sandrine, quand tu es entré en disant « j'étais au volant » (h4_dit_au_volant).
  - id: h4.ci.commande_volant
    quand: carte
    prefixe: "jp.h4.standard.commande"
    moment: avant
    roles: [joueur]
    si: "flag(histoire_h4) && flag(h4_dit_au_volant)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: sandrine, place: standard, pose: assis}
      - {id: veilleur, qui: passant, nom: "Le veilleur de nuit", place: reception}
    etapes:
      - {narration: "L'hôtel de la Rive, vingt heures. Le tableau du standard clignote de tous ses voyants ; Sandrine répond sans regarder les fiches."}
      - {qui: veilleur, dit: "Elle vous a vu entrer. Elle m'a dit « C'est celui qui disait qu'il était au volant », et elle a repris ses fiches."}
      - {qui: sandrine, dit: "Hôtel de la Rive, bonsoir. Je vous passe la douze.", geste: telephone}
      - {qui: toi, pense: "Je lui ai dit que j'étais au volant. C'est ce qu'on me répète depuis six ans. Elle, elle sait."}
      - {narration: "Elle ôte son casque et fait pivoter le fauteuil vers toi. Cette fois, elle te regarde en face."}

  # Avant la commande de Sandrine : celui qui demandait qui conduisait.
  - id: h4.ci.commande_qui
    quand: carte
    prefixe: "jp.h4.standard.commande"
    moment: avant
    roles: [joueur]
    si: "flag(histoire_h4)"
    lieu: hotel
    tranche: soir
    acteurs:
      - {qui: toi, place: porte}
      - {qui: sandrine, place: standard, pose: assis}
      - {id: veilleur, qui: passant, nom: "Le veilleur de nuit", place: reception}
    etapes:
      - {narration: "L'hôtel de la Rive, vingt heures. Le tableau du standard clignote de tous ses voyants ; Sandrine répond sans regarder les fiches."}
      - {qui: veilleur, dit: "Elle vous a vu entrer. Elle m'a dit « C'est celui qui demandait qui conduisait », et elle a repris ses fiches."}
      - {qui: sandrine, dit: "Hôtel de la Rive, bonsoir. Je vous passe la douze.", geste: telephone}
      - {qui: toi, pense: "Je lui ai demandé qui conduisait. Elle attendait que je pose la question, mais pas à elle."}
      - {narration: "Elle ôte son casque et fait pivoter le fauteuil vers toi. Cette fois, elle te regarde en face."}

paroles:
  # La place de Mbako : il n'a pas bougé.
  - qui: brehaut
    sujet: toi
    si: "flag(histoire_h4) && flag(h4_mbako_a_cote) && saison == 1"
    texte: "Le petit mange à ta table, maintenant. Lui apprends pas à durer. Il a encore le temps de partir d'ici."
  # « Quelqu'un de 1984 » : Camille compte les visages de la photo.
  - qui: camille
    sujet: toi
    si: "flag(histoire_h4) && flag(h4_camille_1984) && !flag(divorce) && lieu == appartement"
    texte: "Tu m'as dit « quelqu'un de 1984 ». Sur la photo, y a vingt-deux visages et un trou. Ça fait vingt-trois personnes à qui tu pourrais en vouloir."
  # Massenet : celui qui a appelé à minuit.
  - qui: meneche
    sujet: rumeur
    si: "flag(histoire_h4) && flag(h4_massenet_appel)"
    texte: "Il a appelé à minuit, en 1984. Je dis pas qui, tu le sais. Une voix qui a pas dormi, je la reconnais au téléphone."
  # « J'étais au volant » : Sandrine sait la différence.
  - qui: sandrine
    sujet: toi
    si: "flag(histoire_h4) && flag(h4_dit_au_volant)"
    texte: "Vous m'avez dit « j'étais au volant ». Vous mentez bien, on vous l'a appris. Au micro, faudra mentir moins bien."
  # « Laisse ma maison » : Bréhaut s'en souvient.
  - qui: brehaut
    sujet: toi
    si: "flag(histoire_h4) && flag(h4_maison_epargnee)"
    texte: "Je t'ai laissé ta maison. Je dis pas ça pour me vanter. J'ai pas grand-chose d'autre à te laisser."
  # « Depuis 1984 » : la date de Vukić.
  - qui: vukic
    sujet: toi
    si: "flag(histoire_h4) && flag(h4_vukic_date) && !flag(h4_cahier_lu)"
    texte: "Je t'ai dit que je te lirais ma date. Elle est dans le cahier. Je te la lis la nuit où tu crieras pas dans le car."
  # « Qu'est-ce que je dis ? » : Rouvier garde le reste.
  - qui: rouvier
    sujet: toi
    si: "flag(histoire_h4) && flag(h4_rouvier_freine) && !flag(h4_fiche_hopital)"
    texte: "Vous m'avez demandé ce que vous disiez. Je vous ai donné un mot. Le reste, je le garde pour moi."
  # Le discours : Léa garde ses colonnes blanches.
  - qui: lea
    sujet: club
    si: "flag(histoire_h4) && flag(h4_discours_a_moi)"
    texte: "Deux colonnes blanches lundi, si vous lisez votre papier. J'ai déjà le titre. Je vous le dis pas, ça porte malheur."
