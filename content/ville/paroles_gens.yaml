# LES GENS D'AUBÉRIVE — ce que disent les anonymes quand on les touche en ville.
#
# Une réplique sert à quelque chose : elle donne une information (l'humeur du
# quartier après une mauvaise passe, le classement vu du comptoir, une rumeur qui
# annonce ou prolonge une intrigue, un conseil), ou elle fait exister la ville (un
# détail concret du quartier). Pas de remplissage, pas de formule qui revient, pas
# de sketch : docs/bible/charte_histoire.md fait loi ici comme dans les cartes.
#
#   qui   : passant | passante | enfant | fan | ancien | commercant
#   sujet : match | classement | club | toi | argent | rumeur | quartier | epoque
#           | sombre | sponsor | achat
#   si    : la grammaire de la ville, ET seulement (voir content/ville.yaml et le
#           compilateur) ; sans `si`, la réplique doit tenir en toute circonstance :
#           toute année de 1990 à 2050, les deux rôles, toute heure, tout état.
#   texte : 160 caractères au plus, ce que la personne dit, sans guillemets autour.
#
# Avant d'ajouter une ligne :
# - serie_v / serie_d comptent des blocs de six matchs (quatre victoires, ou quatre
#   défaites, au moins) et un bloc moyen ne les remet pas à zéro : on parle d'une
#   tendance (« depuis trois semaines »), jamais du score exact de samedi.
# - le rang provisoire vaut 1, 4, 5 à 17 ou 18 : « en haut », c'est rang <= 4, le
#   bas du tableau 16 et plus ; il ne veut rien dire avant deux blocs (journee >= 12).
#   La coquille écrit `{rang}` avec son ordinal (« 1er », « 16e ») : pas de « e » après.
# - le joueur peut être une femme : aucun accord sur lui ou elle (ni « je t'ai vu »,
#   ni « tu es venu »). Une passante s'accorde au féminin ; un enfant, un fan, un
#   ancien ne s'accordent pas.
# - qui circule quand (packages/tools/web/ville.js) : la nuit, seulement des passants
#   et des passantes ; un commerçant ne parle que devant le lieu où la coquille le
#   poste (`COMMERCES`), et son `lieu == ...` est ce lieu-là.
# - un objet daté (Minitel, cassette, portable, écus, le Flux, la vidéo…) porte sa
#   condition d'année ou le drapeau `monde_*` qui l'a fait entrer dans le monde.
# - une rumeur lit une intrigue en cours (`arc(...)`) ou une trace (`flag(...)`) :
#   la ville apprend ce qui t'arrive, souvent avant toi, parfois de travers.
paroles:

  # ════════════════════════════════════════════════════ PASSANTS ET PASSANTES

  # — le match (la tendance, vue du trottoir)
  - qui: passante
    sujet: match
    si: "serie_d >= 2"
    texte: "Mon mari rentre du stade, il pose ses clés et il file au garage. Trois semaines comme ça. Il m'explique même plus le hors-jeu."
  - qui: passant
    sujet: match
    si: "serie_d >= 2 && role == entraineur"
    texte: "Au café de la Mairie, y a un conseiller qui réclame « un électrochoc ». Son électrochoc, c'est un entraîneur qui vide son bureau un lundi."
  - qui: passant
    sujet: match
    si: "serie_d >= 2 && role == joueur"
    texte: "Au café, ils réclament « du sang neuf ». Moi, j'ai demandé qui allait faire ses valises. Ils ont regardé leur verre."
  - qui: passante
    sujet: match
    si: "serie_d >= 3"
    texte: "Dimanche, à Saint-Aubin, le curé a fait prier pour le club. Entre les morts de la semaine et les malades. Et personne a souri."
  - qui: passant
    sujet: match
    si: "serie_d >= 1 && tribunes < 40"
    texte: "Au comptoir du Corner, le match, on en parle plus. On parle de toi, et on baisse la voix quand la porte s'ouvre."
  - qui: passante
    sujet: match
    si: "serie_d >= 1 && jour == dim"
    texte: "Hier soir, y en a un qui a jeté son écharpe du haut du pont. Elle est restée accrochée à une branche, en bas du quai. Personne descend la chercher."
  - qui: passant
    sujet: match
    si: "serie_v >= 2"
    texte: "La boulangère a ressorti les fanions de sa vitrine. Elle les avait rangés avec les guirlandes de Noël, dans le même carton."
  - qui: passant
    sujet: match
    si: "serie_v >= 1 && jour == dim"
    texte: "Hier soir, ils chantaient encore sur le pont à minuit. Et pas un coup de fil à la police. Même pas la voisine du dessus."
  - qui: passant
    sujet: match
    si: "serie_v >= 2 && role == joueur"
    texte: "Le coiffeur de la rue du Marché a mis ta photo dans sa vitrine. Il dit que si ça tourne mal, il la retourne contre la vitre."
  - qui: passant
    sujet: match
    si: "jour == sam && tranche == matin"
    texte: "Quinze heures, c'est ça ? Je finis ma tournée de colis à deux heures. En Nord pour l'échauffement, en tenue de travail, tant pis."

  # — le classement
  - qui: passant
    sujet: classement
    si: "rang == 1 && journee >= 12"
    texte: "Premiers. Au café de la Mairie, ils ont découpé le classement de L'Écho et l'ont collé sur le miroir, au-dessus des bouteilles."
  - qui: passante
    sujet: classement
    si: "rang <= 4 && division == 1 && journee >= 12"
    texte: "Si ça tient jusqu'en mai, on joue la Coupe Continentale. Mon mari a déjà acheté une carte routière du continent. Il la déplie sur le lit."
  - qui: passant
    sujet: classement
    si: "rang >= 16 && journee >= 12"
    texte: "{rang}. Le kiosque du quai affiche plus le classement. Il a mis la météo à la place. Il dit que c'est moins triste."
  - qui: passante
    sujet: classement
    si: "rang == 18 && journee >= 12"
    texte: "Derniers. Ma mère, qui y connaît rien, m'a demandé si c'était grave. J'ai dit non. Elle m'a regardée par-dessus ses lunettes."
  - qui: passant
    sujet: classement
    si: "division == 2"
    texte: "La {division}, c'est les déplacements en car et les terrains gras. Mon père y allait en train, avec un casse-croûte pour deux jours."
  - qui: passante
    sujet: classement
    si: "phase == presaison"
    texte: "Les abonnements, c'est à la boutique du club, le mercredi et le samedi après-midi. Mon mari attend toujours d'avoir vu un match ou deux. Il se méfie."
  - qui: passante
    sujet: classement
    si: "phase == bilan"
    texte: "La saison est finie. Le kiosquier range les écharpes dans un carton jusqu'en août, et il écrit l'année dessus, au feutre."
  - qui: passant
    sujet: classement
    si: "phase == hiver"
    texte: "La trêve. Le stade est fermé, les grilles cadenassées. On passe devant quand même, le samedi à quinze heures, par habitude."

  # — le club et son argent
  - qui: passante
    sujet: argent
    si: "caisse < 25"
    texte: "Ma sœur fait le ménage au club-house. Ce mois-ci, sa paie est arrivée en deux fois, la deuxième en liquide, dans une enveloppe."
  - qui: passant
    sujet: club
    si: "caisse < 20"
    texte: "Le club serait à vendre, à ce qu'on dit. Mardi, y avait un type qui mesurait la pelouse au décamètre. Il a parlé à personne."
  - qui: passante
    sujet: argent
    si: "caisse > 75"
    texte: "Le club a fait repeindre les grilles du guichet, deux couches. La dernière fois, c'était pour la visite d'un ministre."
  - qui: passant
    sujet: club
    si: "direction < 25 && role == entraineur"
    texte: "Le président déjeunait à la brasserie du Pont avec un type en survêtement, et pas de nos couleurs. Ils ont pris le dessert. Et le café derrière."
  - qui: passante
    sujet: club
    si: "direction < 25 && role == joueur"
    texte: "Le président a montré ta fiche à un monsieur, au café de la Mairie. Il la pliait en quatre, il la dépliait. Il cherche preneur, si tu veux mon avis."
  - qui: passant
    sujet: club
    si: "direction > 80 && role == entraineur"
    texte: "Le président dit du bien de toi à tout le monde, au café de la Mairie. Méfie-toi. Il disait pareil de celui d'avant, en octobre."
  - qui: passant
    sujet: club
    si: "vestiaire < 25"
    texte: "Les joueurs mangent plus ensemble après l'entraînement. Le patron du Corner les voit arriver un par un, chacun sa table."

  # — toi
  - qui: passant
    sujet: toi
    si: "tribunes > 75 && role == joueur"
    texte: "Mon fils a voulu ton numéro sur son maillot d'anniversaire. Le flocage coûte plus cher que le maillot. J'ai payé quand même."
  - qui: passant
    sujet: toi
    si: "tribunes < 25"
    texte: "À ta place, je passerais pas par la rue du Stade, le soir. Prends par le quai. C'est plus long, mais c'est éclairé."
  - qui: passante
    sujet: toi
    si: "tribunes < 25"
    texte: "Mon mari a craché par terre quand votre nom est passé à la radio. Dans la cuisine. Lui qui crache jamais."
  - qui: passant
    sujet: toi
    si: "role == entraineur"
    texte: "Pourquoi il joue jamais, le petit gaucher ? Tout le quartier se le demande. Moi, je dis que vous savez des choses qu'on sait pas."
  - qui: passant
    sujet: toi
    si: "role == joueur && tribunes > 50"
    texte: "Mardi, devant le terrain annexe, y avait une voiture de location, plaque de la Capitale. Les recruteurs louent toujours, ça se voit à l'autocollant."
  - qui: passante
    sujet: toi
    si: "saison == 1"
    texte: "C'est vous, au troisième, rue des Lilas ? La chaudière qui cogne, je sais. Ça fait des années. Tapez deux coups sur le tuyau, ça la calme."
  - qui: passant
    sujet: toi
    si: "saison >= 4"
    texte: "Tu dis « la Rive », maintenant, comme nous. Plus « le stade de la ». T'es d'ici, ou presque."
  - qui: passante
    sujet: toi
    si: "eveil >= 5"
    texte: "Vous avez une mine de papier mâché. Rentrez dormir. Le pharmacien vend pas de sommeil, j'ai déjà demandé."
  - qui: passant
    sujet: toi
    si: "eveil >= 5 && tranche == matin"
    texte: "T'as dormi, cette nuit ? T'as le teint des gars de l'équipe de nuit. La boulangerie fait du café dès six heures."
  - qui: passant
    sujet: toi
    si: "relation.gege <= -2"
    texte: "Gégé dit plus ton nom, à la buvette. Il dit « l'autre ». Et les gars rigolent pas, quand il dit ça."
  - qui: passant
    sujet: toi
    si: "relation.meneche <= -2"
    texte: "Massenet a dit au Corner qu'il garde un truc sur toi « pour le bon moment ». Assez fort pour qu'on l'entende du trottoir d'en face."
  - qui: passante
    sujet: toi
    si: "relation.camille <= -2 && !flag(divorce)"
    texte: "Camille va s'asseoir au vieux lavoir, le soir. Longtemps. Je la vois de ma fenêtre. Bon, je sais pas si je devais vous le dire."
  - qui: passant
    sujet: rumeur
    si: "flag(divorce)"
    texte: "Camille a pris le car de sept heures pour la Capitale, avec deux valises. La boulangère l'a vue. Alors forcément, toute la rue."

  # — l'époque (un objet daté porte son année ou son drapeau de monde)
  - qui: passant
    sujet: epoque
    si: "annee <= 1994"
    texte: "Les résultats de la journée, je les ai sur le Minitel de ma belle-sœur. Elle me fait payer la minute en café. Elle a l'œil sur la pendule."
  - qui: passante
    sujet: epoque
    si: "annee <= 1996"
    texte: "Le match passe sur la télé régionale à vingt-trois heures, trois minutes de résumé. Mon père l'enregistre sur cassette pour revoir les buts."
  - qui: passante
    sujet: epoque
    si: "flag(monde_cobalts_1990) && annee <= 1991"
    texte: "La Coupe d'été perdue au point de penalty… Tout le bar s'est assis d'un coup. Mon fils, six ans, il a demandé si on pouvait la rejouer demain."
  - qui: passant
    sujet: epoque
    si: "annee >= 1998 && annee <= 2006"
    texte: "Mon fils a un portable. Le score de la mi-temps, il le reçoit par texto, et il me le lit à table comme une dépêche."
  - qui: passante
    sujet: epoque
    si: "flag(monde_ecus) && annee <= 2005"
    texte: "Deux écus le demi, au Corner. Je refais le calcul en francs, et je repose le verre. Mon mari, lui, il le finit."
  - qui: passante
    sujet: epoque
    si: "flag(monde_titre_2002)"
    texte: "Les Cobalts ont gagné, là-bas ! Mon mari a klaxonné sur le pont jusqu'à quatre heures du matin. Lui qui klaxonne même pas aux mariages."
  - qui: passant
    sujet: epoque
    si: "flag(monde_flux) && annee >= 2008"
    texte: "Ma fille me lit ce qu'ils écrivent sur toi, sur le Flux, le soir. Y a des trucs que j'aurais jamais osé crier au stade."
  - qui: passante
    sujet: epoque
    si: "flag(monde_video)"
    texte: "Maintenant, quand on marque, on attend trois minutes avant de crier. Mon mari crie quand même, et il se rassoit quand ils annulent."
  - qui: passant
    sujet: epoque
    si: "annee >= 2035"
    texte: "Au stade, on paie plus rien en liquide. La buvette a gardé sa boîte en fer pour les pièces, au cas où. Vide, sur le comptoir."
  - qui: passant
    sujet: epoque
    si: "flag(monde_franchises)"
    texte: "C'est voté, la première division est fermée. Ceux qui sont dedans y sont pour de bon. Ceux qui sont dehors, ils peuvent regarder par la fenêtre."

  # — le quartier
  - qui: passante
    sujet: quartier
    texte: "La péniche, La Belle Aube, elle a pas bougé du quai depuis trois ans. Le marinier dit qu'il attend une crue. Moi, je crois qu'il attend quelqu'un."
  - qui: passant
    sujet: quartier
    texte: "Le car de sept heures cinq pour la Capitale, c'est au quai 3. Si on le rate, le suivant, c'est demain. Je l'ai raté une fois, j'ai dormi au Terminus."
  - qui: passante
    sujet: quartier
    texte: "Le vieux lavoir de la rue haute, ça résonne, sous le toit. On entend tout ce qui se dit sur la place. Alors faites attention, hein."
  - qui: passant
    sujet: quartier
    texte: "À Saint-Aubin, y a toujours un cierge allumé pour le club. Personne sait qui le paie. Le curé jure que c'est pas lui."
  - qui: passant
    sujet: quartier
    texte: "La friche de l'usine, on y jouait, gamins, entre les bobines de fil de fer. Maintenant, on y envoie plus les gamins. Même le facteur fait le tour."
  - qui: passante
    sujet: quartier
    texte: "La laverie de la rue du Stade ferme à vingt-deux heures. Après, y a plus que le néon, et ceux qui ont pas de machine chez eux."
  - qui: passant
    sujet: quartier
    texte: "Les biscuits Dornois, « depuis 1921 », sur le pignon du square. Ma grand-mère y emballait des sablés, rue des Tanneurs. Ça sentait le beurre jusqu'au pont."
  - qui: passant
    sujet: quartier
    si: "jour == dim && tranche == matin"
    texte: "Le dimanche matin, au marché, les maraîchers vous rendent le score avant la monnaie. Et leur avis avec, gratuit."
  - qui: passante
    sujet: quartier
    si: "jour == dim && serie_d >= 1"
    texte: "Au marché, ce matin, on a parlé de la pluie, des poireaux, de la fille du boucher. Du match, rien."
  - qui: passante
    sujet: quartier
    si: "annee <= 2010"
    texte: "Le vidéo-club ferme à vingt heures, mais si on frappe, il rouvre. Il a les matchs de 1974 en cassette, sous le comptoir, pour les habitués."
  - qui: passante
    sujet: quartier
    si: "jour == mer && tranche == aprem"
    texte: "Le mercredi, les mères attendent devant le préfabriqué du centre de formation. Elles se parlent pas. Elles regardent la liste sur la porte."

  # — la nuit
  - qui: passant
    sujet: sombre
    si: "tranche == nuit"
    texte: "À cette heure-ci, évitez la friche. Y a un feu de palettes, des types autour, et ils se taisent quand on approche. Moi, je fais le tour."
  - qui: passante
    sujet: sombre
    si: "tranche == nuit"
    texte: "Je rentre de la clinique, j'étais de nuit. Traînez pas. Deux sacs arrachés rue du Stade cette semaine, et pas un témoin."
  - qui: passant
    sujet: sombre
    si: "tranche == nuit"
    texte: "L'arrière-salle du Terminus est allumée. Regardez devant la gare routière, les grosses voitures, là. C'est pas des plaques d'ici."
  - qui: passante
    sujet: sombre
    si: "tranche == nuit && !flag(histoire_h2)"
    texte: "Le wagon au bout de la voie de l'usine, y a quelqu'un qui dort dedans. Un gamin, je crois, avec un sac de sport du club. J'en ai parlé à personne."
  - qui: passant
    sujet: sombre
    si: "tranche == nuit && jour == ven && role == joueur"
    texte: "T'es dehors à cette heure, la veille d'un match ? Un type avec un appareil, et t'es en page trois lundi. Rentre."
  - qui: passant
    sujet: sombre
    si: "tranche == nuit && jour == ven && role == entraineur"
    texte: "Ton gardien était au Corner il y a une heure. Il buvait de l'eau, mais il était au Corner, la veille d'un match."
  - qui: passant
    sujet: sombre
    si: "tranche == nuit && tribunes < 30"
    texte: "Rentre pas par la rue des Lilas, ce soir. Y a des écharpes sous le réverbère de la boulangerie. Et le pain, c'est pas avant six heures."

  # — les rumeurs : la ville suit l'histoire (intrigues en cours, traces posées)
  - qui: passant
    sujet: rumeur
    si: "arc(en.salaires_retard)"
    texte: "Le 5, au distributeur du centre commercial, y avait trois joueurs à la file. Ils sont repartis sans billets, les mains dans les poches."
  - qui: passante
    sujet: rumeur
    si: "flag(salaires_avances)"
    texte: "Il paraît que vous avez avancé la paie des joueurs de votre poche. C'est la banque qui l'a raconté, avant le président. Ma cousine est au guichet."
  - qui: passant
    sujet: rumeur
    si: "arc(en.nassir_proprietaire)"
    texte: "À l'hôtel de la Rive, un homme commande du thé à minuit et laisse des pourboires en billets neufs. D'après le portier, il veut le club."
  - qui: passante
    sujet: rumeur
    si: "arc(en.prodige)"
    texte: "Le petit Mbako… Une voiture pas d'ici l'attend tous les mercredis devant le centre. Sa mère la chasse avec son cabas."
  - qui: passant
    sujet: rumeur
    si: "flag(mbako_vendu)"
    texte: "Ils ont vendu le petit Mbako. Sa mère a baissé le rideau deux jours, pas un papier sur la vitre. Le troisième, elle a rouvert plus tôt."
  - qui: passant
    sujet: rumeur
    si: "arc(en.espion_haie)"
    texte: "Tous les matins, un type en casquette derrière les thuyas du terrain annexe. Sans chien. Dans le quartier, qui c'est qui traîne là sans chien ?"
  - qui: passante
    sujet: rumeur
    si: "arc(en.enveloppe)"
    texte: "Fardelli, l'agent, déjeunait au café de la Mairie avec un monsieur qui mangeait rien. Il est reparti sans son journal. Un journal épais comme ça."
  - qui: passant
    sujet: rumeur
    si: "flag(enveloppe_rival)"
    texte: "Trois joueurs de {rival} ont marché tout le match. Mon cousin habite là-bas. D'après lui, chez eux, on parle d'argent. Et de nous."
  - qui: passante
    sujet: rumeur
    si: "arc(en.fils_aulard)"
    texte: "Le fils du président s'entraîne avec les pros, à trente-quatre ans. Des crampons tout neufs, encore brillants. On en dit pas plus, au Corner."
  - qui: passant
    sujet: rumeur
    si: "arc(en.adjoint_dine)"
    texte: "Ton adjoint dînait mardi à la brasserie du Pont. Deux couverts, l'addition à son nom. Et l'autre couvert, c'était pas toi."
  - qui: passante
    sujet: rumeur
    si: "arc(en.commission_discipline)"
    texte: "Vous passez devant la commission, à ce qu'on lit. Salle 3, à la Capitale : mon cousin y est allé en 1987. On attend jusqu'à midi, il dit."
  - qui: passant
    sujet: rumeur
    si: "flag(pari_promu)"
    texte: "Quelqu'un a misé sur le titre à cinq mille contre un, au tabac du Quai. Le patron jure que c'est quelqu'un du club. Il te regarde en le disant."
  - qui: passante
    sujet: rumeur
    si: "arc(en.dossier_meneche)"
    texte: "Le stagiaire de L'Écho a vu une chemise à votre nom sur le bureau de Massenet. Une seule feuille dedans. Il l'a raconté à toute la boulangerie."
  - qui: passant
    sujet: rumeur
    si: "flag(subvention_perdue)"
    texte: "La mairie a rogné la subvention du club. Le radiateur du club-house tousse, on l'entend du trottoir. Madame Josiane travaille en manteau."
  - qui: passant
    sujet: rumeur
    si: "flag(kop_hostile)"
    texte: "Samedi, la Nord a chanté le nom de l'ancien pendant vingt minutes. Ma fille avait honte. Moi aussi, mais j'ai chanté."
  - qui: passante
    sujet: rumeur
    si: "flag(lettre_publiee)"
    texte: "La lettre anonyme dans L'Écho, avec la faute à « arrangé »… Au café, ils font écrire le mot aux clients sur un sous-bock, pour comparer."
  - qui: passant
    sujet: rumeur
    si: "arc(en.grand_nom)"
    texte: "Le président cherche un grand nom pour janvier. Il l'a dit à son coiffeur. Le lendemain, la moitié de la rue était au courant."
  - qui: passant
    sujet: rumeur
    si: "flag(ancien_rival)"
    texte: "L'ancien entraîneur a signé chez {rival}. Il dit dans les journaux qu'il connaît nos vestiaires par cœur. Il connaît surtout la serrure."
  - qui: passante
    sujet: rumeur
    si: "flag(rappele_par_aulard)"
    texte: "Un renvoi le lundi, un rappel le mercredi… D'après la boulangère, vous avez pris votre pain les deux jours. La même baguette, pas trop cuite."
  - qui: passante
    sujet: rumeur
    si: "flag(fede_dossier)"
    texte: "La Fédération a ouvert un dossier à votre nom. C'était dans L'Écho, page sept, sous la météo. Mon mari l'a lu en cherchant s'il allait pleuvoir."
  - qui: passant
    sujet: rumeur
    si: "flag(gerard_parti)"
    texte: "Gérard est parti au soleil avec la caisse de la buvette. Vingt ans de bénévolat. La boîte en fer, il l'a laissée sur le comptoir, vide."
  - qui: passant
    sujet: rumeur
    si: "flag(tribune_fermee)"
    texte: "La Nord fermée par arrêté. Samedi, les gars ont suivi le match depuis le talus de la voie ferrée, avec des jumelles et une radio."
  - qui: passant
    sujet: rumeur
    si: "arc(jp.pari)"
    texte: "Au Terminus, y a des gars qui parient sur les corners, maintenant. Pas sur le score, hein, sur les corners. Comment tu veux deviner un corner ?"
  - qui: passant
    sujet: rumeur
    si: "flag(pari_double)"
    texte: "Un gars du Terminus a gagné gros sur les corners de samedi. Il paie des tournées, et comment il savait, il le dit pas. Et toi, il te salue."
  - qui: passante
    sujet: match
    si: "flag(derby_gagne)"
    texte: "Le derby gagné… Mon père va en parler jusqu'à Noël. Il l'a déjà raconté trois fois, et il était même pas au stade."
  - qui: passant
    sujet: rumeur
    si: "flag(international)"
    texte: "Ta convocation chez les Cobalts, la boulangère l'a découpée dans le journal et collée à côté des croissants. Même son neveu a pas eu droit à ça."
  - qui: passante
    sujet: rumeur
    si: "flag(memoires_verite)"
    texte: "Ton livre est en vitrine de la librairie. Le chapitre trois, tout le quartier l'a lu debout, sans l'acheter. La libraire a fini par mettre une chaise."
  - qui: passant
    sujet: rumeur
    si: "flag(consultant)"
    texte: "T'étais à la télé, dimanche soir, à côté du chroniqueur. T'as dit du mal du latéral gauche. Il habite ma rue. Il a fermé ses volets."
  - qui: passant
    sujet: rumeur
    si: "flag(coach_critique)"
    texte: "Ce que t'as dit du coach, dans le journal… Au Corner, ils l'ont relu en imitant sa voix. Du coup, le coach boit au Terminus, maintenant."
  - qui: passante
    sujet: rumeur
    si: "arc(co.mbako_rival)"
    texte: "Le petit Mbako, seize ans… Au marché, ils le voient déjà à ton poste. Le boucher a découpé sa photo et l'a mise près de la balance."
  - qui: passant
    sujet: rumeur
    si: "flag(offshore)"
    texte: "Une société aux îles, avec ton nom dedans, c'est ce que dit L'Écho. Nous autres, on paie nos impôts en février, et on râle en mars."
  - qui: passante
    sujet: rumeur
    si: "flag(petition_portee)"
    texte: "Vingt-deux joueurs ont signé pour que tu restes. Le gardien a signé deux fois, à ce qu'il paraît. La photocopie a fait le tour du quartier."
  - qui: passante
    sujet: rumeur
    si: "arc(jp.jubile)"
    texte: "L'affiche de ton jubilé est chez le coiffeur. La date est écrite au feutre, pour pouvoir l'effacer."

  # — les événements sombres, une fois tombés : la ville en parle
  - qui: passante
    sujet: sombre
    si: "flag(sb_manif)"
    texte: "Trois cents écharpes sous les fenêtres de la mairie, et une banderole avec votre nom. Je l'ai vue de mon balcon. Je suis pas descendue."
  - qui: passant
    sujet: sombre
    si: "flag(sb_manif_parle)"
    texte: "T'as descendu les marches de la mairie pour leur parler, à la manif. Ça, ils l'ont pas oublié. Même ceux qui gueulaient le plus."
  - qui: passant
    sujet: sombre
    si: "flag(sb_cercueil)"
    texte: "Le cercueil devant la grille, avec ton nom dessus… Ma petite l'a vu en allant à l'école. Elle m'a demandé qui était mort. J'ai pas su quoi lui dire."
  - qui: passante
    sujet: sombre
    si: "flag(sb_buvette_fermee)"
    texte: "La buvette des anciens, fermée par la préfecture. Les vieux boivent leur café au Terminus, debout, et ils ont horreur de boire debout."
  - qui: passante
    sujet: sombre
    si: "flag(sb_terrain_brule)"
    texte: "HONTE, brûlé dans la pelouse de l'annexe. Les jardiniers de la mairie ont tout retourné avant midi. On voit encore le carré de terre fraîche."
  - qui: passante
    sujet: sombre
    si: "flag(sb_lettre)"
    texte: "Une lettre pour le petit, avec des mots découpés dans L'Écho. Le kiosquier dit qu'un homme lui achète trois exemplaires chaque samedi. Il le guette."
  - qui: passant
    sujet: sombre
    si: "flag(sb_corbeau)"
    texte: "Trois lettres anonymes, la mairie, le président, le journal. Au café de la Mairie, on joue à deviner qui écrit. Mon voisin parie sur le facteur."
  - qui: passante
    sujet: sombre
    si: "flag(sb_laverie_lue)"
    texte: "L'homme au blouson gris, celui de la laverie, je l'ai revu à la gare routière. Il prend le car de Valdorne, celui de huit heures quinze."
  - qui: passante
    sujet: sombre
    si: "flag(sb_laverie_3)"
    texte: "Le compte de Valdorne, le beau-frère du président… À la brasserie du Pont, on se penche au-dessus des assiettes pour en parler. Tous les midis."
  - qui: passante
    sujet: sombre
    si: "flag(sb_huissier)"
    texte: "L'huissier a pris la machine à laver du club. Les joueurs rapportent leurs maillots sales chez eux dans des sacs de supermarché. Je les vois passer, le soir."
  - qui: passant
    sujet: sombre
    si: "flag(sb_greve)"
    texte: "Les joueurs ont refusé de s'entraîner. Ils ont fait le tour du terrain au pas, sans ballon. On aurait dit un enterrement. On regardait depuis la haie."
  - qui: passante
    sujet: sombre
    si: "flag(sb_car)"
    texte: "Le car du club dans le fossé, sous la neige… Norbert conduira plus. Il vient quand même à la gare routière, le matin, voir partir les autres."
  - qui: passant
    sujet: sombre
    si: "flag(sb_disparu)"
    texte: "Dembo traîne à la friche, avec des types qui comptent sur leurs doigts. Quelqu'un devrait aller le chercher."
  - qui: passant
    sujet: sombre
    si: "flag(sb_agression)"
    texte: "Ceux de {rival} t'attendaient rue des Lilas, à ce qu'on raconte. Depuis, y a des gars de la Nord qui font les cent pas sous ton immeuble, le soir."

  # — sponsors : les costumes, les cadeaux, ceux qui veulent quelque chose
  - qui: passant
    sujet: sponsor
    si: "tranche == soir"
    texte: "Trois soirs de suite, des costumes pas d'ici qui entrent au Rideau Rouge. Ils demandent ton nom aux chauffeurs de taxi. Et les taxis répondent."
  - qui: passante
    sujet: sponsor
    si: "role == joueur && tribunes > 60"
    texte: "Un homme en costume m'a demandé où vous habitiez. Il avait un paquet doré. Je lui ai indiqué la mauvaise rue. Il reviendra par la bonne."
  - qui: passant
    sujet: sponsor
    si: "tranche == nuit"
    texte: "Au Rideau Rouge, la porte a pas de poignée. On frappe, un type ouvre, et le lendemain tout le monde sait qui a frappé. Sauf la police."
  - qui: passant
    sujet: sponsor
    si: "flag(nassir_pret)"
    texte: "Le prêt du fonds, y a pas de date de retour, d'après mon beau-frère, qui est à la banque. Ma banque à moi, elle prête pas comme ça. Elle a des dates."

  # — ce qu'on achète, ce qu'on fait pour d'autres ou avec d'autres : la rue le voit
  - qui: passant
    sujet: achat
    si: "possede(coupe_sport)"
    texte: "Ton coupé rouge, garé de travers devant la boulangerie… Les gamins tournent autour comme autour d'un gâteau. Les pères aussi, mais de plus loin."
  - qui: passante
    sujet: achat
    si: "possede(montre_or)"
    texte: "Une montre en or à votre poignet… Ma mère disait qu'une montre en or, ça se porte sous la manche, le temps que les gens s'habituent."
  - qui: passant
    sujet: achat
    si: "possede(villa)"
    texte: "La villa sur les hauteurs, c'est la tienne ? Le facteur dit qu'il faut sonner trois fois au portail. Rue des Lilas, une fois suffisait."
  - qui: passant
    sujet: achat
    si: "possede(helico)"
    texte: "Ton hélicoptère est passé au-dessus du marché, dimanche. Les maraîchers ont tenu leurs bâches à deux mains et regardé en l'air longtemps."
  - qui: passant
    sujet: achat
    si: "possede(duplex_trefilerie)"
    texte: "T'habites la Tréfilerie, maintenant, dans un duplex. Mon père y a laissé deux doigts, à l'atelier 3. Je dis ça sans reproche, hein."
  - qui: passant
    sujet: rumeur
    si: "flag(bn_fisc)"
    texte: "Le contrôle fiscal chez toi, ça s'est su par le facteur. Il a monté trois recommandés dans la semaine. Les enveloppes, il les connaît."
  - qui: passante
    sujet: sponsor
    si: "arc(en.sp.dornois)"
    texte: "La biscuiterie Dornois voudrait ta photo sur sa boîte de Noël. Rue des Tanneurs, les ouvrières l'ont su avant toi."
  - qui: passant
    sujet: sponsor
    si: "arc(en.sp.labo)"
    texte: "Le jeudi, y a un car avec un triangle bleu qui se gare devant le cabinet du Doc. Il repart plus léger. Le chauffeur descend jamais."
  - qui: passant
    sujet: sponsor
    si: "arc(en.sp.terrain)"
    texte: "La grande suite de l'hôtel de la Rive reste allumée tard. Le garçon d'étage parle d'une maquette sur la table basse, avec notre terrain annexe dessus."
  - qui: passante
    sujet: sponsor
    si: "arc(co.sp.rideau)"
    texte: "Fardelli a laissé un carton noir à ton nom sur le zinc du Corner. Le patron l'a rangé sous la caisse, comme une lettre d'huissier."
  - qui: passant
    sujet: sombre
    si: "flag(vl_dette_tripot)"
    texte: "Ton nom est sur l'ardoise de l'arrière-salle, à la craie, sous trois noms barrés. Les trois barrés, je les connaissais. On les voit plus."
  - qui: passant
    sujet: sombre
    si: "flag(vl_colis_lache)"
    texte: "Des types de la friche ont demandé ton adresse au Terminus. Le patron a dit qu'il savait pas. Ils ont pas eu l'air de le croire."
  - qui: passante
    sujet: sombre
    si: "flag(vl_perquisition)"
    texte: "Six heures du matin, des voitures sans sigle devant chez vous. La voisine du dessus a tout vu, en robe de chambre. Toute la rue l'a su avant midi."

  - qui: passante
    sujet: club
    si: "phase == retour"
    texte: "Pour la phase retour, mon mari a recopié le calendrier sur la porte du frigo. Il coche les matchs qu'il faut pas perdre. Il les a tous cochés."
  # ═══════════════════════════════════════════════════════════════════ ENFANTS
  - qui: enfant
    sujet: toi
    texte: "Tu me signes mon cahier de textes ? Pas sur la couverture, ma mère regarde la couverture. Signe à la page des devoirs de maths."
  - qui: enfant
    sujet: toi
    texte: "Mon père dit que tu resteras pas. Il dit ça de tout le monde. Même du facteur."
  - qui: enfant
    sujet: quartier
    texte: "Notre ballon est crevé. Le gardien du stade en a plein son local, mais il dit qu'ils sont comptés. Toi, tu peux en sortir un ?"
  - qui: enfant
    sujet: club
    texte: "Je veux entrer au centre de formation. Il faut un certificat du docteur, une photo, et que ma mère signe. Ma mère veut pas signer."
  - qui: enfant
    sujet: club
    texte: "Le gardien du stade nous laisse entrer par la porte des livreurs, le lundi. Il dit qu'on a le droit de marcher que sur les lignes blanches."
  - qui: enfant
    sujet: toi
    si: "role == joueur"
    texte: "Je fais ta célébration dans la cour, les bras en avion. La maîtresse m'a confisqué le ballon. Jusqu'à vendredi !"
  - qui: enfant
    sujet: toi
    si: "role == joueur"
    texte: "{nom} ! Signe sur mon plâtre, à côté du docteur. Je me suis cassé le bras en essayant ta reprise de volée, contre le mur de l'école."
  - qui: enfant
    sujet: toi
    si: "role == entraineur && vestiaire < 40"
    texte: "Au square, je fais l'entraîneur : je crie et je montre avec le bras. Personne m'écoute. Papa dit que c'est pareil chez toi."
  - qui: enfant
    sujet: toi
    si: "role == entraineur && saison == 1"
    texte: "C'est toi qui remplaces l'autre ? Papa dit que tu connais même pas le nom des rues."
  - qui: enfant
    sujet: club
    si: "phase == presaison"
    texte: "Les essais du centre, c'est le mercredi après-midi. Si je suis pris, je dors là-bas, dans le préfabriqué. Douze lits. J'ai compté par la fenêtre."
  - qui: enfant
    sujet: match
    si: "serie_d >= 2"
    texte: "Les CM2 disent que ton équipe est nulle. Je réponds plus. La dernière fois, j'ai copié cent lignes."
  - qui: enfant
    sujet: match
    si: "serie_v >= 2"
    texte: "On gagne ! À la cantine, on a chanté le chant de la Nord en tapant les cuillères sur les plateaux. La dame de service a chanté aussi."
  - qui: enfant
    sujet: match
    si: "jour == dim && serie_v >= 1"
    texte: "Hier, j'étais en Nord, sur les épaules de mon oncle. J'ai rien vu du but. Mais j'ai crié quand même !"
  - qui: enfant
    sujet: match
    si: "jour == sam && tranche == matin"
    texte: "C'est à quinze heures, le match ? Mon parrain a un billet. Moi, je passe sous le tourniquet ; le contrôleur fait exprès de regarder ailleurs."
  - qui: enfant
    sujet: classement
    si: "rang == 1 && journee >= 12"
    texte: "On est premiers, c'est écrit dans le journal de mon père. Je l'ai découpé avant qu'il le lise. Il a crié, puis il l'a punaisé."
  - qui: enfant
    sujet: toi
    si: "tribunes < 25"
    texte: "Ma mère dit qu'il faut plus parler de toi à la maison. Alors j'en parle dehors."
  - qui: enfant
    sujet: toi
    si: "tribunes > 75"
    texte: "J'ai écrit ton nom sur ma trousse, au feutre. Le maître a dit que c'était de la dégradation. Lui, il a ton nom sur sa voiture."
  - qui: enfant
    sujet: toi
    si: "role == joueur && tribunes < 40"
    texte: "Mon grand frère a jeté ton poster. Je l'ai repris dans la poubelle et je l'ai mis sous mon lit. Faut pas le dire."
  - qui: enfant
    sujet: toi
    si: "eveil >= 5"
    texte: "T'as des cernes comme ma mère quand elle fait les nuits. Tu devrais dormir. C'est ce qu'elle dit, et elle dort jamais."
  - qui: enfant
    sujet: epoque
    si: "annee <= 1999"
    texte: "J'échange deux vignettes de toi contre une de {rival}. C'est le tarif, dans la cour. T'en veux une de toi ?"
  - qui: enfant
    sujet: epoque
    si: "annee >= 2010"
    texte: "J'ai une vidéo de toi avec le téléphone de ma sœur. Tu te grattes le nez. Je l'ai pas mise sur le Flux. Pas encore."
  - qui: enfant
    sujet: quartier
    texte: "Le soir, quand ma mère croit que je dors, je regarde le feu de la friche depuis le toit du garage. Y a des gens qui crient, des fois."
  - qui: enfant
    sujet: quartier
    si: "jour == mer && tranche == aprem"
    texte: "Le mercredi, le centre de formation est ouvert. On regarde les grands par le grillage. Si tu passes, dis au monsieur de nous laisser entrer."
  - qui: enfant
    sujet: quartier
    si: "phase == hiver"
    texte: "Le terrain annexe a gelé. On glisse dessus jusqu'au poteau de corner. Lulu crie, mais il crie en souriant."
  - qui: enfant
    sujet: club
    si: "flag(mbako_lance)"
    texte: "Mbako, il a seize ans et il joue en pro. J'en ai dix. Il me reste six ans, c'est beaucoup ou pas beaucoup ?"
  - qui: enfant
    sujet: club
    si: "flag(mbako_vendu)"
    texte: "Le petit Mbako est parti. Au centre, ils ont enlevé sa photo du couloir, mais la punaise est restée. On touche la punaise avant les matchs."
  - qui: enfant
    sujet: rumeur
    si: "arc(jp.tifo)"
    texte: "Mon père peint ton nom sur la bâche, le soir, à la halle. Il m'a laissé faire le bord d'une lettre. La troisième. Regarde bien samedi."
  - qui: enfant
    sujet: sombre
    si: "flag(sb_cercueil)"
    texte: "On est passés devant le cercueil, avec l'école. La maîtresse nous a fait changer de trottoir. Y avait ton nom dessus, en grand."
  - qui: enfant
    sujet: sombre
    si: "flag(sb_voiture)"
    texte: "C'est ta voiture, celle avec le mot à la bombe ? Les grands l'ont lu en détachant les syllabes. Moi, je savais pas ce que ça voulait dire. Ça veut dire quoi ?"
  - qui: enfant
    sujet: sombre
    si: "flag(sb_lettre)"
    texte: "Le petit Mbako, des gens lui écrivent des méchancetés. À l'école, quelqu'un a dit le mot. La maîtresse l'a fait sortir et elle a claqué la porte."

  - qui: enfant
    sujet: toi
    texte: "C'est quoi, ton poste préféré ? Moi, je suis gardien, parce que personne veut y aller. Lulu, au stade, il dit que c'est comme ça qu'on commence."
  - qui: enfant
    sujet: achat
    si: "possede(montre_or)"
    texte: "Elle est en vrai or, ta montre ? Mon frère dit que les vraies, ça fait pas de bruit. Fais écouter !"
  - qui: enfant
    sujet: rumeur
    si: "flag(vl_gamin)"
    texte: "Le Chat est au centre de formation ! Il garde les buts en crampons trop grands. Il dit que c'est grâce à toi. Depuis, tout le square veut garder les buts."

  # ════════════════════════════════════════════════════════ LES SUPPORTERS
  - qui: fan
    sujet: club
    texte: "Le chant de la Nord a sept couplets. Le cinquième, on le chante qu'en déplacement, jamais à la Rive. Les gamins le connaissent pas encore."
  - qui: fan
    sujet: club
    texte: "Les cars des déplacements, c'est gare routière, quai 2, six heures. Ceux qui sont en retard suivent en voiture. Y en a jamais."
  - qui: fan
    sujet: quartier
    texte: "Le mur « ALLEZ LES AUBES », au carrefour du stade, on le repeint tous les ans en août, même quand personne l'a effacé. Et ça coule à chaque fois."
  - qui: fan
    sujet: club
    si: "annee <= 2035"
    texte: "Au local, sous la Nord, y a un filet à oranges, un ballon par victoire à l'extérieur. Il est loin d'être plein, va."
  - qui: fan
    sujet: club
    si: "annee <= 2030"
    texte: "Gégé tient le mur des dates, au local. Chaque promesse du club, à la craie, avec le jour et la somme. Celles qui ont pas été tenues, il les écrit plus gros."
  - qui: fan
    sujet: club
    si: "annee <= 2030"
    texte: "Le père de Gégé a été interdit de stade en soixante et onze, pour un dessin. Sa chaise est toujours au local. Personne s'assoit dessus."
  - qui: fan
    sujet: match
    si: "serie_d >= 2"
    texte: "Samedi prochain, on chante pas les vingt premières minutes. C'est voté. T'auras qu'à écouter, tu sauras pour qui c'est."
  - qui: fan
    sujet: match
    si: "serie_d >= 3"
    texte: "Au local, on a sorti la vieille banderole, celle qu'on déroule que quand ça va mal. Elle est roulée sur la table. Pas encore dépliée."
  - qui: fan
    sujet: match
    si: "serie_d >= 1 && tribunes < 35"
    texte: "Samedi, si ça recommence, on tourne le dos au terrain à la mi-temps. Pas de cris, pas de fumigènes. Juste nos dos. Tu verras."
  - qui: fan
    sujet: match
    si: "jour == sam && tranche == soir && serie_v >= 1"
    texte: "Ce soir, la buvette ferme quand on le décide, et on a décidé : pas avant deux heures. Passe, on t'offre le premier."
  - qui: fan
    sujet: classement
    si: "rang >= 16 && journee >= 12"
    texte: "En bas du tableau, la Nord chante plus fort. Ceux d'en face, ils ont jamais compris ça. Viens samedi, t'entendras."
  - qui: fan
    sujet: club
    si: "phase == bilan && rang >= 16"
    texte: "C'est fini, et mal. Cet été, on repeint le local, et en août on remet ça. Les abonnements, on les reprend tous."
  - qui: fan
    sujet: club
    si: "vestiaire < 25"
    texte: "L'équipe salue plus la Nord, à la fin. Ils rentrent au vestiaire tête basse, un par un. On a vu. D'en haut, on voit les nuques."
  - qui: fan
    sujet: argent
    si: "caisse < 25"
    texte: "Le club paie plus nos cars pour les déplacements. On fait la quête à la buvette, avec la boîte en fer. On ira en voitures, voilà."
  - qui: fan
    sujet: toi
    si: "role == entraineur"
    texte: "Le virage veut voir des gars qui mouillent le maillot. Tes tableaux, tes plots, on s'en fiche. Fais-les courir, et on chantera."
  - qui: fan
    sujet: toi
    si: "role == joueur"
    texte: "Quand tu viens saluer la Nord, après le match, viens jusqu'au grillage. Pas du milieu du terrain. Au grillage."
  - qui: fan
    sujet: toi
    si: "tribunes > 60 && tribunes <= 80"
    texte: "On a un chant pour toi, sur l'air de l'ancien : « {nom}, {nom}… » La suite, on te la chantera quand tu l'auras méritée."
  - qui: fan
    sujet: toi
    si: "tribunes > 80"
    texte: "Ton nom, on le chante à la soixantième, maintenant. Avant, la soixantième, c'était pour le père de Gégé. Tu mesures ?"
  - qui: fan
    sujet: toi
    si: "tribunes < 20"
    texte: "Si tu passes devant la buvette ce soir, t'arrête pas. C'est pas moi qui décide. Moi, je te préviens."
  - qui: fan
    sujet: toi
    si: "relation.gege >= 2"
    texte: "La table du fond, au local, personne s'y assoit sans invitation. Gégé a dit que t'avais la tienne. Devant tout le monde."
  - qui: fan
    sujet: toi
    si: "relation.gege <= -2"
    texte: "Gégé a effacé ton nom du mur du local, à l'éponge, devant nous. Gégé qui efface jamais rien. Il a rincé l'éponge après."
  - qui: fan
    sujet: toi
    si: "flag(ami_ultras)"
    texte: "Au club-house, ils disent que t'es trop proche de nous. Le président vient plus à la buvette. Toi, si. On a remarqué."
  - qui: fan
    sujet: sombre
    si: "tranche == soir"
    texte: "La nuit, ceux de {rival} viennent coller leurs autocollants sur nos murs. On les attend derrière la buvette. Toi, rentre chez toi."
  - qui: fan
    sujet: epoque
    si: "flag(monde_tout_assis) && annee <= 1996"
    texte: "Ils veulent nous asseoir. Des sièges dans la Nord ! On a prévenu la mairie. Ils les vissent, on les dévisse. On a nos tournevis."
  - qui: fan
    sujet: epoque
    si: "flag(monde_tout_assis) && annee >= 1997 && annee <= 2040"
    texte: "Les sièges de la Nord, on monte dessus depuis le premier jour. Les stadiers disent rien. Leurs pères étaient debout à côté des nôtres."
  - qui: fan
    sujet: epoque
    si: "flag(monde_buvette_anciens)"
    texte: "La buvette des anciens a rouvert, le dimanche matin. Les verres de 1962, la bière à un écu. Viens un dimanche, on te montrera la photo."
  - qui: fan
    sujet: epoque
    si: "flag(monde_vecchio_mort)"
    texte: "Gigi Vecchio est mort. Samedi, la minute de silence a duré deux minutes. L'arbitre a pas osé siffler."
  - qui: fan
    sujet: epoque
    si: "flag(monde_debout_revenu)"
    texte: "Les places debout sont revenues, avec des barres. On a dévissé le dernier siège de la Nord nous-mêmes. Il est au local, sur une étagère."
  - qui: fan
    sujet: rumeur
    si: "arc(co.derby)"
    texte: "Le derby contre {rival}, on a peint quarante mètres de bâche au local. Si tu marques, ton nom est déjà prêt, dans un coin. La peinture est encore fraîche."
  - qui: fan
    sujet: match
    si: "flag(derby_perdu)"
    texte: "Le derby perdu, on l'a dans le ventre. Ceux de {rival} ont accroché une de nos écharpes à leur grille, à l'envers. On ira la chercher."
  - qui: fan
    sujet: match
    si: "flag(derby_gagne) && annee <= 2030"
    texte: "Le derby, on l'a ! Gégé a pleuré dans l'escalier de la Nord. On a tous regardé nos chaussures. Dans vingt ans, on en parle encore."
  - qui: fan
    sujet: rumeur
    si: "flag(onze_du_virage)"
    texte: "Le onze du virage, on l'a voté au local, à main levée. Tu l'as presque fait jouer. « Presque », on l'a écrit au mur."
  - qui: fan
    sujet: rumeur
    si: "arc(en.kop_qui_aime_trop)"
    texte: "La Nord est derrière toi. Alors on voudrait un peu plus. Des cars payés, une place au conseil, le nom de l'ailier. C'est pas beaucoup."
  - qui: fan
    sujet: rumeur
    si: "arc(en.kop_doute)"
    texte: "La moitié de la Nord chante encore le nom de l'ancien. L'autre moitié attend. Gagne deux matchs, et on passe au tien."
  - qui: fan
    sujet: rumeur
    si: "flag(pacte_gege)"
    texte: "Un pacte avec Gégé, à ce qu'on raconte au local. Gégé, une main serrée, il la note au mur, avec la date. La tienne y est."
  - qui: fan
    sujet: rumeur
    si: "flag(enfant_du_pays)"
    texte: "Vingt mètres de bâche avec ton nom, et ta promesse dessous, en plus petit. On la déroule à chaque match. Et on sait lire, hein."
  - qui: fan
    sujet: rumeur
    si: "flag(bache_a_la_cave)"
    texte: "La bâche à ton nom est partie dans ta cave, à ce qu'il paraît. Nous, on en a peint une autre. Sans nom, cette fois."
  - qui: fan
    sujet: rumeur
    si: "flag(blason_embrasse)"
    texte: "Le blason, tu l'as embrassé devant la Nord. On a la photo. Le jour où tu pars, on la ressort, en grand, sur une bâche."
  - qui: fan
    sujet: rumeur
    si: "flag(jubile_fait) && annee <= 2030"
    texte: "Ton jubilé, le stade plein, le tour d'honneur… Gégé a dit que c'était le plus beau depuis soixante-quatorze. Gégé, qui dit jamais ça."
  - qui: fan
    sujet: rumeur
    si: "flag(club_actif)"
    texte: "Le club appartient à un fonds. La Nord, non. On l'a écrit sur une banderole, pour qu'ils sachent faire la différence."
  - qui: fan
    sujet: sombre
    si: "flag(sb_manif)"
    texte: "La manif, c'était trois cents écharpes. La prochaine, ce sera mille. Sans crier. À la mairie, ils aiment pas ça du tout."
  - qui: fan
    sujet: sombre
    si: "flag(sb_envahissement)"
    texte: "Le gars qui a sauté la grille, c'est un des nôtres. Interdit de stade. On a noué son écharpe sur la rambarde, à sa place, tous les samedis."
  - qui: fan
    sujet: sombre
    si: "flag(sb_huis_clos)"
    texte: "Le huis clos, on l'a suivi depuis le talus, avec une radio. Quand on a marqué, on a crié si fort que l'arbitre s'est retourné. Il nous a entendus."
  - qui: fan
    sujet: sombre
    si: "flag(sb_local_brule)"
    texte: "Le local a brûlé. La bâche du père de Gégé est noire sur un bord. On a tout repeint, sauf ce bord-là. On le garde comme ça."
  - qui: fan
    sujet: sombre
    si: "flag(sb_bagarre)"
    texte: "La bagarre de la buvette, c'est une vieille histoire entre deux bandes. Rien à voir avec toi. Enfin, presque rien."
  - qui: fan
    sujet: sombre
    si: "flag(sb_police_appelee)"
    texte: "T'as appelé la police sur des gars de la Nord. Au local, ton nom est au mur, à côté de celui du commissaire de 1983. C'est pas le mur des honneurs."
  - qui: fan
    sujet: sponsor
    si: "flag(boucher_sponsor)"
    texte: "Le nom de Dupuis le boucher sur nos dos, cousu de travers. Il a offert les merguez à la buvette ; on lui pardonne le nom. Pas les coutures."
  - qui: fan
    sujet: sponsor
    si: "flag(nassir_sponsor)"
    texte: "Le fonds sur le maillot, l'hôtel de la Rive plein de costumes… On veut bien leur argent. Leurs têtes, pas en Nord."

  - qui: fan
    sujet: club
    si: "phase == retour"
    texte: "Au retour, on va chez ceux qui nous ont battus à l'aller. On a la liste au local, avec les scores à la craie. Ça occupe le car."
  - qui: fan
    sujet: achat
    si: "possede(coupe_sport) && serie_d >= 1"
    texte: "Un coupé rouge à ce prix-là, quand on perd… Les gars de la Nord ont noté ta plaque. Je dis ça pour la carrosserie."
  - qui: fan
    sujet: achat
    si: "possede(villa) && tribunes < 40"
    texte: "La rue des Lilas, tu l'as quittée pour les hauteurs. La nouvelle adresse, on l'a aussi."
  - qui: fan
    sujet: rumeur
    si: "flag(vl_corner)"
    texte: "Lulu a retrouvé son chien. Il raconte à tout le monde que c'est grâce à toi, et après il jure qu'il a rien dit."
  - qui: fan
    sujet: rumeur
    si: "flag(vl_billets)"
    texte: "Vingt gars de la Nord sont entrés avec des places payées cinq fois le prix. Le stadier de la porte B jure qu'il a rien vu. Il le jure à tout le monde."
  - qui: fan
    sujet: sombre
    si: "flag(vl_gege_donne)"
    texte: "Le nom de Gégé, tu l'as donné. À la buvette, ton verre est retourné sur le comptoir. Personne y touchera."

  # ═════════════════════════════════════════════════════════════════ ANCIENS
  - qui: ancien
    sujet: club
    texte: "Le caveau du Racing, au fond à gauche : les présidents, deux capitaines, un soigneur. Le soigneur a la plus belle plaque. Il l'a payée lui-même."
  - qui: ancien
    sujet: quartier
    texte: "Au monument aux morts, mon oncle est sur la plaque de quarante, et sur la photo de l'équipe de trente-huit. La gerbe aux couleurs du club, c'est pour lui aussi."
  - qui: ancien
    sujet: club
    texte: "La Tréfilerie payait la moitié des joueurs, avant, à rien faire à l'atelier 3. Le club appelait ça un partenariat. À l'usine, on avait un autre mot."
  - qui: ancien
    sujet: sponsor
    texte: "Le premier sponsor du club, c'était la boucherie de la place. Il payait en entrecôtes, à la buvette. Aujourd'hui, qui nous paie, et en quoi, j'en sais rien."
  - qui: ancien
    sujet: club
    si: "annee <= 2035"
    texte: "En soixante-deux, l'équipe travaillait à l'usine la semaine. Le samedi, ils jouaient les mains noires. La photo est à la brasserie du Pont : regardez les mains."
  - qui: ancien
    sujet: club
    si: "annee <= 2035"
    texte: "La photo de soixante-quatorze, dans l'escalier du club-house : treize joueurs, douze noms. Le treizième, c'est mon frère. Il avait pas de licence."
  - qui: ancien
    sujet: match
    si: "annee <= 2010"
    texte: "Mon premier match ici, c'était en quarante-sept, sur les épaules de mon père. On a perdu quatre à zéro. J'étais là le samedi suivant, et tous les autres."
  - qui: ancien
    sujet: quartier
    si: "annee <= 2015"
    texte: "La crue de cinquante et un, l'eau est montée jusqu'à la barre transversale. On a joué le match suivant sur la place du marché, avec des cageots pour buts."
  - qui: ancien
    sujet: match
    si: "serie_d >= 2 && annee <= 2035"
    texte: "En soixante-dix-huit, neuf défaites d'affilée. Le président a vendu sa voiture pour payer les primes. On a gagné le dixième. Faites-en ce que vous voulez."
  - qui: ancien
    sujet: match
    si: "serie_v >= 2 && annee <= 2035"
    texte: "Ça me rappelle soixante-quatorze. Vous emballez pas. En soixante-quatorze, on a fini quatrièmes, et l'été d'après le club a failli disparaître."
  - qui: ancien
    sujet: club
    si: "caisse < 25 && annee <= 2035"
    texte: "Le club a déjà été à vendre, en quatre-vingt-un. Un marchand de bestiaux l'a repris pour un franc symbolique. Il a tenu deux saisons."
  - qui: ancien
    sujet: club
    si: "flag(club_actif)"
    texte: "Le club appartient à des gens qui sont jamais venus à la Rive. En quatre-vingt-un, le marchand de bestiaux, au moins, il venait au marché."
  - qui: ancien
    sujet: toi
    si: "role == entraineur && annee <= 2000"
    texte: "Depuis cinquante-deux, onze personnes se sont assises sur ce banc. Trois ont une rue à leur nom. Les autres, une ligne dans L'Écho."
  - qui: ancien
    sujet: toi
    si: "role == joueur && annee <= 2030"
    texte: "Le numéro que tu portes, un ailier le portait en soixante-deux. Il est mort il y a peu. Porte-le bien : sa veuve regarde les matchs."
  - qui: ancien
    sujet: toi
    si: "tribunes < 30 && annee <= 2035"
    texte: "Ils sifflaient aussi le grand ailier de soixante-deux. Il a fini avec une rue à son nom, derrière la gare routière. Courte, la rue, mais elle existe."
  - qui: ancien
    sujet: toi
    si: "tribunes > 75 && annee <= 2035"
    texte: "En soixante-quinze, on a porté l'entraîneur en triomphe sur le pont. En septembre, on l'a jeté dans la Rive. Alors, quand ça chante trop fort…"
  - qui: ancien
    sujet: toi
    si: "saison == 1"
    texte: "Vous connaissez pas encore la Rive. Le vent tourne à la mi-temps, à cause du pont. Dans le temps, on prenait la seconde période dos au vent."
  - qui: ancien
    sujet: toi
    si: "saison >= 8"
    texte: "Votre premier samedi ici, je m'en souviens. Vous regardiez la Nord la bouche ouverte. Ça fait combien de saisons, maintenant ?"
  - qui: ancien
    sujet: epoque
    si: "annee <= 1995"
    texte: "Avant, on était trois mille debout dans la Nord, épaule contre épaule. Quand on marquait, on descendait de deux marches sans le vouloir."
  - qui: ancien
    sujet: epoque
    si: "flag(monde_libre_1993)"
    texte: "Maintenant, un joueur part pour rien à la fin de son contrat. De mon temps, on appartenait au club jusqu'à trente-cinq ans, comme une chaise."
  - qui: ancien
    sujet: epoque
    si: "flag(monde_trois_points)"
    texte: "Trois points la victoire. De mon temps, un nul à l'extérieur, c'était une fête. Maintenant, on fait la tête pour un nul."
  - qui: ancien
    sujet: epoque
    si: "flag(monde_josiane_retraite)"
    texte: "Madame Josiane a rangé son bureau, trente-cinq ans après. Sa nièce a pris la suite. Paraît qu'elle range le journal dessus, et la tante dessous."
  - qui: ancien
    sujet: epoque
    si: "annee >= 2032"
    texte: "Dans les années quatre-vingt-dix, la Nord tenait debout sur du béton fendu et sur Gégé. Le béton, on l'a refait depuis."
  - qui: ancien
    sujet: epoque
    si: "annee >= 2040"
    texte: "Gamin, je payais ma place en écus, et je râlais déjà. Maintenant on voit même plus l'argent passer, et je râle pareil."
  - qui: ancien
    sujet: rumeur
    si: "arc(en.vieux_gardien)"
    texte: "Gigi Vecchio annonce sa retraite tous les juins. Moi, j'ai annoncé la mienne en soixante-dix-neuf, et j'ai tenu. Lui, il a bien raison."
  - qui: ancien
    sujet: rumeur
    si: "flag(naming_signe)"
    texte: "Ils vont donner le nom d'un fonds au stade. Les marches de la Nord, c'est mon père qui les a coulées, en cinquante-six. Je l'appellerai comme je veux."
  - qui: ancien
    sujet: sombre
    si: "tranche == soir"
    texte: "À mon âge, on dort plus. La nuit, je vois passer des voitures sans phares vers la friche. Je note les plaques dans un carnet. Personne me l'a demandé."
  - qui: ancien
    sujet: sombre
    si: "flag(sb_ancien)"
    texte: "Sorbier, je l'ai connu trésorier, avec ses cahiers à spirale. Onze ans de centrale, pour un compte pas à lui. Ceux qui l'ont mis là courent toujours."
  - qui: ancien
    sujet: sombre
    si: "flag(sb_mort_tribune)"
    texte: "Marcel avait la place à côté de la mienne depuis soixante-neuf, rangée H. Je garde son coussin dans mon sac. Je sais pas pour qui."
  - qui: ancien
    sujet: sombre
    si: "flag(sb_perquisition)"
    texte: "Les cartons du président dans l'escalier, à six heures… J'ai vu la même chose en quatre-vingt-un. Le même escalier. Pas les mêmes cartons."

  - qui: ancien
    sujet: club
    si: "phase == aller"
    texte: "En septembre, tout le monde se voit premier. Revenez me voir en mars, quand les jambes auront parlé."
  - qui: ancien
    sujet: achat
    si: "possede(helico) && annee <= 2015"
    texte: "Un hélicoptère. Le seul qu'on ait vu ici, c'était pour la crue de cinquante et un. Il venait chercher les gens sur les toits."
  - qui: ancien
    sujet: rumeur
    si: "flag(vl_veuve)"
    texte: "Madame Dutheil a retrouvé la place sept, en tribune d'honneur. À la septième minute, la Nord se lève. Je sais qui a fait ça. Je le dirai pas."
  - qui: ancien
    sujet: rumeur
    si: "arc(en.sp.gigi)"
    texte: "Gigi Vecchio passe ses soirées dans l'arrière-salle du Terminus, à ce qu'on dit. Les cartes jusqu'à deux heures, et le samedi, des yeux de lapin."

  # ═══════════════════════════════════════════════════════════ COMMERÇANTS
  - qui: commercant
    sujet: quartier
    si: "lieu == boulangerie_residentiel"
    texte: "La baguette pas trop cuite, je vous la garde sous le comptoir. Et le score, dites-le-moi avant mes clientes, sinon c'est elles qui me le disent."
  - qui: commercant
    sujet: match
    si: "lieu == boulangerie_residentiel && serie_d >= 2"
    texte: "Le fanion du club, je le mets plus en vitrine. C'est pas contre vous, hein. Les clients me parlaient du match au lieu de choisir leur pain."
  - qui: commercant
    sujet: sombre
    si: "lieu == boulangerie_residentiel && flag(sb_devant_chez_toi)"
    texte: "Les cinq de l'autre nuit, j'en connais deux, ils m'achètent des croissants le dimanche. Je leur ai rendu la monnaie en pièces jaunes. Toute la monnaie."
  - qui: commercant
    sujet: argent
    si: "lieu == terminus"
    texte: "Au comptoir, on boit debout et on cause pas. L'arrière-salle, elle, elle écoute. Si on vous y invite un soir, demandez qui paie avant de vous asseoir."
  - qui: commercant
    sujet: rumeur
    si: "lieu == terminus && serie_d >= 2 && !flag(monde_ecus)"
    texte: "Les chauffeurs de car parient sur la date de ton départ, au comptoir. J'ai mis vingt francs contre. Faut bien que quelqu'un les contredise."
  - qui: commercant
    sujet: toi
    si: "lieu == pharmacie"
    texte: "Je connais le nom de tous les joueurs du club, et ce qu'ils prennent pour dormir. N'insistez pas. Vous, je n'ai encore aucune ordonnance à votre nom."
  - qui: commercant
    sujet: sombre
    si: "lieu == pharmacie && flag(sb_dopage)"
    texte: "Un homme m'a demandé un produit pour les chevaux, sans ordonnance, en survêtement neuf. J'ai dit non, et j'ai noté l'heure. Vous voulez l'heure ?"
  - qui: commercant
    sujet: rumeur
    si: "lieu == pharmacie && arc(co.pharmacie)"
    texte: "Le club ne me commande plus rien depuis l'automne. Ni bandes ni vitamines. Alors je me demande ce qu'il y a dans leur armoire, et qui la remplit."
  - qui: commercant
    sujet: quartier
    si: "lieu == kiosque"
    texte: "L'Écho, je vous le plie à la page des sports. Tout le monde lit les sports d'abord, même ceux qui jurent que non."
  - qui: commercant
    sujet: sombre
    si: "lieu == kiosque && flag(sb_photos)"
    texte: "La Gazette Rose avec ta photo, partie en une matinée. J'aurais pu la laisser sous le comptoir. Je l'ai mise en vitrine. Autant que tu le saches."
  - qui: commercant
    sujet: achat
    si: "lieu == garage"
    texte: "Les occasions, c'est sous les néons. La neuve, sous la bâche. La bâche, je la soulève que pour ceux qui ont un salaire. Le vôtre, je le connais."
  - qui: commercant
    sujet: achat
    si: "lieu == tailleur"
    texte: "Trois essayages pour un costume, un seul pour les chaussures. Les présidents viennent pour le costume, les joueurs pour les chaussures. Et vous ?"
  - qui: commercant
    sujet: rumeur
    si: "lieu == tailleur && direction < 30 && role == entraineur"
    texte: "Le président m'a commandé un costume noir pour une conférence de presse, en janvier. Je ne demande jamais l'occasion. Mais le noir, en janvier…"
  - qui: commercant
    sujet: quartier
    si: "lieu == epicerie"
    texte: "Le cahier sous le comptoir, c'est les ardoises du quartier. La moitié de la Nord est dedans. Le jour où le club gagne quelque chose, j'efface tout."
  - qui: commercant
    sujet: quartier
    si: "lieu == fleuriste"
    texte: "Des gerbes aux couleurs du club, j'en fais cinq ou six par an, pour les enterrements d'abonnés. Les familles demandent toujours l'écharpe en travers."
  - qui: commercant
    sujet: argent
    si: "lieu == tabac"
    texte: "Les mariniers parient sur le niveau de la Rive, les autres sur le club. Votre cote est à l'ardoise. Vous voulez la voir, ou vous préférez dormir ?"
  - qui: commercant
    sujet: match
    si: "lieu == tabac_stade"
    texte: "Le score, je l'ai avant tout le monde : le photographe de L'Écho m'appelle depuis la tribune de presse. Vous voulez le savoir juste après moi ?"
  - qui: commercant
    sujet: achat
    si: "lieu == garage && possede(coupe_sport)"
    texte: "Votre coupé, faites la vidange chez moi, pas à la Capitale. Chez moi, on pose pas de questions sur l'argent. Sur l'huile, oui."
  - qui: commercant
    sujet: achat
    si: "lieu == tailleur && possede(costume_sur_mesure)"
    texte: "Votre costume tombe bien, je le vois d'ici. La doublure, je l'ai faite aux couleurs du club. Vous êtes la seule personne à le savoir."
  - qui: commercant
    sujet: quartier
    si: "lieu == boulangerie_residentiel && flag(vl_boulangere)"
    texte: "Le four neuf chauffe depuis cinq heures. Qui l'a payé, je le dis à personne. Votre pain est emballé, je vous le garde jusqu'à midi."
  - qui: commercant
    sujet: quartier
    si: "lieu == marche"
    texte: "Les poireaux viennent de la vallée, les nouvelles aussi. Le dimanche, je vends plus d'avis que de légumes. Les légumes, au moins, je les pèse."
  - qui: commercant
    sujet: match
    si: "lieu == marche && serie_v >= 1"
    texte: "Quand on gagne, les gens achètent des fraises, même chères. Je lis vos résultats dans mes cageots avant de les lire dans L'Écho."
  - qui: commercant
    sujet: match
    si: "lieu == marche && serie_d >= 2"
    texte: "Depuis quelque temps, on me prend des pommes de terre et on repart sans parler. Les fraises restent sur l'étal. Je sais lire un classement, moi aussi."
  - qui: commercant
    sujet: sponsor
    si: "lieu == club_prive"
    texte: "Ce soir, c'est complet. Pour vous, ce sera complet tous les soirs, sauf si quelqu'un vous attend à l'intérieur. Quelqu'un vous attend ?"
  - qui: commercant
    sujet: sponsor
    si: "lieu == club_prive && arc(co.sp.rideau)"
    texte: "On vous attend jeudi. Le patron a gardé le carré. Venez sans personne, et garez-vous derrière, pas sous le réverbère."
  - qui: commercant
    sujet: sombre
    si: "lieu == club_prive && tranche == nuit"
    texte: "Moi, je n'ai pas de mémoire. Ceux qui sortent d'ici à cette heure-ci, je ne les ai jamais vus. Et vous non plus, vous ne les avez pas vus."
  - qui: commercant
    sujet: match
    si: "lieu == kiosque && jour == lun"
    texte: "Le lundi, L'Écho tire deux mille de plus quand on gagne, et mille de plus quand on perd. Même les défaites, ils les achètent."
  - qui: commercant
    sujet: epoque
    si: "lieu == kiosque && annee >= 2015"
    texte: "Les gens lisent tout sur leur téléphone, maintenant. Ils m'achètent quand même L'Écho du lundi, pour le découper. Allez découper un écran, vous."
  - qui: commercant
    sujet: sombre
    si: "lieu == fleuriste && flag(sb_mort_tribune)"
    texte: "La gerbe pour Marcel, rangée H, la Nord l'a payée en pièces. J'ai compté jusqu'à minuit. Il en manquait un peu ; j'ai complété."
  - qui: commercant
    sujet: toi
    si: "lieu == fleuriste && role == joueur"
    texte: "Les joueurs viennent le lundi, après les défaites. Des fleurs pour leur femme. Pour leur mère, c'est plus rare."
  - qui: commercant
    sujet: argent
    si: "lieu == epicerie && caisse < 30"
    texte: "Deux joueurs du club ont leur nom dans le cahier, maintenant. Lesquels, je dirai pas. Mais la paie doit être en retard."
  - qui: commercant
    sujet: achat
    si: "lieu == garage && role == joueur"
    texte: "Les joueurs achètent toujours la voiture d'au-dessus de leurs moyens, et la revendent l'été suivant. Mon parc d'occasions, c'est l'histoire du club."
  - qui: commercant
    sujet: rumeur
    si: "lieu == tailleur && role == entraineur"
    texte: "Le costume de votre prédécesseur est encore sur un cintre, au fond. Il n'est jamais venu le chercher. Je le garde : on ne sait jamais qui revient."
  - qui: commercant
    sujet: match
    si: "lieu == tabac_stade && jour == sam"
    texte: "Les jours de match, je vends plus de pastilles à la menthe que de tabac. Faut pas rentrer chez soi en sentant la buvette."
  - qui: commercant
    sujet: rumeur
    si: "lieu == tabac && serie_d >= 2"
    texte: "Votre cote a bougé cette semaine : les mariniers ont misé contre vous. Ils se trompent rarement sur la météo, et souvent sur le reste."
