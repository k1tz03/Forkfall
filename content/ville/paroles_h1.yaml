# HISTOIRE 1 — « TROIS MILLE VISAGES » : ce que dit la ville pendant le livre.
#
# Une réplique ne fait pas avancer l'intrigue : elle prouve qu'elle avance.
# Chacune lit le drapeau du livre (`flag(histoire_h1)`, posé par le postulat
# `promu`) et, le plus souvent, une trace de ce qui vient d'arriver : la ville
# le dit avant que le joueur ne le lise. Aucune n'accorde rien au protagoniste
# (il peut être une femme). Camille ne se croise qu'à la maison, et plus après
# la valise. Les visages nouveaux du livre — Odette Marsal à sa papeterie,
# l'inspecteur Lhoste au Corner — ont leur place en ville (`presences`) et
# l'endroit où leurs cartes attendent (`rencontres`).
paroles:
  # ============================================================ GÉGÉ
  # La buvette, midi et soir. Il dit « nous », il compte, il ne ment jamais.
  - qui: gege
    sujet: toi
    si: "flag(histoire_h1) && relation.gege >= 2"
    texte: "Ton père buvait son café debout, sans sucre, en regardant la pelouse. Le virage l'a remarqué chez toi avant moi."
  - qui: gege
    sujet: club
    si: "flag(histoire_h1) && flag(h1_masques_tifo) && saison == 1"
    texte: "Trois mille, et pas un payé par le club. Le président jure qu'il y est pour rien. Pour une fois, c'est vrai."
  - qui: gege
    sujet: argent
    si: "flag(histoire_h1) && flag(h1_sp_cartons)"
    texte: "Quinze francs ta tête, à la boutique. Moi, je les donnais. Maintenant, les gamins comptent leurs pièces avant de t'aimer."
  - qui: gege
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_incendie)"
    texte: "La bâche a rien eu. Mon père l'avait pliée dans du papier journal de 1971. Le feu aime pas les vieux journaux, faut croire."
  - qui: gege
    sujet: rumeur
    si: "flag(histoire_h1) && flag(h1_berline_brulee)"
    texte: "Le président dit que c'était toi. La police dit que c'était toi. Moi, je dis que tu dormais. Tu dormais, hein ?"
  - qui: gege
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_passerelle)"
    texte: "Gigi, sous la passerelle. J'étais pas là. Je te le dis avant que tu demandes."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_vl_masques_rachetes)"
    texte: "Il manque cinq cents masques à mon compte, et le petit a des billets neufs dans sa boîte à sucre. T'aurais pas dû payer."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_vl_nino_gifle)"
    texte: "Le petit a eu sa gifle. Il vend plus rien au square. Il me parle plus non plus. Ça, c'est moi qui lui ai appris."
  - qui: gege
    sujet: club
    si: "flag(histoire_h1) && flag(h1_vl_carton_rendu)"
    texte: "Le carton est revenu, le scotch intact. Tu l'as pas ouvert. Moi, je l'aurais ouvert."
  - qui: gege
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_carton_livre)"
    texte: "Quarante-huit heures au commissariat. Ils m'ont rendu ma ceinture et mon écharpe. Le reste, je le garde pour toi."
  - qui: gege
    sujet: epoque
    si: "flag(histoire_h1) && flag(h1_local_aveu)"
    texte: "Mon père et le tien, sur le grillage, en 1971. Ils se connaissaient pas. Une heure à tenir la même bâche, et même pas un bonjour."
  - qui: gege
    sujet: match
    si: "flag(histoire_h1) && flag(h1_masques_tifo) && serie_v >= 1"
    texte: "Quand on gagne, ils lèvent tes yeux. Quand on perd, ils les baissent. J'ai rien demandé, ils ont trouvé tout seuls."
  - qui: gege
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_appel)"
    texte: "Le dernier samedi, y aura du monde à la friche. Des palettes, du feu, tout le virage. Tu viendras voir brûler quelque chose."

  # ============================================================ ODETTE MARSAL
  # La librairie-papeterie, le matin et l'après-midi. Elle regarde avant de
  # parler, et elle parle comme on cadre.
  - qui: odette
    sujet: epoque
    si: "flag(histoire_h1)"
    texte: "Avant le football, je faisais les mariages. Les mêmes promesses, les mêmes sourires sur les marches. Et les albums, personne ne les rouvre."
  - qui: odette
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_masques_tifo)"
    texte: "Trois mille fois votre visage, et pas un tirage net. Le carton boit l'encre. Il boit tout, le carton."
  - qui: odette
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_odette_froide)"
    texte: "Vous avez oublié votre monnaie, l'autre jour. Je l'ai mise dans une enveloppe, avec votre nom dessus. Elle vous attend."
  - qui: odette
    sujet: rumeur
    si: "flag(histoire_h1) && flag(h1_negatif)"
    texte: "On me demande si j'ai d'autres photos de 1974. J'en ai quatre cents. Une seule intéresse les gens, et ce n'est pas la meilleure."
  - qui: odette
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_archives)"
    texte: "Ils ont pris mes planches aux archives de L'Écho. Mes planches. J'aurais aimé qu'on me demande ; j'aurais choisi pour eux."
  - qui: odette
    sujet: epoque
    si: "flag(histoire_h1) && flag(h1_brassard_vu)"
    texte: "Il n'y avait qu'un brassard sur le terrain, ce jour-là. Je l'ai photographié douze fois. Onze fois, il gagnait."
  - qui: odette
    sujet: argent
    si: "flag(histoire_h1) && flag(h1_photo_1977)"
    texte: "Ma boutique, c'est une photo. Je le savais en signant le bail. Le loyer, je l'ai payé autrement."
  - qui: odette
    sujet: quartier
    si: "flag(histoire_h1)"
    texte: "Le stylo bleu, c'est pour l'école. Le noir, pour le président. Le rouge, pour le virage et ses banderoles. Je vends à tout le monde."
  - qui: odette
    sujet: club
    si: "flag(histoire_h1) && flag(h1_photo_volee)"
    texte: "La photo de l'escalier, c'était un de mes tirages. Celui qui l'a décrochée a laissé le clou. Un connaisseur."
  - qui: odette
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_lettre_lue)"
    texte: "Vous tenez un papier comme lui. Par le coin, du bout de deux doigts."
  - qui: odette
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_voiture_saisie)"
    texte: "Une dépanneuse à six heures, rue des Lilas. J'ai entendu la chaîne depuis ma cuisine. Je n'ai pas pris l'appareil. Je vieillis."

  # ============================================================ L'INSPECTEUR LHOSTE
  # Le Corner, le soir. Police judiciaire de Portclair ; il ne parle de lui
  # qu'une fois, dans la Nord vide. Il ne dit rien avant la berline.
  - qui: lhoste
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_berline_brulee)"
    texte: "Je suis de Portclair. Ici, tout le monde a votre tête dans un tiroir. Moi, je l'ai dans un sac plastique, avec une étiquette."
  - qui: lhoste
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_berline_brulee)"
    texte: "La berline a brûlé en dix-huit minutes. Le masque sur le capot a pas bougé, collé à la colle à bois. Vous connaissez des gens soigneux ?"
  - qui: lhoste
    sujet: rumeur
    si: "flag(histoire_h1) && flag(h1_mur)"
    texte: "Trois couches de blanc, et la phrase revient. On me dit que c'est la pluie. Elle a une belle écriture, votre pluie."
  - qui: lhoste
    sujet: club
    si: "flag(histoire_h1) && flag(h1_vitrine)"
    texte: "Le directeur de la banque porte pas plainte. Vous en avez déjà vu, vous, un banquier qui porte pas plainte ?"
  - qui: lhoste
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_passerelle)"
    texte: "Votre gardien parle pas. Il peut pas. Il écrit sur son ardoise, et il efface plus vite qu'il écrit."
  - qui: lhoste
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_voiture_saisie)"
    texte: "Votre voiture est au dépôt de Portclair, on vous la rendra. Le masque, non. C'est une pièce, maintenant. Il a un numéro."
  - qui: lhoste
    sujet: epoque
    si: "flag(histoire_h1) && flag(h1_lhoste_1974)"
    texte: "J'ai encore le billet du douzième rang, quelque part. Il vaut plus rien. Je le garde quand même."
  - qui: lhoste
    sujet: match
    si: "flag(histoire_h1) && flag(h1_berline_brulee) && serie_d >= 1"
    texte: "Vous perdez, et la Nord lève quand même vos yeux. Chez nous, on appelle ça un mobile."
  - qui: lhoste
    sujet: quartier
    si: "flag(histoire_h1) && flag(h1_berline_brulee)"
    texte: "Le Corner, c'est le seul endroit où on me sert sans me demander mon nom. Ils doivent le connaître."
  - qui: lhoste
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_carton_livre)"
    texte: "Le carton venait de chez vous, et c'est son propriétaire qui a dormi chez nous. Je sais pas encore si c'est une bonne affaire pour vous."
  - qui: lhoste
    sujet: rumeur
    si: "flag(histoire_h1) && flag(h1_lhoste_prevenu)"
    texte: "Quatre voitures aux Hauts-de-Rive, samedi. C'est vous qui m'avez donné l'adresse. Le virage, il vous le rendra pas, ce service-là."
  - qui: lhoste
    sujet: argent
    si: "flag(histoire_h1) && flag(h1_sauvat_donne)"
    texte: "Le fils Sauvat a dormi chez nous. Il a demandé une couverture et le résultat du match. Les deux, je les lui ai donnés."

  # ============================================================ GIGI VECCHIO
  # Le stade, le terrain annexe. Il est lent, il regarde trop longtemps. Après la
  # passerelle (saison 2 de la ville), la mâchoire tenue par des fils : il écrit
  # sur une ardoise, et ses répliques parlées se taisent jusqu'à la saison 3.
  - qui: vecchio
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_ardoise_lue) && saison >= 3"
    texte: "Le filet de 74 est dans le placard de la buvette. Je l'ai jamais rendu. Tu le veux, petit ?"
  - qui: vecchio
    sujet: epoque
    si: "flag(histoire_h1) && !flag(h1_passerelle)"
    texte: "J'avais vingt-cinq ans, le jour de la finale. Du match, je me rappelle rien. Le bruit du filet, par contre…"
  - qui: vecchio
    sujet: club
    si: "flag(histoire_h1) && flag(h1_maillot_gigi) && !flag(h1_passerelle)"
    texte: "Le maillot est dans son papier, chez moi. Je l'ai pas déplié. Je sais ce qu'il y a dessus. La boue, le numéro…"
  - qui: vecchio
    sujet: achat
    si: "flag(histoire_h1) && flag(h1_maillot) && !flag(h1_passerelle)"
    texte: "Tu l'as payé trop cher. Moi aussi, je l'aurais payé trop cher, petit. Je l'aurais pas laissé partir, ce maillot."
  - qui: vecchio
    sujet: match
    si: "flag(histoire_h1) && serie_d >= 1 && !flag(h1_passerelle)"
    texte: "Trois buts, c'est rien, petit. En soixante-dix-huit, un dimanche, j'en ai pris cinq, et le cinquième…"
  - qui: vecchio
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_filet_rendu)"
    texte: "Le placard est vide. Je l'ouvre quand même tous les soirs. À mon âge, hein."
  - qui: vecchio
    sujet: rumeur
    si: "flag(histoire_h1) && flag(h1_massenet_publie) && !flag(h1_passerelle)"
    texte: "Massenet a publié sa page. Et les gens me saluent pareil. Comme avant. Ils le savaient tous, alors."
  - qui: vecchio
    sujet: quartier
    si: "flag(histoire_h1) && !flag(h1_passerelle)"
    texte: "Je recouds les filets du terrain annexe le jeudi. Si tu passes, apporte du fil rouge. Le club en commande plus."
  - qui: vecchio
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_passerelle) && saison == 2"
    texte: "Il sort une ardoise de sa poche et écrit à la craie : LE DOC DIT PAS UN MOT. Il souligne PAS, deux fois, et rit sans ouvrir la bouche."
  - qui: vecchio
    sujet: match
    si: "flag(histoire_h1) && flag(h1_passerelle) && saison == 2"
    texte: "Il tapote ses fils du bout du doigt, puis écrit sur l'ardoise : SOUPE. TROIS SEMAINES. DIS AU VIRAGE QUE ÇA VA."
  - qui: vecchio
    sujet: epoque
    si: "flag(histoire_h1) && flag(h1_passerelle) && saison >= 3"
    texte: "Le Doc m'a retiré les fils en août. Je parle moins bien qu'avant. Remarque, je causais trop."
  - qui: vecchio
    sujet: quartier
    si: "flag(histoire_h1) && flag(h1_passerelle) && saison >= 3"
    texte: "Je recouds encore les filets le jeudi. Pour rentrer, je passe plus par le quai. Dix minutes de plus, à mon âge."

  # ============================================================ MADAME JOSIANE
  - qui: josiane
    sujet: club
    si: "flag(histoire_h1) && flag(h1_photo_volee)"
    texte: "La photo de l'escalier a disparu cette nuit. Il reste le clou. Je ne sais pas ce qu'on accroche, maintenant."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h1)"
    texte: "Le président m'a demandé votre adresse personnelle pour la quatrième fois. Je lui donne celle du club. Il fait semblant de ne pas voir."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h1) && flag(h1_berline_brulee)"
    texte: "Le président vient en taxi, maintenant. Il fait attendre le chauffeur en bas, moteur allumé, toute la matinée."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h1) && flag(h1_photo_rendue)"
    texte: "La photo est revenue, avec son visage. Je ne demande pas d'où elle sort. Je l'ai remise au clou, et j'ai passé un chiffon sur le verre."
  - qui: josiane
    sujet: rumeur
    si: "flag(histoire_h1) && flag(h1_vitrine)"
    texte: "Le directeur de la banque a appelé trois fois pour savoir si le club lui doit de l'argent. Il le sait très bien. Il veut l'entendre."
  - qui: josiane
    sujet: epoque
    si: "flag(histoire_h1)"
    texte: "Je suis arrivée en 1987. Personne ne m'a parlé de 1974. On m'a juste dit de ne pas monter aux archives. C'est comme ça que j'ai su."

  # ============================================================ VAUBOURG
  - qui: aulard
    sujet: club
    si: "flag(histoire_h1) && flag(h1_masques_tifo) && saison == 1"
    texte: "J'ai fait chercher l'imprimeur. Payé en liquide, par un type en écharpe. Une écharpe, c'est pas un nom."
  - qui: aulard
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_berline_brulee)"
    texte: "L'assurance me demande si j'ai des ennemis. Je leur ai envoyé la liste des abonnés de la Nord. Il y a un supplément ?"
  - qui: aulard
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_coffre_defi)"
    texte: "Tu crois que je vais tomber. Je suis tombé en 1977, et je me suis relevé président. Ça s'apprend, tu verras."
  - qui: aulard
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_pacte_coffre)"
    texte: "La feuille dort. Tant qu'elle dort, on dort tous. Toi aussi, d'ailleurs. T'as meilleure mine."
  - qui: aulard
    sujet: argent
    si: "flag(histoire_h1) && flag(h1_sp_cartons)"
    texte: "La boutique vend ta tête deux cents fois par samedi. Pour une fois que ton visage rapporte quelque chose au club."
  - qui: aulard
    sujet: epoque
    si: "flag(histoire_h1)"
    texte: "J'étais trésorier, en 1974. Moi, je tenais les cahiers, je regardais pas le terrain. C'est ce que j'ai dit à la Fédération, et c'était vrai."

  # ============================================================ MASSENET
  - qui: meneche
    sujet: epoque
    si: "flag(histoire_h1) && flag(h1_article_1974)"
    texte: "Je relis mon article tous les ans, en mars. Le titre tient. Le reste, je l'écrirais plus pareil."
  - qui: meneche
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_archives)"
    texte: "Ils ont pris 1974 et laissé 1975. 1975, personne a envie de le relire. Moi le premier."
  - qui: meneche
    sujet: rumeur
    si: "flag(histoire_h1) && flag(h1_massenet_publie)"
    texte: "Ma page est sortie avec dix-sept ans de retard. Mon rédacteur en chef dit que c'est un record. Il sait pas lequel."
  - qui: meneche
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_masques_tifo)"
    texte: "On me demande qui vous êtes. Je réponds : un entraîneur. C'est la première fois depuis longtemps que je mens par politesse."

  # ============================================================ CAMILLE (à la maison)
  - qui: camille
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_masque_sous_fenetre) && lieu == appartement && !flag(divorce)"
    texte: "J'ai mis un rideau plus épais. Pas pour lui. Pour moi. Je veux plus savoir s'il est en bas."
  - qui: camille
    sujet: toi
    si: "flag(histoire_h1) && lieu == appartement && !flag(divorce)"
    texte: "Quinze ans que tu parlais jamais de cette ville. Maintenant, tu parles que d'elle. En dormant."
  - qui: camille
    sujet: quartier
    si: "flag(histoire_h1) && flag(h1_voiture_saisie) && lieu == appartement && !flag(divorce)"
    texte: "La concierge te prête sa bicyclette. J'ai dit oui pour toi. Les freins, faudra voir."
  - qui: camille
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_lettre_lue) && lieu == appartement && !flag(divorce)"
    texte: "Tu l'as lue jusqu'au bout. Ça se voit. Tu la touches plus à travers ta veste."

  # ============================================================ VUKIĆ
  - qui: vukic
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_masques_tifo)"
    texte: "Quatre joueurs ont ton visage dans leur casier. Lesquels, c'est dans le cahier."
  - qui: vukic
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_passerelle)"
    texte: "Six heures, j'ai appelé. Quelqu'un devait. La police, elle, à sept."
  - qui: vukic
    sujet: club
    si: "flag(histoire_h1) && flag(h1_cercueil)"
    texte: "Le cercueil, au dépôt municipal. Debout, entre les barrières de sécurité. Ils savent pas où le mettre."

  # ============================================================ LA VILLE
  - qui: passant
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_masques_tifo)"
    texte: "Ma fille dort avec votre tête sur la table de nuit. Le carton, je veux dire. Elle dit que vous la gardez."
  - qui: commercant
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_masques_tifo)"
    texte: "On m'a payé avec votre visage plié dans les billets. Je l'ai mis sous la caisse. On sait jamais, avec vous."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h1) && saison == 1"
    texte: "Votre façon de vous tenir debout sur le banc, les mains dans le dos… J'ai vu ça une fois. En 1974. Ça vous dit rien ?"
  - qui: enfant
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_masques_tifo) && tranche == soir"
    texte: "Je suis toi !"
  - qui: fan
    sujet: club
    si: "flag(histoire_h1) && flag(h1_masques_tifo) && tribunes >= 80"
    texte: "Trois mille, coach. On en refait mille pour le derby. Gégé dit que vous aimez pas trop. C'est vrai ?"
  - qui: passante
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_masque_sous_fenetre)"
    texte: "Il était sous votre fenêtre, ou c'était vous ? Avec ces masques, je sais plus qui j'ai salué ce matin."
  - qui: commercant
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_berline_brulee)"
    texte: "La berline du président, on l'a remorquée à deux heures. Le masque était encore sur le capot. Personne a voulu y toucher."
  - qui: ancien
    sujet: rumeur
    si: "flag(histoire_h1) && flag(h1_mur)"
    texte: "« Ceux de 74 paieront. » C'est peint sur le mur des guichets. On dit que la phrase est de vous. Elle est de vous ?"
  - qui: passant
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_passerelle)"
    texte: "Sous la passerelle, ils ont tout lavé au jet. Il reste une tache sur la pierre. Les gamins font le tour par le pont."
  - qui: commercant
    sujet: argent
    si: "flag(histoire_h1) && possede(maillot_1974)"
    texte: "Le maillot du 5, c'est vous ? Mon père prenait les paris, cette année-là. Il disait que le 5 regardait jamais les tribunes."
  - qui: fan
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_voiture_saisie)"
    texte: "Ils ont emmené votre voiture à six heures du matin, comme celle d'un voleur. Samedi, la Nord chantera votre nom plus fort, vous verrez."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h1) && flag(h1_nom_grave)"
    texte: "Ravenel, sur la plaque. Il était temps. Des années qu'on passait devant le caveau en regardant nos pieds."
  - qui: fan
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_salut_virage)"
    texte: "Vous nous avez salués, le premier jour. Le dernier qui saluait la Nord comme ça, c'était le capitaine de 74. Après, plus personne."
  - qui: passant
    sujet: rumeur
    si: "flag(histoire_h1) && flag(h1_vitrine)"
    texte: "1974 sur la vitrine de la banque. Ma femme a retiré nos économies le lendemain. Elle sait pas pourquoi. Moi non plus."
  - qui: enfant
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_vl_masques_rachetes)"
    texte: "Nino a plus de masques à vendre. Il dit qu'on les a tous achetés d'un coup. C'était vous ? Vous allez en faire quoi ?"
  - qui: passante
    sujet: quartier
    si: "flag(histoire_h1) && flag(h1_voiture_saisie)"
    texte: "Rue des Lilas, à six heures, toutes les lumières se sont allumées en même temps. On aurait dit un réveillon sans personne."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h1) && flag(h1_cercueil)"
    texte: "Un cercueil avec RAVENEL dessus. En 1975, on avait pas eu besoin de cercueil. La Rive avait suffi."
  - qui: fan
    sujet: sombre
    si: "flag(histoire_h1) && flag(h1_carton_livre)"
    texte: "Gégé au commissariat, pour un carton trouvé chez quelqu'un d'autre. Le virage sait chez qui. Les adresses, on les a toutes."
  - qui: commercant
    sujet: rumeur
    si: "flag(histoire_h1) && flag(h1_coffre_defi)"
    texte: "RAVENEL A AVOUÉ, en page une. J'en ai vendu trois cents avant neuf heures. Les gens les lisent dans la rue, debout, sans payer."
  - qui: passant
    sujet: match
    si: "flag(histoire_h1) && flag(h1_masques_tifo) && serie_v >= 2"
    texte: "Quand vous gagnez, mon fils dort avec le masque. Quand vous perdez aussi. Il dit que c'est jamais votre faute."
  - qui: ancien
    sujet: toi
    si: "flag(histoire_h1) && flag(h1_lettre_lue)"
    texte: "Vous avez l'air de quelqu'un qui a enfin lu son courrier. Ça se voit aux épaules, ces choses-là."
  - qui: passante
    sujet: rumeur
    si: "flag(histoire_h1) && flag(h1_quai_trahi)"
    texte: "Au tabac du Quai, y a un monsieur en imperméable qui a perdu gros, l'autre samedi. Il demande votre adresse à tout le monde."
  - qui: ancien
    sujet: rumeur
    si: "flag(histoire_h1) && flag(h1_vl_registre_lu)"
    texte: "Paraît que vous avez fouillé à la cave du tabac. Le fils Sauvat aime pas qu'on lise ses vieux cahiers. Son père non plus."

presences:
  - {qui: odette, lieu: librairie, tranches: [matin, aprem]}
  - {qui: lhoste, lieu: bar, tranches: [soir]}

rencontres:
  odette: librairie
  lhoste: bar

# Ce qu'on voit en entrant, pendant le livre (la première vraie remplace la
# description de la porte).
lieux_variantes:
  - lieu: caveau
    si: "flag(histoire_h1) && flag(h1_nom_grave)"
    texte: "Le caveau du Racing. Sur la plaque neuve, des lettres fraîches : HENRI RAVENEL, 1932-1975. Quelqu'un a laissé un brin de buis dans le creux du R."
  - lieu: caveau
    si: "flag(histoire_h1)"
    texte: "Le caveau du Racing. Des présidents en lettres d'or, des capitaines en lettres noires et, entre deux d'entre eux, une plaque neuve où rien n'est gravé."
  - lieu: clubhouse
    si: "flag(histoire_h1) && flag(h1_photo_volee)"
    texte: "Le club-house. Dans l'escalier, un clou seul au milieu d'un rectangle plus clair. Les anciens ralentissent à la neuvième marche."
  - lieu: banque
    si: "flag(histoire_h1) && flag(h1_vitrine)"
    texte: "La Banque Aubérivoise. À contre-jour, sur la vitrine lavée, on devine encore le 1974. Le distributeur porte un sparadrap neuf."
  - lieu: librairie
    si: "flag(histoire_h1) && flag(h1_negatif)"
    texte: "La librairie-papeterie d'Odette Marsal. Dans la vitrine, des cartes de vœux, et au milieu, la Nord pleine, en 1974, sous un cadre doré."
  - lieu: buvette
    si: "flag(histoire_h1) && flag(h1_filet_rendu)"
    texte: "La buvette du kop. Au fond, le placard de Gigi est ouvert et vide, la clé sur la serrure. On empile les caisses de bière à côté."
  - lieu: garage
    si: "flag(histoire_h1) && flag(h1_berline_brulee)"
    texte: "Le garage du Pont. Au fond de l'atelier, sous une bâche, une forme de grosse voiture qui sent encore le brûlé."
  - lieu: stade
    si: "flag(histoire_h1) && flag(h1_mur)"
    texte: "Le stade de la Rive. Sur le mur des guichets, sous trois couches de blanc, on lit encore CEUX DE 74, à hauteur d'homme."
