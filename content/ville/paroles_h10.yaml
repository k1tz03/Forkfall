# « Les Deux Téléphones » (histoire 10, 2037-2040) — ce que la ville dit, devine
# et répète de la présidente, à mesure que le livre avance. Format : en-tête de
# content/ville/paroles_personnages.yaml. Toutes les lignes lisent
# `flag(histoire_h10)` ; aucune n'accorde le personnage joué ; aucune ne répète
# mot pour mot la scène qu'elle commente. La phrase de Nadia Rouvier
# (« Respire. Encore. ») ne sert qu'une fois, ici.
# `saison` est celle de la ville (1 = 2037-2038) ; `annee` l'année du moteur.
paroles:
  # ════════════════════════════════════════════════════════════ LES PASSANTS
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h10) && saison == 1"
    texte: "La dernière montée possible, et c'est à nous de la faire. On a jamais rien fait à l'heure, ici."
  - qui: fan
    sujet: club
    si: "flag(histoire_h10) && tribunes >= 75"
    texte: "Socio numéro trois mille quatre. J'ai voté pour la 212. Mon grand-père était au virage en 1974. Montez-nous, c'est tout."
  - qui: enfant
    sujet: quartier
    si: "flag(histoire_h10) && flag(h10_escalier) && saison == 1"
    texte: "Le monsieur mure une marche de l'escalier tous les mois. Ma sœur dit trente-deux, moi trente-trois. Après, on passe par où ?"
  - qui: enfant
    sujet: quartier
    si: "flag(histoire_h10) && flag(h10_escalier) && saison == 2"
    texte: "Il en reste onze. Ou douze, ma sœur triche, elle compte celle du mois. Le monsieur dit qu'on a raison tous les deux."
  - qui: enfant
    sujet: quartier
    si: "flag(histoire_h10) && flag(h10_escalier) && saison == 3 && phase == retour"
    texte: "Il reste une marche, peut-être deux. Après, on montera par la tribune Est, avec les gens assis. Mon père dit que ça sera plus monter, ça."
  - qui: passant
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_maquette_trois)"
    texte: "La maquette de chez Tessandier, ils l'ont repeinte. Ma mère dit qu'elle était déjà dans la vitrine quand elle était petite."
  - qui: ancien
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_voix_gardee)"
    texte: "La voix de Gigi au micro… Ma femme quitte la tribune quand elle commence. Il parle comme un vendeur de cuisines, maintenant."
  - qui: commercant
    sujet: argent
    si: "flag(histoire_h10) && possede(helico)"
    texte: "Un hélicoptère sur la pelouse ? Les habitués du Quai ont ouvert une cote sur le temps qu'il va rester. Les socios disent Noël."
  - qui: passante
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_photo_hotel)"
    texte: "Au bar de l'hôtel avec une dame en manteau, à minuit ? Ma fille dit que c'est une agente. Une agente, à cette heure-là ? Moi je dis non."
  - qui: fan
    sujet: club
    si: "flag(histoire_h10) && flag(h10_clapet_nino)"
    texte: "Nino a parlé une heure de l'accord de franchise, ce soir, au local. Avant, il parlait que des tambours."
  - qui: commercant
    sujet: achat
    si: "flag(histoire_h10) && flag(h10_helico_saisi)"
    texte: "Votre hélicoptère est parti sur un camion, les pales pliées comme un oiseau mort. Mon fils a filmé. Tout le monde a filmé."
  - qui: fan
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_gege_mort)"
    texte: "Toute la Nord avec la tête de Gégé en carton, imprimée dans la nuit. Mon père dit qu'en 1990 on avait fait pareil pour quelqu'un. Il sait plus qui."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h10) && annee >= 2040"
    texte: "L'escalier est fermé. Mon petit-fils demande ce que c'était, monter. Je lui ai dit : un dimanche soir dans la rue, et personne qui dormait."
  - qui: fan
    sujet: club
    si: "flag(histoire_h10) && flag(h10_socios_compte)"
    texte: "Cent quarante-neuf contre cent quarante-six. Mon père était dans les trois qu'on a pas comptés. À son âge, il lève la main lentement."
  - qui: fan
    sujet: match
    si: "flag(histoire_h10) && flag(h10_debout_masques)"
    texte: "Pendant la minute, j'ai regardé la loge à travers les trous du masque. Quelqu'un était debout, là-haut. J'ai serré le bras de mon voisin."
  - qui: fan
    sujet: match
    si: "flag(histoire_h10) && flag(h10_reste_assis)"
    texte: "Pendant la minute, la loge est restée assise. Trois mille cartons l'ont vue. Les cartons, on les a gardés."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h10) && flag(h10_marche_ouverte)"
    texte: "Il reste une marche ouverte à l'escalier nord. Une seule. Les vieux y montent un par un, pour pouvoir dire qu'ils sont montés."
  - qui: passant
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_marche_muree)"
    texte: "La dernière marche, ils l'ont murée la nuit, pour que personne voie. Raté. Au matin, le ciment était encore chaud."
  - qui: commercant
    sujet: achat
    si: "flag(histoire_h10) && possede(oreillette)"
    texte: "L'oreillette qui répond toute seule ? C'est la troisième que je vends cette semaine. Les deux autres acheteurs avaient aussi deux téléphones."
  - qui: commercant
    sujet: achat
    si: "flag(histoire_h10) && possede(autonome)"
    texte: "Votre voiture sans volant s'est garée devant mon tabac trois fois cette semaine, toute seule, moteur coupé. Elle doit attendre quelqu'un."
  - qui: passante
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_voiture_saisie)"
    texte: "La voiture sans volant est montée sur la dépanneuse en marche arrière, toute seule, prudente. La Nord a applaudi. Moi aussi, un peu."
  - qui: ancien
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_sb_devant)"
    texte: "Des cartes de socio levées sous un réverbère, à minuit. Personne qui crie. En 1990, on aurait cassé une vitre."
  - qui: passant
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_sb_vitrine)"
    texte: "Un pavé dans la vitrine de Tessandier, un vieux masque posé dans le parc en mousse. Personne a rien volé. Depuis, tout le quartier ferme à clé."
  - qui: ancien
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_sb_ciment)"
    texte: "Quelqu'un écrit « 2040 » au doigt dans le ciment de l'escalier nord. Le maçon refait la marche. Le lendemain, c'est réécrit."
  - qui: fan
    sujet: club
    si: "flag(histoire_h10) && flag(h10_fusion_etudiee)"
    texte: "Fusionner avec {rival} ? Mon grand-père se retournerait. Il est enterré face à leur stade ; c'est pour ça qu'il dort mal."
  - qui: fan
    sujet: club
    si: "flag(histoire_h10) && flag(h10_bouteille_renvoyee)"
    texte: "On a renvoyé leur bouteille. Gégé l'a portée lui-même jusqu'au coursier. Il marchait comme en 1984."
  - qui: fan
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_fusion_refusee)"
    texte: "Le projet de fusion, Nino l'a déchiré en quatre devant tout le local. Il a gardé les morceaux dans sa veste. Nino, quoi."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h10) && flag(h10_owen_vire)"
    texte: "Le verre d'eau de Corven est toujours sur le banc. Personne ose le ranger. L'eau s'est évaporée, y a plus qu'une trace au fond."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h10) && flag(h10_owen_garde)"
    texte: "Le fils Corven reste. Son père posait un verre d'eau plein sur le comptoir du bar d'en face et y touchait jamais. Lui, il le boit."
  - qui: passante
    sujet: quartier
    si: "flag(histoire_h10) && flag(h10_entrepot_vide)"
    texte: "Les camions de la Tréfilerie sont partis à l'aube. Mon fils y travaillait. Il travaille à vingt kilomètres, maintenant, quand le car passe."
  - qui: passant
    sujet: argent
    si: "flag(histoire_h10) && flag(h10_entrepot_signe)"
    texte: "Un bail de dix ans, pour les entrepôts de la Tréfilerie. Dix ans ! La division, elle tiendra pas dix ans."
  - qui: fan
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_dette_nino)"
    texte: "Nino a payé sa dette au Terminus en une nuit. Avec quel argent ? On demande pas. Au local, on a jamais demandé."
  - qui: fan
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_nino_lache)"
    texte: "Nino joue plus au Terminus. Paraît qu'il a un patron, maintenant. Qui, on le dit pas."
  - qui: commercant
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_brac_vendu)"
    texte: "Le petit Brac est parti par le car de huit heures. Sa mère a acheté L'Écho trois fois cette semaine, pour la même photo."
  - qui: enfant
    sujet: match
    si: "flag(histoire_h10) && flag(h10_brac_revenu)"
    texte: "Le petit Brac est revenu en Nord avec le maillot de la capitale sous son blouson. Il a crié nos chansons quand même, plus fort que nous."
  - qui: fan
    sujet: classement
    si: "flag(histoire_h10) && rang <= 4 && journee >= 12"
    texte: "{rang}. À ce rang-là, le jour de la loi, on monte. Je dors plus. Je fais les points avec ma grand-mère, au crayon."
  - qui: ancien
    sujet: classement
    si: "flag(histoire_h10) && rang >= 12 && journee >= 12 && saison == 3"
    texte: "{rang}, à quelques mois de la loi. On restera en bas pour toujours. Remarquez, en bas, j'y ai passé ma vie."
  - qui: passant
    sujet: epoque
    si: "flag(histoire_h10) && annee >= 2038"
    texte: "La loi des franchises, c'est simple. Ceux qui sont en haut en juin 2040, ils y restent. Ceux d'en bas aussi."
  - qui: fan
    sujet: sponsor
    si: "flag(histoire_h10) && flag(h10_helico)"
    texte: "Rive Capital a posé un hélicoptère sur notre pelouse. Un hélicoptère, pour un club de deuxième division. Ils nous veulent quelque chose."
  - qui: passante
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_verite_hotel)"
    texte: "La photo de l'hôtel ? On a dit la vérité : Rive Capital. Au moins, c'est quelqu'un qu'on connaît. Enfin, qu'on croit connaître."
  - qui: commercant
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_madame_vue)"
    texte: "Une dame en manteau d'automne m'a acheté un journal ce matin. Elle a payé avec un billet neuf, et elle m'a demandé de vos nouvelles."
  - qui: ancien
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_gege_mort)"
    texte: "Au-dessus du local, la lumière est restée allumée trois jours. Personne a osé monter l'éteindre."
  - qui: enfant
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_gege_mort)"
    texte: "J'ai gardé mon masque de Gégé. Ma mère veut le jeter. Je l'ai caché sous mon lit, face au mur, pour qu'il dorme."
  - qui: fan
    sujet: match
    si: "flag(histoire_h10) && flag(h10_voix_coupee)"
    texte: "Sans la voix de Gigi, on entend les joueurs s'appeler sur le terrain. Ils ont des voix de gamins. Ça m'a fait drôle."
  - qui: fan
    sujet: club
    si: "flag(histoire_h10) && flag(h10_parle_virage)"
    texte: "Le soir de la saisie, la présidence est montée sur le banc des remplaçants pour nous parler. On a sifflé les huissiers. Pas le banc."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h10) && saison == 2"
    texte: "Votée à quatre voix, la loi. Quatre ! J'ai vu des matchs gagnés de quatre buts. Une loi, jamais."
  - qui: passant
    sujet: quartier
    si: "flag(histoire_h10) && flag(h10_plaque_posee)"
    texte: "La plaque Rive Capital, sur la porte du centre de formation, est de travers. Quelqu'un la redresse la nuit ; quelqu'un d'autre la penche."
  - qui: commercant
    sujet: argent
    si: "flag(histoire_h10) && flag(h10_enveloppe_gardee)"
    texte: "On m'a payé en billets neufs qui se suivaient, ce matin. Je les ai mis à part. Les billets qui se suivent, moi, je m'en méfie."
  - qui: enfant
    sujet: club
    si: "flag(histoire_h10)"
    texte: "Mon père dit que si on monte, on aura des maillots neufs pour toujours. Sinon, les vieux pour toujours. Moi, je les aime bien, les vieux."
  - qui: fan
    sujet: club
    si: "flag(histoire_h10) && flag(h10_lettre_virage)"
    texte: "J'ai signé la lettre de dimanche dans la marge, au stylo bille. Ma signature est à côté de celle de mon père. On l'avait jamais fait ensemble."
  - qui: ancien
    sujet: sponsor
    si: "flag(histoire_h10) && flag(h10_maillot_terrasses)"
    texte: "Le maillot avec la troisième tranche dessus, je le porte à l'envers. L'étiquette dit « fabriqué ailleurs ». C'est plus honnête."

  # ═══════════════════════════════════════════════════════════════════ NINO
  # Le capo, cinquante-trois ans. On le croise à la buvette, l'après-midi et le
  # soir. Il compte ; il tutoie ; il aime son oncle et il a des dettes.
  - qui: nino
    sujet: toi
    si: "flag(histoire_h10) && saison == 1"
    texte: "Mille quatre cent trois cartes pour toi. J'ai compté deux fois. La deuxième, c'était pour le plaisir."
  - qui: nino
    sujet: club
    si: "flag(histoire_h10) && phase == presaison"
    texte: "Le local ouvre à dix-huit heures, la buvette à dix-neuf. Entre les deux, on compte. Tu peux venir regarder."
  - qui: nino
    sujet: match
    si: "flag(histoire_h10) && serie_v >= 1"
    texte: "Trois tambours neufs, payés par les socios. Pas un écu du club. Ils tapent plus fort quand ils sont à nous."
  - qui: nino
    sujet: match
    si: "flag(histoire_h10) && serie_d >= 1"
    texte: "Le virage veut une assemblée. Je dis qu'il faut attendre le prochain bloc. Je dis ça depuis 2020."
  - qui: nino
    sujet: argent
    si: "flag(histoire_h10) && flag(h10_socios_compte)"
    texte: "La motion est passée à trois cartes. Trois, à la buvette, c'est beaucoup. C'est une famille."
  - qui: nino
    sujet: argent
    si: "flag(histoire_h10) && flag(h10_socios_recompte)"
    texte: "T'as recompté devant tout le monde. Mon oncle a dit que t'avais bien fait. Ça, j'ai pas aimé."
  - qui: nino
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_clapet_nino) && !flag(h10_nino_retourne)"
    texte: "Tout le monde a un téléphone qu'il montre pas. Le mien, c'est pour mes dettes. Et le tien ?"
  - qui: nino
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_nino_retourne)"
    texte: "Au zinc, on a dit : ensemble. J'ai pas oublié. Elle non plus. Elle a rappelé deux fois, la nuit d'après."
  - qui: nino
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_gege_mort)"
    texte: "Il avait plié la bâche en seize, comme son père. Je l'ai dépliée pour voir. J'arrive pas à la replier."
  - qui: nino
    sujet: sponsor
    si: "flag(histoire_h10) && flag(h10_maillot_terrasses)"
    texte: "Le maillot à l'envers, c'était mon idée. L'étiquette dehors, ça se lit de loin : fabriqué ailleurs."
  - qui: nino
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_dette_nino)"
    texte: "Je te dois quarante mille écus et un oncle. Les écus, je te les rendrai."
  - qui: nino
    sujet: club
    si: "flag(histoire_h10) && flag(h10_nino_lache)"
    texte: "Le Terminus a fermé ma table. Elle a payé, comme t'as dit. Maintenant, je compte pour elle."
  - qui: nino
    sujet: epoque
    si: "flag(histoire_h10) && annee >= 2039"
    texte: "Les cartes de socio ont une puce, maintenant. Elle compte toute seule. Moi, je compte encore, pour vérifier la puce."
  - qui: nino
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_nino_federation)"
    texte: "La cravate de la Fédération, je l'ai gardée. Je la mets pour rien, le dimanche, pour qu'on me demande où je l'ai eue."

  # ═══════════════════════════════════════════════════════════ AHMED TAZI
  # Le maçon de l'escalier nord, soixante ans. Le matin et à midi, au stade.
  - qui: tazi
    sujet: quartier
    si: "flag(histoire_h10) && flag(h10_escalier) && saison == 1"
    texte: "Une par mois. Je viens le premier lundi, avant l'école. Les gamins me regardent faire. Ils comptent avec moi."
  - qui: tazi
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_chantier_conteste)"
    texte: "Vous m'avez dit d'arrêter, le premier jour. Je m'en souviens. Mais on me paie pour murer, alors je mure."
  - qui: tazi
    sujet: argent
    si: "flag(histoire_h10) && flag(h10_escalier)"
    texte: "Le ciment, c'est Rive Capital. Le sable, la mairie. Ma paie, la Ligue."
  - qui: tazi
    sujet: epoque
    si: "flag(histoire_h10) && saison == 2"
    texte: "Bientôt la moitié. Ma femme dit que je mure un escalier comme on tricote : sans regarder, et en comptant."
  - qui: tazi
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_sb_ciment)"
    texte: "Le chiffre dans le ciment, je l'ai refait trois fois. La quatrième, j'ai laissé sécher."
  - qui: tazi
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_truelle_payee)"
    texte: "Votre enveloppe est dans la caisse à outils, sous le niveau. Je l'ai pas ouverte. Comme ça, je sais pas ce que je dois oublier."
  - qui: tazi
    sujet: quartier
    si: "flag(histoire_h10) && saison == 3 && phase == retour"
    texte: "Il en reste deux, puis une. Le jour de la dernière, je prends ma retraite. Je l'ai encore dit à personne. Sauf à vous."
  - qui: tazi
    sujet: match
    si: "flag(histoire_h10) && serie_v >= 1"
    texte: "On entend la Nord depuis l'escalier, en dessous. Quand vous gagnez, le ciment vibre. Il sèche mieux, je crois."
  - qui: tazi
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_marche_muree)"
    texte: "Murée jusqu'en haut, à la lampe frontale. De toute la nuit, j'ai entendu que ma truelle."
  - qui: tazi
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_marche_ouverte)"
    texte: "Elle est restée ouverte. J'ai dormi dessus, assis sur le seau. On m'a jamais aussi bien payé pour rien faire."
  - qui: tazi
    sujet: club
    si: "flag(histoire_h10) && flag(h10_entrepot_signe)"
    texte: "On m'a demandé de murer les fenêtres de l'entrepôt d'à côté du vôtre. Le vôtre, pas encore."

  # ═══════════════════════════════════════════════════════════════ GÉGÉ
  # Socio numéro 1, quatre-vingt-quatorze ans en 2037. À la buvette, à midi et
  # le soir, tant qu'il descend. Il meurt en février 2040.
  - qui: gege
    sujet: toi
    si: "flag(histoire_h10) && saison == 1 && flag(h10_promesse_gege)"
    texte: "Deux mille cartes. T'as promis. En mai, souviens-toi."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_promesse_essai)"
    texte: "Essayer. Mon père a essayé quarante ans. Il est mort en deuxième division, au premier rang, debout."
  - qui: gege
    sujet: match
    si: "flag(histoire_h10) && serie_v >= 1"
    texte: "Le petit tape plus fort quand on gagne. Moi, je tape des pieds. À mon âge…"
  - qui: gege
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_voix_coupee)"
    texte: "Sans la voix, on s'entend chanter. Comme en 1984. Faux comme en 1984."
  - qui: gege
    sujet: club
    si: "flag(histoire_h10) && flag(h10_photo_raccrochee)"
    texte: "La photo de 1974, au clou. Mon père, troisième rang. Il avait juré de jamais y remonter."
  - qui: gege
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_helico)"
    texte: "Un hélicoptère, sur notre pelouse. Le jardinier a mesuré les trous des patins. Au mètre de couturière."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_clapet_nino)"
    texte: "Deux sonneries pareilles, au local. Je suis vieux. Pas sourd."
  - qui: gege
    sujet: epoque
    si: "flag(histoire_h10) && saison == 3"
    texte: "Dernière saison pour monter. Et pour moi, l'escalier du local. On verra qui tombe le premier."
  - qui: gege
    sujet: quartier
    si: "flag(histoire_h10)"
    texte: "Au-dessus du local, depuis 1979. J'entends tout. Surtout ce qui se dit bas."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h10) && relation.gege <= -1"
    texte: "Tu montes plus au club-house qu'en Nord. Y en a un des deux qu'on mure."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h10) && relation.gege >= 2"
    texte: "Dix présidents, j'ai vu la Nord se lever. Tu montes, elle se lève pour toi. Sinon, pour partir."
  - qui: gege
    sujet: club
    si: "flag(histoire_h10) && flag(h10_gege_loge)"
    texte: "Ta loge sent le cuir neuf. Et le parfum d'un autre. J'y suis allé une fois."

  # ═══════════════════════════════════════════════════ CLÉMENCE TESSANDIER
  # La petite-fille de l'agence, trente-quatre ans. Devant l'agence, le matin
  # et l'après-midi. Elle vend ; elle le sait ; elle ne s'en excuse pas.
  - qui: clemence
    sujet: sponsor
    si: "flag(histoire_h10) && flag(h10_maquette_trois)"
    texte: "La maquette ? Je l'ai repeinte en vert, la couleur des parcs. Ma grand-mère disait : on vend d'abord la couleur."
  - qui: clemence
    sujet: achat
    si: "flag(histoire_h10) && possede(villa)"
    texte: "La villa des hauteurs, c'est nous qui l'avions vendue. La plus belle vue sur la Rive. Et sur le stade, tant qu'il est là."
  - qui: clemence
    sujet: toi
    si: "flag(histoire_h10)"
    texte: "Je vends des appartements avec vue sur un stade qui aura peut-être plus d'équipe. Les gens signent quand même. Pour la vue."
  - qui: clemence
    sujet: sponsor
    si: "flag(histoire_h10) && flag(h10_maillot_terrasses)"
    texte: "Les ventes de la troisième tranche ont doublé depuis le maillot. La Nord le porte à l'envers. Les acheteurs regardent pas la Nord."
  - qui: clemence
    sujet: sponsor
    si: "flag(histoire_h10) && flag(h10_maillot_nu)"
    texte: "Vous avez gardé le maillot nu. Ma grand-mère aurait dit : un client difficile. Elle préférait les clients difficiles."
  - qui: clemence
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_sb_vitrine)"
    texte: "Un pavé dans ma vitrine, et un masque de 1990 dans mon parc. J'ai gardé le masque. Le pavé aussi, sur mon bureau."
  - qui: clemence
    sujet: argent
    si: "flag(histoire_h10) && flag(h10_entrepot_signe)"
    texte: "Vos entrepôts sont tranquilles pour dix ans. Moi, j'aurais pas signé. Mais je préside rien, heureusement."
  - qui: clemence
    sujet: argent
    si: "flag(histoire_h10) && flag(h10_entrepot_vide)"
    texte: "Vous avez vidé la Tréfilerie en trois jours. Rive Capital a été surpris. Eux qui sont jamais surpris. Ils ont dit « intéressant »."
  - qui: clemence
    sujet: rumeur
    si: "flag(histoire_h10) && saison == 3"
    texte: "La troisième tranche se signe en juin, quoi qu'il arrive. Ce qui change, c'est le nom sur la plaque du parc."
  - qui: clemence
    sujet: epoque
    si: "flag(histoire_h10)"
    texte: "En 1999, ma grand-mère a mis la maquette en vitrine. En 2041, on posera la première pierre. Quarante-deux ans pour traverser la rue."

  # ═════════════════════════════════════════════════════════ NADIA ROUVIER
  # La kiné des anciens du virage, soixante-dix-sept ans. On la croise devant
  # le cabinet, l'après-midi ; elle tutoie tout le monde depuis 1990.
  - qui: rouvier
    sujet: toi
    si: "flag(histoire_h10) && annee >= 2039"
    texte: "Respire. Encore. Je fais ça à tout le monde depuis 1990. Toi, tu respires comme quelqu'un qui a deux téléphones."
  - qui: rouvier
    sujet: club
    si: "flag(histoire_h10)"
    texte: "Je soigne les anciens du virage le mardi, dans la pièce du fond. Ils viennent pour les genoux ; ils restent pour parler de 1984."
  - qui: rouvier
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_rouvier_poche)"
    texte: "Ta veste tombe toujours mal, à gauche. Mets ce téléphone dans l'autre poche, au moins. Ou dans la Rive."
  - qui: rouvier
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_gege_mort)"
    texte: "Il respirait avec un quart de poumon depuis Noël. Il a tenu jusqu'en février par politesse, pour pas tomber un jour de match."
  - qui: rouvier
    sujet: match
    si: "flag(histoire_h10)"
    texte: "Le sifflet du club, c'est moi qui l'avais en 1990. Je l'ai encore. Le mardi, je siffle la fin du café ; ils obéissent."
  - qui: rouvier
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_gege_loge)"
    texte: "Tu l'as conduit en loge. Il s'est levé au but, seul. Il m'a dit qu'il avait eu froid aux jambes et chaud partout ailleurs."
  - qui: rouvier
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_gege_radio)"
    texte: "Il a écouté le match à la radio et appelé ta loge à la mi-temps. Il a raccroché content, je crois. Il raccrochait jamais content."
  - qui: rouvier
    sujet: epoque
    si: "flag(histoire_h10)"
    texte: "En 1990, les joueurs fumaient à la mi-temps. Aujourd'hui, ils mesurent leur sommeil au poignet. Ils dorment moins bien qu'en 1990."
  - qui: rouvier
    sujet: quartier
    si: "flag(histoire_h10) && flag(h10_truelle_payee)"
    texte: "J'ai massé le dos du maçon de l'escalier. Il avait un poids dans la poche de poitrine. J'ai pas demandé. J'ai massé autour."
  - qui: rouvier
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_clapet_ecoute)"
    texte: "Tu tiens ta veste comme quelqu'un qui attend un appel. Les épaules en avant. Redresse-toi."
  - qui: rouvier
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_clapet_nino)"
    texte: "Nino vient pour son épaule depuis janvier. Il a rien à l'épaule. Je lui masse les mains."

  # ═════════════════════════════════════════════════════════════════ LÉA
  # Soixante-douze ans, la lettre des lecteurs de L'Écho du dimanche. Au
  # kiosque du quai, le matin.
  - qui: lea
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_lettre_signee)"
    texte: "Cinquante ans de lettres de lecteurs, et la seule qui fait la Une, c'est la dernière que je signe. Faut croire que j'ai attendu."
  - qui: lea
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_lettre_virage)"
    texte: "Trois mille signatures dans la marge. Je les ai toutes lues, à la loupe. Le virage écrit mal, mais il écrit."
  - qui: lea
    sujet: epoque
    si: "flag(histoire_h10)"
    texte: "L'Écho paraît plus que le dimanche. Je l'achète quand même le lundi, par habitude, et le kiosquier fait semblant d'en avoir."
  - qui: lea
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_dictaphone)"
    texte: "Les piles du dictaphone durent neuf heures. Une voix de femme, la nuit, ça en prend combien ? Me répondez pas."
  - qui: lea
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_enregistrement)"
    texte: "Ce dictaphone a déjà enregistré un président, en 1995. J'ai jamais écouté la bande. Celle-là non plus, je sais déjà ce qu'il y a dessus."
  - qui: lea
    sujet: match
    si: "flag(histoire_h10)"
    texte: "J'ai vu jouer le Racing en 1990 depuis la tribune de presse. Elle existe plus, c'est un salon. On y sert du thé."
  - qui: lea
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_plaidoirie)"
    texte: "Huit minutes devant la Commission. J'ai le compte rendu : trois lignes pour vous, une pour le maçon. Il en avait jamais eu autant."
  - qui: lea
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_nino_federation)"
    texte: "Nino est revenu de la Fédération avec une cravate. Je l'ai photographiée. La cravate, pas Nino : c'est elle qui m'intéresse."
  - qui: lea
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_photo_hotel)"
    texte: "La photo de l'hôtel, c'est pas un client qui l'a prise. L'angle, c'est celui du miroir, derrière le bar. Quelqu'un avait réservé le miroir."
  - qui: lea
    sujet: club
    si: "flag(histoire_h10) && saison == 3"
    texte: "Dimanche, j'écrirai la dernière lettre d'une saison ouverte. Après, j'écrirai pour une ligue fermée. Je sais pas encore à qui."

  # ═══════════════════════════════════════════════════════════ OWEN CORVEN
  # L'entraîneur, soixante-quinze ans, le fils de Dan Corven (bible ch. 01
  # § 5 : National en 2005, première division en 2012). Au terrain.
  - qui: owen
    sujet: match
    si: "flag(histoire_h10) && serie_d >= 1"
    texte: "On a perdu le match mardi, à l'entraînement. Samedi, ils l'ont rejoué, et reperdu. Ils me demandent ce qu'on change."
  - qui: owen
    sujet: toi
    si: "flag(histoire_h10)"
    texte: "Mon père posait un verre d'eau plein devant lui et n'y touchait pas. Moi, je le bois. C'est la seule chose que j'ai changée."
  - qui: owen
    sujet: club
    si: "flag(histoire_h10) && flag(h10_owen_cv_garde)"
    texte: "Il y a un CV qui dépasse de votre tiroir. Je ne l'ai pas lu. Il est à qui ?"
  - qui: owen
    sujet: club
    si: "flag(histoire_h10) && flag(h10_centre_garde)"
    texte: "Les douze du centre sont restés. La douzième famille m'a demandé combien. Je lui ai dit : rien, c'est le prix."
  - qui: owen
    sujet: club
    si: "flag(histoire_h10) && flag(h10_centre_stage)"
    texte: "Deux gamins du stage sont restés à la capitale. Leurs lits sont faits, ici. Je ne les défais pas."
  - qui: owen
    sujet: rumeur
    si: "flag(histoire_h10)"
    texte: "Le drone de Rive Capital filme les séances depuis septembre. Je fais répéter les coups francs à l'envers. Ils apprendront à l'envers."
  - qui: owen
    sujet: match
    si: "flag(histoire_h10) && serie_v >= 1"
    texte: "Un bloc gagné. Les joueurs veulent fêter ça au local de la Nord. Je les laisse : le local, au moins, ne filme rien."
  - qui: owen
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_brac_vendu)"
    texte: "Les crampons du petit Brac sont toujours au-dessus de son casier. Le plus jeune les met le jeudi, avec trois paires de chaussettes."

  # ═══════════════════════════════════════════════════════════ ELIAS BRAC
  # Dix-sept ans, né rue du Stade. Au centre de formation, l'après-midi.
  - qui: brac
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_brac_titulaire)"
    texte: "Ma mère entend les matchs de la cuisine. Samedi, elle a entendu mon nom dans le haut-parleur. Elle a laissé brûler le gratin."
  - qui: brac
    sujet: match
    si: "flag(histoire_h10)"
    texte: "La voix du stade dit « Brak », avec un K. Je vais marquer jusqu'à ce qu'elle apprenne."
  - qui: brac
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_brac_garde)"
    texte: "La capitale a rappelé ma mère. Elle a dit que j'étais sorti. J'étais dans la cuisine, à côté d'elle."
  - qui: brac
    sujet: club
    si: "flag(histoire_h10)"
    texte: "Les douze du centre dorment au-dessus des vestiaires. On entend les tambours de la Nord jusque dans nos lits."
  - qui: brac
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_brac_rappel)"
    texte: "J'ai répondu moi-même à la capitale. Une phrase. Je la répète pas, elle était pas polie. C'était bien, ou c'était bête ?"
  - qui: brac
    sujet: quartier
    si: "flag(histoire_h10)"
    texte: "J'habite rue du Stade, au numéro 9. De ma fenêtre, on voit l'escalier nord. Je compte les marches avec mon petit frère."

  # ═══════════════════════════════════════ MBAKO, ILYAS, MADAME JOSIANE
  - qui: mbako
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_mbako_visite)"
    texte: "Je suis passé sous votre clou, l'autre jour. En 1990, y avait une photo. Je l'avais regardée longtemps, à seize ans."
  - qui: mbako
    sujet: epoque
    si: "flag(histoire_h10)"
    texte: "Huit clubs sauvés, quatre-vingts fermés. La nuit, c'est les quatre-vingts qui reviennent."
  - qui: mbako
    sujet: club
    si: "flag(histoire_h10) && flag(h10_plaidoirie)"
    texte: "Vos huit minutes, je les ai écoutées les yeux fermés. C'était pas pour dormir. C'était pour pas voir le maçon."
  - qui: nassir
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_diner_ilyas)"
    texte: "Une poire se découpe en huit. Nous en donnons quatre, nous gardons les quatre autres. Vous prendrez un morceau ?"
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h10) && mission(h10_photo_1974) && saison == 1"
    texte: "Le clou était toujours là. Je l'avais dit, en 1991. Merci d'avoir écouté une vieille dame. Je vais sur mes cent ans."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h10)"
    texte: "Mireille me fait monter au club-house le mardi et le jeudi. Je m'assois sous le clou. On me demande plus rien."
  - qui: josiane
    sujet: epoque
    si: "flag(histoire_h10) && saison >= 2"
    texte: "Cent ans. On m'a offert un gâteau en forme de stade. J'ai pas voulu couper la tribune Nord. Ils l'ont mangée sans moi."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_clou_occupe)"
    texte: "Votre photo de 2016 est au clou. Elle est jolie. C'est pas la bonne. Y a qu'un clou, vous comprenez ?"


  # ═══════════════════════════════════════════════════ LA REPRISE DU LIVRE
  # Le calendrier de Madame (le mercato gelé, la prime, la recrue), la
  # dernière saison, la lettre, et les visages qui parlaient trop peu.
  - qui: fan
    sujet: club
    si: "flag(histoire_h10) && flag(h10_prime_supprimee)"
    texte: "La prime du dernier bloc a sauté. Les joueurs l'ont appris par une note au vestiaire, signée de la présidence. Tapée par qui, on se demande."
  - qui: ancien
    sujet: argent
    si: "flag(histoire_h10) && flag(h10_mercato_gele)"
    texte: "Pas une recrue en janvier. En 1990, on achetait un ailier avec la recette d'un derby. Aujourd'hui, on a la recette, et pas l'ailier."
  - qui: commercant
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_recrue_janvier)"
    texte: "Le milieu arrivé en janvier achète ses cigarettes ici. Il paie avec deux cartes, jamais la même deux fois de suite. J'avais jamais vu ça."
  - qui: passante
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_gege_mort) && saison == 3"
    texte: "Depuis février, la fenêtre au-dessus du local reste éteinte. Les gamins de la Nord passent dessous en baissant la voix, sans qu'on le leur dise."
  - qui: fan
    sujet: classement
    si: "flag(histoire_h10) && saison == 3 && rang <= 4 && journee >= 24"
    texte: "On est dans les quatre. Si ça tient, on sera dedans le jour où ça ferme. Ma mère allume un cierge à Saint-Aubin chaque samedi, par sécurité."
  - qui: passant
    sujet: epoque
    si: "flag(histoire_h10) && saison == 3 && journee >= 30"
    texte: "Plus que quelques journées pour monter. Après, on jouera pour rien, pour toujours. Mon fils dit qu'on jouera pour nous. Il a quinze ans."
  - qui: ancien
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_enquete)"
    texte: "La brigade financière sur l'escalier nord, un soir de mai. Le maçon a fumé toute la nuit sur la dernière marche, entre deux inspecteurs."
  - qui: enfant
    sujet: quartier
    si: "flag(histoire_h10) && flag(h10_escalier) && saison == 3 && phase == aller"
    texte: "Le monsieur de l'escalier a dit qu'il en restait huit. J'ai demandé huit quoi. Il a dit : huit mois. Après, il sait pas."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h10) && flag(h10_brac_titulaire) && saison == 1"
    texte: "Le petit Brac, à l'heure de jeu, la Nord avait déjà appris son nom. En 1990, il nous fallait trois matchs pour apprendre celui d'un gamin."
  - qui: passante
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_sb_descendu)"
    texte: "La nuit des cartes sous le réverbère, la 212 est descendue voter avec eux. Ma sœur y était. Elle sait toujours pas pour quoi on votait."
  - qui: fan
    sujet: match
    si: "flag(histoire_h10) && flag(h10_voix_coupee) && serie_v >= 1"
    texte: "Sans les haut-parleurs, c'est nous qui annonçons les buts. On se trompe de buteur une fois sur deux. Personne se plaint."
  - qui: commercant
    sujet: sponsor
    si: "flag(histoire_h10) && flag(h10_helico_renvoye)"
    texte: "L'hélicoptère est reparti à vide, et il a arraché trois mètres de pelouse. Le jardinier les a gardés dans une brouette, pour les replanter. Il les arrose."

  # Nino
  - qui: nino
    sujet: club
    si: "flag(histoire_h10) && flag(h10_prime_supprimee)"
    texte: "La prime a sauté, et les joueurs sont venus au local se plaindre. Je les ai écoutés. Un par un, avec leurs fiches de paie."
  - qui: nino
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_gege_mort) && flag(h10_nino_retourne)"
    texte: "Mon oncle savait, pour le téléphone. Je l'ai compris à l'enterrement, en voyant ta tête. Merci de pas me l'avoir dit avant."
  - qui: nino
    sujet: club
    si: "flag(histoire_h10) && saison == 3 && phase == retour"
    texte: "L'assemblée de juin, je la prépare depuis septembre. Les chaises, le micro, les procurations. Une chose pareille, on la vote assis."

  # Ahmed Tazi
  - qui: tazi
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_enquete)"
    texte: "La brigade m'a gardé jusqu'à cinq heures sur l'escalier. Ils m'ont demandé combien coûte une marche. Je leur ai dit : un mois."
  - qui: tazi
    sujet: quartier
    si: "flag(histoire_h10) && flag(h10_escalier) && saison == 3 && phase == aller"
    texte: "Plus que huit. J'ai refusé les autres chantiers. Je veux finir celui-là proprement, même si je sais pas encore comment."

  # Gégé, tant qu'il descend
  - qui: gege
    sujet: quartier
    si: "flag(histoire_h10) && saison == 3 && phase == aller"
    texte: "Je descends plus qu'à midi. Le soir, l'escalier est trop long. D'en haut, j'entends mieux."
  - qui: gege
    sujet: match
    si: "flag(histoire_h10) && flag(h10_voix_gardee) && saison == 1"
    texte: "La voix dit « magnifique ». Gigi disait « ça rentre », les gants sur le comptoir. Ça rentre."

  # Léa
  - qui: lea
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_madame_vue)"
    texte: "Une femme en manteau d'automne, au bar de l'hôtel. Je l'ai cherchée dans mes archives. Pas une photo d'elle, dans aucun journal. Ça aussi, c'est un métier."
  - qui: lea
    sujet: club
    si: "flag(histoire_h10) && saison == 3 && phase == retour"
    texte: "J'ai déjà écrit deux lettres pour juin : une pour la montée, une pour l'autre. Je brûlerai la mauvaise dans l'évier, comme on faisait en 1990."

  # Clémence Tessandier
  - qui: clemence
    sujet: sponsor
    si: "flag(histoire_h10) && flag(h10_maquette_trois) && saison == 2"
    texte: "J'ai repeint la plaque du parc trois fois cette année : Racing Capitale, puis rien, puis Racing Capitale. Ils hésitent sur le nom. Pas sur le parc."

  # Nadia Rouvier
  - qui: rouvier
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_lettre_lue)"
    texte: "Ta veste tombe droit, aujourd'hui. T'as mis quelque chose de l'autre côté, pour faire contrepoids ?"
  - qui: rouvier
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_lettre_brulee)"
    texte: "J'ai rien entendu, l'autre nuit, au téléphone. À mon âge, on entend ce qu'on veut. Lui aussi faisait comme ça, avec son plancher."

  # Owen Corven
  - qui: owen
    sujet: club
    si: "flag(histoire_h10) && flag(h10_prime_supprimee)"
    texte: "La prime du dernier bloc a sauté. Les joueurs ne me demandent pas pourquoi. Ils me regardent boire mon eau, et ils comprennent de travers."
  - qui: owen
    sujet: club
    si: "flag(histoire_h10) && flag(h10_prime_gardee)"
    texte: "La prime du dernier bloc tient. Les joueurs vous remercient. Ils ne savent pas encore ce qu'on vous reprendra à la place ; moi non plus."
  - qui: owen
    sujet: match
    si: "flag(histoire_h10) && flag(h10_recrue_janvier)"
    texte: "Le milieu de janvier court bien. Son salaire arrive de deux banques. Je ne lui demande pas laquelle le fait courir."
  - qui: owen
    sujet: epoque
    si: "flag(histoire_h10) && saison == 3"
    texte: "Soixante-dix-sept ans, et la dernière saison où l'on peut monter. Après la loi, je rentre. Mon père disait : la retraite, c'est un banc sans match."
  - qui: owen
    sujet: argent
    si: "flag(histoire_h10) && flag(h10_mercato_gele)"
    texte: "Pas de recrue en janvier. On me l'a dit par une note sans signature. J'ai reconnu le papier : celui de la banque, avec le filigrane."

  # Elias Brac, tant qu'il est là
  - qui: brac
    sujet: club
    si: "flag(histoire_h10) && flag(h10_recrue_janvier)"
    texte: "Le milieu de janvier me prend la place une fois sur deux. Il est bon. Il dit qu'il restera pas, son contrat a une annexe."
  - qui: brac
    sujet: argent
    si: "flag(histoire_h10) && flag(h10_prime_supprimee)"
    texte: "La prime a sauté. Moi, je joue pour ma mère. Les autres ont des crédits, des enfants. Je leur ai dit que je m'en fichais. C'était bête ?"

  # Lian Mbako
  - qui: mbako
    sujet: toi
    si: "flag(histoire_h10) && saison == 1"
    texte: "Je dors à l'hôtel de la Rive quand je viens voir ma mère. Chambre 9. On loue toujours pas la 12. Personne la demande."
  - qui: mbako
    sujet: epoque
    si: "flag(histoire_h10) && annee >= 2039"
    texte: "La loi a deux cent douze articles. J'en ai écrit cent quarante. Les autres, la Ligue les a écrits pendant que je dormais à l'hôtel."
  - qui: mbako
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_mbako_joueur)"
    texte: "Vous jouiez, en 1990. Moi aussi. On aurait pu se croiser sur un terrain. On s'est croisés dans un escalier."
  - qui: mbako
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_gege_mort)"
    texte: "J'ai vu les masques de Gégé à la télévision, au bureau. J'ai baissé le son. Ça sert à rien, baisser le son, devant trois mille visages."

  # Madame Josiane
  - qui: josiane
    sujet: club
    si: "flag(histoire_h10) && !flag(h10_photo_raccrochee) && !flag(h10_photo_tiroir)"
    texte: "Le cadre est sous mon lit, dans le journal de 1991. Je le sors le dimanche pour l'épousseter. Le verre de 1974 prend la poussière autrement."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h10) && flag(h10_photo_tiroir)"
    texte: "La photo est restée chez moi. C'est votre droit. Je l'ai remise sous le lit, face au sommier. Ils ont l'habitude d'attendre, ceux-là."
  - qui: josiane
    sujet: epoque
    si: "flag(histoire_h10) && flag(h10_photo_raccrochee) && annee >= 2039"
    texte: "Cent ans. Le maire voulait me photographier devant la photo de 1974. J'ai dit non. Y a qu'un clou."
  - qui: josiane
    sujet: rumeur
    si: "flag(histoire_h10) && flag(h10_clapet_nino)"
    texte: "Le petit Nino vient me voir le jeudi. Il pose sa veste sur ma chaise et elle sonne. Il décroche jamais devant moi. Il a été bien élevé."
  - qui: josiane
    sujet: sombre
    si: "flag(histoire_h10) && flag(h10_gege_mort)"
    texte: "Gégé m'appelait Josiane, sans le madame, depuis 1987. Il était le seul. Maintenant, plus personne n'oublie le madame."
  - qui: josiane
    sujet: quartier
    si: "flag(histoire_h10) && flag(h10_marche_ouverte)"
    texte: "Une marche ouverte. Mon père disait qu'une maison sans porte n'est pas une maison, c'est un abri. Le stade est un abri, maintenant."

# On croise les visages nouveaux du livre devant leur lieu (s'ils sont de la
# distribution ou déjà rencontrés). Léa, au kiosque du quai le matin : elle y
# attend son journal dans toutes les époques.
presences:
  - {qui: nino, lieu: buvette, tranches: [aprem, soir]}
  - {qui: tazi, lieu: stade, tranches: [matin, midi]}
  - {qui: clemence, lieu: agence, tranches: [matin, aprem]}
  - {qui: rouvier, lieu: cabinet, tranches: [aprem]}
  - {qui: owen, lieu: terrain, tranches: [matin, aprem]}
  - {qui: brac, lieu: centre, tranches: [aprem]}
  - {qui: lea, lieu: kiosque, tranches: [matin]}

# Où leurs cartes les attendent quand elles ne disent pas de lieu.
rencontres:
  nino: buvette
  tazi: stade
  clemence: agence
  owen: terrain
  brac: centre

# Ce qu'on voit en poussant la porte, selon où en est le livre (la première
# vraie l'emporte).
lieux_variantes:
  - lieu: stade
    si: "flag(histoire_h10) && flag(h10_enquete)"
    texte: "Le stade de la Rive. À l'escalier nord, un ruban jaune de la brigade en travers de la dernière marche, et des scellés sur la bétonnière de Tazi."
  - lieu: stade
    si: "flag(histoire_h10) && flag(h10_marche_muree) && saison == 4"
    texte: "Le stade de la Rive. À la place de l'escalier nord, un mur lisse monte jusqu'au toit de la tribune. Quelqu'un y a déjà écrit, à la craie, la date d'hier."
  - lieu: stade
    si: "flag(histoire_h10) && flag(h10_marche_ouverte) && saison == 4"
    texte: "Le stade de la Rive. L'escalier nord n'est plus qu'un mur, sauf tout en haut : une marche ouverte, des écharpes nouées, un masque de carton posé à plat."
  - lieu: stade
    si: "flag(histoire_h10) && flag(h10_marche_muree)"
    texte: "Le stade de la Rive. À l'escalier nord, il ne reste qu'une marche. Tazi a accroché sa lampe frontale à la rampe, à côté d'un sac de ciment."
  - lieu: stade
    si: "flag(histoire_h10) && flag(h10_marche_ouverte)"
    texte: "Le stade de la Rive. Il ne reste qu'une marche, et dessus, un seau retourné et un thermos. Tazi a dit qu'il dormirait là, la nuit d'avant."
  - lieu: stade
    si: "flag(histoire_h10) && saison == 3"
    texte: "Le stade de la Rive. À l'escalier nord, il ne reste qu'une poignée de marches, et un seau retourné sur lequel le maçon déjeune."
  - lieu: stade
    si: "flag(histoire_h10) && saison == 2"
    texte: "Le stade de la Rive. L'escalier nord est muré presque à moitié ; on passe par la tribune Est, et les enfants comptent ce qui reste en montant."
  - lieu: stade
    si: "flag(histoire_h10) && flag(h10_escalier)"
    texte: "Le stade de la Rive. Au pied de l'escalier nord, une bétonnière, un seau, et les premières marches murées, plus claires que les autres."
  - lieu: agence
    si: "flag(histoire_h10) && flag(h10_sb_vitrine)"
    texte: "Immobilier Tessandier. La vitrine étoilée tient avec du ruban adhésif ; dans le parc en mousse de la maquette, un vieux masque jauni est toujours posé à plat."
  - lieu: agence
    si: "flag(histoire_h10) && flag(h10_maquette_trois)"
    texte: "Immobilier Tessandier. En vitrine, la maquette des Terrasses repeinte en vert : « troisième tranche, 2041 ». À la place du stade, un parc, et une plaque."
  - lieu: agence
    si: "flag(histoire_h10)"
    texte: "Immobilier Tessandier. En vitrine, une vieille maquette jaunie, repeinte de frais : « Les Terrasses, troisième tranche, 2041 ». Le stade n'y figure plus."
  - lieu: clubhouse
    si: "flag(histoire_h10) && flag(h10_photo_raccrochee)"
    texte: "Le club-house. Dans l'escalier, la photo de 1974 est revenue à son clou, au-dessus de la troisième marche. Le cadre penche un peu, vers la Nord."
  - lieu: clubhouse
    si: "flag(histoire_h10) && flag(h10_clou_occupe)"
    texte: "Le club-house. Dans l'escalier, au clou de la troisième marche, ta photo de 2016 en maillot bordeaux. Mireille l'époussette sans la regarder."
  - lieu: clubhouse
    si: "flag(histoire_h10)"
    texte: "Le club-house. Dans l'escalier, au-dessus de la troisième marche, un clou nu. Personne n'y touche ; la peinture en a fait le tour."
  - lieu: buvette
    si: "flag(histoire_h10) && flag(h10_gege_mort)"
    texte: "La buvette du kop. Au premier rang, la chaise de Gégé, et dessus, calé contre le dossier, un masque de carton à son visage."
  - lieu: buvette
    si: "flag(histoire_h10)"
    texte: "La buvette du kop. Au mur, en lettres d'un mètre : MONTE-NOUS AVANT QU'ILS FERMENT. Des cartes de socio sèchent sur un fil, comme du linge."
  - lieu: cabinet
    si: "flag(histoire_h10)"
    texte: "Le cabinet du Doc, fermé depuis 2029. Nadia Rouvier a repris la pièce du fond. Un sifflet en métal pend à la poignée, et le camphre se sent jusqu'au palier."
  - lieu: tabac
    si: "flag(histoire_h10) && saison >= 2"
    texte: "Le tabac du Quai. Sur l'ardoise des paris, à la craie : LA DERNIÈRE MONTÉE, RACING DOUZE CONTRE UN. Quelqu'un a barré douze et écrit neuf."
  - lieu: hotel
    si: "flag(histoire_h10) && flag(h10_photo_hotel)"
    texte: "L'hôtel de la Rive. Au bar, le miroir derrière les bouteilles a été changé ; le barman dit que l'ancien était fêlé. Il ne dit pas depuis quand."
  - lieu: garage
    si: "flag(histoire_h10) && flag(h10_voiture_saisie)"
    texte: "Le garage du Pont. Dans la cour, la voiture sans volant, sous scellés, la portière ouverte. Un mécanicien la referme en passant ; elle se rouvre."
  - lieu: kiosque
    si: "flag(histoire_h10) && flag(h10_lettre_signee)"
    texte: "Le kiosque du quai. Punaisée à la vitre, la Une d'un dimanche : une lettre de lecteur, signée Léa, tout court, qui parle d'un escalier."
  - lieu: cimetiere
    si: "flag(histoire_h10) && flag(h10_gege_mort)"
    texte: "Le cimetière. Au carré des anciens, une tombe neuve couverte d'écharpes bordeaux et grises, et un masque de carton à son visage, lesté d'un caillou."
