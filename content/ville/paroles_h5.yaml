# CE QUE DIT LA VILLE pendant « La Maquette » (Histoire 5, président, 1999-2002).
#
# La ville ne fait pas avancer l'intrigue : elle prouve qu'elle avance. Chaque
# réplique lit le drapeau d'histoire et une trace : la vitrine, le téléphone du
# mardi, la tribune Est, la vase, la caution, la grève, le vote. Saisons de la
# ville : 1 = 1999-2000, 2 = 2000-2001, 3 = 2001-2002.
#
# Conventions (celles de paroles_personnages.yaml) : aucun accord sur le
# protagoniste, aucune adresse genrée, pas de guillemets autour, 160 caractères
# au plus ; Camille ne se croise qu'à la maison. Les visages nouveaux de ce
# livre (Madame Tessandier, Pierre-Yves Dorian, Didier Vallin) et ceux de la
# bible qu'il fait parler (Madame Vialat, Mamie Paulette, Dembo, Judith Amsel,
# Hubert Malbec) ont leurs répliques ici ; les autres visages aussi, quand
# l'histoire les touche.
#
# `lieux_variantes` : ce qu'on voit en poussant la porte. La vitrine de l'agence
# change à chaque saison (le stade y rétrécit, puis ton nom apparaît, puis la
# vitre s'éteint) ; l'Est brûlée au stade ; le siège au club-house ; l'affiche
# de la séance à la mairie.
paroles:
  # ================================================================ LES GENS
  - qui: passant
    sujet: club
    si: "flag(histoire_h5) && saison == 1"
    texte: "Deux titres au mur et pas de quoi payer le chauffage. Mon père disait qu'en 62, on chauffait la buvette avec les journaux du lundi."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee)"
    texte: "L'Est, c'était du chêne de 1931. Soixante ans qu'on l'usait avec nos fonds de culotte. Une nuit, et plus rien."
  - qui: fan
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_rive_voiture)"
    texte: "Les plongeurs ont sorti une voiture grise de la Rive, un sapin au rétroviseur. Mon oncle dit que c'était celle d'un entraîneur, en 1990."
  - qui: passante
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_maison_saisie)"
    texte: "Les déménageurs étaient chez vous ce matin. Camille les regardait faire, les bras croisés. Elle avait pas l'air surprise."
  - qui: enfant
    sujet: quartier
    si: "flag(histoire_h5) && flag(h5_maquette_change)"
    texte: "Dans la vitrine, ils ont enlevé le stade de la maquette. Mon frère dit qu'ils enlèveront le vrai la nuit."
  - qui: commercant
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_caution_signee)"
    texte: "Votre maison en garantie pour le club ? Mon père avait fait ça en 1966, pour la Coupe. On a gagné la Coupe. Il a perdu la maison."
  - qui: passant
    sujet: sombre
    si: "flag(histoire_h5) && mission(h5_temoin_feu)"
    texte: "La nuit du feu, y avait un type en ciré avec un bidon, près de la grille de l'Est. Il est reparti dans une voiture de la résidence."
  - qui: fan
    sujet: club
    si: "flag(histoire_h5) && flag(h5_siege)"
    texte: "On a dormi au club-house. Josiane nous a fait le café à six heures. Elle a dit qu'elle nous avait pas vus."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h5) && flag(monde_ecus)"
    texte: "Huit écus le match, au virage. Mon père payait en pièces de vingt centimes, et il râlait déjà."
  - qui: passant
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_une_voix)"
    texte: "Le conseil a voté à une voix près. C'était pas la mienne, je suis pas conseiller. Mais je sais de qui."
  - qui: passant
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_vente_annoncee) && saison == 1"
    texte: "Au Racing, ils vendent tout, maintenant, même les filets. Je viendrai voir jouer ce qu'il restera."
  - qui: passante
    sujet: club
    si: "flag(histoire_h5) && flag(h5_plan_annonce) && saison == 1"
    texte: "Il paraît qu'il y a un plan, au club. Mon mari aussi avait un plan, pour la cuisine. On mange toujours dans le salon."
  - qui: fan
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_huissier_club)"
    texte: "L'huissier a collé une pastille rouge sur la machine à laver des maillots. Josiane s'est assise dessus. Il a pas osé."
  - qui: enfant
    sujet: quartier
    si: "flag(histoire_h5) && flag(h5_maquette_vue) && saison == 1"
    texte: "Dans la maquette de l'agence, y a un lac en plastique. On peut pas s'y baigner. Mais on peut le regarder longtemps."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h5) && saison == 1"
    texte: "Le titre en 62, la Coupe en 66. J'ai les deux billets dans une boîte à cigares. Le greffe, lui, il donne pas de billet."
  - qui: commercant
    sujet: achat
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee)"
    texte: "Depuis le feu, je vends les briquets sous le comptoir. Les gens ont honte d'en acheter ; ils prennent des allumettes."
  - qui: passante
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee) && saison == 1"
    texte: "J'ai entendu les pompiers à trois heures. Ils arrosaient la Nord, pas l'Est. L'Est, c'était déjà trop tard."
  - qui: fan
    sujet: club
    si: "flag(histoire_h5) && flag(h5_greve_signee)"
    texte: "Signer la feuille de grève de ses propres joueurs, on avait jamais vu ça. Ma femme dit que c'est du cinéma. Moi, j'ai découpé la photo."
  - qui: passant
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_greve_payee)"
    texte: "Vingt-quatre chèques sur un capot, un soir de pluie. Mon neveu joue arrière droit ; le sien était daté du 5."
  - qui: ancien
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_conseil_entendu)"
    texte: "Un Conseil ? Y en avait un, à la mairie, en 1976. Trois types qui décidaient des permis de construire. Eux, ils se cachaient pas."
  - qui: enfant
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_rive_voiture)"
    texte: "Le sapin de la voiture, il sentait encore. Le monsieur des plongeurs l'a mis dans un sac en plastique. C'est une preuve ?"
  - qui: passant
    sujet: quartier
    si: "flag(histoire_h5) && flag(h5_nom_laisse)"
    texte: "J'ai vu votre nom sur la maquette, en petit, sous le promoteur. Votre père avait construit l'école. Lui, son nom est en grand."
  - qui: fan
    sujet: sponsor
    si: "flag(histoire_h5) && flag(h5_maillot_terrasses)"
    texte: "Les Terrasses sur le maillot. Je le porterai à l'envers, l'étiquette dehors. Comme ça on lira la taille, au moins."
  - qui: passante
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_sci_publiee)"
    texte: "J'ai lu l'article sur la SCI. Deux noms et un point d'interrogation. Moi, c'est le point d'interrogation qui m'intéresse."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h5) && flag(h5_14b_ecoutee)"
    texte: "Le maire Marquès, je l'ai connu, j'avais six ans. Il donnait des oranges aux gamins du quartier, le dimanche, devant la grille."
  - qui: commercant
    sujet: sponsor
    si: "flag(histoire_h5) && flag(h5_fonds_ilyas)"
    texte: "Il paraît que le stade va changer de nom. Trente ans que je vends des écharpes du Racing de la Rive, moi. Je refais l'enseigne ?"
  - qui: passant
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_perquisition)"
    texte: "Deux voitures banalisées devant vos bureaux, à six heures. Les phares allumés, le moteur coupé. Dans ma rue, on a tous regardé."
  - qui: passante
    sujet: club
    si: "flag(histoire_h5) && flag(h5_bache)"
    texte: "La bâche du kop, je l'ai vue sécher sur la place. Vingt mètres. Les lettres coulaient un peu. Le Q de QUARTIER pleurait."
  - qui: fan
    sujet: match
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee) && jour == sam"
    texte: "Trois tribunes pour quatre côtés. On chante plus fort vers l'Est, pour qu'elle entende quand même."
  - qui: ancien
    sujet: quartier
    si: "flag(histoire_h5) && saison == 3"
    texte: "Ils votent sur le terrain en mai. Soixante-dix ans de virage. On m'a pas demandé mon avis. Aux conseillers, oui."
  - qui: passant
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_lambert_vu)"
    texte: "Lambert, le conseiller, il paraît qu'il hésite. Lambert, hésiter ? Quelqu'un lui a parlé, pour sûr."
  - qui: passante
    sujet: quartier
    si: "flag(histoire_h5) && flag(h5_camille_accusee)"
    texte: "On voit Camille seule au marché, le samedi. Elle prend deux cafés au comptoir. Elle en boit qu'un."
  - qui: commercant
    sujet: quartier
    si: "flag(histoire_h5) && flag(h5_tessandier_silence)"
    texte: "L'agence éteint sa vitrine le soir, maintenant. On voit plus la maquette. On voit nos reflets, et derrière, le stade."
  - qui: passant
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_aveu)"
    texte: "Douze cartons sortis de vos bureaux à six heures, et la procureure en a ouvert qu'un. Mon beau-frère est déménageur, il les a vus passer."
  - qui: passant
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_valise_avouee)"
    texte: "Des billets de cinq cents qui se suivaient, à la buvette. Le patron les a mis dans une enveloppe, pour la police. Il en a gardé un."
  - qui: ancien
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_bastide_1976)"
    texte: "Bastide, le secrétaire de mairie de 76 ? Il signait les permis de construire au crayon, pour pouvoir gommer. On le savait tous."
  - qui: fan
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_siege_dormi)"
    texte: "Vous avez dormi sur le comptoir de la buvette, avec nous. Gégé dit que vous ronflez comme un défenseur central."
  - qui: passante
    sujet: toi
    si: "flag(histoire_h5) && flag(h5_engins_saisis)"
    texte: "J'ai vu les plateaux passer sur le pont, avec vos pelleteuses dessus. Mon fils a cru que c'était un défilé."
  - qui: commercant
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_avance)"
    texte: "La Banque Aubérivoise vous avance encore de l'argent ? Moi, ils m'ont refusé un découvert de deux mille francs, pour un four."
  - qui: ancien
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_plainte_retiree)"
    texte: "La plainte pour l'Est, retirée ? Mon frère était pompier. Il dit que le feu avait deux départs. Deux. Il l'a écrit dans son rapport."
  - qui: passant
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_cle_laissee)"
    texte: "Des piquets orange, dans les cendres de l'Est. Gégé les arrache le mardi, ils reviennent le lundi. Comme le chiendent."
  - qui: passante
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_serrure_changee)"
    texte: "Le serrurier du quai a fait deux clés pour la grille de l'Est. On lui en a demandé une troisième, au téléphone. Il a refusé."
  - qui: fan
    sujet: club
    si: "flag(histoire_h5) && flag(h5_mot_refuse)"
    texte: "Rien de promis, au local. Gégé dit qu'au moins, on sera pas déçus. Il l'a dit en rangeant les verres."
  - qui: enfant
    sujet: quartier
    si: "flag(histoire_h5) && flag(h5_fonte)"
    texte: "Mamie Paulette a un bout de fer dans son sac. Elle dit que c'est des mots. On a le droit de le toucher, pas de le lire tout haut."
  - qui: passant
    sujet: club
    si: "flag(histoire_h5) && flag(h5_oudart_garde)"
    texte: "Oudart, notre gardien, Halvenne en voulait. Il est resté. Le samedi d'après, il a arrêté un penalty et regardé la loge."
  - qui: fan
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_oudart_vendu)"
    texte: "Ils ont vendu Oudart un jeudi. Le gamin qui le remplace a dix-neuf ans et se signe avant chaque corner. Ça marche pas à tous les coups."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h5) && flag(h5_naming)"
    texte: "Almadis Rive. Le stade s'appelait la Rive parce qu'il était au bord de la Rive. Il va porter le nom de quelqu'un qui y est jamais venu."
  - qui: passante
    sujet: toi
    si: "flag(histoire_h5) && flag(h5_dembo_sait)"
    texte: "Dembo fait une tête depuis l'hiver. Il joue bien, mais il regarde plus la Nord. Ma fille dit qu'il a déjà signé ailleurs."
  - qui: fan
    sujet: sponsor
    si: "flag(histoire_h5) && flag(h5_maillot_blanc)"
    texte: "Ils ont joué en blanc, rien sur la poitrine. Les Terrasses ont appelé à la mi-temps. Au club, personne n'était joignable."
  - qui: fan
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_capot)"
    texte: "VENDU, sur votre capot ? Pas nous. Au virage, on écrit à la main, et on signe. Ceux-là avaient des lettres toutes faites."
  - qui: passante
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_capot)"
    texte: "Le soir du capot, une camionnette blanche est passée deux fois sur le quai, feux éteints. Celle qui arrose les pelouses de la résidence."
  - qui: commercant
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_valise_refusee)"
    texte: "Trois millions refusés, au bar de l'hôtel. Le barman l'a raconté à tout le quai. Il dit que vous avez laissé un pourboire normal."

  # ======================================================= MADAME TESSANDIER
  # L'agence du quai, le matin et l'après-midi. Elle vend ; elle ne menace
  # jamais ; elle dit les choses comme on parle du temps qu'il fera.
  - qui: tessandier
    sujet: achat
    si: "flag(histoire_h5) && flag(h5_maquette_vue)"
    texte: "La seconde tranche ? Tout est réservé sur plan, sauf le rez-de-chaussée. Il a vue sur les tribunes. Pour l'instant."
  - qui: tessandier
    sujet: toi
    si: "flag(histoire_h5) && flag(h5_maquette_entree)"
    texte: "Vous avez poussé la porte, l'autre jour. Les gens ne la poussent jamais, ils regardent la vitrine et ils repartent. Un café ?"
  - qui: tessandier
    sujet: club
    si: "flag(histoire_h5) && flag(h5_plans_vus)"
    texte: "Vous avez gardé une copie des plans ? Moi, je les garde toutes. On ne sait jamais qui reviendra les demander."
  - qui: tessandier
    sujet: club
    si: "flag(histoire_h5) && flag(h5_stade_ne_bouge)"
    texte: "Le stade ne bouge pas, m'avez-vous dit. Rien ne bouge, à Aubérive. Sauf le prix du mètre carré au bord de l'eau."
  - qui: tessandier
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_lettre_cachee)"
    texte: "Notre petit accord tient toujours. Je n'en parle à personne. Vous non plus, j'imagine."
  - qui: tessandier
    sujet: sponsor
    si: "flag(histoire_h5) && flag(h5_maillot_terrasses)"
    texte: "Le bordeaux et le gris vont bien au Racing. Ce sont les couleurs de la résidence, vous aviez remarqué ?"
  - qui: tessandier
    sujet: sponsor
    si: "flag(histoire_h5) && flag(h5_maillot_refuse)"
    texte: "Le maillot ne se vend pas. Le terrain, si. Moi, j'aurais commencé par le maillot, voyez-vous. C'est plus petit."
  - qui: tessandier
    sujet: achat
    si: "flag(histoire_h5) && flag(h5_nom_laisse)"
    texte: "Votre nom sur le panneau, c'est bon pour les ventes. Les gens font confiance à une entreprise d'ici. Trois réservations depuis lundi."
  - qui: tessandier
    sujet: achat
    si: "flag(histoire_h5) && flag(h5_nom_retire)"
    texte: "J'ai gardé votre panneau dans le tiroir. Il ne prend pas de place. Il attend, comme les maquettes."
  - qui: tessandier
    sujet: quartier
    si: "flag(histoire_h5) && flag(h5_vue)"
    texte: "Onze sur quarante, la première tranche. Les gens veulent l'eau, pas les chants du samedi. Je vends ce qu'ils veulent."
  - qui: tessandier
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee) && saison == 1"
    texte: "Quelle tristesse, cette tribune. De ma fenêtre, on la voyait tout entière. On la voit encore, noire. On voit même mieux l'eau."
  - qui: tessandier
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_tessandier_silence)"
    texte: "Je garde tout, vous le savez. Les plans, les panneaux, les phrases. Surtout les phrases."
  - qui: tessandier
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_tessandier_aveu)"
    texte: "J'ai parlé à la procureure. Deux heures. Elle a tout noté, sauf la phrase. La phrase, elle l'avait déjà."
  - qui: tessandier
    sujet: achat
    si: "flag(histoire_h5) && saison == 3"
    texte: "La maquette restera dans la vitrine, quoi que vote le conseil. Au pire, elle jaunira."

  # ========================================================== MAMIE PAULETTE
  # La 14B, puis le banc du square. Elle tutoie la ville et vouvoie le club.
  - qui: paulette
    sujet: toi
    si: "flag(histoire_h5) && flag(h5_acte_lu)"
    texte: "Mon père disait : à perpétuité, c'est plus long que le maire suivant. Et vous, vous venez après qui ?"
  - qui: paulette
    sujet: club
    si: "flag(histoire_h5) && saison == 1 && !flag(h5_tribune_est_brulee)"
    texte: "Place 14B depuis 1951. Le bois est creusé à la forme de mon dos. Personne d'autre peut s'y asseoir sans avoir mal, mon petit."
  - qui: paulette
    sujet: epoque
    si: "flag(histoire_h5) && flag(h5_14b_ecoutee)"
    texte: "Mon père a signé l'acte un 14 juin, en 1931. Il pleuvait. Il a dit : les enfants auront un terrain, et moi une belle signature."
  - qui: paulette
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee)"
    texte: "Cinquante ans à la même place, et une nuit pour l'effacer. J'ai pas pleuré. Je pleurerai quand je saurai qui."
  - qui: paulette
    sujet: quartier
    si: "flag(histoire_h5) && flag(h5_reconstruction_promise)"
    texte: "Vous avez promis de reconstruire. En bois, j'espère. Le béton, ça garde pas la forme des gens."
  - qui: paulette
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_fonte)"
    texte: "Le bout de fonte est dans mon sac. ENFANTS DU. Le reste a fondu. Les enfants, eux, sont toujours là, au square."
  - qui: paulette
    sujet: toi
    si: "flag(histoire_h5) && flag(h5_acte_paulette)"
    texte: "L'acte est sous la nappe des dimanches. Je mets plus la nappe. Je veux pas qu'on mange dessus."
  - qui: paulette
    sujet: toi
    si: "flag(histoire_h5) && flag(h5_acte_rendu)"
    texte: "Maître Guénot a mis des gants pour le toucher. Mon père, lui, l'avait plié en huit pour le glisser dans sa poche de gilet."
  - qui: paulette
    sujet: toi
    si: "flag(histoire_h5) && flag(h5_acte_vu)"
    texte: "Le buffet est fermé à clé. La clé est dans ma main, la nuit aussi. Revenez quand vous saurez de quel côté vous restez."
  - qui: paulette
    sujet: club
    si: "flag(histoire_h5) && saison == 3"
    texte: "Je viendrai au conseil. Gardez-moi une chaise près de la fenêtre. Je veux voir le stade pendant qu'ils votent."
  - qui: paulette
    sujet: match
    si: "flag(histoire_h5) && jour == sam && flag(h5_tribune_est_brulee)"
    texte: "Je regarde les matchs depuis le banc du square, maintenant. On voit la moitié du terrain. La bonne, quand on gagne."
  - qui: paulette
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_temoin)"
    texte: "Le petit Vallin a parlé ? Son père aussi parlait trop tard. Et son père, personne l'écoutait."

  # ==================================================================== GÉGÉ
  - qui: gege
    sujet: club
    si: "flag(histoire_h5) && relation.gege >= 1"
    texte: "Le virage a payé ses abonnements jusqu'en mai. Si le stade est vendu avant, on campe dedans. Avec les gosses."
  - qui: gege
    sujet: club
    si: "flag(histoire_h5) && flag(h5_plaque_lue)"
    texte: "La plaque, je la cire le vendredi. Le samedi, elle brille pour les visiteurs. Ils la lisent pas non plus."
  - qui: gege
    sujet: club
    si: "flag(histoire_h5) && flag(h5_plaque_restee)"
    texte: "La plaque est restée à la grille. Le samedi, on y noue nos écharpes. Ceux qui voulaient la dévisser regardent ailleurs en passant."
  - qui: gege
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_plaque_deposee)"
    texte: "Quatre trous dans la grille. Je mets une écharpe dans chaque trou, le samedi. Comme ça, on sait où elle était."
  - qui: gege
    sujet: club
    si: "flag(histoire_h5) && flag(h5_mot_donne)"
    texte: "PERSONNE NE PART, à la craie, sur la porte. Je la repasse tous les lundis."
  - qui: gege
    sujet: club
    si: "flag(histoire_h5) && flag(h5_mot_rompu)"
    texte: "J'ai gardé la date sur la porte. Pas pour toi. Pour Tavernier. Qu'il sache que quelqu'un a noté le jour."
  - qui: gege
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_deblaye)"
    texte: "Les pelleteuses à sept heures, le lendemain. Les cendres étaient encore chaudes. J'ai noté le nom de l'entreprise."
  - qui: gege
    sujet: sponsor
    si: "flag(histoire_h5) && flag(h5_clause_acceptee)"
    texte: "Article 4, accompagner le projet urbain. T'as signé ça ? Moi, j'accompagne personne. Je suis du virage."
  - qui: gege
    sujet: sponsor
    si: "flag(histoire_h5) && flag(h5_clause_rompue)"
    texte: "La pénalité des Terrasses, on l'a payée à la quête. Les shorts, c'est nous. Le reste, c'est toi. On est quittes."
  - qui: gege
    sujet: quartier
    si: "flag(histoire_h5) && flag(h5_vallin_dehors)"
    texte: "Le petit Vallin a passé l'hiver dans le wagon. Je lui ai porté une couverture. Il a dit son nom en entier pour me remercier."
  - qui: gege
    sujet: club
    si: "flag(histoire_h5) && flag(h5_bache)"
    texte: "La bâche est roulée sous le comptoir, prête. Vingt mètres. On la sortira le jour où il faudra. Tu sauras quel jour."
  - qui: gege
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_siege)"
    texte: "Trois nuits au club-house. Josiane faisait le café à six heures. Elle a vu personne. C'est son métier."
  - qui: gege
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_lambert_libre)"
    texte: "T'as dit à Lambert de voter comme il veut ? Lambert, en trente ans, il a jamais rien voulu. Il votera comme le maire."
  - qui: gege
    sujet: match
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee) && jour == sam"
    texte: "On chante tourné vers l'Est, maintenant. Les visiteurs croient qu'on chante pour eux. On les laisse croire."

  # =========================================================== MADAME JOSIANE
  - qui: josiane
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_josie)"
    texte: "Cette voix, sur votre cassette… C'est le directeur de la banque. Il m'appelle Josie depuis trente ans. Personne d'autre."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h5) && flag(h5_conseil_entendu)"
    texte: "Le téléphone beige a sonné à dix-huit heures. Je ne suis pas montée. Je ne monte jamais quand il sonne. J'ai noté l'heure, et les sonneries."
  - qui: josiane
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_assurance_bloquee)"
    texte: "La lettre de la Prévoyance, je l'ai classée à D. D comme Dorian. Il n'y a jamais eu de dossier P dans ce bureau."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h5) && flag(h5_pret_1998)"
    texte: "Le classeur de 1998 est sous les licences de 1987. C'est le meilleur coffre du club : personne ne relit les vieilles licences."
  - qui: josiane
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_huissier_club)"
    texte: "La machine à laver n'est pas partie. Je me suis assise dessus. Un huissier ne saisit pas une femme assise ; c'est la loi, je crois."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h5) && flag(h5_ordre_cabinet)"
    texte: "L'en-tête de l'huissier, je l'ai reconnu. Je tape des lettres depuis 1987. Celles-là, ce n'est pas moi qui les ai tapées."
  - qui: josiane
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_mireille)"
    texte: "Ma sœur a les clés des archives depuis 1971. Elle ne les a jamais prêtées. Elle dit que ce serait une exception, si je le demande."
  - qui: josiane
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_bastide_1976)"
    texte: "Bastide, je l'ai connu à la mairie. Il me prêtait son crayon à papier. Il le reprenait toujours, même usé jusqu'au bout."
  - qui: josiane
    sujet: epoque
    si: "flag(histoire_h5) && flag(monde_ecus)"
    texte: "Je fais les fiches de paie en écus, et je garde les francs au crayon dans la marge. Pour que les joueurs voient ce qu'ils perdent."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h5) && flag(h5_maison_saisie)"
    texte: "Vous dormez à l'hôtel ? J'ai mis une couverture dans le placard du bureau. Au cas où, un soir, vous ne rentreriez pas."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h5) && flag(h5_brehaut_renvoye)"
    texte: "Le bureau de monsieur Bréhaut est vide. J'ai gardé le carton, sous mon bureau, avec son nom au feutre."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h5) && flag(h5_brehaut_garde)"
    texte: "Monsieur Bréhaut ne téléphone plus de la buvette, le mardi. Il téléphone de chez lui. Je le sais : il arrive en retard."

  # =========================================================== MADAME VIALAT
  - qui: vialat
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_solde_negatif)"
    texte: "Votre premier solde est au crayon. Je n'efface jamais un crayon. Je le laisse pâlir, et je regarde ce qu'on écrit par-dessus."
  - qui: vialat
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_solde_positif)"
    texte: "Un solde positif, au greffe. J'ai recompté trois fois. La troisième, j'ai cherché l'erreur."
  - qui: vialat
    sujet: club
    si: "flag(histoire_h5) && flag(h5_vaucastel)"
    texte: "Vaucastel avait une tribune en pierre, lui aussi. Ils l'ont vendue en dernier, pour payer l'électricité."
  - qui: vialat
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_vialat_sci)"
    texte: "Votre créancier possède votre dette et un projet sur votre terrain. Il ne lui manque qu'une séance du conseil."
  - qui: vialat
    sujet: club
    si: "flag(histoire_h5) && flag(h5_vialat_attend)"
    texte: "Mai. Le seize, à dix heures. Apportez ce que vous avez, dans l'ordre. Je ne relis jamais un dossier en désordre."
  - qui: vialat
    sujet: epoque
    si: "flag(histoire_h5) && flag(monde_ecus)"
    texte: "Je refais tous les bilans à la main, en écus. Les machines arrondissent. Moi, je n'arrondis pas les clubs."
  - qui: vialat
    sujet: club
    si: "flag(histoire_h5) && flag(h5_comptes_enterres)"
    texte: "Un délai signé de la veille. Je les collectionne. Celui-là est dans mon sac, à côté de la coupure."
  - qui: vialat
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_fonds_ilyas)"
    texte: "Vingt millions, et un homme invisible au conseil. Je compte les sièges aussi. Celui-là est vide, et il vote."
  - qui: vialat
    sujet: club
    si: "flag(histoire_h5) && saison == 1"
    texte: "Je passerai en fin de saison. Je préviens toujours. Les clubs qui coulent n'aiment pas les surprises ; moi non plus."
  - qui: vialat
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee)"
    texte: "La tribune valait zéro au bilan. Personne n'assure un zéro. Ce qui m'intéresse, c'est qui a cessé de payer pour lui."

  # ====================================================== PIERRE-YVES DORIAN
  - qui: dorian
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_caution_signee)"
    texte: "Votre caution est rangée au coffre, entre deux autres. Vous seriez surpris des voisins qu'elle a."
  - qui: dorian
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_caution_refusee)"
    texte: "Vous avez refusé la caution. C'est votre droit. La banque a celui de s'en souvenir. Nous avons tous nos droits."
  - qui: dorian
    sujet: club
    si: "flag(histoire_h5) && flag(h5_conseil_entendu)"
    texte: "Vous avez une tête de mercredi. Les mardis sont longs, au club, à ce qu'on dit."
  - qui: dorian
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_fonds_refuse)"
    texte: "Vingt millions refusés. Je l'ai annoncé au comité comme une bonne nouvelle. Personne n'a ri ; moi non plus."
  - qui: dorian
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_josie)"
    texte: "Josiane ne me dit plus bonjour au marché. Elle me regarde comme on écoute une voix. C'est curieux, non ?"
  - qui: dorian
    sujet: epoque
    si: "flag(histoire_h5) && flag(monde_ecus)"
    texte: "Les écus vont tout simplifier. Une dette en francs, ça se lit. Une dette en écus, on la relit trois fois, et on signe."
  - qui: dorian
    sujet: club
    si: "flag(histoire_h5) && saison == 1"
    texte: "Saluez Josie de ma part. Je la salue moi-même, d'habitude, mais elle ne répond plus au téléphone de la banque."
  - qui: dorian
    sujet: toi
    si: "flag(histoire_h5) && flag(h5_maison_saisie)"
    texte: "Je suis désolé pour la maison. Sincèrement. Ce n'est pas la banque qui a choisi la date ; la date est venue toute seule."
  - qui: dorian
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_sci_publiee)"
    texte: "Mon beau-frère a lu L'Écho. Il gère des sociétés, c'est un métier. Les journalistes, eux, gèrent des points d'interrogation."
  - qui: dorian
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_avance)"
    texte: "Votre avance a été signée en sept minutes. Un record. Rassurez-vous, vous avez signé au bon endroit."

  # ================================================================= CAMILLE
  # À la maison seulement, le soir et la nuit.
  - qui: camille
    sujet: toi
    si: "flag(histoire_h5) && lieu == appartement && flag(h5_signe_en_bas)"
    texte: "T'as signé sans lire, l'autre nuit. Ça m'a pas étonnée. C'est pour ça que je t'apporte les papiers le soir."
  - qui: camille
    sujet: toi
    si: "flag(histoire_h5) && lieu == appartement && flag(h5_lu_d_abord)"
    texte: "T'as tout lu, l'autre nuit. Trois pages. T'as vu la date ? Elle était juste. C'est moi qui l'avais mise."
  - qui: camille
    sujet: club
    si: "flag(histoire_h5) && lieu == appartement && flag(h5_conseil_entendu)"
    texte: "Tu rentres tard le mardi. Je demande pas pourquoi. Je réchauffe le dîner à vingt heures, pas avant."
  - qui: camille
    sujet: club
    si: "flag(histoire_h5) && lieu == appartement && flag(h5_tribune_est_brulee)"
    texte: "Tu sens encore le bois brûlé. Ça part pas au lavage. Ta veste est au balcon depuis trois jours."
  - qui: camille
    sujet: toi
    si: "flag(histoire_h5) && lieu == appartement && flag(h5_nom_laisse)"
    texte: "Ton nom dans une vitrine. Ton père aurait aimé ça, je crois. Ton père aimait les vitrines."
  - qui: camille
    sujet: toi
    si: "flag(histoire_h5) && lieu == appartement && flag(h5_camille_raison)"
    texte: "Il reste une signature, je te l'ai dit. Après, on part. La mer, la montagne, n'importe où sans tribune."
  - qui: camille
    sujet: toi
    si: "flag(histoire_h5) && lieu == appartement && flag(h5_camille_accusee)"
    texte: "Je dors dans la chambre d'amis. Elle donne sur la Rive. On voit l'agence d'ici, et la vitrine allumée toute la nuit."
  - qui: camille
    sujet: rumeur
    si: "flag(histoire_h5) && lieu == appartement && flag(h5_camille_appelee)"
    texte: "La procureure ? On était à la fac ensemble. Elle rendait toujours sa copie avant l'heure."
  - qui: camille
    sujet: argent
    si: "flag(histoire_h5) && lieu == appartement && flag(h5_caution_signee)"
    texte: "La caution, j'ai relu le texte après toi. Y a rien à redire. Il est bien écrit. Trop bien."
  - qui: camille
    sujet: toi
    si: "flag(histoire_h5) && lieu == appartement && flag(h5_sci_trois)"
    texte: "Douze pour cent. Caché, non. Dit, non plus. Chez les avocats, ce genre de nuance, ça se facture."

  # ============================================================ DIDIER VALLIN
  - qui: vallin
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee) && !flag(h5_temoin)"
    texte: "La nuit de l'Est, j'étais dehors. Je suis toujours dehors, moi. C'est pour ça que je vois tout."
  - qui: vallin
    sujet: toi
    si: "flag(histoire_h5) && flag(h5_vallin_loge)"
    texte: "La chambre 9 a une fenêtre sur la Rive. Je dors pas. Je regarde l'eau. Mais au chaud."
  - qui: vallin
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_temoin)"
    texte: "Un ciré jaune, un bidon rouge, la camionnette des pelouses. Je l'ai dit. Dis-le aussi. Et dis mon nom en entier."
  - qui: vallin
    sujet: quartier
    si: "flag(histoire_h5)"
    texte: "La craie de la halle, je la prends à l'école, le soir. La maîtresse le sait. Elle laisse la boîte ouverte."
  - qui: vallin
    sujet: epoque
    si: "flag(histoire_h5) && saison >= 2"
    texte: "J'avais un contrat à l'étranger, en 1989. Mon nom y est allé sans moi. Il joue encore, je crois, quelque part."
  - qui: vallin
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_temoin_depose)"
    texte: "La procureure a écrit mon nom lettre par lettre. Personne avait fait ça depuis l'école. Elle a même mis les deux L."
  - qui: vallin
    sujet: club
    si: "flag(histoire_h5) && flag(h5_vallin_dehors)"
    texte: "Le wagon, l'hiver, ça tient si on ferme les deux portes. J'ai fermé les deux portes. Personne a frappé."
  - qui: vallin
    sujet: match
    si: "flag(histoire_h5) && jour == sam"
    texte: "Le samedi, j'écoute le stade depuis la halle. Quand la Nord chante, je trace une ligne de plus."
  - qui: vallin
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_tessandier_aveu)"
    texte: "La dame de l'agence est passée à la friche. Elle y vient jamais. Elle m'a dit pardon. Je savais pas pour quoi."
  - qui: vallin
    sujet: quartier
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee) && tranche == nuit"
    texte: "La nuit, la camionnette blanche passe deux fois devant la friche. Elle ralentit. Elle arrose rien, la nuit."

  # ============================================================ JUDITH AMSEL
  - qui: amsel
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_rive_voiture)"
    texte: "Une berline vide au fond de l'eau depuis dix ans, et personne ne l'a jamais déclarée volée. C'est ce qui m'intéresse."
  - qui: amsel
    sujet: club
    si: "flag(histoire_h5) && flag(h5_soulage)"
    texte: "Sur le quai, vous avez avoué votre soulagement. Je l'ai noté, avec l'heure. Le soulagement de quoi, nous le saurons."
  - qui: amsel
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_amsel_temoin)"
    texte: "Votre dossier tient dans six chemises, par ordre alphabétique. La lettre C est la plus épaisse."
  - qui: amsel
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_amsel_dossier)"
    texte: "Vous n'aviez rien, m'avez-vous dit. J'ai noté l'heure. Je note toujours l'heure des riens."
  - qui: amsel
    sujet: epoque
    si: "flag(histoire_h5) && saison >= 2 && flag(h5_rive_voiture)"
    texte: "Les berges sont gelées tant que je n'ai pas fini. Je n'ai pas fini. Je ne suis pas pressée de finir."
  - qui: amsel
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_perquisition)"
    texte: "Douze cartons, un seul utile. C'est la moyenne. Celui-là, nous le gardons."
  - qui: amsel
    sujet: toi
    si: "flag(histoire_h5) && flag(h5_valise_niee)"
    texte: "Vous ne saviez rien des billets. Moi, je sais leurs numéros. Nous comparerons nos savoirs, un matin."
  - qui: amsel
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_phrase_connue)"
    texte: "Une phrase dite un soir devant un homme qui a un bidon. On appelle ça une conversation. Le code pénal a un autre mot."

  # ================================================================== DEMBO
  - qui: dembo
    sujet: club
    si: "flag(histoire_h5) && flag(h5_paie_promise) && saison == 1"
    texte: "T'as dit le 5. Le 5, mon compte, à neuf heures. Puis à midi. Le 6 aussi."
  - qui: dembo
    sujet: club
    si: "flag(histoire_h5) && flag(h5_greve_payee)"
    texte: "Mon chèque, je l'ai pas encaissé tout de suite. Une semaine dans mon casier. Pour le regarder."
  - qui: dembo
    sujet: match
    si: "flag(histoire_h5) && jour == sam && flag(h5_tribune_est_brulee)"
    texte: "Samedi, je marque devant l'Est. Exprès. Pour ceux qui étaient assis là."
  - qui: dembo
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_dembo_sait)"
    texte: "Halvenne en juin, paraît. J'ai rien signé. Mais je connais l'écriture."
  - qui: dembo
    sujet: sponsor
    si: "flag(histoire_h5) && flag(h5_maillot_terrasses)"
    texte: "Ma mère a dit qu'elle viendrait plus si je porte la résidence sur la poitrine. Elle est venue. Elle a regardé mon dos."
  - qui: dembo
    sujet: club
    si: "flag(histoire_h5) && saison == 1"
    texte: "Au prochain club, je serai l'expérience. Ici, je suis encore Dembo. Même pas payé, c'est mieux."

  # ================================================================== VUKIĆ
  - qui: vukic
    sujet: club
    si: "flag(histoire_h5) && flag(h5_cahier_lu)"
    texte: "Le cahier est plein. J'en ai acheté un autre, le même. Je l'ai commencé par la fin, pour changer."
  - qui: vukic
    sujet: club
    si: "flag(histoire_h5) && flag(h5_oudart_vendu)"
    texte: "Le gamin des moins de dix-neuf. Une fois sur deux, le mauvais côté. Il apprend."
  - qui: vukic
    sujet: match
    si: "flag(histoire_h5) && flag(h5_greve_signee)"
    texte: "Ils s'entraînent pas. Ils jouent. Moi, jamais si peu travaillé. Jamais si mal dormi."
  - qui: vukic
    sujet: club
    si: "flag(histoire_h5) && saison == 3"
    texte: "J'ai écrit la date du conseil dans le cahier. En dessous, j'ai laissé une page blanche. Pour le résultat."
  - qui: vukic
    sujet: epoque
    si: "flag(histoire_h5) && annee >= 2000"
    texte: "La Ligue veut des kilomètres parcourus, des pourcentages de passes. Mon cahier, lui, note qui a regardé la loge."
  - qui: vukic
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee)"
    texte: "L'Est, en pointillés sur le tableau. Les joueurs demandent pas pourquoi."

  # ==================================================================== LÉA
  - qui: lea
    sujet: toi
    si: "flag(histoire_h5) && flag(h5_fax_plume)"
    texte: "La SCI Rive Gauche a été créée un mardi, chez un notaire de Portclair, par trois personnes. J'ai deux noms. Vous avez le troisième ?"
  - qui: lea
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_sci_ecrite)"
    texte: "J'ai publié le tampon sans le prénom. Les gens d'Aubérive ont trouvé le prénom tout seuls. Ils sont doués pour ça."
  - qui: lea
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_sci_deux)"
    texte: "Deux noms sur trois. Pour un journal, c'est mauvais. Le troisième, je le veux avant jeudi."
  - qui: lea
    sujet: epoque
    si: "flag(histoire_h5) && annee >= 2000"
    texte: "L'Écho a une adresse sur l'internet depuis lundi. On y met les résultats. Les lecteurs y écrivent des insultes en majuscules."
  - qui: lea
    sujet: sombre
    si: "flag(histoire_h5) && flag(h5_rive_voiture)"
    texte: "La carte grise de la berline est au nom d'un entraîneur de 1990. On a retrouvé sa photo dans nos archives. Il souriait pas."
  - qui: lea
    sujet: club
    si: "flag(histoire_h5) && flag(h5_larrieu)"
    texte: "Maître Larrieu a fermé son étude pour congés. En février. Les notaires partent jamais en février."

  # ========================================== MALBEC, ILYAS, VAUBOURG, BRÉHAUT
  - qui: malbec
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_valise_prise)"
    texte: "Notre petite affaire se porte bien. Dembo aime déjà Halvenne ; il ne le sait pas encore, c'est tout."
  - qui: malbec
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_valise_refusee)"
    texte: "Vous avez refusé ma valise. Je l'ai offerte à un autre club, le lendemain. Lui l'a prise. Il a fini dernier."
  - qui: malbec
    sujet: club
    si: "flag(histoire_h5) && flag(h5_mot_tenu)"
    texte: "Tavernier reste chez vous ? Je rappellerai en juin. En juin, les présidents ont besoin d'argent pour l'été."
  - qui: malbec
    sujet: rumeur
    si: "flag(histoire_h5)"
    texte: "Vaubourg à la Ligue, moi à Halvenne, cher collègue. Nous ne nous parlons plus. Nos secrétaires, si."
  - qui: nassir
    sujet: sponsor
    si: "flag(histoire_h5) && flag(h5_fonds_ilyas)"
    texte: "L'homme du conseil vous salue. Il ne viendra pas au stade : il n'aime pas le froid, ni les tribunes en bois."
  - qui: nassir
    sujet: argent
    si: "flag(histoire_h5) && flag(h5_fonds_refuse)"
    texte: "Vous avez refusé ; c'est noté. Nous reviendrons quand l'heure aura changé. Ici, l'heure change toujours en mars."
  - qui: nassir
    sujet: rumeur
    si: "flag(histoire_h5)"
    texte: "Un club au greffe, c'est une excellente affaire pour quelqu'un. La question est toujours : pour qui ?"
  - qui: aulard
    sujet: club
    si: "flag(histoire_h5) && flag(h5_comptes_enterres)"
    texte: "Notre accord tient. La cave est fraîche, mes comptes s'y conservent bien. Comme le vin, ils prennent de la valeur."
  - qui: aulard
    sujet: club
    si: "flag(histoire_h5) && flag(h5_comptes_ouverts)"
    texte: "Alors, la cave ? Il fait froid, je vous l'avais dit. On en remonte toujours avec un rhume, ou un dossier."
  - qui: aulard
    sujet: rumeur
    si: "flag(histoire_h5)"
    texte: "La Ligue, c'est un club de présidents. On s'y retrouve le jeudi. On parle du temps, et du terrain des autres."
  - qui: aulard
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_conseil_entendu)"
    texte: "Le téléphone beige sonne encore ? Il sonnait déjà de mon temps. J'ai jamais décroché. C'est peut-être pour ça que je suis parti."
  - qui: brehaut
    sujet: club
    si: "flag(histoire_h5) && flag(h5_brehaut_garde)"
    texte: "J'ai jeté la carte de visite. Le numéro, je le sais par cœur quand même."
  - qui: brehaut
    sujet: club
    si: "flag(histoire_h5) && flag(h5_oudart_garde)"
    texte: "Oudart m'a demandé pourquoi j'avais déchiré le fax. Je lui ai dit que c'était un mauvais prix. C'était un bon prix."
  - qui: brehaut
    sujet: rumeur
    si: "flag(histoire_h5) && flag(h5_conseil_entendu) && saison == 1"
    texte: "Le club d'après, tout le monde en parle et personne l'a vu. Moi, j'ai vu le parking. Il est grand."

# Où l'on croise les visages de ce livre, sans carte.
presences:
  - {qui: tessandier, lieu: agence, tranches: [matin, aprem]}
  - {qui: dorian, lieu: banque, tranches: [matin]}
  - {qui: paulette, lieu: square, tranches: [aprem]}
  - {qui: vallin, lieu: feu, tranches: [soir, nuit]}
  - {qui: vialat, lieu: mairie, tranches: [matin]}
  - {qui: dembo, lieu: terrain, tranches: [matin]}
  - {qui: malbec, lieu: hotel, tranches: [soir]}
  - {qui: amsel, lieu: mairie, tranches: [aprem]}

# Où attendent les cartes de Madame Tessandier (l'agence n'est pas un lieu du
# moteur) et celles de Mamie Paulette chez elle (le square des Lilas).
rencontres:
  tessandier: agence
  paulette: square

# Ce qu'on voit en poussant la porte, selon l'histoire (la première vraie gagne).
lieux_variantes:
  - lieu: agence
    si: "flag(histoire_h5) && saison == 3 && flag(h5_tessandier_silence)"
    texte: "La vitrine est éteinte. Derrière la vitre noire, on devine la maquette ; on voit surtout son propre reflet, et derrière lui, le vrai stade."
  - lieu: agence
    si: "flag(histoire_h5) && saison == 3"
    texte: "La maquette a pris la poussière. Le stade n'y est plus du tout : un parc, un lac, des balcons. Sur la vitre, des traces de doigts à hauteur d'enfant."
  - lieu: agence
    si: "flag(histoire_h5) && saison == 2 && flag(h5_nom_laisse)"
    texte: "La maquette a changé, le parc a mangé les tribunes. Sous le nom du promoteur, un petit panneau de carton : {nom} Bâtiment, gros œuvre."
  - lieu: agence
    si: "flag(histoire_h5) && saison == 2"
    texte: "La maquette a changé. Le parc en mousse a mangé les tribunes, et à la place de l'Est pousse un bosquet de lichen. Le petit lac est plus grand qu'en août."
  - lieu: agence
    si: "flag(histoire_h5) && saison == 1"
    texte: "La vitrine de l'agence Tessandier : LES TERRASSES DE LA RIVE, SECONDE TRANCHE. Là où se tient le stade, un parc en mousse verte et un lac en résine."
  - lieu: stade
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee)"
    texte: "Le stade de la Rive, trois tribunes et des barrières de chantier. Derrière, l'Est : des gradins noirs, des poutres de chêne tordues, une odeur qui ne part pas."
  - lieu: clubhouse
    si: "flag(histoire_h5) && flag(h5_siege)"
    texte: "Le club-house, des sacs de couchage roulés au carré sous le clou de la photo de 1974. Au secrétariat, deux cafetières tournent."
  - lieu: clubhouse
    si: "flag(histoire_h5) && flag(h5_huissier_club)"
    texte: "Le secrétariat, des pastilles rouges sur le photocopieur et la machine à laver des maillots. Madame Josiane tape sur la seule machine qu'on lui a laissée."
  - lieu: mairie
    si: "flag(histoire_h5) && saison == 3"
    texte: "Sur la porte de la mairie, une affiche : SÉANCE PUBLIQUE, RÉVISION DU TERRAIN DE LA RIVE. En bas, au crayon, quelqu'un a écrit : ET LES ENFANTS ?"
  - lieu: hotel
    si: "flag(histoire_h5) && flag(h5_vallin_loge)"
    texte: "L'hôtel de la Rive. Au tableau des clés, il manque toujours la 9. Didier Vallin la garde sur lui, même pour descendre déjeuner."
  - lieu: banque
    si: "flag(histoire_h5) && flag(h5_conseil_entendu)"
    texte: "La Banque Aubérivoise. Au fond, la porte du directeur est entrouverte ; on entend une cuillère tourner dans une tasse, régulière, comme une horloge."
  - lieu: feu
    si: "flag(histoire_h5) && flag(h5_tribune_est_brulee)"
    texte: "Le feu de palettes de la friche. Autour, des garçons qui ne parlent pas. L'un d'eux trace des lignes à la craie sur le béton, au bord de la lumière."
