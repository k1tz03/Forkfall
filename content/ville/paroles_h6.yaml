# Histoire 6 — « 23 h 58 » : ce que dit la ville pendant le livre (2003-2006).
# Une réplique ne fait pas avancer l'intrigue : elle prouve qu'elle avance.
# Toutes lisent le drapeau d'histoire. Le protagoniste peut être une femme :
# aucun accord, aucune adresse genrée. `saison` vaut 1 pour 2003-2004.
# Aucun personnage ne dit sa phrase-signature (content/characters.yaml `tic`),
# ni ne la détourne.
paroles:
  # ═══════════════════════════════════════════════════════ la rue, les gens
  - qui: passant
    sujet: toi
    si: "flag(histoire_h6) && saison == 1"
    texte: "Le recrutement, c'est vous, maintenant ? Ma fille dit qu'on avait jamais vu ça, ici. Je lui ai dit d'attendre le mercato."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h6) && annee >= 2004"
    texte: "Le fax, c'est bientôt fini, d'après mon neveu. Tout partira par l'ordinateur. Pour les mauvaises nouvelles, on était déjà bien servis."
  - qui: fan
    sujet: club
    si: "flag(histoire_h6) && flag(h6_dembo_vendu)"
    texte: "Dembo à Halvenne, à trente-sept ans. Fallait le laisser finir ici, non ? On l'aurait porté jusqu'à la buvette."
  - qui: commercant
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_barbier_soupconne)"
    texte: "Mon fax public, je le ferme à dix-neuf heures. À minuit, personne envoie rien d'ici. Il est sous clé, je vous dis. La clé, elle est là, dans ma poche."
  - qui: enfant
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_tibo_vendu)"
    texte: "Tibo Rancé, il est parti où ? Il m'avait promis un maillot. Il a pas eu le temps, je crois."
  - qui: passante
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_voiture_photo)"
    texte: "Y avait un type dans une voiture devant chez vous, cette nuit, avec un appareil. Il a photographié votre porte. Que la porte."
  - qui: commercant
    sujet: argent
    si: "flag(histoire_h6) && saison == 2 && phase == retour"
    texte: "Au tabac du Quai, on parie plus sur les matchs, maintenant, on parie sur vos ventes. Le petit Rancé parti avant l'été, c'est coté trois contre un."
  - qui: fan
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_pere_rance) && flag(h6_tibo_vendu)"
    texte: "Le père Rancé est au Terminus tous les soirs depuis que son fils a signé. Il gagne, pour une fois. Et il fait une de ces têtes."
  - qui: passant
    sujet: quartier
    si: "flag(histoire_h6) && possede(residence_rive)"
    texte: "De la résidence, on voit le terrain de la seconde tranche. Ils avaient promis un parc. Pour l'instant, c'est un demi-parking."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h6) && flag(h6_indice_escalier)"
    texte: "Le stagiaire qui dit bonjour à tout le monde ? Il descend au sous-sol tous les soirs, vers onze heures. Le gardien croit qu'il fume. Il sent pas le tabac."
  - qui: passante
    sujet: toi
    si: "flag(histoire_h6) && tranche == nuit"
    texte: "Vous rentrez tard, vous aussi ? Moi, je sors de l'hôpital, je suis de nuit. Et vous, c'est quoi qui vous empêche de dormir ?"
  - qui: passant
    sujet: match
    si: "flag(histoire_h6) && serie_d >= 1"
    texte: "On perd, et vous vendez. Ou alors on perd parce que vous vendez ? Je demande, hein."
  - qui: fan
    sujet: classement
    si: "flag(histoire_h6) && journee >= 12 && rang >= 15"
    texte: "{rang}, avec l'équipe que vous nous laissez. Au virage, c'est le président qu'on vise, pour l'instant. Ça va pas durer."
  - qui: fan
    sujet: classement
    si: "flag(histoire_h6) && journee >= 12 && rang <= 6"
    texte: "{rang} ! Même avec les ventes. Je sais pas comment vous faites, et je veux surtout pas le savoir."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Les écus, je les remets encore en francs dans ma tête. Vos millions, je les fais fois six et demi. Après, faut que je m'assoie."
  - qui: commercant
    sujet: achat
    si: "flag(histoire_h6) && possede(montre_acier)"
    texte: "Cette montre de plongée, elle sort de chez moi. Le numéro gravé au dos est dans mon registre. C'est pas vous qui l'avez achetée, je m'en souviendrais."
  - qui: passant
    sujet: sponsor
    si: "flag(histoire_h6) && flag(h6_canette_signee)"
    texte: "La canette orange sur la manche, franchement. Mon fils a acheté le maillot quand même. Il le porte à l'envers."
  - qui: passante
    sujet: sponsor
    si: "flag(histoire_h6) && flag(h6_primes_mutuelle)"
    texte: "La Mutuelle des Quais m'a pas remboursé mes lunettes. Pour le foot, par contre, il paraît qu'ils paient en liquide."
  - qui: enfant
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tibo_garde)"
    texte: "Tibo Rancé m'a signé ma chaussure, au centre. Il a dit qu'il restait. Vous lui avez dit quoi, pour qu'il reste ?"
  - qui: ancien
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_rideau_vu)"
    texte: "On dit que c'est vous qui sortiez du Rideau Rouge, l'autre soir. Moi, j'ai rien vu. J'avais pas mes lunettes."
  - qui: commercant
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_verite_dimanche)"
    texte: "Depuis que Massenet a dit « fax » à la télé, je vends des rouleaux de papier thermique comme des billets de loto."
  - qui: passant
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_pere_photo)"
    texte: "Votre père, aux Glycines, il montre une photo de vous à tout le monde, au réfectoire. Il dit que c'est d'avant le football."
  - qui: fan
    sujet: match
    si: "flag(histoire_h6) && flag(h6_klopf_gauche)"
    texte: "Le gaucher que vous avez fait venir, il regarde jamais son pied. Vogler, il le regardait comme un fils."
  - qui: passante
    sujet: toi
    si: "flag(histoire_h6) && saison == 3"
    texte: "Trois ans que vous êtes là, et toujours pas de voiture de sport ? Au marché, on sait pas si c'est bon signe."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h6) && saison == 3"
    texte: "Barbier vient plus au centre. Il va à Trébignac, voir les poussins. Le district, il dit que c'est plus honnête."
  - qui: passant
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_audit_parle)"
    texte: "La Commission a scellé des cartons au club-house. Mon beau-frère était au parking. Il dit que les cartons avaient l'air légers."
  - qui: commercant
    sujet: achat
    si: "flag(histoire_h6) && possede(citadine)"
    texte: "La petite citadine, c'est la vôtre ? Une institutrice l'avait avant. Elle disait déjà qu'elle démarrait en janvier."
  - qui: fan
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_lea_publie)"
    texte: "La photo de 1999, dans L'Écho. On vous reconnaît pas. Enfin, si, quand on sait."
  - qui: passante
    sujet: quartier
    si: "flag(histoire_h6) && lieu == laverie"
    texte: "La laverie du club, elle a fermé en 1987, vous saviez ? Depuis, les maillots, c'est nous. Mais la buanderie du club-house, personne l'a vidée."
  - qui: ancien
    sujet: sombre
    si: "flag(histoire_h6) && tranche == nuit && lieu == clubhouse"
    texte: "Y a de la lumière au sous-sol du club-house, certains soirs. À la buanderie. Y a plus de linge là-dedans depuis 1987, pourtant."
  - qui: passant
    sujet: club
    si: "flag(histoire_h6) && flag(h6_solvang_alliee)"
    texte: "Une agente qui écrit une clause pour le club d'en face, j'aurai tout vu. Remarquez, elle avait l'air de savoir ce qu'elle faisait."
  - qui: fan
    sujet: club
    si: "flag(histoire_h6) && flag(h6_solvang_adverse)"
    texte: "Vogler en Vestrie, et pas un écu pour le club. Une clause, paraît-il, que son agente a sortie au bon moment."
  - qui: passante
    sujet: club
    si: "flag(histoire_h6) && flag(h6_canette_courte)"
    texte: "L'orange sur la manche, c'est fini l'an prochain, il paraît. Mon mari trouve ça dommage. Au moins, on la voyait de loin."
  - qui: ancien
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_mutuelle_refusee)"
    texte: "Paraît que vous avez renvoyé une enveloppe de la Mutuelle sans l'ouvrir. Au café, on parle que de ça depuis mardi."
  - qui: fan
    sujet: match
    si: "flag(histoire_h6) && flag(h6_klopf_sans_gauche)"
    texte: "Le droitier qui joue à gauche, il regarde son pied à chaque ballon. Au virage, on les annonce en chœur. On en est à quarante par match."
  - qui: commercant
    sujet: achat
    si: "flag(histoire_h6) && flag(h6_montres_gardees)"
    texte: "Deux montres de plongée sorties de chez moi, au même nom, la même saison. Je demande rien, moi. Si elles s'arrêtent, je les répare."
  - qui: passant
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_montres_rendues)"
    texte: "Le coursier de Fardelli est repassé trois fois au club-house avec le même paquet. Il dit qu'il commence à le trouver lourd."
  - qui: passante
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_massenet_muet)"
    texte: "Le fauteuil vide à la télé, dimanche, c'était pour vous ? Ma mère a cru à une panne. Elle a tapé sur le poste."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h6) && flag(h6_doc_refuse)"
    texte: "Le milieu au genou, il boite toujours, mais il est encore chez nous. Le Doc a pas voulu signer."
  - qui: fan
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_doc_signe)"
    texte: "Le milieu qu'on a vendu cet hiver, il jouera pas avant l'été, là-bas. Nous, on l'avait vu boiter tout l'automne."
  - qui: enfant
    sujet: club
    si: "flag(histoire_h6) && flag(h6_oeil_barbier)"
    texte: "Y a un nouveau au centre, il vient de Trébignac. Il parle pas, il garde la tête haute, même sous la pluie. On l'appelle le phare."
  - qui: passant
    sujet: club
    si: "flag(histoire_h6) && flag(h6_colonnes_ferlac)"
    texte: "Le gamin de Trébignac a signé chez les autres. Il paraît qu'un tableau a dit non. Un tableau, je vous demande un peu."
  - qui: passante
    sujet: club
    si: "flag(histoire_h6) && flag(h6_arnaud_allie)"
    texte: "Le fils Vaubourg a débranché son fax, paraît-il, pour prouver je sais pas quoi. Mon fils fait pareil avec le téléphone quand il boude."
  - qui: ancien
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_arnaud_soupconne)"
    texte: "Le fils Vaubourg, soupçonné par sa propre direction sportive. Remarquez, son père le soupçonne depuis le berceau."
  - qui: commercant
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_lea_attend)"
    texte: "La petite de L'Écho a un mur couvert de papiers épinglés, à la rédaction. Elle a mis un drap dessus quand je suis entré livrer."
  - qui: fan
    sujet: match
    si: "flag(histoire_h6) && flag(h6_vukic_soutenu)"
    texte: "Le nouveau milieu, il court pour deux. Vukić l'a eu, finalement. Il sourit pas plus, mais il gueule moins."
  - qui: passant
    sujet: match
    si: "flag(histoire_h6) && flag(h6_vukic_lache)"
    texte: "Vukić joue avec des gamins et un gaucher sorti de nulle part. Il a punaisé une liste dans son bureau, il paraît. Une liste de quoi ?"
  - qui: ancien
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_malbec_complice)"
    texte: "Notre gardien aussi est parti à Halvenne. À ce train-là, Malbec va avoir toute l'équipe, et pour pas plus cher que nous."
  - qui: fan
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_malbec_brouille)"
    texte: "Malbec s'est plaint de vous à la Ligue. Au virage, on a voté à main levée. Meilleure nouvelle de la saison."
  - qui: fan
    sujet: match
    si: "flag(histoire_h6) && flag(h6_dembo_salue)"
    texte: "Dembo a salué votre tribune avant le virage, samedi. Au virage, on lui en veut pas. On lui a toujours tout passé."
  - qui: passant
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_dembo_evite)"
    texte: "Dembo est passé dans le couloir sans s'arrêter devant vous, à ce qu'on dit. Il s'arrête devant tout le monde, d'habitude."
  - qui: ancien
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_commission_temoin)"
    texte: "Paraît que vous avez témoigné devant Berthomier. Il a tout noté, de sa petite écriture. Et ses carnets, il les garde."
  - qui: passante
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_commission_accuse)"
    texte: "La Commission vous a fait venir, paraît-il. Ma voisine dit que ces affaires-là se règlent entre soi, à la Fédération, le mardi."
  - qui: commercant
    sujet: club
    si: "flag(histoire_h6) && flag(h6_loge_vente)"
    texte: "Le fils Vaubourg a signé pour Ilyas, il paraît. Mon livreur dit que le père a plus appelé le club depuis. Lui qui appelait tous les soirs."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h6) && flag(h6_loge_refus)"
    texte: "L'offre d'Ilyas dort dans un tiroir du club-house, à ce qu'on dit. Le tiroir du bas, celui qui ferme à clé."

  # ═══════════════════════════════════════════════════════ Madame Josiane
  - qui: josiane
    sujet: club
    si: "flag(histoire_h6) && flag(h6_photocopies)"
    texte: "J'ai ouvert un classeur pour vos fax de nuit. Le papier thermique jaunit déjà sur les bords. J'ai fait des photocopies, sur du papier ordinaire."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h6) && saison == 1"
    texte: "Le fax du recrutement a été branché en 1987, l'année où je suis arrivée. On ne l'a jamais débranché depuis, même la nuit."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tout_jete)"
    texte: "Vous m'avez demandé de tout jeter. C'est fait. Je fais toujours ce qu'on me demande, vous verrez."
  - qui: josiane
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_bureau_visite)"
    texte: "J'ai fait changer la combinaison du coffre par le serrurier. Je ne la connais pas. Comme ça, personne ne pourra me la demander."
  - qui: josiane
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_montres_coffre)"
    texte: "Deux écrins au coffre. Je les ai pesés sur la balance du courrier, par habitude. Cent quatre-vingts grammes chacun."
  - qui: josiane
    sujet: sombre
    si: "flag(histoire_h6) && tranche == soir"
    texte: "Je pars à dix-neuf heures. Le stagiaire reste toujours après moi. C'est lui qui éteint et qui ferme, et le matin il n'y a jamais rien qui traîne."
  - qui: josiane
    sujet: epoque
    si: "flag(histoire_h6) && saison >= 2"
    texte: "Le papier thermique, on n'en fera bientôt plus. Le fax de la Ligue imprime déjà sur du papier ordinaire. Le nôtre résiste."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_classeur_garde)"
    texte: "Le classeur, il est chez moi, sous un tricot. Mon mari croit que c'est mes lettres de jeunesse, il y touche pas."
  - qui: josiane
    sujet: match
    si: "flag(histoire_h6) && serie_v >= 1"
    texte: "On gagne, et le fax n'a rien sorti depuis trois nuits. Je vérifie quand même le rouleau, le matin."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tibo_vendu)"
    texte: "J'ai rangé la licence du petit Rancé dans le classeur des départs. Elle était dans celui des arrivées depuis ses dix ans."

  # ═══════════════════════════════════════════════════════ Lucien Barbier
  - qui: barbier
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_barbier_soupconne)"
    texte: "Le gaucher de Kerbrouck, je l'ai dicté au petit stagiaire, mot pour mot. Je lui dicte tout, et je relis jamais."
  - qui: barbier
    sujet: club
    si: "flag(histoire_h6) && saison == 1"
    texte: "Le petit Ferlac tape mes rapports, moi j'ai plus les yeux pour ça. Mais celui qui court et celui qui fait semblant, je les vois encore."
  - qui: barbier
    sujet: match
    si: "flag(histoire_h6) && serie_d >= 1"
    texte: "On perd parce qu'on vend les mauvais. Les bons aussi, remarque, mais en retard et moins cher."
  - qui: barbier
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "On m'a proposé un téléphone de poche. Pour quoi faire ? Les gamins, je vais les voir, je les appelle pas."
  - qui: barbier
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_indice_dicte)"
    texte: "Je l'entends taper, le soir, au secrétariat, quand je repasse prendre mon écharpe. Il tape vite. À cette heure-là, moi, je lui dicte rien."
  - qui: barbier
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_oeil_barbier)"
    texte: "Le gamin de Trébignac a mis un but à l'entraînement, du gauche, sans regarder. J'en ai parlé à personne. À toi, si."
  - qui: barbier
    sujet: club
    si: "flag(histoire_h6) && flag(h6_colonnes_ferlac)"
    texte: "Les colonnes ont gagné. Elles voient jamais la pluie, les colonnes. Moi, j'ai vu des gamins sous la pluie quarante ans."
  - qui: barbier
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_gaucher_achete)"
    texte: "Trois millions, le gaucher. En mai, j'avais dit un million et demi au petit qui tape, pas un sou de plus. Quelqu'un a doublé le chiffre."
  - qui: barbier
    sujet: sombre
    si: "flag(histoire_h6) && tranche == nuit"
    texte: "La nuit, je dors plus. Je refais la liste des gamins que j'ai pas vus jouer. Et de ceux que j'ai vus, et que d'autres ont vendus."
  - qui: barbier
    sujet: quartier
    si: "flag(histoire_h6) && lieu == centre"
    texte: "Y a une salle de classe au centre, maintenant. Ils apprennent à lire un contrat. Le terrain, ils le voient par la fenêtre."

  # ═══════════════════════════════════════════════════════ Joachim Ferlac
  - qui: ferlac
    sujet: toi
    si: "flag(histoire_h6)"
    texte: "Bonjour. Votre carnet est sur votre bureau, tapé au propre. J'ai corrigé deux fautes d'orthographe ; j'espère que vous ne m'en voudrez pas. Merci."
  - qui: ferlac
    sujet: club
    si: "flag(histoire_h6) && tranche == soir"
    texte: "Je reste encore un peu, il y a les rapports de Monsieur Barbier à mettre au propre. Bonne soirée. Merci."
  - qui: ferlac
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_tableur_adopte)"
    texte: "Le tableau tourne bien ? Si une colonne vous gêne, dites-le-moi. Je peux toujours la cacher."
  - qui: ferlac
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Dans dix ans, on ne recrutera plus sans ordinateur. Monsieur Barbier rit quand je dis ça. Il a raison de rire, pour l'instant."
  - qui: ferlac
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_bureau_visite)"
    texte: "J'ai trouvé la porte ouverte, ce matin-là. Je l'ai refermée, et je l'ai signalé dans le cahier de liaison, à sept heures douze."
  - qui: ferlac
    sujet: match
    si: "flag(histoire_h6) && serie_v >= 1"
    texte: "Trois victoires. Statistiquement, ça ne veut rien dire. Mais c'est agréable, je vous l'accorde."
  - qui: ferlac
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_merci_note)"
    texte: "Ma mère disait toujours merci deux fois. Ça m'est resté. On me le reproche, parfois, gentiment."
  - qui: ferlac
    sujet: quartier
    si: "flag(histoire_h6) && lieu == gareRoutiere"
    texte: "Je prends le car du dimanche soir, le dernier. Il part à vingt-trois heures. On est rarement plus de deux."
  - qui: ferlac
    sujet: club
    si: "flag(histoire_h6) && flag(h6_classeur_garde)"
    texte: "Madame Josiane ne veut pas me confier les archives. Elle a raison, je suppose. Je suis nouveau, ici."
  - qui: ferlac
    sujet: sombre
    si: "flag(histoire_h6) && saison == 3 && tranche == nuit"
    texte: "Vous travaillez tard, vous aussi. On finit par se croiser dans l'escalier. Bonne nuit, et merci."

  # ═══════════════════════════════════════════════════════ Dembo
  - qui: dembo
    sujet: toi
    si: "flag(histoire_h6) && !flag(h6_dembo_vendu)"
    texte: "Vingt ans qu'on se connaît. Et tu me regardes comme un contrat. Fais-moi rire, une fois. Avant de me vendre."
  - qui: dembo
    sujet: match
    si: "flag(histoire_h6) && !flag(h6_dembo_vendu) && serie_v >= 1"
    texte: "Marqué samedi. Dormi dimanche. Samedi, je remets ça."
  - qui: dembo
    sujet: club
    si: "flag(histoire_h6) && flag(h6_dembo_promis) && !flag(h6_dembo_vendu)"
    texte: "Halvenne, tout le monde est au courant. Sauf moi. Même la boulangère te couvre."
  - qui: dembo
    sujet: epoque
    si: "flag(histoire_h6) && !flag(h6_dembo_vendu)"
    texte: "Les jeunes, leur téléphone sonne en chanson. Le mien sonne normal. Personne m'appelle."
  - qui: dembo
    sujet: argent
    si: "flag(histoire_h6) && !flag(h6_dembo_vendu)"
    texte: "Six millions pour moi ? À trente-sept ans ? Quelqu'un se paie sur mon dos."
  - qui: dembo
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_dembo_reste)"
    texte: "Tu m'as gardé. Maintenant je dois marquer, sinon c'est toi qu'on vend."
  - qui: dembo
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_dembo_prevenu) && !flag(h6_dembo_vendu)"
    texte: "Merci. Avant le journal, au moins. Le journal, lui, m'a rien dit."
  - qui: dembo
    sujet: sombre
    si: "flag(histoire_h6) && tranche == nuit && !flag(h6_dembo_vendu)"
    texte: "La veille des matchs, je dors pas. Je dors après. Toi, tu dors jamais. Ça se voit."
  - qui: dembo
    sujet: quartier
    si: "flag(histoire_h6) && lieu == buvette && !flag(h6_dembo_vendu)"
    texte: "À la buvette, on m'offre des bières. Je les bois pas. Je les file au gamin du comptoir. Il est majeur, je crois."
  - qui: dembo
    sujet: club
    si: "flag(histoire_h6) && flag(h6_montre_dembo) && !flag(h6_dembo_vendu)"
    texte: "T'as encore ma montre ? Garde-la. Elle retarde de trois minutes. Comme moi."

  # ═══════════════════════════════════════════════════════ Tibo Rancé
  - qui: tibo_rance
    sujet: toi
    si: "flag(histoire_h6) && saison == 2 && !flag(h6_tibo_vendu)"
    texte: "Mon père dit qu'il y a un club à l'étranger. Moi, je sais même pas où c'est. Vous savez, vous ?"
  - qui: tibo_rance
    sujet: match
    si: "flag(histoire_h6) && !flag(h6_tibo_vendu) && serie_v >= 1"
    texte: "Vukić m'a fait entrer dix minutes, samedi. Trois ballons touchés, un perdu. Mon père, il parle que des trois."
  - qui: tibo_rance
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tibo_conseil_rester) && !flag(h6_tibo_vendu)"
    texte: "Vous m'avez dit de rien signer. J'ai rien signé. Mon père me parle plus, le matin."
  - qui: tibo_rance
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tibo_conseil_partir) && !flag(h6_tibo_vendu)"
    texte: "Vous m'avez dit que c'était ma chance. Je sais pas encore dans quel sens la prendre."
  - qui: tibo_rance
    sujet: quartier
    si: "flag(histoire_h6) && lieu == centre && !flag(h6_tibo_vendu)"
    texte: "La salle de classe sent la peinture. Le prof d'anglais dit que si je pars, faudra au moins que je sache dire contrat."
  - qui: tibo_rance
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_tibo_garde)"
    texte: "Je reste. Je sais pas qui a payé pour ça, mais je reste."
  - qui: tibo_rance
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_pere_joue) && !flag(h6_tibo_vendu)"
    texte: "Mon père rentre à quatre heures, les poches vides. Il me dit bonne nuit en partant au travail."
  - qui: tibo_rance
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_carte_jf) && !flag(h6_tibo_vendu)"
    texte: "Mon père garde une carte de visite blanche dans son portefeuille. Il la regarde plus souvent que ma photo."

  # ═══════════════════════════════════════════════════════ Bertrand Rancé
  - qui: bertrand_rance
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_pere_rance)"
    texte: "Au Terminus, les parties, on les note pas. Ce qu'on note, c'est l'ardoise. Mon nom y est en haut, à la craie."
  - qui: bertrand_rance
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_ardoise_payee)"
    texte: "Vous avez payé mon ardoise. Ça fait que je vous dois quelque chose. Je vous le rendrai, d'une façon ou d'une autre."
  - qui: bertrand_rance
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_pere_joue)"
    texte: "Quatre millions pour mon fils, et moi je dois de quoi acheter une camionnette. Le monde est bien fait, hein ?"
  - qui: bertrand_rance
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tibo_vendu)"
    texte: "Mon fils m'appelle le dimanche, de là-bas. Il dit que tout va bien. Il le dit trop vite."
  - qui: bertrand_rance
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_pere_chasse)"
    texte: "Je cherche un JF. J'ai demandé au Terminus, à la gare routière, au tabac. Personne s'appelle comme ça, ici, il paraît. Et ils sont tous très polis."
  - qui: bertrand_rance
    sujet: quartier
    si: "flag(histoire_h6) && lieu == terminus"
    texte: "Le patron du Terminus a une ardoise pour chacun. La mienne est la plus longue. Elle a son clou à elle."
  - qui: bertrand_rance
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_pere_police)"
    texte: "La police, je veux bien. Mais la police, elle joue pas aux cartes avec moi. Les autres, si."
  - qui: bertrand_rance
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_pere_honte)"
    texte: "L'autre soir, vous regardiez vos chaussures. Moi aussi. On devrait monter un club, tous les deux."

  # ═══════════════════════════════════════════════════════ Madame Vialat
  - qui: vialat
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_vialat_franche)"
    texte: "Vous ne connaissez pas vos intermédiaires. Depuis 1989, personne dans un club ne me l'avait avoué."
  - qui: vialat
    sujet: club
    si: "flag(histoire_h6) && saison >= 2"
    texte: "Je repasse vendredi. En fin de semaine, les soldes tombent juste plus souvent, allez savoir pourquoi."
  - qui: vialat
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_vialat_sait)"
    texte: "23 h 58, à chaque fois, à la minute près. J'appelle ça une signature."
  - qui: vialat
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Les écus m'ont fait refaire tous les bilans à la main. Les montants ont changé de nom. Certains ont aussi changé de compte."
  - qui: vialat
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_vialat_mefiante)"
    texte: "Vous m'avez dit « agents ». J'ai gommé les guillemets. Il reste le mot, au crayon, dans la marge de la page quatre."
  - qui: vialat
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_audit_parle)"
    texte: "La saisie est un inventaire. Les sanctions viendront après, et d'un autre bureau que le mien."
  - qui: vialat
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_primes_mutuelle)"
    texte: "La Mutuelle des Quais rembourse mal les lunettes. Aux directions sportives, elle vire dans la semaine. Les deux sont dans mon rapport."
  - qui: vialat
    sujet: quartier
    si: "flag(histoire_h6) && lieu == banque"
    texte: "La Banque Aubérivoise ferme à dix-sept heures. Les virements de la Mutuelle partent à vingt-trois heures cinquante. Je cherche qui appuie sur le bouton."

  # ═══════════════════════════════════════════════════════ Rocco Fardelli
  - qui: fardelli
    sujet: toi
    si: "flag(histoire_h6)"
    texte: "On se connaît depuis 1999. La table, tu te rappelles ? Moi, je me rappelle toutes les tables."
  - qui: fardelli
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_montre_acier)"
    texte: "Elle te va bien, la montre. Remonte-la pas trop. C'est pas pour toi qu'elle donne l'heure."
  - qui: fardelli
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_fardelli_soupconne)"
    texte: "Tu me soupçonnes encore ? Bon. Pendant que tu me regardes, regarde un peu ceux qui me ressemblent pas."
  - qui: fardelli
    sujet: club
    si: "flag(histoire_h6) && flag(h6_dembo_vendu)"
    texte: "Dembo à Halvenne, j'y suis pour rien, pour une fois. Malbec m'a même pas appelé."
  - qui: fardelli
    sujet: sponsor
    si: "flag(histoire_h6) && flag(h6_primes_mutuelle)"
    texte: "La Mutuelle des Quais ? Je travaille pas avec eux. Moi, je travaille avec des gens qui ont un nom."
  - qui: fardelli
    sujet: match
    si: "flag(histoire_h6) && serie_d >= 1"
    texte: "Tu perds, tes joueurs valent moins, et moi on m'appelle plus. Tu veux savoir qui a téléphoné ce matin ?"
  - qui: fardelli
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Les jeunes agents, ils ont des ordinateurs portables. Moi, j'ai ma gourmette et mon carnet. Le carnet, il tombe jamais en panne."
  - qui: fardelli
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_rideau_vu)"
    texte: "Paraît que t'as frappé à la porte sans poignée. Là-dedans, ils oublient pas une figure. Ils les classent par année."

  # ═══════════════════════════════════════════════════════ Arnaud Vaubourg
  - qui: arnaud_vaubourg
    sujet: toi
    si: "flag(histoire_h6) && saison == 1"
    texte: "Mon père a choisi votre nom sur une liste. On m'a laissé la peinture du bureau. Vous aimez le vert ?"
  - qui: arnaud_vaubourg
    sujet: club
    si: "flag(histoire_h6)"
    texte: "Mon père appelle à 23 h 47, toujours. Jamais à 23 h 58, j'ai vérifié. Je vérifie tout, maintenant."
  - qui: arnaud_vaubourg
    sujet: sponsor
    si: "flag(histoire_h6) && flag(h6_mutuelle_ecoute)"
    texte: "La Mutuelle des Quais nous vient de la Ligue. De mon père, donc. Moi, je n'ai fait que tenir le stylo."
  - qui: arnaud_vaubourg
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_arnaud_soupconne)"
    texte: "Vous me soupçonnez. Mon père aussi, depuis que je suis né. Il vous dira par où commencer."
  - qui: arnaud_vaubourg
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_audit_parle)"
    texte: "Je ne savais pas. C'est ce que j'ai dit à la Commission, et c'était vrai. Madame Vialat l'a écrit sans lever son crayon."
  - qui: arnaud_vaubourg
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_photo_tiroir)"
    texte: "La photo est toujours dans mon tiroir. Je ne la regarde plus. Enfin, presque plus."
  - qui: arnaud_vaubourg
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Mon père a eu un téléphone de voiture dès 1991. Il me l'a donné quand il en a eu un plus petit. Je reçois encore ses vieux appels."
  - qui: arnaud_vaubourg
    sujet: club
    si: "flag(histoire_h6) && flag(h6_loge_vente)"
    texte: "J'ai signé l'offre d'Ilyas. Seul. Mon père ne m'a pas rappelé depuis."

  # ═══════════════════════════════════════════════════════ Zoran Vukić
  - qui: vukic
    sujet: club
    si: "flag(histoire_h6) && saison >= 2"
    texte: "La casquette de Vogler, au vestiaire. Les joueurs la touchent en sortant. Moi, non."
  - qui: vukic
    sujet: match
    si: "flag(histoire_h6) && serie_d >= 1"
    texte: "On joue avec ce qui reste. Dix-neuf ans de moyenne. Ils regardent le banc avant de faire la passe."
  - qui: vukic
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_indice_escalier)"
    texte: "Ce soir encore, onze heures et quatre minutes. Il descend sans allumer. Il connaît les marches par cœur."
  - qui: vukic
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_vukic_sait)"
    texte: "« Pour quelqu'un d'autre », vous m'avez dit. J'ai rien répété. À personne."
  - qui: vukic
    sujet: epoque
    si: "flag(histoire_h6) && annee >= 2005"
    texte: "Les gamins me tutoient. Je laisse faire. Le stagiaire, lui, c'est « monsieur l'entraîneur ». Trente ans de football, jamais entendu ça."
  - qui: vukic
    sujet: club
    si: "flag(histoire_h6) && saison == 1"
    texte: "Vogler court partout. Moi, je regarde. À nous deux, on fait presque un entraîneur."

  # ═══════════════════════════════════════════════════════ Pierre Massenet
  - qui: meneche
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_verite_dimanche)"
    texte: "Dimanche, à l'antenne, je dis que vos prix sont bas. Lundi, j'aurai un coup de fil pour m'expliquer pourquoi. J'en ai toujours un."
  - qui: meneche
    sujet: toi
    si: "flag(histoire_h6)"
    texte: "À la télé, j'ai quatre minutes. J'en passe trois à ne pas dire ce que je sais."
  - qui: meneche
    sujet: club
    si: "flag(histoire_h6) && flag(h6_merci_massenet)"
    texte: "La page MERCI, elle est dans ma boîte à gants, sous la carte routière. On jette pas un merci, même pas signé."
  - qui: meneche
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_dembo_prix_fax)"
    texte: "Six millions pour Dembo. J'avais le chiffre avant vous, au téléphone, d'une voix très polie."
  - qui: meneche
    sujet: sombre
    si: "flag(histoire_h6) && lieu == voiture"
    texte: "Montez pas, je baisse la vitre à moitié. On s'entend très bien comme ça, et le siège reste sec."

  # ═══════════════════════════════════════════════════════ Léa
  - qui: lea
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_verite_dimanche)"
    texte: "Votre nom et le sien dans le même article. Le vôtre en second, parce que c'est l'ordre des faits."
  - qui: lea
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_lea_page)"
    texte: "Deux pages blanches à la même minute, chez vous et chez nous. J'ai mis la nôtre sous plastique. Elle blanchit quand même."
  - qui: lea
    sujet: club
    si: "flag(histoire_h6) && flag(h6_lea_attend)"
    texte: "J'attends le second nom. J'ai une source. Il m'en faut une deuxième."
  - qui: lea
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Le journal a un site, maintenant. Personne le lit. On y met les résultats avant le papier, pour s'entraîner."
  - qui: lea
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_lea_publie)"
    texte: "J'ai publié votre photo. Le négatif est dans mon tiroir. Je le ressors un soir sur deux. L'autre, je cherche le second nom."

  # ═══════════════════════════════════════════════════════ les autres visages
  - qui: solvang
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_solvang_lu)"
    texte: "Votre page trois, je l'ai encore en tête. Vous contresignez les commissions des autres. C'est pour ça qu'on a pensé à vous."
  - qui: solvang
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_indice_pas_agent)"
    texte: "Un agent signe. Votre corbeau tape. Ce n'est pas la même main."
  - qui: solvang
    sujet: club
    si: "flag(histoire_h6) && flag(h6_solvang_adverse)"
    texte: "Vous m'avez dit « rien ». C'est un prix comme un autre ; je l'ai noté sur ma liste."
  - qui: solvang
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Les joueurs libres, c'est l'avenir. Plus d'indemnités, plus de clubs propriétaires. Rien que des contrats, et des gens qui les lisent."
  - qui: nassir
    sujet: sponsor
    si: "flag(histoire_h6) && flag(h6_canette_signee)"
    texte: "Orange sur bordeaux. Les puristes détestent. Les puristes achètent le maillot, ensuite."
  - qui: nassir
    sujet: argent
    si: "flag(histoire_h6)"
    texte: "Votre club vaut le montant de ses dettes. Le reste est de la décoration. Je la paie à part."
  - qui: nassir
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_loge_messager)"
    texte: "Le fils signera. Son père est à la Ligue tous les mardis."
  - qui: malbec
    sujet: club
    si: "flag(histoire_h6) && flag(h6_dembo_vendu)"
    texte: "Dembo marque encore pour Halvenne. Il dort tard ; je le paie pour ça aussi."
  - qui: malbec
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_carte_malbec)"
    texte: "Gardez la carte. Je ne sais même plus qui me l'a donnée. Elle n'a pas d'adresse, de toute façon."
  - qui: malbec
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_malbec_brouille)"
    texte: "Je me suis plaint de vous à la Ligue. Le père Vaubourg m'a écouté poliment, en regardant sa montre."
  - qui: klopf
    sujet: toi
    si: "flag(histoire_h6) && saison == 1"
    texte: "Il me faut mon gaucher avant la Toussaint. Après, mes ailiers, je réponds plus de rien."
  - qui: klopf
    sujet: match
    si: "flag(histoire_h6) && saison == 1 && serie_v >= 1"
    texte: "Vous avez vu le deuxième but ? Douze passes, personne a gardé le ballon. Vendez personne d'ici samedi."
  - qui: klopf
    sujet: club
    si: "flag(histoire_h6) && flag(h6_klopf_sans_gauche)"
    texte: "Mon droitier joue à gauche. Je souris, vous voyez ? J'ai plus rien à vous demander."
  - qui: klopf
    sujet: rumeur
    si: "flag(histoire_h6) && saison == 1"
    texte: "On me parle de la Vestrie. Une sélection, un pays, des casquettes. J'ai pas encore dit non."
  - qui: sabatier
    sujet: toi
    si: "flag(histoire_h6)"
    texte: "Vous dormez quatre heures par nuit. Je le vois à vos mains, quand vous tenez la tasse."
  - qui: sabatier
    sujet: club
    si: "flag(histoire_h6) && flag(h6_doc_refuse)"
    texte: "Le milieu au ménisque est resté. Il boite encore. Six semaines, si on ne le fait pas rejouer avant."

# Où l'on croise les visages du livre (s'ils sont de la distribution ou déjà
# rencontrés), et où leurs cartes les attendent quand elles ne disent pas de lieu.
presences:
  - {qui: ferlac, lieu: clubhouse, tranches: [matin, aprem, soir]}
  - {qui: barbier, lieu: centre, tranches: [matin, aprem]}
  - {qui: tibo_rance, lieu: centre, tranches: [aprem]}
  - {qui: bertrand_rance, lieu: terminus, tranches: [soir]}
  - {qui: arnaud_vaubourg, lieu: clubhouse, tranches: [matin, midi]}
  - {qui: vialat, lieu: banque, tranches: [matin]}
  - {qui: dembo, lieu: terrain, tranches: [matin]}
  - {qui: klopf, lieu: terrain, tranches: [matin, aprem]}
  - {qui: solvang, lieu: hotel, tranches: [midi]}
  - {qui: malbec, lieu: hotel, tranches: [midi]}

rencontres:
  ferlac: clubhouse
  barbier: centre
  tibo_rance: centre
  bertrand_rance: terminus
  arnaud_vaubourg: clubhouse
  vialat: clubhouse
  dembo: terrain
  klopf: terrain
  solvang: hotel
  malbec: hotel

# Ce qu'on voit en entrant, pendant le livre (la première vraie l'emporte).
lieux_variantes:
  - {lieu: clubhouse, si: "flag(histoire_h6) && flag(h6_faux_nom)", texte: "Le club-house, tard. Sous l'escalier, la porte de la vieille buanderie, que personne n'ouvre depuis 1987. Ce soir, un rai de lumière passe dessous."}
  - {lieu: club_prive, si: "flag(histoire_h6) && flag(h6_negatifs_offerts)", texte: "Le Rideau Rouge, la porte sans poignée, le velours derrière. Un carton noir dépasse de la boîte aux lettres. Pas d'adresse, pas de timbre."}
  - {lieu: tripot, si: "flag(histoire_h6) && flag(h6_pere_rance)", texte: "L'arrière-salle du Terminus. Au mur, les ardoises des habitués, chacune à son clou. La plus longue porte un nom à la craie : RANCÉ."}
  - {lieu: centre, si: "flag(histoire_h6) && flag(h6_tibo_vendu)", texte: "Le centre de formation. Sur le tableau des effectifs, une étiquette arrachée laisse une trace plus claire, à la lettre R."}
  - {lieu: agence, si: "flag(histoire_h6)", texte: "Immobilier Tessandier. Dans la vitrine, la maquette des Terrasses de la Rive : la première tranche est bâtie, la seconde est un terrain vague à moitié parking."}
