# Histoire 6 — « 23 h 58 » : ce que dit la ville pendant le livre (2003-2006).
# Une réplique ne fait pas avancer l'intrigue : elle prouve qu'elle avance.
# Toutes lisent le drapeau d'histoire. Le protagoniste peut être une femme :
# aucun accord, aucune adresse genrée. `saison` vaut 1 pour 2003-2004.
# Aucun personnage ne dit sa phrase-signature (content/characters.yaml `tic`),
# ni ne la détourne.
paroles:
  # ═══════════════════════════════════════════════════════ la rue, les gens
  - qui: passant
    sujet: toi
    si: "flag(histoire_h6) && saison == 1"
    texte: "Au recrutement, maintenant, c'est vous ? Ma fille dit qu'on n'avait jamais vu ça ici. Moi je dis qu'on verra au mercato."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h6) && annee >= 2004"
    texte: "Le fax, bientôt, ce sera fini, dit mon neveu. On enverra tout par l'ordinateur. Comme si les mauvaises nouvelles devaient aller plus vite."
  - qui: fan
    sujet: club
    si: "flag(histoire_h6) && flag(h6_dembo_vendu)"
    texte: "Dembo à Valentienne, à trente-sept ans. Vous auriez pu le laisser finir ici. On l'aurait porté jusqu'à la buvette."
  - qui: commercant
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_barbier_soupconne)"
    texte: "Mon fax public ferme à dix-neuf heures. Personne n'envoie rien d'ici à minuit. Il est sous clé, je vous dis, la clé est dans ma poche."
  - qui: enfant
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_tibo_vendu)"
    texte: "Tibo Rancé, il est parti où ? Il m'avait promis un maillot. Il n'a pas eu le temps, je crois."
  - qui: passante
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_voiture_photo)"
    texte: "Il y avait un homme dans une voiture devant chez vous, cette nuit, avec un appareil. Il a pris votre porte. Rien que la porte."
  - qui: commercant
    sujet: argent
    si: "flag(histoire_h6) && saison == 2 && phase == retour"
    texte: "Au tabac du Quai, on parie sur vos ventes, maintenant, plus sur les matchs. Le petit Rancé parti avant l'été, c'est à trois contre un."
  - qui: fan
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_pere_rance) && flag(h6_tibo_vendu)"
    texte: "Le père Rancé joue au Terminus tous les soirs depuis que son fils a signé. Il gagne, pour une fois. Ça ne lui va pas."
  - qui: passant
    sujet: quartier
    si: "flag(histoire_h6) && possede(residence_rive)"
    texte: "De la résidence, on voit le terrain de la seconde tranche. Ils disaient un parc. C'est toujours un parking, à moitié."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h6) && flag(h6_indice_escalier)"
    texte: "Le petit stagiaire qui salue tout le monde ? Il descend au sous-sol tous les soirs, vers onze heures. Le gardien croit qu'il fume. Il ne sent pas la cigarette."
  - qui: passante
    sujet: toi
    si: "flag(histoire_h6) && tranche == nuit"
    texte: "Vous rentrez tard, vous aussi. Moi, c'est l'hôpital. Vous, c'est quoi, qui ne dort pas la nuit ?"
  - qui: passant
    sujet: match
    si: "flag(histoire_h6) && serie_d >= 1"
    texte: "On perd, et vous vendez. Ou on perd parce que vous vendez ? Je pose la question, c'est tout."
  - qui: fan
    sujet: classement
    si: "flag(histoire_h6) && journee >= 12 && rang >= 15"
    texte: "{rang}, avec l'équipe que vous nous laissez. Le virage vous en veut moins qu'au président ; ça ne durera pas."
  - qui: fan
    sujet: classement
    si: "flag(histoire_h6) && journee >= 12 && rang <= 6"
    texte: "{rang} ! Même avec les ventes. Je ne sais pas comment vous faites, et surtout, ne nous le dites pas."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Les écus, je les recompte encore en francs dans ma tête. Vos millions, je les multiplie par six et demi, et j'ai le vertige."
  - qui: commercant
    sujet: achat
    si: "flag(histoire_h6) && possede(montre_acier)"
    texte: "Elle sort de chez moi, cette montre de plongée, le numéro est gravé au dos. Ce n'est pas vous qui l'avez achetée, je m'en souviendrais."
  - qui: passant
    sujet: sponsor
    si: "flag(histoire_h6) && flag(h6_canette_signee)"
    texte: "La canette orange sur la manche, franchement. Mon fils a acheté le maillot quand même. Il le porte à l'envers."
  - qui: passante
    sujet: sponsor
    si: "flag(histoire_h6) && flag(h6_primes_mutuelle)"
    texte: "La Mutuelle des Quais m'a refusé un remboursement de lunettes. Mais pour le foot, il paraît qu'ils paient en liquide."
  - qui: enfant
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tibo_garde)"
    texte: "Tibo Rancé m'a signé ma chaussure, au centre. Il a dit qu'il restait. Vous lui avez dit quoi, pour qu'il reste ?"
  - qui: ancien
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_rideau_vu)"
    texte: "On vous a vu sortir du Rideau Rouge, l'autre soir. Moi, je n'ai rien vu. À mon âge, on ne voit que ce qu'on veut bien."
  - qui: commercant
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_verite_dimanche)"
    texte: "Depuis que Massenet a dit « fax » à la télé, je vends des rouleaux de papier thermique comme des billets de loto."
  - qui: passant
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_pere_photo)"
    texte: "Votre père, aux Glycines, montre une photo de vous à tout le monde, au réfectoire. Il dit que c'était avant le football."
  - qui: fan
    sujet: match
    si: "flag(histoire_h6) && flag(h6_klopf_gauche)"
    texte: "Le gaucher que vous avez fait venir ne regarde jamais son pied. Vogler le regardait comme un fils."
  - qui: passante
    sujet: toi
    si: "flag(histoire_h6) && saison == 3"
    texte: "Trois ans que vous êtes là, et toujours pas de voiture de sport. Ici, ça rassure ou ça inquiète, selon les jours."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h6) && saison == 3"
    texte: "Barbier ne vient plus au centre ; il va à Trébignac regarder les poussins. Il dit que c'est plus honnête, le district."
  - qui: passant
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_audit_parle)"
    texte: "La Commission a scellé des cartons au club-house. Mon beau-frère était au parking. Il dit que les cartons avaient l'air légers."
  - qui: commercant
    sujet: achat
    si: "flag(histoire_h6) && possede(citadine)"
    texte: "La petite citadine, c'est la vôtre ? Une institutrice l'avait avant. Elle disait déjà qu'elle démarrait en janvier."
  - qui: fan
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_lea_publie)"
    texte: "La photo dans L'Écho, en 1999. On ne vous reconnaît pas. Ou si : on vous reconnaît trop bien."
  - qui: passante
    sujet: quartier
    si: "flag(histoire_h6) && lieu == laverie"
    texte: "La laverie du club a fermé en 1987, vous saviez ? Les maillots, depuis, c'est nous. Mais la buanderie du club-house, personne ne l'a vidée."
  - qui: ancien
    sujet: sombre
    si: "flag(histoire_h6) && tranche == nuit && lieu == clubhouse"
    texte: "Il y a de la lumière au sous-sol du club-house, certains soirs. La buanderie. Depuis 1987, pourtant, il n'y a plus de linge."
  - qui: passant
    sujet: club
    si: "flag(histoire_h6) && flag(h6_solvang_alliee)"
    texte: "Une agente qui écrit une clause pour le club d'en face, j'aurai tout vu. Remarquez, elle avait l'air de savoir ce qu'elle faisait."
  - qui: fan
    sujet: club
    si: "flag(histoire_h6) && flag(h6_solvang_adverse)"
    texte: "Vogler parti en Vestrie sans un écu pour le club. Son agente a fait jouer une clause, paraît-il. Une clause, ça court plus vite que lui."
  - qui: passante
    sujet: club
    si: "flag(histoire_h6) && flag(h6_canette_courte)"
    texte: "L'orange sur la manche, c'est fini l'an prochain, il paraît. Mon mari dit que c'est dommage : on la voyait de loin, au moins."
  - qui: ancien
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_mutuelle_refusee)"
    texte: "On dit que vous avez renvoyé une enveloppe de la Mutuelle sans l'ouvrir. À Aubérive, ça fait plus parler qu'une enveloppe ouverte."
  - qui: fan
    sujet: match
    si: "flag(histoire_h6) && flag(h6_klopf_sans_gauche)"
    texte: "Le droitier qui joue à gauche regarde son pied à chaque ballon. Au virage, on compte avec lui. On en est à quarante par match."
  - qui: commercant
    sujet: achat
    si: "flag(histoire_h6) && flag(h6_montres_gardees)"
    texte: "Deux montres de plongée sorties de chez moi, au même nom, la même saison. Je ne demande rien. Je les répare, si elles s'arrêtent."
  - qui: passant
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_montres_rendues)"
    texte: "Le coursier de Fardelli est repassé trois fois au club-house avec le même paquet. Il dit qu'il commence à le trouver lourd."
  - qui: passante
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_massenet_muet)"
    texte: "Le fauteuil vide à la télé, dimanche, c'était pour vous ? Ma mère a cru à une panne. Elle a tapé sur le poste."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h6) && flag(h6_doc_refuse)"
    texte: "Le milieu au genou, il boite encore, mais il boite chez nous. Le Doc l'a gardé. Ça, c'est un médecin."
  - qui: fan
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_doc_signe)"
    texte: "Le milieu qu'on a vendu cet hiver ne jouera pas avant l'été, là-bas. Ici, on savait qu'il boitait. Là-bas, ils l'apprennent."
  - qui: enfant
    sujet: club
    si: "flag(histoire_h6) && flag(h6_oeil_barbier)"
    texte: "Il y a un nouveau au centre, il vient de Trébignac. Il ne parle pas, il garde la tête haute, même quand il pleut. On l'appelle le phare."
  - qui: passant
    sujet: club
    si: "flag(histoire_h6) && flag(h6_colonnes_ferlac)"
    texte: "Le gamin de Trébignac a signé chez les autres. Il paraît qu'un tableau a dit non. Un tableau, je vous demande un peu."
  - qui: passante
    sujet: club
    si: "flag(histoire_h6) && flag(h6_arnaud_allie)"
    texte: "Le fils Vaubourg a débranché son fax, paraît-il, pour prouver je ne sais quoi. Mon fils fait pareil avec le téléphone quand il boude."
  - qui: ancien
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_arnaud_soupconne)"
    texte: "Le fils Vaubourg soupçonné par sa propre direction sportive, c'est nouveau. Par son père, ça, c'est depuis toujours."
  - qui: commercant
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_lea_attend)"
    texte: "La petite de L'Écho a un mur couvert de papiers épinglés, à la rédaction. Elle a mis un drap dessus quand je suis entré livrer."
  - qui: fan
    sujet: match
    si: "flag(histoire_h6) && flag(h6_vukic_soutenu)"
    texte: "Le nouveau milieu court pour deux. Vukić l'a eu, finalement. Il ne sourit pas plus, mais il crie moins."
  - qui: passant
    sujet: match
    si: "flag(histoire_h6) && flag(h6_vukic_lache)"
    texte: "Vukić joue avec des gamins et un gaucher que personne n'a vu venir. Il a punaisé une liste dans son bureau, il paraît. La liste de quoi ?"
  - qui: ancien
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_malbec_complice)"
    texte: "Notre gardien est parti à Valentienne, lui aussi. Malbec finira par avoir notre équipe entière, sans payer plus cher que nous."
  - qui: fan
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_malbec_brouille)"
    texte: "Malbec s'est plaint de vous à la Ligue. Au virage, on a voté : c'est la meilleure nouvelle de la saison."
  - qui: fan
    sujet: match
    si: "flag(histoire_h6) && flag(h6_dembo_salue)"
    texte: "Dembo a salué votre tribune avant le virage, samedi. Le virage ne lui en veut pas. Le virage, il lui pardonne tout."
  - qui: passant
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_dembo_evite)"
    texte: "Dembo est passé dans le couloir sans s'arrêter devant vous, à ce qu'on dit. Il s'arrête devant tout le monde, d'habitude."
  - qui: ancien
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_commission_temoin)"
    texte: "On dit que vous avez témoigné devant Berthomier. Il a tout noté, de sa petite écriture. Ce qu'il note, il ne l'oublie pas."
  - qui: passante
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_commission_accuse)"
    texte: "La Commission vous a fait venir, paraît-il. Ma voisine dit que ces affaires-là se règlent entre soi, à la Fédération, le mardi."
  - qui: commercant
    sujet: club
    si: "flag(histoire_h6) && flag(h6_loge_vente)"
    texte: "Le fils Vaubourg a signé pour Ilyas, il paraît. Mon livreur dit que le père n'a plus appelé le club depuis. Le silence, chez eux, ça fait du bruit."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h6) && flag(h6_loge_refus)"
    texte: "L'offre d'Ilyas dort dans un tiroir du club-house. Dans ce club, les tiroirs ont plus de mémoire que les présidents."

  # ═══════════════════════════════════════════════════════ Madame Josiane
  - qui: josiane
    sujet: club
    si: "flag(histoire_h6) && flag(h6_photocopies)"
    texte: "J'ai un classeur pour vos fax de nuit. Le papier jaunit déjà sur les bords. La photocopie tiendra plus longtemps que nous."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h6) && saison == 1"
    texte: "Le fax du recrutement a été branché en 1987, l'année de mon arrivée. Il n'a jamais été débranché. Moi non plus."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tout_jete)"
    texte: "Vous m'avez demandé de tout jeter. J'ai jeté. Je suis quelqu'un d'obéissant, vous verrez."
  - qui: josiane
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_bureau_visite)"
    texte: "J'ai changé la combinaison du coffre. Je ne la connais pas, je l'ai fait exprès. On ne pourra pas me la demander."
  - qui: josiane
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_montres_coffre)"
    texte: "Deux écrins au coffre. Je les ai pesés, par habitude. Une montre de plongée, ça pèse plus lourd qu'une promesse."
  - qui: josiane
    sujet: sombre
    si: "flag(histoire_h6) && tranche == soir"
    texte: "Je pars à dix-neuf heures. Le stagiaire reste toujours après moi. Il éteint, il ferme, il ne laisse jamais rien traîner."
  - qui: josiane
    sujet: epoque
    si: "flag(histoire_h6) && saison >= 2"
    texte: "Le papier thermique, on n'en fera bientôt plus. Le fax de la Ligue imprime déjà sur du papier ordinaire. Le nôtre résiste."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_classeur_garde)"
    texte: "Le classeur dort chez moi, sous un tricot. Mon mari croit que c'est mon courrier de jeunesse. Je le laisse croire."
  - qui: josiane
    sujet: match
    si: "flag(histoire_h6) && serie_v >= 1"
    texte: "On gagne. Le fax, lui, n'a rien envoyé depuis trois nuits. Je ne sais pas si c'est bon signe."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tibo_vendu)"
    texte: "J'ai rangé la licence du petit Rancé dans le classeur des départs. Elle était dans celui des arrivées depuis ses dix ans."

  # ═══════════════════════════════════════════════════════ Lucien Barbier
  - qui: barbier
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_barbier_soupconne)"
    texte: "Le gaucher de Kerbrouck, je l'ai dicté au petit stagiaire, mot pour mot. Je lui dicte tout. Je ne relis jamais."
  - qui: barbier
    sujet: club
    si: "flag(histoire_h6) && saison == 1"
    texte: "Le petit Ferlac tape mes rapports. Moi, je n'ai plus les yeux. Mais je vois encore qui court et qui fait semblant."
  - qui: barbier
    sujet: match
    si: "flag(histoire_h6) && serie_d >= 1"
    texte: "On perd parce qu'on vend les mauvais. Les bons, on les vend aussi, mais plus tard, et moins cher."
  - qui: barbier
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "On m'a proposé un téléphone de poche. Pour quoi faire ? Les gamins, je vais les voir, je ne les appelle pas."
  - qui: barbier
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_indice_dicte)"
    texte: "Je l'entends taper le soir, au secrétariat, quand je repasse prendre mon écharpe. Il tape vite. Je ne lui dicte rien, à cette heure-là."
  - qui: barbier
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_oeil_barbier)"
    texte: "Le gamin de Trébignac a mis un but à l'entraînement, du gauche, sans regarder. Je n'ai rien dit à personne. Toi, je te le dis."
  - qui: barbier
    sujet: club
    si: "flag(histoire_h6) && flag(h6_colonnes_ferlac)"
    texte: "Les colonnes ont gagné. Elles gagnent toujours au sec. Moi, je n'ai jamais vu un match au sec."
  - qui: barbier
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_gaucher_achete)"
    texte: "Trois millions, le gaucher. En mai, j'avais écrit un million et demi, et rien d'autre. Quelqu'un a doublé ma phrase."
  - qui: barbier
    sujet: sombre
    si: "flag(histoire_h6) && tranche == nuit"
    texte: "La nuit, je ne dors plus. Je pense aux gamins que je n'ai pas vus. Et à ceux que j'ai vus, et que d'autres ont vendus."
  - qui: barbier
    sujet: quartier
    si: "flag(histoire_h6) && lieu == centre"
    texte: "Le centre a une salle de classe, maintenant. On leur apprend à lire un contrat. Moi, on m'a appris à regarder les pieds."

  # ═══════════════════════════════════════════════════════ Joachim Ferlac
  - qui: ferlac
    sujet: toi
    si: "flag(histoire_h6)"
    texte: "Bonjour. Votre carnet est sur votre bureau, tapé. J'ai corrigé deux fautes d'orthographe ; j'espère que vous ne m'en voudrez pas."
  - qui: ferlac
    sujet: club
    si: "flag(histoire_h6) && tranche == soir"
    texte: "Je reste encore un peu, il y a les rapports de Monsieur Barbier à mettre au propre. Bonne soirée. Merci."
  - qui: ferlac
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_tableur_adopte)"
    texte: "Le tableau tourne bien ? Si une colonne vous gêne, dites-le-moi. Je peux toujours la cacher."
  - qui: ferlac
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Dans dix ans, on ne recrutera plus sans ordinateur. Monsieur Barbier rit quand je dis ça. Il a raison de rire, pour l'instant."
  - qui: ferlac
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_bureau_visite)"
    texte: "J'ai trouvé la porte ouverte, ce matin-là. Je l'ai refermée. On ne sait jamais qui passe, le soir, dans un club."
  - qui: ferlac
    sujet: match
    si: "flag(histoire_h6) && serie_v >= 1"
    texte: "Trois victoires. Statistiquement, ça ne veut rien dire. Mais c'est agréable, je vous l'accorde."
  - qui: ferlac
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_merci_note)"
    texte: "Ma mère disait toujours merci deux fois. Ça m'est resté. On me le reproche, parfois, gentiment."
  - qui: ferlac
    sujet: quartier
    si: "flag(histoire_h6) && lieu == gareRoutiere"
    texte: "Je prends le car du dimanche soir, le dernier. Il part à vingt-trois heures. On est rarement plus de deux."
  - qui: ferlac
    sujet: club
    si: "flag(histoire_h6) && flag(h6_classeur_garde)"
    texte: "Madame Josiane ne veut pas me confier les archives. Elle a raison, je suppose. Je suis nouveau, ici."
  - qui: ferlac
    sujet: sombre
    si: "flag(histoire_h6) && saison == 3 && tranche == nuit"
    texte: "Vous travaillez tard, vous aussi. On finit par se croiser dans l'escalier. Bonne nuit, et merci."

  # ═══════════════════════════════════════════════════════ Dembo
  - qui: dembo
    sujet: toi
    si: "flag(histoire_h6) && !flag(h6_dembo_vendu)"
    texte: "Vingt ans qu'on se connaît, et tu me regardes encore comme un contrat. Fais-moi rire, une fois, avant de me vendre."
  - qui: dembo
    sujet: match
    si: "flag(histoire_h6) && !flag(h6_dembo_vendu) && serie_v >= 1"
    texte: "J'ai marqué, j'ai dormi, j'ai remarqué. L'ordre change, le reste non."
  - qui: dembo
    sujet: club
    si: "flag(histoire_h6) && flag(h6_dembo_promis) && !flag(h6_dembo_vendu)"
    texte: "Tout le monde sait pour Valentienne, sauf moi. C'est drôle, une ville entière qui garde un secret pour toi."
  - qui: dembo
    sujet: epoque
    si: "flag(histoire_h6) && !flag(h6_dembo_vendu)"
    texte: "Les jeunes ont des téléphones qui sonnent comme des chansons. Le mien sonne comme un téléphone. Personne ne m'appelle."
  - qui: dembo
    sujet: argent
    si: "flag(histoire_h6) && !flag(h6_dembo_vendu)"
    texte: "Six millions pour moi ? À trente-sept ans ? Quelqu'un me surestime, ou quelqu'un se paie sur moi."
  - qui: dembo
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_dembo_reste)"
    texte: "Tu m'as gardé. Maintenant je dois marquer, sinon c'est toi qu'on vend."
  - qui: dembo
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_dembo_prevenu) && !flag(h6_dembo_vendu)"
    texte: "Merci de me l'avoir dit avant le journal. Le journal, lui, ne m'a rien dit du tout."
  - qui: dembo
    sujet: sombre
    si: "flag(histoire_h6) && tranche == nuit && !flag(h6_dembo_vendu)"
    texte: "Je ne dors pas la veille des matchs. Je dors après. Toi, tu ne dors jamais, ça se voit d'ici."
  - qui: dembo
    sujet: quartier
    si: "flag(histoire_h6) && lieu == buvette && !flag(h6_dembo_vendu)"
    texte: "À la buvette, on m'offre des bières que je ne bois pas. Je les donne au gamin du comptoir. Il est majeur, je crois."
  - qui: dembo
    sujet: club
    si: "flag(histoire_h6) && flag(h6_montre_dembo) && !flag(h6_dembo_vendu)"
    texte: "Tu as encore ma montre ? Garde-la. Elle retarde de trois minutes. Avec moi, tout le monde arrive en retard."

  # ═══════════════════════════════════════════════════════ Tibo Rancé
  - qui: tibo_rance
    sujet: toi
    si: "flag(histoire_h6) && saison == 2 && !flag(h6_tibo_vendu)"
    texte: "Mon père dit qu'il y a un club à l'étranger. Moi, je ne sais même pas où c'est. Vous savez, vous ?"
  - qui: tibo_rance
    sujet: match
    si: "flag(histoire_h6) && !flag(h6_tibo_vendu) && serie_v >= 1"
    texte: "Vukić m'a fait entrer dix minutes, samedi. J'ai touché trois ballons. J'en ai perdu un. Mon père a compté les trois."
  - qui: tibo_rance
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tibo_conseil_rester) && !flag(h6_tibo_vendu)"
    texte: "Vous m'avez dit de ne rien signer. J'ai rien signé. Mon père ne me parle plus le matin."
  - qui: tibo_rance
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tibo_conseil_partir) && !flag(h6_tibo_vendu)"
    texte: "Vous m'avez dit que c'était ma chance. Je cherche encore dans quel sens."
  - qui: tibo_rance
    sujet: quartier
    si: "flag(histoire_h6) && lieu == centre && !flag(h6_tibo_vendu)"
    texte: "La salle de classe sent la peinture. Le prof d'anglais dit que si je pars, il faudra au moins que je sache dire contrat."
  - qui: tibo_rance
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_tibo_garde)"
    texte: "Je reste. Je ne sais pas qui a payé pour ça, mais je reste."
  - qui: tibo_rance
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_pere_joue) && !flag(h6_tibo_vendu)"
    texte: "Mon père rentre à quatre heures, les poches vides. Il me dit bonne nuit en partant au travail."
  - qui: tibo_rance
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_carte_jf) && !flag(h6_tibo_vendu)"
    texte: "Mon père garde une carte de visite blanche dans son portefeuille. Il la regarde plus souvent que ma photo."

  # ═══════════════════════════════════════════════════════ Bertrand Rancé
  - qui: bertrand_rance
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_pere_rance)"
    texte: "Au Terminus, on ne compte pas les parties. On compte ce qui reste sur l'ardoise, et ce qui reste, c'est moi."
  - qui: bertrand_rance
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_ardoise_payee)"
    texte: "Vous avez payé mon ardoise. Je vous dois quelque chose, et je déteste devoir. Je vous le rendrai, d'une façon ou d'une autre."
  - qui: bertrand_rance
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_pere_joue)"
    texte: "Quatre millions pour mon fils, et moi je dois de quoi acheter une camionnette. Le monde est bien fait, hein ?"
  - qui: bertrand_rance
    sujet: club
    si: "flag(histoire_h6) && flag(h6_tibo_vendu)"
    texte: "Mon fils m'appelle le dimanche, de là-bas. Il dit que tout va bien. Il le dit trop vite."
  - qui: bertrand_rance
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_pere_chasse)"
    texte: "Je cherche un JF. J'ai demandé au Terminus, à la gare routière, au tabac. Personne ne s'appelle comme ça, ici. Tout le monde est poli."
  - qui: bertrand_rance
    sujet: quartier
    si: "flag(histoire_h6) && lieu == terminus"
    texte: "Le patron du Terminus a une ardoise pour chacun. La mienne est la plus longue. Elle a son clou à elle."
  - qui: bertrand_rance
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_pere_police)"
    texte: "La police, je veux bien. Mais la police ne joue pas aux cartes avec moi. Les autres, si."
  - qui: bertrand_rance
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_pere_honte)"
    texte: "Vous aviez honte, l'autre soir. Moi aussi. On devrait monter un club, tous les deux."

  # ═══════════════════════════════════════════════════════ Madame Vialat
  - qui: vialat
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_vialat_franche)"
    texte: "Vous ne connaissez pas vos intermédiaires. C'est la première chose vraie qu'on me dit dans un club depuis 1989."
  - qui: vialat
    sujet: club
    si: "flag(histoire_h6) && saison >= 2"
    texte: "Je repasse vendredi. Les comptes sont plus honnêtes en fin de semaine, allez savoir pourquoi."
  - qui: vialat
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_vialat_sait)"
    texte: "23 h 58, toujours. Une heure aussi régulière, c'est une signature. Les gens honnêtes sont moins ponctuels."
  - qui: vialat
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Les écus m'ont fait refaire tous les bilans à la main. On croit que l'argent change de nom. Il change seulement de cachette."
  - qui: vialat
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_vialat_mefiante)"
    texte: "Vous m'avez dit « agents ». J'ai gommé les guillemets. Il reste le mot, et le mot n'explique rien."
  - qui: vialat
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_audit_parle)"
    texte: "La saisie, ce n'est pas une punition. C'est un inventaire. Les punitions viennent après, et d'ailleurs."
  - qui: vialat
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_primes_mutuelle)"
    texte: "La Mutuelle des Quais rembourse mal les lunettes et paie bien les directions sportives. Je note les deux."
  - qui: vialat
    sujet: quartier
    si: "flag(histoire_h6) && lieu == banque"
    texte: "La Banque Aubérivoise ferme à dix-sept heures. Les virements de la Mutuelle partent à vingt-trois heures cinquante. Je trouve ça curieux."

  # ═══════════════════════════════════════════════════════ Rocco Fardelli
  - qui: fardelli
    sujet: toi
    si: "flag(histoire_h6)"
    texte: "On se connaît depuis 1999. Tu te souviens de la table ? Moi oui. Je me souviens de toutes les tables."
  - qui: fardelli
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_montre_acier)"
    texte: "La montre te va bien. Ne la remonte pas trop : ces montres-là, on les porte pour l'heure des autres."
  - qui: fardelli
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_fardelli_soupconne)"
    texte: "Tu me soupçonnes encore ? Bien. Pendant que tu me regardes, regarde aussi ceux qui ne me ressemblent pas."
  - qui: fardelli
    sujet: club
    si: "flag(histoire_h6) && flag(h6_dembo_vendu)"
    texte: "Dembo à Valentienne : je n'y suis pour rien, pour une fois. Ça m'a vexé, d'ailleurs."
  - qui: fardelli
    sujet: sponsor
    si: "flag(histoire_h6) && flag(h6_primes_mutuelle)"
    texte: "La Mutuelle des Quais ? Je ne travaille pas avec eux. Je travaille avec des gens qui ont des noms."
  - qui: fardelli
    sujet: match
    si: "flag(histoire_h6) && serie_d >= 1"
    texte: "Tu perds, tes prix baissent, les miens montent. C'est la seule loi qui marche à tous les coups."
  - qui: fardelli
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Les jeunes agents ont des ordinateurs portables. Moi, j'ai une gourmette et un carnet. Le carnet ne tombe jamais en panne."
  - qui: fardelli
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_rideau_vu)"
    texte: "On dit que tu as frappé à la porte sans poignée. La maison n'oublie pas un visage ; elle les range par année."

  # ═══════════════════════════════════════════════════════ Arnaud Vaubourg
  - qui: arnaud_vaubourg
    sujet: toi
    si: "flag(histoire_h6) && saison == 1"
    texte: "Mon père a choisi votre nom sur une liste. Moi, j'ai choisi la couleur de votre bureau. C'est déjà ça."
  - qui: arnaud_vaubourg
    sujet: club
    si: "flag(histoire_h6)"
    texte: "Mon père appelle à 23 h 47, toujours. Jamais à 23 h 58, j'ai vérifié. Je vérifie tout, maintenant."
  - qui: arnaud_vaubourg
    sujet: sponsor
    si: "flag(histoire_h6) && flag(h6_mutuelle_ecoute)"
    texte: "La Mutuelle des Quais nous vient de la Ligue. De mon père, donc. Moi, je n'ai fait que tenir le stylo."
  - qui: arnaud_vaubourg
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_arnaud_soupconne)"
    texte: "Vous me soupçonnez. Mon père aussi, depuis que je suis né. Bienvenue au club."
  - qui: arnaud_vaubourg
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_audit_parle)"
    texte: "Je ne savais pas. C'est ce que j'ai dit à la Commission. C'était vrai, c'est bien le pire."
  - qui: arnaud_vaubourg
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_photo_tiroir)"
    texte: "La photo est toujours dans mon tiroir. Je ne la regarde plus. Enfin, presque plus."
  - qui: arnaud_vaubourg
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Mon père a eu un téléphone de voiture dès 1991. Il me l'a donné quand il en a eu un plus petit. Je reçois encore ses vieux appels."
  - qui: arnaud_vaubourg
    sujet: club
    si: "flag(histoire_h6) && flag(h6_loge_vente)"
    texte: "J'ai signé l'offre d'Ilyas. Pour une fois, j'ai décidé. Je n'ai pas encore compris si j'ai aimé ça."

  # ═══════════════════════════════════════════════════════ Zoran Vukić
  - qui: vukic
    sujet: club
    si: "flag(histoire_h6) && saison >= 2"
    texte: "La casquette de Vogler est au vestiaire. Les joueurs la touchent en sortant. Moi, je ne la touche pas."
  - qui: vukic
    sujet: match
    si: "flag(histoire_h6) && serie_d >= 1"
    texte: "On joue avec ce qui reste. Ce qui reste est jeune et a peur. La peur, ça s'apprend vite ; ça se désapprend moins."
  - qui: vukic
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_indice_escalier)"
    texte: "Ce soir encore, onze heures et quatre minutes. Il descend sans allumer. Il connaît les marches par cœur."
  - qui: vukic
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_vukic_sait)"
    texte: "Vous m'avez dit « pour quelqu'un d'autre ». Je n'ai rien répété. Ça fait de nous une équipe, ou des complices."
  - qui: vukic
    sujet: epoque
    si: "flag(histoire_h6) && annee >= 2005"
    texte: "Les gamins me tutoient. Je laisse faire. Le stagiaire, lui, me dit monsieur l'entraîneur. Personne ne m'a jamais appelé comme ça."
  - qui: vukic
    sujet: club
    si: "flag(histoire_h6) && saison == 1"
    texte: "Vogler court partout. Moi, je regarde. À nous deux, on fait presque un entraîneur."

  # ═══════════════════════════════════════════════════════ Pierre Massenet
  - qui: meneche
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_verite_dimanche)"
    texte: "Dimanche, je dis à l'antenne que vos prix sont bas. Lundi, quelqu'un me dira pourquoi. Il y a toujours quelqu'un."
  - qui: meneche
    sujet: toi
    si: "flag(histoire_h6)"
    texte: "À la télé, on parle quatre minutes. Le métier, c'est de savoir ce qu'on tait pendant les quatre minutes."
  - qui: meneche
    sujet: club
    si: "flag(histoire_h6) && flag(h6_merci_massenet)"
    texte: "J'ai gardé la page MERCI dans ma boîte à gants. On ne jette pas un remerciement, même anonyme. Surtout anonyme."
  - qui: meneche
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_dembo_prix_fax)"
    texte: "Six millions pour Dembo. J'avais le chiffre avant vous, au téléphone, d'une voix très polie."
  - qui: meneche
    sujet: sombre
    si: "flag(histoire_h6) && lieu == voiture"
    texte: "Je baisse toujours la vitre à moitié. Ça laisse passer les mots, pas la pluie."

  # ═══════════════════════════════════════════════════════ Léa
  - qui: lea
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_verite_dimanche)"
    texte: "Votre nom et le sien dans le même article. Le vôtre vient en second. Ce n'est pas un cadeau, c'est l'ordre des faits."
  - qui: lea
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_lea_page)"
    texte: "Deux pages blanches à la même minute, chez vous et chez nous. J'ai mis la nôtre sous plastique. Elle blanchit quand même."
  - qui: lea
    sujet: club
    si: "flag(histoire_h6) && flag(h6_lea_attend)"
    texte: "J'attends le second nom. J'ai l'habitude d'attendre ; c'est le seul métier où ça finit par payer."
  - qui: lea
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Le journal a un site, maintenant. Personne ne le lit. On y met les résultats avant le papier, pour s'entraîner."
  - qui: lea
    sujet: sombre
    si: "flag(histoire_h6) && flag(h6_lea_publie)"
    texte: "J'ai publié votre photo. Je le regrette un jour sur deux. L'autre jour, je cherche le second nom."

  # ═══════════════════════════════════════════════════════ les autres visages
  - qui: solvang
    sujet: toi
    si: "flag(histoire_h6) && flag(h6_solvang_lu)"
    texte: "Votre page trois, je l'ai encore en tête. Vous contresignez les commissions des autres. Quelqu'un vous a choisi pour ça."
  - qui: solvang
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_indice_pas_agent)"
    texte: "Un agent signe. Votre corbeau tape. Ce n'est pas la même main."
  - qui: solvang
    sujet: club
    si: "flag(histoire_h6) && flag(h6_solvang_adverse)"
    texte: "Vous m'avez dit « rien ». C'est un prix comme un autre ; je l'ai noté sur ma liste."
  - qui: solvang
    sujet: epoque
    si: "flag(histoire_h6)"
    texte: "Les joueurs libres, c'est l'avenir. Plus d'indemnités, plus de clubs propriétaires. Rien que des contrats, et des gens qui les lisent."
  - qui: nassir
    sujet: sponsor
    si: "flag(histoire_h6) && flag(h6_canette_signee)"
    texte: "Orange sur bordeaux. Les puristes détestent. Les puristes achètent le maillot, ensuite."
  - qui: nassir
    sujet: argent
    si: "flag(histoire_h6)"
    texte: "Un club se rachète toujours au prix de ses dettes. Le reste, c'est de la décoration, et la décoration, je la paie à part."
  - qui: nassir
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_loge_messager)"
    texte: "Le fils signera. Les fils signent toujours, quand le père regarde ailleurs."
  - qui: malbec
    sujet: club
    si: "flag(histoire_h6) && flag(h6_dembo_vendu)"
    texte: "Dembo marque encore pour Valentienne. Il dort tard ; je le paie pour ça aussi."
  - qui: malbec
    sujet: rumeur
    si: "flag(histoire_h6) && flag(h6_carte_malbec)"
    texte: "Gardez la carte. Moi, je ne sais même plus qui me l'a donnée. C'est le principe des cartes sans adresse."
  - qui: malbec
    sujet: argent
    si: "flag(histoire_h6) && flag(h6_malbec_brouille)"
    texte: "Je me suis plaint de vous à la Ligue. Le père Vaubourg m'a écouté poliment. Il écoute toujours poliment ceux qu'il va lâcher."
  - qui: klopf
    sujet: toi
    si: "flag(histoire_h6) && saison == 1"
    texte: "Il me faut mon gaucher avant la Toussaint. Après, je ne réponds plus de mes ailiers, ni de mon sourire."
  - qui: klopf
    sujet: match
    si: "flag(histoire_h6) && saison == 1 && serie_v >= 1"
    texte: "Vous avez vu le deuxième but ? Douze passes, et personne n'a gardé le ballon. Ne vendez personne d'ici samedi."
  - qui: klopf
    sujet: club
    si: "flag(histoire_h6) && flag(h6_klopf_sans_gauche)"
    texte: "Mon droitier joue à gauche. Je souris, vous voyez ? C'est ce qu'on fait quand on n'a plus rien à demander."
  - qui: klopf
    sujet: rumeur
    si: "flag(histoire_h6) && saison == 1"
    texte: "On me parle de la Vestrie. Une sélection, un pays, des casquettes. Je n'ai pas encore dit non."
  - qui: sabatier
    sujet: toi
    si: "flag(histoire_h6)"
    texte: "Vous dormez quatre heures. Je le vois à vos mains : la tasse tremble avant vous."
  - qui: sabatier
    sujet: club
    si: "flag(histoire_h6) && flag(h6_doc_refuse)"
    texte: "Le milieu au ménisque est resté. Il boite encore, mais il boite chez nous."

# Où l'on croise les visages du livre (s'ils sont de la distribution ou déjà
# rencontrés), et où leurs cartes les attendent quand elles ne disent pas de lieu.
presences:
  - {qui: ferlac, lieu: clubhouse, tranches: [matin, aprem, soir]}
  - {qui: barbier, lieu: centre, tranches: [matin, aprem]}
  - {qui: tibo_rance, lieu: centre, tranches: [aprem]}
  - {qui: bertrand_rance, lieu: terminus, tranches: [soir]}
  - {qui: arnaud_vaubourg, lieu: clubhouse, tranches: [matin, midi]}
  - {qui: vialat, lieu: banque, tranches: [matin]}
  - {qui: dembo, lieu: terrain, tranches: [matin]}
  - {qui: klopf, lieu: terrain, tranches: [matin, aprem]}
  - {qui: solvang, lieu: hotel, tranches: [midi]}
  - {qui: malbec, lieu: hotel, tranches: [midi]}

rencontres:
  ferlac: clubhouse
  barbier: centre
  tibo_rance: centre
  bertrand_rance: terminus
  arnaud_vaubourg: clubhouse
  vialat: clubhouse
  dembo: terrain
  klopf: terrain
  solvang: hotel
  malbec: hotel

# Ce qu'on voit en entrant, pendant le livre (la première vraie l'emporte).
lieux_variantes:
  - {lieu: clubhouse, si: "flag(histoire_h6) && flag(h6_faux_nom)", texte: "Le club-house, tard. Sous l'escalier, la porte de la vieille buanderie, que personne n'ouvre depuis 1987. Ce soir, un rai de lumière passe dessous."}
  - {lieu: club_prive, si: "flag(histoire_h6) && flag(h6_negatifs_offerts)", texte: "Le Rideau Rouge. La porte sans poignée, le velours derrière. Un carton noir dépasse de la boîte aux lettres, sans adresse : la maison écrit à ceux qu'elle connaît."}
  - {lieu: tripot, si: "flag(histoire_h6) && flag(h6_pere_rance)", texte: "L'arrière-salle du Terminus. Au mur, les ardoises des habitués, chacune à son clou. La plus longue porte un nom à la craie : RANCÉ."}
  - {lieu: centre, si: "flag(histoire_h6) && flag(h6_tibo_vendu)", texte: "Le centre de formation. Sur le tableau des effectifs, une étiquette arrachée laisse une trace plus claire, à la lettre R."}
  - {lieu: agence, si: "flag(histoire_h6)", texte: "Immobilier Tessandier. Dans la vitrine, la maquette des Terrasses de la Rive : la première tranche est bâtie, la seconde est un terrain vague à moitié parking."}
