# Histoire 7 · Chambre 12 — ce que dit la ville (fiche § 7), à mesure que
# l'histoire avance : ce qu'Aubérive sait, devine, répète du deuxième étage de
# l'hôtel de la Rive. Une réplique ne fait pas avancer l'intrigue : elle prouve
# qu'elle avance. Toutes lisent `flag(histoire_h7)` ; les drapeaux de la fiche
# y sont rangés sous le préfixe `h7_` (selfie → h7_main_vue, tableau_cles →
# h7_tableau_demande, chambre_close → h7_plante, cahier_nuit → h7_cahier_lu,
# proces_verbal → h7_copie_pv, mbako_aveu → h7_mbako_silence…).
#
# Les textes de la ville n'accordent rien au protagoniste (il peut être une
# femme). La réceptionniste de nuit est en fauteuil depuis 1984 : la ville ne
# la dessine pas assise (l'outil ne sait pas), les cartes et les répliques le
# disent.
paroles:
  # ═══════════════════════════════════════════════ Sandrine Lavergne (la nuit)
  - {qui: sandrine, sujet: toi, si: "flag(histoire_h7) && tranche == nuit", texte: "Vous descendez tous les soirs regarder mes crochets. Ils ne bougent pas quand vous les regardez. C'est après, qu'ils bougent."}
  - {qui: sandrine, sujet: quartier, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Vingt-six chambres, vingt-six doubles. Je les compte à minuit, à deux heures, à quatre heures. Je n'ai jamais eu un chiffre faux."}
  - {qui: sandrine, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort) && annee == 2011", texte: "Je n'ai pas dormi depuis le 14. Je ne dormais pas avant non plus, remarquez. Mais avant, c'était un choix."}
  - {qui: sandrine, sujet: toi, si: "flag(histoire_h7) && flag(h7_cahier_lu)", texte: "La page, vous l'avez. Le cahier, la police l'aura. Moi, j'ai l'heure dans la tête. On est trois à savoir, maintenant."}
  - {qui: sandrine, sujet: toi, si: "flag(histoire_h7) && flag(h7_cahier_ferme)", texte: "Mon cahier dort dans le coffre d'Escande. Il ne s'ouvrira que si quelqu'un le demande. Personne ne le demande."}
  - {qui: sandrine, sujet: sombre, si: "flag(histoire_h7) && flag(h7_double_mere)", texte: "J'ai signé mon cahier pour la première fois. Vingt ans de nuits, et ma signature est sous celle de la mère du petit."}
  - {qui: sandrine, sujet: quartier, si: "flag(histoire_h7) && flag(h7_plante)", texte: "La plante devant la 12, je ne la vois jamais : je ne monte pas. Les joueurs disent qu'elle a des fleurs, maintenant."}
  - {qui: sandrine, sujet: toi, si: "flag(histoire_h7) && flag(h7_vl_cahier_nuit)", texte: "Je l'ai vue, votre chambre 12. Vingt ans que j'écrivais son numéro sans l'avoir vue. Elle est plus petite que dans le cahier."}
  - {qui: sandrine, sujet: quartier, si: "flag(histoire_h7) && tranche == soir", texte: "Mon père tenait le tabac du Quai. Il reconnaissait les gens à l'heure où ils achetaient leurs cigarettes. Moi, c'est aux doubles."}
  - {qui: sandrine, sujet: sombre, si: "flag(histoire_h7) && annee >= 2013", texte: "Le crochet du 12, je l'ai gardé dans mon tiroir, avec le double. On ne jette pas un crochet."}
  - {qui: sandrine, sujet: toi, si: "flag(histoire_h7) && flag(h7_ronde)", texte: "Votre tabouret est toujours au bout du comptoir. Personne d'autre ne s'y assoit. Même Escande fait le tour."}
  - {qui: sandrine, sujet: toi, si: "flag(histoire_h7) && flag(h7_confiance)", texte: "Je compte seule depuis que vous ne descendez plus. C'est plus rapide, et moins triste."}
  - {qui: sandrine, sujet: quartier, si: "flag(histoire_h7) && flag(h7_cahier_sauve)", texte: "Mon cahier de 2011 est au coffre, avec les bijoux des clientes. Escande dit qu'il vaut moins cher. Je n'en suis pas sûre."}
  - {qui: sandrine, sujet: sombre, si: "flag(histoire_h7) && flag(h7_double_refuse)", texte: "La mère du petit a dormi sur la banquette du hall. Je lui ai mis ma couverture sur les genoux. Je n'ai pas donné le double."}

  # ══════════════════════════════════════════════════ Monsieur Escande (l'hôtel)
  - {qui: escande, sujet: quartier, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Un hôtel, c'est une maison où l'on dort sans vivre. Vos joueurs essaient de vivre au deuxième. Ça se paie en serviettes."}
  - {qui: escande, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort) && annee == 2011", texte: "Les journalistes dorment en face et regardent nos fenêtres. Je leur fais porter du café. Il faut bien que quelqu'un gagne quelque chose."}
  - {qui: escande, sujet: sponsor, si: "flag(histoire_h7) && flag(h7_hotel_gratuit)", texte: "Trois ans gratuits. Vous savez ce que ça coûte, trois ans de silence ? Moins cher qu'une seule Une."}
  - {qui: escande, sujet: sponsor, si: "flag(histoire_h7) && flag(h7_hotel_paye)", texte: "Vous payez la note. C'est rare, un client qui refuse un cadeau. Je l'ai noté dans le livre d'or."}
  - {qui: escande, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_douze_effacee)", texte: "Le pompier est repassé. Il a compté les portes du deuxième, deux fois, et il est reparti sans rien dire."}
  - {qui: escande, sujet: toi, si: "flag(histoire_h7) && flag(h7_appartement_repris)", texte: "La 11 vous va ? Lascombe y dormait la lumière allumée. Je vous ai mis une ampoule plus faible."}
  - {qui: escande, sujet: sombre, si: "flag(histoire_h7) && annee >= 2012", texte: "Je n'ai jamais reloué la 12. Ni prêtée. Ni nettoyée, depuis la police. On ne nettoie pas une chambre qui n'existe pas."}
  - {qui: escande, sujet: quartier, si: "flag(histoire_h7) && tranche == matin", texte: "Le petit-déjeuner est servi jusqu'à dix heures. Les Cobalts descendent à six. Personne ne dort, au deuxième. Les croissants, si."}
  - {qui: escande, sujet: argent, si: "flag(histoire_h7) && flag(h7_bus_rendu) && annee <= 2012", texte: "Le loueur ne reprend pas son bus tant qu'on ne l'a pas payé. Moi, je fais payer le parking. Tout le monde attend quelque chose."}
  - {qui: escande, sujet: sombre, si: "flag(histoire_h7) && flag(h7_bougies)", texte: "Mon vitrier passe demain pour le 14. C'est la troisième vitre en vingt ans. Les deux autres, c'était pour des mariages."}

  # ═══════════════════════════════════════════════════ Nadia Rouvier (la kiné)
  - {qui: rouvier, sujet: toi, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Le petit Rancé a le pouls d'un oiseau, après dix tours. Je le note dans la marge. Personne ne lit mes marges."}
  - {qui: rouvier, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort) && annee == 2011", texte: "On m'a demandé de le trouver à six heures. Je l'ai trouvé. On ne m'a pas demandé à quelle heure je l'avais su."}
  - {qui: rouvier, sujet: toi, si: "flag(histoire_h7) && flag(h7_copie_vue)", texte: "La copie, je l'ai faite en 2010, un jour où la docteure a mal fermé sa mallette. Je ne savais pas quoi en faire. Maintenant, si."}
  - {qui: rouvier, sujet: toi, si: "flag(histoire_h7) && flag(h7_copie_brulee)", texte: "Vous avez brûlé la mienne. L'autre dort chez moi, dans la boîte à couture, sous les aiguilles."}
  - {qui: rouvier, sujet: toi, si: "flag(histoire_h7) && flag(h7_vl_dossier_arzel)", texte: "J'ai cousu son numéro sur vingt-cinq manches, cette nuit-là. Depuis, je ne couds plus de numéros."}
  - {qui: rouvier, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_mbako_lache)", texte: "Je monte un plateau à Mbako tous les midis. Il en mange la moitié. L'autre moitié, il la laisse pour quelqu'un."}
  - {qui: rouvier, sujet: toi, si: "flag(histoire_h7) && tranche == aprem", texte: "Vous respirez par les épaules. Les sélections respirent toutes comme ça, en fenêtre. Les joueurs, eux, retiennent."}
  - {qui: rouvier, sujet: rumeur, si: "flag(histoire_h7) && annee >= 2013", texte: "La docteure ne lâche plus sa mallette. Moi, je ne lâche plus mes ciseaux. Chacune son objet."}
  - {qui: rouvier, sujet: toi, si: "flag(histoire_h7) && flag(h7_footing_coupe)", texte: "Vous l'aviez sorti du footing, au troisième tour. Je l'avais écrit dans la marge. La police a photocopié ma marge."}
  - {qui: rouvier, sujet: toi, si: "flag(histoire_h7) && flag(h7_footing_force)", texte: "Il a fini les dix tours, dernier. Vous l'aviez voulu, et moi je l'avais laissé courir. On l'a tous laissé courir."}

  # ═══════════════════════════════════════════ la commandante Benali (la PJ)
  - {qui: benali, sujet: toi, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "Je ne vous demande pas ce que vous pensez. Je vous demande à quelle heure vous l'avez pensé."}
  - {qui: benali, sujet: toi, si: "flag(histoire_h7) && flag(h7_quatre_heures_dite)", texte: "Vous m'avez donné quatre heures. Personne d'autre ne me l'avait donnée. Ça ne vous innocente pas ; ça vous rend utile."}
  - {qui: benali, sujet: toi, si: "flag(histoire_h7) && flag(h7_dormi_dit)", texte: "Vous avez dormi jusqu'à six heures. Le veilleur dit que votre lumière était allumée à quatre. Je note les deux."}
  - {qui: benali, sujet: sombre, si: "flag(histoire_h7) && flag(h7_scelles_brises)", texte: "La cire de la 12 garde les empreintes mieux que les gens. Je l'ai fait relever avant de vous appeler."}
  - {qui: benali, sujet: sombre, si: "flag(histoire_h7) && flag(h7_montres_saisies)", texte: "Vingt-sept montres dans un sac. Elles marchent toutes encore. La nuit, on les entend dans l'armoire des scellés."}
  - {qui: benali, sujet: quartier, si: "flag(histoire_h7) && tranche == matin", texte: "Je prends mon café ici : le matin, à la réception, les gens mentent moins. Ils ont trop sommeil pour ça."}
  - {qui: benali, sujet: sombre, si: "flag(histoire_h7) && flag(h7_arzel_six_heures)", texte: "Six heures du matin, c'est mon heure. Pas pour le symbole : à six heures, tout le monde est chez soi."}
  - {qui: benali, sujet: toi, si: "flag(histoire_h7) && flag(h7_page_donnee)", texte: "Vous me l'avez rendue pliée en quatre. On plie toujours en quatre ce qu'on a relu trop souvent."}
  - {qui: benali, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_pv_signale)", texte: "Le registre noir, je l'ai vu. Il était ouvert à la page de quatre heures quand je suis entrée. Quelqu'un l'avait laissé ouvert pour moi."}

  # ═══════════════════════════════════════════════════════ Yanis Ferrol
  - {qui: ferrol, sujet: rumeur, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Le petit Rancé me prend mes crampons pour les essayer. Il dit qu'avec les miens, il court comme avant. Avant quoi, je ne sais pas."}
  - {qui: ferrol, sujet: club, si: "flag(histoire_h7) && flag(h7_capitaine_ferrol)", texte: "Le brassard serre. Mbako m'a dit de le mettre plus haut, au-dessus du muscle. Il me l'a dit sans me regarder."}
  - {qui: ferrol, sujet: club, si: "flag(histoire_h7) && flag(h7_capitaine_mbako)", texte: "Mbako capitaine. À Valdorne, on aurait voté. Ici, on attend une décision, et on fait semblant d'être d'accord."}
  - {qui: ferrol, sujet: toi, si: "flag(histoire_h7) && flag(h7_ferrol_dira)", texte: "J'ai coupé le bracelet. Je le garde dans ma poche. Quand je parlerai, je le poserai sur la table."}
  - {qui: ferrol, sujet: toi, si: "flag(histoire_h7) && flag(h7_ferrol_tait)", texte: "Je ne dis rien. Vous me l'avez demandé. Je cours, c'est tout. Je cours très bien, en ce moment."}
  - {qui: ferrol, sujet: sombre, si: "flag(histoire_h7) && flag(h7_nom_confirme)", texte: "Ma main est en page trois, avec mon nom. Ma mère l'a reconnue avant de lire. Elle a toujours reconnu mes mains."}
  - {qui: ferrol, sujet: club, si: "flag(histoire_h7) && flag(h7_portes_ouvertes)", texte: "On dort les portes ouvertes, au deuxième. On entend tout le monde respirer. C'est ce qu'on voulait."}
  - {qui: ferrol, sujet: toi, si: "flag(histoire_h7) && tranche == soir", texte: "Je m'entraîne le soir contre le mur du terrain annexe. Le mur ne pose pas de questions. Il renvoie, c'est tout."}

  # ═══════════════════════════════════════════════════ la docteure Arzel
  - {qui: arzel, sujet: toi, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Soixante minutes. Je l'ai écrit sur sa fiche, sur la vôtre, sur celle de l'adjoint. On ne pourra pas dire que je ne l'ai pas écrit."}
  - {qui: arzel, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort) && annee == 2011", texte: "Je n'ai pas de commentaire. J'ai un rapport. Le rapport dit six heures."}
  - {qui: arzel, sujet: toi, si: "flag(histoire_h7) && flag(h7_lit_tout)", texte: "Vous avez lu les vingt-six. Deux jours. Je vous regardais : c'était comme regarder quelqu'un apprendre à nager à cinquante ans."}
  - {qui: arzel, sujet: toi, si: "flag(histoire_h7) && flag(h7_demission_signee)", texte: "Raisons personnelles. C'est la seule formule administrative qui dise la vérité."}
  - {qui: arzel, sujet: toi, si: "flag(histoire_h7) && flag(h7_arzel_confrontee)", texte: "Vous avez apporté la copie de Rouvier. Je savais qu'il en existait une. J'ai attendu deux ans qu'on me la montre."}
  - {qui: arzel, sujet: quartier, si: "flag(histoire_h7) && tranche == matin", texte: "Je déjeune seule, la mallette sur la chaise. Ce n'est pas de la méfiance : c'est la seule chose ici qui ne me pose pas de questions."}
  - {qui: arzel, sujet: toi, si: "flag(histoire_h7) && flag(h7_soixante_question)", texte: "Vous m'avez demandé pourquoi soixante. En dix ans, personne ne l'avait fait. J'ai répondu n'importe quoi. Je m'en souviens."}
  - {qui: arzel, sujet: sombre, si: "flag(histoire_h7) && flag(h7_cardiologue)", texte: "Son cardiologue m'écrivait de Valdorne. Je répondais toujours le même mot. Je ne vous dirai pas lequel : vous l'avez signé."}
  - {qui: arzel, sujet: toi, si: "flag(histoire_h7) && flag(h7_signe_encore)", texte: "Vous avez signé la pile, encore. J'avais mis un trombone vert. Je n'en mettrai plus."}
  - {qui: arzel, sujet: toi, si: "flag(histoire_h7) && flag(h7_demission_refusee)", texte: "Vous avez refusé ma démission avant le match. Vous avez raison : il faut que je sois là quand on viendra me chercher."}

  # ═════════════════════════════════════════════════════════ Lian Mbako
  - {qui: mbako, sujet: club, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Le petit veut que je lui apprenne les penaltys. Je lui apprends à attendre que le gardien bouge. Il n'attend jamais."}
  - {qui: mbako, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort) && annee == 2011", texte: "Je ne parle pas de cette nuit. Pas parce qu'on me l'a dit. Parce que je n'ai pas encore trouvé par où commencer."}
  - {qui: mbako, sujet: toi, si: "flag(histoire_h7) && flag(h7_mbako_temoignera)", texte: "Je le dirai debout. J'ai passé assez de temps assis dans un bus."}
  - {qui: mbako, sujet: toi, si: "flag(histoire_h7) && flag(h7_mbako_silence)", texte: "Personne ne saura, tu as dit. Moi, je sais. Ça fait déjà un de trop."}
  - {qui: mbako, sujet: sombre, si: "flag(histoire_h7) && flag(h7_bougies)", texte: "La pierre est dans mon sac de sport. On ne saura jamais qui l'a lancée, alors je la garde pour tout le monde."}
  - {qui: mbako, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_rossard_plateau)", texte: "Rossard m'a fait débuter, en 1992. Il m'appelait le petit. Maintenant, il dit mon nom à la télévision."}
  - {qui: mbako, sujet: club, si: "flag(histoire_h7) && flag(h7_capitaine_mbako)", texte: "Une dernière fois, tu as dit. Je compte les fenêtres. Il en reste moins qu'on croit."}
  - {qui: mbako, sujet: toi, si: "flag(histoire_h7) && flag(h7_mbako_main)", texte: "J'ai levé la main. La dernière fois, c'était dans le bus, pour rester. Cette fois, c'était pour sortir."}
  - {qui: mbako, sujet: toi, si: "flag(histoire_h7) && flag(h7_rendez_vous_repousse)", texte: "« Après le barrage », tu lui avais dit. Il me l'a répété au Corner, en riant. Il riait de tout, ce soir-là."}
  - {qui: mbako, sujet: club, si: "flag(histoire_h7) && flag(h7_rangee_milieu)", texte: "La première année, tu as pris la place vide, au milieu du car. Depuis, la rangée du milieu est à toi. Personne d'autre ne s'y assoit."}
  - {qui: mbako, sujet: toi, si: "flag(histoire_h7) && flag(h7_mbako_defendu)", texte: "Tu as dit à la radio que j'étais un homme droit. Tu n'as pas dit de quoi. C'était la seule façon de le dire."}
  - {qui: mbako, sujet: sombre, si: "flag(histoire_h7) && flag(h7_promesse_tibo) && flag(h7_rance_mort)", texte: "Tu lui avais dit qu'il jouerait en novembre. Il l'avait noté dans son carnet. On a joué avec son numéro sur la manche."}

  # ═════════════════════════════════════════════════════ Madame Josiane
  - {qui: josiane, sujet: toi, si: "flag(histoire_h7) && flag(h7_visites_signees)", texte: "Le trombone rouge, je l'avais mis sur le premier dossier. On ne lit plus les trombones."}
  - {qui: josiane, sujet: toi, si: "flag(histoire_h7) && flag(h7_visites_lues)", texte: "Vous avez lu le premier dossier, en mars 2011. Personne d'autre ne l'a fait. La page trois manquait déjà ; je ne l'ai su que plus tard."}
  - {qui: josiane, sujet: toi, si: "flag(histoire_h7) && flag(h7_brouillon)", texte: "Le brouillon dort entre deux circulaires sur les frais de déplacement. Personne ne lit les frais de déplacement. Même pas moi."}
  - {qui: josiane, sujet: sombre, si: "flag(histoire_h7) && annee >= 2013", texte: "J'ouvre un classeur par année depuis la nuit du 14. Ils ont tous la même étiquette."}
  - {qui: josiane, sujet: quartier, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Vingt-six dossiers, vingt-six signatures, une seule docteure. À la Fédération, on appelle ça la routine. Moi, j'appelle ça mars."}
  - {qui: josiane, sujet: sombre, si: "flag(histoire_h7) && flag(h7_vaubourg_remet)", texte: "Le nom du petit a été rajouté à la main, à l'encre de la présidence. J'ai envoyé la liste. Je garde toujours la première."}
  - {qui: josiane, sujet: toi, si: "flag(histoire_h7) && flag(h7_page_trois)", texte: "La page trois du dossier Rancé, je l'ai cherchée dans tous les classeurs. Je n'ai trouvé que l'agrafe. Je l'ai gardée."}
  - {qui: josiane, sujet: toi, si: "flag(histoire_h7) && flag(h7_brouillon_jete)", texte: "Vous m'avez fait jeter le brouillon. Je l'ai jeté. La corbeille du salon, on ne la vide que le lundi."}

  # ══════════════════════════════════════════════════════════════ Léa
  - {qui: lea, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_copie_pv)", texte: "Quatre heures du matin dans le procès-verbal, six heures dans le communiqué. Deux heures de différence, c'est un titre."}
  - {qui: lea, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_main_vue)", texte: "La main, je la regarde tous les soirs, agrandie. Un bracelet tressé au poignet, rouge et noir. Vous savez d'où vient ce tressage."}
  - {qui: lea, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort) && annee == 2011", texte: "On m'a donné six heures, un malaise et un communiqué de trois lignes. J'ai une deuxième source pour l'hôtel. Pas pour l'heure."}
  - {qui: lea, sujet: toi, si: "flag(histoire_h7) && flag(h7_nom_confirme)", texte: "Vous avez été ma deuxième source. Mon rédacteur m'a demandé si c'était raisonnable, pour vous. J'ai dit non."}
  - {qui: lea, sujet: toi, si: "flag(histoire_h7) && flag(h7_nom_tu)", texte: "« Pas souhaité répondre. » J'ai écrit ces trois mots six fois cette année, à votre sujet."}
  - {qui: lea, sujet: rumeur, si: "flag(histoire_h7) && annee >= 2013", texte: "L'Écho a ouvert un dossier « Rive ». Il est plus épais que celui du Racing. Le Racing a soixante ans."}

  # ═════════════════════════════════════════════════ Aurélien Dauzat
  - {qui: dauzat, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "Un procès-verbal, c'est une heure et une phrase. Le reste, c'est de la littérature."}
  - {qui: dauzat, sujet: epoque, si: "flag(histoire_h7) && annee >= 2013", texte: "Le comité est dissous. Le registre, lui, ne l'a pas été. On ne dissout pas du papier."}
  - {qui: dauzat, sujet: toi, si: "flag(histoire_h7) && flag(h7_registre_ferme)", texte: "Vous m'avez laissé le registre. On me laisse toujours le registre. C'est pour ça que je suis encore là."}
  - {qui: dauzat, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_rossard_source)", texte: "Rossard voulait un nom. J'avais une heure. On a échangé, entre gens civilisés."}
  - {qui: dauzat, sujet: toi, si: "flag(histoire_h7) && flag(h7_questions)", texte: "Vous posez des questions. À la Fédération, on n'interdit pas les questions. On les classe."}

  # ═════════════════════════════════════════ Carole Desforges, Aimé Rossard
  - {qui: desforges, sujet: sponsor, si: "flag(histoire_h7) && flag(h7_fulgor_signe)", texte: "Vous avez été parfait à vingt heures, le mot, la main, la canette. Nos ventes ont pris trois points dans la semaine."}
  - {qui: desforges, sujet: sponsor, si: "flag(histoire_h7) && flag(h7_fulgor_refuse)", texte: "Le président a signé sans vous. Les présidents signent toujours, c'est leur métier. Les sélectionneurs, eux, hésitent."}
  - {qui: desforges, sujet: sponsor, si: "flag(histoire_h7) && flag(h7_montres_saisies)", texte: "Les montres sont sous scellés. On en fabrique d'autres. La police n'a jamais saisi une usine."}
  - {qui: desforges, sujet: achat, si: "flag(histoire_h7) && possede(montre_acier)", texte: "Elle vous va bien, notre montre. Elle donne l'heure à la seconde. C'est utile, en ce moment, l'heure exacte."}
  - {qui: rossard, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_rossard_plateau)", texte: "J'ai dit un nom à la télévision. Avant, je disais des compositions. Les deux font de l'audience."}
  - {qui: rossard, sujet: epoque, si: "flag(histoire_h7) && annee == 2011", texte: "Moi aussi, j'ai eu un bus, en 1988. Il est descendu. Ça ne m'a pas rendu meilleur, seulement plus vieux."}
  - {qui: rossard, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_rossard_source)", texte: "Dauzat m'a donné l'heure. Je l'ai dite. On ne vérifie pas une heure qui vient de la Fédération."}
  - {qui: rossard, sujet: toi, si: "flag(histoire_h7) && tranche == soir", texte: "Le plateau, c'est le dimanche à vingt et une heures. Le reste de la semaine, je prépare ce que je dirai sans préparer."}

  # ═════════════════════════════════════════════ Fauvel, Gégé, Fardelli, Vaubourg, Aubert
  - {qui: fauvel, sujet: argent, si: "flag(histoire_h7) && flag(h7_prime_gelee)", texte: "La prime de 2010 est toujours gelée. Les mutins ne disent rien. C'est le syndicat qui a froid pour eux."}
  - {qui: fauvel, sujet: argent, si: "flag(histoire_h7) && flag(h7_prime_debloquee)", texte: "Vous avez débloqué la prime. Mbako a envoyé la sienne à quelqu'un, à Aubérive. Il ne m'a pas dit à qui."}
  - {qui: fauvel, sujet: toi, si: "flag(histoire_h7) && flag(h7_vote_verite)", texte: "Vingt-six mains, et la vôtre. Je n'avais jamais compté la main d'un sélectionneur. Je l'ai comptée deux fois."}
  - {qui: fauvel, sujet: club, si: "flag(histoire_h7) && annee >= 2012", texte: "Je défends les mutins. Pas ce qu'ils ont fait en 2010 : ce qu'on leur fait depuis."}
  - {qui: fauvel, sujet: toi, si: "flag(histoire_h7) && flag(h7_vote_refuse)", texte: "Vous avez arrêté le vote avant la dernière main. Elle était déjà levée, la dernière. Je l'ai comptée quand même."}
  - {qui: gege, sujet: club, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Le petit Rancé, je l'ai vu jouer en poussins, ici, au terrain annexe. Il pleurait quand il perdait. Il perdait souvent."}
  - {qui: gege, sujet: sombre, si: "flag(histoire_h7) && flag(h7_bougies)", texte: "Les bougies, c'était nous. La pierre, je ne sais pas. Dans une foule, on ne sait jamais tout ce qu'on porte."}
  - {qui: gege, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "Le virage veut une minute de silence à chaque match du Racing, jusqu'à la fin de l'année. Le Racing a dit oui. La Fédération n'a pas répondu."}
  - {qui: fardelli, sujet: rumeur, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Mon petit Rancé a un rendez-vous important en novembre. Je ne dis pas lequel. Je dis seulement qu'il ne faut pas le fatiguer."}
  - {qui: fardelli, sujet: toi, si: "flag(histoire_h7) && flag(h7_fardelli_su)", texte: "Vous me l'avez dit au téléphone, à trois heures. Je vous remercie. Je ne vous le pardonne pas, mais je vous remercie."}
  - {qui: fardelli, sujet: toi, si: "flag(histoire_h7) && flag(h7_fardelli_raccroche)", texte: "Vous avez raccroché. Je l'ai appris par la radio, à sept heures. La radio, elle, ne raccroche pas."}
  - {qui: fardelli, sujet: argent, si: "flag(histoire_h7) && annee >= 2012", texte: "J'ai d'autres gamins. Ils ont tous vingt ans et des contrats de cinq ans. Plus personne ne me demande deux ans."}
  - {qui: fardelli, sujet: argent, si: "flag(histoire_h7) && flag(h7_minutes_promises)", texte: "Soixante minutes, vous m'aviez dit. J'avais vendu soixante minutes à Portclair. Je leur ai rendu l'acompte, sans intérêts."}
  - {qui: fardelli, sujet: toi, si: "flag(histoire_h7) && flag(h7_fardelli_econduit)", texte: "Vous m'aviez renvoyé à mes affaires. J'ai appelé l'hôtel tous les soirs. Mes affaires, c'était lui."}
  - {qui: fardelli, sujet: sombre, si: "flag(histoire_h7) && flag(h7_deux_ans)", texte: "Deux ans, c'est un Mondial, il disait. Je n'ai plus jamais signé un contrat de deux ans. Je ne sais pas pourquoi je vous le dis."}
  - {qui: fardelli, sujet: toi, si: "flag(histoire_h7) && flag(h7_rendez_vous_accorde)", texte: "Vous lui aviez donné le 16 novembre. Il me l'avait dit au téléphone, tout content, comme on annonce un match."}
  - {qui: aulard, sujet: club, si: "flag(histoire_h7) && annee <= 2012", texte: "Ma ville, mon hôtel, ma Fédération. Les Cobalts dorment chez moi. Le pays s'en souviendra, en bien ou en mal."}
  - {qui: aulard, sujet: toi, si: "flag(histoire_h7) && flag(h7_quatre_heures_accord) && annee <= 2012", texte: "Vous avez dit d'accord, à quatre heures. C'est rare, quelqu'un qui dit d'accord à quatre heures. D'habitude, on dit oui."}
  - {qui: aulard, sujet: toi, si: "flag(histoire_h7) && flag(h7_quatre_heures_refus) && annee <= 2012", texte: "Vous vouliez la police. Elle est venue. Vous voyez bien qu'on ne vous a rien refusé."}
  - {qui: aubert, sujet: club, si: "flag(histoire_h7) && flag(h7_hymne_chante) && annee <= 2012", texte: "Ils ont chanté. Faux, mais ils ont chanté. Le pays préfère les voix fausses aux bouches fermées."}
  - {qui: aubert, sujet: club, si: "flag(histoire_h7) && flag(h7_hymne_muet) && annee <= 2012", texte: "Je ne serai plus ministre l'an prochain. Mais je me souviendrai de qui n'a pas chanté."}

  # ═════════════════════════════════════════════ Madame Rancé, la mère de Tibo
  - {qui: rance_mere, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "Il aimait le Racing plus que la sélection. Personne ne l'a mis dans le communiqué. Je le mets sur les gerbes."}
  - {qui: rance_mere, sujet: toi, si: "flag(histoire_h7) && flag(h7_mere_standard)", texte: "Je dors avec le téléphone sur l'oreiller. Il sonnait la nuit. Il ne sonne plus, alors c'est moi qui appelle."}
  - {qui: rance_mere, sujet: toi, si: "flag(histoire_h7) && flag(h7_mere_sait)", texte: "Vous m'avez tout dit, sur le lit de mon fils. Je ne vous remercierai pas. J'ai cru ce que vous disiez, c'est déjà beaucoup."}
  - {qui: rance_mere, sujet: toi, si: "flag(histoire_h7) && flag(h7_mere_excuses)", texte: "Vos excuses, je les garde dans le même tiroir que le communiqué."}
  - {qui: rance_mere, sujet: sombre, si: "flag(histoire_h7) && annee >= 2012", texte: "On ne m'a pas rendu son téléphone. Il y a dedans dix plafonds, et une photo que je n'ai pas vue."}

  # ═══════════════════════════════════════════════════ les gens d'Aubérive
  - {qui: passante, sujet: toi, si: "flag(histoire_h7) && saison == 1", texte: "Les Cobalts à l'hôtel de la Rive ? Ma mère y faisait la plonge en 1974. Elle dit que les murs sont fins, au deuxième."}
  - {qui: fan, sujet: match, si: "flag(histoire_h7) && tribunes < 30 && annee <= 2012", texte: "Le pays vous siffle, mais ici on ne siffle pas les Cobalts. On siffle le bus. Il est garé derrière l'hôtel, vous savez."}
  - {qui: commercant, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort) && lieu == fleuriste", texte: "Des gerbes bordeaux et grises pour le petit Rancé. Il était d'ici, vous savez. Le Racing l'avait vendu gamin."}
  - {qui: enfant, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_main_vue)", texte: "Mon cousin a la photo de 1 h 47. On voit une main dans le coin. Il dit que c'est la main d'un nouveau."}
  - {qui: ancien, sujet: epoque, si: "flag(histoire_h7) && flag(h7_rossard_plateau)", texte: "Rossard a lâché le nom de Mbako à la télé. En 1990, il pleurait sur le même plateau. On l'a moins aimé, ce soir."}
  - {qui: passante, sujet: sombre, si: "flag(histoire_h7) && flag(h7_bougies)", texte: "Des bougies devant l'hôtel, et une pierre dans la fenêtre du 14. On ne sait pas qui a fait quoi. Les deux, peut-être."}
  - {qui: fan, sujet: sombre, si: "flag(histoire_h7) && flag(h7_mbako_silence)", texte: "Mbako dans le bus, la nuit, tout seul. Les chauffeurs du Terminus l'ont vu. Il pleurait comme un gamin, ils disent."}
  - {qui: fan, sujet: club, si: "flag(histoire_h7) && flag(h7_mbako_temoignera)", texte: "Mbako va parler, il paraît. Debout, devant le juge. Le mutin de 2010, debout. On aura tout vu."}
  - {qui: passant, sujet: quartier, si: "flag(histoire_h7) && flag(h7_plante)", texte: "L'hôtel ne loue plus la 12. Ils ont mis une grande plante devant la porte, pour qu'on ne voie pas le numéro."}
  - {qui: ancien, sujet: toi, si: "flag(histoire_h7) && flag(h7_cahier_lu) && lieu == tabac", texte: "Ma fille vous a ouvert son cahier. Elle ne l'ouvre pour personne. Ne lui faites pas regretter."}
  - {qui: ancien, sujet: club, si: "flag(histoire_h7) && annee >= 2013", texte: "Les Cobalts reviennent à chaque fenêtre. Ils passent devant la 12 sans regarder. Sauf un, toujours le même."}
  - {qui: passante, sujet: toi, si: "flag(histoire_h7) && flag(h7_parle_groupe)", texte: "Vous avez dit « le groupe », à la télévision. Pas « il est mort ». Ma fille m'a demandé la différence."}
  - {qui: passant, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_rance_mort) && annee == 2011", texte: "Malaise cardiaque, à vingt-cinq ans. Mon beau-frère est infirmier. Il dit que ça arrive. Il le dit d'une drôle de voix."}
  - {qui: commercant, sujet: epoque, si: "flag(histoire_h7) && flag(h7_rance_mort) && lieu == presse", texte: "L'Écho se vend deux fois plus depuis novembre. Les gens l'achètent pour la page de l'hôtel et me le rendent plié dessus."}
  - {qui: enfant, sujet: match, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Le 26 des Cobalts, c'est un gars d'ici. Il a joué au terrain annexe, comme moi. Au marché, il me reconnaît."}
  - {qui: enfant, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "À l'école, on a fait une minute de silence pour le 26. Le maître a regardé sa montre tout le long."}
  - {qui: fan, sujet: club, si: "flag(histoire_h7) && flag(h7_capitaine_mbako)", texte: "Mbako capitaine, après le bus ? Je l'ai sifflé à la télé. En vrai, devant l'hôtel, je n'ai pas pu."}
  - {qui: fan, sujet: club, si: "flag(histoire_h7) && flag(h7_capitaine_ferrol)", texte: "Un gamin de Valdorne avec le brassard des Cobalts. À Valdorne, ils ont klaxonné toute la nuit."}
  - {qui: ancien, sujet: epoque, si: "flag(histoire_h7) && annee == 2011", texte: "En 1990, les Cobalts dormaient dans un palace de la capitale. Maintenant, à la Rive. C'est une punition, ou une adresse ?"}
  - {qui: passant, sujet: argent, si: "flag(histoire_h7) && flag(h7_hotel_gratuit)", texte: "Trois ans gratuits à l'hôtel de la Rive, pour la sélection. Moi, on m'a fait payer le parking, à l'enterrement."}
  - {qui: passante, sujet: sponsor, si: "flag(histoire_h7) && flag(h7_fulgor_dit)", texte: "Vous, avec votre canette orange, au journal. Mon fils en boit trois par jour. Je lui ai dit d'arrêter, à cause de vous."}
  - {qui: commercant, sujet: achat, si: "flag(histoire_h7) && possede(montre_acier) && lieu == tailleur", texte: "Une montre gravée COBALTS ? Je ne la reprends pas, désolé. Il y en a vingt-six autres qui traînent en ville."}
  - {qui: passant, sujet: quartier, si: "flag(histoire_h7) && flag(h7_douze_effacee)", texte: "Mon frère est pompier. Il dit qu'il manque une porte sur le plan de l'hôtel de la Rive. Il le dit en riant, mais pas trop."}
  - {qui: ancien, sujet: toi, si: "flag(histoire_h7) && flag(h7_appartement_repris)", texte: "Ils vous ont repris l'appartement du quai ? J'ai vu le déménageur. Il n'a sorti qu'une valise. Vous ne viviez pas beaucoup, là-dedans."}
  - {qui: passante, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_arzel_six_heures)", texte: "La docteure de la sélection, emmenée à six heures du matin. Ma voisine a tout vu. Elle portait sa valise elle-même."}
  - {qui: fan, sujet: match, si: "flag(histoire_h7) && flag(h7_barrage_gagne)", texte: "Qualifiés, en deuil. J'ai pleuré au but, et je ne savais pas pourquoi je pleurais. Pour les deux, sûrement."}
  - {qui: fan, sujet: match, si: "flag(histoire_h7) && flag(h7_barrage_perdu)", texte: "Éliminés, et personne n'a sifflé. C'est la première fois de ma vie que je vois un stade se taire en perdant."}
  - {qui: enfant, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_vl_capture)", texte: "La capture, je l'ai vendue deux fois. La deuxième fois, c'était plus cher. Ma mère dit que c'est ça, le commerce."}
  - {qui: passant, sujet: epoque, si: "flag(histoire_h7) && annee >= 2013", texte: "Le ministre a mis la Fédération sous tutelle. À la télé, ils ont montré l'hôtel de la Rive. Pas le siège : l'hôtel."}
  - {qui: commercant, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort) && lieu == terminus", texte: "Le père du petit boit ici depuis trente ans. Il n'est pas venu à l'enterrement. Il est resté au comptoir, il a payé la tournée."}
  - {qui: ancien, sujet: quartier, si: "flag(histoire_h7) && flag(h7_bus_monte)", texte: "Le premier jour, j'ai vu quelqu'un monter dans le bus de 2010. Personne ne monte dans un bus pareil. Vous, si."}
  - {qui: fan, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_rangee_vide)", texte: "Le chauffeur du car des Cobalts boit au Terminus. Il raconte une rangée vide au milieu, de la capitale jusqu'ici, sans un mot."}
  - {qui: passante, sujet: sponsor, si: "flag(histoire_h7) && flag(h7_canette_poussee)", texte: "Vous avez poussé la canette, à la télévision. Du dos de la main. Mon mari a applaudi devant le poste, tout seul."}


  # ═══════════════════════════════════════ Tibo Rancé, vivant (la reprise)
  # On le croise à l'hôtel le soir, au terrain annexe le matin, au centre de
  # formation l'après-midi (la présence du livre 6) ; plus jamais après le 14.
  - {qui: tibo_rance, sujet: club, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Je porte le 26, le dernier numéro de la liste. Comme ça, si on me raye, personne n'a à renuméroter les autres."}
  - {qui: tibo_rance, sujet: quartier, si: "flag(histoire_h7) && !flag(h7_rance_mort) && lieu == terrain", texte: "J'ai appris ici. Le grillage avait un trou, derrière le but. On passait par là quand le gardien faisait sa sieste."}
  - {qui: tibo_rance, sujet: toi, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Ma mère vous trouve une tête à ne pas mentir. Elle dit ça de tout le monde, remarquez. Même de Fardelli."}
  - {qui: tibo_rance, sujet: match, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Soixante minutes, la docteure dit. Je compte dans ma tête. À cinquante-neuf, je fais semblant de ne pas avoir compté."}
  - {qui: tibo_rance, sujet: epoque, si: "flag(histoire_h7) && !flag(h7_rance_mort) && tranche == nuit", texte: "Je poste mon plafond, le soir. Ma mère le regarde au réveil, et elle sait que j'ai dormi. C'est notre façon de se dire bonne nuit."}
  - {qui: tibo_rance, sujet: rumeur, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Ferrol dit qu'avec ses crampons, je cours comme avant. Avant, je courais sans penser à rien. C'est ça que je voulais dire."}
  - {qui: tibo_rance, sujet: argent, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Fardelli voulait cinq ans quelque part. Moi, j'ai dit deux. Il m'a regardé comme si je lui avais rendu trop de monnaie."}
  - {qui: tibo_rance, sujet: club, si: "flag(histoire_h7) && !flag(h7_rance_mort) && flag(h7_capitaine_mbako)", texte: "Mbako capitaine, c'est bien. Dans le bus, en 2010, c'est lui qui m'a dit de m'asseoir au fond. On y était mieux, au fond."}
  - {qui: tibo_rance, sujet: toi, si: "flag(histoire_h7) && !flag(h7_rance_mort) && flag(h7_promesse_tibo)", texte: "Vous m'avez dit que je jouerais en novembre. Je l'ai écrit dans mon carnet, à côté des tournois. Les tournois, je ne vous les montre pas."}
  - {qui: tibo_rance, sujet: quartier, si: "flag(histoire_h7) && !flag(h7_rance_mort) && lieu == hotel", texte: "La 12 donne sur le terrain annexe. Je l'ai demandée par lettre, en janvier. Monsieur Escande dit que personne ne demande jamais la 12."}
  - {qui: tibo_rance, sujet: toi, si: "flag(histoire_h7) && !flag(h7_rance_mort) && flag(h7_rendez_vous_repousse)", texte: "Après le barrage, d'accord. Je l'ai déplacé dans mon carnet. Je déplace bien, j'ai l'habitude."}

  # ═══════════════════════════════════════ Bertrand Rancé, le père (la reprise)
  - {qui: bertrand_rance, sujet: club, si: "flag(histoire_h7) && !flag(h7_rance_mort) && lieu == terminus", texte: "Mon fils joue pour le pays, maintenant. Moi, je joue au Terminus. Chacun son équipe, et la mienne perd plus souvent."}
  - {qui: bertrand_rance, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "Je ne suis pas allé au cimetière. Il y avait trop de gens qui l'aimaient. Moi, je l'avais signé, à douze ans."}
  - {qui: bertrand_rance, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort) && tranche == nuit", texte: "La nuit du 14, j'ai gagné aux cartes. La seule fois de l'année. Depuis, je perds exprès, et personne n'ose me le dire."}
  - {qui: bertrand_rance, sujet: toi, si: "flag(histoire_h7) && flag(h7_signature_avouee)", texte: "Vous avez dit oui, au Terminus. Pas « c'est compliqué ». Oui. On ne me dit jamais oui, ici, sauf pour un dernier verre."}
  - {qui: bertrand_rance, sujet: argent, si: "flag(histoire_h7) && flag(h7_pere_vu)", texte: "Fardelli a réglé mon ardoise. Il croit que ça se rembourse comme ça, treize ans de dix pour cent. Il n'a pas tort, c'est ça le pire."}
  - {qui: bertrand_rance, sujet: quartier, si: "flag(histoire_h7) && flag(h7_rance_mort) && lieu == terminus", texte: "Le patron m'a gardé le tabouret du bout. Personne ne s'assoit à côté. Ils ont peur que ça s'attrape, le malheur."}

  # ═══════════════════════════════════════ les fils de la reprise
  - {qui: sandrine, sujet: sombre, si: "flag(histoire_h7) && flag(h7_reveil_six) && flag(h7_rance_mort)", texte: "Le 15 novembre, à six heures, j'ai appelé la 12, comme il me l'avait demandé. Ils ont mis mon appel dans leur procès-verbal."}
  - {qui: sandrine, sujet: toi, si: "flag(histoire_h7) && flag(h7_reveil_six) && !flag(h7_rance_mort)", texte: "Le petit m'a demandé de l'appeler à six heures. Pas le réveil, moi. Il dit que le réveil ne sait pas son prénom."}
  - {qui: benali, sujet: sombre, si: "flag(histoire_h7) && flag(h7_appel_trois)", texte: "2 h 24, la 12 appelle la 3, quarante secondes. C'est la seule ligne de cette nuit où quelqu'un a demandé de l'aide."}
  - {qui: mbako, sujet: toi, si: "flag(histoire_h7) && flag(h7_appel_trois)", texte: "J'ai appelé la 3 parce que c'est le seul numéro de chambre que je savais par cœur. En 2010, c'est elle qui passait avec les pastilles."}
  - {qui: dauzat, sujet: toi, si: "flag(histoire_h7) && flag(h7_deux_versions)", texte: "Tout à la police, rien au pays. À la Fédération, on appelle ça respecter les procédures. Je vous félicite, sincèrement."}
  - {qui: escande, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort) && mission(h7.sc.lettre_janvier)", texte: "« La 12, s'il vous plaît, si elle est libre. » J'ai relu sa lettre ce matin. Plus personne n'écrit s'il vous plaît, sur une réservation."}
  - {qui: ferrol, sujet: club, si: "flag(histoire_h7) && flag(h7_nom_confirme)", texte: "Ma main est dans le journal, avec mon nom dessous. Au marché, les gens regardent mes mains avant mon visage, maintenant."}
  - {qui: arzel, sujet: sombre, si: "flag(histoire_h7) && flag(h7_arzel_seule) && !flag(h7_arzel_six_heures)", texte: "Ma valise est faite depuis lundi. Je la défais chaque soir, et je la refais chaque matin. Ça occupe les mains."}
  - {qui: rance_mere, sujet: toi, si: "flag(histoire_h7) && flag(h7_double_mere)", texte: "Sandrine m'a donné le double. Je ne l'ai pas encore utilisé. Je le tiens dans ma poche, comme on tient une main."}
  - {qui: gege, sujet: club, si: "flag(histoire_h7) && flag(h7_rance_mort) && annee >= 2012", texte: "La bâche du 26 tient dans le local, roulée. On la sort pour les Cobalts et pour le Racing. Il était aux deux."}
  - {qui: fan, sujet: sombre, si: "flag(histoire_h7) && flag(h7_rance_mort) && lieu == terrain", texte: "Il y a un trou dans le grillage du terrain annexe, derrière le but. Quelqu'un y a glissé un 26 en carton. Personne ne le retire."}
  - {qui: passant, sujet: rumeur, si: "flag(histoire_h7) && flag(h7_reveil_six) && flag(h7_rance_mort)", texte: "Ma cousine fait le ménage à la Rive. Elle dit que la réception appelait le petit tous les matins à six heures. Le 15 aussi."}
  - {qui: enfant, sujet: toi, si: "flag(histoire_h7) && !flag(h7_rance_mort) && lieu == terrain", texte: "Tibo m'a signé mon protège-tibia. Le 26, il appuie fort. Ma mère veut le laver ; moi, je cours plus vite avec."}

# Où on les croise, sans carte (seulement ceux qui sont entrés dans ta carrière).
presences:
  - {qui: sandrine, lieu: hotel, tranches: [soir, nuit]}
  - {qui: escande, lieu: hotel, tranches: [matin, aprem]}
  - {qui: arzel, lieu: hotel, tranches: [matin]}
  - {qui: benali, lieu: hotel, tranches: [matin], si: "flag(h7_rance_mort)"}   # l'inspecteur arrive après la nuit du 14
  - {qui: dauzat, lieu: hotel, tranches: [aprem]}
  - {qui: rouvier, lieu: cabinet, tranches: [aprem]}
  - {qui: ferrol, lieu: terrain, tranches: [matin, soir]}
  - {qui: desforges, lieu: cafe_mairie, tranches: [midi]}
  - {qui: rossard, lieu: brasserie, tranches: [soir]}
  - {qui: fauvel, lieu: cafe_mairie, tranches: [matin]}
  # la mère lave encore son maillot (sa fiche) : la laverie, avant le 14 comme après
  - {qui: rance_mere, lieu: laverie, tranches: [soir]}
  # le petit, tant qu'il vit (la ville ne poste pas un mort devant une porte)
  - {qui: tibo_rance, lieu: terrain, tranches: [matin]}
  - {qui: tibo_rance, lieu: hotel, tranches: [soir]}

# Où leurs cartes les attendent quand elles ne disent pas de lieu (les visages
# propres à ce livre ; les fiches partagées avec d'autres livres n'en prennent
# pas ici, pour ne pas écrire deux fois la même clé).
rencontres:
  ferrol: terrain
  arzel: hotel
  benali: hotel
  escande: hotel
  desforges: cafe_mairie
  rance_mere: caveau

# Ce qu'on voit en poussant la porte, selon où en est le livre.
lieux_variantes:
  - {lieu: hotel, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "L'hôtel de la Rive. Le hall sent la cire. Derrière le comptoir, vingt-six crochets et vingt-six doubles ; au parking, un bus garé de travers, une banderole au pare-brise."}
  - {lieu: hotel, si: "flag(histoire_h7) && annee == 2011", texte: "L'hôtel de la Rive. Une voiture de police devant l'entrée, des journalistes sur le trottoir d'en face. Au deuxième, de la cire rouge sur une porte."}
  - {lieu: hotel, si: "flag(histoire_h7) && flag(h7_plante) && annee == 2012", texte: "L'hôtel de la Rive. Au deuxième étage, une grande plante cache une porte. Derrière l'hôtel, le bus de 2010 prend la poussière."}
  - {lieu: hotel, si: "flag(histoire_h7) && annee == 2012", texte: "L'hôtel de la Rive. La 12 reste fermée, son numéro de laiton terni. Derrière l'hôtel, le bus de 2010 attend toujours que quelqu'un paie son loueur."}
  - {lieu: hotel, si: "flag(histoire_h7) && annee >= 2013", texte: "L'hôtel de la Rive. Derrière, le parking est vide : le bus est parti. Au tableau des clés, un crochet manque, et personne ne l'a remplacé."}
  - {lieu: hotel, si: "flag(histoire_h7) && annee >= 2014", texte: "L'hôtel de la Rive. Des serrures à carte au deuxième. Derrière le comptoir, à la place du tableau des clés, un rectangle plus clair sur le papier peint."}
  - {lieu: caveau, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "Le caveau du Racing. Une gerbe bordeaux et grise, encore fraîche, sans carte, sous une plaque neuve : TIBO RANCÉ, 1986-2011."}
  - {lieu: terrain, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "Le terrain annexe du Racing. Derrière le but, le trou du grillage n'a jamais été réparé ; quelqu'un y a glissé un 26 en carton."}
  - {lieu: terrain, si: "flag(histoire_h7) && !flag(h7_rance_mort)", texte: "Le terrain annexe du Racing. Les poussins s'entraînent d'un côté, les Cobalts de l'autre ; entre les deux, un garçon en 26 qui ne sait pas de quel côté rester."}
  - {lieu: buvette, si: "flag(histoire_h7) && flag(h7_rance_mort) && annee >= 2012", texte: "La buvette des anciens. Contre le mur, une bâche roulée de trois mètres, bordeaux et grise ; on devine un 2 et un 6, à l'envers."}
  - {lieu: laverie, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "La laverie de la rue du Stade. Dans le hublot de la 4, un maillot bordeaux tourne seul, à trente degrés. Une femme en noir attend sur la chaise d'à côté."}
  - {lieu: fleuriste, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "Aux Immortelles. En vitrine, des gerbes bordeaux et grises, et un carton écrit à la main : « Pour le petit Rancé, commandes jusqu'à jeudi. »"}
  - {lieu: echo, si: "flag(histoire_h7) && flag(h7_main_vue)", texte: "La rédaction de L'Écho. Au mur, entre deux épreuves, une photo agrandie : un lit, un garçon assis, et une main entourée au feutre rouge."}
  - {lieu: terminus, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "Le Terminus. Au bout du comptoir, un homme seul devant un verre qu'il ne finit pas. Les chauffeurs le laissent tranquille : c'est le père du petit."}
  - {lieu: tabac, si: "flag(histoire_h7) && flag(h7_cahier_lu)", texte: "Le tabac du Quai. Derrière le comptoir, une vieille photo : un buraliste et sa fille sur une mobylette, en 1983. Elle sourit."}
  - {lieu: cabinet, si: "flag(histoire_h7) && flag(h7_copie_vue)", texte: "Le cabinet. Sur la table de massage, une enveloppe kraft, vide. Rouvier y range ses bandes, maintenant."}
  - {lieu: presse, si: "flag(histoire_h7) && flag(h7_rance_mort) && annee == 2011", texte: "La maison de la presse. Tous les quotidiens ont la même photo en Une : la façade de l'hôtel de la Rive, une fenêtre du deuxième entourée."}
  - {lieu: square, si: "flag(histoire_h7) && flag(h7_main_vue)", texte: "Le square des Lilas. Sur un banc, des adolescents penchés sur un téléphone, qui se taisent quand tu passes."}
