# « L'Oreillette » (Histoire 8) — ce que dit la ville, 2024-2027.
# Format : l'en-tête de content/ville/paroles_personnages.yaml. Chaque réplique
# lit le drapeau d'histoire : elle ne se dit que dans cette histoire. La ville
# sait, devine et répète l'avenir du directeur sportif à mesure que le livre
# avance : la voix, Kerdal, la date de Vaubourg, la vidéo, les courbes, la
# saisie, le petit de Nino.
#
# Conventions : aucun accord sur « tu » ou « vous » (le directeur sportif peut
# être une directrice) ; les années par `annee` (2024 = la première saison) ;
# le rang seulement après la douzième journée. Les visages nouveaux (Kerdal,
# Ober, Inès Kara) ont leur place : le terrain, le cabinet, le hall de l'hôtel
# de la Rive. Personne ne répète sa phrase de carte.
paroles:

  # ============================================================ LIAN MBAKO
  # L'entraîneur, cinquante ans. Il tutoie, il regarde courir, pas les courbes.
  - qui: mbako
    sujet: toi
    si: "flag(histoire_h8) && annee == 2024 && !flag(h8_kerdal_mort)"
    texte: "Kerdal fait un tour de plus que les autres, tous les jours. C'est pas du zèle. Chez lui, il dort pas, alors il rentre le plus tard possible."
  - qui: mbako
    sujet: toi
    si: "flag(histoire_h8) && relation.mbako >= 1"
    texte: "Mon premier entraîneur me regardait courir. Ton modèle, lui, il regarde mon cœur, la nuit. Viens me voir courir, des fois."
  - qui: mbako
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_kerdal_mort)"
    texte: "Son numéro, il est toujours dans mon téléphone. Je l'appelle pas. Je le regarde avant les séances, comme une feuille de match."
  - qui: mbako
    sujet: club
    si: "flag(histoire_h8) && flag(h8_kerdal_vit)"
    texte: "Kerdal dort douze heures avant les matchs, maintenant. Il arrive en retard à la causerie. Je lui dis rien. Jamais."
  - qui: mbako
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_kerdal_trois)"
    texte: "Trois matchs en sept jours. Je l'ai fait jouer, tu l'as signé. Dis pas que c'est la machine. Elle signe rien, elle."
  - qui: mbako
    sujet: toi
    si: "flag(histoire_h8) && !flag(h8_sans_oreillette) && !flag(h8_voiture_rendue)"
    texte: "Quand je te parle, ton œil part sur la gauche. Tu écoutes l'autre. Je parle quand même. Du bruit, j'en ai eu, dans les tribunes."
  - qui: mbako
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_sans_oreillette)"
    texte: "Tu regardes les joueurs, maintenant. Pas l'écran, eux. Je sais pas ce qui s'est passé. Je demande pas, des fois que ça reparte."
  - qui: mbako
    sujet: club
    si: "flag(histoire_h8) && flag(h8_greve_soutenue)"
    texte: "Onze jours sans match. J'ai fait courir personne. Ils ont dormi. Le premier match d'après, on a gagné. Mets-le dans ta machine."
  - qui: mbako
    sujet: club
    si: "flag(histoire_h8) && flag(h8_peyrard_vendu)"
    texte: "Le brassard de Peyrard est resté dans son casier. Personne le prend. Le plus jeune le plie et le déplie avant chaque match."
  - qui: mbako
    sujet: match
    si: "flag(histoire_h8) && serie_d >= 2"
    texte: "Ton écran va proposer des noms. Avant de les lire, viens voir l'entraînement. Une fois. Les noms, ils courent comment ?"
  - qui: mbako
    sujet: rumeur
    si: "flag(histoire_h8) && annee >= 2026"
    texte: "Le Kambara a appelé deux fois. La deuxième, j'ai pas décroché. C'est le pays de mes parents. Peut-être le mien, à la fin."

  # ======================================================== MADAME JOSIANE
  # Quatre-vingt-six ans, retraitée, qui « range encore ». Le vouvoiement, les
  # dates, les papiers ; elle avertit par un geste.
  - qui: josiane
    sujet: club
    si: "flag(histoire_h8)"
    texte: "Je range encore, à quatre-vingt-six ans. Le fonds appelle ça du bénévolat. Les cartons, je ne les laisse pas aux machines."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_cartons_promis) && !flag(h8_vl_classeur)"
    texte: "Vous aviez dit que vous monteriez au grenier. Je l'ai écrit sur le carton, avec la date. Je ne vous presse pas. Le carton non plus."
  - qui: josiane
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_classeur_lu)"
    texte: "Le petit Ferlac tapait les rapports de Barbier, en 2003. Poli comme une lettre recommandée, et il retenait tout ce qu'on lui répondait."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_classeur_range)"
    texte: "Le classeur est retourné sur l'étagère, entre les recettes et les impôts. Je ne l'ouvre pas. Je le dépoussière le vendredi."
  - qui: josiane
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_vl_classeur)"
    texte: "Les fax du grenier sont devenus blancs, le papier thermique ne tient pas. Heureusement, j'avais fait des copies."
  - qui: josiane
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_vaubourg_mort)"
    texte: "J'ai monté l'escalier sans la rampe, ce matin-là. Je ne savais pas que je pouvais encore. Je ne l'ai pas refait."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h8) && !flag(h8_vaubourg_mort)"
    texte: "Il monte à six heures et demie depuis 1977. Je le sais parce que j'arrivais à sept heures, et que sa lampe était déjà chaude."
  - qui: josiane
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_kerdal_mort)"
    texte: "Sa mère appelle le premier lundi du mois. Elle ne demande rien. Elle veut entendre quelqu'un du club dire son prénom. Je le dis."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_page_rayee)"
    texte: "J'ai rangé une photocopie de votre page quatorze, rayée, dans le classeur de 2003. C'est sa place. Les ordres et les refus ensemble."
  - qui: josiane
    sujet: argent
    si: "flag(histoire_h8) && caisse < 30"
    texte: "La masse salariale, je la recopie à la main chaque mois, à côté de celle de l'écran. Les deux ne sont jamais d'accord. La mienne est juste."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h8) && flag(h8_canne_clou)"
    texte: "Je frotte le pommeau de la canne chaque matin, avec le chiffon du bureau. Ne me demandez pas pourquoi."

  # ================================================================ GÉGÉ
  # Quatre-vingt-un ans, « le vieux » pour le virage. Le « nous » de la Nord,
  # la mémoire des promesses ; la menace sous la table.
  - qui: gege
    sujet: rumeur
    si: "flag(histoire_h8)"
    texte: "Le virage a un compte sur le Flux : le vieux. C'est moi, paraît-il. J'ai quatre-vingt-un ans, je tape avec un doigt. Celui-là."
  - qui: gege
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_compte_vieux)"
    texte: "Le compte du vieux, c'est moi. Mais ce soir-là, c'était pas moi. Quelqu'un a mon mot de passe. Je l'avais écrit sur le frigo."
  - qui: gege
    sujet: club
    si: "flag(histoire_h8) && flag(h8_vollaire_vendu)"
    texte: "La bâche de Vollaire dort dans mon coffre, entre la roue de secours et le thermos. Elle a pris l'odeur du café. Lui, il est à Halvenne."
  - qui: gege
    sujet: sponsor
    si: "flag(histoire_h8) && flag(h8_sp_cadence)"
    texte: "Les anciens comparent leurs bracelets comme des montres de communion. Le mien est dans le pot à pourboires. Il compte les pièces."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_cadence_refuse)"
    texte: "T'as dit non pour nos poignets. Ils les ont distribués quand même, avec une bière. Mais t'as dit non. Ta bière est payée jusqu'en mai."
  - qui: gege
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_kerdal_mort)"
    texte: "À la quatrième minute, chaque match, on chante son nom. Le club voulait une minute de silence. Le silence, c'est pas notre truc."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_virage_parle)"
    texte: "T'as chanté dans la Nord, sans ta machine. Faux, mais jusqu'au bout. Le reste, on le chantera pour toi."
  - qui: gege
    sujet: rumeur
    si: "flag(histoire_h8) && annee >= 2026"
    texte: "Nino a un fils, Milo. Seize ans, il court plus vite que le ballon. Si ta machine le touche, le virage chantera plus pour personne."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_milo_promis)"
    texte: "Nino m'a raconté ta promesse, sur le palier. Je l'ai crue, pour lui. Mon père en a tenu une quarante ans, à la Nord."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h8) && tribunes < 30"
    texte: "Le virage te siffle pas. Il te regarde parler à ton oreille. Monte nous voir sans elle, un samedi."
  - qui: gege
    sujet: club
    si: "flag(histoire_h8) && flag(h8_greve_soutenue)"
    texte: "Le vendredi de la grève, le stade ouvert, vide, éclairé. Le plus beau match de ma vie. Personne a perdu, pour une fois."

  # ================================================================ LÉA
  # Rédactrice en chef du Quotidien, de passage à L'Écho. Directe ; deux
  # sources ; elle échange ce qu'elle sait contre ce qu'elle cherche.
  - qui: lea
    sujet: toi
    si: "flag(histoire_h8)"
    texte: "L'équipe, elle est choisie à quelle heure ? Avant minuit, ou après ?"
  - qui: lea
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_courbes_publiees)"
    texte: "Le cœur de vos joueurs se vend quatre écus la nuit. Le vôtre, six. Vous êtes plus rare."
  - qui: lea
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_pas_la_mienne)"
    texte: "J'ai retiré votre nuit du dossier, comme vous l'avez demandé. Je l'ai gardée. Je ne publie pas tout ce que je garde."
  - qui: lea
    sujet: sponsor
    si: "flag(histoire_h8) && flag(h8_cote_vue)"
    texte: "La cote de votre milieu tombait à treize heures cinquante-huit. Deux sources, un relevé. Il m'en manque une, et c'est la vôtre."
  - qui: lea
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_video)"
    texte: "La vidéo a été faite avec votre voix, pas avec votre visage. Le visage, ils l'avaient déjà. C'est la voix qui coûtait cher."
  - qui: lea
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_oreillette_enregistre)"
    texte: "Quatre cents heures de vos nuits. Je les ai datées. À trois heures, vous parlez à quelqu'un qui vous répond. Je n'ai pas l'autre voix."
  - qui: lea
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_ines)"
    texte: "Inès Kara m'a appelée : on peut être poursuivie pour avoir lu un écran dans un micro ? J'ai dit oui. Elle a ri, elle a raccroché."
  - qui: lea
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_kerdal_mort)"
    texte: "J'ai la courbe de Kerdal, la nuit d'avant. Je ne la publierai pas tant que sa mère n'aura pas dit oui. Elle n'a pas répondu à ma lettre."
  - qui: lea
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_ligne_gardee)"
    texte: "J'ai publié sans votre ligne de 2017. Tout ce qui est dans le papier est exact. Ce qui manque, vous le savez."
  - qui: lea
    sujet: club
    si: "flag(histoire_h8) && annee >= 2026"
    texte: "Le fonds vend le Racing, ou ne le vend pas : deux sources disent oui, deux disent non. Le modèle, lui, a sûrement la réponse."
  - qui: lea
    sujet: sponsor
    si: "flag(histoire_h8) && flag(h8_sp_pari)"
    texte: "Pari-Rive change de nom l'an prochain. Les deux noms qu'ils hésitent à prendre sont des paris. Je ne vous dis pas lesquels."

  # ======================================================== LE DOCTEUR OBER
  # Le médecin du club, cinquante ans. Doux, précis sur le corps, ambigu sur
  # le reste ; Almadis le paie pour les courbes de tout le monde.
  - qui: ober
    sujet: toi
    si: "flag(histoire_h8)"
    texte: "Quinze-dix. Vous dormez combien d'heures, en ce moment ?"
  - qui: ober
    sujet: achat
    si: "flag(histoire_h8) && flag(h8_comprimes)"
    texte: "Votre pharmacien m'a appelé, vous revenez trop tôt. Je lui ai dit que le calendrier était chargé. Il a ri. Vous en prenez combien, le soir ?"
  - qui: ober
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_double_dose)"
    texte: "Un comprimé entier, c'était une exception. J'ai vu des boîtes partir comme ça, une exception par soir. Vous en êtes à combien ?"
  - qui: ober
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_courbes_gardees)"
    texte: "Votre montre ne transmet plus. Le fonds me demande pourquoi, tous les lundis. Je réponds « perdue ». C'est la seule chose que je perds bien."
  - qui: ober
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_bracelet_ote)"
    texte: "Nadia Rouvier vous a fait respirer, paraît-il. Elle me prend mes patients depuis des années. Elle me les rend en meilleur état."
  - qui: ober
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_kerdal_mort)"
    texte: "Je dors dans mon cabinet, certains soirs, sur la table d'examen. Vous rentrez chez vous à quelle heure, vous ?"
  - qui: ober
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_ober_arrete)"
    texte: "Le boîtier gris est débranché depuis mardi. La diode reste allumée. Je ne sais pas ce qu'elle envoie, maintenant, ni à qui."
  - qui: ober
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_ober_temoin)"
    texte: "Vous avez dit à la juge ce que je n'osais pas dire. Elle m'a reconvoqué jeudi. Vous dormez mieux, depuis ?"
  - qui: ober
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_ober_couvert)"
    texte: "Vous avez dit « rien ». Moi aussi. La même chose, à la même juge, à deux heures d'écart. Elle a noté les deux heures."
  - qui: ober
    sujet: club
    si: "flag(histoire_h8) && vestiaire < 30"
    texte: "Le staff vient dormir une heure sur ma table de massage. Je les laisse. Je mets un papier sur la porte : CONSULTATION."

  # ================================================ JEAN-MARIE VAUBOURG
  # Quatre-vingt-douze ans, président d'honneur. La canne, l'escalier, 1974 ;
  # il n'a jamais aimé le téléphone. Il ne parle plus après la porte.
  - qui: aulard
    sujet: club
    si: "flag(histoire_h8) && !flag(h8_vaubourg_mort)"
    texte: "Je monte à six heures et demie, depuis 1977. Avant, c'était six heures. J'ai lâché une demi-heure. Pas une marche."
  - qui: aulard
    sujet: toi
    si: "flag(histoire_h8) && !flag(h8_vaubourg_mort) && flag(h8_vaubourg_sait)"
    texte: "Votre machine sait combien de jours il me reste. Me le dites pas. Les marches, je les connais : vingt-deux."
  - qui: aulard
    sujet: club
    si: "flag(histoire_h8) && !flag(h8_vaubourg_mort) && flag(h8_bureau_cede)"
    texte: "Mon bureau ronronne, maintenant, plein d'armoires à lumières vertes. Je m'assieds au milieu, avec ma clé. Personne m'a demandé de partir."
  - qui: aulard
    sujet: club
    si: "flag(histoire_h8) && !flag(h8_vaubourg_mort) && flag(h8_bureau_garde)"
    texte: "Les machines du fonds, ils les ont mises au sous-sol, près de la chaudière. Elles chauffent le club-house. On a coupé un radiateur."
  - qui: aulard
    sujet: toi
    si: "flag(histoire_h8) && !flag(h8_vaubourg_mort) && flag(h8_chaise)"
    texte: "La chaise de 1977 grince à gauche. Asseyez-vous à droite. C'est tout ce que j'ai à vous apprendre, en matière de conseil d'administration."
  - qui: aulard
    sujet: toi
    si: "flag(histoire_h8) && !flag(h8_vaubourg_mort) && flag(h8_bracelet_vaubourg)"
    texte: "Mon poignet est nu. Il reste une marque blanche, là où était le bracelet. Ma femme avait la même, sous l'alliance."
  - qui: aulard
    sujet: toi
    si: "flag(histoire_h8) && !flag(h8_vaubourg_mort)"
    texte: "Le téléphone, j'en ai trop usé. Si vous avez quelque chose à me dire, montez."
  - qui: aulard
    sujet: club
    si: "flag(histoire_h8) && !flag(h8_vaubourg_mort) && annee >= 2025"
    texte: "Le fonds veut me descendre au rez-de-chaussée, pour mon cœur. Quarante-sept ans qu'il monte cet escalier, mon cœur. Je reste en haut."
  - qui: aulard
    sujet: epoque
    si: "flag(histoire_h8) && !flag(h8_vaubourg_mort) && tribunes < 30"
    texte: "En 1974, la Nord m'a sifflé tout un hiver. Au printemps, on finit troisièmes. Elle s'est jamais excusée. Moi non plus."
  - qui: aulard
    sujet: sombre
    si: "flag(histoire_h8) && !flag(h8_vaubourg_mort) && flag(h8_kerdal_mort)"
    texte: "Ce garçon, Kerdal. Je l'ai vu monter l'escalier une fois, pour signer. Il disait les marches tout bas, une par une. Je lui ai pas demandé pourquoi."

  # ============================================================ INÈS KARA
  # Vingt-trois ans, la voix de nuit. Elle descend à l'hôtel de la Rive le
  # dernier samedi du mois, « pour voir la ville ». Avant le hall, elle
  # vouvoie un inconnu ; après, elle tutoie.
  - qui: kara
    sujet: quartier
    si: "flag(histoire_h8) && !flag(h8_ines)"
    texte: "Vous êtes d'ici ? Je connais votre ville par cœur, les rues, le stade, la laverie. Mais en vrai, je l'avais jamais vue."
  - qui: kara
    sujet: quartier
    si: "flag(histoire_h8) && !flag(h8_ines) && annee >= 2025"
    texte: "Je descends le dernier samedi du mois. Je viens voir si les choses ressemblent à ce qu'on m'en dit, la nuit."
  - qui: kara
    sujet: toi
    si: "flag(histoire_h8) && !flag(h8_ines)"
    texte: "Votre voix me dit quelque chose. Excusez-moi. J'entends beaucoup de voix, pour mon travail. La vôtre répond, c'est rare."
  - qui: kara
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_ines)"
    texte: "La nuit, je lis. L'après-midi, j'assure des voitures, au téléphone, pour un courtier du quai. J'ai le même casque pour les deux."
  - qui: kara
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_ines)"
    texte: "Les directeurs des autres clubs, ils disent oui à tout. Toi, tu réponds. Alors l'écran m'a passé ton dossier. Les cas difficiles, c'est moi."
  - qui: kara
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_ines_aveu)"
    texte: "Je t'ai dit les pires. Y en a une que je t'ai pas dite, parce qu'elle était pas de moi. Je sais pas de qui elle était."
  - qui: kara
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_service_coupe)"
    texte: "Le service a fermé le 3. J'ai plus personne à qui lire, la nuit. Alors je lis dans ma cuisine, pour le chat."
  - qui: kara
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_ines) && flag(h8_kerdal_mort)"
    texte: "Ce lundi-là, l'écran était vide, et j'ai dit la phrase. Depuis, je me tais quand il est vide. Ça s'entend, le vide ?"
  - qui: kara
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_ines) && flag(h8_kerdal_vit)"
    texte: "Il a dormi, ton défenseur. L'écran l'a jamais cru. Moi, j'ai vu sa courbe redescendre, cette nuit-là. J'ai failli te le dire."
  - qui: kara
    sujet: epoque
    si: "flag(histoire_h8) && flag(h8_ines) && annee >= 2026"
    texte: "Ils remplacent le service de nuit par une voix qui lit rien. Elle fait tout toute seule. Elle se trompera jamais, elle."
  - qui: kara
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_ines) && flag(h8_moi)"
    texte: "T'as dit « moi », dans le noir ? Léa me l'a raconté. Y avait personne au bout du fil. Y avait toi."

  # ========================================================== ERWAN KERDAL
  # Vingt-sept ans, défenseur. Il tutoie ; il demande l'heure ; il ne parle
  # plus après le lundi.
  - qui: kerdal
    sujet: toi
    si: "flag(histoire_h8)"
    texte: "Soixante-dix matchs, l'an dernier. Je me souviens que de six. Les autres, je les ai joués en dormant debout."
  - qui: kerdal
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_kerdal_repose)"
    texte: "Tu m'as mis en tribune. J'ai regardé le match comme un supporter. On crie fort, là-haut. Tu crois qu'ils m'ont reconnu ?"
  - qui: kerdal
    sujet: match
    si: "flag(histoire_h8) && flag(h8_kerdal_trois)"
    texte: "Trois matchs en sept jours. Le troisième, je sais plus contre qui. Je demandais l'heure à l'arbitre, je me rappelle que de ça."
  - qui: kerdal
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_kerdal_boites)"
    texte: "Les boîtes du docteur sont dans mon casier. Je les ouvre pas. Je les regarde. Je peux les rendre, tu crois ?"
  - qui: kerdal
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_kerdal_vit)"
    texte: "J'ai dormi douze heures. Ma mère dit que je ronflais. Elle est restée à côté toute la nuit, avec son tricot, pour l'entendre."
  - qui: kerdal
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_kerdal_vit) && flag(h8_video)"
    texte: "La vidéo, je l'ai vue. Le type avait ta voix, pas tes mains. Toi, tu parles avec les mains. Lui, il les avait posées sur le bureau."
  - qui: kerdal
    sujet: quartier
    si: "flag(histoire_h8) && flag(h8_kerdal_vit) && flag(h8_projecteurs)"
    texte: "À trois heures, les projecteurs s'allument pour l'entretien. Je viens courir dedans, tout seul. Tu veux venir, une nuit ?"
  - qui: kerdal
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_kerdal_vit) && annee >= 2025"
    texte: "Ma courbe est toujours rouge, sur ton écran. Je l'ai vue. Je joue avec. Le rouge, c'est pas si mal, non ?"
  - qui: kerdal
    sujet: toi
    si: "flag(histoire_h8) && annee == 2024 && !flag(h8_kerdal_vit)"
    texte: "Ils disent que je suis en fin de cycle. C'est quoi, un cycle ? Moi, je connais les lundis."
  - qui: kerdal
    sujet: club
    si: "flag(histoire_h8) && flag(h8_kerdal_vit) && flag(h8_greve_soutenue)"
    texte: "Pendant la grève, j'ai dormi onze jours de suite. Pas d'un coup. Mais presque. Fauvel m'a envoyé une photo de mon propre lit."

  # ====================================================== LES GENS D'AUBÉRIVE
  - qui: passant
    sujet: toi
    si: "flag(histoire_h8) && annee == 2024"
    texte: "C'est vous qui parlez sans personne à côté, sur le quai, le matin ? Ma femme dit que c'est l'oreillette. Tout le monde en a une, maintenant."
  - qui: enfant
    sujet: quartier
    si: "flag(histoire_h8) && flag(h8_projecteurs)"
    texte: "Le stade s'est allumé cette nuit, tout seul. Mon père dit que c'est la maintenance. Ma sœur dit que c'est Kerdal qui court."
  - qui: commercant
    sujet: achat
    si: "flag(histoire_h8) && flag(h8_comprimes) && lieu == pharmacie"
    texte: "Encore une ordonnance du docteur Ober. Je vous la sers, hein. Mais l'écran dit que vous l'avez déjà eue."
  - qui: fan
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_kerdal_mort)"
    texte: "Kerdal, soixante-dix matchs l'an dernier. Trouvé entre deux bancs à la muscu. On devrait jouer moins, non ?"
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h8) && annee >= 2026"
    texte: "La grève de tous les joueurs du monde. En 1990, on aurait ri. Mon petit-fils dit que c'est la première bonne nouvelle du football."
  - qui: passante
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_video)"
    texte: "Sur le Flux, j'ai vu une vidéo où vous disiez des horreurs. Et puis ma fille m'a dit que c'était pas vous. Je sais plus ce que j'ai vu, moi."
  - qui: commercant
    sujet: achat
    si: "flag(histoire_h8) && flag(h8_voiture_rendue) && lieu == garage"
    texte: "Ils ont repris votre berline ce matin. Elle est montée toute seule sur le plateau du camion. J'ai même pas eu à la pousser."
  - qui: passant
    sujet: quartier
    si: "flag(histoire_h8) && possede(duplex_trefilerie)"
    texte: "Vous habitez à la Tréfilerie ? Mon grand-père y tirait du fil. Il disait que la sirène lui parlait la nuit. Vous dormez bien, là-bas ?"
  - qui: fan
    sujet: club
    si: "flag(histoire_h8) && flag(h8_vaubourg_mort)"
    texte: "Vaubourg, mort à son bureau à six heures et demie. On dit que le modèle avait l'heure. Mon père dit que Vaubourg avait toujours l'heure, lui."
  - qui: ancien
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_sans_oreillette)"
    texte: "Vous avez enlevé votre machine ? On vous voit regarder les gens, maintenant. On avait plus l'habitude."
  - qui: passant
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_compte_vieux)"
    texte: "Le compte du vieux a donné l'adresse de quelqu'un du Racing. Il paraît que le vieux y est pour rien. Le vieux, il paraît toujours."
  - qui: enfant
    sujet: toi
    si: "flag(histoire_h8) && !flag(h8_voiture_rendue)"
    texte: "Mon frère dit que vous avez un robot dans l'oreille. Je peux voir ? Il est petit ? Il parle comment ? Il dit des gros mots ?"
  - qui: fan
    sujet: sponsor
    si: "flag(histoire_h8) && flag(h8_sp_pari)"
    texte: "Pari-Rive me donne la compo une heure avant tout le monde, dans l'application, pour cinq écus. C'est du football ou de la météo ?"
  - qui: commercant
    sujet: sponsor
    si: "flag(histoire_h8) && flag(h8_sp_cadence) && lieu == tabac_stade"
    texte: "Les bracelets Cadence, j'en vends plus, le club les donne. Les gens me demandent comment on les enlève. Avec les dents, je leur dis."
  - qui: passante
    sujet: quartier
    si: "flag(histoire_h8) && flag(h8_laverie)"
    texte: "Le gérant de la laverie dit que quelqu'un du Racing lave la même chemise trois fois, la nuit. Les figures, il les regarde pas. Le linge, si."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h8) && flag(h8_casier_ouvert)"
    texte: "Au vestiaire, le casier 4 est resté ouvert toute la saison. Mon petit-fils dit qu'il y a des cailloux dedans. Il en a mis un."
  - qui: fan
    sujet: match
    si: "flag(histoire_h8) && serie_v >= 2"
    texte: "Quatre victoires. Le modèle l'avait prévu, paraît-il. Nous, on avait rien prévu. Alors on chante."
  - qui: passant
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_brigade)"
    texte: "La brigade financière était à la Tréfilerie à six heures. Trois blousons, quelqu'un du Racing en chemise propre. Tout l'immeuble regardait."
  - qui: commercant
    sujet: achat
    si: "flag(histoire_h8) && lieu == agence && flag(h8_voiture_rendue) && flag(h8_sp_pari)"
    texte: "Le duplex de la Tréfilerie est revenu en vitrine, après saisie. Trois fois que je le vends, en vingt ans. Il me revient toujours."
  - qui: enfant
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_oreillette_friche)"
    texte: "À la friche, y avait une petite lumière sur la palette aux bougies. Elle y est plus. Mon copain dit qu'un fantôme l'a prise."
  - qui: ancien
    sujet: epoque
    si: "flag(histoire_h8) && annee >= 2025"
    texte: "Le cœur des joueurs à la télévision, en bas de l'écran. En 1974, la peur, on la voyait sur leur figure. Et on payait pas d'abonnement."
  - qui: passant
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_pas_signe)"
    texte: "Paraît que vous avez pas vendu le petit de Nino, à minuit moins deux. Au virage, personne en parle. On chante plus fort."
  - qui: fan
    sujet: classement
    si: "flag(histoire_h8) && journee >= 12 && rang >= 15"
    texte: "{rang}, et ton modèle dit qu'on se maintient. Il le dit à qui ? Pas à nous. Nous, on regarde le tableau du kiosque."
  - qui: passante
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_kerdal_vit)"
    texte: "Ma voisine est la mère de Kerdal. Elle dit que quelqu'un du club est resté un soir sur le palier, sans sonner. Elle sait qui."
  - qui: ancien
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_cycle_trois_heures)"
    texte: "Les projecteurs à trois heures, c'est l'entretien, paraît-il. Programmé par le fonds. Ça m'empêche pas de fermer mes volets."
  - qui: passante
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_ilyas_vu)"
    texte: "Le propriétaire est venu une heure, sans enlever son manteau. Le serveur du café de la Mairie dit qu'il a même pas regardé la rivière."
  - qui: fan
    sujet: club
    si: "flag(histoire_h8) && flag(h8_club_joue)"
    texte: "Le vendredi de la grève, nos joueurs attendaient en tenue dans le couloir. Personne en face. Moi aussi, j'aurais attendu, tiens."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h8) && flag(h8_milo_rouge)"
    texte: "Une machine a mis le petit de Nino au rouge, à seize ans. À seize ans, moi, j'étais rouge tout le temps. Ça s'appelait la timidité."

  # ================================================ CE QUI REVIENT
  # Les graines des cartes qui ne reviennent pas par une carte : la ville
  # s'en souvient, trois à dix semaines plus tard.
  - qui: kerdal
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_kerdal_secret)"
    texte: "Encore douze heures, cette nuit. Je l'ai dit qu'à toi. Ma mère croit que c'est parce que je joue mieux. C'est l'inverse, non ?"
  - qui: ober
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_ober_sait)"
    texte: "J'ai gardé les quatre morceaux de votre courbe. Certains soirs, je les recolle sur mon bureau. Vous repassez quand ?"
  - qui: ober
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_ober_coupable)"
    texte: "La courbe du dimanche de Kerdal, je l'ai encore. Je ne la regarde plus. Je sais seulement dans quel tiroir elle est, et sous quoi."
  - qui: ober
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_ober_appele)"
    texte: "Le soir de Kerdal, c'est moi que vous avez appelé, pas les secours. J'y pense chaque fois que mon téléphone sonne après onze heures."
  - qui: gege
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_piege_vieux)"
    texte: "Le mot de passe est toujours sur le frigo. Le compte du vieux poste plus rien depuis ta visite. Je laisse le frigo comme il est."
  - qui: gege
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_oreillette_jetee)"
    texte: "Ta petite lumière, je l'ai revue sous le pont, un soir de basses eaux, prise dans les herbes. Elle clignotait encore. Je l'ai laissée."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_milo_sait)"
    texte: "Le petit sait, pour minuit moins deux. Il est passé à la buvette. Il a laissé sa monnaie sur le comptoir, pour toi."
  - qui: gege
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_boite_ecoutee)"
    texte: "Le soir de la boîte noire, ta fenêtre est restée allumée. De la Nord, on voyait ta tête pencher vers une épaule, comme quand on écoute."
  - qui: josiane
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_boite_renvoyee)"
    texte: "Le fonds a renvoyé votre boîte noire, tamponnée « refusé ». Je l'ai renvoyée une deuxième fois. On verra qui se lasse le premier."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h8) && flag(h8_ordres_effaces)"
    texte: "La page qui manquait, entre les blanches et les noires, je l'ai retrouvée dans ma cuisine. Blanche des deux côtés. Je la garde quand même."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h8) && flag(h8_ecrit_autre)"
    texte: "Dans mon classeur, entre deux ordres de 2003, il y a une page de votre main : GARDEZ LE 9. Je l'ai laissée là où elle était."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h8) && flag(h8_reste_auberive)"
    texte: "Le siège voulait votre bureau à la capitale. Vous gardez celui d'ici, et sa fenêtre qui ferme mal. J'ai fait changer le joint. Ne me remerciez pas."
  - qui: josiane
    sujet: club
    si: "flag(histoire_h8) && flag(h8_canne_prise)"
    texte: "La canne de monsieur Vaubourg, chez vous. Le gardien dit qu'elle tombe à six heures et demie. Je lui ai répondu qu'elle a ses habitudes."
  - qui: lea
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_dementi_dit)"
    texte: "Le soir du démenti, vous avez dit trois phrases à la caméra. Je les ai gardées. Elles étaient de vous : ça s'entendait aux hésitations."
  - qui: lea
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_nuits_ecoutees)"
    texte: "Les nuits enregistrées de votre oreillette, je les ai écoutées jusqu'au bout. Vers quatre heures, c'est vous qui parlez. La voix se tait."
  - qui: lea
    sujet: sponsor
    si: "flag(histoire_h8) && flag(h8_enveloppe_rendue)"
    texte: "L'agence de Pari-Rive du quai a gardé votre reçu, épinglé derrière le comptoir. Ils le montrent aux nouveaux, comme une curiosité."
  - qui: kara
    sujet: toi
    si: "flag(histoire_h8) && flag(h8_quelqu_un)"
    texte: "Vous avez dit que quelqu'un vous avait parlé, après le 3. J'ai pas dit le contraire. Je sais plus qui de nous deux avait raison."
  - qui: kara
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_poste_12)"
    texte: "Le poste 12, c'était le mien. Une nuit, quelqu'un a lu l'écran dans son micro, et les quarante casques l'ont répété. Le gardien croit à un défaut."
  - qui: mbako
    sujet: club
    si: "flag(histoire_h8) && flag(h8_peyrard_garde)"
    texte: "Peyrard saura jamais, pour l'offre d'une heure du matin. Il joue comme un type qu'on a gardé sans lui dire pourquoi. Moi, je sais."
  - qui: passant
    sujet: quartier
    si: "flag(histoire_h8) && flag(h8_stade_nuit)"
    texte: "C'était vous, la nuit des projecteurs, sur la pelouse ? Mon fils dit qu'il y avait deux silhouettes. Moi, j'en ai vu qu'une."
  - qui: fan
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_312)"
    texte: "Trois cent douze. Quelqu'un l'a écrit à la craie sur le mur du tunnel des joueurs. Les jardiniers l'effacent ; ça revient."
  - qui: passante
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_friche_eteinte)"
    texte: "À la friche, sous la pluie, quelqu'un a éteint une petite lumière au creux de sa main. Ma fille dit que c'était une luciole. Et que c'était vous."
  - qui: passant
    sujet: sombre
    si: "flag(histoire_h8) && flag(h8_friche_laissee)"
    texte: "À la friche, la petite lumière sur la palette a fini par s'éteindre, un jeudi. Depuis, plus personne change les piles des bougies."
  - qui: passant
    sujet: rumeur
    si: "flag(histoire_h8) && flag(h8_sv_garde)"
    texte: "À Castérac, ils ont gardé leur gardien de quarante ans. Leur directeur sportif dit qu'on le lui a conseillé sur un quai, ici. Drôle d'endroit."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h8) && flag(h8_machines_debranchees)"
    texte: "Le gardien du club-house raconte qu'une nuit les machines se sont tues toutes seules, et qu'après, dans le noir, il a entendu l'heure."
  - qui: ancien
    sujet: club
    si: "flag(histoire_h8) && flag(h8_machines_veillees)"
    texte: "Le gardien raconte qu'une nuit, près d'une diode, vous dormiez, et que vous respiriez au même rythme qu'elle. Il raconte beaucoup de choses."

# Où l'on croise les visages nouveaux, et où leurs cartes les attendent.
presences:
  - {qui: ober, lieu: cabinet, tranches: [matin, aprem]}
  - {qui: kerdal, lieu: terrain, tranches: [aprem]}
  - {qui: kara, lieu: hotel, tranches: [soir]}

rencontres:
  kerdal: terrain
  ober: cabinet
  kara: hotel

# Ce qu'on voit en entrant, selon le moment : la première vraie remplace la
# description de la porte. Le plus précis d'abord.
lieux_variantes:
  - lieu: clubhouse
    si: "flag(histoire_h8) && flag(h8_canne_clou)"
    texte: "Le club-house. Dans l'escalier, la canne de Vaubourg pend au clou de 1974, le pommeau qui brille. Sur la marche du dessous, un chiffon plié."
  - lieu: clubhouse
    si: "flag(histoire_h8) && flag(h8_vaubourg_mort)"
    texte: "Le club-house. À l'étage, la porte de l'ancien bureau reste fermée ; la chaise de 1977 fait face au bureau vide. Dans l'escalier, le clou, nu."
  - lieu: clubhouse
    si: "flag(histoire_h8)"
    texte: "Le club-house du Racing, propriété du fonds : le secrétariat en bas, l'ancien bureau du président d'honneur à l'étage, et dans l'escalier un clou sans photo."
  - lieu: stade
    si: "flag(histoire_h8) && flag(h8_projecteurs) && tranche == nuit"
    texte: "Le stade de la Rive, la nuit. À trois heures, les quatre projecteurs s'allument d'un coup sur la pelouse vide, puis s'éteignent à quatre."
  - lieu: laverie
    si: "flag(histoire_h8) && flag(h8_laverie)"
    texte: "La laverie de la rue du Stade. Sur la machine 4, un papier scotché, de l'écriture du gérant : PAS APRÈS MINUIT. La chaise en plastique est restée là."
  - lieu: laverie
    si: "flag(histoire_h8) && tranche == soir"
    texte: "La laverie, le soir : cinq machines, une chaise en plastique sous le néon. Le gérant regarde l'heure plus souvent que ses machines."
  - lieu: friche
    si: "flag(histoire_h8) && flag(h8_oreillette_friche)"
    texte: "La friche de la Tréfilerie. La palette est là, les bougies aussi. Au milieu, une place vide, de la taille d'une oreillette."
  - lieu: friche
    si: "flag(histoire_h8)"
    texte: "La friche de la Tréfilerie. Là où l'on a trouvé la voiture de Ferlac, une palette, des bougies électriques, une photo plastifiée. Les piles sont neuves."
  - lieu: agence
    si: "flag(histoire_h8) && flag(h8_voiture_rendue) && flag(h8_sp_pari)"
    texte: "L'agence Tessandier. En vitrine, la photo d'un duplex à la Tréfilerie, éclairé par en dessous : le pont roulant, la baie sur le stade. À vendre, après saisie."
  - lieu: hotel
    si: "flag(histoire_h8) && flag(h8_ines)"
    texte: "L'hôtel de la Rive. Dans le hall, deux fauteuils en skaï près du distributeur de café. Le dernier samedi du mois, l'un est pris par une parka verte."
  - lieu: cabinet
    si: "flag(histoire_h8) && flag(h8_ober_temoin)"
    texte: "Le cabinet médical. Une plaque dévissée, quatre trous dans le mur, et sur la porte un papier : CONSULTATIONS SUSPENDUES."
  - lieu: cabinet
    si: "flag(histoire_h8) && flag(h8_ober_couvert)"
    texte: "Le cabinet du docteur Ober, ouvert comme toujours. Sur le bureau, un tensiomètre neuf. Le boîtier gris a disparu ; la prise est restée."
  - lieu: muscu
    si: "flag(histoire_h8) && flag(h8_kerdal_mort)"
    texte: "La salle de muscu. Entre deux bancs, quelqu'un a posé un caillou blanc sur le tapis. On passe l'aspirateur autour."
  - lieu: garage
    si: "flag(histoire_h8) && flag(h8_voiture_rendue)"
    texte: "Le garage du Pont. Sur le parking, une berline électrique, câble branché, une étiquette de saisie sous l'essuie-glace."
  - lieu: tripot
    si: "flag(histoire_h8) && flag(h8_nom_voix)"
    texte: "L'arrière-salle du Terminus. Au mur, un dessous de verre punaisé, avec des initiales et deux heures au stylo bille : 22 H - 6 H."
  - lieu: buvette
    si: "flag(histoire_h8) && flag(h8_sp_cadence)"
    texte: "La buvette du kop. Dans le pot à pourboires, sous les pièces, un bracelet noir qui clignote encore, tout seul."
