# Histoire 9 — « Vingt degrés dedans » : ce que la ville dit pendant le livre
# (format : en-tête de content/ville/paroles_personnages.yaml). Tout lit
# `flag(histoire_h9)`. Le temps se lit par `annee` (2029 le cercueil, 2030 le
# Mondial, 2031 la minute) : la `saison` de la ville commence à 1 et ne
# distingue pas la première année de la deuxième.
#
# Les voix : Marie-Jo vouvoie et demande ; Noa tutoie son frère et vouvoie
# le banc ; Sauvan est poli jusqu'à l'os ; Sacha tutoie et compte. Aucune
# réplique n'accorde rien au protagoniste, aucune ne reprend une phrase-tic.

# Où l'on trouve les visages du livre quand leur carte ne dit pas de lieu.
rencontres:
  mariejo: boulangerie_residentiel
  vandel: stade
  sauvan: cafe_mairie
  vence: hotel

# Où on les croise, sans carte.
presences:
  - {qui: mariejo, lieu: boulangerie_residentiel, tranches: [matin, midi]}
  - {qui: vandel, lieu: stade, tranches: [aprem]}
  - {qui: sauvan, lieu: cafe_mairie, tranches: [matin, midi]}
  - {qui: sacha, lieu: appartement, tranches: [soir]}
  - {qui: vence, lieu: hotel, tranches: [aprem, soir]}

# Ce qu'on voit en entrant, quand le livre a passé par là (la première vraie).
lieux_variantes:
  - {lieu: boulangerie_residentiel, si: "flag(histoire_h9) && flag(h9_coup_de_chaleur)", texte: "La boulangerie de la rue des Lilas. Sous la photo de Kévin, une coupure du Quotidien : « Coup de chaleur ». Pour une fois, Marie-Jo l'a punaisée droite."}
  - {lieu: boulangerie_residentiel, si: "flag(histoire_h9) && flag(h9_brassard_porte)", texte: "La boulangerie de la rue des Lilas. À côté de la photo de Kévin, un brassard noir punaisé, et une page de journal : le tunnel du Dôme, en noir et blanc."}
  - {lieu: boulangerie_residentiel, si: "flag(histoire_h9) && flag(h9_depart)", texte: "La boulangerie de la rue des Lilas. La radio est sur la chaîne du Mondial, le son très bas. Marie-Jo demande le score à chaque client, puis l'oublie."}
  - {lieu: boulangerie_residentiel, si: "flag(histoire_h9)", texte: "La boulangerie de la rue des Lilas. Marie-Jo Marçais te garde une baguette. Au-dessus de la caisse, punaisée de travers, la photo de Kévin en casque de chantier."}
  - {lieu: cimetiere, si: "flag(histoire_h9) && flag(h9_plaque)", texte: "Le cimetière d'Aubérive. Sur une tombe récente, une plaque neuve : « Kévin Marçais, électricien. Mort au Dôme d'Al-Dorado. » Le mot Dôme a été regravé."}
  - {lieu: cimetiere, si: "flag(histoire_h9) && flag(h9_plaque_metier)", texte: "Le cimetière d'Aubérive. Sur une tombe récente, une plaque neuve, un seul mot sous le nom de Kévin Marçais : « Électricien ». Les lettres sont grandes."}
  - {lieu: cimetiere, si: "flag(histoire_h9) && flag(h9_exhumation)", texte: "Le cimetière d'Aubérive. Près du caveau du Racing, la terre fraîche d'une tombe qu'on a rouverte, puis refermée. Quelqu'un y a laissé une baguette."}
  - {lieu: cimetiere, si: "flag(histoire_h9)", texte: "Le cimetière d'Aubérive. Près du caveau du Racing, une tombe récente, un cercueil qu'on n'a jamais ouvert, et une baguette séchée posée en travers du marbre."}
  - {lieu: mairie, si: "flag(histoire_h9)", texte: "La mairie. Un escalier de pierre, un huissier qui demande ton nom. Au fond du couloir, le bureau qu'avait Madame Aubert ; son nom est sur une plaque, dans l'escalier."}
  - {lieu: agence, si: "flag(histoire_h9) && flag(h9_fisc) && flag(h9_cles_gardees)", texte: "Immobilier Tessandier. La terrasse du quai est revenue en vitrine, saisie : « à saisir », dit l'affichette. Madame Tessandier a choisi le mot elle-même."}
  - {lieu: agence, si: "flag(histoire_h9) && flag(h9_cles_rendues)", texte: "Immobilier Tessandier. En vitrine, un dernier étage avec terrasse, quai de la Rive, « disponible immédiatement ». Il l'est depuis des mois. Personne ne le visite."}
  - {lieu: agence, si: "flag(histoire_h9) && annee == 2030", texte: "Immobilier Tessandier. Dans la vitrine, une maquette du Dôme sous une cloche de verre, offerte par l'ambassade d'Al-Dorado. Sur le toit, des figurines en casque."}
  - {lieu: kiosque, si: "flag(histoire_h9) && flag(h9_local_force)", texte: "Le kiosque à journaux du quai. Au-dessus, la porte du local de l'association, réparée avec une planche et deux vis. Une affichette : « On recompte quand même. »"}
  - {lieu: cafe_mairie, si: "flag(histoire_h9) && annee <= 2030", texte: "Le café de la Mairie. Au fond, la table du ministère : deux tasses, toujours deux, et un homme jeune en manteau gris qui paie pour ceux qui ne restent pas."}
  - {lieu: eglise, si: "flag(histoire_h9) && annee == 2029", texte: "L'église Saint-Aubin. La nef est froide ; un cierge brûle devant une photo d'électricien en casque, glissée au pied d'une statue. Personne ne l'a retirée."}
  - {lieu: appartement, si: "flag(histoire_h9) && flag(h9_plaid)", texte: "Ton deux-pièces de la rue des Lilas. Sur le canapé, un plaid écossais qui n'est pas à toi. Tu ne l'as pas rendu. Personne ne te l'a redemandé."}
  - {lieu: appartement, si: "flag(histoire_h9)", texte: "Ton deux-pièces de la rue des Lilas, au troisième. La chaudière qui cogne. Par la fenêtre, la vitrine de la boulangerie, éclairée avant le jour."}
  - {lieu: buvette, si: "flag(histoire_h9) && flag(h9_vecchio_mort)", texte: "La buvette du kop. Sur la planche au-dessus du zinc, quelqu'un a peint « Chez Gigi ». Une paire de gants jaunes pend à un clou, entre les écharpes."}
  - {lieu: buvette, si: "flag(histoire_h9) && flag(h9_virage_dos)", texte: "La buvette du kop. Au-dessus de la tireuse, un sous-bock punaisé où l'on a dessiné un dos, avec une flèche. Gégé ne l'explique à personne."}
  - {lieu: stade, si: "flag(histoire_h9) && flag(h9_banderole)", texte: "Le stade de la Rive. Au virage Nord, une banderole roulée, attachée à la rambarde avec du fil de fer : KÉVIN MARÇAIS. On ne la déroule que les soirs de match."}
  - {lieu: marche, si: "flag(histoire_h9) && annee == 2030", texte: "La place du marché. Un écran géant de vingt mètres, monté pour le Mondial, face à la mairie. Les pigeons dorment dessus ; on ne l'allumera qu'en décembre."}
  - {lieu: clubhouse, si: "flag(histoire_h9) && flag(h9_josiane_temoin)", texte: "Le club-house. Au secrétariat, sous la vitre du bureau, une feuille tapée à la machine : des initiales, et deux heures, 23 h 40 et 23 h 52. Rien d'autre."}

paroles:
  # ═══════════════════════════════════════════════════════════ MARIE-JO
  - {qui: mariejo, sujet: toi, si: "flag(histoire_h9) && tranche == matin && annee <= 2030", texte: "Votre baguette. Vous y allez toujours, en décembre ? Je demande, c'est tout. Je demande tous les matins."}
  - {qui: mariejo, sujet: quartier, si: "flag(histoire_h9) && annee == 2029", texte: "Il faisait les livraisons à vélo, l'été. Les baguettes sous le bras. Les vieilles du quai l'attendaient à la fenêtre."}
  - {qui: mariejo, sujet: argent, si: "flag(histoire_h9) && flag(h9_four_refus)", texte: "Le four ? Il chauffe. La banque, elle, refroidit. Je paie ce que je peux, le premier du mois, en pièces."}
  - {qui: mariejo, sujet: argent, si: "flag(histoire_h9) && flag(h9_four_caution)", texte: "Votre nom est sous celui de Kévin, sur le papier de la banque. Il aurait trouvé ça drôle. Moi, pas encore."}
  - {qui: mariejo, sujet: sombre, si: "flag(histoire_h9) && flag(h9_rapport_lu)", texte: "« À l'intérieur. » Vous l'avez lu deux fois, le mot. Moi, je le relis tous les soirs, avant de fermer."}
  - {qui: mariejo, sujet: match, si: "flag(histoire_h9) && flag(h9_brassard_porte)", texte: "Je l'ai vu entrer avec. À la télévision, ils ont coupé l'image au bras. On voyait quand même. On voit toujours."}
  - {qui: mariejo, sujet: toi, si: "flag(histoire_h9) && flag(h9_brassard_rendu) && annee >= 2031", texte: "Je vous sers. Je sers tout le monde. C'est un métier où l'on ne choisit pas ses clients."}
  - {qui: mariejo, sujet: sombre, si: "flag(histoire_h9) && flag(h9_exhumation)", texte: "Ils ont monté une tente blanche, au cimetière. Il faisait froid, ils avaient des thermos. J'ai pensé : quatre degrés."}
  - {qui: mariejo, sujet: epoque, si: "flag(histoire_h9) && annee >= 2031", texte: "On dit qu'ils vont démonter le Dôme et le revendre en pièces. Qu'ils commencent par le toit."}
  - {qui: mariejo, sujet: club, si: "flag(histoire_h9) && flag(h9_seconde_manche)", texte: "L'autre manche, vous l'avez toujours ? Ne me la rendez pas. Je veux seulement savoir où elle est."}
  - {qui: mariejo, sujet: quartier, si: "flag(histoire_h9) && flag(h9_four_secret)", texte: "Je vous ai dit, pour le four. Je ne l'ai dit à personne d'autre. Même pas au curé. Lui, il m'aurait pardonné."}

  # ═══════════════════════════════════════════════════════════ NOA VANDEL
  - {qui: vandel, sujet: club, si: "flag(histoire_h9) && annee == 2029", texte: "Je le mets sous le protège-tibia gauche. Côté pied fort. Comme ça, quand je frappe, il frappe aussi."}
  - {qui: vandel, sujet: toi, si: "flag(histoire_h9) && flag(h9_brassard_attente)", texte: "Toujours pas de oui. Ni de non. Je prends ça pour un peut-être. Je joue très bien avec les peut-être."}
  - {qui: vandel, sujet: toi, si: "flag(histoire_h9) && flag(h9_brassard_permis)", texte: "Le premier qui demande, je dis que c'est vous. Personne n'a demandé. Ils savent déjà."}
  - {qui: vandel, sujet: sombre, si: "flag(histoire_h9) && flag(h9_frere_appel)", texte: "Mon frère dort à douze par chambre. Il m'a envoyé la photo du thermomètre. Je la regarde avant chaque entraînement."}
  - {qui: vandel, sujet: match, si: "flag(histoire_h9) && flag(h9_liste_a_moi)", texte: "Le médecin m'a demandé si j'étais fatigué. J'ai dit : oui, de lui. Il a noté « non »."}
  - {qui: vandel, sujet: rumeur, si: "flag(histoire_h9) && flag(h9_liste_ministere)", texte: "Fatigué. Je cours tous les matins sur le quai, pour qu'on me voie. Personne ne vient voir. Je cours quand même."}
  - {qui: vandel, sujet: sombre, si: "flag(histoire_h9) && flag(h9_voiture_brulee)", texte: "La voiture ? Assurée. Le mot sur le mur, non. Je passe devant tous les jours. Je ne sais toujours pas pour qui il est."}
  - {qui: vandel, sujet: match, si: "flag(histoire_h9) && flag(h9_brassard_porte)", texte: "Au tunnel, j'ai serré le nœud avec les dents. Le goût du tissu. Ça sentait le pain, je vous jure."}
  - {qui: vandel, sujet: toi, si: "flag(histoire_h9) && flag(h9_brassard_rendu)", texte: "Je vous l'ai donné, dans le tunnel. Je ne vous en veux pas. Je m'en veux de l'avoir donné si vite."}
  - {qui: vandel, sujet: quartier, si: "flag(histoire_h9) && annee >= 2031", texte: "Mon frère est rentré. Il refait les toits d'Aubérive. Il dit que les nôtres ont des cheminées, et que ça lui manquait."}
  - {qui: vandel, sujet: club, si: "flag(histoire_h9) && flag(h9_brassard_cache)", texte: "Il est sous le protège-tibia. Il y est bien. Il a chaud, au moins. Lui."}

  # ═══════════════════════════════════════════════════════ AYMERIC SAUVAN
  - {qui: sauvan, sujet: toi, si: "flag(histoire_h9) && annee == 2029", texte: "Un café ? Le ministère invite. Le ministère invite toujours. C'est le café qui est mauvais, ici, pas l'intention."}
  - {qui: sauvan, sujet: sponsor, si: "flag(histoire_h9) && flag(h9_montre_renvoyee)", texte: "Vous avez renvoyé la montre. C'est noté. Pas par moi : je ne note rien. Mais c'est noté."}
  - {qui: sauvan, sujet: sponsor, si: "flag(histoire_h9) && flag(h9_montre_gardee)", texte: "Elle vous va bien, la montre. Elle est à l'heure de là-bas. Vous ne l'aviez pas remarqué ? Moi, si."}
  - {qui: sauvan, sujet: rumeur, si: "flag(histoire_h9) && flag(h9_cafe_parti)", texte: "La dernière fois, votre café est resté plein. Je l'ai bu, froid. Je n'en veux à personne : c'est mon métier."}
  - {qui: sauvan, sujet: club, si: "flag(histoire_h9) && flag(h9_vestiaire_ferme)", texte: "Le ministre parle encore du vent de la Rive. Il en a fait une anecdote. Mieux vaut une anecdote qu'un dossier."}
  - {qui: sauvan, sujet: argent, si: "flag(histoire_h9) && flag(h9_fisc_suspendu)", texte: "Le contrôle ? Suspendu. Pas annulé : suspendu. Un fil, ça se suspend. Ça se coupe aussi."}
  - {qui: sauvan, sujet: sombre, si: "flag(histoire_h9) && flag(h9_page_lea)", texte: "Léa a l'heure, et l'heure a un nom. Vous savez combien coûte un contrat de gaz, à la minute ?"}
  - {qui: sauvan, sujet: epoque, si: "flag(histoire_h9) && annee >= 2031", texte: "On m'a donné un bureau. Il a une fenêtre sur la cour. On ne voit pas de stade, d'ici. C'est reposant."}
  - {qui: sauvan, sujet: toi, si: "flag(histoire_h9) && flag(h9_liste_a_moi)", texte: "Votre capitaine n'est pas fatigué, donc. Moi, je le suis. Je ne l'ai dit à personne d'autre que vous."}
  - {qui: sauvan, sujet: quartier, si: "flag(histoire_h9) && annee == 2030", texte: "Je dors à l'hôtel de la Rive, chambre onze. Je vous le dis pour que vous ne le cherchiez pas. Vous le saviez déjà."}

  # ════════════════════════════════════════════════════════════════ SACHA
  - {qui: sacha, sujet: toi, si: "flag(histoire_h9) && relation.sacha >= 1", texte: "Quatre cent douze, puis quatre cent trente. Je recompte chaque semaine. Toi, tu comptes les points. Ce n'est pas le même travail."}
  - {qui: sacha, sujet: sombre, si: "flag(histoire_h9) && flag(h9_listes_lues)", texte: "La première nuit, tu les as tous lus. Je faisais semblant de dormir. Tu as fait une pause à la page six."}
  - {qui: sacha, sujet: rumeur, si: "flag(histoire_h9) && flag(h9_local_force)", texte: "Ils ont pris les ordinateurs, pas les listes. Les listes, je les ai dans la tête. Ils ne savent pas encore forcer ça."}
  - {qui: sacha, sujet: club, si: "flag(histoire_h9) && flag(h9_brassard_porte)", texte: "J'ai vu le tunnel chez la voisine. Elle a pleuré. Moi non. J'ai noté l'heure. C'est ce que je fais."}
  - {qui: sacha, sujet: toi, si: "flag(histoire_h9) && flag(h9_brassard_rendu)", texte: "Je ne t'en veux pas. Je compte. Ça m'occupe les mains, et ça m'empêche de t'en vouloir."}
  - {qui: sacha, sujet: quartier, si: "flag(histoire_h9) && annee == 2029", texte: "Comment je compte ? Les familles écrivent. Les noms arrivent par la poste, avec des photos. Je les renvoie, après."}
  - {qui: sacha, sujet: epoque, si: "flag(histoire_h9) && annee >= 2031", texte: "Quatre cent soixante et un. Je recompte encore, mais le dimanche soir, maintenant. C'est plus calme, le dimanche."}
  - {qui: sacha, sujet: sombre, si: "flag(histoire_h9) && flag(h9_voiture_noire)", texte: "La voiture noire, je l'ai revue. Devant le local. Même plaque. Je l'ai notée en bas de la liste, sans nom."}
  - {qui: sacha, sujet: argent, si: "flag(histoire_h9) && possede(montre_or)", texte: "Ta montre retarde de deux minutes. Je l'ai vu au dîner. Ou alors c'est nous qui avançons."}
  - {qui: sacha, sujet: toi, si: "flag(histoire_h9) && flag(h9_page_six)", texte: "La page six est dans ton portefeuille. Ne la perds pas. C'est la seule qui est juste."}
  - {qui: sacha, sujet: sombre, si: "flag(histoire_h9) && flag(h9_recompte)", texte: "Dix-huit de plus depuis janvier. Je te l'ai dit un dimanche. Tu as hoché la tête comme on hoche la tête au score."}

  # ════════════════════════════════════════════════════════════════ GÉGÉ
  - {qui: gege, sujet: sombre, si: "flag(histoire_h9) && annee == 2030", texte: "Le virage ne regardera pas ce Mondial-là. On a soixante ans de matchs dans les jambes ; on peut en rater un. Celui-là, exprès."}
  - {qui: gege, sujet: club, si: "flag(histoire_h9) && flag(h9_banderole)", texte: "La banderole, on l'a peinte au local, à six. Le K était de travers. On l'a laissé : il était comme ça, le petit."}
  - {qui: gege, sujet: toi, si: "flag(histoire_h9) && flag(h9_banderole_decrochee)", texte: "Tu l'as fait décrocher. Je l'ai roulée moi-même. Elle est au local, sous les drapeaux. Elle attend."}
  - {qui: gege, sujet: achat, si: "flag(histoire_h9) && possede(electrique)", texte: "Ta voiture blanche ne fait pas de bruit. Le quartier l'entend quand même. Il entend tout, le quartier."}
  - {qui: gege, sujet: sombre, si: "flag(histoire_h9) && flag(h9_vecchio_mort) && flag(h9_fraicheur_rapportee)", texte: "La bouteille du Dôme, je suis allé la chercher sur sa table de nuit, comme il avait dit. Je ne l'ai pas bue. Je l'ai mise dans le cercueil."}
  - {qui: gege, sujet: match, si: "flag(histoire_h9) && flag(h9_virage_face)", texte: "On regardera de face. Mais si le capitaine entre bras nus, on se lève et on se retourne. Tous. Même moi, avec mon genou."}

  # ═════════════════════════════════════════════════════ MADAME JOSIANE
  - {qui: josiane, sujet: toi, si: "flag(histoire_h9) && flag(h9_cave_vue)", texte: "J'ai tapé ce procès-verbal avec deux doigts, à minuit. Je savais déjà. On sait toujours, quand on tape."}
  - {qui: josiane, sujet: quartier, si: "flag(histoire_h9) && annee == 2029", texte: "Les cartons de la cave ? Trente ans de Fédération. Je les descends un par un. À mon âge, on descend tout un par un."}
  - {qui: josiane, sujet: sombre, si: "flag(histoire_h9) && flag(h9_page_photo)", texte: "Vous avez les photos. J'ai l'original. Et j'ai mon âge : personne ne me fera taire bien longtemps."}
  - {qui: josiane, sujet: club, si: "flag(histoire_h9) && flag(h9_josiane_temoin)", texte: "Le juge m'a demandé si j'étais sûre. Je lui ai proposé de retaper la page devant lui. Il a dit non. Dommage."}
  - {qui: josiane, sujet: epoque, si: "flag(histoire_h9) && annee >= 2031", texte: "En 2010, j'ai fait une copie de trop. C'est la seule faute de ma carrière. Je ne la regrette pas."}

  # ═════════════════════════════════════════════════════════ GIGI VECCHIO
  - {qui: vecchio, sujet: toi, si: "flag(histoire_h9) && annee == 2030", texte: "Ils jouent sous un toit, maintenant ? Moi, j'ai pris la pluie quarante ans. Elle ne m'a jamais rien demandé, la pluie."}
  - {qui: vecchio, sujet: club, si: "flag(histoire_h9) && flag(h9_gants_gigi)", texte: "Mes gants sont au Mondial. Moi, je suis à la buvette. C'est dans l'ordre des choses."}
  - {qui: vecchio, sujet: match, si: "flag(histoire_h9) && flag(h9_troisieme_gigi)", texte: "Le petit plonge mieux. Il ne plonge plus trop beau. Il a compris : on plonge pour arriver, pas pour la photo."}
  - {qui: vecchio, sujet: quartier, si: "flag(histoire_h9) && annee == 2029", texte: "La neige de 1990, tout le monde la raconte. Moi, je l'ai prise sur la tête quatre-vingt-dix minutes. Je ne la raconte pas."}
  - {qui: vecchio, sujet: sombre, si: "flag(histoire_h9) && flag(h9_fraicheur_rapportee)", texte: "La bouteille du Dôme ? Sur ma table de nuit. Je la regarde avant de dormir. Elle ne transpire pas, elle."}

  # ═════════════════════════════════════════════════════════ MADAME AUBERT
  - {qui: aubert, sujet: toi, si: "flag(histoire_h9) && flag(h9_aubert_vue)", texte: "Vous repassez rue Haute ? La fenêtre est toujours ouverte. Je n'ai jamais aimé les pièces fermées."}
  - {qui: aubert, sujet: epoque, si: "flag(histoire_h9) && annee == 2029", texte: "Vingt ans maire, dix ans ministre. Les deux fois, on m'a appris la même chose : signer avant minuit."}
  - {qui: aubert, sujet: sombre, si: "flag(histoire_h9) && flag(h9_aubert_examen)", texte: "Le juge est jeune. Il croit que j'ai menti. Je n'ai jamais menti : j'ai voté. C'est différent, et c'est pire."}
  - {qui: aubert, sujet: quartier, si: "flag(histoire_h9) && annee >= 2030", texte: "D'ici, on voit le stade. Je l'ai fait rénover en 2004. Personne ne s'en souvient. C'est bien : un stade, c'est fait pour ça."}

  # ═══════════════════════════════════════════════════════════════════ LÉA
  - {qui: lea, sujet: club, si: "flag(histoire_h9) && flag(h9_listes_gardees)", texte: "J'attends après le Mondial, comme convenu. Les listes, elles, n'attendent pas : elles s'allongent."}
  - {qui: lea, sujet: sombre, si: "flag(histoire_h9) && flag(h9_page_lea)", texte: "23 h 40. J'ai vérifié l'heure avec trois personnes. Deux sont mortes. La troisième tape encore à la machine."}
  - {qui: lea, sujet: rumeur, si: "flag(histoire_h9) && flag(h9_page_gardee)", texte: "Vous gardez la page. Je garde la place, en une. Une place, ça ne se garde pas longtemps."}
  - {qui: lea, sujet: epoque, si: "flag(histoire_h9) && annee >= 2031", texte: "On me demande si j'ai eu peur. J'ai eu peur pour Josiane. Elle, elle a eu peur pour l'imprimerie."}
  - {qui: lea, sujet: club, si: "flag(histoire_h9) && flag(h9_temoignage)", texte: "Au palais, la page est passée de votre main à celle du juge. Je l'ai vue changer de main. Ça m'a suffi."}
