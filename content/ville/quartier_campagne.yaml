    texte: "Une noce remplit la salle basse. Tu paies la tournée des mariés. L'oncle du marié porte un toast à ton club, se trompe de nom, se reprend. Tout le monde lève son verre deux fois."
    textes:
      - "Une noce remplit la salle basse. Tu paies la tournée des mariés. L'oncle du marié porte un toast à ton club, se trompe de nom, se reprend. Tout le monde lève son verre deux fois."
      - "La mariée t'invite pour une valse, une seule, pour la photo. Son père t'offre une part de pièce montée dans une serviette en papier, pour la route."
