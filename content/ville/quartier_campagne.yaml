  # — L'étang
  - id: cmp_puech_peche
    lieu: etang
    label: "Pêcher à côté de Puech"
    texte: "Puech te fait signe de t'asseoir à deux planches de lui, pas une de moins. Il te prête une canne, et pendant une heure, on n'entend que les planches. Puis : « Ferre. » Tu ferres trop tard."
    textes:
      - "Puech te fait signe de t'asseoir à deux planches de lui, pas une de moins. Il te prête une canne, et pendant une heure, on n'entend que les planches. Puis : « Ferre. » Tu ferres trop tard."
      - "Le bouchon dort sur l'eau noire. Puech écrit dans son carnet : une plaque, une heure. Une voiture vient de passer au bout du chemin, et tu ne l'avais pas entendue."
      - "Une carpe, enfin. Puech la décroche, la regarde, la remet à l'eau. « Elle reviendra. Elles reviennent toutes. Les gens aussi. »"
    si: "annee <= 2012"
    avec: isidore_puech
    habitude: soin
    tranches: 1
    francs: 0
    heures: [matin, soir]
  - id: cmp_manon_ronde
    lieu: etang
    label: "La ronde de nuit de Manon"
    texte: "Manon fait le tour de l'étang en quad, phares éteints, les jumelles de nuit au cou. Tu montes derrière. Au bout du chemin, une voiture, moteur allumé, vitres pleines de buée. Manon note."
    textes:
      - "Manon fait le tour de l'étang en quad, phares éteints, les jumelles de nuit au cou. Tu montes derrière. Au bout du chemin, une voiture, moteur allumé, vitres pleines de buée. Manon note."
      - "Deux heures : un pêcheur sans carte, une lampe frontale, un filet. Manon le laisse finir sa cigarette avant de s'approcher. « On verbalise mieux les gens calmes. »"
      - "Manon coupe le moteur et écoute. Rien, puis une portière, très loin. Elle sourit dans le noir. « Les portières, c'est ce qui trahit le plus. Les gens oublient qu'elles claquent. »"
    si: "annee >= 2013"
    avec: manon_puech
    habitude: nuit
    tranches: 1
    nuit: true
    francs: 0
    heures: [soir, nuit]
  - id: cmp_etang_ponton
    lieu: etang
    label: "Au bout du ponton"
    texte: "Au bout du ponton de planches grises, les pieds au-dessus de l'eau. Rien ne bouge sur l'étang, à part un bouchon oublié contre les roseaux."
    textes:
      - "Au bout du ponton de planches grises, les pieds au-dessus de l'eau. Rien ne bouge sur l'étang, à part un bouchon oublié contre les roseaux."
      - "La barque amarrée tire doucement sur sa corde. Un héron se pose dans les roseaux, te regarde, et décide que tu ne comptes pas."
      - "L'eau est si calme qu'on y voit le clocher de la Motte à l'envers. Tu restes jusqu'à ce qu'une feuille le traverse."
    habitude: soin
    tranches: 0
    francs: 0

  # — Le stade du village
  - id: cmp_village_penalty
    lieu: stade_village
    label: "Les tirs au but du village"
    texte: "Le gardien de l'U.S. La Motte, un boucher de quarante ans, t'attend dans le but aux filets reprisés. Derrière la main courante, trois gamins parient leurs bonbons sur lui."
    textes:
      - "Le gardien de l'U.S. La Motte, un boucher de quarante ans, t'attend dans le but aux filets reprisés. Derrière la main courante, trois gamins parient leurs bonbons sur lui."
      - "Le point de penalty est marqué d'un caillou blanc. Le gardien crache dans ses gants de laine et annonce qu'il plongera à droite. Il plonge toujours à droite."
      - "Cinq tirs contre le gardien du village, un dimanche de soleil. La tribune de bois compte les buts à voix haute, et applaudit les arrêts plus fort."
    jeu: penalty
    habitude: sport
    tranches: 0
    max_jour: 2
    heures: [aprem, soir]
  - id: cmp_gassiat_chaux
    lieu: stade_village
    label: "Les lignes à la chaux"
    texte: "Jacques pousse le traceur à roulette le long du cordeau ; tu tiens le cordeau. La chaux vole et blanchit vos chaussures. « Tiens-le tendu. Une ligne de travers, et on m'en parle jusqu'à Noël. »"
    textes:
      - "Jacques pousse le traceur à roulette le long du cordeau ; tu tiens le cordeau. La chaux vole et blanchit vos chaussures. « Tiens-le tendu. Une ligne de travers, et on m'en parle jusqu'à Noël. »"
      - "Le rond central, Jacques le trace avec une corde et un piquet, comme son père. Le cercle n'est jamais rond. « Personne ne l'a jamais mesuré. Il tient depuis 1952. »"
    si: "annee <= 2010"
    avec: jacques_gassiat
    habitude: quartier
    tranches: 1
    francs: 0
    heures: [matin, aprem]
  - id: cmp_coralie_poussins
    lieu: stade_village
    label: "Les poussins du mercredi"
    texte: "Coralie te confie six poussins et un sac de ballons. Ils courent tous après le même, en grappe, et un seul regarde les buts. « Celui-là. Retiens son nom. Moi, je l'ai noté. »"
    textes:
      - "Coralie te confie six poussins et un sac de ballons. Ils courent tous après le même, en grappe, et un seul regarde les buts. « Celui-là. Retiens son nom. Moi, je l'ai noté. »"
      - "Un gamin pleure parce qu'il a marqué contre son camp. Coralie s'accroupit, lui dit quelque chose à l'oreille, et il repart en riant. Elle ne te dit pas quoi."
    si: "annee >= 2011"
    avec: coralie_gassiat
    habitude: sport
    tranches: 1
    francs: 0
    jours: [mer]
    heures: [aprem]
  - id: cmp_village_buvette
    lieu: stade_village
    label: "La buvette du dimanche"
    texte: "Dimanche, quinze heures, quarante personnes à la main courante. À la buvette, un café dans un gobelet et une part de gâteau. On commente chaque passe comme un transfert."
    textes:
      - "Dimanche, quinze heures, quarante personnes à la main courante. À la buvette, un café dans un gobelet et une part de gâteau. On commente chaque passe comme un transfert."
      - "Le tableau d'affichage est peint à la main : LOCAUX, VISITEURS, et un chiffre à la craie qu'on change en montant sur une chaise. À chaque but, la chaise grince."
      - "À la mi-temps, les anciens de la Nord qui vivent ici te parlent du match de samedi. Ils ont un avis sur tout, et ils te le donnent dans l'ordre chronologique."
    habitude: quartier
    tranches: 1
    francs: -5
    jours: [dim]
    heures: [aprem]

# ═══════════════════════════════════════════════════════════════ LES SCÈNES
# La vie des gens (gardée par le lien et bornée par leur époque), les dettes qu'on vient
# réclamer (une première fois, puis la suivante, rejouable), les fils des livres qui passent
# par la campagne (une confidence ouvre la scène : `flag(tuyau_…)`), et la vie du canton sans
# visage.
scenes:

  # ─────────────────────────────────────────────── Prosper, la ferme
  - id: cmp.sc.soulie_fermage
    titre: "Les prés du bas"
    lieu: ferme
    tranches: [matin, aprem]
    qui: prosper_soulie
    si: "relation.prosper_soulie >= 2 && annee <= 2008"
    texte: "Prosper tient une lettre recommandée du manoir : le vieux président reprend les prés du bas à la fin du bail, pour les vendre. « On les lui loue depuis 1936. Toi, il t'écoute. »"
    choix:
      - label: "Je vais parler au manoir"
        reponse: "Charles Dalmayrac t'écoute jusqu'au bout, puis déchire la lettre en deux. « Faites savoir à Soulié que je l'ai déchirée moi-même. » Il ne te raccompagne pas."
        effets: {relation: {prosper_soulie: 1, charles_dalmayrac: -1}}
      - label: "Ce n'est pas mon affaire"
        reponse: "Prosper replie la lettre dans sa veste. À l'automne, les prés du bas ont une clôture neuve et un panneau d'agence. Il trait par l'autre porte, pour ne pas les voir."
        effets: {relation: {prosper_soulie: -1}}

  - id: cmp.sc.soulie_odile
    titre: "Les pommes du bâtiment C"
    lieu: ferme
    tranches: [matin]
    qui: prosper_soulie
    si: "flag(histoire_h3) && flag(tuyau_cmp_soulie_odile) && annee <= 2008"
    texte: "Six heures, le verger des Soulié. Ta mère trie les pommes avec trois femmes du bâtiment C, les mains rouges de froid. Elle te voit au portail et baisse la tête vers la caisse."
    choix:
      - label: "Je trie avec elle"
        reponse: "Vous triez jusqu'à huit heures sans qu'elle te parle. À la fin, elle te donne la plus belle pomme de la caisse. À l'entraînement, tu arrives en retard, les mains collantes."
        effets: {relation: {odile: 1}, jauges: {direction: -1}}
      - label: "Je repars sans entrer"
        reponse: "Tu fais demi-tour avant qu'elle relève la tête. Le soir, elle pose sur la table un sac de pommes abîmées, sans un mot. Elle ne saura jamais que tu sais."

  - id: cmp.sc.soulie_dette
    titre: "La Rousse"
    lieu: ferme
    tranches: [soir, nuit]
    qui: prosper_soulie
    si: "flag(dette_prosper_soulie) && annee <= 2008"
    texte: "Onze heures du soir. Prosper t'attend dans la cour, une lampe à la main : « La Rousse vêle de travers, et le vétérinaire est coincé à Valdorne. Tu me dois une semaine de grange. C'est cette nuit. »"
    choix:
      - label: "Je tiens la lampe"
        reponse: "Deux heures dans la paille, les bras jusqu'au coude, la lampe entre les dents. Le veau respire à trois heures. Le matin, tu dors debout, et là-haut, on le remarque."
        effets: {relation: {prosper_soulie: 1}, jauges: {direction: -1}, clear: [dette_prosper_soulie]}
      - label: "Je paie un vétérinaire"
        francs: -150
        reponse: "Tu paies le vétérinaire de garde et le taxi qui le monte jusqu'ici. Le veau vit. Prosper te rend la monnaie du taxi par la poste, en timbres, sans un mot dans l'enveloppe."
        effets: {relation: {prosper_soulie: -1}, clear: [dette_prosper_soulie]}

  - id: cmp.sc.soulie_dette_bis
    titre: "La procuration"
    lieu: ferme
    tranches: [aprem]
    qui: prosper_soulie
    si: "flag(dette_prosper_soulie) && mission(cmp.sc.soulie_dette) && annee <= 2008"
    rejouable: true
    texte: "Le fils de Prosper est venu de Valdorne avec un notaire et une procuration. Prosper te fait asseoir à la table : « Dis-leur que j'ai toute ma tête. Toi, ils te croiront. On sera quittes. »"
    choix:
      - label: "Je témoigne pour lui"
        francs: -100
        reponse: "Tu racontes au notaire le match de dimanche, que Prosper t'a commenté minute par minute. Il range la procuration, et fait payer sa visite. Le fils repart sans dire au revoir."
        effets: {relation: {prosper_soulie: 1}, clear: [dette_prosper_soulie]}
      - label: "C'est une affaire de famille"
        reponse: "« C'est toi qui me devais. » Prosper signe la procuration de la main gauche, exprès, mal. Le fils l'emporte quand même. À la ferme, on parle maintenant de vendre."
        effets: {relation: {prosper_soulie: -2}, clear: [dette_prosper_soulie]}

  # ─────────────────────────────────────────────── Margaux, la ferme
  - id: cmp.sc.margaux_secheresse
    titre: "L'eau du Bois-Joli"
    roles: [entraineur, ds, president]
    lieu: ferme
    tranches: [aprem, soir]
    qui: margaux_soulie
    si: "relation.margaux_soulie >= 2 && annee >= 2018 && journee <= 6"
    texte: "Troisième été sans pluie. Margaux te montre l'abreuvoir à sec : « On m'interdit d'arroser. Le Bois-Joli arrose toutes les nuits, avec une dérogation. Tu le fais couper une semaine ? »"
    choix:
      - label: "Je fais couper l'arrosage"
        reponse: "Les terrains du Bois-Joli jaunissent en quatre jours ; les joueurs se plaignent des rebonds. Margaux remplit ses abreuvoirs. Au marché de la Motte, on dit ton nom, et pas pour se plaindre."
        effets: {relation: {margaux_soulie: 1}, jauges: {vestiaire: -1, tribunes: 1}}
      - label: "Les terrains d'abord"
        reponse: "« Les terrains d'abord. » Elle le répète au marché, mot pour mot. Une semaine plus tard, deux bêtes partent à l'abattoir avant l'heure. Elle te rend ton panier, vide."
        effets: {relation: {margaux_soulie: -1}}

  - id: cmp.sc.margaux_terres
    titre: "Les terres du manoir"
    lieu: ferme
    tranches: [aprem]
    qui: margaux_soulie
    si: "relation.margaux_soulie >= 1 && annee >= 2019 && annee <= 2022"
    texte: "Les héritiers du vieux président vendent les terres du manoir, la ferme comprise. Margaux a un dossier à la banque : « Il me faut un garant que la banque connaît. J'en connais qu'un. »"
    choix:
      - label: "Je me porte garant"
        francs: -300
        reponse: "Tu signes en bas de onze pages, et la banque garde un dépôt. Margaux achète les terres que sa famille travaille depuis 1936. Elle fait repeindre l'enseigne du portail, à l'identique."
        effets: {relation: {margaux_soulie: 1}}
      - label: "Je ne signe pour personne"
        reponse: "Elle range le dossier sans insister. Un fonds de Valdorne achète les terres et lui loue la ferme au mois. Sur le portail, sous l'enseigne, elle cloue une planche : LOCATAIRE."
        effets: {relation: {margaux_soulie: -1}}

  # ─────────────────────────────────────────────── Gustave, le Bois-Joli
  - id: cmp.sc.rigal_mur
    titre: "Le mur du fond"
    roles: [entraineur, joueur]
    lieu: centre_vert
    tranches: [soir]
    qui: gustave_rigal
    si: "relation.gustave_rigal >= 1 && annee <= 2014"
    texte: "Mise au vert, une heure du matin. Gustave tient un gamin par le col, les chaussures pleines de marne, une bouteille dans la poche. « Le mur du fond. Je l'écris dans le cahier, ou j'ai rien vu ? »"
    choix:
      - label: "Écrivez-le"
        reponse: "Gustave écrit le nom, l'heure, la bouteille, d'une écriture d'instituteur. Au petit-déjeuner, le gamin mange seul. Les autres ont compris que le cahier sert à quelque chose."
        effets: {relation: {gustave_rigal: 1}, jauges: {vestiaire: -2, direction: 1}}
      - label: "Vous n'avez rien vu"
        reponse: "Gustave lâche le col et regarde ailleurs. « Rien vu. La prochaine fois non plus, alors. » Le gamin te doit quelque chose, et tout le vestiaire le sait avant midi."
        effets: {relation: {gustave_rigal: -1}, jauges: {vestiaire: 2}}

  - id: cmp.sc.rigal_piquets
    titre: "Les piquets orange"
    roles: [president]
    lieu: centre_vert
    tranches: [matin]
    qui: gustave_rigal
    si: "relation.gustave_rigal >= 2 && annee >= 1999 && annee <= 2002"
    texte: "Sur le terrain du fond, des piquets orange tous les dix mètres. Gustave, une pioche à la main : « Les géomètres de la banque. Ils vendent mon terrain pour payer l'huissier. Je l'ai tondu trente ans. »"
    choix:
      - label: "Arrachez les piquets"
        reponse: "Gustave les arrache un à un et les range dans la guérite, en fagot. La banque envoie une lettre ; tu la gardes dans un tiroir. Le terrain du fond reste au club, pour l'instant."
        effets: {relation: {gustave_rigal: 1}, jauges: {caisse: -2, vestiaire: 1}}
      - label: "Qu'ils vendent le fond"
        reponse: "Le terrain du fond part à un promoteur, pour des pavillons. Gustave le tond une dernière fois, en diagonale, comme pour un match. Le lendemain, pour la première fois, il ne vient pas."
        effets: {relation: {gustave_rigal: -1}, jauges: {caisse: 2}}

  - id: cmp.sc.rigal_plots
    titre: "Les plots de l'autre"
    lieu: centre_vert
    tranches: [matin]
    jours: [dim]
    qui: gustave_rigal
    si: "flag(histoire_h2) && flag(tuyau_cmp_rigal_plots) && annee <= 2014"
    texte: "Dimanche, sept heures, le terrain du fond dans la brume. Vukić pose des plots, seul, aux places exactes où Roland les posait. Gustave t'a levé la barrière, un doigt sur la bouche."
    choix:
      - label: "Je pose les plots avec lui"
        reponse: "Il ne dit rien pendant vingt plots. Au vingt et unième, il corrige ta place d'un mètre. « Là. Il les voulait là. » Il ramasse tout sans avoir sifflé, et te serre la main."
        effets: {relation: {vukic: 1}}
      - label: "Je le laisse seul"
        reponse: "Tu repars avant qu'il te voie. Gustave baisse la barrière derrière toi, lentement, pour qu'elle ne grince pas. Lundi, à l'entraînement, les plots sont aux mêmes places."

  # ─────────────────────────────────────────────── Sabine, le Bois-Joli
  - id: cmp.sc.malaterre_cameras
    titre: "Les caméras des chambres"
    roles: [entraineur, ds, president]
    lieu: centre_vert
    tranches: [aprem]
    qui: sabine_malaterre
    si: "relation.sabine_malaterre >= 2 && annee >= 2019"
    texte: "Sabine pose un contrat sur la table de soins : des caméras dans les chambres du centre, pour le sommeil. Les propriétaires veulent sa signature avant vendredi. « Je signe, ou tu me couvres ? »"
    choix:
      - label: "Ne signe pas, je te couvre"
        reponse: "Elle déchire la dernière page, celle des signatures, et te la tend. Là-haut, on t'appelle le lendemain ; tu dis que c'est toi. Le soir, les joueurs ferment leur porte sans clé."
        effets: {relation: {sabine_malaterre: 1}, jauges: {direction: -2, vestiaire: 2}}
      - label: "Le contrat, c'est le contrat"
        reponse: "Elle signe sans relire. Les caméras arrivent le lundi, petites, blanches, au-dessus des portes. Le premier soir, un joueur couvre la sienne de son maillot. Le deuxième, tous."
        effets: {relation: {sabine_malaterre: -1}, jauges: {direction: 1, vestiaire: -2}}

  - id: cmp.sc.malaterre_cryo
    titre: "Trois minutes à moins cent dix"
    roles: [entraineur, ds, president]
    lieu: centre_vert
    tranches: [matin]
    qui: sabine_malaterre
    si: "relation.sabine_malaterre >= 1 && annee >= 2015"
    texte: "Un gamin de dix-sept ans est sorti bleu de la cryothérapie et s'est assis par terre. Le préparateur veut poursuivre le protocole, Sabine veut l'arrêter. Entre les deux, le gamin claque des dents."
    choix:
      - label: "On arrête la cryo"
        reponse: "Sabine cadenasse la chambre froide et accroche la clé à son cou. Le préparateur parle de retard sur la concurrence. Le gamin, lui, revient à l'entraînement le lendemain."
        effets: {relation: {sabine_malaterre: 1}, jauges: {vestiaire: -1}}
      - label: "On continue, avec un médecin"
        reponse: "Le protocole reprend, un médecin à la porte, une montre à la main. Sabine signe le registre sous ta signature, sans un mot. Elle ne t'offre plus le café de sa machine."
        effets: {relation: {sabine_malaterre: -1}, jauges: {vestiaire: 1}}

  - id: cmp.sc.malaterre_lasers
    titre: "Les lasers de la nuit"
    lieu: centre_vert
    tranches: [soir]
    qui: sabine_malaterre
    si: "flag(histoire_h10) && relation.sabine_malaterre >= 1 && annee >= 2015"
    texte: "Dix heures du soir. Sur le terrain du fond, trois hommes de Rive Capital ont planté des lasers sur pied. Sabine, la main sur la barrière : « Ils ont une autorisation. Je les laisse ? »"
    choix:
      - label: "Fermez la barrière"
        reponse: "Sabine baisse la barrière et éteint les projecteurs. Les géomètres finissent à la lampe frontale, puis renoncent. Le lendemain, le clapet sonne deux fois dans ta poche."
        effets: {relation: {sabine_malaterre: 1}, jauges: {direction: -1, vestiaire: 1}}
      - label: "Qu'ils mesurent"
        reponse: "Ils mesurent jusqu'à deux heures, au centimètre, en parlant d'autre chose. Sabine les regarde faire depuis la guérite, les bras croisés. Elle ne te rappelle pas."
        effets: {relation: {sabine_malaterre: -1}, jauges: {direction: 1}}

  # ─────────────────────────────────────────────── Charles, le manoir
  - id: cmp.sc.dalmayrac_draps
    titre: "Les meubles sous les draps"
    lieu: manoir
    tranches: [aprem]
    qui: charles_dalmayrac
    si: "relation.charles_dalmayrac >= 2 && annee <= 2015"
    texte: "Un huissier inventorie le manoir pièce par pièce, en soulevant les draps. Charles le suit, les mains dans le dos. « Le bureau de mon père part demain aux enchères. Je ne vous demande rien. »"
    choix:
      - label: "J'achète le bureau"
        francs: -600
        reponse: "Tu l'achètes sous un autre nom, à la salle des ventes de Valdorne, et tu le fais remonter au manoir. Charles ne te remercie pas. Le soir même, il y écrit une lettre de quatre pages."
        effets: {relation: {charles_dalmayrac: 1}}
      - label: "Ce ne sont que des meubles"
        reponse: "« Ce ne sont que des meubles », répète Charles, et il remet un drap sur le piano. Le bureau part chez un antiquaire de la capitale. La pièce reste vide, chauffée pour rien."
        effets: {relation: {charles_dalmayrac: -1}}

  - id: cmp.sc.dalmayrac_lettre
    titre: "Une lettre pour le virage"
    lieu: manoir
    tranches: [aprem, soir]
    qui: charles_dalmayrac
    si: "relation.charles_dalmayrac >= 1 && annee <= 2019"
    texte: "Charles te tend une enveloppe cachetée, adressée au local du virage. « 1971. Je n'ai jamais dit pourquoi j'ai vendu. Je l'ai écrit. Je ne peux pas la porter : là-bas, on me connaît. »"
    choix:
      - label: "Je la porte au local"
        reponse: "Gégé lit l'adresse, retourne l'enveloppe et la cloue sans l'ouvrir au mur du local, sous la bâche de 1971. « Elle restera là. » Il te regarde autrement, et pas mieux."
        effets: {relation: {charles_dalmayrac: 1, gege: -1}}
      - label: "Portez-la vous-même"
        reponse: "Charles range l'enveloppe dans le tiroir de son bureau, avec d'autres, toutes cachetées, toutes adressées au virage. « Il y en a une par décennie. Celle-ci ira avec les autres. »"
        effets: {relation: {charles_dalmayrac: -1}}

  - id: cmp.sc.dalmayrac_dette
    titre: "La messe de la Motte"
    lieu: manoir
    tranches: [matin]
    jours: [dim]
    qui: charles_dalmayrac
    si: "flag(dette_charles_dalmayrac) && annee <= 2019"
    texte: "Charles t'attend sur le perron, en costume, un missel à la main. « Asseyez-vous à côté de moi à la messe, au premier rang, devant le village. Je n'ai plus eu de voisin depuis 1977. »"
    choix:
      - label: "Je l'accompagne"
        reponse: "Toute l'église voit le président de 1971 et toi sur le même banc. Le lundi, un ancien de la Nord demande pourquoi, et là-haut aussi. Charles, lui, chante faux et fort."
        effets: {relation: {charles_dalmayrac: 1}, jauges: {tribunes: -1, direction: -1}, clear: [dette_charles_dalmayrac]}
      - label: "Pas devant le village"
        reponse: "Il hoche la tête et descend seul les deux marches du perron. À l'église, le premier rang reste à moitié vide. Il ne t'en parle jamais ; il ne te parle plus beaucoup."
        effets: {relation: {charles_dalmayrac: -2}, clear: [dette_charles_dalmayrac]}

  - id: cmp.sc.dalmayrac_dette_bis
    titre: "La place en loge"
    roles: [entraineur, joueur, ds, president]
    lieu: manoir
    tranches: [aprem]
    qui: charles_dalmayrac
    si: "flag(dette_charles_dalmayrac) && mission(cmp.sc.dalmayrac_dette) && annee <= 2019"
    rejouable: true
    texte: "Charles a sorti de l'armoire son écharpe de 1966. « Samedi, je voudrais voir le match d'en haut, de la loge. On m'en a fait descendre en 1977. J'aimerais y remonter, à mon pas. »"
    choix:
      - label: "Je lui obtiens une place"
        reponse: "Il monte l'escalier de la loge à son pas, sans aide. Dans la Nord, quelqu'un le reconnaît, et le virage siffle tout le premier quart d'heure. Il applaudit chaque sifflet."
        effets: {relation: {charles_dalmayrac: 1}, jauges: {tribunes: -2}, clear: [dette_charles_dalmayrac]}
      - label: "La loge est complète"
        reponse: "« Elle l'était déjà en 1977. » Il replie l'écharpe dans son papier de soie. Samedi, il écoute le match sur un vieux poste, dans le petit salon, le son au plus bas."
        effets: {relation: {charles_dalmayrac: -2}, clear: [dette_charles_dalmayrac]}

  - id: cmp.sc.dalmayrac_dette_fede
    titre: "Le dîner de la Fédération"
    roles: [selectionneur]
    lieu: manoir
    tranches: [aprem]
    qui: charles_dalmayrac
    si: "flag(dette_charles_dalmayrac) && mission(cmp.sc.dalmayrac_dette) && annee <= 2019"
    rejouable: true
    texte: "Charles a sorti son écharpe de 1966. « La Fédération donne son dîner de fin d'année, à Portclair. Je n'y suis plus invité. Vous, si. Emmenez-moi, et présentez-moi comme votre invité. »"
    choix:
      - label: "Je l'emmène"
        reponse: "À Portclair, Charles serre des mains qui ne se souvenaient plus de lui, et qui s'en souviennent en le voyant. À la Fédération, on te demande pourquoi lui. Tu ne réponds pas."
        effets: {relation: {charles_dalmayrac: 1}, jauges: {direction: -2}, clear: [dette_charles_dalmayrac]}
      - label: "Ce n'est pas le lieu"
        reponse: "« Ce n'est jamais le lieu. » Il replie l'écharpe dans son papier de soie. Le soir du dîner, il mange seul au petit salon, en costume, à l'heure du discours."
        effets: {relation: {charles_dalmayrac: -2}, clear: [dette_charles_dalmayrac]}

  # ─────────────────────────────────────────────── Régis, le manoir
  - id: cmp.sc.vaillandet_noce
    titre: "La noce sans le père"
    lieu: manoir
    tranches: [aprem, soir]
    qui: regis_vaillandet
    si: "relation.regis_vaillandet >= 2 && annee >= 2020"
    texte: "Régis tient une enveloppe épaisse. « Ma fille se marie samedi au Relais. Je suis pas invité. Là-dedans, y a l'acte du manoir, à son nom. Tu la lui portes ? Toi, elle t'ouvrira. »"
    choix:
      - label: "Je porte l'enveloppe"
        reponse: "Elle l'ouvre sur le seuil, lit, referme. « Dites-lui que je viendrai le voir. Pas samedi. » La semaine même, Régis fait repeindre la grille en vert, la couleur de sa fille."
        effets: {relation: {regis_vaillandet: 1}}
      - label: "Allez-y vous-même"
        reponse: "« Je n'y arrive pas. » Il range l'enveloppe dans le coffre. Samedi soir, de la grille, il regarde les lumières du Relais jusqu'à la fin de la noce, puis il rentre à pied."
        effets: {relation: {regis_vaillandet: -1}}

  - id: cmp.sc.vaillandet_livre
    titre: "Le livre de la vente"
    lieu: manoir
    tranches: [soir]
    qui: regis_vaillandet
    si: "relation.regis_vaillandet >= 1 && annee >= 2022"
    texte: "Un éditeur de la capitale veut les mémoires de Régis : comment il a vendu le Racing. Trois cents pages. « Y a des noms de là-haut dedans. Et le tien, deux fois. Je publie, ou je raye ? »"
    choix:
      - label: "Rayez les noms"
        reponse: "Il passe la nuit à rayer des noms au feutre, page après page. Le livre sort au printemps, plein de traits noirs. Là-haut, on le lit en cherchant sous les traits, et on te remercie."
        effets: {relation: {regis_vaillandet: -1}, jauges: {direction: 2}}
      - label: "Publiez tout"
        reponse: "Le livre sort avec tous les noms. Pendant un mois, là-haut, on ne parle que de lui, et un peu de toi. Régis t'envoie le premier exemplaire, avec une dédicace d'une ligne."
        effets: {relation: {regis_vaillandet: 1}, jauges: {direction: -2}}

  # ─────────────────────────────────────────────── Thérèse, le Relais
  - id: cmp.sc.therese_enterrement
    titre: "Le repas d'enterrement"
    lieu: auberge
    tranches: [midi, aprem]
    qui: therese_coustal
    si: "relation.therese_coustal >= 1 && annee <= 2016"
    texte: "Le Relais sert le repas d'enterrement d'un ancien de la Coupe de 1966. Thérèse te prend à part : « La famille voudrait quelqu'un du club, au café. Quelques mots. Personne est venu. »"
    choix:
      - label: "Je dis quelques mots"
        reponse: "Tu parles trois minutes, sans papier, de ce que tu sais de 1966. La veuve se lève pour t'embrasser. Dimanche, à la main courante du village, on répète tes mots, en mieux."
        effets: {relation: {therese_coustal: 1}, jauges: {tribunes: 2}}
      - label: "Je fais livrer une couronne"
        francs: -120
        reponse: "La couronne arrive au café, avec une carte écrite par le fleuriste. Thérèse la pose près de la porte. La famille la regarde comme on regarde un cadeau d'entreprise."
        effets: {relation: {therese_coustal: -1}}

  - id: cmp.sc.therese_relais
    titre: "Le Relais à vendre"
    lieu: auberge
    tranches: [aprem]
    qui: therese_coustal
    si: "relation.therese_coustal >= 2 && annee >= 2010 && annee <= 2016"
    texte: "Une chaîne de restaurants de bord de route veut racheter le Relais. Thérèse te tend le téléphone de l'entrée : « Mon petit-fils, à la capitale. Moi, il m'écoute plus. Toi, il te regarde à la télé. »"
    choix:
      - label: "Je parle à Bastien"
        reponse: "Tu lui parles vingt minutes de la cheminée, de la craie, de la chaise qui boite depuis 1962. Il ne promet rien. Deux ans plus tard, c'est lui qui écrit le plat du jour."
        effets: {relation: {therese_coustal: 1, bastien_coustal: 1}}
      - label: "Vendez, Thérèse"
        reponse: "« Vendre, à mon âge, c'est mourir avec un chèque. » Elle raccroche sans avoir parlé à son petit-fils. La chaîne revient trois fois. Elle sert ses représentants en dernier."
        effets: {relation: {therese_coustal: -1}}

  - id: cmp.sc.therese_dette
    titre: "La communion de la petite"
    lieu: auberge
    tranches: [midi, aprem]
    jours: [dim]
    qui: therese_coustal
    si: "flag(dette_therese_coustal) && annee <= 2016"
    texte: "Dimanche, la petite-nièce de Thérèse fait sa communion au Relais. Thérèse t'a gardé une chaise au bout de la grande table. « La petite salle, ça vaut bien un après-midi. Reste jusqu'au gâteau. »"
    choix:
      - label: "Je reste jusqu'au gâteau"
        reponse: "Tu signes quarante menus, tu poses avec la communiante, tu manges trois desserts. À dix-huit heures, ton rendez-vous en ville a attendu une heure, puis il est parti."
        effets: {relation: {therese_coustal: 1}, jauges: {direction: -1}, clear: [dette_therese_coustal]}
      - label: "Je fais livrer un ballon"
        francs: -50
        reponse: "Un ballon signé arrive au Relais par coursier, dans un papier de magasin. La petite le serre contre sa robe blanche. Thérèse range ta chaise vide contre le mur, sans un mot."
        effets: {relation: {therese_coustal: -2}, clear: [dette_therese_coustal]}

  - id: cmp.sc.therese_dette_bis
    titre: "L'inspecteur du jeudi"
    lieu: auberge
    tranches: [aprem]
    qui: therese_coustal
    si: "flag(dette_therese_coustal) && mission(cmp.sc.therese_dette) && annee <= 2016"
    rejouable: true
    texte: "Un inspecteur a trouvé à redire à la chambre froide : fermeture d'une semaine, en pleine saison des noces. Thérèse pose le courrier devant toi. « Un coup de fil de toi, et il repasse plus tard. »"
    choix:
      - label: "J'appelle la préfecture"
        reponse: "Tu appelles, tu insistes, tu promets une visite d'école. L'inspecteur repasse un mois plus tard et trouve une chambre froide neuve. Là-haut, on apprend que tu protèges les auberges."
        effets: {relation: {therese_coustal: 1}, jauges: {direction: -1, tribunes: 1}, clear: [dette_therese_coustal]}
      - label: "Je n'ai pas ce pouvoir"
        reponse: "« Tu l'avais. » Le Relais ferme une semaine ; deux noces partent à Valdorne. Thérèse écrit FERMÉ à la craie sur la porte, et ne t'en parle plus jamais."
        effets: {relation: {therese_coustal: -2}, clear: [dette_therese_coustal]}

  # ─────────────────────────────────────────────── Bastien, le Relais
  - id: cmp.sc.bastien_craie
    titre: "Les mots de Thérèse"
    lieu: auberge
    tranches: [midi]
    qui: bastien_coustal
    si: "relation.bastien_coustal >= 1 && annee >= 2022 && annee <= 2032"
    texte: "Bastien sert lui-même le repas d'enterrement de sa grand-mère, en tablier. Au café, il pose la craie sur ta soucoupe : « Elle disait toujours quelques mots, à la fin. Faut que quelqu'un les dise. »"
    choix:
      - label: "Je dis quelques mots"
        reponse: "Tu répètes ce qu'il t'a raconté d'elle : qui s'était marié ici, qui y avait pleuré. La salle rit, puis se tait. Sur l'ardoise, sous le plat du jour, Bastien écrit : THÉRÈSE, 1962."
        effets: {relation: {bastien_coustal: 1}, jauges: {tribunes: 1}}
      - label: "Je lui rends la craie"
        reponse: "Il garde la craie dans sa main jusqu'à la fin du service. Personne ne dit les mots. Le lendemain, l'ardoise est effacée, et le plat du jour est écrit plus droit."
        effets: {relation: {bastien_coustal: -1}}

  - id: cmp.sc.bastien_chambre
    titre: "La chambre sans réseau"
    lieu: auberge
    tranches: [soir]
    qui: bastien_coustal
    si: "flag(histoire_h8) && relation.bastien_coustal >= 1 && annee >= 2017"
    texte: "Bastien frappe à la vitre de ta voiture, sur son parking, à onze heures du soir. « Troisième fois cette semaine que tu dors là, moteur coupé. J'ai une chambre au-dessus. Y a pas de réseau. »"
    choix:
      - label: "Je prends la chambre"
        francs: -70
        reponse: "Une chambre mansardée, un lit qui grince, aucun écran. Tu dors sept heures pour la première fois depuis des mois. Au matin, un café attend devant la porte ; Bastien n'a pas frappé."
        effets: {relation: {bastien_coustal: 1}, var: {h8_nuits: "-1"}}
      - label: "Je rentre en ville"
        reponse: "Tu rentres par la départementale, les fenêtres ouvertes pour rester éveillé. Chez toi, l'oreillette t'attend sur la table de nuit. Tu ne la mets pas. Tu ne dors pas non plus."
        effets: {var: {h8_nuits: "+1"}}

  # ─────────────────────────────────────────────── Puech, l'étang
  - id: cmp.sc.puech_yeux
    titre: "Les yeux de Puech"
    lieu: etang
    tranches: [soir]
    qui: isidore_puech
    si: "relation.isidore_puech >= 2 && annee <= 2012"
    texte: "Puech te tend son carnet et un crayon. « Après le coucher du soleil, je lis plus les plaques. Les gendarmes viennent lundi. Note pour moi, ce soir. Tout ce qui vient. »"
    choix:
      - label: "Je note pour lui"
        reponse: "Tu notes trois plaques jusqu'à minuit. La troisième est celle d'un homme de ton club, qui n'a rien à faire ici. Puech relit, hoche la tête, et ne te demande pas si tu le connais."
        effets: {relation: {isidore_puech: 1}, jauges: {direction: 1}}
      - label: "Je ne note pas les gens"
        reponse: "Il reprend le carnet sans un mot. Lundi, les gendarmes trouvent une page blanche, la première en trente ans. Ils lui demandent s'il est malade. Il dit oui."
        effets: {relation: {isidore_puech: -1}}

  - id: cmp.sc.puech_page
    titre: "La page à vendre"
    roles: [entraineur, joueur, ds, president]
    lieu: etang
    tranches: [soir]
    qui: isidore_puech
    si: "relation.isidore_puech >= 1 && annee <= 2012"
    texte: "Un homme en costume attend Puech au bout du ponton, une enveloppe à la main. Il veut une page du carnet : un mardi de mars, la nuit d'une voiture de ton club. « Je vends, ou tu achètes ? »"
    choix:
      - label: "J'achète la page"
        francs: -200
        reponse: "Tu paies le double de l'enveloppe. Puech arrache la page et te la tend, pliée en quatre. L'homme en costume repart sans un mot. Sur la page, une plaque que tu connais trop bien."
        effets: {relation: {isidore_puech: 1}, jauges: {direction: 1}}
      - label: "Qu'il la vende"
        reponse: "Puech prend l'enveloppe et arrache la page sans la relire. Deux semaines plus tard, elle sort dans L'Écho, en photocopie, au milieu d'un article sur ton club."
        effets: {jauges: {direction: -2}}

  # ─────────────────────────────────────────────── Manon, l'étang
  - id: cmp.sc.manon_filet
    titre: "Le filet de nuit"
    roles: [entraineur, joueur, ds, president]
    lieu: etang
    tranches: [nuit]
    qui: manon_puech
    si: "relation.manon_puech >= 2 && annee >= 2013"
    texte: "Deux heures du matin. Manon a coincé un braconnier au bout du ponton : un des tiens, vingt ans, un filet plein de carpes qu'il revend au marché de Valdorne. « Je verbalise, ou tu le ramènes ? »"
    choix:
      - label: "Je paie, je le ramène"
        francs: -150
        reponse: "Tu paies l'amende en liquide et tu le ramènes en ville sans un mot. Au rond-point, il dit qu'il envoie l'argent à sa mère. Lundi, il court plus vite que les autres."
        effets: {relation: {manon_puech: 1}, jauges: {vestiaire: 1}}
      - label: "Verbalisez"
        reponse: "Manon écrit le procès-verbal à la lampe frontale, lentement, en lui laissant le temps de se reprendre. Le lendemain, tout le vestiaire sait qui l'a laissé verbaliser."
        effets: {jauges: {vestiaire: -2}}

  - id: cmp.sc.manon_intendant
    titre: "Le pêcheur sans carte"
    lieu: etang
    tranches: [nuit]
    qui: manon_puech
    si: "relation.manon_puech >= 1 && relation.gustave_rigal >= 1 && annee >= 2015"
    texte: "Manon a surpris un vieux qui pêche sans carte, à minuit, un trousseau à la ceinture : l'ancien intendant du Bois-Joli. « Il dit qu'il dort plus depuis qu'il a plus de ronde. Je verbalise ? »"
    choix:
      - label: "Je lui paie sa carte"
        francs: -40
        reponse: "Tu paies sa carte de pêche de l'année. Gustave la range avec ses clés, sans un mot. Désormais, la nuit, il y a deux lanternes au bout du ponton, et Manon y monte du café."
        effets: {relation: {manon_puech: 1}}
      - label: "La règle, c'est la règle"
        reponse: "Manon écrit le procès-verbal. Gustave le signe d'une écriture d'instituteur et rentre à pied par la départementale. On ne le revoit plus à l'étang."
        effets: {relation: {gustave_rigal: -1}}

  # ─────────────────────────────────────────────── Jacques, le stade du village
  - id: cmp.sc.gassiat_tribune
    titre: "La tribune condamnée"
    lieu: stade_village
    tranches: [aprem]
    qui: jacques_gassiat
    si: "relation.jacques_gassiat >= 2 && annee <= 2010"
    texte: "Un ruban rouge et blanc barre la tribune de bois, fermée par la commission de sécurité. Jacques tient l'arrêté : « Faut refaire les quatre gradins avant dimanche, ou on joue sans public. »"
    choix:
      - label: "Je paie les planches"
        francs: -400
        reponse: "Les planches arrivent le vendredi ; tu cloues avec Jacques jusqu'à la nuit, à la lampe. Dimanche, quarante personnes s'assoient sur du bois neuf qui sent la résine, et applaudissent les clous."
        effets: {relation: {jacques_gassiat: 1}, jauges: {tribunes: 1}}
      - label: "Le bois, c'est fini"
        reponse: "« Fini », répète Jacques. Dimanche, le village regarde le match debout, derrière la main courante. Le ruban reste tout l'hiver. Jacques ne le décroche pas : il le contourne."
        effets: {relation: {jacques_gassiat: -1}}

  - id: cmp.sc.gassiat_masques
    titre: "Onze visages de carton"
    lieu: stade_village
    tranches: [aprem]
    jours: [dim]
    qui: jacques_gassiat
    si: "flag(histoire_h1) && flag(h1_masques_tifo) && relation.jacques_gassiat >= 1 && annee <= 2010"
    texte: "Dimanche, l'équipe de la Motte s'aligne au coup d'envoi avec onze masques de carton à ton visage. L'arbitre refuse de siffler. Jacques, livide : « Le district va nous rayer. Dis-leur quelque chose. »"
    choix:
      - label: "Enlevez ces masques"
        reponse: "Tu passes la main courante et tu parles aux onze, un par un. Les masques finissent dans le seau de la buvette. Le match commence avec vingt minutes de retard. Personne ne rit."
        effets: {relation: {jacques_gassiat: 1}, jauges: {tribunes: -1}}
      - label: "Je repars sans rien dire"
        reponse: "L'arbitre rentre au vestiaire. Le district raye la Motte pour un mois. Le lundi, Jacques dépose les onze masques devant ta porte, dans un sac de chaux."
        effets: {relation: {jacques_gassiat: -2}, jauges: {tribunes: 1}}

  # ─────────────────────────────────────────────── Coralie, le stade du village
  - id: cmp.sc.coralie_fusion
    titre: "La fusion avec Valbrume"
    lieu: auberge
    tranches: [soir]
    qui: coralie_gassiat
    si: "relation.coralie_gassiat >= 2 && annee >= 2028"
    texte: "Assemblée de l'U.S. La Motte, dans la salle basse du Relais. Sans fusion avec Valbrume, plus d'équipe senior. Coralie te passe la parole sans prévenir : « Ils t'écouteront. Dis-leur. »"
    choix:
      - label: "Je parle pour la fusion"
        reponse: "Tu parles des gamins qui n'auront plus d'équipe à dix-huit ans. La fusion passe à trois voix. Coralie repeint le tableau d'affichage ; il manque de place pour les deux noms."
        effets: {relation: {coralie_gassiat: 1}}
      - label: "Je parle pour la Motte"
        reponse: "Tu parles du tableau peint à la main et de la tribune de 1952. La salle applaudit, et vote contre. Au printemps, l'équipe senior déclare forfait trois dimanches de suite."
        effets: {relation: {coralie_gassiat: -1}, jauges: {tribunes: 1}}

  - id: cmp.sc.coralie_gege
    titre: "Gégé au dernier gradin"
    lieu: stade_village
    tranches: [aprem]
    jours: [dim]
    qui: coralie_gassiat
    si: "flag(histoire_h10) && !flag(h10_gege_mort) && relation.coralie_gassiat >= 1 && annee >= 2011"
    texte: "Gégé est descendu du car, une couverture sur le bras. Il veut monter au dernier gradin de la tribune de bois. « Mon père a joué ici. L'année de la tribune. Je veux voir d'en haut. »"
    choix:
      - label: "Je le porte jusqu'en haut"
        reponse: "Il pèse moins que sa couverture. Au dernier gradin, il regarde le match sans un mot, puis te nomme chaque joueur de la photo de son père, qu'il garde dans son portefeuille."
        effets: {relation: {gege: 1, coralie_gassiat: 1}}
      - label: "Il verra mieux d'en bas"
        reponse: "Coralie lui installe une chaise à la main courante. Il regarde la tribune plus que le match. En partant, il dit qu'il reviendra avec quelqu'un de plus costaud."
        effets: {relation: {coralie_gassiat: -1}}

  # ─────────────────────────────────────────────── La vie du canton, sans visage
  - id: cmp.sc.campagne_vache
    titre: "Une vache sur la départementale"
    lieu: ferme
    tranches: [soir, nuit]
    qui: ancien
    texte: "Une vache est couchée au milieu de la départementale, près du calvaire. Un vieux en bottes arrive avec une lampe : « La clôture a cédé. Tu m'aides, ou tu passes ton chemin ? »"
    choix:
      - label: "Je l'aide à la ramener"
        reponse: "Une heure à pousser une bête qui ne veut pas, dans la boue, à la lampe. Le vieux te serre la main sans l'essuyer. Le lendemain, toute la Motte sait qui a ramené la Blanchette."
        effets: {jauges: {tribunes: 1}}
      - label: "Je la chasse de la route"
        francs: -100
        reponse: "Tu cries, tu frappes dans tes mains. La vache se lève d'un coup et part droit dans le maïs. Le vieux ne dit rien. La semaine suivante, au marché, on te fait payer le maïs couché."

  - id: cmp.sc.campagne_orage
    titre: "L'orage sur les bottes"
    lieu: ferme
    tranches: [aprem]
    qui: ancien
    si: "journee <= 6"
    texte: "Le ciel tourne au violet au-dessus du Bois-Joli. Dans le champ, cent bottes de paille à rentrer avant la pluie, et trois vieux pour le faire. L'un d'eux te tend une fourche sans demander."
    choix:
      - label: "Je prends la fourche"
        reponse: "La pluie vous rattrape sur la dernière botte. Le soir, tu as les bras griffés jusqu'au coude, et ton rendez-vous en ville a attendu pour rien. Ils te servent la goutte, debout, comme à ceux d'ici."
        effets: {jauges: {tribunes: 1, direction: -1}}
      - label: "Je rentre avant la pluie"
        reponse: "En partant, tu vois les trois vieux continuer sous l'orage. Le lendemain, la moitié des bottes a pris l'eau. Au Relais, on ne parle pas de toi ; on parle de la paille."
        effets: {jauges: {tribunes: -1}}

  - id: cmp.sc.campagne_derby
    titre: "Le derby du canton"
    lieu: stade_village
    tranches: [aprem]
    jours: [dim]
    qui: fan
    texte: "La Motte contre Valbrume, le derby du canton. À la soixantième, un penalty douteux ; deux pères se battent à la main courante. Le fils de l'un, sept ans, les regarde, la bouche ouverte."
    choix:
      - label: "Je les sépare"
        reponse: "Tu prends un coup de coude dans les côtes et tu ramasses une casquette. Les deux pères se serrent la main devant leurs fils. Mardi, ta photo est dans L'Écho, et là-haut, on la découpe."
        effets: {jauges: {tribunes: 2, direction: -1}}
      - label: "J'emmène le gamin"
        reponse: "Tu lui offres un chocolat chaud à la buvette pendant que les grands se calment. Il te raconte le match comme s'il l'arbitrait. Les deux pères finissent au poste de Valdorne, ensemble."
        effets: {jauges: {tribunes: 1}}

  - id: cmp.sc.campagne_sac
    titre: "Le sac de l'étang"
    roles: [entraineur, joueur, ds, president]
    lieu: etang
    tranches: [matin]
    qui: ancien
    texte: "À l'aube, un vieux pêcheur remonte un sac de toile lesté d'une pierre. Dedans, des centaines de tickets de paris détrempés, tous sur des matchs de ton équipe. « On les jette, ou tu les veux ? »"
    choix:
      - label: "Je prends le sac"
        reponse: "Tu les fais sécher sur la banquette arrière. Sur la moitié, la même écriture, le même pari : une défaite d'un but. Quelqu'un, chez toi, vend des samedis. Tu sais où chercher."
        effets: {jauges: {vestiaire: 2}}
      - label: "Rejetez-le à l'eau"
        reponse: "Le vieux relance le sac au milieu de l'étang. Il coule d'un coup. « C'est ce que je pensais. Ici, on remet à l'eau ce qui ne se mange pas. »"

  - id: cmp.sc.campagne_encheres
    titre: "Les enchères du manoir"
    lieu: manoir
    tranches: [aprem]
    qui: passant
    si: "annee >= 2019 && annee <= 2021"
    texte: "Dans la cour du manoir, on vend au marteau les meubles du vieux président. Lot quarante-deux : un fanion bordeaux de la Coupe de 1966, brodé à la main. Un collectionneur de la capitale lève la main."
    choix:
      - label: "Je surenchéris"
        francs: -300
        reponse: "Le fanion t'est adjugé au troisième coup de marteau. Le collectionneur te salue, beau joueur. Tu l'accroches où tu travailles ; les anciens viennent le regarder sans le toucher."
        effets: {jauges: {tribunes: 2}}
      - label: "Je le laisse partir"
        reponse: "Le fanion part pour la capitale dans une housse en plastique. Une semaine plus tard, il est en photo dans une vitrine, entre deux maillots d'autres clubs, avec une étiquette et un prix."
        effets: {jauges: {tribunes: -1}}

# ═══════════════════════════════════════════════════════════════ LES PAROLES
# Ce qu'on dit de la campagne, à ses lieux, et de toi quand la ville a décidé qui tu es.
paroles:
  - qui: ancien
    sujet: quartier
    si: "lieu == ferme && annee <= 2008"
    texte: "Le père Soulié a plus remis les pieds à la Rive depuis 1966. D'après lui, il entend mieux le stade de son étable qu'en tribune. Les vaches aussi, paraît-il."
  - qui: ancien
    sujet: quartier
    si: "lieu == ferme && annee >= 2030"
    texte: "Les panneaux sur la grange de la petite Soulié rapportent plus que ses vaches. Elle les garde quand même. Elle dit qu'un panneau, ça vous regarde pas rentrer."
  - qui: passant
    sujet: rumeur
    si: "lieu == manoir && annee <= 2019"
    texte: "La moitié des volets du manoir sont fermés depuis 1977. Il chauffe que trois pièces, à ce qu'on dit, et la nuit, il téléphone à des gens qui sont morts."
  - qui: passant
    sujet: rumeur
    si: "lieu == manoir && annee >= 2020"
