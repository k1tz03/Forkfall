    francs: 0
    heures: [soir]
  - id: cmp_margaux_panier
    lieu: ferme
    label: "Le panier de Margaux"
    texte: "Margaux te tend le panier de la semaine : des légumes avec leur terre, une douzaine d'œufs, un pot de miel du verger. « Et tu me le rapportes, le panier. J'en ai perdu six cette année. »"
    textes:
      - "Margaux te tend le panier de la semaine : des légumes avec leur terre, une douzaine d'œufs, un pot de miel du verger. « Et tu me le rapportes, le panier. J'en ai perdu six cette année. »"
      - "Elle pèse les pommes de terre sur la vieille balance à poids de fonte de son grand-père. « L'électronique est dans le tiroir. Elle triche moins, mais elle ne parle à personne. »"
      - "Au fond du panier, un bocal sans étiquette : de la gelée de coings. « Pour chez toi. En ville, plus personne ne sait ce que c'est qu'un coing. Vous allez apprendre. »"
