  - id: cmp_ferme_oeufs
    lieu: ferme
    label: "Des œufs au portail"
    texte: "Au portail de la ferme, une caisse d'œufs sous un torchon et une boîte à sucre pour la monnaie. Personne ne surveille. Tu comptes tes pièces deux fois, sans savoir pourquoi."
    textes:
      - "Au portail de la ferme, une caisse d'œufs sous un torchon et une boîte à sucre pour la monnaie. Personne ne surveille. Tu comptes tes pièces deux fois, sans savoir pourquoi."
      - "Sur la caisse, une ardoise : OEUFS FRAIS, et le prix à la craie, corrigé trois fois. Dans la boîte à sucre, un billet plié avec un mot : « Pour la semaine dernière. »"
      - "Un chien sort de la cour, renifle tes chaussures et repart sans aboyer. C'est sa façon de dire que tu peux prendre les œufs."
    habitude: famille
    tranches: 0
    francs: -6
  - id: cmp_ferme_moisson
    lieu: ferme
    label: "Une journée de moisson"
    texte: "Une journée à charger des bottes sur la remorque, derrière le tracteur rouge. À midi, la soupe sur la table de la cour ; le soir, des mains en sang et un billet plié dans ta poche."
    textes:
      - "Une journée à charger des bottes sur la remorque, derrière le tracteur rouge. À midi, la soupe sur la table de la cour ; le soir, des mains en sang et un billet plié dans ta poche."
      - "On te met sur la remorque à empiler les bottes, parce que tu as des jambes. Les anciens te regardent faire et disent que de leur temps, les gens du football travaillaient l'été."
      - "La poussière du blé dans la gorge jusqu'au soir. Personne ne te reconnaît à la Motte : ici, tu es la paire de bras de l'après-midi, et on te paie comme les autres."
    roles: [joueur, entraineur]
    si: "division >= 2 && journee <= 4"
    habitude: travail
    tranches: 2
    francs: 120
    max_jour: 1
    heures: [matin]

  # — Le centre du Bois-Joli
  - id: cmp_rigal_ronde
    lieu: centre_vert
    label: "La ronde des clés"
    texte: "Gustave fait la ronde du soir, le trousseau à la ceinture. Il frappe deux coups à chaque porte et note la réponse dans le cahier. Tu portes la lampe ; il ne te demande pas ton avis."
    textes:
      - "Gustave fait la ronde du soir, le trousseau à la ceinture. Il frappe deux coups à chaque porte et note la réponse dans le cahier. Tu portes la lampe ; il ne te demande pas ton avis."
      - "Couloir des chambres, vingt-deux heures. Derrière une porte, une radio ; derrière une autre, quelqu'un qui parle bas. Gustave note les deux, d'une écriture d'instituteur."
      - "La ronde finit au fond du bois, devant le mur. Gustave éclaire le haut, où la mousse est arrachée en deux endroits. « Deux, cette semaine. Je sais lesquels. Eux ne savent pas que je sais. »"
    si: "annee <= 2014"
    avec: gustave_rigal
    habitude: travail
    tranches: 1
    francs: 0
    heures: [soir]
  - id: cmp_rigal_guerite
    lieu: centre_vert
    label: "Un café à la guérite"
    texte: "Gustave sert le café de son thermos dans le capuchon et te donne la tasse. Par la vitre de la guérite, il regarde arriver le car et compte les têtes avant qu'elles descendent."
    textes:
      - "Gustave sert le café de son thermos dans le capuchon et te donne la tasse. Par la vitre de la guérite, il regarde arriver le car et compte les têtes avant qu'elles descendent."
      - "Au mur de la guérite, la photo de l'équipe de 1966, un genou bandé au premier rang. Gustave tapote le genou du doigt. « Trois points. J'ai joué quand même. On jouait quand même. »"
    si: "annee <= 2014"
    avec: gustave_rigal
    habitude: quartier
    tranches: 0
    francs: 0
    heures: [matin, midi]
  - id: cmp_malaterre_froid
    lieu: centre_vert
    label: "Le bain froid avec Sabine"
    texte: "Sabine te fait entrer dans le bain à quatre degrés et déclenche le chronomètre. « Trois minutes. Ne parle pas, ça réchauffe. » Elle regarde ta poitrine se soulever, le chronomètre dans la paume."
    textes:
      - "Sabine te fait entrer dans le bain à quatre degrés et déclenche le chronomètre. « Trois minutes. Ne parle pas, ça réchauffe. » Elle regarde ta poitrine se soulever, le chronomètre dans la paume."
      - "Dans la salle de soins, des capteurs clignotent sur des corps allongés. Sabine en éteint deux pour toi, sans un mot. « Une heure sans capteur. Ici, c'est le vrai luxe. »"
      - "Sabine note ta respiration sur une tablette, puis la range. « Tu dors mal. Pas besoin de capteur pour le voir. Les joueurs non plus : ils te regardent les yeux. »"
    si: "annee >= 2015"
    avec: sabine_malaterre
    habitude: soin
    tranches: 1
    francs: 0
    heures: [matin, aprem]
  - id: cmp_boisjoli_footing
    lieu: centre_vert
    label: "Le tour du bois"
    texte: "Le sentier fait le tour du Bois-Joli entre les chênes et les terrains, quatre kilomètres de racines. Tu comptes les tours aux peupliers de l'entrée. Au dernier, tu as les mollets en bois."
    textes:
      - "Le sentier fait le tour du Bois-Joli entre les chênes et les terrains, quatre kilomètres de racines. Tu comptes les tours aux peupliers de l'entrée. Au dernier, tu as les mollets en bois."
      - "Tu cours derrière le mur du fond, là où les gamins le franchissent. La mousse est arrachée en deux endroits, à hauteur de main. Tu ralentis, puis tu repars."
      - "Au troisième tour, le car du club passe dans l'allée. Quelqu'un te fait signe derrière la vitre. Tu ne vois pas qui ; tu fais signe quand même."
    habitude: sport
    tranches: 1
    francs: 0
    heures: [matin, aprem, soir]
  - id: cmp_boisjoli_vert
    lieu: centre_vert
    label: "Mettre le groupe au vert"
    texte: "Deux jours au Bois-Joli avant le match : les chambres simples, la télé débranchée, la soupe à dix-neuf heures. Le groupe râle le premier soir, et dort le second."
    textes:
      - "Deux jours au Bois-Joli avant le match : les chambres simples, la télé débranchée, la soupe à dix-neuf heures. Le groupe râle le premier soir, et dort le second."
      - "Le car dépose le groupe devant la marquise. Tu distribues les clés toi-même, chambre par chambre, en séparant ceux qui ne se parlent plus. Ils comprennent tout de suite."
      - "Le soir, au salon, une partie de cartes s'organise sans toi. Tu restes une minute à la porte, puis tu vas te coucher. C'est ce que tu peux faire de mieux pour elle."
    roles: [entraineur, selectionneur]
    habitude: travail
    tranches: 2
    francs: 0
    jauges: {vestiaire: 1, caisse: -1}
    heures: [matin, midi, aprem]

  # — Le manoir de la Motte
  - id: cmp_dalmayrac_the
    lieu: manoir
    label: "Le thé du vieux président"
    texte: "Charles sert le thé lui-même dans le petit salon, le seul qu'il chauffe, sous un portrait de son père. Il parle de 1962 avec des chiffres, les recettes, les primes, l'affluence du dernier match."
    textes:
      - "Charles sert le thé lui-même dans le petit salon, le seul qu'il chauffe, sous un portrait de son père. Il parle de 1962 avec des chiffres, les recettes, les primes, l'affluence du dernier match."
      - "Le petit salon sent la cire et le bois humide. Charles te montre les draps sur les meubles de la pièce voisine. « On les enlève pour les visites importantes. Il n'y en a plus. »"
      - "Charles parle de son trésorier de 1974 sans jamais dire son nom ; il dit « il ». À la fin, il sonne pour qu'on desserve, et personne ne vient. Il dessert lui-même."
    si: "annee <= 2019"
    avec: charles_dalmayrac
    habitude: culture
    tranches: 1
    francs: 0
    heures: [aprem]
  - id: cmp_dalmayrac_registres
    lieu: manoir
    label: "Les registres du conseil"
    texte: "Dans la bibliothèque, Charles sort les registres du conseil, de 1958 à 1977, reliés de toile bordeaux. Il te laisse lire, et corrige à voix basse les fautes qu'il faisait à l'époque."
    textes:
      - "Dans la bibliothèque, Charles sort les registres du conseil, de 1958 à 1977, reliés de toile bordeaux. Il te laisse lire, et corrige à voix basse les fautes qu'il faisait à l'époque."
      - "Le registre de 1971 s'ouvre tout seul à la page de la vente. Charles le referme d'une main, sans colère. « On ne relit pas cette page. On la connaît. »"
      - "Dernière page du registre de 1977 : la démission, datée à l'encre plus noire que le reste. Charles pose le doigt sur la date et ne dit rien. Le doigt suffit."
    si: "annee <= 2019"
    avec: charles_dalmayrac
    habitude: culture
    tranches: 1
    francs: 0
    heures: [aprem, soir]
  - id: cmp_vaillandet_cave
    lieu: manoir
    label: "La cave de Régis"
    texte: "Régis descend à la cave avec une lampe et remonte une bouteille d'avant la vente. Il la sert sans la commenter. « Je bois plus que ce que j'avais en 2019. Quand y en aura plus, je ferme. »"
    textes:
      - "Régis descend à la cave avec une lampe et remonte une bouteille d'avant la vente. Il la sert sans la commenter. « Je bois plus que ce que j'avais en 2019. Quand y en aura plus, je ferme. »"
      - "La cave garde encore les étiquettes de l'ancien président, écrites à la plume. Régis n'a pas touché à ses rangées. « Je bois les miennes. Les siennes, je les époussette. »"
      - "Il verse, regarde le vin contre la lampe, et parle de la nuit de la signature : les stylos, le fonds, les sourires. Il s'arrête au milieu d'une phrase, et la finit en buvant."
    si: "annee >= 2020"
    avec: regis_vaillandet
    habitude: luxe
    tranches: 1
    francs: 0
    heures: [soir]
  - id: cmp_vaillandet_echecs
    lieu: manoir
    label: "Une partie d'échecs"
    texte: "Régis installe l'échiquier près de la fenêtre qui donne sur la grille. Il joue vite et sacrifie ses tours sans hésiter. « J'ai vendu un club, alors une tour... »"
    textes:
      - "Régis installe l'échiquier près de la fenêtre qui donne sur la grille. Il joue vite et sacrifie ses tours sans hésiter. « J'ai vendu un club, alors une tour... »"
      - "Il perd la première exprès, et le dit. « C'est comme ça que j'ai vendu au bon prix : on perd la première. » La seconde, il la gagne en douze coups."
    si: "annee >= 2020"
    avec: regis_vaillandet
    habitude: jeu
    tranches: 1
    francs: 0
    heures: [aprem, soir]
  - id: cmp_manoir_parc
    lieu: manoir
    label: "Le parc à l'abandon"
    texte: "Le parc du manoir est retourné aux ronces. Une allée de tilleuls mène à un bassin vide, une feuille de journal au fond. Au bout, la grille, et derrière, les champs jusqu'au bois."
    textes:
      - "Le parc du manoir est retourné aux ronces. Une allée de tilleuls mène à un bassin vide, une feuille de journal au fond. Au bout, la grille, et derrière, les champs jusqu'au bois."
      - "Sous un cèdre, un banc de pierre gravé d'initiales et d'une date effacée. De là, on voit le Bois-Joli et ses projecteurs éteints. Le vent porte les coups de sifflet jusqu'ici."
      - "Une volée de corneilles décolle du toit à ton passage. Une fenêtre s'éclaire au premier, puis s'éteint. Dans le manoir, quelqu'un sait que tu marches dans son parc."
    habitude: soin
    tranches: 1
    francs: 0
    heures: [matin, midi, aprem]

  # — L'auberge du Relais
  - id: cmp_therese_plat
    lieu: auberge
    label: "Le plat du jour de Thérèse"
    texte: "Thérèse pose la soupière sur la nappe à carreaux et te sert sans demander. Le plat du jour est écrit à la craie : il en reste deux parts, et l'une est déjà pour toi."
    textes:
      - "Thérèse pose la soupière sur la nappe à carreaux et te sert sans demander. Le plat du jour est écrit à la craie : il en reste deux parts, et l'une est déjà pour toi."
      - "Salle basse, cheminée allumée, trois chasseurs au fond. Thérèse sert le civet et te dit qui s'est marié samedi, qui est mort mardi, et qui a pleuré aux deux."
      - "Thérèse regarde tes chaussures, puis ton assiette, puis tes chaussures. « De la marne. Tu viens de l'étang. Mange : ça creuse, l'étang. »"
