    texte: "À la table du fond, les chasseurs jouent à la belote sur un tapis râpé. Il leur manque un quatrième. Ils te font asseoir sans demander si tu connais les règles."
    textes:
      - "À la table du fond, les chasseurs jouent à la belote sur un tapis râpé. Il leur manque un quatrième. Ils te font asseoir sans demander si tu connais les règles."
      - "Ton partenaire a soixante-quinze ans et compte les points de tête, plus vite que le carnet. Il annonce sa belote comme on annonce une naissance."
    jeu: cartes
    habitude: jeu
    tranches: 0
