# LA VILLE VIVANTE — lot « campagne » : les gens du Grand Aubérive, au sud
# (docs/histoires/ville_vivante.md, le format : § 8 ; docs/histoires/grand_auberive.md).
#
# La ville s'arrête d'un coup : des champs, des haies, la départementale, le calvaire.
# Six lieux, deux visages chacun, l'un après l'autre, sans trou ni chevauchement :
#
#   ferme          La ferme               Prosper Soulié      1990-2008   familles
#                                         Margaux Soulié      2009-2050   familles  (sa petite-fille)
#   centre_vert    Le centre du Bois-Joli Gustave Rigal       1990-2014   vestiaire (l'intendant, la Coupe de 1966)
#                                         Sabine Malaterre    2015-2050   vestiaire (la directrice du centre modernisé)
#   manoir         Le manoir de la Motte  Charles Dalmayrac   1990-2019   direction (président du Racing, 1958-1977)
#                                         Régis Vaillandet    2020-2050   direction (président, 2008-2019 : la vente au fonds)
#   auberge        L'auberge du Relais    Thérèse Coustal     1990-2016   familles
#                                         Bastien Coustal     2017-2050   familles  (son petit-fils)
#   etang          L'étang                Isidore Puech       1990-2012   rue       (le pêcheur, gendarme retraité)
#                                         Manon Puech         2013-2050   rue       (sa petite-fille, garde-pêche)
#   stade_village  Le stade du village    Jacques Gassiat     1990-2010   tribunes  (président de l'U.S. La Motte)
#                                         Coralie Gassiat     2011-2050   tribunes  (sa fille)
#
# Ce que le canton sait des livres, et que la ville tient :
#   1 — Charles Dalmayrac est le président que la bâche de 1971 visait (« LE PRÉSIDENT VEND ») et
#       celui que son trésorier a remplacé en 1977 ; la boîte à chaussures de 1977 ; les masques
#       jusque sur le terrain du village.
#   2 — la boue blanche des roues : la marne du chemin de l'étang ; le car du club et la berline,
#       la nuit, au ponton (`h2_cherche_voiture`) ; les plots de Vukić au Bois-Joli (son lien).
#   3 — la mère trie les pommes de la ferme depuis la fermeture (le lien d'Odile, que la fin rare
#       demande) ; Didier Vallin, sa nuit au Bois-Joli et sa licence au district.
#   4 — la petite Lavergne faisait la plonge au Relais ; Bréhaut ne conduit plus la nuit.
#   5 — Bastide et la copie de 1931 en 1976 (`h5_bastide_1976`) ; le téléphone de la petite salle,
#       le mardi à six heures ; le bidon rincé dans l'étang la nuit de l'Est.
#   6 — le jeune homme poli qui paie au nom de JF Conseil (`h6_indices`).
#   7 — le cabinet de cardiologie de Valdorne qui appelle la guérite (`h7_cardiologue`) ; le petit
#       Rancé, la main sur la poitrine, au calvaire.
#   8 — le bracelet de Kerdal ; la chambre six sans capteur et la chambre du Relais (`h8_nuits`) ;
#       la voiture de Ferlac à l'étang ; le garçon poli au dîner de la vente.
#   9 — le frère de Noa Vandel, du toit du Dôme (`h9_frere_appel`) ; la fouille des chambres ; le
#       dîner de la Ligue de décembre 2010.
#  10 — Rive Capital et ses lasers ; le second clapet du capo (`h10_clapet_nino`) ; Gégé au dernier
#       gradin de la tribune de bois (son lien, que la fin rare demande).
#
# Les fermiers s'appellent Soulié. Le nom que grand_auberive.yaml, grand_auberive.md et
# district_campagne.js donnent encore à la ferme est celui de deux hommes du football réel (un
# attaquant international, un entraîneur) : aucun texte d'ici ne le reprend, et il est à changer
# là-bas pour « La ferme Soulié ».
#
# Le quartier est loin : les activités d'ici prennent une ou deux tranches. Les activités qu'on fait
# avec quelqu'un portent la borne de son époque (`si`). Le verrou du quartier, c'est la coquille qui
# le tient (une scène ne se programme pas dans un quartier fermé) : aucune garde de semaine ici.
# Aucun texte n'accorde le personnage joué ; les objets d'une seule époque ont leur année.
gens:

  # ═══════════════════════════════════════════════════════ LA FERME LACOMBE (ferme)

  - id: prosper_soulie
    name: "Prosper Soulié"
    label: "LE FERMIER DE LA MOTTE"
    genre: m
    portrait: {teint: clair, corpulence: large, age: age, coiffure: casquette, coiffe: bouteille, cheveux: blanc, pilosite: moustache, lunettes: aucune, tenue: veste, couleur: bleu, accessoire: aucun}
    lieu: ferme
    tranches: [matin, aprem, soir]
    annees: [1990, 2008]
    reseau: familles
    trace: "Prosper a noté ta visite au crayon sur le calendrier de l'étable, sous le vêlage de la Rousse."
    paliers: ["te laisse entrer dans la cour", "te garde les œufs du matin", "cacherait n'importe qui dans sa grange"]
    froid: ["laisse aboyer le chien", "ferme le portail quand tu passes", "ne t'ouvre plus le portail"]
    activites: [cmp_soulie_traite, cmp_soulie_transistor]
    on_relation: {3: vi.prosper_soulie.trappe, -3: vi.prosper_soulie.chaine}
    repliques:
      - {lien: 0, si: "tranche == matin", texte: "Les œufs, c'est dans la caisse, au portail. La monnaie, dans la boîte à sucre. Je l'ouvre le soir, pas devant le monde. Je sais qui triche."}
      - {lien: 0, texte: "Le transistor est au clou de l'étable, à côté du licol de la Rousse. Je trais pendant la première mi-temps. La seconde, je l'écoute assis sur le seau."}
      - {lien: 0, si: "serie_d >= 2", texte: "Trois samedis que les vaches tiennent pas en place à la mi-temps. Elles aiment pas quand le speaker baisse la voix. Moi non plus."}
      - {lien: 1, texte: "La finale de la Coupe, en 1966, j'y étais. En rentrant, un veau mort dans la paille. Depuis, c'est la radio. J'ai plus perdu une bête un jour de match."}
      - {lien: 1, si: "flag(histoire_h2) && flag(h2_trois_metres)", texte: "De la boue blanche ? C'est la marne du chemin de l'étang. Y en a nulle part ailleurs dans le canton. Ça colle aux roues jusqu'en ville, et ça sèche dur comme du plâtre."}
      - {lien: 1, si: "flag(histoire_h5)", texte: "La dame de l'agence est revenue pour mes prés du bas. Elle a laissé sa carte sous la boîte à sucre. Ça cale bien la porte du poulailler."}
      - {lien: 2, texte: "Mon fils vend des tracteurs à Valdorne. D'après lui, la ferme vaut plus vendue que gardée. Il a sûrement raison. Les clés, je les ai dans ma poche."}
      - {lien: 2, si: "tranche == soir", texte: "Le soir, j'entends les voitures du Bois-Joli sur la départementale. Y en a une qui redescend après minuit, tous feux éteints. Un gamin qui a fait le mur."}
      - {lien: 3, texte: "Ma grange a des bottes plus vieilles que toi. Derrière les plus vieilles, y a de la place. Pour ce qui doit pas se trouver."}
      - {lien: -1, texte: "Les œufs sont au portail. Pas besoin d'entrer dans la cour pour ça."}
      - {lien: -2, texte: "Le chien vous connaît pas. Moi non plus, aujourd'hui."}
      - {lien: -3, texte: "Le portail est fermé. Vous avez la départementale. Elle va partout ailleurs."}
    tuyaux:
      - id: cmp_soulie_odile
        lien: 1
        si: "flag(histoire_h3) && flag(h3_usine_fermee)"
        texte: "« Depuis que l'usine a fermé, ta mère vient trier mes pommes le mardi et le jeudi, à six heures, avec trois femmes du bâtiment C. Elle voulait pas que tu le saches. »"
      - id: cmp_soulie_josiane
        si: "flag(histoire_h2) && !flag(h2_wagon_vu)"
        texte: "« La secrétaire de ton club vient le jeudi. Deux douzaines d'œufs et un poulet. Elle vit seule, elle mange comme un oiseau. Elle paie l'appoint, tout prêt dans sa main, et elle repart. »"
      - id: cmp_soulie_route
        si: "flag(histoire_h5) && flag(h5_maquette_vue)"
        texte: "« La dame de l'agence veut mes prés du bas, pour une route jusqu'à la friche. Pour le stade neuf, qu'elle dit. Sur son plan, la route finit dans un parking. Y a pas de stade au bout. »"
      - id: cmp_soulie_mur
        si: "annee <= 2008 && vestiaire < 50 && role != president && role != ds"
        texte: "« Y a un des tiens qui passe par ma cour à minuit, les veilles de match au Bois-Joli. Il rentre à cinq heures, les chaussures pleines de marne. Il croit que mes chiens dorment. Ils dorment jamais. »"
        effets: {jauges: {vestiaire: 2}}
    service:
      lien: 3
      label: "La pièce sous la grange"
      texte: "Celui des tiens que la ville cherche, Prosper le cache derrière les vieilles bottes, sous la trappe. Une semaine de traite à cinq heures, de soupe à sept. Il rentre en ville sans qu'on l'ait vu."
      effets: {jauges: {vestiaire: 3}}
      dette: true

  - id: margaux_soulie
    name: "Margaux Soulié"
    label: "LA FERMIÈRE DE LA MOTTE"
    genre: f
    portrait: {teint: clair, corpulence: fin, age: mur, coiffure: queue, cheveux: roux, pilosite: rase, lunettes: aucune, tenue: veste, couleur: bouteille, accessoire: aucun}
    lieu: ferme
    tranches: [matin, midi, aprem, soir]
    annees: [2009, 2050]
    reseau: familles
    trace: "Margaux a glissé ton panier sous le banc, ton nom écrit au marqueur sur le couvercle."
    paliers: ["te garde un panier sous le banc", "te montre où sont les clés du tracteur", "ferait passer n'importe qui par ses chemins"]
    froid: ["te vend au prix du marché", "ne te garde plus rien", "ne t'ouvre plus la cour"]
    activites: [cmp_margaux_panier]
    on_relation: {3: vi.margaux_soulie.transistor, -3: vi.margaux_soulie.panneau}
    repliques:
      - {lien: 0, texte: "Les paniers, c'est le jeudi. Légumes, œufs, un pot de miel quand les ruches veulent bien. Je livre pas en ville. La ville vient ici, ou elle mange ce qu'elle trouve."}
      - {lien: 0, si: "annee >= 2018", texte: "Trois étés sans pluie. L'étang a baissé d'un mètre, et les pelouses du Bois-Joli sont toujours vertes. Dans le canton, tout le monde sait où elle part, l'eau."}
      - {lien: 0, si: "serie_d >= 2", texte: "Le transistor de mon grand-père est toujours au clou de l'étable. Les vaches l'écoutent encore le samedi. Ces temps-ci, je le baisse à la mi-temps."}
      - {lien: 1, texte: "Je suis revenue l'hiver où mon grand-père est tombé dans la cour. J'avais un bureau à la capitale, un loyer. J'ai rendu les clés là-bas, et j'ai mis ses bottes."}
      - {lien: 1, si: "annee >= 2030", texte: "Les panneaux sur la grange rapportent plus que le lait. Je garde les vaches quand même. Les panneaux vêlent pas, et je suis pas revenue pour regarder un toit."}
      - {lien: 1, si: "role == selectionneur && tranche == soir", texte: "Tes Cobalts, quand ils sont au Bois-Joli, ils passent le soir sur mes chemins. En file, sans lampe, chacun crie son numéro. Le dernier, il crie toujours tout seul."}
      - {lien: 2, texte: "Derrière les vieilles bottes, mon grand-père cachait la récolte aux huissiers. Ma mère y a caché mon père, une fois. Pour l'instant, y a que des bottes."}
      - {lien: 3, texte: "Pour sortir de la Motte sans prendre la départementale, t'as les chemins de moisson. La clé est sur le contact du tracteur. Qui irait voler un tracteur ?"}
      - {lien: -1, texte: "Le panier, c'est le prix sur l'ardoise. Le prix d'avant, c'était pour les amis."}
      - {lien: -2, texte: "Y a plus de panier pour vous cette semaine. Ni la suivante."}
      - {lien: -3, texte: "La cour est fermée. Le chemin du retour, c'est le seul qui est goudronné. Vous le trouverez."}
    tuyaux:
      - id: cmp_margaux_rance
        lien: 1
        si: "flag(histoire_h7) && !flag(h7_rance_mort)"
        texte: "« Tes Cobalts courent dans mes chemins le matin. Le petit Rancé s'arrête toujours au calvaire, la main à plat sur la poitrine. Il repart quand les autres arrivent. Faut pas qu'ils voient. »"
      - id: cmp_margaux_frere
        si: "flag(histoire_h9) && !flag(h9_frere_appel)"
        texte: "« Le frère de Noa Vandel a fait trois moissons ici avant de partir sur le chantier du Dôme. Il a appelé dimanche, du toit, pour savoir s'il pleuvait chez nous. Là-bas, il fait cinquante et un. »"
        effets: {set: [h9_frere_appel]}
      - id: cmp_margaux_rive
        si: "flag(histoire_h10)"
        texte: "« Rive Capital m'offre trois fois le prix de mes prés autour du Bois-Joli. L'offre tient jusqu'au lendemain du dernier match de 2040. Ils savent déjà ce qu'ils feront du centre, ce jour-là. »"
    service:
      lien: 3
      label: "Les chemins de moisson"
      texte: "Margaux te fait sortir de la Motte par les chemins de moisson, dans la cabine du tracteur, pendant que les photographes guettent la départementale. En ville, personne ne sait d'où tu reviens."
      effets: {jauges: {direction: 2}}

  # ═══════════════════════════════════════════════ LE CENTRE DU BOIS-JOLI (centre_vert)

  - id: gustave_rigal
    name: "Gustave Rigal"
    label: "L'INTENDANT DU BOIS-JOLI"
    genre: m
    portrait: {teint: clair, corpulence: moyen, age: age, coiffure: brosse, cheveux: gris, pilosite: moustache, lunettes: aucune, tenue: survetement, couleur: bordeaux, couleur2: gris, accessoire: sifflet}
    lieu: centre_vert
    tranches: [matin, midi, aprem, soir]
    annees: [1990, 2014]
    reseau: vestiaire
    trace: "Gustave a écrit l'heure de ta venue dans le cahier de la guérite, entre deux livraisons de gazon."
    paliers: ["te lève la barrière sans demander", "te confie le double des clés", "te laisserait le Bois-Joli pour la nuit"]
    froid: ["te fait signer le registre", "te laisse attendre à la barrière", "ne te lève plus la barrière"]
    activites: [cmp_rigal_ronde, cmp_rigal_guerite]
    on_relation: {3: vi.gustave_rigal.cahier, -3: vi.gustave_rigal.barriere}
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Tes Cobalts mangent à deux tables, dos à dos. Hier soir, quatre plateaux sont revenus pleins. Ils dorment au même étage, mais c'est pas la même équipe."}
        - {si: "role == president", texte: "La cuisinière et les deux jardiniers ont pas eu leur paie de mars. Ils bossent quand même. À la pause, assis sur la tondeuse, ils parlent de toi au passé."}
        - {si: "role == ds", texte: "Tes préparateurs montent déjeuner ici pour pas te croiser au club. Ils mangent dans leur voiture, sur le parking, avec la radio. Ils parlent d'aller voir ailleurs. De toi, jamais."}
        - "À la mise au vert, trois chambres avaient encore la lumière à deux heures. Au petit-déjeuner, personne ne s'est assis à côté de personne. J'ai débarrassé onze tasses pleines."
      moyen:
        - {si: "role == selectionneur", texte: "Les Cobalts jouent aux cartes le soir, au salon, par petits groupes. Ça commence à se mélanger. On rit à une table. Aux autres, pas encore."}
        - {si: "role == president", texte: "Les jardiniers tondent, la cuisinière fait sa cuisine. Personne se plaint, et personne dit merci non plus. Ils font leurs heures, et ils attendent de voir ce que tu vaux."}
        - {si: "role == ds", texte: "Ton staff mange ici le mardi, tous à la même table, et ça parle boutique. Ton nom revient, sans méchanceté. Mais ils t'attendent pas pour commencer."}
        - "Les gars se couchent à l'heure, sans chanter dans les douches, sans se plaindre. Au petit-déjeuner, on parle du match, pas de toi. Ce n'est ni bon ni mauvais : c'est calme."
      haut:
        - {si: "role == selectionneur", texte: "Hier soir, tes Cobalts ont poussé les tables du salon pour regarder un vieux match, tous ensemble. Le plus jeune a fait le café pour tout le monde. J'avais pas vu ça depuis longtemps."}
        - {si: "role == president", texte: "La cuisinière a fait un gâteau aux couleurs du club pour l'anniversaire d'un jardinier. Ils ont mis une part de côté pour toi, dans du papier d'argent, au frigo de la guérite."}
        - {si: "role == ds", texte: "Tes préparateurs restent après la séance pour finir leurs tableaux. Et ils t'appellent pour avoir ton avis. Ça, ils le faisaient jamais."}
        - "Mise au vert, minuit : ils chantent dans le couloir, ils ont caché les chaussures du capitaine dans le congélateur. Je les ai laissés faire. Un groupe qui rit la veille joue le lendemain."
    repliques:
      - {lien: 0, texte: "La barrière ferme à vingt-deux heures. Ceux qui rentrent après passent par le fond du bois, et ils croient que je le sais pas. Ce bois, c'est moi qui l'ai planté."}
      - {lien: 0, si: "tranche == matin", texte: "Je tonds à six heures, avant la rosée. Si tu tonds mouillé, le ballon freine, et les joueurs cherchent pourquoi pendant tout l'entraînement."}
      - {lien: 0, si: "serie_d >= 2", texte: "Les mauvaises semaines, ils laissent la moitié du plateau. La cuisinière garde les restes pour mes chiens. Ils ont jamais été aussi gros, mes chiens."}
      - {lien: 1, texte: "J'ai joué la finale de la Coupe de 1966 avec trois points de suture au genou. Le président de l'époque m'a donné ce poste en 1975, quand le genou a dit non pour de bon."}
      - {lien: 1, si: "tranche == soir", texte: "Le soir, je fais la ronde avec le trousseau. Vingt-deux chambres, vingt-deux clés. Je frappe deux coups. Celui qui répond pas, j'ouvre pas, je note."}
      - {lien: 2, texte: "Le Bois-Joli, c'était le bois du manoir. Le vieux président l'a cédé au club en 1970, pour un franc. Les gens te parleront de ce qu'il a vendu en 1971. Le franc, personne s'en rappelle."}
      - {lien: 2, si: "flag(histoire_h5) && caisse < 40", texte: "Quatre mois sans paie. Je dors dans la guérite, que les voleurs de cuivre voient qu'il reste quelqu'un. Les huissiers, eux, ils sont déjà au courant."}
      - {lien: 3, texte: "J'ai le double de toutes les clés, même celles qu'on croit perdues. T'as besoin d'être ici un soir sans que le club le sache, t'appelles la guérite. Je décroche toujours."}
      - {lien: -1, texte: "Signez le registre. Avec l'heure. La règle, c'est pour tout le monde, même pour ceux qui l'ont écrite."}
      - {lien: -2, texte: "Garez-vous dehors. Le parking est pour le car, et pour ceux qui saluent la guérite."}
      - {lien: -3, texte: "La barrière reste baissée. Vous voulez entrer, faites comme les gamins, passez par le fond du bois. Je vous verrai quand même."}
    tuyaux:
      - id: cmp_rigal_plots
        lien: 1
        si: "flag(histoire_h2) && flag(h2_place_vide)"
        texte: "« Ton adjoint vient seul, le dimanche, à sept heures. Il pose les plots de l'autre sur le terrain du fond, aux mêmes places, au mètre près. Et il les ramasse sans avoir donné un coup de sifflet. »"
      - id: cmp_rigal_did
        si: "flag(histoire_h3) && saison >= 2"
        texte: "« Juin 1989, Didier Vallin a dormi ici la veille de son transfert. Chambre neuf. Personne est venu le chercher. À six heures, il est reparti à pied, vers la ville. Pas vers la gare. »"
      - id: cmp_rigal_titi
        si: "flag(histoire_h4) && flag(h4_quatorze_mai)"
        texte: "« Ton capitaine conduit plus la nuit depuis 1984. À chaque mise au vert, c'est un autre qui ramène sa voiture. Et chaque 14 mai, il demande une chambre seul, et il en sort qu'à midi. »"
      - id: cmp_rigal_cardio
        si: "flag(histoire_h7) && flag(h7_rance_mort) && !flag(h7_cardiologue)"
        texte: "« Un cabinet de cardiologie de Valdorne a appelé ma guérite. Le petit Rancé leur avait laissé ce numéro-là, pas celui de l'hôtel. Il s'est pas présenté le 16. Ils demandent à qui envoyer la note. »"
        effets: {set: [h7_cardiologue]}
      - id: cmp_rigal_agent
        si: "annee <= 2014 && vestiaire < 45 && role != president && role != ds"
        texte: "« La dernière nuit au vert, deux des tiens ont échangé leurs chambres pour veiller ensemble. Un agent les attendait au portail à minuit, moteur allumé. Ils ont signé quelque chose sur son capot. »"
        effets: {jauges: {vestiaire: 2}}
    service:
      lien: 3
      label: "Ouvrir le Bois-Joli la nuit"
      texte: "Gustave allume deux projecteurs sur quatre et ferme la barrière derrière le car. Une séance à huis clos, sans un photographe dans les arbres. À minuit, il recompte les ballons, un par un."
      effets: {jauges: {vestiaire: 3, direction: -1}}

  - id: sabine_malaterre
    name: "Sabine Malaterre"
    label: "LA DIRECTRICE DU BOIS-JOLI"
    genre: f
    portrait: {teint: dore, corpulence: fin, age: mur, coiffure: carre, cheveux: brun, pilosite: rase, lunettes: carrees, tenue: doudoune, couleur: anthracite, accessoire: badge}
    lieu: centre_vert
    tranches: [matin, midi, aprem, soir]
    annees: [2015, 2050]
    reseau: vestiaire
    trace: "Sabine a ajouté ton passage au tableau blanc de la salle des soins, à la ligne des visites, sans l'heure."
    paliers: ["te prête une blouse et un badge", "te montre les vraies courbes", "te donnerait la clé de la six"]
    froid: ["te fait badger à l'entrée", "ne te montre plus les écrans", "ne te laisse plus passer le sas"]
    activites: [cmp_malaterre_froid]
    on_relation: {3: vi.sabine_malaterre.six, -3: vi.sabine_malaterre.copie}
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Les capteurs du groupe donnent quatre heures de sommeil la veille du match. Ils dorment en deux clans, un par couloir, et la nuit, les portes claquent."}
        - {si: "role == president", texte: "Les salariés du centre ont demandé une réunion, mais pas avec toi. Ils l'ont tenue dans la salle de cryo, porte fermée. Ils disent qu'il y fait moins froid qu'à ton étage."}
        - {si: "role == ds", texte: "Ton staff remplit ses rapports à la dernière minute, les cases cochées, les remarques vides. Ce qu'ils n'écrivent pas, ils le disent à la machine à café."}
        - "Les courbes de récupération sont au plus bas depuis trois semaines. Ce n'est pas le corps : ils dorment bien seuls et mal ensemble. En salle de soins, personne ne parle à personne."
      moyen:
        - {si: "role == selectionneur", texte: "Le groupe mange aux mêmes tables, pas encore à la même heure. Les courbes sont dans la moyenne, les rires aussi, à l'oreille. Il manque un soir où quelqu'un les ferait veiller ensemble."}
        - {si: "role == president", texte: "Les salariés du centre badgent, font leurs heures et repartent. Pas de plainte, pas de gâteau. Ils attendent de savoir si le centre sera encore au club l'an prochain."}
        - {si: "role == ds", texte: "Ton staff t'envoie ses rapports à l'heure, propres, rien à redire. Ils travaillent pour le club. Pour toi, pas encore."}
        - "Les gars dorment sept heures, récupèrent dans la norme, et ne restent pas un quart d'heure de plus après la séance. Personne ne se plaint ; personne ne reste non plus."
      haut:
        - {si: "role == selectionneur", texte: "Hier soir, tes Cobalts ont débranché leurs capteurs pour jouer aux cartes jusqu'à minuit. Mes courbes ont un trou de trois heures. Je n'ai rien corrigé."}
        - {si: "role == president", texte: "Anniversaire d'un kiné, hier, avec un gâteau aux couleurs du club. Ta part est au frigo des échantillons, entre deux tubes. Ne dis à personne où tu l'as trouvée."}
        - {si: "role == ds", texte: "Ton staff reste après la séance pour refaire le mercato au tableau blanc, et ils t'appellent pour avoir ton avis, ce qu'ils ne faisaient jamais. Je les entends rire depuis mon bureau."}
        - "Les capteurs sont formels : ils dorment mieux la veille des matchs qu'en vacances. Ils restent au centre après la séance sans qu'on le leur demande. Je n'avais jamais vu ça."
    repliques:
      - {lien: 0, texte: "Au centre, tout le monde porte un capteur, même la cuisinière. Le système sait qui dort, qui ment et qui a mal. Pourquoi, il ne le sait pas encore. C'est pour cela qu'on me paie."}
      - {lien: 0, si: "annee >= 2019 && annee <= 2033", texte: "Les données partent au fonds tous les soirs à minuit. Je n'ai jamais vu personne les lire. Quelqu'un paie pourtant pour les garder."}
      - {lien: 0, si: "serie_d >= 2", texte: "Après une défaite, les bains froids restent vides. Ils aiment mieux garder les jambes lourdes. J'ai arrêté d'expliquer. Je leur montre leurs courbes, et ils y vont."}
      - {lien: 1, texte: "J'étais kiné quand le centre n'avait qu'un projecteur sur deux. L'intendant d'avant me prêtait ses clés le dimanche. Lui, il se mettait à genoux pour écouter la pelouse."}
      - {lien: 1, si: "annee >= 2024", texte: "On m'a livré des capsules de sommeil : huit coques blanches qui ronronnent. Les joueurs les appellent la morgue. Ils y dorment quand même, et mieux que chez eux."}
      - {lien: 2, texte: "La chambre six n'a pas de capteur. Je l'ai fait débrancher le jour de l'installation. Elle n'est sur aucun plan."}
      - {lien: 2, si: "annee >= 2037", texte: "Des géomètres sont venus la nuit, avec des lasers sur pied. Ils ont mesuré mes terrains au centimètre. Ils n'ont pas regardé les buts."}
      - {lien: 3, texte: "Tu auras besoin, un soir, de dormir sans que personne le sache. Ce soir-là, prends la six, et laisse ton bracelet chez toi, sur la table de nuit. Il dormira à ta place."}
      - {lien: -1, texte: "Badgez à l'entrée, s'il vous plaît. Même la cuisinière badge."}
      - {lien: -2, texte: "Les écrans sont réservés au staff. Vous recevrez vos rapports comme les autres, par courriel."}
      - {lien: -3, texte: "Le sas ne s'ouvre plus pour votre badge. Vous pouvez accuser le système. C'est moi qui l'ai paramétré."}
    tuyaux:
      - id: cmp_malaterre_kerdal
        si: "flag(histoire_h8) && !flag(h8_kerdal_mort)"
        texte: "« Le bracelet de Kerdal donne sept heures de sommeil, ici. La veilleuse l'a vu courir seul sur le terrain du fond à trois heures, sans lampe. Je ne sais pas lequel ment, du bracelet ou de lui. »"
      - id: cmp_malaterre_fouille
        si: "flag(histoire_h9) && flag(h9_brassard_permis)"
        texte: "« Mardi, pendant la séance, deux hommes du ministère ont fouillé les chambres des Cobalts : les sacs, les chaussettes, les protège-tibias. Ils cherchaient quelque chose de noir. Ils n'ont rien pris. »"
      - id: cmp_malaterre_minuit
        si: "annee >= 2019 && annee <= 2033 && vestiaire < 45 && role != selectionneur"
        texte: "« Les courbes de tes joueurs partent au fonds à minuit. Hier, trois avaient dormi moins de quatre heures, la veille d'un match. Le fonds l'a lu avant toi. Je t'appellerai à minuit moins cinq. »"
        effets: {jauges: {vestiaire: 2}}
    service:
      lien: 3
      label: "La six, sans capteur"
      texte: "Sabine te donne la clé de la six. Pas de capteur, pas de caméra, un lit trop court. Tu y dors neuf heures d'affilée, au milieu des tiens. Chez toi, ton bracelet enregistre une nuit dans un lit vide."
      effets: {jauges: {vestiaire: 2}, var: {h8_nuits: "-1"}}

  # ═══════════════════════════════════════════════ LE MANOIR DE LA MOTTE (manoir)

  - id: charles_dalmayrac
    name: "Charles Dalmayrac"
    label: "PRÉSIDENT DU RACING, 1958-1977"
    genre: m
    portrait: {teint: porcelaine, corpulence: fin, age: age, coiffure: degarni, cheveux: blanc, pilosite: moustache, lunettes: rondes, tenue: costume, couleur: gris, couleur2: bordeaux, accessoire: montre}
    lieu: manoir
    tranches: [aprem, soir, nuit]
    annees: [1990, 2019]
    reseau: direction
    trace: "Charles a reporté ta visite dans l'agenda de 1977 qu'il tient toujours, à la page du jour, d'une plume fine."
    paliers: ["te reçoit au petit salon", "t'ouvre les registres du club", "décrocherait le téléphone pour toi"]
    froid: ["te fait attendre au vestibule", "ne te reçoit plus qu'à la grille", "fait fermer la grille quand tu sonnes"]
    activites: [cmp_dalmayrac_the, cmp_dalmayrac_registres]
    on_relation: {3: vi.charles_dalmayrac.registre, -3: vi.charles_dalmayrac.lettre}
    climat:
      bas:
        - {si: "role == president", texte: "Deux de vos actionnaires ont déjeuné ici dimanche, sans vous. Ils m'ont demandé combien de temps j'avais tenu après ma première mauvaise saison. Ils ne demandaient pas pour moi."}
        - {si: "role == selectionneur", texte: "Un ancien de la Fédération m'a téléphoné, lui qui ne m'appelait plus depuis dix ans. Il voulait savoir si vous dîniez parfois ici. On prépare déjà ce qu'on dira de vous."}
        - {si: "role == joueur", texte: "Mon ancien chauffeur conduit encore pour le club. Il m'a rapporté qu'à l'arrière, on discute de votre prix, et qu'on dit « était » en parlant de votre contrat."}
        - "Votre président a appelé ici jeudi, à onze heures du soir. Les présidents ne m'appellent jamais. Il voulait savoir comment on remercie quelqu'un sans que la ville le prenne mal."
      moyen:
        - {si: "role == president", texte: "Vos actionnaires viennent chasser dans mes bois le dimanche. Ils parlent de tout, sauf du club. Ils attendent les comptes de l'exercice pour se faire un avis sur vous."}
        - {si: "role == selectionneur", texte: "À la Fédération, on prononce votre nom sans adjectif. Un vieux camarade du bureau m'assure que c'est ainsi que l'on dure. Il ne m'a pas dit combien de temps."}
        - {si: "role == joueur", texte: "Au club, on vous trouve cher pour ce que vous rapportez. Vous remplacer coûterait davantage, et cela vous laisse un peu de temps."}
        - "Votre président ne parle pas de vous au téléphone. Ni en bien, ni en mal. En 1969, j'ai gardé un entraîneur trois ans comme ça, sans un mot. Le silence, c'est un contrat."
      haut:
        - {si: "role == president", texte: "Vos actionnaires ont levé leur verre à votre santé, ici même, sans que vous le sachiez. En dix-neuf ans, on n'a bu à la mienne qu'au banquet de mon départ."}
        - {si: "role == selectionneur", texte: "Le président de la Fédération vous a cité dans un discours, à Portclair. Il ne cite jamais personne sans en attendre quelque chose. Profitez-en avant qu'il vienne le chercher."}
        - {si: "role == joueur", texte: "Le club a refusé une offre pour vous, la semaine dernière. Personne ne vous l'aura dit. Déjà de mon temps, on évitait d'en parler aux joueurs : cela les rendait chers."}
        - "Votre président a dit à un banquier, devant moi : « Celui-là, je le garde. » On l'a dit de moi en 1966. Profitez de la phrase. Elle a une durée."
    repliques:
      - {lien: 0, texte: "Je ne chauffe plus que trois pièces. Les autres sont sous des draps depuis 1977, le bureau compris. On s'y fait."}
      - {lien: 0, si: "tranche == nuit", texte: "Je ne dors plus guère. La nuit, je relis les comptes rendus du conseil de 1966. J'y trouve encore des fautes d'orthographe. Les chiffres, eux, sont justes au centime."}
      - {lien: 0, si: "serie_d >= 2", texte: "Trois défaites. Le club m'envoie encore son rapport annuel, par politesse. Je le lis par la fin, comme les testaments."}
      - {lien: 1, texte: "La Coupe de 1966 a dormi une nuit ici, sur ce piano. Toute la Motte a défilé dans le vestibule. Mon père aurait détesté. Moi, j'ai servi le vin jusqu'au matin."}
      - {lien: 1, si: "annee >= 1998", texte: "Mon ancien trésorier préside maintenant ceux qui jugent les présidents. Il m'envoie une carte chaque nouvel an. Je les range dans la boîte à chaussures qu'il m'a laissée en 1977."}
      - {lien: 2, texte: "En 1971, j'ai vendu notre meilleur joueur pour payer les dettes de l'usine de mon père. Le virage a peint une bâche contre moi. Je l'aurais peinte moi-même."}
      - {lien: 2, si: "flag(histoire_h1)", texte: "Mars 1975 : c'est moi qui ai refusé le caveau du club à Henri Ravenel. Le conseil a voté avec moi. Mon trésorier a levé la main le premier, et il a payé la gerbe."}
      - {lien: 3, texte: "Je sais encore par cœur le numéro de quatre hommes qui pèsent. Ils me croient mort depuis longtemps. C'est sans doute pour cela qu'ils décrochent."}
      - {lien: -1, texte: "Attendez au vestibule. La gouvernante vous fera signe quand je serai visible."}
      - {lien: -2, texte: "Je vous reçois à la grille. La maison n'est pas en état. Elle ne l'est plus pour vous."}
      - {lien: -3, texte: "La gouvernante a ordre de ne plus ouvrir. Vous pouvez sonner : la cloche est d'origine, elle porte loin, et personne ne viendra."}
    tuyaux:
      - id: cmp_dalmayrac_bastide
        si: "flag(histoire_h5) && flag(h5_fax_plume) && !flag(h5_bastide_1976)"
        texte: "« En 1976, un jeune secrétaire de mairie, André Bastide, est venu chercher la copie de l'acte de 1931 que le club gardait, pour la classer. Je la lui ai remise moi-même. Je n'ai jamais redemandé. »"
        effets: {set: [h5_bastide_1976]}
      - id: cmp_dalmayrac_boite
        si: "flag(histoire_h1) && flag(h1_negatif)"
        texte: "« Juin 1977. Mon trésorier m'a racheté mes parts en liquide, dans une boîte à chaussures. Le lendemain, la banque lui prêtait la même somme, pour la forme. La boîte, je n'ai pas demandé d'où. »"
      - id: cmp_dalmayrac_heure
        si: "flag(histoire_h7) && flag(h7_rance_mort)"
        texte: "« Votre président de la Fédération, je le connais : il fixe l'heure d'abord, les faits ensuite. En 1977, il a daté ma démission de la veille. La ville s'en souvient à la date qu'il a écrite. »"
      - id: cmp_dalmayrac_notaire
        si: "annee <= 2019 && direction < 40 && role != president && role != selectionneur"
        texte: "« Jeudi, votre président a réuni trois membres de son conseil chez un notaire de Portclair. L'un d'eux m'a appelé ensuite pour savoir comment on remercie quelqu'un sans que la ville le sache. »"
        effets: {jauges: {direction: 2}}
      - id: cmp_dalmayrac_parts
        si: "role == president && annee <= 2019 && direction < 40"
        texte: "« Deux de vos actionnaires ont dîné ici dimanche. Ils m'ont demandé ce que coûte, en liquide, le fauteuil d'un président. Je leur ai donné le prix de 1977. Ils ont pris des notes. »"
        effets: {jauges: {direction: 2}}
    service:
      lien: 3
      label: "Un coup de fil au conseil"
      texte: "Charles décroche le téléphone du vestibule et compose deux numéros de mémoire. Il ne dit pas ton nom ; il parle de 1966, de chasse, d'une tombe à fleurir. Le soir même, là-haut, on te rappelle."
      effets: {jauges: {direction: 3}}
      dette: true

  - id: regis_vaillandet
    name: "Régis Vaillandet"
    label: "PRÉSIDENT DU RACING, 2008-2019"
    genre: m
    portrait: {teint: clair, corpulence: large, age: mur, coiffure: degarni, cheveux: gris, pilosite: rase, lunettes: aviateur, tenue: pull, couleur: marine, accessoire: montre}
    lieu: manoir
    tranches: [aprem, soir]
    annees: [2020, 2050]
    reseau: direction
    trace: "Régis a débouché une bouteille de plus qu'il ne fallait, et l'a notée à ton nom dans le livre de cave."
    paliers: ["te sert le vin de la cave", "te montre les papiers de 2019", "ouvrirait son carnet d'adresses pour toi"]
    froid: ["te sert le vin ordinaire", "ne te parle plus que de la pluie", "ne t'ouvre plus la grille"]
    activites: [cmp_vaillandet_cave, cmp_vaillandet_echecs]
    on_relation: {3: vi.regis_vaillandet.clause, -3: vi.regis_vaillandet.table}
    climat:
      bas:
        - {si: "role == president && annee >= 2034", texte: "Douze socios sont venus boire mon vin pour savoir comment on renverse un président. Vu que j'ai vendu le club, ils pensent que je m'y connais. La prochaine fois, ils seront vingt."}
        - {si: "role == president", texte: "Tes actionnaires ont déjeuné ici sans toi. Ils parlaient de ta ligne dans le tableau, pas de toi. Elle est en rouge, ta ligne, et le trimestre finit dans trois semaines."}
        - {si: "role == selectionneur", texte: "On m'a appelé de la Fédération pour savoir si tu dînais chez moi. J'ai dit non. Ça avait l'air de les embêter. Ils cherchent quoi te reprocher, et ils ont pas encore trouvé."}
        - {si: "role == joueur", texte: "Le club t'a mis dans la colonne des actifs à céder. Je le connais, ce tableau, je l'ai signé en 2019. Y a une date en face de ton nom, et elle est pas loin."}
        - {si: "annee >= 2034", texte: "À l'assemblée des socios, ton nom revient à la fin, dans les questions diverses. Les questions diverses, je les ai présidées onze ans. Je sais ce qu'on y glisse."}
        - "Les gens du fonds parlent de ton remplaçant comme d'un fichier déjà ouvert. Je dîne avec eux le jeudi ; ils ne baissent même plus la voix devant moi. Ils me croient de leur côté."
      moyen:
        - {si: "role == president && annee >= 2034", texte: "Les socios boivent mon vin et font les mois sur leurs doigts jusqu'à 2040, comme tout le monde. Contre toi, pas encore."}
        - {si: "role == president", texte: "Tes actionnaires disent ni bien ni mal de toi. Ils attendent les chiffres du trimestre. Pour l'instant, ta ligne est en noir."}
        - {si: "role == selectionneur", texte: "À la Fédération, ils parlent de toi sans mettre d'adjectif. Ils gardent le mot pour après le prochain match."}
        - {si: "role == joueur", texte: "Au club, t'es dans la colonne du milieu. Pas à vendre, pas à garder, à surveiller. On peut y rester longtemps, mais on y dort mal."}
        - {si: "annee >= 2034", texte: "Les socios parlent de toi, mais personne lève la main. À l'assemblée, la main, ils la lèvent pour applaudir ou pour enterrer. Pour toi, pas encore."}
        - "Les gens du fonds disent ton nom sans s'arrêter dessus. Pour eux, c'est un compliment. Ils ne s'arrêtent que sur les noms qu'ils vont rayer."
      haut:
        - {si: "role == president && annee >= 2034", texte: "Les socios ont trinqué à ta santé, dans mon salon, sans que tu le saches. Ils m'ont demandé de garder le bouchon. Il est dans le tiroir, avec celui de 2019."}
        - {si: "role == president", texte: "Tes actionnaires ont parlé de toi comme d'un bon placement. Venant d'eux, c'est presque une déclaration. Profites-en, ça dure un exercice."}
        - {si: "role == selectionneur", texte: "Le président de la Fédération a dit ton nom deux fois dans le même discours. D'habitude, le seul nom qu'il répète, c'est le sien."}
        - {si: "role == joueur", texte: "Le club a refusé une offre pour toi le mois dernier. Personne t'en a parlé ? Moi non plus, j'en parlais jamais au joueur. Le lendemain, il voulait une rallonge."}
        - {si: "annee >= 2034", texte: "Les socios ont applaudi ton nom à l'assemblée, debout, avant même le rapport. J'ai jamais eu ça, moi. Mes actionnaires, ils prenaient des notes."}
        - "Les gens du fonds ont cité ton nom à table comme on cite un rendement. Ils ont demandé ton âge et la durée de ton contrat. Chez eux, c'est bon signe."
    repliques:
      - {lien: 0, texte: "J'ai présidé le Racing onze ans. La vente au fonds, je l'ai signée un mardi, à onze heures onze. Ils m'ont offert le stylo. Il est dans le tiroir. Y a plus d'encre dedans."}
      - {lien: 0, si: "flag(h8_vaubourg_mort)", texte: "Le vieux Vaubourg est mort à son bureau. Je suis pas allé à l'enterrement. C'est lui qui m'avait dit de vendre. J'ai trois cravates noires, j'en ai mis aucune."}
      - {lien: 0, si: "serie_d >= 2", texte: "Trois défaites. Je regarde les matchs tout seul, dans le grand salon, le son coupé. Quand je présidais, je mettais le son, et j'entendais rien."}
      - {lien: 1, texte: "J'ai acheté le manoir aux héritiers du vieux président, en 2020. Dans le tiroir du bureau, y avait un mot : « Pour le suivant. » Il savait pas que ce serait moi."}
      - {lien: 1, si: "annee >= 2034", texte: "Les socios m'ont proposé d'adhérer. J'ai dit non. Le dimanche, je passe devant le stade en voiture, et je ralentis."}
      - {lien: 2, texte: "Ma fille me parle plus depuis la vente. À douze ans, elle allait au virage avec son grand-père. D'après elle, j'ai vendu son grand-père avec le reste."}
      - {lien: 3, texte: "Là-haut, ils décrochent encore tous quand j'appelle. Ils se demandent ce que j'ai gardé. Il te faut une table, je mets le couvert."}
      - {lien: -1, texte: "J'ai que du vin ordinaire, ce soir. Vous verrez pas la différence."}
      - {lien: -2, texte: "On va parler de la pluie. Ça fâche que les agriculteurs."}
      - {lien: -3, texte: "La grille est fermée. Je l'ai fait motoriser en 2020, et c'était pas pour vous. Mais elle marche aussi pour vous."}
    tuyaux:
      - id: cmp_vaillandet_ferlac
        si: "flag(histoire_h8)"
        texte: "« Le soir de la vente, en 2019, le fonds avait amené à ma table un garçon poli avec un ordinateur. Il a prédit l'heure où je signerais. Il s'est trompé de onze minutes. Ça l'a contrarié. »"
      - id: cmp_vaillandet_aubert
        si: "flag(histoire_h9) && flag(h9_cave_vue)"
        texte: "« Décembre 2010, le dîner de la Ligue. À vingt-trois heures trente-cinq, Madame Aubert a quitté la table pour téléphoner. Elle est revenue en souriant. Je l'ai noté sur mon menu. J'ai le menu. »"
      - id: cmp_vaillandet_lundi
        si: "annee >= 2020 && annee <= 2033 && direction < 40 && role != selectionneur"
        texte: "« Les gens du fonds ont déjeuné ici mardi. Pour eux, t'es une ligne à revoir, et les lignes, ils les revoient le premier lundi du mois. T'as jusqu'à lundi. »"
        effets: {jauges: {direction: 2}}
    service:
      lien: 3
      label: "Un dîner au manoir"
      texte: "Régis dresse six couverts, sort deux bouteilles d'avant la vente et invite ceux qui décident, là-haut. Il parle de vin, jamais de toi. En partant, ils te serrent la main plus longtemps."
      effets: {jauges: {direction: 2, caisse: 1}}

  # ═══════════════════════════════════════════════ L'AUBERGE DU RELAIS (auberge)

  - id: therese_coustal
    name: "Thérèse Coustal"
    label: "LA PATRONNE DU RELAIS"
    genre: f
    portrait: {teint: clair, corpulence: large, age: age, coiffure: chignon, cheveux: gris, pilosite: rase, lunettes: rondes, tenue: blouse, couleur: bordeaux, couleur2: creme, accessoire: aucun}
    lieu: auberge
    tranches: [midi, aprem, soir]
    annees: [1990, 2016]
    reseau: familles
    trace: "Thérèse a regardé tes chaussures en entrant, puis t'a servi sans regarder l'ardoise."
    paliers: ["te garde la table près du feu", "écrit ton plat sur l'ardoise", "fermerait le Relais pour toi"]
    froid: ["te place près de la porte", "te sert le plat de la veille", "n'a plus de table pour toi"]
    activites: [cmp_therese_plat]
    on_relation: {3: vi.therese_coustal.ardoise, -3: vi.therese_coustal.complet}
    repliques:
      - {lien: 0, texte: "Vous avez de la marne au bord des semelles. C'est le chemin de l'étang, ça. Asseyez-vous, je l'ai pas vue."}
      - {lien: 0, si: "tranche == midi", texte: "Le plat du jour, c'est le reste de la noce de samedi, réchauffé dans l'ordre. Personne se plaint. Y en a même qui viennent exprès le lundi."}
      - {lien: 0, si: "serie_d >= 2", texte: "Le dimanche midi, les anciens de la Nord mangent ici. Du samedi, pas un mot. Ils parlent du gibier, et je sais ce que ça veut dire."}
      - {lien: 1, texte: "Le Relais, on l'a repris en 1962, mon mari et moi. L'année du titre. Le banquet, on l'a servi dans cette salle. Il en reste une chaise, au fond. Elle boite, et personne ose la changer."}
      - {lien: 1, si: "tranche == soir", texte: "Le soir, y a des joueurs du Bois-Joli qui font le mur jusqu'ici pour une bière. Je les sers en cuisine, qu'on les voie pas de la route. À onze heures, ouste."}
      - {lien: 2, texte: "Les noces, les communions, les enterrements du canton, on les fait ici depuis soixante ans. Je sais qui a épousé qui, et qui aurait dû. Ça, je l'écris nulle part."}
      - {lien: 2, si: "annee >= 2005", texte: "Mon petit-fils fait la cuisine à la capitale, dans un restaurant où on mange avec des pinces. D'après lui, le Relais, c'est un musée. Il viendra bien le reprendre, son musée."}
      - {lien: 3, texte: "La petite salle a ses volets et son téléphone à elle. Tu veux manger avec quelqu'un sans que le canton le sache, je te la dresse. Si on me demande, c'est un repas de famille."}
      - {lien: -1, texte: "Il reste la table près de la porte. C'est pratique, pour partir."}
      - {lien: -2, texte: "Le plat du jour, y en a plus. Il reste celui d'hier. Il est encore bon, d'après la cuisine."}
      - {lien: -3, texte: "J'ai plus de table. Ni aujourd'hui, ni pour la noce de samedi. Vous trouverez bien en ville."}
    tuyaux:
      - id: cmp_therese_sandrine
        si: "flag(histoire_h4) && flag(h4_fiche_hopital)"
        texte: "« En 1984, la petite Lavergne faisait la plonge ici le samedi. Le soir de la montée, elle est partie sur sa mobylette bleue à deux heures moins le quart. Son père avait dit deux heures. »"
      - id: cmp_therese_mardi
        si: "flag(histoire_h5) && flag(h5_conseil_entendu)"
        texte: "« Le mardi, à six heures pile, le directeur de la banque demande le téléphone de la petite salle, et il ferme la porte. Jamais plus de deux minutes. Il laisse une pièce sur l'appareil. »"
      - id: cmp_therese_jf
        si: "flag(histoire_h6)"
        texte: "« Un jeune homme poli dîne seul ici le jeudi, dos au mur, un ordinateur ouvert à côté de l'assiette. Il paie par chèque, au nom de JF Conseil, et laisse un pourboire exact, au centime. »"
        effets: {var: {h6_indices: "+1"}}
      - id: cmp_therese_addition
        si: "annee <= 2016 && vestiaire < 50 && role != selectionneur"
        texte: "« Dimanche, les parents d'un des tiens ont déjeuné ici avec un agent de Portclair. C'est le père qui a payé pour tout le monde, en liquide. Le fils, je crois bien qu'il s'en va. »"
        effets: {jauges: {vestiaire: 2}}
    service:
      lien: 3
      label: "La petite salle"
      texte: "Thérèse dresse la petite salle, ferme les volets et débranche le téléphone de l'entrée. Tu y reçois qui tu veux, le temps du déjeuner. Aux curieux, elle répond que c'est un repas de famille."
      effets: {jauges: {direction: 2, vestiaire: 1}}
      dette: true

  - id: bastien_coustal
    name: "Bastien Coustal"
    label: "LE PATRON DU RELAIS"
    genre: m
    portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: court, cheveux: brun, pilosite: barbe, lunettes: aucune, tenue: chemise, couleur: blanc, accessoire: aucun}
    lieu: auberge
    tranches: [midi, aprem, soir]
    annees: [2017, 2050]
    reseau: familles
    trace: "Bastien a ajouté à ton assiette ce qu'il goûtait en cuisine, sans le compter."
    paliers: ["te fait goûter avant la carte", "te garde la petite salle", "fermerait le Relais pour les tiens"]
    froid: ["te sert au prix des touristes", "oublie ta commande", "n'a plus de table pour toi"]
    activites: [cmp_bastien_plat]
    on_relation: {3: vi.bastien_coustal.carnet}
    repliques:
      - {lien: 0, texte: "L'ardoise, c'est celle de ma grand-mère, et la craie aussi. J'ai changé les plats. L'écriture, je l'ai copiée. Les anciens croient qu'elle est encore en cuisine. Je les laisse croire."}
      - {lien: 0, si: "annee >= 2030", texte: "Les voitures sans chauffeur s'arrêtent devant le Relais à midi, et les gens en descendent même pas. Ils commandent par la vitre. Je leur apporte quand même une carafe d'eau."}
      - {lien: 0, si: "serie_d >= 2", texte: "Le dimanche, les vieux de la Nord mangent ici. Ils parlent du gibier depuis l'entrée. Mémé m'avait prévenu, pour le gibier."}
      - {lien: 1, texte: "J'ai fait la cuisine à la capitale pendant dix ans, avec des pinces et des chronomètres. Je suis revenu quand ma grand-mère a commencé à saler deux fois. Ici, je goûte."}
      - {lien: 2, texte: "Qui avait épousé qui dans le canton, et qui aurait dû, Mémé savait tout. Elle me l'a raconté en une soirée, avant de partir. J'ai rien noté. Demande-moi, pour voir."}
      - {lien: 3, texte: "Les tiens ont besoin d'un dimanche loin de tout ? Je ferme le Relais, et je cuisine. Les familles d'abord. Les journalistes iront manger en ville."}
      - {lien: -1, texte: "La carte est affichée dehors. Les prix aussi."}
      - {lien: -2, texte: "On a perdu votre commande. Ça arrive, quand on est seul en cuisine."}
      - {lien: -3, texte: "Le Relais est complet. Pour vous, il le restera."}
    tuyaux:
      - id: cmp_bastien_ober
        si: "flag(histoire_h8)"
        texte: "« Le docteur de ton club dîne ici le mercredi avec un homme du fonds. Ils font défiler des courbes sur une tablette, une par joueur. Ils s'arrêtent toujours sur la même, avec un K en haut. »"
      - id: cmp_bastien_sauvan
        si: "flag(histoire_h9)"
        texte: "« Le conseiller du ministère réserve la petite salle le jeudi. Il commande pour deux, et il mange seul. Au dessert, son téléphone sonne. Il dit “oui” trois fois, et il paie. »"
      - id: cmp_bastien_nino
        si: "flag(histoire_h10) && saison >= 2 && !flag(h10_clapet_nino)"
        texte: "« Ton capo dîne ici seul le premier lundi du mois. À neuf heures, un portable à clapet sonne dans sa veste, une sonnerie de quand j'étais gamin. Il sort dans la cour pour répondre. »"
        effets: {set: [h10_clapet_nino]}
    service:
      lien: 3
      label: "Le dimanche des familles"
      texte: "Bastien ferme le Relais un dimanche et cuisine pour les familles des tiens : les maris, les femmes, les gamins, les grands-parents qui ne viennent jamais au stade. Il ne fait rien payer."
      effets: {jauges: {vestiaire: 2, tribunes: 1}}

  # ═══════════════════════════════════════════════ L'ÉTANG (etang, sans porte)

  - id: isidore_puech
    name: "Isidore Puech"
    label: "LE PÊCHEUR DE L'ÉTANG"
    genre: m
    portrait: {teint: clair, corpulence: fin, age: age, coiffure: casquette, coiffe: marine, cheveux: blanc, pilosite: barbe, lunettes: aucune, tenue: veste, couleur: bouteille, accessoire: carnet}
    lieu: etang
    tranches: [matin, soir, nuit]
    annees: [1990, 2012]
    reseau: rue
    trace: "Puech a noté l'heure de ta venue dans son carnet, comme une plaque, sans quitter le bouchon des yeux."
    paliers: ["te fait de la place sur le ponton", "te dit une plaque, de temps en temps", "arracherait une page pour toi"]
    froid: ["tourne le dos quand tu arrives", "note ton nom devant toi", "a donné tes nuits aux gendarmes"]
    activites: [cmp_puech_peche]
    on_relation: {3: vi.isidore_puech.carnet, -3: vi.isidore_puech.gendarmes}
    repliques:
      - {lien: 0, texte: "Les planches craquent, et les carpes entendent. Asseyez-vous au bout. Sans bouger."}
      - {lien: 0, si: "tranche == nuit", texte: "La lanterne, c'est moi. Une voiture au bout du chemin, sans lanterne, c'est pas moi."}
      - {lien: 0, si: "serie_d >= 2", texte: "Samedi, j'ai écouté le match ici. À la soixantième, j'ai coupé. Le poisson mordait mieux."}
      - {lien: 1, texte: "Trente ans gendarme, à Valdorne. Les plaques, on m'a appris à les noter. Arrêter les gens, j'ai jamais su."}
      - {lien: 1, si: "tranche == matin", texte: "Six heures. Deux voitures cette nuit. Une est repartie. L'autre, elle est encore au bout du chemin. Personne en est sorti."}
      - {lien: 2, texte: "Les gendarmes de Valdorne viennent lire mon carnet le premier lundi du mois. Ils recopient. Ce que j'écris pas, ils me l'ont jamais demandé."}
      - {lien: 3, texte: "Ton nom est dans le carnet. Onze fois, à côté de l'heure. Tu me dis, et j'arrache. Ça fait pas de bruit."}
      - {lien: -1, texte: "Le ponton est petit. Il est plein."}
      - {lien: -2, texte: "Je note votre nom. Devant vous. C'est plus honnête."}
      - {lien: -3, texte: "Les gendarmes ont lu votre page lundi. Je l'ai pas arrachée. Fallait me le demander avant."}
    tuyaux:
      - id: cmp_puech_car
        si: "flag(histoire_h2) && flag(h2_trois_metres) && !flag(h2_carnet) && !flag(h2_rive)"
        texte: "« Le car de ton club. Deux nuits, à quatre heures moins dix. Derrière, une voiture grise, sans phares. Le chauffeur a sondé l'eau avec une perche. Pas assez profond. Ils sont repartis vers le Pont. »"
        effets: {set: [h2_cherche_voiture]}
      - id: cmp_puech_bidon
        si: "flag(histoire_h5) && flag(h5_tribune_est_brulee)"
        texte: "« La nuit de l'Est, à une heure vingt, une camionnette blanche au bout du chemin, plaque de Portclair. Un homme en ciré a rincé un bidon rouge dans l'étang, longtemps. Personne me l'a demandé. »"
      - id: cmp_puech_passagere
        si: "annee <= 2012 && direction < 40 && role != president && role != selectionneur"
        texte: "« La voiture du président de ton club. Mardi, minuit, au bout du chemin. Une passagère. Pas sa femme. » Puech referme le carnet sur son doigt, et regarde le bouchon."
        effets: {jauges: {direction: 2}}
    service:
      lien: 3
      label: "Arracher une page"
      texte: "Puech ouvre son carnet à tes nuits et arrache les pages proprement, une à une. Il les plie en quatre et les glisse sous une pierre du ponton. Lundi, les gendarmes recopieront le reste."
      effets: {jauges: {direction: 2}}

  - id: manon_puech
    name: "Manon Puech"
    label: "LA GARDE-PÊCHE"
    genre: f
    portrait: {teint: clair, corpulence: fin, age: jeune, coiffure: queue, cheveux: roux, pilosite: rase, lunettes: aucune, tenue: doudoune, couleur: bouteille, accessoire: telephone}
    lieu: etang
    tranches: [soir, nuit]
    annees: [2013, 2050]
    reseau: rue
    trace: "Manon a noté ton passage dans son téléphone, comme son grand-père dans son carnet, en plus rapide."
    paliers: ["te laisse passer la barrière du chemin", "te dit qui vient la nuit", "déchirerait un procès-verbal pour toi"]
    froid: ["te demande ta carte de pêche", "te verbalise pour un rien", "te photographie à chaque passage"]
    activites: [cmp_manon_ronde]
    on_relation: {3: vi.manon_puech.jumelles}
    repliques:
      - {lien: 0, texte: "Garde-pêche, la nuit. Mon grand-père notait les plaques dans un carnet ; moi, j'ai des jumelles qui voient dans le noir. Les gens font toujours les mêmes bêtises. Je les vois en vert, maintenant."}
      - {lien: 0, si: "annee >= 2030", texte: "L'étang a perdu un mètre en trois étés. Près des roseaux, on voit le fond. Des pneus, un vélo, une portière. J'attends le mètre suivant."}
      - {lien: 1, texte: "Le carnet de mon grand-père est dans ma boîte à gants. Quarante ans de plaques. Les gendarmes me l'ont demandé deux fois. J'ai dit qu'il était tombé à l'eau."}
      - {lien: 2, texte: "La nuit, y a trois sortes de voitures, ici. Celles qui viennent pêcher, celles qui viennent s'aimer, et celles qui attendent. Celles-là, je les prends en photo."}
      - {lien: 3, texte: "Pour quelqu'un qui doit venir ici sans que ça se sache, je coupe la caméra du chemin. Elle tombe tout le temps en panne. Les gendarmes ont l'habitude."}
      - {lien: -1, texte: "Votre carte de pêche, s'il vous plaît. Même pour regarder l'eau."}
      - {lien: -2, texte: "Stationnement interdit au bout du chemin. Cette fois, je vous l'écris."}
      - {lien: -3, texte: "Je vous prends en photo à chaque passage. J'ai un dossier rien que pour vous, maintenant."}
    tuyaux:
      - id: cmp_manon_ferlac
        si: "flag(histoire_h8)"
        texte: "« L'hiver où il est mort, la voiture de Ferlac venait ici le jeudi à minuit, moteur allumé. Il parlait tout seul, fort, longtemps, en reprenant les mêmes phrases. J'ai cru qu'il apprenait un rôle. »"
      - id: cmp_manon_voiture
        si: "flag(histoire_h10)"
        texte: "« Ta voiture sans volant est venue seule ici cette nuit, à deux heures. Personne dedans. Elle a attendu vingt minutes au bout du chemin, puis elle est repartie. Quelqu'un lui apprend des routes. »"
    service:
      lien: 3
      label: "Le procès-verbal déchiré"
      texte: "Manon sort de sa poche le procès-verbal de pêche de nuit d'un des tiens, filet et lampe frontale compris, et le déchire en huit au-dessus de l'eau. « J'ai jamais su écrire, la nuit. »"
      effets: {jauges: {vestiaire: 2}}

  # ═══════════════════════════════════════════════ LE STADE DU VILLAGE (stade_village, sans porte)

  - id: jacques_gassiat
    name: "Jacques Gassiat"
    label: "PRÉSIDENT DE L'U.S. LA MOTTE"
    genre: m
    portrait: {teint: clair, corpulence: large, age: mur, coiffure: degarni, cheveux: gris, pilosite: moustache, lunettes: aucune, tenue: survetement, couleur: bouteille, couleur2: blanc, accessoire: sifflet}
    lieu: stade_village
    tranches: [matin, aprem]
    annees: [1990, 2010]
    reseau: tribunes
    trace: "Jacques a écrit ton nom à la craie sur le tableau du vestiaire, dans la case des remplaçants de dimanche."
    paliers: ["te tend la craie du tableau", "te garde une place sur la tribune de bois", "remplirait un car pour toi"]
    froid: ["te fait payer l'entrée", "ne te serre plus la main", "a laissé ton nom barré sur la main courante"]
    activites: [cmp_gassiat_chaux]
    on_relation: {3: vi.jacques_gassiat.tableau, -3: vi.jacques_gassiat.main_courante}
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Les gamins de la Motte mettent plus le maillot des Cobalts pour jouer le dimanche. Ils ont tous ressorti le vert du village."}
        - "Dimanche, à la main courante, les anciens de la Nord qui vivent à la Motte n'ont pas voulu parler de samedi. Ils ont parlé de la pluie et des patates. Ils ne parlent jamais de la pluie."
      moyen:
        - {si: "role == selectionneur", texte: "Les gens du village regardent les Cobalts au Relais, sans crier. Ils discutent les remplacements comme ceux de l'U.S., le dimanche. Des drapeaux, personne en a encore acheté."}
        - "Les anciens de la Nord refont le match de samedi à la main courante, sans crier. Ils disent « on verra » à chaque phrase. À la Motte, « on verra », ça veut dire qu'on attend."
      haut:
        - {si: "role == selectionneur", texte: "Les gamins du village ont peint des drapeaux des Cobalts sur la tribune de bois. Je les ai laissés faire. J'ai même payé la peinture."}
        - "Dimanche, les anciens de la Nord ont chanté ton nom à la main courante pendant notre match. L'arbitre a sifflé pour qu'ils se taisent. Ils ont chanté plus fort."
    repliques:
      - {lien: 0, texte: "La tribune de bois, c'est mon père qui l'a montée en 1952, avec les planches d'une grange. Quatre gradins. Il manque une planche à la troisième ; on s'assoit à côté."}
      - {lien: 0, si: "jour == dim", texte: "Coup d'envoi à quinze heures. L'entrée, c'est ce que vous voulez dans la boîte. La buvette, c'est ma femme. Le tableau, c'est moi, à la craie, à chaque but."}
      - {lien: 0, si: "serie_d >= 2", texte: "Les samedis où la Rive perd, le dimanche, j'ai du monde. Ils viennent voir un match qu'on peut perdre sans que ce soit grave."}
      - {lien: 1, texte: "Je suis maçon la semaine. Le samedi, je trace les lignes à la chaux ; le dimanche, j'arbitre ou j'entraîne, selon qui est malade. Le lundi, j'ai mal partout."}
      - {lien: 1, si: "tranche == matin", texte: "La chaux, faut la passer le matin, avant le vent. L'an dernier, une ligne a bougé, et on discute encore du penalty."}
      - {lien: 2, texte: "Trois de mes gamins sont partis à la Rive. Un a joué en première division, un est mécanicien, un est mort sur la départementale. Je garde leurs licences dans la même boîte."}
      - {lien: 3, texte: "Il te faut du monde un samedi, tu me dis. Je loue le car du ramassage scolaire et je fais les fermes. Quarante personnes en vert. Ça crie avec l'accent, mais ça crie."}
      - {lien: -1, texte: "L'entrée, c'est dans la boîte. Comme tout le monde."}
      - {lien: -2, texte: "Je serre plus de mains pendant les matchs. J'ai la craie."}
      - {lien: -3, texte: "Votre nom est sur la main courante, barré, à la peinture. On repeint au printemps. Pas avant."}
    tuyaux:
      - id: cmp_gassiat_didier
        si: "flag(histoire_h3) && flag(h3_halle_vue)"
        texte: "« Didier Vallin a joué ici de dix à quatorze ans, avant la Rive. Sa licence de juin 1989, je l'ai vue au district. La photo, c'est pas lui. Un grand blond. Didier, il était brun comme un corbeau. »"
      - id: cmp_gassiat_banderole
        si: "annee <= 2010 && tribunes < 40 && role != selectionneur"
        texte: "« Les anciens de la Nord d'ici te peignent une banderole dans le hangar de la coopérative. Contre toi. Le drap sèche encore. Dimanche, ils seront à la main courante, à écouter ce qui se dit. »"
        effets: {jauges: {tribunes: 2}}
    service:
      lien: 3
      label: "Le car de la Motte"
      texte: "Jacques loue le car du ramassage scolaire et fait la tournée des fermes le samedi midi. Quarante personnes de la Motte en tribune, en vert, qui crient ton nom avec l'accent du canton."
      effets: {jauges: {tribunes: 3}}

  - id: coralie_gassiat
    name: "Coralie Gassiat"
    label: "PRÉSIDENTE DE L'U.S. LA MOTTE"
    genre: f
    portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: queue, cheveux: chatain, pilosite: rase, lunettes: aucune, tenue: survetement, couleur: bouteille, couleur2: blanc, accessoire: sifflet}
    lieu: stade_village
    tranches: [aprem, soir]
    annees: [2011, 2050]
    reseau: tribunes
    trace: "Coralie a inscrit ton nom sur la feuille de la buvette, colonne des bénévoles, sans te demander."
    paliers: ["te prête un sifflet du club", "te confie les poussins le mercredi", "remplirait la tribune de bois pour toi"]
    froid: ["te fait payer l'entrée", "ne t'appelle plus par ton nom", "t'interdit la main courante"]
    activites: [cmp_coralie_poussins]
    on_relation: {3: vi.coralie_gassiat.maillot}
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Plus un gamin de la Motte vient en maillot des Cobalts. Ils mettent le vert du village, même délavé."}
        - "Dimanche, ceux de la Nord qui vivent à la Motte ont dit qu'ils regarderaient samedi sur leur téléphone, au chaud. Ils n'ont pas dit « on y va ». Chez eux, c'est grave."
      moyen:
        - {si: "role == selectionneur", texte: "Au Relais, les soirs de Cobalts, on regarde la première mi-temps. À la seconde, on parle des foins. Faudrait un match qui leur donne une raison de rester devant."}
        - "Les anciens de la Nord parlent du samedi à voix basse, à la main courante, comme d'un malade. Pas de bonne nouvelle, pas de mauvaise. Ils attendent un signe."
      haut:
        - {si: "role == selectionneur", texte: "Les gamins ont peint les couleurs des Cobalts sur la tribune de bois, par-dessus le vert. C'est moi qui tenais l'échelle."}
        - "Dimanche, les vieux de la Nord ont réservé un car pour samedi, pour tout le village. Même ceux qui n'ont jamais mis les pieds à la Rive ont donné leur nom."
    repliques:
      - {lien: 0, texte: "J'ai repris le club quand mon père a lâché la craie. J'ai gardé le tableau peint à la main et la boîte de l'entrée. J'ai ajouté une équipe de filles. Mon père a dit : enfin."}
      - {lien: 0, si: "annee >= 2030", texte: "Il nous reste quatorze seniors, dont trois qui ont passé quarante ans. Valbrume veut fusionner. Mon père aurait dit non. Avec quatorze, je fais pas une saison."}
      - {lien: 1, texte: "J'ai joué à la Rive quelques saisons, avec la section féminine, devant trois cents personnes. À la Motte, on est quarante, et je les connais tous par leur prénom."}
      - {lien: 2, texte: "Les recruteurs de la capitale viennent voir nos gamins de neuf ans avec des tablettes. Ils leur mesurent les pieds. Le gamin qui pleure quand il perd, ils le voient pas, sur leur tablette."}
      - {lien: 3, texte: "La tribune pleine, un samedi, je te la remplis. Je fais sonner les téléphones du canton, je loue deux cars, et le second, c'est moi qui le conduis."}
      - {lien: -1, texte: "La boîte est à l'entrée. Vous payez comme les autres."}
      - {lien: -2, texte: "On a pas besoin de bénévoles cette semaine. Ni la prochaine."}
      - {lien: -3, texte: "La main courante, c'est pour les licenciés. Vous en êtes pas."}
    tuyaux:
      - id: cmp_coralie_brac
        si: "flag(histoire_h10)"
        texte: "« Le petit Brac a commencé ici, à six ans, dans nos buts. Rive Capital nous a offert un minibus neuf l'an dernier. Le chauffeur emmène nos gamins de douze ans en stage à la capitale, le mercredi. »"
      - id: cmp_coralie_abonnements
        si: "annee >= 2011 && tribunes < 40 && role != selectionneur"
        texte: "« Dimanche, à la main courante, ceux de la Nord parlaient de rendre leurs abonnements samedi, au stade, devant les caméras, pas au guichet. Ils ont déjà répété la scène deux fois. »"
        effets: {jauges: {tribunes: 2}}
    service:
      lien: 3
      label: "La haie d'honneur"
      texte: "Samedi, les gamins de l'U.S. La Motte forment la haie d'honneur à l'entrée des joueurs, en vert, les maillots trop grands. La Nord se tait une minute en les voyant, puis elle chante plus fort."
      effets: {jauges: {tribunes: 2, vestiaire: 1}}

# ═══════════════════════════════════════════════════════════════ LES ACTIVITÉS
# Le quartier est loin : on y vient pour une ou deux tranches. Pas d'`objet` (pas de pièce) :
# elles s'affichent dans le panneau du lieu. Ce qu'on fait avec quelqu'un porte la borne de
# son époque ; les francs sont ceux de 1990. La moisson est un petit boulot (`max_jour`), pour
# ceux qu'une journée de paille ne fait pas déchoir.
activites:

  # — La ferme
  - id: cmp_soulie_traite
    lieu: ferme
    label: "La traite avec Prosper"
    texte: "Prosper trait à la main la Rousse, la seule qui refuse la machine. Le transistor grésille au clou de l'étable. Il te tend un seau, te montre le geste une fois, et retourne à sa vache."
    textes:
      - "Prosper trait à la main la Rousse, la seule qui refuse la machine. Le transistor grésille au clou de l'étable. Il te tend un seau, te montre le geste une fois, et retourne à sa vache."
      - "Six heures, la vapeur des bêtes dans le froid. Prosper compte les vaches en entrant, par leur nom, et s'arrête sur une : « Elle boite. Le vétérinaire viendra lundi, s'il veut. »"
      - "Au transistor, les résultats de la veille. Prosper ne commente pas ; il change de vache à chaque score, comme on tourne une page. À la fin : « Elles l'ont mieux pris que moi. »"
    si: "annee <= 2008"
    avec: prosper_soulie
    habitude: quartier
    tranches: 1
    francs: 0
    heures: [matin, soir]
  - id: cmp_soulie_transistor
    lieu: ferme
    label: "Le transistor du soir"
    texte: "Sur le banc contre le mur du logis, Prosper pose le transistor entre vous deux et monte le son pour les résultats. Il écoute les yeux fermés, et ses lèvres disent les scores avant le speaker."
    textes:
      - "Sur le banc contre le mur du logis, Prosper pose le transistor entre vous deux et monte le son pour les résultats. Il écoute les yeux fermés, et ses lèvres disent les scores avant le speaker."
      - "Prosper ouvre une bouteille de cidre sans étiquette et t'en sert un verre trouble. « La pomme de l'année du titre. Elle tient. » Le transistor donne les scores, l'un après l'autre."
      - "La nuit tombe sur la cour. Le speaker dit ton nom ; Prosper baisse le son, par politesse, et le remonte après. Les poules se couchent avant la fin des résultats."
    si: "annee <= 2008"
    avec: prosper_soulie
    habitude: culture
