    label: "Le plat du jour de Bastien"
    texte: "Bastien écrit le plat du jour avec la craie de sa grand-mère, la même écriture penchée. Il te sert, reste une minute pour voir ta première bouchée, et retourne en cuisine."
    textes:
      - "Bastien écrit le plat du jour avec la craie de sa grand-mère, la même écriture penchée. Il te sert, reste une minute pour voir ta première bouchée, et retourne en cuisine."
      - "Il pose une assiette qui n'est pas à la carte. « Un essai. Ma grand-mère le faisait les jours de noce. Dis-moi s'il manque quelque chose. Il manque toujours quelque chose. »"
