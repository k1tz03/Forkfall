  - id: cmp_relais_feu
    lieu: auberge
    label: "Un verre au coin du feu"
    texte: "Un verre de vin du canton au coin de la cheminée. Les bûches sifflent. À la table voisine, deux hommes en bottes refont le match du village de dimanche, but par but."
    textes:
      - "Un verre de vin du canton au coin de la cheminée. Les bûches sifflent. À la table voisine, deux hommes en bottes refont le match du village de dimanche, but par but."
      - "Le feu tire mal ce soir ; la fumée pique les yeux de tout le monde, et personne ne bouge. À la Motte, on ne change pas de place pour si peu."
      - "Un vieux en veste de chasse te reconnaît, lève son verre et dit tout haut le score de ton dernier match. Il se trompe d'un but. Personne ne le corrige, toi non plus."
