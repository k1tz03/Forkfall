# LA VILLE VIVANTE — lot « hauts » : Les Hauts, le quartier d'affaires, au nord
# (docs/histoires/grand_auberive.md ; docs/histoires/ville_vivante.md, le format : § 8).
#
# Là où le football se vend : la chaîne, l'assureur qui habille le maillot, le palace
# où l'on signe, la galerie, les avocats, le restaurant d'en haut, et la dalle venteuse
# entre les tours. Le quartier s'ouvre à la 2ᵉ saison (ville_quartiers.js) : tout ce qui
# s'y joue arrive au plus tôt à `saison >= 2`, et chaque scène posée à un lieu des Hauts
# le dit dans son `si`.
#
# Sept lieux, deux visages chacun, l'un après l'autre, sans trou ni chevauchement :
#
#   tour_ecran       la tour Écran        Ghislaine Ordioni   1990-2016  presse     la maquilleuse du plateau
#                                         Malo Kerbiriou      2017-2050  presse     le chef de régie
#   tour_dalmene     la tour Dalmène      Hugues Castagnède   1990-2014  argent     le partenariat sportif
#                                         Apolline Sarrazin   2015-2050  argent     l'actuaire
#   hotel_imperial   l'Impérial           Anselme Vaissière   1990-2013  direction  le chef concierge
#                                         Nadir Meziane       2014-2050  direction  son ancien groom, chef concierge
#   galerie_hauts    la galerie des Hauts Hortense Valcour    1990-2016  milieu     l'horlogère
#                                         Aurèle Valcour      2017-2050  milieu     son petit-fils, les rachats
#   cabinet_verdier  le cabinet Verdier   Aristide Verdier    1990-2015  direction  l'avocat
#                                         Constance Verdier   2016-2050  direction  sa fille
#   table_hauts      la Table des Hauts   Lazare Pradel       1990-2018  mairie     le maître d'hôtel
#                                         Romane Castelli     2019-2050  mairie     la serveuse de 2010, maître d'hôtel
#   parvis           le parvis            Raoul Fontès        1990-2019  rue        le laveur de vitres
#                                         Karine Fontès       2020-2050  rue        sa fille, sur corde
#
# Le monde qu'ils tiennent : la lame rouge ÉCRAN ne change pas quand les propriétaires
# changent ; Télé-Stade y loue le plateau du dimanche (Massenet consultant en 2000,
# Rossard sur le plateau de Vence en 2012), puis tout passe en flux (2024) et la deuxième
# division se commente d'une voix de synthèse (2037). Dalmène met son nom sur le maillot
# depuis 1986 ; la Prévoyance Aubérivoise est l'assureur local que Dalmène réassure
# (livres 2 et 5). La Tréfilerie, les Hauts-de-Rive (les villas, plus bas) et la tour
# Valdorne (les années soixante-dix, derrière l'Impérial) sont des voisins, pas des lieux.
#
# Ce que les livres trouvent ici (les tuyaux, au bon moment du bon livre) :
#   1  le banquet de 1977 payé en liquide, dans une enveloppe kraft (Anselme)
#   2  la police homme-clé réassurée (Hugues) ; la fumée d'un wagon à la friche (Raoul)
#   3  les montres de communiant gravées pour les gamins du centre (Hortense)
#   4  l'arrêt Vaneste, pour qui finit son contrat (Aristide)
#   5  Maître Larrieu → h5_larrieu (Aristide) ; la cabine du mardi (Anselme) ; le 2 novembre
#      (Hugues) ; Madame Vialat le jeudi → relation vialat (Lazare) ; Lambert (Lazare)
#   6  le carnet tapé au propre → h6_indices (Ghislaine) ; le garçon poli de Malbec →
#      h6_indices (Anselme) ; JF Conseil au greffe (Aristide) ; la Mutuelle (Hugues, Hortense)
#   7  la carte de visite de Rossard (Ghislaine) ; le procès-verbal en double (Aristide) ;
#      les vingt-sept montres de Fulgor (Hortense) ; le dessert du barrage (Lazare) ; le bus (Raoul)
#   8  la clé du coursier (Malo) ; les nuits vendues (Apolline) ; l'inventaire (Nadir) ; la voix
#      cédée en 2020 (Constance) ; le premier lundi de Vaubourg → relation aulard (Romane) ;
#      le minuteur des projecteurs → h8_cycle_trois_heures (Karine)
#   9  la caméra neuf (Malo) ; l'annulation assurée (Apolline) ; les montres du Dôme (Aurèle) ;
#      les deux factures (Constance) ; la table sept en décembre 2010 (Romane)
#   10 la liste de mots de Rive Capital (Malo) ; l'hélicoptère prêté (Apolline) ; la dame du
#      mois (Nadir) ; les deux clapets vendus (Aurèle) ; l'article dix (Constance) ; la nappe de
#      la troisième tranche (Romane) ; le plan de vol (Karine)
#
# Les activités qu'on fait avec quelqu'un portent la borne de ses années (`si`) : un point de
# lien ne va jamais à quelqu'un qui n'est plus à sa place. Aucun accord sur le héros ; les
# objets datés ont leur année ; aucune somme dans un texte qui n'est pas daté. Les quatre
# anciens (Hugues, Anselme, Aristide, Lazare) vouvoient toujours ; les autres tutoient à +2.
gens:

  # ═════════════════════════════════════════════════════════════ LA TOUR ÉCRAN (tour_ecran)

  - id: ghislaine
    name: "Ghislaine Ordioni"
    label: "LA MAQUILLEUSE DU PLATEAU"
    genre: f
    portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: chignon, cheveux: roux, pilosite: rase, lunettes: aucune, tenue: blouse, couleur: noir, accessoire: badge}
    lieu: tour_ecran
    tranches: [midi, aprem, soir]
    annees: [1990, 2016]
    reseau: presse
    trace: "Ghislaine a écrit ton nom sur un bout de ruban adhésif et l'a collé sur une boîte de poudre."
    paliers: ["te garde une place dans son fauteuil", "a une teinte à ton nom dans son tiroir", "effacerait trois nuits blanches pour toi"]
    froid: ["te fait attendre debout dans la loge", "te poudre trop blanc", "ne te maquille plus"]
    activites: [hauts_ecran_fauteuil]
    on_relation: {3: vi.ghislaine.teinte, -3: vi.ghislaine.lampe}
    repliques:
      - {lien: 0, texte: "Asseyez-vous face à la lampe. Sous les projecteurs, une nuit blanche se voit à vingt mètres. Les yeux d'abord ; le reste, on le pardonne."}
      - {lien: 0, si: "annee < 2000", texte: "Le plateau du dimanche passe en direct à vingt heures trente. À vingt heures vingt-huit, tout le monde me demande un mouchoir. Les présidents surtout."}
      - {lien: 0, si: "annee >= 2007", texte: "La haute définition est arrivée cet hiver. On voit les pores, les veines, la veille. Je mets deux fois moins de poudre, et il en faudrait deux fois plus."}
      - {lien: 0, si: "serie_d >= 2", texte: "Les consultants parlent de vous à l'antenne depuis trois dimanches. Ces soirs-là, ils ont tous le même fard : ils transpirent de plaisir."}
      - {lien: 1, si: "annee >= 2000 && annee <= 2010", texte: "Massenet prend l'ivoire numéro deux depuis son premier dimanche. Il a pâli depuis. Il refuse de changer de numéro ; il dit que c'est sa marque."}
      - {lien: 1, si: "tranche == soir", texte: "Entre deux invités, je fume sur l'escalier de secours, au cinquième. D'en haut, le stade de la Rive a l'air d'une boîte de poudre ouverte."}
      - {lien: 1, si: "flag(consultant)", texte: "Alors vous venez aussi le dimanche, maintenant. Les consultants fanent plus vite que les joueurs, sous mes lampes. On se reverra souvent."}
      - {lien: 2, texte: "Ma mère faisait les ourlets des cadres de la Tréfilerie. Moi, je fais leurs visages. On rallonge, on raccourcit, et personne ne voit les coutures."}
      - {lien: 2, si: "role != president && role != selectionneur && annee <= 1999", texte: "Ton président est venu se faire poudrer dimanche, pour deux minutes d'antenne. Il a gardé la serviette autour du cou jusqu'à sa voiture."}
      - {lien: 3, texte: "Si un soir tu dois passer à l'antenne avec une tête de lendemain, monte par l'escalier de secours. Je laisse la porte du cinquième entrouverte jusqu'à vingt heures."}
      - {lien: -1, texte: "Le fauteuil est pris. Il reste une chaise dans le couloir, à côté de l'extincteur."}
      - {lien: -2, texte: "Je vous ai mis la teinte d'un autre, ce soir. Personne ne le verra. Vous, si, à la rediffusion."}
      - {lien: -3, texte: "Je ne touche plus à votre visage. Passez sous les lampes tel quel. C'est bien ce que vous voulez qu'on voie, non ?"}
    tuyaux:
      - id: ghislaine_cravates
        si: "annee <= 2016 && direction < 40 && role != president && role != selectionneur"
        texte: "« Ton président s'est fait maquiller pour dimanche. Il avait deux cravates, une noire, une bordeaux, et il m'a demandé laquelle allait pour annoncer un départ. »"
        effets: {jauges: {direction: 2}}
      - id: ghislaine_fiche
        si: "annee <= 2016 && tribunes < 40"
        texte: "« Dimanche, le consultant aura une fiche sur toi. Je l'ai vue dépasser de sa poche pendant que je faisais ses cernes : trois dates, et le nom du Corner. »"
        effets: {jauges: {tribunes: 1}}
      - id: ghislaine_carnet
        si: "flag(histoire_h6) && saison >= 2 && !flag(h6_faux_nom)"
        texte: "« Massenet relisait dans mon fauteuil une fiche sur tes ventes : le prix payé, et à côté le prix de ton carnet. Tapée au propre, sans une faute. Lui tape avec deux doigts. »"
        effets: {var: {h6_indices: "+1"}}
      - id: ghislaine_rossard
        si: "flag(histoire_h7) && flag(h7_rossard_plateau) && !flag(h7_rossard_source)"
        texte: "« Dimanche, Rossard avait l'heure écrite au dos d'une carte de visite, à l'encre bleue : deux heures vingt-cinq. La carte était celle du secrétaire général de la Fédération. »"
        effets: {jauges: {vestiaire: 1}}
    service:
      lien: 3
      label: "Effacer trois nuits"
      texte: "Ghislaine te fait asseoir sous la lampe froide et travaille vingt minutes sans parler. Dans la glace, quelqu'un qui a dormi. À l'antenne, personne ne te demande si ça va."
      effets: {jauges: {tribunes: 2, direction: 1}}

  - id: malo
    name: "Malo Kerbiriou"
    label: "CHEF DE RÉGIE, TOUR ÉCRAN"
    genre: m
    portrait: {teint: clair, corpulence: fin, age: jeune, coiffure: court, cheveux: brun, pilosite: barbe, lunettes: carrees, tenue: pull, couleur: anthracite, accessoire: micro}
    lieu: tour_ecran
    tranches: [aprem, soir]
    annees: [2017, 2050]
    reseau: presse
    trace: "Malo a noté l'heure de ta visite sur le conducteur, entre deux plans de coupe."
    paliers: ["te laisse entrer en régie", "te montre les plans qu'on n'a pas diffusés", "couperait l'image pour toi"]
    froid: ["te laisse derrière la vitre", "te cadre de trop près", "reste sur toi plus longtemps qu'il ne faut"]
    activites: [hauts_ecran_regie]
    on_relation: {3: vi.malo.carnet, -3: vi.malo.duree}
    repliques:
      - {lien: 0, texte: "Douze écrans, ici, et on en envoie un seul au pays. Les onze autres, c'est ce qu'on appelle le reste du monde. Il n'intéresse personne."}
      - {lien: 0, si: "annee >= 2024", texte: "Depuis que tout passe en flux, on a sept secondes de différé. Sept secondes pour qu'un mot de trop ne sorte pas. Il sort quand même, de la tribune."}
      - {lien: 0, si: "serie_d >= 2", texte: "Samedi, le réalisateur voulait ton visage à chaque but encaissé. Quatre fois. Je n'avais pas le choix du plan. J'avais le choix de la durée."}
      - {lien: 1, texte: "J'ai commencé caméra à l'épaule, en 2007, au bord de la pelouse de la Rive. Le froid de février, on ne l'oublie pas. Je garde deux pulls en régie."}
      - {lien: 1, si: "annee >= 2034", texte: "Sur la deuxième division, on n'a plus de commentateur. Une voix de synthèse lit les noms. Elle écorche les accents, et plus personne ne la corrige."}
      - {lien: 2, texte: "Je tiens un carnet des plans coupés. Une main sur une épaule, un président qui part avant la fin, un gamin qui pleure en tribune. Le carnet ment moins que les résumés."}
      - {lien: 3, texte: "Si un samedi tu fais devant les caméras quelque chose que tu regrettes, ne regarde pas la quatre. Je serai sur la neuf."}
      - {lien: -1, texte: "La régie est fermée aux visiteurs. Il y a un écran dans le hall ; il montre la même chose, en plus petit."}
      - {lien: -2, texte: "Samedi, je t'ai cadré serré. Très serré. On voyait la sueur. C'est un choix de réalisation."}
      - {lien: -3, texte: "La régie t'est fermée. Si tu veux savoir ce que je fais de toi, regarde samedi. Je reste sur toi aussi longtemps qu'il faut."}
    tuyaux:
      - id: malo_banc
        si: "annee >= 2017 && direction < 40 && role != president"
        texte: "« On nous a demandé, par écrit, de te garder à l'image chaque fois que ça tourne mal. La demande ne vient pas de la chaîne. Elle vient de chez toi. »"
        effets: {jauges: {direction: 1}}
      - id: malo_cle
        si: "flag(histoire_h8) && flag(h8_video)"
        texte: "« La vidéo n'est jamais passée par ma régie avant vingt heures. Une clé, déposée à l'accueil par un coursier du fonds. L'image et le son n'ont pas la même date. »"
        effets: {jauges: {tribunes: 1}}
      - id: malo_camera_neuf
        si: "flag(histoire_h9) && flag(h9_direct_tunnel) && !flag(h9_brassard_porte) && !flag(h9_brassard_rendu)"
        texte: "« Au Dôme, la régie internationale coupe le tunnel trois secondes avant l'hymne. Sauf la caméra neuf, celle de Télé-Stade. Vence a payé pour qu'elle reste allumée. »"
        effets: {jauges: {tribunes: 1}}
      - id: malo_liste_mots
        si: "flag(histoire_h10) && flag(h10_voix_gardee)"
        texte: "« La voix de Gigi sort de notre neuvième étage : quatre entretiens de 1994, et une liste de mots livrée avec le contrat. « Magnifique » en tête. Le contrat est signé Rive Capital. »"
    service:
      lien: 3
      label: "Couper l'image"
      texte: "À la soixante-dixième, la caméra te quitte pour un ralenti de la pelouse et ne revient pas. Le pays ne voit pas ce que tu as fait de tes mains."
      effets: {jauges: {direction: 2, tribunes: 1}}
      dette: true

  # ═════════════════════════════════════════════════════════ LA TOUR DALMÈNE (tour_dalmene)

  - id: hugues
    name: "Hugues Castagnède"
    label: "PARTENARIATS, DALMÈNE ASSURANCES"
    genre: m
    portrait: {teint: clair, corpulence: moyen, age: age, coiffure: degarni, cheveux: blanc, pilosite: moustache, lunettes: carrees, tenue: costume, couleur: marine, couleur2: blanc, accessoire: montre}
    lieu: tour_dalmene
    tranches: [matin, midi, aprem]
    annees: [1990, 2014]
    reseau: argent
    trace: "Hugues a arrêté son chronomètre en te voyant entrer, et l'a remis dans sa poche de gilet."
    paliers: ["te reçoit au trente-deuxième", "te montre ses chiffres", "plaiderait pour toi devant le comité"]
    froid: ["te fait attendre au rez-de-chaussée", "ne te répond plus que par écrit", "t'a rayé de ses chiffres"]
    activites: [hauts_dalmene_chrono]
    on_relation: {3: vi.hugues.chronometre, -3: vi.hugues.logo}
    climat:
      bas:
        - {si: "role == joueur", texte: "Votre prime d'assurance individuelle est arrivée avec trois semaines de retard, réglée par un chèque qui n'était pas à votre nom. On remarque ces choses-là, ici."}
        - {si: "role == president", texte: "Votre trésorier a demandé une avance sur le partenariat de l'an prochain. Le comité a souri, puis il a voté non. On ne prête pas l'année suivante à qui n'a plus la présente."}
        - {si: "role == selectionneur", texte: "La Fédération nous a demandé de verser d'avance la prime de la tournée. Une fédération qui réclame d'avance ne sait plus comment payer ses hôtels."}
        - "Le club a réglé sa dernière échéance au vingt-neuvième jour, avec un chèque daté du trentième. Au comité, on a ressorti la règle à calcul. Ses comptes ne passent plus la porte."
      moyen:
        - {si: "role == joueur", texte: "Votre prime tombe à l'heure, ni avant ni après. Chez nous, on appelle ça un dossier calme. Personne ne regarde les dossiers calmes."}
        - {si: "role == president", texte: "Votre trésorerie tient jusqu'en mai d'après nos chiffres, si personne ne se blesse. Le comité vous a classé « à suivre ». C'est mieux que « à revoir »."}
        - {si: "role == selectionneur", texte: "Les comptes de la Fédération tiennent, à condition de ne pas perdre deux fois à domicile. Les sponsors savent compter les buts, eux aussi."}
        - "Les comptes du club tiennent la saison si rien ne casse. Le comité a renouvelé le maillot pour un an, pas trois. Un an, chez nous, c'est une question qu'on pose."
      haut:
        - {si: "role == joueur", texte: "Vous avez réglé trois ans de prime d'un coup, en janvier. Au comité, quelqu'un a demandé si vous comptiez vous blesser. Ils ont trouvé ça drôle. Moi, j'ai noté la date."}
        - {si: "role == president", texte: "Votre trésorerie fait des envieux. Deux assureurs de la capitale m'ont demandé votre numéro. Je ne l'ai pas donné : je n'aime pas qu'on me prenne mes clients."}
        - {si: "role == selectionneur", texte: "La Fédération paie d'avance, cette année, et en entier. Nos juristes se demandent qui a payé la Fédération. Moi, je ne me demande rien."}
        - "Le club a payé l'échéance en avance et demandé un logo plus grand sur la poitrine. Au comité, on a ouvert une bouteille. Elle avait mon âge, à peu de chose près."
    repliques:
      - {lien: 0, texte: "Quatorze secondes, samedi : notre nom à la télévision, entre deux ralentis. L'an dernier, à la même journée, vingt-deux. Je mesure. C'est mon métier."}
      - {lien: 0, si: "annee < 2002", texte: "Un franc dépensé sur un maillot doit revenir en vingt centimes de notoriété. Je ne sais pas ce qu'est un centime de notoriété. Le comité non plus. Il me croit."}
      - {lien: 0, si: "serie_d >= 2", texte: "Quand vous perdez, les caméras montrent le maillot moins longtemps. Elles aiment les vainqueurs. Nous aussi, pour des raisons comptables."}
      - {lien: 1, texte: "Ce chronomètre a mesuré la finale de 1974, depuis la tribune de presse. Trois buts en vingt et une minutes. J'ai rangé mes notes ; je n'ai jamais revu un gardien aussi lent."}
      - {lien: 1, si: "tranche == matin", texte: "Le matin, le trente-deuxième est vide. On voit la Rive jusqu'à l'écluse. Les clients regardent la vue. Moi, je regarde les toits qui n'ont pas de paratonnerre."}
      - {lien: 2, texte: "J'ai assuré des usines, des péniches, une cathédrale. Un club de football est le seul risque que les gens assurent en chantant."}
      - {lien: 2, si: "annee >= 2008", texte: "On me remplacera par une jeune femme qui calcule les sinistres avant qu'ils arrivent. Elle sera plus exacte que moi. Moins aimable, j'espère pour elle."}
      - {lien: 3, texte: "Si un jour le comité veut retirer notre nom de chez vous, je le saurai le jeudi. Vous le saurez le vendredi à huit heures, au téléphone. C'est le plus tôt possible."}
      - {lien: -1, texte: "Le trente-deuxième reçoit sur rendez-vous. L'accueil vous donnera une date. Elle sera lointaine."}
      - {lien: -2, texte: "Je vous réponds par écrit, désormais. Mon service juridique relit mes lettres, et il est lent."}
      - {lien: -3, texte: "J'ai rayé votre nom de mes chiffres. Le comité suivra. Il suit toujours ce que j'ai déjà rayé."}
    tuyaux:
      - id: hugues_comite
        si: "annee <= 2014 && caisse < 35 && role != joueur"
        texte: "« Le comité de Dalmène vote jeudi sur votre maillot. Il a lu vos comptes avant vos résultats. Venez à neuf heures avec un chiffre, un seul, et ne parlez pas de football. »"
        effets: {jauges: {caisse: 2}}
      - id: hugues_homme_cle
        si: "flag(histoire_h2) && saison >= 2"
        texte: "« La police homme-clé de votre prédécesseur, la Prévoyance la porte et Dalmène la réassure. Votre président a appelé trois fois pour la date de l'an et un jour. Il l'a notée en rouge. »"
      - id: hugues_deux_novembre
        si: "flag(histoire_h5) && flag(h5_tribune_est_brulee) && saison >= 2"
        texte: "« Le 2 novembre, le directeur de la Banque Aubérivoise a appelé notre direction : une tribune de bois de 1931, est-ce que ça se couvre encore ? Le 3, il bloquait votre compte. »"
      - id: hugues_mutuelle
        si: "flag(histoire_h6) && saison >= 2"
        texte: "« La Mutuelle des Quais nous a demandé de réassurer ses primes de performance. Notre juriste a lu ses comptes : l'argent arrive des clubs acheteurs et repart vers deux initiales. »"
    service:
      lien: 3
      label: "Une avance sur le maillot"
      texte: "Hugues signe un bon sur papier bleu et le fait descendre à la comptabilité. « Une avance sur la saison prochaine. Le comité l'apprendra avec la saison prochaine. »"
      effets: {jauges: {caisse: 4}}
      dette: true

  - id: apolline
    name: "Apolline Sarrazin"
    label: "ACTUAIRE, DALMÈNE ASSURANCES"
    genre: f
    portrait: {teint: clair, corpulence: fin, age: jeune, coiffure: queue, cheveux: chatain, pilosite: rase, lunettes: rondes, tenue: tailleur, couleur: gris, accessoire: stylo}
    lieu: tour_dalmene
    tranches: [matin, midi, aprem]
    annees: [2015, 2050]
    reseau: argent
    trace: "Apolline a écrit ton nom au crayon dans son carnet, à côté d'une probabilité qu'elle n'a pas voulu dire."
    paliers: ["te dit tes chiffres sans arrondir", "te montre la page au crayon", "mettrait un calcul en retard pour toi"]
    froid: ["ne te répond que par courriel", "te classe en risque aggravé", "ne te couvre plus"]
    activites: [hauts_dalmene_tableaux]
    on_relation: {3: vi.apolline.crayon, -3: vi.apolline.colonne}
    climat:
      bas:
        - {si: "role == joueur", texte: "Ton compte a été débité deux fois pour la même prime, et la seconde a été rejetée. Le modèle t'a déjà mis dans la colonne des gens qui vont vendre leur voiture."}
        - {si: "role == president", texte: "Ta trésorerie tient jusqu'à la fin du mois, d'après le modèle, et le modèle est optimiste. Il ne connaît pas encore le prix de tes salaires de mars."}
        - {si: "role == selectionneur", texte: "La Fédération a demandé un échelonnement pour la prime du stage d'été. Le modèle lui donne une chance sur trois de payer à temps. Il est rarement trop sévère."}
        - "Le club a demandé à payer sa prime en douze fois. Le modèle a répondu en moins d'une seconde : risque élevé. Moi, j'ai mis une heure à le relire. Il avait raison."
      moyen:
        - {si: "role == joueur", texte: "Ton compte respire, sans plus. Le modèle te place au milieu de la courbe : ni dépensier, ni prudent. C'est là qu'on se cache le mieux."}
        - {si: "role == president", texte: "Ta trésorerie passe l'hiver si les droits tombent à la date. Le modèle te donne deux chances sur trois. Je n'arrondis jamais ; tu peux me croire."}
        - {si: "role == selectionneur", texte: "La Fédération paie à trente jours, comme tout le monde. Le modèle ne la surveille plus. C'est souvent à ce moment-là qu'il faudrait."}
        - "Les comptes du club tiennent la ligne. Le modèle les a classés « stables », ce qui veut dire qu'il ne sait pas encore de quel côté ils vont tomber."
      haut:
        - {si: "role == joueur", texte: "Tu as payé trois ans de prime d'avance. Le modèle t'a signalé : comportement atypique. Chez nous, un client qui n'a peur de rien inquiète."}
        - {si: "role == president", texte: "Ta trésorerie a un an d'avance sur ses dettes. Le modèle a réduit ta prime de huit pour cent. Je l'aurais réduite de dix ; il est plus prudent que moi."}
        - {si: "role == selectionneur", texte: "La Fédération a tout payé d'un coup, avant l'échéance. Le modèle s'est demandé d'où venait l'argent. Il ne pose pas la question ; il la note."}
        - "Le club a réglé l'année d'avance et demandé une couverture plus large. Le modèle a baissé sa prime. Il n'a pas l'habitude ; il l'a fait en tremblant, si un modèle tremble."
    repliques:
      - {lien: 0, texte: "Je calcule ce qui va arriver aux gens et je le vends à ceux qui ne veulent pas que ça leur arrive. On appelle ça une prime. Asseyez-vous, ce n'est pas contagieux."}
      - {lien: 0, si: "annee >= 2024", texte: "Les bracelets nous disent tout : le cœur, le sommeil, le nombre de marches qu'un défenseur monte chez lui. Je préférais quand il fallait deviner."}
      - {lien: 0, si: "serie_d >= 2", texte: "Une série de défaites, chez nous, c'est une ligne qui penche. Elle ne dit rien des matchs. Elle dit combien de joueurs vont se blesser en voulant compenser."}
      - {lien: 1, texte: "Mon prédécesseur m'a laissé son chronomètre dans le premier tiroir. Je ne m'en sers pas, je ne le jette pas. C'est le seul objet de l'étage qui ne calcule rien."}
      - {lien: 1, si: "tranche == midi", texte: "À midi, je cours dix tours du bassin, sur le parvis. Ceux du trente-deuxième me regardent par la vitre. Ils calculent combien de temps je tiendrai."}
      - {lien: 2, texte: "J'écris au crayon, dans un carnet de papier. Ce qui est au crayon ne part pas sur le réseau. Mes chiffres, je veux savoir qui les lit."}
      - {lien: 2, si: "annee >= 2035", texte: "La Rive monte de quatre centimètres par an. Sur nos cartes, le stade est en zone bleue depuis 2031. Personne au club ne nous a demandé la carte."}
      - {lien: 3, texte: "Si un jour un de mes modèles condamne quelqu'un de chez toi, je te le dirai avant de l'envoyer. Je ne peux pas l'arrêter. Je peux le mettre en retard."}
      - {lien: -1, texte: "Envoyez vos questions par écrit. Je réponds dans l'ordre d'arrivée, et la vôtre est arrivée la dernière."}
      - {lien: -2, texte: "Votre dossier est passé en risque aggravé. Ce n'est pas une opinion. C'est une colonne."}
      - {lien: -3, texte: "Dalmène ne vous couvre plus, ni vous ni ce que vous signez. Le modèle a tranché ; je n'ai pas fait appel."}
    tuyaux:
      - id: apolline_risque
        si: "annee >= 2015 && caisse < 35 && role != joueur && role != selectionneur"
        texte: "« Le modèle a classé ton club « risque élevé » ce trimestre. La prime du stade monte le premier du mois. Signe le renouvellement avant le trente, et l'ancien tarif tient un an. »"
        effets: {jauges: {caisse: 2}}
      - id: apolline_nuits
        si: "flag(histoire_h8) && saison >= 2 && !flag(h8_courbes_publiees)"
        texte: "« Cadence nous revend les nuits de tes joueurs depuis l'hiver. On calcule leurs primes avec. La tienne aussi : deux heures par nuit, ça se lit en rouge dans ma colonne. »"
      - id: apolline_annulation
        si: "flag(histoire_h9) && saison >= 2 && !flag(h9_depart)"
        texte: "« La Fédération a assuré le voyage au Dôme contre l'annulation pour motif politique. Le ministère a payé la prime. Ils ont déjà chiffré ce que coûterait un brassard. »"
      - id: apolline_pret
        si: "flag(histoire_h10) && flag(h10_helico) && !flag(h10_helico_saisi)"
        texte: "« Ton hélicoptère est assuré chez nous au nom de Rive Capital, comme un bien prêté, pas donné. L'article quatre le rend au prêteur au premier manquement. Le manquement n'est pas défini. »"
    service:
      lien: 3
      label: "Mettre un calcul en retard"
      texte: "Apolline ne touche à aucun chiffre. Elle fait partir le rapport qui te concerne par le courrier du vendredi au lieu du lundi. Le comité le lira après le mercato."
      effets: {jauges: {caisse: 2, vestiaire: 1}}

  # ═════════════════════════════════════════════════════════════ L'IMPÉRIAL (hotel_imperial)

  - id: anselme
    name: "Anselme Vaissière"
    label: "CHEF CONCIERGE, L'IMPÉRIAL"
    genre: m
    portrait: {teint: clair, corpulence: fin, age: age, coiffure: court, cheveux: blanc, pilosite: rase, lunettes: aucune, tenue: costume, couleur: bordeaux, couleur2: noir, accessoire: badge}
    lieu: hotel_imperial
    tranches: [matin, aprem, soir, nuit]
    annees: [1990, 2013]
    reseau: direction
    trace: "Anselme a frappé deux fois sa sonnette de cuivre, très doucement, comme pour un client qui revient."
    paliers: ["te salue par ton nom", "te dit les numéros de chambre", "fermerait le registre pour toi"]
    froid: ["te demande ton nom à chaque fois", "te fait attendre devant le tambour", "ne te connaît plus"]
    activites: [hauts_imperial_anselme]
    on_relation: {3: vi.anselme.trois_cent_sept, -3: vi.anselme.tambour}
    climat:
      bas:
        - {si: "role == joueur", texte: "Deux hommes de votre club ont dîné au salon bleu avec un agent de Valentienne. Ils ont parlé de vous au fromage. On ne parle d'un joueur au fromage que pour le vendre."}
        - {si: "role == president", texte: "Trois de vos actionnaires ont pris le petit salon, mardi, sans vous. Ils ont demandé qu'on ferme la porte et qu'on ne serve qu'au signal. Le signal n'est jamais venu."}
        - {si: "role == selectionneur", texte: "Deux hommes de la Fédération ont dormi ici jeudi, sous un autre nom. Ils ont demandé vos derniers résultats à la réception. Elle ne les avait pas ; eux, si."}
        - "Votre président a déjeuné ici deux fois cette semaine avec le même homme, un entraîneur sans club. La seconde fois, il lui a laissé l'addition. On ne laisse l'addition qu'à un futur employé."
      moyen:
        - {si: "role == joueur", texte: "Votre club ne réserve rien chez nous en ce moment, ni salon ni chambre. Le silence d'un club, au comptoir, est un bon signe. Il ne dure jamais."}
        - {si: "role == president", texte: "Vos actionnaires dînent ici chacun de son côté, à des jours différents. Ils se méfient les uns des autres. Pour vous, c'est le meilleur des climats."}
        - {si: "role == selectionneur", texte: "La Fédération réserve ses chambres au tarif ordinaire. Ni champagne, ni suite. Quand ils ne fêtent rien et ne cachent rien, ils attendent."}
        - "Votre président prend son café au bar le lundi, seul, et repart sans signer la note. Il attend le résultat de samedi avant de réserver quoi que ce soit."
      haut:
        - {si: "role == joueur", texte: "Votre club a réservé la grande salle pour la fin de saison, avec votre nom sur le carton d'invitation. On n'imprime pas le nom d'un joueur qu'on vend."}
        - {si: "role == president", texte: "Vos actionnaires ont fêté le dernier conseil au salon bleu, vous en bout de table. Ils ont laissé un pourboire de vainqueurs. Le personnel s'en souvient encore."}
        - {si: "role == selectionneur", texte: "La Fédération a commandé du champagne pour son comité, mardi, à votre santé. Le président l'a dit deux fois. Ici, on compte ces choses-là."}
        - "Votre président a fêté la semaine au salon bleu, devant deux hommes de la Ligue. Il a parlé de vous au futur. C'est rare, au salon bleu."
    repliques:
      - {lien: 0, texte: "Ici, on ne demande personne. On dit un numéro de chambre, et l'on attend dans le fauteuil de gauche. Celui de droite est pour ceux qui viennent signer."}
      - {lien: 0, si: "annee < 2000", texte: "Les clés sont en laiton, avec un pompon rouge. Ceux qui les emportent reviennent toujours. Un homme qui a une clé se croit attendu."}
      - {lien: 0, si: "annee >= 2000", texte: "La direction a voulu des cartes magnétiques. J'ai gardé les clés de laiton derrière le comptoir. Une carte ne sait pas qui la porte ; mes clés, si."}
      - {lien: 0, si: "tranche == nuit", texte: "À trois heures, le tambour tourne encore. Je compte les tours. Un client, un tour. Deux tours, quelqu'un qui hésite à entrer, ou à ressortir."}
      - {lien: 1, texte: "Ce parapluie noir, au manche de corne, attend depuis 1977. Son propriétaire a été élu président d'un club, ce soir-là, au salon bleu. Il n'est jamais revenu le chercher."}
      - {lien: 1, si: "serie_v >= 2", texte: "Le bar a vendu quarante coupes samedi soir, à des gens de chez vous. On reconnaît une victoire aux pourboires : en pièces, sans compter."}
      - {lien: 2, texte: "J'ai commencé groom en 1955. On m'a appris à porter deux valises sans regarder les étiquettes. Je les ai toutes lues, naturellement. Les étiquettes, c'est le métier."}
      - {lien: 2, si: "annee >= 2008", texte: "En 2013, je rends la sonnette. Le petit Meziane prendra le comptoir ; il portait les sacs de golf, en 1992. Il ne lit pas encore les étiquettes. Il apprendra."}
      - {lien: 3, texte: "Si un soir vous devez dormir ici sans qu'aucun registre le sache, dites-moi seulement « le 307 ». Il n'existe pas. Il y a un lit dedans."}
      - {lien: -1, texte: "Votre nom, je vous prie. Et le numéro de chambre de la personne que vous venez voir."}
      - {lien: -2, texte: "Le salon est réservé. Il l'est souvent quand vous arrivez. Le tambour, lui, est toujours libre."}
      - {lien: -3, texte: "Je regrette : nous n'avons personne à ce nom. Ni dans les chambres, ni dans mes souvenirs."}
    tuyaux:
      - id: anselme_petit_salon
        si: "annee <= 2013 && direction < 40 && role != president && role != selectionneur"
        texte: "« Votre président a réservé le petit salon pour jeudi, quatre couverts, au nom d'une agence de Portclair. Il a demandé qu'on serve après la signature, pas avant. »"
        effets: {jauges: {direction: 2}}
      - id: anselme_kraft
        si: "flag(histoire_h1) && flag(h1_negatif) && saison >= 2"
        texte: "« En 1977, le soir de son élection, Vaubourg a payé le banquet du salon bleu en liquide, dans une enveloppe kraft. Ici, personne ne payait en liquide. Il a oublié son parapluie. »"
      - id: anselme_cabine
        si: "flag(histoire_h5) && flag(h5_conseil_entendu) && !flag(h5_josie)"
        texte: "« Le mardi, à six heures moins dix, un homme de la banque prend la cabine du salon bleu. Il donne toujours le même numéro à la standardiste : celui de votre bureau. »"
      - id: anselme_garcon_poli
        si: "flag(histoire_h6) && saison >= 2 && !flag(h6_faux_nom)"
        texte: "« Malbec signe toujours au salon bleu, avec un garçon poli qui tape les contrats sur une petite machine portable. Il refuse les pourboires. Il note qui en laisse. »"
        effets: {var: {h6_indices: "+1"}}
    service:
      lien: 3
      label: "Le 307"
      texte: "Anselme décroche une clé sans numéro et te fait monter par l'escalier de service. Le 307 sent la cire et le linge propre. Pour l'Impérial, tu n'as jamais passé cette nuit-là."
      effets: {jauges: {direction: 2, vestiaire: 1}}
      dette: true

  - id: nadir
    name: "Nadir Meziane"
    label: "CHEF CONCIERGE, L'IMPÉRIAL"
    genre: m
    portrait: {teint: olive, corpulence: moyen, age: mur, coiffure: court, cheveux: noir, pilosite: rase, lunettes: aucune, tenue: costume, couleur: noir, couleur2: bordeaux, accessoire: telephone}
    lieu: hotel_imperial
    tranches: [matin, aprem, soir, nuit]
    annees: [2014, 2050]
    reseau: direction
    trace: "Nadir a noté ton passage dans le vieux registre de cuir, pas dans l'ordinateur."
    paliers: ["te garde le fauteuil de droite", "te montre l'angle mort du hall", "effacerait ta nuit des caméras"]
    froid: ["te demande une pièce d'identité", "te fait raccompagner par le vigile", "ne te reconnaît plus"]
    activites: [hauts_imperial_nadir]
    on_relation: {3: vi.nadir.lustre, -3: vi.nadir.camera}
    climat:
      bas:
        - {si: "role == joueur", texte: "Ton club a réservé une suite pour un joueur qui n'est pas encore arrivé. Même poste que toi, même pied. Il dort ici jeudi, sous le nom de son agent."}
        - {si: "role == president", texte: "Tes actionnaires ont loué la suite du cinquième pour une semaine, avec une salle de réunion. Ils ont demandé qu'on ne te passe aucun appel. Je ne passe rien ; je te le dis."}
        - {si: "role == selectionneur", texte: "Deux hommes de la Fédération ont dîné avec un sélectionneur sans poste, au salon du matin. Ils ont gardé ton nom pour le dessert, et la voix basse."}
        - "Ton président a reçu ici un entraîneur au chômage, deux fois en dix jours. La seconde fois, il l'a raccompagné jusqu'au tambour. Il ne raccompagne personne."
      moyen:
        - {si: "role == joueur", texte: "Ton club ne réserve rien en ce moment. Les agents qui passent demandent de tes nouvelles comme on demande la météo, sans s'arrêter."}
        - {si: "role == president", texte: "Tes actionnaires viennent séparément, jamais le même jour. Ils se surveillent. Tant qu'ils se surveillent, ils ne te regardent pas."}
        - {si: "role == selectionneur", texte: "La Fédération réserve au tarif de groupe, sans suite ni champagne. Elle attend le prochain résultat pour savoir quel vin commander."}
        - "Ton président prend son café au bar le lundi et repart sans rien signer. Il attend samedi. Tout le monde, ici, attend samedi."
      haut:
        - {si: "role == joueur", texte: "Ton club a réservé la grande salle pour la fin de saison. Ton nom est sur le carton, en deuxième ligne. On n'imprime pas un nom en deuxième ligne pour le vendre."}
        - {si: "role == president", texte: "Tes actionnaires ont fêté le conseil au salon bleu et laissé un pourboire qui a fait le tour du personnel. Ils ont trinqué à ton nom, et à la suite."}
        - {si: "role == selectionneur", texte: "La Fédération a commandé du champagne pour son comité, et porté un toast à la sélection. Le président a dit ton nom sans regarder ses notes."}
        - "Ton président a fêté la semaine au salon bleu devant deux hommes de la Ligue. Il a parlé de toi au futur, deux fois. Je l'ai noté, par habitude."
    repliques:
      - {lien: 0, texte: "Le hall a quatorze caméras. Celle du lustre ne voit rien : un jour, quelqu'un a posé un bouquet devant. On le change chaque matin, toujours au même endroit."}
      - {lien: 0, si: "annee >= 2024", texte: "Les agents ne signent plus au bar. Chacun signe sur un écran, dans sa suite, et ils descendent boire ensemble après. Le bar n'a jamais autant vendu."}
      - {lien: 0, si: "serie_d >= 2", texte: "Deux agents m'ont demandé si votre chambre habituelle était libre. Vous n'avez pas de chambre habituelle. Ils voulaient savoir si vous partiez."}
      - {lien: 1, texte: "En 1992, je portais les sacs de golf des présidents de club. Anselme m'a appris à ne jamais ouvrir les poches de côté. Je les ai ouvertes. Il le savait."}
      - {lien: 1, si: "tranche == nuit", texte: "La nuit, la conciergerie reçoit plus de demandes que le jour. Une voiture, un médecin, une pharmacie de garde, quelqu'un qui ne doit pas monter."}
      - {lien: 2, texte: "Le registre de cuir d'Anselme est dans mon second tiroir. La direction ne sait pas qu'il existe. J'y écris ce que l'ordinateur ne doit pas savoir."}
      - {lien: 2, si: "annee >= 2037", texte: "Les suites du cinquième sont louées à l'année par une société dont personne ne voit les clients. On change les draps tous les jours quand même."}
      - {lien: 3, texte: "Si un jour tu dois sortir sans qu'aucune caméra te voie, passe sous le lustre, puis par les cuisines. Le chef sait. Il ne demandera rien."}
      - {lien: -1, texte: "Une pièce d'identité, s'il vous plaît. C'est la procédure pour tout le monde. Pour vous, depuis peu."}
      - {lien: -2, texte: "Le vigile vous accompagne jusqu'au bar. Pour votre confort."}
      - {lien: -3, texte: "Je n'ai personne à ce nom. Ni ce soir, ni dans le registre, ni dans l'autre."}
    tuyaux:
      - id: nadir_salon_matin
        si: "annee >= 2014 && direction < 40 && role != selectionneur"
        texte: "« Deux hommes de chez toi ont réservé le salon du matin pour jeudi, et une ligne qui n'enregistre pas. Petit-déjeuner pour trois. Le troisième couvert n'est pas à ton nom. »"
        effets: {jauges: {direction: 2}}
      - id: nadir_inventaire
        si: "flag(histoire_h8) && saison >= 3 && !flag(h8_voiture_rendue)"
        texte: "« Le représentant du fonds a réservé la suite du cinquième pour jeudi, et deux déménageurs pour vendredi. Sa liste : une voiture, un téléphone, un ordinateur, et un objet qui tient dans une oreille. »"
      - id: nadir_dame_du_mois
        si: "flag(histoire_h10) && flag(h10_madame_vue)"
        texte: "« Le premier de chaque mois, une dame en manteau de saison loue le salon bleu une heure. Elle signe le registre du nom du mois. Elle passe deux appels ; le second dure plus longtemps. »"
    service:
      lien: 3
      label: "Sortir par les cuisines"
      texte: "Nadir t'emmène sous le lustre, puis par les cuisines, entre deux chariots. Dehors, une voiture attend, moteur coupé. Aucune des quatorze caméras ne t'a vu sortir."
      effets: {jauges: {direction: 2, tribunes: 1}}

  # ═══════════════════════════════════════════════════ LA GALERIE DES HAUTS (galerie_hauts)

  - id: hortense
    name: "Hortense Valcour"
    label: "HORLOGÈRE, GALERIE DES HAUTS"
    genre: f
    portrait: {teint: porcelaine, corpulence: fin, age: age, coiffure: chignon, cheveux: blanc, pilosite: rase, lunettes: rondes, tenue: tailleur, couleur: prune, accessoire: montre}
    lieu: galerie_hauts
    tranches: [matin, aprem, soir]
    annees: [1990, 2016]
    reseau: milieu
    trace: "Hortense a regardé ton poignet avant ton visage, puis elle a noté quelque chose sous le comptoir."
    paliers: ["t'ouvre l'arrière-boutique", "te dit qui revend quoi", "te prêterait sur parole"]
    froid: ["te sert derrière la vitre", "pèse tout deux fois devant toi", "ne t'ouvre plus la porte"]
    activites: [hauts_galerie_hortense]
    on_relation: {3: vi.hortense.loupe, -3: vi.hortense.livre}
    repliques:
      - {lien: 0, texte: "Je regarde les poignets. Le visage ment, la montre aussi, mais pas de la même façon. Vous voulez voir quelque chose, ou qu'on vous voie regarder ?"}
      - {lien: 0, si: "annee < 2002", texte: "Les joueurs achètent ici leur première montre avec leur première prime. Ils paient en grosses coupures pliées en deux. On voit tout de suite qui a un agent."}
      - {lien: 0, si: "annee >= 2002", texte: "Depuis les écus, plus personne ne sait ce que coûte une montre. Les clients regardent mon visage pour savoir s'ils doivent avoir honte."}
      - {lien: 0, si: "serie_d >= 2", texte: "Quand ça perd, on me revend des montres le lundi. Celles qu'on m'a achetées un samedi soir de victoire, dans leur boîte, avec le ruban."}
      - {lien: 1, texte: "La pendule du magasin avance de sept minutes. Mon mari l'avait réglée ainsi pour que les clients partent à l'heure. Il est mort en 1983. Elle avance toujours."}
      - {lien: 1, si: "tranche == soir", texte: "Le soir, la galerie éteint ses vitrines une à une, la mienne en dernier. Les vigiles m'appellent la veilleuse. Ils croient que je ne le sais pas."}
      - {lien: 2, texte: "Le livre de police est sous le comptoir : chaque montre rachetée, le nom du vendeur, sa pièce d'identité. La police le lit quand elle veut. Je choisis ce que j'écris lisiblement."}
      - {lien: 2, si: "annee >= 2010", texte: "Mon petit-fils veut faire de la boutique un dépôt-vente : racheter aux gens ce qu'ils regrettent d'avoir acheté. Il dit que c'est l'avenir. C'est surtout le présent."}
      - {lien: 3, texte: "Si un jour il te faut de l'argent sans banque, apporte-moi n'importe quoi qui brille. Je l'écrirai dans le livre, et je l'oublierai dans le coffre."}
      - {lien: -1, texte: "La porte est fermée à clé. Sonnez ; on vous ouvrira. Peut-être."}
      - {lien: -2, texte: "Je vais peser ça deux fois, si vous le permettez. Devant vous."}
      - {lien: -3, texte: "La boutique vous est fermée. Mes vitrines aussi : regardez-les depuis la galerie, comme tout le monde."}
    tuyaux:
      - id: hortense_premiere_montre
        si: "annee <= 2016 && vestiaire < 45 && role != selectionneur"
        texte: "« Un des tiens m'a revendu jeudi sa première montre, celle de sa première prime, avec la boîte. Il voulait du liquide avant samedi. On ne vend pas sa première montre pour rien. »"
        effets: {jauges: {vestiaire: 2}}
      - id: hortense_communiants
        si: "flag(histoire_h3) && saison >= 2"
        texte: "« Un homme en survêtement neuf m'achète des montres de communiant, par trois, et les fait graver de prénoms. Des prénoms de gamins du centre. Il les offre avant la signature. »"
      - id: hortense_cheques
        si: "flag(histoire_h6) && saison >= 2"
        texte: "« Les montres de plongée que Fardelli fait livrer, c'est moi qui les vends. Il ne les paie jamais lui-même : le chèque vient de la Mutuelle des Quais, le lendemain d'une vente. »"
      - id: hortense_vingt_sept
        si: "flag(histoire_h7) && saison >= 2"
        texte: "« Une dame de chez Fulgor m'a commandé vingt-six montres gravées « Cobalts », et une vingt-septième sans gravure. Elle a dit : celle-là, on saura quoi y écrire après la conférence. »"
    service:
      lien: 3
      label: "Un prêt sur gage"
      texte: "Hortense ouvre le coffre, compte des billets usés et écrit une ligne au livre de police, à l'encre pâle. « Un gage dont je ne me souviens plus. Je m'en souviendrai le jour où tu rembourseras. »"
      effets: {var: {ville_francs: "+1500"}}
      dette: true

  - id: aurele
    name: "Aurèle Valcour"
    label: "RACHATS ET DÉPÔT, GALERIE DES HAUTS"
    genre: m
    portrait: {teint: clair, corpulence: fin, age: jeune, coiffure: meche, cheveux: blond, pilosite: bouc, lunettes: aucune, tenue: veste, couleur: camel, accessoire: carnet}
    lieu: galerie_hauts
    tranches: [matin, aprem, soir]
    annees: [2017, 2050]
    reseau: milieu
    trace: "Aurèle a estimé d'un coup d'œil ce que tu portais, puis il a fait semblant de n'avoir rien estimé."
    paliers: ["te fait la cote sans décote", "te montre le mur des rachats", "rachèterait n'importe quoi pour toi"]
    froid: ["te fait la cote des passants", "décote tout ce que tu apportes", "ne rachète plus rien de toi"]
    activites: [hauts_galerie_aurele]
    on_relation: {3: vi.aurele.echarpe, -3: vi.aurele.decote}
    repliques:
      - {lien: 0, texte: "Ma grand-mère vendait des montres aux joueurs. Moi, je les leur rachète. Entre les deux, il y a eu les écus, les agents et les divorces."}
      - {lien: 0, si: "annee >= 2024", texte: "Les montres connectées se revendent au poids. Elles savent tout de leur ancien propriétaire, et personne ne veut porter le cœur d'un autre."}
      - {lien: 0, si: "serie_d >= 2", texte: "Cette semaine, trois sacs de voyage et une montre de plongée, tous de chez vous. Les défaites vident les placards plus vite que les vestiaires."}
      - {lien: 1, texte: "La pendule avance toujours de sept minutes. Je ne l'ai pas réglée. Ma grand-mère disait qu'elle laissait aux clients le temps de regretter avant de signer."}
      - {lien: 1, si: "tranche == soir", texte: "La galerie éteint ses vitrines à dix-neuf heures. Les miennes restent allumées : un mur de choses que des gens ont aimées, puis revendues. On les voit mieux la nuit."}
      - {lien: 2, texte: "Le livre de police est passé sur ordinateur, mais je recopie tout dans le cahier de ma grand-mère. Un écran, ça s'efface ; un cahier, ça se brûle. On voit la différence."}
      - {lien: 3, texte: "Si un jour il te faut vendre quelque chose sans que la ville le sache, passe par la porte de service, le lundi. Le lundi, les vigiles regardent les matchs de la veille."}
      - {lien: -1, texte: "Je vous fais la cote affichée. Comme aux passants."}
      - {lien: -2, texte: "Tout ce que vous apportez est décoté. Ce n'est pas personnel. Enfin, si."}
      - {lien: -3, texte: "Je ne rachète plus rien de vous. Revendez sur le Flux ; on vous y trouvera vite."}
    tuyaux:
      - id: aurele_sac
        si: "annee >= 2017 && vestiaire < 45 && role != selectionneur"
        texte: "« Un des tiens a laissé un sac de collection en dépôt, avec la facture et l'étui. Il voulait l'argent avant la paie. On ne lâche pas un sac pareil pour un loyer. »"
        effets: {jauges: {vestiaire: 2}}
      - id: aurele_dome
        si: "flag(histoire_h9) && saison >= 2"
        texte: "« Trois montres du Dôme sont passées par mon comptoir cette semaine. Ceux qui les vendaient avaient un frère sur le chantier. Ils voulaient seulement savoir combien elle valait. »"
      - id: aurele_clapets
        si: "flag(histoire_h10) && saison >= 2 && !flag(h10_clapet_nino)"
        texte: "« Il y a deux ans, une dame très polie m'a acheté deux portables à clapet de 1995, neufs, identiques. Elle a payé en liquide et demandé si l'on pouvait changer la sonnerie. On ne peut pas. »"
    service:
      lien: 3
      label: "Racheter au prix du neuf"
      texte: "Aurèle rachète au prix du neuf ce que tu lui apportes, sans ouvrir la boîte. Il inscrit la ligne au crayon dans le cahier de sa grand-mère, et la gomme devant toi."
      effets: {var: {ville_francs: "+1200"}}

  # ═════════════════════════════════════════════════════ LE CABINET VERDIER (cabinet_verdier)

  - id: aristide
    name: "Aristide Verdier"
    label: "AVOCAT, CABINET VERDIER"
    genre: m
    portrait: {teint: clair, corpulence: large, age: age, coiffure: degarni, cheveux: gris, pilosite: barbe, lunettes: rondes, tenue: costume, couleur: anthracite, couleur2: blanc, accessoire: stylo}
    lieu: cabinet_verdier
    tranches: [matin, midi, aprem]
    annees: [1990, 2015]
    reseau: direction
    trace: "Maître Verdier a retourné son sablier en te voyant entrer, puis l'a couché sur le flanc."
    paliers: ["ne retourne plus le sablier pour toi", "te lit les clauses qu'on te cache", "plaiderait pour toi sans facture"]
    froid: ["facture le quart d'heure entamé", "te répond par huissier", "plaide contre toi"]
    activites: [hauts_verdier_aristide]
    on_relation: {3: vi.aristide.sablier, -3: vi.aristide.huissier}
    climat:
      bas:
        - {si: "role == joueur", texte: "Votre club m'a fait relire votre contrat, ligne par ligne, pour trouver de quoi ne pas le prolonger. J'ai facturé trois quarts d'heure. Ils n'ont pas discuté le prix."}
        - {si: "role == president", texte: "Deux de vos actionnaires m'ont consulté séparément, sur la même question : comment révoque-t-on un président sans assemblée ? Même réponse, même tarif."}
        - {si: "role == selectionneur", texte: "Le secrétaire général de la Fédération m'a fait relire votre lettre de mission. Il cherchait la clause de fin anticipée. Il l'avait trouvée avant moi ; il voulait un témoin."}
        - "Votre président m'a demandé combien coûterait votre départ avant juin. Je lui ai donné un chiffre. Il l'a écrit dans son carnet, et il ne l'a pas barré."
      moyen:
        - {si: "role == joueur", texte: "Votre club n'a rien demandé au cabinet depuis septembre. Un club qui ne consulte pas son avocat est un club qui n'a pas encore décidé."}
        - {si: "role == president", texte: "Vos actionnaires ont fait relire les statuts, sans rien me demander de précis. Une précaution. Les précautions précèdent souvent les décisions ; pas toujours."}
        - {si: "role == selectionneur", texte: "La Fédération a renouvelé ses assurances sans toucher à votre lettre de mission. Elle ne vous regarde ni de près ni de loin. Elle attend."}
        - "Votre président m'a envoyé votre contrat « pour classement ». Classer, chez lui, veut dire garder à portée de main."
      haut:
        - {si: "role == joueur", texte: "Votre club m'a fait préparer une prolongation, avec une clause de fidélité. On ne rédige pas une clause de fidélité pour un joueur qu'on veut vendre."}
        - {si: "role == president", texte: "Vos actionnaires ont ajouté un article à leur pacte : votre départ exigerait l'unanimité. À ce prix-là, l'unanimité est une forteresse."}
        - {si: "role == selectionneur", texte: "La Fédération m'a demandé un avenant à votre lettre de mission : deux ans de plus, sans condition de résultat. Je l'ai rédigé moi-même, avec plaisir."}
        - "Votre président m'a commandé une prolongation, et une clause qui coûte cher à qui voudrait vous approcher. Je l'ai appelée, pour moi seul, l'article de jalousie."
    repliques:
      - {lien: 0, texte: "Asseyez-vous ; le sablier compte quinze minutes. Je facture au quart d'heure depuis 1961. Personne n'a jamais attendu que le sable finisse pour se lever."}
      - {lien: 0, si: "annee < 1996", texte: "La moitié des contrats de la première division sont sortis de cette pièce. Trois pages, une signature, et un article sept que personne ne lit. C'est toujours l'article sept."}
      - {lien: 0, si: "flag(monde_licence_agents)", texte: "Depuis que les agents ont une licence et un numéro, ils viennent ici le faire encadrer. Un numéro sous verre rassure les mères."}
      - {lien: 0, si: "serie_d >= 2", texte: "Trois défaites, et les présidents relisent les contrats. Ils cherchent le mot « faute ». On ne le trouve jamais là où on l'espère."}
      - {lien: 1, texte: "Les deux lauriers de l'entrée ont l'âge du cabinet. On les rentre l'hiver, dans la salle d'attente. Les clients croient qu'ils sont là pour la décoration."}
      - {lien: 1, si: "tranche == matin", texte: "Ma secrétaire astique la plaque de laiton tous les matins à huit heures. Un avocat dont la plaque ternit est un avocat qui a perdu."}
      - {lien: 2, texte: "J'ai écrit en 1979 le premier contrat de la Ligue avec une clause de départ. Le joueur est parti trois mois après. Il m'en a voulu ; c'était lui qui l'avait demandée."}
      - {lien: 2, si: "annee >= 1995", texte: "Ma fille veut faire du droit du sport. Je lui ai dit que ce n'était pas du droit, c'était de la chronique. Elle a souri. Elle fera mieux que moi, et plus vite."}
      - {lien: 3, texte: "Si un jour on vous met sous le nez une lettre avec la date en blanc, ne signez rien. Venez ici avant midi. Je trouve toujours un délai avant midi."}
      - {lien: -1, texte: "Le quart d'heure entamé est dû. C'est l'usage. Je l'applique, désormais."}
      - {lien: -2, texte: "Je vous réponds par huissier. C'est plus lent, mais personne ne conteste ce qu'un huissier a porté."}
      - {lien: -3, texte: "J'ai accepté un dossier contre vous. Je vous le dis par courtoisie ; c'est la dernière que je vous fais."}
    tuyaux:
      - id: aristide_faute_grave
        si: "annee <= 2015 && direction < 40 && role != president && role != selectionneur"
        texte: "« Votre président m'a fait relire votre contrat mardi. Il cherchait une faute grave. Il n'y en a pas. Il m'a demandé d'en trouver une ; je ne travaille pas pour lui. »"
        effets: {jauges: {direction: 2}}
      - id: aristide_vaneste
        si: "role == joueur && flag(monde_libre_1993) && annee <= 2000"
        texte: "« Depuis l'arrêt Vaneste, un joueur en fin de contrat part libre, sans indemnité. Votre club le sait. Il compte sur le fait que vous ne lisez pas les arrêts. »"
        effets: {jauges: {caisse: 2}}
      - id: aristide_larrieu
        si: "flag(histoire_h5) && saison >= 2 && !flag(h5_larrieu) && !flag(h5_sci_deux)"
        texte: "« Les sociétés qui rachètent des dettes de club naissent toutes chez le même notaire de Portclair, Maître Larrieu. Il reçoit le mardi, pour ceux qui ne veulent pas qu'on les voie. »"
        effets: {set: [h5_larrieu]}
      - id: aristide_greffe
        si: "flag(histoire_h6) && saison >= 2 && !flag(h6_faux_nom)"
        texte: "« JF Conseil a été immatriculé au greffe en juin 2003. Gérant : un garçon de vingt-quatre ans. Siège : une boîte aux lettres louée au rez-de-chaussée de la tour Valdorne. »"
      - id: aristide_double
        si: "flag(histoire_h7) && saison >= 2"
        texte: "« À la Fédération, les procès-verbaux se tiennent en double : le registre, et une copie déposée chaque année chez un notaire. Celle de novembre 2011 n'a jamais été déposée. »"
    service:
      lien: 3
      label: "Une clause en ma faveur"
      texte: "Maître Verdier relit ton contrat, le sablier couché, souligne une ligne au crayon rouge et la fait recopier. « Article neuf. Ils l'ont écrit pour eux ; il joue aussi pour vous. »"
      effets: {jauges: {direction: 2, caisse: 1}}
      dette: true

  - id: constance
    name: "Constance Verdier"
    label: "AVOCATE, CABINET VERDIER"
    genre: f
    portrait: {teint: clair, corpulence: fin, age: mur, coiffure: carre, cheveux: chatain, pilosite: rase, lunettes: carrees, tenue: tailleur, couleur: noir, couleur2: blanc, accessoire: telephone}
    lieu: cabinet_verdier
    tranches: [matin, midi, aprem]
    annees: [2016, 2050]
    reseau: direction
    trace: "Constance a regardé l'heure sur son téléphone, puis elle l'a retourné face contre le bureau."
    paliers: ["te reçoit sans rendez-vous", "te lit les petites lignes", "gagnerait du temps pour toi"]
    froid: ["te facture la minute", "te fait répondre par un collaborateur", "a pris le dossier d'en face"]
    activites: [hauts_verdier_constance]
    on_relation: {3: vi.constance.sablier, -3: vi.constance.dossier}
    climat:
      bas:
        - {si: "role == joueur", texte: "Ton club m'a fait demander, par un intermédiaire, combien coûterait de casser ton contrat. Je n'ai pas répondu. Quelqu'un d'autre répondra."}
        - {si: "role == president", texte: "Deux de tes actionnaires ont fait chiffrer ta révocation par un cabinet de la capitale. On m'a mise en copie par erreur. Je n'aime pas les erreurs qui tombent si bien."}
        - {si: "role == selectionneur", texte: "La Fédération a fait relire ta lettre de mission par trois cabinets, dont le mien. Trois avis, c'est qu'on cherche celui qui dira oui."}
        - "Ton président a fait chiffrer ton départ par un cabinet de la capitale. Il ne me l'a pas demandé, à moi : il savait ce que je lui répondrais."
      moyen:
        - {si: "role == joueur", texte: "Ton club ne consulte personne à ton sujet. Le silence d'un service juridique, c'est un club qui attend le résultat de samedi."}
        - {si: "role == president", texte: "Tes actionnaires ont fait relire les statuts, sans question précise. C'est de l'hygiène. Je la surveille quand même."}
        - {si: "role == selectionneur", texte: "La Fédération ne m'a rien demandé depuis l'été. Elle a d'autres procès sur le feu. Pour toi, c'est une bonne nouvelle, provisoire."}
        - "Ton président a rangé ton contrat dans le tiroir « en cours ». Ni prolongation, ni rupture. C'est le tiroir le plus dangereux d'un bureau."
      haut:
        - {si: "role == joueur", texte: "Ton club veut une prolongation et une clause anti-départ. Je l'ai rédigée assez stricte pour qu'aucun agent ne la lise jusqu'au bout."}
        - {si: "role == president", texte: "Tes actionnaires ont verrouillé ton mandat jusqu'à la fin de la saison prochaine. Ils m'ont demandé si c'était solide. C'est solide."}
        - {si: "role == selectionneur", texte: "La Fédération m'a fait rédiger deux ans de plus pour toi, sans clause de résultat. On ne fait pas ça pour quelqu'un qu'on tolère."}
        - "Ton président m'a commandé une prolongation, avec une clause qui coûte cher à qui voudrait te débaucher. Il l'a relue deux fois, en souriant."
    repliques:
      - {lien: 0, texte: "Le sablier de mon père est toujours sur le bureau. Je ne le retourne jamais. Je facture à la minute ; le sable, c'est pour les clients qui ont besoin de voir passer le temps."}
      - {lien: 0, si: "annee >= 2024", texte: "La moitié de mes dossiers sont des contrats que personne n'a écrits : un modèle propose, un avocat signe. Je relis tout. On me trouve lente. Je suis chère."}
      - {lien: 0, si: "flag(monde_franchises)", texte: "Depuis la loi des franchises, je liquide des clubs qui avaient cent ans. On garde le nom, on vend le centre de formation, on rend les clés du stade à la mairie."}
      - {lien: 0, si: "serie_d >= 2", texte: "Trois défaites, et votre contrat est déjà sur le bureau de quelqu'un. Pas le mien, pour l'instant. Je le sais parce qu'on m'a demandé mon tarif."}
      - {lien: 1, texte: "J'ai assisté à ma première négociation de joueur à vingt-quatre ans, au fond de cette pièce. Mon père m'avait dit de me taire. J'ai compté les mensonges de l'agent. Onze."}
      - {lien: 2, texte: "Les dossiers de mon père sont à la cave, de 1961 à 2015, par ordre alphabétique. À la lettre R, quatre cartons au nom du Racing. Je n'en ai ouvert qu'un."}
      - {lien: 2, si: "tranche == aprem", texte: "L'après-midi, je travaille sur la terrasse des associés, sous la toile. Mon père y fumait la pipe. Moi, je regarde le chantier de la phase trois, qui ne finit jamais."}
      - {lien: 3, texte: "Si un soir on te fait signer quelque chose avant minuit, envoie-moi une photo de la dernière page. Je dors peu, et je lis vite."}
      - {lien: -1, texte: "La minute est facturée. Vous en êtes à quatre."}
      - {lien: -2, texte: "Mon collaborateur vous répondra. Il est jeune, il est lent, et il ne sait rien de vous."}
      - {lien: -3, texte: "J'ai pris le dossier d'en face. Mon père disait qu'on ne refuse jamais un bon dossier. Il pensait au vôtre, je crois."}
    tuyaux:
      - id: constance_page_six
        si: "annee >= 2016 && direction < 40 && role != president && role != selectionneur"
        texte: "« Ton contrat a une clause de rupture que personne n'a relue depuis la signature. Elle joue dans les deux sens, et elle tombe au 30 juin. Lis la page six avant eux. »"
        effets: {jauges: {direction: 2}}
      - id: constance_page_41
        si: "flag(histoire_h8) && saison >= 2"
        texte: "« J'ai relu la cession de Ferlac Analytique au fonds, en 2020. Page quarante et une : la voix et les enregistrements du fondateur, cédés à titre perpétuel. Ils avaient acheté sa voix avant sa mort. »"
      - id: constance_factures
        si: "flag(histoire_h9) && flag(h9_fisc) && !flag(h9_fisc_suspendu)"
        texte: "« L'émirat n'a jamais déclaré la montre ni la berline comme des dons. Pour le fisc, ce sont des avantages ; pour Dorada, des frais de communication. Garde les deux papiers : ils se contredisent. »"
        effets: {jauges: {direction: 1}}
      - id: constance_article_dix
        si: "flag(histoire_h10) && saison >= 2"
        texte: "« J'ai relu ton pacte de la Rive pour un confrère de Rive Capital. Article neuf : en deuxième division au 30 juin 2040, le nom et le centre partent. Pas d'article dix. C'est ce qui m'inquiète. »"
    service:
      lien: 3
      label: "Gagner trois semaines"
      texte: "Constance dépose une requête à vingt-trois heures cinquante-neuf, la veille de l'échéance. Le juge la lira dans trois semaines. Trois semaines, c'est un mercato."
      effets: {jauges: {direction: 3}}
      dette: true

  # ═══════════════════════════════════════════════════ LA TABLE DES HAUTS (table_hauts)

  - id: lazare
    name: "Lazare Pradel"
    label: "MAÎTRE D'HÔTEL, LA TABLE DES HAUTS"
    genre: m
    portrait: {teint: clair, corpulence: moyen, age: age, coiffure: court, cheveux: gris, pilosite: moustache, lunettes: aucune, tenue: costume, couleur: noir, couleur2: blanc, accessoire: aucun}
    lieu: table_hauts
    tranches: [midi, soir]
    annees: [1990, 2018]
    reseau: mairie
    trace: "Lazare a effacé un nom sur son plan de table, au crayon, et écrit le tien à la place."
    paliers: ["te place face à la vitre", "te montre son plan de table", "te donnerait la table sept"]
    froid: ["te place près des cuisines", "égare ta réservation", "n'a plus de table pour toi"]
    activites: [hauts_table_lazare]
    on_relation: {3: vi.lazare.table_sept, -3: vi.lazare.cuisines}
    repliques:
      - {lien: 0, texte: "L'ascenseur met trente et une secondes à monter. Les gens se taisent pendant trente. À la dernière, ils disent tous la même chose : on voit le stade."}
      - {lien: 0, si: "annee < 1999", texte: "Madame Aubert déjeune ici le vendredi, table sept, face au stade. Elle dit qu'elle aime voir ce qu'elle doit à la ville. Elle le regarde en mangeant."}
      - {lien: 0, si: "serie_d >= 2", texte: "On m'a décommandé deux tables réservées par des gens de chez vous, cette semaine. Quand ça perd, on dîne en bas, dans la vieille ville, là où personne ne vous voit d'en haut."}
      - {lien: 0, si: "tranche == soir", texte: "Le soir, on baisse la lumière de la salle pour que la ville se voie mieux. Les clients croient que c'est pour l'ambiance. C'est pour la ville."}
      - {lien: 1, texte: "Je fais le plan de table au crayon, chaque matin. Un nom effacé laisse sa trace dans le papier. Je garde les plans : on lit très bien les noms effacés, en penchant la feuille."}
      - {lien: 2, texte: "La table sept a vu signer la vente de la Tréfilerie, deux élections et un divorce. On n'a jamais changé la couleur de sa nappe. Les gens superstitieux paient plus cher."}
      - {lien: 2, si: "annee >= 2010", texte: "Je partirai quand l'ascenseur aura ses trente ans. La petite Castelli prendra la salle. Elle sert depuis ses vingt ans ; elle se souvient de tout ce qu'on ne lui a pas dit."}
      - {lien: 3, texte: "Si un soir il vous faut la table sept, dites-le-moi le matin. Je trouverai une raison pour la mairie. Elle en a beaucoup ; elle en acceptera une de plus."}
      - {lien: -1, texte: "Il me reste une table près des cuisines. On y entend tout, sauf les conversations des autres."}
      - {lien: -2, texte: "Votre réservation ? Je ne la trouve pas. Je l'ai pourtant cherchée."}
      - {lien: -3, texte: "Nous n'avons plus de table pour vous, ni ce soir ni les suivants. L'ascenseur redescend tout seul ; il est très obéissant."}
    tuyaux:
      - id: lazare_cadastre
        si: "annee <= 2018"
        texte: "« Mardi, à la table sept, deux adjoints au maire ont dîné avec un homme du cadastre et un plan roulé. Ils ont parlé du stade au dessert, la nappe repliée sur le plan. »"
        effets: {jauges: {direction: 1}}
      - id: lazare_jeudi
        si: "annee >= 1999 && annee <= 2006 && relation.vialat == 0"
        texte: "« Madame Vialat déjeune ici le jeudi, seule, table onze, un dossier fermé à côté de l'assiette. Elle ne parle à personne. Sauf à qui lui apporte un chiffre exact. »"
        effets: {relation: {vialat: 1}}
      - id: lazare_lambert
        si: "flag(histoire_h5) && saison >= 3"
        texte: "« Lambert, le conseiller de la Rive, n'était jamais monté ici. Mardi, Madame Tessandier l'a invité. Il a pris le plat du jour, sans vin, et il a tenu à payer sa part. »"
      - id: lazare_dessert
        si: "flag(histoire_h7) && flag(h7_rance_mort) && annee <= 2013"
        texte: "« Le soir du barrage, la ministre avait réservé la table sept, huit couverts, avec le président de la Fédération. Ils ont commandé le dessert avant le coup d'envoi. »"
    service:
      lien: 3
      label: "La table sept"
      texte: "Lazare change une ligne de son plan de table, au crayon. À midi, tu déjeunes face au stade, à côté d'un adjoint au maire. Il te demande ton avis sur la pelouse, et il le note."
      effets: {jauges: {direction: 2, tribunes: 1}}

  - id: romane
    name: "Romane Castelli"
    label: "MAÎTRE D'HÔTEL, LA TABLE DES HAUTS"
    genre: f
    portrait: {teint: dore, corpulence: fin, age: jeune, coiffure: chignon, cheveux: noir, pilosite: rase, lunettes: aucune, tenue: chemise, couleur: blanc, couleur2: noir, accessoire: carnet}
    lieu: table_hauts
    tranches: [midi, soir]
    annees: [2019, 2050]
    reseau: mairie
    trace: "Romane a plié ta serviette en quatre, comme Lazare le faisait pour les habitués."
    paliers: ["te place face au stade", "te raconte les tables d'avant", "te donnerait la table sept"]
    froid: ["te place dos à la vitre", "perd ta réservation", "n'a plus de table pour toi"]
    activites: [hauts_table_romane]
    on_relation: {3: vi.romane.registre, -3: vi.romane.vitre}
    repliques:
      - {lien: 0, texte: "L'ascenseur met vingt-neuf secondes depuis les travaux. Lazare en comptait trente et une. Les gens se taisent deux secondes de moins. C'est le progrès."}
      - {lien: 0, si: "annee >= 2030", texte: "La salle se remplit les soirs de match à l'extérieur. On regarde d'en haut le stade éclairé pour personne. C'est devenu une sortie, le stade vide."}
      - {lien: 0, si: "serie_d >= 2", texte: "Deux tables de chez vous ont annulé ce midi. Les défaites se mangent en bas. Ici, on vient fêter quelque chose, ou vendre quelqu'un."}
      - {lien: 1, texte: "J'ai commencé en 2010, au service du soir. Lazare m'a appris à verser sans regarder le verre. Regarder le verre, c'est regarder la conversation."}
      - {lien: 2, texte: "Un soir de décembre 2010, je servais la table sept. Je n'avais pas le droit d'entendre. J'ai entendu. Je n'ai jamais servi aussi lentement de ma vie."}
      - {lien: 2, si: "annee >= 2036", texte: "Les clients ne prennent plus de taxi. Leur voiture attend en bas, sans chauffeur, moteur éteint. Elle connaît l'heure du dessert mieux que moi."}
      - {lien: 3, texte: "Si un jour tu dois parler à quelqu'un sans que la ville le sache, réserve au nom du chef. Personne ne vérifie jamais le nom du chef."}
      - {lien: -1, texte: "Il ne me reste qu'une table dos à la vitre. Vous verrez la salle, au moins."}
      - {lien: -2, texte: "Votre réservation a disparu du registre. Ça arrive. Ça vous arrive."}
      - {lien: -3, texte: "Il n'y a plus de table pour vous. Lazare me l'a appris : une table refusée ne s'explique pas."}
    tuyaux:
      - id: romane_premier_lundi
        si: "flag(histoire_h8) && saison >= 2 && !flag(h8_vaubourg_mort) && relation.aulard <= 0"
        texte: "« Vaubourg déjeune ici le premier lundi du mois, seul, à la table sept, face au stade. Il commande le même plat et n'y touche pas. Il garde une chaise vide en face. »"
        effets: {relation: {aulard: 1}}
      - id: romane_decembre
        si: "flag(histoire_h9) && saison >= 2"
        texte: "« En décembre 2010, je servais la table sept : la ministre et trois hommes. À vingt-trois heures trente-huit, on lui a porté le téléphone. Elle a dit « Faites-le », et elle a commandé du champagne. »"
      - id: romane_nappe
        si: "flag(histoire_h10) && saison >= 2"
        texte: "« Clémence Tessandier déjeune ici chaque premier mercredi avec deux hommes de Rive Capital. Ils dessinent le stade sur la nappe, et le remplacent par un parc au dessert. J'ai gardé une nappe. »"
    service:
      lien: 3
      label: "Une table au nom du chef"
      texte: "Romane inscrit au registre le nom du chef, deux couverts, à quatorze heures, quand la salle se vide. Personne ne vérifie. Ce qui se dit à cette table ne redescend pas par l'ascenseur."
      effets: {jauges: {direction: 2}}

  # ═══════════════════════════════════════════════════════════════════ LE PARVIS (parvis)

  - id: raoul
    name: "Raoul Fontès"
    label: "LAVEUR DE VITRES, LES HAUTS"
    genre: m
    portrait: {teint: clair, corpulence: large, age: mur, coiffure: casquette, coiffe: bleu, cheveux: gris, pilosite: moustache, lunettes: aucune, tenue: veste, couleur: bleu, accessoire: aucun}
    lieu: parvis
    tranches: [matin, midi, aprem]
    annees: [1990, 2019]
    reseau: rue
    trace: "Raoul a essuyé le banc de granit d'un coup de raclette avant que tu t'assoies."
    paliers: ["te garde une place sur le banc", "te dit ce qu'il voit par les vitres", "regarderait par n'importe quelle fenêtre pour toi"]
    froid: ["mange son sandwich dos à toi", "renverse son seau près de toi", "ne te voit plus"]
    activites: [hauts_parvis_raoul]
    on_relation: {3: vi.raoul.raclette, -3: vi.raoul.seau}
    repliques:
      - {lien: 0, texte: "Je lave Dalmène de haut en bas, deux fois par an. Trente-deux étages, trois semaines. Quand j'arrive en bas, le haut est déjà sale."}
      - {lien: 0, si: "tranche == midi", texte: "Le banc du bassin est le seul endroit du parvis où le vent ne t'arrache pas ton sandwich. Assieds-toi de ce côté. Pas de l'autre."}
      - {lien: 0, si: "serie_d >= 2", texte: "Au vingtième de l'Écran, ils ont punaisé un tableau avec vos résultats et des flèches rouges. Je le vois à l'envers, de la nacelle. À l'envers aussi, c'est mauvais."}
      - {lien: 1, texte: "De la nacelle, je vois les bureaux à l'envers, comme dans une glace. Les gens oublient qu'une vitre a deux côtés. Ils se recoiffent devant moi."}
      - {lien: 1, si: "annee >= 2008", texte: "Ils parlent d'un robot pour laver les tours, une machine qui monte toute seule. Elle ne verra rien. C'est ce qu'ils aiment chez elle."}
      - {lien: 2, texte: "Au trente-deuxième de Dalmène, dans la salle du conseil, il y a un maillot du Racing sous vitrine. Il y est depuis 1986. Je le salue en passant ; personne d'autre ne le regarde."}
      - {lien: 2, si: "annee >= 2012", texte: "Ma fille veut reprendre l'entreprise : trois cordes, une nacelle, quatre clients. Je lui ai dit de faire autre chose. Elle a mis mon harnais, et elle est montée."}
      - {lien: 3, texte: "Si un jour il te faut savoir ce qui se passe derrière une vitre des Hauts, dis-moi l'étage. Les fenêtres, on les lave quand on veut."}
      - {lien: -1, texte: "Le banc est pris. Le vent aussi, de ton côté."}
      - {lien: -2, texte: "Attention au seau. Il déborde quand je ne regarde pas."}
      - {lien: -3, texte: "Je ne te vois plus. C'est bête : d'habitude, je vois tout."}
    tuyaux:
      - id: raoul_vitrine
        si: "annee <= 2019 && caisse < 40"
        texte: "« Au trente-deuxième de Dalmène, ils ont sorti le maillot du club de sa vitrine et l'ont mis dans un carton. Il y était depuis 1986. Ils ne déménagent pas : ils changent d'avis. »"
        effets: {jauges: {caisse: 1}}
      - id: raoul_wagon
        si: "flag(histoire_h2) && saison >= 2 && !flag(h2_wagon_vu)"
        texte: "« De la face sud de Dalmène, je vois la friche. Depuis l'hiver, un wagon fume tous les matins vers six heures. Un wagon ne se chauffe pas tout seul. »"
      - id: raoul_bus
        si: "flag(histoire_h7) && flag(h7_rance_mort) && annee <= 2012"
        texte: "« De la face ouest de l'Écran, je vois le parking de l'hôtel de la Rive. Dans le bus du fiasco, quelqu'un s'assoit au fond tous les soirs à six heures, la tête contre la vitre. »"
    service:
      lien: 3
      label: "Regarder par la fenêtre"
      texte: "Raoul monte sa nacelle au vingt-huitième un jour où rien n'est prévu. Le soir, sur le banc, il te dit qui était dans la salle de réunion, et qui est parti avant la fin."
      effets: {jauges: {direction: 2}}

  - id: karine
    name: "Karine Fontès"
    label: "LAVEUSE DE VITRES, LES HAUTS"
    genre: f
    portrait: {teint: clair, corpulence: moyen, age: mur, coiffure: queue, cheveux: blond, pilosite: rase, lunettes: aucune, tenue: doudoune, couleur: orange, accessoire: aucun}
    lieu: parvis
    tranches: [matin, midi, aprem]
    annees: [2020, 2050]
    reseau: rue
    trace: "Karine t'a servi du café de son thermos dans le bouchon, la seule tasse qu'elle ait."
    paliers: ["te sert du café de son thermos", "te raconte les étages", "accrocherait n'importe quoi à une façade pour toi"]
    froid: ["ne descend plus pour toi", "rince sa raclette au-dessus de toi", "a oublié ton nom"]
    activites: [hauts_parvis_karine]
    on_relation: {3: vi.karine.harnais, -3: vi.karine.facade}
    repliques:
      - {lien: 0, texte: "Mon père lavait les tours en nacelle. Moi, je descends en corde : plus vite, plus près. On voit les gens de si près qu'ils croient qu'on les écoute."}
      - {lien: 0, si: "annee >= 2040", texte: "Dalmène a pris des drones pour ses vitres. Ils lavent bien. Ils ne disent pas bonjour, et ils ne voient rien. La tour les a choisis pour ça."}
      - {lien: 0, si: "serie_d >= 2", texte: "Au cinquième de l'Écran, une stagiaire découpe tes défaites en petites vidéos. Je la vois faire, de ma corde. Elle met de la musique dessous."}
      - {lien: 1, texte: "Le harnais de mon père pend dans la camionnette. Il est trop large pour moi, je ne m'en sers pas. Je le prends quand même, chaque matin."}
      - {lien: 1, si: "tranche == matin", texte: "Le matin, le vent du parvis tourne trois fois avant neuf heures. Je descends après le troisième. Ceux qui descendent avant, on les connaît : on a été à leur enterrement."}
      - {lien: 2, texte: "Sur le toit de l'Écran, juste au-dessus de la lame rouge, il y a un point d'ancrage que personne n'utilise. De là, on pourrait pendre quelque chose de très grand, face au stade."}
      - {lien: 3, texte: "Si un jour tu veux que toute la ville lise une phrase, donne-la-moi un jeudi. Le vendredi, elle est sur la façade, et il faut une semaine aux avocats pour la décrocher."}
      - {lien: -1, texte: "Pas le temps, je remonte. Le vent n'attend pas. Toi non plus, je suppose."}
      - {lien: -2, texte: "Passe plutôt de l'autre côté. De ce côté-ci, il tombe parfois de l'eau sale."}
      - {lien: -3, texte: "Je ne descends plus pour toi. Même pas pour dire bonjour."}
    tuyaux:
      - id: karine_banderole
        si: "annee >= 2020 && tribunes < 40 && role != selectionneur"
        texte: "« De ma corde, sur la face ouest de l'Écran, je vois le parking du stade. Ceux du virage y peignent une banderole de vingt mètres, ton nom en rouge. Ils la finissent jeudi. »"
        effets: {jauges: {tribunes: 2}}
      - id: karine_minuteur
        si: "flag(histoire_h8) && flag(h8_projecteurs) && !flag(h8_cycle_trois_heures)"
        texte: "« Les projecteurs de la Rive à trois heures ? Sur le toit de la tribune, il y a un boîtier gris, avec un minuteur. Le fonds l'a fait poser en 2019. C'est de l'entretien, rien d'autre. »"
        effets: {set: [h8_cycle_trois_heures]}
      - id: karine_plan_de_vol
        si: "flag(histoire_h10) && saison >= 2 && !flag(h10_helico) && !flag(h10_helico_renvoye)"
        texte: "« L'hélistation de Dalmène a reçu un plan de vol pour mardi : un appareil blanc, de la capitale vers la pelouse de la Rive. Le pilote a demandé si la pelouse supportait le poids. Pas le retour. »"
    service:
      lien: 3
      label: "La banderole de la façade"
      texte: "Le vendredi à l'aube, une banderole de quarante mètres descend de la lame rouge de l'Écran, face au stade, aux couleurs du Racing. La chaîne met deux jours à la faire décrocher."
      effets: {jauges: {tribunes: 3, direction: -1}}
      dette: true

# ═══════════════════════════════════════════════════════════════ LES ACTIVITÉS
# Ce qu'on fait dans les Hauts : pas de pièce (aucun `objet`), tout se lit dans le panneau
# du lieu. Le quartier penche vers le luxe, le travail, la nuit et le jeu. Celles qu'on fait
# avec quelqu'un (`avec`) portent la borne de ses années ; les petits boulots (`francs`
# positifs, `max_jour: 1`) sont pour le joueur des divisions d'en bas. Les heures restent
# dans celles du lieu (grand_auberive.yaml) : la nuit, ce qui se fait prend `tranches: 0`.
activites:

  # — La tour Écran (matin à soir)
  - id: hauts_ecran_hall
    lieu: tour_ecran
    habitude: culture
    label: "L'écran du hall"
    texte: "Dans le hall, derrière le portique, l'écran repasse le but de samedi au ralenti, sans le son. Le vigile le regarde aussi, sans tourner la tête, pour la quatrième fois."
    textes:
      - "Dans le hall, derrière le portique, l'écran repasse le but de samedi au ralenti, sans le son. Le vigile le regarde aussi, sans tourner la tête, pour la quatrième fois."
      - "Sur l'écran du hall, la même action en boucle, sous trois angles. À la troisième, on voit ce qu'on n'avait pas vu au stade : une main de défenseur, posée sur un maillot."
      - "Des écoliers en visite se sont arrêtés devant l'écran. Leur maîtresse leur explique le hors-jeu. Elle se trompe ; personne ne la corrige, toi non plus."
      - "L'écran du hall affiche la grille de la semaine. Le match de samedi n'y est pas. À sa place, un documentaire sur les oiseaux de la Rive, à vingt heures trente."
    tranches: 1
    francs: 0
    heures: [matin, midi, aprem, soir]

  - id: hauts_ecran_plateau
    lieu: tour_ecran
    habitude: travail
    label: "Le plateau du dimanche"
    texte: "Le dimanche soir, Télé-Stade loue le plateau du quatrième : deux fauteuils, une table basse, un verre d'eau que personne ne boit. On te pose trois questions ; tu en entends quatre."
    textes:
      - "Le dimanche soir, Télé-Stade loue le plateau du quatrième : deux fauteuils, une table basse, un verre d'eau que personne ne boit. On te pose trois questions ; tu en entends quatre."
      - "Le voyant rouge s'allume. Le présentateur te demande si tu dors bien. Tu réponds oui, trop vite, et le consultant d'en face sourit, assez longtemps pour la caméra deux."
      - "Pendant la publicité, le consultant se penche : « Tout à l'heure, je serai dur. Ce n'est pas contre vous. » À l'antenne, il est dur, et c'est contre toi."
      - "Ils repassent ta pire action de la saison, image par image, avec des flèches. Tu commentes toi-même la cinquième flèche. Derrière la vitre, le régisseur lève le pouce."
    tranches: 1
    francs: 0
    jours: [dim]
    heures: [soir]
    jauges: {tribunes: 1}

  - id: hauts_ecran_fauteuil
    lieu: tour_ecran
    avec: ghislaine
    si: "annee <= 2016"
    habitude: soin
    label: "Le fauteuil de Ghislaine"
    texte: "Ghislaine pose une serviette chaude sur ton visage et la retire au bout d'une minute. Elle travaille sans parler, une houppette dans chaque main, comme on cire des chaussures."
    textes:
      - "Ghislaine pose une serviette chaude sur ton visage et la retire au bout d'une minute. Elle travaille sans parler, une houppette dans chaque main, comme on cire des chaussures."
      - "Dans la loge, la radio donne un résultat de deuxième division. Ghislaine fronce le nez : « Ceux-là, je les ai eus dimanche. Ils transpiraient avant même la question. »"
      - "Ghislaine ouvre le tiroir des teintes : des boîtes de poudre, un nom au ruban adhésif sur chaque couvercle. Elle en choisit une sans hésiter, et ne dit pas à qui elle était."
      - "Elle essuie le miroir fêlé d'un revers de manche. « La lampe du plateau est plus cruelle que celle-ci. Ici, on prépare ; là-bas, on montre. » Elle souffle sur le pinceau."
    tranches: 1
    francs: 0
    heures: [midi, aprem, soir]

  - id: hauts_ecran_regie
    lieu: tour_ecran
    avec: malo
    si: "annee >= 2017"
    habitude: travail
    label: "Une heure en régie"
    texte: "En régie, douze écrans, un seul à l'antenne. Malo coupe d'un doigt sans regarder le pupitre. Sur l'écran sept, un gamin pleure en tribune ; Malo ne le prend pas."
    textes:
      - "En régie, douze écrans, un seul à l'antenne. Malo coupe d'un doigt sans regarder le pupitre. Sur l'écran sept, un gamin pleure en tribune ; Malo ne le prend pas."
      - "Malo te fait asseoir sur le tabouret des stagiaires. « Regarde la neuf. » Sur la neuf, la pelouse vide de la Rive, en plan fixe, jour et nuit. Personne ne la diffuse. Tout le monde l'enregistre."
      - "Le direct a sept secondes de retard. Malo compte à voix basse quand la tribune gronde, le doigt au-dessus du bouton qui coupe le son. Cette fois, il ne s'en sert pas."
    tranches: 1
    francs: 0
    heures: [aprem, soir]

  - id: hauts_ecran_public
    lieu: tour_ecran
    roles: [joueur]
    si: "division >= 2"
    habitude: travail
    label: "Faire le public du plateau"
    texte: "Le dimanche, le plateau recrute du public : trente chaises, un chauffeur de salle qui lève les bras quand il faut applaudir. On te place au deuxième rang, de dos à la caméra."
    textes:
      - "Le dimanche, le plateau recrute du public : trente chaises, un chauffeur de salle qui lève les bras quand il faut applaudir. On te place au deuxième rang, de dos à la caméra."
      - "Le chauffeur de salle te reconnaît et te met au premier rang, puis se ravise et te renvoie au fond. « On ne montre pas un joueur qui applaudit les autres. »"
      - "Tu applaudis sept fois, tu ris deux fois, tu te tais quand on te le montre. À la sortie, une enveloppe et un sandwich. L'enveloppe est plus mince que le sandwich."
    tranches: 1
    francs: 80
    max_jour: 1
    jours: [dim]
    heures: [soir]

  # — La tour Dalmène (matin, midi, après-midi)
  - id: hauts_dalmene_hall
    lieu: tour_dalmene
    habitude: travail
    label: "Attendre dans le hall ciré"
    texte: "Le hall de Dalmène sent le parquet ciré. Une hôtesse te fait patienter sous un grand tableau de la Tréfilerie, du temps où elle fumait. Personne ne vient ; on t'a vu."
    textes:
      - "Le hall de Dalmène sent le parquet ciré. Une hôtesse te fait patienter sous un grand tableau de la Tréfilerie, du temps où elle fumait. Personne ne vient ; on t'a vu."
      - "Dans le hall, une maquette du stade de la Rive sous verre, le logo bleu-vert sur chaque siège. Quelqu'un y a ajouté une tribune qui n'existe pas. Elle est déjà assurée."
      - "L'ascenseur s'ouvre sur trois cadres qui se taisent en te voyant. Ils reprennent leur conversation entre le dixième et le onzième étage. Tu entends le mot « échéance »."
    tranches: 1
    francs: 0
    heures: [matin, midi, aprem]

  - id: hauts_dalmene_chrono
    lieu: tour_dalmene
    avec: hugues
    si: "annee <= 2014"
    habitude: travail
    label: "Le chronomètre de Hugues"
    texte: "Au trente-deuxième, Hugues repasse le résumé de samedi sur un téléviseur à roulettes, le chronomètre dans la main droite. Il l'arrête chaque fois que le maillot sort du cadre."
    textes:
      - "Au trente-deuxième, Hugues repasse le résumé de samedi sur un téléviseur à roulettes, le chronomètre dans la main droite. Il l'arrête chaque fois que le maillot sort du cadre."
      - "Hugues offre un café dans une tasse à liseré bleu et montre ses colonnes : les secondes de samedi, celles de l'an dernier. Il ne commente jamais la colonne du score."
      - "La salle du conseil est vide. Hugues montre la vitrine où dort un maillot du Racing de 1986, le premier floqué Dalmène. « Payé trois fois son prix. Il valait le double. »"
    tranches: 1
    francs: 0
    heures: [matin, aprem]

  - id: hauts_dalmene_tableaux
    lieu: tour_dalmene
    avec: apolline
    si: "annee >= 2015"
    habitude: travail
    label: "Les colonnes d'Apolline"
    texte: "Apolline tourne son écran : des colonnes, des courbes, une case rouge. Elle cache la case de la main avant qu'on la lise. « Celle-là, elle n'est pas encore vraie. »"
    textes:
      - "Apolline tourne son écran : des colonnes, des courbes, une case rouge. Elle cache la case de la main avant qu'on la lise. « Celle-là, elle n'est pas encore vraie. »"
      - "Elle écrit au crayon dans un carnet à spirale pendant que l'écran calcule. « Lui, il va plus vite. Moi, je me souviens. » Elle tourne la page avant que ton nom apparaisse."
      - "Au trente-deuxième, Apolline déplie la carte des crues de la Rive, le stade en bleu clair. « Un jour, il sera en bleu foncé. Personne ne m'a demandé la légende. »"
    tranches: 1
    francs: 0
    heures: [matin, midi, aprem]

  - id: hauts_dalmene_jambes
    lieu: tour_dalmene
    roles: [joueur]
    habitude: soin
    label: "Assurer ses jambes"
    texte: "Au guichet des particuliers, on te mesure les jambes comme chez un tailleur : la prime dépend du genou. Le conseiller tape tes blessures passées et demande lesquelles tu as oubliées."
    textes:
      - "Au guichet des particuliers, on te mesure les jambes comme chez un tailleur : la prime dépend du genou. Le conseiller tape tes blessures passées et demande lesquelles tu as oubliées."
      - "Le contrat tient en onze pages. Page neuf, une ligne : « sauf blessure survenue en dehors du terrain ». Le conseiller te tend son stylo et regarde ailleurs."
      - "On te fait signer trois fois, dont une fois un papier que tu ne lis pas. « Le formulaire de la Ligue. » À la Ligue, personne n'en a jamais entendu parler."
    tranches: 1
    francs: -300
    heures: [matin, midi, aprem]

  # — L'Impérial (toujours ouvert)
  - id: hauts_imperial_bar
    lieu: hotel_imperial
    habitude: luxe
    label: "Une coupe au bar"
    texte: "Au bar de l'Impérial, les fauteuils sont si bas qu'on ne se relève pas sans y penser. Le barman sert la coupe sans demander laquelle. À la table voisine, on signe quelque chose."
    textes:
      - "Au bar de l'Impérial, les fauteuils sont si bas qu'on ne se relève pas sans y penser. Le barman sert la coupe sans demander laquelle. À la table voisine, on signe quelque chose."
      - "Deux agents se partagent un bol d'amandes au bout du bar. Ils parlent d'un défenseur au passé simple, comme d'un mort. Le barman essuie le même verre depuis cinq minutes."
      - "La coupe arrive sur un napperon brodé d'un I. Le piano joue un air que personne n'écoute. Dans le miroir derrière les bouteilles, la porte à tambour tourne à vide."
      - "Un président de deuxième division boit seul, le manteau sur les genoux. Il te salue d'un signe de verre. Il attend quelqu'un qui ne viendra pas ; il le sait."
    tranches: 1
    francs: -150
    heures: [aprem, soir]

  - id: hauts_imperial_anselme
    lieu: hotel_imperial
    avec: anselme
    si: "annee <= 2013"
    habitude: largesse
    label: "Le pourboire d'Anselme"
    texte: "Un billet plié sous la sonnette de cuivre. Anselme ne le regarde pas ; il le fait disparaître en rangeant une clé. « Le 214 a demandé un taxi pour la gare. Pas pour la capitale. »"
    textes:
      - "Un billet plié sous la sonnette de cuivre. Anselme ne le regarde pas ; il le fait disparaître en rangeant une clé. « Le 214 a demandé un taxi pour la gare. Pas pour la capitale. »"
      - "Anselme montre le porte-parapluies, sans un mot : un parapluie de plus, au manche d'argent. Il laisse deviner à qui. Personne ne devine ; il range le pourboire quand même."
      - "La sonnette de cuivre tinte deux fois, doucement. Anselme décroche, écoute, repose. « Une chambre pour deux heures, au nom de personne. » Il ne dit pas pour qui. Il remercie."
    tranches: 0
    francs: -50

  - id: hauts_imperial_nadir
    lieu: hotel_imperial
    avec: nadir
    si: "annee >= 2014"
    habitude: largesse
    label: "Un billet sous le registre"
    texte: "Un billet glissé sous le registre de cuir. Nadir le fait passer dans sa manche sans quitter l'écran des yeux. « La suite du cinquième a demandé deux taxis. Un seul est revenu. »"
    textes:
      - "Un billet glissé sous le registre de cuir. Nadir le fait passer dans sa manche sans quitter l'écran des yeux. « La suite du cinquième a demandé deux taxis. Un seul est revenu. »"
      - "Nadir touche son oreillette et parle bas, dans une autre langue. Il raccroche, sourit, et range le pourboire dans la boîte des étrennes. « Pour les grooms. Comme moi, avant. »"
      - "Le bouquet devant la caméra du lustre est frais du matin. Nadir le redresse d'un doigt en passant. Il ne dit rien ; le billet a déjà disparu."
    tranches: 0
    francs: -50

  - id: hauts_imperial_salon
    lieu: hotel_imperial
    habitude: travail
    label: "Attendre au salon bleu"
    texte: "Au salon bleu, deux fauteuils de cuir face à face, une table basse, un sous-main. C'est ici qu'on signe. Tu t'assois dans celui de droite. Personne ne vient s'asseoir en face."
    textes:
      - "Au salon bleu, deux fauteuils de cuir face à face, une table basse, un sous-main. C'est ici qu'on signe. Tu t'assois dans celui de droite. Personne ne vient s'asseoir en face."
      - "Un agent attend dans le fauteuil d'en face, un dossier sur les genoux. Il te demande l'heure, puis le nom de ton défenseur central. Il connaissait déjà les deux réponses."
      - "Sur la table basse, un stylo oublié, le capuchon mâchonné. Le garçon d'étage le ramasse dans une serviette, comme une pièce à conviction, et le range dans un tiroir."
    tranches: 1
    francs: 0
    heures: [matin, aprem, soir]

  - id: hauts_imperial_fumoir
    lieu: hotel_imperial
    habitude: jeu
    jeu: cartes
    label: "Une partie au fumoir"
    texte: "Après minuit, le fumoir du premier s'ouvre pour quatre joueurs : deux agents, un armateur, et une place vide. Le croupier ne regarde que les mains. On te donne la place vide."
    textes:
      - "Après minuit, le fumoir du premier s'ouvre pour quatre joueurs : deux agents, un armateur, et une place vide. Le croupier ne regarde que les mains. On te donne la place vide."
      - "Les jetons de l'Impérial sont en os, gravés d'un I. Un agent mise à chaque main la commission d'un transfert de l'été. Il perd en souriant ; l'été paiera."
      - "L'armateur joue en racontant ses bateaux, un par coup. Quand il se tait, c'est qu'il a une bonne main. Il se tait."
