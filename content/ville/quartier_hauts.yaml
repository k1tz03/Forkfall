    francs: -200
    heures: [nuit]

  # — La galerie des Hauts (matin à soir)
  - id: hauts_galerie_vitrines
    lieu: galerie_hauts
    habitude: luxe
    label: "Remonter la galerie"
    texte: "Sous la verrière, les vitrines brillent comme des écrins : montres, cuirs, parfums, un tableau seul dans une boutique vide. Un vigile par porte. Les prix ne sont écrits nulle part."
    textes:
      - "Sous la verrière, les vitrines brillent comme des écrins : montres, cuirs, parfums, un tableau seul dans une boutique vide. Un vigile par porte. Les prix ne sont écrits nulle part."
      - "Une femme essaie un manteau devant le miroir du couturier, le rend, le reprend. Son chauffeur attend dehors, moteur tournant. Le vendeur ne dit rien ; il compte les allers-retours."
      - "Dans la vitrine du maroquinier, un sac de voyage aux initiales d'un joueur de la capitale, en commande spéciale. Les initiales sont cousues à l'envers. Personne n'ose le lui dire."
    tranches: 1
    francs: 0
    heures: [matin, aprem, soir]

  - id: hauts_galerie_hortense
    lieu: galerie_hauts
    avec: hortense
    si: "annee <= 2016"
    habitude: luxe
    label: "Faire régler sa montre"
    texte: "Hortense visse la loupe dans son orbite et ouvre le fond de la montre d'un coup d'ongle. « Elle retarde parce qu'on la porte trop serrée. Comme beaucoup de gens que je connais. »"
    textes:
      - "Hortense visse la loupe dans son orbite et ouvre le fond de la montre d'un coup d'ongle. « Elle retarde parce qu'on la porte trop serrée. Comme beaucoup de gens que je connais. »"
      - "Sur le velours noir, elle aligne trois montres rachetées le matin. Elle ne dit pas à qui. Elle dit seulement que l'une d'elles n'a jamais été remontée."
      - "La pendule de la boutique sonne sept minutes trop tôt. Hortense ne lève pas la tête. Elle règle la montre sur la sienne, à son poignet : la seule qu'elle croit."
    tranches: 1
    francs: -40
    heures: [matin, aprem, soir]

  - id: hauts_galerie_aurele
    lieu: galerie_hauts
    avec: aurele
    si: "annee >= 2017"
    habitude: luxe
    label: "Le mur des rachats"
    texte: "Aurèle fait le tour du mur : des montres, des sacs, des crampons dédicacés, le trophée d'un meilleur joueur dont personne ne se souvient. Tout a son prix, au crayon."
    textes:
      - "Aurèle fait le tour du mur : des montres, des sacs, des crampons dédicacés, le trophée d'un meilleur joueur dont personne ne se souvient. Tout a son prix, au crayon."
      - "Un homme pose sur le comptoir une montre dans sa boîte, avec le certificat. Aurèle l'ouvre, la referme, dit un chiffre. L'homme dit merci. On ne dit jamais merci, ici."
      - "Aurèle recopie une vente dans le cahier de sa grand-mère, en tirant la langue comme un écolier. « L'ordinateur la sait déjà. Le cahier, lui, s'en souviendra. »"
    tranches: 1
    francs: 0
    heures: [matin, aprem, soir]

  - id: hauts_galerie_cadeau
    lieu: galerie_hauts
    habitude: famille
    label: "Un cadeau pour quelqu'un"
    texte: "Chez le maroquinier, une écharpe pour quelqu'un qui attend. La vendeuse l'emballe dans un papier si épais qu'il faudra une heure pour l'ouvrir. C'est le but."
    textes:
      - "Chez le maroquinier, une écharpe pour quelqu'un qui attend. La vendeuse l'emballe dans un papier si épais qu'il faudra une heure pour l'ouvrir. C'est le but."
      - "Au comptoir des parfums, on te fait sentir trois flacons sur des bandes de papier. Au troisième, tu ne sens plus rien. Tu prends le premier, par fidélité."
      - "Le papetier de la galerie grave un prénom sur un stylo. Il demande si c'est pour un anniversaire. Tu dis oui. Ce n'en est pas un ; c'est une excuse."
    tranches: 1
    francs: -600
    heures: [matin, aprem, soir]

  # — Le cabinet Verdier (matin, midi, après-midi)
  - id: hauts_verdier_attente
    lieu: cabinet_verdier
    habitude: travail
    label: "La salle d'attente"
    texte: "Dans la salle d'attente du cabinet, personne ne lit les revues. Un joueur de deuxième division tient son contrat sur ses genoux comme une radio des poumons."
    textes:
      - "Dans la salle d'attente du cabinet, personne ne lit les revues. Un joueur de deuxième division tient son contrat sur ses genoux comme une radio des poumons."
      - "Les deux lauriers de l'entrée passent l'hiver dans la salle d'attente. Une mère attend son fils, un agent attend la mère. Le fils, lui, est à l'entraînement."
      - "Par la porte entrouverte, un avocat lit une clause à voix haute, lentement, deux fois. Puis un silence. Puis quelqu'un qui dit « Ah ». La secrétaire referme la porte."
    tranches: 1
    francs: 0
    heures: [matin, midi, aprem]

  - id: hauts_verdier_aristide
    lieu: cabinet_verdier
    avec: aristide
    si: "annee <= 2015"
    habitude: travail
    label: "Faire relire un contrat"
    texte: "Maître Verdier retourne le sablier et lit le contrat sans lunettes, le doigt sous la ligne. Il s'arrête deux fois au même article. Il ne dit pas lequel ; il le souligne."
    textes:
      - "Maître Verdier retourne le sablier et lit le contrat sans lunettes, le doigt sous la ligne. Il s'arrête deux fois au même article. Il ne dit pas lequel ; il le souligne."
      - "Le sable coule pendant qu'il raconte un procès de 1972, perdu. À la dernière seconde, il rend le contrat avec une seule annotation, au crayon : « Demandez pourquoi. »"
      - "Il désigne le fauteuil des clients qu'il aime, celui qui ne grince pas. « Vos contrats sont mal écrits. Bonne nouvelle : ce qui est mal écrit se renégocie. »"
    tranches: 1
    francs: -250
    heures: [matin, midi, aprem]

  - id: hauts_verdier_constance
    lieu: cabinet_verdier
    avec: constance
    si: "annee >= 2016"
    habitude: travail
    label: "Une consultation"
    texte: "Constance lit le contrat en diagonale, puis en entier, puis la dernière page à l'envers. « On cache toujours quelque chose près de la signature. » Le sablier reste couché."
    textes:
      - "Constance lit le contrat en diagonale, puis en entier, puis la dernière page à l'envers. « On cache toujours quelque chose près de la signature. » Le sablier reste couché."
      - "Sur la terrasse des associés, sous la toile, elle écoute en regardant le chantier de la phase trois. Elle ne note rien. Au bout d'une heure, elle répète tout, mot pour mot."
      - "Elle imprime le contrat, ce que plus personne ne fait, et le corrige au stylo rouge. « Le papier, je peux le brûler. Le reste, je ne sais pas qui le garde. »"
    tranches: 1
    francs: -250
    heures: [matin, midi, aprem]

  - id: hauts_verdier_plis
    lieu: cabinet_verdier
    roles: [joueur]
    si: "division >= 2"
    habitude: travail
    label: "Porter les plis du cabinet"
    texte: "La secrétaire du cabinet te confie trois enveloppes épaisses : le greffe, la banque, la tour Dalmène. Elle ne demande pas ton nom. Elle te donne un reçu à signer au retour."
    textes:
      - "La secrétaire du cabinet te confie trois enveloppes épaisses : le greffe, la banque, la tour Dalmène. Elle ne demande pas ton nom. Elle te donne un reçu à signer au retour."
      - "L'une des enveloppes porte le nom d'un club de ta division. Tu la portes sans la regarder. Au greffe, la préposée la regarde, elle, longtemps."
      - "Au retour, la secrétaire paie en liquide, dans une petite enveloppe à l'en-tête du cabinet, déchirée en deux pour qu'on ne la réutilise pas."
    tranches: 1
    francs: 60
    max_jour: 1
    heures: [matin, midi, aprem]

  # — La Table des Hauts (midi, soir)
  - id: hauts_table_dejeuner
    lieu: table_hauts
    habitude: luxe
    label: "Déjeuner à la Table"
    texte: "L'ascenseur panoramique monte au-dessus des toits. À table, le stade de la Rive tient dans l'assiette, entre deux gouttes de sauce. Le serveur verse sans regarder le verre."
    textes:
      - "L'ascenseur panoramique monte au-dessus des toits. À table, le stade de la Rive tient dans l'assiette, entre deux gouttes de sauce. Le serveur verse sans regarder le verre."
      - "À la table voisine, un président de club et un promoteur se partagent un dessert et un plan roulé. Ils se taisent quand le serveur passe. Il passe souvent."
      - "Le menu n'a pas de prix. L'addition arrive pliée sous une serviette brodée. Tu la déplies comme une lettre qu'on n'attendait pas."
    tranches: 1
    francs: -400
    heures: [midi]

  - id: hauts_table_lazare
    lieu: table_hauts
    avec: lazare
    si: "annee <= 2018"
    habitude: luxe
    label: "Un verre avec Lazare"
    texte: "Lazare sert au comptoir de la salle, debout, comme à un ami de passage. Il penche son plan de table vers la lumière : sous un nom, on lit encore celui qu'il a effacé."
    textes:
      - "Lazare sert au comptoir de la salle, debout, comme à un ami de passage. Il penche son plan de table vers la lumière : sous un nom, on lit encore celui qu'il a effacé."
      - "Avant le service, Lazare plie les serviettes une par une, en éventail. Il raconte un banquet de 1974 où l'on n'a pas fini le dessert. Il ne dit pas pourquoi."
      - "Lazare raccompagne un couple jusqu'à l'ascenseur et revient en comptant tout bas jusqu'à trente et un. « Pas un mot en montant. Ils en diront à la descente. »"
    tranches: 1
    francs: -60
    heures: [midi, soir]

  - id: hauts_table_romane
    lieu: table_hauts
    avec: romane
    si: "annee >= 2019"
    habitude: luxe
    label: "Un verre avec Romane"
    texte: "Romane sert au comptoir de la salle, entre deux services. Elle a gardé le plan de table au crayon de Lazare. « Les écrans perdent les noms. Le papier les garde, même effacés. »"
    textes:
      - "Romane sert au comptoir de la salle, entre deux services. Elle a gardé le plan de table au crayon de Lazare. « Les écrans perdent les noms. Le papier les garde, même effacés. »"
      - "Elle verse sans regarder le verre. « La table quatre parle football depuis l'entrée. Je l'ai mise dos à la vitre ; elle ne s'en est pas aperçue. Elle va perdre. »"
      - "Romane descend avec toi dans l'ascenseur panoramique. Vingt-neuf secondes. Elle compte sur ses doigts, contre la rambarde de laiton, comme faisait Lazare."
    tranches: 1
    francs: -60
    heures: [midi, soir]

  - id: hauts_table_ascenseur
    lieu: table_hauts
    habitude: culture
    label: "L'ascenseur panoramique"
    texte: "L'ascenseur monte le long de la façade, et la ville se déplie : la Rive, le pont, le stade, la friche, les toits de la Tréfilerie. En haut, on redescend sans être entré."
    textes:
      - "L'ascenseur monte le long de la façade, et la ville se déplie : la Rive, le pont, le stade, la friche, les toits de la Tréfilerie. En haut, on redescend sans être entré."
      - "Dans la cabine de verre, un groom tient la porte et regarde ses chaussures. Au trentième, il dit « le stade » à voix basse, comme on donne l'heure."
      - "La nuit tombe pendant la montée. La vieille ville s'allume par quartiers, le stade en dernier. D'ici, elle a l'air de quelque chose qu'on pourrait acheter."
    tranches: 0
    francs: 0
    heures: [midi, soir]

  - id: hauts_table_terrasse
    lieu: table_hauts
    habitude: nuit
    label: "Un verre en terrasse"
    texte: "Sur la terrasse de la Table, sous la pergola, le vent du plateau éteint les bougies une à une. Le serveur les rallume sans un mot. En bas, le stade dort, projecteurs éteints."
    textes:
      - "Sur la terrasse de la Table, sous la pergola, le vent du plateau éteint les bougies une à une. Le serveur les rallume sans un mot. En bas, le stade dort, projecteurs éteints."
      - "Deux hommes de la Ligue fument au bord de la terrasse, la cravate dans la poche. L'un montre le stade du menton et dit un chiffre. L'autre dit un chiffre plus petit."
      - "La terrasse se vide à onze heures. Restent le vent et un couple qui ne se parle plus depuis le plat. En bas, la ville a l'air d'une maquette qu'on aurait oublié d'éteindre."
    tranches: 1
    francs: -100
    heures: [soir]

  # — Le parvis (toujours ouvert)
  - id: hauts_parvis_bassin
    lieu: parvis
    habitude: quartier
    label: "Le banc du bassin"
    texte: "Sur le banc de granit, au bord du bassin, tu regardes passer les gens pressés. Le vent tend les drapeaux vers l'est. Un dossier s'envole ; personne ne court derrière."
    textes:
      - "Sur le banc de granit, au bord du bassin, tu regardes passer les gens pressés. Le vent tend les drapeaux vers l'est. Un dossier s'envole ; personne ne court derrière."
      - "Les jets d'eau montent et retombent en ligne. Un employé de Dalmène mange une pomme en regardant l'horloge à deux cadrans. Les deux cadrans ne disent pas la même heure."
      - "Un vigile fait le tour de la sculpture rouge et la touche de la main en passant, comme pour vérifier qu'elle est toujours là. Elle y est depuis la première tour."
    tranches: 1
    francs: 0
    heures: [matin, midi, aprem, soir]

  - id: hauts_parvis_raoul
    lieu: parvis
    avec: raoul
    si: "annee <= 2019"
    habitude: quartier
    label: "Un sandwich avec Raoul"
    texte: "Raoul partage son banc et son sandwich, coupé en deux d'un coup de raclette. Il montre une fenêtre du vingtième. « Celui-là se mouche dans ses rideaux. Tous les jours, à midi dix. »"
    textes:
      - "Raoul partage son banc et son sandwich, coupé en deux d'un coup de raclette. Il montre une fenêtre du vingtième. « Celui-là se mouche dans ses rideaux. Tous les jours, à midi dix. »"
      - "Raoul mange en regardant les tours, pas les gens. Il dit l'étage où il s'est arrêté ce matin, et ce qu'il y a vu. Ce n'est jamais grand-chose. C'est toujours exact."
      - "Le vent emporte le papier du sandwich. Raoul le rattrape d'une main sans se lever, comme un gardien sur sa ligne. « Trente ans de nacelle. On attrape ce qui tombe. »"
    tranches: 1
    francs: -10
    heures: [midi]

  - id: hauts_parvis_karine
    lieu: parvis
    avec: karine
    si: "annee >= 2020"
    habitude: quartier
    label: "Le café du thermos"
    texte: "Karine descend de sa corde en trois rebonds et sert du café dans le bouchon du thermos. Elle garde son casque. « Je ne l'enlève jamais entre deux étages. Même pour boire. »"
    textes:
      - "Karine descend de sa corde en trois rebonds et sert du café dans le bouchon du thermos. Elle garde son casque. « Je ne l'enlève jamais entre deux étages. Même pour boire. »"
      - "Elle montre les tours une à une, du menton, en disant ce qu'on y fait le soir. Dalmène, rien. L'Écran, tout. La tour ronde, des choses qu'elle ne dit pas."
      - "Karine vérifie ses nœuds pendant que tu bois, sans regarder ses mains. « Mon père comptait les étages. Moi, je compte les nœuds. Le reste se compte tout seul. »"
    tranches: 1
    francs: 0
    heures: [matin, midi, aprem]

# ═══════════════════════════════════════════════════════════════ LES SCÈNES
# La vie des gens des Hauts (gardée par le lien et bornée par leurs années), les dettes
# qu'on vient réclamer, et la vie du quartier sans personne de connu : une signature dans
# la cour de l'Impérial, la fête de l'assureur, le fauteuil du dimanche, la grue qui
# s'arrête, la grève de l'Écran. Une scène posée à un lieu des Hauts porte `saison >= 2`
# quand rien d'autre ne garantit que le quartier est ouvert.
scenes:

  # ─────────────────────────────────────────────── Ghislaine, la tour Écran
  - id: vi.sc.ghislaine_direct
    titre: "L'invité de vingt heures trente"
    lieu: tour_ecran
    tranches: [soir]
    jours: [dim]
    qui: ghislaine
    si: "relation.ghislaine >= 1 && annee <= 2016"
    texte: "Dimanche, vingt heures vingt. Dans le fauteuil de maquillage, l'invité de l'émission dort, une flasque dans la poche. Ghislaine pose sa houppette : « Il passe dans dix minutes. Il faut quelqu'un. »"
    choix:
      - label: "Je prends sa place"
        reponse: "Dix minutes sans fiche, sous les lampes. Le présentateur ne coupe pas. Le lundi, au Corner, on répète tes phrases ; ailleurs, on te demande qui t'avait autorisé."
        effets: {relation: {ghislaine: 1}, jauges: {tribunes: 2, direction: -1}}
      - label: "Je le réveille"
        reponse: "Tu lui passes la tête sous l'eau froide du lavabo. Il passe à l'antenne rouge comme une brique et cite ton nom deux fois, en bien. Il ne se souvient pas de toi."
        effets: {jauges: {direction: 1}}

  - id: vi.sc.ghislaine_definition
    titre: "La haute définition"
    lieu: tour_ecran
    tranches: [aprem]
    qui: ghislaine
    si: "relation.ghislaine >= 2 && annee >= 2007 && annee <= 2014"
    texte: "Sur sa tablette, une lettre de la chaîne : une maquilleuse formée à la haute définition arrive en mars. Ghislaine la plie en quatre : « Un invité peut exiger sa maquilleuse. Tu exigerais ? »"
    choix:
      - label: "J'exige Ghislaine"
        reponse: "Tu l'écris à la chaîne, sur papier à en-tête. Elle garde son fauteuil deux saisons de plus. À la direction, on trouve que tu t'occupes de drôles de choses."
        effets: {relation: {ghislaine: 1}, jauges: {direction: -1}}
      - label: "Je ne m'en mêle pas"
        reponse: "« Non. » Elle range ses pinceaux par taille, le plus fin d'abord, comme on range des couverts pour la dernière fois."
        effets: {relation: {ghislaine: -1}}

  # ─────────────────────────────────────────────── Malo, la tour Écran
  - id: vi.sc.malo_plan_coupe
    titre: "Le plan coupé"
    lieu: tour_ecran
    tranches: [soir]
    qui: malo
    si: "relation.malo >= 2 && annee >= 2018"
    texte: "Malo repasse un plan que personne n'a vu : samedi, en tribune Nord, un stadier frappe un gamin à terre. « Ça n'est pas passé à l'antenne. J'ai l'original. Je l'envoie à L'Écho, ou je l'efface ? »"
    choix:
      - label: "Envoie-le à L'Écho"
        reponse: "L'Écho le publie le mercredi, le visage du gamin flouté. Le stadier est suspendu. On te demande qui a fourni l'image ; tu ne réponds pas."
        effets: {relation: {malo: 1}, jauges: {tribunes: 2, direction: -1}}
      - label: "Efface-le"
        reponse: "Il efface sans un mot, puis il note l'heure dans son carnet des plans coupés. « Le plan n'existe plus. La ligne, si. »"
        effets: {relation: {malo: -1}}

  - id: vi.sc.malo_voix
    titre: "La voix de la régie"
    lieu: tour_ecran
    tranches: [aprem]
    qui: malo
    si: "relation.malo >= 1 && annee >= 2034"
    texte: "Malo tient un formulaire : la chaîne veut copier sa voix pour les annonces du stade. « Une prime, et ma voix lira les compositions jusqu'à ma mort. Après aussi, j'imagine. Je signe ? »"
    choix:
      - label: "Ne signe pas"
        reponse: "Il plie le formulaire en avion et le lance dans la cage d'escalier. Le mois suivant, une autre voix lit les compositions. Elle écorche le nom de ton gardien."
        effets: {relation: {malo: 1}}
      - label: "Signe, c'est l'époque"
        reponse: "Il signe. Deux semaines plus tard, sa voix annonce les équipes pendant qu'il boit son café en régie. Il ne lève plus la tête quand elle parle."
        effets: {relation: {malo: -1}}

  - id: vi.sc.malo_dette
    titre: "Une image qu'on doit"
    lieu: tour_ecran
    tranches: [aprem]
    qui: malo
    si: "flag(dette_malo) && annee >= 2017"
    texte: "Malo pose une clé sur la console : « Les plans coupés de chez toi depuis l'été. Un documentaire les veut. Il me faut ta signature au bas de l'autorisation. Tu me dois une image. »"
    choix:
      - label: "Je signe"
        reponse: "Le documentaire passe en mars, à vingt-trois heures. On y voit le vestiaire après une défaite, sans le son. Les joueurs le regardent ensemble, et personne ne parle."
        effets: {jauges: {vestiaire: -2, tribunes: 1}, clear: [dette_malo]}
      - label: "Pas ces images-là"
        reponse: "Il reprend la clé et la glisse dans le carnet des plans coupés. « D'accord. » Le samedi suivant, la caméra reste sur toi pendant tout le temps additionnel."
        effets: {relation: {malo: -2}, clear: [dette_malo]}

  # ─────────────────────────────────────────────── Hugues, la tour Dalmène
  - id: vi.sc.hugues_clause
    titre: "La clause onze"
    roles: [entraineur, ds, president, selectionneur]
    lieu: tour_dalmene
    tranches: [matin]
    qui: hugues
    si: "relation.hugues >= 2 && annee <= 2014"
    texte: "Hugues fait glisser une photo sur le bureau : un de vos joueurs, à quatre heures, devant le Rideau Rouge, une bouteille à la main. « Clause onze, moralité. Je la montre jeudi, ou je la perds. »"
    choix:
      - label: "Perdez-la, Hugues"
        reponse: "Il la glisse dans le tiroir du chronomètre et ferme à clé. « Égarée. Le jour où je retrouve quelque chose, vous serez le premier prévenu. »"
        effets: {relation: {hugues: 1}, jauges: {vestiaire: 1}}
      - label: "Montrez-la au comité"
        reponse: "Le comité la regarde dix secondes et suspend la prime du maillot pour un mois. Le joueur l'apprend par le journal ; il croit savoir d'où ça vient."
        effets: {jauges: {caisse: -2, vestiaire: -1}}

  - id: vi.sc.hugues_rachat
    titre: "Le nouveau comité"
    roles: [entraineur, ds, president]
    lieu: tour_dalmene
    tranches: [aprem]
    qui: hugues
    si: "relation.hugues >= 2 && annee >= 2010 && annee <= 2014"
    texte: "Dalmène a été rachetée par un groupe de la capitale. Hugues tient le contrat du maillot : « Lundi, neuf heures, le nouveau comité demandera si votre club tient debout. Quelqu'un devra dire oui. »"
    choix:
      - label: "J'y serai lundi"
        reponse: "Lundi, tu dis oui sans trembler devant six inconnus en costume gris. Hugues chronomètre ta réponse sous la table. Le maillot est renouvelé pour trois ans."
        effets: {relation: {hugues: 1}, jauges: {caisse: 2}}
      - label: "Je ne mentirai pas"
        reponse: "Hugues y va seul. Le nouveau comité renouvelle pour un an, au tiers du prix. En sortant, Hugues arrête son chronomètre et ne le relance plus."
        effets: {relation: {hugues: -1}, jauges: {caisse: -2}}

  - id: vi.sc.hugues_dette
    titre: "Le congrès des agents"
    lieu: tour_dalmene
    tranches: [aprem]
    qui: hugues
    si: "flag(dette_hugues) && annee <= 2014"
    texte: "Hugues pose un carton d'invitation sur le bureau : le congrès des agents Dalmène, à l'Impérial. « Ils veulent un témoignage. Une phrase sur nos assurances, au dessert. L'avance, c'est cette phrase. »"
    choix:
      - label: "Je dirai la phrase"
        reponse: "Tu la dis entre la poire et le café, sous une banderole bleu-vert. Les agents applaudissent. Le lendemain, au Corner, quelqu'un l'a apprise par cœur, pour rire."
        effets: {jauges: {tribunes: -2, caisse: 1}, clear: [dette_hugues]}
      - label: "Je n'irai pas"
        reponse: "Hugues range le carton dans le tiroir du chronomètre. « Le comité reprendra l'avance sur l'échéance de mars. » Il le note au crayon, dans la marge."
        effets: {relation: {hugues: -2}, jauges: {caisse: -3}, clear: [dette_hugues]}

  # ─────────────────────────────────────────────── Apolline, la tour Dalmène
  - id: vi.sc.apolline_case_rouge
    titre: "La case rouge"
    roles: [entraineur, ds, president]
    lieu: tour_dalmene
    tranches: [matin]
    qui: apolline
    si: "relation.apolline >= 2 && annee >= 2024"
    texte: "Apolline tourne son écran : la courbe d'un de tes défenseurs, rouge depuis trois semaines. « Lundi, le modèle le déclare non assurable. Je peux envoyer le rapport à la fin du mois. Pas après. »"
    choix:
      - label: "Retarde-le d'un mois"
        reponse: "Le défenseur joue trois matchs de plus, assuré. Tu le reposes au quatrième. Il ne sait pas pourquoi on le ménage ; son corps, si."
        effets: {relation: {apolline: 1}, jauges: {vestiaire: 2, caisse: -1}}
      - label: "Envoie-le"
        reponse: "Lundi, sa prime triple. Le club le met sur la liste des départs. Il l'apprend par son agent, sur le parking, la portière ouverte."
        effets: {jauges: {vestiaire: -2, caisse: 1}}

  - id: vi.sc.apolline_zone_bleue
    titre: "La zone bleue"
    roles: [entraineur, joueur, ds, president]
    lieu: tour_dalmene
    tranches: [aprem]
    qui: apolline
    si: "relation.apolline >= 1 && annee >= 2035"
    texte: "Apolline déplie la carte de la Rive, le stade dans une tache bleue : « En 2041, nous ne couvrons plus le stade, sauf si le muret du quai monte de quarante centimètres. Le club ne répond pas. »"
    choix:
      - label: "Je porte la carte au club"
        reponse: "Les maçons montent le muret en trois semaines, au ras de la tribune Est. Le virage y peint aussitôt une ligne bordeaux, à la hauteur de la crue de 1955."
        effets: {relation: {apolline: 1}, jauges: {caisse: -2, tribunes: 1}}
      - label: "Le club décidera"
        reponse: "Apolline replie la carte selon ses plis. « Le club décidera. La Rive aussi. » Elle note la date au crayon, à côté d'un chiffre qu'elle ne montre pas."
        effets: {relation: {apolline: -1}, jauges: {caisse: 1}}

  # ─────────────────────────────────────────────── Anselme, l'Impérial
  - id: vi.sc.anselme_valise
    titre: "La valise de la bagagerie"
    lieu: hotel_imperial
    tranches: [soir]
    qui: anselme
    si: "relation.anselme >= 1 && annee <= 2013"
    texte: "À la bagagerie, une valise attend depuis mardi, une étiquette à ton nom, d'une écriture qui n'est pas la tienne. Anselme la soupèse : « Elle pèse le poids du papier. On l'ouvre, ou on la renvoie ? »"
    choix:
      - label: "On l'ouvre"
        francs: 2500
        sale: true
        reponse: "Des liasses, rangées par paquets, sous un journal de Portclair. Anselme referme sans compter. « Je n'ai rien vu. Vous non plus, si vous êtes raisonnable. »"
        effets: {jauges: {direction: -1}}
      - label: "Renvoyez-la"
        reponse: "Anselme la fait porter à l'adresse de l'étiquette, à Portclair, avec un mot de l'hôtel. Une semaine plus tard, un homme en manteau demande qui a refusé la valise."
        effets: {relation: {anselme: 1}, jauges: {direction: 1}}

  - id: vi.sc.anselme_cartes
    titre: "Les cartes magnétiques"
    lieu: hotel_imperial
    tranches: [matin]
    qui: anselme
    si: "relation.anselme >= 2 && annee >= 1998 && annee <= 2006"
    texte: "Le nouveau directeur veut des cartes magnétiques, et un concierge plus jeune. Anselme astique sa sonnette plus longtemps que d'habitude : « Un mot de vous, peut-être. On vous écoute, en ville. »"
    choix:
      - label: "J'écris au directeur"
        reponse: "Ta lettre arrive un lundi. Les cartes magnétiques aussi, mais Anselme garde le comptoir. Il range ta lettre sous le registre, pliée en quatre."
        effets: {relation: {anselme: 1}, jauges: {direction: -1}}
      - label: "Les cartes, c'est l'avenir"
        reponse: "« Sans doute. » Il range la sonnette dans un tiroir, pour la première fois depuis 1955, puis l'en ressort. Le soir, il ne te salue plus par ton nom."
        effets: {relation: {anselme: -1}}

  - id: vi.sc.anselme_passation
    titre: "Le registre de cuir"
    lieu: hotel_imperial
    tranches: [aprem]
    qui: anselme
    si: "relation.anselme >= 2 && annee >= 2012 && annee <= 2013"
    texte: "Anselme rend sa sonnette à la fin du mois. Le registre de cuir, 1955-2013, passera au petit Meziane, de la main à la main. « Il faut un témoin qui ne soit pas de la maison. Vous voulez bien ? »"
    choix:
      - label: "Je serai votre témoin"
        reponse: "Au salon bleu, Anselme pose le registre sur la table basse et ne dit rien. Nadir le prend comme on prend un enfant. Ni l'un ni l'autre n'oubliera qui était là."
        effets: {relation: {anselme: 1, nadir: 1}}
      - label: "Ce n'est pas ma place"
        reponse: "« Non, sans doute. » Il demande au barman. Le registre change de mains sous le piano, sans témoin de la ville. Anselme ne te salue plus que d'un signe de tête."
        effets: {relation: {anselme: -1}}

  - id: vi.sc.anselme_dette
    titre: "Le groom du 214"
    lieu: hotel_imperial
    tranches: [soir]
    qui: anselme
    si: "flag(dette_anselme) && annee <= 2013"
    texte: "Anselme, très bas : « Un groom est accusé d'avoir volé une montre au 214, chez un joueur que vous connaissez. Il n'a rien volé ; il a vu quelque chose. Parlez au joueur, et le 307 est payé. »"
    choix:
      - label: "Je parle au joueur"
        reponse: "Le joueur retire sa plainte en haussant les épaules. Ensuite, il te regarde autrement, comme quelqu'un qui sait ce que le groom a vu."
        effets: {jauges: {vestiaire: -2}, clear: [dette_anselme]}
      - label: "Ce n'est pas mon affaire"
        reponse: "Le groom est renvoyé le lendemain matin. Anselme décroche la clé du 307 du tableau, la regarde, et la met dans sa poche."
        effets: {relation: {anselme: -2}, clear: [dette_anselme]}

  # ─────────────────────────────────────────────── Nadir, l'Impérial
  - id: vi.sc.nadir_golf
    titre: "Les sacs de 1992"
    lieu: hotel_imperial
    tranches: [aprem]
    qui: nadir
    si: "relation.nadir >= 1 && annee >= 2014"
    texte: "Un vieil homme en blazer réclame à la conciergerie ses sacs de golf, ceux de 1992 ; il présidait un club, alors. Nadir, très bas : « Il croit qu'on est en 1992. Dites-lui que son club a gagné. »"
    choix:
      - label: "Je joue le jeu"
        reponse: "Tu lui donnes le score d'un match que personne n'a joué. Il te serre la main longtemps, ravi, et repart vers le tambour sans ses sacs. Nadir le regarde tourner deux fois."
        effets: {relation: {nadir: 1}}
      - label: "Je lui dis la vérité"
        reponse: "Le vieil homme écoute poliment, puis redemande ses sacs. Nadir appelle sa fille. En attendant, il lui sert un thé, et ne te regarde plus."
        effets: {relation: {nadir: -1}}

  - id: vi.sc.nadir_audit
    titre: "Le second tiroir"
    lieu: hotel_imperial
    tranches: [nuit]
    qui: nadir
    si: "relation.nadir >= 2 && annee >= 2026"
    texte: "Le fonds qui a racheté l'Impérial exige la destruction des archives papier. Nadir sort le registre de cuir de son second tiroir : « Trois jours chez toi, le temps de l'audit. Ensuite, il revient. »"
    choix:
      - label: "Je le prends chez moi"
        reponse: "Tu le caches derrière des annuaires que plus personne n'ouvre. Pendant l'audit, on fouille la conciergerie jusqu'aux plinthes. Nadir revient le chercher un dimanche, avec des croissants."
        effets: {relation: {nadir: 1}, jauges: {direction: -1}}
      - label: "Brûle-le, c'est plus sûr"
        reponse: "Nadir le regarde longtemps. « Anselme l'aurait brûlé, oui. » Il ne le brûle pas : il le confie au chef des cuisines. Toi, il te vouvoie de nouveau."
        effets: {relation: {nadir: -1}}

  # ─────────────────────────────────────────────── Hortense, la galerie
  - id: vi.sc.hortense_livre
    titre: "La dernière page"
    lieu: galerie_hauts
    tranches: [aprem]
    qui: hortense
    si: "relation.hortense >= 2 && annee <= 2016"
    texte: "Un inspecteur doit lire le livre de police demain matin. Hortense l'ouvre à la dernière page : une montre revendue mardi par un joueur que tu connais, volée à un autre. « J'arrache, ou il lit ? »"
    choix:
      - label: "Arrachez la page"
        reponse: "Elle l'arrache au ras de la couture et la brûle dans le cendrier de son mari. Le voleur ne saura jamais pourquoi rien n'est arrivé. Toi, tu sais qui c'est."
        effets: {relation: {hortense: 1}, jauges: {vestiaire: 1, direction: -1}}
      - label: "Laissez-le lire"
        reponse: "L'inspecteur lit, recopie, remercie. Le joueur est entendu le jeudi, pendant que tout le vestiaire fait semblant de lacer ses chaussures."
        effets: {jauges: {vestiaire: -2, direction: 1}}

  - id: vi.sc.hortense_vitrine
    titre: "La vitrine étoilée"
    lieu: galerie_hauts
    tranches: [matin]
    qui: hortense
    si: "relation.hortense >= 1 && annee <= 2016"
    texte: "Au matin, la vitrine d'Hortense est étoilée d'un coup de masse, le velours vide. L'alarme était coupée ; l'assurance ne paiera pas. Elle balaie les éclats : « Il me faudrait vendre une pièce. »"
    choix:
      - label: "J'achète une pièce"
        francs: -800
        reponse: "Elle te vend une broche de jais qu'elle n'a jamais aimée, au prix de la vitrine. « Tu me rends mon mois. Je te rendrai autre chose, plus tard. »"
        effets: {relation: {hortense: 1}}
      - label: "Pas cette fois"
        reponse: "Elle hoche la tête et continue de balayer. Ce soir-là, sa vitrine reste éteinte, pour la première fois depuis 1983."
        effets: {relation: {hortense: -1}}

  - id: vi.sc.hortense_dette
    titre: "Le gage"
    lieu: galerie_hauts
    tranches: [aprem]
    qui: hortense
    si: "flag(dette_hortense) && annee <= 2016"
    texte: "Hortense ouvre le livre de police à la page du gage : « Mon petit-fils fait les comptes cette semaine. Il me faut la somme, avec ce que la banque aurait pris. Ou ton nom en face de la ligne. »"
    choix:
      - label: "Je rembourse tout"
        francs: -1800
        reponse: "Elle recompte deux fois, devant toi, puis raye la ligne d'un trait si fin qu'on la lit encore. « Un gage remboursé, ça se garde aussi. »"
        effets: {clear: [dette_hortense]}
      - label: "Pas mon nom"
        reponse: "Elle referme le livre sans bruit. « Alors j'écrirai lisiblement. » La semaine suivante, un inspecteur lit le livre de police, et ton nom avec."
        effets: {relation: {hortense: -2}, jauges: {direction: -2}, clear: [dette_hortense]}

  # ─────────────────────────────────────────────── Aurèle, la galerie
  - id: vi.sc.aurele_poignet
    titre: "Le poignet"
    lieu: galerie_hauts
    tranches: [aprem]
    qui: aurele
    si: "relation.aurele >= 1 && annee >= 2017 && annee <= 2026"
    texte: "Hortense, très vieille, s'est assise derrière le comptoir de son petit-fils, la loupe au cou. Elle fait signe d'approcher et tend la main, paume ouverte : « Ton poignet. Je veux voir. »"
    choix:
      - label: "Je tends le poignet"
        reponse: "Elle le tient longtemps, sans regarder la montre. « Tu dors mal, et tu ne le dis à personne. » Elle le lâche. Derrière elle, Aurèle détourne les yeux."
        effets: {relation: {aurele: 1}}
      - label: "Je garde mes mains"
        reponse: "« Comme les autres. » Elle referme la main sur rien. Aurèle la raccompagne au taxi ; elle ne revient plus à la galerie."
        effets: {relation: {aurele: -1}}

  - id: vi.sc.aurele_exposition
    titre: "La galerie à vendre"
    lieu: galerie_hauts
    tranches: [soir]
    qui: aurele
    si: "relation.aurele >= 2 && annee >= 2030"
    texte: "Le propriétaire de la galerie veut y mettre des serveurs informatiques. Aurèle veut y monter une exposition, un siècle de montres de footballeurs. « Il me faut un nom connu en haut de l'affiche. »"
    choix:
      - label: "Mets le mien"
        francs: -500
        reponse: "Ton nom est en haut de l'affiche, sous la verrière. Les gens viennent voir les montres et lire les dédicaces au dos. La galerie tient un an de plus."
        effets: {relation: {aurele: 1}, jauges: {tribunes: 1}}
      - label: "Pas mon nom"
        reponse: "Il met celui d'un ancien gardien de la capitale. L'exposition dure trois semaines. Les serveurs arrivent au printemps, dans des caisses grises."
        effets: {relation: {aurele: -1}}

  # ─────────────────────────────────────────────── Aristide, le cabinet Verdier
  - id: vi.sc.aristide_lettre
    titre: "La date en blanc"
    roles: [entraineur, ds]
    lieu: cabinet_verdier
    tranches: [matin]
    qui: aristide
    si: "relation.aristide >= 2 && annee <= 2015"
    texte: "Sur le bureau de Maître Verdier, une lettre de licenciement à ton nom, rédigée pour ton président, la date en blanc. Il retourne le sablier : « Je l'ai oubliée là. Vous ne l'avez pas vue. »"
    choix:
      - label: "Je lis jusqu'au bout"
        reponse: "Trois motifs, dont un faux. Tu vas voir le président le soir même, avant qu'il ne choisisse sa date. Il ne la choisit pas cette saison."
        effets: {jauges: {direction: 2}}
      - label: "Rangez ça, Maître"
        reponse: "Il la range sans hâte. « Vous avez raison. Je ne l'avais pas laissée là par hasard ; vous, vous ne l'avez pas lue. » Il te raccompagne jusqu'à la porte de bronze."
        effets: {relation: {aristide: 1}, jauges: {direction: -1}}

  - id: vi.sc.aristide_fille
    titre: "Au fond de la pièce"
    lieu: cabinet_verdier
    tranches: [aprem]
    qui: aristide
    si: "relation.aristide >= 1 && annee >= 1996 && annee <= 2003"
    texte: "Maître Verdier présente sa fille, Constance, avocate depuis peu, un bloc sous le bras. « Elle voudrait assister à votre prochaine négociation. Au fond de la pièce, sans parler. »"
    choix:
      - label: "Qu'elle vienne"
        reponse: "Elle s'assoit au fond et ne dit rien pendant deux heures. En sortant, elle te donne le nombre de fois où l'agent d'en face a menti. Elle ne s'est pas trompée."
        effets: {relation: {aristide: 1, constance: 1}}
      - label: "Pas devant une débutante"
        reponse: "« Comme vous voudrez. » Elle referme son bloc. Ce mois-là, Maître Verdier facture le quart d'heure entamé, pour la première fois."
        effets: {relation: {aristide: -1}}

  - id: vi.sc.aristide_dette
    titre: "Le témoin de moralité"
    lieu: cabinet_verdier
    tranches: [matin]
    qui: aristide
    si: "flag(dette_aristide) && annee <= 2015"
    texte: "Maître Verdier pose le sablier entre vous : « Un ancien client, président de club, comparaît jeudi. Il lui faut un témoin de moralité connu en ville. L'article neuf était un acompte. »"
    choix:
      - label: "Je témoignerai"
        reponse: "À la barre, tu dis qu'il payait ses joueurs à l'heure. C'est vrai ; c'est tout ce qui est vrai. Il est relaxé. Au Corner, on dit que tu défends les présidents."
        effets: {jauges: {tribunes: -2, direction: 1}, clear: [dette_aristide]}
      - label: "Pas à la barre"
        reponse: "Il retourne le sablier, une seule fois, et attend qu'il soit vide sans parler. Puis il te raccompagne jusqu'aux lauriers."
        effets: {relation: {aristide: -2}, clear: [dette_aristide]}

  # ─────────────────────────────────────────────── Constance, le cabinet Verdier
  - id: vi.sc.constance_carton
    titre: "Le deuxième carton"
    lieu: cabinet_verdier
    tranches: [aprem]
    qui: constance
    si: "relation.constance >= 2 && annee >= 2016"
    texte: "À la cave, Constance a ouvert le deuxième carton du Racing : une lettre de son père à un président, jamais envoyée. Il refusait d'antidater un contrat. « Je la publie, ou je la recolle ? »"
    choix:
      - label: "Publie-la"
        reponse: "L'Écho la publie un dimanche, en fac-similé. En ville, on cherche quel président ; deux veuves écrivent au journal pour défendre leur mari. Les deux ont tort."
        effets: {relation: {constance: 1}, jauges: {tribunes: 1, direction: -1}}
      - label: "Recolle-la"
        reponse: "Elle la remet dans son enveloppe et la referme avec un ruban adhésif neuf, qui jaunira moins vite. « Mon père aurait fait pareil. C'est ce qui m'agace. »"
        effets: {jauges: {direction: 1}}

  - id: vi.sc.constance_franchise
    titre: "Le client de Rive Capital"
    lieu: cabinet_verdier
    tranches: [matin]
    qui: constance
    si: "relation.constance >= 1 && annee >= 2037"
    texte: "Constance montre un courrier à en-tête de Rive Capital : on lui confie les contrats de franchise de la région, à un tarif que son père n'a jamais vu. « Je prends le client ? Dis-moi non. »"
    choix:
      - label: "Non. Refuse-le"
        reponse: "Elle déchire le courrier en quatre et jette les morceaux dans la corbeille, sous le sablier qu'elle n'a toujours pas retourné. « Merci. Il me fallait quelqu'un pour le dire. »"
        effets: {relation: {constance: 1}, jauges: {direction: -1}}
      - label: "Prends-le"
        reponse: "Elle signe le soir même. Au printemps, ton nom figure sur une liste qu'elle a dû relire. Elle ne t'en parle pas ; elle te facture la minute."
        effets: {relation: {constance: -1}, jauges: {direction: 1}}

  - id: vi.sc.constance_dette
    titre: "La poignée de main"
    lieu: parvis
    tranches: [midi]
    qui: constance
    si: "flag(dette_constance) && annee >= 2016"
    texte: "Sur le parvis, Constance attend près de la sculpture rouge : « Un fonds client du cabinet veut une photo de toi ici, demain midi : une poignée de main pour son rapport. Tu me dois trois semaines. »"
    choix:
      - label: "Une poignée de main"
        reponse: "Le photographe en prend quarante. Celle qu'on garde te montre en train de sourire à un homme dont tu ne sais rien. Elle paraît en couverture, sur papier glacé."
        effets: {jauges: {tribunes: -2, direction: 1}, clear: [dette_constance]}
      - label: "Pas de photo"
        reponse: "Elle hoche la tête, compose un numéro et annule. « Je trouverai autre chose à leur vendre. Pas toi. » Désormais, le cabinet te facture la minute."
        effets: {relation: {constance: -2}, clear: [dette_constance]}

  # ─────────────────────────────────────────────── Lazare, la Table des Hauts
  - id: vi.sc.lazare_ascenseur
    titre: "Trente et une secondes"
    lieu: table_hauts
    tranches: [soir]
    qui: lazare
    si: "relation.lazare >= 1 && annee <= 2018"
    texte: "L'ascenseur panoramique s'arrête entre deux étages, dans le noir. Avec toi, Lazare, et un adjoint au maire qui serre un dossier. « Quarante minutes, d'habitude », dit Lazare. Personne ne parle."
    choix:
      - label: "Je fais parler l'adjoint"
        reponse: "Au bout de vingt minutes, il parle : le stade, un terrain, une révision. Quand la cabine repart, il te regarde comme quelqu'un qui en a trop dit. Lazare a tout entendu."
        effets: {relation: {lazare: -1}, jauges: {direction: 1, tribunes: 1}}
      - label: "J'attends en silence"
        reponse: "Quarante minutes de ville éclairée, sans un mot. En sortant, Lazare te tient la porte un peu plus longtemps qu'aux autres, et le dessert ne paraît pas sur l'addition."
        effets: {relation: {lazare: 1}}

  - id: vi.sc.lazare_carbone
    titre: "Le carbone de la table sept"
    lieu: table_hauts
    tranches: [midi]
    qui: lazare
    si: "relation.lazare >= 2 && annee <= 2018"
    texte: "Sous la table sept, Lazare a trouvé le carbone d'un chèque : un promoteur, à l'ordre d'un adjoint au maire, le jour d'un vote sur le stade. Il le tient du bout des doigts : « Vous le voulez ? »"
    choix:
      - label: "Je le porte à L'Écho"
        reponse: "L'Écho le publie le jeudi, la somme floutée, le nom non. L'adjoint démissionne le lundi. Le promoteur déjeune ailleurs, et la mairie te regarde de travers."
        effets: {jauges: {tribunes: 1, direction: -2}}
      - label: "Jetez-le, Lazare"
        reponse: "Il le brûle dans le cendrier de la terrasse, sans hâte. « Je l'aurais jeté de toute façon. Je voulais savoir ce que vous en feriez. »"
        effets: {relation: {lazare: 1}}

  # ─────────────────────────────────────────────── Romane, la Table des Hauts
  - id: vi.sc.romane_caution
    titre: "Le bail de la Table"
    lieu: table_hauts
    tranches: [midi]
    qui: romane
    si: "relation.romane >= 2 && annee >= 2025"
    texte: "Le bail de la Table est à vendre. Romane veut le reprendre avec les deux chefs ; la banque demande une caution, un nom que la ville connaît. Elle pose le formulaire à côté de ton verre."
    choix:
      - label: "Je me porte caution"
        reponse: "Tu signes en bas, à l'encre de la maison. La banque accepte le lendemain. Le nom de Romane arrive sur la porte vitrée, en lettres dorées, sous celui de l'ascenseur."
        effets: {relation: {romane: 1}, jauges: {direction: -1}}
      - label: "Pas de caution"
        reponse: "Elle range le formulaire sous le plan de table. Un groupe hôtelier rachète le bail. Romane reste maître d'hôtel, salariée, et te sert sans un mot de trop."
        effets: {relation: {romane: -1}}

  - id: vi.sc.romane_table_quatre
    titre: "La table quatre"
    lieu: table_hauts
    tranches: [soir]
    qui: romane
    si: "relation.romane >= 1 && annee >= 2019"
    texte: "Romane désigne la terrasse d'un mouvement de tête : un agent, deux verres de trop, raconte tout haut qu'il « a » un joueur de chez toi pour l'été. Elle a placé ta table juste derrière la sienne."
    choix:
      - label: "J'écoute jusqu'au bout"
        reponse: "Il donne le nom, le club, le chiffre, et l'heure du rendez-vous. Au dessert, tu en sais plus que lui sur son propre transfert."
        effets: {jauges: {vestiaire: 1, direction: 1}}
      - label: "Je pars avant le dessert"
        reponse: "Tu laisses ta serviette pliée sur la table. Romane la ramasse, et dit à l'agent que la table derrière lui était vide depuis le début."
        effets: {relation: {romane: 1}}

  # ─────────────────────────────────────────────── Raoul, le parvis
  - id: vi.sc.raoul_nacelle
    titre: "La nacelle de travers"
    lieu: parvis
    tranches: [aprem]
    qui: raoul
    si: "relation.raoul >= 1 && annee <= 2019"
    texte: "Le vigile de Dalmène tend sa radio : Raoul, coincé au vingtième, la nacelle de travers dans le vent. « Les pompiers, dans une heure. Par l'intérieur, on peut lui passer une corde. Tu montes ? »"
    choix:
      - label: "Je monte avec le vigile"
        reponse: "Au vingtième, vous ouvrez une fenêtre qui ne s'ouvre jamais. Raoul attrape la corde, rit, et ne la lâche plus. Le lendemain, tout le parvis le sait."
        effets: {relation: {raoul: 1}, jauges: {tribunes: 1}}
      - label: "J'attends les pompiers"
        reponse: "Ils arrivent en cinquante minutes. Raoul descend gelé, les doigts bleus, et ne dit rien. Le lendemain, il mange son sandwich à l'autre bout du banc."
        effets: {relation: {raoul: -1}}

  - id: vi.sc.raoul_corbeille
    titre: "La corbeille du dix-huitième"
    lieu: parvis
    tranches: [midi]
    qui: raoul
    si: "relation.raoul >= 2 && annee <= 2008"
    texte: "Raoul sort une photo d'appareil jetable : au dix-huitième de la tour Valdorne, chez le comptable du Racing, un homme brûle des dossiers dans une corbeille, la nuit. « Je la donne à qui ? »"
    choix:
      - label: "À la police"
        reponse: "La police financière perquisitionne le cabinet comptable la semaine suivante. On parle du Racing dans tous les journaux, et pas en page des sports."
        effets: {relation: {raoul: 1}, jauges: {direction: -2, tribunes: 1}}
      - label: "À moi"
        reponse: "Tu la ranges dans ton portefeuille, derrière une photo plus ancienne. Elle ne sert à rien tant qu'elle reste là. C'est ce qui la rend précieuse."
        effets: {jauges: {direction: 1}}

  # ─────────────────────────────────────────────── Karine, le parvis
  - id: vi.sc.karine_sculpture
    titre: "Le gamin de la sculpture"
    lieu: parvis
    tranches: [aprem]
    qui: karine
    si: "relation.karine >= 1 && annee >= 2020"
    texte: "Un gamin a grimpé sur l'arche de la sculpture rouge et n'ose plus redescendre. Karine déroule une corde à tes pieds : « Tiens-la. Ne la lâche pas, même si je crie. »"
    choix:
      - label: "Je tiens la corde"
        reponse: "Elle monte en quatre gestes et redescend avec le gamin sur le dos. Le père arrive en courant, une écharpe de la Nord autour du cou. Il te reconnaît."
        effets: {relation: {karine: 1}, jauges: {tribunes: 1}}
      - label: "J'appelle le vigile"
        reponse: "Le vigile arrive avec un escabeau trop court. Karine monte seule, sans assurance, et redescend avec le gamin. Elle ne reproche rien. Elle ne sert plus de café."
        effets: {relation: {karine: -1}}

  - id: vi.sc.karine_drones
    titre: "Les drones de Dalmène"
    roles: [entraineur, joueur, ds, president]
    lieu: parvis
    tranches: [matin]
    qui: karine
    si: "relation.karine >= 2 && annee >= 2040"
    texte: "Dalmène remplace Karine par des drones au premier du mois. Elle range ses cordes dans la camionnette, à côté du harnais de son père. « Il reste la verrière de ta tribune. Personne ne la lave. »"
    choix:
      - label: "Je te fais embaucher"
        reponse: "Le club la prend à l'essai pour la verrière de la tribune. Le samedi, on la voit pendue au-dessus du virage, et le virage la salue au coup d'envoi."
        effets: {relation: {karine: 1}, jauges: {caisse: -1, tribunes: 1}}
      - label: "Les drones, c'est l'époque"
        reponse: "Elle ferme le coffre de la camionnette sans claquer. « L'époque, elle ne dit pas bonjour. » Elle part travailler à Valdorne, où il reste de vieilles tours."
        effets: {relation: {karine: -1}}

  - id: vi.sc.karine_dette
    titre: "La plainte de l'Écran"
    lieu: parvis
    tranches: [matin]
    qui: karine
    si: "flag(dette_karine) && annee >= 2020"
    texte: "Karine t'attend sur le banc du bassin, une convocation à la main : « L'Écran porte plainte pour la banderole. Ils veulent un nom. Le mien, ou celui de quelqu'un qui paie l'amende. »"
    choix:
      - label: "Je paie l'amende"
        francs: -600
        reponse: "Tu paies au guichet de la tour, en écrivant ton nom en capitales. Le lendemain, au Corner, on se montre la quittance comme une relique."
        effets: {jauges: {tribunes: 1}, clear: [dette_karine]}
      - label: "Ce n'est pas mon nom"
        reponse: "Elle plie la convocation dans la poche du harnais de son père. Le mois suivant, elle perd le contrat de l'Écran. Elle ne te demande plus jamais rien."
        effets: {relation: {karine: -2}, clear: [dette_karine]}

  # ─────────────────────────────────────────────── Le quartier, sans personne de connu
  - id: vi.sc.hauts_cour
    titre: "Une signature dans la cour"
    roles: [entraineur, joueur, ds, president]
    lieu: hotel_imperial
    tranches: [aprem]
    qui: passant
    si: "saison >= 2"
    texte: "Dans la cour de l'Impérial, des photographes attendent au bord du tapis rouge. Un des tiens sort par la porte à tambour avec un agent, un stylo encore à la main. Il ne t'a pas vu."
    choix:
      - label: "Je les rejoins"
        reponse: "L'agent sourit trop vite. Le joueur bafouille un nom de club, puis se tait. Les photographes ont leur photo : toi, entre eux deux, sans sourire."
        effets: {jauges: {vestiaire: 1, direction: -1}}
      - label: "Je reste à l'écart"
        reponse: "Ils posent sans toi. Le lendemain, la photo est dans L'Écho : le joueur, l'agent, et la porte à tambour, floue, qui tourne encore."
        effets: {jauges: {vestiaire: -1}}

  - id: vi.sc.hauts_tentes
    titre: "La fête de l'assureur"
    lieu: parvis
    tranches: [soir]
    qui: passante
    si: "saison >= 2"
    texte: "Sur le parvis, Dalmène a monté trois tentes blanches pour ses clients. Une hôtesse tend un badge à ton nom, déjà imprimé : « On vous attendait. Les joueurs aussi sont invités, vous savez. »"
    choix:
      - label: "Je reste une heure"
        reponse: "Une heure à serrer des mains au champagne tiède. Derrière les barrières, des gars du virage regardent les tentes, les mains dans les poches, sans rien dire."
        effets: {jauges: {caisse: 1, tribunes: -1}}
      - label: "Je repars par la galerie"
        reponse: "Tu rends le badge. L'hôtesse le jette dans une corbeille pleine de badges à des noms connus. Le lendemain, le service du partenariat appelle, sans dire pourquoi."
        effets: {jauges: {caisse: -1}}

  - id: vi.sc.hauts_fauteuil
    titre: "Le fauteuil du dimanche"
    lieu: tour_ecran
    tranches: [soir]
    jours: [dim]
    qui: passant
    si: "saison >= 2 && serie_d >= 2"
    texte: "Dans le hall de la tour Écran, un assistant en casque barre le chemin : « Le plateau du dimanche vous garde un fauteuil, ce soir. Le consultant a préparé des images. Vous montez ? »"
    choix:
      - label: "Je monte"
        reponse: "Tu réponds à trois questions sur quatre. La quatrième, tu la laisses passer ; c'est celle qu'on rediffuse le lendemain, en boucle, entre deux bulletins."
        effets: {jauges: {tribunes: 1, direction: -1}}
      - label: "Pas ce soir"
        reponse: "L'assistant pose ta photo sur le fauteuil, et le présentateur pose ses questions à la photo. Le consultant rit, seul. Le lundi, on ne parle que de la photo."
        effets: {jauges: {tribunes: -1, direction: 1}}

  - id: vi.sc.hauts_grue
    titre: "La grue arrêtée"
    lieu: parvis
    tranches: [matin]
    qui: passant
    si: "saison >= 2 && annee >= 2008 && annee <= 2010"
    texte: "Au pied de la grue immobile de la phase trois, des ouvriers attendent leur paie depuis six semaines. L'un d'eux te reconnaît : « Vous qui passez à la télé, dites-leur qu'on existe. »"
    choix:
      - label: "Je paie le café du chantier"
        francs: -100
        reponse: "Vingt cafés au kiosque du boulevard, dans des gobelets qui brûlent les doigts. Le lendemain, un ouvrier porte une écharpe du Racing nouée sur son casque."
        effets: {jauges: {tribunes: 1}}
      - label: "Je n'ai rien à dire"
        reponse: "Il remet son casque sans répondre. Sur la palissade, sous l'affiche des bureaux à louer, quelqu'un a déjà écrit au feutre : « Et nous ? »"
        effets: {jauges: {tribunes: -1}}

  - id: vi.sc.hauts_greve
    titre: "La grève de l'Écran"
    lieu: tour_ecran
    tranches: [aprem]
    qui: passant
    si: "saison >= 2 && flag(monde_mediacrash) && annee <= 2008"
    texte: "Devant la tour Écran, les techniciens bloquent le car-régie avec des palettes : depuis que les droits ont changé de main, la moitié d'entre eux est en sursis. Ils tendent un badge de grève."
    choix:
      - label: "J'épingle le badge"
        reponse: "Samedi, la caméra te trouve au bord de la pelouse, le badge au revers. La régie ne coupe pas. Le lundi, on te demande depuis quand tu fais de la politique."
        effets: {jauges: {tribunes: 1, direction: -1}}
      - label: "Le match passera"
        reponse: "Ils rangent leurs palettes en silence. Samedi, le match passe, filmé par une équipe venue de la capitale qui ne connaît le nom d'aucun joueur."
        effets: {jauges: {direction: 1, tribunes: -1}}

# ═══════════════════════════════════════════════════════════════ LES PAROLES
# Ce que disent les anonymes qu'on croise dans les Hauts (`lieu == …` : devant ce lieu-là),
# et ce que la ville dit de qui y passe trop de temps (`rep_luxe`, `rep_travail`).
# Aucun accord sur le héros ; la nuit, seuls passants et passantes parlent.
paroles:
  - qui: passant
    sujet: quartier
    si: "lieu == parvis"
    texte: "Sur le parvis, le vent emporte les dossiers des gens pressés. Les vigiles ramassent ce qui tombe, et ils lisent avant de rendre."
  - qui: enfant
    sujet: quartier
    si: "lieu == parvis"
    texte: "Les jets d'eau du bassin s'arrêtent quand on court devant. Mon frère dit que c'est la tour qui nous regarde."
  - qui: ancien
    sujet: epoque
    si: "lieu == parvis && annee <= 2005"
    texte: "Avant les tours, ici, c'étaient les jardins ouvriers de la Tréfilerie. Mon père y faisait ses poireaux. Le bassin est juste à l'endroit des poireaux."
  - qui: ancien
    sujet: sponsor
    si: "lieu == parvis && annee >= 2024"
    texte: "En 1990, un sponsor, c'était un nom sur un maillot. Aujourd'hui, c'est un nom sur la tour, le stade, le pain du dimanche. Le club garde le sien, pour l'instant."
  - qui: passante
    sujet: argent
    si: "lieu == galerie_hauts"
    texte: "Une montre de la galerie, c'est une année de mon loyer. Je viens quand même le samedi, regarder ceux qui ne regardent pas les prix."
  - qui: passant
    sujet: rumeur
    si: "lieu == hotel_imperial"
    texte: "À l'Impérial, ils tiendraient un registre de qui dort avec qui. La direction dit que non. Le concierge ne dit rien ; il sourit."
  - qui: fan
    sujet: sponsor
    si: "lieu == tour_dalmene && tribunes < 40"
    texte: "Au virage, on a écrit à l'assureur pour qu'il retire son nom du maillot jusqu'à la fin de la série. Ils ont répondu que leur nom, lui, ne perdait jamais."
  - qui: passant
    sujet: epoque
    si: "lieu == tour_ecran && annee >= 2024"
    texte: "À l'Écran, la moitié des cameramen sont partis. Les caméras suivent le ballon toutes seules, maintenant. Plus personne ne suit les gens."
  - qui: passante
    sujet: toi
    si: "flag(rep_luxe)"
    texte: "On vous voit plus souvent à la galerie des Hauts qu'au marché. Ma voisine compte vos sacs. Elle n'a pas fini de compter."
  - qui: passant
    sujet: toi
    si: "flag(rep_travail) && lieu == parvis"
    texte: "Le vigile de l'Écran dit que vous passez vos soirées dans les Hauts plus souvent que chez vous. Il le dit comme un compliment. Il fait des nuits, lui aussi."

# ═══════════════════════════════════════════════════════════════ OÙ ILS T'ATTENDENT
# Une carte dont ils sont le locuteur (leurs paliers : cards/common/paliers_ville_hauts.yaml)
# se joue à leur lieu : les Hauts n'ont pas de lieu moteur (`lieu:` d'une carte), la table
# les y conduit. Les heures du lieu s'appliquent au rendez-vous (ville.js, `planifier`).
rencontres:
  ghislaine: tour_ecran
  malo: tour_ecran
  hugues: tour_dalmene
  apolline: tour_dalmene
  anselme: hotel_imperial
  nadir: hotel_imperial
  hortense: galerie_hauts
  aurele: galerie_hauts
  aristide: cabinet_verdier
  constance: cabinet_verdier
  lazare: table_hauts
  romane: table_hauts
  raoul: parvis
  karine: parvis
