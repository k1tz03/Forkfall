# LE GRAND AUBÉRIVE — lot « tilleuls » : la vie des Tilleuls, la cité de l'ouest
# (docs/histoires/grand_auberive.md ; docs/histoires/ville_vivante.md, le format : § 8).
#
# Des barres et des tours de 1964 (la barre A et sa fresque, la tour B de brique, la tour C et
# son grand C jaune, la tour D, les barres E1, E2, E3, le plot F), la place et sa fontaine
# sèche, le petit centre commercial (le salon, la supérette, le snack, une cellule vide), le
# club de boxe dans l'ancien gymnase, le city-stade grillagé, les jardins ouvriers, la voie
# ferrée, la Rive sous la passerelle taguée. Le quartier s'ouvre à la 4ᵉ semaine, ou plus tôt
# par le drapeau `quartier_tilleuls` ; la coquille ne programme rien à un lieu fermé, et les
# scènes d'ici ne portent pas de garde `semaine`.
#
# Sept lieux, deux visages chacun, l'un après l'autre, sans trou ni chevauchement :
#
#   city_stade       le city-stade     Rachid Haddouche   1990-2009  vestiaire  (le grand frère)
#                                      Telma Cazal        2010-2050  vestiaire  (sa gamine du grillage)
#   maison_quartier  la maison         Germaine Kobiela   1990-2011  familles
#                                      Nawel Assous       2012-2050  mairie     (une gamine de Germaine)
#   snack_tilleuls   le snack          Hagop Kassabian    1990-2015  rue
#                                      Aram Kassabian     2016-2050  milieu     (son fils)
#   superette        la supérette      Zohra Mezrag       1990-2010  argent     (le cahier, depuis 1971)
#                                      Nordine Mezrag     2011-2050  argent     (son fils)
#   club_boxe        le club de boxe   Stan Kowal         1990-2013  milieu
#                                      Mélissa Kowal      2014-2050  sante      (sa petite-fille)
#   salon_tilleuls   le salon          Aldo Scarpelli     1990-2017  rue        (le mur des signatures)
#                                      Bilal Chergui      2018-2050  presse     (son apprenti)
#   tour_c           la tour C         Marthe Degroote    1990-2008  tribunes   (la gardienne)
#                                      Issa Tchibozo      2009-2050  familles   (le gardien d'après)
#
# Ce que le quartier tient d'une époque à l'autre : la Tréfilerie qui ferme (Noël 1990, ce que
# La Sirène laisse au monde : on n'en parle qu'à partir de 1994), le bitume du terrain grillagé
# changé en synthétique en 1999, la barre E2 dynamitée en 2013, la tour C rénovée en
# 2014 ; le neuvième de la tour C, sans nom à la sonnette depuis mars 1975 (l'appartement du
# capitaine de la finale de 1974), puis, à partir de 2014, au nom des Tazi relogés de la barre
# E2 (le maçon de l'escalier nord, dans Les Deux Téléphones) ; la photo de Slimane, champion des
# moyens en 1978, au mur du club de boxe ; le mur des signatures du salon.
#
# Ce que les livres trouvent ici (des tuyaux à leur heure, et une seule voix sur le compte des
# indices de 23 h 58) : Didier Vallin au grillage la nuit et le chien de la loge (3), le chauffeur
# du car au bout de la friche et la berline qui roule la nuit (2), la boîte de Steph et le papier
# de 1986 (3), le coiffeur du 13 mai (4), les masques de la tour C et la clé verte du neuvième
# (1), la bâche des gamins (5), le garçon poli qui note le prix des gamins (6, h6_indices),
# le contrat du petit Rancé (6), les sachets du parking de l'hôtel (7), Kerdal à deux heures
# et Milo au grillage (8), le Dôme (9), Tazi, Nino et la troisième tranche (10).
#
# Les activités qu'on fait avec quelqu'un portent la borne d'année de son époque. Les textes
# n'accordent rien au personnage joué ; les objets datés ont leur année ; les gens de la ville
# n'ont pas d'`adresse` (pas de {toi}).
gens:

  # ═══════════════════════════════════════════════════════════ LE CITY-STADE (city_stade)

  # Rachid Haddouche, vingt-cinq ans en 1990, tour A. Le meilleur du grillage en 1981 : un
  # recruteur du Racing est venu deux fois, la seconde ils ont perdu cinq à zéro sur le bitume,
  # il n'est jamais revenu. Gardien du portail de la Tréfilerie jusqu'à la fermeture des halles
  # (1984), puis veilleur au dépôt des bus. Il a la clé du cadenas du grillage et un cahier : les noms des
  # gamins, l'année, le pied, et dans la marge ceux qui sont venus les regarder. En 2009, la
  # mairie donne le terrain à une éducatrice diplômée : la petite Cazal, une de ses gamines.
  - id: haddouche
    name: "Rachid Haddouche"
    label: "LE GRAND FRÈRE DU GRILLAGE"
    genre: m
    portrait: {teint: olive, corpulence: fin, age: jeune, coiffure: court, cheveux: noir, pilosite: rase, lunettes: aucune, tenue: survetement, couleur: marine, couleur2: blanc, accessoire: carnet}
    lieu: city_stade
    tranches: [aprem, soir]
    annees: [1990, 2009]
    reseau: vestiaire
    trace: "Rachid a écrit ton nom tout en bas de son cahier, sous ceux des gamins, sans année de naissance."
    paliers: ["te fait signe par-dessus le grillage", "te confie son chronomètre fêlé", "t'ouvrirait le cadenas à minuit"]
    froid: ["te tourne le dos au grillage", "rappelle les gamins quand tu arrives", "ferme le cadenas en te voyant"]
    activites: [til_stade_tirs_rachid]
    on_relation: {3: vi.haddouche.marge, -3: vi.haddouche.cadenas}
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Le grand de la tour B est rentré de sa sélection le sac encore fermé. Il n'a rien raconté aux gamins, ni l'hôtel ni le car. D'habitude, il raconte tout. Ton groupe s'est tu."}
        - {si: "role == ds", texte: "L'intendant de ton club habite la tour B. Il ne descend plus au grillage le soir ; il dit qu'au club on ne se parle plus qu'en se passant les sacs de maillots."}
        - {si: "role == president", texte: "Les femmes de ménage du stade habitent la barre E. Elles passent devant le grillage la tête basse, sans s'arrêter. Quand elles ne parlent plus du travail, le travail va mal."}
        - "Les deux gamins d'ici qui sont chez toi viennent encore le soir. Ils ne jouent plus : ils s'assoient sur le banc et regardent leurs chaussures. Ton vestiaire leur pèse sur les épaules."
      moyen:
        - {si: "role == selectionneur", texte: "Le grand de la tour B dit que la sélection, c'est un car de nuit : on dort, on se réveille ailleurs, personne ne parle avant le café. Il ne se plaint pas. Il attend."}
        - {si: "role == ds", texte: "L'intendant passe au grillage le vendredi, comme avant. Il dit qu'au club on fait ses heures et on rentre. Ni fête ni dispute : un club de semaine."}
        - {si: "role == president", texte: "Les femmes de ménage du stade s'arrêtent cinq minutes au grillage, à six heures. Elles parlent de leurs enfants, pas du club. Le club ne leur fait ni peur ni plaisir."}
        - "Les deux gamins d'ici qui sont chez toi jouent avec les autres le soir, sans parler du club, ni en bien ni en mal. Ils attendent de voir à qui ressembler."
      haut:
        - {si: "role == selectionneur", texte: "Le grand de la tour B a rapporté de sa sélection un maillot signé par tout le groupe, pour les gamins. Il dit qu'ils chantaient dans le car. Il n'en revenait pas."}
        - {si: "role == ds", texte: "L'intendant a déposé au grillage un filet de ballons du club, sans rien demander. Il dit que le soir, au club, plus personne ne regarde sa montre."}
        - {si: "role == president", texte: "Les femmes de ménage du stade ont apporté des gâteaux au grillage, samedi. Au club, on a fêté quelque chose. Elles n'ont pas dit quoi ; elles ont dit ton nom deux fois."}
        - "Le petit d'ici qui est chez toi est venu au grillage en survêtement du club, et il a refusé de l'enlever pour jouer. Les autres se battaient pour toucher l'écusson."
    repliques:
      - {lien: 0, texte: "Ici, on joue jusqu'à ce que la lumière s'éteigne. La mairie l'éteint à dix heures. Moi, à neuf : à dix heures, il y a d'autres gens sur le banc."}
      - {lien: 0, si: "annee < 1999", texte: "Le bitume a mangé trois genoux cet hiver. La mairie promet une pelouse depuis 1985. Le dimanche, je bouche les trous avec du sable de chantier."}
      - {lien: 0, si: "tranche == soir", texte: "Onze gamins, douze chasubles dans le sac. La douzième, c'est pour celui qui arrive en retard. Il y en a toujours un, et c'est rarement le même."}
      - {lien: 0, si: "serie_d >= 2", texte: "Les gamins rejouent tes défaites sur le grillage, en mieux. Ils ont refait celle de samedi trois fois. La troisième, vous gagniez."}
      - {lien: 1, texte: "Le cahier : le nom, l'année, le pied. Dans la marge, ceux qui sont venus les regarder. Depuis 1985, la marge est plus remplie que les pages."}
      - {lien: 1, si: "annee >= 1999", texte: "Le synthétique, ils l'ont posé en mai. Le premier soir, les gamins ont joué pieds nus pour le sentir. Le lendemain, ils avaient tous des brûlures sous les orteils."}
      - {lien: 1, si: "flag(histoire_h1) && flag(h1_masques_tifo)", texte: "Les gamins jouent avec ta tête en carton sur la figure. Ils se battent pour savoir qui sera toi. Celui qui gagne n'a plus le droit de tirer les penaltys."}
      - {lien: 2, texte: "En 1981, un recruteur du Racing est venu deux fois. La deuxième, on a perdu cinq à zéro sur le bitume. Il n'est jamais revenu. Moi, je ne perds plus devant personne."}
      - {lien: 2, si: "annee <= 1999", texte: "Je fais les nuits au dépôt des bus. Avant, je gardais le portail de la Tréfilerie, jusqu'à la fermeture des halles. Je dors de six heures à midi. Le grillage, c'est mon après-midi."}
      - {lien: 3, texte: "La clé du cadenas, j'en ai deux. L'autre, c'est pour le jour où je ne serai plus là. Je ne sais pas encore à qui la donner. Je regarde."}
      - {lien: -1, texte: "Les gamins jouent. Les adultes regardent de l'autre côté du grillage, comme tout le monde."}
      - {lien: -2, texte: "Je ne te présente plus aux parents. Ils demandent qui tu es ; je dis que je ne sais pas."}
      - {lien: -3, texte: "Le cadenas est fermé. Il le restera tant que tu seras sur ce trottoir."}
    tuyaux:
      - id: haddouche_grand_maigre
        si: "flag(histoire_h3) && saison >= 2 && !flag(h3_halle_vue)"
        texte: "« La nuit, un grand maigre vient taper contre le grillage, lumière éteinte. Il connaît les rebonds par cœur. Quand je lui dis bonsoir, il repart vers la grande halle. »"
      - id: haddouche_chien
        lien: 1
        si: "flag(histoire_h3) && flag(h3_halle_vue) && !flag(h3_cle_sirene)"
        texte: "« Le chien de la loge de l'usine, je l'ai eu tout petit, quand je gardais le portail. Le liquidateur l'a gardé avec le reste. Il s'appelle Pilote. Dis son nom tout bas : il ne bougera pas. »"
      - id: haddouche_doudoune
        si: "flag(histoire_h6) && saison >= 2 && annee <= 2006"
        texte: "« Le vieux recruteur à la doudoune vient au grillage le samedi, avec un garçon poli qui tape tout ce qu'il dit sur un petit ordinateur. Le vieux regarde les gamins. Le garçon regarde le vieux. »"
      - id: haddouche_tickets
        si: "annee <= 2009 && vestiaire < 45 && role != selectionneur"
        texte: "« Le petit de la tour A qui est chez toi en réserve ne mange plus le midi. Son père a perdu sa place ; il garde ses tickets pour ses sœurs. Il court moins vite à quatre heures qu'à dix. »"
        effets: {jauges: {vestiaire: 2}}
      - id: haddouche_valdorne
        si: "annee >= 1995 && annee <= 2009 && role != selectionneur"
        texte: "« Une voiture de Valdorne tourne autour du grillage depuis lundi. L'homme demande aux gamins le nom du petit ailier de la tour B, celui qui est chez toi. Il a une enveloppe pour le père. »"
        effets: {jauges: {vestiaire: 2}}
    service:
      lien: 3
      label: "Le gamin du cahier"
      si: "role != joueur && role != selectionneur"
      texte: "Rachid ouvre le cahier à une page cornée : quatorze ans, gaucher, tour B. « Je ne l'ai montré à personne. Tu le prends à l'essai. C'est moi qui l'amène, et c'est moi qui parle à sa mère. »"
      effets: {jauges: {vestiaire: 2, tribunes: 1}}
      dette: true

  # Telma Cazal, née en 1984 à la tour A ; la seule fille du grillage en 1992 (Rachid l'appelait
  # Cazal, comme un garçon, et tout le monde a suivi) ; cinq saisons à la section féminine du
  # Racing ; éducatrice sportive de la mairie, diplômée, et le terrain avec, à partir de 2010.
  - id: cazal
    name: "Telma Cazal"
    label: "L'ÉDUCATRICE DU CITY-STADE"
    genre: f
    portrait: {teint: clair, corpulence: fin, age: jeune, coiffure: queue, cheveux: brun, pilosite: rase, lunettes: aucune, tenue: survetement, couleur: bouteille, couleur2: blanc, accessoire: sifflet}
    lieu: city_stade
    tranches: [aprem, soir]
    annees: [2010, 2050]
    reseau: vestiaire
    trace: "Cazal a ajouté ton nom sur la feuille du mercredi, à la ligne des bénévoles, au feutre qui ne s'efface pas."
    paliers: ["te renvoie le ballon par-dessus le grillage", "te confie le groupe du mercredi", "fermerait le grillage aux recruteurs pour toi"]
    froid: ["te demande ce que tu viens faire ici", "fait rentrer les gamins quand tu arrives", "ne te laisse plus approcher du grillage"]
    activites: [til_stade_mercredi]
    on_relation: {3: vi.cazal.liste, -3: vi.cazal.grillage}
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Le grand de la tour D, chez les Cobalts, est rentré de sa fenêtre sans un mot. Il a joué avec mes moins de douze ans jusqu'à la nuit, sans sourire. Ton groupe, il refuse d'en parler."}
        - {si: "role == ds", texte: "Le préparateur de ton club, celui de la tour A, a demandé à la mairie un poste d'éducateur. On ne quitte pas un club pro pour mes quarante gamins quand on y est bien."}
        - {si: "role == president", texte: "Les jardiniers du stade habitent ici. Ils m'ont demandé si la mairie embauchait. On ne demande pas ça quand on est bien chez soi. Ton club leur a fait quelque chose."}
        - "Tes deux jeunes d'ici viennent encore le mercredi. Ils m'ont demandé s'il restait de la place dans mon groupe des grands. Ils ont dix-neuf ans ; ils ne veulent plus aller chez toi, ils veulent jouer."
      moyen:
        - {si: "role == selectionneur", texte: "Le grand de la tour D dit que chez les Cobalts on mange en silence, mais tous à la même table. Il ne se plaint pas, il ne rêve pas. Ton groupe attend le prochain match pour savoir."}
        - {si: "role == ds", texte: "Le préparateur de la tour A passe le mercredi. Il dit que ton staff fait ses heures, sans plus. Personne ne part, personne ne reste tard."}
        - {si: "role == president", texte: "Les jardiniers du stade rentrent par le city-stade et regardent un peu jouer. Ils ne parlent pas du club. Ce n'est ni bon ni mauvais signe : c'est un club qui paie."}
        - "Tes jeunes d'ici passent le mercredi, jouent une demi-heure et repartent à ton entraînement en courant. Ils ne disent rien du vestiaire. C'est qu'il tient."
      haut:
        - {si: "role == selectionneur", texte: "Le grand de la tour D a laissé son maillot des Cobalts au portemanteau de la maison de quartier une semaine, pour que les gamins le touchent. Il dit que dans le groupe, on rit."}
        - {si: "role == ds", texte: "Le préparateur de la tour A m'a apporté des plots et des chasubles du club, en trop, il a dit. Rien n'est en trop dans un club qui va mal. Ton staff est content."}
        - {si: "role == president", texte: "Les jardiniers du stade ont tondu mon city-stade à la main, samedi. Le synthétique ne pousse pas. Ils voulaient faire quelque chose de leurs mains : ils sont fiers de ton club."}
        - "Tes deux jeunes d'ici m'ont demandé de venir voir leur entraînement chez toi. Ils voulaient me montrer comment ils se passent le ballon entre eux. Ça leur plaît, là-bas."
    repliques:
      - {lien: 0, texte: "Le mercredi, quarante gamins et un ballon pour cinq. Le samedi matin, le tournoi. Le dimanche, je dors. Si vous voulez aider, c'est le mercredi, et sans téléphone."}
      - {lien: 0, si: "annee >= 2018", texte: "Les recruteurs filment à travers le grillage avec leur téléphone. Je leur demande une carte. Ils me montrent une application."}
      - {lien: 0, si: "tranche == soir", texte: "La lumière s'éteint à vingt-deux heures, une minuterie. Les grands restent sur le banc, dans le noir, à refaire le match. Je les laisse : c'est là qu'ils apprennent."}
      - {lien: 1, texte: "Rachid m'appelait Cazal, comme les garçons. Les gamins m'appellent pareil. Les mères disent Madame. C'est comme ça qu'on voit qui a peur de moi."}
      - {lien: 1, si: "mission(vi.sc.haddouche_cle)", texte: "La clé du cadenas a toujours son lacet de chaussure. Je ne l'ai pas changé. Rachid me l'a tendue par la vitre de sa voiture, sans couper le moteur."}
      - {lien: 1, si: "flag(histoire_h7) && flag(h7_rance_mort)", texte: "Les gamins ont peint le numéro du petit Rancé sur la bande de bois, côté rue. La mairie l'a fait effacer deux fois. La troisième, personne n'est venu l'effacer."}
      - {lien: 2, texte: "J'ai joué cinq saisons à la section féminine du Racing. On s'entraînait après les garçons, sous un seul projecteur. J'ai appris à contrôler des ballons que je ne voyais pas."}
      - {lien: 2, si: "annee >= 2024", texte: "Le modèle classe les gamins à douze ans, il paraît. J'en ai un qui était nul à douze et bon à quinze. Personne ne vient le filmer : il est sorti des tableaux."}
      - {lien: 2, si: "annee >= 2040", texte: "La loi a fermé l'escalier. Les gamins me demandent à quoi ça sert de jouer, maintenant. Je dis : à jouer. Ils trouvent que c'est une réponse d'adulte."}
      - {lien: 3, texte: "Si un jour un gamin d'ici est chez toi et qu'on veut le vendre à quinze ans, appelle-moi avant de signer. J'ai le numéro de sa mère, et celui de sa grand-mère."}
      - {lien: -1, texte: "Le grillage, c'est pour les gamins. Les adultes regardent depuis le trottoir."}
      - {lien: -2, texte: "Mercredi, c'est complet. Mercredi prochain aussi."}
      - {lien: -3, texte: "Je ne vous laisse pas approcher des gamins. Si vous restez là, j'appelle leurs mères. Elles viendront toutes."}
    tuyaux:
      - id: cazal_milo
        si: "flag(histoire_h8) && !flag(h8_milo_promis)"
        texte: "« Le fils de Nino vient jouer ici le soir, en cachette du centre. Un homme d'Almadis a filmé ses courses à travers le grillage. Le petit l'a vu, et il a ralenti exprès. »"
      - id: cazal_application
        si: "annee >= 2020 && role != selectionneur"
        texte: "« Un agent fait installer aux parents de tes moins de quinze ans une application de suivi, gratuite. Les données partent dans un club de la capitale. Trois familles ont déjà dit oui. »"
        effets: {jauges: {vestiaire: 2}}
      - id: cazal_franchises
        si: "flag(histoire_h10) && annee >= 2039"
        texte: "« Les recruteurs des franchises sont venus au grillage avec des contrats pour des gamins de douze ans : logés, nourris, scolarisés à la capitale. Le petit Brac a reçu le même, en plus épais. »"
    service:
      lien: 3
      label: "Les gamins au stade"
      texte: "Cazal emmène quarante gamins du city-stade au stade, avec des banderoles peintes à la maison de quartier. Ils chantent quatre-vingt-dix minutes, faux, et le virage finit par chanter avec eux."
      effets: {jauges: {tribunes: 3}}

  # ═══════════════════════════════════════════════════ LA MAISON DE QUARTIER (maison_quartier)

  # Germaine Kobiela, cinquante-deux ans en 1990, fille d'un mineur venu du nord pour la
  # Tréfilerie. Animatrice depuis 1968 : les papiers le mardi et le jeudi sur une machine à
  # écrire de 1971, le baby-foot, les dessins de la vitre qu'elle change chaque trimestre, la
  # fresque du pignon de la barre A (1987, avec les gamins), une boîte de fiches bristol où tient
  # tout le quartier.
  - id: kobiela
    name: "Germaine Kobiela"
    label: "L'ANIMATRICE DES TILLEULS"
    genre: f
    portrait: {teint: clair, corpulence: large, age: age, coiffure: boucle, cheveux: gris, pilosite: rase, lunettes: carrees, tenue: pull, couleur: prune, accessoire: stylo}
    lieu: maison_quartier
    tranches: [matin, aprem, soir]
    annees: [1990, 2011]
    reseau: familles
    trace: "Germaine a écrit ton prénom sur une fiche bristol, et l'a rangée dans la boîte, entre deux familles du quartier."
    paliers: ["te dit bonjour par ton prénom", "te fait passer devant la file", "porterait ton dossier jusqu'au guichet"]
    froid: ["te fait prendre un ticket comme tout le monde", "te parle comme à un inconnu", "a déchiré ta fiche bristol"]
    activites: [til_mq_permanence]
    on_relation: {3: vi.kobiela.fiche, -3: vi.kobiela.dechiree}
    repliques:
      - {lien: 0, texte: "Pour les papiers, c'est le mardi et le jeudi. Pour le reste, c'est tous les jours, et ça ne se remplit pas en trois exemplaires."}
      - {lien: 0, si: "tranche == matin", texte: "Le matin, ce sont les mères. Le soir, ce sont les pères, quand ils ont honte d'être venus le matin."}
      - {lien: 0, si: "annee >= 1994", texte: "Depuis la fermeture de la Tréfilerie, la file de la permanence va jusqu'à la fontaine. On me demande des formulaires qu'on n'a pas encore inventés."}
      - {lien: 1, texte: "Au baby-foot, je ne laisse jamais les grands jouer contre les petits. Ce n'est pas pour les petits : c'est pour que les grands apprennent à attendre leur tour."}
      - {lien: 1, texte: "La fresque du pignon de la barre A, c'est nous, en 1987. Le gamin qui frappe le ballon a été peint par onze gamins différents. Ça se voit aux jambes."}
      - {lien: 2, texte: "J'ai fait les papiers de tout le quartier, trois générations. Je connais la date de naissance de gens qui ont oublié la leur. Ça donne des devoirs."}
      - {lien: 2, si: "annee >= 2005", texte: "On ferme la permanence le jeudi : tout se fait sur l'ordinateur, maintenant. J'apprends l'ordinateur pour ceux qui ne l'apprendront jamais."}
      - {lien: 3, texte: "Si un jour quelqu'un des tiens a un problème de papiers, ne passe pas par le club. Viens le mardi avant huit heures. Je connais la dame du guichet depuis l'école."}
      - {lien: -1, texte: "Prenez un ticket. Il y a des gens avant vous, et ils attendent depuis plus longtemps."}
      - {lien: -2, texte: "Je n'ai pas votre dossier. Je n'ai pas de dossier à votre nom. Je n'en ouvrirai pas."}
      - {lien: -3, texte: "J'ai déchiré votre fiche. C'est la première que je déchire depuis 1968. Je n'en suis pas fière, et je ne la recolle pas."}
    tuyaux:
      - id: kobiela_logement
        si: "annee <= 2011 && vestiaire < 45 && role != selectionneur"
        texte: "« La femme d'un des tiens est venue à la permanence demander un logement à son nom seul, avec les deux enfants. Il ne le sait pas encore. Il l'apprendra un samedi, avant le match. »"
        effets: {jauges: {vestiaire: 2}}
      - id: kobiela_contrat_rance
        si: "flag(histoire_h6) && !flag(h6_tibo_vendu) && !flag(h6_tibo_garde)"
        texte: "« La mère du petit Rancé est venue me demander comment on refuse un contrat quand on est mineur. Elle avait le contrat dans son sac. Le père avait déjà signé la page des parents. »"
    service:
      lien: 3
      label: "Le dossier du mardi"
      texte: "Germaine tape trois formulaires sur la machine de 1971, signe là où l'on ne signe jamais et porte le dossier elle-même au guichet, le mardi avant huit heures. Les papiers arrivent lundi."
      effets: {jauges: {vestiaire: 2, direction: 1}}
      dette: true

  # Nawel Assous, née en 1985 au cinquième de la tour C, une gamine de Germaine ; des études de
  # droit à Portclair ; directrice de la maison de quartier à partir de 2012. Elle boit son café
  # le mardi au café de la Mairie, et elle sait ce que le conseil votera le jeudi.
  - id: nawel
    name: "Nawel Assous"
    label: "LA MAISON DE QUARTIER"
    genre: f
    portrait: {teint: dore, corpulence: moyen, age: jeune, coiffure: long, cheveux: noir, pilosite: rase, lunettes: carrees, tenue: veste, couleur: marine, couleur2: creme, accessoire: badge}
    lieu: maison_quartier
    tranches: [matin, midi, aprem, soir]
    annees: [2012, 2050]
    reseau: mairie
    trace: "Nawel a noté ton passage dans le registre de la maison, à la colonne des soutiens, avec l'heure."
    paliers: ["te garde une chaise au fond des réunions", "te dit ce que la mairie votera", "porterait ta voix au conseil municipal"]
    froid: ["te renvoie au secrétariat", "ne t'invite plus aux réunions", "a rayé ton nom de ses soutiens"]
    activites: [til_mq_devoirs, til_mq_demarches]
    on_relation: {3: vi.nawel.ordre_du_jour, -3: vi.nawel.motion}
    repliques:
      - {lien: 0, texte: "Germaine m'a laissé sa boîte de fiches, ou ses cendres, selon qui raconte. Moi, j'ai un tableur. Il connaît moins bien les gens."}
      - {lien: 0, si: "annee == 2012", texte: "La barre E2 tombera en 2013. Quatre-vingt-seize familles à reloger. La mairie m'a donné un plan et un feutre. Le feutre écrit mal."}
      - {lien: 0, si: "annee >= 2022", texte: "Les papiers se font sur le téléphone. Ceux qui n'en ont pas viennent ici et me prêtent le leur pour que je le fasse. Ça s'appelle l'inclusion."}
      - {lien: 1, texte: "Le conseil municipal vote le jeudi soir. Les décisions se prennent le mardi matin, au café de la Mairie, entre deux adjoints. Je bois mon café le mardi."}
      - {lien: 2, texte: "J'ai grandi au cinquième de la tour C. L'ascenseur tombait déjà en panne un jour sur deux. J'ai appris à compter en montant les marches avec les courses."}
      - {lien: 2, si: "annee >= 2028 && annee <= 2032", texte: "Trois garçons d'ici sont partis poser des câbles au Dôme. Un seul appelle sa mère. Les deux autres envoient de l'argent, sans un mot, le premier du mois."}
      - {lien: 3, texte: "Si un jour la mairie veut quelque chose de toi, je le saurai avant le vote. Le vote, c'est le jeudi. Viens me voir le mercredi."}
      - {lien: -1, texte: "Pour un rendez-vous, il faut passer par le secrétariat. Le secrétariat, c'est moi aussi, mais le jeudi."}
      - {lien: -2, texte: "Les réunions sont réservées aux habitants. Vous n'habitez pas ici, si je me souviens bien."}
      - {lien: -3, texte: "Votre nom n'est plus sur ma liste de soutiens. Il est sur l'autre. Celle que je donne aux adjoints."}
    tuyaux:
      - id: nawel_motion
        si: "annee >= 2012 && direction < 45 && role != joueur && role != selectionneur"
        texte: "« Jeudi, au conseil, un adjoint présente une motion sur ce que ton club coûte à la ville : le stade, l'éclairage, la sécurité. Il a les voix de la majorité, moins deux. »"
        effets: {jauges: {direction: 2}}
      - id: nawel_agence
        si: "flag(histoire_h9) && annee <= 2030"
        texte: "« Les trois garçons d'ici partis au Dôme ont été recrutés par la même agence que le fils de la boulangère, une agence de Portclair qui a fermé en janvier. Leurs mères ont gardé les contrats. »"
      - id: nawel_troisieme_tranche
        si: "flag(histoire_h10) && flag(h10_maquette_trois)"
        texte: "« Sur le plan de la troisième tranche, la maison de quartier devient le parking du centre de formation. Le vote est prévu pour après la fin de l'escalier. Personne ne l'a mis à l'ordre du jour. »"
    service:
      lien: 3
      label: "Le gymnase en janvier"
      texte: "Nawel obtient de la mairie les clés du gymnase municipal pour les semaines de gel. « Le chauffage marche le matin. L'après-midi, gardez vos survêtements. » Les entraînements ne s'arrêtent pas."
      effets: {jauges: {vestiaire: 2, direction: 1}}
      dette: true

  # ═══════════════════════════════════════════════ LE SNACK DES TILLEULS (snack_tilleuls)

  # Hagop Kassabian, cinquante ans en 1990, arrivé de Valdorne en 1971. Le snack depuis 1979 :
  # une friteuse d'occasion, quatre tabourets, et au-dessus de la caisse un petit poste qui
  # repasse le match de samedi enregistré sur cassette à la télé régionale. Une étagère de
  # cassettes datées depuis 1983, les défaites en haut. Ouvert tard : il voit passer les phares.
  - id: hagop
    name: "Hagop Kassabian"
    label: "LE PATRON DU SNACK"
    genre: m
    portrait: {teint: olive, corpulence: large, age: age, coiffure: degarni, cheveux: gris, pilosite: moustache, lunettes: aucune, tenue: chemise, couleur: blanc, couleur2: bordeaux, accessoire: aucun}
    lieu: snack_tilleuls
    tranches: [midi, aprem, soir, nuit]
    annees: [1990, 2015]
    reseau: rue
    trace: "Hagop a remis la cassette de samedi au début, rien que pour toi, et il a coupé le son."
    paliers: ["te sert sans demander la sauce", "te garde le tabouret du bout", "t'ouvrirait la porte de la cuisine"]
    froid: ["te sert après les gamins du banc", "éteint le poste quand tu entres", "baisse le rideau en te voyant"]
    activites: [til_snack_cornet, til_snack_replay]
    on_relation: {3: vi.hagop.cassette, -3: vi.hagop.boucle}
    repliques:
      - {lien: 0, texte: "Le match de samedi passe en boucle jusqu'à jeudi. Le jeudi, j'enregistre la météo par-dessus. Le vendredi, on vit sans."}
      - {lien: 0, si: "annee < 2005", texte: "Les cassettes, je les range par date depuis 1983. Les défaites en haut : pour les revoir, il faut monter sur un tabouret. Ça décourage."}
      - {lien: 0, si: "tranche == nuit", texte: "Après minuit, je sers par la fenêtre. Ceux qui entrent à cette heure-là veulent qu'on les voie. Ceux de la fenêtre, non."}
      - {lien: 0, si: "serie_d >= 2", texte: "Je ne passe pas une défaite plus de trois fois. Après, les gamins apprennent les erreurs par cœur, et ils les refont dans la rue."}
      - {lien: 1, texte: "Ma femme fait les beureks le jeudi. Elle ne veut pas qu'on les vende. Je les donne aux gamins du banc. C'est pour ça qu'ils sont là le jeudi."}
      - {lien: 1, si: "annee >= 2006", texte: "Mon fils veut tout mettre sur un disque. Il dit que les cassettes s'effacent. Je sais. C'est pour ça que je les regarde encore."}
      - {lien: 2, texte: "En 1979, j'ai ouvert avec une friteuse d'occasion et une télé prêtée. La télé, je l'ai rendue en 1981. La friteuse, je l'ai encore. Elle chante faux, mais elle chante."}
      - {lien: 2, si: "flag(rep_nuit)", texte: "Tu passes souvent après une heure. Je vois les phares avant les gens. Les tiens, je les reconnais au virage de la tour B : tu freines tard."}
      - {lien: 3, texte: "Si un soir il te faut sortir sans qu'on te voie, la porte de la cuisine donne sur la friche. Dehors, elle n'a pas de poignée. Moi, je l'ouvre."}
      - {lien: -1, texte: "Il y a la queue. Les gamins d'abord : ils ont école demain."}
      - {lien: -2, texte: "Le poste est en panne. Pour vous, il le restera."}
      - {lien: -3, texte: "C'est fermé. Pour vous, c'est fermé jusqu'à ce que je vende."}
    tuyaux:
      - id: hagop_car_friche
        si: "flag(histoire_h2) && flag(h2_wagon_vu) && !flag(h2_feu)"
        texte: "« Deux nuits par semaine, le car du club s'arrête au bout de la friche, phares éteints. Le chauffeur ne descend pas. Il regarde le wagon jusqu'à deux heures, puis il repart en roue libre. »"
      - id: hagop_berline
        si: "flag(histoire_h2) && flag(h2_wagon_vu) && !flag(h2_cherche_voiture) && !flag(h2_carnet) && !flag(h2_rive)"
        texte: "« Mardi, à deux heures, la berline grise de l'ancien est passée devant chez moi sans phares, un sapin au rétroviseur. Le chauffeur du car la conduisait vers le pont. Il est revenu à pied. »"
        effets: {set: [h2_cherche_voiture]}
      - id: hagop_plaques
        si: "annee <= 2015 && direction < 45"
        texte: "« Un homme de la capitale mange ici le mercredi soir. Il note les plaques qui passent sur l'avenue. L'une d'elles est celle de quelqu'un de chez toi, qui ne devrait pas passer par ici. »"
        effets: {jauges: {direction: 2}}
    service:
      lien: 3
      label: "La cassette de samedi"
      si: "role != president"
      texte: "Hagop te prête la cassette de samedi, celle qu'il passe en boucle : au ralenti, on voit l'erreur de placement que personne n'a vue. Ton vestiaire la regarde trois fois, et ne la refait plus."
      effets: {jauges: {vestiaire: 3}}

  # Aram Kassabian, né en 1980, le fils ; gardien au grillage chez Rachid, gamin (« le fils du
  # snack sait attendre »). Le snack à partir de 2016 : les livraisons en scooter, le match sur
  # un téléphone scotché au-dessus de la caisse, et la nuit, les hommes du parking qui mangent
  # à deux heures sans parler devant lui. Il ne vend que des frites. Il sait le reste.
  - id: aram
    name: "Aram Kassabian"
    label: "LE SNACK DES TILLEULS"
    genre: m
    portrait: {teint: olive, corpulence: moyen, age: mur, coiffure: brosse, cheveux: noir, pilosite: barbe, lunettes: aucune, tenue: veste, couleur: noir, accessoire: telephone}
    lieu: snack_tilleuls
    tranches: [aprem, soir, nuit]
    annees: [2016, 2050]
    reseau: milieu
    trace: "Aram a mis ton cornet de côté sous la lampe chauffante, ton prénom au feutre sur le papier."
    paliers: ["te garde un cornet sous la lampe", "te dit qui mange ici après deux heures", "ferait taire la nuit pour toi"]
    froid: ["te fait payer d'avance", "ne répond plus quand tu frappes au volet", "te ferme le snack à toutes les heures"]
    activites: [til_snack_dernier_service]
    on_relation: {3: vi.aram.numero, -3: vi.aram.cornet}
    repliques:
      - {lien: 0, texte: "Mon père passait le match sur une cassette. Moi, sur un téléphone scotché au-dessus de la caisse. Les gamins regardent pareil : la bouche ouverte, une frite à la main."}
      - {lien: 0, si: "tranche == nuit", texte: "Après deux heures, ceux qui mangent ici ne commandent pas : ils attendent qu'on leur serve ce qu'ils prennent toujours. À cette heure-là, je ne pose aucune question."}
      - {lien: 0, si: "annee >= 2024", texte: "Les livreurs de la capitale ne viennent pas jusqu'aux Tilleuls. Les gamins du banc livrent pour moi en trottinette. Ils rapportent la monnaie, et les nouvelles."}
      - {lien: 1, si: "annee <= 2020", texte: "Mon père a gardé ses cassettes au garage. Il descend les regarder le dimanche, une couverture sur les genoux. Il commente des matchs que tout le monde a oubliés."}
      - {lien: 1, si: "serie_d >= 2", texte: "Depuis trois semaines, les téléphones des gamins ne parient plus pour toi, mais contre. Pas pour l'argent : pour avoir raison avant les autres."}
      - {lien: 2, texte: "Gamin, j'ai joué au grillage avec Rachid. Il m'a mis dans les buts parce que j'étais le fils du snack : il disait que je savais attendre."}
      - {lien: 2, si: "annee >= 2030", texte: "Les hommes du parking mangent ici à deux heures. Ils paient en liquide, ils laissent un pourboire, et ils ne parlent pas devant moi. C'est la seule politesse qui leur reste."}
      - {lien: 3, texte: "Si un soir quelqu'un te cherche dans la cité, il passera devant chez moi d'abord. Je le ferai attendre. Personne ne refuse un cornet offert."}
      - {lien: -1, texte: "On paie avant, maintenant. C'est affiché. Pour tout le monde, et pour vous."}
      - {lien: -2, texte: "Le volet est baissé. Si vous entendez la friteuse, c'est pour quelqu'un d'autre."}
      - {lien: -3, texte: "Je ne vous sers pas. Les gars du parking le savent ; ils savent aussi pourquoi."}
    tuyaux:
      - id: aram_deux_heures
        si: "annee >= 2016 && vestiaire < 45 && role != selectionneur"
        texte: "« Un des tiens mange ici à deux heures avec les hommes du parking, et il paie pour tout le monde. On ne paie pas pour tout le monde à cette heure-là quand on gagne. On paie quand on doit. »"
        effets: {jauges: {vestiaire: 2}}
      - id: aram_billets_neufs
        si: "flag(histoire_h10) && saison >= 2 && !flag(h10_nino_retourne)"
        texte: "« Nino a remboursé d'un coup tout ce qu'il devait aux gars du parking. En billets neufs, qui se suivent. Un capo ne rembourse pas comme ça avec ce qu'on lui donne au local. »"
    service:
      lien: 3
      label: "Les gamins en trottinette"
      texte: "Pendant une semaine, les gamins du banc t'apportent tes repas, tes journaux et tes messages, chaque fois par un chemin différent. Ceux qui t'attendent devant chez toi attendent pour rien."
      effets: {jauges: {direction: 2, tribunes: 1}}

  # ═══════════════════════════════════════════════════════════ LA SUPÉRETTE (superette)

  # Zohra Mezrag, quarante-neuf ans en 1990. La supérette depuis 1971, avec son mari, mort en
  # 1986. Le cahier des dépannages sous la caisse, ouvert en 1971 quand la Tréfilerie payait en
  # retard : des prénoms et des étages, jamais de noms. Les employés du stade qui habitent les
  # Tilleuls y ouvrent une page quand le club paie en retard : elle sait la caisse du club au pain.
  - id: zohra
    name: "Zohra Mezrag"
    label: "LA SUPÉRETTE DES TILLEULS"
    genre: f
    portrait: {teint: dore, corpulence: moyen, age: age, coiffure: chignon, cheveux: blanc, pilosite: rase, lunettes: rondes, tenue: blouse, couleur: ciel, accessoire: stylo}
    lieu: superette
    tranches: [matin, midi, aprem, soir]
    annees: [1990, 2010]
    reseau: argent
    trace: "Zohra a écrit ton prénom en haut d'une page blanche du cahier, et rien dessous. « Au cas où. »"
    paliers: ["te rend la monnaie en comptant tout haut", "te met le pain du jour de côté", "t'ouvrirait une page du cahier"]
    froid: ["te fait payer avant de servir", "range le cahier quand tu entres", "ne te vend plus rien"]
    activites: [til_sup_courses_zohra]
    on_relation: {3: vi.zohra.premiere_page, -3: vi.zohra.monnaie}
    climat:
      bas:
        - {si: "role == joueur", texte: "Tu as compté ta monnaie avant de payer, tout à l'heure, comme les gens du quatrième. Je connais ce geste. Je ne t'en parle pas. Ta page est là."}
        - {si: "role != selectionneur", texte: "Les femmes de ménage du stade ont rouvert leur page mardi, toutes les trois. Quand ton club paie en retard, je le sais avant la banque : je le sais au pain."}
      moyen:
        - {si: "role == joueur", texte: "Tu paies sans regarder la monnaie, mais tu regardes le prix. C'est la bonne façon. Ceux qui ne regardent ni l'un ni l'autre finissent dans le cahier."}
        - {si: "role != selectionneur", texte: "La lingère du club a réglé sa page le cinq, comme chaque mois. Ni en avance ni en retard. Ton club paie ce qu'il doit, pas un jour de plus."}
      haut:
        - {si: "role == joueur", texte: "Tu as laissé la monnaie aux gamins du banc. Fais attention : les gamins le disent à leurs pères, et les pères le disent à des gens qui viendront te demander plus."}
        - {si: "role != selectionneur", texte: "La lingère du club a soldé sa page et acheté un rôti, un mardi. Au club, on a touché une prime. Ça se voit au rayon boucherie avant de se voir au tableau."}
    repliques:
      - {lien: 0, texte: "Le pain de la veille est à moitié prix à partir de midi. Les gens de la tour C attendent midi cinq, pour que ça ne se voie pas."}
      - {lien: 0, si: "jour == lun", texte: "Le lundi, je sais qui a perdu aux courses et qui a perdu au foot. Les premiers achètent des cigarettes. Les seconds, non : ils ont déjà assez fumé au stade."}
      - {lien: 0, si: "annee >= 1994", texte: "Depuis la fermeture de la Tréfilerie, le cahier a pris dix pages. Je n'en ai déchiré aucune. On ne déchire pas une page parce qu'elle est longue."}
      - {lien: 1, texte: "Dans le cahier, il n'y a que des prénoms et des étages. Les noms de famille, je les connais. Je ne les écris pas : un cahier, ça se perd."}
      - {lien: 1, si: "annee >= 2002", texte: "Les écus, je les compte deux fois. Les vieux me paient encore en francs dans leur tête. Ils trouvent tout cher, et ils ont raison à moitié."}
      - {lien: 2, texte: "Mon mari a ouvert le cahier en 1971, quand l'usine payait en retard. Il disait qu'on ne fait pas crédit, on fait confiance. Il est mort avec trois pages qu'on ne lui a jamais rendues."}
      - {lien: 3, texte: "Si un mois tu n'as plus rien, ta page est là. Toi, tu ne la verras pas. Moi, si."}
      - {lien: -1, texte: "On paie à la caisse, avant. Le cahier, c'est pour les gens d'ici."}
      - {lien: -2, texte: "Je n'ai plus de pain du jour. Il reste celui de la veille, au prix du jour."}
      - {lien: -3, texte: "Je ne vous vends rien. Allez au supermarché du boulevard : ils ne connaissent personne, là-bas."}
    tuyaux:
      - id: zohra_menage
        si: "annee <= 2010 && caisse < 40 && role != joueur && role != selectionneur"
        texte: "« Les femmes de ménage du stade ont rouvert leur page la même semaine. Le club leur doit deux mois. Elles ne le diront jamais à ceux d'en haut ; elles me l'ont dit à moi, avec le pain. »"
        effets: {jauges: {vestiaire: 2}}
      - id: zohra_piles
        si: "flag(histoire_h2) && saison >= 2 && !flag(h2_wagon_vu)"
        texte: "« Madame Josiane achète chez moi, le soir, deux soupes en sachet, du pain pour deux et des piles rondes, pour une radio. Elle vit seule. Elle n'écoute jamais la radio. »"
      - id: zohra_macons
        si: "flag(histoire_h5) && annee <= 2002"
        texte: "« Tes maçons ont ouvert une page chez moi, les trois de la tour B. Ils disent que tu paies les joueurs avant eux. Ils ne le disent pas méchamment. Pas encore. »"
    service:
      lien: 3
      label: "Une page du cahier"
      texte: "Zohra ouvre le cahier à ta page, écrit une somme au crayon et te tend les billets de la caisse, pliés en deux. « Pas d'intérêts, pas de date. Je te dirai, le jour où il faudra. »"
      effets: {var: {ville_francs: "+800"}}
      dette: true

  # Nordine Mezrag, né en 1968 ; quatre ans au bâtiment C de la Tréfilerie, puis chauffeur-livreur.
  # La supérette à partir de 2011 : le terminal de paiement, le cahier sur le téléphone pour la
  # banque, et le vieux cahier au crayon pour les gens. Sa mère vient encore le samedi.
  - id: nordine
    name: "Nordine Mezrag"
    label: "LA SUPÉRETTE, LE FILS"
    genre: m
    portrait: {teint: dore, corpulence: large, age: mur, coiffure: court, cheveux: gris, pilosite: moustache, lunettes: aucune, tenue: pull, couleur: gris, accessoire: carnet}
    lieu: superette
    tranches: [matin, aprem, soir]
    annees: [2011, 2050]
    reseau: argent
    trace: "Nordine a recopié ton prénom dans le vieux cahier de sa mère, à la page des gens qui reviennent."
    paliers: ["te met le pain de côté", "te montre la page du stade", "te ferait crédit sur le cahier de sa mère"]
    froid: ["te demande ta carte pour une baguette", "te sert sans un mot", "ne te vend plus rien"]
    activites: [til_sup_courses_nordine]
    on_relation: {3: vi.nordine.page_du_stade}
    climat:
      bas:
        - {si: "role == joueur", texte: "Tu as payé ta baguette par carte. Ma mère disait qu'on paie par carte ce qu'on n'a plus en poche. Elle se trompait rarement sur les poches."}
        - {si: "role != selectionneur", texte: "La lingère et les deux jardiniers du stade ont rouvert leur page le même mardi. Le club a payé les joueurs, pas eux. Je le sais avant tes comptables : je le sais au cahier."}
      moyen:
        - {si: "role == joueur", texte: "Tu prends le pain du jour, pas celui de la veille, et tu ne regardes pas le prix du café. Tu vas bien, ni plus ni moins. Le cahier ne te connaît pas."}
        - {si: "role != selectionneur", texte: "Les employés du stade règlent leur page le cinq, pas un jour d'avance. Ton club paie à l'heure, sans fête. Chez nous, c'est déjà beaucoup."}
      haut:
        - {si: "role == joueur", texte: "Tu as réglé la page entière d'une voisine, sans le lui dire. Elle l'a su en dix minutes : ici, tout se sait en dix minutes. Garde un peu pour toi."}
        - {si: "role != selectionneur", texte: "Les jardiniers du stade ont soldé leur page et acheté des gâteaux pour la maison de quartier. Au club, on a touché une prime, ou une promesse qu'on croit."}
    repliques:
      - {lien: 0, texte: "Ma mère tenait le cahier au crayon. Moi aussi, et sur le téléphone. Le téléphone, c'est pour la banque. Le crayon, c'est pour les gens."}
      - {lien: 0, si: "annee >= 2014", texte: "La barre E2 est tombée. J'ai perdu quarante clients en une semaine. Ils sont relogés à Montbéliac ; ils m'appellent pour savoir qui est mort."}
      - {lien: 1, texte: "J'ai fait quatre ans au bâtiment C de la Tréfilerie. Le dernier jour, on nous a laissé les blouses. Je m'en sers encore, pour la réserve."}
      - {lien: 2, si: "annee <= 2030", texte: "Ma mère vient le samedi s'asseoir derrière la caisse. Elle ne vend rien. Elle relit les pages du vieux cahier, et elle dit les prénoms tout bas."}
      - {lien: 2, si: "annee > 2030", texte: "Le vieux cahier de ma mère est dans le tiroir, sous la caisse. Je n'écris plus dedans. Les jours de pluie, je relis la première page, celle de mon père."}
      - {lien: 3, texte: "Si un jour ton club ne paie plus les gens d'ici, je le saurai le premier, au cahier. Je te le dirai avant qu'ils le disent au virage."}
      - {lien: -1, texte: "La carte au-dessus de dix écus. En dessous, les pièces. C'est affiché."}
      - {lien: -2, texte: "Le pain du jour est parti. Le reste, servez-vous ; la caisse est là."}
      - {lien: -3, texte: "Je ne vous vends plus rien. Ma mère aurait fait pareil. Plus vite."}
    tuyaux:
      - id: nordine_lingere
        si: "annee >= 2011 && caisse < 40 && role != joueur && role != selectionneur"
        texte: "« La lingère et les deux jardiniers du stade ont rouvert leur page le même mardi. Le club a payé les joueurs, pas eux. Ils m'ont demandé de ne rien dire. Je te le dis à toi. »"
        effets: {jauges: {vestiaire: 2}}
      - id: nordine_cartes_socios
        si: "flag(histoire_h10) && saison >= 2"
        texte: "« Les socios de la tour B ont payé leur carte avec l'argent des courses ; ils me l'ont dit en ouvrant une page. Si l'assemblée vote la franchise, ils viendront te demander de le leur rendre. »"
    service:
      lien: 3
      label: "L'ardoise du stade"
      si: "role != joueur && role != selectionneur"
      texte: "Nordine ouvre une page au nom du stade : les employés du club mangent à crédit jusqu'à la paie. « Ma mère a fait pareil en 1990. Elle n'a jamais perdu un centime. Elle a perdu deux amis. »"
      effets: {jauges: {vestiaire: 2, tribunes: 1}}

  # ═══════════════════════════════════════════════════════ LE CLUB DE BOXE (club_boxe)

  # Stanislas « Stan » Kowal, cinquante-huit ans en 1990, fils d'un mineur ; venu pour la
  # Tréfilerie en 1955 ; trente-deux combats ; le club depuis 1962, dans l'ancien gymnase. Au
  # mur, Slimane Lounès, de la tour B, champion des moyens en 1978, qui a pris une boîte en 1979
  # et n'a plus jamais tenu dix rounds. Ses anciens font la porte au Rideau Rouge et ramassent
  # pour le Terminus : ils lui doivent tous quelque chose.
  - id: kowal
    name: "Stanislas « Stan » Kowal"
    label: "LE CLUB DE BOXE"
    genre: m
    portrait: {teint: clair, corpulence: large, age: age, coiffure: brosse, cheveux: blanc, pilosite: rase, lunettes: aucune, tenue: survetement, couleur: rouge, couleur2: noir, accessoire: montre}
    lieu: club_boxe
    tranches: [aprem, soir]
    annees: [1990, 2013]
    reseau: milieu
    trace: "Stan a noté ta séance sur l'ardoise du club, entre deux gamins de douze ans, au même nombre de rounds."
    paliers: ["te tend les gants sans rien demander", "te laisse sonner la cloche", "mettrait ses anciens à ta porte"]
    froid: ["te fait payer la séance d'avance", "ne te regarde plus taper", "t'a effacé de l'ardoise"]
    activites: [til_boxe_sac]
    on_relation: {3: vi.kowal.gants, -3: vi.kowal.anciens}
    repliques:
      - {lien: 0, texte: "Ici, on paie la licence et on se tait pendant les rounds. Le reste se dit sous l'auvent, en remettant ses chaussures."}
      - {lien: 0, si: "tranche == soir", texte: "Les gamins viennent à six heures parce que leurs pères rentrent à sept. Je les fais taper une heure. Ils rentrent fatigués. Chez eux, ça vaut mieux."}
      - {lien: 0, si: "annee >= 1994", texte: "Les cordes, je les ai rafistolées avec du câble de la Tréfilerie, l'hiver de la fermeture. Elles tiennent mieux que l'usine n'a tenu."}
      - {lien: 1, texte: "Celui de la photo, c'est Slimane, de la tour B, champion des moyens en 1978. Je ne dis jamais son nom devant les gamins. Ils le disent eux-mêmes, et mieux."}
      - {lien: 1, si: "serie_d >= 2", texte: "Tes gars encaissent. Ça se voit à leur façon de marcher en ville : la garde basse, le menton devant. Un boxeur qui perd marche comme ça."}
      - {lien: 2, texte: "J'ai boxé trente-deux combats, j'en ai gagné dix-neuf. Les treize autres, je les connais mieux. Un combat gagné ne t'apprend que le chemin du vestiaire."}
      - {lien: 2, si: "flag(rep_sport)", texte: "Tu viens taper trois fois par semaine. Les gamins t'ont trouvé un surnom. Je ne te le dirai pas. Il n'est pas méchant ; il est juste."}
      - {lien: 3, texte: "Mes anciens font la porte au Rideau Rouge et ramassent pour le Terminus. Ils me doivent tous quelque chose. Si un soir on t'attend sous ta fenêtre, dis-le-moi."}
      - {lien: -1, texte: "La séance se paie avant. Les gants sont au clou. Les bons sont pris."}
      - {lien: -2, texte: "Tape si tu veux. Je regarde les gamins."}
      - {lien: -3, texte: "Ton nom n'est plus sur l'ardoise. Ici, ça veut dire que tu n'es jamais venu."}
    tuyaux:
      - id: kowal_boite
        si: "flag(histoire_h3) && !flag(h3_boite_prise)"
        texte: "« Ce que Steph vend dans sa boîte, je l'ai trouvé en 1979 dans le sac de Slimane, celui de la photo. Il a gagné trois combats de plus. Après, il n'a plus jamais tenu dix rounds, ni une porte. »"
      - id: kowal_carnet
        si: "flag(histoire_h2) && flag(h2_wagon_vu) && !flag(h2_carnet)"
        texte: "« Mon ancien poids lourd ramasse pour le Terminus. Le chauffeur du car ne réclame plus l'argent de ton avant-centre : il veut un carnet, et il demande où dort l'ancien entraîneur. »"
      - id: kowal_adresse
        si: "annee <= 2013 && vestiaire < 45 && role != selectionneur"
        texte: "« Un de mes anciens ramasse pour le Terminus. Jeudi, il a une adresse : celle d'un des tiens. Il me l'a dite parce qu'il ne veut pas frapper quelqu'un que les gamins applaudissent. »"
        effets: {jauges: {vestiaire: 2}}
      - id: kowal_sachets
        si: "flag(histoire_h7) && flag(h7_rance_mort) && !flag(h7_main_vue)"
        texte: "« Un de mes anciens vend des sachets sans étiquette sur le parking de l'hôtel. Le nouveau de Valdorne, chez tes Cobalts, en achète avant chaque match. Cette semaine-là, il en a pris deux. »"
    service:
      lien: 3
      label: "Une dette effacée"
      texte: "Stan parle dix minutes, sous l'auvent, à son ancien qui ramasse pour le Terminus. La dette d'un des tiens passe à l'an prochain, sans intérêts. « Je ne lui ai rien promis. Je lui ai rappelé 1974. »"
      effets: {jauges: {vestiaire: 3}}
      dette: true

  # Mélissa Kowal, née en 1986, la petite-fille ; onze ans de boxe, le nez cassé deux fois. Le club
  # à partir de 2014 : les cordes neuves en 2016, les gamins, les filles, et le travail d'appuis
  # des joueurs du Racing. Elle lit les corps : la sueur, les épaules, le pouls.
  - id: melissa
    name: "Mélissa Kowal"
    label: "L'ENTRAÎNEUSE DU CLUB DE BOXE"
    genre: f
    portrait: {teint: clair, corpulence: fin, age: jeune, coiffure: court, cheveux: blond, pilosite: rase, lunettes: aucune, tenue: survetement, couleur: noir, couleur2: rouge, accessoire: aucun}
    lieu: club_boxe
    tranches: [aprem, soir]
    annees: [2014, 2050]
    reseau: sante
    trace: "Mélissa a pris ton pouls au poignet après le sac, et l'a écrit sur le dos de sa main, à côté de ceux des gamins."
    paliers: ["te tient le sac sans qu'on demande", "te dit ce que ton corps raconte", "remettrait un des tiens d'aplomb pour toi"]
    froid: ["te fait signer la décharge à chaque séance", "ne te tient plus le sac", "ne te laisse plus monter sur le ring"]
    activites: [til_boxe_appuis]
    on_relation: {3: vi.melissa.pouls}
    repliques:
      - {lien: 0, texte: "Ici, on frappe un sac, pas quelqu'un. Ceux qui confondent font mille sauts à la corde. Ils apprennent la différence en route."}
      - {lien: 0, si: "annee >= 2024", texte: "Les bracelets comptent les pas, le cœur, le sommeil. Ils ne comptent pas la peur. La peur se voit aux épaules, et aucune montre ne regarde les épaules."}
      - {lien: 1, texte: "Mon grand-père avait rafistolé les cordes avec du câble de l'usine. Je les ai changées en 2016. J'ai gardé un bout du câble dans le tiroir, avec ses gants."}
      - {lien: 1, si: "serie_d >= 2", texte: "Tes joueurs qui viennent ici frappent plus fort quand ça perd. Ce n'est pas de la colère, c'est de la peur. Ça se soigne pareil : en respirant."}
      - {lien: 2, texte: "J'ai boxé onze ans. Le nez cassé deux fois, la main droite une. Je n'ai jamais pris ce qu'on me tendait aux vestiaires. Pas par vertu : j'avais peur des aiguilles."}
      - {lien: 3, texte: "Si un des tiens prend quelque chose qu'il ne devrait pas, je le saurai à sa sueur. Je te le dirai avant le médecin du club : lui, on le paie pour ne rien sentir."}
      - {lien: -1, texte: "La décharge, sur le comptoir. Signez avant de toucher un gant."}
      - {lien: -2, texte: "Le sac est libre. Tenez-le vous-même."}
      - {lien: -3, texte: "Pas sur le ring. Ni aujourd'hui, ni un autre jour."}
    tuyaux:
      - id: melissa_kerdal
        si: "flag(histoire_h8) && !flag(h8_kerdal_mort) && !flag(h8_kerdal_vendu) && !flag(h8_kerdal_repose)"
        texte: "« Kerdal vient frapper le sac à deux heures du matin. Il a des cachets dans la poche de son short, et cent dix au repos. Il ne dort plus. Mets-le au repos, ou il tombera entre deux bancs. »"
      - id: melissa_parking
        si: "annee >= 2014 && vestiaire < 45 && role != president"
        texte: "« Deux des tiens achètent des antidouleurs sans ordonnance sur le parking de la tour B, le jeudi soir. Le samedi, ils jouent sur des chevilles qu'ils ne sentent plus. »"
        effets: {jauges: {vestiaire: 2}}
    service:
      lien: 3
      label: "Deux semaines de corde"
      texte: "Mélissa prend trois des tiens deux semaines : la corde, le sac, et pas d'écran après dix heures. Ils reviennent légers, ils dorment, et ils ne savent pas expliquer pourquoi."
      effets: {jauges: {vestiaire: 3}}

  # ═══════════════════════════════════════════════ LE SALON DES TILLEULS (salon_tilleuls)

  # Aldo Scarpelli, cinquante-cinq ans en 1990, arrivé en 1958. Le salon depuis 1966 : trois
  # fauteuils, un néon, et celui du milieu, celui de son père, où il n'assoit que ceux qui
  # viennent le matin d'une signature. Au mur, la photo de chaque gamin d'ici qui a signé un
  # contrat, prise dans ce fauteuil ; un cadre vide en bas à droite. Les agents se font couper
  # ici avant de monter voir les pères.
  - id: scarpelli
    name: "Aldo Scarpelli"
    label: "LE COIFFEUR DES TILLEULS"
    genre: m
    portrait: {teint: olive, corpulence: fin, age: age, coiffure: court, cheveux: blanc, pilosite: moustache, lunettes: aucune, tenue: blouse, couleur: blanc, couleur2: noir, accessoire: aucun}
    lieu: salon_tilleuls
    tranches: [matin, midi, aprem]
    annees: [1990, 2017]
    reseau: rue
    trace: "Scarpelli a balayé tes cheveux à part, dans un coin, comme il le fait pour ceux qui signent."
    paliers: ["te prend sans rendez-vous", "te dit qui s'est assis avant toi", "te garderait le fauteuil du milieu"]
    froid: ["te fait attendre derrière les gamins", "te coupe sans un mot", "ne te prend plus, même le samedi"]
    activites: [til_salon_coupe_scarpelli]
    on_relation: {3: vi.scarpelli.cadre, -3: vi.scarpelli.miroir}
    repliques:
      - {lien: 0, texte: "Le fauteuil du milieu était celui de mon père. Je n'y assois personne, sauf ceux qui viennent le matin d'une signature."}
      - {lien: 0, si: "annee >= 2002", texte: "Le prix est sur la vitre depuis 1974. Je ne l'ai changé qu'une fois, au feutre, pour les écus. Les clients ont fait semblant de ne pas voir l'arrondi."}
      - {lien: 0, si: "tranche == matin", texte: "Le vendredi matin, les gamins du club viennent se faire raser la nuque. Ils parlent de leurs contrats plus fort que de leurs fiancées."}
      - {lien: 0, si: "serie_d >= 2", texte: "Les supporters se font couper plus court quand ça perd. Je ne sais pas pourquoi. Pour avoir quelque chose à faire de leurs mains le samedi, peut-être."}
      - {lien: 1, texte: "Le mur, ce sont tous les gamins d'ici qui ont signé un contrat, photographiés dans le fauteuil du milieu, le matin même. En bas à droite, il reste un cadre vide."}
      - {lien: 2, texte: "Les agents se font couper ici avant de monter voir les pères. Ils parlent au miroir. Le miroir ne répète rien. Moi, je ne répète qu'aux gens qui ont une nuque."}
      - {lien: 2, si: "annee >= 2012", texte: "Mon apprenti filme ses coupes pour le Flux. Il a plus de clients de Portclair que moi d'Aubérive. Je ne sais pas si c'est une bonne nouvelle pour Aubérive."}
      - {lien: 3, texte: "Si un jour quelqu'un vient vendre un gamin d'ici, il passera dans ce fauteuil avant. Je le saurai le matin. Toi, tu le sauras à midi."}
      - {lien: -1, texte: "Il y a trois gamins avant vous. Asseyez-vous sur le banc, il y a des journaux de la semaine dernière."}
      - {lien: -2, texte: "Assis. Tête droite. On ne parle pas pendant le rasoir."}
      - {lien: -3, texte: "Je ne vous prends plus. Il y a un salon sur le boulevard ; ils ont des magazines neufs."}
    tuyaux:
      - id: scarpelli_prix
        si: "flag(histoire_h6) && saison >= 2"
        texte: "« Le garçon poli de ton club se fait couper ici. Il demande aux pères à combien on leur a proposé leurs fils, et il tape les prix dans son petit ordinateur entre deux coups de ciseaux. »"
        effets: {var: {h6_indices: "+1"}}
      - id: scarpelli_1986
        si: "flag(histoire_h3) && saison >= 2 && !flag(h3_papier_vu)"
        texte: "« Fardelli se fait raser ici le samedi. Sous la serviette chaude, il relit un papier plié en quatre, daté de 1986, d'une écriture de femme. Il le range dans sa chemise, pas dans son portefeuille. »"
      - id: scarpelli_treize_mai
        si: "flag(histoire_h4) && flag(h4_quatorze_mai) && !flag(h4_photo_entiere)"
        texte: "« Ton capitaine se fait couper ici chaque 13 mai, depuis 1985, à la première heure. Il ne dit pas un mot. Il veut être propre, il dit, pour le lendemain. Le lendemain, il ne va nulle part. »"
      - id: scarpelli_valentienne
        si: "annee <= 2017 && role != selectionneur"
        texte: "« Hier, un agent de Valentienne s'est fait raser dans le fauteuil du milieu avant de monter à la tour A, chez le père du petit gaucher qui est chez toi. Il a laissé un gros pourboire. »"
        effets: {jauges: {vestiaire: 2}}
    service:
      lien: 3
      label: "L'arrière-boutique"
      si: "role != selectionneur"
      texte: "Scarpelli baisse le store, retourne la pancarte et te laisse l'arrière-boutique une heure : deux chaises, un miroir, du café. Le père du gamin entre par la cour. En ville, personne ne saura."
      effets: {jauges: {direction: 2, vestiaire: 1}}

  # Bilal Chergui, né en 1994, l'apprenti de Scarpelli à partir de 2012, le salon à partir de 2018.
  # Il filme les nuques, jamais les visages, pour son compte du Flux ; les jeunes du centre
  # viennent le dimanche soir ; les agents le paient pour poster une rumeur un mardi. Il garde le
  # mur des signatures, qui déborde sur la porte.
  - id: bilal
    name: "Bilal Chergui"
    label: "LE SALON DES TILLEULS"
    genre: m
    portrait: {teint: brun, corpulence: fin, age: jeune, coiffure: court, cheveux: noir, pilosite: barbe, lunettes: aucune, tenue: pull, couleur: noir, accessoire: telephone}
    lieu: salon_tilleuls
    tranches: [matin, midi, aprem]
    annees: [2018, 2050]
    reseau: presse
    trace: "Bilal a photographié ta nuque, sans le visage, et l'a rangée dans un dossier qu'il ne poste pas."
    paliers: ["te prend entre deux rendez-vous", "te montre ce qu'il ne poste pas", "effacerait une rumeur pour toi"]
    froid: ["te filme quand tu entres", "poste ta coupe avec une légende", "a bloqué ton nom sur son compte"]
    activites: [til_salon_coupe_bilal]
    on_relation: {3: vi.bilal.brouillons, -3: vi.bilal.legende}
    repliques:
      - {lien: 0, texte: "Scarpelli coupait en silence. Moi, je coupe avec le téléphone sur le trépied : trente secondes par client, la nuque, jamais le visage. Les gens adorent les nuques."}
      - {lien: 0, si: "annee >= 2024", texte: "Les gamins du centre viennent le dimanche soir pour la coupe du match. Ils veulent une ligne au rasoir au-dessus de l'oreille. Chacun la sienne, chacun son côté."}
      - {lien: 1, si: "annee <= 2030", texte: "Scarpelli vient encore le jeudi. Il s'assoit dans le fauteuil du milieu, celui qu'il ne donnait à personne, et il me regarde travailler. Il ne dit rien. C'est pire."}
      - {lien: 1, si: "annee >= 2040", texte: "Le mur des signatures déborde sur la porte de la réserve. Depuis la loi, il en arrive moins. Je garde la place quand même, au feutre, en pointillés."}
      - {lien: 2, texte: "Les agents me paient pour poster une rumeur un mardi. Le mercredi, le club du gamin l'appelle. Le jeudi, le prix a bougé. Je ne poste plus les rumeurs. Je vends le silence."}
      - {lien: 3, texte: "Si quelqu'un te prépare quelque chose sur le Flux, ça passera par un des comptes qui regardent le mien. Je le verrai la veille."}
      - {lien: -1, texte: "Je vous filme, c'est le principe du salon. Vous pouvez toujours aller ailleurs."}
      - {lien: -2, texte: "Votre coupe est en ligne. Les commentaires sont ouverts. Je ne les lis pas, je les compte."}
      - {lien: -3, texte: "Votre nom est bloqué sur mon compte. Il ne passera plus dans mes vidéos, ni dans mon fauteuil."}
    tuyaux:
      - id: bilal_compte
        si: "annee >= 2018 && direction < 45"
        texte: "« Un compte de la capitale prépare une vidéo sur toi pour dimanche : des images du parking, un ancien de chez toi qui parle. Il m'a demandé une photo de ta nuque, pour faire vrai. »"
        effets: {jauges: {direction: 2}}
      - id: bilal_trois_minutes
        si: "flag(histoire_h8) && !flag(h8_video)"
        texte: "« Un client m'a montré une application qui fait parler n'importe qui, avec sa propre voix, en trois minutes d'enregistrement. Il voulait la tienne. Il a dit qu'il avait déjà les trois minutes. »"
      - id: bilal_ligne_noire
        si: "flag(histoire_h9) && annee >= 2029"
        texte: "« Les gamins me demandent une ligne noire rasée au-dessus de l'oreille, pour le fils de la boulangère. Quelqu'un du ministère a appelé le salon pour savoir combien j'en avais fait. J'ai dit zéro. »"
    service:
      lien: 3
      label: "Le silence du salon"
      texte: "Bilal retire une vidéo de son compte et passe la nuit à appeler ceux qui l'ont reprise. Au matin, la rumeur sur toi n'existe plus qu'en trois copies, que personne ne retrouve."
      effets: {jauges: {direction: 2, tribunes: 1}}
      dette: true

  # ════════════════════════════════════════════════════════════════ LA TOUR C (tour_c)

  # Marthe Degroote, soixante-deux ans en 1990, gardienne de la tour C depuis son ouverture, en
  # 1964. Veuve d'André, dans la Nord depuis 1958, mort en 1986. Le samedi, le drapeau du club à
  # la fenêtre de la loge. Le cahier des pannes de l'ascenseur. L'anneau de clés, et la verte :
  # le neuvième, sans nom à la sonnette depuis mars 1975, l'appartement des Ravenel. Elle sait ce
  # que la tour pense du club : les grands du sixième montent au virage.
  - id: marthe
    name: "Marthe Degroote"
    label: "LA GARDIENNE DE LA TOUR C"
    genre: f
    portrait: {teint: clair, corpulence: large, age: age, coiffure: boucle, cheveux: blanc, pilosite: rase, lunettes: carrees, tenue: blouse, couleur: bleu, couleur2: bordeaux, accessoire: aucun}
    lieu: tour_c
    tranches: [matin, midi, aprem, soir]
    annees: [1990, 2008]
    reseau: tribunes
    trace: "Marthe a noté ton passage dans le cahier des pannes de l'ascenseur, entre deux pannes, à l'heure exacte."
    paliers: ["te garde l'ascenseur au rez-de-chaussée", "te dit qui monte et qui descend", "t'ouvrirait le neuvième"]
    froid: ["te laisse prendre l'escalier", "ferme sa loge quand tu passes", "ne t'ouvre plus la porte du hall"]
    activites: [til_tourc_courrier]
    on_relation: {3: vi.marthe.cle_verte, -3: vi.marthe.volets}
    climat:
      bas:
        - {si: "role == selectionneur", texte: "Le soir des Cobalts, les fenêtres de la tour sont restées noires, télés comprises. Les gens d'ici regardaient autre chose, ou rien. Le pays a décroché, jusqu'au dixième."}
        - "Samedi, pas un drapeau aux fenêtres de la tour. Les grands du sixième sont montés au virage avec des sifflets. Mon mari aurait eu honte d'eux. Et de toi, un peu."
      moyen:
        - {si: "role == selectionneur", texte: "Pour les Cobalts, la moitié des fenêtres a regardé la première mi-temps. À la seconde, on entendait les vaisselles. Le pays attend de voir."}
        - "Trois drapeaux aux fenêtres samedi, sur quarante. Les grands du sixième vont au virage et reviennent sans voix ni colère. Ils attendent que tu leur donnes une raison."
      haut:
        - {si: "role == selectionneur", texte: "Le soir des Cobalts, toute la tour criait en même temps. Le béton résonne : on a su le but avant le poste. Le pays y croit, et la tour C avec."}
        - "Samedi, j'ai compté trente drapeaux aux fenêtres de la tour, des écharpes jusqu'au dixième. Le neuvième n'a pas ouvert ses volets. Tout le reste chantait."
    repliques:
      - {lien: 0, texte: "L'ascenseur ? Un jour sur deux. Aujourd'hui, c'est l'autre jour. Je note les pannes depuis 1964. L'office ne lit pas le cahier ; moi, si."}
      - {lien: 0, si: "jour == sam", texte: "Le samedi, je pends le drapeau du club à la fenêtre de la loge. Mon mari le pendait. Je le pends pour qu'on ne croie pas qu'il est mort une deuxième fois."}
      - {lien: 0, si: "tranche == soir", texte: "Les grands du sixième s'assoient dans l'escalier jusqu'à minuit. Je ne les chasse pas. Je leur ai seulement interdit de s'asseoir au neuvième."}
      - {lien: 1, texte: "Le neuvième n'a pas de nom à la sonnette depuis mars 1975. L'office l'a loué trois fois. Trois fois, les gens sont partis avant l'hiver. Je ne sais pas ce qu'ils entendaient."}
      - {lien: 1, si: "serie_v >= 2", texte: "Les drapeaux remontent aux fenêtres. Le quatrième droite a même ressorti celui de 1984, avec son trou de cigarette. Ça sent la naphtaline jusqu'au hall."}
      - {lien: 2, texte: "Mon mari était dans la Nord depuis 1958, à la même marche. Quand il est mort, ceux du virage ont laissé sa place vide un an. Après, ils l'ont donnée à son neveu."}
      - {lien: 2, si: "flag(histoire_h1) && flag(h1_cercueil)", texte: "La première fois, dans le hall, tu as levé les yeux vers les sonnettes du neuvième sans compter les étages. Je n'ai rien dit. Au neuvième, on ne dit rien depuis 1975."}
      - {lien: 3, texte: "La clé verte, sur mon anneau, c'est le neuvième. Je ne la prête à personne. Si un soir tu dois disparaître, elle ouvre un appartement où personne ne monte."}
      - {lien: -1, texte: "L'ascenseur est en panne. Pour vous, il le sera aussi demain."}
      - {lien: -2, texte: "La loge est fermée. Le courrier, c'est dans les boîtes, comme tout le monde."}
      - {lien: -3, texte: "Je ne vous ouvre plus le hall. Ceux qui vous ouvriront, je saurai leurs étages."}
    tuyaux:
      - id: marthe_cle_verte
        si: "flag(histoire_h1) && flag(h1_cercueil)"
        texte: "« Le neuvième, c'était chez vous, jusqu'en mars 1975. Ta mère m'a laissé la clé le matin du car : “Si {pg, select, f{la petite} other{le petit}} revient.” La clé verte. Elle est sur mon anneau. »"
      - id: marthe_carton_lessive
        si: "flag(histoire_h1) && flag(h1_masques_tifo) && !flag(h1_berline_brulee)"
        texte: "« Les grands du sixième cachent des masques à ta tête dans le local à poubelles. Lundi, un homme en a pris trente, dans un carton de lessive. Il a parlé du parking du stade, à une heure. »"
      - id: marthe_sifflets
        si: "annee <= 2008 && tribunes < 40 && role != selectionneur"
        texte: "« Les grands du sixième ont acheté une boîte entière de sifflets au tabac du carrefour. Ils les distribuent samedi dans la Nord, pour la vingtième minute. Ils m'ont demandé si ça te ferait mal. »"
        effets: {jauges: {tribunes: 2}}
      - id: marthe_bache
        si: "flag(histoire_h5) && flag(h5_bache)"
        texte: "« La bâche de Gégé, les gamins de la tour C l'ont peinte la nuit, dans le local à vélos. Ils ont écrit leurs prénoms au dos, au pinceau. Ils veulent que tu le saches, et que personne ne le dise. »"
        effets: {jauges: {tribunes: 2}}
    service:
      lien: 3
      label: "Les fenêtres de la tour"
      texte: "Le samedi, Marthe fait les paliers avec sa liste. À quatorze heures, des drapeaux pendent à quarante fenêtres de la tour C. On les voit du boulevard. On les voit de la tribune."
      effets: {jauges: {tribunes: 3}}

  # Issa Tchibozo, arrivé du Kambara en 1992, gardien de la tour C à partir de 2009 (l'office a
  # d'abord essayé une société de surveillance ; les locataires ont réclamé un homme). Le carnet
  # de la tour, étage par étage : les naissances, les départs, les morts. La chambre derrière la
  # loge. En 2014, le neuvième a enfin un nom : TAZI, gravé par le maçon dans un carré de plâtre.
  - id: issa
    name: "Issa Tchibozo"
    label: "LE GARDIEN DE LA TOUR C"
    genre: m
    portrait: {teint: ebene, corpulence: moyen, age: mur, coiffure: court, cheveux: noir, pilosite: bouc, lunettes: rondes, tenue: veste, couleur: gris, accessoire: stylo}
    lieu: tour_c
    tranches: [matin, aprem, soir]
    annees: [2009, 2050]
    reseau: familles
    trace: "Issa a ajouté une ligne pour toi dans son carnet de la tour, entre une naissance au troisième et un départ au septième."
    paliers: ["te tient la porte du hall", "te raconte la tour étage par étage", "te prêterait la chambre de la loge"]
    froid: ["te demande qui tu viens voir", "ne te tient plus la porte", "a changé le code du hall pour toi"]
    activites: [til_tourc_ronde]
    on_relation: {3: vi.issa.carnet}
    repliques:
      - {lien: 0, texte: "Dix étages, quarante boîtes aux lettres, trois cabossées par semaine. Je les redresse au marteau le lundi. Le facteur dit que je suis le seul à le faire."}
      - {lien: 0, si: "annee >= 2015", texte: "Au neuvième, il y a un nom, maintenant : TAZI, gravé dans un carré de plâtre au-dessus de la sonnette. Le maçon l'a fait lui-même. On n'arrache pas un nom gravé."}
      - {lien: 0, si: "tranche == soir", texte: "La ronde du soir, c'est pour les ampoules, pas pour les gens. Mais les gens sont sous les ampoules. Alors on se parle."}
      - {lien: 1, si: "annee <= 2016", texte: "Marthe vient de sa maison de retraite le dimanche. Elle relit le cahier des pannes et trouve que j'en oublie. Elle a raison. Je lui laisse le stylo."}
      - {lien: 1, si: "annee >= 2014 && annee <= 2016", texte: "Depuis que la barre E2 est tombée, la tour voit le boulevard. Ceux du septième ont mis des rideaux. Ils n'aiment pas être vus par des voitures."}
      - {lien: 2, texte: "Je suis arrivé du Kambara en 1992 avec une valise et un numéro de téléphone faux. La première porte qu'on m'a ouverte ici, c'était celle de Marthe. Je garde sa porte."}
      - {lien: 2, si: "annee >= 2027", texte: "Mbako entraîne le Kambara, maintenant. Là-bas, on dit qu'il est d'ici. Ici, on dit qu'il est de là-bas. Les gamins du hall disent qu'il est du terrain annexe."}
      - {lien: 3, texte: "Derrière la loge, il y a une chambre sans fenêtre sur la rue. Si un soir tu as besoin de dormir où personne ne te cherche, ta voiture ira au parking de la tour B."}
      - {lien: -1, texte: "Vous venez voir qui ? Il me faut un nom et un étage."}
      - {lien: -2, texte: "Le hall est aux locataires. Vous attendrez dehors, sous la marquise."}
      - {lien: -3, texte: "Le code a changé ce matin. Tout le monde l'a eu, sauf vous."}
    tuyaux:
      - id: issa_enveloppe_creme
        si: "flag(histoire_h10) && saison >= 2 && !flag(h10_truelle_payee)"
        texte: "« Tazi rentre au neuvième à quatre heures, les nuits où il mure. Jeudi, une enveloppe crème l'attendait sous sa porte. Sa femme l'a posée sur le compteur sans l'ouvrir. Lui, il l'a ouverte. »"
      - id: issa_kambara
        si: "flag(histoire_h9) && annee >= 2030"
        texte: "« Les Kambarais de la tour regarderont le troisième match dans le hall, sur un écran que l'office prête. Ils porteront tous un brassard noir. Ils m'ont demandé si toi aussi. »"
      - id: issa_car_de_cinq_heures
        si: "annee >= 2009 && vestiaire < 45 && role != selectionneur"
        texte: "« Le petit du septième qui est chez toi a perdu sa mère en mars. Il n'a rien dit au club. Il dort chez son oncle, à Montbéliac, et il prend le premier car, à cinq heures. »"
        effets: {jauges: {vestiaire: 2}}
    service:
      lien: 3
      label: "La chambre de la loge"
      texte: "Issa te laisse la chambre derrière la loge pour deux nuits. Ta voiture dort au parking de la tour B, sous une bâche bleue. Devant chez toi, on photographie des volets fermés."
      effets: {jauges: {direction: 2}}
      dette: true

# ═══════════════════════════════════════════════════════════════ LES ACTIVITÉS
# Pas d'intérieur aux Tilleuls : tout se fait depuis le panneau du lieu (aucun `objet`). Ce
# qu'on fait avec quelqu'un donne un point de lien (au plus un par personne entre deux cartes)
# et porte la borne de son époque. Les petits boulots (`francs` positif, `max_jour: 1`) sont
# pour le joueur des divisions d'en bas. Les gestes du quartier comptent surtout dans le
# quartier, le sport, la largesse et la famille.
activites:

  # — Le city-stade (sans porte : on se tient au grillage)
  - id: til_stade_jongles
    lieu: city_stade
    jeu: jongles
    label: "Jongler contre les gamins"
    texte: "Un gamin de la tour A te lance le ballon par-dessus le grillage : « Le record, c'est quarante-deux. C'est moi. » Les autres comptent tout haut, en avance d'un chiffre, pour te faire rater."
    textes:
      - "Un gamin de la tour A te lance le ballon par-dessus le grillage : « Le record, c'est quarante-deux. C'est moi. » Les autres comptent tout haut, en avance d'un chiffre, pour te faire rater."
      - "Les gamins font cercle autour de toi sur le terrain pelé. Le plus petit tient le compte sur ses doigts, et quand il n'a plus de doigts, il emprunte ceux de son voisin."
      - "On t'a donné le ballon des grands, celui qui a une hernie sur le côté. « Avec un ballon rond, tout le monde jongle. Celui-là, c'est pour savoir. »"
    habitude: sport
    tranches: 1
    francs: 0
    heures: [aprem, soir]

  - id: til_stade_ballon
    lieu: city_stade
    label: "Un ballon neuf aux gamins"
    texte: "Tu passes un ballon neuf par-dessus le grillage, encore dans son filet. Personne ne dit merci : les gamins se jettent dessus, et le plus grand le met sous son maillot pour le sentir gonflé."
    textes:
      - "Tu passes un ballon neuf par-dessus le grillage, encore dans son filet. Personne ne dit merci : les gamins se jettent dessus, et le plus grand le met sous son maillot pour le sentir gonflé."
      - "Le vieux ballon est passé sous un scooter. Tu en rapportes un neuf de la boutique du boulevard. Le soir même, quelqu'un a écrit ton prénom dessus, au feutre, pour que personne ne le vole."
      - "Les gamins se disputent pour savoir qui gardera le ballon neuf la nuit. Ils finissent par voter. Le vote dure plus longtemps que le match."
    habitude: largesse
    tranches: 0
    francs: -120
    jauges: {tribunes: 1}
    heures: [aprem, soir]

  - id: til_stade_tirs_rachid
    lieu: city_stade
    jeu: penalty
    si: "annee <= 2009"
    avec: haddouche
    label: "Les tirs au but avec Rachid"
    texte: "Rachid met un gamin de douze ans dans les buts et te tend le ballon : « Cinq tirs. S'il en arrête un, tu paies les sodas. » Le gamin crache dans ses gants, qui sont des gants de vaisselle."
    textes:
      - "Rachid met un gamin de douze ans dans les buts et te tend le ballon : « Cinq tirs. S'il en arrête un, tu paies les sodas. » Le gamin crache dans ses gants, qui sont des gants de vaisselle."
      - "Rachid trace le point de penalty à la craie, à huit pas, pas onze : « Ici, les buts sont petits et les gamins aussi. » Le gardien de la tour B sautille sur sa ligne en te regardant les pieds."
      - "Rachid chronomètre l'élan, son chronomètre fêlé dans la paume : « Trop long. Les grands prennent trois pas. Les autres en prennent six, et ils tirent à côté. »"
    habitude: sport
    tranches: 1
    francs: 0
    heures: [aprem, soir]

  - id: til_stade_mercredi
    lieu: city_stade
    si: "annee >= 2010"
    avec: cazal
    label: "La séance du mercredi"
    texte: "Cazal te confie six gamins de dix ans et un sac de plots : « Passes à deux touches. Pas de dribble, même s'ils pleurent. » Ils pleurent un peu, puis ils se passent le ballon."
    textes:
      - "Cazal te confie six gamins de dix ans et un sac de plots : « Passes à deux touches. Pas de dribble, même s'ils pleurent. » Ils pleurent un peu, puis ils se passent le ballon."
      - "Mercredi après-midi, quarante gamins, quatre ateliers. Cazal siffle les rotations sans regarder sa montre. Ton atelier est celui des têtes : personne ne veut y aller, tout le monde y passe."
      - "Une mère reste derrière le grillage toute la séance, le sac de courses à la main. Cazal dit tout bas : « Son fils a eu une lettre d'un club. Elle veut voir qui le regarde. »"
    jours: [mer]
    habitude: quartier
    tranches: 1
    francs: 0
    heures: [aprem]

  # — La maison de quartier
  - id: til_mq_babyfoot
    lieu: maison_quartier
    jeu: babyfoot
    label: "Baby-foot contre les grands"
    texte: "Le baby-foot de la maison de quartier a un joueur décapité au milieu de terrain, qu'on appelle le Capitaine. Deux grands de la tour D t'attendent, les poignets déjà en sueur."
    textes:
      - "Le baby-foot de la maison de quartier a un joueur décapité au milieu de terrain, qu'on appelle le Capitaine. Deux grands de la tour D t'attendent, les poignets déjà en sueur."
      - "La règle est écrite au marqueur sur le bois : pas de roulette, pas de pissette, pas de rire quand l'autre perd. La troisième est la seule qu'on respecte."
      - "Les petits font la queue pour jouer le gagnant. Ils comptent les buts à voix haute, et ils comptent aussi les tiens, quand tu en marques un qu'ils n'ont pas vu entrer."
    habitude: quartier
    tranches: 0
    francs: -2
    heures: [aprem, soir]

  - id: til_mq_permanence
    lieu: maison_quartier
    si: "annee <= 2011"
    avec: kobiela
    label: "La permanence des papiers"
    texte: "Germaine tape, tu dictes. Un homme de la barre E apporte une lettre de la Caisse qu'il n'a pas osé ouvrir. Germaine la lit d'abord, en silence, puis elle lui dit que ce n'est rien."
    textes:
      - "Germaine tape, tu dictes. Un homme de la barre E apporte une lettre de la Caisse qu'il n'a pas osé ouvrir. Germaine la lit d'abord, en silence, puis elle lui dit que ce n'est rien."
      - "Tu remplis des formulaires en trois exemplaires pour une dame qui ne sait pas écrire son année de naissance. Germaine la lui souffle sans regarder sa fiche. Elle la connaît par cœur."
      - "La machine de 1971 saute les e. Germaine les rajoute au stylo, un par un, sur les trois exemplaires. « La préfecture ne lit pas les e. Les gens, si. »"
    jours: [mar, jeu]
    habitude: quartier
    tranches: 1
    francs: 0
    heures: [matin]

  - id: til_mq_devoirs
    lieu: maison_quartier
    si: "annee >= 2012"
    avec: nawel
    label: "L'aide aux devoirs"
    texte: "Nawel t'assoit à côté d'un gamin de la tour C et d'un problème de robinets qui fuient. Il veut savoir combien tu gagnes. Tu lui dis de finir le problème d'abord. Il le finit, faux."
    textes:
      - "Nawel t'assoit à côté d'un gamin de la tour C et d'un problème de robinets qui fuient. Il veut savoir combien tu gagnes. Tu lui dis de finir le problème d'abord. Il le finit, faux."
      - "Une rédaction sur le métier rêvé. Trois gamins sur huit ont écrit footballeur ; un a écrit agent de footballeur. Nawel souligne son mot au crayon, sans rien ajouter."
      - "La petite du sixième lit tout haut une page d'histoire. Elle bute sur un mot, recommence trois fois, et refuse ton aide. À la quatrième, elle passe. Elle te regarde, pour vérifier."
    habitude: famille
    tranches: 1
    francs: 0
    heures: [aprem, soir]

  - id: til_mq_demarches
    lieu: maison_quartier
    si: "annee >= 2015"
    avec: nawel
    label: "Les démarches en ligne"
    texte: "Un vieil homme pose son téléphone sur la table comme une chose qui mord. Nawel te passe le mot de passe, écrit sur un ticket de caisse. Tu remplis sa déclaration pendant qu'il raconte 1964."
    textes:
      - "Un vieil homme pose son téléphone sur la table comme une chose qui mord. Nawel te passe le mot de passe, écrit sur un ticket de caisse. Tu remplis sa déclaration pendant qu'il raconte 1964."
      - "La file des démarches en ligne commence à neuf heures et finit quand la batterie de Nawel lâche. Ce matin, il reste six personnes et onze pour cent."
    habitude: quartier
    tranches: 1
    francs: 0
    heures: [matin, midi]

  - id: til_mq_sortie
    lieu: maison_quartier
    label: "Payer le car de la sortie"
    texte: "Sur le panneau de liège, la sortie de l'été : le lac, une journée, il manque le car. Tu poses l'enveloppe sur le bureau. Le soir, la liste des inscrits a doublé, au crayon."
    textes:
      - "Sur le panneau de liège, la sortie de l'été : le lac, une journée, il manque le car. Tu poses l'enveloppe sur le bureau. Le soir, la liste des inscrits a doublé, au crayon."
      - "Le car de la sortie est payé. Les gamins de la barre E apprennent qu'il y aura des toilettes à bord et ne parlent plus que de ça. Le lac, ils verront sur place."
    habitude: largesse
    tranches: 0
    francs: -300
    jauges: {tribunes: 1}
    heures: [matin, aprem]

  # — Le Snack des Tilleuls
  - id: til_snack_cornet
    lieu: snack_tilleuls
    si: "annee <= 2015"
    avec: hagop
    label: "Un cornet chez Hagop"
    texte: "Hagop sert le cornet dans une page de L'Écho, la page des sports à l'extérieur. Il commente la cassette au-dessus de la caisse sans la regarder : il connaît le match par cœur."
    textes:
      - "Hagop sert le cornet dans une page de L'Écho, la page des sports à l'extérieur. Il commente la cassette au-dessus de la caisse sans la regarder : il connaît le match par cœur."
      - "La friteuse chante faux. Hagop secoue le panier deux fois, jamais trois, et sale de haut, comme on bénit. Les gamins du banc attendent les frites tombées sur le comptoir."
      - "Hagop te garde le tabouret du bout, celui qui ne bouge pas. « Les trois autres boitent. Celui-là, c'est pour les gens qui ont déjà assez boité. »"
    habitude: quartier
    tranches: 1
    francs: -15
    heures: [midi, aprem, soir]

  - id: til_snack_replay
    lieu: snack_tilleuls
    si: "annee <= 2015"
    special: tele
    label: "Le replay du samedi"
    texte: "Quatre tabourets devant le petit poste au-dessus de la caisse. La cassette de samedi repasse pour la neuvième fois. Les gamins disent les actions juste avant qu'elles arrivent."
    textes:
      - "Quatre tabourets devant le petit poste au-dessus de la caisse. La cassette de samedi repasse pour la neuvième fois. Les gamins disent les actions juste avant qu'elles arrivent."
      - "La bande saute à la soixantième minute, toujours au même endroit. Tout le snack se tait pendant le saut, comme si un joueur était resté coincé dedans."
    habitude: comptoir
    tranches: 1
    francs: -8
    heures: [midi, aprem, soir]

  - id: til_snack_dernier_service
    lieu: snack_tilleuls
    si: "annee >= 2016"
    avec: aram
    label: "Le dernier service d'Aram"
    texte: "Deux heures. Aram sert par la fenêtre à ceux qui ne veulent pas entrer. Toi, il te fait asseoir dedans, sous le téléphone éteint, et il te dit qui vient de passer, sans les noms."
    textes:
      - "Deux heures. Aram sert par la fenêtre à ceux qui ne veulent pas entrer. Toi, il te fait asseoir dedans, sous le téléphone éteint, et il te dit qui vient de passer, sans les noms."
      - "Un scooter s'arrête, repart, revient. Aram pose un cornet sur le rebord de la fenêtre sans qu'on l'ait commandé. Il dit : « Celui-là ne paie jamais. Il surveille la cité pour moi. »"
      - "Aram nettoie la friteuse pendant que tu manges. Il parle de son père, et d'un but de 1987 que personne n'a vu : la bande de la cassette a sauté dessus, et le snack a crié quand même."
    habitude: nuit
    tranches: 0
    francs: -15
    heures: [nuit]

  - id: til_snack_banc
    lieu: snack_tilleuls
    label: "Les frites du banc"
    texte: "Tu paies les frites des gamins du banc. Ils viennent les chercher un par un, chacun dit son étage, et le patron les sert dans l'ordre des étages, du rez-de-chaussée au dixième."
    textes:
      - "Tu paies les frites des gamins du banc. Ils viennent les chercher un par un, chacun dit son étage, et le patron les sert dans l'ordre des étages, du rez-de-chaussée au dixième."
      - "Les gamins du banc mangent tes frites en silence, puis le plus grand revient poser une pièce sur le comptoir. « Pour le mien. Je paie le mien. » Les autres le regardent faire."
    habitude: largesse
    tranches: 0
    francs: -30
    heures: [aprem, soir]

  - id: til_snack_plonge
    lieu: snack_tilleuls
    roles: [joueur]
    si: "division >= 2"
    label: "La plonge du vendredi"
    texte: "Le vendredi soir, la plonge du snack : les paniers de la friteuse, les plateaux, le sol. On te paie en liquide, plié dans un ticket. Personne ne te reconnaît sous le tablier ; tant mieux."
    textes:
      - "Le vendredi soir, la plonge du snack : les paniers de la friteuse, les plateaux, le sol. On te paie en liquide, plié dans un ticket. Personne ne te reconnaît sous le tablier ; tant mieux."
      - "Deux heures de plonge, les mains dans l'eau grasse. Un gamin du banc te reconnaît par la fenêtre et ne dit rien à personne. Le lendemain, il te fait un signe, à la sortie du stade."
    jours: [ven]
    habitude: travail
    tranches: 1
    francs: 60
    max_jour: 1
    heures: [soir]

  # — La supérette
  - id: til_sup_courses_zohra
    lieu: superette
    si: "annee <= 2010"
    avec: zohra
    label: "Les courses chez Zohra"
    texte: "Zohra compte tes articles à voix haute, dans sa langue puis dans celle d'ici, pour vérifier. Elle met une orange en plus dans le sac sans la compter : « Pour la route. » Il n'y a pas de route."
    textes:
      - "Zohra compte tes articles à voix haute, dans sa langue puis dans celle d'ici, pour vérifier. Elle met une orange en plus dans le sac sans la compter : « Pour la route. » Il n'y a pas de route."
      - "Le crayon du cahier pend au bout de sa ficelle, contre la caisse. Une dame paie sa page en pièces jaunes. Zohra raye la ligne d'un trait droit, à la règle, et la dame sourit."
      - "Zohra te rend la monnaie en comptant tout haut et te demande des nouvelles du club comme on demande des nouvelles d'un malade : à voix basse, la main sur le comptoir."
    habitude: quartier
    tranches: 1
    francs: -20
    heures: [matin, midi, aprem, soir]

  - id: til_sup_courses_nordine
    lieu: superette
    si: "annee >= 2011"
    avec: nordine
    label: "Les courses chez Nordine"
    texte: "Nordine scanne tes articles et relit le prix sur l'écran, puis dans sa tête. Il marmonne les deux chiffres. Quand ils ne sont pas pareils, c'est l'écran qui a tort."
    textes:
      - "Nordine scanne tes articles et relit le prix sur l'écran, puis dans sa tête. Il marmonne les deux chiffres. Quand ils ne sont pas pareils, c'est l'écran qui a tort."
      - "Derrière la caisse, une chaise en plastique : celle de sa mère, le samedi. Nordine y pose ton sac pendant qu'il cherche ta monnaie. Personne d'autre n'a le droit d'y poser quoi que ce soit."
    habitude: quartier
    tranches: 1
    francs: -20
    heures: [matin, aprem, soir]

  - id: til_sup_page
    lieu: superette
    label: "Régler une page du cahier"
    texte: "Tu montres une page du cahier au hasard et tu la règles. Prénom, étage, des petites sommes depuis l'hiver. Le cahier ne dira jamais à la dame du septième qui a payé. Le quartier, si."
    textes:
      - "Tu montres une page du cahier au hasard et tu la règles. Prénom, étage, des petites sommes depuis l'hiver. Le cahier ne dira jamais à la dame du septième qui a payé. Le quartier, si."
      - "Une page de quatre lignes, du lait et des couches. Tu la règles. Le trait à la règle passe sur les quatre lignes d'un seul coup, et la page se tourne toute seule."
    habitude: largesse
    tranches: 0
    francs: -100
    jauges: {tribunes: 1}
    heures: [matin, midi, aprem, soir]

  - id: til_sup_livraison
    lieu: superette
    roles: [joueur]
    si: "division >= 2"
    label: "Monter les packs d'eau"
    texte: "L'ascenseur de la tour C est en panne. Tu montes les packs d'eau des vieux jusqu'au dixième, deux par deux. On te paie à la descente, et la dame du huitième te paie en plus en gâteaux secs."
    textes:
      - "L'ascenseur de la tour C est en panne. Tu montes les packs d'eau des vieux jusqu'au dixième, deux par deux. On te paie à la descente, et la dame du huitième te paie en plus en gâteaux secs."
      - "Six étages, quatre packs, une porte qui s'ouvre sur une télé allumée et un monsieur qui te reconnaît : « Tu montes mieux les escaliers que la balle. » Il te donne un pourboire quand même."
    habitude: travail
    tranches: 1
    francs: 40
    max_jour: 1
    heures: [matin, aprem]

  # — Le club de boxe
  - id: til_boxe_sac
    lieu: club_boxe
    si: "annee <= 2013"
    avec: kowal
    label: "Le sac avec Stan"
    texte: "Stan te met des gants qui sentent le vinaigre et te place devant le sac du fond : « Trois rounds. Tu respires quand tu frappes, pas après. » Il sonne la cloche avec le manche d'un balai."
    textes:
      - "Stan te met des gants qui sentent le vinaigre et te place devant le sac du fond : « Trois rounds. Tu respires quand tu frappes, pas après. » Il sonne la cloche avec le manche d'un balai."
      - "Stan tient le sac avec l'épaule et compte tes coups sans les regarder. À la fin du round, il dit un chiffre. C'est toujours trois de moins que ce que tu as compté."
      - "Sous la photo de Slimane, Stan te corrige la garde du bout de l'index, sans un mot. Les gamins de douze ans arrêtent de taper pour regarder quelqu'un de grand se faire corriger."
    habitude: sport
    tranches: 1
    francs: -10
    heures: [aprem, soir]

  - id: til_boxe_appuis
    lieu: club_boxe
    si: "annee >= 2014"
    avec: melissa
    label: "Le travail d'appuis"
    texte: "Mélissa trace une échelle à la craie sur le parquet de l'ancien gymnase : « Les pieds avant les poings. » Elle compte dans la langue de son grand-père. Tu ne sais pas compter avec elle."
    textes:
      - "Mélissa trace une échelle à la craie sur le parquet de l'ancien gymnase : « Les pieds avant les poings. » Elle compte dans la langue de son grand-père. Tu ne sais pas compter avec elle."
      - "Mélissa te fait danser autour d'un plot pendant six minutes, sans un coup. « Les footballeurs qui viennent ici font ça mieux. Eux, on les paie pour avoir des pieds. »"
      - "Mélissa te prend le pouls à la fin, deux doigts sous la mâchoire, les yeux sur l'horloge. Elle ne dit pas le chiffre. Elle hoche la tête, comme on hoche la tête devant un vieux moteur."
    habitude: sport
    tranches: 1
    francs: -10
    heures: [aprem, soir]

  - id: til_boxe_corde
    lieu: club_boxe
    label: "La corde sous l'auvent"
    texte: "Sous l'auvent de tôle, une corde à sauter et le bruit des gamins à l'intérieur. Tu sautes jusqu'à ce que la tôle chante sous la pluie, ou jusqu'à ce que tes mollets disent non."
    textes:
      - "Sous l'auvent de tôle, une corde à sauter et le bruit des gamins à l'intérieur. Tu sautes jusqu'à ce que la tôle chante sous la pluie, ou jusqu'à ce que tes mollets disent non."
      - "Deux gamins sautent à côté de toi en se moquant de ton rythme. Au bout de cinq minutes, ils sautent à ton rythme sans s'en rendre compte. Au bout de dix, ils se taisent."
    habitude: sport
    tranches: 1
    francs: 0
    heures: [aprem, soir]

  - id: til_boxe_licence
    lieu: club_boxe
    label: "Payer la licence d'un gamin"
    texte: "Tu paies la licence d'un gamin de la barre E dont la mère a dit non. Le gamin ne saura pas qui. Il viendra taper trois fois par semaine au lieu d'attendre devant le hall."
    textes:
      - "Tu paies la licence d'un gamin de la barre E dont la mère a dit non. Le gamin ne saura pas qui. Il viendra taper trois fois par semaine au lieu d'attendre devant le hall."
      - "Une licence de plus sur le tableau de liège, un prénom au feutre. Le gamin arrive le lendemain avec des gants trop grands et ne les enlève pas de la séance, même pour boire."
    habitude: largesse
    tranches: 0
    francs: -150
    heures: [aprem, soir]

  # — Le salon des Tilleuls
  - id: til_salon_coupe_scarpelli
    lieu: salon_tilleuls
    si: "annee <= 2017"
    avec: scarpelli
    label: "Une coupe chez Scarpelli"
    texte: "Scarpelli coupe sans te regarder, les yeux dans le miroir. Il te dit qui s'est assis avant toi dans le fauteuil, et pourquoi il est venu un mardi : on ne se fait pas couper un mardi."
    textes:
      - "Scarpelli coupe sans te regarder, les yeux dans le miroir. Il te dit qui s'est assis avant toi dans le fauteuil, et pourquoi il est venu un mardi : on ne se fait pas couper un mardi."
      - "La serviette chaude, le rasoir, le silence. Scarpelli fredonne une chanson qu'il ne finit jamais. À la fin, il te montre ta nuque dans le petit miroir, comme une preuve."
      - "Un père de la tour A attend sur le banc avec son fils. Scarpelli parle de l'agent qui est passé hier, plus fort que d'habitude. Le père écoute sans lever les yeux de son journal."
    habitude: quartier
    tranches: 1
    francs: -40
    heures: [matin, midi, aprem]

  - id: til_salon_coupe_bilal
    lieu: salon_tilleuls
    si: "annee >= 2018"
    avec: bilal
    label: "Une coupe chez Bilal"
    texte: "Bilal règle son téléphone sur le trépied, filme ta nuque trente secondes, puis l'éteint. « Le reste, c'est entre nous. » Il te dit ce qu'il n'a pas posté cette semaine."
    textes:
      - "Bilal règle son téléphone sur le trépied, filme ta nuque trente secondes, puis l'éteint. « Le reste, c'est entre nous. » Il te dit ce qu'il n'a pas posté cette semaine."
      - "Bilal te coupe dans le fauteuil de droite. Le fauteuil du milieu reste vide, sa housse pliée sur l'accoudoir. « C'est celui de Scarpelli. Les signatures, seulement. »"
    habitude: quartier
    tranches: 1
    francs: -40
    heures: [matin, midi, aprem]

  - id: til_salon_banc
    lieu: salon_tilleuls
    label: "Attendre son tour"
    texte: "Le banc du salon, les journaux de la semaine dernière. Deux pères parlent d'un essai à Valentienne comme d'un mariage arrangé. Le coiffeur ne dit rien ; il coupe plus lentement."
    textes:
      - "Le banc du salon, les journaux de la semaine dernière. Deux pères parlent d'un essai à Valentienne comme d'un mariage arrangé. Le coiffeur ne dit rien ; il coupe plus lentement."
      - "Sur le banc, un vieux compte les photos du mur des signatures à voix basse. Il s'arrête sur une, en 1983, et dit le nom du gamin comme on dit celui d'un mort. Il est vivant ; il est loin."
      - "Le néon grésille. Quelqu'un raconte qu'un club de la capitale a offert une machine à laver à une mère de la tour D. Personne ne rit. La mère a dit oui."
    habitude: quartier
    tranches: 1
    francs: 0
    heures: [matin, midi, aprem]

  - id: til_salon_gamin
    lieu: salon_tilleuls
    label: "La coupe d'un gamin"
    texte: "Un gamin de la tour B a un essai demain et pas de quoi se faire couper. Tu poses l'argent sur le comptoir. Il ressort avec une nuque trop nette, qu'il touche toutes les deux minutes."
    textes:
      - "Un gamin de la tour B a un essai demain et pas de quoi se faire couper. Tu poses l'argent sur le comptoir. Il ressort avec une nuque trop nette, qu'il touche toutes les deux minutes."
      - "Tu paies la coupe du petit qui passe son examen. Le coiffeur lui fait la raie du côté gauche, « comme les gens qui réussissent ». Le petit ne sait pas lequel est son côté gauche."
    habitude: largesse
    tranches: 0
    francs: -40
    heures: [matin, midi, aprem]

  # — La tour C
  - id: til_tourc_courrier
    lieu: tour_c
    si: "annee <= 2008"
    avec: marthe
    label: "Le courrier avec Marthe"
    texte: "Marthe trie le courrier sur la table de la loge et te tend les lettres par étage. Elle reconnaît les mauvaises nouvelles à l'enveloppe ; elle les met en dessous, pour que ça attende."
    textes:
      - "Marthe trie le courrier sur la table de la loge et te tend les lettres par étage. Elle reconnaît les mauvaises nouvelles à l'enveloppe ; elle les met en dessous, pour que ça attende."
      - "Marthe redresse une boîte aux lettres cabossée avec le talon de sa chaussure. Elle dit à qui elle est, ce qu'il reçoit, et ce qu'il ne reçoit plus depuis que sa femme est partie."
      - "La boîte du neuvième n'a pas de nom non plus. Marthe y glisse les prospectus, par principe. « Si un jour quelqu'un l'ouvre, il saura que quelqu'un pensait à lui. »"
    habitude: quartier
    tranches: 0
    francs: 0
    heures: [matin]

  - id: til_tourc_ronde
    lieu: tour_c
    si: "annee >= 2009"
    avec: issa
    label: "La ronde avec Issa"
    texte: "Issa change les ampoules étage par étage, toi tu tiens l'escabeau. Au sixième, une porte s'entrouvre sur une vieille dame qui offre un café à Issa, puis un second, pour toi."
    textes:
      - "Issa change les ampoules étage par étage, toi tu tiens l'escabeau. Au sixième, une porte s'entrouvre sur une vieille dame qui offre un café à Issa, puis un second, pour toi."
      - "Issa note dans son carnet de la tour : une naissance au troisième, une fuite au septième, un départ au dixième. Il écrit les trois de la même écriture, sans hiérarchie."
      - "Au neuvième, Issa ralentit devant la porte et fait passer sa lampe sur la sonnette, par habitude. Il ne dit rien. Il reprend l'escalier en sifflant un air du Kambara."
    habitude: quartier
    tranches: 1
    francs: 0
    heures: [soir]

  - id: til_tourc_courses
    lieu: tour_c
    label: "Les courses du huitième"
    texte: "L'ascenseur est en panne, un jour sur deux, et c'est ce jour-là. Tu montes les courses de la dame du huitième, qui te suit en comptant les marches pour toi, à voix haute."
    textes:
      - "L'ascenseur est en panne, un jour sur deux, et c'est ce jour-là. Tu montes les courses de la dame du huitième, qui te suit en comptant les marches pour toi, à voix haute."
      - "Huit étages, un sac de pommes de terre, un cabas de lait. Sur le palier du huitième, la dame a laissé une chaise pour qu'on souffle. Elle t'interdit de t'en servir : c'est la sienne."
    habitude: quartier
    tranches: 1
    francs: 0
    heures: [matin, midi, aprem]

  - id: til_tourc_escalier
    lieu: tour_c
    label: "L'escalier, avec les grands"
    texte: "Les grands du sixième te font une place sur une marche. Ils parlent du match de samedi comme d'une injustice personnelle. Quand l'ampoule s'éteint, personne ne se lève pour la rallumer."
    textes:
      - "Les grands du sixième te font une place sur une marche. Ils parlent du match de samedi comme d'une injustice personnelle. Quand l'ampoule s'éteint, personne ne se lève pour la rallumer."
      - "Dans l'escalier, on se passe un paquet de biscuits et des noms de joueurs. Le plus jeune te demande si c'est vrai, ce qu'on dit sur le vestiaire. Les autres le font taire, pour toi."
      - "Un train passe au bout des jardins, la tour vibre un peu. Les grands disent l'heure sans regarder : le dernier pour Portclair. Après lui, il n'y a plus que la Rive qui bouge."
    habitude: nuit
    tranches: 0
    francs: 0
    heures: [soir, nuit]

# ═══════════════════════════════════════════════════════════════ LES SCÈNES
# La vie des gens (gardée par le lien et par leur époque), les dettes qu'on vient réclamer
# (une première fois, puis la suivante, rejouable), et la vie du quartier sans visage connu.
# Les passations se jouent ici : le cahier de Rachid, la boîte de fiches, le petit poste, la
# cloche, l'apprenti, le nom du neuvième.
# `annee` est l'année où commence la saison : la barre E2 se vide en 2012 et tombe en 2013.
scenes:

  # ─────────────────────────────────────────────── Rachid Haddouche, le city-stade
  - id: vi.sc.haddouche_lumiere
    titre: "Les mâts éteints"
    lieu: city_stade
    tranches: [soir]
    qui: haddouche
    si: "relation.haddouche >= 1 && annee <= 1998"
    texte: "Le grillage est noir à sept heures : on a volé le câble des deux mâts, et la mairie n'a pas de quoi le remplacer. Rachid tient une lampe de chantier au bout d'une rallonge tirée du hall de la tour A."
    choix:
      - label: "Je paie le câble"
        francs: -300
        reponse: "L'électricien passe le jeudi. Le soir, les mâts se rallument d'un coup, et quarante gamins crient comme pour un but. Rachid débranche sa lampe de chantier et la range sans un mot."
        effets: {relation: {haddouche: 1}, jauges: {tribunes: 1}}
      - label: "La mairie doit payer"
        reponse: "« La mairie doit beaucoup de choses. » Un mois de matchs à la lampe de chantier. Le ballon disparaît dans le noir à chaque centre ; les gamins apprennent à jouer à terre."
        effets: {relation: {haddouche: -1}}

  - id: vi.sc.haddouche_recruteur
    titre: "L'homme à l'imperméable"
    roles: [entraineur, joueur, ds, president]
    lieu: city_stade
    tranches: [aprem]
    qui: haddouche
    si: "relation.haddouche >= 2 && annee <= 2006"
    texte: "Un recruteur en imperméable regarde le match depuis une heure. Rachid, sans tourner la tête : « Il attend qu'ils perdent. C'est comme ça qu'il choisit. Va lui dire de partir. »"
    choix:
      - label: "Je vais lui parler"
        reponse: "Il t'écoute, poli, et note ton nom sur un carnet à spirale. Il s'en va. Le lendemain, un coup de téléphone : on te demande depuis quand tu chasses les recruteurs des terrains."
        effets: {relation: {haddouche: 1}, jauges: {direction: -1}}
      - label: "Qu'il regarde"
        reponse: "Il reste jusqu'au bout. Les gamins perdent cinq à un sans savoir pourquoi ils ont si mal joué. Rachid range les chasubles sans te dire bonsoir."
        effets: {relation: {haddouche: -1}}

  - id: vi.sc.haddouche_cle
    titre: "Le cahier et la clé"
    lieu: city_stade
    tranches: [soir]
    qui: haddouche
    si: "relation.haddouche >= 2 && annee == 2009"
    texte: "Rachid a tendu la deuxième clé du cadenas à Cazal par la vitre de sa voiture, sans couper le moteur. Il lui reste le cahier : les noms, les pieds, et la marge. « Je le lui donne, ou je le garde ? »"
    choix:
      - label: "Donne-lui le cahier"
        reponse: "Cazal le lit sur le banc jusqu'à l'extinction des mâts. Le lendemain, elle ajoute une colonne à droite de la marge : ceux qui sont revenus."
        effets: {relation: {haddouche: 1, cazal: 1}}
      - label: "Garde-le"
        reponse: "Il le glisse sous le siège de sa voiture. Cazal recommence un cahier à zéro, sans marge. Les recruteurs d'avant ne sont plus écrits nulle part, sauf sous un siège."
        effets: {relation: {haddouche: 1, cazal: -1}}

  - id: vi.sc.haddouche_dette
    titre: "La mère du gamin"
    lieu: city_stade
    tranches: [soir]
    qui: haddouche
    si: "flag(dette_haddouche)"
    texte: "Rachid t'attend au grillage, le cahier fermé sous le bras. « Le gamin du cahier : un agent de Valdorne a écrit à sa mère. Monte chez elle avec moi, et répète-lui ce que tu as promis au petit. »"
    choix:
      - label: "Je monte chez elle"
        reponse: "Quatrième étage de la tour B, un café trop sucré. La mère te fait répéter deux fois, puis elle déchire la lettre de Valdorne en huit. Au club, ta promesse devient une ligne de budget."
        effets: {relation: {haddouche: 1}, jauges: {caisse: -1}, clear: [dette_haddouche]}
      - label: "Je n'ai rien promis"
        reponse: "Rachid rouvre le cahier et raye une ligne au stylo, sans appuyer. « Moi, si. » Le gamin signe à Valdorne en juin. Sa mère ne descend plus au grillage."
        effets: {relation: {haddouche: -2}, jauges: {vestiaire: -1}, clear: [dette_haddouche]}

  - id: vi.sc.haddouche_dette_bis
    titre: "Une licence de plus"
    lieu: city_stade
    tranches: [aprem, soir]
    qui: haddouche
    si: "flag(dette_haddouche) && mission(vi.sc.haddouche_dette)"
    rejouable: true
    texte: "Rachid pose une licence vierge sur le banc : « Le gamin que je t'ai amené cette saison n'a ni licence ni chaussures. Sa mère fait des ménages à Portclair. Celui-là aussi, c'est ta dette. »"
    choix:
      - label: "Je paie la licence"
        francs: -250
        reponse: "Le gamin arrive le lendemain avec des chaussures neuves qu'il porte à la main jusqu'au terrain, pour ne pas les salir. Rachid coche une case dans le cahier, sans rien dire."
        effets: {jauges: {tribunes: 1}, clear: [dette_haddouche]}
      - label: "Ce n'est plus mon affaire"
        reponse: "Rachid glisse la licence dans le cahier. « Elle attendra. » Le gamin joue en baskets de ville jusqu'à l'hiver. Rachid ne te fait plus signe par-dessus le grillage."
        effets: {relation: {haddouche: -2}, clear: [dette_haddouche]}

  # ─────────────────────────────────────────────── Telma Cazal, le city-stade
  - id: vi.sc.cazal_tablette
    titre: "La tablette"
    lieu: city_stade
    tranches: [aprem]
    qui: cazal
    si: "relation.cazal >= 1 && annee >= 2018"
    texte: "Un homme en costume filme les moins de douze ans à travers le grillage, avec une tablette. Cazal s'arrête de siffler : « Un costume ne parle pas à une éducatrice. À toi, si. Tu y vas, ou j'y vais ? »"
    choix:
      - label: "J'y vais"
        reponse: "Il range sa tablette, il sourit, il te tend sa carte : un club de la capitale. Il s'en va. Le lendemain, il filme depuis le parking, avec un zoom, et Cazal le sait."
        effets: {relation: {cazal: 1}}
      - label: "Il a le droit"
        reponse: "Cazal lui parle elle-même, trop fort. Les mères arrivent de la place, une à une. L'homme repart en marche arrière. Le soir, Cazal te demande ce que ça t'aurait coûté."
        effets: {relation: {cazal: -1}, jauges: {tribunes: -1}}

  - id: vi.sc.cazal_filles
    titre: "Les numéros au feutre"
    lieu: city_stade
    tranches: [aprem]
    qui: cazal
    si: "relation.cazal >= 2 && annee >= 2015"
    texte: "Cazal a monté une équipe de filles : onze gamines, un tournoi à Montbéliac, pas de maillots. Elles jouent en t-shirts blancs, les numéros au feutre. « Le feutre part au lavage. Elles, non. »"
    choix:
      - label: "Je paie les maillots"
        francs: -400
        reponse: "Les maillots arrivent trop grands. Les filles les portent pour aller à l'école le lundi, par-dessus le manteau. Cazal colle la photo de l'équipe sur la vitre de la maison de quartier."
        effets: {relation: {cazal: 1}, jauges: {tribunes: 1}}
      - label: "Demande à la mairie"
        reponse: "La mairie répond en trois mois : un formulaire, une commission. Le tournoi se joue en t-shirts. Elles perdent en demi-finale, et elles gardent les numéros au feutre."
        effets: {relation: {cazal: -1}}

  - id: vi.sc.cazal_franchise
    titre: "Douze ans, la capitale"
    lieu: city_stade
    tranches: [aprem, soir]
    qui: cazal
    si: "relation.cazal >= 2 && annee >= 2040"
    texte: "Une franchise veut le meilleur de ses moins de treize ans : logé, nourri, scolarisé, un contrat de dix pages. La mère hésite. Cazal te tend le contrat : « Toi, tu le laisserais partir ? »"
    choix:
      - label: "Qu'il reste ici"
        reponse: "Cazal porte ta phrase à la mère. Elle pleure, puis elle refuse. Le gamin ne t'adresse plus la parole pendant un mois. Le mois suivant, il marque contre les grands."
        effets: {relation: {cazal: 1}, jauges: {tribunes: 1}}
      - label: "C'est sa chance"
        reponse: "Le gamin part un dimanche, un sac neuf de la franchise sur l'épaule. Cazal raye son nom de la feuille du mercredi, au feutre qui ne s'efface pas."
        effets: {relation: {cazal: -1}}

  # ─────────────────────────────────────────────── Germaine Kobiela, la maison de quartier
  - id: vi.sc.kobiela_machine
    titre: "La machine de 1971"
    lieu: maison_quartier
    tranches: [matin]
    qui: kobiela
    si: "relation.kobiela >= 1 && annee <= 2004"
    texte: "La machine de la permanence ne saute plus seulement les e : elle ne tape plus rien. Germaine a douze dossiers pour la préfecture jeudi. « Le réparateur est à Portclair. Il ne monte jamais ici. »"
    choix:
      - label: "Je l'emmène à Portclair"
        francs: -150
        reponse: "Tu la portes au réparateur par le car de huit heures, sur tes genoux. Jeudi, les douze dossiers partent. Germaine te tape un mot de remerciement ; il y manque tous les e."
        effets: {relation: {kobiela: 1}}
      - label: "Prenez un ordinateur"
        reponse: "« Avec quel argent ? » Elle recopie les douze dossiers à la main, la nuit, en majuscules. La préfecture en refuse trois pour illisibilité. Elle ne t'en parle pas."
        effets: {relation: {kobiela: -1}}

  - id: vi.sc.kobiela_fiches
    titre: "La boîte de fiches"
    lieu: maison_quartier
    tranches: [aprem, soir]
    qui: kobiela
    si: "relation.kobiela >= 2 && annee == 2011"
    texte: "Germaine part à la retraite l'été prochain. Sur ses genoux, la boîte de fiches bristol : tout le quartier depuis 1968, les dettes, les secrets. « Je la laisse à Nawel, ou je la brûle ? »"
    choix:
      - label: "Laissez-la à Nawel"
        reponse: "Germaine pose la boîte sur le bureau de Nawel sans un mot sur ce qu'elle contient. Nawel ne l'ouvre pas devant elle. Elle l'ouvre le soir même, et elle reste jusqu'à minuit."
        effets: {relation: {kobiela: 1, nawel: 1}}
      - label: "Brûlez-la"
        reponse: "Germaine la brûle dans le bidon derrière la maison, fiche par fiche, en lisant chaque prénom tout bas. Ça prend la nuit. Le matin, Nawel trouve la boîte vide sur son bureau."
        effets: {relation: {kobiela: 1, nawel: -1}}

  - id: vi.sc.kobiela_dette
    titre: "Le guichet du mardi"
    lieu: maison_quartier
    tranches: [matin]
    qui: kobiela
    si: "flag(dette_kobiela)"
    texte: "Germaine met son manteau : « La famille du huitième de la barre E passe au guichet de la préfecture mardi. Avec un nom connu à côté d'eux, le dossier ne se perd pas. Le tien. Tu me dois un mardi. »"
    choix:
      - label: "Je viens mardi"
        reponse: "Deux heures debout dans la file, dix minutes au guichet. La dame reconnaît ton nom, et le dossier monte d'une pile. Le soir, un appel : on t'a vu à la préfecture, on voudrait savoir pour qui."
        effets: {jauges: {direction: -1, tribunes: 1}, clear: [dette_kobiela]}
      - label: "Je ne peux pas"
        reponse: "« Personne ne peut, le mardi. » Elle y va seule avec la famille. Le dossier se perd, puis se retrouve, en avril. Germaine range ta fiche plus loin dans la boîte."
        effets: {relation: {kobiela: -2}, clear: [dette_kobiela]}

  - id: vi.sc.kobiela_dette_bis
    titre: "Le stand des crêpes"
    lieu: maison_quartier
    tranches: [aprem]
    jours: [dim]
    qui: kobiela
    si: "flag(dette_kobiela) && mission(vi.sc.kobiela_dette)"
    rejouable: true
    texte: "La kermesse de la maison de quartier. Germaine a écrit ton nom en gros sur l'affiche, sans te demander : « Une heure au stand des crêpes. Tu me dois bien une heure. »"
    choix:
      - label: "Je tiens le stand"
        reponse: "Une heure de crêpes, ratées pour la plupart ; la file va jusqu'à la fontaine. Les gamins mangent les ratées. La photo du stand sort dans L'Écho, une tache de pâte sur ta manche."
        effets: {jauges: {tribunes: 2, direction: -1}, clear: [dette_kobiela]}
      - label: "Rayez mon nom"
        reponse: "Elle le raye au feutre sur toutes les affiches, une par une, dans la journée. Le quartier lit les ratures plus attentivement que les noms."
        effets: {relation: {kobiela: -2}, jauges: {tribunes: -1}, clear: [dette_kobiela]}

  # ─────────────────────────────────────────────── Nawel Assous, la maison de quartier
  - id: vi.sc.nawel_septieme
    titre: "Le dernier du septième"
    lieu: maison_quartier
    tranches: [aprem]
    qui: nawel
    si: "relation.nawel >= 1 && annee == 2012"
    texte: "La barre E2 est presque vide. Au septième, le vieux Tahar refuse les cartons de l'office. Nawel : « Il a ta photo de L'Écho punaisée dans sa cuisine. Va lui dire, toi, que la date est fixée. »"
    choix:
      - label: "Je monte le voir"
        reponse: "Sept étages à pied, l'ascenseur est déjà coupé. Le vieux Tahar te sert un thé et te raconte le derby de 1971 jusqu'à la nuit. Le lendemain, il descend ses cartons, un par un."
        effets: {relation: {nawel: 1}, jauges: {tribunes: 1}}
      - label: "Ce n'est pas à moi"
        reponse: "Il reste. Nawel sait déjà comment ça finira : les huissiers, le matin de la démolition, et lui sur sa chaise, l'écharpe du club sur les genoux. Elle ne te regarde plus."
        effets: {relation: {nawel: -1}}

  - id: vi.sc.nawel_bracelets
    titre: "Cinquante bracelets"
    lieu: maison_quartier
    tranches: [matin, aprem]
    qui: nawel
    si: "relation.nawel >= 2 && annee >= 2024 && annee <= 2030"
    texte: "Un sponsor offre cinquante bracelets aux gamins de la maison de quartier, « pour le sport ». Nawel lit le contrat à voix haute : les données appartiennent au sponsor. « Je signe, ou pas ? »"
    choix:
      - label: "Ne signez pas"
        reponse: "Nawel renvoie les bracelets dans leur carton. Le programme perd sa subvention. Elle fait les séances quand même, le samedi, avec un chronomètre qui date de Rachid."
        effets: {relation: {nawel: 1}}
      - label: "Signez, c'est gratuit"
        reponse: "Les gamins portent les bracelets trois mois. Puis un club de la capitale appelle une mère du sixième : il a vu les courbes de son fils. Personne ne lui avait parlé de son fils."
        effets: {relation: {nawel: -1}, jauges: {tribunes: -1}}

  - id: vi.sc.nawel_dette
    titre: "Le déjeuner du maire"
    lieu: maison_quartier
    tranches: [matin]
    qui: nawel
    si: "flag(dette_nawel)"
    texte: "La mairie veut fermer la maison de quartier le samedi, faute d'argent. Nawel : « Le maire déjeune avec toi jeudi, je l'ai arrangé. Tu me dois un gymnase en janvier ; je te demande un déjeuner. »"
    choix:
      - label: "Je déjeunerai avec lui"
        reponse: "Deux heures au café de la Mairie. Il parle du stade ; tu parles des samedis des Tilleuls. Au dessert, il note quelque chose. La maison reste ouverte, et on dit que tu fais de la politique."
        effets: {jauges: {direction: -1, tribunes: 1}, clear: [dette_nawel]}
      - label: "Pas de politique"
        reponse: "Nawel annule le déjeuner elle-même, au téléphone, devant toi. La maison ferme le samedi à partir de mars. Les gamins traînent sur la place, près de la fontaine sèche."
        effets: {relation: {nawel: -2}, clear: [dette_nawel]}

  - id: vi.sc.nawel_dette_bis
    titre: "La réunion publique"
    lieu: maison_quartier
    tranches: [soir]
    qui: nawel
    si: "flag(dette_nawel) && mission(vi.sc.nawel_dette)"
    rejouable: true
    texte: "Ce soir, la réunion publique sur le plan de circulation qui coupe les Tilleuls du boulevard. Nawel range les chaises : « Les gens viennent quand il y a quelqu'un à regarder. Tu me le dois. »"
    choix:
      - label: "Je m'assois devant"
        reponse: "La salle est pleine, pour une fois. Les gens posent leurs questions en te regardant, toi, pas l'adjoint. Le plan est repoussé d'un an. L'adjoint, lui, n'oublie pas ton visage."
        effets: {jauges: {tribunes: 1, direction: -1}, clear: [dette_nawel]}
      - label: "Pas en public"
        reponse: "La salle est à moitié vide. L'adjoint présente le plan en vingt minutes, et personne ne pose de question. Nawel range les chaises seule."
        effets: {relation: {nawel: -2}, clear: [dette_nawel]}

  # ─────────────────────────────────────────────── Hagop Kassabian, le snack
  - id: vi.sc.hagop_friteuse
    titre: "La friteuse de 1979"
    lieu: snack_tilleuls
    tranches: [aprem]
    qui: hagop
    si: "relation.hagop >= 1 && annee <= 2015"
    texte: "L'hygiène a collé un avis sur la vitrine : la friteuse de 1979 n'est plus aux normes. Hagop tient l'avis entre deux doigts : « Une neuve, c'est trois mois de recettes. Celle-là a vu mes samedis. »"
    choix:
      - label: "Je paie la réparation"
        francs: -300
        reponse: "Un réparateur de Portclair change le thermostat et le joint de la cuve. Elle chante toujours faux, mais aux normes. Hagop colle l'avis de conformité par-dessus l'autre."
        effets: {relation: {hagop: 1}, jauges: {tribunes: 1}}
      - label: "Elle a fait son temps"
        reponse: "Il cache l'avis sous la caisse. L'inspecteur revient en mars ; le snack ferme deux semaines, et rouvre avec la même friteuse, réparée à crédit. Hagop te sert après les gamins."
        effets: {relation: {hagop: -1}}

  - id: vi.sc.hagop_cassette
    titre: "La défaite effacée"
    lieu: snack_tilleuls
    tranches: [soir]
    qui: hagop
    si: "relation.hagop >= 2 && annee <= 1995"
    texte: "Le petit Aram a enregistré un dessin animé sur une cassette du haut de l'étagère : la défaite de 1985, la seule où l'on voyait Hagop en tribune, de dos. Hagop la tient comme un oiseau mort."
    choix:
      - label: "Je parle au petit"
        reponse: "Tu parles au petit dans l'arrière-boutique. Il demande pardon à son père sans savoir pour quoi, exactement. Hagop range la cassette en haut, avec les autres défaites."
        effets: {relation: {hagop: 1, aram: 1}}
      - label: "Ce n'était qu'une défaite"
        reponse: "« Une défaite où j'étais. » Hagop jette la cassette dans la poubelle de la cuisine, puis il la reprend. Il la garde sous la caisse, effacée, avec son étiquette."
        effets: {relation: {hagop: -1}}

  - id: vi.sc.hagop_reprise
    titre: "Le petit poste"
    lieu: snack_tilleuls
    tranches: [aprem]
    qui: hagop
    si: "relation.hagop >= 2 && annee >= 2013 && annee <= 2015"
    texte: "Hagop ne tient plus debout derrière la friteuse. Aram veut reprendre et tout changer : un écran, les livraisons, plus de cassettes. Hagop te tend la télécommande du petit poste : « Dis-lui, toi. »"
    choix:
      - label: "Gardez le petit poste"
        reponse: "Aram garde le poste au-dessus de la caisse, branché, éteint. Le jour de la reprise, il y passe une dernière cassette pour son père. Hagop la regarde jusqu'au bout, debout."
        effets: {relation: {hagop: 1, aram: -1}}
      - label: "Laissez-le faire"
        reponse: "Aram descend le poste au garage, avec les cassettes. Hagop le suit, s'assoit sur une caisse et ne remonte pas de la journée. Aram te sert le premier cornet de sa vie de patron."
        effets: {relation: {aram: 1, hagop: -1}}

  # ─────────────────────────────────────────────── Aram Kassabian, le snack
  - id: vi.sc.aram_scooters
    titre: "Les scooters saisis"
    lieu: snack_tilleuls
    tranches: [soir]
    qui: aram
    si: "relation.aram >= 1 && annee >= 2016 && annee <= 2023"
    texte: "La police a saisi deux scooters des gamins qui livrent pour Aram : ni papiers ni assurance. Les gamins attendent devant le snack, les casques à la main. « Je paie, ou je les laisse apprendre ? »"
    choix:
      - label: "Je paie l'amende"
        francs: -300
        reponse: "Les scooters reviennent avec des plaques et une assurance au nom d'Aram. Le lendemain, les gamins te livrent un cornet que tu n'as pas commandé, encore chaud, ton prénom sur le papier."
        effets: {relation: {aram: 1}, jauges: {tribunes: 1}}
      - label: "Qu'ils apprennent"
        reponse: "Aram les fait livrer à pied tout l'hiver. Les cornets arrivent froids, et les gamins plus musclés. Ils te regardent passer comme on regarde un contrôleur."
        effets: {relation: {aram: -1}}

  - id: vi.sc.aram_garage
    titre: "Les cassettes du garage"
    lieu: snack_tilleuls
    tranches: [aprem]
    qui: aram
    si: "relation.aram >= 2 && annee >= 2021 && annee <= 2030"
    texte: "Le propriétaire reprend le garage où Hagop garde ses cassettes depuis 1983. Aram n'a pas la place, et son père ne sait rien. « Je les jette, ou tu connais quelqu'un qui garde les vieux matchs ? »"
    choix:
      - label: "L'Écho les gardera"
        reponse: "Le rédacteur de L'Écho vient chercher les cassettes en camionnette, avec des gants blancs. Hagop les regarde partir dans l'ordre des dates, debout, sans en garder une seule."
        effets: {relation: {aram: 1}, jauges: {tribunes: 1}}
      - label: "Jette-les"
        reponse: "Aram les met dans des sacs, la nuit, pour que son père ne voie pas. Hagop les retrouve au matin près des conteneurs, et passe la journée à les trier sur le trottoir."
        effets: {relation: {aram: -1}}

  # ─────────────────────────────────────────────── Zohra Mezrag, la supérette
  - id: vi.sc.zohra_fils
    titre: "Le fils de la Tréfilerie"
    roles: [entraineur, joueur, ds, president]
    lieu: superette
    tranches: [matin, aprem]
    qui: zohra
    si: "relation.zohra >= 1 && annee >= 1994 && annee <= 1999"
    texte: "Nordine, le fils de Zohra, livre des palettes depuis la fermeture de l'usine. Il voudrait une place au club : intendant, chauffeur, n'importe quoi. Zohra plie un torchon : « Un mot de toi suffirait. »"
    choix:
      - label: "Je parle de lui au club"
        reponse: "Nordine est pris à l'essai au stade, à charger les sacs de maillots. Il tient deux ans, puis il reprend les palettes. Zohra te met le pain du jour de côté jusqu'à la fin."
        effets: {relation: {zohra: 1, nordine: 1}, jauges: {vestiaire: 1}}
      - label: "Je ne peux rien"
        reponse: "« Personne ne peut rien. » Elle range le torchon. Le jeudi, c'est Nordine qui tient la caisse ; il te rend la monnaie sans compter tout haut."
        effets: {relation: {zohra: -1}}

  - id: vi.sc.zohra_pages
    titre: "Les pages des morts"
    lieu: superette
    tranches: [soir]
    qui: zohra
    si: "relation.zohra >= 2 && annee >= 2006 && annee <= 2010"
    texte: "Zohra va laisser la supérette à Nordine. Dans le cahier, les pages de ceux qui sont morts sans avoir payé, depuis 1971. « Je les déchire avant de partir, ou je les rends aux familles ? »"
    choix:
      - label: "Rendez-les aux familles"
        reponse: "Elle les rend une à une, pliées dans une enveloppe avec un mot : soldé. Les familles viennent payer quand même, en partie. Une veuve paie en confitures, deux pots par an."
        effets: {relation: {zohra: 1}, jauges: {tribunes: 1}}
      - label: "Déchirez-les"
        reponse: "Elle les déchire au-dessus de la poubelle, lentement, en disant chaque prénom. Elle garde la première page, celle de 1971, de l'écriture de son mari, entre deux feuilles de papier de soie."
        effets: {relation: {zohra: 1}}

  - id: vi.sc.zohra_dette
    titre: "La page du sixième"
    lieu: superette
    tranches: [matin]
    qui: zohra
    si: "flag(dette_zohra)"
    texte: "Zohra ouvre le cahier à une page de quatre ans : une famille du sixième, expulsable en mars. « Ta page, je ne te la demande pas. Je te demande la leur. C'est le même argent, mieux placé. »"
    choix:
      - label: "Je règle leur page"
        francs: -800
        reponse: "Elle raye la page d'un trait à la règle. La famille du sixième ne saura pas qui. En mars, l'huissier passe devant leur porte sans s'arrêter, et il sonne au cinquième."
        effets: {jauges: {tribunes: 1}, clear: [dette_zohra]}
      - label: "Je rembourse la mienne"
        francs: -800
        reponse: "Elle range tes billets sous la caisse sans les compter. « Ta page est propre. » La famille du sixième part en mars. Zohra leur fait crédit jusqu'au dernier jour."
        effets: {relation: {zohra: -2}, clear: [dette_zohra]}

  - id: vi.sc.zohra_dette_bis
    titre: "Une matinée à la caisse"
    lieu: superette
    tranches: [soir]
    qui: zohra
    si: "flag(dette_zohra) && mission(vi.sc.zohra_dette)"
    rejouable: true
    texte: "Demain matin, Zohra enterre une amie à Montbéliac, et Nordine livre. « Tu me dois une page. Ce sera une matinée : la caisse, le pain, la monnaie. Le cahier, tu n'y touches pas. »"
    choix:
      - label: "Je tiendrai la caisse"
        reponse: "Trois heures derrière la caisse. Tu rends mal la monnaie ; les clients te corrigent gentiment. Une dame te demande d'ouvrir sa page du cahier. Tu n'oses pas."
        effets: {jauges: {tribunes: 1}, clear: [dette_zohra]}
      - label: "Fermez la matinée"
        reponse: "Elle ferme. Le rideau baissé un matin de semaine, pour la première fois depuis 1971 : le quartier croit à un malheur. Le cahier reste fermé quand tu passes à la caisse."
        effets: {relation: {zohra: -2}, clear: [dette_zohra]}

  # ─────────────────────────────────────────────── Nordine Mezrag, la supérette
  - id: vi.sc.nordine_releves
    titre: "Les pages de Montbéliac"
    lieu: superette
    tranches: [aprem]
    qui: nordine
    si: "relation.nordine >= 1 && annee >= 2013 && annee <= 2015"
    texte: "Les familles de la barre E2 sont relogées à Montbéliac, et leurs pages sont restées dans le cahier : onze pages, quatre ans de pain. Nordine : « Je leur envoie la note, ou je les déchire ? »"
    choix:
      - label: "Déchirez-les"
        reponse: "Il les déchire un soir, après la fermeture, et les brûle dans l'évier. Le dimanche, une famille de Montbéliac revient exprès, en car, payer la moitié."
        effets: {relation: {nordine: 1}, jauges: {tribunes: 1}}
      - label: "Envoyez la note"
        reponse: "Il envoie onze lettres. Trois reviennent avec des billets ; huit ne reviennent pas. Les relogés de Montbéliac ne repassent plus par les Tilleuls, même pour les enterrements."
        effets: {relation: {nordine: -1}}

  - id: vi.sc.nordine_chaise
    titre: "La chaise du samedi"
    lieu: superette
    tranches: [matin]
    jours: [sam]
    qui: nordine
    si: "relation.nordine >= 2 && annee >= 2016 && annee <= 2028"
    texte: "Le samedi, Zohra relit le vieux cahier derrière la caisse. Depuis un mois, elle y écrit de nouveau : crédit à tout le monde, sans demander. Nordine : « Toi, elle t'aime bien. Moi, je suis son fils. »"
    choix:
      - label: "Je lui parle"
        reponse: "Tu t'assois à côté d'elle, un samedi. Elle t'écoute, hoche la tête, et fait crédit au client suivant en te regardant dans les yeux. Nordine rit pour la première fois de l'année."
        effets: {relation: {nordine: 1}}
      - label: "Laissez-la faire"
        reponse: "Nordine la laisse faire. Le cahier grossit d'un samedi à l'autre. Les clients reviennent payer le lundi ; il croit que c'est pour éviter sa mère. C'est pour la remercier."
        effets: {relation: {nordine: -1}, jauges: {tribunes: 1}}

  # ─────────────────────────────────────────────── Stan Kowal, le club de boxe
  - id: vi.sc.kowal_toile
    titre: "La toile du ring"
    lieu: club_boxe
    tranches: [soir]
    qui: kowal
    si: "relation.kowal >= 1 && annee <= 2013"
    texte: "Un inspecteur de la fédération de boxe a refusé le ring : la toile trouée n'est pas homologuée. Plus de gala, plus de compétition. Stan : « Elle a tenu trente ans. C'est eux qui lâchent. »"
    choix:
      - label: "Je paie une toile neuve"
        francs: -400
        reponse: "La toile neuve arrive bleue. Stan la tend seul, un dimanche, et range l'ancienne dans le tiroir, pliée en huit. Les cordes, il n'y touche pas. Le gala a lieu en mars."
        effets: {relation: {kowal: 1}, jauges: {tribunes: 1}}
      - label: "Gardez votre toile"
        reponse: "Stan garde sa toile. Le club perd la compétition pour deux saisons. Les gamins tapent quand même, pour rien, sans se plaindre. Stan, lui, se plaint."
        effets: {relation: {kowal: -1}}

  - id: vi.sc.kowal_photo
    titre: "La photo de Slimane"
    lieu: club_boxe
    tranches: [aprem]
    qui: kowal
    si: "relation.kowal >= 2 && annee <= 2010"
    texte: "Slimane, le champion de la photo, est revenu au club pour la première fois depuis 1980. Il veut décrocher sa photo : un collectionneur de Portclair la paie. Stan essuie ses gants. Il te regarde, toi."
    choix:
      - label: "Je la rachète à Slimane"
        francs: -300
        reponse: "Slimane prend tes billets et te serre la main trop longtemps. La photo reste au clou. Stan la redresse d'un millimètre et dit aux gamins : « Il est passé. Il va bien. » Il ment bien."
        effets: {relation: {kowal: 1}}
      - label: "Elle est à lui"
        reponse: "Slimane décroche la photo et la serre sous son blouson. Le lundi, elle est revenue au clou, un peu de travers, sans un mot. Stan ne la redresse pas."
        effets: {relation: {kowal: -1}}

  - id: vi.sc.kowal_cloche
    titre: "La dernière cloche"
    lieu: club_boxe
    tranches: [soir]
    qui: kowal
    si: "relation.kowal >= 2 && annee >= 2012 && annee <= 2013"
    texte: "Stan a quatre-vingts ans. Il laisse le club à sa petite-fille Mélissa à la fin de la saison. À sa dernière séance, il te tend le manche à balai qui sonne la cloche : « Le dernier round, c'est toi. »"
    choix:
      - label: "Je sonne la fin"
        reponse: "Tu sonnes. Les gamins applaudissent un vieil homme qui ne sait pas quoi faire de ses mains. Mélissa range les gants de Stan dans le tiroir, sans les laver."
        effets: {relation: {kowal: 1, melissa: 1}}
      - label: "Sonnez-la vous-même"
        reponse: "Il sonne une fois, puis encore, puis il s'arrête. Mélissa lui prend le manche des mains, doucement. Personne n'applaudit : tout le monde a compris."
        effets: {relation: {kowal: 1}}

  - id: vi.sc.kowal_dette
    titre: "La photo du gala"
    lieu: club_boxe
    tranches: [soir]
    qui: kowal
    si: "flag(dette_kowal)"
    texte: "Gala de boxe au gymnase. Stan t'a réservé la chaise du premier rang, entre ses deux anciens qui ramassent pour le Terminus : « Une photo pour L'Écho, toi entre eux. Ils t'ont rendu service. »"
    choix:
      - label: "Je m'assois entre eux"
        reponse: "Le flash, deux poignées de main trop fermes. La photo paraît en page six. Quelque part, quelqu'un la découpe et la range dans un dossier. Stan, lui, l'épingle au mur du club."
        effets: {jauges: {direction: -2, tribunes: 1}, clear: [dette_kowal]}
      - label: "Pas sur la photo"
        reponse: "Tu restes au fond, debout. Les deux anciens regardent la chaise vide pendant tous les combats. Stan ne dit rien ; la semaine suivante, il te fait payer ta séance."
        effets: {relation: {kowal: -2}, clear: [dette_kowal]}

  - id: vi.sc.kowal_dette_bis
    titre: "Le gamin des halls"
    lieu: club_boxe
    tranches: [aprem, soir]
    qui: kowal
    si: "flag(dette_kowal) && mission(vi.sc.kowal_dette)"
    rejouable: true
    texte: "Un gamin de la barre E traîne dans les halls avec ceux qui ramassent. Stan veut le garder : « Il lui faut quelqu'un qui le regarde taper, deux soirs par semaine. Quelqu'un qu'il a vu à la télé. »"
    choix:
      - label: "Je viendrai le regarder"
        reponse: "Deux soirs par semaine, tu t'assois sur le banc sous la photo. Le gamin tape en te regardant du coin de l'œil. On finit par te demander où tu passes tes mardis."
        effets: {jauges: {direction: -1, tribunes: 1}, clear: [dette_kowal]}
      - label: "Je n'ai pas le temps"
        reponse: "Stan te tourne le dos et retourne aux gamins. Le gamin de la barre E reste dans les halls. Un mois plus tard, il ramasse pour le Terminus, lui aussi."
        effets: {relation: {kowal: -2}, clear: [dette_kowal]}

  # ─────────────────────────────────────────────── Mélissa Kowal, le club de boxe
  - id: vi.sc.melissa_petite
    titre: "La petite de la tour B"
    lieu: club_boxe
    tranches: [soir]
    qui: melissa
    si: "relation.melissa >= 1 && annee >= 2016"
    texte: "La meilleure du club, quatorze ans, ne vient plus : son père a dit que la boxe, c'est pour les garçons. Il va au virage le samedi. Mélissa : « Il t'applaudit, toi. Moi, il me regarde les mains. »"
    choix:
      - label: "Je parle au père"
        reponse: "Le père t'écoute au pied de la tour B, les bras croisés, puis il demande si sa fille pourrait venir au stade avec toi, un jour. Elle revient le mardi, les gants dans un sac de courses."
        effets: {relation: {melissa: 1}, jauges: {tribunes: 1}}
      - label: "C'est son père"
        reponse: "La gamine ne revient pas. Mélissa laisse ses gants au clou, à sa hauteur, son prénom au feutre sur le cuir. Elle ne les donne à personne."
        effets: {relation: {melissa: -1}}

  - id: vi.sc.melissa_boite
    titre: "La boîte du sac"
    lieu: club_boxe
    tranches: [soir]
    qui: melissa
    si: "relation.melissa >= 2 && annee >= 2014"
    texte: "Mélissa a trouvé une boîte sans étiquette dans le sac d'un gamin du club, seize ans. « Quelqu'un lui a dit que c'était pour grandir. Je le dis à sa mère, ou je trouve d'abord qui la vend ? »"
    choix:
      - label: "Trouvons qui la vend"
        reponse: "Deux soirs à faire le tour du parking avec elle. Le troisième, un homme en survêtement neuf ne revient plus. La mère ne saura rien ; le gamin, si. Il tape plus fort, sans la boîte."
        effets: {relation: {melissa: 1}}
      - label: "Dites-le à sa mère"
        reponse: "La mère vient au club, prend son fils par le bras et ne revient plus. Mélissa range la boîte dans le tiroir, avec les gants de son grand-père, pour s'en souvenir."

  # ─────────────────────────────────────────────── Aldo Scarpelli, le salon
  - id: vi.sc.scarpelli_mur
    titre: "La photo humide"
    roles: [entraineur, joueur, ds, president]
    lieu: salon_tilleuls
    tranches: [matin]
    qui: scarpelli
    si: "relation.scarpelli >= 1 && annee <= 2017"
    texte: "Le grand avant-centre de la tour D a signé ce matin à Valentienne. Il s'est fait couper avant, dans le fauteuil du milieu. Scarpelli tient la photo, encore humide : « Je l'accroche quand même ? »"
    choix:
      - label: "Accrochez-la"
        reponse: "Il l'accroche à sa place, dans l'ordre des années. Le lendemain, deux supporters entrent, regardent le mur et ressortent sans se faire couper. Scarpelli balaie quand même."
        effets: {relation: {scarpelli: 1}, jauges: {tribunes: -1}}
      - label: "Pas sur ce mur"
        reponse: "Il range la photo dans le tiroir, sous le peigne. La semaine suivante, le père du garçon regarde le mur longtemps, et demande où est son fils. Scarpelli ne répond pas."
        effets: {relation: {scarpelli: -1}}

  - id: vi.sc.scarpelli_apprenti
    titre: "L'apprenti au trépied"
    lieu: salon_tilleuls
    tranches: [aprem]
    qui: scarpelli
    si: "relation.scarpelli >= 2 && annee >= 2013 && annee <= 2017"
    texte: "Scarpelli veut renvoyer son apprenti, le petit Bilal : il filme les nuques et les met sur le Flux. « Il a plus de clients que moi. C'est bien la preuve. » Il te tend les ciseaux, pour que tu tranches."
    choix:
      - label: "Gardez-le"
        reponse: "Scarpelli garde Bilal et lui interdit le fauteuil du milieu. Bilal filme tout le reste. Le samedi suivant, il y a une file devant le salon : des gamins de Portclair."
        effets: {relation: {scarpelli: -1, bilal: 1}, jauges: {tribunes: 1}}
      - label: "Renvoyez-le"
        reponse: "Bilal range son trépied sans un mot et va couper chez un cousin, sur le boulevard. Scarpelli coupe seul, moins vite. Il dit que ce n'est que pour un temps."
        effets: {relation: {scarpelli: 1, bilal: -1}}

  # ─────────────────────────────────────────────── Bilal Chergui, le salon
  - id: vi.sc.bilal_derniere_coupe
    titre: "La dernière coupe"
    lieu: salon_tilleuls
    tranches: [matin]
    jours: [dim]
    qui: bilal
    si: "relation.bilal >= 2 && annee >= 2020 && annee <= 2026"
    texte: "Scarpelli a demandé à couper une dernière fois, un dimanche, salon fermé. Il lui faut une nuque qui ne bouge pas. Bilal te regarde : « Il n'a demandé que toi. »"
    choix:
      - label: "Je m'assois"
        reponse: "Ses mains tremblent, puis plus du tout dès que les ciseaux touchent tes cheveux. Vingt minutes sans un mot. Bilal ne filme pas : il garde le téléphone dans sa poche, l'écran contre la cuisse."
        effets: {relation: {bilal: 1}}
      - label: "Pas aujourd'hui"
        reponse: "Scarpelli coupe Bilal à ta place, et Bilal ne bouge pas. Le lundi, il te reçoit avec une politesse de client et te demande si tu as pris rendez-vous."
        effets: {relation: {bilal: -1}}

  - id: vi.sc.bilal_pirate
    titre: "Le compte piraté"
    lieu: salon_tilleuls
    tranches: [matin, aprem]
    qui: bilal
    si: "relation.bilal >= 1 && annee >= 2018"
    texte: "Le compte du salon a été piraté cette nuit. Il annonce ton départ, avec ta photo, douze mille partages. Bilal : « Je n'ai plus la main. Un démenti de toi vaut dix des miens. »"
    choix:
      - label: "Je démens"
        reponse: "Ton démenti fait moins de partages que le mensonge, mais il reste en haut. Bilal récupère son compte le jeudi et poste ta nuque, avec une seule phrase : « Toujours là. »"
        effets: {relation: {bilal: 1}, jauges: {direction: 1}}
      - label: "Laisse courir"
        reponse: "La rumeur court trois jours. Là-haut, on te demande à qui tu as parlé. Bilal ferme son compte une semaine, et le rouvre sans jamais te nommer."
        effets: {relation: {bilal: -1}, jauges: {direction: -1}}

  - id: vi.sc.bilal_dette
    titre: "La nuque du salon"
    lieu: salon_tilleuls
    tranches: [matin]
    qui: bilal
    si: "flag(dette_bilal)"
    texte: "Bilal installe le trépied : « J'ai effacé une rumeur pour toi. Maintenant, une vidéo : toi dans le fauteuil de droite, la veille de ton prochain match, sans légende. Le salon a besoin de ta nuque. »"
    choix:
      - label: "Filme"
        reponse: "Trente secondes : ta nuque, la tondeuse, le néon. Cent mille vues en une nuit. Le lundi, on te fait remarquer que tu fais la publicité d'un salon, et gratuitement."
        effets: {jauges: {direction: -2, tribunes: 2}, clear: [dette_bilal]}
      - label: "Pas de vidéo"
        reponse: "Bilal replie le trépied. « D'accord. » Il n'effacera plus rien pour toi, et il le dit à ceux qui le lui demandent."
        effets: {relation: {bilal: -2}, clear: [dette_bilal]}

  - id: vi.sc.bilal_dette_bis
    titre: "Le témoin du salon"
    lieu: salon_tilleuls
    tranches: [matin, aprem]
    qui: bilal
    si: "flag(dette_bilal) && mission(vi.sc.bilal_dette)"
    rejouable: true
    texte: "Un journaliste de la capitale accuse le salon d'avoir vendu des rumeurs de transferts. Bilal a besoin de quelqu'un qui dise qu'il les refuse depuis des années. « Tu me connais. Dis-le. »"
    choix:
      - label: "Je témoigne pour lui"
        reponse: "Ta phrase paraît en bas de l'article, entre guillemets. Le salon garde ses clients. Dans les bureaux, on se demande pourquoi tu défends un coiffeur."
        effets: {jauges: {direction: -1}, clear: [dette_bilal]}
      - label: "Je ne témoigne pas"
        reponse: "L'article paraît sans toi. Bilal perd la moitié de ses rendez-vous, puis il les retrouve. Le samedi, il ne te prend plus."
        effets: {relation: {bilal: -2}, clear: [dette_bilal]}

  # ─────────────────────────────────────────────── Marthe Degroote, la tour C
  - id: vi.sc.marthe_office
    titre: "La pétition de la loge"
    lieu: tour_c
    tranches: [matin]
    qui: marthe
    si: "relation.marthe >= 1 && annee >= 1998 && annee <= 2008"
    texte: "L'office veut remplacer la gardienne de la tour C par une société de surveillance : deux rondes par nuit, un numéro vert. Marthe a écrit une pétition à la main. « Il manque un nom qu'on connaît. »"
    choix:
      - label: "Je signe en haut"
        reponse: "Ton nom en haut de la feuille, au stylo bille. L'office recule d'un an, puis de deux. Marthe accroche la pétition dans la loge, à côté du cahier des pannes."
        effets: {relation: {marthe: 1}, jauges: {tribunes: 1}}
      - label: "Ce n'est pas mon affaire"
        reponse: "La pétition part sans ton nom. L'office recule quand même, pour cette fois. Marthe note ton passage du jour dans le cahier des pannes, entre deux pannes."
        effets: {relation: {marthe: -1}}

  - id: vi.sc.marthe_drapeau
    titre: "Le drapeau de 1958"
    lieu: tour_c
    tranches: [matin, aprem]
    qui: marthe
    si: "relation.marthe >= 2 && annee <= 2008"
    texte: "Le vent a déchiré le drapeau d'André, celui de 1958, que Marthe pend le samedi à la loge. Elle tient les deux morceaux : « La mercerie de la rue Haute recoud tout. Elle prend son temps. Et des sous. »"
    choix:
      - label: "Je le fais recoudre"
        francs: -150
        reponse: "Il revient un mois plus tard, la couture visible. Marthe le pend le samedi suivant. Les grands du sixième le saluent en passant, deux doigts sur la tempe."
        effets: {relation: {marthe: 1}, jauges: {tribunes: 1}}
      - label: "Prenez-en un neuf"
        reponse: "Elle pend un drapeau neuf, de la boutique du club. Il est trop propre ; il claque autrement. Les morceaux de celui d'André dorment dans le tiroir de la loge."
        effets: {relation: {marthe: -1}}

  - id: vi.sc.marthe_neuvieme
    titre: "Le neuvième"
    lieu: tour_c
    tranches: [soir]
    qui: marthe
    si: "flag(histoire_h1) && flag(tuyau_marthe_cle_verte)"
    texte: "Marthe monte avec toi, la clé verte à la main. L'office n'a jamais changé la serrure. Le neuvième est vide ; sur le chambranle de la cuisine, que personne n'a repeint, des traits au crayon, datés."
    choix:
      - label: "J'entre"
        reponse: "Les traits vont de 1964 à 1970 ; le dernier arrive à ton front. Tu poses la main dessus. Marthe attend sur le palier, le dos tourné, le temps qu'il faut."
        effets: {relation: {marthe: 1}}
      - label: "Refermez"
        reponse: "Marthe referme à double tour. Dans l'escalier, elle dit seulement : « Il a attendu quinze ans. Il attendra encore. » Elle remet la clé verte sur son anneau."

  # ─────────────────────────────────────────────── Issa Tchibozo, la tour C
  - id: vi.sc.issa_neuvieme
    titre: "Un nom au neuvième"
    lieu: tour_c
    tranches: [aprem]
    qui: issa
    si: "relation.issa >= 1 && annee == 2014"
    texte: "L'office a donné le neuvième à des relogés de la barre E2 : un maçon, sa femme, deux filles. Issa connaît l'histoire de l'appartement, par Marthe. « Je leur dis, ou je les laisse dormir ? »"
    choix:
      - label: "Dites-leur"
        reponse: "Issa monte avec un gâteau et l'histoire. Le maçon écoute jusqu'au bout, puis il grave son nom dans un carré de plâtre, au-dessus de la sonnette. « Comme ça, on saura qui habite là. »"
        effets: {relation: {issa: 1}}
      - label: "Laissez-les dormir"
        reponse: "Issa ne dit rien. Le maçon grave quand même son nom dans un carré de plâtre, au-dessus de la sonnette, sans savoir pourquoi elle n'en avait pas. Les voisins, eux, savent."
        effets: {jauges: {tribunes: -1}}

  - id: vi.sc.issa_cameras
    titre: "Les caméras du hall"
    lieu: tour_c
    tranches: [soir]
    qui: issa
    si: "relation.issa >= 2 && annee >= 2018"
    texte: "L'office veut quatre caméras dans le hall, après une bagarre dans l'escalier. Issa est contre : « Les grands iront s'asseoir ailleurs, dans le noir, là où personne ne les connaît. » Il veut ton avis."
    choix:
      - label: "Pas de caméras"
        reponse: "Issa porte ton avis à l'office avec le sien. Les caméras restent dans leurs cartons, à la cave. Les grands s'assoient toujours dans l'escalier, sous l'ampoule qu'Issa change."
        effets: {relation: {issa: 1}}
      - label: "Posez-les"
        reponse: "Les caméras filment un hall vide pendant un mois. Les grands sont passés au parking de la tour B, dans le noir. Issa fait sa ronde là-bas, maintenant, avec une lampe."
        effets: {relation: {issa: -1}}

  - id: vi.sc.issa_dette
    titre: "La veillée du quatrième"
    lieu: tour_c
    tranches: [soir]
    qui: issa
    si: "flag(dette_issa)"
    texte: "Le vieux Kambarais du quatrième est mort cette nuit. La veillée est ce soir, à la maison de quartier. Issa : « Viens. Dis quelques mots. Il t'applaudissait devant sa télévision, debout. »"
    choix:
      - label: "Je viendrai parler"
        reponse: "Tu parles trois minutes, mal, devant quarante personnes qui hochent la tête. Le fils te serre la main deux fois. À la fin, Issa range ta chaise lui-même."
        effets: {jauges: {tribunes: 1}, clear: [dette_issa]}
      - label: "Je ne le connaissais pas"
        reponse: "« Lui te connaissait. » Issa va seul à la veillée. Le lendemain, il te tient la porte du hall comme à un inconnu."
        effets: {relation: {issa: -2}, clear: [dette_issa]}

  - id: vi.sc.issa_dette_bis
    titre: "La lettre pour le dixième"
    lieu: tour_c
    tranches: [aprem, soir]
    qui: issa
    si: "flag(dette_issa) && mission(vi.sc.issa_dette)"
    rejouable: true
    texte: "Le fils du dixième veut entrer en apprentissage chez un électricien. Issa a écrit la lettre : « Ton nom en bas, et il passe devant les autres. Tu me dois deux nuits ; je te demande une signature. »"
    choix:
      - label: "Je signe"
        reponse: "Le patron lit ta signature avant la lettre. Le fils est pris. Depuis, le samedi, il change les ampoules de la tour sans qu'on le lui demande."
        effets: {jauges: {tribunes: 1}, clear: [dette_issa]}
      - label: "Une lettre ne sert à rien"
        reponse: "Issa la signe lui-même : « le gardien ». Le fils n'est pas pris. Issa ne t'en parle plus, et il ne t'en reparlera pas."
        effets: {relation: {issa: -2}, clear: [dette_issa]}

  # ─────────────────────────────────────────────── Les Tilleuls, sans visage connu
  - id: vi.sc.til_jongles
    titre: "Cent sept jongles"
    roles: [entraineur, ds, president]
    lieu: rue
    tranches: [aprem]
    qui: enfant
    texte: "Un gamin des Tilleuls t'arrête sur le trottoir, un ballon sous le bras, et jongle cent sept fois sans te quitter des yeux. « Ma mère sait pas que je suis là. Je veux un essai. Mardi, j'ai pas école. »"
    choix:
      - label: "Viens mardi au stade"
        reponse: "Mardi, il arrive à sept heures pour un essai à dix. Il joue bien, pas assez. Il repart avec un maillot d'entraînement trop grand, et le porte jusqu'à l'hiver dans toute la cité."
        effets: {jauges: {tribunes: 1}}
      - label: "Va voir ta mère"
        reponse: "Il remet le ballon sous son bras. « Elle travaille. » Trois rues plus loin, il jongle encore, plus fort, pour que tu l'entendes compter."

  - id: vi.sc.til_barre
    titre: "Cinquante secondes"
    lieu: tour_c
    tranches: [matin]
    qui: ancien
    si: "annee == 2013 && phase == aller"
    poids: 3
    texte: "Sept heures, la barre E2 tombe. Tout le quartier est sur la pelouse, en manteau. Un vieil homme te prend le bras : « J'ai vécu quarante-neuf ans au troisième. Restez à côté de moi. Ça dure combien ? »"
    choix:
      - label: "Je reste avec lui"
        reponse: "Cinquante secondes de poussière. Il ne dit rien ; il compte tout bas les étages qui tombent. Après, il te rend ton bras et va acheter son pain, comme un autre jour."
        effets: {jauges: {tribunes: 1}}
      - label: "Je dois partir"
        reponse: "Tu pars avant. La poussière te rattrape au boulevard, fine comme du sucre. Le soir, au snack, on raconte qui était sur la pelouse, et qui n'y était pas."
        effets: {jauges: {tribunes: -1}}

  - id: vi.sc.til_coupure
    titre: "La panne du soir de match"
    lieu: snack_tilleuls
    tranches: [soir]
    qui: passante
    texte: "Panne d'électricité sur toute la cité, un soir de match à la télé. Le snack a un groupe électrogène, mais plus d'essence. Une femme de la tour D tend un bidon vide : « Quelqu'un a une voiture ? »"
    choix:
      - label: "Je trouve de l'essence"
        francs: -60
        reponse: "Tu ramènes vingt litres de la station du boulevard. Le groupe tousse, le poste s'allume, et la moitié de la cité regarde la seconde mi-temps devant le snack, debout dans le noir."
        effets: {jauges: {tribunes: 2}}
      - label: "Écoutez à la radio"
        reponse: "Le quartier écoute le match sur deux postes à piles posés sur le capot d'une voiture. La femme de la tour D garde son bidon vide à la main jusqu'au coup de sifflet."
        effets: {jauges: {tribunes: -1}}

  - id: vi.sc.til_un_contre_un
    titre: "Un contre un, sous les mâts"
    lieu: city_stade
    tranches: [soir]
    qui: passant
    si: "flag(rep_sport)"
    texte: "Un grand du sixième t'attend sous les mâts, un ballon au pied : « On dit que tu ne t'arrêtes jamais de courir. Un contre un, trois buts. Si tu perds, tu reviens mercredi. »"
    choix:
      - label: "Trois buts, d'accord"
        reponse: "Tu perds trois à deux, honnêtement. Tu reviens le mercredi. Le grand du sixième t'apprend un dribble que tu rates deux fois devant tout le monde, et une troisième, exprès."
        effets: {jauges: {tribunes: 1, vestiaire: 1}}
      - label: "Pas ce soir"
        reponse: "« Le soir, tout le monde a peur. » Il tire quand même, seul, dans le but vide, jusqu'à ce que la minuterie éteigne les mâts."

  - id: vi.sc.til_photographes
    titre: "Les deux types devant chez toi"
    lieu: rue
    tranches: [aprem, soir]
    qui: enfant
    si: "flag(rep_quartier)"
    texte: "Deux gamins des Tilleuls t'attendent au coin de la rue, essoufflés : « Il y avait deux types devant chez toi, avec un appareil photo. On leur a dit que tu étais à la piscine. Ils y sont allés. »"
    choix:
      - label: "Je vous paie un soda"
        francs: -10
        reponse: "Ils boivent sans s'asseoir, en surveillant le coin de la rue. Le lendemain, deux autres gamins se proposent pour garder ta porte. Ils ne demandent rien ; ils attendent un soda."
        effets: {jauges: {tribunes: 1}}
      - label: "Qui étaient-ils ?"
        reponse: "« Pas d'ici. » Le plus petit sort de sa poche un numéro de plaque recopié au stylo sur un ticket de bus. Tu le gardes dans ton portefeuille, sans savoir quoi en faire."
        effets: {jauges: {direction: 1}}

# ═══════════════════════════════════════════════════════════════ LES PAROLES
# Les gens du quartier, sans nom : près d'un lieu (`lieu ==`), ou quand le héros s'y est fait une
# réputation. La nuit, seuls passent des passants.
paroles:
  - qui: enfant
    sujet: quartier
    si: "lieu == city_stade"
    texte: "Ici, le ballon qui touche le grillage, c'est poteau. Le poteau, c'est rentré. Le premier qui dit le contraire paie les sodas."
  - qui: ancien
    sujet: quartier
    si: "lieu == club_boxe"
    texte: "J'ai tapé là-dedans en 1971. Le sac du fond, c'est le même. On l'a recousu tant de fois qu'il est plus fil que cuir."
  - qui: passante
    sujet: club
    si: "lieu == superette && role != selectionneur"
    texte: "Le cahier de la supérette sait avant le journal quand le club paie mal ses employés. Il suffit de compter les pages qu'on rouvre le mardi."
  - qui: passant
    sujet: rumeur
    si: "lieu == salon_tilleuls"
    texte: "Au salon, on sait qui a signé où avant les journaux. Le coiffeur dit que les agents ont la nuque raide : ils ne baissent jamais la tête."
  - qui: ancien
    sujet: quartier
    si: "lieu == tour_c && annee >= 2014"
    texte: "Depuis que la barre E2 est tombée, le vent passe entre les tours et siffle dans les boîtes aux lettres. Ma femme dit que c'est la barre qui se plaint."
  - qui: passant
    sujet: quartier
    si: "lieu == tour_c && tranche == nuit"
    texte: "Le dernier train pour Portclair passe à minuit dix. Après lui, aux Tilleuls, il n'y a plus que les scooters, et les chiens qui leur répondent."
  - qui: enfant
    sujet: toi
    si: "flag(rep_quartier)"
    texte: "Ma mère dit que tu viens plus souvent aux Tilleuls que le facteur. Le facteur, lui, on le paie pour venir."
  - qui: ancien
    sujet: toi
    si: "flag(rep_quartier) && tribunes >= 50"
    texte: "Aux Tilleuls, on dit ton prénom sans le nom, comme pour les gens d'ici. Ça ne se donne pas. Ça se prend, à force de monter les escaliers."
  - qui: passant
    sujet: toi
    si: "flag(rep_largesse) && lieu == snack_tilleuls"
    texte: "Les gamins du banc disent que tu paies les frites. Fais attention : ici, celui qui paie une fois, on l'attend tous les jours."

# ═══════════════════════════════════════════════════════════════ LES RENCONTRES
# Où l'on trouve chacun quand une de ses cartes de palier arrive (les lieux des Tilleuls ne sont
# pas des lieux du moteur : la carte n'a pas de `lieu`, elle suit son locuteur).
rencontres:
  haddouche: city_stade
  cazal: city_stade
  kobiela: maison_quartier
  nawel: maison_quartier
  hagop: snack_tilleuls
  aram: snack_tilleuls
  zohra: superette
  nordine: superette
  kowal: club_boxe
  melissa: club_boxe
  scarpelli: salon_tilleuls
  bilal: salon_tilleuls
  marthe: tour_c
  issa: tour_c

# ═══════════════════════════════════════════════════════════════ CE QU'ON VOIT EN ARRIVANT
# Les textes des lieux (grand_auberive.yaml) disent le quartier de toujours ; ceux-ci, ce que les
# années y changent. La première vraie l'emporte.
lieux_variantes:
  - lieu: city_stade
    si: "annee < 1999"
    texte: "Le city-stade, derrière son grillage. Du bitume crevé aux deux buts, du sable de chantier dans les trous, un banc sans dossier, et des gamins qui jouent jusqu'à ce que la lumière s'éteigne."
  - lieu: maison_quartier
    si: "annee == 2012"
    texte: "La maison de quartier. Sur la vitre, par-dessus les dessins d'enfants, le plan de relogement de la barre E2. Un baby-foot, une file pour les papiers, et des cartons pliés contre le mur."
  - lieu: snack_tilleuls
    si: "annee >= 2016"
    texte: "Le Snack des Tilleuls : un comptoir, quatre tabourets, la friteuse qui chante. Au-dessus de la caisse, un téléphone scotché au mur repasse le but de samedi, sans le son."
  - lieu: club_boxe
    si: "annee >= 2016"
    texte: "Le club de boxe, sous un auvent de tôle. Un ring aux cordes rouges, neuves, des sacs qui pendent, et l'odeur du cuir. Au mur, la photo d'un champion qui a grandi tour B."
  - lieu: salon_tilleuls
    si: "annee >= 2018"
    texte: "Le salon des Tilleuls. Trois fauteuils, un néon, un téléphone sur un trépied, et celui du milieu qu'on ne donne qu'aux signatures. Les photos du mur débordent sur la porte."
  - lieu: tour_c
    si: "annee >= 2015"
    texte: "Le hall de la tour C, rénové. Des boîtes aux lettres neuves, déjà cabossées, l'ascenseur en panne un jour sur deux, et au neuvième, un nom gravé dans un carré de plâtre."
