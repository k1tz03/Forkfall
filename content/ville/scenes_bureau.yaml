# LES SCÈNES DE LA SEMAINE — les rôles de bureau (format : scenes_communes.yaml).
#
# Le directeur sportif (2003 et après) achète et vend des gens ; le président
# (1999 et après) signe, paie, reçoit en loge ; le sélectionneur (2011 et après)
# vit à l'hôtel de la Rive pendant les fenêtres. Mêmes quatre jauges, autres
# noms : VESTIAIRE (le staff / le club / le groupe), TRIBUNES (le pays, pour le
# sélectionneur), DIRECTION (le président / les actionnaires / la Fédération),
# CAISSE (la masse salariale / la trésorerie / les moyens).
# Chez le sélectionneur, `domicile` est sa chambre d'hôtel — sauf dans
# « Vingt degrés dedans » (`histoire_h9`), où elle vit rue des Lilas : ses
# scènes de chambre portent `!flag(histoire_h9)`. Une chaîne : la recrue du
# car de nuit → les vingt mots (`mission(...)`, quel qu'ait été le choix).
scenes:

  # ═══════════════════════════════════════════════ LE DIRECTEUR SPORTIF
  - id: sc.dix_pour_cent
    titre: "Dix pour cent, comme les vrais"
    roles: [ds]
    lieu: cafe_mairie
    tranches: [matin]
    qui: passant
    texte: "Un père en blouson de cuir pose la licence de son fils sur ta soucoupe, au café de la Mairie. « Dix-sept ans, le pied gauche de sa mère. Je suis son agent. Je prends dix pour cent, comme les vrais. »"
    choix:
      - label: "Je le fais tester"
        reponse: "Le gamin arrive mercredi en crampons neufs dont l'étiquette pend encore. Le père reste derrière le grillage toute la séance, à prendre des notes sur un ticket de caisse."
        effets: {jauges: {tribunes: 1, caisse: -1}}
      - label: "Pas d'agent à dix-sept ans"
        reponse: "Le père reprend la licence et souffle dessus comme sur une photo mouillée. « Les vrais agents disent ça aussi, au début. »"

  - id: sc.menisque_gauche
    titre: "Le ménisque gauche"
    roles: [ds]
    lieu: cabinet
    tranches: [matin, aprem]
    qui: passant
    texte: "Le médecin du club tient les radios de ta recrue contre la fenêtre. « Le ménisque gauche a été réparé. Son dossier dit le contraire. Je signe apte, ou j'écris ce que je vois ? »"
    choix:
      - label: "Écrivez ce que vous voyez"
        reponse: "Il écrit trois lignes penchées et souligne « gauche ». L'agent de la recrue apprend le mot avant toi ; à midi, le prix a baissé d'un tiers, et la tribune, d'humeur."
        effets: {jauges: {caisse: 2, tribunes: -1}}
      - label: "Signez apte"
        reponse: "Il signe sans relire et rend les radios dans leur enveloppe. En octobre, le ménisque se rappelle au bon souvenir de tout le monde, un mardi, à l'échauffement."
        effets: {jauges: {tribunes: 1, caisse: -1}}

  - id: sc.quatorze_averses
    titre: "Quatorze averses"
    roles: [ds]
    lieu: gareRoutiere
    tranches: [matin]
    qui: ancien
    texte: "Ton plus vieux recruteur descend du car de nuit de Montelvane, trempé, un carnet gonflé de pluie contre lui. « Un arrière gauche, quatorze matchs sous l'averse. Tu me crois, ou les chiffres ? »"
    choix:
      - label: "Je te crois"
        reponse: "Il te tend le carnet ouvert : l'encre a coulé, on ne lit plus que le nom, souligné trois fois. Tu fais venir l'arrière gauche à l'essai, sans regarder ses statistiques."
        effets: {jauges: {vestiaire: 1, caisse: -1}}
      - label: "Je crois les chiffres"
        reponse: "Il referme le carnet et le glisse dans sa doudoune, côté cœur. « Les chiffres n'ont pas pris le car. » Il rentre dormir sans passer par ton bureau."
        effets: {jauges: {direction: 1, vestiaire: -1}}

  - id: sc.heure_du_rappel
    titre: "L'heure du rappel"
    roles: [ds]
    lieu: terminus
    tranches: [soir]
    qui: passant
    texte: "Un agent que tu n'as jamais vu pose une montre d'acier à côté de ton café, au comptoir du Terminus. « Ce n'est rien. C'est pour l'heure. L'heure où vous me rappellerez. »"
    choix:
      - label: "Je la mets au poignet"
        reponse: "Elle est à l'heure à la seconde. L'agent paie ton café et laisse sa carte sous la soucoupe : un prénom, un numéro, pas de société."
        effets: {var: {cadeau_montre_acier: "+1"}}
      - label: "Je la laisse sur le zinc"
        reponse: "Il la reprend sans vexation, la remonte d'un tour de molette et la range dans sa poche. « Elle attendra. Elles attendent toujours. »"

  - id: sc.chaise_refusee
    titre: "La chaise refusée"
    roles: [ds]
    lieu: clubhouse
    tranches: [matin, aprem]
    qui: passante
    si: "annee <= 2012"
    texte: "Madame Vialat, l'Inspecteur des comptes, refuse la chaise que tu lui tends et pose son sac à ses pieds. « Votre masse salariale a pris six points en un mercato. Vous m'expliquez, ou je recompte ? »"
    choix:
      - label: "Je vous explique"
        reponse: "Tu expliques pendant quarante minutes. Elle note tout debout, sur un carnet tenu contre son avant-bras. À la fin, elle reprend son sac. « Je recompte quand même. »"
        effets: {jauges: {caisse: 1}}
      - label: "Recomptez"
        reponse: "Elle sort une calculette, l'allume, et recompte devant toi, colonne par colonne, sans lever les yeux. Le bruit des touches dure jusqu'à midi."
        effets: {jauges: {caisse: -1}}

  - id: sc.liste_du_coach
    titre: "La liste du coach"
    roles: [ds]
    lieu: terrain
    tranches: [matin]
    qui: passant
    texte: "Le coach te tend une feuille pliée en quatre au bord du terrain annexe, sans quitter sa séance des yeux. « Un latéral gauche. Un seul nom, en haut. Les autres, c'est pour faire joli. »"
    choix:
      - label: "J'achète le premier nom"
        reponse: "Le premier nom coûte le double des autres. Tu signes. Le coach ne dit pas merci ; à la séance suivante, il te montre le couloir gauche, enfin occupé."
        effets: {jauges: {vestiaire: 2, caisse: -2}}
      - label: "Je prends le troisième"
        reponse: "Le troisième nom arrive un lundi, en costume. Le coach lui serre la main, puis vient vers toi et te rend sa feuille, pliée en huit, cette fois."
        effets: {jauges: {caisse: 1, vestiaire: -1}}

  - id: sc.pendant_l_homelie
    titre: "Pendant l'homélie"
    roles: [ds]
    lieu: eglise
    tranches: [matin]
    texte: "On enterre un ancien du club à Saint-Aubin. Pendant l'homélie, ton portable vibre dans ta poche : un agent de Halvenne, pour la quatrième fois. La veuve est au premier rang."
    choix:
      - label: "Je sors décrocher"
        reponse: "Sur les marches, l'agent te donne un chiffre que tu notes au dos du faire-part. Quand tu rentres, on chante ; la veuve se retourne une seule fois, vers toi."
        effets: {jauges: {caisse: 2, tribunes: -1}}
      - label: "Je l'éteins"
        reponse: "Tu l'éteins sans regarder l'écran. À la sortie, la veuve te serre la main et dit que son mari, lui, aurait décroché. Elle le dit avec tendresse."
        effets: {jauges: {tribunes: 1}}

  - id: sc.fin_de_cycle
    titre: "Fin de cycle"
    roles: [ds]
    lieu: clubhouse
    tranches: [soir]
    si: "annee >= 2024"
    texte: "Sur l'écran de ton bureau, le modèle a passé ton capitaine en rouge pendant la nuit : « fin de cycle », une courbe qui descend. Au même moment, le capitaine frappe à ta porte."
    choix:
      - label: "Je ferme l'écran"
        reponse: "Tu rabats l'écran avant qu'il entre. Il te parle de son fils, d'une école, d'un bail à renouveler. La courbe attend derrière le couvercle, toujours rouge."
        effets: {jauges: {vestiaire: 1, direction: -1}}
      - label: "Je lui montre l'écran"
        reponse: "Il regarde sa courbe longtemps, les mains dans le dos, comme une radio de ses poumons. « Elle a raison ? » Tu ne réponds pas. Il hoche la tête et ressort."
        effets: {jauges: {vestiaire: -2, caisse: 1}}

  - id: sc.recrue_car_de_nuit
    titre: "Le sac de riz"
    roles: [ds]
    lieu: gareRoutiere
    tranches: [nuit]
    texte: "Ta recrue descend du car à deux heures, quai 3, avec une valise à roulettes et un sac de riz de cinq kilos. Il ne parle pas la langue. Il te tend un papier : ton nom, mal écrit."
    choix:
      - label: "Je le loge chez moi"
        reponse: "Il dort sur ton canapé, la valise contre les jambes. Au matin, la cuisine sent le riz et le gingembre, et il a réparé la chasse d'eau qui fuyait depuis août."
        effets: {jauges: {vestiaire: 2}}
      - label: "Je l'emmène à l'hôtel"
        francs: -300
        reponse: "Le veilleur de nuit lui tend une clé et un formulaire. Ta recrue remplit tout en majuscules, puis te serre la main deux fois, la seconde pour être sûr."

  - id: sc.vingt_mots
    titre: "Vingt mots"
    roles: [ds]
    lieu: clubhouse
    tranches: [matin, aprem]
    si: "mission(sc.recrue_car_de_nuit)"
    texte: "Ta recrue du car de nuit t'attend devant ton bureau, un cahier d'écolier à la main : vingt mots appris en trois semaines. Il te les récite dans l'ordre. Le vingtième est un juron du vestiaire."
    choix:
      - label: "Je corrige le vingtième"
        reponse: "Tu lui écris un autre mot à la place, plus poli. Il le recopie soigneusement, puis, en dessous, réécrit le juron, plus petit, pour ne pas l'oublier."
      - label: "J'éclate de rire"
        reponse: "Tu ris, et il rit avec toi sans savoir de quoi. Le soir même, tout le vestiaire connaît son vingt et unième mot : ton prénom, avec l'accent."
        effets: {jauges: {vestiaire: 1}}

  - id: sc.serviette_pliee
    titre: "La serviette pliée"
    roles: [ds]
    lieu: club_prive
    tranches: [soir]
    texte: "L'agent de ton meilleur joueur a réservé la table du fond du Rideau Rouge. Il fait glisser vers toi une serviette pliée ; dedans, un chiffre au rouge à lèvres. « Pour vous. Pas pour le club. »"
    choix:
      - label: "Je déplie la serviette"
        francs: 3000
        sale: true
        reponse: "L'enveloppe attendait sous la nappe. Le lundi, tu signes la prolongation de son joueur au prix de l'agent, sans discuter une ligne."
        effets: {jauges: {caisse: -2}}
      - label: "Je la laisse pliée"
        reponse: "Il la reprend, s'essuie la bouche avec, et commande deux cafés. « Vous coûtez cher, vous. » Le lundi, la prolongation se signe au prix du club, avec une heure de retard."
        effets: {jauges: {caisse: 1}}

  # ═══════════════════════════════════════════════════════ LE PRÉSIDENT
  - id: sc.patrons_en_papier
    titre: "Les patrons en papier"
    roles: [president]
    lieu: tailleur
    tranches: [matin, aprem]
    qui: commercant
    texte: "Le tailleur Brunel garde dans une armoire les patrons en papier de tous les présidents du club. Il prend tes mesures sans que tu aies rien commandé. « Le vôtre, je le range à côté de qui ? »"
    choix:
      - label: "À côté du meilleur"
        francs: -1200
        reponse: "Il range ton patron près de celui de 1962, au fond de l'armoire. Trois essayages plus tard, le costume tombe juste, sauf la poche intérieure, cousue plus profonde."
        effets: {jauges: {direction: 1}}
      - label: "Rangez-le à part"
        reponse: "Il roule ton patron dans un tube de carton et le pose seul sur l'armoire. « Comme vous voudrez. Ceux qu'on range à part, on les retrouve plus facilement. »"

  - id: sc.place_a_cote
    titre: "La place à côté de la vôtre"
    roles: [president]
    lieu: stade
    tranches: [aprem]
    jours: [lun, mar, mer, jeu, ven]
    qui: passant
    texte: "L'intendant de la tribune d'honneur déplie le plan des places de samedi sur un siège. « La maire et le banquier sont fâchés depuis mardi. Il n'y a qu'une place à côté de la vôtre. »"
    choix:
      - label: "La maire à côté de moi"
        reponse: "Samedi, la maire applaudit chaque corner. Le banquier, deux rangs derrière, ne lève pas les yeux de son programme, et ne rappelle pas le lundi."
        effets: {jauges: {tribunes: 1, caisse: -1}}
      - label: "Le banquier à côté de moi"
        reponse: "Samedi, le banquier commente chaque passe en pourcentage. La maire, deux rangs derrière, se lève à la mi-temps et ne revient pas."
        effets: {jauges: {caisse: 1, tribunes: -1}}

  - id: sc.deux_piles
    titre: "Deux piles d'enveloppes"
    roles: [president]
    lieu: clubhouse
    tranches: [aprem]
    qui: passante
    si: "phase == hiver"
    texte: "La comptable du club pose deux piles d'enveloppes sur ton bureau : les étrennes des salariés, et les intérêts de la banque, dus le 31. « Il y a de quoi faire une pile. Pas deux. »"
    choix:
      - label: "Les étrennes"
        reponse: "La lingère, le jardinier, le chauffeur du car : tu donnes les enveloppes toi-même, une par une. Le 2 janvier, la banque appelle avant neuf heures."
        effets: {jauges: {vestiaire: 2, caisse: -2}}
      - label: "La banque"
        reponse: "Les enveloppes des salariés retournent dans le tiroir. Le 24, quelqu'un a accroché au sapin du hall une étiquette en carton : « Joyeux Noël, la direction. »"
        effets: {jauges: {caisse: 2, vestiaire: -2}}

  - id: sc.cheque_en_blanc
    titre: "Le chèque en blanc"
    roles: [president]
    lieu: rue
    tranches: [matin]
    qui: passante
    si: "annee <= 2025"
    texte: "Une retraitée t'arrête sur le pont et te tend un chèque plié en deux, signé, sans montant. « Pour le club. Mettez ce qu'il faut. Mon mari aurait mis plus, mais il n'est plus là pour signer. »"
    choix:
      - label: "Je le lui rends"
        reponse: "Elle le reprend, déçue, et le range dans son porte-monnaie, avec la photo d'un homme en écharpe. « Alors je viendrai samedi. C'est moins cher. »"
        effets: {jauges: {tribunes: 1}}
      - label: "Je garde le chèque"
        reponse: "Il dort trois semaines dans ton portefeuille, sans montant. Un soir de déficit, tu y écris un chiffre, petit, et tu le déposes sans regarder le guichetier."
        effets: {jauges: {caisse: 1}}

  - id: sc.prix_des_berges
    titre: "Le prix des berges"
    roles: [president]
    lieu: banque
    tranches: [matin, aprem]
    qui: passant
    texte: "À la Banque Aubérivoise, on te sert un café, puis une estimation : le terrain du stade au prix des berges. Le directeur : « Je ne vous dis pas de vendre. Je vous dis ce que vous valez. »"
    choix:
      - label: "Je range l'estimation"
        reponse: "Tu la plies dans ta poche intérieure. Le soir, à la table de la cuisine, tu refais le calcul trois fois au dos d'une enveloppe, et tu trouves trois fois le même chiffre."
        effets: {jauges: {direction: 1}}
      - label: "Je la déchire devant lui"
        reponse: "Tu la déchires au-dessus de sa soucoupe. Il ne bouge pas. « J'en ai une copie, évidemment. » Il te raccompagne jusqu'à la porte tournante."
        effets: {jauges: {tribunes: 1, direction: -1}}

  - id: sc.a_main_levee
    titre: "À main levée"
    roles: [president]
    lieu: buvette
    tranches: [soir]
    qui: fan
    si: "annee >= 2034"
    texte: "La table du fond de la buvette se tait quand tu entres. Le plus vieux des socios pousse une chaise vers toi du bout du pied. « On vote ce soir, à main levée. On voulait que tu voies comment. »"
    choix:
      - label: "Je m'assois avec eux"
        reponse: "Ils votent pour un car de déplacement et contre un tifo trop cher. Tu ne lèves pas la main. À la fin, on te sert une bière ; l'assemblée l'apprend dès le lendemain."
        effets: {jauges: {tribunes: 2, direction: -1}}
      - label: "Je reste debout"
        reponse: "Ils votent sans toi. Le plus vieux compte les bras à voix haute, puis se tourne vers toi : « Unanimité, moins un. » Personne ne rit."
        effets: {jauges: {tribunes: -1}}

  - id: sc.stage_du_fils
    titre: "Le stage du fils"
    roles: [president]
    lieu: brasserie
    tranches: [midi]
    qui: passant
    texte: "Le représentant des actionnaires coupe sa viande en petits morceaux réguliers, à la brasserie du Pont. « Mon fils sort d'école. Six mois au club, un bureau, un titre. Il ne coûtera rien. Presque. »"
    choix:
      - label: "Il aura son bureau"
        reponse: "Le fils arrive lundi avec un ordinateur et une plante verte. Il pose la plante sur le bureau de la comptable, qui la déplace sur le palier dès qu'il a le dos tourné."
        effets: {jauges: {direction: 2, vestiaire: -1}}
      - label: "Le club n'embauche pas"
        reponse: "Il pose ses couverts parallèles sur l'assiette, comme on ferme un dossier. Il paie sa part, exactement, au centime, et te laisse le pourboire."
        effets: {jauges: {direction: -2}}

  - id: sc.deux_projecteurs_sur_six
    titre: "Deux projecteurs sur six"
    roles: [president]
    lieu: stade
    tranches: [soir]
    qui: passant
    texte: "Au pied d'un pylône de la Nord, l'électricien braque sa lampe frontale vers le haut. « Deux projecteurs sur six sont morts. Si un troisième lâche samedi, l'arbitre arrête le match. »"
    choix:
      - label: "Remplacez les six"
        reponse: "Samedi, la Nord est si éclairée qu'on voit les visages du dernier rang. Le trésorier, lui, ne voit que la facture, qu'il épingle sur ta porte."
        effets: {jauges: {caisse: -3, tribunes: 1}}
      - label: "Remplacez les deux morts"
        reponse: "Samedi, à la soixante-dixième, un projecteur clignote, hésite, et tient. Toute la Nord le regarde au lieu du match, et l'applaudit quand il se stabilise."
        effets: {jauges: {caisse: -1}}

  - id: sc.mercredis_de_l_ecole
    titre: "Les mercredis de l'école"
    roles: [president]
    lieu: ecole
    tranches: [aprem]
    jours: [lun, mar, jeu, ven]
    qui: passant
    texte: "Dans sa cour bitumée, le directeur de l'école te montre deux buts tracés à la craie. « Le terrain annexe, le mercredi matin, pour les CE2. Votre entraîneur dit non. Vous, vous dites quoi ? »"
    choix:
      - label: "Les CE2 auront l'annexe"
        reponse: "Le premier mercredi, quarante enfants en baskets courent derrière six ballons. L'entraîneur regarde depuis le parking, son café à la main, et ne vient pas dire bonjour."
        effets: {jauges: {tribunes: 2, vestiaire: -1}}
      - label: "L'entraîneur a raison"
        reponse: "Le directeur efface d'un coup de pied un des buts à la craie. « On a la cour. On a toujours eu la cour. »"
        effets: {jauges: {vestiaire: 1, tribunes: -1}}

  - id: sc.maillots_reprises
    titre: "Les maillots reprisés"
    roles: [president]
    lieu: laverie
    tranches: [matin, aprem]
    qui: passante
    texte: "La lingère du club étale sur une machine de la laverie un maillot reprisé six fois au même coude. « Un jeu neuf coûte le prix d'une prime. Vous ne direz pas aux joueurs que c'est le même. »"
    choix:
      - label: "Commandez des jeux neufs"
        reponse: "Les jeux neufs arrivent un jeudi, sous plastique. La lingère garde le vieux maillot reprisé, plié dans son armoire, « pour quand on redescendra »."
        effets: {jauges: {vestiaire: 1, caisse: -2}}
      - label: "On reprise encore"
        reponse: "Elle enfile une aiguille sans lunettes, du premier coup. Samedi, un milieu adverse attrape ton numéro 6 par le coude, et la reprise tient."
        effets: {jauges: {caisse: 1}}

  # ══════════════════════════════════════════════════ LE SÉLECTIONNEUR
  - id: sc.minibar
    titre: "Le minibar"
    roles: [selectionneur]
    lieu: domicile
    tranches: [nuit]
    si: "!flag(histoire_h9)"
    texte: "Le minibar ronronne dans le noir de ta chambre d'hôtel. Sur la note glissée sous ta porte, la Fédération a souligné en rouge deux bières de la veille, et écrit dans la marge : « à rembourser »."
    choix:
      - label: "Je rembourse"
        francs: -15
        reponse: "Tu poses les pièces sur la note et la redescends toi-même à la réception. Le veilleur les compte, te rend un reçu, et le tamponne deux fois, sans rire."
        effets: {jauges: {direction: 1}}
      - label: "Je vide le minibar"
        reponse: "Tu bois les deux dernières bières à la fenêtre, face au stade éteint. Le lendemain, la note est sous ta porte, refaite, et le rouge a gagné une ligne."
        effets: {jauges: {direction: -1}}

  - id: sc.quarante_de_fievre
    titre: "Quarante de fièvre"
    roles: [selectionneur]
    lieu: domicile
    tranches: [nuit]
    si: "!flag(histoire_h9)"
    texte: "On frappe à ta chambre, à deux heures. Ton milieu titulaire, en survêtement, son sac déjà fait. « Mon fils a quarante de fièvre. Je prends le premier car. Je reviens pour le match. Ou pas. »"
    choix:
      - label: "Pars, reviens mercredi"
        reponse: "Il descend par l'escalier de service, son sac serré contre lui. Mercredi, il revient par le même escalier, rasé, et s'entraîne deux fois plus que les autres."
        effets: {jauges: {vestiaire: 2, direction: -1}}
      - label: "Tu restes avec le groupe"
        reponse: "Il pose son sac contre ta porte et s'assoit dessus, dans le couloir, jusqu'à l'aube. Au petit-déjeuner, il ne mange rien ; son téléphone reste posé contre sa tasse."
        effets: {jauges: {vestiaire: -2, direction: 1}}

  - id: sc.promesse_du_comptoir
    titre: "La promesse du comptoir"
    roles: [selectionneur]
    lieu: buvette
    tranches: [soir]
    qui: fan
    texte: "Un supporter frappe le zinc de la buvette avec sa chope en te voyant entrer. « Le petit de chez nous, l'ailier : tu le prends, oui ou non ? Tout le comptoir veut le savoir avant le journal. »"
    choix:
      - label: "Il est sur ma liste"
        reponse: "La buvette chante son nom jusqu'à minuit. Le lendemain, L'Écho titre sur « la promesse du comptoir », et ta liste de {groupe} compte un nom de plus dans toutes les bouches."
        effets: {jauges: {tribunes: 2, vestiaire: -1}}
      - label: "La liste sort jeudi"
        reponse: "Il repose sa chope doucement, comme on pose une arme. « Jeudi. » Il le répète à chaque client qui entre, jusqu'à la fermeture."
        effets: {jauges: {tribunes: -1}}

  - id: sc.papier_sur_le_micro
    titre: "Le papier sur le micro"
    roles: [selectionneur]
    lieu: hotel
    tranches: [matin]
    qui: passant
    texte: "Dans le salon de l'hôtel changé en salle de presse, l'attaché de la Fédération colle un papier sur ton micro : trois noms que tu ne dois pas prononcer. Les caméras s'allument."
    choix:
      - label: "Je décolle le papier"
        reponse: "Tu le décolles devant les caméras et le plies dans ta poche. Tu ne dis aucun des trois noms ; tout le pays les cherche dans le journal du lendemain."
        effets: {jauges: {tribunes: 2, direction: -2}}
      - label: "Je parle autour"
        reponse: "Tu parles quarante minutes sans prononcer un nom de trop. L'attaché te serre la main à la sortie, et décolle le papier du micro pour le classer."
        effets: {jauges: {direction: 1}}

  - id: sc.deux_passeports
    titre: "Deux passeports"
    roles: [selectionneur]
    lieu: cafe_mairie
    tranches: [midi]
    qui: passant
    texte: "Le père d'un attaquant de Tissemont pose deux passeports côte à côte sur la table du café de la Mairie. « L'autre sélection l'appelle lundi. Vous l'appelez avant, ou vous le leur laissez ? »"
    choix:
      - label: "Je l'appelle ce soir"
        reponse: "Le fils décroche à la première sonnerie et dit oui avant que tu aies fini ta phrase. Dans le groupe, deux anciens apprennent la nouvelle par la radio."
        effets: {jauges: {tribunes: 2, vestiaire: -1}}
      - label: "Qu'il choisisse seul"
        reponse: "Le père range un passeport dans sa veste, l'autre dans son portefeuille. Lundi, l'autre sélection publie la photo du fils, souriant, à côté de leur drapeau."
        effets: {jauges: {tribunes: -1}}

  - id: sc.gamin_de_la_grille
    titre: "Le gamin de la grille"
    roles: [selectionneur]
    lieu: stade
    tranches: [aprem]
    qui: enfant
    texte: "Un gamin en maillot des Cobalts attend devant la grille du stade depuis midi, un cahier contre le ventre. Le portier te glisse : « Il vient à chaque rassemblement. Personne ne vient le chercher. »"
    choix:
      - label: "Je fais signer le groupe"
        reponse: "Les {groupe} signent, même le troisième gardien, qui ne signe jamais. Le gamin repart avec le cahier contre son ventre. À sept heures, quelqu'un le raccompagne au coin de la rue."
        effets: {jauges: {tribunes: 1, vestiaire: 1}}
      - label: "Je signe, et je passe"
        reponse: "Tu signes sous la photo d'un ancien. Le gamin te remercie sans lever les yeux du cahier, déjà tourné vers la sortie des vestiaires, où paraît ton capitaine."

  - id: sc.pas_en_novembre
    titre: "Pas en novembre"
    roles: [selectionneur]
    lieu: terrain
    tranches: [matin]
    qui: passant
    texte: "L'entraîneur du club local te rejoint derrière la haie du terrain annexe, deux cafés à la main. « Vous êtes là pour mon arrière droit. Prenez-le, mais pas en novembre : on joue le maintien. »"
    choix:
      - label: "Je le prends en novembre"
        reponse: "Il vide son café dans la haie. En novembre, son arrière droit joue pour toi, et son club perd deux fois sans lui. On te le rappelle à chaque passage en ville."
        effets: {jauges: {vestiaire: 1, tribunes: -1}}
      - label: "Je le laisse au club"
        reponse: "Il te tend le second café, cette fois. « Je vous dois quelque chose. » En mars, il t'appelle pour te signaler un gamin de dix-sept ans, avant tout le monde."
        effets: {jauges: {vestiaire: -1}}

  - id: sc.consultants_du_dimanche
    titre: "Le plateau du dimanche soir"
    roles: [selectionneur]
    lieu: domicile
    tranches: [soir]
    jours: [dim]
    si: "!flag(histoire_h9)"
    texte: "La télévision de ta chambre d'hôtel passe un plateau du dimanche soir : quatre consultants, ta photo en grand derrière eux. L'un d'eux te tutoie sans t'avoir jamais serré la main."
    choix:
      - label: "J'appelle la chaîne"
        reponse: "On te passe à l'antenne après une page de publicité. Tu parles deux minutes, calmement. Le consultant, lui, te vouvoie jusqu'à la fin de l'émission."
        effets: {jauges: {tribunes: 1, direction: -1}}
      - label: "J'éteins"
        reponse: "L'écran garde une seconde ta photo en fantôme, puis le noir. Dans la chambre voisine, la même émission continue derrière la cloison, et tu l'entends rire."

  - id: sc.femme_de_chambre
    titre: "La femme de chambre"
    roles: [selectionneur]
    lieu: domicile
    tranches: [soir]
    qui: passante
    si: "!flag(histoire_h9)"
    texte: "La femme de chambre frappe pour la couverture du soir et trouve ta liste des {groupe} étalée sur le lit. Elle ne la regarde pas. « Mon neveu joue à Castérac. Pied gauche. Il est bon, je crois. »"
    choix:
      - label: "Je note son nom"
        reponse: "Tu l'écris en bas de la liste, en dehors des {groupe}, au crayon. Elle tire la couverture, pose le chocolat sur l'oreiller, et repart sans demander quand."
        effets: {jauges: {tribunes: 1}}
      - label: "La liste est fermée"
        reponse: "Elle plie la couverture en triangle, très exactement. Le chocolat sur l'oreiller est à la menthe, ce soir ; les autres soirs, il était au lait."

  - id: sc.du_bien_ou_du_vrai
    titre: "Du bien, ou du vrai"
    roles: [selectionneur]
    lieu: hotel
    tranches: [soir]
    qui: ancien
    texte: "Seul au comptoir de l'hôtel, un ancien capitaine des Cobalts boit son verre, cinquante sélections sur le visage. Il le lève vers toi. « Je passe à la télé dimanche. Je dis du bien, ou du vrai ? »"
    choix:
      - label: "Du vrai"
        reponse: "Dimanche, à la télé, il dit que ton groupe ne court pas assez et que tu le sais. Lundi, le groupe court. Il te fait porter une bouteille, avec un mot : « Voilà. »"
        effets: {jauges: {tribunes: -1, vestiaire: 1}}
      - label: "Du bien"
        reponse: "Dimanche, il dit du bien de toi, longtemps, avec des mots qu'il n'emploie jamais. Le pays y croit à moitié ; toi, pas du tout, et il le sait."
        effets: {jauges: {tribunes: 1}}
