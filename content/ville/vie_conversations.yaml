# LA VIE D'AUBÉRIVE — les conversations qu'on surprend, hors des histoires.
#
# Le porteur du projet : « les phases sans histoires sont trop vides, il ne se passe pas
# grand-chose dans la ville ; dans Punch Club il y a plein de choses à faire partout ».
# Ici, la ville parle d'elle-même : deux ou trois personnes à leurs places dans une pièce,
# qu'on entend en bulles en passant près d'elles (ville_cinema.js), une fois par carrière.
# Les conversations des dix livres sont dans leurs propres fichiers (cinematiques_hN.yaml) ;
# celles-ci ne touchent à aucune intrigue : le ragot, la dispute, la blague, la peur, le deuil,
# le loyer, le samedi, le football qui change — et le héros vu de loin, par son rôle.
#
# Les règles de ce lot (en plus de docs/bible/charte_histoire.md et de
# docs/histoires/scenes_jouees.md § 4) :
# - Des voix sans nom (`passant`, `passante`, `ancien`, `enfant`, `fan`, `commercant`,
#   `commercant2`, `garagiste`, `portier`, `inconnu`), chacune avec son `nom` affiché. Jamais
#   deux fois le même `qui` dans une conversation : la ville fait parler la première figure
#   de ce `qui` qu'elle trouve dans la pièce, les deux voix n'en feraient qu'une.
# - Le personnel d'un commerce parle par `commercant` à la place `personnel` : c'est la figure
#   que la pièce y a déjà posée (son corps est celui de `interieurs.json` → `personnel` :
#   un homme pour `commercant2`, `garagiste` ou `portier`, une femme pour `commercant`), et son
#   `nom` dit le même genre. Ailleurs, `commercant` est une femme en blouse, `commercant2` un
#   homme en veste bleue, `garagiste` un homme en bleu de travail, `portier` un homme en noir.
# - Aucune place d'un personnage d'un livre (la boulangère Marie-Jo, Gégé au fond de la
#   buvette, Lhoste au Corner…) : les clients aux places `client`, les visiteurs aux places
#   `visiteur`, le personnel à la sienne.
# - Chaque `si` tient l'époque : un objet daté (francs, fax, cassette, portable, écus, le Flux,
#   la vidéo, Kick…) porte son année ; le héros n'est jamais accordé au masculin
#   (`{pg, select, f{…} other{…}}`) ; on ne lui parle jamais, on parle de lui.
# - Ce qu'un livre laisse au monde (docs/histoires/00_les_dix_histoires.md § 10 de chaque
#   fiche) ne revient ici qu'après les années du livre, en passant, sans rien expliquer.
# - Dans une pièce, les conversations les plus étroites d'abord (un rôle, un jour, une
#   série), la plus large en dernier : la ville joue la première dont le `si` est vrai.
#
# Les époques, et les livres qui les jouent : avant 1999 (les quatre livres de 1990),
# 1999-2010 (La Maquette, 23 h 58), 2011-2023 (Chambre 12), 2024-2036 (L'Oreillette,
# Vingt degrés dedans), 2037 et après (Les Deux Téléphones). Sans année, une conversation
# doit tenir de 1990 à 2050.

conversations:

  # ════════════════════════════════════════════════ L'AGENCE (Immobilier Tessandier)
  # matin, après-midi ; l'employée se tient à la place de Clémence, hors des années du livre 10

  - id: vie.cv.agence.prime_de_l_usine
    si: "annee >= 1991 && annee < 1999"
    lieu: agence
    tranches: [matin, aprem]
    qui:
      - {id: lui, qui: passant, nom: "Un client", place: client_1}
      - {id: elle, qui: passante, nom: "Sa femme", place: visiteur}
    repliques:
      - {qui: lui, dit: "Le pavillon de la rue Haute, trois cent quarante mille francs. Avec la prime de la Tréfilerie, on a le premier tiers."}
      - {qui: elle, dit: "Le premier tiers. Et le reste, tu le paies avec quoi ? Avec tes samedis au virage ?"}
      - {qui: lui, dit: "Y a un jardin. Le petit pourra taper dans un ballon sans casser de carreau."}
      - {qui: elle, dit: "Un carreau, on en a cassé un, dans ce jardin. J'avais neuf ans. Le ballon de mon frère.", emote: "..."}

  - id: vie.cv.agence.la_maquette
    si: "annee >= 2003 && annee < 2037"
    lieu: agence
    tranches: [matin, aprem]
    qui:
      - {id: employee, qui: commercant, nom: "L'employée de l'agence", place: clemence}
      - {id: vieux, qui: ancien, nom: "Un vieux monsieur", place: client_1}
    repliques:
      - {qui: employee, dit: "La maquette n'est pas à vendre, monsieur. La seconde tranche ne s'est jamais faite."}
      - {qui: vieux, dit: "L'acheter ? Je viens voir ma rue. Elle est sous le parking en carton, là, à gauche du petit arbre."}
      - {qui: employee, dit: "Le soleil de la vitrine a mangé les couleurs. La patronne parle de la descendre à la cave."}
      - {qui: vieux, dit: "Laissez-la au soleil. Tant qu'elle jaunit dans votre vitrine, ils ont pas trouvé l'argent."}

  - id: vie.cv.agence.la_marque_de_l_eau
    si: "annee >= 2024 && annee < 2037"
    lieu: agence
    tranches: [matin, aprem]
    qui:
      - {id: client, qui: passant, nom: "Un client", place: client_1}
      - {id: employee, qui: commercant, nom: "L'employée de l'agence", place: clemence}
    repliques:
      - {qui: client, dit: "Le pavillon du quai, celui avec la marque de la crue sur le mur du garage. Vous en demandez combien ?"}
      - {qui: employee, dit: "Il faudrait le visiter. Le propriétaire a repeint deux fois, mais la marque remonte."}
      - {qui: client, dit: "Le visiter, non. Je veux savoir combien on y perd si on attend l'hiver."}
      - {qui: employee, dit: "Vous êtes de l'assurance ? Le propriétaire nous a dit que quelqu'un passerait."}
      - {qui: client, dit: "Je suis son fils. L'assurance, c'est jeudi."}

  - id: vie.cv.agence.vue_sur_le_but
    si: "!flag(histoire_h10)"
    lieu: agence
    tranches: [matin, aprem]
    qui:
      - {id: client, qui: passant, nom: "Un client", place: client_1}
      - {id: employee, qui: commercant, nom: "L'employée de l'agence", place: clemence}
    repliques:
      - {qui: client, dit: "Je cherche une fenêtre sur la Rive. Sur le stade, je veux dire, pas sur la rivière."}
      - {qui: employee, dit: "Côté pelouse, il n'y a que les deux immeubles de la rue du Stade. Du quatrième, on voit un but. Un seul."}
      - {qui: client, dit: "Lequel ?"}
      - {qui: employee, dit: "Le but nord, sous le virage. Vous êtes abonné ?"}
      - {qui: client, dit: "Mon fils est gardien remplaçant. Il m'a demandé d'arrêter de venir au stade. Pour les fenêtres, il a rien dit."}

  - id: vie.cv.agence.un_samedi_sur_deux
    lieu: agence
    tranches: [matin, aprem]
    qui:
      - {id: elle, qui: passante, nom: "Une future mère", place: visiteur}
      - {id: lui, qui: passant, nom: "Un futur père", place: client_1}
    repliques:
      - {qui: elle, dit: "Un deux-pièces, ça suffit. La première année, le bébé dort avec nous."}
      - {qui: lui, dit: "Et le samedi après-midi ? Avec le bruit du stade, il dormira jamais."}
      - {qui: elle, dit: "Le samedi, tu le promènes le long du quai. Moi, je vais en Nord. Un samedi sur deux, on a dit."}
      - {qui: lui, dit: "On a dit ça quand ?"}
      - {qui: elle, dit: "Le soir où tu m'as demandée en mariage. À la buvette, devant tout le virage. Y a des témoins."}

  # ════════════════════════════════════════════════ L'APPARTEMENT (rue des Lilas, le troisième)
  # chez toi : ceux qui entrent le jour, la porte ouverte (le plombier, la concierge, un technicien)

  - id: vie.cv.appartement.l_antenne
    si: "annee < 1999"
    lieu: appartement
    tranches: [matin, aprem]
    qui:
      - {id: antenniste, qui: garagiste, nom: "L'antenniste", place: fenetre}
      - {id: concierge, qui: commercant, nom: "La concierge", place: milieu}
    repliques:
      - {qui: antenniste, dit: "Plein sud, vers le relais de Valdorne. Avec ça, plus de neige sur la régionale, même les soirs d'orage."}
      - {qui: concierge, dit: "Celui d'avant, il regardait que les résumés de vingt-trois heures. Et il montait le son pour tout l'escalier."}
      - {qui: antenniste, dit: "Au troisième, c'est le meilleur angle de la rue. Le café de la Mairie capte moins bien que vous."}
      - {qui: concierge, dit: "Il le savait. Deux francs aux voisins, pour voir les buts. Moi, il me faisait pas payer."}

  - id: vie.cv.appartement.le_boitier
    si: "annee >= 1999 && annee < 2020"
    lieu: appartement
    tranches: [matin, aprem]
    qui:
      - {id: technicien, qui: commercant2, nom: "Le technicien", place: telephone}
      - {id: concierge, qui: commercant, nom: "La concierge", place: milieu}
    repliques:
      - {qui: technicien, dit: "Je vous pose le boîtier à côté du téléphone. Avec ça, l'internet monte jusqu'au troisième."}
      - {qui: concierge, dit: "Et sur l'internet, on retrouve n'importe qui ? Même quelqu'un qui est parti à la Capitale ?"}
      - {qui: technicien, dit: "Faut son nom exact. Et qu'il ait envie qu'on le retrouve, souvent."}
      - {qui: concierge, dit: "Son nom exact, je le connais. C'est moi qui le lui ai donné."}

  - id: vie.cv.appartement.le_climatiseur
    si: "annee >= 2024"
    lieu: appartement
    tranches: [matin, aprem]
    qui:
      - {id: electricien, qui: garagiste, nom: "L'électricien", place: fenetre}
      - {id: gardienne, qui: commercant, nom: "La gardienne", place: milieu}
    repliques:
      - {qui: electricien, dit: "Je perce sous la fenêtre. Le bloc dehors, côté cour, sinon le voisin d'en face porte plainte."}
      - {qui: gardienne, dit: "Contre le stade, il a déjà porté plainte. Trente ans qu'il vit en face de la Rive."}
      - {qui: electricien, dit: "Et il déménage pas ?"}
      - {qui: gardienne, dit: "Le samedi, à cinq heures moins le quart, il ouvre sa fenêtre en grand. Il dit que c'est pour aérer."}

  - id: vie.cv.appartement.la_chaudiere
    lieu: appartement
    tranches: [matin, aprem]
    qui:
      - {id: plombier, qui: garagiste, nom: "Le plombier", place: cuisine}
      - {id: apprenti, qui: passant, nom: "L'apprenti", place: milieu}
    repliques:
      - {qui: plombier, dit: "Elle cogne, l'eau dort dans le tuyau. Faudrait la purger chaque automne. Personne le fait."}
      - {qui: apprenti, dit: "La voisine dit que le locataire d'avant tapait dessus avec une cuillère, la nuit."}
      - {qui: plombier, dit: "Et la dame du cinquième répondait avec la sienne. Trois coups, deux coups. Tout l'immeuble les entendait."}
      - {qui: apprenti, dit: "Ils se disaient quoi ?"}
      - {qui: plombier, dit: "J'ai jamais su. Quand il est parti en maison de retraite, elle a demandé qu'on la répare surtout pas, la chaudière."}

  # ════════════════════════════════════════════════ LA BANQUE AUBÉRIVOISE
  # matin, après-midi, en semaine ; le guichetier (un homme) à sa place

  - id: vie.cv.banque.le_livret_de_la_petite
    si: "annee < 1999 && caisse < 40"
    lieu: banque
    tranches: [matin]
    qui:
      - {id: guichetier, qui: commercant, nom: "Le guichetier", place: guichetier}
      - {id: cliente, qui: passante, nom: "Une cliente", place: client_1}
    repliques:
      - {qui: guichetier, dit: "Le virement du club n'est pas arrivé, madame. Pourquoi, je n'ai pas le droit de vous le dire. Et je ne le sais pas."}
      - {qui: cliente, dit: "Dix-neuf ans que mon mari lave leurs maillots. Samedi, ils vont pas se laver tout seuls."}
      - {qui: guichetier, dit: "Je peux vous avancer cinq cents francs sur le livret de votre fille. Au-delà, je n'ai pas le droit."}
      - {qui: cliente, dit: "Le livret de la petite… C'est le club qui l'avait ouvert, quand elle est née. Cent francs dedans.", emote: "..."}

  - id: vie.cv.banque.le_bocal
    si: "flag(monde_ecus) && annee < 2007"
    lieu: banque
    tranches: [matin]
    qui:
      - {id: dame, qui: passante, nom: "Une vieille dame", place: client_2}
      - {id: guichetier, qui: commercant, nom: "Le guichetier", place: guichetier}
    repliques:
      - {qui: dame, dit: "Onze mille quatre cents francs en pièces, dans le bocal. Mon mari mettait de côté pour un abonnement à vie."}
      - {qui: guichetier, dit: "Ça fait à peu près mille sept cent cinquante écus. Je vous les mets sur le livret ?"}
      - {qui: dame, dit: "Y en a pas, d'abonnement à vie, au Racing. J'ai demandé au guichet du stade."}
      - {qui: guichetier, dit: "Alors pourquoi il mettait de côté ?"}
      - {qui: dame, dit: "Il disait qu'il le négocierait le jour d'un titre. Mettez-les sur un livret. À son nom à lui."}

  - id: vie.cv.banque.le_carnet_de_cheques
    si: "annee >= 2011 && annee < 2030"
    lieu: banque
    tranches: [aprem]
    qui:
      - {id: client, qui: ancien, nom: "Un vieux client", place: client_1}
      - {id: guichetier, qui: commercant, nom: "Le guichetier", place: guichetier}
    repliques:
      - {qui: client, dit: "Mon petit-fils dit que je peux tout faire sur le téléphone. Alors pourquoi je fais la queue ?"}
      - {qui: guichetier, dit: "Parce que vous avez gardé votre carnet de chèques, monsieur Peyrard. Vous êtes le dernier, avec le Racing."}
      - {qui: client, dit: "Le Racing paie encore par chèque ?"}
      - {qui: guichetier, dit: "Les arbitres des jeunes, oui. Ils passent les encaisser le lundi. Ça me fait de la visite."}

  - id: vie.cv.banque.le_coffre
    si: "annee >= 2024"
    lieu: banque
    tranches: [matin, aprem]
    qui:
      - {id: cliente, qui: passante, nom: "Une cliente", place: client_2}
      - {id: guichetier, qui: commercant, nom: "Le guichetier", place: guichetier}
    repliques:
      - {qui: cliente, dit: "Le coffre de mon père. Quarante ans qu'il payait la location pour ça : un billet et une médaille."}
      - {qui: guichetier, dit: "La finale de 1974. Poinçonné, le billet : il y était. Il y en a qui ont fait des faux, après."}
      - {qui: cliente, dit: "Il disait qu'il fallait pas le montrer. Que ça portait malheur au club."}
      - {qui: guichetier, dit: "Vous allez le garder au coffre ?"}
      - {qui: cliente, dit: "Je vais l'encadrer au-dessus de la télé. Le malheur, le club l'a eu quand même."}

  - id: vie.cv.banque.le_premier_contrat
    lieu: banque
    tranches: [matin, aprem]
    qui:
      - {id: guichetier, qui: commercant, nom: "Le guichetier", place: guichetier}
      - {id: jeune, qui: passant, nom: "Un jeune joueur", place: client_1}
    repliques:
      - {qui: guichetier, dit: "Votre premier contrat ? Je peux vous mettre les primes de match sur un compte à part."}
      - {qui: jeune, dit: "À part de quoi ? Y a encore rien sur l'autre."}
      - {qui: guichetier, dit: "À part de votre père. Il est passé ce matin demander si le club vous avait payé."}
      - {qui: jeune, dit: "Il a demandé combien ?"}
      - {qui: guichetier, dit: "Non. Il a demandé si vous aviez pensé à lui. J'ai dit que je n'en savais rien."}

  # ════════════════════════════════════════════════ LE CORNER (le bar du quartier)
  # midi, après-midi, soir ; le patron (un homme) derrière le comptoir

  - id: vie.cv.bar.le_sous_bock
    roles: [entraineur]
    si: "annee < 1999"
    lieu: bar
    tranches: [midi, aprem]
    qui:
      - {id: habitue, qui: ancien, nom: "Un habitué", place: comptoir_2}
      - {id: ouvrier, qui: passant, nom: "Un ouvrier", place: table_1}
      - {id: patron, qui: commercant, nom: "Le patron", place: patron}
    repliques:
      - {qui: habitue, dit: "{pg, select, f{La coach} other{Le coach}} a mis le petit à gauche et le vieux à droite. Moi, j'aurais fait l'inverse."}
      - {qui: ouvrier, dit: "Ton inverse, tu l'as écrit où ? Sur un sous-bock ?"}
      - {qui: habitue, dit: "Sur un sous-bock, oui. Dimanche dernier. Il est dans mon portefeuille."}
      - {qui: patron, dit: "Pour quoi faire ? Pour que le président t'appelle ?"}
      - {qui: habitue, dit: "La prochaine fois qu'on perd, je le glisse sous la porte du club-house."}

  - id: vie.cv.bar.la_14
    si: "jour == sam"
    lieu: bar
    tranches: [soir]
    qui:
      - {id: nouveau, qui: passant, nom: "Un nouveau", place: comptoir_1}
      - {id: patron, qui: commercant, nom: "Le patron", place: patron}
    repliques:
      - {qui: nouveau, dit: "Encore la même chanson. Ça fait quatre fois. Elle a qu'un disque, la dame du fond ?"}
      - {qui: patron, dit: "Le samedi soir, elle met la 14 au juke-box, autant de fois qu'il faut."}
      - {qui: nouveau, dit: "Il faut quoi ?"}
      - {qui: patron, dit: "Une fois par but du Racing. Les soirs de zéro, elle boit son café et elle écoute les chansons des autres."}

  - id: vie.cv.bar.le_flipper
    lieu: bar
    tranches: [aprem]
    qui:
      - {id: patron, qui: commercant, nom: "Le patron", place: patron}
      - {id: habitue, qui: ancien, nom: "Un habitué", place: comptoir_2}
    repliques:
      - {qui: patron, dit: "Le flipper a encore avalé une pièce. La troisième de la semaine. Il fait ça les jours de défaite."}
      - {qui: habitue, dit: "Il fait ça depuis que t'as collé la photo de la réserve de 1983 sur la vitre. Il aime pas qu'on le regarde."}
      - {qui: patron, dit: "Je l'enlève, la photo, et c'est toi qui me rembourses les pièces ?"}
      - {qui: habitue, dit: "Enlève-la, et moi je viens plus. Je suis dessus. Troisième en partant de la gauche."}

  - id: vie.cv.bar.trois_points
    si: "annee >= 1994 && annee < 2003"
    lieu: bar
    tranches: [soir]
    qui:
      - {id: ouvrier, qui: passant, nom: "Un ouvrier", place: table_1}
      - {id: vieux, qui: ancien, nom: "Un vieux du quartier", place: table_2}
    repliques:
      - {qui: ouvrier, dit: "Trois points la victoire, maintenant. Ils veulent qu'on attaque. Avec quels attaquants ?"}
      - {qui: vieux, dit: "Le nul vaut moins, c'est tout. Moi, j'ai toujours aimé le nul. On rentre, personne est fâché."}
      - {qui: ouvrier, dit: "Ta femme dit que c'est pour ça que tu l'as épousée. Pour le nul."}
      - {qui: vieux, dit: "Elle dit ça depuis quarante ans, et elle est toujours là. Un point chacun."}

  - id: vie.cv.bar.trente_secondes
    si: "annee >= 2024"
    lieu: bar
    tranches: [soir]
    qui:
      - {id: patron, qui: commercant, nom: "Le patron", place: patron}
      - {id: habituee, qui: passante, nom: "Une habituée", place: table_1}
    repliques:
      - {qui: patron, dit: "Quatre-vingts écus par mois pour avoir le Racing sur l'écran, et vous regardez tous vos téléphones."}
      - {qui: habituee, dit: "Sur le téléphone, on a tout en direct. Les courses, les pourcentages, le cœur du gardien."}
      - {qui: patron, dit: "Et quand on marque, vous levez tous la tête vers mon écran. En même temps, comme à la messe."}
      - {qui: habituee, dit: "Ton écran a trente secondes d'avance. Tu crois qu'on va attendre ?"}

  # ════════════════════════════════════════════════ LA BOULANGERIE (rue des Lilas)
  # matin, midi, sauf le lundi ; la vendeuse à sa place (la boulangère du livre 9 a la sienne)

  - id: vie.cv.boulangerie_residentiel.les_tartes
    si: "jour == dim && !flag(histoire_h9)"
    lieu: boulangerie_residentiel
    tranches: [matin]
    qui:
      - {id: vendeuse, qui: commercant, nom: "La vendeuse", place: vendeuse}
      - {id: mitron, qui: passant, nom: "Le mitron", place: visiteur}
    repliques:
      - {qui: vendeuse, dit: "Dix-huit tartes aux pommes avant neuf heures. Quelqu'un se marie, dans le quartier ?"}
      - {qui: mitron, dit: "Ben, c'est dimanche. On a gagné, hier. Les dimanches où on perd, ils prennent du pain sec."}
      - {qui: vendeuse, dit: "Et t'as appris ça où, toi qui dors tout le samedi ?"}
      - {qui: mitron, dit: "Au tabac du Quai. Ils prennent les paris sur nos tartes, maintenant. J'ai mis cinquante sur vingt-deux."}

  - id: vie.cv.boulangerie_residentiel.la_sirene_de_seize_heures
    si: "annee >= 1992 && annee < 1999"
    lieu: boulangerie_residentiel
    tranches: [matin, midi]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux client", place: client_1}
      - {id: vendeuse, qui: commercant, nom: "La vendeuse", place: vendeuse}
    repliques:
      - {qui: vieux, dit: "Je sais plus à quelle heure goûter. Depuis que la Tréfilerie sonne plus, je mange n'importe quand."}
      - {qui: vendeuse, dit: "Venez à quatre heures pile, je vous mettrai un pain au chocolat de côté."}
      - {qui: vieux, dit: "La sirène, c'était l'heure où ma femme sortait de l'atelier. Je mettais l'eau à chauffer pour le café."}
      - {qui: vendeuse, dit: "Elle sort toujours à quatre heures ?"}
      - {qui: vieux, dit: "Elle sort plus. Elle est à la maison toute la journée, avec ses indemnités. Je suis dans ses jambes, elle dit."}

  - id: vie.cv.boulangerie_residentiel.les_poussins
    si: "annee >= 2003 && annee < 2028"
    lieu: boulangerie_residentiel
    tranches: [matin]
    qui:
      - {id: client, qui: passant, nom: "Un client", place: client_1}
      - {id: vendeuse, qui: commercant, nom: "La vendeuse", place: vendeuse}
    repliques:
      - {qui: client, dit: "Vous avez vu le maillot des poussins ? « Fournil de la Zone », en grosses lettres. Le pain sous plastique."}
      - {qui: vendeuse, dit: "Ils ont mis un écu de plus par maillot. Un écu par gamin, vous vous rendez compte ?"}
      - {qui: client, dit: "C'était vous, avant, sur leurs maillots ?"}
      - {qui: vendeuse, dit: "Vingt ans. La photo est derrière la caisse. Votre fils est au deuxième rang, avec ses dents de lait."}

  - id: vie.cv.boulangerie_residentiel.l_eclair_au_cafe
    si: "!flag(histoire_h9)"
    lieu: boulangerie_residentiel
    tranches: [matin, midi]
    qui:
      - {id: vendeuse, qui: commercant, nom: "La vendeuse", place: vendeuse}
      - {id: cliente, qui: passante, nom: "Une cliente", place: client_1}
    repliques:
      - {qui: vendeuse, dit: "Deuxième passage de la matinée, Nadine. Vous avez faim, depuis que l'ailier a pris le studio d'en face ?"}
      - {qui: cliente, dit: "Il achète son pain à onze heures, après l'entraînement. Moi aussi, j'achète à onze heures. Et alors ?"}
      - {qui: vendeuse, dit: "Une ficelle et un éclair au café. Il regarde jamais la vitrine, que les prix."}
      - {qui: cliente, dit: "Et vous, vous savez ce qu'il prend, et dans quel ordre. Vous les notez depuis quand, ses passages ?", emote: "coeur"}

  # ════════════════════════════════════════════════ LA BOUTIQUE DU CLUB
  # le mercredi et le samedi après-midi ; la vendeuse à sa place

  - id: vie.cv.boutique.le_nom_au_dos
    roles: [joueur]
    lieu: boutique
    tranches: [aprem]
    qui:
      - {id: mere, qui: passante, nom: "Une mère", place: client_1}
      - {id: vendeuse, qui: commercant, nom: "La vendeuse", place: vendeur}
    repliques:
      - {qui: mere, dit: "Le maillot avec le nom de {nom}, taille dix ans. Les lettres bien droites : il vérifie."}
      - {qui: vendeuse, dit: "Je vous floque celui-là. La semaine dernière, sur ce même maillot, y avait un autre nom."}
      - {qui: mere, dit: "C'est moi qui vous l'ai rapporté, avec l'autre nom dessus. Il change de joueur préféré comme de chaussettes."}
      - {qui: vendeuse, dit: "Et celui-là, il le garde combien de temps, à votre avis ?"}
      - {qui: mere, dit: "Jusqu'au prochain match. {pg, select, f{Si elle} other{S'il}} marque samedi, je reviens pas."}

  - id: vie.cv.boutique.le_16
    si: "annee >= 2008 && annee < 2030"
    lieu: boutique
    tranches: [aprem]
    qui:
      - {id: gamine, qui: enfant, nom: "Une gamine", place: client_1}
      - {id: vendeuse, qui: commercant, nom: "La vendeuse", place: vendeur}
    repliques:
      - {qui: gamine, dit: "Vous avez pas le maillot des filles ? Celui de la gardienne, le 16."}
      - {qui: vendeuse, dit: "Le club en fait pas encore. L'année prochaine, on m'a dit, s'il y a de la demande."}
      - {qui: gamine, dit: "La demande, c'est moi. Et ma copine Inès. Ça fait deux."}
      - {qui: vendeuse, dit: "Je l'écris dans le cahier des commandes. Deux, c'est déjà plus que pour le maillot du président."}

  - id: vie.cv.boutique.la_derniere_echarpe
    si: "annee >= 2030"
    lieu: boutique
    tranches: [aprem]
    qui:
      - {id: vendeuse, qui: commercant, nom: "La vendeuse", place: vendeur}
      - {id: vieux, qui: ancien, nom: "Un vieil abonné", place: client_1}
    repliques:
      - {qui: vendeuse, dit: "Le club ferme la boutique en juin. Tout se vend sur le téléphone, livré en deux jours dans un carton."}
      - {qui: vieux, dit: "Et une écharpe, on la choisit comment ? On la touche sur l'écran ?"}
      - {qui: vendeuse, dit: "Sur une photo. Elle arrive pliée en quatre, avec un petit mot imprimé du club."}
      - {qui: vieux, dit: "Je vous prends les trois dernières. La première écharpe, quelqu'un vous la noue au cou. Il fait ça, votre carton ?"}

  - id: vie.cv.boutique.les_limaces
    lieu: boutique
    tranches: [aprem]
    qui:
      - {id: supporter, qui: fan, nom: "Un supporter", place: client_1}
      - {id: beaufrere, qui: passant, nom: "Son beau-frère", place: client_2}
      - {id: vendeuse, qui: commercant, nom: "La vendeuse", place: vendeur}
    repliques:
      - {qui: supporter, dit: "Moitié prix, le maillot de l'an dernier. Le sponsor a fait faillite en mars, c'est pour ça."}
      - {qui: beaufrere, dit: "Je porte pas un maillot de cette saison-là. Même à moitié prix. Même pour dormir."}
      - {qui: supporter, dit: "Qui te parle du stade ? C'est pour le jardin. Les limaces savent pas lire."}
      - {qui: vendeuse, dit: "Je vous fais les deux pour le prix d'un et demi. Votre beau-frère aussi a un jardin, non ?"}

  # ════════════════════════════════════════════════ LA BRASSERIE DU PONT
  # midi, soir ; le serveur (un homme) à sa place, la table de Corven laissée libre

  - id: vie.cv.brasserie.la_blanquette_du_jeudi
    si: "annee >= 2030 && jour == jeu"
    lieu: brasserie
    tranches: [midi]
    qui:
      - {id: serveur, qui: commercant, nom: "Le serveur", place: serveur}
      - {id: cliente, qui: passante, nom: "Une cliente", place: table_3}
    repliques:
      - {qui: serveur, dit: "Le monsieur de la table quatre, le jeudi, c'est le dernier de la photo de 1962. Le gardien."}
      - {qui: cliente, dit: "Il parle jamais du match ? D'habitude, les anciens, on peut plus les arrêter."}
      - {qui: serveur, dit: "Que du repas. Une blanquette, ici, le soir de la photo, et le patron de l'époque qui pleurait dans la sauce."}
      - {qui: cliente, dit: "Vous la faites encore, cette blanquette ?"}
      - {qui: serveur, dit: "Le jeudi, pour lui. Le chef dit qu'elle sortira de la carte le jeudi où la quatre restera vide."}

  - id: vie.cv.brasserie.l_ardoise_de_1987
    si: "annee < 1999"
    lieu: brasserie
    tranches: [midi]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieil habitué", place: table_3}
      - {id: serveur, qui: commercant, nom: "Le serveur", place: serveur}
    repliques:
      - {qui: vieux, dit: "Elle est encore là, l'ardoise du club ? Celle de 1987 ?"}
      - {qui: serveur, dit: "Dans le tiroir de la caisse. Quatorze mille francs de blanquettes et de quarts de rouge."}
      - {qui: vieux, dit: "Ils mangeaient comme quatre, les joueurs de l'époque. Sur le terrain, on les voyait moins."}
      - {qui: serveur, dit: "Le président dit qu'il paiera le jour d'un titre. Le patron a acheté un cadre pour l'ardoise."}

  - id: vie.cv.brasserie.le_drapeau
    si: "annee >= 1999 && annee < 2030"
    lieu: brasserie
    tranches: [soir]
    qui:
      - {id: lui, qui: passant, nom: "Un homme", place: table_2}
      - {id: elle, qui: passante, nom: "Une femme", place: table_3}
      - {id: serveur, qui: commercant, nom: "Le serveur", place: serveur}
    repliques:
      - {qui: lui, dit: "Et le penalty de dimanche soir, à la télé ? À la quatre-vingt-neuvième ? Fallait être aveugle pour siffler ça."}
      - {qui: elle, dit: "Ou bien placé. Le défenseur touche le pied avant le ballon. De là où il était, l'arbitre le voyait."}
      - {qui: lui, dit: "Vous en parlez, on dirait que vous y étiez. Vous étiez en tribune ?"}
      - {qui: elle, dit: "Sur la touche, avec un drapeau. Je fais la réserve le dimanche matin, et la D2 quand il leur manque quelqu'un."}
      - {qui: serveur, dit: "Je vous laisse la carte des desserts. Monsieur a sans doute besoin d'un moment."}

  - id: vie.cv.brasserie.la_table_du_pilier
    lieu: brasserie
    tranches: [midi, soir]
    qui:
      - {id: femme, qui: passante, nom: "Une cliente", place: table_1}
      - {id: mari, qui: passant, nom: "Son mari", place: table_2}
      - {id: serveur, qui: commercant, nom: "Le serveur", place: serveur}
    repliques:
      - {qui: femme, dit: "Pour le mariage : ta sœur à la table six, avec les cousins de Valdorne. Tu m'écoutes ?"}
      - {qui: mari, dit: "La six, derrière le pilier ? La place d'où on voit rien, comme en tribune."}
      - {qui: femme, dit: "Celle-là. Elle a dit du mal de ma robe, à notre mariage. Cette fois, elle verra le gâteau de dos."}
      - {qui: serveur, dit: "Je vous apporte les cafés, ou vous attendez le dessert pour finir de vous disputer ?"}

  # ════════════════════════════════════════════════ LA BUVETTE DU KOP
  # midi, après-midi, soir ; le barman (un homme) au comptoir, la table du fond à qui de droit

  - id: vie.cv.buvette.le_genou_gauche
    roles: [joueur]
    si: "annee < 1999"
    lieu: buvette
    tranches: [midi, soir]
    qui:
      - {id: jeune, qui: fan, nom: "Un jeune du virage", place: zinc_2}
      - {id: vieux, qui: ancien, nom: "Un vieux du virage", place: zinc_1}
      - {id: barman, qui: commercant, nom: "Le barman", place: barman}
    repliques:
      - {qui: jeune, dit: "{nom} est {pg, select, f{passée} other{passé}} hier soir. Tournée payée, et son verre pas touché."}
      - {qui: vieux, dit: "Payer sans boire, au virage ? Y a quelque chose à se faire pardonner, là-dessous."}
      - {qui: barman, dit: "Ou un genou à ménager. Debout toute la soirée, tout le poids sur la jambe gauche."}
      - {qui: jeune, dit: "Tu regardes leurs jambes, toi, maintenant ?"}
      - {qui: barman, dit: "Vingt ans que je sers le kop. Je sais qui jouera samedi avant le coach."}

  - id: vie.cv.buvette.le_tatouage
    si: "annee >= 2008 && annee < 2030"
    lieu: buvette
    tranches: [soir]
    qui:
      - {id: barman, qui: commercant, nom: "Le barman", place: barman}
      - {id: jeune, qui: fan, nom: "Un jeune du virage", place: zinc_3}
    repliques:
      - {qui: barman, dit: "T'es sur le Flux, mon grand. Torse nu sur la grille, avec le fumigène. Douze mille personnes ont vu ça."}
      - {qui: jeune, dit: "Douze mille ? C'est plus que la Rive un soir de pluie."}
      - {qui: barman, dit: "Dans tes douze mille, y a la préfecture. Et ta mère, qui a appelé ici à midi."}
      - {qui: jeune, dit: "Elle a dit quoi ?"}
      - {qui: barman, dit: "Qu'elle reconnaissait le tatouage. C'est elle qui avait signé l'autorisation, à tes seize ans."}

  - id: vie.cv.buvette.l_arbitre_sans_visage
    si: "annee >= 2027 && annee < 2037"
    lieu: buvette
    tranches: [midi, soir]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux du virage", place: zinc_1}
      - {id: jeune, qui: fan, nom: "Un jeune du virage", place: zinc_2}
      - {id: barman, qui: commercant, nom: "Le barman", place: barman}
    repliques:
      - {qui: vieux, dit: "Un arbitre sans visage. On l'insulte comment, une machine ?"}
      - {qui: jeune, dit: "Celui qui l'a écrite, tiens. Y a forcément quelqu'un derrière."}
      - {qui: barman, dit: "Celui qui l'a écrite, il a grandi dans ton virage. Le petit Coustel, de la rue Haute. Il grimpait sur la grille."}
      - {qui: vieux, dit: "Le petit Coustel… Je l'ai porté sur mes épaules à son premier derby. Je lui montrais les hors-jeu."}
      - {qui: jeune, dit: "C'est toi qui lui as tout appris, alors. T'as plus qu'à t'insulter tout seul."}

  - id: vie.cv.buvette.l_ardoise_de_marcel
    si: "role != selectionneur"
    lieu: buvette
    tranches: [midi, aprem]
    qui:
      - {id: barman, qui: commercant, nom: "Le barman", place: barman}
      - {id: marcel, qui: passant, nom: "Un habitué", place: zinc_3}
    repliques:
      - {qui: barman, dit: "Ton ardoise fait le tour du tableau, Marcel. Faudra l'effacer, ou m'acheter un deuxième tableau."}
      - {qui: marcel, dit: "Le jour où on gagne sur le terrain de {rival}, j'efface tout. Et je paie la tournée générale par-dessus."}
      - {qui: barman, dit: "Tu disais déjà ça quand t'avais des cheveux."}
      - {qui: marcel, dit: "Et je le pense toujours. C'est eux qui veulent pas coopérer."}

  - id: vie.cv.buvette.pas_un_seul_aube
    lieu: buvette
    tranches: [soir]
    qui:
      - {id: jeune, qui: fan, nom: "Un jeune du virage", place: zinc_2}
      - {id: vieux, qui: ancien, nom: "Un vieux du virage", place: zinc_1}
      - {id: barman, qui: commercant, nom: "Le barman", place: barman}
    repliques:
      - {qui: jeune, dit: "{Groupe} sélectionnés pour les Cobalts, et pas un seul Aube. Ce soir, je regarde pas."}
      - {qui: vieux, dit: "Tu regarderas. Tu diras que tu regardes pas, et tu regarderas debout."}
      - {qui: jeune, dit: "Et toi, quand ils jouent, t'es pour qui ?"}
      - {qui: vieux, dit: "Pour les autres. Depuis 1978. Ils ont laissé notre ailier sur le banc tout un tournoi."}
      - {qui: barman, dit: "Il dit ça. Au deuxième but des Cobalts, c'est lui qui a renversé la table.", emote: "note"}

  # ════════════════════════════════════════════════ LE CABINET
  # matin, après-midi, sauf le dimanche ; la salle d'attente (les médecins des livres ont leurs places)

  - id: vie.cv.cabinet.la_toise
    si: "annee >= 1991 && annee < 2000"
    lieu: cabinet
    tranches: [matin, aprem]
    qui:
      - {id: mere, qui: passante, nom: "Une mère", place: attente_1}
      - {id: gamin, qui: enfant, nom: "Un gamin", place: attente_2}
    repliques:
      - {qui: mere, dit: "Tiens-toi droit quand il te mesure. Au centre de formation, ils prennent les grands."}
      - {qui: gamin, dit: "Mbako, il est pas grand, et il joue avec les pros."}
      - {qui: mere, dit: "Mbako, il a une mère qui signe tout pour lui. Moi, je signe ce qu'on me dit de signer. Alors grandis."}
      - {qui: gamin, dit: "Et si je suis pas pris ?"}
      - {qui: mere, dit: "Alors on est jamais venus ici. Ton père a pas besoin de savoir qu'on a essayé."}

  - id: vie.cv.cabinet.le_chien_du_bord_de_touche
    si: "annee >= 2008 && annee < 2030"
    lieu: cabinet
    tranches: [matin, aprem]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux monsieur", place: attente_2}
      - {id: joueuse, qui: passante, nom: "Une jeune femme", place: attente_1}
    repliques:
      - {qui: vieux, dit: "Le nez cassé, mademoiselle ? Vous êtes tombée dans l'escalier ?"}
      - {qui: joueuse, dit: "Un coup de coude sur un corner, dimanche. Les filles jouent à neuf heures, avant les garçons."}
      - {qui: vieux, dit: "Des filles qui jouent au football… De mon temps, on aurait jamais vu ça."}
      - {qui: joueuse, dit: "Vous étiez au bord du terrain dimanche, avec votre chien. Vous avez crié « hors-jeu » trois fois."}
      - {qui: vieux, dit: "Deux fois. La troisième, c'était le chien."}

  - id: vie.cv.cabinet.le_poteau
    si: "annee >= 2030"
    lieu: cabinet
    tranches: [matin, aprem]
    qui:
      - {id: pere, qui: passant, nom: "Un père", place: attente_1}
      - {id: gamin, qui: enfant, nom: "Un gamin", place: attente_2}
    repliques:
      - {qui: pere, dit: "Tu lui dis que c'est le poteau. Pas la tête : le poteau. Sinon, ils t'arrêtent encore deux semaines."}
      - {qui: gamin, dit: "C'était une tête. Le ballon venait de la gauche, comme à la télé."}
      - {qui: pere, dit: "À ton âge, la tête est interdite. Le poteau, non."}
      - {qui: gamin, dit: "Toi, à mon âge, t'en faisais cent par séance. Tu le racontes à tout le monde."}
      - {qui: pere, dit: "C'est pour ça que je sais jamais où j'ai garé la voiture."}

  - id: vie.cv.cabinet.le_certificat
    si: "annee >= 1999 && annee < 2011"
    lieu: cabinet
    tranches: [matin, aprem]
    qui:
      - {id: veteran, qui: ancien, nom: "Un vétéran", place: attente_2}
      - {id: copain, qui: passant, nom: "Son coéquipier", place: attente_1}
    repliques:
      - {qui: veteran, dit: "Il veut plus me signer le certificat pour les vétérans. Soixante et un ans, il dit, c'est l'âge du cœur."}
      - {qui: copain, dit: "Moi, il me l'a signé. J'en ai soixante-trois."}
      - {qui: veteran, dit: "Tu lui as menti sur ton âge ?"}
      - {qui: copain, dit: "Sur le poste. Je lui ai dit que j'étais gardien. Les gardiens, ça court pas, il dit."}

  - id: vie.cv.cabinet.le_musee
    lieu: cabinet
    tranches: [matin, aprem]
    qui:
      - {id: patiente, qui: passante, nom: "Une patiente", place: attente_1}
      - {id: vieux, qui: ancien, nom: "Un vieux monsieur", place: attente_2}
    repliques:
      - {qui: patiente, dit: "Vous êtes là pour quoi, vous ? Moi, c'est la hanche. Elle me dit le temps qu'il fera, trois jours avant."}
      - {qui: vieux, dit: "Le genou, l'épaule, et le cœur un peu. Le docteur dit que je suis un musée."}
      - {qui: patiente, dit: "Ça fait quatre mardis que je vous vois ici. Il vous soigne pas, alors ?"}
      - {qui: vieux, dit: "Il me soigne très bien. Mais chez moi, la chaudière est en panne depuis octobre. Et ici, y a L'Écho."}

  # ════════════════════════════════════════════════ LE CAFÉ DE LA MAIRIE
  # du matin au soir ; la patronne (une femme) au comptoir, les tables des agents laissées libres

  - id: vie.cv.cafe_mairie.debout_a_huit_heures
    roles: [president]
    lieu: cafe_mairie
    tranches: [matin]
    qui:
      - {id: retraite, qui: ancien, nom: "Un retraité", place: table_1}
      - {id: patronne, qui: commercant, nom: "La patronne", place: patron}
    repliques:
      - {qui: retraite, dit: "{pg, select, f{La présidente} other{Le président}} du Racing prend son café au comptoir, debout, à huit heures. Comme un maçon."}
      - {qui: patronne, dit: "Et son café, il est payé, chaque matin. Celui d'avant faisait tout mettre sur le compte du club."}
      - {qui: retraite, dit: "Ça durera pas. Une saison, et le club lui paiera son café assis, comme aux autres."}
      - {qui: patronne, dit: "Je me suis dit pareil. Alors je note chaque café dans le cahier du club, quand même. Au cas où."}

  - id: vie.cv.cafe_mairie.le_preau
    si: "annee < 1999"
    lieu: cafe_mairie
    tranches: [matin, midi]
    qui:
      - {id: conseiller, qui: passant, nom: "Un conseiller municipal", place: comptoir_2}
      - {id: collegue, qui: ancien, nom: "Un autre conseiller", place: table_1}
      - {id: patronne, qui: commercant, nom: "La patronne", place: patron}
    repliques:
      - {qui: conseiller, dit: "Jeudi, on vote. Trois cent mille francs : la tribune du Racing, ou le préau de l'école de la cité."}
      - {qui: collegue, dit: "Et toi, tu votes quoi ?"}
      - {qui: conseiller, dit: "Le préau. Je l'ai promis aux parents d'élèves, mardi, devant la grille."}
      - {qui: patronne, dit: "Samedi, t'étais en tribune présidentielle, avec l'écharpe. T'es en photo dans L'Écho."}
      - {qui: conseiller, dit: "Les parents d'élèves lisent pas la page des sports. Et les supporters, aux réunions de l'école, j'en ai jamais vu un."}

  - id: vie.cv.cafe_mairie.la_reserve
    si: "annee >= 2007 && annee < 2024"
    lieu: cafe_mairie
    tranches: [matin, aprem]
    qui:
      - {id: patronne, qui: commercant, nom: "La patronne", place: patron}
      - {id: fumeur, qui: passant, nom: "Un client", place: comptoir_2}
      - {id: retraite, qui: ancien, nom: "Un retraité", place: table_1}
    repliques:
      - {qui: patronne, dit: "La cigarette, dehors, monsieur Lemarchal. C'est la loi depuis le premier février, même pour les conseillers."}
      - {qui: fumeur, dit: "Je fume à ce comptoir depuis le premier jour. Il s'est jamais plaint, le comptoir."}
      - {qui: retraite, dit: "Le comptoir, non. Ta femme, tous les dimanches, sur la place."}
      - {qui: patronne, dit: "Moi, je fume dans la réserve, entre les fûts. La réserve, c'est pas un café."}

  - id: vie.cv.cafe_mairie.mardi_midi
    si: "annee >= 2024 && annee < 2037"
    lieu: cafe_mairie
    tranches: [midi]
    qui:
      - {id: retraite, qui: ancien, nom: "Un retraité", place: table_1}
      - {id: ouvrier, qui: passant, nom: "Un ouvrier", place: comptoir_2}
      - {id: patronne, qui: commercant, nom: "La patronne", place: patron}
    repliques:
      - {qui: retraite, dit: "Mardi midi, le Racing. Pour une fois, on aura le match à l'heure de la soupe."}
      - {qui: ouvrier, dit: "Et nous, à l'usine de la zone nord, la pause, c'est midi et quart. Ils jouent pour qui, à midi ?"}
      - {qui: patronne, dit: "Pour ceux de l'autre côté de la Terre, qui le regardent en dînant. Ils paient plus cher que toi."}
      - {qui: ouvrier, dit: "S'ils l'aiment tant, qu'ils viennent chanter le samedi. Le car de six heures, comme mon père."}

  - id: vie.cv.cafe_mairie.en_vrai
    lieu: cafe_mairie
    qui:
      - {id: retraite, qui: ancien, nom: "Un retraité", place: table_1}
      - {id: copain, qui: passant, nom: "Son copain de belote", place: table_2}
      - {id: patronne, qui: commercant, nom: "La patronne", place: patron}
    repliques:
      - {qui: retraite, dit: "Te retourne pas. {nom} vient d'entrer."}
      - {qui: copain, dit: "Qui ça ?"}
      - {qui: retraite, dit: "{nom} ! Tu lis son nom tous les matins dans L'Écho, et tu reconnais pas sa tête ?"}
      - {qui: copain, dit: "En vrai, ils sont toujours plus petits qu'à la télé."}
      - {qui: patronne, dit: "Ou c'est vous qui rapetissez, à force d'être assis sur ces chaises depuis 1971."}

  # ════════════════════════════════════════════════ LE CAVEAU DU RACING
  # toujours ouvert ; deux voix, au recueillement et à la place du visiteur

  - id: vie.cv.caveau.la_gerbe
    si: "caisse < 40 && role != president"
    lieu: caveau
    tranches: [matin, aprem]
    qui:
      - {id: veuve, qui: passante, nom: "Une veuve", place: recueil}
      - {id: fossoyeur, qui: garagiste, nom: "Le fossoyeur", place: visiteur}
    repliques:
      - {qui: veuve, dit: "Le club a pas envoyé de gerbe, cette année. À la Toussaint, y en a toujours une, bordeaux."}
      - {qui: fossoyeur, dit: "Y en a une. Arrivée hier chez la fleuriste, sans carte."}
      - {qui: veuve, dit: "C'est le président qui l'a payée ?"}
      - {qui: fossoyeur, dit: "Les joueurs. Ils ont fait une quête au vestiaire. Le président sait même pas que ses morts ont eu leurs fleurs."}

  - id: vie.cv.caveau.l_ecran
    si: "annee >= 2035"
    lieu: caveau
    tranches: [matin, aprem]
    qui:
      - {id: marbrier, qui: commercant2, nom: "Le marbrier", place: visiteur}
      - {id: dame, qui: passante, nom: "Une dame du conseil", place: recueil}
    repliques:
      - {qui: marbrier, dit: "Y a plus de place sur la pierre. Le prochain président, on le grave où ? Sur la porte ?"}
      - {qui: dame, dit: "Le conseil propose un écran, avec les noms qui défilent. Ça en tiendrait des milliers."}
      - {qui: marbrier, dit: "Un écran, ça s'éteint, madame. Une pierre, je vous la garantis cent ans sous la pluie."}
      - {qui: dame, dit: "C'est bien pour ça qu'ils veulent l'écran. Il y a des noms qu'ils aimeraient pouvoir éteindre."}

  - id: vie.cv.caveau.le_premier_rendez_vous
    lieu: caveau
    tranches: [aprem]
    qui:
      - {id: garcon, qui: passant, nom: "Un adolescent", place: visiteur}
      - {id: fille, qui: passante, nom: "Une adolescente", place: recueil}
    repliques:
      - {qui: garcon, dit: "Ici, y a jamais personne. Même le gardien passe par l'autre allée."}
      - {qui: fille, dit: "Tu m'emmènes dans un caveau. Pour un premier rendez-vous."}
      - {qui: garcon, dit: "C'est calme. Et avec toutes les écharpes, c'est presque chez moi."}
      - {qui: fille, dit: "Le troisième nom, en haut à gauche, c'est mon arrière-grand-père. Il te regarde, là.", emote: "!"}

  - id: vie.cv.caveau.sous_le_poteau_de_corner
    lieu: caveau
    tranches: [matin, aprem]
    qui:
      - {id: gamin, qui: enfant, nom: "Un gamin", place: visiteur}
      - {id: grandpere, qui: ancien, nom: "Son grand-père", place: recueil}
    repliques:
      - {qui: gamin, dit: "Ils sont tous là, ceux du Racing ? Même ceux qui ont perdu ?"}
      - {qui: grandpere, dit: "Les présidents, deux capitaines et un soigneur. Ceux qui ont perdu, y en a trop, on pourrait pas tous les graver."}
      - {qui: gamin, dit: "Et toi, on mettra ton nom où ?"}
      - {qui: grandpere, dit: "Pas ici. Moi, je serai en poudre au pied du poteau de corner, côté Nord. J'ai demandé au jardinier."}

  # ════════════════════════════════════════════════ LE CENTRE DE FORMATION
  # le mercredi et le samedi après-midi ; les gamins à leurs places, les parents à celle du visiteur

  - id: vie.cv.centre.la_doudoune
    si: "annee < 2003"
    lieu: centre
    tranches: [aprem]
    qui:
      - {id: gamin, qui: enfant, nom: "Un gamin du centre", place: gamin_1}
      - {id: grand, qui: passant, nom: "Un grand du centre", place: gamin_2}
      - {id: mere, qui: passante, nom: "Une mère", place: visiteur}
    repliques:
      - {qui: gamin, dit: "Le recruteur de Valdorne est derrière le grillage. Celui en doudoune, avec le carnet."}
      - {qui: grand, dit: "Il vient tous les mercredis. Il regarde, il note, il s'en va. Il prend jamais personne."}
      - {qui: mere, dit: "Il a pris le fils Vidalenc, l'an dernier. On a fêté ça au café de la Mairie."}
      - {qui: grand, dit: "Le fils Vidalenc est revenu en février. Ses crampons sont restés dans le car, sur le siège."}

  - id: vie.cv.centre.dix_pour_cent
    si: "annee >= 2003 && annee < 2030"
    lieu: centre
    tranches: [aprem]
    qui:
      - {id: repetitrice, qui: commercant, nom: "La répétitrice", place: visiteur}
      - {id: gamin, qui: enfant, nom: "Un gamin du centre", place: gamin_1}
    repliques:
      - {qui: repetitrice, dit: "Les pourcentages, Matéo. Encore une page, et tu retournes sur le synthétique."}
      - {qui: gamin, dit: "Pourquoi un footballeur a besoin des pourcentages ? Nous, c'est les buts."}
      - {qui: repetitrice, dit: "Un agent te demandera dix pour cent de ta vie, un jour. Tu voudras savoir combien ça fait."}
      - {qui: gamin, dit: "Mon père dit que l'agent, ce sera lui. Il prendra que cinq."}

  - id: vie.cv.centre.l_indice
    si: "annee >= 2030"
    lieu: centre
    tranches: [aprem]
    qui:
      - {id: mere, qui: passante, nom: "Une mère", place: visiteur}
      - {id: gamin, qui: enfant, nom: "Un gamin du centre", place: gamin_1}
    repliques:
      - {qui: mere, dit: "Ton indice a baissé de deux points depuis septembre. C'est écrit sur l'application du centre."}
      - {qui: gamin, dit: "C'est parce que je joue gardien, le mercredi. Le modèle sait pas noter les gardiens."}
      - {qui: mere, dit: "Joue devant, ces jours-là. Devant, il sait noter."}
      - {qui: gamin, dit: "Devant, je cours après le ballon. Dans les buts, c'est lui qui vient me voir."}

  - id: vie.cv.centre.le_lit_pres_de_la_fenetre
    lieu: centre
    tranches: [aprem]
    qui:
      - {id: grand, qui: passant, nom: "Un grand du centre", place: gamin_2}
      - {id: gamin, qui: enfant, nom: "Un gamin du centre", place: gamin_1}
    repliques:
      - {qui: grand, dit: "Tu peux prendre mon lit, celui près de la fenêtre. Le samedi soir, on voit l'éclairage du stade."}
      - {qui: gamin, dit: "Tu changes de chambre ?"}
      - {qui: grand, dit: "Je change de ville. Mon père vient me chercher dimanche, avec le break. Ils me gardent pas."}
      - {qui: gamin, dit: "Et l'éclairage, tu le verras encore ?"}
      - {qui: grand, dit: "De la nationale, quand on passe. Faut regarder à droite, juste après le pont.", emote: "..."}

  # ════════════════════════════════════════════════ LE CINÉMA L'AURORE
  # le soir ; la caissière (une femme) assise à sa caisse

  - id: vie.cv.cinema.rangee_m
    si: "annee < 2008"
    lieu: cinema
    tranches: [soir]
    qui:
      - {id: garcon, qui: passant, nom: "Un jeune homme", place: client_1}
      - {id: fille, qui: passante, nom: "Une jeune fille", place: client_2}
      - {id: caissiere, qui: commercant, nom: "La caissière", place: caissiere}
    repliques:
      - {qui: garcon, dit: "Deux places, s'il vous plaît. Au fond, si possible."}
      - {qui: caissiere, dit: "C'est pas numéroté, jeune homme. Le fond, faut y arriver avant les autres."}
      - {qui: fille, dit: "C'est quoi, le film ?"}
      - {qui: garcon, dit: "Aucune idée."}
      - {qui: caissiere, dit: "Ton père m'a fait la même réponse, en 1972. Rangée M. Ta mère avait le même manteau."}

  - id: vie.cv.cinema.la_cabine
    si: "annee >= 2010 && annee < 2024"
    lieu: cinema
    tranches: [soir]
    qui:
      - {id: projectionniste, qui: commercant2, nom: "Le projectionniste", place: visiteur}
      - {id: caissiere, qui: commercant, nom: "La caissière", place: caissiere}
    repliques:
      - {qui: projectionniste, dit: "Lundi, ils installent la machine numérique. Une clé, un bouton, et le film démarre tout seul."}
      - {qui: caissiere, dit: "Et toi, alors ?"}
      - {qui: projectionniste, dit: "Moi, je descends. Ils ferment la cabine à clé. Le patron dit qu'un bouton, ça fait pas grève."}
      - {qui: caissiere, dit: "Tu viendras quand même, le samedi ?"}
      - {qui: projectionniste, dit: "Au septième rang. Depuis mes seize ans, je vois les films par un trou dans le mur. Je veux voir les têtes."}

  - id: vie.cv.cinema.quatre_vingt_dix_minutes
    si: "annee >= 2024"
    lieu: cinema
    tranches: [soir]
    qui:
      - {id: caissiere, qui: commercant, nom: "La caissière", place: caissiere}
      - {id: supporter, qui: fan, nom: "Un supporter", place: client_1}
      - {id: dame, qui: passante, nom: "Une dame", place: client_2}
    repliques:
      - {qui: caissiere, dit: "Pas de film ce soir. Le match de vingt et une heures, à l'extérieur, en grand sur l'écran. Le déplacement, personne pouvait se le payer."}
      - {qui: supporter, dit: "Trois cents places, et on chantera comme à la Rive. Le plafond va descendre d'un mètre."}
      - {qui: dame, dit: "Moi, je viens pour le film. On m'a dit qu'il y avait un film, ce soir."}
      - {qui: caissiere, dit: "Il y en a un, madame. Quatre-vingt-dix minutes, et personne connaît la fin."}

  - id: vie.cv.cinema.la_fin_du_film
    lieu: cinema
    tranches: [soir]
    qui:
      - {id: vieux, qui: ancien, nom: "Un habitué", place: client_1}
      - {id: voisine, qui: passante, nom: "Sa voisine", place: client_2}
    repliques:
      - {qui: vieux, dit: "Elle revient, à la fin. Le train repart sans elle, et elle revient à pied. C'est clair."}
      - {qui: voisine, dit: "Elle revient pas. Le dernier plan, c'est le quai vide."}
      - {qui: vieux, dit: "Vingt ans qu'on se dispute sur les fins, toi et moi."}
      - {qui: voisine, dit: "Vingt ans que tu t'endors au milieu. Tu inventes la fin dans le bus du retour."}

  # ════════════════════════════════════════════════ LE RIDEAU ROUGE
  # le soir, la nuit ; l'homme du bar (le personnel, en noir) ; ici, personne n'a de nom

  - id: vie.cv.club_prive.l_eau_a_quarante_francs
    roles: [entraineur]
    si: "annee < 1999 && jour == ven"
    lieu: club_prive
    tranches: [soir, nuit]
    qui:
      - {id: barman, qui: commercant, nom: "Le barman", place: barmaid}
      - {id: habitue, qui: passant, nom: "Un habitué", place: piste_2}
    repliques:
      - {qui: barman, dit: "Trois joueurs du Racing à l'alcôve du fond, la veille d'un match. Ils ont commandé de l'eau."}
      - {qui: habitue, dit: "De l'eau ? Au Rideau Rouge ?"}
      - {qui: barman, dit: "À quarante francs la bouteille. Ils veulent qu'on les voie ici. Boire, non."}
      - {qui: habitue, dit: "Qui ça, « on » ?"}
      - {qui: barman, dit: "Leur coach. Ils ont parié entre eux sur le jour où {pg, select, f{elle} other{il}} l'apprendra."}

  - id: vie.cv.club_prive.la_corbeille
    si: "annee >= 2008 && annee < 2030"
    lieu: club_prive
    tranches: [soir, nuit]
    qui:
      - {id: hotesse, qui: passante, nom: "Une hôtesse", place: piste_1}
      - {id: barman, qui: commercant, nom: "Le barman", place: barmaid}
    repliques:
      - {qui: hotesse, dit: "Le joueur de l'alcôve a gardé son téléphone. Il le tient sous la table, l'écran contre la cuisse."}
      - {qui: barman, dit: "Il ressortira pas avec. Ici, les téléphones dorment dans la corbeille, à l'entrée."}
      - {qui: hotesse, dit: "Il dit qu'il attend un appel de sa femme."}
      - {qui: barman, dit: "Elle a appelé ici, sa femme, y a dix minutes. Pour savoir s'il avait mangé."}

  - id: vie.cv.club_prive.le_carnet_des_plaques
    lieu: club_prive
    tranches: [soir, nuit]
    qui:
      - {id: costume, qui: inconnu, nom: "Un homme en costume", place: alcove_2}
      - {id: barman, qui: commercant, nom: "Le barman", place: barmaid}
    repliques:
      - {qui: costume, dit: "La voiture noire garée devant le square, celle avec la cocarde. Dites-lui d'aller se garer ailleurs."}
      - {qui: barman, dit: "Je ne parle pas aux voitures, monsieur. Je note les plaques."}
      - {qui: costume, dit: "Vous notez les plaques ?"}
      - {qui: barman, dit: "Depuis le premier soir. Madame dit que le carnet vaut plus cher que le fonds de commerce."}

  - id: vie.cv.club_prive.un_prenom
    lieu: club_prive
    tranches: [soir, nuit]
    qui:
      - {id: serveuse, qui: passante, nom: "Une nouvelle serveuse", place: piste_1}
      - {id: barman, qui: commercant, nom: "Le barman", place: barmaid}
    repliques:
      - {qui: serveuse, dit: "Le monsieur de l'alcôve m'a demandé mon prénom. J'ai dit le vrai. C'est grave ?"}
      - {qui: barman, dit: "Ici, personne en a. Demain, t'en choisis un, et tu le gardes jusqu'à ce que tu partes."}
      - {qui: serveuse, dit: "Et vous, c'est quoi, votre vrai prénom ?"}
      - {qui: barman, dit: "On me l'a plus demandé depuis mon premier costume. Je crois que je l'ai rendu avec."}

  # ════════════════════════════════════════════════ LE CLUB-HOUSE
  # matin, après-midi, soir, sauf le dimanche ; le secrétariat et le bureau du président à leurs maîtres,
  # les bénévoles, le ménage et le conseil aux autres places

  - id: vie.cv.clubhouse.le_jeudi
    roles: [entraineur]
    si: "annee < 1999 && serie_d >= 1"
    lieu: clubhouse
    tranches: [matin, aprem]
    qui:
      - {id: administrateur, qui: passant, nom: "Un administrateur", place: conseil_1}
      - {id: tresorier, qui: ancien, nom: "Le trésorier", place: conseil_2}
    repliques:
      - {qui: administrateur, dit: "Encore une défaite, et le président convoque le conseil."}
      - {qui: tresorier, dit: "Le conseil, c'est nous. Il nous convoque pour nous dire ce qu'il a déjà décidé."}
      - {qui: administrateur, dit: "Alors on vote quoi, quand il nous convoque ?"}
      - {qui: tresorier, dit: "Le remplaçant. Celui qu'il a appelé avant de nous convoquer. Il appelle toujours le jeudi, de la cabine du stade."}

  - id: vie.cv.clubhouse.le_fauteuil
    si: "annee >= 2028 && annee < 2037"
    lieu: clubhouse
    tranches: [matin]
    qui:
      - {id: analyste, qui: passant, nom: "Un analyste du fonds", place: conseil_1}
      - {id: menage, qui: commercant, nom: "La femme de ménage", place: vitrine}
    repliques:
      - {qui: analyste, dit: "Le bureau du haut est vide depuis deux ans. Le fonds veut y mettre les écrans de l'analyse."}
      - {qui: menage, dit: "Aucun des vôtres a voulu s'y asseoir. Le fauteuil est resté tourné vers la fenêtre, vers le terrain."}
      - {qui: analyste, dit: "Bon, c'est qu'un fauteuil. On le tournera vers le mur."}
      - {qui: menage, dit: "Je le remets face au terrain tous les matins, à six heures et demie. Il aimait regarder l'arrosage."}

  - id: vie.cv.clubhouse.le_clou
    si: "annee >= 1999 && annee < 2037"
    lieu: clubhouse
    tranches: [matin, aprem, soir]
    qui:
      - {id: nouvelle, qui: passante, nom: "Une nouvelle bénévole", place: vitrine}
      - {id: vieux, qui: ancien, nom: "Un vieux bénévole", place: conseil_1}
    repliques:
      - {qui: nouvelle, dit: "Y a un clou dans l'escalier, tout seul, avec un carré plus clair autour. J'y mets le calendrier des matchs ?"}
      - {qui: vieux, dit: "Laisse ce clou tranquille. Y avait une photo, avant."}
      - {qui: nouvelle, dit: "Une photo de quoi ?"}
      - {qui: vieux, dit: "De 1974. Elle est partie un hiver, on sait pas avec qui. Le calendrier, mets-le à côté du distributeur."}

  - id: vie.cv.clubhouse.le_siege_31
    lieu: clubhouse
    tranches: [matin, aprem]
    qui:
      - {id: abonne, qui: ancien, nom: "Un vieil abonné", place: guichet}
      - {id: benevole, qui: passante, nom: "La bénévole du guichet", place: conseil_1}
    repliques:
      - {qui: abonne, dit: "Mon abonnement, comme chaque année. Tribune Ouest, le siège 31. Le même depuis 1961."}
      - {qui: benevole, dit: "On m'a dit que vous partiez en maison de retraite, à Valdorne. C'est à quarante kilomètres."}
      - {qui: abonne, dit: "Le car passe pas le samedi. Je viendrai à aucun match."}
      - {qui: benevole, dit: "Alors pourquoi vous le renouvelez ?"}
      - {qui: abonne, dit: "Si je le rends, on me raye de la liste des abonnés. Sur celle-là, je suis encore vivant."}

  - id: vie.cv.clubhouse.la_coupe_aux_cartes
    lieu: clubhouse
    tranches: [matin, aprem]
    qui:
      - {id: menage, qui: commercant, nom: "La femme de ménage", place: vitrine}
      - {id: benevole, qui: ancien, nom: "Un vieux bénévole", place: conseil_1}
    repliques:
      - {qui: menage, dit: "Je fais les coupes le lundi. La petite, à gauche, je la frotte plus. L'argent part avec le chiffon."}
      - {qui: benevole, dit: "Le tournoi de Pâques 1958. Celle-là, le président de l'époque l'a gagnée aux cartes."}
      - {qui: menage, dit: "Aux cartes ?"}
      - {qui: benevole, dit: "Le tournoi, on l'a perdu en finale. La coupe, il l'a gagnée le soir même, au café, contre leur président. Elle est à nous."}

  # ════════════════════════════════════════════════ L'ÉCHO D'AUBÉRIVE
  # matin, après-midi, soir, sauf le dimanche ; les bureaux des journalistes des livres restent à eux

  - id: vie.cv.echo.les_poubelles_de_la_rue_du_stade
    si: "annee < 2005"
    lieu: echo
    tranches: [matin, aprem, soir]
    qui:
      - {id: stagiaire, qui: passant, nom: "Le stagiaire de L'Écho", place: pigiste}
      - {id: typographe, qui: ancien, nom: "Le typographe", place: archives}
    repliques:
      - {qui: stagiaire, dit: "La météo de la Marmite, je mets quoi ? J'étais pas au stade, samedi."}
      - {qui: typographe, dit: "Tu passes rue du Stade le dimanche matin. Les poubelles pleines de bouteilles, tu mets bouillante. Vides, froide."}
      - {qui: stagiaire, dit: "C'est comme ça que vous faisiez, avant moi ?"}
      - {qui: typographe, dit: "Vingt-deux ans. J'ai jamais mis les pieds à la Rive, la foule, ça me donne des sueurs. Les poubelles se sont jamais trompées."}

  - id: vie.cv.echo.une_virgule
    si: "annee >= 2008 && annee < 2035"
    lieu: echo
    tranches: [matin, aprem]
    qui:
      - {id: stagiaire, qui: passant, nom: "Le stagiaire de L'Écho", place: pigiste}
      - {id: correctrice, qui: commercant, nom: "La correctrice", place: archives}
    repliques:
      - {qui: stagiaire, dit: "Trois cents commentaires sous l'article du match, en une nuit. Ils insultent même le photographe."}
      - {qui: correctrice, dit: "Et combien de lettres pour « On nous écrit » ?"}
      - {qui: stagiaire, dit: "Une. Madame Vauquelin, rue Haute, pour une virgule de la page sept."}
      - {qui: correctrice, dit: "Garde-la. Elle a vu la virgule de la page sept, celle-là. Elle lit tout."}

  - id: vie.cv.echo.ils_etaient_au_stade
    si: "annee >= 2024 && annee < 2040"
    lieu: echo
    tranches: [aprem, soir]
    qui:
      - {id: correctrice, qui: commercant, nom: "La correctrice", place: archives}
      - {id: stagiaire, qui: passant, nom: "Le stagiaire de L'Écho", place: pigiste}
    repliques:
      - {qui: correctrice, dit: "Les avis de décès rapportent plus que la page des sports, maintenant. Deux colonnes, un écu la ligne."}
      - {qui: stagiaire, dit: "Le chef veut une rubrique : « Ils étaient au stade ». Ceux qui avaient leur abonnement."}
      - {qui: correctrice, dit: "Les familles appelleront pour qu'on ajoute la place. Tribune, rangée, numéro."}
      - {qui: stagiaire, dit: "Elles appellent déjà. Une dame veut qu'on écrive que son mari a jamais sifflé un joueur du Racing. J'ai pas vérifié."}

  - id: vie.cv.echo.prix_libre
    si: "annee >= 2045"
    lieu: echo
    tranches: [matin, aprem]
    qui:
      - {id: lecteur, qui: ancien, nom: "Un vieux lecteur", place: visiteur}
      - {id: stagiaire, qui: passant, nom: "Le stagiaire de L'Écho", place: pigiste}
    repliques:
      - {qui: lecteur, dit: "Je viens chercher le numéro de dimanche. Le kiosque a fermé, on m'a dit de passer ici."}
      - {qui: stagiaire, dit: "Prix libre, monsieur. Vous mettez ce que vous voulez dans la boîte."}
      - {qui: lecteur, dit: "Vous êtes combien de journalistes, maintenant, là-dedans ?"}
      - {qui: stagiaire, dit: "Un. Il écrit, il photographie, il plie, et le dimanche il vous rend la monnaie."}

  - id: vie.cv.echo.le_bonnet_rouge
    lieu: echo
    tranches: [matin, aprem, soir]
    qui:
      - {id: photographe, qui: ancien, nom: "Le photographe de L'Écho", place: archives}
      - {id: stagiaire, qui: passant, nom: "Le stagiaire de L'Écho", place: pigiste}
    repliques:
      - {qui: photographe, dit: "Pour lundi, je te donne la tribune Est, pas les joueurs. Les joueurs, les gens les ont déjà vus à la télé."}
      - {qui: stagiaire, dit: "Y a toujours la même dame au premier rang, sur vos photos. Le bonnet rouge."}
      - {qui: photographe, dit: "T'as l'œil. Trente ans qu'elle est sur mes photos du lundi."}
      - {qui: stagiaire, dit: "Une abonnée célèbre ?"}
      - {qui: photographe, dit: "Ma mère. Elle aime pas le football. Elle vient pour que je la prenne en photo, une fois par semaine."}

  # ════════════════════════════════════════════════ L'ÉCOLE PUBLIQUE
  # en semaine, de jour ; la maîtresse à sa place, les élèves aux pupitres

  - id: vie.cv.ecole.le_metier_de_mon_pere
    si: "annee >= 1991 && annee < 1999 && jour != dim"
    lieu: ecole
    tranches: [matin, aprem]
    qui:
      - {id: maitresse, qui: commercant, nom: "La maîtresse", place: maitre}
      - {id: eleve, qui: enfant, nom: "Un élève", place: eleve_1}
    repliques:
      - {qui: maitresse, dit: "Rédaction : « Le métier de mon père ». Tu n'as écrit qu'une ligne, Yannick."}
      - {qui: eleve, dit: "Il a plus de métier. L'usine a fermé."}
      - {qui: maitresse, dit: "Alors écris ce qu'il faisait avant. Ou ce qu'il fait de ses journées, maintenant."}
      - {qui: eleve, dit: "Maintenant, il m'attend devant la grille. Il arrive une heure en avance. Je peux écrire ça ?"}

  - id: vie.cv.ecole.la_machine
    si: "annee >= 2030 && jour != dim"
    lieu: ecole
    tranches: [matin, aprem]
    qui:
      - {id: maitresse, qui: commercant, nom: "La maîtresse", place: maitre}
      - {id: eleve, qui: enfant, nom: "Une élève", place: eleve_1}
    repliques:
      - {qui: maitresse, dit: "Ta rédaction sur ton grand-père est parfaite, Lina. Trop parfaite. C'est la machine qui l'a écrite ?"}
      - {qui: eleve, dit: "La machine, elle connaît pas mon grand-père. Elle a écrit qu'il aimait le football."}
      - {qui: maitresse, dit: "Et il l'aimait pas ?"}
      - {qui: eleve, dit: "Il était gardien au Racing. Il disait qu'on aime pas un métier où tout le monde vous tire dessus."}

  - id: vie.cv.ecole.la_photo_dedicacee
    si: "jour != dim"
    lieu: ecole
    tranches: [midi, aprem]
    qui:
      - {id: maitresse, qui: commercant, nom: "La maîtresse", place: maitre}
      - {id: mere, qui: passante, nom: "Une mère", place: visiteur}
    repliques:
      - {qui: maitresse, dit: "Votre fils raconte à toute la classe qu'il est le neveu de {nom}. Il a même apporté une photo dédicacée."}
      - {qui: mere, dit: "Il l'a signée lui-même. Il imite très bien les signatures, ça lui vient de son père."}
      - {qui: maitresse, dit: "On a eu le cas l'an dernier, avec le gardien. Ça leur passe vers les vacances de février."}
      - {qui: mere, dit: "Ce qui passe pas, c'est le carnet de notes. Il le signe aussi, depuis la Toussaint."}

  - id: vie.cv.ecole.le_mur_sans_fenetres
    si: "jour != dim"
    lieu: ecole
    tranches: [matin, midi, aprem]
    qui:
      - {id: concierge, qui: ancien, nom: "Le concierge de l'école", place: visiteur}
      - {id: gamin, qui: enfant, nom: "Un élève", place: eleve_1}
    repliques:
      - {qui: concierge, dit: "Le ballon dans les carreaux du préau, c'est la troisième fois cette semaine. Je le confisque."}
      - {qui: gamin, dit: "Il est dégonflé, de toute façon. Il rebondit même plus."}
      - {qui: concierge, dit: "Justement. Passe à quatre heures et demie, je l'aurai regonflé. Et tu viseras le mur du fond, celui sans fenêtres."}

  # ════════════════════════════════════════════════ L'ÉGLISE SAINT-AUBIN
  # toujours ouverte ; le curé (en noir) à sa place, les paroissiens sur les bancs

  - id: vie.cv.eglise.le_tronc
    si: "annee < 1999 && serie_v >= 1"
    lieu: eglise
    tranches: [matin, aprem]
    qui:
      - {id: sacristain, qui: ancien, nom: "Le sacristain", place: cierges}
      - {id: cure, qui: portier, nom: "Le curé", place: pretre}
    repliques:
      - {qui: sacristain, dit: "Quatre cent douze francs dans le tronc, cette semaine. Le double d'un dimanche ordinaire."}
      - {qui: cure, dit: "Ça gagne, depuis un mois. Ils ont eu peur pour rien, ça les rend généreux."}
      - {qui: sacristain, dit: "Et quand ça perd ?"}
      - {qui: cure, dit: "Quand ça perd, ils allument des cierges. Les cierges, c'est l'évêché qui encaisse."}

  - id: vie.cv.eglise.le_seul_endroit_frais
    si: "annee >= 2030"
    lieu: eglise
    tranches: [aprem]
    qui:
      - {id: femme, qui: passante, nom: "Une jeune femme", place: banc_1}
      - {id: cure, qui: portier, nom: "Le curé", place: pretre}
    repliques:
      - {qui: femme, dit: "Je viens pas prier, mon père. C'est le seul endroit frais de la rue."}
      - {qui: cure, dit: "Vous êtes onze, cet après-midi, pour la même raison. Dimanche, à la messe, vous étiez quatre."}
      - {qui: femme, dit: "Ça vous fâche ?"}
      - {qui: cure, dit: "Ça me fâche pas. Onze en semaine, quatre le dimanche… Le Bon Dieu préfère peut-être la semaine."}

  - id: vie.cv.eglise.les_sept_couplets
    lieu: eglise
    tranches: [matin, aprem]
    qui:
      - {id: sacristain, qui: ancien, nom: "Le sacristain", place: cierges}
      - {id: cure, qui: portier, nom: "Le curé", place: pretre}
    repliques:
      - {qui: sacristain, dit: "La famille veut le chant de la Nord à la sortie du cercueil. Les sept couplets."}
      - {qui: cure, dit: "Un couplet. L'orgue connaît pas l'air, et l'évêque connaît trop bien la paroisse."}
      - {qui: sacristain, dit: "Ils viendront à soixante, avec les écharpes. Ils le chanteront avec ou sans l'orgue."}
      - {qui: cure, dit: "Alors un couplet à l'orgue, et les six autres sur le parvis. Le parvis, c'est pas à l'évêque."}

  - id: vie.cv.eglise.onze_heures
    lieu: eglise
    tranches: [matin, aprem]
    qui:
      - {id: paroissienne, qui: passante, nom: "Une paroissienne", place: banc_1}
      - {id: cure, qui: portier, nom: "Le curé", place: pretre}
    repliques:
      - {qui: paroissienne, dit: "Le mariage de ma fille, le samedi 14, à quinze heures. Vous pourriez pas avancer la messe ?"}
      - {qui: cure, dit: "À quinze heures, y a match à la Rive. C'est le marié qui vous envoie ?"}
      - {qui: paroissienne, dit: "Le marié, son père, ses deux frères et les témoins. Ma fille dit qu'elle se mariera seule, s'il le faut."}
      - {qui: cure, dit: "Onze heures, alors. Mais vous finissez avant midi et demi : j'ai ma place en Nord depuis le séminaire."}

  # ════════════════════════════════════════════════ L'ÉPICERIE
  # matin, après-midi, soir ; l'épicier (un homme) au comptoir, la place d'Odile laissée à Odile

  - id: vie.cv.epicerie.le_cahier_rouge
    si: "annee >= 1991 && annee < 2003"
    lieu: epicerie
    tranches: [matin, aprem]
    qui:
      - {id: cliente, qui: passante, nom: "Une cliente", place: client_1}
      - {id: epicier, qui: commercant, nom: "L'épicier", place: epicier}
    repliques:
      - {qui: cliente, dit: "Mettez-le sur le cahier, s'il vous plaît. Le chômage tombe le dix."}
      - {qui: epicier, dit: "Le cahier de la cité est plein. J'en ai commencé un deuxième, rouge, pour ceux de la Tréfilerie."}
      - {qui: cliente, dit: "Et il a quoi de différent, le rouge ?"}
      - {qui: epicier, dit: "Rien. Sauf que le bleu, je le relis le dimanche soir. Le rouge, jamais."}

  - id: vie.cv.epicerie.la_hanche
    si: "annee >= 2003 && annee < 2035"
    lieu: epicerie
    tranches: [matin, aprem]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux client", place: visiteur}
      - {id: epicier, qui: commercant, nom: "L'épicier", place: epicier}
    repliques:
      - {qui: vieux, dit: "Le magasin de la zone nord envoie un car gratuit, le mardi. Ma voisine y va pour la promenade."}
      - {qui: epicier, dit: "Et vous, vous y allez pas ?"}
      - {qui: vieux, dit: "Une fois. Personne m'a demandé comment allait ma hanche. Même la caisse, elle parlait pas."}
      - {qui: epicier, dit: "Comment va votre hanche ?"}
      - {qui: vieux, dit: "Mal, merci de demander. Mettez-moi deux bières. Je repasserai demain pour la troisième."}

  - id: vie.cv.epicerie.la_petite_musique
    si: "annee >= 2030"
    lieu: epicerie
    tranches: [matin, aprem, soir]
    qui:
      - {id: cliente, qui: passante, nom: "Une cliente", place: client_1}
      - {id: epicier, qui: commercant, nom: "L'épicier", place: epicier}
    repliques:
      - {qui: cliente, dit: "Vous avez toujours le cahier sous le comptoir ? Mon fils dit que tout se paie au téléphone, maintenant."}
      - {qui: epicier, dit: "Le téléphone, il vous fait crédit, à vous ?"}
      - {qui: cliente, dit: "Non. Il me rappelle mes dettes tous les matins à sept heures, avec une petite musique."}
      - {qui: epicier, dit: "Le cahier, il sonne pas. Je vous le sors ?"}

  - id: vie.cv.epicerie.douze_bieres
    lieu: epicerie
    tranches: [soir]
    qui:
      - {id: supporter, qui: fan, nom: "Un supporter", place: client_1}
      - {id: epicier, qui: commercant, nom: "L'épicier", place: epicier}
    repliques:
      - {qui: supporter, dit: "Vingt-quatre bières, pour demain. On fait le car du déplacement, départ six heures."}
      - {qui: epicier, dit: "Je t'en vends douze. Les douze autres, tu les trouveras bien sur la route."}
      - {qui: supporter, dit: "Pourquoi douze ?"}
      - {qui: epicier, dit: "Parce que ta mère achète son lait ici tous les matins, et qu'elle me regarde dans les yeux en payant."}

  # ════════════════════════════════════════════════ AUX IMMORTELLES (le fleuriste)
  # matin, après-midi ; l'employée à la place du visiteur, la place de la patronne laissée libre

  - id: vie.cv.fleuriste.bon_voyage
    si: "annee >= 2010 && annee < 2035"
    lieu: fleuriste
    tranches: [matin, aprem]
    qui:
      - {id: livreur, qui: passant, nom: "Le livreur", place: client_1}
      - {id: employee, qui: commercant, nom: "L'employée", place: visiteur}
    repliques:
      - {qui: livreur, dit: "Trois cents roses blanches à la grille du stade avant samedi. C'est payé par une collecte sur le Flux."}
      - {qui: employee, dit: "Pour qui ?"}
      - {qui: livreur, dit: "Pour le capitaine qui part à l'étranger. Ils veulent les jeter sur la pelouse quand il viendra saluer."}
      - {qui: employee, dit: "Des roses blanches… C'est pour un ami qui part, ça. Ou pour un cercueil."}
      - {qui: livreur, dit: "Ils le savent. La collecte s'appelle « Bon voyage », avec trois points de suspension."}

  - id: vie.cv.fleuriste.la_bruyere
    si: "annee >= 2035"
    lieu: fleuriste
    tranches: [matin, aprem]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux client", place: client_1}
      - {id: employee, qui: commercant, nom: "L'employée", place: visiteur}
    repliques:
      - {qui: vieux, dit: "Ma fille veut mettre des fleurs en tissu sur la tombe de sa mère. Elle dit qu'elles durent dix ans."}
      - {qui: employee, dit: "Elles durent, oui. Elles fanent pas. Et personne revient les changer."}
      - {qui: vieux, dit: "C'est ce qu'elle veut. Plus revenir."}
      - {qui: employee, dit: "Je vous ajoute un petit pot de bruyère. Celle-là, vous reviendrez l'arroser."}

  - id: vie.cv.fleuriste.comme_son_nez
    lieu: fleuriste
    tranches: [matin, aprem]
    qui:
      - {id: supporter, qui: fan, nom: "Un supporter", place: client_1}
      - {id: employee, qui: commercant, nom: "L'employée", place: visiteur}
    repliques:
      - {qui: supporter, dit: "Une gerbe pour Jojo, du virage. Ronde comme un ballon, avec ses initiales en œillets blancs."}
      - {qui: employee, dit: "Un ballon en fleurs, c'est trois jours de travail. L'enterrement est jeudi."}
      - {qui: supporter, dit: "Alors faites-la carrée. Il disait que le football, c'était une excuse pour être ensemble le samedi."}
      - {qui: employee, dit: "Il aimait quoi, alors ?"}
      - {qui: supporter, dit: "La bière tiède, le bruit, nous. Mettez des œillets rouges, comme son nez."}

  - id: vie.cv.fleuriste.bordeaux_et_gris
    si: "role != selectionneur"
    lieu: fleuriste
    tranches: [matin, aprem]
    qui:
      - {id: client, qui: passant, nom: "Un jeune homme", place: client_1}
      - {id: employee, qui: commercant, nom: "L'employée", place: visiteur}
    repliques:
      - {qui: client, dit: "Un bouquet bordeaux et gris. Je demande ma copine en mariage samedi, à la mi-temps, au micro du speaker."}
      - {qui: employee, dit: "Bordeaux et gris… Des roses sombres et de l'eucalyptus. Elle est abonnée en Nord ?"}
      - {qui: client, dit: "Elle est de {rival}. Elle viendra avec son écharpe, pour me faire plaisir."}
      - {qui: employee, dit: "Je vous prépare aussi un petit bouquet à ses couleurs à elle. Pour la deuxième mi-temps, si elle dit non."}

  # ════════════════════════════════════════════════ LE GARAGE DU PONT
  # matin, après-midi, sauf le dimanche ; le garagiste (un homme) à sa place, le vendeur à la sienne

  - id: vie.cv.garage.le_cabriolet_vert
    si: "annee < 1999"
    lieu: garage
    tranches: [matin, aprem]
    qui:
      - {id: vendeur, qui: commercant2, nom: "Le vendeur", place: vendeur}
      - {id: garagiste, qui: commercant, nom: "Le garagiste", place: garagiste}
    repliques:
      - {qui: vendeur, dit: "Le cabriolet vert, je le garde pour le Racing. Le premier qui touche une prime de match, je lui fais essayer."}
      - {qui: garagiste, dit: "Tu l'as déjà vendu trois fois, ce cabriolet. Il revient toujours, avec un pare-chocs de moins."}
      - {qui: vendeur, dit: "Ils l'achètent en septembre et ils me le rendent en mai. Au fond, c'est de la location."}
      - {qui: garagiste, dit: "De la location ? Un baromètre, oui. Il revient avant Noël, le club paie plus les primes."}

  - id: vie.cv.garage.la_valise_de_diagnostic
    si: "annee >= 1999 && annee < 2035"
    lieu: garage
    tranches: [matin, aprem]
    qui:
      - {id: apprenti, qui: passant, nom: "L'apprenti", place: client_1}
      - {id: garagiste, qui: commercant, nom: "Le garagiste", place: garagiste}
    repliques:
      - {qui: apprenti, dit: "La valise de diagnostic dit que tout va bien. Pas un code d'erreur."}
      - {qui: garagiste, dit: "Et tu l'as écoutée, cette voiture ? Démarre-la, et tais-toi trente secondes."}
      - {qui: apprenti, dit: "Elle cliquette un peu. À gauche."}
      - {qui: garagiste, dit: "Le roulement avant gauche. Ta valise, elle te le dira dans six mois, quand il aura cassé."}

  - id: vie.cv.garage.le_klaxon
    si: "annee >= 2035"
    lieu: garage
    tranches: [matin, aprem]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux client", place: client_1}
      - {id: garagiste, qui: commercant, nom: "Le garagiste", place: garagiste}
    repliques:
      - {qui: vieux, dit: "La vidange, comme chaque printemps. Elle a trente-deux ans, et elle démarre au premier coup."}
      - {qui: garagiste, dit: "L'huile pour ce moteur, y a plus qu'à Valdorne qu'on la trouve. Et l'an prochain, plus de contrôle pour l'essence."}
      - {qui: vieux, dit: "Je la conduirai plus, voilà. Je la garde au garage, et je la démarre le samedi, vers cinq heures."}
      - {qui: garagiste, dit: "Pourquoi cinq heures ?"}
      - {qui: vieux, dit: "Pour klaxonner quand on gagne. Les voitures d'aujourd'hui ont un klaxon qui s'excuse."}

  - id: vie.cv.garage.sous_la_bache
    lieu: garage
    tranches: [matin, aprem]
    qui:
      - {id: apprenti, qui: passant, nom: "L'apprenti", place: client_1}
      - {id: garagiste, qui: commercant, nom: "Le garagiste", place: garagiste}
    repliques:
      - {qui: apprenti, dit: "La voiture sous la bâche, celle qui sort jamais. Elle est à qui ?"}
      - {qui: garagiste, dit: "Au patron. Il l'a commandée pour le jour où le Racing serait champion."}
      - {qui: apprenti, dit: "Ça fait combien de temps ?"}
      - {qui: garagiste, dit: "Elle était neuve quand je suis arrivé. Moi aussi, j'étais neuf."}

  # ════════════════════════════════════════════════ LA GARE ROUTIÈRE
  # toujours ouverte ; le guichetier (un homme) assis au guichet, les voyageurs sur les bancs

  - id: vie.cv.gare_routiere.six_heures_vingt
    si: "jour == sam"
    lieu: gareRoutiere
    tranches: [matin]
    qui:
      - {id: supporter, qui: fan, nom: "Un supporter", place: quai}
      - {id: guichetier, qui: commercant, nom: "Le guichetier", place: guichetier}
    repliques:
      - {qui: supporter, dit: "Le car du déplacement devait partir à six heures. Il est six heures vingt."}
      - {qui: guichetier, dit: "Votre chauffeur finit son café au Terminus. Il dit que la route bougera pas d'ici midi."}
      - {qui: supporter, dit: "On va rater l'échauffement."}
      - {qui: guichetier, dit: "Vous l'avez raté trois fois l'an dernier, et trois fois vous êtes rentrés en chantant. Il porte bonheur, son café."}

  - id: vie.cv.gare_routiere.le_distributeur
    si: "annee >= 2008 && annee < 2030"
    lieu: gareRoutiere
    tranches: [matin, aprem]
    qui:
      - {id: guichetier, qui: commercant, nom: "Le guichetier", place: guichetier}
      - {id: habituee, qui: passante, nom: "Une habituée", place: banc_1}
    repliques:
      - {qui: guichetier, dit: "Le mois prochain, c'est le distributeur qui vend les billets. Il rend la monnaie, il se trompe jamais."}
      - {qui: habituee, dit: "Et il saura me dire si le car de Valdorne est en retard à cause du brouillard ou du chauffeur ?"}
      - {qui: guichetier, dit: "Il affichera « retard ». Sans dire à qui la faute."}
      - {qui: habituee, dit: "Et vous, vous partez où ?"}
      - {qui: guichetier, dit: "Nulle part. Ils me gardent, assis à côté, pour expliquer la machine à ceux qui savent pas. Tout le monde, quoi."}

  - id: vie.cv.gare_routiere.le_manteau_rouge
    si: "annee >= 2024"
    lieu: gareRoutiere
    tranches: [aprem]
    qui:
      - {id: dame, qui: passante, nom: "Une dame en manteau rouge", place: banc_1}
      - {id: guichetier, qui: commercant, nom: "Le guichetier", place: guichetier}
    repliques:
      - {qui: dame, dit: "Le car de Portclair, celui de quatorze heures. Il a du retard ?"}
      - {qui: guichetier, dit: "Onze minutes. Vous attendez quelqu'un ?"}
      - {qui: dame, dit: "Un monsieur que je connais pas encore. Quarante lettres en six mois. Il a dit qu'il aurait une écharpe."}
      - {qui: guichetier, dit: "De quelle couleur, l'écharpe ?"}
      - {qui: dame, dit: "Celle de Portclair. Je lui ai écrit que ça marcherait jamais, entre nous. Il vient quand même.", emote: "coeur"}

  - id: vie.cv.gare_routiere.le_carton
    lieu: gareRoutiere
    tranches: [matin, midi]
    qui:
      - {id: jeune, qui: passant, nom: "Un jeune homme, une valise", place: banc_3}
      - {id: guichetier, qui: commercant, nom: "Le guichetier", place: guichetier}
    repliques:
      - {qui: jeune, dit: "Le monsieur du club devait m'attendre ici, à la descente du car de nuit. Avec mon nom sur un carton."}
      - {qui: guichetier, dit: "Il est venu à six heures. Il a attendu une heure, fumé trois cigarettes, et il est reparti."}
      - {qui: jeune, dit: "Le car avait deux heures de retard. La neige, du côté de Valmorne."}
      - {qui: guichetier, dit: "Il l'a entendu à la radio, en repartant. Le carton est sous ton banc : retourne-le, il a écrit au dos où le retrouver."}

  - id: vie.cv.gare_routiere.sept_heures_cinq
    lieu: gareRoutiere
    tranches: [matin]
    qui:
      - {id: fille, qui: passante, nom: "Une jeune femme", place: banc_1}
      - {id: pere, qui: ancien, nom: "Son père", place: banc_2}
    repliques:
      - {qui: fille, dit: "Le car de sept heures cinq part du quai 3. Tu peux rentrer, papa, je sais lire un panneau."}
      - {qui: pere, dit: "Je reste jusqu'au car. Ta mère m'a dit de te donner ça quand il serait en vue."}
      - {qui: fille, dit: "C'est quoi ?"}
      - {qui: pere, dit: "Une écharpe du Racing. Elle dit que là-bas, personne te regardera. Mais avec ça, y aura bien quelqu'un pour te parler."}

  # ════════════════════════════════════════════════ LA GRANDE HALLE (la friche)
  # toujours ouverte ; ceux qui y jouent, y peignent, y passent

  - id: vie.cv.halle.le_b
    si: "annee >= 2000 && annee < 2035"
    lieu: halle
    tranches: [soir, nuit]
    qui:
      - {id: vigile, qui: garagiste, nom: "Le vigile", place: visiteur}
      - {id: tagueur, qui: passant, nom: "Un tagueur", place: ombre_3}
    repliques:
      - {qui: vigile, dit: "La société m'a mis là pour empêcher les tags. T'as cinq minutes avant ma ronde."}
      - {qui: tagueur, dit: "Cinq minutes, c'est le temps d'une lettre. Une grosse."}
      - {qui: vigile, dit: "Fais le A de « AUBES », alors. Le B, je l'ai commencé hier, au fond, à côté des pigeons."}

  - id: vie.cv.halle.les_phares
    si: "annee >= 2030"
    lieu: halle
    tranches: [soir, nuit]
    qui:
      - {id: mere, qui: passante, nom: "Une mère", place: ombre_1}
      - {id: vieux, qui: ancien, nom: "Un vieux du quartier", place: ombre_2}
    repliques:
      - {qui: mere, dit: "Les gamins jouent ici la nuit, maintenant. Dans la journée, le béton brûle les semelles."}
      - {qui: vieux, dit: "On y jouait la nuit, nous aussi, en 1975. La journée, on était à l'usine."}
      - {qui: mere, dit: "Et vous aviez de la lumière ?"}
      - {qui: vieux, dit: "Les phares. Chacun garait sa voiture autour du terrain. Le plus riche faisait le côté nord."}

  - id: vie.cv.halle.le_point_de_penalty
    si: "!flag(histoire_h3) && !flag(histoire_h5)"
    lieu: halle
    tranches: [aprem, soir]
    qui:
      - {id: gamin, qui: enfant, nom: "Un gamin", place: ombre_1}
      - {id: grand, qui: passant, nom: "Un grand", place: ombre_2}
    repliques:
      - {qui: gamin, dit: "Les lignes de craie, c'est qui qui les refait ? Après chaque pluie, elles reviennent."}
      - {qui: grand, dit: "Mystère. Un matin, elles sont là, bien droites, avec le point de penalty."}
      - {qui: gamin, dit: "C'est un fantôme ?"}
      - {qui: grand, dit: "Un fantôme, il mettrait pas le point de penalty à onze mètres pile. J'ai mesuré avec mes pieds."}

  - id: vie.cv.halle.eternels
    lieu: halle
    tranches: [soir, nuit]
    qui:
      - {id: peintre, qui: fan, nom: "Un supporter, un pinceau", place: ombre_1}
      - {id: copine, qui: passante, nom: "Une supportrice", place: ombre_2}
    repliques:
      - {qui: peintre, dit: "Vingt mètres de bâche, et il manque un R à « ÉTERNELS ». On voit que ça."}
      - {qui: copine, dit: "C'est Bébert qui a tracé les lettres au crayon. Il dit que le R est sous le pot de peinture."}
      - {qui: peintre, dit: "Le pot est là depuis mardi. J'ai regardé dessous."}
      - {qui: copine, dit: "Alors on la déroule comme ça, samedi. Ceux d'en face riront, et l'an prochain, tout le monde chantera « ÉTENELS »."}

  # ════════════════════════════════════════════════ L'HÔTEL DE LA RIVE
  # toujours ouvert ; le personnel d'un soir, les clients au salon (les places des livres restent aux livres)

  - id: vie.cv.hotel.les_sieges
    si: "annee < 1999"
    lieu: hotel
    tranches: [aprem, soir]
    qui:
      - {id: representant, qui: inconnu, nom: "Un représentant", place: salon_3}
      - {id: bagagiste, qui: commercant2, nom: "Le bagagiste", place: bagages}
    repliques:
      - {qui: representant, dit: "Une chambre côté Rive, pas côté gare. Je viens vendre des sièges en plastique à votre stade."}
      - {qui: bagagiste, dit: "Côté Rive, le samedi, le match, vous l'aurez dans la chambre."}
      - {qui: representant, dit: "Justement. Assis sur mes sièges, les gens chantent moins. Les présidents adorent."}
      - {qui: bagagiste, dit: "Mon père a passé quarante ans debout en Nord. Touchez à ses marches, et votre petit-déjeuner montera froid."}

  - id: vie.cv.hotel.la_plante
    si: "annee >= 2014 && annee < 2040 && !flag(histoire_h7)"
    lieu: hotel
    tranches: [matin, aprem]
    qui:
      - {id: femme, qui: commercant, nom: "Une femme de chambre", place: bagages}
      - {id: receptionniste, qui: commercant2, nom: "Le réceptionniste", place: reception}
    repliques:
      - {qui: femme, dit: "Y a une plante énorme devant la porte de la 12. Je l'arrose, ou c'est quelqu'un d'autre ?"}
      - {qui: receptionniste, dit: "Tu l'arroses le mardi. Et la porte derrière, tu y touches pas."}
      - {qui: femme, dit: "On manque de chambres, les soirs de match. Elle sert à rien, cette chambre ?"}
      - {qui: receptionniste, dit: "On a onze chambres et une plante. Les soirs de match aussi."}

  - id: vie.cv.hotel.la_chambre_sept
    si: "role != selectionneur"
    lieu: hotel
    tranches: [aprem, soir]
    qui:
      - {id: journaliste, qui: passante, nom: "Une journaliste de la Capitale", place: salon_2}
      - {id: receptionniste, qui: commercant2, nom: "Le réceptionniste", place: reception}
    repliques:
      - {qui: journaliste, dit: "Vous savez où je peux trouver {nom} ce soir ? Je fais un portrait pour l'édition du dimanche."}
      - {qui: receptionniste, dit: "Le samedi, à la Rive. Le reste de la semaine, essayez le cimetière."}
      - {qui: journaliste, dit: "Je pensais plutôt à une adresse."}
      - {qui: receptionniste, dit: "Je ne donne pas les adresses, madame. Mais la 7 donne sur la rue des Lilas. Je vous la mets ?"}

  - id: vie.cv.hotel.onze_jours
    lieu: hotel
    tranches: [soir, nuit]
    qui:
      - {id: jeune, qui: passant, nom: "Un joueur à l'essai", place: salon_3}
      - {id: veilleur, qui: ancien, nom: "Le veilleur de nuit", place: bagages}
    repliques:
      - {qui: jeune, dit: "Ils m'ont dit trois jours d'essai. Ça fait onze jours que je suis ici, à leurs frais."}
      - {qui: veilleur, dit: "Onze jours, c'est bon signe. Ceux qu'on garde pas, ils repartent le troisième, avant le petit-déjeuner."}
      - {qui: jeune, dit: "Personne me dit rien. Bonjour dans le couloir, et voilà."}
      - {qui: veilleur, dit: "L'adjoint a demandé ton numéro de chambre hier soir. Il voulait savoir si tu dormais. Tu dormais. Il a souri."}

  # ════════════════════════════════════════════════ LA LAVERIE (rue du Stade)
  # du matin au soir ; ceux qui attendent sur les chaises et ceux qui plient

  - id: vie.cv.laverie.le_monnayeur
    si: "annee < 2002"
    lieu: laverie
    tranches: [matin, midi, aprem]
    qui:
      - {id: etudiant, qui: passant, nom: "Un étudiant", place: machines}
      - {id: dame, qui: passante, nom: "Une dame", place: attente_1}
    repliques:
      - {qui: etudiant, dit: "Le monnayeur prend que les pièces de dix francs. Quelqu'un en a ?"}
      - {qui: dame, dit: "Toute la semaine, je les mets de côté dans une boîte à sucre. Pour mon jeudi."}
      - {qui: etudiant, dit: "Vous m'en vendriez deux ? Je vous donne un billet de cinquante."}
      - {qui: dame, dit: "Je vous les prête. Jeudi prochain, vous me les rendez, et vous restez pour le café. Le séchage, c'est long."}

  - id: vie.cv.laverie.l_application
    si: "annee >= 2024"
    lieu: laverie
    tranches: [matin, aprem]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux monsieur", place: attente_2}
      - {id: gamin, qui: enfant, nom: "Un gamin", place: machines}
    repliques:
      - {qui: vieux, dit: "Faut l'application pour lancer la machine, maintenant. Moi, j'ai pas l'application. J'ai du linge."}
      - {qui: gamin, dit: "Donnez, je la lance avec mon téléphone. C'est mon père qui paie, il regarde jamais."}
      - {qui: vieux, dit: "Combien je te dois ?"}
      - {qui: gamin, dit: "Rien. Racontez-moi le but de la Coupe, en 66. Mon grand-père le raconte faux."}

  - id: vie.cv.laverie.le_tutu
    lieu: laverie
    tranches: [matin, aprem, soir]
    qui:
      - {id: dame, qui: passante, nom: "Une dame", place: attente_1}
      - {id: pere, qui: passant, nom: "Un père", place: machines}
    repliques:
      - {qui: dame, dit: "Pas le tutu avec les chaussettes noires, malheureux. Votre fille va danser en gris."}
      - {qui: pere, dit: "Sa mère s'en occupait. Moi, je lavais les maillots du club, le dimanche, tout en vrac."}
      - {qui: dame, dit: "Les maillots, ça se lave à l'envers, et un tutu à la main. Donnez, je vous le fais."}
      - {qui: pere, dit: "Vous avez des enfants ?"}
      - {qui: dame, dit: "J'ai un mari qui joue encore en vétérans, à soixante-huit ans. Arrière gauche. Un tutu, c'est des vacances."}

  - id: vie.cv.laverie.la_machine_en_panne
    lieu: laverie
    tranches: [soir]
    qui:
      - {id: lui, qui: passant, nom: "Un jeune homme", place: attente_2}
      - {id: elle, qui: passante, nom: "Une jeune femme", place: pliage}
    repliques:
      - {qui: lui, dit: "Mardi, jeudi, et encore ce soir. Vous lavez beaucoup, pour une seule personne."}
      - {qui: elle, dit: "Ma machine est en panne depuis février."}
      - {qui: lui, dit: "La mienne aussi."}
      - {qui: elle, dit: "J'ai vu votre machine, l'autre soir, par votre fenêtre. Elle tournait.", emote: "coeur"}

  # ════════════════════════════════════════════════ LA LIBRAIRIE-PAPETERIE
  # matin, après-midi ; le libraire à sa place, la table de la photographe laissée libre

  - id: vie.cv.librairie.le_cahier_noir
    si: "phase == presaison"
    lieu: librairie
    tranches: [matin, aprem]
    qui:
      - {id: mere, qui: passante, nom: "Une mère", place: client_1}
      - {id: libraire, qui: commercant2, nom: "Le libraire", place: libraire}
    repliques:
      - {qui: mere, dit: "Six cahiers à grands carreaux, un compas, et… « un cahier noir pour les tactiques » ? C'est sur la liste, ça ?"}
      - {qui: libraire, dit: "Pas sur la liste de l'école. C'est votre fils qui l'a ajouté, au crayon, tout en bas."}
      - {qui: mere, dit: "Il a onze ans. Quelles tactiques ?"}
      - {qui: libraire, dit: "Le même que l'entraîneur des poussins : quadrillé, couverture noire. Je lui en vends un par an. Il remplit même les marges."}

  - id: vie.cv.librairie.le_pied_de_la_table
    si: "annee < 2002"
    lieu: librairie
    tranches: [matin, aprem]
    qui:
      - {id: ancien, qui: ancien, nom: "Un ancien joueur", place: visiteur}
      - {id: libraire, qui: commercant2, nom: "Le libraire", place: libraire}
    repliques:
      - {qui: ancien, dit: "Vous en avez vendu combien, de mon livre ? Celui de la vitrine, avec le ballon sur la couverture."}
      - {qui: libraire, dit: "Trois, à quatre-vingt-quinze francs. Un à votre sœur, un au curé, et un à un monsieur qui voulait caler sa table."}
      - {qui: ancien, dit: "Il l'a lu, au moins ?"}
      - {qui: libraire, dit: "Il est revenu le lendemain en acheter un deuxième. Pour l'autre pied de la table, et pour le chapitre sept."}

  - id: vie.cv.librairie.l_atelier_3
    si: "annee >= 2003 && annee < 2035"
    lieu: librairie
    tranches: [matin, aprem]
    qui:
      - {id: cliente, qui: passante, nom: "Une cliente", place: client_1}
      - {id: libraire, qui: commercant, nom: "La libraire", place: libraire}
    repliques:
      - {qui: cliente, dit: "Vous avez encore la carte postale de la Tréfilerie, avec la cheminée ? Celle d'avant les travaux."}
      - {qui: libraire, dit: "Il m'en reste deux, au fond du tiroir. On en imprime plus, les gens veulent le pont, pas l'usine."}
      - {qui: cliente, dit: "C'est pour mon grand-père, à la maison de retraite de Valdorne. Trente ans à l'atelier 3."}
      - {qui: libraire, dit: "Il va pleurer."}
      - {qui: cliente, dit: "Il va la corriger. Il entoure la fenêtre de son atelier au stylo, et il me la renvoie."}

  - id: vie.cv.librairie.le_gardien_de_1991
    si: "annee >= 2035"
    lieu: librairie
    tranches: [matin, aprem]
    qui:
      - {id: gamin, qui: enfant, nom: "Un gamin", place: client_1}
      - {id: libraire, qui: commercant2, nom: "Le libraire", place: libraire}
    repliques:
      - {qui: gamin, dit: "C'est quoi, ces petits papiers dans la boîte en fer ? Des visages, avec des numéros."}
      - {qui: libraire, dit: "Des vignettes. On les collait dans un album, saison par saison. On échangeait les doubles dans la cour."}
      - {qui: gamin, dit: "Et quand on avait pas la bonne ?"}
      - {qui: libraire, dit: "On attendait. Des semaines. Le gardien de 1991, je l'attends encore. Y a un trou à sa place, dans l'album."}

  # ════════════════════════════════════════════════ LA LOGE DU GARDIEN DU CIMETIÈRE
  # le soir, quand le gardien n'est plus là : son remplaçant, et ceux qui arrivent après la grille
  # (la place `porte` est sur le bureau du gardien : celui qui se tient debout est posé devant la chaise)

  - id: vie.cv.loge.aller_leur_parler
    si: "serie_d >= 1"
    lieu: loge
    tranches: [soir]
    qui:
      - {id: supporter, qui: fan, nom: "Un supporter", place: [2, 1]}
      - {id: vieux, qui: ancien, nom: "Un vieux du virage", place: chaise}
    repliques:
      - {qui: supporter, dit: "On signe le registre et on va au caveau. Avec une série pareille, faut aller leur parler."}
      - {qui: vieux, dit: "En 1987, on était venus à onze, après la sixième défaite. On avait gagné le dimanche suivant."}
      - {qui: supporter, dit: "Et cette fois, on est combien ?"}
      - {qui: vieux, dit: "Deux. Les autres disent que les morts jouent plus. Moi, je dis qu'ils ont plus de temps que nous pour la tactique."}

  - id: vie.cv.loge.la_camera
    si: "annee >= 2030"
    lieu: loge
    tranches: [soir]
    qui:
      - {id: technicien, qui: passant, nom: "Un technicien de la mairie", place: [2, 1]}
      - {id: remplacant, qui: ancien, nom: "Le remplaçant du gardien", place: chaise}
    repliques:
      - {qui: technicien, dit: "Une caméra à la grille, une à l'allée centrale. Votre registre, vous en aurez plus besoin."}
      - {qui: remplacant, dit: "Elle voit les gens passer, votre caméra. Le registre, il sait qui revient."}
      - {qui: technicien, dit: "C'est la même chose."}
      - {qui: remplacant, dit: "Non. La dame qui vient tous les soirs depuis onze ans, votre caméra la prendra pour une rôdeuse."}

  - id: vie.cv.loge.dix_sept_heures_cinquante
    lieu: loge
    tranches: [soir]
    qui:
      - {id: femme, qui: passante, nom: "Une femme", place: chaise}
      - {id: remplacant, qui: ancien, nom: "Le remplaçant du gardien", place: [2, 1]}
    repliques:
      - {qui: femme, dit: "Je sais, il est tard. Je finis le travail à vingt heures, j'ai que le soir."}
      - {qui: remplacant, dit: "La grille ferme à dix-huit heures. Ceux qui passent après, je dois les écrire dans le registre."}
      - {qui: femme, dit: "Alors m'écrivez pas dedans."}
      - {qui: remplacant, dit: "Je vous écris. À dix-sept heures cinquante. Et la grille reste entrouverte jusqu'à ce que vous ressortiez."}

  # ════════════════════════════════════════════════ LA MAIRIE
  # matin, après-midi, en semaine ; l'huissier (un homme) à l'entrée, le bureau de la maire à la maire

  - id: vie.cv.mairie.gigi
    si: "annee < 1993"
    lieu: mairie
    tranches: [matin, aprem]
    qui:
      - {id: pere, qui: passant, nom: "Un jeune père", place: couloir}
      - {id: huissier, qui: commercant, nom: "L'huissier", place: huissier}
    repliques:
      - {qui: pere, dit: "Je viens déclarer une naissance. Un garçon, trois kilos huit, ce matin à six heures."}
      - {qui: huissier, dit: "L'état civil, c'est la deuxième porte. Le prénom, vous l'avez ?"}
      - {qui: pere, dit: "Gigi. Comme le gardien."}
      - {qui: huissier, dit: "Et la mère est d'accord ?"}
      - {qui: pere, dit: "La mère dort, à la maternité. Elle a dit « Louis ». Je mettrai Louis en deuxième."}

  - id: vie.cv.mairie.a_perpetuite
    si: "annee >= 2003 && annee < 2020"
    lieu: mairie
    tranches: [matin]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux monsieur", place: visiteur}
      - {id: huissier, qui: commercant, nom: "L'huissier", place: huissier}
    repliques:
      - {qui: vieux, dit: "Je voudrais voir le maire, au sujet de l'acte de 1931. Le terrain de la Rive."}
      - {qui: huissier, dit: "Vous venez tous les lundis, monsieur. Rien n'a changé depuis lundi dernier."}
      - {qui: vieux, dit: "« Aux enfants du quartier, à perpétuité. » En 1931, j'étais un enfant du quartier. Je suis toujours là."}
      - {qui: huissier, dit: "Je vous inscris sur la liste. Vous êtes troisième, derrière deux autres enfants du quartier de 1931."}

  - id: vie.cv.mairie.le_nom_de_la_banque
    si: "annee >= 2010 && annee < 2037"
    lieu: mairie
    tranches: [matin, aprem]
    qui:
      - {id: conseiller, qui: passant, nom: "Un conseiller municipal", place: conseiller_1}
      - {id: vieux, qui: ancien, nom: "Un vieux conseiller", place: conseiller_2}
    repliques:
      - {qui: conseiller, dit: "On propose de rebaptiser le stade. Deux cent mille écus par an pour mettre un nom de banque sur la Rive."}
      - {qui: vieux, dit: "Mon père disait « la Rive ». Ton nom de banque, personne le dira."}
      - {qui: conseiller, dit: "Personne a besoin de le dire. Il suffit qu'il soit écrit en haut, en lettres de deux mètres, et qu'on le voie à la télé."}
      - {qui: vieux, dit: "Vote-le, si tu veux. Et va voir ce que les gamins de la Nord écriront en dessous, la première nuit."}

  - id: vie.cv.mairie.les_tomates
    si: "annee >= 2024"
    lieu: mairie
    tranches: [matin, aprem]
    qui:
      - {id: administree, qui: passante, nom: "Une administrée", place: couloir}
      - {id: huissier, qui: commercant, nom: "L'huissier", place: huissier}
    repliques:
      - {qui: administree, dit: "Interdiction d'arroser les jardins jusqu'en septembre. Et la pelouse de la Rive, on l'arrose toutes les nuits."}
      - {qui: huissier, dit: "La pelouse a une dérogation, madame. Les matchs sont retransmis."}
      - {qui: administree, dit: "Mes tomates, elles sont pas retransmises, c'est ça ?"}
      - {qui: huissier, dit: "Filmez-les tous les samedis, et revenez avec le nombre de spectateurs."}

  - id: vie.cv.mairie.le_banc_du_tilleul
    si: "annee < 2025"
    lieu: mairie
    tranches: [matin, aprem]
    qui:
      - {id: dame, qui: passante, nom: "Une administrée", place: couloir}
      - {id: huissier, qui: commercant, nom: "L'huissier", place: huissier}
    repliques:
      - {qui: dame, dit: "Je viens pour le banc du square, celui sous le tilleul. La mairie l'a fait enlever lundi."}
      - {qui: huissier, dit: "Des plaintes des voisins, madame. Les jeunes, la nuit, le bruit."}
      - {qui: dame, dit: "Mon mari m'a demandée en mariage sur ce banc, un soir de victoire. Du bruit, il y en avait, ce soir-là aussi."}
      - {qui: huissier, dit: "Les voisins s'étaient plaints ?"}
      - {qui: dame, dit: "Les voisins, c'était nous. On criait aux amoureux de se taire, par la fenêtre. Et puis on est descendus."}

  # ════════════════════════════════════════════════ LE LOCAL DU MATÉRIEL
  # toujours ouvert ; l'intendant à sa place, celui qui passe à celle du visiteur

  - id: vie.cv.materiel.les_gilets
    si: "annee >= 2010"
    lieu: materiel
    tranches: [matin, aprem, soir]
    qui:
      - {id: analyste, qui: passant, nom: "Un jeune analyste", place: visiteur}
      - {id: intendant, qui: commercant2, nom: "L'intendant", place: intendant}
    repliques:
      - {qui: analyste, dit: "Les trente gilets à puce doivent être chargés avant six heures. Où sont les prises ?"}
      - {qui: intendant, dit: "Y en a deux. Une pour la tondeuse, une pour la cafetière."}
      - {qui: analyste, dit: "On peut pas débrancher la cafetière ?"}
      - {qui: intendant, dit: "Sans la cafetière, ils viennent pas courir, tes joueurs. Débranche la tondeuse."}

  - id: vie.cv.materiel.le_cadenas
    lieu: materiel
    tranches: [matin, aprem]
    qui:
      - {id: jardinier, qui: garagiste, nom: "Le jardinier", place: visiteur}
      - {id: intendant, qui: commercant2, nom: "L'intendant", place: intendant}
    repliques:
      - {qui: jardinier, dit: "Le code du cadenas, tout le quartier le connaît. Les gamins du square se servent en ballons le dimanche."}
      - {qui: intendant, dit: "Je le laisse comme ça. Exprès."}
      - {qui: jardinier, dit: "Tu laisses voler les ballons du club ?"}
      - {qui: intendant, dit: "Deux de moins chaque lundi. En septembre, ils reviennent au centre de formation, sous le bras d'un gamin qui sait jongler."}

  - id: vie.cv.materiel.six_centimetres
    lieu: materiel
    tranches: [matin, aprem]
    qui:
      - {id: jardinier, qui: garagiste, nom: "Le jardinier", place: visiteur}
      - {id: intendant, qui: commercant2, nom: "L'intendant", place: intendant}
    repliques:
      - {qui: jardinier, dit: "La tondeuse repart pas. Le club a promis la pièce pour le mois dernier."}
      - {qui: intendant, dit: "Elle est arrivée mardi. Elle est sous les chasubles, dans le carton."}
      - {qui: jardinier, dit: "Et tu m'as rien dit ?"}
      - {qui: intendant, dit: "Elle marche, tu tonds à trois centimètres, comme à la télé. En panne, tu tonds à six. T'as vu nos défenseurs ?"}

  # ════════════════════════════════════════════════ LA SALLE DE MUSCU (l'ancien garage Mazurier)
  # du matin au soir ; les habitués à leurs places (celle de Steph reste à Steph)

  - id: vie.cv.muscu.la_derniere_repetition
    si: "annee >= 2008 && annee < 2035"
    lieu: muscu
    tranches: [aprem, soir]
    qui:
      - {id: jeune, qui: passant, nom: "Un jeune", place: client_1}
      - {id: vieux, qui: ancien, nom: "Un habitué", place: client_3}
    repliques:
      - {qui: jeune, dit: "Tiens le téléphone, filme-moi au développé couché. Juste la dernière répétition."}
      - {qui: vieux, dit: "Et les neuf autres ?"}
      - {qui: jeune, dit: "Les neuf autres, on s'en fout. Sur le Flux, on montre que la dernière."}
      - {qui: vieux, dit: "Comme au stade. Le but, on s'en souvient. Les quatre-vingt-neuf minutes d'avant, c'est nous qui les courions."}

  - id: vie.cv.muscu.la_salle_de_six_heures
    si: "annee >= 2030"
    lieu: muscu
    tranches: [matin]
    qui:
      - {id: joueuse, qui: passante, nom: "Une joueuse", place: client_2}
      - {id: vieux, qui: ancien, nom: "Un vieil habitué", place: client_3}
    repliques:
      - {qui: joueuse, dit: "Le club nous donne la salle de six à sept, avant l'ouverture. Les garçons ont la salle neuve de la zone nord."}
      - {qui: vieux, dit: "Elle sent l'huile, la nôtre. Je viens depuis le temps des voitures, et elle a toujours senti l'huile."}
      - {qui: joueuse, dit: "Ça vous dérange, de partager vos matins ?"}
      - {qui: vieux, dit: "Ça me dérange que vous souleviez plus que moi. Pour le reste, je vous laisse la radio."}

  - id: vie.cv.muscu.les_chevaux
    lieu: muscu
    tranches: [aprem]
    qui:
      - {id: costaud, qui: passant, nom: "Un habitué de la fonte", place: client_1}
      - {id: vieux, qui: ancien, nom: "Un vieux mécanicien", place: client_3}
    repliques:
      - {qui: costaud, dit: "Monte la radio. La régionale parle du Racing."}
      - {qui: vieux, dit: "Cette radio, c'était celle de Mazurier, quand c'était mon atelier. Elle prend qu'une station. Les courses de chevaux."}
      - {qui: costaud, dit: "Et pour les scores, on fait comment ?"}
      - {qui: vieux, dit: "Comme Mazurier. On écoute les chevaux, et le samedi, on regarde par la vitre la tête de ceux qui sortent du tabac."}

  - id: vie.cv.muscu.le_carrelage
    lieu: muscu
    tranches: [matin, aprem, soir]
    qui:
      - {id: ado, qui: enfant, nom: "Un adolescent", place: client_1}
      - {id: vieux, qui: ancien, nom: "Un vieil habitué", place: client_3}
    repliques:
      - {qui: ado, dit: "Trois mois de fonte, et le recruteur me remarque. Il regarde les épaules, c'est mon cousin qui l'a dit."}
      - {qui: vieux, dit: "Le recruteur regarde les chevilles, et ta façon de te relever quand tu tombes. Les épaules, c'est pour les photos."}
      - {qui: ado, dit: "Je fais quoi, pendant trois mois ?"}
      - {qui: vieux, dit: "Tu tombes, et tu te relèves. Le carrelage est gratuit."}

  # ════════════════════════════════════════════════ LA PHARMACIE
  # matin, après-midi ; la préparatrice (une femme) au comptoir

  - id: vie.cv.pharmacie.la_grosse_boite
    si: "annee >= 2003 && annee < 2035"
    lieu: pharmacie
    tranches: [matin, aprem]
    qui:
      - {id: mere, qui: passante, nom: "Une mère", place: client_1}
      - {id: preparatrice, qui: commercant, nom: "La préparatrice", place: pharmacien}
    repliques:
      - {qui: mere, dit: "La poudre de protéines, la grosse boîte. C'est pour mon fils, il a quatorze ans, il est au centre."}
      - {qui: preparatrice, dit: "À quatorze ans, il lui faut des pâtes et du sommeil. Qui vous a conseillé la boîte ?"}
      - {qui: mere, dit: "Un monsieur, au bord du terrain. Il a dit que tous les grands en prenaient."}
      - {qui: preparatrice, dit: "Je vous mets des pâtes. Et vous allez me décrire ce monsieur, et sa voiture."}

  - id: vie.cv.pharmacie.dans_les_bonnes_couleurs
    si: "annee >= 2030"
    lieu: pharmacie
    tranches: [matin, aprem]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieil abonné", place: client_1}
      - {id: preparatrice, qui: commercant, nom: "La préparatrice", place: pharmacien}
    repliques:
      - {qui: vieux, dit: "Il paraît que vous vendez des écharpes qui rafraîchissent. Pour le match de vingt-deux heures."}
      - {qui: preparatrice, dit: "Bleue ou blanche. On la mouille, on la met au cou, elle garde le frais deux heures."}
      - {qui: vieux, dit: "Vous l'avez pas en bordeaux et gris ?"}
      - {qui: preparatrice, dit: "Non. Mettez l'autre par-dessus. Vous aurez chaud quand même, mais dans les bonnes couleurs."}

  - id: vie.cv.pharmacie.les_pompiers
    lieu: pharmacie
    tranches: [matin, aprem]
    qui:
      - {id: client, qui: passant, nom: "Un client", place: client_2}
      - {id: preparatrice, qui: commercant, nom: "La préparatrice", place: pharmacien}
    repliques:
      - {qui: client, dit: "Trois bombes de froid et un rouleau de strap. Pour dimanche matin, l'équipe du quartier."}
      - {qui: preparatrice, dit: "Trois bombes ? Vous jouez contre qui, une équipe de bouchers ?"}
      - {qui: client, dit: "Contre les pompiers de Valdorne. L'an dernier, ils nous ont envoyé deux joueurs à l'hôpital. Ils les y ont conduits eux-mêmes."}
      - {qui: preparatrice, dit: "Je vous mets de l'arnica en plus. Pour les pompiers. Eux, ils pensent jamais à se soigner."}

  - id: vie.cv.pharmacie.le_corner_de_1979
    lieu: pharmacie
    tranches: [matin, aprem]
    qui:
      - {id: client, qui: passant, nom: "Un client", place: client_1}
      - {id: preparatrice, qui: commercant, nom: "La préparatrice", place: pharmacien}
    repliques:
      - {qui: client, dit: "Quelque chose pour dormir. Je me réveille à quatre heures du matin, et je refais le match."}
      - {qui: preparatrice, dit: "Celui de samedi ? Vous y étiez pas, vous tondiez votre pelouse. Je vous ai vu en passant."}
      - {qui: client, dit: "Pas celui de samedi. Celui de 1979. On l'a perdu sur un corner."}
      - {qui: preparatrice, dit: "Contre 1979, j'ai rien en rayon. Je vous mets une tisane, et le corner, vous le laissez tranquille."}

  # ════════════════════════════════════════════════ LA MAISON DE LA PRESSE (rue des Lilas)
  # matin, midi, après-midi ; le marchand de journaux (un homme) au comptoir

  - id: vie.cv.presse.les_quinze_gazettes
    si: "annee < 2015 && role != president"
    lieu: presse
    tranches: [matin]
    qui:
      - {id: cliente, qui: passante, nom: "Une cliente", place: client_2}
      - {id: marchand, qui: commercant, nom: "Le marchand de journaux", place: marchand}
    repliques:
      - {qui: cliente, dit: "La Gazette Rose dit que le président a une amie à la Capitale. Vous en avez encore ?"}
      - {qui: marchand, dit: "Plus une. Le président est passé à sept heures, et il a pris les quinze."}
      - {qui: cliente, dit: "Pour les lire ?"}
      - {qui: marchand, dit: "Pour que sa femme les lise pas. Elle est passée à sept heures et quart. Je lui en avais mis une de côté."}

  - id: vie.cv.presse.les_avis_de_deces
    si: "annee >= 2015 && annee < 2040"
    lieu: presse
    tranches: [matin, midi]
    qui:
      - {id: marchand, qui: commercant, nom: "Le marchand de journaux", place: marchand}
      - {id: vieux, qui: ancien, nom: "Un vieux client", place: client_1}
    repliques:
      - {qui: marchand, dit: "Douze Écho, trois Quotidien, zéro Gazette, elle existe plus qu'en ligne. Y a vingt ans, j'en vendais deux cents le lundi."}
      - {qui: vieux, dit: "Et vous tenez comment ?"}
      - {qui: marchand, dit: "Avec les jeux à gratter et les cartes d'anniversaire. Les gens lisent plus, mais ils grattent, et ils ont des petits-enfants."}
      - {qui: vieux, dit: "Mettez-moi L'Écho et un jeu à gratter. Je gratterai en lisant les avis de décès. Si je gagne, c'est que j'y suis pas."}

  - id: vie.cv.presse.le_62
    lieu: presse
    tranches: [matin, midi, aprem]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux client", place: client_1}
      - {id: marchand, qui: commercant, nom: "Le marchand de journaux", place: marchand}
    repliques:
      - {qui: vieux, dit: "Ma grille, comme chaque semaine : le 3, le 19, le 62, et les numéros de maillot des buteurs."}
      - {qui: marchand, dit: "Le 62 existe pas, sur la grille. Ça s'arrête à quarante-neuf."}
      - {qui: vieux, dit: "Je le coche quand même, dans la marge. S'il sort un jour, ça voudra dire qu'ils mentent depuis le début."}

  - id: vie.cv.presse.celui_d_hier
    lieu: presse
    tranches: [matin]
    qui:
      - {id: marchand, qui: commercant, nom: "Le marchand de journaux", place: marchand}
      - {id: gamin, qui: enfant, nom: "Un gamin", place: client_1}
    repliques:
      - {qui: marchand, dit: "Tu lis la page des sports tous les matins sans acheter le journal. Ça fait trois ans."}
      - {qui: gamin, dit: "Je la lis vite. Il est pas abîmé, après."}
      - {qui: marchand, dit: "Je sais. Demain, prends celui d'hier, sous le comptoir. Le résultat aura pas changé."}

  # ════════════════════════════════════════════════ LE STADE DE LA RIVE (le vestiaire)
  # toujours ouvert ; les joueurs sur les bancs, le personnel du club au milieu

  - id: vie.cv.stade.la_bouteille
    roles: [entraineur]
    si: "annee < 1999"
    lieu: stade
    tranches: [aprem, soir]
    qui:
      - {id: milieu, qui: passant, nom: "Un milieu de terrain", place: banc_1}
      - {id: veteran, qui: ancien, nom: "Un vétéran", place: banc_3}
    repliques:
      - {qui: milieu, dit: "À la mi-temps, pas un cri. Juste la bouteille du capitaine, remise droite sur le banc."}
      - {qui: veteran, dit: "Celui d'avant cassait les bouteilles contre le mur. Au moins, on savait où on en était."}
      - {qui: milieu, dit: "Et là, on en est où ?"}
      - {qui: veteran, dit: "Là, on a gagné. Et tout le monde a peur de la prochaine bouteille."}

  - id: vie.cv.stade.plus_de_mains
    si: "annee >= 1992 && annee < 1999"
    lieu: stade
    tranches: [matin, aprem]
    qui:
      - {id: gardien, qui: passant, nom: "Le gardien remplaçant", place: banc_2}
      - {id: libero, qui: ancien, nom: "Le vieux libéro", place: banc_3}
    repliques:
      - {qui: gardien, dit: "Une passe en retrait du pied, et plus le droit aux mains. Dix ans que j'apprends à attraper, et maintenant faut des pieds."}
      - {qui: libero, dit: "Moi, je t'en faisais cent par match, des passes en retrait, quand j'avais plus d'idée. Je fais quoi, maintenant ?"}
      - {qui: gardien, dit: "Tu la mets en touche, comme tout le monde."}
      - {qui: libero, dit: "En touche, devant la Nord ? Ils me sifflent depuis 1981. T'étais le seul à jamais me siffler, toi."}

  - id: vie.cv.stade.le_casier_9
    si: "annee >= 1999 && annee < 2024"
    lieu: stade
    tranches: [matin, aprem]
    qui:
      - {id: menage, qui: commercant, nom: "La femme de ménage", place: milieu}
      - {id: jeune, qui: passant, nom: "Un jeune joueur", place: banc_5}
    repliques:
      - {qui: menage, dit: "Je décolle l'étiquette du casier 9. Ils l'ont vendu ce matin, à sept heures, avant l'entraînement."}
      - {qui: jeune, dit: "Il nous a même pas dit au revoir. Ses crampons sont encore dedans."}
      - {qui: menage, dit: "Ils les laissent tous. Je les garde dans un sac, sous l'évier, au cas où ils reviendraient."}
      - {qui: jeune, dit: "Y en a qui reviennent ?"}
      - {qui: menage, dit: "Un sur dix. Toujours plus vieux. Ils reprennent leurs crampons dans le sac et ils vont se changer, l'air de rien."}

  - id: vie.cv.stade.le_maillot_de_coton
    si: "annee >= 2024"
    lieu: stade
    tranches: [matin, aprem]
    qui:
      - {id: defenseur, qui: passant, nom: "Un défenseur", place: banc_2}
      - {id: soigneur, qui: ancien, nom: "Le vieux soigneur", place: doc}
    repliques:
      - {qui: defenseur, dit: "Mon maillot a dit au staff que j'avais mal dormi. Avant le petit-déjeuner, ils le savaient tous."}
      - {qui: soigneur, dit: "Et t'avais mal dormi ?"}
      - {qui: defenseur, dit: "Ma fille fait ses dents. Ça, le maillot le dit pas."}
      - {qui: soigneur, dit: "Dors dans un vieux maillot de coton. Y en a un carton au fond du local. Ceux-là, ils répètent rien."}

  - id: vie.cv.stade.le_pied_gauche
    lieu: stade
    tranches: [matin, aprem, soir]
    qui:
      - {id: jeune, qui: passant, nom: "Un jeune joueur", place: banc_5}
      - {id: veteran, qui: ancien, nom: "Un vétéran", place: banc_6}
    repliques:
      - {qui: jeune, dit: "Pourquoi tu laces toujours le pied gauche en premier ?"}
      - {qui: veteran, dit: "Y a douze ans, j'ai lacé le droit d'abord. On en a pris cinq à Valdorne."}
      - {qui: jeune, dit: "Ça a peut-être rien à voir avec les cinq buts."}
      - {qui: veteran, dit: "Peut-être. Mais depuis, j'en ai plus jamais pris cinq. Et toi, ce matin, t'as lacé le droit."}

  # ════════════════════════════════════════════════ LE TABAC DU QUAI
  # du matin au soir ; les mariniers au comptoir et à la table (la place du patron reste au patron)

  - id: vie.cv.tabac.trois_peniches
    si: "annee >= 1991 && annee < 2007"
    lieu: tabac
    tranches: [matin, midi]
    qui:
      - {id: marinier, qui: passant, nom: "Un marinier", place: marinier_1}
      - {id: vieux, qui: ancien, nom: "Un vieux marinier", place: marinier_2}
    repliques:
      - {qui: marinier, dit: "Trois péniches cette semaine. Avant, la Tréfilerie en chargeait trois par jour."}
      - {qui: vieux, dit: "Avant, on buvait le café debout. On avait pas le temps de s'asseoir."}
      - {qui: marinier, dit: "Et maintenant ?"}
      - {qui: vieux, dit: "Maintenant, on s'assoit, et on parie sur la crue. C'est le seul fret qui arrive encore tout seul."}

  - id: vie.cv.tabac.tout_seuls
    si: "annee >= 2008 && annee < 2035"
    lieu: tabac
    tranches: [aprem, soir]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux marinier", place: marinier_2}
      - {id: mariniere, qui: passante, nom: "Une marinière", place: table_1}
    repliques:
      - {qui: vieux, dit: "Les jeunes parient sur leur téléphone, maintenant. La nuit, contre des gens qu'ils voient pas."}
      - {qui: mariniere, dit: "Ils perdent pareil. Mais tout seuls, dans leur lit."}
      - {qui: vieux, dit: "Nous, on payait le patron en cafés. Le téléphone, il prend pas les cafés."}
      - {qui: mariniere, dit: "Mon fils a perdu sa paie de mars sur un corner, à l'autre bout du monde. Il savait même pas qui jouait."}

  - id: vie.cv.tabac.le_lit_de_la_riviere
    si: "annee >= 2030"
    lieu: tabac
    tranches: [matin, midi]
    qui:
      - {id: marinier, qui: passant, nom: "Un marinier", place: marinier_1}
      - {id: vieux, qui: ancien, nom: "Un vieux marinier", place: marinier_2}
    repliques:
      - {qui: marinier, dit: "Quarante centimètres d'eau sous la coque, en août. On passera plus le pont avant octobre."}
      - {qui: vieux, dit: "En 1976, on était restés coincés tout l'été, déjà. On avait joué au football dans le lit de la rivière."}
      - {qui: marinier, dit: "Qui avait gagné ?"}
      - {qui: vieux, dit: "Personne. Le match s'est arrêté à la première pluie. On a fini à la nage, et on a dit que c'était un nul."}

  - id: vie.cv.tabac.quatre_contre_un
    lieu: tabac
    tranches: [aprem, soir]
    qui:
      - {id: parieur, qui: fan, nom: "Un parieur", place: marinier_1}
      - {id: mariniere, qui: passante, nom: "Une marinière", place: table_1}
    repliques:
      - {qui: parieur, dit: "La cote du jour : {nom} toujours en place à Noël, à quatre contre un."}
      - {qui: mariniere, dit: "Quatre contre un pour rester ? C'est méchant."}
      - {qui: parieur, dit: "C'est la cote. Le patron fait pas de sentiment. Sauf sur les chevaux."}
      - {qui: mariniere, dit: "Mets-moi dix sur Noël, et dix sur Pâques, au cas où. Si je gagne les deux, je lui paie un verre."}

  # ════════════════════════════════════════════════ LE TABAC-PRESSE DU CARREFOUR
  # matin, midi, après-midi ; la buraliste (une femme) au comptoir

  - id: vie.cv.tabac_stade.un_silence_c_est_l_arbitre
    si: "jour == sam && annee < 2013"
    lieu: tabac_stade
    tranches: [aprem]
    qui:
      - {id: supporter, qui: fan, nom: "Un supporter", place: comptoir_1}
      - {id: buraliste, qui: commercant, nom: "La buraliste", place: patron}
    repliques:
      - {qui: supporter, dit: "Le patron sait le score avant la radio. Comment il fait ?"}
      - {qui: buraliste, dit: "Il ouvre la fenêtre de l'arrière-boutique. Un grand cri, c'est nous. Un petit cri, c'est eux. Un silence, c'est l'arbitre."}
      - {qui: supporter, dit: "Et deux grands cris de suite ?"}
      - {qui: buraliste, dit: "Un but, puis un but refusé. Là, il appelle le kiosque du quai : le vendeur a un cousin sur le toit de la tribune."}

  - id: vie.cv.tabac_stade.ah_non
    si: "annee >= 2008 && annee < 2035"
    lieu: tabac_stade
    tranches: [aprem]
    qui:
      - {id: buraliste, qui: commercant, nom: "La buraliste", place: patron}
      - {id: vieux, qui: ancien, nom: "Un vieux client", place: comptoir_1}
    repliques:
      - {qui: buraliste, dit: "Ça fait une heure que vous regardez l'écran des résultats, et vous avez pas joué une grille."}
      - {qui: vieux, dit: "Je regarde le Racing. Il passe en bas de l'écran, entre deux tirages."}
      - {qui: buraliste, dit: "Vous avez pas la télé, chez vous ?"}
      - {qui: vieux, dit: "Chez moi, y a personne pour dire « ah non » quand on encaisse. Vous, vous le dites à chaque fois."}

  - id: vie.cv.tabac_stade.le_bocal_d_ecus
    si: "annee >= 2035"
    lieu: tabac_stade
    tranches: [matin, midi]
    qui:
      - {id: jeune, qui: passant, nom: "Un jeune client", place: comptoir_2}
      - {id: buraliste, qui: commercant, nom: "La buraliste", place: patron}
    repliques:
      - {qui: jeune, dit: "Vous prenez encore les pièces ? Ma grand-mère m'a donné un bocal d'écus pour mon anniversaire."}
      - {qui: buraliste, dit: "Je suis la dernière de la rue à les prendre. La banque les recompte en soupirant."}
      - {qui: jeune, dit: "Pourquoi vous les prenez, alors ?"}
      - {qui: buraliste, dit: "C'est les vieux qui paient en pièces. Si je les refuse, ils passent plus, et je sais plus qui est malade."}

  - id: vie.cv.tabac_stade.carrefour
    lieu: tabac_stade
    tranches: [midi]
    qui:
      - {id: agent, qui: passant, nom: "Un agent de la circulation", place: comptoir_2}
      - {id: buraliste, qui: commercant, nom: "La buraliste", place: patron}
    repliques:
      - {qui: agent, dit: "Vous me gardez mon képi le temps du match ? Je fais le carrefour en civil, ça calme les cars."}
      - {qui: buraliste, dit: "En civil, avec une écharpe ?"}
      - {qui: agent, dit: "Avec l'écharpe. Les supporters des deux camps s'arrêtent pour me demander le score. Ça ralentit mieux qu'un sifflet."}
      - {qui: buraliste, dit: "Et si quelqu'un vous demande pour qui vous êtes ?"}
      - {qui: agent, dit: "« Pour le carrefour. » Personne a jamais rien eu contre le carrefour."}

  # ════════════════════════════════════════════════ BRUNEL, TAILLEUR ET CHAUSSEUR
  # matin, après-midi, du mardi au samedi ; le tailleur (un homme) à sa place

  - id: vie.cv.tailleur.deux_fiches
    roles: [president]
    lieu: tailleur
    tranches: [matin, aprem]
    qui:
      - {id: apprenti, qui: passant, nom: "L'apprenti tailleur", place: client_1}
      - {id: tailleur, qui: commercant, nom: "Le tailleur", place: tailleur}
    repliques:
      - {qui: apprenti, dit: "{pg, select, f{La présidente veut} other{Le président veut}} le même costume que l'an dernier. Je reprends les mesures de la fiche ?"}
      - {qui: tailleur, dit: "Jamais. Les présidents changent de taille avec les résultats. Ça creuse, ou ça gonfle."}
      - {qui: apprenti, dit: "Et l'an dernier, ça avait creusé ou gonflé ?"}
      - {qui: tailleur, dit: "Les deux. La veste a creusé, le pantalon a gonflé. J'ai deux fiches, et je les montre à personne."}

  - id: vie.cv.tailleur.la_doublure_bordeaux
    si: "annee >= 2003 && annee < 2040"
    lieu: tailleur
    tranches: [matin, aprem]
    qui:
      - {id: tailleur, qui: commercant, nom: "Le tailleur", place: tailleur}
      - {id: apprenti, qui: passant, nom: "L'apprenti tailleur", place: client_1}
    repliques:
      - {qui: tailleur, dit: "Ils veulent le logo du sponsor brodé sur les costumes du club. Sur la poche du cœur."}
      - {qui: apprenti, dit: "Votre grand-père en aurait pensé quoi ?"}
      - {qui: tailleur, dit: "Il avait cousu le costume du président de 1962. Doublure bordeaux, cachée : le club sur le cœur, et personne le voyait."}
      - {qui: apprenti, dit: "Et on fait quoi ?"}
      - {qui: tailleur, dit: "Le logo sur la poche, et la doublure bordeaux dessous. Ils verront que le logo."}

  - id: vie.cv.tailleur.quatorze_mesures
    si: "annee >= 2035"
    lieu: tailleur
    tranches: [matin, aprem]
    qui:
      - {id: cliente, qui: passante, nom: "Une cliente", place: client_1}
      - {id: tailleur, qui: commercant, nom: "Le tailleur", place: tailleur}
    repliques:
      - {qui: cliente, dit: "On m'a dit que vous preniez encore les mesures au ruban. Ma fille se marie, et elle a refusé la cabine à scanner."}
      - {qui: tailleur, dit: "La cabine prend trois cents mesures en dix secondes. Moi, j'en prends quatorze, en une heure."}
      - {qui: cliente, dit: "Et vous êtes plus juste ?"}
      - {qui: tailleur, dit: "Non. Mais pendant l'heure, elle me racontera pourquoi elle se marie. Et ça, je le couds dans la doublure."}

  - id: vie.cv.tailleur.trois_essayages
    lieu: tailleur
    tranches: [matin, aprem]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux client", place: client_1}
      - {id: tailleur, qui: commercant, nom: "Le tailleur", place: tailleur}
    repliques:
      - {qui: vieux, dit: "Un costume bordeaux, avec un fil gris dans la trame. Pour mon enterrement."}
      - {qui: tailleur, dit: "Vous êtes malade, monsieur Fabrègue ?"}
      - {qui: vieux, dit: "En pleine forme. Mais Fernand, ils l'ont enterré en gris, comme un notaire. Lui qui avait cinquante ans de Nord."}
      - {qui: tailleur, dit: "Trois essayages, alors."}
      - {qui: vieux, dit: "Prenez votre temps. Faites-en quatre."}

  # ════════════════════════════════════════════════ LE TERMINUS (le bar des chauffeurs)
  # du matin au soir ; le patron (un homme) au comptoir, les chauffeurs debout

  - id: vie.cv.terminus.le_vieux_car
    si: "annee >= 2003 && annee < 2030"
    lieu: terminus
    tranches: [matin, midi, aprem]
    qui:
      - {id: chauffeur, qui: commercant2, nom: "Un chauffeur de car", place: comptoir_1}
      - {id: vieux, qui: ancien, nom: "Un vieux chauffeur", place: comptoir_2}
      - {id: patron, qui: commercant, nom: "Le patron", place: patron}
    repliques:
      - {qui: chauffeur, dit: "Le Racing annule le car des supporters pour Portclair. Plus d'argent pour les déplacements, cette année."}
      - {qui: vieux, dit: "En 1985, le club en avait pas non plus. On les emmenait quand même, et on se faisait payer en saucisson."}
      - {qui: chauffeur, dit: "La compagnie prend pas le saucisson."}
      - {qui: patron, dit: "La compagnie, non. Mais y a un car au fond de ma cour. Il roule plus depuis 1998."}
      - {qui: vieux, dit: "Il roule. Faut juste lui demander."}

  - id: vie.cv.terminus.bonne_journee_en_trois_langues
    si: "annee >= 2040"
    lieu: terminus
    tranches: [matin, midi]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux chauffeur", place: comptoir_2}
      - {id: chauffeur, qui: commercant2, nom: "Un chauffeur de car", place: comptoir_1}
      - {id: patron, qui: commercant, nom: "Le patron", place: patron}
    repliques:
      - {qui: vieux, dit: "La ligne de Valdorne roule sans chauffeur depuis lundi. Le car s'arrête tout seul, il ouvre ses portes tout seul."}
      - {qui: chauffeur, dit: "Et il dit bonjour ?"}
      - {qui: vieux, dit: "Il dit « bonne journée » en trois langues. Personne lui répond."}
      - {qui: patron, dit: "Alors pourquoi j'ai servi onze cafés de plus, ce matin ?"}
      - {qui: chauffeur, dit: "Ils descendent chez toi pour parler à quelqu'un. Et ils reprennent le suivant."}

  - id: vie.cv.terminus.devant_la_grille
    si: "jour == sam"
    lieu: terminus
    tranches: [soir]
    qui:
      - {id: patron, qui: commercant, nom: "Le patron", place: patron}
      - {id: client, qui: passant, nom: "Un client", place: comptoir_1}
    repliques:
      - {qui: patron, dit: "Comme d'habitude ?"}
      - {qui: client, dit: "Comme d'habitude."}
      - {qui: patron, dit: "Ils ont joué comment ?"}
      - {qui: client, dit: "J'en sais rien. Je reste devant la grille, j'écoute, et je viens ici avant que les autres sortent."}
      - {qui: patron, dit: "Dix ans d'interdiction de stade, ça finit quand ?"}
      - {qui: client, dit: "En mai. Je sais pas si j'oserai rentrer."}

  - id: vie.cv.terminus.la_ligne_de_nuit
    lieu: terminus
    tranches: [matin]
    qui:
      - {id: chauffeur, qui: commercant2, nom: "Un chauffeur de car", place: comptoir_1}
      - {id: vieux, qui: ancien, nom: "Un vieux chauffeur", place: comptoir_2}
      - {id: patron, qui: commercant, nom: "Le patron", place: patron}
    repliques:
      - {qui: chauffeur, dit: "La ligne de nuit, encore."}
      - {qui: vieux, dit: "Combien ?"}
      - {qui: chauffeur, dit: "Onze. Neuf qui dorment, un qui pleure, et un qui parle tout seul contre la vitre."}
      - {qui: vieux, dit: "Celui de la vitre, laisse-le parler. Il te tiendra éveillé jusqu'à Valdorne."}
      - {qui: patron, dit: "C'est lui, celui de la vitre. Depuis qu'il est à la retraite, il prend ta ligne le mardi, pour que tu t'endormes pas."}

  # ════════════════════════════════════════════════ L'ARRIÈRE-SALLE DU TERMINUS
  # le soir, la nuit ; le donneur (en noir) à la table, les joueurs autour

  - id: vie.cv.tripot.trois_contre_un_contre
    si: "annee < 2002 && role != president"
    lieu: tripot
    tranches: [soir, nuit]
    qui:
      - {id: joueur, qui: passant, nom: "Un joueur", place: joueur_1}
      - {id: donneur, qui: portier, nom: "Le donneur", place: donneur}
    repliques:
      - {qui: joueur, dit: "Je mise ma prime de match. Deux mille francs. Elle tombe lundi."}
      - {qui: donneur, dit: "On mise ce qu'il y a sous le cendrier. Ta prime, tu la miseras lundi."}
      - {qui: joueur, dit: "Elle tombera. Le président l'a promise devant tout le vestiaire."}
      - {qui: donneur, dit: "Les promesses du président, on les prend aussi. À trois contre un. Contre."}

  - id: vie.cv.tripot.celui_du_mur
    lieu: tripot
    tranches: [nuit]
    qui:
      - {id: donneur, qui: portier, nom: "Le donneur", place: donneur}
      - {id: vieux, qui: ancien, nom: "Un vieux joueur", place: joueur_2}
    repliques:
      - {qui: donneur, dit: "Celui contre le mur. Il vient tous les samedis, il joue jamais, il boit rien."}
      - {qui: vieux, dit: "C'est mon fils. Il attend que je perde."}
      - {qui: donneur, dit: "Pour quoi faire ?"}
      - {qui: vieux, dit: "Pour me ramener avant que je joue la maison. Il a les clés de la voiture, et les papiers de la maison dans sa poche."}

  - id: vie.cv.tripot.la_moitie_de_la_maison
    lieu: tripot
    tranches: [soir, nuit]
    qui:
      - {id: donneur, qui: portier, nom: "Le donneur", place: donneur}
      - {id: dame, qui: passante, nom: "Une dame", place: joueur_3}
    repliques:
      - {qui: donneur, dit: "Madame, la table est réservée. Les nuits de match, on joue gros."}
      - {qui: dame, dit: "On m'a prévenue. Mon mari a joué ici trente ans. Il a perdu la caravane, le bateau et la moitié de la maison."}
      - {qui: donneur, dit: "Et vous venez reprendre quoi ?"}
      - {qui: dame, dit: "La moitié de la maison. Distribuez."}

  # ════════════════════════════════════════════════ LE WAGON (au bout de la voie de l'usine)
  # toujours ouvert ; une voix sur le matelas, l'autre debout à côté (les trois places du wagon sont au même endroit)

  - id: vie.cv.wagon.la_porte_du_wagon
    si: "annee < 1999"
    lieu: wagon
    tranches: [matin, aprem]
    qui:
      - {id: gamin, qui: enfant, nom: "Un gamin", place: [-2, -2]}
      - {id: cheminot, qui: ancien, nom: "Un vieux cheminot", place: occupant}
    repliques:
      - {qui: gamin, dit: "C'est vrai qu'il a roulé, ce wagon ? Il a même plus de roues d'un côté."}
      - {qui: cheminot, dit: "Vingt ans de fil de fer jusqu'au port de Portclair, deux fois par semaine. C'est moi qui fermais la porte."}
      - {qui: gamin, dit: "Et maintenant, qui la ferme ?"}
      - {qui: cheminot, dit: "Plus personne. Je viens voir si le matelas est sec. Y a quelqu'un qui dort là, et les questions, il en a pas besoin."}

  - id: vie.cv.wagon.quel_mars
    si: "annee >= 1999 && annee < 2024"
    lieu: wagon
    tranches: [matin, aprem, soir]
    qui:
      - {id: employe, qui: garagiste, nom: "Un employé de la voie", place: [-2, -2]}
      - {id: homme, qui: ancien, nom: "L'homme du matelas", place: occupant}
    repliques:
      - {qui: employe, dit: "Le wagon part à la ferraille en mars. J'ai le papier, avec le tampon."}
      - {qui: homme, dit: "En mars, il fait encore froid."}
      - {qui: employe, dit: "Le tampon dit pas quel mars."}
      - {qui: homme, dit: "Je vous garderai un café chaud. Vous repasserez en mars, l'année que vous voudrez."}

  - id: vie.cv.wagon.le_gymnase
    si: "annee >= 2024"
    lieu: wagon
    tranches: [soir, nuit]
    qui:
      - {id: assistante, qui: commercant, nom: "L'assistante sociale", place: [-2, -2]}
      - {id: femme, qui: passante, nom: "Une femme", place: occupant}
    repliques:
      - {qui: assistante, dit: "Il y a des places au gymnase, depuis la crue. Des lits de camp, de la soupe, du chauffage."}
      - {qui: femme, dit: "Au gymnase, on éteint à vingt-deux heures et on vous compte le matin."}
      - {qui: assistante, dit: "Ici, personne ne vous compte."}
      - {qui: femme, dit: "Justement. Et d'ici, le samedi soir, on entend la Rive chanter. Mon fils s'endort avec ça."}

  - id: vie.cv.wagon.vingt_trois_heures_dix
    lieu: wagon
    tranches: [soir, nuit]
    qui:
      - {id: fille, qui: passante, nom: "Une jeune fille", place: occupant}
      - {id: garcon, qui: passant, nom: "Un jeune homme", place: [-2, -2]}
    repliques:
      - {qui: fille, dit: "Le car de nuit pour la Capitale part à vingt-trois heures dix. On a assez pour deux billets."}
      - {qui: garcon, dit: "Samedi, je joue avec les grands. Mon premier match titulaire."}
      - {qui: fille, dit: "Alors on part dimanche ?"}
      - {qui: garcon, dit: "Dimanche, s'ils me gardent, je voudrai plus partir. Et toi, tu partiras quand même, hein ?"}
