# LA VIE D'AUBÉRIVE — ce qui arrive en ville quand le livre se tait, et ce qu'on entend dehors.
#
# « Les phases sans histoires sont trop vides, il ne se passe pas grand-chose dans la ville ;
# dans Punch Club il y a plein de choses à faire partout. » (le porteur du projet)
#
# Ici, la ville vit pour elle-même : une noce sous la pluie, une panne à L'Aurore, un
# enterrement que la moitié d'Aubérive suit, le marché qui maigrit d'une décennie à l'autre.
# Le format : docs/histoires/scenes_jouees.md ; la charte d'écriture fait loi.
#
# - `cinematiques` (`quand: semaine`) : un jour sans carte, le plan du jour les tire comme les
#   scènes de la semaine, à leur lieu et à leur heure (un lieu qui a ses heures les borne).
#   Une fois par carrière. Elles montrent, elles ne décident rien. Les époques, par `si` :
#   avant 1998 (livres 1 à 4), 1998-2009 (5, 6), 2010-2022 (7), 2023-2034 (8, 9), 2035 et
#   après (10) ; les autres tiennent de 1990 à 2050. Les visages sont anonymes : aucun
#   personnage d'un livre n'y paraît. Cinq ont leur temps (`meteo:`, dehors seulement) : la
#   pluie sur la noce et sur la cabine, la brume sur l'enterrement et les trois étals, la neige
#   sur le pare-brise.
# - `conversations` : aux douze lieux sans pièce, ce que la ville dit d'elle-même et du héros,
#   jamais au héros. Dehors, la ville pose les voix aux places devant le lieu, dans l'ordre, et
#   cherche un corps par `qui` : chaque voix a donc son propre `qui` (deux voix du même `qui`
#   prendraient le même corps). Au marché et au kiosque, la première voix est le commerçant que
#   la ville y poste déjà ; au terrain annexe, le matin et l'après-midi, la première place est
#   celle de l'adjoint (livres 1 à 6) : les conversations y parlent le soir, ou après 2008.
#
# Dehors, `[dx, dy]` est un décalage en cases depuis la porte du lieu : +dx descend vers la
# droite de l'écran, +dy vers la gauche ; le héros est au centre de l'image.
cinematiques:

  # ═══════════════════════════════════════════════ avant 1998 (les livres 1 à 4)

  - id: vie.ci.noce
    quand: semaine
    si: "annee < 1998"
    tranches: [aprem]
    meteo: pluie
    titre: "La noce"
    sous: "Saint-Aubin, sous la pluie"
    lieu: monument
    acteurs:
      - {qui: toi, place: [-2, 1]}
      - {id: photographe, qui: commercant2, nom: "Le photographe", place: [-3, -1]}
      - {id: mariee, qui: passante, nom: "La mariée", place: [-7, -5]}
      - {id: marie, qui: passant, nom: "Le marié", place: [-6, -5]}
      - {id: pere, qui: ancien, nom: "Le père de la mariée", place: [-8, -3]}
    etapes:
      - {narration: "Saint-Aubin sonne pour une noce. La pluie est arrivée pendant le oui : sur le parvis, quarante parapluies s'ouvrent ensemble, et le riz colle aux pavés."}
      - {qui: photographe, va: [-4, -2]}
      - {qui: photographe, dit: "Les mariés seuls. Ensuite la famille de la mariée, ensuite celle du marié. Pas tout le monde ensemble : on me l'a demandé deux fois.", geste: pointe}
      - {qui: marie, regarde: pere}
      - {qui: marie, dit: "Et votre écharpe ? Vous m'aviez juré de ne pas la sortir."}
      - {qui: pere, dit: "Elle est dans ma poche. Elle a vu mes deux autres filles se marier, elle peut bien attendre le vin d'honneur.", ton: sourire}
      - {qui: mariee, emote: "..."}
      - {qui: mariee, dit: "Papa. Il pleut sur ma robe, et tu négocies."}
      - {qui: pere, va: [-7, -4]}
      - {narration: "Le père sort une écharpe bordeaux, délavée aux plis, et la passe au cou du marié. Le photographe recule d'un pas pour les avoir tous les trois."}
      - {flash: blanc}
      - {qui: marie, dit: "Chez moi, on est de la tribune d'en face depuis trois générations."}
      - {qui: pere, dit: "Chez toi, oui. Ici, tu es chez nous."}
      - {narration: "Le marié garde l'écharpe jusqu'à la voiture. Sous la pluie, le bordeaux déteint un peu sur le col blanc de sa chemise."}

  - id: vie.ci.populaire
    quand: semaine
    si: "annee < 1997"
    tranches: [matin, aprem]
    titre: "Debout depuis 1931"
    sous: "Place de la fontaine, {annee}"
    lieu: fontaine
    acteurs:
      - {qui: toi, place: [-5, -8]}
      - {id: vieux, qui: ancien, nom: "Un vieil abonné", place: [-3, -7], pose: assis}
      - {id: gars, qui: fan, nom: "Un gars du virage", place: [-11, -9]}
      - {id: employe, qui: passant, nom: "L'employé municipal", place: [-1, -9]}
    etapes:
      - {narration: "Contre la margelle de la fontaine, une table pliante, une pétition, un stylo attaché par une ficelle. Une banderole roulée sèche sur une chaise : DEBOUT DEPUIS 1931."}
      - {qui: vieux, dit: "Cet été, ils vissent des sièges dans la populaire. Des coques en plastique, numérotées. Quarante ans que je regarde les matchs debout, moi.", ton: noir}
      - {qui: gars, va: [-7, -9]}
      - {qui: gars, dit: "Trois cents signatures depuis ce matin. Il en manque une qui compte.", geste: pointe}
      - {qui: toi, pense: "Une signature, sur cette table, ça ne se lit pas comme un nom. Ça se lit comme une tribune."}
      - {qui: employe, va: [-4, -9]}
      - {qui: employe, dit: "La table, il faut une autorisation. On n'occupe pas la place comme ça."}
      - {qui: vieux, regarde: employe}
      - {qui: vieux, dit: "Je me tiens debout dans la populaire depuis 1952. Personne ne m'a jamais demandé d'autorisation."}
      - {qui: employe, emote: "..."}
      - {qui: employe, dit: "Je repasse dans une heure. Dans une heure, je n'aurai rien vu."}
      - {qui: employe, va: [1, -10]}
      - {narration: "Le vent rabat l'eau de la fontaine sur la table. Le vieux sèche la feuille avec sa casquette, signature par signature, sans en sauter une."}

  - id: vie.ci.vignettes
    quand: semaine
    si: "annee < 2000"
    tranches: [matin, midi]
    titre: "Le carré vide"
    sous: "Le kiosque du quai"
    lieu: kiosque
    acteurs:
      - {qui: toi, place: [2, 5]}
      - {id: kiosquier, qui: commercant2, nom: "Le kiosquier", place: [2, 2]}
      - {id: gamin, qui: enfant, nom: "Le gamin à l'album", place: [0, 3]}
      - {id: copain, qui: enfant, nom: "Son copain", place: [-1, 4]}
    etapes:
      - {narration: "Devant le kiosque du quai, deux gamins à genoux sur le trottoir, un album de vignettes ouvert entre eux. La page du Racing est pleine, sauf un carré, en haut à gauche."}
      - {qui: gamin, dit: "Le gardien. Il me manque que le gardien. Le numéro neuf, je l'ai trois fois."}
      - {qui: copain, dit: "Tes trois neuf contre ton gardien, si je l'avais. Je l'ai pas."}
      - {qui: kiosquier, dit: "Les paquets de la semaine sont arrivés. Et vous ne les ouvrez pas devant la vitrine : les emballages, c'est moi qui les ramasse."}
      - {qui: gamin, va: [1, 3]}
      - {narration: "Il compte ses pièces dans le creux de sa main, en remue une, recompte. Le kiosquier fait semblant de ranger les journaux."}
      - {qui: gamin, emote: "..."}
      - {qui: gamin, dit: "Le neuf. Encore le neuf."}
      - {qui: kiosquier, dit: "Le gardien, ils en ont imprimé moins. Il paraît. Personne ne sait pourquoi.", ton: sourire}
      - {qui: copain, dit: "Quatre neuf. Avec lui tout seul, tu fais une équipe."}
      - {qui: gamin, geste: ecrit}
      - {narration: "Le gamin sort un stylo-bille et dessine un gardien dans le carré vide : deux bras levés, un ballon trop gros. Il signe en dessous, pour qu'on sache que c'est un vrai."}

  - id: vie.ci.cabine
    quand: semaine
    si: "annee < 1998"
    tranches: [soir]
    meteo: pluie
    titre: "La cabine"
    sous: "Square des Lilas, le soir"
    lieu: square
    acteurs:
      - {qui: toi, place: [-1, 3]}
      - {id: fille, qui: passante, nom: "Une jeune fille", place: [-6, 1]}
      - {id: homme, qui: passant, nom: "Un homme pressé", place: [-5, 2]}
      - {id: vieux, qui: ancien, nom: "Un vieux du quartier", place: [-4, 3]}
    etapes:
      - {narration: "Une file sous la pluie devant la cabine du square, chacun sa carte de téléphone à la main. Dans la cabine, une jeune fille lit L'Écho au téléphone, la page des sports."}
      - {qui: fille, geste: telephone}
      - {qui: fille, dit: "« À la vingtième minute, une frappe lointaine frôle le poteau. » Oui, papa, je lis tout. Même les notes."}
      - {qui: homme, dit: "Elle en est à la vingtième minute depuis un quart d'heure. On sera encore là pour le match retour.", emote: sueur}
      - {qui: vieux, dit: "Son père est à l'hôpital, au troisième. Elle lui lit L'Écho tous les soirs, en entier. Il ne s'endort pas sans."}
      - {qui: homme, regarde: fille}
      - {narration: "Dans la cabine, la voix s'arrête net. Plus une unité sur la carte ; la jeune fille regarde le combiné comme une porte qu'on lui a fermée au nez."}
      - {qui: homme, va: [-5, 1]}
      - {qui: homme, dit: "Tenez. Il en reste quarante sur la mienne. Finissez le match."}
      - {qui: fille, dit: "« Quatre-vingt-sixième minute… » Papa ? Oui. Un monsieur nous prête des unités.", ton: sourire}
      - {narration: "Elle raccroche au coup de sifflet final. L'homme pressé prend le combiné, compose son numéro, et reste un moment le combiné contre l'oreille avant de parler."}

  - id: vie.ci.poissonnier
    quand: semaine
    si: "annee < 2012"
    tranches: [matin]
    jours: [mer, sam, dim]
    titre: "Le papillon"
    sous: "Place du marché"
    lieu: marche
    acteurs:
      - {qui: toi, place: [1, -2]}
      - {id: poissonnier, qui: commercant2, nom: "Le poissonnier", place: [-3, -2]}
      - {id: adjoint, qui: passant, nom: "L'adjoint au maire", place: [5, -2]}
      - {id: cliente, qui: passante, nom: "Une cliente", place: [-5, -1]}
    etapes:
      - {narration: "La camionnette du poissonnier est garée à cheval sur le trottoir, comme chaque semaine depuis vingt ans. Sous l'essuie-glace, un papillon de la police municipale."}
      - {qui: poissonnier, dit: "Vingt ans que je me gare là. Vingt ans que la municipale m'achète ses soles. Ce matin, elle a retrouvé son carnet.", geste: pointe}
      - {qui: adjoint, va: [-1, -2]}
      - {qui: adjoint, dit: "Deux soles, comme d'habitude. Et ne me regardez pas comme ça : je ne fais pas les contraventions."}
      - {qui: poissonnier, dit: "Non. Vous faites les arrêtés. Celui du stationnement, c'est votre signature en bas."}
      - {qui: cliente, dit: "Il a signé celui des terrasses aussi. Mon mari a perdu deux tables, au café."}
      - {qui: adjoint, emote: sueur}
      - {qui: adjoint, dit: "Je verrai ce que je peux faire. Je ne promets rien."}
      - {narration: "Le poissonnier emballe les soles dans une page de L'Écho. Avant de refermer le papier, il glisse le papillon entre les deux poissons."}
      - {qui: poissonnier, dit: "Vous verrez à midi, en les ouvrant.", ton: sourire}
      - {qui: adjoint, va: [7, -3]}
      - {narration: "L'adjoint traverse la place, le paquet sous le bras. La cliente le regarde partir en comptant sa monnaie, et elle prend des soles, elle aussi."}

  - id: vie.ci.circuit
    quand: semaine
    si: "annee < 2012 && phase == presaison"
    tranches: [midi]
    titre: "Le Circuit de la Rive"
    sous: "Le quai, à midi"
    lieu: kiosque
    acteurs:
      - {qui: toi, place: [2, 5]}
      - {id: vieux, qui: ancien, nom: "Un vieux au chronomètre", place: [-2, 3]}
      - {id: gamin, qui: enfant, nom: "Un gamin", place: [0, 4]}
    etapes:
      - {narration: "Des barrières, des fanions en papier, tout le quartier sur le trottoir du quai. Le Circuit de la Rive repasse par Aubérive cette année ; la dernière fois, c'était en 1968."}
      - {qui: vieux, dit: "En soixante-huit, ils avaient mis dix-huit secondes à passer devant le kiosque. J'avais compté. J'ai gardé le chronomètre.", geste: lit}
      - {qui: gamin, dit: "Ils arrivent quand ?"}
      - {qui: vieux, dit: "Après la caravane. D'abord on te jette des casquettes, ensuite on te montre le sport."}
      - {narration: "La caravane passe : des voitures déguisées en bouteille, en fromage, en pneu géant, et des casquettes en carton qui volent par les vitres."}
      - {qui: gamin, va: [3, 7]}
      - {qui: gamin, emote: "!"}
      - {narration: "Puis un bruit de vent, de pneus et de chaînes. Le peloton passe d'une seule coulée de couleurs, et le quai se tait derrière lui."}
      - {pause: 900}
      - {qui: vieux, dit: "Onze secondes. Ils vont plus vite qu'avant, et on les voit moins.", geste: tete_basse}
      - {qui: gamin, va: [-1, 4]}
      - {qui: gamin, dit: "J'ai eu une casquette. Elle est trop grande."}
      - {narration: "Le vieux la lui règle avec une pince à linge sortie de sa poche. On replie déjà les barrières ; il n'est passé que du vent, et tout le quai a l'air content."}

  - id: vie.ci.greve
    quand: semaine
    si: "annee < 2000"
    tranches: [matin]
    tranche: matin
    titre: "Grève"
    sous: "Gare routière, six heures et demie"
    lieu: gareRoutiere
    acteurs:
      - {qui: toi, place: banc_3}
      - {id: guichetiere, qui: commercant, nom: "La guichetière", place: guichetier}
      - {id: delegue, qui: passant, nom: "Le délégué des chauffeurs", place: banc_1}
      - {id: infirmiere, qui: passante, nom: "Une infirmière", place: quai, cache: true}
    etapes:
      - {narration: "Sur le tableau des départs, quelqu'un a écrit à la craie, en travers de tous les horaires : GRÈVE. Les cars dorment au bout du quai, moteurs froids."}
      - {qui: infirmiere, entre: quai}
      - {qui: infirmiere, dit: "Je prends mon service à sept heures, à l'hôpital de la vallée. Il y a quelque chose qui roule ? N'importe quoi."}
      - {qui: guichetiere, dit: "Rien ne roule avant ce soir. Je vends les billets, je ne conduis pas.", geste: tete_basse}
      - {qui: delegue, dit: "Trois mois qu'on roule sans contrôleur. La nuit, c'est nous qui ramassons ceux qui ne paient pas, et ceux qui cognent.", ton: noir}
      - {qui: infirmiere, regarde: delegue}
      - {qui: infirmiere, dit: "Et mes malades, ils ramassent qui ?"}
      - {qui: delegue, emote: "..."}
      - {qui: delegue, va: centre}
      - {qui: delegue, dit: "Ma voiture est derrière le dépôt. La grève, c'est le car. Pas moi."}
      - {qui: delegue, sort: true}
      - {qui: infirmiere, sort: true}
      - {narration: "Sur le banc, le délégué a oublié son thermos. La guichetière le range sous son comptoir, à côté du sien, pour quand il reviendra."}

  - id: vie.ci.panne
    quand: semaine
    si: "annee < 2010"
    tranches: [soir]
    titre: "La panne"
    sous: "L'Aurore, séance de vingt et une heures"
    lieu: cinema
    acteurs:
      - {qui: toi, place: porte}
      - {id: caissiere, qui: commercant, nom: "La caissière", place: caissiere}
      - {id: projectionniste, qui: passant, nom: "Le projectionniste", place: visiteur}
      - {id: petit, qui: enfant, nom: "Un petit garçon", place: client_1}
      - {id: vieux, qui: ancien, nom: "Un vieux spectateur", place: client_2}
    etapes:
      - {narration: "Au milieu du film, l'écran s'éteint, puis la salle, puis la rue entière. Les spectateurs reviennent à tâtons dans le hall, où brûle une seule bougie."}
      - {qui: caissiere, dit: "Restez dans le hall. La marche du fond, dans le noir, elle a déjà cassé deux poignets cette année."}
      - {qui: projectionniste, va: [0, 1]}
      - {qui: projectionniste, dit: "Si le courant revient d'un coup, la bobine fond dans la lanterne. Je préfère attendre dans le noir que brûler la fin du film."}
      - {qui: petit, geste: tremble}
      - {qui: petit, dit: "Et le monsieur du film, il meurt ? À la fin ?"}
      - {qui: vieux, regarde: petit}
      - {qui: vieux, dit: "Je l'ai vu à sa première sortie. Je ne te dirai rien. Mais tu pourras dormir, ce soir.", ton: sourire}
      - {pause: 900}
      - {flash: blanc}
      - {narration: "Le courant revient d'un coup. Ils se voient tous, les yeux plissés, un peu gênés d'avoir été si près les uns des autres dans le noir."}
      - {qui: projectionniste, va: [3, -2]}
      - {narration: "Le projectionniste remonte l'escalier quatre à quatre. Dans la salle, le film reprend, juste avant le baiser."}

  # ═══════════════════════════════════════════════ 1998-2009 (les livres 5 et 6)

  - id: vie.ci.sonnerie
    quand: semaine
    si: "annee >= 1997 && annee < 2002"
    tranches: [matin]
    titre: "La sonnerie"
    sous: "Café de la Mairie, neuf heures"
    lieu: cafe_mairie
    acteurs:
      - {qui: toi, place: table_2}
      - {id: patronne, qui: commercant, nom: "La patronne", place: patron}
      - {id: homme, qui: passant, nom: "L'homme au portable", place: comptoir_1}
      - {id: habitue, qui: ancien, nom: "Un habitué", place: table_1}
    etapes:
      - {narration: "Entre le café crème et le journal, une sonnerie part de nulle part : trois notes aiguës, qui recommencent. Tout le comptoir se retourne."}
      - {qui: homme, geste: telephone}
      - {qui: homme, dit: "Oui ? Oui, je suis au café. Non, je vous entends très bien. C'est eux qui m'entendent.", ton: sourire}
      - {qui: habitue, emote: "?"}
      - {qui: habitue, dit: "C'est le premier, ici. Le notaire en a un, mais il le laisse dans sa voiture, comme un chien."}
      - {qui: patronne, va: comptoir_2}
      - {qui: patronne, dit: "Vos affaires, vous les faites sur le trottoir. Ici, on parle à quelqu'un qu'on voit.", geste: pointe}
      - {qui: homme, sort: true}
      - {narration: "Par la vitre, on le voit marcher de long en large, une main sur l'autre oreille, parler très fort à quelqu'un qui n'est pas là. Le comptoir le regarde comme un aquarium."}
      - {qui: habitue, dit: "Il appelle qui, à neuf heures du matin, pour parler aussi fort ?"}
      - {qui: patronne, dit: "Quelqu'un qui n'est pas là. C'est tout l'intérêt, il paraît."}
      - {narration: "La patronne prend la craie et écrit sous le plat du jour, en petites lettres : LES TÉLÉPHONES, DEHORS. Personne ne l'effacera jamais."}

  - id: vie.ci.colleurs
    quand: semaine
    si: "annee >= 1998 && annee < 2012 && phase == retour"
    tranches: [nuit]
    tranche: nuit
    titre: "Les colleurs"
    sous: "Place du marché, deux heures du matin"
    lieu: marche
    acteurs:
      - {qui: toi, place: [1, -2]}
      - {id: sortant, qui: passant, nom: "Un colleur de la majorité", place: [4, -3]}
      - {id: opposant, qui: inconnu, nom: "Un colleur de l'opposition", place: [9, -1]}
    etapes:
      - {narration: "Les panneaux électoraux numérotés de un à six, un seau de colle qui fume dans le froid. Deux hommes arrivent ensemble devant le panneau trois, chacun son rouleau d'affiches."}
      - {qui: opposant, va: [5, -4]}
      - {qui: sortant, dit: "Le trois, c'est le nôtre depuis lundi. Vous avez le quatre."}
      - {qui: opposant, dit: "Le quatre est trempé. Votre seau a fui dessus toute la semaine."}
      - {qui: sortant, regarde: opposant}
      - {qui: sortant, dit: "Alors tu ne viens pas manger dimanche. Ta sœur a fait une blanquette."}
      - {qui: opposant, emote: "..."}
      - {qui: opposant, dit: "Je viendrai. Mais je colle d'abord.", ton: sourire}
      - {narration: "Ils collent côte à côte, chacun son candidat, avec la même brosse qu'ils se passent d'une main à l'autre. Les deux sourires sèchent ensemble sous le lampadaire."}
      - {qui: opposant, dit: "Lundi, on recolle par-dessus. Comme d'habitude."}
      - {qui: sortant, dit: "Comme d'habitude. Prends le seau, il est à ta sœur."}
      - {qui: opposant, va: [10, 0]}

  - id: vie.ci.lofts
    quand: semaine
    si: "annee >= 2003 && annee < 2008"
    tranches: [aprem]
    titre: "Douze pas"
    sous: "La Tréfilerie, l'appartement témoin"
    lieu: friche
    acteurs:
      - {qui: toi, place: [0, -5]}
      - {id: commerciale, qui: passante, nom: "La commerciale", place: [-1, -8]}
      - {id: acheteur, qui: passant, nom: "Un jeune acheteur", place: [-4, -8]}
      - {id: vieux, qui: ancien, nom: "Un ancien de la Tréfilerie", place: [-6, -4]}
    etapes:
      - {narration: "Une palissade neuve barre la cour de la Tréfilerie : LES LOFTS DE LA RIVE, LIVRAISON AU PRINTEMPS. Une commerciale en tailleur fait visiter le vide à un jeune couple et à un vieil homme."}
      - {qui: commerciale, dit: "Ici, le séjour. Quatre mètres sous plafond, les poutres d'origine. On a gardé l'âme du lieu.", geste: pointe}
      - {qui: acheteur, dit: "Et le bruit ? On dit qu'il y avait une sirène."}
      - {qui: commerciale, dit: "Démontée depuis longtemps. Ici, vous n'entendrez plus que la Rive."}
      - {qui: vieux, va: [-3, -6]}
      - {narration: "Le vieux part du mur du fond et marche en comptant à voix basse. Il s'arrête au milieu du futur séjour."}
      - {qui: vieux, dit: "Douze pas. Ma machine était là. Trente et un ans, de six heures à quatorze heures."}
      - {qui: acheteur, regarde: vieux}
      - {qui: commerciale, dit: "Vous voulez dire que… vous envisagez d'acheter, monsieur ?", emote: sueur}
      - {qui: vieux, dit: "Non, madame. Je venais voir si la place était encore chaude.", ton: noir}
      - {qui: vieux, va: [-7, -3]}
      - {narration: "Il repart par la palissade. Le jeune couple ne regarde plus les poutres. Il regarde le sol, à l'endroit des douze pas, et le contourne comme une tombe."}

  - id: vie.ci.reportage
    quand: semaine
    si: "annee >= 1998 && annee < 2024"
    tranches: [matin, midi]
    titre: "Ces villes qui tiennent"
    sous: "Le kiosque du quai"
    lieu: kiosque
    acteurs:
      - {qui: toi, place: [1, 6]}
      - {id: journaliste, qui: passante, nom: "La journaliste de la capitale", place: [1, 4]}
      - {id: cadreur, qui: passant, nom: "Le cadreur", place: [3, 5]}
      - {id: retraite, qui: ancien, nom: "Un retraité au journal", place: [-2, 3]}
    etapes:
      - {narration: "Une équipe de télévision de la capitale a posé sa caméra devant le kiosque. Sur la portière du camion : « Ces villes qui tiennent », mardi, vingt-deux heures quarante."}
      - {qui: journaliste, dit: "Il nous faudrait quelqu'un qui achète son journal. Naturellement. Comme tous les matins.", geste: pointe}
      - {qui: retraite, dit: "Je l'ai déjà acheté. Je suis en train de le lire."}
      - {qui: journaliste, dit: "Vous pouvez le racheter ? On vous le rembourse. Et cette fois, souriez un peu au kiosquier."}
      - {qui: retraite, va: [1, 2]}
      - {narration: "Il rachète L'Écho, sourit au kiosquier, qui ne comprend pas, et revient à sa place. On lui demande de recommencer en marchant moins vite."}
      - {qui: retraite, va: [-2, 3]}
      - {qui: journaliste, regarde: toi}
      - {qui: journaliste, dit: "Et vous ? Le football, ici, qu'est-ce que ça représente ? Une phrase. Simple."}
      - {qui: toi, pense: "Une phrase simple, pour la capitale. Ils la couperont avant la fin."}
      - {qui: retraite, dit: "Je vais vous la dire, moi. Le samedi, on est quatre mille à regarder la même chose. Le reste de la semaine, on est quatre mille à regarder ailleurs."}
      - {narration: "Le cadreur ne coupe pas tout de suite. Il garde le vieux dans le cadre, ses deux journaux sous le bras, longtemps après que la journaliste est partie chercher une autre ville."}

  # ═══════════════════════════════════════════════ 2010-2022 (le livre 7)

  - id: vie.ci.bobine
    quand: semaine
    si: "annee >= 2010 && annee < 2015"
