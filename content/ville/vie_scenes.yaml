      - {id: livreur, qui: passant, nom: "Le livreur", place: client_1}
    etapes:
      - {narration: "Sur le comptoir de la confiserie, une mallette noire. Dedans, sur de la mousse grise, un disque dur pas plus gros qu'une boîte de pastilles."}
      - {qui: livreur, dit: "Le film de la semaine. Vous branchez, et il se lance tout seul à vingt et une heures. Même le dimanche."}
      - {qui: projectionniste, regarde: livreur}
      - {qui: projectionniste, dit: "Tout seul. Moi, je montais la bobine à vingt heures dix, pour qu'elle ait le temps de se réchauffer."}
      - {qui: caissiere, dit: "La mairie garde la caisse. La cabine, elle ferme en juin.", ton: noir}
      - {qui: livreur, emote: sueur}
      - {qui: livreur, dit: "Moi, je livre. Je ne décide de rien. Une signature, là, en bas."}
      - {qui: projectionniste, geste: ecrit}
      - {narration: "Il signe, puis sort de sa poche un bout de pellicule de la longueur d'une main : six images, le même baiser, à peine différent de l'une à l'autre."}
      - {qui: projectionniste, va: [2, -1]}
      - {qui: projectionniste, dit: "Le dernier qu'on a passé sur la vieille machine. Je le punaise sur l'affiche, et on n'en parle plus."}
      - {narration: "Sous le néon de la vitrine, le baiser de pellicule tremble un peu chaque fois que la porte s'ouvre."}

  - id: vie.ci.tournage
    quand: semaine
    si: "annee >= 2011 && annee < 2023"
    tranches: [aprem]
    titre: "Moteur"
    sous: "Le vieux lavoir, rue Haute"
    lieu: lavoir
    acteurs:
      - {qui: toi, place: [2, 2]}
      - {id: realisatrice, qui: passante, nom: "La réalisatrice", place: [4, 1]}
      - {id: pompier, qui: passant, nom: "Un pompier", place: [6, 2]}
      - {id: vieux, qui: ancien, nom: "Un figurant du quartier", place: [-4, 0]}
    etapes:
      - {narration: "Le lavoir est barré par des projecteurs. Une équipe de la capitale tourne une série policière : un camion de pompiers, une lance, et trente habitants payés en sandwiches pour passer dans le fond."}
      - {qui: realisatrice, dit: "Plus de pluie. Il me faut une ville où il pleut depuis toujours, pas une averse de printemps.", geste: bras_leves}
      - {qui: pompier, dit: "C'est l'eau de la commune, madame. La mairie a dit deux heures. Pas trois."}
      - {qui: vieux, va: [1, 0]}
      - {qui: vieux, dit: "Chez nous, il pleut de côté, à cause du vent de la Rive. Votre pluie tombe tout droit. Personne n'y croira."}
      - {qui: realisatrice, regarde: vieux}
      - {qui: realisatrice, dit: "Vous voulez dire une phrase ? Une seule, en passant. Comme ça.", emote: "?"}
      - {qui: vieux, dit: "Je ne dis pas de phrases. Je passe."}
      - {narration: "On recommence. Le vieux traverse le champ sous la pluie des pompiers, le col relevé, la tête penchée du côté d'un vent qui n'existe pas."}
      - {qui: pompier, geste: rit}
      - {qui: realisatrice, dit: "Coupez. On garde celle-là."}
      - {narration: "Le soir, le vieux rentre trempé, un sandwich dans chaque poche. Il prévient tout le monde qu'il sera sûrement coupé au montage, au cas où."}

  - id: vie.ci.carre
    quand: semaine
    si: "annee >= 2012 && annee < 2025"
