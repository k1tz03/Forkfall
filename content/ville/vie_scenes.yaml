    etapes:
      - {narration: "Sur le trottoir, devant l'immeuble, douze cartons ouverts : des programmes de match, des billets, des fanions. Soixante ans de Racing rangés par saison, à vendre au poids."}
      - {qui: petitfils, dit: "Mon grand-père est mort en mars. L'appartement doit être vide pour le premier. Prenez ce que vous voulez, c'est un écu le carton."}
      - {qui: collectionneur, geste: lit}
