      - {qui: petitfils, emote: choc}
      - {qui: voisine, dit: "Il ne le vendait pas, lui. Il le sortait une fois par an, le jour anniversaire du titre, et il le lisait dans l'escalier, pour tout l'immeuble."}
      - {qui: petitfils, regarde: voisine}
      - {qui: petitfils, geste: lit}
      - {narration: "Il ouvre le programme. Dans la marge de la page du milieu, au crayon, une écriture penchée : le score, la minute du but, et « avec papa »."}
      - {qui: petitfils, dit: "Celui-là, il n'est pas dans les cartons. Il est tombé de ma poche."}
      - {narration: "Le collectionneur achète trois cartons sans les regarder. Le programme de soixante-deux remonte l'escalier dans une poche intérieure, contre la poitrine, comme il l'avait toujours descendu."}

  # ═══════════════════════════════════════════════ 2023-2034 (les livres 8 et 9)

  - id: vie.ci.amateurs
