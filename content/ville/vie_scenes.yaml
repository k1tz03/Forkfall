    sous: "Le mur des plaques"
    lieu: columbarium
    acteurs:
      - {qui: toi, place: [0, 2]}
      - {id: adjointe, qui: passante, nom: "L'adjointe au maire", place: [2, 0]}
      - {id: vieux, qui: ancien, nom: "Un vieil abonné", place: [-2, 1]}
      - {id: jeune, qui: fan, nom: "Un jeune du virage", place: [-4, 2]}
    etapes:
      - {narration: "Au mur des plaques, un ruban bordeaux tendu devant vingt-quatre niches neuves. Au-dessus, une écharpe sculptée dans le marbre : le carré des supporters du Racing."}
      - {qui: adjointe, dit: "La Ville a voulu que ceux qui ont tant donné à la Rive puissent encore la regarder. Les niches sont tournées vers le stade."}
      - {qui: jeune, dit: "Vers le parking du stade. Le stade, il est de l'autre côté."}
      - {qui: adjointe, emote: sueur}
      - {qui: vieux, va: [-1, 0]}
      - {qui: vieux, dit: "Je prends la douze. Pas la sept : le sept, c'est celui qui a raté le penalty en quatre-vingt-trois."}
      - {qui: adjointe, dit: "Les réservations se font en mairie, monsieur. Il y a un formulaire."}
      - {narration: "Le vieux sort une craie de sa poche et écrit son nom sur la plaque vierge de la douze, en majuscules."}
      - {qui: jeune, geste: rit}
      - {qui: vieux, dit: "En mairie, ça prend six mois. La craie, c'est tout de suite."}
      - {narration: "L'adjointe coupe le ruban. Les ciseaux accrochent ; c'est le vieux qui tient le bout, pour que ça coupe droit."}

  - id: vie.ci.filles
    quand: semaine
    si: "annee >= 2010 && annee < 2023 && jour == mer"
    tranches: [aprem]
    titre: "Les filles du mercredi"
    sous: "Terrain annexe"
    lieu: terrain
    acteurs:
      - {qui: toi, place: [4, 4]}
      - {id: educatrice, qui: passante, nom: "L'éducatrice", place: [3, 6]}
      - {id: pere, qui: passant, nom: "Un père derrière la haie", place: [7, 3]}
      - {id: huit, qui: enfant, nom: "La numéro huit", place: [1, 9]}
    etapes:
      - {narration: "Le Racing a une équipe de filles, la première : quatorze gamines, des chasubles qui leur tombent aux genoux, et une éducatrice qui siffle avec deux doigts."}
      - {qui: pere, dit: "Elles courent toutes après le ballon en même temps. Comme des moineaux.", ton: sourire}
      - {qui: educatrice, regarde: pere}
      - {qui: educatrice, dit: "Comme les garçons de cet âge. La différence, c'est qu'on ne vient pas se moquer d'eux derrière une haie."}
      - {qui: pere, emote: sueur}
      - {qui: huit, va: [2, 8]}
      - {qui: huit, geste: frappe}
