      - {qui: vieux, dit: "Vous avez mis le gardien de soixante-quatorze. Très bien. Mais pas le capitaine ? Le capitaine a soulevé la coupe."}
      - {qui: peintre, dit: "Je peins ceux qu'on me raconte. On ne m'a jamais raconté le capitaine. Le gardien, on me l'a raconté quarante fois.", geste: pointe}
      - {qui: abonne, va: [-5, -7]}
      - {qui: abonne, dit: "Et celui-là, en casquette, au premier rang ? Il a joué quand ?"}
      - {qui: peintre, emote: "..."}
      - {qui: peintre, dit: "Jamais. C'est mon grand-père. Il a vu tous les matchs de la Rive, de 1951 à sa mort. Il n'a jamais rien soulevé."}
      - {qui: vieux, regarde: peintre}
      - {qui: vieux, dit: "Alors il est à sa place. Plus que le capitaine."}
      - {qui: vieux, dit: "Tenez. Pour la couleur. Il avait la même, je m'en souviens.", geste: pointe}
