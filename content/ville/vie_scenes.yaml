      - {qui: gardien, regarde: pere}
      - {qui: gardien, va: [0, 9]}
      - {narration: "Il prend la médaille sans la mettre, traverse le terrain jusqu'au but où il a encaissé, et l'accroche au poteau, à hauteur de ses yeux."}

  - id: vie.ci.bain
    quand: semaine
    roles: [entraineur, joueur, president, ds]
    si: "serie_v >= 2"
    tranches: [nuit]
    tranche: nuit
    titre: "Le bain"
    sous: "La fontaine, après minuit"
    lieu: fontaine
    acteurs:
      - {qui: toi, place: [-7, -8]}
      - {id: chanteur, qui: fan, nom: "Un gars de la Nord, trempé", place: [-4, -7], pose: assis}
      - {id: copain, qui: passant, nom: "Son copain", place: [-2, -7], pose: assis}
      - {id: policier, qui: inconnu, nom: "Le policier de nuit", place: [-1, -9]}
    etapes:
      - {narration: "Le Racing ne perd plus, et la fontaine le sait : deux gars de la Nord sont assis sur la margelle, les jambes dans le bassin, trempés jusqu'à la taille, et chantent le seul couplet que tout le monde connaît."}
      - {qui: policier, va: [-5, -9]}
      - {qui: policier, dit: "Sortez de là. Il y a un arrêté. Et les poissons rouges, c'est la mairie qui les a payés."}
      - {qui: chanteur, dit: "On sort quand on perd. C'est la règle. Tant qu'on gagne, on reste dans l'eau.", geste: bras_leves}
      - {qui: copain, geste: rit}
      - {qui: policier, emote: "..."}
      - {qui: policier, dit: "Et vos écharpes ? Vous allez les noyer."}
      - {qui: copain, dit: "La sienne n'a jamais vu une défaite. Si elle prend l'eau, on est perdus."}
      - {narration: "Ils se regardent. Personne n'avait pensé aux écharpes."}
      - {narration: "Le policier reste au bord de la fontaine jusqu'à une heure, deux écharpes bordeaux sur le bras, bien au sec, en regardant ailleurs."}

  - id: vie.ci.craie
    quand: semaine
    roles: [entraineur, joueur, president, ds]
    si: "serie_d >= 2"
    tranches: [matin]
    titre: "La craie"
    sous: "Les marches du monument"
    lieu: monument
    acteurs:
      - {qui: toi, place: [-2, 0]}
      - {id: vieux, qui: ancien, nom: "Le vieux du monument", place: [-3, -2]}
      - {id: gamine, qui: enfant, nom: "Une gamine au seau", place: [-7, -4]}
    etapes:
      - {narration: "Sur les marches du monument aux morts, à la craie, en lettres d'un mètre : VOUS NOUS FAITES HONTE. L'écriture de quelqu'un qui a pris son temps."}
      - {qui: vieux, geste: genou}
      - {qui: vieux, dit: "Ils ont écrit sur les morts. Les morts n'ont rien demandé à personne, eux."}
      - {qui: gamine, va: [-5, -3]}
      - {qui: gamine, dit: "Ma mère dit que c'est des gars de la Nord. Que ça leur passera samedi, si on gagne."}
      - {qui: vieux, dit: "Et si on perd ?"}
      - {qui: gamine, emote: "?"}
      - {qui: gamine, dit: "Alors ils écriront ailleurs. Sur le stade, peut-être. Ou chez quelqu'un."}
      - {qui: toi, pense: "« Vous. » Ils n'ont écrit aucun nom. Ils savent que chacun lira le sien."}
      - {narration: "Il reste une lettre, à la fin : un E, à moitié effacé, que la pluie finira. La gamine verse le fond du seau dessus, pour aider."}

  - id: vie.ci.nuit_de_gel
    quand: semaine
    si: "phase == hiver"
    tranches: [nuit]
    tranche: nuit
    titre: "Nuit de gel"
    sous: "Le feu de palettes"
    lieu: feu
    acteurs:
      - {qui: toi, place: [3, 0]}
      - {id: doyen, qui: ancien, nom: "Le doyen du feu", place: [-1, 1], pose: assis}
      - {id: jeune, qui: passant, nom: "Un jeune, arrivé en octobre", place: [1, 1], pose: assis}
      - {id: benevole, qui: passante, nom: "Une bénévole de Saint-Aubin", place: [6, 3]}
    etapes:
      - {narration: "La nuit la plus froide de l'hiver. Autour du feu de palettes, deux silhouettes serrées, et sous le pont, le bruit de la Rive qui charrie des glaçons."}
      - {qui: benevole, va: [2, 2]}
      - {qui: benevole, dit: "Soupe de poireaux. Il y en a pour quatre. Je ne reste pas, j'ai encore tout le quai à faire."}
      - {qui: doyen, dit: "On n'a besoin de rien. Donnez-la au petit : il est arrivé en octobre, il ne sait pas encore avoir froid."}
      - {qui: jeune, geste: tremble}
      - {qui: jeune, dit: "Je sais très bien avoir froid."}
      - {qui: benevole, regarde: doyen}
      - {qui: benevole, dit: "Je laisse le thermos. Vous me le rendrez demain soir, plein ou vide.", ton: sourire}
      - {qui: benevole, va: [7, 4]}
      - {narration: "Le vieux boit le premier, pour montrer que ce n'est pas du poison, puis tend le thermos au jeune sans le regarder."}
      - {qui: jeune, dit: "Ici, avant, c'était quoi ?"}
      - {qui: doyen, dit: "Le bâtiment des fours. On travaillait torse nu en janvier. On disait que c'était l'enfer. On ne savait pas."}
      - {narration: "Le jeune s'endort contre l'épaule du vieux. Le vieux ne bouge plus, pour ne pas le réveiller, jusqu'à ce que le feu ne soit plus que des braises."}

  - id: vie.ci.neige
    quand: semaine
    si: "phase == hiver"
    tranches: [matin]
    meteo: neige
    titre: "Sur le pare-brise"
    sous: "Rue des Lilas, la première neige"
    lieu: voiture
    acteurs:
      - {qui: toi, place: [-2, 2]}
      - {id: gamin, qui: enfant, nom: "Un gamin en moufles", place: [1, 1]}
      - {id: soeur, qui: enfant, nom: "Sa sœur", place: [3, 2]}
      - {id: voisine, qui: passante, nom: "La voisine du deuxième", place: [-4, 0]}
    etapes:
      - {narration: "La première neige tombe depuis la nuit. Sur le pare-brise de ta voiture, quelqu'un a écrit avec un doigt, en lettres tremblées : ALLEZ."}
      - {narration: "Deux gamins en moufles sont en train d'ajouter la suite. Ils n'ont pas entendu ta porte."}
      - {qui: soeur, dit: "Fais le R, toi. T'as les bras plus longs."}
      - {qui: gamin, dit: "Le R, c'est le plus dur. Il a une jambe qui part de travers."}
      - {qui: gamin, regarde: toi}
      - {qui: gamin, emote: choc}
      - {qui: soeur, dit: "On n'a rien rayé ! C'est de la neige, ça part tout seul !"}
      - {qui: voisine, dit: "Laissez-les finir. Ils sont là depuis sept heures, ils ont les doigts gelés pour vous."}
      - {narration: "Le gamin finit le R en tirant la langue. La jambe part de travers. ALLEZ LE R, et puis il n'y a plus de place sur le pare-brise."}
      - {qui: gamin, va: [6, 3]}
      - {narration: "Ils repartent en courant vers l'école. La neige continue de tomber, fine, et referme les lettres une par une ; le R tient jusqu'à midi."}

# ═══════════════════════════════════════════════════════════════════════════════════════════════
# CE QU'ON ENTEND DEHORS — les conversations surprises, aux douze lieux sans pièce.
# Dans l'ordre de la ville : la première qui convient se joue quand on passe à portée de voix.
conversations:

  # ─── le terrain annexe
  - id: vie.cv.terrain.thuyas
    lieu: terrain
    tranches: [soir]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux derrière les thuyas"}
      - {id: beaufrere, qui: passant, nom: "Son beau-frère"}
    repliques:
      - {qui: vieux, dit: "D'ici, on voit tout et personne ne nous voit. J'ai vu trois transferts se signer derrière cette haie."}
      - {qui: beaufrere, dit: "Et ce soir, tu vois quoi ?"}
      - {qui: vieux, dit: "Un gamin qui reste après les autres pour tirer des coups francs. Il en met un sur dix. Il reviendra demain."}
      - {qui: beaufrere, dit: "Comment tu le sais ?"}
      - {qui: vieux, dit: "Il a laissé son sac sous le banc. On ne laisse pas son sac quand on ne revient pas."}

  - id: vie.cv.terrain.tondeuse
    lieu: terrain
    tranches: [soir]
    qui:
      - {id: jardinier, qui: garagiste, nom: "Le jardinier du stade"}
      - {id: apprenti, qui: passant, nom: "L'apprenti"}
    repliques:
      - {qui: jardinier, dit: "Tu tonds en long, jamais en travers. En travers, le ballon roule de biais, et c'est toi qu'on accuse."}
      - {qui: apprenti, dit: "Qui ça, on ?"}
      - {qui: jardinier, dit: "Tout le monde. Une pelouse, c'est le seul endroit du club où le coupable est connu d'avance."}
      - {qui: apprenti, dit: "Et les taupes ?"}
      - {qui: jardinier, dit: "On ne les tue pas. On les porte au rond-point dans un seau. Elles reviennent en mars, comme les abonnés."}

  - id: vie.cv.terrain.toros
    lieu: terrain
    roles: [entraineur]
    tranches: [soir]
    qui:
      - {id: abonne, qui: fan, nom: "Un abonné de la Nord"}
      - {id: ancien, qui: ancien, nom: "Un ancien du club"}
    repliques:
      - {qui: abonne, dit: "Une heure et demie de toros. Pas un seul tir au but de toute la séance."}
      - {qui: ancien, dit: "{pg, select, f{Elle} other{Il}} veut qu'ils gardent le ballon. Ici, on n'a jamais su garder quoi que ce soit."}
      - {qui: abonne, dit: "Samedi, on verra s'ils savent le perdre moins vite."}
      - {qui: ancien, dit: "Regarde le petit numéro quatre. Il ne parle à personne, mais il est toujours là où le ballon va arriver."}

  - id: vie.cv.terrain.parents
    lieu: terrain
    si: "annee >= 2009"
    tranches: [aprem]
    qui:
      - {id: pere, qui: passant, nom: "Un père au bord du terrain"}
      - {id: mere, qui: passante, nom: "Une mère au bord du terrain"}
    repliques:
      - {qui: pere, dit: "Le mien sera professionnel. Il a le pied gauche de son grand-père, et je l'ai abonné pour qu'il regarde les vrais."}
      - {qui: mere, dit: "Le mien veut juste être dans la même équipe que son copain Yanis."}
      - {qui: pere, dit: "C'est comme ça qu'on reste amateur."}
      - {qui: mere, dit: "C'est comme ça qu'on reste copains. Il a huit ans."}

  # ─── le square des Lilas
  - id: vie.cv.square.banc
    lieu: square
    tranches: [matin, aprem]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux du banc"}
      - {id: voisine, qui: passante, nom: "Sa voisine de banc"}
    repliques:
      - {qui: vieux, dit: "Quarante ans que je m'assois sur ce banc-là. L'autre est plus confortable, mais on n'y voit pas la rue."}
      - {qui: voisine, dit: "Et qu'est-ce qu'elle a de si intéressant, la rue ?"}
      - {qui: vieux, dit: "Rien. Mais le jour où il s'y passe quelque chose, je suis le premier à le savoir."}
      - {qui: voisine, dit: "Et il s'est passé quelque chose, en quarante ans ?"}
      - {qui: vieux, dit: "Deux fois. Je vous raconterai la deuxième demain."}

  - id: vie.cv.square.poussettes
    lieu: square
    tranches: [aprem]
    qui:
      - {id: mere, qui: passante, nom: "Une jeune mère"}
      - {id: pere, qui: passant, nom: "Un jeune père"}
    repliques:
      - {qui: mere, dit: "Il dort enfin. Si quelqu'un tape dans un ballon, je le crève."}
      - {qui: pere, dit: "Le mien ne s'endort que si on fait le tour du stade en voiture. Trois tours de la Rive, et il tombe."}
      - {qui: mere, dit: "C'est le bruit ?"}
      - {qui: pere, dit: "C'est le silence, je crois. Le stade, en semaine, c'est l'endroit le plus calme de la ville."}

  - id: vie.cv.square.claquettes
    lieu: square
    roles: [joueur]
    tranches: [aprem, soir]
    qui:
      - {id: gamin, qui: enfant, nom: "Un gamin au ballon"}
      - {id: frere, qui: passant, nom: "Son grand frère"}
    repliques:
      - {qui: gamin, dit: "{prenom} habite rue des Lilas. Je l'ai {pg, select, f{vue} other{vu}} descendre les poubelles."}
      - {qui: frere, dit: "Et alors ? Tout le monde a des poubelles."}
      - {qui: gamin, dit: "En claquettes. En plein hiver. Avec le survêtement du club."}
      - {qui: frere, dit: "C'est pour qu'on ne regarde que les pieds. Personne ne reconnaît quelqu'un à ses pieds."}

  - id: vie.cv.square.pigeons
    lieu: square
    si: "annee >= 2012"
    tranches: [matin]
    qui:
      - {id: dame, qui: passante, nom: "Une dame au sac de pain"}
      - {id: agent, qui: garagiste, nom: "L'agent de la mairie"}
    repliques:
      - {qui: agent, dit: "Madame, c'est interdit de nourrir les pigeons. Il y a un panneau. Deux, même."}
      - {qui: dame, dit: "Je ne les nourris pas. Je laisse tomber du pain. Ce n'est pas pareil."}
      - {qui: agent, dit: "Le panneau ne fait pas la différence."}
      - {qui: dame, dit: "Le panneau n'a jamais eu faim."}

  - id: vie.cv.square.six_heures
    lieu: square
    tranches: [nuit]
    qui:
      - {id: lui, qui: passant, nom: "Un garçon de seize ans"}
      - {id: elle, qui: passante, nom: "Une fille de sa classe"}
    repliques:
      - {qui: lui, dit: "Le premier car part à six heures douze. Dans trois ans, je le prends, et je ne reviens pas."}
      - {qui: elle, dit: "Tu dis ça depuis la cinquième."}
      - {qui: lui, dit: "Et toi, tu restes ?"}
      - {qui: elle, dit: "Je partirai quand il y aura une raison. Ici, les gens partent toujours pour rien, et reviennent pour moins que ça."}

  # ─── le cimetière
  - id: vie.cv.cimetiere.semaine
    lieu: cimetiere
    tranches: [matin]
    qui:
      - {id: veuve, qui: passante, nom: "Une veuve à l'arrosoir"}
      - {id: veuf, qui: ancien, nom: "Un veuf en chapeau"}
    repliques:
      - {qui: veuve, dit: "Vous aussi, en semaine ? Je croyais être la seule à venir en semaine."}
      - {qui: veuf, dit: "Le dimanche, il y a trop de monde. Ma femme n'aimait pas la foule. Elle disait que ça sentait le match."}
      - {qui: veuve, dit: "Mon mari, lui, aurait voulu qu'on l'enterre un samedi à quinze heures. Personne ne serait venu."}
      - {qui: veuf, dit: "Il aurait eu la paix. Il aurait été content."}

  - id: vie.cv.cimetiere.granit
    lieu: cimetiere
    tranches: [aprem]
    qui:
      - {id: fossoyeur, qui: garagiste, nom: "Un fossoyeur"}
      - {id: collegue, qui: passant, nom: "Son collègue"}
    repliques:
      - {qui: fossoyeur, dit: "La concession du fond, la famille veut une pierre bordeaux et grise. Aux couleurs."}
      - {qui: collegue, dit: "Le marbrier dit que le bordeaux, ça n'existe pas, en granit."}
      - {qui: fossoyeur, dit: "Alors ils prendront du rouge, et ils attendront que la pluie le fonce."}
      - {qui: collegue, dit: "Comme pour le club. Il faut des années pour avoir la bonne couleur."}

  - id: vie.cv.cimetiere.chrysanthemes
    lieu: cimetiere
    tranches: [matin, aprem]
    qui:
      - {id: fleuriste, qui: commercant, nom: "La fleuriste des Immortelles"}
      - {id: cliente, qui: passante, nom: "Une cliente pressée"}
    repliques:
      - {qui: fleuriste, dit: "Les chrysanthèmes, je les rentre toujours à la mi-octobre. Et le matin de la Toussaint, tout le monde les veut en même temps."}
      - {qui: cliente, dit: "Un pot. Le moins cher. C'est pour ma belle-mère."}
      - {qui: fleuriste, dit: "Le moins cher, ça se voit de loin. Prenez le jaune, il fait plus."}
      - {qui: cliente, dit: "Elle détestait le jaune."}
      - {qui: fleuriste, dit: "Alors je vous fais le jaune. Et je ne vous ai rien dit."}

  - id: vie.cv.cimetiere.echarpe
    lieu: cimetiere
    si: "serie_d >= 1"
    tranches: [aprem]
    qui:
      - {id: gars, qui: fan, nom: "Un gars de la Nord"}
      - {id: vieux, qui: ancien, nom: "Un vieil abonné"}
    repliques:
      - {qui: gars, dit: "Je suis passé devant le caveau du Racing. Quelqu'un y a posé l'écharpe de samedi, pliée en quatre."}
      - {qui: vieux, dit: "Pliée en quatre, c'est qu'il est en colère. Quand on est triste, on la laisse en boule."}
      - {qui: gars, dit: "Et quand on est content ?"}
      - {qui: vieux, dit: "On ne vient pas au cimetière quand on est content. On va à la buvette."}

  # ─── la friche de la Tréfilerie
  - id: vie.cv.friche.cuivre
    lieu: friche
    si: "annee < 2003"
    tranches: [aprem]
    qui:
      - {id: grand, qui: passant, nom: "Un grand de quinze ans"}
      - {id: petit, qui: enfant, nom: "Son petit frère"}
    repliques:
      - {qui: grand, dit: "Le cuivre, il est dans les murs du bâtiment des fours. Un kilo, ça fait un paquet de vignettes et une glace."}
      - {qui: petit, dit: "Maman a dit qu'on n'avait pas le droit d'entrer."}
      - {qui: grand, dit: "On n'entre pas. On sort avec le cuivre. C'est pas pareil."}
      - {qui: petit, dit: "Et le chien du gardien ?"}
      - {qui: grand, dit: "Il est mort l'hiver dernier. Personne ne l'a dit au panneau."}

  - id: vie.cv.friche.ruines
    lieu: friche
    si: "annee >= 2010 && annee < 2030"
    tranches: [aprem]
    qui:
      - {id: photographe, qui: passant, nom: "Un photographe"}
      - {id: gardien, qui: garagiste, nom: "Le gardien de la friche"}
    repliques:
      - {qui: photographe, dit: "Je photographie les ruines. Les gens adorent les ruines en ligne, surtout celles où ils n'ont pas à vivre."}
      - {qui: gardien, dit: "Vous photographiez aussi le panneau ? Propriété privée, défense d'entrer."}
      - {qui: photographe, dit: "Surtout le panneau. Il est très beau, rouillé comme ça."}
      - {qui: gardien, dit: "Il était neuf il y a deux ans. Ici, tout rouille en deux hivers. Les gens aussi."}

  - id: vie.cv.friche.grues
    lieu: friche
    si: "annee >= 2030"
    tranches: [matin]
    qui:
      - {id: costume, qui: inconnu, nom: "Un homme en costume"}
      - {id: architecte, qui: passante, nom: "Une architecte"}
    repliques:
      - {qui: costume, dit: "Ici, des bureaux. Là, un parking. La tour de la sirène, on la garde : les gens aiment qu'on garde quelque chose."}
      - {qui: architecte, dit: "Il y a un feu de palettes, au fond. Et des gens autour."}
      - {qui: costume, dit: "Ils partiront. Ils partent toujours quand les grues arrivent."}
      - {qui: architecte, dit: "Ils étaient là avant les grues. Ils seront encore là après, si vous faites faillite."}

  - id: vie.cv.friche.samedi
    lieu: friche
    tranches: [nuit]
    qui:
      - {id: voix1, qui: inconnu, nom: "Une voix, dans le noir"}
      - {id: voix2, qui: passant, nom: "Une autre voix"}
    repliques:
      - {qui: voix1, dit: "Il a dit samedi, après le match. Quand tout le monde est à la buvette."}
      - {qui: voix2, dit: "Et s'ils gagnent ? Quand ils gagnent, la buvette ferme à deux heures."}
      - {qui: voix1, dit: "Alors on attendra deux heures. On sait attendre."}
      - {qui: voix2, dit: "Toi, peut-être. Moi, ma femme compte les heures."}

  # ─── la fontaine de la place
  - id: vie.cv.fontaine.vingt_heures
    lieu: fontaine
    tranches: [soir]
    qui:
      - {id: amoureux, qui: passant, nom: "Un garçon au bouquet"}
      - {id: copain, qui: fan, nom: "Son copain"}
    repliques:
      - {qui: copain, dit: "Elle t'a dit huit heures. Il est huit heures vingt."}
      - {qui: amoureux, dit: "Elle a dit la fontaine. Elle n'a pas dit de quel côté."}
      - {qui: copain, dit: "Elle a huit côtés, la fontaine. Tu en as fait le tour six fois."}
      - {qui: amoureux, dit: "Alors elle est en retard. C'est mieux que si elle ne venait pas."}
      - {qui: copain, dit: "Donne-moi les fleurs, je te les tiens. Avec, tu as l'air d'aller à un enterrement."}

  - id: vie.cv.fontaine.voeux
    lieu: fontaine
    tranches: [aprem]
    qui:
      - {id: dame, qui: passante, nom: "Une vieille dame"}
      - {id: gamin, qui: enfant, nom: "Un gamin, les manches trempées"}
    repliques:
      - {qui: dame, dit: "Remets ça tout de suite. Ce sont des vœux."}
      - {qui: gamin, dit: "Il y en a des centaines. Personne ne verra s'il en manque trois."}
      - {qui: dame, dit: "Ceux qui les ont jetés, si. Un vœu, ça sait quand on le vole."}
      - {qui: gamin, dit: "Et le vôtre, il est où ?"}
      - {qui: dame, dit: "Au fond, à gauche. Il a marché. Alors laisse-le tranquille."}

  - id: vie.cv.fontaine.serment
    lieu: fontaine
    roles: [entraineur, joueur, president, ds]
    si: "serie_v >= 1"
    tranches: [soir]
    qui:
      - {id: gars, qui: fan, nom: "Un gars de la Nord"}
      - {id: beaufrere, qui: passant, nom: "Son beau-frère"}
    repliques:
      - {qui: gars, dit: "Si on gagne encore samedi, je me baigne dans la fontaine. Je l'ai juré au local."}
      - {qui: beaufrere, dit: "Tu l'as juré l'an dernier aussi. On a perdu."}
      - {qui: gars, dit: "Justement. Il faut bien qu'un serment serve, un jour."}
      - {qui: beaufrere, dit: "En janvier, l'eau est à quatre degrés."}
      - {qui: gars, dit: "Alors on gagnera en mai."}

  - id: vie.cv.fontaine.ampoules
    lieu: fontaine
    roles: [president]
    tranches: [midi]
    qui:
      - {id: secretaire, qui: passante, nom: "Une secrétaire de mairie"}
      - {id: employe, qui: garagiste, nom: "Un employé municipal"}
    repliques:
      - {qui: secretaire, dit: "{pg, select, f{La présidente} other{Le président}} du Racing a encore demandé un rendez-vous à la mairie. Le troisième ce mois-ci."}
      - {qui: employe, dit: "Pour l'éclairage du stade ?"}
      - {qui: secretaire, dit: "Pour la subvention. L'éclairage, c'est l'excuse. Au Racing, on prend toujours l'éclairage pour excuse."}
      - {qui: employe, dit: "Moi, je changerais les ampoules gratuitement. Mais personne ne me demande rien."}

  # ─── la place du marché (le matin et à midi, la marchande est déjà à sa place : elle parle en premier)
  - id: vie.cv.marche.tomates
    lieu: marche
    tranches: [matin]
    jours: [mer, sam, dim]
    qui:
      - {id: marchande, qui: commercant, nom: "La marchande de légumes"}
      - {id: cliente, qui: passante, nom: "Une cliente au cabas"}
    repliques:
      - {qui: marchande, dit: "Le dimanche, je fais les tomates à moitié prix si on a gagné la veille. Plein tarif si on a perdu."}
      - {qui: cliente, dit: "Et si c'est nul ?"}
      - {qui: marchande, dit: "Si c'est nul, je ne vends rien. Les gens restent chez eux à ruminer."}
      - {qui: cliente, dit: "Alors donnez-moi des pommes de terre. Ça ne dépend de rien, les pommes de terre."}

  - id: vie.cv.marche.poireaux
    lieu: marche
    roles: [entraineur]
    tranches: [matin]
    jours: [mer, sam, dim]
    qui:
      - {id: marchande, qui: commercant, nom: "La marchande de légumes"}
      - {id: habitue, qui: ancien, nom: "Un habitué du marché"}
    repliques:
      - {qui: habitue, dit: "{pg, select, f{L'entraîneuse} other{L'entraîneur}} du Racing achète ses poireaux chez vous, vous saviez ? Toujours les plus fins."}
      - {qui: marchande, dit: "Les plus fins, ce sont les plus chers. Les gens du football aiment ce qui est fin et cher."}
      - {qui: habitue, dit: "Mon père disait qu'on reconnaît un bon entraîneur à son cabas. Rien de trop, rien qui dépasse."}
      - {qui: marchande, dit: "Dans ce cabas-là, il y a toujours un journal qui dépasse. Plié à la page des sports."}

  - id: vie.cv.marche.hypermarche
    lieu: marche
    si: "annee < 2000"
    tranches: [matin, midi]
    jours: [mer, sam, dim]
    qui:
      - {id: marchande, qui: commercant, nom: "La marchande de légumes"}
      - {id: boucher, qui: commercant2, nom: "Le boucher du marché"}
    repliques:
      - {qui: boucher, dit: "Ils ouvrent l'hypermarché à la sortie de la ville en mars. Quarante caisses, un parking pour mille voitures."}
      - {qui: marchande, dit: "Quarante caisses. Moi, j'ai une boîte à chaussures, et je rends la monnaie depuis trente ans."}
      - {qui: boucher, dit: "Ils vendront le steak moins cher que moi. Au début."}
      - {qui: marchande, dit: "Au début. Après, ils n'auront plus besoin d'être moins chers : il n'y aura plus personne d'autre."}

  - id: vie.cv.marche.montre
    lieu: marche
    si: "annee >= 2035"
    tranches: [matin]
    jours: [mer, sam, dim]
    qui:
      - {id: marchande, qui: commercant, nom: "La marchande"}
      - {id: gamin, qui: enfant, nom: "Un gamin"}
    repliques:
      - {qui: gamin, dit: "Pourquoi vous n'avez pas de robot pour peser, comme au magasin ?"}
      - {qui: marchande, dit: "Parce que le robot ne met pas une pomme en plus quand il voit que ta mère compte."}
      - {qui: gamin, dit: "Ma mère ne compte pas. Elle paie avec sa montre."}
      - {qui: marchande, dit: "Alors elle compte avec sa montre. Ça se voit pareil."}

  # ─── le monument aux morts, devant Saint-Aubin
  - id: vie.cv.monument.trois_noms
    lieu: monument
    tranches: [aprem]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieil homme"}
      - {id: petite, qui: enfant, nom: "Sa petite-fille"}
    repliques:
      - {qui: petite, dit: "Il y a trois fois le même nom, là. Ils étaient frères ?"}
      - {qui: vieux, dit: "Le père et deux fils. Le troisième fils est revenu. Il a fondé le Racing en rentrant, avec ce qui restait de la rue."}
      - {qui: petite, dit: "Pourquoi un club de foot ?"}
      - {qui: vieux, dit: "Pour que les garçons courent encore ensemble quelque part, je suppose. Sans que personne leur tire dessus."}

  - id: vie.cv.monument.cloche
    lieu: monument
    tranches: [matin, aprem]
    qui:
      - {id: paroissienne, qui: passante, nom: "Une paroissienne"}
      - {id: sacristain, qui: portier, nom: "Le sacristain"}
    repliques:
      - {qui: paroissienne, dit: "Vous avez sonné à quinze heures, samedi. Il n'y avait ni mariage ni enterrement."}
      - {qui: sacristain, dit: "Il y avait le coup d'envoi. Le curé ne le sait pas. Ça fait vingt ans."}
      - {qui: paroissienne, dit: "Et quand ils perdent ?"}
      - {qui: sacristain, dit: "Je sonne quand même. Une cloche, ça ne connaît pas le score."}

  - id: vie.cv.monument.drapeau
    lieu: monument
    si: "annee < 2005"
    tranches: [aprem]
    qui:
      - {id: porte_drapeau, qui: ancien, nom: "Le porte-drapeau"}
      - {id: fils, qui: passant, nom: "Son fils"}
    repliques:
      - {qui: porte_drapeau, dit: "Le 11 novembre, c'est toi qui porteras le drapeau. Mes bras tremblent, maintenant."}
      - {qui: fils, dit: "Je ne sais pas le porter. Il faut le tenir droit pendant toute la minute."}
      - {qui: porte_drapeau, dit: "Pendant la minute, personne ne te regarde, toi. Ils regardent le drapeau."}
      - {qui: fils, dit: "Et toi, tu regardais qui ?"}
      - {qui: porte_drapeau, dit: "Les noms. Toujours les trois mêmes. Je ne te dirai pas lesquels."}

  - id: vie.cv.monument.gerbe
    lieu: monument
    roles: [president]
    tranches: [aprem]
    qui:
      - {id: abonne, qui: fan, nom: "Un abonné"}
      - {id: femme, qui: passante, nom: "Sa femme"}
    repliques:
      - {qui: abonne, dit: "{pg, select, f{La présidente} other{Le président}} a fait changer la gerbe du monument. Une neuve, avec un ruban et le nom du club en doré."}
      - {qui: femme, dit: "C'est gentil."}
      - {qui: abonne, dit: "C'est une réclame sur les morts. On ne met pas son nom en doré devant des noms gravés."}
      - {qui: femme, dit: "Tu dirais la même chose si on était premiers ?"}
      - {qui: abonne, dit: "Si on était premiers, je ne verrais même pas la gerbe."}

  # ─── le kiosque du quai (le kiosquier est déjà à sa place : il parle en premier)
  - id: vie.cv.kiosque.de_dos
    lieu: kiosque
    tranches: [matin]
    qui:
      - {id: kiosquier, qui: commercant2, nom: "Le kiosquier"}
      - {id: habitue, qui: ancien, nom: "Un habitué"}
    repliques:
      - {qui: habitue, dit: "L'Écho, comme d'habitude. Pliez-le : je ne veux pas voir la une avant d'être assis."}
      - {qui: kiosquier, dit: "Elle n'est pas si terrible. Ils ont mis la photo de dos."}
      - {qui: habitue, dit: "De dos, c'est pire. De dos, c'est qu'on s'en va."}
      - {qui: kiosquier, dit: "Ou qu'on court vers le but. Ça dépend de comment vous lisez."}

  - id: vie.cv.kiosque.soeurs
    lieu: kiosque
    si: "annee < 2015"
    tranches: [matin, midi]
    qui:
      - {id: kiosquier, qui: commercant2, nom: "Le kiosquier"}
      - {id: cliente, qui: passante, nom: "Une cliente en imperméable"}
    repliques:
      - {qui: cliente, dit: "La Gazette Rose. Et L'Écho, autour, pour la cacher."}
      - {qui: kiosquier, dit: "Vous êtes la neuvième ce matin. Je devrais les vendre ensemble, déjà pliés."}
      - {qui: cliente, dit: "Ce n'est pas pour moi. C'est pour ma sœur."}
      - {qui: kiosquier, dit: "Elles ont toutes une sœur. Je n'ai jamais vu une ville avec autant de sœurs."}

  - id: vie.cv.kiosque.cote
    lieu: kiosque
    tranches: [midi]
    qui:
      - {id: kiosquier, qui: commercant2, nom: "Le kiosquier"}
      - {id: parieur, qui: fan, nom: "Un parieur du samedi"}
    repliques:
      - {qui: parieur, dit: "Le Quotidien donne le Racing à quatre contre un pour samedi. Quatre contre un !"}
      - {qui: kiosquier, dit: "C'est que le Quotidien a vu les matchs. Toi, tu as vu le Racing."}
      - {qui: parieur, dit: "Je mets un billet dessus. Pour l'honneur."}
      - {qui: kiosquier, dit: "L'honneur, à quatre contre un, ça rapporte quatre fois rien. Mais vas-y."}

  - id: vie.cv.kiosque.papier
    lieu: kiosque
    si: "annee >= 2030"
    tranches: [matin]
    qui:
      - {id: kiosquier, qui: commercant2, nom: "Le kiosquier"}
      - {id: gamin, qui: enfant, nom: "Un gamin curieux"}
    repliques:
      - {qui: gamin, dit: "Pourquoi les gens achètent du papier ? Tout est dans le téléphone."}
      - {qui: kiosquier, dit: "Dans le téléphone, tout s'en va quand tu glisses. Le papier, tu le plies, tu le gardes, tu l'encadres. Tu emballes le poisson."}
      - {qui: gamin, dit: "Vous en vendez combien ?"}
      - {qui: kiosquier, dit: "Onze. Le dimanche, quarante. Et le jour où le Racing gagne quelque chose, je n'en ai jamais assez."}

  # ─── le vieux lavoir de la rue Haute
  - id: vie.cv.lavoir.machine
    lieu: lavoir
    si: "annee < 1998"
    tranches: [matin]
    qui:
      - {id: laveuse, qui: passante, nom: "Une laveuse"}
      - {id: autre, qui: commercant, nom: "Une autre laveuse"}
    repliques:
      - {qui: laveuse, dit: "Ma belle-fille a une machine. Elle lave à quarante degrés, et elle dit que c'est propre."}
      - {qui: autre, dit: "Propre, peut-être. Mais elle ne sait rien de ce qui se passe rue Haute."}
      - {qui: laveuse, dit: "Elle sait ce qu'on lui dit à la télé. C'est pire."}
      - {qui: autre, dit: "Ici, au moins, on sait qui ment."}

  - id: vie.cv.lavoir.piscine
    lieu: lavoir
    tranches: [aprem]
    qui:
      - {id: conseiller, qui: passant, nom: "Une voix venue de la place"}
      - {id: autre, qui: inconnu, nom: "Une autre voix"}
    repliques:
      - {qui: conseiller, dit: "Le terrain synthétique, c'est huit cent mille. La piscine, c'est un million."}
      - {qui: autre, dit: "Le Racing, ça rapporte des voix. Une piscine, ça rapporte des plaintes pour le chlore."}
      - {qui: conseiller, dit: "Parle moins fort. Sous le lavoir, tout s'entend jusqu'à la rue Haute."}
      - {qui: autre, dit: "Justement. Qu'ils entendent qu'on pense au Racing."}

  - id: vie.cv.lavoir.fiancailles
    lieu: lavoir
    tranches: [soir, nuit]
    qui:
      - {id: elle, qui: passante, nom: "Une fille"}
      - {id: lui, qui: passant, nom: "Un garçon"}
    repliques:
      - {qui: elle, dit: "Pas ici. Sous ce toit, tout s'entend. Ma tante a appris ses propres fiançailles au lavoir."}
      - {qui: lui, dit: "Alors parle bas."}
      - {qui: elle, dit: "Si je parle bas, ils sauront que j'ai quelque chose à cacher."}
      - {qui: lui, dit: "Et tu as quelque chose à cacher ?"}
      - {qui: elle, dit: "Maintenant, oui."}

  - id: vie.cv.lavoir.robinet
    lieu: lavoir
    si: "annee >= 2036"
    tranches: [matin]
    qui:
      - {id: voisine, qui: passante, nom: "Une voisine de la rue Haute"}
      - {id: vieux, qui: ancien, nom: "Un vieux voisin"}
    repliques:
      - {qui: voisine, dit: "La source ne coule plus depuis des mois. Les enfants n'ont jamais entendu le bruit qu'elle faisait."}
      - {qui: vieux, dit: "Comme un robinet qu'on aurait oublié de fermer. Toute la nuit. On s'endormait avec."}
      - {qui: voisine, dit: "Et maintenant ?"}
      - {qui: vieux, dit: "Maintenant on entend les voitures qui roulent toutes seules. Elles ne font aucun bruit. C'est pire."}

  # ─── ta voiture, rue des Lilas
  - id: vie.cv.voiture.travers
    lieu: voiture
    tranches: [matin]
    qui:
      - {id: agent, qui: garagiste, nom: "L'agent de stationnement"}
      - {id: voisine, qui: passante, nom: "Une voisine du deuxième"}
    repliques:
      - {qui: agent, dit: "Encore garée de travers, celle-là. Une roue sur le trottoir, une roue sur la ligne."}
      - {qui: voisine, dit: "Laissez-la. C'est la voiture du stade."}
      - {qui: agent, dit: "Le stade a un parking."}
      - {qui: voisine, dit: "Le stade a un parking, mais pas d'heures. Ces gens-là rentrent à deux heures du matin, ils ne voient plus les lignes."}

  - id: vie.cv.voiture.siege
    lieu: voiture
    tranches: [aprem]
    qui:
      - {id: gamin, qui: enfant, nom: "Un gamin, le nez à la vitre"}
      - {id: frere, qui: passant, nom: "Son grand frère"}
    repliques:
      - {qui: gamin, dit: "Regarde, sur le siège passager : un ballon dégonflé et trois journaux."}
      - {qui: frere, dit: "Normal. Dans la voiture, ils lisent ce qu'on dit d'eux. À la maison, ils font semblant de ne pas savoir."}
      - {qui: gamin, dit: "Et le ballon ?"}
      - {qui: frere, dit: "Le ballon, c'est pour les jours où ils ne savent plus pourquoi ils font ce métier."}

  - id: vie.cv.voiture.portiere
    lieu: voiture
    roles: [entraineur, joueur, president, ds]
    tranches: [nuit]
    qui:
      - {id: femme, qui: passante, nom: "Une voisine, à sa fenêtre"}
      - {id: mari, qui: passant, nom: "Son mari"}
    repliques:
      - {qui: femme, dit: "Tu as entendu ? Une portière, à trois heures du matin."}
      - {qui: mari, dit: "C'est le troisième étage. Le football, ça finit tard."}
      - {qui: femme, dit: "Le football finit à dix-sept heures. Après, c'est autre chose."}
      - {qui: mari, dit: "Rendors-toi. On n'est pas sa mère."}

  - id: vie.cv.voiture.robot
    lieu: voiture
    si: "annee >= 2034"
    tranches: [aprem]
    qui:
      - {id: livreur, qui: garagiste, nom: "Un livreur"}
      - {id: passante, qui: passante, nom: "Une passante"}
    repliques:
      - {qui: livreur, dit: "Le robot de livraison refuse de passer. Il calcule que la voiture déborde de quatorze centimètres."}
      - {qui: passante, dit: "Alors portez le colis vous-même. Comme avant."}
      - {qui: livreur, dit: "Je ne suis pas payé pour porter. Je suis payé pour surveiller le robot."}
      - {qui: passante, dit: "Et qui surveille celui qui surveille le robot ?"}
      - {qui: livreur, dit: "La voiture, je crois. Elle a une caméra."}

  # ─── le feu de palettes, au fond de la friche
  - id: vie.cv.feu.abonnement
    lieu: feu
    tranches: [soir, nuit]
    qui:
      - {id: vieux, qui: ancien, nom: "Un vieux en bonnet"}
      - {id: homme, qui: passant, nom: "Un homme sans âge"}
    repliques:
      - {qui: vieux, dit: "J'avais un abonnement en tribune Est. Quinze ans. Je l'ai revendu mon premier hiver dehors."}
      - {qui: homme, dit: "Combien ?"}
      - {qui: vieux, dit: "Pas assez pour un hiver. Assez pour une semaine au chaud. Ça reste un bon échange."}
      - {qui: homme, dit: "Tu y retournes, au stade ?"}
      - {qui: vieux, dit: "J'écoute depuis le pont. Quand ils marquent, la Rive frissonne. Je te jure."}

  - id: vie.cv.feu.saucisses
    lieu: feu
    tranches: [soir]
    qui:
      - {id: grilleur, qui: passant, nom: "L'homme au grill"}
      - {id: nouveau, qui: inconnu, nom: "Un nouveau venu"}
    repliques:
      - {qui: grilleur, dit: "Assieds-toi. Les saucisses sont à tout le monde, mais celui qui les apporte choisit la première."}
      - {qui: nouveau, dit: "Je n'ai rien apporté."}
      - {qui: grilleur, dit: "Alors tu prends la deuxième. Ici, personne n'arrive les mains vides deux fois."}
      - {qui: nouveau, dit: "Et si je ne reviens pas ?"}
      - {qui: grilleur, dit: "Tout le monde revient. Le feu, c'est la seule adresse qui ne change pas."}

  - id: vie.cv.feu.gymnase
    lieu: feu
    si: "phase == hiver"
    tranches: [nuit]
    qui:
      - {id: femme, qui: passante, nom: "Une femme en anorak"}
      - {id: doyen, qui: ancien, nom: "Le doyen du feu"}
    repliques:
      - {qui: femme, dit: "Ils annoncent moins dix cette nuit. La mairie ouvre le gymnase."}
      - {qui: doyen, dit: "Le gymnase ferme à sept heures du matin, et on n'y fume pas. Le feu, lui, ne ferme jamais."}
      - {qui: femme, dit: "Le feu n'a pas de toit."}
      - {qui: doyen, dit: "Le gymnase non plus, pour moi. J'y ai dormi une fois. On y compte les gens comme des ballons, à l'entrée et à la sortie."}

  - id: vie.cv.feu.pain
    lieu: feu
    roles: [joueur]
    tranches: [nuit]
    qui:
      - {id: jeune, qui: passant, nom: "Un jeune au bonnet"}
      - {id: vieux, qui: ancien, nom: "Un vieux"}
    repliques:
      - {qui: jeune, dit: "Paraît que {prenom}, du Racing, laisse du pain près du feu, certains soirs. Le sac par terre, et plus personne."}
      - {qui: vieux, dit: "Ils viennent tous une fois. Pour voir à quoi ça ressemble, une carrière qui rate."}
      - {qui: jeune, dit: "Et ils reviennent ?"}
      - {qui: vieux, dit: "Pas le même soir. Mais le pain est bon, il faut le dire."}

  # ─── le mur des plaques
  - id: vie.cv.columbarium.veterans
    lieu: columbarium
    tranches: [aprem]
    qui:
      - {id: mere, qui: passante, nom: "Une femme en noir"}
      - {id: fille, qui: enfant, nom: "Sa fille"}
    repliques:
      - {qui: fille, dit: "Pourquoi il y a un maillot plié dans la niche de papi ?"}
      - {qui: mere, dit: "Il voulait partir avec, et puis il a changé d'avis. Il disait que le maillot n'avait rien fait de mal."}
      - {qui: fille, dit: "Il l'a porté, ce maillot ?"}
      - {qui: mere, dit: "Une fois. Un match de vétérans. Il a touché deux ballons, et il en parlait encore la veille de mourir."}

  - id: vie.cv.columbarium.timbre
    lieu: columbarium
    tranches: [matin]
    qui:
      - {id: graveur, qui: garagiste, nom: "Le graveur de plaques"}
      - {id: gardien, qui: passant, nom: "Le gardien du cimetière"}
    repliques:
      - {qui: graveur, dit: "On me demande encore le blason du club sur une plaque. La troisième cette année."}
      - {qui: gardien, dit: "Le règlement dit : nom, prénom, dates. Pas de timbre."}
      - {qui: graveur, dit: "Je fais un petit blason, dans le coin. De la taille d'un timbre."}
      - {qui: gardien, dit: "De la taille d'un timbre, le règlement ne voit rien. Il a de mauvais yeux, le règlement."}

  - id: vie.cv.columbarium.vase
    lieu: columbarium
    tranches: [matin]
    qui:
      - {id: dame, qui: passante, nom: "Une vieille dame"}
      - {id: voisine, qui: commercant, nom: "Sa voisine de niche"}
    repliques:
      - {qui: dame, dit: "Votre vase déborde sur le mien. Vos glaïeuls ont les pieds dans mon eau."}
      - {qui: voisine, dit: "Mon mari et le vôtre sont allés au stade ensemble pendant trente ans. Ils peuvent partager un vase."}
      - {qui: dame, dit: "Ils se sont fâchés en quatre-vingt-sept, pour un penalty."}
      - {qui: voisine, dit: "Alors ça leur fera du bien de se réconcilier. Ils ont le temps, maintenant."}

  - id: vie.cv.columbarium.cravate
    lieu: columbarium
    si: "annee >= 2035"
    tranches: [aprem]
    qui:
      - {id: veuve, qui: passante, nom: "Une veuve"}
      - {id: veuf, qui: ancien, nom: "Un vieil homme"}
    repliques:
      - {qui: veuve, dit: "Il a choisi de sourire en boucle. Douze secondes. Je viens le jeudi, et il sourit."}
      - {qui: veuf, dit: "Ma femme a choisi le silence. Son nom, la date, rien d'autre."}
      - {qui: veuve, dit: "Ce n'est pas triste, le silence ?"}
      - {qui: veuf, dit: "Non. Comme ça, je ne sais pas ce qu'elle pense de ma cravate."}
