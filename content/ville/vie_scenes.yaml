      - {qui: agent, emote: "..."}
      - {qui: agent, regarde: mere}
      - {qui: agent, dit: "La vanne est au fond de la rue. J'y vais à pied. Le soir, je marche lentement."}
      - {qui: agent, va: [2, -10]}
      - {narration: "Il met vingt minutes à faire cent mètres. Quand l'eau s'arrête enfin, après minuit, les enfants dorment sur les genoux de leurs mères, les pieds encore mouillés."}

  - id: vie.ci.vieux_metiers
