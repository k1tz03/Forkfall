      - {id: gamin, qui: enfant, nom: "Le gamin au téléphone", place: [2, 7]}
      - {id: autre, qui: enfant, nom: "L'avant-centre", place: [4, 8]}
      - {id: vieux, qui: ancien, nom: "Un vieux à la main courante", place: [6, 3]}
    etapes:
      - {narration: "Un téléphone posé sur un plot, l'écran tourné vers le jeu. Une voix de synthèse annonce : « Hors-jeu. Écart : onze centimètres. »"}
      - {qui: autre, dit: "Onze centimètres ! Mon épaule, c'est onze centimètres ?", geste: bras_leves}
      - {qui: gamin, dit: "La machine l'a dit. La machine triche pas. C'est toi qui triches."}
      - {qui: vieux, va: [5, 5]}
      - {qui: vieux, dit: "De mon temps, l'arbitre, c'était le plus vieux. Et quand le plus vieux jouait, il n'y avait pas de hors-jeu."}
      - {qui: autre, regarde: vieux}
      - {qui: autre, dit: "Et ça marchait ?", emote: "?"}
      - {qui: vieux, dit: "Jamais. On se disputait jusqu'au goûter. C'était le meilleur moment.", ton: sourire}
      - {narration: "Le gamin éteint le téléphone et le glisse dans sa chaussette. Il remet le ballon au milieu, du bout du pied."}
      - {qui: gamin, dit: "Pas hors-jeu. C'est moi le plus vieux. J'ai dix ans et deux mois."}
      - {qui: autre, geste: ballon}
      - {narration: "Le match reprend. Sur le plot, il n'y a plus rien, et ils se disputent jusqu'à la nuit."}

  - id: vie.ci.reseau
    quand: semaine
    si: "annee >= 2028 && annee < 2045"
    tranches: [aprem]
    titre: "Réseau indisponible"
    sous: "Square des Lilas, quinze heures douze"
    lieu: square
    acteurs:
      - {qui: toi, place: [0, -3]}
      - {id: lyceen, qui: passant, nom: "Un lycéen", place: [-3, -5]}
      - {id: lyceenne, qui: passante, nom: "Une lycéenne", place: [-1, -6]}
      - {id: vieux, qui: ancien, nom: "Un vieux sur le banc", place: [-5, -3], pose: assis}
    etapes:
      - {narration: "Tous les écrans de la ville se figent sur le même message : RÉSEAU INDISPONIBLE. Dans le square des Lilas, les têtes se relèvent en même temps."}
      - {qui: lyceen, dit: "Ça fait combien de temps, là ?"}
      - {qui: lyceenne, dit: "Je sais pas. L'heure, elle est dans le téléphone."}
      - {qui: vieux, geste: rit}
      - {qui: vieux, dit: "Quatre minutes. J'ai une montre. Elle marche avec un ressort et de la patience."}
      - {qui: lyceen, va: [-3, -4]}
      - {qui: lyceen, dit: "Et on fait quoi, du coup ?"}
      - {qui: vieux, dit: "Ce qu'on faisait avant. On s'ennuie un peu, et puis quelqu'un a une idée."}
      - {pause: 1200}
      - {qui: lyceenne, geste: ballon}
      - {qui: lyceenne, dit: "Il était dans le bac à sable. Il est mou. Ça ira."}
      - {narration: "Quand le réseau revient, à seize heures quarante, personne dans le square ne s'en aperçoit tout de suite."}

  - id: vie.ci.nuit_chaude
    quand: semaine
    si: "annee >= 2027 && phase == presaison"
    tranches: [soir]
    titre: "Trente-six degrés"
    sous: "La fontaine, vingt-deux heures"
    lieu: fontaine
    acteurs:
