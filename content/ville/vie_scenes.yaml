      - {qui: cure, dit: "La famille a souhaité une cérémonie simple. Je vous demande le silence jusqu'au caveau."}
      - {qui: gars, va: [3, 0]}
      - {qui: gars, dit: "Une minute, mon père. On a quelque chose à lui faire entendre. Trente secondes, pas plus."}
      - {qui: veuve, regarde: gars}
      - {qui: veuve, emote: "..."}
      - {qui: veuve, dit: "Mettez-le. Il détestait le silence. Il disait que le silence, au stade, c'est quand le ballon est sorti."}
      - {narration: "Le poste à cassettes du club-house crachote, puis la voix monte au-dessus des tombes, intacte : « Et but… pour le Racing ! » Trois cents personnes se retiennent de crier."}
      - {pause: 1400}
      - {qui: gars, geste: tete_basse}
      - {qui: cure, dit: "Bien. Maintenant, le silence.", ton: sourire}
      - {qui: veuve, sort: true}
      - {narration: "Le cortège passe la grille. Au fond de l'allée, les deux fossoyeurs attendent, la casquette à la main ; l'un d'eux a les yeux rouges, et il dit que c'est le vent."}

