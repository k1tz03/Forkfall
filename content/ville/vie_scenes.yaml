      - {id: guide, qui: passant, nom: "Le guide de la mairie", place: [2, 1]}
      - {id: eleve, qui: enfant, nom: "Une écolière", place: [0, 0]}
    etapes:
      - {narration: "La fête des vieux métiers, au lavoir. Une classe, un guide de la mairie avec un micro qui grésille, et sur la pierre du bassin une vieille dame en tablier, les manches roulées."}
      - {qui: guide, dit: "Madame a lavé ici le linge de la moitié de la rue Haute, jusqu'en 1971. Elle va vous montrer le geste."}
      - {qui: lavandiere, dit: "Rangez vos téléphones. L'eau, ça ne se filme pas. Ça se touche."}
      - {qui: eleve, geste: genou}
