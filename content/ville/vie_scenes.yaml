      - {qui: pere, dit: "Le six, c'est mon fils. Il pose du carrelage à Valdorne du lundi au vendredi. Le samedi, il défend pour le pays.", geste: pointe}
      - {qui: voisine, dit: "Il est plus grand à l'écran qu'au marché."}
      - {pause: 700}
      - {narration: "Quarante et unième minute. Le six glisse sur la pelouse détrempée, et le ballon passe. Toute la place se tait d'un coup ; on n'entend plus que le groupe électrogène."}
      - {qui: pere, geste: tete_basse}
      - {qui: gamin, dit: "C'est pas grave, monsieur. Mon père dit qu'il glisse aussi, au travail."}
      - {qui: pere, emote: "..."}
      - {narration: "Cinquante-huitième. Corner pour les Cobalts. Le six monte, saute plus haut que tout le monde, et la place du marché explose comme un stade."}
      - {son: match_but}
      - {qui: pere, dit: "Il a appris à sauter sur les échafaudages ! Je lui avais dit que ça servirait !", geste: bras_leves}
      - {narration: "Le père ne regarde plus l'écran. Il regarde les gens qui le regardent, et il ne sait plus quoi faire de ses mains."}

