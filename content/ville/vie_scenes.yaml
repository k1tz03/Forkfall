      - {qui: educatrice, dit: "C'est la vôtre, non ? La huit ?"}
      - {qui: pere, dit: "Elle ne m'avait pas dit qu'elle était gauchère."}
      - {narration: "À la fin de la séance, il est passé de l'autre côté de la haie. Il ramasse les plots avec les autres parents, sans qu'on le lui ait demandé."}

  - id: vie.ci.programmes
