      - {qui: chauffeur, dit: "Que moi. Dites-le. Trente-deux ans, et il le connaît mieux que moi depuis lundi.", ton: noir}
      - {qui: voyageuse, entre: banc_1}
      - {qui: voyageuse, dit: "Il s'arrête devant la boulangerie du hameau, lui ? Vous, vous vous arrêtiez. Même quand ce n'était pas un arrêt."}
      - {qui: technicien, emote: sueur}
      - {qui: technicien, dit: "Les arrêts sont programmés, madame. Vous pouvez faire une demande."}
      - {narration: "Le chauffeur enlève sa casquette, la regarde un moment, et la pose sur le banc, la visière tournée vers le quai."}
      - {qui: chauffeur, dit: "Je monte quand même. Une dernière fois. Derrière, comme un client."}
      - {qui: voyageuse, dit: "Alors je m'assois à côté de vous. Vous me direz quand c'est la boulangerie.", ton: sourire}
      - {qui: chauffeur, sort: true}
      - {qui: voyageuse, sort: true}
      - {narration: "Le car démarre sans un bruit. Sur le banc, la casquette reste jusqu'au soir : personne n'ose la prendre, personne n'ose la jeter."}

