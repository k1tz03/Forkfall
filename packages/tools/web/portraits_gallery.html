<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusible — galerie des portraits</title>
<!-- Page de contrôle des bustes « paper doll » : 19 fiches × 3 expressions × 3 tailles
     (56, 120, 220 px) sur le dégradé de leur camp. Elle charge portraits.js et lit la
     table dans le bloc JSON #portraits-table (copie de content/build/content.json → portraits,
     recopiée au moment de l'assemblage ; vide → traits déduits de l'id). -->
<style>
  :root {
    --pelouse: #1F5A32; --creme: #EFE4C6; --encre: #1E1A14; --encre-2: #4A423A; --blanc-vignette: #FCFAF3;
    --camp-terrain: #2F7A44; --camp-direction: #6E1F2F; --camp-instances: #4C5E72; --camp-selection: #1F5FB4;
  }
  body { margin: 0; background: var(--creme); color: var(--encre); font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 24px 8px; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .02em; }
  header p { margin: 0; color: var(--encre-2); font-size: 12.5px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 16px; padding: 12px 24px 32px; }
  .fiche { background: var(--blanc-vignette); border: 1.5px solid var(--encre); border-radius: 3px; padding: 12px 14px; box-shadow: 2px 3px 0 rgba(30,26,20,.18); }
  .fiche h2 { margin: 0; font-size: 16px; }
  .fiche h2 small { font-weight: 600; font-size: 10.5px; letter-spacing: .2em; color: var(--encre-2); margin-left: 8px; }
  .fiche .traits { margin: 2px 0 10px; font-size: 11px; color: var(--encre-2); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .photo { position: relative; overflow: hidden; border-radius: 2px; border: 2px solid var(--blanc-vignette); outline: 1px solid var(--encre);
           background: linear-gradient(180deg, var(--camp) 0%, color-mix(in srgb, var(--camp) 78%, #000) 100%); }
  .photo svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 92%; display: block; }
  .photo[data-camp="terrain"] { --camp: var(--camp-terrain); }
  .photo[data-camp="direction"] { --camp: var(--camp-direction); }
  .photo[data-camp="instances"] { --camp: var(--camp-instances); }
  .photo[data-camp="selection"] { --camp: var(--camp-selection); }
  .lbl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--encre-2); width: 64px; padding-bottom: 4px; }
</style>
</head>
<body>
<header>
  <h1>Fusible — galerie des portraits</h1>
  <p>Chaque buste en trois expressions (sourire · neutre · noir) et trois tailles (220, 120, 56 px) sur le fond de son camp. Générés par <code>portraits.js</code> depuis <code>content/portraits.yaml</code>.</p>
</header>
<main id="gallery"></main>

<script type="application/json" id="portraits-table">{}</script>
<script type="application/json" id="characters-table">[]</script>
<script src="portraits.js"></script>
<script>
(function () {
  "use strict";
  var table = {};
  var characters = [];
  try { table = JSON.parse(document.getElementById('portraits-table').textContent) || {}; } catch (e) { table = {}; }
  try { characters = JSON.parse(document.getElementById('characters-table').textContent) || []; } catch (e) { characters = []; }
  FusiblePortraits.init(table);

  var byId = {};
  characters.forEach(function (c) { byId[c.id] = c; });
  var ids = Object.keys(table);
  ['coach', 'joueur'].forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
  if (ids.length <= 2) characters.forEach(function (c) { if (ids.indexOf(c.id) < 0) ids.push(c.id); });
  var order = ['coach', 'joueur'].concat(characters.map(function (c) { return c.id; }));
  ids.sort(function (a, b) { var ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b); });

  var SIZES = [220, 120, 56];
  var EXPS = ['sourire', 'neutre', 'noir'];
  var main = document.getElementById('gallery');

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  ids.forEach(function (id) {
    var c = byId[id];
    var camp = c ? c.camp : (id === 'joueur' ? 'terrain' : 'terrain');
    var genre = c ? c.genre : 'm';
    var name = c ? c.name : (id === 'coach' ? 'Toi, l\'entraîneur' : 'Toi, le joueur');
    var label = c ? c.label : (id === 'coach' ? 'SURVÊTEMENT' : 'MAILLOT');
    var t = FusiblePortraits.traits(id, { genre: genre });
    var f = el('section', 'fiche');
    var h = el('h2', null, name); h.appendChild(el('small', null, label + ' · ' + camp)); f.appendChild(h);
    f.appendChild(el('div', 'traits', ['teint', 'corpulence', 'age', 'coiffure', 'cheveux', 'pilosite', 'lunettes', 'tenue', 'couleur', 'couleur2', 'accessoire'].map(function (k) { return k + '=' + t[k]; }).join('  ')));
    var rows = el('div', 'rows');
    SIZES.forEach(function (size) {
      var row = el('div', 'row');
      row.appendChild(el('div', 'lbl', size + ' px'));
      EXPS.forEach(function (exp) {
        var ph = el('div', 'photo'); ph.dataset.camp = camp; ph.style.width = size + 'px'; ph.style.height = Math.round(size * 4 / 3) + 'px';
        ph.innerHTML = FusiblePortraits.svg(id, exp, { camp: camp, genre: genre, className: 'portrait' });
        row.appendChild(ph);
      });
      rows.appendChild(row);
    });
    f.appendChild(rows);
    main.appendChild(f);
  });
})();
</script>
</body>
</html>
